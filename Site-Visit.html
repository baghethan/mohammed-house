<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Visit System</title>

  <!-- App Version -->
  <meta name="app-version" content="v1.6.6">

  <style>
    body{font-family:Tahoma,Arial;background:#f4f6f8;margin:0}
    header{background:#0f4c81;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    .chip{background:#1a6aa8;padding:4px 10px;border-radius:12px;font-size:12px}
    .tabs{display:flex;background:#fff;border-bottom:1px solid #ddd}
    .tab-btn{padding:12px 16px;border:none;background:none;cursor:pointer}
    .tab-btn.active{border-bottom:3px solid #0f4c81;font-weight:bold}
    .panel{display:none;padding:16px}
    .panel.active{display:block}
    .card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px}
    .btn{padding:8px 14px;border:none;border-radius:6px;cursor:pointer}
    .green{background:#2e8b57;color:#fff}
    .red{background:#c0392b;color:#fff}
    .hidden{display:none}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #ddd;padding:8px;text-align:center}
    th{background:#f0f0f0}
    ul{list-style:none;padding:0}
    li{margin-bottom:8px}
  </style>
</head>

<body>

<header>
  <div>Site Visit System</div>
  <div class="chip">v1.6.6</div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="checklist">Check‑List</button>
  <button class="tab-btn" data-tab="permissions">الصلاحيات</button>
</div>

<!-- ================= CHECKLIST ================= -->
<section id="checklist" class="panel active">
  <div class="card">
    <h3>Check‑List Form</h3>

    <form id="checklistForm">
      <ul>

        <li>
          <label><input type="checkbox" id="cl_1"> 1‑ Verify Power Supply</label>
        </li>
        <li>
          <label><input type="checkbox" id="cl_2"> 2‑ Verify Network Status</label>
        </li>
        <li>
          <label><input type="checkbox" id="cl_3"> 3‑ Verify POS System</label>
        </li>
        <li>
          <label><input type="checkbox" id="cl_4"> 4‑ Verify Printer</label>
        </li>
        <li>
          <label><input type="checkbox" id="cl_5"> 5‑ Verify Backup Status</label>
        </li>

        <!-- ❌ البند 20 محذوف نهائيًا -->
        <!-- Report Unused/Damaged IT Asset -->

      </ul>

      <button type="button" class="btn green" onclick="saveChecklist()">حفظ</button>
      <button type="button" class="btn red hidden" id="deleteChecklistBtn">حذف</button>
    </form>
  </div>
</section>

<!-- ================= PERMISSIONS ================= -->
<section id="permissions" class="panel">
  <div class="card">
    <h3>إدارة الصلاحيات</h3>

    <label>UID</label>
    <input id="userUid" style="width:100%"><br><br>

    <label>الاسم</label>
    <input id="userName" style="width:100%"><br><br>

    <label>Email</label>
    <input id="userEmail" style="width:100%"><br><br>

    <label>Role</label>
    <select id="userRole" style="width:100%">
      <option value="admin">Admin</option>
      <option value="supervisor">Supervisor</option>
      <option value="technician">Technician</option>
      <option value="user">User</option>
    </select><br><br>

    <button class="btn green">حفظ المستخدم</button>
  </div>

  <div class="card">
    <h3>المستخدمون</h3>
    <table>
      <thead>
        <tr>
          <th>UID</th>
          <th>الاسم</th>
          <th>Email</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>UID‑001</td>
          <td>Ahmed Ali</td>
          <td>ahmed@test.com</td>
          <td>Technician</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<script>
  const tabs=document.querySelectorAll('.tab-btn');
  const panels=document.querySelectorAll('.panel');

  tabs.forEach(btn=>{
    btn.onclick=()=>{
      tabs.forEach(b=>b.classList.remove('active'));
      panels.forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    }
  });

  function saveChecklist(){
    const data={
      cl1:document.getElementById('cl_1').checked,
      cl2:document.getElementById('cl_2').checked,
      cl3:document.getElementById('cl_3').checked,
      cl4:document.getElementById('cl_4').checked,
      cl5:document.getElementById('cl_5').checked,
      savedAt:new Date()
    };
    console.log('Checklist Saved',data);
    alert('تم حفظ Check‑List بنجاح');
  }
</script>

</body>
</html>
