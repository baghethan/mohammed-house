<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Permissions Management v1.3.8 - Auto Sync Schema</title>
  <style>
    :root{--primary:#0d2149;--primary-2:#1b4fa3;--green:#10b981;--border:#e2e8f0;--bg:#f8fafc;--card:#fff;--radius:16px}
    *{box-sizing:border-box} body{margin:0;font-family:'Segoe UI', Tahoma, sans-serif;background:var(--bg);padding:20px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,0.05);padding:20px;margin-bottom:20px}
    .card h3{margin:-20px -20px 20px;padding:15px 20px;background:var(--primary);color:#fff;font-size:16px;border-radius:16px 16px 0 0;font-weight:900}
    .field{margin-bottom:15px} label{display:block;margin-bottom:5px;font-weight:800;font-size:13px;color:var(--primary)}
    input, select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);outline:none;font-weight:700}
    .permissions-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:10px}
    .perm-item{background:#fcfdfe;border:1px solid var(--border);padding:12px;border-radius:12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:12px;cursor:pointer}
    .perm-item input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
    .btn{padding:12px 25px;border-radius:12px;border:none;font-weight:800;cursor:pointer;transition:0.2s}
    .btn-save{background:var(--green);color:#fff;width:100%;margin-top:15px}
    .sync-badge{font-size:10px; padding:4px 8px; border-radius:8px; background:rgba(16,185,129,0.1); color:var(--green); font-weight:900; margin-right:10px}
    table{width:100%;border-collapse:collapse;margin-top:15px}
    th,td{padding:12px;border-bottom:1px solid #eee;text-align:right;font-size:13px}
    th{background:#f8fafc;color:var(--primary);font-weight:900}
  </style>
</head>
<body>
  <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff">
    <div style="display:flex; justify-content:space-between; align-items:center">
        <h2 style="margin:0;font-weight:900">🛡️ إدارة الصلاحيات v1.3.8</h2>
        <span id="syncStatus" class="sync-badge" style="background:#fff; color:var(--primary)">جاري المزامنة التلقائية...</span>
    </div>
    <p style="margin:5px 0 0;font-size:12px;opacity:0.8">النظام يسحب ويحدث التبويبات تلقائياً من قاعدة البيانات لضمان عدم التعليق.</p>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div class="card">
        <h3>👤 بيانات الحساب</h3>
        <div class="field"><label>UID الموظف (من Firebase)</label><input id="userUid" type="text" placeholder="المعرف الفريد للمستخدم"></div>
        <div class="field"><label>الاسم الكامل</label><input id="userName" type="text"></div>
        <div class="field"><label>البريد الإلكتروني</label><input id="userEmail" type="email"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <div class="field"><label>الدور (Role)</label><select id="userRole"><option value="admin">Admin</option><option value="supervisor">Supervisor</option><option value="technician">Technician</option></select></div>
            <div class="field"><label>الحالة (Status)</label><select id="userActive"><option value="true">نشط (Active)</option><option value="false">مخفي (Hidden)</option></select></div>
        </div>
    </div>
    <div class="card">
        <h3>📂 التبويبات المسموح بها</h3>
        <div id="permsGrid" class="permissions-grid">
            <p style="font-size:12px; color:#666">جاري تحميل التبويبات الديناميكية...</p>
        </div>
        <button class="btn btn-save" id="saveBtn">💾 حفظ وتحديث الصلاحيات</button>
        <button class="btn" style="width:100%;margin-top:8px" id="clearBtn">تنظيف الحقول</button>
    </div>
  </div>

  <div class="card">
    <h3>👥 قائمة المستخدمين المسجلين</h3>
    <table>
        <thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th></tr></thead>
        <tbody id="usersList"></tbody>
    </table>
  </div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeFirestore, doc, collection, onSnapshot, setDoc, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { experimentalForceLongPolling: true });

// القائمة المرجعية (سيتم مزامنتها مع الداتابيس تلقائياً)
const appTabs = [
    {id:'dashboard', n:'لوحة التحكم'}, {id:'schedule', n:'الجدول الأسبوعي'},
    {id:'employees', n:'الموظفون'}, {id:'annual', n:'الإجازات السنوية'},
    {id:'planning', n:'خطة الإجازات'}, {id:'settings', n:'إعدادات الدوام'},
    {id:'permissions', n:'الصلاحيات'}, {id:'windows_upgrades', n:'ترقيات ويندوز'},
    {id:'checklists', n:'التفتيش الفني'}
];

const $ = id => document.getElementById(id);
let dynamicPages = [];
let users = [];

// --- محرك المزامنة التلقائية للمخطط ---
async function syncSystemPages() {
    try {
        const syncPromises = appTabs.map(tab => 
            setDoc(doc(db, "system_pages", tab.id), { 
                name: tab.n, 
                active: true, 
                lastSync: serverTimestamp() 
            }, { merge: true })
        );
        await Promise.all(syncPromises);
        $('syncStatus').innerText = "🟢 المخطط متزامن";
    } catch (e) {
        console.error("Sync Error:", e);
        $('syncStatus').innerText = "🔴 خطأ في المزامنة";
    }
}

// سحب التبويبات بشكل حي
onSnapshot(collection(db, "system_pages"), snap => {
    dynamicPages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    drawPerms();
});

function drawPerms(selected = {}) {
    if (dynamicPages.length === 0) return;
    $('permsGrid').innerHTML = dynamicPages.map(p => `
        <label class="perm-item">
            <input type="checkbox" class="p-check" data-id="${p.id}" ${selected[p.id]?.view ? 'checked' : ''}>
            <span>${p.name}</span>
        </label>
    `).join('');
}

$('saveBtn').onclick = async () => {
    const uid = $('userUid').value.trim();
    if(!uid) return alert("يرجى إدخال UID");

    const permissions = {};
    const pagesArray = [];
    document.querySelectorAll('.p-check').forEach(cb => {
        if(cb.checked) {
            const pid = cb.dataset.id;
            permissions[pid] = { view: true, add: true };
            pagesArray.push(pid);
        }
    });

    try {
        await setDoc(doc(db, 'app_users', uid), {
            name: $('userName').value || "",
            email: $('userEmail').value || "",
            role: $('userRole').value,
            active: $('userActive').value === "true",
            permissions: permissions,
            pages: pagesArray,
            updatedAt: serverTimestamp()
        }, { merge: true });
        alert("✅ تم الحفظ وتحديث التبويبات بنجاح!");
        $('userUid').value = ""; drawPerms();
    } catch(e) { alert("فشل الحفظ: " + e.message); }
};

onSnapshot(collection(db, 'app_users'), s => {
    users = s.docs.map(d => ({id:d.id, ...d.data()}));
    $('usersList').innerHTML = users.map(u => `
        <tr onclick="window.editUser('${u.id}')" style="cursor:pointer">
            <td><b>${u.name || '-'}</b></td>
            <td>${u.email || '-'}</td>
            <td>${u.role}</td>
            <td style="color:${u.active?'#10b981':'#ef4444'}">${u.active?'نشط':'مخفي'}</td>
        </tr>
    `).join('');
});

window.editUser = (id) => {
    const u = users.find(x => x.id === id);
    if(!u) return;
    $('userUid').value = u.id; $('userName').value = u.name || "";
    $('userEmail').value = u.email || ""; 
    $('userRole').value = u.role || 'technician';
    $('userActive').value = String(u.active === true);
    drawPerms(u.permissions || {});
};

$('clearBtn').onclick = () => { $('userUid').value=""; drawPerms(); };
window.onload = () => {
    syncSystemPages(); // تشغيل المزامنة عند الفتح
};
</script>
</body>
</html>
