<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permissions Management - Almajdouie Motors</title>
  <style>
    :root{--primary:#0d2149;--primary-2:#1b4fa3;--green:#10b981;--danger:#ef4444;--warning:#f59e0b;--border:#e2e8f0;--text:#1f2937;--muted:#64748b;--bg:#f8fafc;--card:#fff;--shadow:0 10px 30px rgba(0,0,0,0.05);--radius:16px}
    *{box-sizing:border-box} body{margin:0;font-family:'Segoe UI', Tahoma, sans-serif;color:var(--text);background:var(--bg)}
    .hidden{display:none!important}
    .container{max-width:1450px;margin:18px auto;padding:0 14px 28px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .field{display:grid;gap:8px;margin-bottom:12px} .field label{font-size:13px;font-weight:700;color:var(--primary)}
    .field input,.field select{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;font:inherit;background:#fff;outline:none}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;overflow:hidden}
    .card h3{margin:-20px -20px 20px;padding:15px 20px;background:var(--primary);color:#fff;font-size:16px;font-weight:900}
    .btn{border:1px solid var(--border);border-radius:12px;padding:10px 20px;background:#fff;color:var(--primary);font-weight:800;cursor:pointer;transition:0.2s}
    .btn.green{background:var(--green);border-color:var(--green);color:#fff} .btn.warning{background:var(--warning);border-color:var(--warning);color:#fff}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:#fff} table{width:100%;border-collapse:collapse} th,td{padding:12px;border-bottom:1px solid #edf2f7;text-align:right;white-space:nowrap;font-size:13px} th{background:#f8fafc;color:var(--primary);font-weight:900}
    .permissions-hero{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:25px;border-radius:20px;margin-bottom:20px}
    .permissions-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:12px}
    .permission-card{border:1px solid var(--border);border-radius:14px;padding:15px;background:#fcfdfe;transition:.2s}
    .permission-card:hover{border-color:var(--primary-2);box-shadow:0 5px 15px rgba(0,0,0,0.05)}
    .permission-line{display:flex;align-items:center;gap:10px;font-weight:800;font-size:12px;cursor:pointer}
    .permission-line input{width:18px;height:18px;accent-color:var(--green)}
    .alert{padding:12px;border-radius:10px;margin-top:10px;font-weight:800;font-size:13px}
    .alert.error{background:#fee2e2;color:#b91c1c} .alert.ok{background:#dcfce7;color:#166534}
  </style>
</head>
<body>
<main class="container">
  <div id="sessionNotice" style="background:#fff7ed; color:#9a3412; padding:20px; border-radius:15px; text-align:center; font-weight:900" class="hidden">الرجاء تسجيل الدخول من الصفحة الرئيسية أولاً.</div>
  
  <div id="appRoot" class="hidden">
    <div class="permissions-hero">
      <h3 style="margin:0 0 10px 0; font-size:24px">🔐 إدارة صلاحيات الموظفين</h3>
      <p style="margin:0; opacity:0.9; font-size:14px">قم بتحديد UID الموظف، ثم اختر التبويبات المسموح له برؤيتها من القائمة أدناه.</p>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>👤 بيانات الحساب</h3>
        <div class="field"><label>UID الموظف (من Firebase)</label><input id="userUid" type="text" placeholder="مثال: DFFhtc8d9..."></div>
        <div class="field"><label>الاسم الكامل</label><input id="userName" type="text"></div>
        <div class="field"><label>البريد الإلكتروني</label><input id="userEmail" type="email"></div>
        <div class="field"><label>الدور الوظيفي</label><select id="userRole"><option value="admin">Admin</option><option value="supervisor">Supervisor</option><option value="user">User</option></select></div>
        <div id="permissionsError" class="alert hidden"></div>
      </div>

      <div class="card">
        <h3>📂 التبويبات المسموح بها (تعتمد على التحديد)</h3>
        <div style="margin-bottom:15px; display:flex; gap:10px">
            <button class="btn" onclick="window.toggleAll(true)">تحديد الكل</button>
            <button class="btn" onclick="window.toggleAll(false)">إلغاء الكل</button>
        </div>
        <div class="permissions-grid" id="permissionPagesGrid"></div>
        <div style="margin-top:25px; display:flex; gap:10px">
          <button class="btn green" id="saveUserBtn" style="flex:2">💾 حفظ الصلاحيات المحددة</button>
          <button class="btn" id="clearUserBtn" style="flex:1">تنظيف</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <h3>📋 قائمة المستخدمين الحالية</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>UID</th><th>الاسم</th><th>Role</th><th>الصلاحيات الممنوحة</th></tr></thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

// قائمة الصفحات الفعلية في نظامك الجديد
const pages = [
    { key:'dashboard', name:'لوحة التحكم' },
    { key:'schedule', name:'الجدول الأسبوعي' },
    { key:'employees', name:'إدارة الموظفين' },
    { key:'annual', name:'الإجازات السنوية' },
    { key:'planning', name:'خطة الإجازات' },
    { key:'settings', name:'إعدادات الدوام' },
    { key:'permissions', name:'الصلاحيات' }
];

let allUsers = [];

// --- 1. الرندر ---
function renderCheckboxes(selectedObj = {}) {
    document.getElementById('permissionPagesGrid').innerHTML = pages.map(p => `
        <div class="permission-card">
            <label class="permission-line">
                <input type="checkbox" class="pg-check" data-id="${p.key}" ${selectedObj[p.key]?.view ? 'checked' : ''}>
                <span>${p.name}</span>
            </label>
        </div>
    `).join('');
}

window.toggleAll = (val) => document.querySelectorAll('.pg-check').forEach(c => c.checked = val);

// --- 2. الحفظ بناءً على التحديد ---
document.getElementById('saveUserBtn').onclick = async () => {
    const uid = document.getElementById('userUid').value.trim();
    if(!uid) return alert("UID مطلوب");

    // بناء كائن الصلاحيات من التحديد الحالي
    const permissions = {};
    document.querySelectorAll('.pg-check').forEach(cb => {
        if(cb.checked) {
            permissions[cb.dataset.id] = { view: true, add: true };
        }
    });

    const payload = {
        name: document.getElementById('userName').value,
        email: document.getElementById('userEmail').value,
        role: document.getElementById('userRole').value,
        permissions: permissions, // هذا ما سيأخذه النظام بناءً على الـ Check
        active: true,
        updatedAt: new Date().toISOString()
    };

    try {
        await setDoc(doc(db, 'app_users', uid), payload, { merge: true });
        alert("✅ تم حفظ الصلاحيات بنجاح");
        document.getElementById('userUid').value = "";
        renderCheckboxes();
    } catch(e) { alert("خطأ في الحفظ"); }
};

// --- 3. جلب البيانات ---
onSnapshot(collection(db, 'app_users'), snap => {
    allUsers = snap.docs.map(d => ({id: d.id, ...d.data()}));
    document.getElementById('usersTableBody').innerHTML = allUsers.map(u => `
        <tr onclick="window.editUser('${u.id}')" style="cursor:pointer">
            <td>${u.id}</td>
            <td><b>${u.name || '-'}</b></td>
            <td>${u.role}</td>
            <td>${Object.keys(u.permissions || {}).length} صفحات</td>
        </tr>
    `).join('');
});

window.editUser = (id) => {
    const u = allUsers.find(x => x.id === id);
    if(!u) return;
    document.getElementById('userUid').value = u.id;
    document.getElementById('userName').value = u.name || "";
    document.getElementById('userEmail').value = u.email || "";
    document.getElementById('userRole').value = u.role || "user";
    renderCheckboxes(u.permissions || {});
};

window.onload = () => {
    document.getElementById('appRoot').classList.remove('hidden');
    renderCheckboxes();
};
</script>
</body>
</html>
