<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Permissions v1.8.0 - Fast Check</title>
  <style>
    :root{--primary:#0d2149;--bg:#f8fafc;--border:#e2e8f0}
    body{font-family:sans-serif; background:var(--bg); padding:20px;}
    .card{background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px; max-width:800px; margin:auto; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)}
    h3{color:var(--primary); border-bottom:2px solid var(--primary); padding-bottom:10px}
    .grid{display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:20px}
    input, select{width:100%; padding:10px; border:1px solid var(--border); border-radius:8px}
    .perms-box{display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-top:20px}
    .p-item{background:#f1f5f9; padding:10px; border-radius:8px; display:flex; align-items:center; gap:8px; cursor:pointer}
    .btn-save{width:100%; padding:15px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:20px}
    .user-row{padding:10px; border-bottom:1px solid #eee; cursor:pointer}
    .user-row:hover{background:#f0f7ff}
    #statusInfo{text-align:center; font-weight:bold; color:var(--primary); margin-bottom:10px; display:none}
  </style>
</head>
<body>

<div class="card">
    <div id="statusInfo">جاري معالجة الطلب...</div>
    <h3>🔐 إعداد الصلاحيات - نسخة الفحص السريع</h3>
    
    <div class="grid">
        <div><label>اسم الموظف</label><input id="userName" type="text"></div>
        <div><label>البريد الإلكتروني</label><input id="userEmail" type="email"></div>
    </div>
    
    <div style="margin-top:15px">
        <label>رقم المعرف (UID) - انسخه من القائمة بالأسفل</label>
        <input id="userUid" type="text" placeholder="انسخ الـ UID هنا للتعديل">
    </div>

    <div class="perms-box">
        <label class="p-item"><input type="checkbox" class="p-check" data-id="dashboard"> Dashboard</label>
        <label class="p-item"><input type="checkbox" class="p-check" data-id="schedule"> الجدول</label>
        <label class="p-item"><input type="checkbox" class="p-check" data-id="employees"> الموظفون</label>
        <label class="p-item"><input type="checkbox" class="p-check" data-id="annual"> الإجازات</label>
        <label class="p-item"><input type="checkbox" class="p-check" data-id="planning"> الخطة</label>
        <label class="p-item"><input type="checkbox" class="p-check" data-id="settings"> الإعدادات</label>
        <label class="p-item"><input type="checkbox" class="p-check" data-id="permissions"> الصلاحيات</label>
    </div>

    <button class="btn-save" id="saveBtn">حفظ الآن</button>

    <h4 style="margin-top:30px">👥 قائمة المستخدمين (اضغط للتحميل)</h4>
    <div id="usersList" style="max-height:200px; overflow-y:auto; border:1px solid #eee; padding:10px">
        جاري تحميل القائمة...
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);

// إعدادات الشركة لضمان السرعة القصوى
const db = initializeFirestore(app, { 
    experimentalForceLongPolling: true,
    useFetchStreams: false 
});

const status = document.getElementById('statusInfo');

// 1. جلب قائمة المستخدمين عند فتح الصفحة
async function loadUsers() {
    try {
        const snap = await getDocs(collection(db, 'app_users'));
        document.getElementById('usersList').innerHTML = snap.docs.map(d => `
            <div class="user-row" onclick="window.fetchUserDetails('${d.id}')">
                <b>${d.data().name || 'مستخدم'}</b> - <small>${d.id}</small>
            </div>
        `).join('');
    } catch(e) {
        document.getElementById('usersList').innerHTML = "خطأ في الاتصال: " + e.message;
    }
}
loadUsers();

// 2. جلب تفاصيل مستخدم معين عند الضغط عليه
window.fetchUserDetails = async (id) => {
    status.style.display = 'block';
    status.innerText = "جاري جلب البيانات...";
    try {
        const d = await getDoc(doc(db, 'app_users', id));
        if(d.exists()) {
            const u = d.data();
            document.getElementById('userUid').value = id;
            document.getElementById('userName').value = u.name || "";
            document.getElementById('userEmail').value = u.email || "";
            document.querySelectorAll('.p-check').forEach(cb => {
                cb.checked = u.permissions && u.permissions[cb.dataset.id]?.view;
            });
            status.innerText = "تم التحميل!";
        }
    } finally {
        setTimeout(() => status.style.display = 'none', 1000);
    }
};

// 3. حفظ التعديلات
document.getElementById('saveBtn').onclick = async () => {
    const uid = document.getElementById('userUid').value.trim();
    if(!uid) return alert("اختر مستخدم أولاً");

    status.style.display = 'block';
    status.innerText = "جاري الحفظ...";

    const perms = {};
    document.querySelectorAll('.p-check').forEach(cb => {
        if(cb.checked) perms[cb.dataset.id] = { view: true, add: true };
    });

    try {
        await setDoc(doc(db, 'app_users', uid), {
            name: document.getElementById('userName').value,
            email: document.getElementById('userEmail').value,
            permissions: perms,
            updatedAt: new Date()
        }, { merge: true });
        alert("✅ تم الحفظ بنجاح!");
        loadUsers();
    } catch(e) { alert(e.message); }
    status.style.display = 'none';
};
</script>
</body>
</html>
