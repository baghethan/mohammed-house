<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>Permissions v2.5.0 - Secure Auth Mode</title>
  <style>
    :root{--primary:#0d2149;--accent:#1b4fa3;--success:#10b981;--error:#ef4444;--bg:#f8fafc;--border:#cbd5e1}
    body{font-family:'Segoe UI', Tahoma, sans-serif; background:var(--bg); padding:20px; color:#1e293b}
    .card{background:#fff; border-radius:12px; padding:25px; box-shadow:0 4px 15px rgba(0,0,0,0.08); border:1px solid var(--border); max-width:850px; margin:auto}
    .status-indicator{padding:12px; border-radius:8px; text-align:center; font-weight:bold; margin-bottom:20px; font-size:14px; display:none}
    .status-loading{background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd}
    .status-error{background:#fee2e2; color:#b91c1c; border:1px solid #fecaca}
    .status-success{background:#dcfce7; color:#166534; border:1px solid #bbf7d0}
    .input-group{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px}
    label{display:block; margin-bottom:6px; font-weight:700; color:var(--primary); font-size:13px}
    input{width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; outline:none; box-sizing: border-box;}
    .perms-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:12px; background:#f1f5f9; padding:15px; border-radius:10px}
    .perm-card{background:#fff; border:1px solid var(--border); padding:10px; border-radius:8px; display:flex; align-items:center; gap:8px; cursor:pointer}
    .btn-action{width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px}
    .table-container{max-height:250px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; margin-top:10px}
    table{width:100%; border-collapse:collapse}
    th{position:sticky; top:0; background:#f8fafc; padding:12px; text-align:left; font-size:12px; border-bottom:2px solid var(--border)}
    td{padding:12px; border-bottom:1px solid #edf2f7; font-size:13px; cursor:pointer}
    tr:hover{background:#f1f5f9}
  </style>
</head>
<body>

<div class="card">
    <div id="statusBox" class="status-indicator"></div>
    
    <div style="text-align:center; margin-bottom:25px">
        <h2 style="color:var(--primary); margin:0">Employee Permissions Management (Secure)</h2>
        <p style="color:#64748b; font-size:11px; margin-top:5px">v2.5.0 - Dual Identity Verification System - Al-Majdouie</p>
    </div>

    <div class="input-group">
        <div><label>Employee Name</label><input id="uName" type="text" readonly style="background:#f1f5f9"></div>
        <div><label>Email Address</label><input id="uEmail" type="email" readonly style="background:#f1f5f9"></div>
    </div>
    <input id="uId" type="hidden">

    <label>Access Permissions:</label>
    <div class="perms-grid" id="permsDisplay"></div>

    <button class="btn-action" id="saveBtn" style="margin-top:20px">💾 Save Permission Changes</button>

    <div style="margin-top:25px; border-top:1px solid #eee; padding-top:15px">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <h3 style="font-size:14px; margin:0">👥 Select an employee to edit:</h3>
            <button id="reloadBtn" style="padding:5px 12px; border-radius:5px; cursor:pointer; background:#fff; border:1px solid #ccc">🔄 Refresh List</button>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>Employee Name</th><th>Email Address</th></tr></thead>
                <tbody id="usersTbody">
                    <tr><td colspan="2" style="text-align:center; padding:20px">Verifying your identity...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { experimentalForceLongPolling: true, useFetchStreams: false });
const auth = getAuth(app);

// Translated Permissions Options
const PAGES = {
    dashboard: "Dashboard", schedule: "Schedule", employees: "Employees", 
    annual: "Annual Leave", planning: "Planning", settings: "Settings", permissions: "Permissions"
};

document.getElementById('permsDisplay').innerHTML = Object.keys(PAGES).map(k => `
    <label class="perm-card"><input type="checkbox" class="perm-check" data-id="${k}"> <span>${PAGES[k]}</span></label>
`).join('');

const statusBox = document.getElementById('statusBox');
const updateStatus = (t, m='loading') => {
    statusBox.innerText = t;
    statusBox.className = 'status-indicator status-' + m;
    statusBox.style.display = 'block';
};

// --- Identity Verification System ---
onAuthStateChanged(auth, (user) => {
    if (user) {
        updateStatus("Welcome. Identity verified.", 'success');
        setTimeout(() => { statusBox.style.display='none'; fetchAll(); }, 1500);
    } else {
        updateStatus("Warning: You must log in from the main page first.", 'error');
        document.getElementById('usersTbody').innerHTML = '<tr><td colspan="2" style="color:red; text-align:center">Please log in to access this data</td></tr>';
    }
});

async function fetchAll() {
    updateStatus("Fetching employee list...");
    try {
        const snap = await getDocs(collection(db, 'app_users'));
        document.getElementById('usersTbody').innerHTML = snap.docs.map(doc => {
            const d = doc.data();
            return `<tr onclick="window.loadUser('${doc.id}')"><td><b>${d.name || 'User'}</b></td><td>${d.email || '-'}</td></tr>`;
        }).join('');
        updateStatus("List updated successfully.", 'success');
        setTimeout(() => statusBox.style.display = 'none', 1000);
    } catch(e) { updateStatus("Fetch failed: Check your network connection.", 'error'); }
}

document.getElementById('reloadBtn').onclick = fetchAll;

window.loadUser = async (id) => {
    updateStatus("Loading employee permissions...");
    try {
        const d = await getDoc(doc(db, 'app_users', id));
        if(d.exists()) {
            const u = d.data();
            document.getElementById('uId').value = id;
            document.getElementById('uName').value = u.name || "";
            document.getElementById('uEmail').value = u.email || "";
            document.querySelectorAll('.perm-check').forEach(c => {
                c.checked = u.permissions && u.permissions[c.dataset.id]?.view;
            });
            updateStatus("Ready to edit.", 'success');
            setTimeout(() => statusBox.style.display = 'none', 1000);
        }
    } catch(e) { updateStatus("Error loading user data.", 'error'); }
};

document.getElementById('saveBtn').onclick = async () => {
    const id = document.getElementById('uId').value;
    if(!id) return alert("Please select an employee from the list first.");
    
    updateStatus("Saving new permissions...");
    const perms = {};
    document.querySelectorAll('.perm-check').forEach(c => { 
        if(c.checked) perms[c.dataset.id] = {view:true, add:true}; 
    });

    try {
        await setDoc(doc(db, 'app_users', id), {
            permissions: perms,
            updatedAt: new Date()
        }, { merge: true });
        updateStatus("✅ Permissions updated successfully.", 'success');
        setTimeout(() => statusBox.style.display = 'none', 2000);
    } catch(e) { updateStatus("Save failed: Network firewall prevented the operation.", 'error'); }
};
</script>
</body>
</html>
