<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Permissions v2.0.0 - Network Strong</title>
  <style>
    :root{--primary:#0d2149;--accent:#1b4fa3;--success:#10b981;--error:#ef4444;--bg:#f1f5f9;--border:#e2e8f0}
    body{font-family:'Segoe UI', sans-serif; background:var(--bg); padding:20px; color:#334155}
    .card{background:#fff; border-radius:15px; padding:25px; box-shadow:0 8px 20px rgba(0,0,0,0.06); border:1px solid var(--border); max-width:900px; margin:auto}
    .status-bar{padding:10px; border-radius:8px; text-align:center; font-weight:bold; margin-bottom:15px; display:none; font-size:13px}
    .loading{background:#dbeafe; color:#1e40af}
    .err{background:#fee2e2; color:#b91c1c}
    .grid{display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:15px}
    input{width:100%; padding:12px; border:2px solid var(--border); border-radius:10px; outline:none}
    .perms-box{display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:10px; margin-top:15px; background:#f8fafc; padding:15px; border-radius:12px}
    .p-item{background:#fff; padding:10px; border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; gap:8px; cursor:pointer}
    .btn-main{width:100%; padding:16px; background:var(--primary); color:#fff; border:none; border-radius:12px; font-weight:bold; cursor:pointer; margin-top:20px}
    .user-table{width:100%; border-collapse:collapse; margin-top:20px}
    .user-table th{text-align:right; padding:12px; border-bottom:2px solid var(--border); font-size:12px}
    .user-table td{padding:12px; border-bottom:1px solid #eee; font-size:13px; cursor:pointer}
  </style>
</head>
<body>

<div class="card">
    <div id="msg" class="status-bar"></div>
    
    <div style="text-align:center; margin-bottom:20px">
        <h2 style="color:var(--primary); margin:0">إدارة الصلاحيات (v2.0.0)</h2>
        <small>نسخة الاتصال المستقر لشبكات المجدوعي</small>
    </div>

    <div class="grid">
        <div><label>الاسم</label><input id="userName" type="text"></div>
        <div><label>البريد</label><input id="userEmail" type="email"></div>
    </div>
    <input id="userUid" type="hidden">

    <div class="perms-box" id="permsList"></div>

    <button class="btn-main" id="saveBtn">💾 حفظ التعديلات الآن</button>

    <div style="margin-top:30px; display:flex; justify-content:space-between; align-items:center">
        <h3 style="font-size:16px">قائمة المستخدمين</h3>
        <button id="fetchBtn" style="padding:5px 15px; border-radius:5px; cursor:pointer">🔄 تحديث القائمة</button>
    </div>
    
    <div style="max-height:250px; overflow-y:auto">
        <table class="user-table">
            <thead><tr><th>الموظف</th><th>البريد</th></tr></thead>
            <tbody id="listBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { 
    experimentalForceLongPolling: true,
    useFetchStreams: false
});

const TABS = {
    dashboard: "Dashboard", schedule: "الجدول", employees: "الموظفون", 
    annual: "الإجازات", planning: "الخطة", settings: "الإعدادات", permissions: "الصلاحيات"
};

const msg = document.getElementById('msg');
const showMsg = (txt, type='loading') => {
    msg.innerText = txt;
    msg.className = 'status-bar ' + type;
    msg.style.display = 'block';
};

// رسم المربعات
document.getElementById('permsList').innerHTML = Object.keys(TABS).map(id => `
    <label class="p-item"><input type="checkbox" class="p-check" data-id="${id}"> ${TABS[id]}</label>
`).join('');

// جلب المستخدمين (بمحاولة إعادة اتصال ذكية)
async function fetchAll() {
    showMsg("جاري الاتصال بالقاعدة...");
    try {
        const snap = await getDocs(collection(db, 'app_users'));
        document.getElementById('listBody').innerHTML = snap.docs.map(d => `
            <tr onclick="window.loadUser('${d.id}')">
                <td><b>${d.data().name || 'مستخدم'}</b></td>
                <td>${d.data().email || '-'}</td>
            </tr>
        `).join('');
        showMsg("تم التحديث بنجاح", 'success');
        setTimeout(() => msg.style.display = 'none', 2000);
    } catch(e) {
        showMsg("فشل الاتصال: يرجى المحاولة مرة أخرى بالضغط على تحديث", 'err');
    }
}

document.getElementById('fetchBtn').onclick = fetchAll;

window.loadUser = async (id) => {
    showMsg("جاري تحميل بيانات الموظف...");
    try {
        const d = await getDoc(doc(db, 'app_users', id));
        if(d.exists()) {
            const u = d.data();
            document.getElementById('userUid').value = id;
            document.getElementById('userName').value = u.name || "";
            document.getElementById('userEmail').value = u.email || "";
            document.querySelectorAll('.p-check').forEach(cb => {
                cb.checked = u.permissions && u.permissions[cb.dataset.id]?.view;
            });
            showMsg("تم تحميل " + (u.name || "الموظف"), 'success');
            setTimeout(() => msg.style.display = 'none', 1500);
        }
    } catch(e) {
        showMsg("خطأ في التحميل", 'err');
    }
};

document.getElementById('saveBtn').onclick = async () => {
    const uid = document.getElementById('userUid').value;
    if(!uid) return alert("اختر موظفاً أولاً");

    showMsg("جاري حفظ التعديلات... يرجى عدم إغلاق الصفحة");
    const perms = {};
    document.querySelectorAll('.p-check').forEach(cb => {
        if(cb.checked) perms[cb.dataset.id] = { view: true, add: true };
    });

    try {
        await setDoc(doc(db, 'app_users', uid), {
            name: document.getElementById('userName').value,
            email: document.getElementById('userEmail').value,
            permissions: perms,
            updatedAt: new Date()
        }, { merge: true });
        showMsg("✅ تم الحفظ بنجاح!", 'success');
        setTimeout(() => msg.style.display = 'none', 2000);
    } catch(e) {
        showMsg("خطأ في الحفظ: حاول مرة أخرى", 'err');
    }
};
</script>
</body>
</html>
