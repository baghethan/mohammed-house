<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Permissions v1.9.0 - Luxury & Fast</title>
  <style>
    :root{--primary:#0d2149;--accent:#1b4fa3;--success:#10b981;--bg:#f1f5f9;--border:#e2e8f0}
    body{font-family:'Segoe UI', Tahoma, sans-serif; background:var(--bg); padding:20px; color:#334155}
    .container{max-width:900px; margin:auto}
    .card{background:#fff; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.05); border:1px solid var(--border); margin-bottom:20px}
    .header-box{background:linear-gradient(135deg, var(--primary), var(--accent)); color:#fff; padding:20px; border-radius:15px; margin-bottom:25px; text-align:center}
    .grid{display:grid; grid-template-columns: 1fr 1fr; gap:20px}
    label{display:block; font-weight:bold; margin-bottom:8px; font-size:13px; color:var(--primary)}
    input{width:100%; padding:12px; border:2px solid var(--border); border-radius:10px; transition:0.3s; outline:none}
    input:focus{border-color:var(--accent)}
    .perms-container{background:#f8fafc; padding:20px; border-radius:15px; border:1px solid var(--border); margin-top:20px}
    .perms-grid{display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:12px}
    .p-item{background:#fff; padding:12px; border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:0.2s}
    .p-item:hover{border-color:var(--accent); transform:translateY(-2px)}
    .p-item input{width:18px; height:18px; accent-color:var(--accent)}
    .btn-save{width:100%; padding:16px; background:var(--primary); color:#fff; border:none; border-radius:12px; font-weight:bold; cursor:pointer; margin-top:25px; font-size:16px; transition:0.3s}
    .btn-save:hover{background:var(--accent); box-shadow:0 5px 15px rgba(13,33,73,0.3)}
    .list-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:15px}
    .btn-refresh{background:var(--success); color:#fff; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:bold}
    .user-table{width:100%; border-collapse:collapse}
    .user-table th{text-align:right; padding:12px; background:#f8fafc; color:var(--primary); font-size:13px}
    .user-table td{padding:12px; border-bottom:1px solid #f1f5f9; font-size:13px; cursor:pointer}
    .user-table tr:hover{background:rgba(27,79,163,0.05)}
    #loader{display:none; color:var(--accent); font-weight:bold; font-size:12px}
  </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h2 style="margin:0">🛡️ لوحة إدارة الصلاحيات السريعة</h2>
        <p style="margin:5px 0 0; opacity:0.8; font-size:12px">Almajdouie Motors - v1.9.0 Optimized</p>
    </div>

    <div class="card">
        <div class="grid">
            <div><label>👤 اسم الموظف</label><input id="userName" type="text" placeholder="أدخل الاسم"></div>
            <div><label>📧 البريد الإلكتروني</label><input id="userEmail" type="email" placeholder="example@almajdouie.com"></div>
        </div>
        
        <div style="margin-top:20px">
            <label>🔑 رقم المعرف (UID)</label>
            <input id="userUid" type="text" placeholder="اختر موظفاً من الجدول بالأسفل ليظهر الـ UID هنا" readonly style="background:#f8fafc">
        </div>

        <div class="perms-container">
            <label>📂 تحديد صلاحيات الوصول:</label>
            <div class="perms-grid" id="permsGrid">
                </div>
        </div>

        <button class="btn-save" id="saveBtn">💾 حفظ وتحديث الصلاحيات فوراً</button>
    </div>

    <div class="card">
        <div class="list-header">
            <h3 style="margin:0; font-size:16px">👥 قائمة الموظفين المسجلين</h3>
            <div style="display:flex; align-items:center; gap:10px">
                <span id="loader">جاري جلب البيانات...</span>
                <button class="btn-refresh" id="refreshBtn">🔄 تحديث القائمة</button>
            </div>
        </div>
        <div style="max-height:300px; overflow-y:auto">
            <table class="user-table">
                <thead>
                    <tr><th>الاسم</th><th>البريد</th><th>UID</th></tr>
                </thead>
                <tbody id="usersList">
                    <tr><td colspan="3" style="text-align:center; color:#94a3b8">اضغط على "تحديث القائمة" لعرض الموظفين</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { experimentalForceLongPolling: true, useFetchStreams: false });

const TABS = {
    dashboard: "📊 Dashboard", schedule: "🗓️ الجدول", employees: "👥 الموظفون", 
    annual: "🌴 الإجازات", planning: "📅 الخطة", settings: "⏰ الإعدادات", permissions: "🔐 الصلاحيات"
};

// رسم الصلاحيات
const pGrid = document.getElementById('permsGrid');
pGrid.innerHTML = Object.keys(TABS).map(id => `
    <label class="p-item">
        <input type="checkbox" class="p-check" data-id="${id}">
        <span>${TABS[id]}</span>
    </label>
`).join('');

const loader = document.getElementById('loader');

// وظيفة جلب البيانات (يدوية لضمان السرعة)
async function fetchUsers() {
    loader.style.display = 'inline';
    try {
        const snap = await getDocs(collection(db, 'app_users'));
        document.getElementById('usersList').innerHTML = snap.docs.map(d => `
            <tr onclick="window.loadToForm('${d.id}')">
                <td><b>${d.data().name || 'مستخدم'}</b></td>
                <td>${d.data().email || '-'}</td>
                <td style="font-family:monospace; font-size:11px; color:#64748b">${d.id}</td>
            </tr>
        `).join('');
    } catch(e) {
        alert("تأخر الرد من الخادم: يرجى المحاولة مرة أخرى.");
    } finally {
        loader.style.display = 'none';
    }
}

document.getElementById('refreshBtn').onclick = fetchUsers;

window.loadToForm = async (id) => {
    loader.style.display = 'inline';
    loader.innerText = "جاري التحميل...";
    try {
        const d = await getDoc(doc(db, 'app_users', id));
        if(d.exists()) {
            const u = d.data();
            document.getElementById('userUid').value = id;
            document.getElementById('userName').value = u.name || "";
            document.getElementById('userEmail').value = u.email || "";
            document.querySelectorAll('.p-check').forEach(cb => {
                cb.checked = u.permissions && u.permissions[cb.dataset.id]?.view;
            });
        }
    } finally {
        loader.style.display = 'none';
        loader.innerText = "جاري جلب البيانات...";
    }
};

document.getElementById('saveBtn').onclick = async () => {
    const uid = document.getElementById('userUid').value;
    if(!uid) return alert("الرجاء اختيار موظف من القائمة أولاً");

    document.getElementById('saveBtn').innerText = "جاري الحفظ...";
    const perms = {};
    document.querySelectorAll('.p-check').forEach(cb => {
        if(cb.checked) perms[cb.dataset.id] = { view: true, add: true };
    });

    try {
        await setDoc(doc(db, 'app_users', uid), {
            name: document.getElementById('userName').value,
            email: document.getElementById('userEmail').value,
            permissions: perms,
            updatedAt: new Date()
        }, { merge: true });
        alert("✅ تم تحديث الصلاحيات بنجاح!");
        fetchUsers();
    } catch(e) { alert("خطأ في الحفظ"); }
    document.getElementById('saveBtn').innerText = "💾 حفظ وتحديث الصلاحيات فوراً";
};
</script>
</body>
</html>
