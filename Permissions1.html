<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Permissions v2.1.0 - Emergency Edition</title>
  <style>
    :root{--primary:#0d2149;--accent:#1b4fa3;--success:#10b981;--error:#ef4444;--bg:#f8fafc;--border:#cbd5e1}
    body{font-family:'Segoe UI', Tahoma, sans-serif; background:var(--bg); padding:20px; color:#1e293b}
    .card{background:#fff; border-radius:12px; padding:25px; box-shadow:0 4px 15px rgba(0,0,0,0.08); border:1px solid var(--border); max-width:850px; margin:auto}
    .status-indicator{padding:12px; border-radius:8px; text-align:center; font-weight:bold; margin-bottom:20px; font-size:14px; display:none}
    .status-loading{background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd}
    .status-error{background:#fee2e2; color:#b91c1c; border:1px solid #fecaca}
    .status-success{background:#dcfce7; color:#166534; border:1px solid #bbf7d0}
    .input-group{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px}
    label{display:block; margin-bottom:6px; font-weight:700; color:var(--primary); font-size:13px}
    input{width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; outline:none; transition:0.2s}
    input:focus{border-color:var(--accent); ring:2px var(--accent)}
    .perms-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:12px; background:#f1f5f9; padding:15px; border-radius:10px}
    .perm-card{background:#fff; border:1px solid var(--border); padding:10px; border-radius:8px; display:flex; align-items:center; gap:8px; cursor:pointer; transition:0.15s}
    .perm-card:hover{border-color:var(--accent); background:#f8fafc}
    .perm-card input{width:16px; height:16px; cursor:pointer}
    .btn-action{width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px; transition:0.2s}
    .btn-action:hover{background:var(--accent)}
    .user-list-section{margin-top:30px}
    .table-container{max-height:250px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; margin-top:10px}
    table{width:100%; border-collapse:collapse}
    th{position:sticky; top:0; background:#f8fafc; padding:12px; text-align:right; font-size:12px; border-bottom:2px solid var(--border)}
    td{padding:12px; border-bottom:1px solid #edf2f7; font-size:13px; cursor:pointer}
    tr:hover{background:#f1f5f9}
  </style>
</head>
<body>

<div class="card">
    <div id="statusBox" class="status-indicator"></div>
    
    <div style="text-align:center; margin-bottom:25px">
        <h2 style="color:var(--primary); margin:0">إدارة صلاحيات الموظفين</h2>
        <p style="color:#64748b; font-size:12px; margin-top:5px">النسخة v2.1.0 - نظام المجدوعي للسيارات</p>
    </div>

    <div class="input-group">
        <div><label>الاسم الكامل</label><input id="uName" type="text" placeholder="مثال: محمد حسن"></div>
        <div><label>البريد الإلكتروني</label><input id="uEmail" type="email" placeholder="user@almajdouie.com"></div>
    </div>
    <input id="uId" type="hidden">

    <label>صلاحيات الوصول الممنوحة:</label>
    <div class="perms-grid" id="permsDisplay"></div>

    <button class="btn-action" id="saveBtn" style="margin-top:20px">💾 حفظ التعديلات فوراً</button>

    <div class="user-list-section">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <h3 style="margin:0; font-size:15px">قائمة الموظفين</h3>
            <button id="reloadBtn" style="padding:6px 12px; border:1px solid var(--border); border-radius:6px; cursor:pointer; background:#fff; font-size:12px">🔄 تحديث القائمة</button>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>الموظف</th><th>البريد</th></tr></thead>
                <tbody id="usersTbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { 
    experimentalForceLongPolling: true,
    useFetchStreams: false 
});

const PAGES_LIST = {
    dashboard: "لوحة التحكم", schedule: "الجدول", employees: "الموظفون", 
    annual: "الإجازات", planning: "الخطة", settings: "الإعدادات", permissions: "الصلاحيات"
};

const statusBox = document.getElementById('statusBox');
const updateStatus = (text, mode='loading') => {
    statusBox.innerText = text;
    statusBox.className = 'status-indicator status-' + mode;
    statusBox.style.display = 'block';
};

// إنشاء شبكة الصلاحيات
document.getElementById('permsDisplay').innerHTML = Object.keys(PAGES_LIST).map(key => `
    <label class="perm-card"><input type="checkbox" class="perm-check" data-id="${key}"> <span>${PAGES_LIST[key]}</span></label>
`).join('');

// وظيفة جلب كافة المستخدمين
async function getAllUsers() {
    updateStatus("جاري جلب القائمة من الخادم...");
    try {
        const snap = await getDocs(collection(db, 'app_users'));
        document.getElementById('usersTbody').innerHTML = snap.docs.map(doc => {
            const data = doc.data();
            return `<tr onclick="window.loadSpecificUser('${doc.id}')"><td><b>${data.name || 'مستخدم'}</b></td><td>${data.email || '-'}</td></tr>`;
        }).join('');
        updateStatus("تم تحديث القائمة بنجاح", 'success');
        setTimeout(() => statusBox.style.display = 'none', 1500);
    } catch(err) {
        updateStatus("فشل الاتصال: يرجى التحقق من الشبكة وإعادة المحاولة", 'error');
    }
}

document.getElementById('reloadBtn').onclick = getAllUsers;

// وظيفة تحميل بيانات مستخدم محدد
window.loadSpecificUser = async (id) => {
    updateStatus("جاري تحميل بيانات الموظف المختارة...");
    try {
        const res = await getDoc(doc(db, 'app_users', id));
        if(res.exists()) {
            const data = res.data();
            document.getElementById('uId').value = id;
            document.getElementById('uName').value = data.name || "";
            document.getElementById('uEmail').value = data.email || "";
            document.querySelectorAll('.perm-check').forEach(box => {
                box.checked = data.permissions && data.permissions[box.dataset.id]?.view;
            });
            updateStatus("تم تحميل بيانات: " + (data.name || "الموظف"), 'success');
            setTimeout(() => statusBox.style.display = 'none', 1500);
        }
    } catch(err) {
        updateStatus("خطأ في جلب بيانات الموظف", 'error');
    }
};

// وظيفة الحفظ
document.getElementById('saveBtn').onclick = async () => {
    const userId = document.getElementById('uId').value;
    if(!userId) return alert("الرجاء اختيار موظف من القائمة أولاً");

    updateStatus("جاري محاولة الحفظ... يرجى الانتظار");
    const perms = {};
    document.querySelectorAll('.perm-check').forEach(box => {
        if(box.checked) perms[box.dataset.id] = { view: true, add: true };
    });

    try {
        await setDoc(doc(db, 'app_users', userId), {
            name: document.getElementById('uName').value,
            email: document.getElementById('uEmail').value,
            permissions: perms,
            lastUpdate: new Date()
        }, { merge: true });
        updateStatus("✅ تمت عملية الحفظ بنجاح", 'success');
        setTimeout(() => { statusBox.style.display = 'none'; getAllUsers(); }, 2000);
    } catch(err) {
        updateStatus("فشل الحفظ: جدار حماية الشبكة منع الاتصال", 'error');
    }
};
</script>
</body>
</html>
