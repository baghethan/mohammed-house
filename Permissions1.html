<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Permissions v2.4.0 - Diagnostics Mode</title>
  <style>
    :root{--primary:#0d2149;--accent:#1b4fa3;--error:#ef4444;--bg:#f8fafc;--border:#cbd5e1}
    body{font-family:'Segoe UI', Tahoma, sans-serif; background:var(--bg); padding:20px;}
    .card{background:#fff; border-radius:12px; padding:25px; box-shadow:0 4px 15px rgba(0,0,0,0.08); border:1px solid var(--border); max-width:850px; margin:auto}
    .diag-box{background:#1e293b; color:#34d399; padding:15px; border-radius:8px; font-family:monospace; font-size:12px; margin-bottom:20px; display:none; direction:ltr; text-align:left; border:2px solid #4ade80}
    .status-bar{padding:12px; border-radius:8px; text-align:center; font-weight:bold; margin-bottom:20px; font-size:14px; display:none}
    .loading{background:#e0f2fe; color:#0369a1}
    .error-msg{background:#fee2e2; color:#b91c1c}
    .btn-diag{background:#6366f1; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold; width:100%; margin-bottom:15px}
    .btn-action{width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer}
    .table-container{max-height:200px; overflow-y:auto; border:1px solid var(--border); margin-top:10px}
    table{width:100%; border-collapse:collapse}
    td{padding:10px; border-bottom:1px solid #eee; font-size:13px}
  </style>
</head>
<body>

<div class="card">
    <div id="statusBar" class="status-bar"></div>
    
    <div style="text-align:center; margin-bottom:20px">
        <h2 style="color:var(--primary); margin:0">إدارة الصلاحيات (v2.4.0)</h2>
        <p style="color:#64748b; font-size:11px">نظام فحص أعطال الشبكة - المجدوعي للسيارات</p>
    </div>

    <button class="btn-diag" id="diagBtn">🔍 بدء فحص وتتبع مسار الاتصال (Diagnostics)</button>
    <div id="diagBox" class="diag-box"></div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:15px">
        <div><label style="font-size:12px; font-weight:bold">الاسم</label><input id="uName" type="text" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc"></div>
        <div><label style="font-size:12px; font-weight:bold">البريد</label><input id="uEmail" type="email" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc"></div>
    </div>
    <input id="uId" type="hidden">

    <button class="btn-action" id="saveBtn">💾 حفظ التعديلات</button>

    <div style="margin-top:20px">
        <h3 style="font-size:14px">قائمة الموظفين:</h3>
        <div class="table-container">
            <table><tbody id="usersTbody"><tr><td>اضغط على فحص الاتصال بالأعلى لمعرفة السبب...</td></tr></tbody></table>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeFirestore, doc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { experimentalForceLongPolling: true, useFetchStreams: false });

const diagBox = document.getElementById('diagBox');
const statusBar = document.getElementById('statusBar');

function logDiag(text) {
    const time = new Date().toLocaleTimeString();
    diagBox.innerHTML += `[${time}] ${text}<br>`;
    diagBox.scrollTop = diagBox.scrollHeight;
}

async function runDiagnostics() {
    diagBox.style.display = 'block';
    diagBox.innerHTML = "--- STARTING FIREBASE NETWORK TEST ---<br>";
    logDiag("1. Checking Firebase SDK Initialization...");
    
    try {
        logDiag("2. Attempting to connect to Firestore (google.com)...");
        // اختبار الاتصال بطلب بسيط جداً
        const testRef = collection(db, 'app_users');
        logDiag("3. Sending Data Request (GET app_users)...");
        
        const timeout = setTimeout(() => {
            logDiag("!! TIMEOUT: No response from Google servers within 10s.");
            logDiag(">> Probable cause: Corporate Firewall blocking Port 443.");
        }, 10000);

        const snap = await getDocs(testRef);
        clearTimeout(timeout);
        
        logDiag(`4. SUCCESS: Received ${snap.size} records.`);
        document.getElementById('usersTbody').innerHTML = snap.docs.map(d => `<tr><td>${d.data().name}</td></tr>`).join('');
        
    } catch (e) {
        logDiag(`!! ERROR DETECTED: ${e.code}`);
        logDiag(`!! MESSAGE: ${e.message}`);
        
        if (e.code === 'unavailable') {
            logDiag(">> ANALYSIS: The backend is unreachable. Network is blocking the connection.");
        } else if (e.code === 'permission-denied') {
            logDiag(">> ANALYSIS: Connection OK, but Security Rules rejected access.");
        }
        
        statusBar.innerText = "فشل التحليل: يرجى تصوير الشاشة السوداء وإرسالها";
        statusBar.className = "status-bar error-msg";
        statusBar.style.display = "block";
    }
}

document.getElementById('diagBtn').onclick = runDiagnostics;
</script>
</body>
</html>
