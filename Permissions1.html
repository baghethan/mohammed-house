<!DOCTYPE html>
<html lang="ar" dir="rtl" id="permHtml">
<head>
  <meta charset="UTF-8" />
  <title>Permissions Management v1.7.0 - Ultra Fast</title>
  <style>
    :root{--primary:#0d2149;--primary-2:#1b4fa3;--green:#10b981;--red:#ef4444;--border:#e2e8f0;--bg:#f8fafc;--card:#fff;--radius:16px}
    *{box-sizing:border-box} 
    body{margin:0;font-family:'Segoe UI', Tahoma, sans-serif;background:var(--bg);padding:20px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,0.05);padding:20px;margin-bottom:20px}
    .card h3{margin:-20px -20px 20px;padding:15px 20px;background:var(--primary);color:#fff;font-size:15px;border-radius:16px 16px 0 0;font-weight:900; display:flex; justify-content:space-between; align-items:center;}
    .field{margin-bottom:15px} label{display:block;margin-bottom:5px;font-weight:800;font-size:13px;color:var(--primary)}
    input, select{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:10px;margin-top:10px}
    .p-item{padding:10px;border:1.5px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:8px;cursor:pointer;background:#fff}
    .p-item input{width:18px;height:18px; cursor:pointer}
    .btn-save{width:100%;padding:15px;background:linear-gradient(135deg, var(--primary), var(--primary-2));color:#fff;border:none;border-radius:12px;font-weight:900;cursor:pointer;font-size:15px}
    .loading-overlay{display:none; color:var(--primary); font-weight:bold; text-align:center; padding:10px;}
    table{width:100%;border-collapse:collapse;margin-top:10px}
    th, td{text-align:inherit;padding:12px;font-size:13px;border-bottom:1px solid var(--border)}
    .lang-btn{background:rgba(255,255,255,0.2); border:1px solid #fff; color:#fff; padding:4px 10px; border-radius:8px; cursor:pointer; font-size:11px;}
  </style>
</head>
<body>

<div style="max-width:900px;margin:0 auto">
    <div class="card">
        <h3>
            <span id="t-title">🔐 إدارة الصلاحيات (v1.7.0 - نسخة سريعة)</span>
            <button class="lang-btn" id="langBtn">English</button>
        </h3>
        <div id="loadingInfo" class="loading-overlay">جاري الاتصال بالقاعدة...</div>
        
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
            <div class="field"><label id="l-name">اسم المستخدم</label><input id="userName" type="text"></div>
            <div class="field"><label id="l-email">البريد الإلكتروني</label><input id="userEmail" type="email"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1.5fr;gap:15px">
            <div class="field"><label id="l-role">الدور الوظيفي</label>
                <select id="userRole">
                    <option value="Staff">Staff</option>
                    <option value="Admin">Admin</option>
                    <option value="SuperAdmin">SuperAdmin</option>
                </select>
            </div>
            <div class="field"><label id="l-uid">رقم المعرف (User UID)</label><input id="userUid" type="text" placeholder="انسخ الـ UID من القائمة بالأسفل"></div>
        </div>

        <label id="l-pages">حدد الصلاحيات المطلوبة:</label>
        <div class="grid" id="permsGrid"></div>
        <br>
        <button class="btn-save" id="saveBtn">حفظ التغييرات فوراً</button>
    </div>

    <div class="card">
        <h3 id="t-list">👥 المستخدمون (اضغط على الاسم للتعديل)</h3>
        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr><th id="th-user">المستخدم</th><th id="th-role">الدور</th><th id="th-status">UID</th></tr>
                </thead>
                <tbody id="usersList"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);

// الحل الحاسم للسرعة: إجبار المتصفح على استخدام الاتصال البسيط وتعطيل التدفق المستمر
const db = initializeFirestore(app, { 
    experimentalForceLongPolling: true,
    useFetchStreams: false
});

const TABS = {
    dashboard: "لوحة التحكم", schedule: "الجدول الأسبوعي", employees: "الموظفون", 
    annual: "الإجازات", planning: "خطة الإجازات", settings: "الإعدادات", permissions: "الصلاحيات"
};

// رسم المربعات
function drawPerms() {
    document.getElementById('permsGrid').innerHTML = Object.keys(TABS).map(id => `
        <label class="p-item">
            <input type="checkbox" class="p-check" data-id="${id}">
            <span>${TABS[id]}</span>
        </label>
    `).join('');
}
drawPerms();

// جلب المستخدمين فور فتح الصفحة (Fetch بدلاً من Listen) لتسريع الأداء
async function loadUsers() {
    try {
        const snap = await getDocs(collection(db, 'app_users'));
        document.getElementById('usersList').innerHTML = snap.docs.map(d => {
            const u = d.data();
            return `
                <tr onclick="window.editUser('${d.id}')" style="cursor:pointer">
                    <td><b>${u.name || 'بدون اسم'}</b></td>
                    <td>${u.role}</td>
                    <td style="font-size:10px; font-family:monospace">${d.id}</td>
                </tr>
            `;
        }).join('');
    } catch(e) { console.error(e); }
}
loadUsers();

// وظيفة التعديل السريع
window.editUser = async (id) => {
    document.getElementById('loadingInfo').style.display = 'block';
    try {
        const d = await getDoc(doc(db, 'app_users', id));
        if(!d.exists()) return;
        const u = d.data();
        document.getElementById('userUid').value = id;
        document.getElementById('userName').value = u.name || "";
        document.getElementById('userEmail').value = u.email || "";
        document.getElementById('userRole').value = u.role || "Staff";
        
        document.querySelectorAll('.p-check').forEach(cb => {
            cb.checked = u.permissions && u.permissions[cb.dataset.id]?.view;
        });
    } finally {
        document.getElementById('loadingInfo').style.display = 'none';
    }
};

// الحفظ السريع
document.getElementById('saveBtn').onclick = async () => {
    const uid = document.getElementById('userUid').value.trim();
    if(!uid) return alert("يرجى اختيار مستخدم أولاً");
    
    document.getElementById('saveBtn').innerText = "جاري الحفظ...";
    const permissions = {};
    document.querySelectorAll('.p-check').forEach(cb => {
        if(cb.checked) permissions[cb.dataset.id] = { view: true, add: true };
    });

    try {
        await setDoc(doc(db, 'app_users', uid), {
            name: document.getElementById('userName').value,
            email: document.getElementById('userEmail').value,
            role: document.getElementById('userRole').value,
            permissions: permissions,
            updatedAt: new Date()
        }, { merge: true });
        alert("✅ تم التحديث بنجاح!");
        loadUsers();
    } catch(e) { alert("خطأ في الحفظ: " + e.message); }
    document.getElementById('saveBtn').innerText = "حفظ التغييرات فوراً";
};
</script>
</body>
</html>
