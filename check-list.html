<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v2.1.8</title>
  <!-- مكتبة الاكسيل - ضرورية للتنزيل والرفع -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; line-height: 1.6; }
    .container { max-width: 1550px; margin: 20px auto; padding: 0 15px 30px; }
    .grid-main { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; transition: 0.3s; }
    .grid-full { grid-template-columns: 1fr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18,48,74,0.08); overflow: hidden; }
    .card h3 { margin: 0; padding: 14px 18px; background: var(--primary); color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 20px; }
    .section-title { margin: 20px 0 12px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding: 8px 12px; background: #f8fbff; font-size: 13px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .field label { font-size: 12px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 11px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; outline: none; background: #fbfcfe; }
    .field input[readonly] { background: #f1f5f9; }
    .excel-tools { display: flex; gap: 8px; }
    .btn-excel { background: #fff; color: var(--primary); border: 1px solid #fff; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-excel:hover { background: #eef6ff; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 15px; border-radius: 30px; font-weight: 800; width: 100%; font-size: 15px; margin-top: 25px; cursor: pointer; box-shadow: 0 4px 12px rgba(47,158,102,0.2); }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; max-height: 750px; background: #fff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 12px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 12px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; font-weight: 800; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: #f1f7fd; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <div id="mainLayout" class="grid-main">
      <section class="card">
        <h3>نموذج الفحص v2.1.8 <span id="roleBadge" style="font-weight:normal; font-size:10px;"></span></h3>
        <div class="card-body">
          <input id="editingChecklistId" type="hidden" />
          <div class="section-title">بيانات الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>1- الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>2- الزيارة المرتبطة</label><select id="cl_visit_ref"><option value="">اختر الفني أولاً</option></select></div>
            <div class="field"><label>3- البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>4- معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>5- المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>6- المنطقة</label><input id="cl_region" readonly /></div>
          </div>
          
          <div class="section-title">Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>1- Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>2- Brand Key</label><input id="cl_brandKey" /></div>
            <div class="field"><label>3- Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>4- Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>5- Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>6- Month</label><input id="cl_month" readonly /></div>
          </div>

          <div id="dynamicChecklistSections"></div>
          <button class="btn-save" id="saveChecklistBtn">حفظ البيانات والمزامنة ✅</button>
          <button class="btn-save" id="newFormBtn" style="background:var(--primary); display:none; margin-top:10px;" onclick="location.reload()">إنشاء تقرير جديد ➕</button>
        </div>
      </section>

      <aside id="adminSidebar" class="card">
        <h3>السجلات المحفوظة <div class="excel-tools"><button class="btn-excel" id="exportExcelBtn">Excel 📥</button><div style="position:relative;overflow:hidden;display:inline-block;"><button class="btn-excel">رفع 📤</button><input type="file" id="importExcelInput" accept=".xlsx" style="position:absolute;inset:0;opacity:0;cursor:pointer;" /></div></div></h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;" />
          <div class="table-wrap">
            <table><thead><tr><th>التاريخ</th><th>الفني</th><th>الموقع</th></tr></thead><tbody id="checklistTableBody"></tbody></table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    var state = { checklists: [], checklistFields: [], technicians: [], userProfile: null, canEdit: false };
    const $ = (id) => document.getElementById(id);

    function resolveRef(fieldId, fieldLabel) {
      return (fieldId && state.checklistFields.find(f => f.id === fieldId)) || 
             (fieldLabel && state.checklistFields.find(f => f.label === fieldLabel)) || null;
    }

    async function checkAuth() {
      const auth = window.parent.appAuth; const db = window.parent.appDb;
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) {
            state.userProfile = doc.data();
            state.canEdit = (state.userProfile.role === 'admin' || state.userProfile.role === 'supervisor');
            applyPrivacyUI();
          }
          boot();
        }
      });
    }

    function applyPrivacyUI() {
      if (!state.canEdit) { $('adminSidebar').classList.add('hidden'); $('mainLayout').classList.add('grid-full'); $('roleBadge').innerText = "(فني)"; }
      else { $('adminSidebar').classList.remove('hidden'); $('mainLayout').classList.remove('grid-full'); $('roleBadge').innerText = "(مسؤول)"; }
    }

    // وظيفة فتح السجل المحفوظ للتعديل
    window.openChecklistLocally = async function(id) {
      const row = state.checklists.find(r => r.id === id);
      if (!row) return;
      $('editingChecklistId').value = row.id;
      $('cl_technician').value = row.technicianDocId || '';
      await loadVisitsForTech(row.technicianDocId, row.visitDocId);
      ['technicianEmail','technicianId','city','region','brand','brandKey','branchId','locationSite','visitDate','month'].forEach(k => {
        const inputId = 'cl_' + (k==='locationSite'?'location':k==='branchId'?'branch_id':k);
        if ($(inputId)) $(inputId).value = row[k] || '';
      });
      renderDynamicForm(row.dynamicAnswers || {});
      if (!state.canEdit) { $('saveChecklistBtn').style.display='none'; $('newFormBtn').style.display='block'; }
    };

    async function loadVisitsForTech(techId, visitId = null) {
      const db = window.parent.appDb;
      const vSnap = await db.collection('siteVisits').where('technicianDocId', '==', techId).get();
      const visits = vSnap.docs.map(d => ({id:d.id, ...d.data()}));
      $('cl_visit_ref').innerHTML = '<option value="">اختر الزيارة</option>' + visits.map(v => `<option value="${v.id}" ${visitId===v.id?'selected':''}>${v.date} - ${v.branchName}</option>`).join('');
    }

    async function boot() {
      const db = window.parent.appDb;
      db.collection('branch_checklists').orderBy('createdAt','desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        if (state.canEdit) renderTable();
      });

      db.collection('technicians').onSnapshot(snap => {
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });

      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (Number(a.order)||0)-(Number(b.order)||0));
        renderDynamicForm();
      });

      $('cl_technician').onchange = (e) => {
        const tech = state.technicians.find(t => t.id === e.target.value);
        if (tech) { $('cl_technician_email').value = tech.email||''; $('cl_technician_id').value = tech.authUid||tech.id; loadVisitsForTech(e.target.value); }
      };

      // ميزة تصدير الإكسيل
      $('exportExcelBtn').onclick = () => {
        const data = state.checklists.map(r => ({ "ID": r.id, "التاريخ": r.visitDate, "الفني": r.technicianName, "الفرع": r.locationSite, "المدينة": r.city }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Reports");
        XLSX.writeFile(wb, "Reports_Export.xlsx");
      };

      // ميزة رفع وتصحيح الإكسيل
      $('importExcelInput').onchange = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          const workbook = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
          for (const row of rows) {
            if (row.ID) await db.collection('branch_checklists').doc(row.ID).update({ city: row["المدينة"]||'', locationSite: row["الفرع"]||'' });
          }
          alert("تم تحديث البيانات بنجاح!"); location.reload();
        };
        reader.readAsArrayBuffer(file);
      };

      $('saveChecklistBtn').onclick = saveChecklist;
    }

    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      container.innerHTML = '';
      const currentAnswers = Object.keys(answers).length ? answers : collectAnswers();
      state.checklistFields.forEach(field => {
        if (field.logic?.enabled && field.logic?.visibleWhen) {
          const rule = field.logic.visibleWhen;
          const srcField = resolveRef(rule.fieldId, rule.fieldLabel);
          if (String(srcField ? currentAnswers[srcField.id] : '').toLowerCase() !== String(rule.value).toLowerCase()) return;
        }
        let html = `<div class="field"><label>${esc(field.labelAr || field.label)}</label>`;
        if (field.repeat?.enabled) {
          const countSrc = resolveRef(field.repeat.countFromFieldId, field.repeat.countFromFieldLabel);
          const count = Number(countSrc ? currentAnswers[countSrc.id] : 0);
          for (let i = 0; i < count; i++) {
            const label = String(field.repeat.labelTemplate || '{index}').replace('{index}', i + 1);
            html += `<div class="field" style="margin-top:8px;"><label>${esc(label)}</label><input type="text" class="dyn-input" data-id="${field.id}" data-index="${i}" value="${esc(currentAnswers[field.id]?.[i]||'')}" onchange="renderDynamicForm(collectAnswers())" /></div>`;
          }
        } else {
          const val = currentAnswers[field.id] || '';
          if (field.fieldType === 'choice') {
            html += `<select class="dyn-input" data-id="${field.id}" onchange="renderDynamicForm(collectAnswers())"><option value="">اختر</option>${(field.options||[]).map(o=>`<option value="${o.value}" ${val==o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
          } else {
            html += `<input type="text" class="dyn-input" data-id="${field.id}" value="${esc(val)}" onchange="renderDynamicForm(collectAnswers())" />`;
          }
        }
        container.innerHTML += html + `</div>`;
      });
    }

    function collectAnswers() {
      const ans = {};
      document.querySelectorAll('.dyn-input').forEach(el => {
        const id = el.dataset.id;
        if (el.dataset.index !== undefined) { if (!ans[id]) ans[id] = []; ans[id][el.dataset.index] = el.value; }
        else ans[id] = el.value;
      });
      return ans;
    }

    async function saveChecklist() {
      const db = window.parent.appDb; const answers = collectAnswers();
      const techDropdown = $('cl_technician'); const techName = techDropdown.options[techDropdown.selectedIndex].text;
      const payload = {
        technicianDocId: techDropdown.value, technicianName: techName,
        visitDocId: $('cl_visit_ref').value, locationSite: $('cl_location').value,
        city: $('cl_city').value, visitDate: $('cl_visit_date').value,
        dynamicAnswers: answers, createdAt: new Date().toISOString()
      };
      const id = $('editingChecklistId').value;
      if (id) await db.collection('branch_checklists').doc(id).update(payload);
      else await db.collection('branch_checklists').add(payload);
      alert("تم الحفظ بنجاح!"); location.reload();
    }

    function renderTable() {
      $('checklistTableBody').innerHTML = state.checklists.map(r => `<tr class="clickable" onclick="openChecklistLocally('${r.id}')"><td>${esc(r.visitDate)}</td><td>${esc(r.technicianName)}</td><td>${esc(r.locationSite)}</td></tr>`).join('');
    }
    checkAuth();
  })();
  </script>
</body>
</html>
