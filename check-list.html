<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>MMC IT Audit Checklist v3.1.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0d2149; --accent: #1b4fa3; --bg: #f1f5f9; --border: #cbd5e1; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 15px; margin: 0; color: #1e293b; }
        .card { background: #fff; border-radius: 12px; padding: 25px; border: 1px solid var(--border); max-width: 1350px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .section-title { background: #f8fafc; padding: 12px 15px; border-radius: 8px; border-left: 6px solid var(--primary); font-weight: bold; margin: 25px 0 15px; color: var(--primary); font-size: 14px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 10px; font-weight: 800; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        input[readonly] { background: #f8fafc; }
        .dynamic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .check-card { background: #fff; border: 1px solid var(--border); padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        .btn-main { width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.3s; }
        .btn-main:hover { background: var(--accent); transform: translateY(-2px); }
        .admin-panel { margin-top: 40px; padding-top: 25px; border-top: 3px dashed var(--border); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background: #f8fafc; font-weight: 800; }
        .hidden { display: none !important; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; background: #e2e8f0; }
    </style>
</head>
<body>

<div class="card">
    <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="margin:0; color: var(--primary);">MMC Technical Check-List v3.1.0</h2>
        <div id="userStatus" class="badge">Checking Authentication...</div>
    </div>

    <!-- 1. الربط مع الفني والزيارة -->
    <div class="section-title">1. Technician & Geography Assignment</div>
    <div class="grid-4">
        <div class="form-group"><label>Technician</label><select id="techSelect"></select></div>
        <div class="form-group"><label>Linked Visit ID</label><select id="visitSelect"></select></div>
        <div class="form-group"><label>Tech ID</label><input type="text" id="techId" readonly></div>
        <div class="form-group"><label>Tech Email</label><input type="text" id="techEmail" readonly></div>
        <div class="form-group"><label>City</label><input type="text" id="city" readonly></div>
        <div class="form-group"><label>Region</label><input type="text" id="region" readonly></div>
    </div>

    <!-- 2. Basic Information (Auto-Filled) -->
    <div class="section-title">2. Basic Branch Information</div>
    <div class="grid-4">
        <div class="form-group"><label>Brand</label><input type="text" id="brand" readonly></div>
        <div class="form-group"><label>Brand Key</label><input type="text" id="brandKey" readonly></div>
        <div class="form-group"><label>Branch ID</label><input type="text" id="branchId" readonly></div>
        <div class="form-group"><label>Location/Site</label><input type="text" id="location" readonly></div>
        <div class="form-group"><label>Manager ID</label><input type="text" id="mgrId" placeholder="MGR-000"></div>
        <div class="form-group"><label>Manager Name</label><input type="text" id="mgrName" placeholder="Full Name"></div>
        <div class="form-group">
            <label>Visit Scheduled?</label>
            <select id="isScheduled"><option value="Yes">Yes</option><option value="No">No</option></select>
        </div>
        <div class="form-group"><label>Visit Date</label><input type="text" id="vDate" readonly></div>
    </div>

    <!-- 3. Dynamic IT Audit Checklist -->
    <div class="section-title">3. Dynamic IT Audit Checklist</div>
    <div id="dynamicGrid" class="dynamic-grid"></div>

    <div style="margin-top:20px" class="grid-4">
        <div style="grid-column: span 2">
            <label>IT Assets / Unused Assets Notes</label>
            <textarea id="itNotes" rows="4"></textarea>
        </div>
        <div><label>Number of devices (Q29A)</label><input type="number" id="q29a"></div>
        <div><label>Employee IDs (Q29B)</label><input type="text" id="q29b"></div>
    </div>

    <button class="btn-main" id="submitBtn">💾 Submit Check-List & Deploy Policies</button>

    <!-- Admin Section -->
    <div id="adminArea" class="admin-panel hidden">
        <div class="section-title">🛡️ Administrative Controls & Master Records</div>
        <div style="display:flex; gap:10px; margin-bottom:20px">
            <button onclick="smartExport()" style="background:#166534; color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer">📥 Smart Excel Export</button>
            <button onclick="document.getElementById('xlFile').click()" style="background:#0369a1; color:white; padding:10px 20px; border:none; border-radius:6px; cursor:pointer">📤 Import History (XL)</button>
            <input type="file" id="xlFile" class="hidden" accept=".xlsx, .xls">
        </div>
        <div style="overflow-x:auto">
            <table>
                <thead><tr><th>Date</th><th>Tech</th><th>Brand</th><th>Branch</th><th>Location</th><th>Manager</th><th>Control</th></tr></thead>
                <tbody id="recordsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, getDoc, getDocs, setDoc, collection, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const config = { apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs", authDomain: "baghethan-ba325.firebaseapp.com", projectId: "baghethan-ba325" };
    const app = initializeApp(config);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let role = "technician", cUser = null, visits = [], fields = [], editingId = null;

    onAuthStateChanged(auth, async (u) => {
        if (u) {
            cUser = u;
            const snap = await getDoc(doc(db, 'app_users', u.uid));
            role = snap.data()?.role || "technician";
            document.getElementById('userStatus').innerText = `Role: ${role.toUpperCase()}`;
            if (role === 'admin') document.getElementById('adminArea').classList.remove('hidden');
            start();
        } else { location.href = "login.html"; }
    });

    async function start() {
        await loadFields();
        await loadTechs();
        await loadVisits();
        if (role === 'admin') loadRecords();
    }

    async function loadFields() {
        const snap = await getDocs(collection(db, 'checklist_fields'));
        fields = snap.docs.map(d => ({id: d.id, ...d.data()}));
        document.getElementById('dynamicGrid').innerHTML = fields.map(f => `
            <label class="check-card">
                <input type="checkbox" class="d-field" data-id="${f.id}">
                <span>${f.label}</span>
            </label>
        `).join('');
    }

    async function loadTechs() {
        const snap = await getDocs(collection(db, 'app_users'));
        const sel = document.getElementById('techSelect');
        sel.innerHTML = '<option value="">Select Tech</option>';
        snap.docs.forEach(d => {
            const u = d.data();
            const opt = new Option(u.name, d.id);
            if(d.id === cUser.uid) opt.selected = true;
            sel.add(opt);
        });
        updateTechUI(cUser.uid);
    }

    async function updateTechUI(uid) {
        const d = await getDoc(doc(db, 'app_users', uid));
        if (d.exists()) {
            const u = d.data();
            document.getElementById('techId').value = u.technicianId || "-";
            document.getElementById('techEmail').value = u.email || "-";
            document.getElementById('city').value = u.city || "Dammam";
            document.getElementById('region').value = u.region || "Eastern";
        }
    }

    async function loadVisits() {
        const vSnap = await getDocs(collection(db, 'siteVisits'));
        const sSnap = await getDocs(collection(db, 'checkList_submissions'));
        const done = sSnap.docs.map(d => d.data().visitId);
        visits = vSnap.docs.map(d => ({id: d.id, ...d.data()}));
        const sel = document.getElementById('visitSelect');
        sel.innerHTML = '<option value="">Select Visit</option>';
        visits.forEach(v => {
            if (role === 'admin' || (v.technicianId === cUser.uid && !done.includes(v.id))) {
                sel.add(new Option(`Visit ${v.id} - ${v.branchName}`, v.id));
            }
        });
    }

    document.getElementById('visitSelect').onchange = (e) => {
        const v = visits.find(x => x.id === e.target.value);
        if (v) {
            document.getElementById('brand').value = v.brand || "";
            document.getElementById('brandKey').value = v.brandKey || "";
            document.getElementById('branchId').value = v.branchId || "";
            document.getElementById('location').value = v.branchName || "";
            document.getElementById('vDate').value = v.visitDate || "";
        }
    };

    document.getElementById('submitBtn').onclick = async () => {
        const vid = document.getElementById('visitSelect').value;
        if (!vid) return alert("Select Visit!");

        const checks = {};
        document.querySelectorAll('.d-field').forEach(i => checks[i.dataset.id] = i.checked);

        const data = {
            visitId: vid,
            techUid: document.getElementById('techSelect').value,
            techId: document.getElementById('techId').value,
            brand: document.getElementById('brand').value,
            brandKey: document.getElementById('brandKey').value,
            branchId: document.getElementById('branchId').value,
            location: document.getElementById('location').value,
            mgrId: document.getElementById('mgrId').value,
            mgrName: document.getElementById('mgrName').value,
            isScheduled: document.getElementById('isScheduled').value,
            visitDate: document.getElementById('vDate').value,
            itNotes: document.getElementById('itNotes').value,
            q29a: document.getElementById('q29a').value,
            q29b: document.getElementById('q29b').value,
            dynamicChecks: checks,
            savedAt: new Date().toISOString()
        };

        const docId = editingId || `sub_${vid}`;
        await setDoc(doc(db, 'checkList_submissions', docId), data, {merge: true});
        alert("Success!");
        location.reload();
    };

    async function loadRecords() {
        const snap = await getDocs(collection(db, 'checkList_submissions'));
        document.getElementById('recordsBody').innerHTML = snap.docs.map(d => {
            const r = d.data();
            return `<tr>
                <td>${r.visitDate}</td><td>${r.techId}</td><td>${r.brand}</td>
                <td>${r.branchId}</td><td>${r.location}</td><td>${r.mgrName}</td>
                <td><button onclick="window.editRecord('${d.id}')">Edit</button></td>
            </tr>`;
        }).join('');
    }

    window.editRecord = async (id) => {
        editingId = id;
        const d = await getDoc(doc(db, 'checkList_submissions', id));
        const r = d.data();
        document.getElementById('visitSelect').innerHTML = `<option value="${r.visitId}">${r.visitId}</option>`;
        document.getElementById('techSelect').value = r.techUid;
        document.getElementById('brand').value = r.brand;
        document.getElementById('brandKey').value = r.brandKey;
        document.getElementById('branchId').value = r.branchId;
        document.getElementById('location').value = r.location;
        document.getElementById('mgrId').value = r.mgrId;
        document.getElementById('mgrName').value = r.mgrName;
        document.getElementById('itNotes').value = r.itNotes;
        document.getElementById('q29a').value = r.q29a;
        document.getElementById('q29b').value = r.q29b;
        document.querySelectorAll('.d-field').forEach(i => i.checked = r.dynamicChecks[i.dataset.id]);
        window.scrollTo(0,0);
    };

    window.smartExport = async () => {
        const snap = await getDocs(collection(db, 'checkList_submissions'));
        const rows = snap.docs.map(d => {
            const r = d.data();
            const base = {Date: r.visitDate, Tech: r.techId, Brand: r.brand, Branch: r.branchId, Manager: r.mgrName, Notes: r.itNotes};
            fields.forEach(f => base[f.label] = r.dynamicChecks[f.id] ? "Pass" : "Fail");
            return base;
        });
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Reports");
        XLSX.writeFile(wb, "MMC_Smart_Audit.xlsx");
    };
</script>
</body>
</html>
