<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v2.2.4</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; font-size: 13px; }
    .container { max-width: 98%; margin: 15px auto; padding-bottom: 30px; }
    .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-full { grid-template-columns: 1fr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 25px rgba(18,48,74,0.06); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 15px; }
    .section-title { margin: 15px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding: 5px 10px; background: #f8fbff; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .field label { font-size: 11px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; outline: none; background: #fbfcfe; }
    .btn-tool { padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .btn-download { background: #fff; color: var(--green); border-color: var(--green); }
    .btn-upload { background: #fff; color: var(--primary); border-color: var(--primary); position: relative; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 14px; border-radius: 30px; font-weight: 800; width: 100%; font-size: 14px; margin-top: 20px; cursor: pointer; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; max-height: 750px; background: #fff; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 10px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <div id="mainLayout" class="grid-main">
      <!-- نموذج الإدخال -->
      <section class="card">
        <h3>نموذج الفحص v2.2.4 <span id="roleBadge"></span></h3>
        <div class="card-body">
          <input id="editingChecklistId" type="hidden" />
          <div class="section-title">بيانات الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>الزيارة</label><select id="cl_visit_ref"></select></div>
            <div class="field"><label>المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>Location/Site</label><input id="cl_location" readonly /></div>
          </div>
          <div id="dynamicChecklistSections"></div>
          <button class="btn-save" id="saveChecklistBtn">حفظ البيانات ✅</button>
        </div>
      </section>

      <!-- إدارة السجلات والإكسيل (للأدمن) -->
      <aside id="adminSidebar" class="card">
        <h3>
          السجلات المحفوظة
          <div class="excel-tools" style="display:flex; gap:5px;">
            <button class="btn-tool btn-download" id="exportExcelBtn">تنزيل Excel 📥</button>
            <div class="btn-tool btn-upload">
                رفع وتحديث 📤
                <input type="file" id="importExcelInput" accept=".xlsx" style="position:absolute; inset:0; opacity:0; cursor:pointer;" />
            </div>
          </div>
        </h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:8px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;" />
          <div class="table-wrap">
            <table id="mainTable">
                <thead><tr id="tableHeaderRow"></tr></thead>
                <tbody id="checklistTableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    var state = { checklists: [], checklistFields: [], technicians: [], userProfile: null, canEdit: false };
    const $ = (id) => document.getElementById(id);

    // 1. وظيفة تصدير كافة الأعمدة
    function exportToExcel() {
      const data = state.checklists.map(r => {
        const row = { "ID": r.id, "تاريخ الزيارة": r.visitDate, "الفني": r.technicianName, "Brand": r.brand, "Branch ID": r.branchId, "Location/Site": r.locationSite, "مدير الفرع": r.branchManager };
        state.checklistFields.forEach(f => {
          const ans = r.dynamicAnswers?.[f.id];
          row[f.labelAr || f.label] = Array.isArray(ans) ? ans.join(', ') : ans;
        });
        return row;
      });
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Checklist_Data");
      XLSX.writeFile(wb, `AlMajdouie_Full_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    // 2. وظيفة رفع وتحديث كافة الأعمدة
    async function handleImport(e) {
      const file = e.target.files[0]; if (!file) return;
      if (!confirm("سيتم تحديث البيانات بناءً على ملف Excel. هل أنت متأكد؟")) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        const db = window.parent.appDb;
        const workbook = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        
        let count = 0;
        for (const row of rows) {
          const recordId = row["ID"];
          if (!recordId) continue;

          // تحضير البيانات الأساسية
          const basePayload = {
            visitDate: row["تاريخ الزيارة"] || "",
            locationSite: row["Location/Site"] || "",
            branchManager: row["مدير الفرع"] || "",
            dynamicAnswers: {}
          };

          // مطابقة الأعمدة الديناميكية
          state.checklistFields.forEach(f => {
            const colName = f.labelAr || f.label;
            if (row[colName] !== undefined) {
              basePayload.dynamicAnswers[f.id] = row[colName];
            }
          });

          await db.collection('branch_checklists').doc(recordId).update(basePayload);
          count++;
        }
        alert(`تم تحديث ${count} سجل بنجاح!`);
        location.reload();
      };
      reader.readAsArrayBuffer(file);
    }

    async function checkAuth() {
      const auth = window.parent.appAuth; const db = window.parent.appDb;
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) { 
            state.userProfile = doc.data(); 
            state.canEdit = (state.userProfile.role === 'admin' || state.userProfile.role === 'supervisor'); 
            applyPrivacyUI(); 
          }
          boot();
        }
      });
    }

    function applyPrivacyUI() {
      if (!state.canEdit) { $('adminSidebar').classList.add('hidden'); $('mainLayout').classList.add('grid-full'); }
    }

    async function boot() {
      const db = window.parent.appDb;
      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (Number(a.order)||0)-(Number(b.order)||0));
        renderDynamicForm();
        updateTableHeaders();
      });
      db.collection('branch_checklists').orderBy('createdAt','desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        if(state.canEdit) renderTable();
      });
      db.collection('technicians').onSnapshot(snap => {
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });

      $('exportExcelBtn').onclick = exportToExcel;
      $('importExcelInput').onchange = handleImport;
      $('saveChecklistBtn').onclick = saveChecklist;
    }

    function updateTableHeaders() {
      const row = $('tableHeaderRow');
      row.innerHTML = `<th>تاريخ الزيارة</th><th>الفني</th><th>Brand</th><th>Branch ID</th><th>Location/Site</th><th>مدير الفرع</th>`;
      state.checklistFields.forEach(f => { row.innerHTML += `<th>${esc(f.labelAr || f.label)}</th>`; });
    }

    function renderTable() {
      const body = $('checklistTableBody'); body.innerHTML = '';
      state.checklists.forEach(r => {
        let html = `<td>${esc(r.visitDate)}</td><td>${esc(r.technicianName)}</td><td>${esc(r.brand)}</td><td>${esc(r.branchId)}</td><td>${esc(r.locationSite)}</td><td>${esc(r.branchManager)}</td>`;
        state.checklistFields.forEach(f => {
            const ans = r.dynamicAnswers?.[f.id];
            html += `<td>${esc(Array.isArray(ans) ? ans.join(', ') : ans)}</td>`;
        });
        body.innerHTML += `<tr class="clickable" onclick="openChecklistLocally('${r.id}')">${html}</tr>`;
      });
    }

    // محرك النماذج والجمع (كما في الإصدارات السابقة لضمان الاستقرار)
    function renderDynamicForm(answers = {}) { /* ... محرك v2.2.3 ... */ }
    function collectAnswers() { /* ... محرك v2.2.3 ... */ }
    async function saveChecklist() { /* ... محرك v2.2.3 ... */ }

    checkAuth();
  })();
  </script>
</body>
</html>
