<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v3.1.9</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; font-size: 13px; }
    .container { max-width: 98%; margin: 15px auto; padding-bottom: 30px; }
    .grid-main { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 15px; transition: 0.3s; }
    .grid-full { grid-template-columns: 1fr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 25px rgba(18,48,74,0.06); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 20px; }
    .section-title { margin: 15px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding: 5px 12px; background: #f8fbff; font-size: 13px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
    .field label { font-size: 11px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 9px; font-size: 12px; outline: none; background: #fbfcfe; }
    .field input[readonly] { background: #f1f5f9; cursor: not-allowed; }
    .excel-tools { display: flex; gap: 8px; }
    .btn-tool { padding: 6px 12px; border-radius: 7px; font-size: 10px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn-download { background: #fff; color: var(--green); border-color: var(--green); }
    .btn-upload { background: #fff; color: var(--primary); border-color: var(--primary); position: relative; overflow: hidden; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 16px; border-radius: 35px; font-weight: 800; width: 100%; font-size: 15px; margin-top: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(47,158,102,0.25); }
    .choices-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .pill-box { border: 1px solid #d1d9e6; border-radius: 40px; padding: 7px 18px; display: flex; align-items: center; gap: 12px; background: #fff; cursor: pointer; font-size: 11px; transition: 0.2s; min-width: 150px; }
    .pill-box.selected { border-color: var(--primary); background: #eef6ff; font-weight: 700; }
    .pill-box input { width: 16px; height: 16px; accent-color: var(--primary); }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; max-height: 800px; background: #fff; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 14px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 11px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; font-weight: 800; }
    tr.clickable { cursor: pointer; transition: 0.2s; }
    tr.clickable:hover { background: #f1f7fd; }
    .notice { margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid #c7d7e8; background: #f8fbff; color: #0d4b73; font-weight: 800; }
    .notice.warn { border-color: #fdba74; background: #fff7ed; color: #9a3412; }
    .notice.ok { border-color: #86efac; background: #ecfdf5; color: #166534; }
    select:disabled, input:disabled, button:disabled { opacity: 0.68; cursor: not-allowed; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <div id="mainLayout" class="grid-main">
      <section class="card">
        <h3>نموذج الفحص v3.1.9 (Native Object Sync) <span id="roleBadge" style="font-size:10px;"></span></h3>
        <div class="card-body">
          <div id="technicianNotice" class="notice hidden"></div>
          <input id="editingChecklistId" type="hidden" />
          <div class="section-title">1- بيانات الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>الفني *</label><select id="cl_technician"></select></div>
            <div class="field"><label>الزيارة المرتبطة *</label><select id="cl_visit_ref"><option value="">اختر الفني أولاً</option></select></div>
            <div class="field"><label>البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>المنطقة</label><input id="cl_region" readonly /></div>
          </div>
          <div class="section-title">2- Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>Department</label><input id="cl_department" readonly /></div>
            <div class="field"><label>Brand Key</label><input id="cl_brandKey" /></div>
            <div class="field"><label>Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>مدير الفرع</label><input id="cl_branch_manager" placeholder="ID / Name" /></div>
            <div class="field"><label>Visit Scheduled</label><select id="cl_visit_scheduled"><option value="">اختر</option><option value="yes">Yes</option><option value="no">No</option></select></div>
            <div class="field"><label>Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>Month</label><input id="cl_month" readonly /></div>
          </div>
          <div class="section-title">3- Dynamic Check-List</div>
          <div class="grid-fields">
            <div class="field"><label>Visit Type / نوع الزيارة *</label><select id="cl_visit_type" multiple size="3"><option value="normal">Normal Visit / زيارة عادية</option><option value="troubleshooting">Hardware / هاردوير</option><option value="networkDown">Networks / شبكات</option></select></div>
            <div class="field"><label>All Items / البنود العامة</label><select id="cl_include_all_items"><option value="false">لا تعرض All</option><option value="true">اعرض All مع نوع الزيارة</option></select></div>
          </div>
          <div id="dynamicChecklistSections"></div>
          <button class="btn-save" id="saveChecklistBtn">حفظ وإرسال التقرير ✅</button>
          <button class="btn-save" id="newFormBtn" style="background:var(--primary); display:none; margin-top:10px;" onclick="location.reload()">إنشاء تقرير جديد ➕</button>
        </div>
      </section>

      <aside id="adminSidebar" class="card hidden">
        <h3>السجلات المحفوظة <div class="excel-tools"><button class="btn-excel btn-tool btn-download" id="exportExcelBtn">Excel 📥</button><div class="btn-tool btn-upload">رفع وتحديث 📤<input type="file" id="importExcelInput" accept=".xlsx" style="position:absolute; inset:0; opacity:0; cursor:pointer;" /></div></div></h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;" />
          <div class="table-wrap"><table id="mainTable"><thead><tr id="tableHeaderRow"></tr></thead><tbody id="checklistTableBody"></tbody></table></div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    // الحل النهائي: بناء الكائن باستخدام الـ Constructor الخاص بالنافذة الأم مباشرة
    const nativeClean = (data) => {
      if (data === null || typeof data !== 'object') return data;
      if (Array.isArray(data)) return window.parent.Array.from(data.map(nativeClean));
      const obj = new window.parent.Object();
      for (const key in data) {
        if (Object.prototype.hasOwnProperty.call(data, key)) {
          obj[key] = nativeClean(data[key]);
        }
      }
      return obj;
    };

    const esc = (v) => String(v == null || v === 'undefined' ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    const VISIT_TYPES = ['normal', 'troubleshooting', 'networkDown'];
    function normalizeFieldVisitType(value) { return ['all', ...VISIT_TYPES].includes(value) ? value : 'all'; }
    function normalizeFieldVisitTypes(value) {
      const source = Array.isArray(value) ? value : (value ? [value] : []);
      const normalized = [...new Set(source.map(normalizeFieldVisitType))];
      return normalized.length ? normalized : ['all'];
    }
    function getSelectedVisitTypes() {
      return Array.from($('cl_visit_type')?.selectedOptions || []).map(option => option.value).filter(Boolean);
    }
    function setSelectedVisitTypes(values) {
      const selected = new Set(Array.isArray(values) ? values : (values ? [values] : []));
      Array.from($('cl_visit_type')?.options || []).forEach(option => {
        option.selected = selected.has(option.value);
      });
    }
    function isFieldForVisitType(field, selectedVisitTypes) {
      const selected = Array.isArray(selectedVisitTypes) ? selectedVisitTypes : [selectedVisitTypes].filter(Boolean);
      const fieldVisitTypes = normalizeFieldVisitTypes(Array.isArray(field?.visitTypes) && field.visitTypes.length ? field.visitTypes : field?.visitType);
      const includeAll = $('cl_include_all_items')?.value === 'true';
      return selected.length > 0 && (fieldVisitTypes.some(type => selected.includes(type)) || (includeAll && fieldVisitTypes.includes('all')));
    }
    function normalizeVisibilityValue(value) { return Array.isArray(value) ? value.join(' ') : String(value ?? ''); }
    function canonicalVisibilityValue(value) {
      const v = normalizeVisibilityValue(value).trim().toLowerCase();
      if (v.includes('indoor') && v.includes('outdoor')) return 'indoor_outdoor';
      if (v.includes('indoor')) return 'indoor_only';
      if (v.includes('outdoor')) return 'outdoor_only';
      return v;
    }
    function splitVisibilityValues(value) {
      return normalizeVisibilityValue(value).split(/[\n,،|/;]+/).map(v => v.trim().toLowerCase()).filter(Boolean);
    }
    function visibilityValueCandidates(value) {
      const raw = normalizeVisibilityValue(value).trim().toLowerCase();
      const parts = splitVisibilityValues(value);
      const candidates = new Set();
      [raw, ...parts].filter(Boolean).forEach(part => {
        candidates.add(part);
        candidates.add(canonicalVisibilityValue(part));
      });
      return candidates;
    }
    function matchesVisibilityRule(sourceVal, rule) {
      const actual = normalizeVisibilityValue(sourceVal).trim().toLowerCase();
      const expected = normalizeVisibilityValue(rule?.value).trim().toLowerCase();
      const expectedList = splitVisibilityValues(rule?.value);
      const actualCandidates = visibilityValueCandidates(sourceVal);
      const expectedCandidates = visibilityValueCandidates(rule?.value);
      const hasAnyMatch = [...actualCandidates].some(value => expectedCandidates.has(value));
      const operator = String(rule?.operator || 'equals').trim().toLowerCase();
      let match = false;
      switch (operator) {
        case 'equalsAny':
        case 'equalsany':
        case 'equals_any':
        case 'or':
          match = hasAnyMatch;
          break;
        case 'equals':
          match = actual === expected || hasAnyMatch;
          break;
        case 'notEqualsAny':
        case 'notequalsany':
        case 'not_equals_any':
          match = !hasAnyMatch;
          break;
        case 'notEquals':
        case 'notequals':
        case 'not_equals':
          match = !(actual === expected || hasAnyMatch);
          break;
        case 'contains':
          match = expectedList.length ? expectedList.some(v => actual.includes(v)) : actual.includes(expected);
          break;
        case 'notContains':
        case 'notcontains':
        case 'not_contains':
          match = expectedList.length ? expectedList.every(v => !actual.includes(v)) : !actual.includes(expected);
          break;
        case 'startsWith':
        case 'startswith':
        case 'starts_with':
          match = expectedList.length ? expectedList.some(v => actual.startsWith(v)) : actual.startsWith(expected);
          break;
        case 'endsWith':
        case 'endswith':
        case 'ends_with':
          match = expectedList.length ? expectedList.some(v => actual.endsWith(v)) : actual.endsWith(expected);
          break;
        case 'isEmpty':
        case 'isempty':
        case 'is_empty':
          match = !actual;
          break;
        case 'isNotEmpty':
        case 'isnotempty':
        case 'is_not_empty':
          match = !!actual;
          break;
        default:
          match = actual === expected || hasAnyMatch;
      }
      console.log('[Checklist OR Debug]', {
        operator,
        actualSelectedValue: actual,
        expectedValues: expectedList,
        actualCandidates: [...actualCandidates],
        expectedCandidates: [...expectedCandidates],
        match
      });
      return match;
    }
    function findChecklistFieldByNames(names) {
      const normalized = names.map(name => normalizeVisibilityValue(name).trim().toLowerCase()).filter(Boolean);
      return state.checklistFields.find(field => {
        const keys = [field.id, field.label, field.labelAr].map(value => normalizeVisibilityValue(value).trim().toLowerCase()).filter(Boolean);
        return keys.some(key => normalized.includes(key) || normalized.some(name => key.includes(name) || name.includes(key)));
      }) || null;
    }
    function getAnswerByFieldNames(answers, names) {
      const field = findChecklistFieldByNames(names);
      if (field && Object.prototype.hasOwnProperty.call(answers, field.id)) return answers[field.id];
      const normalized = names.map(name => normalizeVisibilityValue(name).trim().toLowerCase());
      const pair = Object.entries(answers).find(([key]) => normalized.includes(normalizeVisibilityValue(key).trim().toLowerCase()));
      return pair ? pair[1] : '';
    }
    function fieldMatchesAccessPointName(field, exactNames, containsText) {
      const keys = [field?.id, field?.label, field?.labelAr].map(value => normalizeVisibilityValue(value).trim().toLowerCase());
      return keys.some(key => exactNames.includes(key) || key.includes(containsText));
    }
    function shouldShowKnownAccessPointDependentField(field, answers) {
      const available = getAnswerByFieldNames(answers, ['access_point_available', 'Access Point Available']);
      const coverage = getAnswerByFieldNames(answers, ['access_point_coverage_area', 'Access Point Coverage Area']);
      const indoorCompleted = getAnswerByFieldNames(answers, [
        'indoor_coverage_completed',
        'Indoor Coverage Completed?',
        'Indoor Coverage Completed'
      ]);
      const outdoorCompleted = getAnswerByFieldNames(answers, [
        'outdoor_coverage_completed',
        'Outdoor Coverage Completed?',
        'Outdoor Coverage Completed'
      ]);
      const additional = getAnswerByFieldNames(answers, [
        'additional_access_points_required',
        'Additional Access Points Required?',
        'Additional Access Points Required'
      ]);

      if (fieldMatchesAccessPointName(field, ['access_point_coverage_area'], 'access point coverage area')) {
        return matchesVisibilityRule(available, { operator: 'equals', value: 'yes' });
      }
      if (fieldMatchesAccessPointName(field, ['indoor_coverage_completed'], 'indoor coverage completed')) {
        return matchesVisibilityRule(coverage, { operator: 'equalsAny', value: 'indoor_only\nindoor_outdoor' });
      }
      if (fieldMatchesAccessPointName(field, ['outdoor_coverage_completed'], 'outdoor coverage completed')) {
        return matchesVisibilityRule(coverage, { operator: 'equalsAny', value: 'outdoor_only\nindoor_outdoor' });
      }
      if (fieldMatchesAccessPointName(field, ['additional_access_points_required'], 'additional access points required')) {
        const needsIndoor = matchesVisibilityRule(coverage, { operator: 'equalsAny', value: 'indoor_only\nindoor_outdoor' });
        const needsOutdoor = matchesVisibilityRule(coverage, { operator: 'equalsAny', value: 'outdoor_only\nindoor_outdoor' });
        const indoorFailed = needsIndoor && matchesVisibilityRule(indoorCompleted, { operator: 'equals', value: 'no' });
        const outdoorFailed = needsOutdoor && matchesVisibilityRule(outdoorCompleted, { operator: 'equals', value: 'no' });
        return indoorFailed || outdoorFailed;
      }
      if (fieldMatchesAccessPointName(field, ['number_of_additional_access_points'], 'number of additional access points')) {
        return matchesVisibilityRule(additional, { operator: 'equals', value: 'yes' });
      }
      if (fieldMatchesAccessPointName(field, ['access_point_installation_locations'], 'access point installation locations')) {
        return matchesVisibilityRule(additional, { operator: 'equals', value: 'yes' });
      }
      if (fieldMatchesAccessPointName(field, ['installation_photos_notes_links'], 'installation photos notes')) {
        return matchesVisibilityRule(additional, { operator: 'equals', value: 'yes' });
      }
      return true;
    }
    function isKnownAccessPointField(field) {
      return fieldMatchesAccessPointName(field, ['access_point_coverage_area'], 'access point coverage area')
        || fieldMatchesAccessPointName(field, ['indoor_coverage_completed'], 'indoor coverage completed')
        || fieldMatchesAccessPointName(field, ['outdoor_coverage_completed'], 'outdoor coverage completed')
        || fieldMatchesAccessPointName(field, ['additional_access_points_required'], 'additional access points required')
        || fieldMatchesAccessPointName(field, ['number_of_additional_access_points'], 'number of additional access points')
        || fieldMatchesAccessPointName(field, ['access_point_installation_locations'], 'access point installation locations')
        || fieldMatchesAccessPointName(field, ['installation_photos_notes_links'], 'installation photos notes');
    }
    function collectDynamicAnswers() {
      const ans = {};
      document.querySelectorAll('.dyn-input').forEach(el => {
        const id = el.dataset.id;
        if (el.type === 'checkbox') {
          if (!ans[id]) ans[id] = [];
          if (el.checked) ans[id].push(el.value);
        } else if (el.type === 'radio') {
          if (el.checked) ans[id] = el.value;
        } else if (el.dataset.index !== undefined) {
          if (!ans[id]) ans[id] = [];
          ans[id][el.dataset.index] = el.value;
        } else {
          ans[id] = el.value;
        }
      });
      return ans;
    }
    window.collectAnswers = collectDynamicAnswers;
    function renderDynamicFormSafe(answers = {}) {
      if (typeof renderDynamicForm === 'function') return renderDynamicForm(answers);
      const container = $('dynamicChecklistSections');
      if (container) container.innerHTML = '<div class="notice warn" style="margin-top:12px;">جاري تجهيز البنود الديناميكية...</div>';
    }
    window.renderDynamicFormSafe = renderDynamicFormSafe;
    var state = {
      checklists: [],
      checklistFields: [],
      technicians: [],
      branches: [],
      userProfile: null,
      currentUser: null,
      canEdit: false,
      employeeLookupError: false,
      branchLookupError: false,
      checklistUnsubs: []
    };
    const $ = (id) => document.getElementById(id);
    const dynamicLabels = ["Network Cabinets Condition", "Upload 4-6 Mbps", "Low Current Infrastructure Condition", "Download 6-9 Mbps", "Server Room Temperature", "UPS Status", "PCs Condition", "Printers Condition", "Unified Communication", "Unused or Damaged IT Assets", "Unused or Damaged IT Assets - Note", "Operating System Up to Date", "Cleanup and Remove Unwanted Apps", "OneDrive Backup", "Customer Facing Portals", "ERP & Business Applications", "Training Requirement", "Upgrade Windows_11", "Number of devices (Q29A)", "Employee IDs for devices (Q29B)"];

    function resolveRef(id, lbl) {
      const wantedId = norm(id);
      const wantedLabel = norm(lbl);
      return state.checklistFields.find(f => wantedId && norm(f.id) === wantedId)
        || state.checklistFields.find(f => wantedLabel && [f.label, f.labelAr].some(value => norm(value) === wantedLabel))
        || null;
    }

    function norm(v) { return String(v || '').trim().toLowerCase(); }

    function getRole() {
      return norm(state.userProfile && state.userProfile.role) || 'user';
    }

    function getPermissionList(profile, field) {
      return Array.isArray(profile && profile[field])
        ? profile[field].map(item => norm(item)).filter(Boolean)
        : [];
    }

    function hasAnyPermission(profile, fields, values) {
      const allowed = new Set(values.map(norm));
      return fields.some(field => getPermissionList(profile, field).some(item => allowed.has(item)));
    }

    function canManageChecklists(profile) {
      const role = norm(profile && profile.role);
      if ((profile && profile.superAdmin === true) || role === 'admin') return true;
      if (role !== 'supervisor') return false;
      return hasAnyPermission(profile, ['permissions_site_visit', 'pages'], ['checklist_admin', 'reports', 'dashboard']);
    }

    function isTechnicianMode() {
      return !state.canEdit;
    }

    function addValue(list, value) {
      const text = String(value || '').trim();
      if (text && !list.some(item => norm(item) === norm(text))) list.push(text);
    }

    function addValues(list, source, fields) {
      fields.forEach(field => addValue(list, source && source[field]));
    }

    function getTechnicianValues(tech) {
      const values = [];
      addValues(values, tech || {}, [
        'id',
        '_docId',
        'empId',
        'empNum',
        'employeeId',
        'technicianId',
        'technicianCode',
        'code',
        'authUid',
        'uid',
        'email',
        'name',
        'fullName'
      ]);
      return values;
    }

    function getProfileValues() {
      const profile = state.userProfile || {};
      const user = state.currentUser || {};
      const values = [];
      addValues(values, profile, ['employeeId', 'empId', 'technicianId', 'technicianCode', 'code', 'email', 'name', 'fullName']);
      addValues(values, user, ['uid', 'email', 'displayName']);
      return values;
    }

    function getTechnicianDisplayName(tech) {
      const profile = state.userProfile || {};
      const user = state.currentUser || {};
      return (tech && (tech.name || tech.fullName || tech.displayName))
        || profile.name
        || profile.fullName
        || user.displayName
        || profile.email
        || user.email
        || (tech && (tech.empId || tech.technicianId || tech.id))
        || '';
    }

    function buildProfileTechnicianFallback() {
      const profile = state.userProfile || {};
      const user = state.currentUser || {};
      const id = profile.technicianId || profile.employeeId || profile.empId || profile.technicianCode || profile.code || user.uid || user.email || '';
      if (!id) return null;
      return {
        id: String(id),
        _docId: String(profile.employeeDocId || profile.technicianDocId || profile.technicianId || id),
        empId: String(profile.empId || profile.employeeId || profile.technicianId || id),
        empNum: String(profile.empNum || ''),
        employeeId: String(profile.employeeId || profile.technicianId || id),
        technicianId: String(profile.technicianId || profile.employeeId || id),
        technicianCode: String(profile.technicianCode || profile.code || profile.technicianId || id),
        code: String(profile.code || profile.technicianCode || ''),
        authUid: String(profile.authUid || profile.uid || user.uid || ''),
        uid: String(profile.uid || user.uid || ''),
        email: String(profile.email || user.email || ''),
        name: String(profile.name || profile.fullName || user.displayName || profile.email || user.email || id),
        fullName: String(profile.fullName || profile.name || ''),
        status: 'active',
        isTechnician: true,
        fromProfileFallback: true
      };
    }

    function getCurrentTechnicianIdentity() {
      const rawValues = getProfileValues();
      const keys = new Set(rawValues.map(norm).filter(Boolean));
      const matchedTech = state.technicians.find(t =>
        getTechnicianValues(t).map(norm).some(value => keys.has(value))
      ) || buildProfileTechnicianFallback();
      getTechnicianValues(matchedTech).forEach(value => {
        addValue(rawValues, value);
        const key = norm(value);
        if (key) keys.add(key);
      });
      return {
        role: getRole(),
        rawValues,
        keys,
        matchedTech,
        matchedTechId: matchedTech ? (matchedTech.id || matchedTech._docId || '') : ''
      };
    }

    function recordTechnicianValues(record) {
      const values = [];
      addValues(values, record || {}, [
        'technicianEmpId',
        'technicianDocId',
        'technicianId',
        'technicianUid',
        'technicianAuthId',
        'technicianEmail',
        'technicianName',
        'technicianCode'
      ]);
      return values;
    }

    function isRecordForCurrentTechnician(record) {
      if (!isTechnicianMode()) return true;
      const identity = getCurrentTechnicianIdentity();
      return recordTechnicianValues(record).map(norm).some(key => identity.keys.has(key));
    }

    function isVisitCompleted(visit) {
      const completedIds = new Set(state.checklists
        .filter(isRecordForCurrentTechnician)
        .map(c => c.visitDocId || c.linkedVisitId)
        .filter(Boolean)
        .map(String));
      const status = norm(visit && visit.status);
      return completedIds.has(String(visit && visit.id || ''))
        || visit.checklistCompleted === true
        || !!visit.checklistId
        || status === 'completed'
        || status === 'done';
    }

    function normalizeBranchKey(value) {
      return norm(value).replace(/\s+/g, '').replace(/[-_]+/g, '');
    }

    function getBranchLookupValues(branch) {
      const values = [];
      addValues(values, branch || {}, [
        'id',
        '_docId',
        'branchId',
        'branchCode',
        'code',
        'branchName',
        'name',
        'location',
        'locationSite',
        'site'
      ]);
      return values;
    }

    function findBranchForVisit(visit) {
      const wanted = [];
      addValues(wanted, visit || {}, ['branchId', 'branchDocId', 'branchCode', 'branchName', 'locationSite', 'location']);
      const wantedKeys = new Set(wanted.map(normalizeBranchKey).filter(Boolean));
      return state.branches.find(branch =>
        getBranchLookupValues(branch).map(normalizeBranchKey).some(value => wantedKeys.has(value))
      ) || {};
    }

    function getFirstValue(...values) {
      return values.find(value => value !== undefined && value !== null && String(value).trim() !== '') || '';
    }

    function getBranchDepartment(branch) {
      return getFirstValue(branch && branch.department, branch && branch.departmentName, branch && branch.functionName, branch && branch.function);
    }

      const container = $('dynamicChecklistSections'); container.innerHTML = '';

        return;
      }
      const currentAnswers = Object.keys(answers).length ? answers : collectDynamicAnswers();
      state.checklistFields.filter(field => isFieldForVisitType(field, selectedVisitTypes)).forEach(field => {
        const isAccessPointField = isKnownAccessPointField(field);
        if (!isAccessPointField && field.logic?.enabled && field.logic?.visibleWhen) {
          const rule = field.logic.visibleWhen;
          const src = resolveRef(rule.fieldId, rule.fieldLabel);
          if (!matchesVisibilityRule(src ? currentAnswers[src.id] : '', rule)) return;
        }
        if (!shouldShowKnownAccessPointDependentField(field, currentAnswers)) return;

          for (let i = 0; i < count; i++) { html += `<div class="field" style="margin-top:8px;"><label>${esc(String(field.repeat.labelTemplate || '{index}').replace('{index}', i + 1))}</label><input type="text" class="dyn-input" data-id="${field.id}" data-index="${i}" value="${esc(currentAnswers[field.id]?.[i]||'')}" /></div>`; }
        } else if (field.fieldType === 'choice' && (field.renderMode === 'checkboxes' || field.renderMode === 'radios')) {
          html += `<div class="choices-grid">`; (field.options || []).forEach(opt => { const isChecked = Array.isArray(val) ? val.includes(opt.value) : val === opt.value; html += `<div class="pill-box ${isChecked?'selected':''}" onclick="const inp=this.querySelector('input'); inp.click();"><span>${esc(opt.label)}</span><input type="${field.renderMode==='checkboxes'?'checkbox':'radio'}" name="g_${field.id}" class="dyn-input" data-id="${field.id}" value="${esc(opt.value)}" ${isChecked?'checked':''} onchange="event.stopPropagation(); renderDynamicFormSafe(collectDynamicAnswers());"></div>`; }); html += `</div>`;
        } else {
          if (field.fieldType === 'choice') html += `<select class="dyn-input" data-id="${field.id}" onchange="renderDynamicFormSafe(collectDynamicAnswers())"><option value="">اختر</option>${(field.options||[]).map(o=>`<option value="${esc(o.value)}" ${val==o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
          else if (field.fieldType === 'number') html += `<input type="number" class="dyn-input" data-id="${field.id}" value="${esc(val)}" onchange="renderDynamicFormSafe(collectDynamicAnswers())" />`;
          else if (field.fieldType === 'boolean') html += `<select class="dyn-input" data-id="${field.id}" onchange="renderDynamicFormSafe(collectDynamicAnswers())"><option value="">اختر</option><option value="yes" ${val==='yes'?'selected':''}>Yes</option><option value="no" ${val==='no'?'selected':''}>No</option></select>`;
          else if (field.fieldType === 'textarea') html += `<textarea class="dyn-input" data-id="${field.id}" onchange="renderDynamicFormSafe(collectDynamicAnswers())">${esc(val)}</textarea>`;
          else html += `<input type="text" class="dyn-input" data-id="${field.id}" value="${esc(val)}" onchange="renderDynamicFormSafe(collectDynamicAnswers())" />`;
        }
        container.innerHTML += html + `</div>`;
      });
      if (!container.innerHTML.trim()) container.innerHTML = '<div class="notice" style="margin-top:12px;">لا توجد بنود مرتبطة بنوع الزيارة المختار.</div>';
    }

    async function queryVisitsByIdentity(values) {
      const db = window.parent.appDb;
      const rows = new Map();
      const fields = ['technicianEmpId', 'technicianDocId', 'technicianId', 'technicianUid', 'technicianAuthId', 'technicianEmail', 'technicianName', 'technicianCode'];
      const uniqueValues = values.map(v => String(v || '').trim()).filter(Boolean)
        .filter((value, index, arr) => arr.findIndex(item => norm(item) === norm(value)) === index)
        .slice(0, 20);

      for (const field of fields) {
        for (const value of uniqueValues) {
          try {
            const snap = await db.collection('siteVisits').where(field, '==', value).get();
            snap.docs.forEach(d => rows.set(d.id, { id: d.id, ...d.data() }));
          } catch (err) {
            console.warn('siteVisits technician query failed', field, err);
          }
        }
      }
      if (!rows.size && isTechnicianMode()) {
        try {
          const snap = await db.collection('siteVisits').get();
          snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .filter(isRecordForCurrentTechnician)
            .forEach(row => rows.set(row.id, row));
        } catch (err) {
          console.warn('siteVisits fallback scan failed', err);
        }
      }
      return Array.from(rows.values());
    }

    async function loadVisitsForTech(techId, visitId = null) {
      const tech = state.technicians.find(t => String(t.id) === String(techId) || String(t._docId) === String(techId));
      const identity = getCurrentTechnicianIdentity();
      const lookupValues = state.canEdit ? getTechnicianValues(tech) : identity.rawValues;
      if (techId) addValue(lookupValues, techId);

      let visits = await queryVisitsByIdentity(lookupValues);
      if (!state.canEdit) visits = visits.filter(isRecordForCurrentTechnician);

      let filtered = state.canEdit
        ? visits
        : visits.filter(v => !isVisitCompleted(v) || String(v.id) === String(visitId));

      filtered = filtered
        .filter(v => String(v.status || '').toLowerCase() !== 'cancelled')
        .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));

      $('cl_visit_ref').disabled = !state.canEdit && filtered.length === 0;
      $('saveChecklistBtn').disabled = !state.canEdit && filtered.length === 0;
      $('cl_visit_ref').innerHTML = filtered.length
        ? '<option value="">اختر الزيارة</option>' + filtered.map(v => {
            const branch = findBranchForVisit(v);
            const branchLabel = getFirstValue(v.branchName, v.locationSite, v.location, branch.branchName, branch.location, v.branchId);
            const brandLabel = getFirstValue(v.brand, branch.brand);
            const departmentLabel = getFirstValue(v.department, getBranchDepartment(branch));
            return `<option value="${esc(v.id)}" ${String(visitId)===String(v.id)?'selected':''}>${esc(v.date || '')} - ${esc(branchLabel)} - ${esc(brandLabel)}${departmentLabel ? ' - ' + esc(departmentLabel) : ''}</option>`;
          }).join('')
        : '<option value="">لا توجد زيارات جديدة مرتبطة بك</option>';

      if (!state.canEdit && filtered.length === 1 && !visitId) {
        $('cl_visit_ref').value = filtered[0].id;
        fillSelectedVisit();
      } else if (!filtered.length) {
        clearVisitFields();
      }
    }

      stopChecklistListeners();

          state.checklists = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      const values = identity.rawValues
        .map(v => String(v || '').trim())
        .filter(Boolean)
        .filter((value, index, arr) => arr.findIndex(item => norm(item) === norm(value)) === index)
        .slice(0, 20);

      fields.forEach(field => {
        values.forEach(value => {
          const unsub = db.collection('branch_checklists').where(field, '==', value).onSnapshot(
            snap => mergeChecklistRows(rowMap, snap),
            err => console.warn('branch_checklists technician listener failed', field, err)
          );
          state.checklistUnsubs.push(unsub);
        });
      });
    }

    async function boot() {
      const db = window.parent.appDb;
      if (isTechnicianMode()) {
        renderTechnicianSelector();
        listenChecklists();
      }
      db.collection('employees').onSnapshot(snap => {
        state.employeeLookupError = false;
        state.technicians = snap.docs.map(d => { const data = d.data() || {}; const empId = data.empId || data.empNum || data.employeeId || data.technicianId || d.id; return { ...data, id: String(empId || d.id), _docId: d.id, empId: String(empId || ''), technicianId: data.technicianId || empId || '', technicianCode: data.technicianCode || data.code || empId || '', name: data.name || data.fullName || empId || d.id, status: data.status || (data.active === false ? 'inactive' : 'active') }; }).filter(t => t.status !== 'inactive' && (String(t.employeeType || t.type || '').toLowerCase() === 'technician' || String(t.jobTitle || t.title || t.position || '').toLowerCase().includes('technician') || String(t.jobTitle || '').includes('فني') || t.isTechnician === true));
        renderTechnicianSelector();
        listenChecklists();
      }, err => {
        state.employeeLookupError = true;
        console.warn('employees technician lookup failed; using app_users profile fallback', err);
        renderTechnicianSelector();
        listenChecklists();
      });
      db.collection('branches').onSnapshot(snap => {
        state.branchLookupError = false;
        state.branches = snap.docs.map(d => {
          const data = d.data() || {};
          return { ...data, id: data.id || d.id, _docId: d.id };
        });
        const identity = getCurrentTechnicianIdentity();
        if ($('cl_visit_ref').value) fillSelectedVisit();
        else if (identity.matchedTechId) loadVisitsForTech(identity.matchedTechId);
      }, err => {
        state.branchLookupError = true;
        console.warn('branches lookup failed; city and region may be blank', err);
      });
      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (Number(a.order)||0)-(Number(b.order)||0));
        renderDynamicFormSafe(); if(state.canEdit) { updateTableHeaders(); renderTable(); }
      });
      $('exportExcelBtn').onclick = exportToExcel;
      $('importExcelInput').onchange = handleImport;
      $('saveChecklistBtn').onclick = window.saveChecklist;
      $('cl_visit_type').onchange = () => renderDynamicFormSafe(collectDynamicAnswers());
      $('cl_include_all_items').onchange = () => renderDynamicFormSafe(collectDynamicAnswers());

      $('cl_technician').onchange = (e) => {
        if (isTechnicianMode()) return;
        const t = state.technicians.find(x => String(x.id) === String(e.target.value) || String(x._docId) === String(e.target.value));
        if(t){ fillTechnicianFields(t); loadVisitsForTech(e.target.value); }
      };
      $('cl_visit_ref').onchange = fillSelectedVisit;
    }
    checkAuth();
  })();
  </script>
</body>
</html>
