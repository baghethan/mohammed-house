<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Check-List | MMC IT Service</title>
  <style>
    :root{ --primary: #0d2149; --bg: #f8fafc; --border: #cbd5e1; }
    body{ font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
    .card { max-width: 900px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    h2 { color: var(--primary); margin-top: 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
    .item { display: flex; align-items: center; gap: 15px; padding: 12px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
    .item:hover { background: #f0f7ff; }
    input[type="checkbox"] { width: 20px; height: 20px; }
    .btn-submit { margin-top: 20px; width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
    <h2>📋 Technical Check-List</h2>
    <div id="authStatus" style="font-size: 12px; color: #64748b; margin-bottom: 15px;">Verifying Admin Status...</div>
    
    <div id="listContainer">
        <!-- الحقول سيتم تحميلها هنا -->
    </div>

    <button class="btn-submit" id="submitBtn">Submit Report</button>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, getDoc, setDoc, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const config = { 
        apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs", 
        authDomain: "baghethan-ba325.firebaseapp.com", 
        projectId: "baghethan-ba325" 
    };

    const app = initializeApp(config);
    const db = getFirestore(app);
    const auth = getAuth(app); // تعريف الـ Auth المصلح

    // فحص الصلاحيات عند تحميل الصفحة
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userSnap = await getDoc(doc(db, 'app_users', user.uid));
            const userData = userSnap.data();
            const role = (userData.role || "").toLowerCase();

            document.getElementById('authStatus').innerHTML = `Verified as: <b>${role.toUpperCase()}</b>`;
            
            // إذا كان Admin يرى كل شيء، إذا كان Technician يرى ما سمحت له به
            loadItems(role === 'admin' ? 'full' : 'limited');
        } else {
            document.getElementById('authStatus').innerText = "Session expired. Please login.";
        }
    });

    function loadItems(mode) {
        const container = document.getElementById('listContainer');
        const items = [
            { id: 'windows', label: 'Windows 11 Upgrade Readiness' },
            { id: 'network', label: 'Network Connection Stability' },
            { id: 'ups', label: 'UPS Battery & Power Check' }
        ];

        container.innerHTML = items.map(i => `
            <label class="item">
                <input type="checkbox" class="task-check" data-id="${i.id}">
                <span>${i.label}</span>
            </label>
        `).join('');
    }

    document.getElementById('submitBtn').onclick = async () => {
        const user = auth.currentUser;
        if(!user) return;

        const results = Array.from(document.querySelectorAll('.task-check')).map(c => ({
            id: c.dataset.id,
            checked: c.checked
        }));

        try {
            await setDoc(doc(db, 'checklist_submissions', `${user.uid}_${Date.now()}`), {
                submittedBy: user.uid,
                data: results,
                timestamp: new Date().toISOString()
            });
            alert("Report saved successfully!");
        } catch (e) {
            alert("Error: " + e.message);
        }
    };
</script>
</body>
</html>
