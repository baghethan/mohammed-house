<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Check-List Master | Almajdouie Motors v1.6.0</title>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); padding: 15px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); overflow: hidden; max-width: 1200px; margin: auto; }
    .card-header { background: var(--primary); color: #fff; padding: 15px; font-weight: 800; text-align: center; }
    .card-body { padding: 25px; }
    .section-title { margin: 20px 0 12px; font-weight: 800; color: var(--primary); border-inline-start: 5px solid var(--primary); padding-inline-start: 12px; font-size: 14px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    .field label { font-size: 12px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #fdfdfd; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 25px; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">نموذج الفحص والربط الذكي مع الترقية</div>
    <div class="card-body">
      
      <!-- القسم 1: بيانات الفني والزيارة (ثابتة لاسترجاع المعلومات) -->
      <div class="section-title">بيانات الفني والزيارة</div>
      <div class="grid-fields">
        <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
        <div class="field"><label>الزيارة المرتبطة</label><select id="cl_visit_ref"></select></div>
        <div class="field"><label>المدينة</label><input id="cl_city" readonly /></div>
        <div class="field"><label>الموقع</label><input id="cl_location" readonly /></div>
      </div>

      <!-- القسم 2: الأسئلة الديناميكية (Upgrade Windows_11 -> Q29A -> Q29B) -->
      <div class="section-title">بنود الترقية والفحص الديناميكي</div>
      <div id="dynamicChecklistSections"></div>

      <button class="btn-save" id="saveChecklistBtn" onclick="saveAndLink()">حفظ التقرير وتحديث الترقية فوراً ✅</button>
    </div>
  </div>

  <script>
    const db = window.parent.appDb;
    let state = { fields: [], techs: [], visits: [] };
    const $ = id => document.getElementById(id);

    async function boot() {
      if(!db) return;

      // تحميل الفنيين
      db.collection('technicians').onSnapshot(s => {
        state.techs = s.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.techs.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });

      // منطق اختيار الفني والزيارة
      $('cl_technician').onchange = async function() {
        const tech = state.techs.find(t => t.id === this.value);
        if (tech) {
          const vSnap = await db.collection('siteVisits').where('technicianDocId', '==', this.value).get();
          state.visits = vSnap.docs.map(d => ({id:d.id, ...d.data()}));
          $('cl_visit_ref').innerHTML = '<option value="">اختر الزيارة</option>' + state.visits.map(v => `<option value="${v.id}">${v.date} - ${v.branchName}</option>`).join('');
        }
      };

      $('cl_visit_ref').onchange = function() {
        const v = state.visits.find(vis => vis.id === this.value);
        if (v) { $('cl_location').value = v.branchName || ''; $('cl_city').value = v.city || ''; }
      };

      // تحميل الأسئلة مع المنطق (Logic)
      db.collection('checklist_fields').onSnapshot(s => {
        state.fields = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.order||0)-(b.order||0));
        renderDynamicForm();
      });
    }

    // --- المحرك الديناميكي الذي يربط Q29A بـ Q29B ---
    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      container.innerHTML = '';
      
      state.fields.forEach(f => {
        // فحص الظهور الشرطي (مثلاً: لا تظهر Q29A إلا إذا كانت إجابة Windows_1 هي نعم)
        if (f.logic && f.logic.enabled && f.logic.visibleWhen) {
            const rule = f.logic.visibleWhen;
            const depVal = answers[rule.fieldId] || answers[rule.fieldLabel] || '';
            if (String(depVal).toLowerCase() !== String(rule.value).toLowerCase()) return;
        }

        let html = `<div class="field"><label>${f.labelAr || f.label}</label>`;
        
        // فحص التكرار (مثلاً: تكرار خانات Q29B بناءً على الرقم المكتوب في Q29A)[cite: 1]
        if (f.repeat && f.repeat.enabled) {
          const countSource = f.repeat.countFromFieldId || f.repeat.countFromFieldLabel;
          const repeatCount = Number(answers[countSource] || 0);
          for (let i = 0; i < repeatCount; i++) {
            const val = (answers[f.id] && answers[f.id][i]) || '';
            html += `<input type="text" class="dyn-input" data-id="${f.id}" data-index="${i}" value="${val}" placeholder="ID ${i+1}" style="margin-bottom:5px" />`;
          }
        } else {
          // عرض الحقل كـ Select إذا كان نعم/لا أو نص عادي
          const val = answers[f.id] || '';
          if (f.fieldType === 'choice') {
            html += `<select class="dyn-input" data-id="${f.id}"><option value="">اختر</option>`;
            (f.options || []).forEach(o => html += `<option value="${o.value}" ${val==o.value?'selected':''}>${o.labelAr || o.label}</option>`);
            html += `</select>`;
          } else {
            html += `<input type="text" class="dyn-input" data-id="${f.id}" value="${val}" onchange="renderDynamicForm(collectAnswers())" />`;
          }
        }
        container.innerHTML += html + `</div>`;
      });
      
      // تحديث النموذج عند أي تغيير لضمان عمل الشرط والعدد فوراً[cite: 1]
      document.querySelectorAll('.dyn-input').forEach(el => {
        el.onchange = () => renderDynamicForm(collectAnswers());
      });
    }

    function collectAnswers() {
      const ans = {};
      document.querySelectorAll('.dyn-input').forEach(el => {
        const id = el.dataset.id;
        if(el.dataset.index !== undefined) { if(!ans[id]) ans[id]=[]; ans[id][el.dataset.index] = el.value; }
        else { ans[id] = el.value; }
      });
      return ans;
    }

    // --- وظيفة الحفظ والربط التلقائي (الأمر المطلوب) ---
    async function saveAndLink() {
      const btn = $('saveChecklistBtn');
      btn.disabled = true;
      const answers = collectAnswers();
      
      try {
        // 1. حفظ تقرير الفحص[cite: 1]
        await db.collection('branch_checklists').add({
          technicianName: $('cl_technician').options[$('cl_technician').selectedIndex].text,
          dynamicAnswers: answers,
          createdAt: new Date().toISOString()
        });

        // 2. تحديث جدول الترقية فوراً بناءً على الأرقام الوظيفية في Q29B[cite: 1]
        const batch = db.batch();
        let updatedCount = 0;

        for (let key in answers) {
          const val = answers[key];
          // استخراج الأرقام الوظيفية سواء كانت مصفوفة أو نص[cite: 1]
          const ids = (Array.isArray(val) ? val : String(val).split(/[\n,]+/)).map(id => id.trim()).filter(id => id.length > 2);
          
          for (const empId of ids) {
            // البحث عن الموظف في مجموعة الترقية وتحديثه كمكتمل[cite: 1]
            const q = await db.collection("windows_upgrades").where("employee_ID", "==", empId).get();
            q.forEach(d => {
              batch.update(d.ref, { status: 'completed', lastUpdate: new Date().toISOString() });
              updatedCount++;
            });
          }
        }

        if(updatedCount > 0) await batch.commit();
        alert(`نجاح! تم حفظ التقرير وتحديث ${updatedCount} جهاز في جدول الترقية آلياً.`);
      } catch (e) { alert("خطأ: " + e.message); }
      btn.disabled = false;
    }

    window.onload = boot;
  </script>
</body>
</html>
