<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>check-list.html - MMC IT Final Fix</title>
  <style>
    /* التنسيقات الأصلية للحفاظ على شكل الصفحة */
    :root {
      --primary: #0d4b73; --green: #2f9e66; --danger: #d64545; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px;
    }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; }
    .hidden { display: none !important; }
    .container { max-width: 1300px; margin: 18px auto; padding: 0 14px 28px; }
    .grid-2 { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18, 48, 74, 0.08); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 15px; }
    .card-body { padding: 16px; }
    .section-title { margin: 18px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; }
    .field { display: grid; gap: 8px; margin-bottom: 12px; }
    .field label { font-size: 14px; font-weight: 700; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 12px; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 13px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: #f1f7fd; }
  </style>
</head>
<body>
  <main class="container">
    <div id="appRoot">
      <div class="grid-2">
        <!-- قسم النموذج: Check-List -->
        <section class="card">
          <h3 id="formTitle">نموذج Check-List</h3>
          <div class="card-body">
            <input id="editingChecklistId" type="hidden" />
            
            <div class="section-title">المعلومات الأساسية</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 14px;">
              <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
              <div class="field"><label>الزيارة</label><select id="cl_visit_ref"></select></div>
              <div class="field"><label>Brand</label><input id="cl_brand" /></div>
              <div class="field"><label>Branch ID</label><input id="cl_branch_id" /></div>
            </div>

            <!-- هذا القسم سيمتلئ آلياً بـ dynamicAnswers -->
            <div class="section-title">Check-List الديناميكي</div>
            <div id="dynamicChecklistSections"></div>

            <div style="display:flex; gap:10px; margin-top:20px;">
              <button class="btn" style="background:var(--green); color:#fff; border:none; padding:10px 20px; border-radius:20px; cursor:pointer;" id="saveChecklistBtn">حفظ Check-List</button>
              <button class="btn" style="background:#ddd; border:none; padding:10px 20px; border-radius:20px; cursor:pointer;" id="clearChecklistBtn">تنظيف النموذج</button>
            </div>
            <div id="checklistMessage" style="margin-top:10px; font-weight:bold;"></div>
          </div>
        </section>

        <!-- قسم السجلات: الجدول -->
        <aside class="card">
          <h3>السجلات المحفوظة</h3>
          <div class="card-body">
            <input id="checklistSearch" placeholder="ابحث..." style="width:100%; padding:10px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;" />
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>تاريخ الزيارة</th>
                    <th>الفني</th>
                    <th>الموقع</th>
                    <!-- العمود الجديد لعرض ملخص الاختيارات -->
                    <th>ملخص التقرير (Q28)</th>
                  </tr>
                </thead>
                <tbody id="checklistTableBody"></tbody>
              </table>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script>
  (function(){
    var state = { checklists: [], checklistFields: [], currentLang: 'ar', technicians: [], visits: [] };

    function $(id){ return document.getElementById(id); }
    function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(s){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]; }); }

    // 1. وظيفة عرض الجدول مع ملخص السؤال 28
    function renderChecklistTable(){
      var q = ($('checklistSearch').value || '').trim().toLowerCase();
      var rows = state.checklists.filter(row => {
        return !q || [row.brand, row.branchId, row.locationSite, row.technicianName, row.q28_serviceReportSummary].some(v => String(v||'').toLowerCase().indexOf(q) > -1);
      });

      $('checklistTableBody').innerHTML = rows.map(row => `
        <tr class="clickable" data-checklist-id="${esc(row.id)}">
          <td>${esc(row.visitDate)}</td>
          <td>${esc(row.technicianName)}</td>
          <td>${esc(row.locationSite)}</td>
          <td style="color:var(--primary); font-weight:bold;">${esc(row.q28_serviceReportSummary || '-')}</td>
        </tr>
      `).join('');

      // تفعيل النقر لفتح السجل للتعديل باستخدام الاسم الأصلي للوظيفة
      document.querySelectorAll('[data-checklist-id]').forEach(row => {
        row.onclick = function(){ openChecklistForEdit(this.getAttribute('data-checklist-id')); };
      });
    }

    // 2. وظيفة فتح السجل للتعديل (الاسم الأصلي لمنع الخطأ)
    window.openChecklistForEdit = function(id){
      var row = state.checklists.find(r => r.id === id);
      if(!row) return;
      $('editingChecklistId').value = row.id;
      $('cl_technician').value = row.technicianDocId || '';
      $('cl_brand').value = row.brand || '';
      $('cl_branch_id').value = row.branchId || '';
      // إعادة عرض الإجابات الديناميكية[cite: 1]
      renderDynamicChecklistForm(row.dynamicAnswers || {});
    };

    // 3. بناء نموذج Check-List الديناميكي[cite: 1]
    function renderDynamicChecklistForm(values){
      var container = $('dynamicChecklistSections');
      container.innerHTML = '';
      state.checklistFields.forEach(field => {
        var val = values[field.id] || '';
        var html = `<div class="field"><label>${esc(field.labelAr || field.label)}</label>`;
        if(field.fieldType === 'choice'){
          html += `<select id="dcf_${field.id}"><option value="">اختر</option>`;
          (field.options || []).forEach(o => html += `<option value="${o.value}" ${val==o.value?'selected':''}>${esc(o.labelAr || o.label)}</option>`);
          html += `</select>`;
        } else {
          html += `<input type="text" id="dcf_${field.id}" value="${esc(val)}" />`;
        }
        html += `</div>`;
        container.innerHTML += html;
      });
    }

    // 4. الربط مع Firebase (استخدام نفس المنطق الأصلي)[cite: 1]
    async function boot(){
      if (!window.parent.appDb) return;
      var db = window.parent.appDb;

      // جلب بنود التشيك ليست الديناميكية[cite: 1]
      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderDynamicChecklistForm({});
      });

      // جلب السجلات المحفوظة[cite: 1]
      db.collection('branch_checklists').orderBy('visitDate', 'desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderChecklistTable();
      });

      $('checklistSearch').oninput = renderChecklistTable;
      $('clearChecklistBtn').onclick = () => { $('editingChecklistId').value = ''; renderDynamicChecklistForm({}); };
    }

    boot();
  })();
  </script>
</body>
</html>
