<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>check-list.html - MMC IT Updated</title>
  <style>
    :root {
      --primary: #0d4b73; --primary-2: #0a3b5a; --green: #2f9e66; --danger: #d64545; --warning: #c47f00;
      --border: #d7e0ea; --text: #163247; --muted: #6e8192; --bg: #edf3f8; --card: #ffffff;
      --shadow: 0 10px 30px rgba(18, 48, 74, 0.08); --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: var(--text); background: var(--bg); }
    .hidden { display: none !important; }
    .container { max-width: 1300px; margin: 18px auto; padding: 0 14px 28px; }
    .grid-2 { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 15px; }
    .card-body { padding: 16px; }
    .field { display: grid; gap: 8px; }
    .field label { font-size: 14px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; background: #fbfcfe; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .btn { border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; background: #fff; color: var(--primary); font-weight: 700; cursor: pointer; }
    .btn.green { background: var(--green); color: #fff; border-color: var(--green); }
    .section-title { margin: 18px 0 10px; font-weight: 800; color: var(--primary); font-size: 16px; border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #edf2f7; text-align: start; white-space: nowrap; font-size: 13px; }
    th { background: #f8fbff; color: var(--primary); }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: #f1f7fd; }
    .toolbar { margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="container">
    <div id="sessionNotice" class="hidden">الرجاء تسجيل الدخول أولًا.</div>
    <div id="appRoot">
      <div class="grid-2">
        <!-- نموذج الإدخال -->
        <section class="card">
          <h3 id="formTitle">نموذج Check-List</h3>
          <div class="card-body">
            <input id="editingChecklistId" type="hidden" />
            <div class="section-title">المعلومات الأساسية</div>
            <div class="grid-4">
              <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
              <div class="field"><label>الزيارة</label><select id="cl_visit_ref"></select></div>
              <div class="field"><label>Brand</label><input id="cl_brand" /></div>
              <div class="field"><label>Branch ID</label><input id="cl_branch_id" /></div>
            </div>
            
            <div class="section-title" id="dynamicTitle">Check-List الديناميكي</div>
            <div id="dynamicChecklistSections" style="margin-top:14px"></div>

            <div class="actions">
              <button class="btn green" id="saveChecklistBtn" type="button">حفظ Check-List</button>
              <button class="btn" id="clearChecklistBtn" type="button">تنظيف النموذج</button>
            </div>
          </div>
        </section>

        <!-- السجلات المحفوظة مع العمود الجديد -->
        <aside class="card">
          <h3 id="savedRecordsTitle">السجلات المحفوظة</h3>
          <div class="card-body">
            <div class="toolbar">
              <input id="checklistSearch" placeholder="بحث..." style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;" />
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th id="thVisitDate">التاريخ</th>
                    <th id="thTechnician">الفني</th>
                    <th id="thLocation">الموقع</th>
                    <!-- العمود الجديد لعرض ملخص الاختيارات الديناميكية -->
                    <th id="thSummary">ملخص التقرير (Q28)</th>
                  </tr>
                </thead>
                <tbody id="checklistTableBody"></tbody>
              </table>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script>
  (function(){
    var state = { checklists: [], checklistFields: [], currentLang: 'ar', technicians: [], visits: [] };
    function $(id){ return document.getElementById(id); }
    function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(s){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]; }); }

    // تحديث اللغات لتشمل تسمية العمود الجديد
    var I18N = {
      ar: { thSummary: 'ملخص التقرير (Q28)', noRecords: 'لا توجد سجلات' },
      en: { thSummary: 'Report Summary (Q28)', noRecords: 'No records found' }
    };

    function renderChecklistTable(){
      var q = ($('checklistSearch').value || '').trim().toLowerCase();
      var rows = state.checklists.filter(function(row){
        return !q || [row.locationSite, row.technicianName, row.q28_serviceReportSummary].some(function(v){ return String(v||'').toLowerCase().indexOf(q) > -1; });
      });

      // إضافة عمود ملخص السؤال 28 في جسم الجدول
      $('checklistTableBody').innerHTML = rows.length ? rows.map(function(row){
        return '<tr class="clickable" data-id="'+esc(row.id)+'">'+
          '<td>'+esc(row.visitDate || '')+'</td>'+
          '<td>'+esc(row.technicianName || '')+'</td>'+
          '<td>'+esc(row.locationSite || '')+'</td>'+
          '<td style="color:#0d4b73; font-weight:bold;">'+esc(row.q28_serviceReportSummary || '-')+'</td>'+
        '</tr>';
      }).join('') : '<tr><td colspan="4">'+esc(I18N[state.currentLang].noRecords)+'</td></tr>';
      
      document.querySelectorAll('[data-id]').forEach(function(el){
        el.onclick = function(){ openEdit(el.getAttribute('data-id')); };
      });
    }

    // محاكاة الاتصال بـ Firestore بناءً على الكود المصدري
    async function init(){
      if (!window.parent.appDb) return;
      var db = window.parent.appDb;
      
      // الاستماع للبيانات الحية
      db.collection('branch_checklists').orderBy('visitDate', 'desc').onSnapshot(function(snap){
        state.checklists = snap.docs.map(function(d){ var data = d.data(); data.id = d.id; return data; });
        renderChecklistTable();
      });
      
      // تفعيل البحث[cite: 1]
      $('checklistSearch').oninput = renderChecklistTable;
      $('thSummary').textContent = I18N[state.currentLang].thSummary;
    }

    window.onload = init;
  })();
  </script>
</body>
</html>
