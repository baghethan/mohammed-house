<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Check-List Full System | Almajdouie Motors v1.5.0</title>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: var(--bg); padding: 15px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); overflow: hidden; max-width: 1200px; margin: auto; }
    .card-header { background: var(--primary); color: #fff; padding: 20px; font-weight: 800; text-align: center; font-size: 18px; }
    .card-body { padding: 30px; }
    .section-title { margin: 25px 0 15px; font-weight: 800; color: var(--primary); border-inline-start: 6px solid var(--primary); padding-inline-start: 15px; font-size: 15px; background: #f8fbff; padding: 8px 15px; border-radius: 4px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .field { display: grid; gap: 8px; margin-bottom: 15px; }
    .field label { font-size: 12px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #fdfdfd; outline: none; }
    .field input[readonly] { background: #f1f5f9; cursor: not-allowed; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 18px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 30px; font-size: 17px; transition: 0.3s; box-shadow: 0 4px 12px rgba(47, 158, 102, 0.2); }
    .btn-save:hover { background: #248a55; transform: translateY(-2px); }
    .btn-save:disabled { background: #cbd5e1; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">نظام إدارة الفحص الفني والربط اللحظي بالترقية</div>
    <div class="card-body">
      
      <!-- القسم 1: الربط مع الفني والزيارة -->
      <div class="section-title">1- الربط مع الفني والزيارة (6 حقول)</div>
      <div class="grid-fields">
        <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
        <div class="field"><label>الزيارة المرتبطة</label><select id="cl_visit_ref"></select></div>
        <div class="field"><label>البريد الإلكتروني للفني</label><input id="cl_technician_email" readonly /></div>
        <div class="field"><label>معرف الفني</label><input id="cl_technician_id" readonly /></div>
        <div class="field"><label>المدينة</label><input id="cl_city" readonly /></div>
        <div class="field"><label>المنطقة</label><input id="cl_region" readonly /></div>
      </div>

      <!-- القسم 2: Basic Information -->
      <div class="section-title">2- المعلومات الأساسية للفرع (8 حقول)</div>
      <div class="grid-fields">
        <div class="field"><label>Brand</label><input id="cl_brand" readonly /></div>
        <div class="field"><label>Brand Key</label><input id="cl_brandKey" placeholder="أدخل كود الماركة" /></div>
        <div class="field"><label>Branch ID</label><input id="cl_branch_id" readonly /></div>
        <div class="field"><label>Location/Site</label><input id="cl_location" readonly /></div>
        <div class="field"><label>Visit Scheduled with Branch Manager</label><select id="cl_visit_scheduled"><option value="Yes">Yes</option><option value="No">No</option></select></div>
        <div class="field"><label>Visit Date</label><input id="cl_visit_date" type="date" /></div>
        <div class="field"><label>Month</label><input id="cl_month" readonly /></div>
        <div class="field"><label>Calendar Booked</label><select id="cl_calendar_booked"><option value="Yes">Yes</option><option value="No">No</option></select></div>
      </div>

      <!-- القسم 3: الأسئلة الديناميكية والترقية -->
      <div class="section-title">3- بنود الفحص المتغيرة (Dynamic Check-List)</div>
      <div id="dynamicChecklistSections"></div>

      <button class="btn-save" id="saveChecklistBtn" onclick="saveAndPush()">حفظ التقرير وتحديث حالة الأجهزة فوراً ✅</button>
    </div>
  </div>

  <script>
    const db = window.parent.appDb;
    let state = { fields: [], techs: [], visits: [] };
    const $ = id => document.getElementById(id);

    async function boot() {
      if(!db) return;

      // 1. تحميل قائمة الفنيين
      db.collection('technicians').onSnapshot(s => {
        state.techs = s.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.techs.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });

      // 2. عند اختيار فني: جلب بياناته وزياراته
      $('cl_technician').onchange = async function() {
        const tech = state.techs.find(t => t.id === this.value);
        if (tech) {
          $('cl_technician_email').value = tech.email || '';
          $('cl_technician_id').value = tech.authUid || tech.id;
          
          const vSnap = await db.collection('siteVisits').where('technicianDocId', '==', this.value).get();
          state.visits = vSnap.docs.map(d => ({id:d.id, ...d.data()}));
          $('cl_visit_ref').innerHTML = '<option value="">اختر الزيارة</option>' + state.visits.map(v => `<option value="${v.id}">${v.date} - ${v.branchName}</option>`).join('');
        }
      };

      // 3. عند اختيار زيارة: تعبئة الـ 14 حقلاً تلقائياً
      $('cl_visit_ref').onchange = function() {
        const v = state.visits.find(vis => vis.id === this.value);
        if (v) {
          $('cl_brand').value = v.brand || '';
          $('cl_branch_id').value = v.branchId || '';
          $('cl_location').value = v.branchName || '';
          $('cl_city').value = v.city || '';
          $('cl_region').value = v.region || '';
          $('cl_visit_date').value = v.date || '';
          updateMonth();
        }
      };

      // 4. تحميل الأسئلة الديناميكية (Q29B وغيرها)
      db.collection('checklist_fields').onSnapshot(s => {
        state.fields = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.order||0)-(b.order||0));
        renderDynamicForm();
      });
    }

    function updateMonth() {
      const d = new Date($('cl_visit_date').value);
      if(!isNaN(d)) {
          const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
          $('cl_month').value = months[d.getMonth()];
      }
    }

    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      container.innerHTML = '';
      state.fields.forEach(f => {
        let html = `<div class="field" style="margin-top:10px"><label>${f.labelAr || f.label}</label>`;
        if(f.repeat && f.repeat.enabled) {
          const count = Number(answers[f.repeat.countFromFieldId] || answers[f.repeat.countFromFieldLabel] || 0);
          for(let i=0; i<count; i++) {
             const val = (answers[f.id] && answers[f.id][i]) || '';
             html += `<input type="text" class="dyn-input" data-id="${f.id}" data-index="${i}" value="${val}" style="margin-bottom:5px" placeholder="أدخل الرقم الوظيفي ${i+1}" />`;
          }
        } else {
          const val = answers[f.id] || '';
          html += `<input type="text" class="dyn-input" data-id="${f.id}" value="${val}" onchange="renderDynamicForm(collectAnswers())" />`;
        }
        container.innerHTML += html + `</div>`;
      });
    }

    function collectAnswers() {
      const ans = {};
      document.querySelectorAll('.dyn-input').forEach(el => {
        const id = el.dataset.id;
        if(el.dataset.index !== undefined) { if(!ans[id]) ans[id]=[]; ans[id][el.dataset.index] = el.value; }
        else { ans[id] = el.value; }
      });
      return ans;
    }

    // تنظيف البيانات لضمان قبول Firebase للتحديث
    function cleanData(obj) { return JSON.parse(JSON.stringify(obj)); }

    // الحفظ والربط الفوري (الطلب الأساسي)
    async function saveAndPush() {
      const btn = $('saveChecklistBtn');
      btn.disabled = true;
      btn.innerText = "جاري الحفظ والتحديث...";
      const answers = collectAnswers();
      
      try {
        // 1. حفظ التقرير في branch_checklists
        await db.collection('branch_checklists').add(cleanData({
          technicianName: $('cl_technician').options[$('cl_technician').selectedIndex].text,
          locationSite: $('cl_location').value,
          visitDate: $('cl_visit_date').value,
          dynamicAnswers: answers,
          createdAt: new Date().toISOString()
        }));

        // 2. تحديث حالة الأجهزة فوراً في windows_upgrades
        const batch = db.batch();
        let count = 0;
        for (let key in answers) {
          const val = answers[key];
          const ids = (Array.isArray(val) ? val : String(val).split(/[\n,]+/)).map(id => id.trim()).filter(id => id.length > 2);
          
          for (const empId of ids) {
            const q = await db.collection("windows_upgrades").where("employee_ID", "==", empId).get();
            q.forEach(d => { 
              batch.update(d.ref, cleanData({ status: 'completed', syncTime: new Date().toISOString(), syncSource: 'Instant-v1.5.0' })); 
              count++; 
            });
          }
        }
        if(count > 0) await batch.commit();
        alert(`تم بنجاح! حُفظ التقرير وتحدثت حالة ${count} جهاز إلى مكتمل.`);
      } catch (e) { alert("خطأ: " + e.message); }
      btn.disabled = false;
      btn.innerText = "حفظ التقرير وتحديث حالة الأجهزة فوراً ✅";
    }

    window.onload = boot;
  </script>
</body>
</html>
