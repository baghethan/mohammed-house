<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check‑List</title>

  <style>
    body{
      margin:0;
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;
      background:#edf3f8;
      color:#163247;
    }

    .container{
      max-width:1300px;
      margin:18px auto;
      padding:0 14px 28px;
    }

    .card{
      background:#fff;
      border:1px solid #d7e0ea;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(18,48,74,.08);
      margin-bottom:16px;
      overflow:hidden;
    }

    .card h3{
      margin:0;
      padding:12px 16px;
      background:#0d4b73;
      color:#fff;
      font-size:15px;
    }

    .card-body{padding:16px}

    .grid-4{
      display:grid;
      grid-template-columns:repeat(4,minmax(180px,1fr));
      gap:14px;
    }

    @media(max-width:1200px){
      .grid-4{grid-template-columns:1fr}
    }

    .field{display:grid;gap:8px}
    .field label{font-size:14px;font-weight:700}

    .field input,
    .field select,
    .field textarea{
      width:100%;
      border:1px solid #d7e0ea;
      border-radius:12px;
      padding:10px 12px;
      font:inherit;
      background:#fbfcfe;
    }

    .field textarea{min-height:90px}

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .btn{
      border:1px solid #d7e0ea;
      border-radius:999px;
      padding:10px 16px;
      background:#fff;
      color:#0d4b73;
      font-weight:700;
      cursor:pointer;
    }

    .btn.primary{background:#0d4b73;color:#fff}
    .btn.green{background:#2f9e66;border-color:#2f9e66;color:#fff}
    .btn.danger{background:#d64545;border-color:#d64545;color:#fff}

    .note{
      background:#f6fbff;
      border:1px dashed #bfd7e8;
      border-radius:12px;
      padding:10px 12px;
      margin-top:12px;
      font-size:14px;
    }

    .alert{
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
    }

    .alert.error{
      background:#ffecec;
      border:1px solid #f3b0b0;
      color:#8a1f1f;
    }
  </style>
</head>

<body>

<main class="container">

  <section class="card">
    <h3>نموذج Check‑List</h3>
    <div class="card-body">

      <div class="grid-4">
        <div class="field">
          <label>الفني</label>

          <select id="cl_technician"></select>
        </div>

        <div class="field">
          <label>الزيارة المرتبطة</label>
          <select id="cl_visit_ref"></select>
        </div>

        <div class="field">
          <label>البريد الإلكتروني للفني</label>
          <input id="cl_technician_email" readonly>
        </div>

        <div class="field">
          <label>معرف الفني</label>
          <input id="cl_technician_id" readonly>
        </div>
      </div>

      <div class="note">
        اختر الفني ثم الزيارة المرتبطة، سيتم تعبئة باقي البيانات تلقائيًا.
      </div>

      <div class="grid-4" style="margin-top:16px">
        <div class="field">
          <label>Brand</label>
          <input id="cl_brand">
        </div>

        <div class="field">
          <label>Branch ID</label>
          <input id="cl_branch_id">
        </div>

        <div class="field">
          <label>Location / Site</label>
          <input id="cl_location">
        </div>

        <div class="field">
          <label>Visit Date</label>
          <input id="cl_visit_date" type="date">
        </div>
      </div>

      <div class="note">
        البنود الديناميكية تظهر تلقائيًا من checklist_fields.
      </div>

      <div id="dynamicChecklistSections" style="margin-top:14px"></div>

      <div class="actions">
        <button class="btn green" id="saveChecklistBtn">حفظ</button>
        <button class="btn" id="clearChecklistBtn">تنظيف</button>
      </div>

      <div class="note" id="checklistMessage">جاهز للحفظ.</div>
      <div class="alert error" id="checklistError" style="display:none"></div>

    </div>
  </section>

</main>

<!-- ✅ Firestore فقط – بدون Auth -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const techSelect = document.getElementById("cl_technician");
  const visitSelect = document.getElementById("cl_visit_ref");

  onSnapshot(collection(db,"technicians"), snap=>{
    techSelect.innerHTML = `<option value="">اختر الفني</option>` +
      snap.docs.map(d=>`<option value="${d.id}">${d.data().name||d.id}</option>`).join("");
  });

  onSnapshot(collection(db,"siteVisits"), snap=>{
    visitSelect.innerHTML = `<option value="">اختر الزيارة</option>` +
      snap.docs.map(d=>`<option value="${d.id}">${d.data().date||""}</option>`).join("");
  });

  document.getElementById("saveChecklistBtn").onclick = async ()=>{
    try{
      await addDoc(collection(db,"branch_checklists"),{
        technician: techSelect.value,
        visit: visitSelect.value,
        brand: document.getElementById("cl_brand").value,
        branchId: document.getElementById("cl_branch_id").value,
        location: document.getElementById("cl_location").value,
        visitDate: document.getElementById("cl_visit_date").value,
        createdAt: new Date()
      });
      document.getElementById("checklistMessage").innerText="تم الحفظ بنجاح ✅";
    }catch(e){
      document.getElementById("checklistError").style.display="block";
      document.getElementById("checklistError").innerText=e.message;
    }
  };

  document.getElementById("clearChecklistBtn").onclick = ()=>{
    document.querySelectorAll("input,select").forEach(el=>el.value="");
  };
</script>

</body>
</html>
