<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Check-List Auto-Link | MMC IT v1.3.0</title>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: var(--bg); color: #163247; padding: 15px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); overflow: hidden; max-width: 900px; margin: auto; }
    .card-header { background: var(--primary); color: #fff; padding: 15px; font-weight: 800; text-align: center; }
    .card-body { padding: 20px; }
    .section-title { margin: 15px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; }
    .grid-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .field { display: grid; gap: 5px; margin-bottom: 10px; }
    .field label { font-size: 12px; font-weight: 700; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 20px; font-size: 15px; }
    .btn-save:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">نموذج الفحص والربط التلقائي الفوري</div>
    <div class="card-body">
      <div class="section-title">بيانات الفني والزيارة</div>
      <div class="grid-fields">
        <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
        <div class="field"><label>الزيارة</label><select id="cl_visit_ref"></select></div>
        <div class="field"><label>الموقع</label><input id="cl_location" readonly /></div>
        <div class="field"><label>التاريخ</label><input id="cl_visit_date" type="date" /></div>
      </div>

      <div class="section-title">Dynamic Check-List (الأسئلة)</div>
      <div id="dynamicChecklistSections"></div>

      <button class="btn-save" id="saveChecklistBtn" onclick="saveAndPush()">حفظ وإرسال التحديثات فوراً ✅</button>
    </div>
  </div>

  <script>
    const db = window.parent.appDb;
    let state = { fields: [], techs: [], visits: [] };
    const $ = id => document.getElementById(id);

    async function boot() {
      if(!db) return;
      // تحميل الفنيين
      db.collection('technicians').onSnapshot(s => {
        state.techs = s.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.techs.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });
      // تحميل الحقول الديناميكية (Q29, Q30, Q31)
      db.collection('checklist_fields').onSnapshot(s => {
        state.fields = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.order||0)-(b.order||0));
        renderDynamicForm();
      });
    }

    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      container.innerHTML = '';
      state.fields.forEach(f => {
        let html = `<div class="field"><label>${f.labelAr || f.label}</label>`;
        if(f.repeat && f.repeat.enabled) {
          const count = Number(answers[f.repeat.countFromFieldId] || 0);
          for(let i=0; i<count; i++) html += `<input type="text" class="dyn-input" data-id="${f.id}" data-index="${i}" placeholder="ID ${i+1}" style="margin-bottom:5px" />`;
        } else {
          html += `<input type="text" class="dyn-input" data-id="${f.id}" onchange="renderDynamicForm(collectAnswers())" />`;
        }
        container.innerHTML += html + `</div>`;
      });
    }

    function collectAnswers() {
      const ans = {};
      document.querySelectorAll('.dyn-input').forEach(el => {
        const id = el.dataset.id;
        if(el.dataset.index !== undefined) { if(!ans[id]) ans[id]=[]; ans[id][el.dataset.index] = el.value; }
        else { ans[id] = el.value; }
      });
      return ans;
    }

    async function saveAndPush() {
      const btn = $('saveChecklistBtn');
      btn.disabled = true;
      const answers = collectAnswers();
      
      try {
        // 1. حفظ التقرير
        await db.collection('branch_checklists').add({
          technicianName: $('cl_technician').options[$('cl_technician').selectedIndex].text,
          dynamicAnswers: answers,
          createdAt: new Date().toISOString()
        });

        // 2. التحديث التلقائي لجدول الترقية (الطلب الأساسي)
        const batch = db.batch();
        let updatedCount = 0;

        for (let key in answers) {
          const val = answers[key];
          const ids = (Array.isArray(val) ? val : String(val).split(/[\n,]+/)).map(id => id.trim()).filter(id => id.length > 2);
          
          for (const empId of ids) {
            const q = await db.collection("windows_upgrades").where("employee_ID", "==", empId).get();
            q.forEach(d => {
              batch.update(d.ref, { status: 'completed', lastSync: new Date().toISOString() });
              updatedCount++;
            });
          }
        }

        if(updatedCount > 0) await batch.commit();
        alert(`تم الحفظ بنجاح! تم تحديث ${updatedCount} جهاز آلياً.`);
      } catch (e) { alert("خطأ: " + e.message); }
      btn.disabled = false;
    }

    window.onload = boot;
  </script>
</body>
</html>
