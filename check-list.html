<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMC IT | Checklist Dynamic Engine v1.1.8</title>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; }
    .container { max-width: 1300px; margin: 18px auto; padding: 0 14px 28px; }
    .grid-2 { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18, 48, 74, 0.08); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 15px; }
    .card-body { padding: 16px; }
    .section-title { margin: 18px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; }
    .field { display: grid; gap: 8px; margin-bottom: 12px; }
    .field label { font-size: 13px; font-weight: 700; color: #334155; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 12px; font-size: 13px; background: #fbfcfe; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 12px 24px; border-radius: 20px; font-weight: 700; cursor: pointer; width: 100%; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 12px; }
    th { background: #f8fbff; color: var(--primary); }
    tr.clickable { cursor: pointer; }
  </style>
</head>
<body>
  <main class="container">
    <div class="grid-2">
      <!-- نموذج الإدخال -->
      <section class="card">
        <h3>نموذج Check-List (مطابق للصور)</h3>
        <div class="card-body">
          <input id="editingChecklistId" type="hidden" />
          
          <div class="section-title">المعلومات الأساسية</div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>الزيارة</label><select id="cl_visit_ref"></select></div>
          </div>

          <div class="section-title">Check-List الديناميكي (Logic Engine)</div>
          <div id="dynamicChecklistSections"></div>

          <div style="margin-top:20px;">
            <button class="btn-save" id="saveChecklistBtn">حفظ Check-List</button>
          </div>
        </div>
      </section>

      <!-- سجلات المحفوظة -->
      <aside class="card">
        <h3>السجلات المحفوظة</h3>
        <div class="card-body">
          <div style="overflow:auto; max-height:500px;">
            <table>
              <thead>
                <tr><th>التاريخ</th><th>الموقع</th><th>ملخص Q28</th></tr>
              </thead>
              <tbody id="checklistTableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    var state = { checklists: [], checklistFields: [] };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));

    // --- محرك المنطق بناءً على إعدادات "إدارة البنود" في الصور ---

    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      container.innerHTML = '';
      
      state.checklistFields.forEach(field => {
        // 1. منطق الظهور الشرطي (كما في الصورة 2)
        const rule = field.logic && field.logic.visibleWhen;
        if (field.logic && field.logic.enabled && rule) {
          const sourceValue = answers[rule.fieldId] || answers[rule.fieldLabel]; 
          if (String(sourceValue || '').toLowerCase() !== String(rule.value || '').toLowerCase()) return; 
        }

        let fieldHtml = `<div class="field"><label>${esc(field.labelAr || field.label)}</label>`;
        
        // 2. منطق التكرار حسب العدد (كما في الصورة 3)
        if (field.repeat && field.repeat.enabled) {
          const count = Number(answers[field.repeat.countFromFieldId] || answers[field.repeat.countFromFieldLabel] || 0);
          for (let i = 0; i < count; i++) {
            const val = (answers[field.id] && answers[field.id][i]) || '';
            fieldHtml += `<input type="text" class="dyn-input" data-id="${field.id}" data-index="${i}" value="${esc(val)}" placeholder="Employee ID ${i+1}" style="margin-bottom:5px;" />`;
          }
        } else {
          // الحقول العادية
          const val = answers[field.id] || '';
          if (field.fieldType === 'choice') {
            fieldHtml += `<select class="dyn-input" data-id="${field.id}"><option value="">اختر</option>`;
            (field.options || []).forEach(o => fieldHtml += `<option value="${o.value}" ${val==o.value?'selected':''}>${esc(o.labelAr || o.label)}</option>`);
            fieldHtml += `</select>`;
          } else {
            fieldHtml += `<input type="${field.fieldType === 'number' ? 'number' : 'text'}" class="dyn-input" data-id="${field.id}" value="${esc(val)}" />`;
          }
        }
        
        container.innerHTML += fieldHtml + `</div>`;
      });

      // إعادة رسم النموذج عند تغيير القيم لتطبيق الشروط فوراً
      document.querySelectorAll('.dyn-input').forEach(el => {
        el.onchange = () => renderDynamicForm(collectAnswers());
      });
    }

    function collectAnswers() {
      const ans = {};
      document.querySelectorAll('.dyn-input').forEach(el => {
        const id = el.dataset.id;
        if (el.dataset.index !== undefined) {
          if (!ans[id]) ans[id] = [];
          ans[id][el.dataset.index] = el.value;
        } else {
          ans[id] = el.value;
        }
      });
      return ans;
    }

    // --- الربط مع Firebase ---
    async function boot() {
      const db = window.parent.appDb;
      if (!db) return;

      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.order||0)-(b.order||0));
        renderDynamicForm();
      });

      db.collection('branch_checklists').orderBy('visitDate', 'desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderTable();
      });
    }

    function renderTable() {
      $('checklistTableBody').innerHTML = state.checklists.map(r => `
        <tr class="clickable" onclick="renderDynamicForm(${JSON.stringify(r.dynamicAnswers).replace(/"/g, '&quot;')})">
          <td>${esc(r.visitDate)}</td><td>${esc(r.locationSite)}</td><td>${esc(r.q28_serviceReportSummary || '-')}</td>
        </tr>
      `).join('');
    }

    boot();
  })();
  </script>
</body>
</html>
