<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List | المجدوعي للسيارات v1.8.0</title>
  <style>
    /* تم استعادة تصميمك الأصلي بالكامل للمحافظة على واجهة النظام */
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; }
    .container { max-width: 1350px; margin: 18px auto; padding: 0 14px 28px; }
    .grid-2 { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18, 48, 74, 0.08); overflow: hidden; margin-bottom: 16px; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 15px; }
    .card-body { padding: 16px; }
    .section-title { margin: 18px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; font-size: 14px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 12px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #fbfcfe; outline: none; }
    .field input[readonly] { background: #f1f5f9; cursor: not-allowed; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; max-height: 600px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 12px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; }
    tr.clickable { cursor: pointer; transition: 0.2s; }
    tr.clickable:hover { background: #f1f7fd; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 12px 30px; border-radius: 25px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; }
  </style>
</head>
<body>
  <main class="container">
    <div class="grid-2">
      <!-- القسم الأول: النموذج الرئيسي -->
      <section class="card">
        <h3>نموذج Check-List (مرتبط بالفنيين والزيارة)</h3>
        <div class="card-body">
          <input id="editingChecklistId" type="hidden" />
          
          <!-- 1. الربط مع الفني والزيارة -->
          <div class="section-title">الربط مع الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>1- الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>2- الزيارة المرتبطة</label><select id="cl_visit_ref"></select></div>
            <div class="field"><label>3- البريد الإلكتروني للفني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>4- معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>5- المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>6- المنطقة</label><input id="cl_region" readonly /></div>
          </div>

          <!-- 2. Basic Information -->
          <div class="section-title">Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>1- Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>2- Brand Key</label><input id="cl_brandKey" /></div>
            <div class="field"><label>3- Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>4- Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>5- Visit Scheduled with Branch Manager</label><select id="cl_visit_scheduled"><option value="">اختر</option><option>Yes</option><option>No</option></select></div>
            <div class="field"><label>6- Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>7- Month</label><input id="cl_month" readonly /></div>
            <div class="field"><label>8- Calendar Booked</label><select id="cl_calendar_booked"><option value="">اختر</option><option>Yes</option><option>No</option></select></div>
          </div>

          <!-- 3. Dynamic Check-List -->
          <div class="section-title">Dynamic Check-List</div>
          <div id="dynamicChecklistSections"></div>

          <div style="margin-top:25px;">
            <button class="btn-save" id="saveChecklistBtn">حفظ وإرسال إلى الترقية ✅</button>
          </div>
        </div>
      </section>

      <!-- القسم الثاني: السجلات المحفوظة (الجانبي) -->
      <aside class="card">
        <h3>السجلات المحفوظة</h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;" />
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>تاريخ الزيارة</th><th>الفني</th><th>الموقع</th><th>الحالة</th></tr>
              </thead>
              <tbody id="checklistTableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    var state = { checklists: [], checklistFields: [], technicians: [], visits: [] };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));

    async function boot() {
      const db = window.parent.appDb;
      if (!db) return;

      // تحميل قائمة الفنيين
      db.collection('technicians').onSnapshot(snap => {
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });

      // جلب الزيارات عند اختيار فني
      $('cl_technician').onchange = async function() {
        const tech = state.technicians.find(t => t.id === this.value);
        if (tech) {
          $('cl_technician_email').value = tech.email || '';
          $('cl_technician_id').value = tech.authUid || tech.id;
          const vSnap = await db.collection('siteVisits').where('technicianDocId', '==', this.value).get();
          state.visits = vSnap.docs.map(d => ({id:d.id, ...d.data()}));
          $('cl_visit_ref').innerHTML = '<option value="">اختر الزيارة</option>' + state.visits.map(v => `<option value="${v.id}">${v.date} - ${v.branchName}</option>`).join('');
        }
      };

      // تعبئة البيانات تلقائياً عند اختيار الزيارة
      $('cl_visit_ref').onchange = function() {
        const v = state.visits.find(vis => vis.id === this.value);
        if (v) {
          $('cl_brand').value = v.brand || '';
          $('cl_branch_id').value = v.branchId || '';
          $('cl_location').value = v.branchName || '';
          $('cl_city').value = v.city || '';
          $('cl_region').value = v.region || '';
          $('cl_visit_date').value = v.date || '';
          const d = new Date(v.date);
          if(!isNaN(d)) $('cl_month').value = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][d.getMonth()];
        }
      };

      // تحميل الحقول الديناميكية
      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.order||0)-(b.order||0));
        renderDynamicForm();
      });

      // السجلات المحفوظة
      db.collection('branch_checklists').orderBy('createdAt', 'desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderTable();
      });

      $('saveChecklistBtn').onclick = saveChecklist;
    }

    // محرك الأسئلة الديناميكي مع منطق الظهور والتكرار
    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      container.innerHTML = '';
      state.checklistFields.forEach(field => {
        // منطق الظهور الشرطي (نعم/لا)[cite: 1]
        if (field.logic && field.logic.enabled && field.logic.visibleWhen) {
          const rule = field.logic.visibleWhen;
          const depVal = answers[rule.fieldId] || answers[rule.fieldLabel] || '';
          if (String(depVal).toLowerCase() !== String(rule.value).toLowerCase()) return;
        }

        let html = `<div class="field" style="margin-top:10px"><label>${esc(field.labelAr || field.label)}</label>`;
        // منطق التكرار حسب العدد[cite: 1]
        if (field.repeat && field.repeat.enabled) {
          const countSrc = field.repeat.countFromFieldId || field.repeat.countFromFieldLabel;
          const count = Number(answers[countSrc] || 0);
          for (let i = 0; i < count; i++) {
            const val = (answers[field.id] && answers[field.id][i]) || '';
            html += `<input type="text" class="dyn-input" data-id="${field.id}" data-index="${i}" value="${esc(val)}" style="margin-bottom:5px;" placeholder="Employee ID ${i+1}" />`;
          }
        } else {
          const val = answers[field.id] || '';
          if (field.fieldType === 'choice') {
            html += `<select class="dyn-input" data-id="${field.id}"><option value="">اختر</option>`;
            (field.options || []).forEach(o => html += `<option value="${o.value}" ${val==o.value?'selected':''}>${esc(o.labelAr || o.label)}</option>`);
            html += `</select>`;
          } else {
            html += `<input type="text" class="dyn-input" data-id="${field.id}" value="${esc(val)}" onchange="renderDynamicForm(collectAnswers())" />`;
          }
        }
        container.innerHTML += html + `</div>`;
      });
    }

    function collectAnswers() {
      const ans = {};
      document.querySelectorAll('.dyn-input').forEach(el => {
        const id = el.dataset.id;
        if (el.dataset.index !== undefined) { if (!ans[id]) ans[id] = []; ans[id][el.dataset.index] = el.value; }
        else { ans[id] = el.value; }
      });
      return ans;
    }

    // وظيفة الحفظ والربط مع الترقية[cite: 1]
    async function saveChecklist() {
      const db = window.parent.appDb;
      const btn = $('saveChecklistBtn');
      btn.disabled = true;
      const answers = collectAnswers();

      try {
        // 1. حفظ التقرير في Checklist[cite: 1]
        await db.collection('branch_checklists').add({
          technicianName: $('cl_technician').options[$('cl_technician').selectedIndex].text,
          locationSite: $('cl_location').value,
          dynamicAnswers: answers,
          visitDate: $('cl_visit_date').value,
          createdAt: new Date().toISOString()
        });

        // 2. تحديث الترقية (Windows Upgrades) فوراً[cite: 1]
        const batch = db.batch();
        let upCount = 0;
        for (let key in answers) {
          const ids = (Array.isArray(answers[key]) ? answers[key] : String(answers[key]).split(/[\n,]+/)).map(id => id.trim()).filter(id => id.length > 2);
          for (const empId of ids) {
            const q = await db.collection("windows_upgrades").where("employee_ID", "==", empId).get();
            q.forEach(doc => { batch.update(doc.ref, { status: 'completed', lastSync: new Date().toISOString() }); upCount++; });
          }
        }
        if (upCount > 0) await batch.commit();
        alert(`تم الحفظ وتحديث ${upCount} جهاز بنجاح!`);
        location.reload();
      } catch (e) { alert("Error: " + e.message); }
      btn.disabled = false;
    }

    function renderTable() {
      $('checklistTableBody').innerHTML = state.checklists.slice(0, 15).map(r => `
        <tr><td>${esc(r.visitDate)}</td><td>${esc(r.technicianName)}</td><td>${esc(r.locationSite)}</td><td>✅</td></tr>
      `).join('');
    }

    boot();
  })();
  </script>
</body>
</html>
