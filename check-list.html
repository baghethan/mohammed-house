<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v2.2.3</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; font-size: 13px; }
    .container { max-width: 98%; margin: 15px auto; padding-bottom: 30px; }
    .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; transition: 0.3s; }
    .grid-full { grid-template-columns: 1fr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 25px rgba(18,48,74,0.06); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 15px; }
    .section-title { margin: 15px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding: 5px 10px; background: #f8fbff; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .field label { font-size: 11px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; outline: none; }
    .field input[readonly] { background: #f1f5f9; }
    .choices-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
    .pill-box { border: 1px solid #d1d9e6; border-radius: 30px; padding: 6px 15px; display: flex; align-items: center; gap: 8px; background: #fff; cursor: pointer; font-size: 11px; }
    .pill-box.selected { border-color: var(--primary); background: #eef6ff; font-weight: 700; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 14px; border-radius: 30px; font-weight: 800; width: 100%; font-size: 14px; margin-top: 20px; cursor: pointer; }
    
    /* تنسيق الجدول العريض */
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; max-height: 750px; background: #fff; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 11px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; font-weight: 800; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: #f1f7fd; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <div id="mainLayout" class="grid-main">
      <section class="card">
        <h3>نموذج الفحص الشامل v2.2.3 <span id="roleBadge" style="font-size:10px;"></span></h3>
        <div class="card-body">
          <input id="editingChecklistId" type="hidden" />
          <div class="section-title">1- الربط مع الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>الفني *</label><select id="cl_technician"></select></div>
            <div class="field"><label>الزيارة المرتبطة *</label><select id="cl_visit_ref"><option value="">اختر الفني أولاً</option></select></div>
            <div class="field"><label>البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>المنطقة</label><input id="cl_region" readonly /></div>
          </div>
          <div class="section-title">2- Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>Brand Key</label><input id="cl_brandKey" /></div>
            <div class="field"><label>Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>مدير الفرع</label><input id="cl_branch_manager" placeholder="الاسم / المعرف" /></div>
            <div class="field"><label>Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>Month</label><input id="cl_month" readonly /></div>
          </div>
          <div class="section-title">3- Dynamic Check-List</div>
          <div id="dynamicChecklistSections"></div>
          <button class="btn-save" id="saveChecklistBtn">حفظ وإرسال التقرير ✅</button>
          <button class="btn-save" id="newFormBtn" style="background:var(--primary); display:none; margin-top:10px;" onclick="location.reload()">إنشاء نموذج جديد ➕</button>
        </div>
      </section>

      <aside id="adminSidebar" class="card">
        <h3>السجلات المحفوظة (إدارة) <div class="excel-tools"><button class="btn-excel" id="exportExcelBtn">Excel 📥</button></div></h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:8px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;" />
          <div class="table-wrap">
            <table id="mainRecordsTable">
              <thead>
                <tr id="tableHeaderRow">
                  <th>تاريخ الزيارة</th>
                  <th>الفني</th>
                  <th>Brand</th>
                  <th>Branch ID</th>
                  <th>Location/Site</th>
                  <th>مدير الفرع</th>
                  <!-- البنود الديناميكية ستضاف هنا آلياً -->
                </tr>
              </thead>
              <tbody id="checklistTableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    var state = { checklists: [], checklistFields: [], technicians: [], userProfile: null, canEdit: false };
    const $ = (id) => document.getElementById(id);
    function resolveRef(id, lbl) { return (id && state.checklistFields.find(f => f.id === id)) || (lbl && state.checklistFields.find(f => f.label === lbl)) || null; }

    async function checkAuth() {
      const auth = window.parent.appAuth; const db = window.parent.appDb;
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) { 
            state.userProfile = doc.data(); 
            state.canEdit = (state.userProfile.role === 'admin' || state.userProfile.role === 'supervisor'); 
            applyPrivacyUI(); 
          }
          boot();
        }
      });
    }

    function applyPrivacyUI() {
      if (!state.canEdit) { $('adminSidebar').classList.add('hidden'); $('mainLayout').classList.add('grid-full'); }
      else { $('adminSidebar').classList.remove('hidden'); $('mainLayout').classList.remove('grid-full'); }
    }

    async function loadVisitsForTech(techId, visitId = null) {
      const db = window.parent.appDb; const vSnap = await db.collection('siteVisits').where('technicianDocId', '==', techId).get();
      const visits = vSnap.docs.map(d => ({id:d.id, ...d.data()}));
      const completedIds = state.checklists.map(c => c.visitDocId);
      // الفني لا يرى الزيارات التي تم إنجازها
      let filtered = state.canEdit ? visits : visits.filter(v => !completedIds.includes(v.id) || v.id === visitId);
      $('cl_visit_ref').innerHTML = '<option value="">اختر الزيارة</option>' + filtered.map(v => `<option value="${v.id}" ${visitId===v.id?'selected':''}>${v.date} - ${v.branchName}</option>`).join('');
    }

    async function boot() {
      const db = window.parent.appDb;
      db.collection('branch_checklists').orderBy('createdAt','desc').onSnapshot(snap => { 
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()})); 
        if (state.canEdit) renderTable(); 
      });
      db.collection('technicians').onSnapshot(snap => { 
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()})); 
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join(''); 
      });
      db.collection('checklist_fields').onSnapshot(snap => { 
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (Number(a.order)||0)-(Number(b.order)||0)); 
        renderDynamicForm(); 
        if (state.canEdit) updateTableHeaders();
      });

      $('cl_technician').onchange = (e) => { 
        const t = state.technicians.find(x => x.id === e.target.value); 
        if(t){ $('cl_technician_email').value=t.email||''; $('cl_technician_id').value=t.authUid||t.id; loadVisitsForTech(e.target.value); } 
      };
      
      $('cl_visit_ref').onchange = (e) => {
        db.collection('siteVisits').doc(e.target.value).get().then(doc => {
          if(doc.exists){
            const v = doc.data(); $('cl_brand').value=v.brand||''; $('cl_brandKey').value=v.brandKey||''; $('cl_branch_id').value=v.branchId||''; $('cl_location').value=v.branchName||''; $('cl_city').value=v.city||''; $('cl_region').value=v.region||''; $('cl_visit_date').value=v.date||'';
            const d = new Date(v.date); if(!isNaN(d)) $('cl_month').value = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][d.getMonth()];
          }
        });
      };

      $('exportExcelBtn').onclick = exportToExcel;
      $('saveChecklistBtn').onclick = saveChecklist;
    }

    // إضافة الأعمدة الديناميكية لرأس الجدول
    function updateTableHeaders() {
      const headerRow = $('tableHeaderRow');
      headerRow.innerHTML = `<th>تاريخ الزيارة</th><th>الفني</th><th>Brand</th><th>Branch ID</th><th>Location/Site</th><th>مدير الفرع</th>`;
      state.checklistFields.forEach(f => {
        const th = document.createElement('th');
        th.innerText = f.labelAr || f.label;
        headerRow.appendChild(th);
      });
    }

    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections'); container.innerHTML = '';
      const currentAnswers = Object.keys(answers).length ? answers : collectAnswers();
      state.checklistFields.forEach(field => {
        if (field.logic?.enabled && field.logic?.visibleWhen) { 
          const rule = field.logic.visibleWhen; const src = resolveRef(rule.fieldId, rule.fieldLabel); 
          if (String(src ? currentAnswers[src.id] : '').toLowerCase() !== String(rule.value).toLowerCase()) return; 
        }
        let html = `<div class="field"><label>${esc(field.labelAr || field.label)}</label>`;
        const val = currentAnswers[field.id] || '';
        if (field.repeat?.enabled) {
          const countSrc = resolveRef(field.repeat.countFromFieldId, field.repeat.countFromFieldLabel); const count = Number(countSrc ? currentAnswers[countSrc.id] : 0);
          for (let i = 0; i < count; i++) { html += `<div class="field" style="margin-top:5px;"><label>${esc(String(field.repeat.labelTemplate || '{index}').replace('{index}', i + 1))}</label><input type="text" class="dyn-input" data-id="${field.id}" data-index="${i}" value="${esc(currentAnswers[field.id]?.[i]||'')}" /></div>`; }
        } else if (field.fieldType === 'choice' && (field.renderMode === 'checkboxes' || field.renderMode === 'radios')) {
          html += `<div class="choices-grid">`; (field.options || []).forEach(opt => { const isChecked = Array.isArray(val) ? val.includes(opt.value) : val === opt.value; html += `<div class="pill-box ${isChecked?'selected':''}" onclick="const inp=this.querySelector('input'); inp.click();"><span>${esc(opt.label)}</span><input type="${field.renderMode==='checkboxes'?'checkbox':'radio'}" name="g_${field.id}" class="dyn-input" data-id="${field.id}" value="${esc(opt.value)}" ${isChecked?'checked':''} onclick="event.stopPropagation(); renderDynamicForm(collectAnswers());"></div>`; }); html += `</div>`;
        } else {
          if (field.fieldType === 'choice') html += `<select class="dyn-input" data-id="${field.id}" onchange="renderDynamicForm(collectAnswers())"><option value="">اختر</option>${(field.options||[]).map(o=>`<option value="${o.value}" ${val==o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
          else html += `<input type="text" class="dyn-input" data-id="${field.id}" value="${esc(val)}" onchange="renderDynamicForm(collectAnswers())" />`;
        }
        container.innerHTML += html + `</div>`;
      });
    }

    function collectAnswers() {
      const ans = {}; document.querySelectorAll('.dyn-input').forEach(el => {
        const id = el.dataset.id; if (el.type === 'checkbox') { if(!ans[id]) ans[id]=[]; if(el.checked) ans[id].push(el.value); } else if (el.type === 'radio') { if(el.checked) ans[id] = el.value; } else if (el.dataset.index !== undefined) { if(!ans[id]) ans[id]=[]; ans[id][el.dataset.index] = el.value; } else ans[id] = el.value;
      }); return ans;
    }

    async function saveChecklist() {
      const db = window.parent.appDb; const answers = collectAnswers(); const techDropdown = $('cl_technician');
      const payload = { technicianDocId: techDropdown.value, technicianName: techDropdown.options[techDropdown.selectedIndex].text, technicianEmail: $('cl_technician_email').value, technicianAuthId: $('cl_technician_id').value, visitDocId: $('cl_visit_ref').value, locationSite: $('cl_location').value, city: $('cl_city').value, region: $('cl_region').value, brand: $('cl_brand').value, brandKey: $('cl_brandKey').value, branchId: $('cl_branch_id').value, visitDate: $('cl_visit_date').value, month: $('cl_month').value, branchManager: $('cl_branch_manager').value, dynamicAnswers: answers, createdAt: new Date().toISOString() };
      try { const id = $('editingChecklistId').value; if (id) await db.collection('branch_checklists').doc(id).update(payload); else await db.collection('branch_checklists').add(payload); alert("تم الحفظ بنجاح!"); location.reload(); } catch (e) { alert("خطأ: " + e.message); }
    }

    function renderTable() {
      const body = $('checklistTableBody'); body.innerHTML = '';
      state.checklists.forEach(r => {
        const tr = document.createElement('tr'); tr.className = 'clickable';
        tr.onclick = () => window.openChecklistLocally(r.id);
        let html = `<td>${esc(r.visitDate)}</td><td>${esc(r.technicianName)}</td><td>${esc(r.brand)}</td><td>${esc(r.branchId)}</td><td>${esc(r.locationSite)}</td><td>${esc(r.branchManager)}</td>`;
        state.checklistFields.forEach(f => {
          const ans = r.dynamicAnswers?.[f.id];
          html += `<td>${esc(Array.isArray(ans) ? ans.join(', ') : ans)}</td>`;
        });
        tr.innerHTML = html; body.appendChild(tr);
      });
    }

    function exportToExcel() {
      const data = state.checklists.map(r => {
        const row = { "تاريخ الزيارة": r.visitDate, "الفني": r.technicianName, "Brand": r.brand, "Branch ID": r.branchId, "Location/Site": r.locationSite, "مدير الفرع": r.branchManager };
        state.checklistFields.forEach(f => { const ans = r.dynamicAnswers?.[f.id]; row[f.labelAr || f.label] = Array.isArray(ans) ? ans.join(', ') : ans; });
        return row;
      });
      const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Full_Checklist"); XLSX.writeFile(wb, "Full_Checklist_Report.xlsx");
    }

    window.openChecklistLocally = async (id) => {
      const r = state.checklists.find(x => x.id === id); if(!r) return;
      $('editingChecklistId').value = r.id; $('cl_technician').value = r.technicianDocId || '';
      await loadVisitsForTech(r.technicianDocId, r.visitDocId);
      const map = { technicianEmail:'cl_technician_email', technicianId:'cl_technician_id', city:'cl_city', region:'cl_region', brand:'cl_brand', brandKey:'cl_brandKey', branchId:'cl_branch_id', locationSite:'cl_location', visitDate:'cl_visit_date', month:'cl_month', branchManager:'cl_branch_manager' };
      Object.keys(map).forEach(k => { if($(map[k])) $(map[k]).value = r[k] || ''; });
      renderDynamicForm(r.dynamicAnswers || {});
    };

    checkAuth();
  })();
  </script>
</body>
</html>
