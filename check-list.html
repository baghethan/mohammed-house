<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>check-list.html - Dynamic Activation v1.1.5</title>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: var(--bg); color: #163247; }
    .container { max-width: 1300px; margin: 18px auto; padding: 0 14px 28px; }
    .grid-2 { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18, 48, 74, 0.08); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 15px; }
    .card-body { padding: 16px; }
    .section-title { margin: 18px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; }
    .field { display: grid; gap: 8px; margin-bottom: 12px; }
    .field label { font-size: 13px; font-weight: 700; color: #444; }
    .field input, .field select, .field textarea { padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #fbfcfe; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 12px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; }
    tr.clickable { cursor: pointer; transition: 0.2s; }
    tr.clickable:hover { background: #f1f7fd; }
    .btn { padding: 10px 20px; border-radius: 20px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .btn-save { background: var(--green); color: #fff; }
    .btn-clear { background: #e2e8f0; color: #475569; }
  </style>
</head>
<body>
  <main class="container">
    <div class="grid-2">
      <!-- الجزء الأول: نموذج الإدخال (النشط) -->
      <section class="card">
        <h3>نموذج Check-List (Dynamic Activated)</h3>
        <div class="card-body">
          <input id="editingChecklistId" type="hidden" />
          
          <div class="section-title">المعلومات الأساسية</div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>الزيارة</label><select id="cl_visit_ref"></select></div>
            <div class="field"><label>Brand</label><input id="cl_brand" placeholder="مثلاً: Hyundai" /></div>
            <div class="field"><label>Branch ID</label><input id="cl_branch_id" placeholder="مثلاً: 101" /></div>
          </div>

          <!-- تفعيل القسم الديناميكي -->
          <div class="section-title">Check-List الديناميكي (dynamicAnswers)</div>
          <div id="dynamicChecklistSections">
            <div style="padding:20px; text-align:center; color:#94a3b8;">جاري تحميل الأسئلة من checklist_fields...</div>
          </div>

          <div style="display:flex; gap:10px; margin-top:25px;">
            <button class="btn btn-save" id="saveChecklistBtn">حفظ التقرير</button>
            <button class="btn btn-clear" id="clearChecklistBtn">تنظيف النموذج</button>
          </div>
          <div id="checklistMessage" style="margin-top:10px;"></div>
        </div>
      </section>

      <!-- الجزء الثاني: جدول السجلات -->
      <aside class="card">
        <h3>السجلات المحفوظة</h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="ابحث بالفني، الموقع، أو ملخص Q28..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;" />
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>التاريخ</th>
                  <th>الفني</th>
                  <th>الموقع</th>
                  <th>ملخص Q28</th>
                </tr>
              </thead>
              <tbody id="checklistTableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    var state = { checklists: [], checklistFields: [], technicians: [], visits: [] };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));

    // 1. تفعيل بناء الأسئلة الديناميكية
    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      if (!state.checklistFields.length) {
        container.innerHTML = '<div style="color:red; padding:10px;">لا توجد حقول معرفة في checklist_fields.</div>';
        return;
      }
      container.innerHTML = '';
      state.checklistFields.forEach(field => {
        const val = answers[field.id] || '';
        let html = `<div class="field"><label>${esc(field.labelAr || field.label)}</label>`;
        if (field.fieldType === 'choice') {
          html += `<select class="dynamic-input" data-id="${field.id}"><option value="">اختر الإجابة</option>`;
          (field.options || []).forEach(opt => {
            html += `<option value="${opt.value}" ${val == opt.value ? 'selected' : ''}>${esc(opt.labelAr || opt.label)}</option>`;
          });
          html += `</select>`;
        } else {
          html += `<input type="text" class="dynamic-input" data-id="${field.id}" value="${esc(val)}" placeholder="أدخل الإجابة هنا..." />`;
        }
        html += `</div>`;
        container.innerHTML += html;
      });
    }

    // 2. جمع الإجابات الديناميكية لحفظها في dynamicAnswers
    function collectDynamicAnswers() {
      const answers = {};
      document.querySelectorAll('.dynamic-input').forEach(input => {
        answers[input.dataset.id] = input.value;
      });
      return answers;
    }

    // 3. فتح السجل للتعديل (إصلاح خطأ openChecklistForEdit)
    window.openChecklistForEdit = function(id) {
      const record = state.checklists.find(r => r.id === id);
      if (!record) return;
      $('editingChecklistId').value = record.id;
      $('cl_brand').value = record.brand || '';
      $('cl_branch_id').value = record.branchId || '';
      renderDynamicForm(record.dynamicAnswers || {}); // شحن الإجابات الديناميكية[cite: 1]
      $('formTitle').innerText = "تعديل تقرير: " + record.locationSite;
    };

    // 4. عرض الجدول مع ملخص Q28[cite: 1]
    function renderTable() {
      const q = ($('checklistSearch').value || '').trim().toLowerCase();
      const filtered = state.checklists.filter(r => !q || 
        [r.technicianName, r.locationSite, r.q28_serviceReportSummary].some(v => String(v||'').toLowerCase().includes(q)));

      $('checklistTableBody').innerHTML = filtered.map(r => `
        <tr class="clickable" onclick="openChecklistForEdit('${r.id}')">
          <td>${esc(r.visitDate)}</td>
          <td>${esc(r.technicianName)}</td>
          <td>${esc(r.locationSite)}</td>
          <td style="color:var(--primary); font-weight:bold;">${esc(r.q28_serviceReportSummary || '-')}</td>
        </tr>
      `).join('');
    }

    // 5. التشغيل والربط مع Firestore[cite: 1]
    async function boot() {
      const db = window.parent.appDb;
      if (!db) return;

      // أ: تفعيل جلب الحقول الديناميكية[cite: 1]
      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.order || 0) - (b.order || 0));
        renderDynamicForm();
      });

      // ب: تفعيل جلب السجلات المحفوظة[cite: 1]
      db.collection('branch_checklists').orderBy('visitDate', 'desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderTable();
      });

      $('saveChecklistBtn').onclick = async () => {
        const id = $('editingChecklistId').value;
        const answers = collectDynamicAnswers(); // جمع الاختيارات الديناميكية[cite: 1]
        const payload = {
            brand: $('cl_brand').value,
            branchId: $('cl_branch_id').value,
            dynamicAnswers: answers, // الحفظ في dynamicAnswers[cite: 1]
            q28_serviceReportSummary: Object.values(answers)[0] || "تم التحديث", // ملخص بسيط للتجربة[cite: 1]
            updatedAt: new Date()
        };
        if(id) await db.collection('branch_checklists').doc(id).update(payload);
        else await db.collection('branch_checklists').add(payload);
        alert("تم الحفظ وتحديث dynamicAnswers!");
      };

      $('checklistSearch').oninput = renderTable;
      $('clearChecklistBtn').onclick = () => { $('editingChecklistId').value = ''; renderDynamicForm(); };
    }

    boot();
  })();
  </script>
</body>
</html>
