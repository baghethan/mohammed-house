<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List | المجدوعي للسيارات v1.8.6</title>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; --orange: #f59e0b; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; }
    .container { max-width: 1350px; margin: 18px auto; padding: 0 14px 28px; }
    .grid-2 { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18,48,74,0.08); overflow: hidden; margin-bottom: 16px; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 16px; }
    .section-title { margin: 18px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; font-size: 14px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 12px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #fbfcfe; outline: none; }
    .field input[readonly], .field select[disabled] { background: #f1f5f9; cursor: not-allowed; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 12px 30px; border-radius: 25px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; }
    .btn-save:disabled { background: #cbd5e1; cursor: not-allowed; }
    .permission-banner { padding: 10px; border-radius: 10px; font-size: 12px; margin-bottom: 15px; font-weight: 700; text-align: center; border: 1px solid transparent; display: none; }
    .read-only-mode { background: #fffbeb; color: var(--orange); border-color: #fef3c7; }
    .edit-mode { background: #f0fdf4; color: var(--green); border-color: #dcfce7; }
    .badge-role { font-size: 10px; padding: 4px 8px; border-radius: 4px; background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <main class="container">
    <div class="grid-2">
      <section class="card">
        <h3>
          نموذج Check-List (إدارة الصلاحيات)
          <span id="roleBadge" class="badge-role">التحقق من الهوية...</span>
        </h3>
        <div class="card-body">
          <!-- تنبيه وضع الصلاحية -->
          <div id="permissionNotice" class="permission-banner"></div>
          
          <input id="editingChecklistId" type="hidden" />
          
          <div class="section-title">بيانات الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>1- الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>2- الزيارة المرتبطة</label><select id="cl_visit_ref"></select></div>
            <div class="field"><label>3- البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>4- معرف الفني</label><input id="cl_technician_id" readonly /></div>
          </div>

          <div class="section-title">Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>1- Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>2- Brand Key</label><input id="cl_brandKey" /></div>
            <div class="field"><label>3- Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>4- Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>5- Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>6- Month</label><input id="cl_month" readonly /></div>
          </div>

          <div class="section-title">Dynamic Check-List</div>
          <div id="dynamicChecklistSections"></div>

          <div style="margin-top:25px;">
            <button class="btn-save" id="saveChecklistBtn">حفظ التعديلات ✅</button>
          </div>
        </div>
      </section>

      <aside class="card">
        <h3>السجلات المحفوظة</h3>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead><tr><th>التاريخ</th><th>الفني</th><th>الموقع</th></tr></thead>
              <tbody id="checklistTableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    var state = { 
        checklists: [], 
        checklistFields: [], 
        technicians: [], 
        userProfile: null,
        canEdit: false // الحالة الافتراضية هي قراءة فقط
    };
    
    const $ = (id) => document.getElementById(id);

    async function checkAuthAndPermissions() {
      const auth = window.parent.appAuth;
      const db = window.parent.appDb;
      
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          // جلب الصلاحية من app_users المربوط بصفحة Permissions
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) {
            state.userProfile = doc.data();
            const role = state.userProfile.role || 'user';
            
            // تحديد صلاحية التعديل الشاملة بناءً على الدور
            state.canEdit = (role === 'admin' || role === 'supervisor');
            
            updatePermissionUI(role);
          }
          boot();
        }
      });
    }

    function updatePermissionUI(role) {
      const notice = $('permissionNotice');
      notice.style.display = 'block';
      $('roleBadge').innerText = "الدور: " + role.toUpperCase();

      if (state.canEdit) {
        notice.className = "permission-banner edit-mode";
        notice.innerText = "✅ وضع التعديل: لديك كامل الصلاحية لتغيير البيانات.";
      } else {
        notice.className = "permission-banner read-only-mode";
        notice.innerText = "👁️ وضع القراءة: يمكنك استعراض السجلات فقط.";
        // قفل أزرار الحفظ فوراً إذا كان المستخدم لا يملك صلاحية تعديل
        $('saveChecklistBtn').style.display = 'none';
      }
    }

    async function boot() {
      const db = window.parent.appDb;
      // تحميل الفنيين والحقول كالمعتاد
      db.collection('technicians').onSnapshot(snap => {
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });

      db.collection('branch_checklists').orderBy('createdAt', 'desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderTable();
      });

      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.order||0)-(b.order||0));
        renderDynamicForm();
      });

      $('saveChecklistBtn').onclick = saveChecklist;
    }

    window.openChecklistLocally = async function(id) {
      const row = state.checklists.find(r => r.id === id);
      if (!row) return;

      $('editingChecklistId').value = row.id;
      // ملء الحقول...
      $('cl_technician').value = row.technicianDocId || '';
      $('cl_location').value = row.locationSite || '';
      $('cl_visit_date').value = row.visitDate || '';
      
      renderDynamicForm(row.dynamicAnswers || {});

      // تطبيق "قراءة فقط" عند فتح أي سجل قديم إذا لم يكن المستخدم أدمن
      if (!state.canEdit) {
        document.querySelectorAll('input, select').forEach(el => el.disabled = true);
        $('saveChecklistBtn').disabled = true;
      }
    };

    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      container.innerHTML = '';
      state.checklistFields.forEach(field => {
        let html = `<div class="field" style="margin-top:10px"><label>${field.labelAr || field.label}</label>`;
        const val = answers[field.id] || '';
        html += `<input type="text" class="dyn-input" data-id="${field.id}" value="${val}" ${!state.canEdit && $('editingChecklistId').value ? 'disabled' : ''} />`;
        container.innerHTML += html + `</div>`;
      });
    }

    async function saveChecklist() {
      if (!state.canEdit) return alert("عذراً، لا تملك صلاحية التعديل.");
      const db = window.parent.appDb;
      const editId = $('editingChecklistId').value;
      
      const payload = {
        technicianDocId: $('cl_technician').value,
        locationSite: $('cl_location').value,
        visitDate: $('cl_visit_date').value,
        dynamicAnswers: {},
        updatedAt: new Date().toISOString()
      };
      
      document.querySelectorAll('.dyn-input').forEach(el => payload.dynamicAnswers[el.dataset.id] = el.value);

      try {
        if (editId) await db.collection('branch_checklists').doc(editId).update(payload);
        else { payload.createdAt = new Date().toISOString(); await db.collection('branch_checklists').add(payload); }
        alert("تم حفظ التعديلات بنجاح!");
        location.reload();
      } catch (e) { alert("خطأ: " + e.message); }
    }

    function renderTable() {
      $('checklistTableBody').innerHTML = state.checklists.map(r => `
        <tr class="clickable" onclick="openChecklistLocally('${r.id}')">
          <td>${r.visitDate}</td><td>${r.technicianName}</td><td>${r.locationSite}</td>
        </tr>
      `).join('');
    }

    checkAuthAndPermissions();
  })();
  </script>
</body>
</html>
