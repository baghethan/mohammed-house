<!DOCTYPE html>
<html lang="ar" dir=" charset="UTF-8"><html lang="ar" dir="rtl">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check‑List</title>

  <style>
    body{
      margin:0;
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;
      background:#edf3f8;
      color:#163247;
    }

    .container{
      max-width:1300px;
      margin:18px auto;
      padding:0 14px 28px;
    }

    .card{
      background:#fff;
      border:1px solid #d7e0ea;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(18,48,74,.08);
      margin-bottom:16px;
      overflow:hidden;
    }

    .card h3{
      margin:0;
      padding:12px 16px;
      background:#0d4b73;
      color:#fff;
      font-size:15px;
    }

    .card-body{padding:16px}

    .grid-4{
      display:grid;
      grid-template-columns:repeat(4,minmax(180px,1fr));
      gap:14px;
    }

    @media(max-width:1200px){
      .grid-4{grid-template-columns:1fr}
    }

    .field{display:grid;gap:8px}
    .field label{font-size:14px;font-weight:700}

    .field input,
    .field select{
      width:100%;
      border:1px solid #d7e0ea;
      border-radius:12px;
      padding:10px 12px;
      font:inherit;
      background:#fbfcfe;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .btn{
      border:1px solid #d7e0ea;
      border-radius:999px;
      padding:10px 16px;
      background:#fff;
      color:#0d4b73;
      font-weight:700;
      cursor:pointer;
    }

    .btn.green{background:#2f9e66;border-color:#2f9e66;color:#fff}

    .note{
      background:#f6fbff;
      border:1px dashed #bfd7e8;
      border-radius:12px;
      padding:10px 12px;
      margin-top:12px;
      font-size:14px;
    }

    .alert{
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      background:#ffecec;
      border:1px solid #f3b0b0;
      color:#8a1f1f;
      display:none;
    }
  </style>
</head>

<body>

<main class="container">

  <section class="card">
    <h3>نموذج Check‑List</h3>
    <div class="card-body">

      <div class="grid-4">
        <div class="field">
          <label>الفني</label>
          <select id="cl_technician"></select>
        </div>

        <div class="field">
          <label>الزيارة المرتبطة</label>
          <select id="cl_visit_ref"></select>
        </div>

        <div class="field">
          <label>Brand</label>
          <input id="cl_brand">
        </div>

        <div class="field">
          <label>Branch ID</label>
          <input id="cl_branch_id">
        </div>
      </div>

      <div class="actions">
        <button class="btn green" id="saveChecklistBtn">حفظ</button>
      </div>

      <div class="note" id="checklistMessage">جاهز للحفظ.</div>
      <div class="alert" id="checklistError"></div>

    </div>
  </section>

</main>

<!-- ✅ Firestore فقط – بدون initializeApp -->
<script type="module">
  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ✅ نستخدم Firebase App الموجود من Site-Visit2.html
  const db = getFirestore();

  const techSelect  = document.getElementById("cl_technician");
  const visitSelect = document.getElementById("cl_visit_ref");

  onSnapshot(collection(db,"technicians"), snap=>{
    techSelect.innerHTML =
      '<option value="">اختر الفني</option>' +
      snap.docs.map(d =>
        `<option value="${d.id}">${d.data().name || d.id}</option>`
      ).join("");
  });

  onSnapshot(collection(db,"siteVisits"), snap=>{
    visitSelect.innerHTML =
      '<option value="">اختر الزيارة</option>' +
      snap.docs.map(d =>
        `<option value="${d.id}">${d.data().date || ""}</option>`
      ).join("");
  });

  document.getElementById("saveChecklistBtn").onclick = async ()=>{
    try{
      await addDoc(collection(db,"branch_checklists"),{
        technicianId: techSelect.value,
        visitId: visitSelect.value,
        brand: document.getElementById("cl_brand").value,
        branchId: document.getElementById("cl_branch_id").value,
        createdAt: new Date()
      });

      document.getElementById("checklistMessage").innerText =
        "تم الحفظ بنجاح ✅";

      document.getElementById("checklistError").style.display="none";
    }catch(e){
      document.getElementById("checklistError").style.display="block";
      document.getElementById("checklistError").innerText=e.message;
    }
  };
</script>

</body>
</html>
