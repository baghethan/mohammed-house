<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v3.1.5</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; font-size: 13px; }
    .container { max-width: 98%; margin: 15px auto; padding-bottom: 30px; }
    .grid-main { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 15px; transition: 0.3s; }
    .grid-full { grid-template-columns: 1fr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 25px rgba(18,48,74,0.06); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 20px; }
    .section-title { margin: 15px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding: 5px 12px; background: #f8fbff; font-size: 13px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
    .field label { font-size: 11px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 9px; font-size: 12px; outline: none; background: #fbfcfe; }
    .field input[readonly] { background: #f1f5f9; cursor: not-allowed; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 16px; border-radius: 35px; font-weight: 800; width: 100%; font-size: 15px; margin-top: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(47,158,102,0.25); }
    .choices-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .pill-box { border: 1px solid #d1d9e6; border-radius: 40px; padding: 7px 18px; display: flex; align-items: center; gap: 12px; background: #fff; cursor: pointer; font-size: 11px; transition: 0.2s; min-width: 150px; }
    .pill-box.selected { border-color: var(--primary); background: #eef6ff; font-weight: 700; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; max-height: 800px; background: #fff; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 14px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 11px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; font-weight: 800; }
    tr.clickable { cursor: pointer; transition: 0.2s; }
    tr.clickable:hover { background: #f1f7fd; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <div id="mainLayout" class="grid-main">
      <section class="card">
        <h3>نموذج الفحص v3.1.5 (Native Sync) <span id="roleBadge" style="font-size:10px;"></span></h3>
        <div class="card-body">
          <input id="editingChecklistId" type="hidden" />
          <div class="section-title">1- بيانات الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>الفني *</label><select id="cl_technician"></select></div>
            <div class="field"><label>الزيارة المرتبطة *</label><select id="cl_visit_ref"><option value="">اختر الفني أولاً</option></select></div>
            <div class="field"><label>البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>المنطقة</label><input id="cl_region" readonly /></div>
          </div>
          <div class="section-title">2- Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>Brand Key</label><input id="cl_brandKey" readonly /></div>
            <div class="field"><label>Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>مدير الفرع</label><input id="cl_branch_manager" placeholder="ID / Name" /></div>
            <div class="field"><label>Visit Scheduled</label><select id="cl_visit_scheduled"><option value="">اختر</option><option value="yes">Yes</option><option value="no">No</option></select></div>
            <div class="field"><label>Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>Month</label><input id="cl_month" readonly /></div>
          </div>
          <div class="section-title">3- Dynamic IT Checklist (Live Fields)</div>
          <div id="dynamicChecklistSections"></div>
          <button class="btn-save" id="saveChecklistBtn">حفظ وإرسال التقرير ✅</button>
        </div>
      </section>

      <aside id="adminSidebar" class="card">
        <h3>السجلات المحفوظة (Admin Only) <div class="excel-tools"><button class="btn-tool btn-download" id="exportExcelBtn">Excel 📥</button></div></h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;" />
          <div class="table-wrap"><table id="mainTable"><thead><tr id="tableHeaderRow"></tr></thead><tbody id="checklistTableBody"></tbody></table></div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    // ✅ تصحيح مشكلة الـ Iframe: دالة تنظيف الكائنات لضمان التوافق مع Firebase
    const nativeClean = (data) => {
      if (data === null || typeof data !== 'object') return data;
      if (Array.isArray(data)) return window.parent.Array.from(data.map(nativeClean));
      const obj = new window.parent.Object();
      for (const key in data) { if (Object.prototype.hasOwnProperty.call(data, key)) { obj[key] = nativeClean(data[key]); } }
      return obj;
    };

    const esc = (v) => String(v == null || v === 'undefined' ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    var state = { checklists: [], checklistFields: [], technicians: [], userProfile: null, canEdit: false };
    const $ = (id) => document.getElementById(id);

    async function checkAuth() {
      const auth = window.parent.appAuth; const db = window.parent.appDb;
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) { 
            state.userProfile = doc.data(); 
            state.canEdit = (state.userProfile.role === 'admin' || state.userProfile.role === 'supervisor'); 
            applyPrivacyUI(); 
          }
          boot();
        }
      });
    }

    function applyPrivacyUI() { 
      if (!state.canEdit) { $('adminSidebar').classList.add('hidden'); $('mainLayout').classList.add('grid-full'); } 
    }

    window.renderDynamicForm = function(answers = {}) {
      const container = $('dynamicChecklistSections'); container.innerHTML = '';
      state.checklistFields.forEach(field => {
        let html = `<div class="field"><label>${esc(field.labelAr || field.label)}</label>`;
        const val = answers[field.id] || '';
        if (field.fieldType === 'choice') {
          html += `<select class="dyn-input" data-id="${field.id}"><option value="">اختر</option>${(field.options||[]).map(o=>`<option value="${o.value}" ${val==o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
        } else {
          html += `<input type="text" class="dyn-input" data-id="${field.id}" value="${esc(val)}" />`;
        }
        container.innerHTML += html + `</div>`;
      });
    };

    window.collectAnswers = function() {
      const ans = {}; 
      document.querySelectorAll('.dyn-input').forEach(el => { ans[el.dataset.id] = el.value; }); 
      return ans;
    };

    window.saveChecklist = async function() {
      const db = window.parent.appDb; 
      const techDropdown = $('cl_technician');
      const payload = { 
        technicianDocId: techDropdown.value, technicianName: techDropdown.options[techDropdown.selectedIndex].text, technicianEmail: $('cl_technician_email').value, technicianAuthId: $('cl_technician_id').value, 
        visitDocId: $('cl_visit_ref').value, locationSite: $('cl_location').value, city: $('cl_city').value, region: $('cl_region').value, brand: $('cl_brand').value, brandKey: $('cl_brandKey').value, branchId: $('cl_branch_id').value, visitDate: $('cl_visit_date').value, month: $('cl_month').value, branchManager: $('cl_branch_manager').value, visitScheduled: $('cl_visit_scheduled').value, dynamicAnswers: window.collectAnswers(), updatedAt: new Date().toISOString() 
      };
      if (!payload.visitDocId) return alert("يرجى اختيار الزيارة!");
      try { 
        const id = $('editingChecklistId').value; 
        const readyData = nativeClean(payload);
        if (id) await db.collection('branch_checklists').doc(id).update(readyData); 
        else { readyData.createdAt = new Date().toISOString(); await db.collection('branch_checklists').add(readyData); }
        alert("تم الحفظ وتحديث الزيارة ✅"); location.reload(); 
      } catch (e) { alert("خطأ في الحفظ: " + e.message); }
    };

    function exportToExcel() {
      const data = state.checklists.map(r => {
        const row = { "تاريخ الزيارة": r.visitDate, "الفني": r.technicianName, "Brand": r.brand, "Branch ID": r.branchId, "Location": r.locationSite, "مدير الفرع": r.branchManager };
        state.checklistFields.forEach(f => { row[f.labelAr || f.label] = r.dynamicAnswers?.[f.id] || ''; });
        return row;
      });
      const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "AuditReports"); XLSX.writeFile(wb, "MMC_Checklist_Report.xlsx");
    }

    async function loadVisitsForTech(techId, visitId = null) {
      const db = window.parent.appDb; 
      const vSnap = await db.collection('siteVisits').where('technicianDocId', '==', techId).get();
      const allVisits = vSnap.docs.map(d => ({id:d.id, ...d.data()}));
      const completedIds = state.checklists.map(c => c.visitDocId);
      
      // ✅ الحماية: الفني لا يرى الزيارات المكتملة، بينما الإدمن يرى الجميع
      let filtered = state.canEdit ? allVisits : allVisits.filter(v => !completedIds.includes(v.id) || v.id === visitId);
      
      $('cl_visit_ref').innerHTML = '<option value="">اختر الزيارة</option>' + filtered.map(v => `<option value="${v.id}" ${visitId===v.id?'selected':''}>${v.date} - ${v.branchName}</option>`).join('');
    }

    window.openChecklistLocally = async (id) => {
      const r = state.checklists.find(x => x.id === id); if(!r) return;
      $('editingChecklistId').value = r.id; 
      $('cl_technician').value = r.technicianDocId || '';
      await loadVisitsForTech(r.technicianDocId, r.visitDocId);
      const fields = ['cl_technician_email','cl_technician_id','cl_city','cl_region','cl_brand','cl_brandKey','cl_branch_id','cl_location','cl_visit_date','cl_month','cl_branch_manager','cl_visit_scheduled'];
      const dataKeys = ['technicianEmail','technicianAuthId','city','region','brand','brandKey','branchId','locationSite','visitDate','month','branchManager','visitScheduled'];
      fields.forEach((f, i) => { if($(f)) $(f).value = r[dataKeys[i]] || ''; });
      window.renderDynamicForm(r.dynamicAnswers || {});
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    async function boot() {
      const db = window.parent.appDb;
      db.collection('branch_checklists').orderBy('createdAt','desc').onSnapshot(snap => { 
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()})); 
        if(state.canEdit) renderTable(); 
      });
      db.collection('technicians').onSnapshot(snap => { 
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()})); 
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join(''); 
      });
      db.collection('checklist_fields').onSnapshot(snap => { 
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (Number(a.order)||0)-(Number(b.order)||0)); 
        window.renderDynamicForm(); 
        if(state.canEdit) { updateTableHeaders(); renderTable(); } 
      });

      $('exportExcelBtn').onclick = exportToExcel;
      $('saveChecklistBtn').onclick = window.saveChecklist;
      
      $('cl_technician').onchange = (e) => { 
        const t = state.technicians.find(x => x.id === e.target.value); 
        if(t){ 
            $('cl_technician_email').value=t.email||''; 
            $('cl_technician_id').value=t.authUid||t.id; 
            $('cl_city').value=t.city||''; 
            $('cl_region').value=t.region||''; 
            loadVisitsForTech(e.target.value); 
        } 
      };
      $('cl_visit_ref').onchange = (e) => {
        db.collection('siteVisits').doc(e.target.value).get().then(doc => {
          if(doc.exists){
            const v = doc.data(); 
            $('cl_brand').value=v.brand||''; $('cl_brandKey').value=v.brandKey||''; $('cl_branch_id').value=v.branchId||''; $('cl_location').value=v.branchName||''; 
            $('cl_visit_date').value=v.date||'';
            const d = new Date(v.date); 
            if(!isNaN(d)) $('cl_month').value = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][d.getMonth()];
          }
        });
      };
    }

    function updateTableHeaders() {
      const h = $('tableHeaderRow'); h.innerHTML = `<th>تاريخ الزيارة</th><th>الفني</th><th>Brand</th><th>Branch ID</th><th>Location</th>`;
      state.checklistFields.forEach(f => { h.innerHTML += `<th>${esc(f.labelAr || f.label)}</th>`; });
    }

    function renderTable() {
      const b = $('checklistTableBody'); b.innerHTML = '';
      state.checklists.forEach(r => {
        let html = `<td>${esc(r.visitDate)}</td><td>${esc(r.technicianName)}</td><td>${esc(r.brand)}</td><td>${esc(r.branchId)}</td><td>${esc(r.locationSite)}</td>`;
        state.checklistFields.forEach(f => {
          const ans = r.dynamicAnswers?.[f.id] || '';
          html += `<td>${esc(Array.isArray(ans) ? ans.join(', ') : ans)}</td>`;
        });
        const tr = document.createElement('tr'); tr.className = 'clickable'; 
        tr.onclick = () => window.openChecklistLocally(r.id); 
        tr.innerHTML = html; b.appendChild(tr);
      });
    }
    checkAuth();
  })();
  </script>
</body>
</html>
