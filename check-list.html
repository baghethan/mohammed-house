<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v2.1.0</title>
  <!-- مكتبة معالجة الاكسيل -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; --orange: #f59e0b; --red: #e11d48; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; }
    .container { max-width: 1450px; margin: 18px auto; padding: 0 14px 28px; }
    .grid-2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18,48,74,0.08); overflow: hidden; margin-bottom: 16px; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 16px; }
    .section-title { margin: 18px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; font-size: 14px; }
    
    /* أزرار التحكم في الملفات */
    .file-actions { display: flex; gap: 10px; align-items: center; }
    .btn-tool { padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
    .btn-download { background: #fff; color: var(--green); border-color: var(--green); }
    .btn-upload { background: #fff; color: var(--primary); border-color: var(--primary); position: relative; overflow: hidden; }
    .btn-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    
    .btn-save { background: var(--green); color: #fff; border: none; padding: 14px; border-radius: 25px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; max-height: 650px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 12px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: #f1f7fd; }
  </style>
</head>
<body>
  <main class="container">
    <div class="grid-2">
      <!-- نموذج الإدخال -->
      <section class="card">
        <h3>بيانات نموذج الفحص v2.1.0 <span id="roleBadge" style="opacity:0.8;"></span></h3>
        <div class="card-body">
          <div id="permissionNotice" class="permission-banner"></div>
          <input id="editingChecklistId" type="hidden" />
          
          <div class="section-title">بيانات الفني والزيارة</div>
          <div class="grid-fields" style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px;">
            <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>الزيارة</label><select id="cl_visit_ref"></select></div>
            <div class="field"><label>المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>الفرع</label><input id="cl_location" readonly /></div>
          </div>
          
          <div id="dynamicChecklistSections"></div>
          <button class="btn-save" id="saveChecklistBtn">حفظ التغييرات ✅</button>
        </div>
      </section>

      <!-- سجل السجلات وأدوات الاكسيل -->
      <aside class="card">
        <h3>
          السجلات المحفوظة
          <div class="file-actions">
            <button class="btn-tool btn-download" id="exportExcelBtn">تنزيل Excel 📥</button>
            <div class="btn-tool btn-upload">
                رفع وتصحيح 📤
                <input type="file" id="importExcelInput" accept=".xlsx, .xls" />
            </div>
          </div>
        </h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;" />
          <div class="table-wrap">
            <table>
              <thead><tr><th>التاريخ</th><th>الفني</th><th>الموقع</th></tr></thead>
              <tbody id="checklistTableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    var state = { checklists: [], checklistFields: [], technicians: [], userProfile: null, canEdit: false };
    const $ = (id) => document.getElementById(id);

    // 1. وظيفة رفع وتصحيح الأخطاء من ملف Excel
    async function handleImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (!confirm("سيقوم النظام بتحديث السجلات الحالية بناءً على محتوى الملف. هل أنت متأكد؟")) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        const db = window.parent.appDb;
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet);

        let updateCount = 0;
        for (const row of rows) {
          // البحث عن معرف السجل لتصحيحه
          const recordId = row["ID"] || row["RecordID"] || row["record_ID"];
          if (recordId) {
            const payload = {
              technicianName: row["اسم الفني"] || row["technicianName"],
              city: row["المدينة"] || row["city"],
              locationSite: row["الفرع"] || row["locationSite"],
              updatedAt: new Date().toISOString()
            };
            await db.collection('branch_checklists').doc(recordId).update(payload);
            updateCount++;
          }
        }
        alert(`تم تحديث ${updateCount} سجل بنجاح!`);
        location.reload();
      };
      reader.readAsArrayBuffer(file);
    }

    // 2. وظيفة التصدير الأصلية
    function exportToExcel() {
      const data = state.checklists.map(r => ({
        "ID": r.id,
        "التاريخ": r.visitDate,
        "اسم الفني": r.technicianName,
        "المدينة": r.city,
        "الفرع": r.locationSite
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Checklists");
      XLSX.writeFile(wb, "Manual_Correction_File.xlsx");
    }

    // باقي منطق التشغيل والربط مع Firebase[cite: 1, 2]
    async function checkAuth() {
      const auth = window.parent.appAuth;
      const db = window.parent.appDb;
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) {
            state.userProfile = doc.data();
            state.canEdit = (state.userProfile.role === 'admin' || state.userProfile.role === 'supervisor');
            boot();
          }
        }
      });
    }

    async function boot() {
      const db = window.parent.appDb;
      db.collection('branch_checklists').orderBy('createdAt', 'desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderTable();
      });
      $('exportExcelBtn').onclick = exportToExcel;
      $('importExcelInput').onchange = handleImport;
    }

    function renderTable() {
      $('checklistTableBody').innerHTML = state.checklists.map(r => `
        <tr class="clickable"><td>${r.visitDate}</td><td>${r.technicianName}</td><td>${r.locationSite}</td></tr>
      `).join('');
    }

    checkAuth();
  })();
  </script>
</body>
</html>
