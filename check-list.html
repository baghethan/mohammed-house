<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>check-list.html - MMC IT Full Repair</title>
  <style>
    :root {
      --primary: #0d4b73; --primary-2: #0a3b5a; --green: #2f9e66; --danger: #d64545; --warning: #c47f00;
      --border: #d7e0ea; --text: #163247; --muted: #6e8192; --bg: #edf3f8; --card: #ffffff;
      --shadow: 0 10px 30px rgba(18, 48, 74, 0.08); --radius: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: var(--text); background: var(--bg); }
    .hidden { display: none !important; }
    .container { max-width: 1300px; margin: 18px auto; padding: 0 14px 28px; }
    .grid-2 { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 15px; }
    .card-body { padding: 16px; }
    .field { display: grid; gap: 8px; }
    .field label { font-size: 14px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; background: #fbfcfe; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .btn { border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; background: #fff; color: var(--primary); font-weight: 700; cursor: pointer; }
    .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
    .section-title { margin: 18px 0 10px; font-weight: 800; color: var(--primary); font-size: 16px; border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #edf2f7; text-align: start; white-space: nowrap; font-size: 13px; }
    th { background: #f8fbff; color: var(--primary); }
    tr.clickable { cursor: pointer; }
    .dynamic-checklist-list { list-style: none; padding: 0; margin: 0; }
    .choice-option { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px; background: #fff; margin-top: 5px; }
  </style>
</head>
<body>
  <main class="container">
    <div id="appRoot">
      <div class="grid-2">
        <section class="card">
          <h3>نموذج Check-List</h3>
          <div class="card-body">
            <input id="editingChecklistId" type="hidden" />
            
            <div class="section-title">المعلومات الأساسية</div>
            <div class="grid-4">
              <div class="field"><label>الفني</label><select id="cl_technician"></select></div>
              <div class="field"><label>الزيارة</label><select id="cl_visit_ref"></select></div>
              <div class="field"><label>Brand</label><input id="cl_brand" /></div>
              <div class="field"><label>Branch ID</label><input id="cl_branch_id" /></div>
            </div>

            <div class="section-title">Check-List الديناميكي</div>
            <div id="dynamicChecklistSections"></div>

            <div class="actions">
              <button class="btn green" id="saveChecklistBtn" type="button">حفظ Check-List</button>
              <button class="btn" id="clearChecklistBtn" type="button">تنظيف النموذج</button>
            </div>
            <div id="checklistMessage" style="margin-top:10px; font-weight:bold; color:var(--primary);"></div>
          </div>
        </section>

        <aside class="card">
          <h3>السجلات المحفوظة</h3>
          <div class="card-body">
            <input id="checklistSearch" placeholder="بحث..." style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; margin-bottom:10px;" />
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>تاريخ الزيارة</th>
                    <th>الفني</th>
                    <th>الموقع</th>
                    <th>ملخص التقرير (Q28)</th>
                  </tr>
                </thead>
                <tbody id="checklistTableBody"></tbody>
              </table>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script>
  (function(){
    var state = { currentUser: null, technicians: [], visits: [], checklists: [], checklistFields: [], currentLang: 'ar' };

    function $(id){ return document.getElementById(id); }
    function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(s){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]; }); }

    // --- وظائف عرض النماذج الديناميكية ---
    function renderDynamicChecklistForm(values){
      values = values || {};
      var container = $('dynamicChecklistSections');
      var fields = state.checklistFields.filter(f => f.active !== false);
      container.innerHTML = '';
      
      fields.forEach(field => {
        var val = values[field.id] || '';
        var fieldHtml = '<div class="field" style="margin-top:10px"><label>'+esc(field.labelAr || field.label)+'</label>';
        if(field.fieldType === 'choice'){
          fieldHtml += '<select id="dcf_'+field.id+'" data-field-id="'+field.id+'"><option value="">اختر</option>';
          (field.options || []).forEach(opt => {
            fieldHtml += '<option value="'+opt.value+'" '+(val == opt.value ? 'selected' : '')+'>'+esc(opt.labelAr || opt.label)+'</option>';
          });
          fieldHtml += '</select>';
        } else {
          fieldHtml += '<input type="text" id="dcf_'+field.id+'" data-field-id="'+field.id+'" value="'+esc(val)+'" />';
        }
        fieldHtml += '</div>';
        container.innerHTML += fieldHtml;
      });
    }

    function collectAnswers(){
      var ans = {};
      state.checklistFields.forEach(f => {
        var el = $('dcf_'+f.id);
        if(el) ans[f.id] = el.value;
      });
      return ans;
    }

    // --- إدارة السجلات والجدول ---
    function renderTable(){
      var q = ($('checklistSearch').value || '').trim().toLowerCase();
      var rows = state.checklists.filter(r => !q || [r.technicianName, r.locationSite, r.q28_serviceReportSummary].some(v => String(v||'').toLowerCase().includes(q)));
      
      $('checklistTableBody').innerHTML = rows.map(r => `
        <tr class="clickable" onclick="window.editRow('${r.id}')">
          <td>${esc(r.visitDate)}</td>
          <td>${esc(r.technicianName)}</td>
          <td>${esc(r.locationSite)}</td>
          <td style="color:var(--primary); font-weight:bold;">${esc(r.q28_serviceReportSummary || '-')}</td>
        </tr>
      `).join('');
    }

    window.editRow = function(id){
      var row = state.checklists.find(r => r.id === id);
      if(!row) return;
      $('editingChecklistId').value = row.id;
      $('cl_technician').value = row.technicianDocId || '';
      $('cl_brand').value = row.brand || '';
      $('cl_branch_id').value = row.branchId || '';
      renderDynamicChecklistForm(row.dynamicAnswers || {});
    };

    // --- الربط مع Firebase ---
    async function boot(){
      var db = window.parent.appDb;
      if(!db) return;

      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderDynamicChecklistForm({});
      });

      db.collection('branch_checklists').orderBy('visitDate', 'desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderTable();
      });

      $('checklistSearch').oninput = renderTable;
      $('clearChecklistBtn').onclick = () => { $('editingChecklistId').value = ''; renderDynamicChecklistForm({}); };
    }

    boot();
  })();
  </script>
</body>
</html>
