<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v2.3.0</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; font-size: 13px; }
    .container { max-width: 98%; margin: 15px auto; padding-bottom: 30px; }
    .grid-main { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 15px; transition: 0.3s; }
    .grid-full { grid-template-columns: 1fr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 25px rgba(18,48,74,0.06); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 20px; }
    .section-title { margin: 15px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding: 5px 12px; background: #f8fbff; font-size: 13px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
    .field label { font-size: 11px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 9px; font-size: 12px; outline: none; background: #fbfcfe; }
    .field input[readonly] { background: #f1f5f9; cursor: not-allowed; }
    .excel-tools { display: flex; gap: 8px; }
    .btn-tool { padding: 6px 12px; border-radius: 7px; font-size: 10px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn-download { background: #fff; color: var(--green); border-color: var(--green); }
    .btn-upload { background: #fff; color: var(--primary); border-color: var(--primary); position: relative; overflow: hidden; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 16px; border-radius: 35px; font-weight: 800; width: 100%; font-size: 15px; margin-top: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(47,158,102,0.25); }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; max-height: 800px; background: #fff; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 14px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 11px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; font-weight: 800; }
    tr.clickable { cursor: pointer; transition: 0.2s; }
    tr.clickable:hover { background: #f1f7fd; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <div id="mainLayout" class="grid-main">
      <!-- القسم 1: نموذج الإدخال -->
      <section class="card">
        <h3>نموذج الفحص v2.3.0 (إصلاح عرض البيانات) <span id="roleBadge" style="font-size:10px;"></span></h3>
        <div class="card-body">
          <input id="editingChecklistId" type="hidden" />
          <div class="section-title">1- الربط مع الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>الفني *</label><select id="cl_technician"></select></div>
            <div class="field"><label>الزيارة المرتبطة *</label><select id="cl_visit_ref"><option value="">اختر الفني أولاً</option></select></div>
            <div class="field"><label>البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>المنطقة</label><input id="cl_region" readonly /></div>
          </div>
          <div class="section-title">2- Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>Brand Key</label><input id="cl_brandKey" /></div>
            <div class="field"><label>Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>مدير الفرع</label><input id="cl_branch_manager" placeholder="الاسم / المعرف" /></div>
            <div class="field"><label>Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>Month</label><input id="cl_month" readonly /></div>
          </div>
          <div class="section-title">3- Dynamic Check-List</div>
          <div id="dynamicChecklistSections"></div>
          <button class="btn-save" id="saveChecklistBtn">حفظ وإرسال التقرير ✅</button>
          <button class="btn-save" id="newFormBtn" style="background:var(--primary); display:none; margin-top:10px;" onclick="location.reload()">إنشاء تقرير جديد ➕</button>
        </div>
      </section>

      <!-- القسم 2: السجلات المحفوظة -->
      <aside id="adminSidebar" class="card">
        <h3>السجلات المحفوظة <div class="excel-tools"><button class="btn-excel btn-tool btn-download" id="exportExcelBtn">Excel 📥</button><div class="btn-tool btn-upload">رفع وتحديث 📤<input type="file" id="importExcelInput" accept=".xlsx" style="position:absolute; inset:0; opacity:0; cursor:pointer;" /></div></div></h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;" />
          <div class="table-wrap">
            <table id="mainTable"><thead><tr id="tableHeaderRow"></tr></thead><tbody id="checklistTableBody"></tbody></table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    const clean = (obj) => { try { return window.parent.JSON.parse(window.parent.JSON.stringify(obj)); } catch (e) { return JSON.parse(JSON.stringify(obj)); } };
    const esc = (v) => String(v == null || v === 'undefined' ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    
    var state = { checklists: [], checklistFields: [], technicians: [], userProfile: null, canEdit: false };
    const $ = (id) => document.getElementById(id);
    function resolveRef(id, lbl) { return (id && state.checklistFields.find(f => f.id === id)) || (lbl && state.checklistFields.find(f => f.label === lbl)) || null; }

    async function checkAuth() {
      const auth = window.parent.appAuth; const db = window.parent.appDb;
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) { state.userProfile = doc.data(); state.canEdit = (state.userProfile.role === 'admin' || state.userProfile.role === 'supervisor'); applyPrivacyUI(); }
          boot();
        }
      });
    }

    function applyPrivacyUI() { if (!state.canEdit) { $('adminSidebar').classList.add('hidden'); $('mainLayout').classList.add('grid-full'); } }

    async function boot() {
      const db = window.parent.appDb;
      // مزامنة السجلات
      db.collection('branch_checklists').orderBy('createdAt','desc').onSnapshot(snap => { 
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()})); 
        if(state.canEdit) renderTable(); 
      });
      // مزامنة الفنيين
      db.collection('technicians').onSnapshot(snap => { 
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()})); 
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join(''); 
      });
      // مزامنة حقول النموذج والجدول
      db.collection('checklist_fields').onSnapshot(snap => { 
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (Number(a.order)||0)-(Number(b.order)||0)); 
        renderDynamicForm(); 
        if(state.canEdit) {
            updateTableHeaders(); // تحديث الرؤوس
            renderTable();        // تحديث البيانات فوراً لضمان عدم ظهور خلايا فارغة
        }
      });

      $('exportExcelBtn').onclick = exportToExcel;
      $('importExcelInput').onchange = handleImport;
      $('saveChecklistBtn').onclick = saveChecklist;
    }

    // دالة الرفع المصححة لكل الحقول الأساسية والديناميكية
    async function handleImport(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (evt) => {
        const db = window.parent.appDb;
        const workbook = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        let count = 0;
        for (const row of rows) {
          if (row.ID) {
            const updates = { 
              visitDate: row["تاريخ الزيارة"] || "", technicianName: row["الفني"] || "",
              brand: row["Brand"] || "", branchId: row["Branch ID"] || "",
              locationSite: row["Location/Site"] || "", branchManager: row["مدير الفرع"] || "",
              dynamicAnswers: {} 
            };
            state.checklistFields.forEach(f => {
              const col = f.labelAr || f.label;
              if (row[col] !== undefined) updates.dynamicAnswers[f.id] = row[col];
            });
            await db.collection('branch_checklists').doc(row.ID).update(clean(updates));
            count++;
          }
        }
        alert(`تم تحديث ${count} سجل بنجاح!`); location.reload();
      };
      reader.readAsArrayBuffer(file);
    }

    function exportToExcel() {
      const data = state.checklists.map(r => {
        const row = { "ID": r.id, "تاريخ الزيارة": r.visitDate, "الفني": r.technicianName, "Brand": r.brand, "Branch ID": r.branchId, "Location/Site": r.locationSite, "مدير الفرع": r.branchManager };
        state.checklistFields.forEach(f => { row[f.labelAr || f.label] = Array.isArray(r.dynamicAnswers?.[f.id]) ? r.dynamicAnswers[f.id].join(', ') : r.dynamicAnswers?.[f.id]; });
        return row;
      });
      const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Reports"); XLSX.writeFile(wb, "Full_Checklist_Report.xlsx");
    }

    function updateTableHeaders() {
      const h = $('tableHeaderRow'); 
      h.innerHTML = `<th>تاريخ الزيارة</th><th>الفني</th><th>Brand</th><th>Branch ID</th><th>Location/Site</th><th>مدير الفرع</th>`;
      state.checklistFields.forEach(f => { h.innerHTML += `<th>${esc(f.labelAr || f.label)}</th>`; });
    }

    function renderTable() {
      const b = $('checklistTableBody'); b.innerHTML = '';
      if (state.checklistFields.length === 0) return; // انتظار تحميل الحقول

      state.checklists.forEach(r => {
        let rowsHtml = `<td>${esc(r.visitDate)}</td><td>${esc(r.technicianName)}</td><td>${esc(r.brand)}</td><td>${esc(r.branchId)}</td><td>${esc(r.locationSite)}</td><td>${esc(r.branchManager)}</td>`;
        state.checklistFields.forEach(f => { 
          const ans = r.dynamicAnswers?.[f.id]; 
          rowsHtml += `<td>${esc(Array.isArray(ans) ? ans.join(', ') : ans)}</td>`; 
        });
        const tr = document.createElement('tr');
        tr.className = 'clickable';
        tr.onclick = () => window.openChecklistLocally(r.id);
        tr.innerHTML = rowsHtml;
        b.appendChild(tr);
      });
    }

    // ... (باقي دوال renderDynamicForm و saveChecklist و loadVisits كما في النسخ السابقة لضمان الاستقرار)

    checkAuth();
  })();
  </script>
</body>
</html>
