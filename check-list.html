<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v3.1.9</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; font-size: 13px; }
    .container { max-width: 98%; margin: 15px auto; padding-bottom: 30px; }
    .grid-main { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 15px; transition: 0.3s; }
    .grid-full { grid-template-columns: 1fr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 25px rgba(18,48,74,0.06); overflow: hidden; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 20px; }
    .section-title { margin: 15px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding: 5px 12px; background: #f8fbff; font-size: 13px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
    .field label { font-size: 11px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 9px; font-size: 12px; outline: none; background: #fbfcfe; }
    .field input[readonly] { background: #f1f5f9; cursor: not-allowed; }
    .excel-tools { display: flex; gap: 8px; }
    .btn-tool { padding: 6px 12px; border-radius: 7px; font-size: 10px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn-download { background: #fff; color: var(--green); border-color: var(--green); }
    .btn-upload { background: #fff; color: var(--primary); border-color: var(--primary); position: relative; overflow: hidden; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 16px; border-radius: 35px; font-weight: 800; width: 100%; font-size: 15px; margin-top: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(47,158,102,0.25); }
    .choices-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .pill-box { border: 1px solid #d1d9e6; border-radius: 40px; padding: 7px 18px; display: flex; align-items: center; gap: 12px; background: #fff; cursor: pointer; font-size: 11px; transition: 0.2s; min-width: 150px; }
    .pill-box.selected { border-color: var(--primary); background: #eef6ff; font-weight: 700; }
    .pill-box input { width: 16px; height: 16px; accent-color: var(--primary); }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; max-height: 800px; background: #fff; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 14px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 11px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; font-weight: 800; }
    tr.clickable { cursor: pointer; transition: 0.2s; }
    tr.clickable:hover { background: #f1f7fd; }
    .notice { margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid #c7d7e8; background: #f8fbff; color: #0d4b73; font-weight: 800; }
    .notice.warn { border-color: #fdba74; background: #fff7ed; color: #9a3412; }
    .notice.ok { border-color: #86efac; background: #ecfdf5; color: #166534; }
    select:disabled, input:disabled, button:disabled { opacity: 0.68; cursor: not-allowed; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <div id="mainLayout" class="grid-main">
      <section class="card">
        <h3>نموذج الفحص v3.1.9 (Native Object Sync) <span id="roleBadge" style="font-size:10px;"></span></h3>
        <div class="card-body">
          <div id="technicianNotice" class="notice hidden"></div>
          <input id="editingChecklistId" type="hidden" />
          <div class="section-title">1- بيانات الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>الفني *</label><select id="cl_technician"></select></div>
            <div class="field"><label>الزيارة المرتبطة *</label><select id="cl_visit_ref"><option value="">اختر الفني أولاً</option></select></div>
            <div class="field"><label>البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>المنطقة</label><input id="cl_region" readonly /></div>
          </div>
          <div class="section-title">2- Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>Brand Key</label><input id="cl_brandKey" /></div>
            <div class="field"><label>Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>مدير الفرع</label><input id="cl_branch_manager" placeholder="ID / Name" /></div>
            <div class="field"><label>Visit Scheduled</label><select id="cl_visit_scheduled"><option value="">اختر</option><option value="yes">Yes</option><option value="no">No</option></select></div>
            <div class="field"><label>Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>Month</label><input id="cl_month" readonly /></div>
          </div>
          <div class="section-title">3- Dynamic Check-List</div>
          <div id="dynamicChecklistSections"></div>
          <button class="btn-save" id="saveChecklistBtn">حفظ وإرسال التقرير ✅</button>
          <button class="btn-save" id="newFormBtn" style="background:var(--primary); display:none; margin-top:10px;" onclick="location.reload()">إنشاء تقرير جديد ➕</button>
        </div>
      </section>

      <aside id="adminSidebar" class="card">
        <h3>السجلات المحفوظة <div class="excel-tools"><button class="btn-excel btn-tool btn-download" id="exportExcelBtn">Excel 📥</button><div class="btn-tool btn-upload">رفع وتحديث 📤<input type="file" id="importExcelInput" accept=".xlsx" style="position:absolute; inset:0; opacity:0; cursor:pointer;" /></div></div></h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;" />
          <div class="table-wrap"><table id="mainTable"><thead><tr id="tableHeaderRow"></tr></thead><tbody id="checklistTableBody"></tbody></table></div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    // الحل النهائي: بناء الكائن باستخدام الـ Constructor الخاص بالنافذة الأم مباشرة
    const nativeClean = (data) => {
      if (data === null || typeof data !== 'object') return data;
      if (Array.isArray(data)) return window.parent.Array.from(data.map(nativeClean));
      const obj = new window.parent.Object();
      for (const key in data) {
        if (Object.prototype.hasOwnProperty.call(data, key)) {
          obj[key] = nativeClean(data[key]);
        }
      }
      return obj;
    };

    const esc = (v) => String(v == null || v === 'undefined' ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    var state = {
      checklists: [],
      checklistFields: [],
      technicians: [],
      userProfile: null,
      currentUser: null,
      canEdit: false,
      employeeLookupError: false,
      checklistUnsubs: []
    };
    const $ = (id) => document.getElementById(id);
    const dynamicLabels = ["Network Cabinets Condition", "Upload 4-6 Mbps", "Low Current Infrastructure Condition", "Download 6-9 Mbps", "Server Room Temperature", "UPS Status", "PCs Condition", "Printers Condition", "Unified Communication", "Unused or Damaged IT Assets", "Unused or Damaged IT Assets - Note", "Operating System Up to Date", "Cleanup and Remove Unwanted Apps", "OneDrive Backup", "Customer Facing Portals", "ERP & Business Applications", "Training Requirement", "Upgrade Windows_11", "Number of devices (Q29A)", "Employee IDs for devices (Q29B)"];

    function resolveRef(id, lbl) { return (id && state.checklistFields.find(f => f.id === id)) || (lbl && state.checklistFields.find(f => f.label === lbl)) || null; }

    function norm(v) { return String(v || '').trim().toLowerCase(); }

    function getRole() {
      return norm(state.userProfile && state.userProfile.role) || 'user';
    }

    function isTechnicianMode() {
      return !state.canEdit;
    }

    function addValue(list, value) {
      const text = String(value || '').trim();
      if (text && !list.some(item => norm(item) === norm(text))) list.push(text);
    }

    function addValues(list, source, fields) {
      fields.forEach(field => addValue(list, source && source[field]));
    }

    function getTechnicianValues(tech) {
      const values = [];
      addValues(values, tech || {}, [
        'id',
        '_docId',
        'empId',
        'empNum',
        'employeeId',
        'technicianId',
        'technicianCode',
        'code',
        'authUid',
        'uid',
        'email',
        'name',
        'fullName'
      ]);
      return values;
    }

    function getProfileValues() {
      const profile = state.userProfile || {};
      const user = state.currentUser || {};
      const values = [];
      addValues(values, profile, ['employeeId', 'empId', 'technicianId', 'technicianCode', 'code', 'email', 'name', 'fullName']);
      addValues(values, user, ['uid', 'email', 'displayName']);
      return values;
    }

    function buildProfileTechnicianFallback() {
      const profile = state.userProfile || {};
      const user = state.currentUser || {};
      const id = profile.technicianId || profile.employeeId || profile.empId || profile.technicianCode || profile.code || user.uid || user.email || '';
      if (!id) return null;
      return {
        id: String(id),
        _docId: String(profile.employeeDocId || profile.technicianDocId || profile.technicianId || id),
        empId: String(profile.empId || profile.employeeId || profile.technicianId || id),
        empNum: String(profile.empNum || ''),
        employeeId: String(profile.employeeId || profile.technicianId || id),
        technicianId: String(profile.technicianId || profile.employeeId || id),
        technicianCode: String(profile.technicianCode || profile.code || profile.technicianId || id),
        code: String(profile.code || profile.technicianCode || ''),
        authUid: String(profile.authUid || profile.uid || user.uid || ''),
        uid: String(profile.uid || user.uid || ''),
        email: String(profile.email || user.email || ''),
        name: String(profile.name || profile.fullName || user.displayName || profile.email || user.email || id),
        fullName: String(profile.fullName || profile.name || ''),
        status: 'active',
        isTechnician: true,
        fromProfileFallback: true
      };
    }

    function getCurrentTechnicianIdentity() {
      const rawValues = getProfileValues();
      const keys = new Set(rawValues.map(norm).filter(Boolean));
      const matchedTech = state.technicians.find(t =>
        getTechnicianValues(t).map(norm).some(value => keys.has(value))
      ) || buildProfileTechnicianFallback();
      getTechnicianValues(matchedTech).forEach(value => {
