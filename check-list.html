<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v1.8.8</title>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; --orange: #f59e0b; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; }
    .container { max-width: 1400px; margin: 18px auto; padding: 0 14px 28px; }
    .grid-2 { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18,48,74,0.08); overflow: hidden; margin-bottom: 16px; }
    .card h3 { margin: 0; padding: 12px 16px; background: var(--primary); color: #fff; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 16px; }
    .section-title { margin: 18px 0 10px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding-inline-start: 10px; font-size: 14px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 12px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #fbfcfe; outline: none; }
    .field input[readonly], .field select[disabled] { background: #f1f5f9; cursor: not-allowed; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; max-height: 600px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 12px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; }
    tr.clickable { cursor: pointer; transition: 0.2s; }
    tr.clickable:hover { background: #f1f7fd; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 14px; border-radius: 25px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px; }
    .permission-banner { padding: 10px; border-radius: 10px; font-size: 12px; margin-bottom: 15px; font-weight: 700; text-align: center; border: 1px solid transparent; display: none; }
    .read-only-mode { background: #fffbeb; color: var(--orange); border-color: #fef3c7; }
    .edit-mode { background: #f0fdf4; color: var(--green); border-color: #dcfce7; }
  </style>
</head>
<body>
  <main class="container">
    <div class="grid-2">
      <section class="card">
        <h3>نموذج Check-List (الربط الكامل) <span id="roleBadge" style="font-size:10px; opacity:0.8;"></span></h3>
        <div class="card-body">
          <div id="permissionNotice" class="permission-banner"></div>
          <input id="editingChecklistId" type="hidden" />
          
          <!-- 1. الربط مع الفني والزيارة (6 حقول) -->
          <div class="section-title">الربط مع الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>1- الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>2- الزيارة المرتبطة</label><select id="cl_visit_ref"><option value="">اختر الفني أولاً</option></select></div>
            <div class="field"><label>3- البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>4- معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>5- المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>6- المنطقة</label><input id="cl_region" readonly /></div>
          </div>

          <!-- 2. Basic Information (8 حقول) -->
          <div class="section-title">Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>1- Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>2- Brand Key</label><input id="cl_brandKey" /></div>
            <div class="field"><label>3- Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>4- Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>5- Visit Scheduled</label><select id="cl_visit_scheduled"><option value="">اختر</option><option>Yes</option><option>No</option></select></div>
            <div class="field"><label>6- Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>7- Month</label><input id="cl_month" readonly /></div>
            <div class="field"><label>8- Calendar Booked</label><select id="cl_calendar_booked"><option value="">اختر</option><option>Yes</option><option>No</option></select></div>
          </div>

          <div class="section-title">Dynamic Check-List</div>
          <div id="dynamicChecklistSections"></div>

          <button class="btn-save" id="saveChecklistBtn">حفظ وإرسال ✅</button>
          <button class="btn-save" id="newFormBtn" style="background:var(--primary); display:none;" onclick="location.reload()">إنشاء تقرير جديد ➕</button>
        </div>
      </section>

      <aside class="card">
        <h3>السجلات المحفوظة</h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #ddd;" />
          <div class="table-wrap">
            <table>
              <thead><tr><th>التاريخ</th><th>الفني</th><th>الموقع</th></tr></thead>
              <tbody id="checklistTableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    var state = { checklists: [], checklistFields: [], technicians: [], userProfile: null, canEdit: false };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));

    async function checkAuth() {
      const auth = window.parent.appAuth;
      const db = window.parent.appDb;
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) {
            state.userProfile = doc.data();
            const role = state.userProfile.role || 'user';
            state.canEdit = (role === 'admin' || role === 'supervisor');
            updatePermissionUI(role);
          }
          boot();
        }
      });
    }

    function updatePermissionUI(role) {
      const notice = $('permissionNotice');
      notice.style.display = 'block';
      $('roleBadge').innerText = "الدور: " + role.toUpperCase();
      if (state.canEdit) { notice.className = "permission-banner edit-mode"; notice.innerText = "✅ وضع التعديل: يمكنك تغيير كافة البيانات."; }
      else { notice.className = "permission-banner read-only-mode"; notice.innerText = "👁️ وضع القراءة: استعراض السجلات فقط."; }
    }

    async function boot() {
      const db = window.parent.appDb;
      db.collection('technicians').onSnapshot(snap => {
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });

      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.order||0)-(b.order||0));
        renderDynamicForm();
      });

      db.collection('branch_checklists').orderBy('createdAt', 'desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderTable();
      });

      window.loadVisitsForTech = async function(techId, selectedVisitId = null) {
        const vSnap = await db.collection('siteVisits').where('technicianDocId', '==', techId).get();
        const visits = vSnap.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_visit_ref').innerHTML = '<option value="">اختر الزيارة</option>' + visits.map(v => `<option value="${v.id}" ${selectedVisitId===v.id?'selected':''}>${v.date} - ${v.branchName}</option>`).join('');
      };

      $('cl_technician').onchange = async function() {
        const tech = state.technicians.find(t => t.id === this.value);
        if (tech) {
          $('cl_technician_email').value = tech.email || '';
          $('cl_technician_id').value = tech.authUid || tech.id;
          await loadVisitsForTech(this.value);
        }
      };

      $('cl_visit_ref').onchange = function() {
        const db = window.parent.appDb;
        db.collection('siteVisits').doc(this.value).get().then(doc => {
           if(doc.exists) {
              const v = doc.data();
              $('cl_brand').value = v.brand || ''; $('cl_branch_id').value = v.branchId || '';
              $('cl_location').value = v.branchName || ''; $('cl_city').value = v.city || '';
              $('cl_region').value = v.region || ''; $('cl_visit_date').value = v.date || '';
              const d = new Date(v.date); if(!isNaN(d)) $('cl_month').value = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][d.getMonth()];
           }
        });
      };

      $('saveChecklistBtn').onclick = saveChecklist;
    }

    window.openChecklistLocally = async function(id) {
      const row = state.checklists.find(r => r.id === id);
      if (!row) return;
      $('editingChecklistId').value = row.id;

      // تحميل الـ 14 حقلاً بالترتيب
      $('cl_technician').value = row.technicianDocId || '';
      await loadVisitsForTech(row.technicianDocId, row.visitDocId);
      $('cl_technician_email').value = row.technicianEmail || '';
      $('cl_technician_id').value = row.technicianAuthId || '';
      $('cl_city').value = row.city || '';
      $('cl_region').value = row.region || '';
      $('cl_brand').value = row.brand || '';
      $('cl_brandKey').value = row.brandKey || '';
      $('cl_branch_id').value = row.branchId || '';
      $('cl_location').value = row.locationSite || '';
      $('cl_visit_scheduled').value = row.visitScheduled || '';
      $('cl_visit_date').value = row.visitDate || '';
      $('cl_month').value = row.month || '';
      $('cl_calendar_booked').value = row.calendarBooked || '';

      if (!state.canEdit) {
        $('saveChecklistBtn').style.display = 'none';
        $('newFormBtn').style.display = 'block';
        document.querySelectorAll('input, select').forEach(el => { if(el.id !== 'checklistSearch') el.disabled = true; });
      }
      renderDynamicForm(row.dynamicAnswers || {});
    };

    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      container.innerHTML = '';
      const isLocked = !state.canEdit && $('editingChecklistId').value;
      state.checklistFields.forEach(field => {
        if (field.logic?.enabled && field.logic?.visibleWhen) {
          const rule = field.logic.visibleWhen;
          const depVal = answers[rule.fieldId] || answers[rule.fieldLabel] || '';
          if (String(depVal).toLowerCase() !== String(rule.value).toLowerCase()) return;
        }
        let html = `<div class="field" style="margin-top:10px"><label>${esc(field.labelAr || field.label)}</label>`;
        if (field.repeat?.enabled) {
          const count = Number(answers[field.repeat.countFromFieldId] || 0);
          for (let i = 0; i < count; i++) {
            const val = (answers[field.id] && answers[field.id][i]) || '';
            html += `<input type="text" class="dyn-input" data-id="${field.id}" data-index="${i}" value="${esc(val)}" ${isLocked ? 'disabled' : ''} style="margin-bottom:5px;" />`;
          }
        } else {
          const val = answers[field.id] || '';
          if (field.fieldType === 'choice') {
            html += `<select class="dyn-input" data-id="${field.id}" ${isLocked ? 'disabled' : ''}><option value="">اختر</option>`;
            (field.options || []).forEach(o => html += `<option value="${o.value}" ${val==o.value?'selected':''}>${esc(o.labelAr || o.label)}</option>`);
            html += `</select>`;
          } else {
            html += `<input type="text" class="dyn-input" data-id="${field.id}" value="${esc(val)}" ${isLocked ? 'disabled' : ''} onchange="renderDynamicForm(collectAnswers())" />`;
          }
        }
        container.innerHTML += html + `</div>`;
      });
      document.querySelectorAll('.dyn-input').forEach(el => { el.onchange = () => renderDynamicForm(collectAnswers()); });
    }

    function collectAnswers() {
      const ans = {};
      document.querySelectorAll('.dyn-input').forEach(el => {
        const id = el.dataset.id;
        if (el.dataset.index !== undefined) { if (!ans[id]) ans[id] = []; ans[id][el.dataset.index] = el.value; }
        else ans[id] = el.value;
      });
      return ans;
    }

    async function saveChecklist() {
      if (!state.canEdit && $('editingChecklistId').value) return;
      const db = window.parent.appDb;
      const editId = $('editingChecklistId').value;
      const answers = collectAnswers();
      const payload = {
        technicianDocId: $('cl_technician').value,
        visitDocId: $('cl_visit_ref').value,
        technicianName: $('cl_technician').options[$('cl_technician').selectedIndex].text,
        technicianEmail: $('cl_technician_email').value,
        technicianAuthId: $('cl_technician_id').value,
        city: $('cl_city').value,
        region: $('cl_region').value,
        brand: $('cl_brand').value,
        brandKey: $('cl_brandKey').value,
        branchId: $('cl_branch_id').value,
        locationSite: $('cl_location').value,
        visitScheduled: $('cl_visit_scheduled').value,
        visitDate: $('cl_visit_date').value,
        month: $('cl_month').value,
        calendarBooked: $('cl_calendar_booked').value,
        dynamicAnswers: answers,
        updatedAt: new Date().toISOString()
      };
      try {
        if (editId) await db.collection('branch_checklists').doc(editId).update(payload);
        else { payload.createdAt = new Date().toISOString(); await db.collection('branch_checklists').add(payload); }
        
        // تحديث الترقية
        const batch = db.batch();
        for (let key in answers) {
          const ids = (Array.isArray(answers[key]) ? answers[key] : String(answers[key]).split(/[\n,]+/)).map(id => id.trim()).filter(id => id.length > 2);
          for (const empId of ids) {
            const q = await db.collection("windows_upgrades").where("employee_ID", "==", empId).get();
            q.forEach(doc => batch.update(doc.ref, { status: 'completed' }));
          }
        }
        await batch.commit();
        alert("تم الحفظ بنجاح!"); location.reload();
      } catch (e) { alert("خطأ: " + e.message); }
    }

    function renderTable() {
      $('checklistTableBody').innerHTML = state.checklists.map(r => `<tr class="clickable" onclick="openChecklistLocally('${r.id}')"><td>${esc(r.visitDate)}</td><td>${esc(r.technicianName)}</td><td>${esc(r.locationSite)}</td></tr>`).join('');
    }
    checkAuth();
  })();
  </script>
</body>
</html>
