<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v2.1.1</title>
  <!-- مكتبة معالجة الاكسيل -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; --orange: #f59e0b; --red: #e11d48; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; line-height: 1.6; }
    .container { max-width: 1550px; margin: 20px auto; padding: 0 15px 30px; }
    .grid-main { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; align-items: start; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18,48,74,0.08); overflow: hidden; margin-bottom: 20px; }
    .card h3 { margin: 0; padding: 14px 18px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 20px; }
    
    .section-title { margin: 20px 0 12px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding-inline-start: 12px; font-size: 14px; background: #f8fbff; padding-top: 5px; padding-bottom: 5px; }
    
    /* إصلاح توزيع الخانات */
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 11px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #fbfcfe; outline: none; transition: 0.2s; width: 100%; }
    .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,75,115,0.1); }
    .field input[readonly] { background: #f1f5f9; cursor: not-allowed; }

    /* أزرار الاكسيل والتحكم */
    .file-actions { display: flex; gap: 8px; }
    .btn-tool { padding: 7px 14px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid transparent; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn-download { background: #fff; color: var(--green); border-color: var(--green); }
    .btn-download:hover { background: var(--green); color: #fff; }
    .btn-upload { background: #fff; color: var(--primary); border-color: var(--primary); position: relative; }
    .btn-upload:hover { background: var(--primary); color: #fff; }
    .btn-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .btn-save { background: var(--green); color: #fff; border: none; padding: 15px; border-radius: 30px; font-weight: 800; cursor: pointer; width: 100%; font-size: 15px; margin-top: 25px; box-shadow: 0 4px 12px rgba(47,158,102,0.2); transition: 0.2s; }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(47,158,102,0.3); }

    .training-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .pill-box { border: 1px solid var(--border); border-radius: 30px; padding: 8px 18px; display: flex; align-items: center; gap: 10px; background: #fff; cursor: pointer; transition: 0.2s; }
    .pill-box.selected { border-color: var(--primary); background: #eef6ff; font-weight: 700; }
    
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; max-height: 650px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 12px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 12px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; font-weight: 800; }
    tr.clickable { cursor: pointer; transition: 0.2s; }
    tr.clickable:hover { background: #f1f7fd; }

    @media (max-width: 1024px) { .grid-main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="container">
    <div class="grid-main">
      <!-- نموذج الإدخال الرئيسي -->
      <section class="card">
        <h3>
          نموذج الفحص الذكي v2.1.1
          <span id="roleBadge" style="font-size:10px; font-weight:normal; opacity:0.8;"></span>
        </h3>
        <div class="card-body">
          <div id="permissionNotice" class="permission-banner"></div>
          <input id="editingChecklistId" type="hidden" />
          
          <div class="section-title">بيانات الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>1- الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>2- الزيارة المرتبطة</label><select id="cl_visit_ref"><option value="">اختر الفني أولاً</option></select></div>
            <div class="field"><label>3- البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>4- معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>5- المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>6- المنطقة</label><input id="cl_region" readonly /></div>
          </div>

          <div class="section-title">Basic Information</div>
          <div class="grid-fields">
            <div class="field"><label>1- Brand</label><input id="cl_brand" readonly /></div>
            <div class="field"><label>2- Brand Key</label><input id="cl_brandKey" /></div>
            <div class="field"><label>3- Branch ID</label><input id="cl_branch_id" readonly /></div>
            <div class="field"><label>4- Location/Site</label><input id="cl_location" readonly /></div>
            <div class="field"><label>5- Visit Date</label><input id="cl_visit_date" type="date" /></div>
            <div class="field"><label>6- Month</label><input id="cl_month" readonly /></div>
          </div>

          <div id="dynamicChecklistSections"></div>

          <button class="btn-save" id="saveChecklistBtn">حفظ البيانات وإرسال المزامنة ✅</button>
        </div>
      </section>

      <!-- سجل السجلات وأدوات الاكسيل -->
      <aside class="card">
        <h3>
          السجلات المحفوظة
          <div class="file-actions">
            <button class="btn-tool btn-download" id="exportExcelBtn">تنزيل Excel</button>
            <div class="btn-tool btn-upload">
                رفع وتصحيح
                <input type="file" id="importExcelInput" accept=".xlsx, .xls" />
            </div>
          </div>
        </h3>
        <div class="card-body">
          <input id="checklistSearch" placeholder="بحث سريع عن فني أو موقع..." style="width:100%; padding:12px; margin-bottom:15px; border-radius:12px; border:1px solid #ddd;" />
          <div class="table-wrap">
            <table>
              <thead><tr><th>التاريخ</th><th>الفني</th><th>الموقع</th></tr></thead>
              <tbody id="checklistTableBody"></tbody>
            </table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    var state = { checklists: [], checklistFields: [], technicians: [], userProfile: null, canEdit: false };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));

    function cleanForFirestore(obj) { return window.parent.JSON.parse(window.parent.JSON.stringify(obj)); }

    async function checkAuth() {
      const auth = window.parent.appAuth;
      const db = window.parent.appDb;
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) {
            state.userProfile = doc.data();
            state.canEdit = (state.userProfile.role === 'admin' || state.userProfile.role === 'supervisor');
            $('roleBadge').innerText = "الدور: " + (state.userProfile.role || 'User').toUpperCase();
          }
          boot();
        }
      });
    }

    async function handleImport(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (evt) => {
        const db = window.parent.appDb;
        const workbook = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        let count = 0;
        for (const row of rows) {
          const id = row["ID"] || row["record_ID"];
          if (id) {
            await db.collection('branch_checklists').doc(id).update({
              city: row["المدينة"] || "",
              locationSite: row["الفرع"] || "",
              updatedAt: new Date().toISOString()
            });
            count++;
          }
        }
        alert(`تم تصحيح ${count} سجل بنجاح!`);
        location.reload();
      };
      reader.readAsArrayBuffer(file);
    }

    async function boot() {
      const db = window.parent.appDb;
      
      db.collection('technicians').onSnapshot(snap => {
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });

      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (Number(a.order)||0)-(Number(b.order)||0));
        renderDynamicForm();
      });

      db.collection('branch_checklists').orderBy('createdAt', 'desc').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        renderTable();
      });

      $('cl_technician').onchange = async function() {
        const tech = state.technicians.find(t => t.id === this.value);
        if (tech) {
          $('cl_technician_email').value = tech.email || '';
          $('cl_technician_id').value = tech.authUid || tech.id;
          const vSnap = await db.collection('siteVisits').where('technicianDocId', '==', this.value).get();
          $('cl_visit_ref').innerHTML = '<option value="">اختر الزيارة</option>' + vSnap.docs.map(d => `<option value="${d.id}">${d.data().date} - ${d.data().branchName}</option>`).join('');
        }
      };

      $('cl_visit_ref').onchange = function() {
        db.collection('siteVisits').doc(this.value).get().then(doc => {
          if(doc.exists) {
            const v = doc.data();
            $('cl_brand').value = v.brand || '';
            $('cl_branch_id').value = v.branchId || '';
            $('cl_location').value = v.branchName || '';
            $('cl_city').value = v.city || '';
            $('cl_region').value = v.region || '';
            $('cl_visit_date').value = v.date || '';
          }
        });
      };

      $('exportExcelBtn').onclick = () => {
        const ws = XLSX.utils.json_to_sheet(state.checklists.map(r => ({ "ID": r.id, "التاريخ": r.visitDate, "الفني": r.technicianName, "الموقع": r.locationSite, "المدينة": r.city })));
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Checklist");
        XLSX.writeFile(wb, "Checklist_Report.xlsx");
      };

      $('importExcelInput').onchange = handleImport;
      $('saveChecklistBtn').onclick = saveChecklist;
    }

    function renderDynamicForm(answers = {}) {
        const container = $('dynamicChecklistSections');
        container.innerHTML = '';
        state.checklistFields.forEach(f => {
            let html = `<div class="field" style="margin-top:15px"><label>${esc(f.labelAr || f.label)}</label>`;
            const val = answers[f.id] || '';
            if (f.fieldType === 'choice') {
                html += `<select class="dyn-input" data-id="${f.id}"><option value="">اختر</option>${(f.options||[]).map(o=>`<option value="${o.value}" ${val==o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
            } else {
                html += `<input type="text" class="dyn-input" data-id="${f.id}" value="${esc(val)}" />`;
            }
            container.innerHTML += html + `</div>`;
        });
    }

    async function saveChecklist() {
        const db = window.parent.appDb;
        const answers = {};
        document.querySelectorAll('.dyn-input').forEach(el => answers[el.dataset.id] = el.value);
        const payload = cleanForFirestore({
            technicianName: $('cl_technician').options[$('cl_technician').selectedIndex].text,
            locationSite: $('cl_location').value,
            city: $('cl_city').value,
            visitDate: $('cl_visit_date').value,
            dynamicAnswers: answers,
            createdAt: new Date().toISOString()
        });
        await db.collection('branch_checklists').add(payload);
        alert("تم الحفظ بنجاح!");
        location.reload();
    }

    function renderTable() {
      $('checklistTableBody').innerHTML = state.checklists.map(r => `<tr class="clickable"><td>${esc(r.visitDate)}</td><td>${esc(r.technicianName)}</td><td>${esc(r.locationSite)}</td></tr>`).join('');
    }

    checkAuth();
  })();
  </script>
</body>
</html>
