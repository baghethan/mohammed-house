<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-List Master | المجدوعي للسيارات v2.1.3</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #0d4b73; --green: #2f9e66; --border: #d7e0ea; --bg: #edf3f8; --card: #ffffff; --radius: 16px; }
    body { margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: #163247; }
    .container { max-width: 1550px; margin: 20px auto; padding: 0 15px 30px; }
    
    /* نظام الشبكة المرن لإخفاء الجانب */
    .grid-main { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; transition: 0.3s; }
    .grid-full { grid-template-columns: 1fr; } /* حالة الفني: عرض كامل */
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(18,48,74,0.08); overflow: hidden; }
    .card h3 { margin: 0; padding: 14px 18px; background: var(--primary); color: #fff; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .card-body { padding: 20px; }
    .section-title { margin: 20px 0 12px; font-weight: 800; color: var(--primary); border-inline-start: 4px solid var(--primary); padding: 8px 12px; background: #f8fbff; font-size: 14px; }
    .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; font-weight: 700; color: #475569; }
    .field input, .field select { padding: 11px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; outline: none; }
    .field input[readonly] { background: #f1f5f9; }
    .btn-save { background: var(--green); color: #fff; border: none; padding: 15px; border-radius: 30px; font-weight: 800; width: 100%; font-size: 15px; margin-top: 25px; cursor: pointer; }
    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 14px; max-height: 700px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 12px; border-bottom: 1px solid #edf2f7; text-align: start; font-size: 12px; }
    th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; font-weight: 800; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="container">
    <div id="mainLayout" class="grid-main">
      <!-- نموذج الفحص -->
      <section class="card">
        <h3>نموذج الفحص v2.1.3 <span id="roleBadge" style="font-weight:normal; font-size:10px;"></span></h3>
        <div class="card-body">
          <div class="section-title">بيانات الفني والزيارة</div>
          <div class="grid-fields">
            <div class="field"><label>1- الفني</label><select id="cl_technician"></select></div>
            <div class="field"><label>2- الزيارة المرتبطة</label><select id="cl_visit_ref"><option value="">اختر الفني أولاً</option></select></div>
            <div class="field"><label>3- البريد الإلكتروني</label><input id="cl_technician_email" readonly /></div>
            <div class="field"><label>4- معرف الفني</label><input id="cl_technician_id" readonly /></div>
            <div class="field"><label>5- المدينة</label><input id="cl_city" readonly /></div>
            <div class="field"><label>6- المنطقة</label><input id="cl_region" readonly /></div>
          </div>
          <div id="dynamicChecklistSections"></div>
          <button class="btn-save" id="saveChecklistBtn">حفظ وإرسال التقرير ✅</button>
        </div>
      </section>

      <!-- سجل السجلات (يظهر للأدمن فقط) -->
      <aside id="adminSidebar" class="card">
        <h3>السجلات المحفوظة (أدمن)</h3>
        <div class="card-body">
          <div class="table-wrap">
            <table><thead><tr><th>التاريخ</th><th>الفني</th><th>الموقع</th></tr></thead><tbody id="checklistTableBody"></tbody></table>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script>
  (function(){
    var state = { checklists: [], checklistFields: [], technicians: [], userProfile: null, canEdit: false };
    const $ = (id) => document.getElementById(id);

    async function checkAuth() {
      const auth = window.parent.appAuth; const db = window.parent.appDb;
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const doc = await db.collection('app_users').doc(user.uid).get();
          if (doc.exists) {
            state.userProfile = doc.data();
            // تحديد الأدمن بناءً على الصلاحيات
            state.canEdit = (state.userProfile.role === 'admin' || state.userProfile.role === 'supervisor');
            applyPrivacyUI();
          }
          boot();
        }
      });
    }

    // 1. وظيفة إخفاء السجلات وتوسيع النموذج للفني
    function applyPrivacyUI() {
      if (!state.canEdit) {
        $('adminSidebar').classList.add('hidden');
        $('mainLayout').classList.add('grid-full');
        $('roleBadge').innerText = "(فني - دخول محدود)";
      } else {
        $('adminSidebar').classList.remove('hidden');
        $('mainLayout').classList.remove('grid-full');
        $('roleBadge').innerText = "(مسؤول - رؤية كاملة)";
      }
    }

    async function boot() {
      const db = window.parent.appDb;
      
      // جلب السجلات الموجودة للمقارنة
      db.collection('branch_checklists').onSnapshot(snap => {
        state.checklists = snap.docs.map(d => ({id:d.id, ...d.data()}));
        if (state.canEdit) renderTable();
      });

      db.collection('technicians').onSnapshot(snap => {
        state.technicians = snap.docs.map(d => ({id:d.id, ...d.data()}));
        $('cl_technician').innerHTML = '<option value="">اختر الفني</option>' + state.technicians.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      });

      db.collection('checklist_fields').onSnapshot(snap => {
        state.checklistFields = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (Number(a.order)||0)-(Number(b.order)||0));
        renderDynamicForm();
      });

      // 2. فلترة الزيارات الذكية للفني
      $('cl_technician').onchange = async function() {
        const techId = this.value;
        const tech = state.technicians.find(t => t.id === techId);
        if (tech) {
          $('cl_technician_email').value = tech.email || '';
          $('cl_technician_id').value = tech.authUid || tech.id;
          
          const vSnap = await db.collection('siteVisits').where('technicianDocId', '==', techId).get();
          const visits = vSnap.docs.map(d => ({id:d.id, ...d.data()}));
          
          // استخراج معرفات الزيارات التي تم عمل check-list لها مسبقاً[cite: 1]
          const completedVisitIds = state.checklists.map(c => c.visitDocId);
          
          // عرض الزيارات التي لم تنتهِ فقط للفني[cite: 1]
          let filteredVisits = visits;
          if (!state.canEdit) {
            filteredVisits = visits.filter(v => !completedVisitIds.includes(v.id));
          }

          $('cl_visit_ref').innerHTML = '<option value="">اختر الزيارة</option>' + 
            filteredVisits.map(v => `<option value="${v.id}">${v.date} - ${v.branchName}</option>`).join('');
        }
      };

      $('cl_visit_ref').onchange = function() {
        db.collection('siteVisits').doc(this.value).get().then(doc => {
          if(doc.exists) {
            const v = doc.data();
            $('cl_city').value = v.city || ''; $('cl_region').value = v.region || '';
            $('cl_brand').value = v.brand || ''; $('cl_branch_id').value = v.branchId || '';
            $('cl_location').value = v.branchName || ''; $('cl_visit_date').value = v.date || '';
          }
        });
      };

      $('saveChecklistBtn').onclick = saveChecklist;
    }

    function renderDynamicForm(answers = {}) {
      const container = $('dynamicChecklistSections');
      container.innerHTML = '';
      state.checklistFields.forEach(field => {
        let html = `<div class="field" style="margin-top:15px"><label>${esc(field.labelAr || field.label)}</label>`;
        const val = answers[field.id] || '';
        if (field.fieldType === 'choice') {
          html += `<select class="dyn-input" data-id="${field.id}"><option value="">اختر</option>${(field.options||[]).map(o=>`<option value="${o.value}" ${val==o.value?'selected':''}>${o.label}</option>`).join('')}</select>`;
        } else {
          html += `<input type="text" class="dyn-input" data-id="${field.id}" value="${esc(val)}" />`;
        }
        container.innerHTML += html + `</div>`;
      });
    }

    function collectAnswers() {
      const ans = {};
      document.querySelectorAll('.dyn-input').forEach(el => ans[el.dataset.id] = el.value);
      return ans;
    }

    async function saveChecklist() {
      const db = window.parent.appDb;
      const techDropdown = $('cl_technician');
      const techName = techDropdown.options[techDropdown.selectedIndex].text;
      
      const payload = {
        technicianDocId: techDropdown.value,
        technicianName: techName,
        visitDocId: $('cl_visit_ref').value,
        locationSite: $('cl_location').value,
        city: $('cl_city').value,
        visitDate: $('cl_visit_date').value,
        dynamicAnswers: collectAnswers(),
        createdAt: new Date().toISOString()
      };

      try {
        await db.collection('branch_checklists').add(payload);
        alert("تم حفظ التقرير بنجاح! شكراً لك.");
        location.reload(); // سيقوم بالتحديث ولن تظهر نفس الزيارة للفني مرة أخرى[cite: 1]
      } catch (e) { alert("خطأ: " + e.message); }
    }

    function renderTable() {
      $('checklistTableBody').innerHTML = state.checklists.map(r => `<tr><td>${r.visitDate}</td><td>${r.technicianName}</td><td>${r.locationSite}</td></tr>`).join('');
    }

    checkAuth();
  })();
  </script>
</body>
</html>
