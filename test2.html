<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الصلاحيات</title>
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; }
        .hidden { display: none !important; }
        
        /* تصميم صفحة الدخول */
        #login-container { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--accent-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }

        /* تصميم الداشبورد والتبويبات */
        #app-container { display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--primary-color); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        
        .tabs-nav { background: #fff; display: flex; border-bottom: 2px solid #ddd; overflow-x: auto; }
        .tab-link { padding: 15px 25px; cursor: pointer; border: none; background: none; font-weight: bold; color: #666; transition: 0.3s; }
        .tab-link.active { color: var(--accent-color); border-bottom: 3px solid var(--accent-color); background: #f9f9f9; }
        
        .content-area { flex: 1; padding: 20px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div id="login-container">
        <div class="login-box">
            <h2 style="text-align: center;">تسجيل الدخول</h2>
            <input type="email" id="email" placeholder="البريد الإلكتروني" value="">
            <input type="password" id="password" placeholder="كلمة المرور" value="">
            <button id="loginBtn">دخول النظام</button>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <header>
            <div id="user-info">مرحباً: <span id="user-name">...</span></div>
            <button onclick="logout()" style="width: auto; background: #e74c3c; padding: 5px 15px;">خروج</button>
        </header>

        <nav class="tabs-nav" id="main-tabs"></nav>

        <main class="content-area">
            <div id="tab-content-render" class="card">
                <h3>اختر قسم من الأعلى للبدء</h3>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // إعدادات مشروعك (كما في الصورة الثالثة)
        const firebaseConfig = {
            apiKey: "AIzaSyBsvBEEHEgBuw9Pdml-Om90mm8MLDw8gWs",
            authDomain: "baghethan-ba325.firebaseapp.com",
            projectId: "baghethan-ba325",
            storageBucket: "baghethan-ba325.firebasestorage.app",
            messagingSenderId: "944819735112",
            appId: "1:944819735112:web:07315600da39377320667d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;

        // --- دالة تسجيل الدخول ---
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // التوجيه يتم تلقائياً عبر onAuthStateChanged
            } catch (error) {
                alert("خطأ في بيانات الدخول: " + error.message);
            }
        });

        // --- مراقبة حالة المستخدم ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "app_users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    currentUserData = docSnap.data();
                    if (currentUserData.active) {
                        initApp();
                    } else {
                        alert("حسابك غير نشط");
                        signOut(auth);
                    }
                }
            } else {
                showLogin();
            }
        });

        function initApp() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-name').innerText = currentUserData.name;
            renderTabs();
        }

        function showLogin() {
            document.getElementById('login-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
        }

        // --- بناء التبويبات ديناميكياً ---
        function renderTabs() {
            const tabsNav = document.getElementById('main-tabs');
            tabsNav.innerHTML = '';

            // نمر على قائمة الصفحات (pages) المسموحة للمستخدم في Firestore
            currentUserData.pages.forEach(pageID => {
                const btn = document.createElement('button');
                btn.className = 'tab-link';
                btn.innerText = getPageTitle(pageID); // دالة لتحويل اسم الكود لاسم مقروء
                btn.onclick = () => switchTab(pageID, btn);
                tabsNav.appendChild(btn);
            });
        }

        // دالة لتحويل أسماء الـ IDs لأسماء عربية جميلة
        function getPageTitle(id) {
            const titles = {
                'dashboard': 'الرئيسية',
                'dashboard2': 'لوحة المراقبة 2',
                'checklist': 'قائمة الفحص',
                'branches': 'الفروع',
                'reports': 'التقارير'
                // يمكنك إضافة أي صفحة جديدة هنا
            };
            return titles[id] || id;
        }

        // --- تبديل المحتوى والتحقق من صلاحية View داخل التبويب ---
        window.switchTab = (pageID, element) => {
            // تحديث شكل الأزرار
            document.querySelectorAll('.tab-link').forEach(b => b.classList.remove('active'));
            element.classList.add('active');

            const contentArea = document.getElementById('tab-content-render');
            
            // جلب صلاحيات هذه الصفحة تحديداً من ماب permissions في Firestore
            const perm = currentUserData.permissions[pageID];

            if (perm && perm.view) {
                renderPageHTML(pageID, perm);
            } else {
                contentArea.innerHTML = `<h3 style="color:red">عذراً، ليس لديك صلاحية عرض هذه الصفحة.</h3>`;
            }
        };

        // --- مكان كتابة محتوى كل صفحة ---
        function renderPageHTML(pageID, perm) {
            const container = document.getElementById('tab-content-render');
            let html = `<h2>${getPageTitle(pageID)}</h2><hr>`;

            // هنا يمكنك تعريف محتوى كل صفحة بناءً على الـ ID
            switch(pageID) {
                case 'dashboard':
                    html += `<p>أهلاً بك في اللوحة الرئيسية. إحصائيات النظام تظهر هنا.</p>`;
                    break;
                case 'dashboard2':
                    html += `<p>محتوى لوحة المراقبة الثانية المتقدمة.</p>`;
                    break;
                case 'reports':
                    html += `<p>قسم التقارير السنوية والشهرية.</p>`;
                    break;
                default:
                    html += `<p>محتوى افتراضي لصفحة ${pageID}</p>`;
            }

            // مثال: إضافة زر "إضافة" فقط إذا كان حقل add في Firestore يساوي true
            if (perm.add) {
                html += `<button style="width:auto; background:green">إضافة سجل جديد في ${pageID}</button>`;
            }

            container.innerHTML = html;
        }

        window.logout = () => signOut(auth);

    </script>
</body>
</html>
