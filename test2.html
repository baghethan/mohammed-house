<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المجدوعي | تشخيص v1.0.7</title>
    <style>
        :root { --primary: #0062ff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f7; margin: 0; direction: rtl; }
        .hidden { display: none !important; }

        /* نظام تتبع الحالة في الزاوية */
        .debug-panel {
            position: fixed; bottom: 10px; left: 10px;
            background: #212529; color: white;
            padding: 8px 15px; border-radius: 8px;
            font-family: monospace; font-size: 12px; z-index: 9999;
            border: 1px solid #444; display: flex; align-items: center; gap: 10px;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .dot-green { background: #00ff00; box-shadow: 0 0 5px #00ff00; }
        .dot-red { background: #ff0000; box-shadow: 0 0 5px #ff0000; }

        /* تصميم الدخول */
        #login-section { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 350px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="debug-panel">
        <div id="statusDot" class="status-dot"></div>
        <span id="verInfo">v1.0.7</span>
        <span id="apiMsg" style="color: #aaa;">| جاري فحص المفتاح...</span>
    </div>

    <div id="login-section">
        <div class="login-box">
            <h2 style="text-align: center;">دخول النظام</h2>
            <input type="email" id="email" placeholder="الإيميل">
            <input type="password" id="pass" placeholder="كلمة المرور">
            <button class="btn-main" id="doLogin">دخول</button>
            <p id="error-display" style="color:red; font-size:12px; margin-top:10px; text-align:center;"></p>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        <header style="background:#1a1a1a; color:white; padding:15px; display:flex; justify-content:space-between;">
            <span>أهلاً: <b id="uName"></b></span>
            <button onclick="location.reload()">خروج</button>
        </header>
        <div id="tabsList" style="display:flex; background:white; border-bottom:1px solid #ddd;"></div>
        <div id="view-port" style="padding:20px;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsvBEEHEgBuw9Pdml-Om90mm8MLDw8gWs", 
            authDomain: "baghethan-ba325.firebaseapp.com",
            projectId: "baghethan-ba325",
            storageBucket: "baghethan-ba325.firebasestorage.app",
            messagingSenderId: "944819735112",
            appId: "1:944819735112:web:07315600da39377320667d"
        };

        // --- نظام التشخيص (Debug System) ---
        async function diagnoseApiKey() {
            const dot = document.getElementById('statusDot');
            const msg = document.getElementById('apiMsg');
            
            try {
                // محاولة إرسال طلب تجريبي لجوجل لنرى هل المفتاح مقبول أم لا
                const testReq = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`, {
                    method: 'POST',
                    body: JSON.stringify({ returnSecureToken: true })
                });
                
                const res = await testReq.json();

                if (res.error) {
                    if (res.error.message === "MISSING_EMAIL") {
                        // هذا يعني أن المفتاح شغال تمام وجوجل استقبلت الطلب وتنتظر بيانات!
                        dot.className = "status-dot dot-green";
                        msg.innerText = "| المفتاح سليم ✅";
                    } else {
                        // خطأ حقيقي من جوجل (مثلاً المفتاح مقيد أو خطأ)
                        dot.className = "status-dot dot-red";
                        msg.innerText = `| خطأ: ${res.error.status}`;
                        console.error("Diagnostic Error:", res.error);
                    }
                }
            } catch (err) {
                dot.className = "status-dot dot-red";
                msg.innerText = "| فشل الاتصال بجوجل";
            }
        }

        // تشغيل التشخيص فوراً
        diagnoseApiKey();

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('doLogin').onclick = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            const errDiv = document.getElementById('error-display');
            errDiv.innerText = "";

            try {
                await signInWithEmailAndPassword(auth, e, p);
            } catch (err) {
                errDiv.innerText = "فشل الدخول: " + err.message;
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "app_users", user.uid));
                if (snap.exists()) {
                    renderUI(snap.data());
                }
            }
        });

        function renderUI(data) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('uName').innerText = data.name;
            // ... (باقي كود التبويبات كما في v1.0.6)
        }

    </script>
</body>
</html>
