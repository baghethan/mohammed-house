<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المجدوعي للسيارات | v1.1.7</title>
    <style>
        :root { --primary: #0062ff; --dark: #1a1a1a; --bg: #f0f4f8; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        header { background: var(--dark); color: white; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; }
        .nav-tabs { background: white; display: flex; border-bottom: 1px solid #ddd; overflow-x: auto; white-space: nowrap; }
        .tab { padding: 18px 22px; border: none; background: none; cursor: pointer; font-weight: 600; color: #777; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: #f0f7ff; }
        
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        #viewContainer { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); flex: 1; overflow: hidden; position: relative; }
        
        /* تصميم الـ iframe */
        #contentFrame { width: 100%; height: 100%; border: none; }

        /* شاشة تسجيل الدخول (نفس التصميم السابق) */
        #login-page { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #004dc9, #0062ff); position: fixed; width: 100%; z-index: 9999; }
        .login-card { background: white; padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card">
            <h2>دخول النظام</h2>
            <p style="color:#666;">شركة المجدوعي للسيارات</p>
            <input type="email" id="emailField" placeholder="البريد الإلكتروني" value="baghethanmh@almajdouie.com" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
            <input type="password" id="passField" placeholder="كلمة المرور" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
            <button onclick="handleLogin()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:12px; cursor:pointer; font-weight:bold;">دخول</button>
            <p id="msg" style="color:red; font-size:13px;"></p>
        </div>
    </div>

    <div id="dash-page" class="hidden">
        <header>
            <div id="userDisplay"></div>
            <div style="font-weight: bold;">إدارة المجدوعي للسيارات</div>
            <button onclick="location.reload()" style="background:#333; color:white; border:none; padding:5px 12px; border-radius:8px; cursor:pointer;">خروج</button>
        </header>
        <nav class="nav-tabs" id="tabsBox"></nav>
        <main class="main-content">
            <div id="viewContainer">
                <iframe id="contentFrame" name="contentFrame"></iframe>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
            authDomain: "baghethan-ba325.firebaseapp.com",
            projectId: "baghethan-ba325",
            storageBucket: "baghethan-ba325.firebasestorage.app",
            messagingSenderId: "944819735112",
            appId: "1:944819735112:web:07315600da39377320667d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.handleLogin = async () => {
            const e = document.getElementById('emailField').value;
            const p = document.getElementById('passField').value;
            try { await signInWithEmailAndPassword(auth, e, p); } catch { document.getElementById('msg').innerText = "خطأ في الدخول"; }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "app_users", user.uid));
                if (snap.exists()) {
                    window.currentUserData = snap.data();
                    showDash();
                }
            }
        });

        function showDash() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dash-page').classList.remove('hidden');
            document.getElementById('userDisplay').innerHTML = `مرحباً: <b>${window.currentUserData.name}</b>`;
            
            const box = document.getElementById('tabsBox');
            box.innerHTML = '';
            window.currentUserData.pages.forEach(pID => {
                const b = document.createElement('button');
                b.className = 'tab';
                b.innerText = translate(pID);
                b.onclick = () => loadTab(pID, b);
                box.appendChild(b);
            });
            if(box.firstChild) box.firstChild.click();
        }

        function translate(id) {
            const names = { 'dashboard': 'الرئيسية', 'branches': 'الفروع', 'technicians': 'الفنيين', 'holidays': 'الإجازات' };
            return names[id] || id;
        }

        window.loadTab = (id, el) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            // تغيير رابط الإطار ليفتح صفحة مستقلة
            document.getElementById('contentFrame').src = id + ".html";
        };
    </script>
</body>
</html>
