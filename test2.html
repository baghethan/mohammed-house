<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المجدوعي للسيارات | v1.1.4</title>
    <style>
        :root { 
            --primary: #0062ff; 
            --dark: #1a1a1a; 
            --glass: rgba(255, 255, 255, 0.95); 
            --success: #28a745;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f9; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .hidden { display: none !important; }

        /* لوحة التشخيص */
        .debug-panel {
            position: fixed; bottom: 10px; left: 10px; background: #222; color: #fff;
            padding: 8px 12px; border-radius: 8px; font-size: 11px; z-index: 10000;
            display: flex; align-items: center; gap: 8px; border: 1px solid #444;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
        .dot-online { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .dot-offline { background: #ff0000; box-shadow: 0 0 8px #ff0000; }

        /* واجهة الدخول */
        #login-page { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #004dc9, #0062ff); }
        .login-card { background: var(--glass); padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 380px; text-align: center; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-login:hover { background: #0052d6; }

        /* لوحة التحكم */
        header { background: var(--dark); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .nav-tabs { background: white; display: flex; border-bottom: 2px solid #eee; overflow-x: auto; white-space: nowrap; }
        .tab { padding: 15px 25px; border: none; background: none; cursor: pointer; font-weight: 600; color: #666; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: #f9fbff; }
        .main-content { padding: 25px; flex: 1; overflow-y: auto; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 900px; margin: auto; }
        
        label { display: block; text-align: right; font-weight: bold; margin-top: 10px; color: #444; }
        .btn-action { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="debug-panel">
        <div id="apiDot" class="dot"></div>
        <span>v1.1.4</span>
        <span id="apiStatusText">فحص الاتصال...</span>
    </div>

    <div id="login-page">
        <div class="login-card">
            <h2 style="margin-bottom: 30px;">دخول النظام</h2>
            <input type="email" id="emailField" placeholder="الإيميل" value="baghethanmh@almajdouie.com">
            <input type="password" id="passField" placeholder="كلمة المرور">
            <button class="btn-login" id="btnLogin">دخول</button>
            <p id="msg" style="color:red; font-size:13px; margin-top:15px;"></p>
        </div>
    </div>

    <div id="dash-page" class="hidden">
        <header>
            <div id="userDisplay"></div>
            <div style="font-size: 14px; font-weight: bold;">إدارة المجدوعي للسيارات</div>
            <button onclick="location.reload()" style="background:none; color:white; border:1px solid #555; padding:6px 15px; border-radius:6px; cursor:pointer">خروج</button>
        </header>
        <nav class="nav-tabs" id="tabsBox"></nav>
        <main class="main-content">
            <div id="viewBox" class="card"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
            authDomain: "baghethan-ba325.firebaseapp.com",
            projectId: "baghethan-ba325",
            storageBucket: "baghethan-ba325.firebasestorage.app",
            messagingSenderId: "944819735112",
            appId: "1:944819735112:web:07315600da39377320667d"
        };

        // فحص حالة الـ API
        async function checkHealth() {
            const dot = document.getElementById('apiDot');
            const txt = document.getElementById('apiStatusText');
            try {
                const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`, {
                    method: 'POST', body: JSON.stringify({ returnSecureToken: true })
                });
                if (res.status === 400) { dot.className = "dot dot-online"; txt.innerText = "API متصل ✅"; }
                else { dot.className = "dot dot-offline"; txt.innerText = "API مقيد ❌"; }
            } catch { dot.className = "dot dot-offline"; txt.innerText = "خطأ اتصال"; }
        }

        checkHealth();

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;

        document.getElementById('btnLogin').onclick = async () => {
            const e = document.getElementById('emailField').value;
            const p = document.getElementById('passField').value;
            const m = document.getElementById('msg');
            m.innerText = "جاري التحقق...";
            try { await signInWithEmailAndPassword(auth, e, p); } 
            catch (err) { m.innerText = "فشل الدخول: تأكد من البيانات"; }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "app_users", user.uid));
                if (snap.exists()) {
                    currentUserData = snap.data();
                    showDash();
                }
            }
        });

        function showDash() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dash-page').classList.remove('hidden');
            document.getElementById('userDisplay').innerHTML = `أهلاً: <b>${currentUserData.name}</b>`;

            const box = document.getElementById('tabsBox');
            box.innerHTML = '';

            // عرض التبويبات المتاحة للمستخدم
            currentUserData.pages.forEach(pID => {
                const b = document.createElement('button');
                b.className = 'tab';
                b.innerText = translate(pID);
                b.onclick = () => loadTab(pID, b);
                box.appendChild(b);
            });

            if(box.firstChild) box.firstChild.click();
        }

        function translate(id) {
            const names = { 
                'dashboard': 'الرئيسية', 'checklist': 'قائمة الفحص', 'branches': 'الفروع', 
                'reports': 'التقارير', 'technicians': 'الفنيين', 'visit': 'الزيارات',
                'holidays': 'طلب إجازة', 'permissions': 'الصلاحيات', 'schedule': 'الجدول الزمني'
            };
            return names[id] || id;
        }

        window.loadTab = (id, el) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            const view = document.getElementById('viewBox');
            const hasPermission = (currentUserData.role === 'admin') || (currentUserData.permissions[id] && currentUserData.permissions[id].view);

            if (hasPermission) {
                if (id === 'holidays') {
                    renderHolidaysForm(view);
                } else {
                    view.innerHTML = `<h2>قسم ${translate(id)}</h2><p style="color:#666;">هذا القسم قيد التجهيز البرمجي لربطه بقاعدة البيانات.</p>`;
                }
            } else {
                view.innerHTML = `<h3 style="color:red; text-align:center;">عذراً، لا تملك صلاحية عرض هذا القسم.</h3>`;
            }
        };

        function renderHolidaysForm(container) {
            container.innerHTML = `
                <div style="max-width: 500px; margin: auto;">
                    <h2 style="color: var(--primary); text-align: center;">تقديم طلب إجازة</h2>
                    <p style="text-align:center; color:#777; font-size:14px;">يرجى تعبئة البيانات التالية لإرسالها للإدارة</p>
                    <hr style="border:0; border-top:1px solid #eee; margin:20px 0">
                    
                    <label>نوع الإجازة</label>
                    <select id="hType">
                        <option value="annual">إجازة سنوية</option>
                        <option value="sick">إجازة مرضية</option>
                        <option value="emergency">إجازة اضطرارية</option>
                    </select>

                    <label>تاريخ البدء</label>
                    <input type="date" id="hStart">

                    <label>تاريخ الانتهاء</label>
                    <input type="date" id="hEnd">

                    <label>ملاحظات إضافية</label>
                    <textarea id="hReason" placeholder="اذكر السبب هنا..."></textarea>

                    <button class="btn-action" id="btnSubmitHoliday">إرسال الطلب الآن</button>
                    <p id="hStatus" style="text-align:center; font-weight:bold; margin-top:15px;"></p>
                </div>
            `;

            document.getElementById('btnSubmitHoliday').onclick = async () => {
                const status = document.getElementById('hStatus');
                const btn = document.getElementById('btnSubmitHoliday');
                
                const data = {
                    requesterId: auth.currentUser.uid,
                    requesterName: currentUserData.name,
                    type: document.getElementById('hType').value,
                    startDate: document.getElementById('hStart').value,
                    endDate: document.getElementById('hEnd').value,
                    reason: document.getElementById('hReason').value,
                    status: 'pending',
                    timestamp: new Date()
                };

                if(!data.startDate || !data.endDate) {
                    status.innerText = "⚠️ يرجى تحديد التواريخ المطلوبة";
                    status.style.color = "orange";
                    return;
                }

                try {
                    btn.disabled = true; btn.innerText = "جاري الإرسال...";
                    await addDoc(collection(db, "schedule"), data);
                    status.innerText = "✅ تم إرسال طلبك بنجاح وسوف يتم الرد عليك قريباً.";
                    status.style.color = "green";
                    btn.innerText = "تم الإرسال بنجاح";
                    btn.style.background = "#28a745";
                } catch (e) {
                    status.innerText = "❌ حدث خطأ: " + e.message;
                    status.style.color = "red";
                    btn.disabled = false;
                }
            };
        }
    </script>
</body>
</html>
