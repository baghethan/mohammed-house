<!DOCTYPE html>
<!-- الإصدار v1.4.9 - إضافة الشعار والخلفية الموحدة -->
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almajdouie Motors | Master v1.4.9</title>
    <style>
        :root { 
            --primary: #0d4b73; 
            --dark: #0d2149; /* تماشياً مع هوية Ultra Portal */
            --bg-overlay: rgba(237, 243, 248, 0.85); 
            --new-update: #d64545; 
            --shadow: 0 18px 50px rgba(13, 33, 73, 0.16);
        }
        
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        /* تطبيق الخلفية الجديدة مع التدرج */
        body { 
            background: linear-gradient(180deg, rgba(12, 31, 73, 0.15), rgba(255, 255, 255, 0.25)), 
                        url('image_dba186.png') center/cover fixed no-repeat; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        .hidden { display: none !important; }

        header { 
            background: rgba(13, 33, 73, 0.98); 
            backdrop-filter: blur(10px);
            color: white; 
            padding: 8px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            flex-shrink: 0; 
            z-index: 10; 
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .main-logo { height: 45px; filter: brightness(0) invert(1); } /* جعل الشعار أبيض ليتناسب مع الهيدر الغامق */

        /* شريط التبويبات الرئيسي بنمط زجاجي (Glassmorphism) */
        .nav-tabs { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(15px);
            display: flex; 
            border-bottom: 1px solid rgba(0,0,0,0.1); 
            overflow-x: auto; 
            white-space: nowrap; 
            flex-shrink: 0; 
            z-index: 9; 
        }
        
        .sub-nav-tabs { 
            background: rgba(241, 245, 249, 0.9); 
            backdrop-filter: blur(5px);
            display: flex; 
            border-bottom: 2px solid var(--primary); 
            padding: 8px 20px; 
            overflow-x: auto;
            gap: 12px;
            flex-shrink: 0;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .tab { 
            padding: 10px 25px; border: none; background: none; cursor: pointer; 
            color: #475569; border-bottom: 3px solid transparent; transition: 0.3s; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-width: 130px;
        }
        .tab-text { font-weight: 800; font-size: 15px; }
        .tab-ver { font-size: 11px; margin-top: 2px; opacity: 0.7; font-weight: 500; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(255, 255, 255, 0.5); }

        .sub-item {
            padding: 8px 16px; font-size: 13px; font-weight: 700; color: #475569;
            cursor: pointer; border-radius: 8px; transition: 0.2s; background: #fff; border: 1px solid #e2e8f0;
            white-space: nowrap; display: flex; align-items: center;
        }
        .sub-item.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 10px rgba(13,75,115,0.2); }

        .main-content { flex: 1; padding: 15px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }
        #viewContainer { 
            flex: 1; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 28px; 
            box-shadow: var(--shadow); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid rgba(255,255,255,0.4);
        }
        #contentFrame { width: 100%; flex: 1; border: none; display: block; }

        /* صفحة الدخول مطابقة لهوية Ultra Portal */
        #login-page { 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, #0d2149, #1b4fa3); 
            position: fixed; width: 100%; z-index: 9999; 
        }
        .login-card { background: white; padding: 40px; border-radius: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: var(--shadow); }
        .btn-log { width: 100%; padding: 15px; background: linear-gradient(135deg, #0d2149, #1b4fa3); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card">
            <img src="LOGO-almajdouie.png" style="height: 60px; margin-bottom: 20px;" />
            <h2 id="loginTitle" style="color:var(--primary); margin-bottom: 25px;">نظام المجدوعي الموحد</h2>
            <input type="email" id="emailField" placeholder="Email" value="baghethanmh@almajdouie.com" style="width:100%; padding:14px; margin-bottom:12px; border:1px solid #ddd; border-radius:12px;">
            <input type="password" id="passField" placeholder="Password" style="width:100%; padding:14px; margin-bottom:20px; border:1px solid #ddd; border-radius:12px;">
            <button class="btn-log" onclick="handleLogin()">دخول آمن / Secure Login</button>
            <p id="msg" style="color:red; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <div id="dash-page" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
        <header>
            <div class="logo-container">
                <img src="LOGO-almajdouie.png" class="main-logo" alt="Logo" />
                <div id="userDisplay" style="font-size: 13px; border-inline-start: 1px solid rgba(255,255,255,0.3); padding-inline-start: 15px;"></div>
            </div>
            <div id="systemTitle" style="font-weight: 900; font-size: 18px; letter-spacing: 0.5px;">Unified Portal v1.4.9</div>
            <button id="logoutBtn" onclick="location.reload()" style="background:#fee2e2; color:#b91c1c; border:none; padding:6px 18px; border-radius:12px; cursor:pointer; font-weight:800; font-size: 11px;">Logout</button>
        </header>

        <nav class="nav-tabs" id="mainTabsBox"></nav>
        <nav class="sub-nav-tabs hidden" id="subTabsBox"></nav>
        
        <main class="main-content">
            <div id="viewContainer"><iframe id="contentFrame" name="contentFrame"></iframe></div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        let currentLang = 'en'; 
        let activeMainTab = 'diagnostics';

        const hierarchy = {
            'schedule': { ar: 'الجدول', en: 'Schedule', file: 'Schedule1.html', ver: 'v10.10.0' },
            'diagnostics': { ar: 'التشخيص', en: 'Diagnostics', file: 'Diagnostics.html', ver: 'v2.1.14' },
            'site-visit': { 
                ar: 'زيارة الموقع', en: 'Site-Visit', isParent: true, ver: 'v1.4.9',
                children: [
                    { id: 'dashboard', ar: 'لوحة التحكم', en: 'Dashboard', file: 'dashboard.html', ver: 'v1.0.2' },
                    { id: 'branches', ar: 'إدارة الفروع', en: 'Branches', file: 'branches.html', ver: 'v1.0.0' },
                    { id: 'technicians', ar: 'الفنيين', en: 'Technicians', file: 'technicians.html', ver: 'v1.0.1' },
                    { id: 'dynamicChecklistAdmin', ar: 'إدارة الفحص', en: 'Checklist Admin', file: 'dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html', ver: 'v2.1.6' },
                    { id: 'permissions', ar: 'الصلاحيات', en: 'Permissions', file: 'permissions.html', ver: 'v1.0.0' },
                    { id: 'visit', ar: 'زيارة الفرع', en: 'Visit Branch', file: 'visits.html', ver: 'v1.1.0' },
                    { id: 'reports', ar: 'التقارير', en: 'Reports', file: 'windows-report.html', ver: 'v1.0.5' },
                    { id: 'upgradeWindows', ar: 'ترقية ويندوز', en: 'Upgrade Windows', file: 'upgrade-windows.html', ver: 'v2.1.7' },
                    { id: 'brands', ar: 'العلامات التجارية', en: 'Brands', file: 'brands.html', ver: 'v1.0.0' },
                    { id: 'checklist', ar: 'قائمة الفحص', en: 'Checklist', file: 'check-list.html', ver: 'v1.2.0' }
                ]
            }
        };

        const firebaseConfig = { apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs", authDomain: "baghethan-ba325.firebaseapp.com", projectId: "baghethan-ba325", storageBucket: "baghethan-ba325.firebasestorage.app", messagingSenderId: "944819735112", appId: "1:944819735112:web:07315600da39377320667d" };
        firebase.initializeApp(firebaseConfig);
        window.appAuth = firebase.auth(); window.appDb = firebase.firestore();

        window.handleLogin = async () => {
            const e = document.getElementById('emailField').value; 
            const p = document.getElementById('passField').value;
            try { await window.appAuth.signInWithEmailAndPassword(e, p); } 
            catch { document.getElementById('msg').innerText = "خطأ في الدخول"; }
        };

        window.appAuth.onAuthStateChanged(async (user) => { 
            if (user) { 
                const snap = await window.appDb.collection('app_users').doc(user.uid).get(); 
                if (snap.exists) { window.currentUserData = snap.data(); showDash(); } 
            } 
        });

        function showDash() {
            document.getElementById('login-page').classList.add('hidden'); 
            document.getElementById('dash-page').classList.remove('hidden'); 
            document.getElementById('dash-page').style.display = 'flex';
            document.getElementById('userDisplay').innerHTML = `Welcome: <b>${window.currentUserData.name}</b>`;
            renderMainTabs();
        }

        function renderMainTabs() {
            const box = document.getElementById('mainTabsBox');
            box.innerHTML = '';
            Object.entries(hierarchy).forEach(([id, info]) => {
                const b = document.createElement('button');
                b.className = `tab ${activeMainTab === id ? 'active' : ''}`;
                b.innerHTML = `<span class="tab-text">${info.en}</span><span class="tab-ver">${info.ver}</span>`;
                b.onclick = () => {
                    activeMainTab = id;
                    renderMainTabs();
                    if (info.isParent) { renderSubTabs(id); } 
                    else {
                        document.getElementById('subTabsBox').classList.add('hidden');
                        document.getElementById('contentFrame').src = info.file;
                    }
                };
                box.appendChild(b);
            });
            if (!document.getElementById('contentFrame').src) {
                document.getElementById('contentFrame').src = hierarchy.diagnostics.file;
            }
        }

        function renderSubTabs(parentId) {
            const subBox = document.getElementById('subTabsBox');
            const data = hierarchy[parentId];
            subBox.classList.remove('hidden');
            subBox.innerHTML = '';
            data.children.forEach((item, index) => {
                const s = document.createElement('div');
                s.className = 'sub-item';
                s.innerHTML = `${item.en} <span class="ver-chip">${item.ver}</span>`;
                s.onclick = () => {
                    document.querySelectorAll('.sub-item').forEach(si => si.classList.remove('active'));
                    s.classList.add('active');
                    document.getElementById('contentFrame').src = item.file;
                };
                subBox.appendChild(s);
                if(index === 0) s.click();
            });
        }
    </script>
</body>
</html>
