<!DOCTYPE html>
<!-- الإصدار v1.5.2 - إصلاح الشعار ومزامنة جلسة الـ Checklist -->
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almajdouie Motors | Master v1.5.2</title>
    <style>
        :root { 
            --primary: #0d4b73; 
            --dark: #0d2149; 
            --new-update: #d64545; 
            --shadow: 0 18px 50px rgba(13, 33, 73, 0.16);
        }
        
        body { 
            margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, rgba(12, 31, 73, 0.15), rgba(255, 255, 255, 0.25)), 
                        url('image_dba186.png') center/cover fixed no-repeat; 
            height: 100vh; display: flex; flex-direction: column;
        }

        header { 
            background: rgba(13, 33, 73, 0.98); backdrop-filter: blur(10px); color: white; 
            padding: 8px 25px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10; 
        }

        /* إصلاح الشعار: إزالة الفلتر الذي يجعله أبيض بالكامل */
        .main-logo { height: 50px; object-fit: contain; }

        .nav-tabs { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); display: flex; overflow-x: auto; z-index: 9; }
        
        .tab { 
            padding: 12px 25px; border: none; background: none; cursor: pointer; 
            color: #475569; border-bottom: 3px solid transparent; transition: 0.3s; 
            display: flex; flex-direction: column; align-items: center; min-width: 130px;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(255, 255, 255, 0.6); }

        .badge-new {
            background: var(--new-update); color: white; font-size: 9px; padding: 2px 6px;
            border-radius: 4px; margin-top: 3px; font-weight: 900;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(214, 69, 69, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(214, 69, 69, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(214, 69, 69, 0); }
        }

        .sub-nav-tabs { background: rgba(241, 245, 249, 0.95); display: flex; padding: 8px 20px; gap: 12px; overflow-x: auto; }

        .sub-item {
            padding: 8px 16px; font-size: 13px; font-weight: 700; color: #475569;
            cursor: pointer; border-radius: 8px; background: #fff; border: 1px solid #e2e8f0;
            display: flex; align-items: center; gap: 8px;
        }
        .sub-item.active { background: var(--primary); color: #fff; }
        .sub-item.is-new { border: 1px solid var(--new-update); background: #fff5f5; }

        .main-content { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow: hidden; }
        #viewContainer { flex: 1; background: rgba(255, 255, 255, 0.98); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <!-- الشعار الآن سيظهر بألوانه الأصلية -->
            <img src="LOGO-almajdouie.png" class="main-logo" alt="Almajdouie Logo" />
            <div id="userDisplay" style="font-size: 13px; border-inline-start: 1px solid rgba(255,255,255,0.3); padding-inline-start: 15px;"></div>
        </div>
        <div id="masterVersion" style="font-weight: 900; font-size: 18px;">Unified Portal v1.5.2</div>
        <button onclick="location.reload()" style="background:#fee2e2; color:#b91c1c; border:none; padding:6px 18px; border-radius:12px; cursor:pointer; font-weight:800;">Logout</button>
    </header>

    <nav class="nav-tabs" id="mainTabsBox"></nav>
    <nav class="sub-nav-tabs hidden" id="subTabsBox"></nav>
    
    <main class="main-content">
        <div id="viewContainer"><iframe id="contentFrame"></iframe></div>
    </main>

    <script>
        let currentLang = 'en';
        let activeMainTab = 'diagnostics';

        const hierarchy = {
            'schedule': { ar: 'الجدول', en: 'Schedule', file: 'Schedule1.html', ver: 'v10.10.0', date: '2026-04-30' },
            'diagnostics': { ar: 'التشخيص', en: 'Diagnostics', file: 'Diagnostics.html', ver: 'v2.1.16', date: '2026-04-30' },
            'site-visit': { 
                ar: 'زيارة الموقع', en: 'Site-Visit', isParent: true, ver: 'v1.5.2', date: '2026-04-30',
                children: [
                    { id: 'dashboard', ar: 'لوحة التحكم', en: 'Dashboard', file: 'dashboard.html', ver: 'v1.0.2', date: '2026-04-20' },
                    { id: 'upgradeWindows', ar: 'ترقية ويندوز', en: 'Upgrade Windows', file: 'upgrade-windows.html', ver: 'v2.1.7', date: '2026-04-30' },
                    { id: 'checklist', ar: 'قائمة الفحص', en: 'Checklist', file: 'check-list.html', ver: 'v1.2.0', date: '2026-04-30' }
                ]
            }
        };

        function isNew(dateStr) {
            const upDate = new Date(dateStr);
            const now = new Date();
            // وسم جديد يظهر لمدة 48 ساعة لضمان رؤيته
            return (now - upDate) / (1000 * 60 * 60) <= 48;
        }

        function renderMainTabs() {
            const box = document.getElementById('mainTabsBox');
            box.innerHTML = '';
            
            Object.entries(hierarchy).forEach(([id, info]) => {
                const b = document.createElement('button');
                b.className = `tab ${activeMainTab === id ? 'active' : ''}`;
                const newTag = isNew(info.date) ? `<span class="badge-new">NEW</span>` : '';
                b.innerHTML = `<span style="font-weight:800">${info.en}</span><span style="font-size:10px">${info.ver}</span>${newTag}`;
                
                b.onclick = () => {
                    activeMainTab = id;
                    renderMainTabs();
                    if (info.isParent) renderSubTabs(id);
                    else {
                        document.getElementById('subTabsBox').classList.add('hidden');
                        document.getElementById('contentFrame').src = info.file;
                    }
                };
                box.appendChild(b);
            });
        }

        function renderSubTabs(parentId) {
            const subBox = document.getElementById('subTabsBox');
            const data = hierarchy[parentId];
            subBox.classList.remove('hidden');
            subBox.innerHTML = '';

            data.children.forEach(item => {
                const s = document.createElement('div');
                const isRecentlyUpdated = isNew(item.date);
                s.className = `sub-item ${isRecentlyUpdated ? 'is-new' : ''}`;
                
                const newTag = isRecentlyUpdated ? `<span class="badge-new" style="margin:0">NEW</span>` : '';
                s.innerHTML = `${item.en} <span style="font-size:10px;opacity:0.6">${item.ver}</span> ${newTag}`;
                
                s.onclick = () => {
                    document.querySelectorAll('.sub-item').forEach(si => si.classList.remove('active'));
                    s.classList.add('active');
                    // حل مشكلة Checklist: تمرير معاملات الجلسة واللغة
                    const secureSrc = `${item.file}?lang=${currentLang}&auth=active`;
                    document.getElementById('contentFrame').src = secureSrc;
                };
                subBox.appendChild(s);
            });
        }

        window.onload = () => {
            document.getElementById('masterVersion').innerText = `Unified Portal v${hierarchy['site-visit'].ver}`;
            renderMainTabs();
            document.getElementById('contentFrame').src = hierarchy.diagnostics.file;
        };
    </script>
</body>
</html>
