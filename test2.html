<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المجدوعي للسيارات | v1.2.6</title>
    <style>
        :root { 
            --primary: #0d4b73; 
            --dark: #1a1a1a; 
            --bg: #edf3f8; 
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        .hidden { display: none !important; }

        /* تأثير التوسع والظهور السلس */
        @keyframes expandPage {
            from { 
                opacity: 0; 
                transform: translateY(20px) scale(0.98); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .page-animation {
            animation: expandPage 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        header { 
            background: var(--dark); 
            color: white; 
            padding: 12px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
        }

        .nav-tabs { 
            background: white; 
            display: flex; 
            border-bottom: 1px solid #d7e0ea; 
            overflow-x: auto; 
            white-space: nowrap; 
            z-index: 5;
        }

        .tab { 
            padding: 16px 22px; 
            border: none; 
            background: none; 
            cursor: pointer; 
            font-weight: 700; 
            color: #6e8192; 
            border-bottom: 3px solid transparent; 
            transition: 0.3s; 
        }

        .tab.active { 
            color: var(--primary); 
            border-bottom-color: var(--primary); 
            background: #f6fbff; 
        }

        .main-content { 
            flex: 1; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg);
        }

        #viewContainer { 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(18,48,74,.08); 
            flex: 1; 
            overflow: hidden; 
            position: relative;
        }

        #contentFrame { 
            width: 100%; 
            height: 100%; 
            border: none; 
            opacity: 0; /* يبدأ مخفياً ليظهر مع الأنميشن */
        }

        /* واجهة الدخول */
        #login-page { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: linear-gradient(135deg, #0d4b73, #0a3b5a); 
            position: fixed; 
            width: 100%; 
            z-index: 9999; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 24px; 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
        }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card">
            <h2 style="color:var(--primary)">دخول النظام</h2>
            <p style="color:#666;">إدارة المجدوعي للسيارات</p>
            <input type="email" id="emailField" placeholder="البريد الإلكتروني" value="baghethanmh@almajdouie.com" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:12px;">
            <input type="password" id="passField" placeholder="كلمة المرور" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:12px;">
            <button onclick="handleLogin()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:12px; cursor:pointer; font-weight:bold;">دخول</button>
        </div>
    </div>

    <div id="dash-page" class="hidden">
        <header>
            <div id="userDisplay"></div>
            <div style="font-weight: 800;">نظام المجدوعي الموحد</div>
            <button onclick="location.reload()" style="background:#d64545; color:white; border:none; padding:6px 15px; border-radius:999px; cursor:pointer; font-weight:bold;">خروج</button>
        </header>
        <nav class="nav-tabs" id="tabsBox"></nav>
        <main class="main-content">
            <div id="viewContainer">
                <iframe id="contentFrame" name="contentFrame"></iframe>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
            authDomain: "baghethan-ba325.firebaseapp.com",
            projectId: "baghethan-ba325",
            storageBucket: "baghethan-ba325.firebasestorage.app",
            messagingSenderId: "944819735112",
            appId: "1:944819735112:web:07315600da39377320667d"
        };

        firebase.initializeApp(firebaseConfig);
        window.appAuth = firebase.auth();
        window.appDb = firebase.firestore();

        window.handleLogin = async () => {
            const e = document.getElementById('emailField').value;
            const p = document.getElementById('passField').value;
            try { await window.appAuth.signInWithEmailAndPassword(e, p); } catch { alert("خطأ في البيانات"); }
        };

        window.appAuth.onAuthStateChanged(async (user) => {
            if (user) {
                const snap = await window.appDb.collection('app_users').doc(user.uid).get();
                if (snap.exists) {
                    window.currentUserData = snap.data();
                    showDash();
                }
            }
        });

        function showDash() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dash-page').classList.remove('hidden');
            document.getElementById('userDisplay').innerHTML = `مرحباً: <b>${window.currentUserData.name}</b>`;
            
            const box = document.getElementById('tabsBox');
            box.innerHTML = '';
            (window.currentUserData.pages || []).forEach(pID => {
                const b = document.createElement('button');
                b.className = 'tab';
                b.innerText = translate(pID);
                b.onclick = () => loadTab(pID, b);
                box.appendChild(b);
            });
            if(box.firstChild) box.firstChild.click();
        }

        function translate(id) {
            const names = { 'dashboard': 'الرئيسية', 'branches': 'الفروع', 'technicians': 'الفنيين', 'holidays': 'الإجازات' };
            return names[id] || id;
        }

        window.loadTab = (id, el) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            const frame = document.getElementById('contentFrame');
            
            // إعادة تشغيل الأنميشن عند كل ضغطة
            frame.classList.remove('page-animation');
            void frame.offsetWidth; // Force reflow
            
            frame.src = id + ".html";
            frame.classList.add('page-animation');
        };
    </script>
</body>
</html>
