<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة | v1.0.6</title>
    <style>
        :root { --primary: #0062ff; --glass: rgba(255, 255, 255, 0.8); }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f7; margin: 0; direction: rtl; }
        .hidden { display: none !important; }

        /* تذكرة الإصدار في الزاوية */
        .version-tag {
            position: fixed; bottom: 15px; left: 15px;
            background: #212529; color: #00ff00;
            padding: 5px 12px; border-radius: 5px;
            font-family: monospace; font-size: 12px; z-index: 9999;
            border: 1px solid #444;
        }

        /* تصميم الدخول */
        #login-section { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }

        /* تصميم الواجهة الرئيسية */
        header { background: #1a1a1a; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .tabs-container { background: white; display: flex; border-bottom: 2px solid #eee; overflow-x: auto; }
        .tab-btn { padding: 18px 25px; border: none; background: none; cursor: pointer; font-weight: 600; color: #666; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #f8faff; }
        .content-area { padding: 30px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    </style>
</head>
<body>

    <div class="version-tag" id="ver">Checking...</div>

    <div id="login-section">
        <div class="login-box">
            <h2 style="text-align: center; margin-top:0">دخول النظام</h2>
            <input type="email" id="email" placeholder="البريد الإلكتروني" autocomplete="email">
            <input type="password" id="pass" placeholder="كلمة المرور">
            <button class="btn-main" id="doLogin">دخول</button>
        </div>
    </div>

    <div id="dashboard-section" class="hidden">
        <header>
            <div>مرحباً: <span id="uName">...</span></div>
            <div style="font-size: 14px; color: #aaa;">نظام المجدوعي للسيارات</div>
            <button onclick="location.reload()" style="background:#444; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer">خروج</button>
        </header>
        
        <div class="tabs-container" id="tabsList"></div>

        <main class="content-area">
            <div id="view-port" class="card">
                <h3>يرجى الانتظار، جاري تحميل القسم...</h3>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // تحديث الإصدار
        const VERSION = "1.0.6";
        document.getElementById('ver').innerText = `Ver: ${VERSION}`;

        // إعدادات فايربيس (تأكد من نسخ الـ Key من الكونسول مباشرة)
        const firebaseConfig = {
            apiKey: "AIzaSyBsvBEEHEgBuw9Pdml-Om90mm8MLDw8gWs", 
            authDomain: "baghethan-ba325.firebaseapp.com",
            projectId: "baghethan-ba325",
            storageBucket: "baghethan-ba325.firebasestorage.app",
            messagingSenderId: "944819735112",
            appId: "1:944819735112:web:07315600da39377320667d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userData = null;

        // فحص كونسول للمساعدة
        console.log(`%c System Version: ${VERSION} `, 'background: #222; color: #bada55');
        console.log("Current API Key in use:", firebaseConfig.apiKey);

        // تسجيل الدخول
        document.getElementById('doLogin').onclick = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
            } catch (err) {
                console.error(err);
                alert("خطأ في الدخول: " + err.message);
            }
        };

        // مراقبة الحالة
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "app_users", user.uid));
                if (docSnap.exists() && docSnap.data().active) {
                    userData = docSnap.data();
                    startApp();
                }
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        });

        function startApp() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('uName').innerText = userData.name;
            
            const list = document.getElementById('tabsList');
            list.innerHTML = '';

            userData.pages.forEach(pg => {
                const b = document.createElement('button');
                b.className = 'tab-btn';
                b.innerText = pg.toUpperCase();
                b.onclick = () => openTab(pg, b);
                list.appendChild(b);
            });

            if(list.firstChild) list.firstChild.click();
        }

        window.openTab = (id, el) => {
            document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
            
            const port = document.getElementById('view-port');
            const p = userData.permissions[id];

            if (p && p.view) {
                port.innerHTML = `<h2>قسم ${id}</h2><hr><p>مرحباً بك في هذا القسم ضمن إصدار ${VERSION}</p>`;
                if (p.add) port.innerHTML += `<button style="background:green; color:white; padding:10px; border:none; border-radius:5px">إضافة سجل جديد +</button>`;
            } else {
                port.innerHTML = `<h3 style="color:red">لا توجد صلاحية عرض.</h3>`;
            }
        };
    </script>
</body>
</html>
