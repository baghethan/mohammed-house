<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Check-List Admin Advanced v2.1.6 - Integrated</title>
  <style>
    :root{--primary:#0d4b73;--green:#2f9e66;--danger:#d64545;--warning:#c47f00;--border:#d7e0ea;--text:#163247;--muted:#6e8192;--bg:#edf3f8;--card:#fff;--shadow:0 10px 30px rgba(18,48,74,.08);--radius:18px}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:var(--text);background:var(--bg)}
    .hidden{display:none!important}.rtl-en{display:inline-block;direction:ltr;unicode-bidi:embed}

    /* تعديل: إخفاء الهيدر عند العمل داخل نظام الماستر */
    header { display: none !important; }
    .container { max-width:1600px; margin: 10px auto; padding:0 14px 28px; } /* تقليل الهامش العلوي */

    .header-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.title{font-size:24px;font-weight:800}.user-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:8px 12px;border-radius:999px}
    .grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;overflow:hidden}.card h3{margin:-16px -16px 14px;padding:12px 16px;background:var(--primary);color:#fff;font-size:16px}
    .field{display:grid;gap:8px}.field label{font-size:14px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--text)}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.note{background:#f6fbff;border:1px dashed #bfd7e8;color:#33546b;border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.7}
    .alert{padding:10px 12px;border-radius:12px;margin-top:10px}.alert.error{background:#ffecec;border:1px solid #f3b0b0;color:#8a1f1f}.alert.ok{background:#eaf9f0;border:1px solid #bce3c9;color:#206449}
    .btn{border:1px solid var(--border);border-radius:999px;padding:10px 16px;background:#fff;color:var(--primary);font-weight:700;cursor:pointer;transition:all .2s}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.warning{background:var(--warning);border-color:var(--warning);color:#fff}.btn:hover{opacity:.9}
    .item{background:#fcfdff;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}.item strong{display:block;color:var(--primary);margin-bottom:6px}.item small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
    .section-title{margin:18px 0 10px;font-weight:800;color:var(--primary);font-size:16px;border-inline-start:4px solid var(--primary);padding-inline-start:10px}
    .logic-box{border:1px dashed var(--border);border-radius:12px;padding:10px;background:#fbfcfe}
    .dynamic-checklist-wrap{display:grid;gap:16px}.dynamic-section-block{margin-top:8px}.dynamic-checklist-list{list-style:none;padding:0;margin:0;counter-reset:ck}.dynamic-checklist-list>li{position:relative;padding:10px 10px 10px 30px;border-bottom:1px solid var(--border);counter-increment:ck}.dynamic-checklist-list>li:before{content:counter(ck);position:absolute;inset-inline-start:8px;top:50%;transform:translateY(-50%);background:var(--primary);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
    .overlay{position:fixed;inset:0;background:rgba(13,75,115,.18);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}.login-card{width:min(760px,96vw);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}.login-head{background:var(--primary);color:#fff;padding:14px 18px;font-size:18px;font-weight:800}.login-body{padding:18px}
    @media (max-width:1200px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
  </style>
</head>
<body>

    </div>
  </header>

  <main class="container hidden" id="appRoot">
    <div id="globalError" class="alert error hidden"></div>
    <div class="grid-2">

        <input type="hidden" id="builderEditingId">
        <div class="grid-4">

          <div class="field"><label>نوع السؤال</label><select id="builderFieldType"><option value="text">Text</option><option value="textarea">Textarea</option><option value="number">Number</option><option value="date">Date</option><option value="boolean">Boolean</option><option value="choice">Choice</option></select></div>
          <div class="field"><label>الترتيب</label><input id="builderOrder" type="number" min="1" value="1"></div>
          <div class="field"><label>القسم</label><input id="builderSection" placeholder="Software & Systems Assessment"></div>
          <div class="field"><label>نشط؟</label><select id="builderActive"><option value="true">نعم</option><option value="false">لا</option></select></div>
        </div>
        <div id="builderOptionsBox" class="grid-3 hidden" style="margin-top:12px"></div>
        
        <div class="actions">
          <button class="btn green" id="saveFieldBtn" type="button">حفظ البند</button>
          <button class="btn" id="resetFieldBtn" type="button">تنظيف</button>
          <button class="btn warning" id="seedUpgradePatternBtn" type="button">إنشاء مثال Upgrade Windows</button>
        </div>
        <div id="adminList" style="margin-top:16px"></div>
      </div>

      <div class="card">
        <h3>معاينة النموذج</h3>
        <div id="dynamicChecklistSections" class="dynamic-checklist-wrap"></div>
      </div>
    </div>
  </main>

</body>
</html>
