<!DOCTYPE html><!DOCTYPE html<meta charset="UTF-8">
<title>إدارة زيارات الفروع والفنيين</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    linear-gradient(rgba(240,245,250,.95),rgba(240,245,250,.95)),
    url('image_dba186.png') center/cover no-repeat fixed;
}

/* ===== HEADER ===== */
header{
  background:#0d4b73;
  color:#fff;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}
.header-left img{height:40px}
.app-version{font-size:11px;color:#d0d0d0}
.logout-btn{
  background:#d64545;color:#fff;border:none;
  border-radius:20px;padding:6px 14px;cursor:pointer;
}

/* ===== NAV ===== */
nav{
  background:#083c5a;
  display:flex;
}
nav button{
  background:none;border:none;color:#fff;
  padding:12px 18px;cursor:pointer
}
nav button.active{background:#0d4b73}

/* ===== LAYOUT ===== */
#app{display:none}
section{display:none;padding:0}
section.active{display:block}

/* ===== IFRAME ===== */
.iframe-container{
  width:100%;
  height:calc(100vh - 120px);
}
.iframe-container iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox" style="padding:40px;text-align:center">
  <h2>تسجيل الدخول</h2>
  <input id="loginEmail" placeholder="Email"><br><br>
  <input id="loginPassword" type="password" placeholder="Password"><br><br>
  <button id="loginBtn">دخول</button>
  <div id="loginMsg"></div>
</div>

<!-- ===== APP ===== -->
<div id="app">

<header>
  <div class="header-left">
    LOGO-almajdouie.png
    <div>
      <div>إدارة زيارات الفروع والفنيين</div>
      <div class="app-version">v5.2 • 2026‑04‑23</div>
    </div>
  </div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<nav>
  <button class="active" onclick="openTab('dashboard',this)">Dashboard</button>
  <button onclick="openTab('checklist',this)">Check‑List</button>
  <button onclick="openTab('visits',this)">إدخال زيارة</button>
  <button onclick="openTab('branches',this)">إدارة الفروع</button>
  <button onclick="openTab('dynamic',this)">Dynamic Check‑List (Admin)</button>
</nav>

<!-- ===== DASHBOARD ===== -->
<section id="dashboard" class="active" style="padding:20px">
  <h2>Dashboard</h2>
  <p>✅ Dashboard كما تم بناؤه سابقًا</p>
</section>

<!-- ===== CHECK‑LIST ===== -->
<section id="checklist" style="padding:20px">
  <h2>Check‑List</h2>
</section>

<!-- ===== VISITS ===== -->
<section id="visits" style="padding:20px">
  <h2>إدخال زيارة</h2>
</section>

<!-- ===== BRANCHES ===== -->
<section id="branches" style="padding:20px">
  <h2>إدارة الفروع</h2>
</section>

<!-- ===== DYNAMIC CHECK‑LIST (EMBEDDED) ===== -->
<section id="dynamic">
  <div class="iframe-container">
    <iframe
      src="dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html"
      title="Dynamic Check‑List Admin">
    </iframe>
  </div>
</section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325"
};

const appFB = initializeApp(firebaseConfig);
const auth = getAuth(appFB);

const loginBox=document.getElementById('loginBox');
const app=document.getElementById('app');

/* ===== LOGIN ===== */
loginBtn.onclick=async()=>{
  try{
    await signInWithEmailAndPassword(auth,loginEmail.value,loginPassword.value);
  }catch(e){loginMsg.textContent=e.message}
};
logoutBtn.onclick=()=>signOut(auth);

/* ===== AUTH ===== */
onAuthStateChanged(auth,user=>{
  if(user){
    loginBox.style.display='none';
    app.style.display='block';
  }else{
    loginBox.style.display='block';
    app.style.display='none';
  }
});

/* ===== TABS ===== */
window.openTab=(id,btn)=>{
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
};
</script>

</body>
</html>
<html lang="ar" dir="rtl">
<head>
