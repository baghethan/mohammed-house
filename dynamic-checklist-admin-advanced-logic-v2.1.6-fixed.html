<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Check-List Admin Advanced v2.1.6 - Professional Layout</title>
  <style>
    :root{--primary:#0d4b73;--green:#2f9e66;--danger:#d64545;--warning:#c47f00;--border:#d7e0ea;--text:#163247;--muted:#6e8192;--bg:#edf3f8;--card:#fff;--shadow:0 10px 30px rgba(18,48,74,.08);--radius:18px}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:var(--text);background:var(--bg)}
    .hidden{display:none!important}
    
    /* إخفاء الهيدر داخل النظام */
    header { display: none !important; }
    .container { max-width:1600px; margin: 10px auto; padding:0 14px 28px; }

    .grid-2{display:grid;grid-template-columns: 1.15fr 0.85fr; gap:16px}
    .grid-4{display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; margin-bottom: 10px;}
    
    .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; overflow:hidden; margin-bottom: 15px;}
    .card h3{margin:-16px -16px 14px; padding:12px 16px; background:var(--primary); color:#fff; font-size:16px}
    
    .field{display:grid; gap:6px}
    .field label{font-size:13px; font-weight:700; text-align: center; color: var(--text)}
    .field input,.field select,.field textarea{width:100%; border:1px solid var(--border); border-radius:12px; padding:10px; font-size:14px; text-align: center;}
    
    .section-title{margin:18px 0 10px; font-weight:800; color:var(--primary); font-size:15px; border-inline-start:4px solid var(--primary); padding-inline-start:10px; display: flex; align-items: center; justify-content: space-between;}
    .section-title::after { content: ""; flex: 1; height: 1px; background: #eee; margin-inline-start: 15px; }

    .logic-box{border:1px dashed var(--border); border-radius:15px; padding:15px; background:#fbfcfe; margin-bottom: 15px;}
    
    .actions{display:flex; gap:10px; justify-content: flex-end; margin-top: 15px;}
    .btn{border:1px solid var(--border); border-radius:999px; padding:10px 22px; background:#fff; color:var(--primary); font-weight:700; cursor:pointer; transition:all 0.2s; font-size:14px}
    .btn.primary{background:var(--primary); color:#fff; border-color:var(--primary)}
    .btn.green{background:var(--green); border-color:var(--green); color:#fff}
    .btn.warning{background:#c47f00; border-color:#c47f00; color:#fff}
    .btn:hover{opacity: 0.9;}

    .item-card{background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
    .item-info strong { color: var(--primary); font-size: 14px; }
    .item-info span { font-size: 11px; color: var(--muted); }

    .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.1); display:flex; align-items:center; justify-content:center; z-index:1000}
    .login-card{background:#fff; padding:30px; border-radius:20px; width:380px; text-align:center; box-shadow: var(--shadow);}
    
    @media (max-width:1200px){ .grid-2, .grid-4 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="overlay" id="loginOverlay">
    <div class="login-card">
      <h3 style="color:var(--primary); margin-bottom:20px;">تسجيل دخول الإدارة</h3>
      <div class="field" style="margin-bottom:12px"><input id="loginEmail" type="email" placeholder="البريد الإلكتروني"></div>
      <div class="field" style="margin-bottom:20px"><input id="loginPassword" type="password" placeholder="كلمة المرور"></div>
      <button class="btn green" id="loginBtn" style="width:100%">دخول / Login</button>
      <p id="loginMessage" style="color:red; font-size:12px; margin-top:10px;"></p>
    </div>
  </div>

  <main class="container hidden" id="appRoot">
    <div class="grid-2">
      <div class="builder-side">
        <div class="card">
          <h3>إدارة البنود</h3>
          <input type="hidden" id="builderEditingId">
          
          <!-- القسم 1: المعلومات الأساسية -->
          <div class="grid-4">
            <div class="field"><label>اسم البند</label><input id="builderLabel" placeholder="مثال: Windows 10 to 11"></div>
            <div class="field"><label>نوع السؤال</label><select id="builderFieldType">
              <option value="text">Text</option>
              <option value="number">Number</option>
              <option value="choice">Choice</option>
              <option value="boolean">Boolean</option>
            </select></div>
            <div class="field"><label>الترتيب</label><input id="builderOrder" type="number" value="1"></div>
            <div class="field"><label>القسم</label><input id="builderSection" value="& Systems Assessment"></div>
          </div>
          <div class="grid-4" style="grid-template-columns: 1fr 1fr; width: 50%; margin: 0 auto;">
            <div class="field"><label>إجباري؟</label><select id="builderRequired"><option value="true">نعم</option><option value="false">لا</option></select></div>
            <div class="field"><label>نشط؟</label><select id="builderActive"><option value="true">نعم</option><option value="false">لا</option></select></div>
          </div>

          <!-- القسم 2: الظهور الشرطي -->
          <div class="section-title">الظهور الشرطي</div>
          <div class="logic-box">
            <div class="grid-4">
                <div class="field"><label>تفعيل الشرط؟</label><select id="logicEnabled"><option value="false">لا</option><option value="true">نعم</option></select></div>
                <div class="field"><label>يعتمد على بند</label><select id="logicFieldRef"><option value="">اختر بنداً</option></select></div>
                <div class="field"><label>المشغّل</label><select id="logicOperator"><option value="equals">يساوي</option></select></div>
                <div class="field"><label>القيمة</label><input id="logicValue" value="yes"></div>
            </div>
          </div>

          <!-- القسم 3: التكرار حسب العدد -->
          <div class="section-title">التكرار حسب العدد</div>
          <div class="logic-box">
            <div class="grid-4">
                <div class="field"><label>تفعيل التكرار؟</label><select id="repeatEnabled"><option value="false">لا</option><option value="true">نعم</option></select></div>
                <div class="field"><label>العدد من بند</label><select id="repeatCountRef"><option value="">اختر بنداً عددياً</option></select></div>
                <div class="field"><label>قالب التسمية</label><input id="repeatLabelTemplate" value="رقم الموظف للجهاز {index}"></div>
                <div class="field"><label>الحفظ كمصفوفة؟</label><select id="repeatSaveAsArray"><option value="true">نعم</option><option value="false">لا</option></select></div>
            </div>
          </div>

          <!-- القسم 4: الربط بعد الحفظ -->
          <div class="section-title">الربط بعد الحفظ</div>
          <div class="logic-box">
            <div class="grid-4">
                <div class="field"><label>الهدف</label><select id="integrationTarget"><option value="none">بدون</option><option value="windows_upgrades">windows_upgrades</option></select></div>
                <div class="field"><label>الربط بواسطة</label><select id="integrationMatchBy"><option value="employeeId">employeeId</option></select></div>
                <div class="field"><label>نفّذ عند بند</label><select id="integrationTriggerRef"><option value="">بدون شرط</option></select></div>
                <div class="field"><label>وقيمته</label><input id="integrationTriggerValue" value="yes"></div>
            </div>
          </div>

          <div class="actions">
            <button class="btn warning" id="seedBtn">إنشاء مثال Upgrade Windows تلقائياً</button>
            <button class="btn" id="resetBtn">تنظيف</button>
            <button class="btn green" id="saveFieldBtn">حفظ البند</button>
          </div>
        </div>

        <div class="card">
          <h3>البنود المضافة</h3>
          <div id="adminList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
      </div>

      <div class="preview-side">
        <div class="card">
          <h3>معاينة النموذج</h3>
          <div id="previewArea" style="min-height: 300px; font-size: 14px; color: #666;">
            يرجى إضافة بند لعرض المعاينة الحية...
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = { 
        apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs", 
        authDomain: "baghethan-ba325.firebaseapp.com", 
        projectId: "baghethan-ba325", 
        storageBucket: "baghethan-ba325.firebasestorage.app", 
        messagingSenderId: "944819735112", 
        appId: "1:944819735112:web:07315600da39377320667d" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);
    let allFields = [];

    onAuthStateChanged(auth, user => {
      if(user){
        $('loginOverlay').classList.add('hidden');
        $('appRoot').classList.remove('hidden');
        loadData();
      } else {
        $('loginOverlay').classList.remove('hidden');
      }
    });

    $('loginBtn').onclick = async () => {
      try {
        await setPersistence(auth, browserLocalPersistence);
        await signInWithEmailAndPassword(auth, $('loginEmail').value, $('loginPassword').value);
      } catch (err) { $('loginMessage').textContent = "فشل تسجيل الدخول"; }
    };

    function loadData() {
        onSnapshot(query(collection(db, 'checklist_fields'), orderBy('order')), snap => {
            allFields = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderAdminList();
            populateDropdowns();
            renderPreview();
        });
    }

    function populateDropdowns() {
        const fieldOptions = allFields.map(f => `<option value="${f.id}">${f.label}</option>`).join('');
        const numOptions = allFields.filter(f => f.fieldType === 'number').map(f => `<option value="${f.id}">${f.label}</option>`).join('');
        
        $('logicFieldRef').innerHTML = '<option value="">اختر بنداً</option>' + fieldOptions;
        $('repeatCountRef').innerHTML = '<option value="">اختر بنداً عددياً</option>' + numOptions;
        $('integrationTriggerRef').innerHTML = '<option value="">بدون شرط</option>' + fieldOptions;
    }

    function renderAdminList() {
        $('adminList').innerHTML = allFields.map(f => `
            <div class="item-card">
                <div class="item-info">
                    <strong>${f.label}</strong><br>
                    <span>القسم: ${f.section} | الترتيب: ${f.order} | ${f.active ? 'نشط' : 'معطل'}</span>
                </div>
                <div>
                    <button class="btn" style="padding:5px 12px" onclick="editF('${f.id}')">تعديل</button>
                    <button class="btn" style="padding:5px 12px; color:red" onclick="deleteF('${f.id}')">حذف</button>
                </div>
            </div>
        `).join('');
    }

    $('saveFieldBtn').onclick = async () => {
        const id = $('builderEditingId').value;
        const payload = {
            label: $('builderLabel').value,
            fieldType: $('builderFieldType').value,
            order: Number($('builderOrder').value),
            section: $('builderSection').value,
            required: $('builderRequired').value === 'true',
            active: $('builderActive').value === 'true',
            logic: {
                enabled: $('logicEnabled').value === 'true',
                visibleWhen: { fieldId: $('logicFieldRef').value, operator: 'equals', value: $('logicValue').value }
            },
            repeat: {
                enabled: $('repeatEnabled').value === 'true',
                countFromFieldId: $('repeatCountRef').value,
                labelTemplate: $('repeatLabelTemplate').value,
                saveAsArray: $('repeatSaveAsArray').value === 'true'
            },
            integration: $('integrationTarget').value !== 'none' ? {
                target: $('integrationTarget').value,
                matchBy: $('integrationMatchBy').value,
                triggerFieldId: $('integrationTriggerRef').value,
                triggerValue: $('integrationTriggerValue').value
            } : null
        };

        if(id) await setDoc(doc(db, 'checklist_fields', id), payload, {merge:true});
        else await addDoc(collection(db, 'checklist_fields'), payload);
        
        alert('تم الحفظ');
        resetForm();
    };

    window.editF = (id) => {
        const f = allFields.find(x => x.id === id);
        if(!f) return;
        $('builderEditingId').value = f.id;
        $('builderLabel').value = f.label;
        $('builderFieldType').value = f.fieldType;
        $('builderOrder').value = f.order;
        $('builderSection').value = f.section;
        $('builderRequired').value = String(f.required || false);
        $('builderActive').value = String(f.active || true);
        $('logicEnabled').value = String(f.logic?.enabled || false);
        $('logicFieldRef').value = f.logic?.visibleWhen?.fieldId || '';
        $('logicValue').value = f.logic?.visibleWhen?.value || 'yes';
        $('repeatEnabled').value = String(f.repeat?.enabled || false);
        $('repeatCountRef').value = f.repeat?.countFromFieldId || '';
        $('repeatLabelTemplate').value = f.repeat?.labelTemplate || '';
        $('repeatSaveAsArray').value = String(f.repeat?.saveAsArray || true);
        $('integrationTarget').value = f.integration?.target || 'none';
        $('integrationTriggerRef').value = f.integration?.triggerFieldId || '';
        $('integrationTriggerValue').value = f.integration?.triggerValue || 'yes';
    };

    window.deleteF = async (id) => {
        if(confirm('هل تريد حذف البند؟')) await deleteDoc(doc(db, 'checklist_fields', id));
    };

    window.resetForm = () => {
        $('builderEditingId').value = '';
        $('builderLabel').value = '';
        $('builderOrder').value = '1';
        $('logicEnabled').value = 'false';
        $('repeatEnabled').value = 'false';
        $('integrationTarget').value = 'none';
    };
    
    $('resetBtn').onclick = resetForm;

    function renderPreview() {
        if(allFields.length === 0) return;
        $('previewArea').innerHTML = allFields.map(f => `
            <div style="margin-bottom:15px; padding:10px; border-bottom:1px solid #eee">
                <label style="display:block; font-weight:bold; margin-bottom:5px;">${f.label} ${f.required ? '<span style="color:red">*</span>' : ''}</label>
                <input type="text" disabled style="width:100%; padding:8px; background:#f9f9f9; border:1px solid #ddd; border-radius:8px;" placeholder="معاينة الحقل...">
                ${f.logic?.enabled ? '<small style="color:blue">● مرتبط بشرط ظهور</small>' : ''}
                ${f.repeat?.enabled ? '<small style="color:green; margin-inline-start:10px;">● حقل متكرر</small>' : ''}
            </div>
        `).join('');
    }
  </script>
</body>
</html>
