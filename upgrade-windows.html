<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upgrade Windows - Debug</title>
  <style>
    body{margin:0;font-family:Tahoma,Arial;background:#edf3f8}
    .wrap{max-width:1200px;margin:16px auto;padding:0 16px}
    .card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 16px rgba(0,0,0,.08);margin-bottom:16px}
    .ok{color:#0a7a2f}
    .err{color:#b42318;white-space:pre-wrap;direction:ltr;text-align:left;background:#fff5f5;border:1px solid #fecaca;padding:12px;border-radius:8px}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:8px;border-bottom:1px solid #eee;font-size:13px;text-align:right}
    th{background:#f3f6fa}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h3>تشخيص صفحة Upgrade Windows</h3>
      <div id="status">جاري الفحص...</div>
    </div>

    <div class="card">
      <h3>أول 10 سجلات</h3>
      <table>
        <thead>
          <tr>
            <th>Branch ID</th>
            <th>Branch Name</th>
            <th>Brand</th>
            <th>City</th>
            <th>Region</th>
            <th>Employee</th>
            <th>Device</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const rowsEl = document.getElementById('rows');

    function show(msg, isError){
      statusEl.innerHTML = isError
        ? '<div class="err">' + msg + '</div>'
        : '<div class="ok">' + msg + '</div>';
    }

    window.addEventListener('error', function(e){
      show('JavaScript Error:\\n' + (e.message || 'Unknown error') + '\\nLine: ' + e.lineno + '\\nFile: ' + e.filename, true);
    });

    (function(){
      try {
        const parentWin = window.parent;
        if (!parentWin || parentWin === window) {
          show('الصفحة ليست داخل iframe تابع للنظام.', true);
          return;
        }

        const firebaseParent = parentWin.firebase;
        const auth = parentWin.appAuth;
        const db = parentWin.appDb;

        if (!firebaseParent) {
          show('window.parent.firebase غير موجود', true);
          return;
        }
        if (!auth) {
          show('window.parent.appAuth غير موجود', true);
          return;
        }
        if (!db) {
          show('window.parent.appDb غير موجود', true);
          return;
        }

        show('✅ تم العثور على Firebase و Auth و Firestore من الصفحة الأم. جاري فحص المستخدم...');

        const start = function(user){
          if (!user) {
            show('⚠️ لا يوجد مستخدم مسجل دخول داخل Firebase Auth.', true);
            return;
          }

          show('✅ المستخدم مسجل. جاري قراءة windows_upgrades ...');

          db.collection('windows_upgrades').limit(10).get()
            .then(function(snap){
              const docs = snap.docs.map(function(d){ return d.data(); });

              if (!docs.length) {
                show('✅ الاتصال ناجح، لكن Collection windows_upgrades فارغة حاليًا.');
                rowsEl.innerHTML = '<tr><td colspan="8">لا توجد سجلات</td></tr>';
                return;
              }

              show('✅ الاتصال ناجح وتم جلب ' + docs.length + ' سجلات (أول 10 فقط للتشخيص).');

              rowsEl.innerHTML = docs.map(function(r){
                return '<tr>' +
                  '<td>' + (r.branchId || '') + '</td>' +
                  '<td>' + (r.branchName || '') + '</td>' +
                  '<td>' + (r.brand || '') + '</td>' +
                  '<td>' + (r.city || '') + '</td>' +
                  '<td>' + (r.region || '') + '</td>' +
                  '<td>' + (r.employeeName || '') + '</td>' +
                  '<td>' + (r.deviceName || '') + '</td>' +
                  '<td>' + (r.status || '') + '</td>' +
                '</tr>';
              }).join('');
            })
            .catch(function(err){
              show('Firestore Error:\\n' + (err && err.message ? err.message : err), true);
            });
        };

        if (auth.currentUser) {
          start(auth.currentUser);
        } else {
          firebaseParent.auth().onAuthStateChanged(function(user){
            start(user);
          });
        }

      } catch (err) {
        show('Catch Error:\\n' + (err && err.message ? err.message : err), true);
      }
    })();
  </script>
</body>
</html>
