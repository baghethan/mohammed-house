<!DOCTYPE html>
<html lang="ar" dir="rtl" id="report-html">
<head>
    <meta charset="UTF-8">
    <title>تقرير ترقية الأنظمة — شركة المجدوعي للسيارات</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --bg: #f4f7f9; }
        body { margin: 0; padding: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #e2e8f0; transition: 0.3s; }
        
        /* ورقة التقرير */
        .report-paper { 
            max-width: 1100px; margin: auto; background: white; padding: 50px; 
            border-radius: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); 
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); padding-bottom: 25px; margin-bottom: 35px; }
        .logo-img { height: 65px; }
        .title-box h1 { margin: 0; font-size: 26px; color: var(--primary); font-weight: 800; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: #fff; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid #f1f5f9; }
        .stat-card h2 { font-size: 55px; margin: 10px 0; color: var(--primary); }

        .item { background: #f8fafc; border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #edf2f7; }
        .progress-container { width: 100%; background: #e2e8f0; height: 8px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--success); border-radius: 10px; }

        /* الأزرار العائمة (لن تظهر في الصورة المنسوخة) */
        .floating-controls { position: fixed; bottom: 30px; left: 30px; display: flex; flex-direction: column; gap: 12px; z-index: 1000; }
        .btn { 
            border: none; padding: 14px 22px; border-radius: 50px; cursor: pointer; 
            font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 10px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.15); transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-back { background: #475569; color: white; } /* زر الرجوع */
        .btn-lang { background: var(--primary); color: white; }
        .btn-copy { background: var(--success); color: white; }

        [dir="ltr"] .header { flex-direction: row-reverse; }
        [dir="ltr"] .title-box { text-align: left; }
    </style>
</head>
<body>

<div class="floating-controls">
    <button class="btn btn-back" onclick="window.location.href='upgrade-windows.html'">
        <i class="fas fa-arrow-right"></i> <span data-i18n="btn_back">العودة للوحة التحكم</span>
    </button>
    <button class="btn btn-lang" onclick="toggleLanguage()">
        <i class="fas fa-language"></i> <span id="lang-text">English</span>
    </button>
    <button class="btn btn-copy" onclick="copyReportImage()">
        <i class="fas fa-camera"></i> <span data-i18n="btn_capture">نسخ التقرير للإيميل</span>
    </button>
</div>

<div class="report-paper" id="report-content">
    <div class="header">
        <div style="display:flex; align-items:center; gap:20px;">
            <img src="LOGO-almajdouie.png" alt="Logo" class="logo-img">
            <div class="title-box">
                <h1 data-i18n="comp_name">شركة المجدوعي للسيارات</h1>
                <p data-i18n="sys_name">نظام متابعة ترقية الأنظمة - Upgrade Windows Management</p>
            </div>
        </div>
        <div style="text-align: left; font-size: 12px; color: #94a3b8;">
            <span data-i18n="date_lbl">تاريخ التقرير</span>: <span id="report-date"></span><br>
            <span id="user-status" style="color:var(--primary)">جاري المزامنة...</span>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card"><span data-i18n="stat_total">إجمالي الأجهزة</span><h2 id="v-total">0</h2></div>
        <div class="stat-card" style="border-color:var(--warning)"><span data-i18n="stat_remain">متبقي (Planned)</span><h2 id="v-remain" style="color:var(--warning)">0</h2></div>
        <div class="stat-card" style="border-color:var(--success)"><span data-i18n="stat_done">مكتمل (Completed)</span><h2 id="v-done" style="color:var(--success)">0</h2></div>
    </div>

    <div class="grid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
        <div class="list-card"><h4><i class="fas fa-map-marker-alt"></i> <span data-i18n="sec_reg">المناطق</span></h4><div id="list-reg"></div></div>
        <div class="list-card"><h4><i class="fas fa-city"></i> <span data-i18n="sec_city">المدن</span></h4><div id="list-city"></div></div>
        <div class="list-card"><h4><i class="fas fa-car"></i> <span data-i18n="sec_brand">البراندات</span></h4><div id="list-brand"></div></div>
    </div>
</div>

<script>
    const i18n = {
        ar: { comp_name: "شركة المجدوعي للسيارات", sys_name: "نظام متابعة ترقية الأنظمة", stat_total: "إجمالي الأجهزة", stat_remain: "متبقي", stat_done: "مكتمل", btn_back: "العودة للوحة التحكم", btn_capture: "نسخ التقرير للإيميل", sec_reg: "المناطق", sec_city: "المدن", sec_brand: "البراندات", date_lbl: "التاريخ", t: "إجمالي", r: "باقي", d: "تم" },
        en: { comp_name: "Almajdouie Motors Co.", sys_name: "Systems Upgrade Management", stat_total: "Total Devices", stat_remain: "Remain", stat_done: "Done", btn_back: "Back to Control Center", btn_capture: "Copy Image for Email", sec_reg: "Regions", sec_city: "Cities", sec_brand: "Brands", date_lbl: "Date", t: "Total", r: "Remain", d: "Done" }
    };

    let currentLang = 'ar';
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('user-status').innerText = "متصل: " + user.email;
            startSync();
        } else { window.location.href = "login.html"; }
    });

    function startSync() {
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const sums = { region: {}, city: {}, brand: {} };
            snapshot.forEach(doc => {
                const d = doc.data();
                let c = parseInt(d.devicesCount || 1);
                let s = String(d.status || '').toLowerCase().trim();
                total += c; if(s === 'completed') done += c;
                ['region', 'city', 'brand'].forEach(k => {
                    let val = d[k] || 'N/A';
                    if(!sums[k][val]) sums[k][val] = { t:0, d:0 };
                    sums[k][val].t += c; if(s === 'completed') sums[k][val].d += c;
                });
            });
            document.getElementById('v-total').innerText = total;
            document.getElementById('v-done').innerText = done;
            document.getElementById('v-remain').innerText = total - done;
            renderAll(sums);
        });
    }

    function renderAll(sums) {
        const lang = i18n[currentLang];
        const draw = (id, data) => {
            const el = document.getElementById(id); el.innerHTML = '';
            Object.entries(data).sort((a,b)=>b[1].t - a[1].t).forEach(([name, v]) => {
                let p = Math.round((v.d/v.t)*100) || 0;
                el.innerHTML += `<div class="item">
                    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:13px;"><span>${name}</span><span>${p}%</span></div>
                    <div class="progress-container"><div class="progress-bar" style="width:${p}%"></div></div>
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; text-align:center; font-size:10px;">
                        <div style="background:white; border-radius:5px; padding:3px;">${lang.t}: ${v.t}</div>
                        <div style="background:white; border-radius:5px; padding:3px; color:orange;">${lang.r}: ${v.t-v.d}</div>
                        <div style="background:white; border-radius:5px; padding:3px; color:green;">${lang.d}: ${v.d}</div>
                    </div></div>`;
            });
        };
        draw('list-reg', sums.region); draw('list-city', sums.city); draw('list-brand', sums.brand);
    }

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const d = i18n[currentLang];
        document.getElementById('report-html').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('lang-text').innerText = currentLang === 'ar' ? 'English' : 'العربية';
        document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = d[el.getAttribute('data-i18n')]; });
        startSync();
    }

    async function copyReportImage() {
        const btn = document.querySelector('.btn-copy');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النسخ...';
        const canvas = await html2canvas(document.getElementById('report-content'), { scale: 2, backgroundColor: "#ffffff" });
        canvas.toBlob(blob => {
            navigator.clipboard.write([new ClipboardItem({"image/png": blob})]).then(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ!';
                setTimeout(() => btn.innerHTML = '<i class="fas fa-camera"></i> ' + i18n[currentLang].btn_capture, 2000);
            });
        });
    }

    document.getElementById('report-date').innerText = new Date().toLocaleDateString('ar-SA');
</script>
</body>
</html>
