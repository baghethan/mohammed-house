<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Windows Management v2.1.8</title>
    <style>
        :root { --primary: #0d4b73; --dark: #0d2149; --bg: #edf3f8; --success: #22c55e; --border: rgba(15,23,42,0.1); }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: transparent; margin: 0; padding: 15px; color: #1e293b; }
        
        /* الهيدر والملخص السريع */
        .header-title { font-size: 14px; font-weight: 900; color: #fff; background: var(--primary); padding: 5px 15px; border-radius: 8px; display: inline-block; margin-bottom: 15px; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1.5fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 15px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stat-val { font-size: 24px; font-weight: 900; color: var(--primary); display: block; }
        .stat-label { font-size: 11px; color: #64748b; font-weight: 700; }

        /* صندوق الأجهزة الجاهزة للإغلاق */
        .ready-box { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .ready-title { font-size: 12px; font-weight: 800; color: #92400e; text-align: center; }
        .ready-list { background: #fff; border: 1px solid #ddd; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; }
        .btn-complete-all { background: var(--success); color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 12px; }

        /* تخطيط القسمين */
        .main-layout { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        .card { background: #fff; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; }
        .card-header { background: var(--primary); color: #fff; padding: 10px 20px; font-weight: 800; font-size: 13px; }

        /* سجلات الأجهزة (الجدول) */
        .search-bar { padding: 10px 20px; background: #f8fafc; border-bottom: 1px solid var(--border); }
        .search-bar input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .table-scroll { max-height: 500px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #f8fafc; padding: 10px; position: sticky; top: 0; border-bottom: 2px solid var(--border); }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: center; }
        .status-planned { color: #f59e0b; font-weight: bold; }
        .status-completed { color: var(--success); font-weight: bold; }

        /* بيانات الجهاز (النموذج) */
        .form-content { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 11px; font-weight: 700; color: #64748b; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .btn-group { grid-column: span 2; display: flex; gap: 10px; margin-top: 10px; }
        .btn-save { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; flex: 1; }
        .btn-refresh { background: #f1f5f9; color: var(--dark); border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-title">ملخص سريع Upgrade Windows</div>

    <div class="summary-grid">
        <div class="stat-card">
            <span class="stat-label">إجمالي الأجهزة</span>
            <span class="stat-val" id="totalDevices">87</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">قيد التنفيذ</span>
            <span class="stat-val" id="inProgress">83</span>
        </div>
        <div class="stat-card">
            <span class="stat-label">مكتملة</span>
            <span class="stat-val" id="completedCount">4</span>
        </div>
        <div class="ready-box">
            <div class="ready-title">أجهزة جاهزة للإغلاق</div>
            <div class="ready-list">لا توجد أجهزة جاهزة للإغلاق حالياً</div>
            <button class="btn-complete-all">نقل المختار لمكتمل</button>
        </div>
    </div>

    <div class="main-layout">
        <!-- بيانات الجهاز -->
        <div class="card">
            <div class="card-header">بيانات الجهاز</div>
            <div class="form-content">
                <div class="form-group"><label>الفرع</label>
                    <select><option>اختر الفرع</option></select>
                </div>
                <div class="form-group"><label>Brand</label>
                    <select><option>اختر البراند</option></select>
                </div>
                <div class="form-group"><label>اسم الموظف</label><input type="text" placeholder="اسم الموظف"></div>
                <div class="form-group"><label>Employee ID</label><input type="text" placeholder="رقم الموظف"></div>
                <div class="form-group" style="grid-column: span 2;"><label>الحالة</label>
                    <select><option>Planned</option><option>Completed</option></select>
                </div>
                <div class="btn-group">
                    <button class="btn-save">حفظ التغييرات</button>
                    <button class="btn-refresh">تحديث البيانات</button>
                </div>
            </div>
        </div>

        <!-- سجلات الأجهزة -->
        <div class="card">
            <div class="card-header">سجلات الأجهزة</div>
            <div class="search-bar"><input type="text" placeholder="بحث باسم الموظف أو الجهاز..."></div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr><th>إجراء</th><th>Status</th><th>Device</th><th>Employee</th><th>Branch</th></tr>
                    </thead>
                    <tbody id="deviceTableBody">
                        <!-- بيانات تجريبية مطابقة للصورة -->
                        <tr><td><button style="font-size:10px;">تعديل</button></td><td class="status-planned">planned</td><td>-</td><td>-</td><td>-</td></tr>
                        <tr><td><button style="font-size:10px;">تعديل</button></td><td class="status-planned">planned</td><td>-</td><td>-</td><td>-</td></tr>
                        <tr><td><button style="font-size:10px;">تعديل</button></td><td class="status-planned">planned</td><td>-</td><td>-</td><td>-</td></tr>
                        <tr><td><button style="font-size:10px;">تعديل</button></td><td class="status-completed">completed</td><td>MMSM-HSA-1</td><td>-</td><td>-</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // سيتم ربط Firebase هنا لجلب البيانات الحقيقية من Firestore
    </script>
</body>
</html>
