<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upgrade Windows</title>

<style>
:root{
  --primary:#0d4b73;
  --green:#2f9e66;
  --danger:#d64545;
  --border:#d7e0ea;
  --bg:#edf3f8;
  --card:#fff;
  --shadow:0 10px 30px rgba(18,48,74,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:var(--bg)}
.hidden{display:none!important}

/* ✅ iframe safe */
body.embedded-shell header,
body.embedded-shell .tabs,
body.embedded-shell #loginOverlay{
  display:none!important;
}
body.embedded-shell .container{
  max-width:1600px;
  margin:0 auto;
  padding:12px;
}

header{
  background:var(--primary);
  color:#fff;
  padding:14px 18px;
}
.container{max-width:1500px;margin:18px auto;padding:0 14px 28px}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:16px
}
.card h3{
  margin:-16px -16px 14px;
  padding:12px 16px;
  background:var(--primary);
  color:#fff;
  font-size:15px
}
</style>
</head>

<body>

<!-- ✅ لا يظهر داخل iframe -->
<div id="loginOverlay" class="hidden"></div>

<header>
  <h2>Upgrade Windows</h2>
</header>

<main class="container hidden" id="appRoot">

  <div class="card">
    <h3>ملخص Upgrade Windows</h3>
    <div id="summaryText">جاهز</div>
  </div>

</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth as _getAuth } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain: "baghethan-ba325.firebaseapp.com",
  projectId: "baghethan-ba325"
};

initializeApp(firebaseConfig);

/* ✅ iframe detection */
const embeddedIframe = (() => {
  try {
    return window.parent && window.parent !== window;
  } catch {
    return false;
  }
})();

if (embeddedIframe) {
  document.body.classList.add('embedded-shell');
}

/* ✅ use parent auth only */
function getParentAuth(){
  try{
    return window.parent.appAuth || null;
  }catch{
    return null;
  }
}

/* ✅ auth state */
function bootAuth(){
  const parentAuth = getParentAuth();

  if (embeddedIframe && parentAuth) {
    parentAuth.onAuthStateChanged(user=>{
      if(user){
        document.getElementById('appRoot').classList.remove('hidden');
      }else{
        document.getElementById('appRoot').classList.add('hidden');
      }
    });
  } else {
    // ❌ لا تسجيل دخول داخلي
    document.getElementById('appRoot').classList.add('hidden');
  }
}

bootAuth();
</script>

</body>
</html>
