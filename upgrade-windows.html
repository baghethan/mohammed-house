<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upgrade Windows</title>

  <style>
    :root{
      --primary:#0d4b73;
      --border:#d7e0ea;
      --bg:#edf3f8;
      --card:#ffffff;
      --shadow:0 10px 30px rgba(18,48,74,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Segoe UI,Tahoma,Arial,sans-serif;
      background:var(--bg);
      color:#163247;
    }
    .hidden{display:none!important}
    body.embedded-shell header{display:none}

    header{
      background:var(--primary);
      color:#fff;
      padding:14px 18px;
      font-size:20px;
      font-weight:bold;
    }

    .session-note{
      background:#fff7e6;
      border:1px solid #f5d08a;
      color:#8a5a00;
      border-radius:12px;
      padding:14px;
      margin:16px;
    }

    .container{
      max-width:1600px;
      margin:18px auto;
      padding:0 14px 30px;
    }

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:16px;
    }

    .card h3{
      margin:-16px -16px 14px;
      padding:12px 16px;
      background:var(--primary);
      color:#fff;
      font-size:14px;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(150px,1fr));
      gap:12px;
    }

    .stat{
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px;
    }
    .stat span{font-size:12px;color:#6e8192}
    .stat strong{font-size:28px;color:var(--primary)}

    .mini-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:12px;
    }

    .mini-card{
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      border-top:5px solid var(--primary);
    }

    .mini-title{font-weight:700;color:var(--primary);margin-bottom:8px}

    .brand-head{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .brand-logo{
      width:42px;height:42px;
      object-fit:contain;
      border-radius:8px;
      border:1px solid var(--border);
      background:#fff;
      padding:4px;
    }

    .brand-placeholder{
      width:42px;height:42px;
      border:1px dashed #cbd5e1;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#94a3b8;
    }

    .mini-stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .mini-pill{
      font-size:12px;
      padding:6px;
      border:1px solid var(--border);
      border-radius:10px;
    }

    .progress{
      height:10px;
      background:#e9f0f6;
      border-radius:999px;
      overflow:hidden;
      margin-top:8px;
    }

    .progress-fill{
      height:100%;
      background:var(--primary);
    }

    table{width:100%;border-collapse:collapse}
    th,td{
      padding:10px;
      border-bottom:1px solid #edf2f7;
      text-align:right;
      font-size:13px;
      white-space:nowrap;
    }
    th{background:#f8fbff;color:var(--primary)}

    .brand-cell{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .brand-cell img{
      width:26px;height:26px;
      object-fit:contain;
      border-radius:6px;
      border:1px solid var(--border);
      background:#fff;
      padding:3px;
    }
    .brand-cell .no-logo{
      width:26px;height:26px;
      border-radius:6px;
      border:1px dashed #cbd5e1;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:10px;
      color:#94a3b8;
    }
  </style>
</head>

<body class="embedded-shell">

<div id="sessionNotice" class="session-note hidden">
  الرجاء تسجيل الدخول من الصفحة الرئيسية أولًا.
</div>

<header>Upgrade Windows</header>

<main id="appRoot" class="container hidden">

  <div class="card">
    <h3>ملخص</h3>
    <div class="summary-grid">
      <div class="stat"><span>الإجمالي</span><br><strong id="statTotal">0</strong></div>
      <div class="stat"><span>مكتمل</span><br><strong id="statCompleted">0</strong></div>
      <div class="stat"><span>قيد التنفيذ</span><br><strong id="statProgress">0</strong></div>
      <div class="stat"><span>الأجهزة</span><br><strong id="statDevices">0</strong></div>
    </div>
  </div>

  <div class="card"><h3>بطاقات المناطق</h3><div id="regionsGrid" class="mini-grid"></div></div>
  <div class="card"><h3>بطاقات المدن</h3><div id="citiesGrid" class="mini-grid"></div></div>
  <div class="card"><h3>بطاقات البراندات</h3><div id="brandsGrid" class="mini-grid"></div></div>

  <div class="card">
    <h3>السجلات</h3>
    <table>
      <thead>
        <tr>
          <th>Branch ID</th>
          <th>Branch</th>
          <th>Brand</th>
          <th>City</th>
          <th>Region</th>
          <th>Employee</th>
          <th>Device</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="uwTableBody"></tbody>
    </table>
  </div>

</main>

<script>
const firebaseParent = window.parent.firebase;
const auth = window.parent.appAuth;
const db = window.parent.appDb;
const $ = id=>document.getElementById(id);

if(!firebaseParent||!auth||!db){$('sessionNotice').classList.remove('hidden');throw 1;}

let brandIndex={};
db.collection("brand_assets").onSnapshot(s=>{
  brandIndex={};
  s.docs.forEach(d=>{
    const b=d.data();
    const k=(b.brand||b.name||'').toLowerCase().trim();
    if(k)brandIndex[k]=b;
  });
});

function getBrandLogo(name){
  const a=brandIndex[(name||'').toLowerCase().trim()];
  if(!a)return'';
  const l=a.logoUrl||a.logo||'';
  if(l.startsWith('http'))return l;
  if(l.length>100)return'data:image/png;base64,'+l;
  return'';
}

function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function buildMiniCards(rows,key,isBrand){
  const map={};
  rows.forEach(r=>{
    const k=(r[key]||'').trim();
    if(!k)return;
    map[k]=map[k]||{c:0,p:0};
    String(r.status).toLowerCase()==='completed'?map[k].c++:map[k].p++;
  });
  return Object.entries(map).map(([k,v])=>{
    const t=v.c+v.p,p=t?Math.round(v.c/t*100):0,logo=isBrand?getBrandLogo(k):'';
    return `<div class="mini-card">
      ${isBrand?`<div class="brand-head">
        ${logo?`<img src="${logo}" class="brand-logoder">—</div>`}
        <div class="mini-title">${esc(k)}</div>
      </div>`:`<div class="mini-title">${esc(k)}</div>`}
      <div class="mini-stats">
        <div class="mini-pill">مكتمل: <b>${v.c}</b></div>
        <div class="mini-pill">قيد التنفيذ: <b>${v.p}</b></div>
      </div>
      <div class="progress"><div class="progress-fill" style="width:${p}%"></div></div>
      <div style="font-size:11px;margin-top:4px">${p}%</div>
    </div>`;
  }).join('');
}

auth.currentUser&&start();
firebaseParent.auth().onAuthStateChanged(u=>u?start():0);

function start(){
  $('sessionNotice').classList.add('hidden');
  $('appRoot').classList.remove('hidden');
  db.collection("windows_upgrades").onSnapshot(s=>{
    const rows=s.docs.map(d=>d.data());
    $('statTotal').textContent=rows.length;
    $('statCompleted').textContent=rows.filter(r=>r.status==='completed').length;
    $('statProgress').textContent=rows.filter(r=>r.status!=='completed').length;
    $('statDevices').textContent=rows.reduce((a,b)=>a+(+b.devicesCount||1),0);
    $('regionsGrid').innerHTML=buildMiniCards(rows,'region');
    $('citiesGrid').innerHTML=buildMiniCards(rows,'city');
    $('brandsGrid').innerHTML=buildMiniCards(rows,'brand',true);
    $('uwTableBody').innerHTML=rows.map(r=>{
      const logo=getBrandLogo(r.brand);
      return `<tr>
        <td>${esc(r.branchId)}</td>
        <td>${esc(r.branchName)}</td>
        <td><div class="brand-cell">
          ${logo?`${logo}`:`<div class="no-logo">—</div>`}
          <span>${esc(r.brand)}</span>
        </div></td>
        <td>${esc(r.city)}</td>
        <td>${esc(r.region)}</td>
        <td>${esc(r.employeeName)}</td>
        <td>${esc(r.deviceName)}</td>
        <td>${esc(r.status)}</td>
      </tr>`;
    }).join('');
  });
}
</script>

</body>
</html>
``
