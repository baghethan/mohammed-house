<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>upgrade-windows - Integrated</title>
  <style>
    :root{
      --primary:#0d4b73; --primary-2:#0a3b5a; --green:#2f9e66; --danger:#d64545; --warning:#c47f00;
      --border:#d7e0ea; --text:#163247; --muted:#6e8192; --bg:#edf3f8; --card:#fff; --shadow:0 10px 30px rgba(18,48,74,.08); --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:var(--text);background:var(--bg)}
    .hidden{display:none!important}.rtl-en{display:inline-block;direction:ltr;unicode-bidi:embed}
    
    /* تعديل: إخفاء الهيدر تماماً عند العمل داخل النظام الموحد */
    header { display: none !important; }
    
    .container{max-width:1500px; margin:0 auto; padding: 10px 14px 28px;} /* تعديل: تقليل الهوامش العلوية */
    
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .tab-btn,.btn{border:1px solid var(--border);border-radius:999px;padding:10px 16px;background:#fff;color:var(--primary);font-weight:700;cursor:pointer}
    .tab-btn.active,.btn.primary{background:var(--primary);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.warning{background:var(--warning);border-color:var(--warning);color:#fff}
    .btn.small{padding:7px 11px;font-size:12px}
    .panel{display:none}.panel.active{display:block}
    .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}.grid-4{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px}
    .card,.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:16px;overflow:hidden}.card h3{margin:-16px -16px 14px;padding:12px 16px;background:var(--primary);color:#fff;font-size:15px}.stat{padding:16px}.stat .label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.stat .value{font-size:30px;font-weight:800;color:var(--primary)}
    .stats{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:14px;margin-bottom:18px}
    .field{display:grid;gap:8px}.field label{font-size:14px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;background:#fbfcfe}.field textarea{min-height:96px;resize:vertical}.field input[readonly]{background:#f2f6fa}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.note{background:#f6fbff;border:1px dashed #bfd7e8;color:#33546b;border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.7}
    .alert{padding:10px 12px;border-radius:12px;margin-top:10px}.alert.error{background:#ffecec;border:1px solid #f3b0b0;color:#8a1f1f}.alert.ok{background:#eaf9f0;border:1px solid #bce3c9;color:#20643b}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:#fff} table{width:100%;border-collapse:collapse} th,td{padding:12px 10px;border-bottom:1px solid #edf2f7;text-align:right;white-space:nowrap;font-size:14px;vertical-align:top} th{background:#f8fbff;color:var(--primary)} tr.clickable{cursor:pointer}
    .list{display:grid;gap:10px;max-height:520px;overflow:auto}.item{background:#fcfdff;border:1px solid var(--border);border-radius:14px;padding:12px}.item strong{display:block;color:var(--primary);margin-bottom:6px}.item small{display:block;color:var(--muted);line-height:1.55}
    .section-title{margin:18px 0 10px;font-weight:800;color:var(--primary);font-size:16px;border-inline-start:4px solid var(--primary);padding-inline-start:10px}
    .overlay{position:fixed;inset:0;background:rgba(13,75,115,.18);display:flex;align-items:center;justify-content:center;padding:16px}.login-card{width:min(760px,96vw);background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.15);overflow:hidden}.login-head{background:var(--primary);color:#fff;padding:16px 20px;font-size:18px;font-weight:800}.login-body{padding:18px}
    
    /* تعديل: إخفاء الملاحظة المستقلة لأنها تشوه التصميم داخل Iframe */
    .standalone-note { display: none !important; }

    .upgrade-summary-board{display:grid;gap:16px;margin-bottom:16px}
    .upgrade-summary-top{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px}
    .upgrade-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .upgrade-meta-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
    .upgrade-meta-card h4{margin:0 0 12px;color:var(--primary);font-size:16px}
    .upgrade-mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .upgrade-mini-card{border:1px solid var(--border);border-top:5px solid var(--primary);border-radius:14px;padding:12px;background:#fbfdff;box-shadow:0 6px 18px rgba(18,48,74,.05)}
    .upgrade-mini-title{font-weight:800;color:var(--primary);margin-bottom:10px;font-size:14px;word-break:break-word}
    .upgrade-mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .upgrade-mini-pill{border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:#fff}
    .upgrade-mini-pill .label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
    .upgrade-mini-pill .value{display:block;font-size:18px;font-weight:800;color:var(--primary)}
    .upgrade-progress-row{display:grid;gap:6px}
    .upgrade-progress-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
    .upgrade-progress-track{height:10px;background:#e9f0f6;border-radius:999px;overflow:hidden}
    .upgrade-progress-fill{height:100%;border-radius:999px;transition:width .25s ease}
    
    @media (max-width:1200px){.grid-2,.grid-3,.grid-4,.stats,.brand-grid,.upgrade-summary-top,.upgrade-meta-grid{grid-template-columns:1fr}}

/* إخفاء التبويبات الأخرى في وضع الترقية فقط لضمان النظافة */
body.upgrade-only .tabs { display:none !important; }
body.upgrade-only .panel:not(#upgradeWindows) { display:none !important; }
body.upgrade-only #upgradeWindows { display:block !important; }

</style>
</head>
<body class="upgrade-only">
  <div class="overlay hidden" id="loginOverlay">
    <div class="login-card">
      <div class="login-head" data-i18n="loginTitle">تسجيل الدخول / Sign In</div>
      <div class="login-body">
        <div class="grid-3" style="margin-top:14px">
          <div class="field"><label data-i18n="emailLabel">البريد الإلكتروني</label><input id="loginEmail" type="email"></div>
          <div class="field"><label data-i18n="passwordLabel">كلمة المرور</label><input id="loginPassword" type="password"></div>
          <div class="field"><label>&nbsp;</label><button class="btn green" id="loginBtn" type="button" data-i18n="loginBtn">Login</button></div>
        </div>
      </div>
    </div>
  </div>

  <main class="container" id="appRoot">
    <div class="tabs hidden">
      <button class="tab-btn active" data-tab="upgradeWindows">Upgrade Windows</button>
    </div>

    <section id="upgradeWindows" class="panel active">
        <div class="card" style="margin-bottom:16px">
          <h3>ملخص سريع Upgrade Windows</h3>
          <div class="upgrade-summary-board">
            <div class="upgrade-summary-top">
              <div class="stat"><span class="label">إجمالي السجلات</span><div class="value" id="upgradeWindowsStatTotal">0</div></div>
              <div class="stat"><span class="label">إجمالي الأجهزة</span><div class="value" id="upgradeWindowsStatDevices">0</div></div>
              <div class="stat"><span class="label">قيد التنفيذ</span><div class="value" id="upgradeWindowsStatInProgress">0</div></div>
              <div class="stat"><span class="label">مكتمل</span><div class="value" id="upgradeWindowsStatCompleted">0</div></div>
            </div>
            <div class="upgrade-meta-grid">
              <div class="upgrade-meta-card">
                <h4>بطاقات المناطق</h4>
                <div class="upgrade-mini-grid" id="upgradeWindowsRegionsGrid"></div>
              </div>
              <div class="upgrade-meta-card">
                <h4>بطاقات المدن</h4>
                <div class="upgrade-mini-grid" id="upgradeWindowsCitiesGrid"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3>إدخال بيانات Upgrade Windows</h3>
            <input type="hidden" id="uwEditingId">
            <div class="grid-4">
              <div class="field"><label>الفرع</label><select id="uwBranchSelect"></select></div>
              <div class="field"><label>الموظف في الفرع؟</label><select id="uwEmployeeInBranch"><option value="yes">Yes</option><option value="no">No</option></select></div>
              <div class="field"><label>Branch_ID</label><input id="uwBranchId" readonly></div>
              <div class="field"><label>Brand</label><select id="uwBrandSelect"></select></div>
              <div class="field"><label>اسم الموظف</label><input id="uwEmployeeName"></div>
              <div class="field"><label>Employee ID</label><input id="uwEmployeeId"></div>
              <div class="field"><label>Device Name</label><input id="uwDeviceName"></div>
              <div class="field"><label>الحالة</label><select id="uwStatus"><option value="planned">Planned</option><option value="in progress">In Progress</option><option value="completed">Completed</option></select></div>
              <div class="field" style="grid-column:1/-1"><label>ملاحظات</label><textarea id="uwNotes"></textarea></div>
            </div>
            <div class="actions">
              <button class="btn green" id="saveUWBtn">حفظ السجل</button>
              <button class="btn" id="clearUWBtn">تنظيف</button>
            </div>
            <div class="grid-3" style="margin-top:15px">
              <button class="btn warning" id="importUWBtn">رفع Excel</button>
              <button class="btn" id="exportUWBtn">تنزيل Excel</button>
              <button class="btn green" id="syncUWFromChecklistBtn">مزامنة من Check-List</button>
            </div>
            <div id="uwError" class="alert error hidden"></div>
          </div>
          <div class="card">
            <h3>سجلات الأجهزة المرفوعة</h3>
            <div class="field" style="margin-bottom:12px"><input id="uwSearch" placeholder="ابحث عن موظف أو جهاز..."></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Branch ID</th><th>Brand</th><th>City</th><th>Employee ID</th><th>Employee</th><th>Device</th><th>Status</th><th>إجراء</th></tr>
                    </thead>
                    <tbody id="uwTableBody"></tbody>
                </table>
            </div>
          </div>
        </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, query, orderBy, onSnapshot, Timestamp, where, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs',
      authDomain:'baghethan-ba325.firebaseapp.com',
      projectId:'baghethan-ba325',
      storageBucket:'baghethan-ba325.firebasestorage.app',
      messagingSenderId:'944819735112',
      appId:'1:944819735112:web:07315600da39377320667d'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const state = { branches:[], technicians:[], brands:[], windowsUpgrades:[], currentLang:'ar' };

    const $ = id => document.getElementById(id);

    // دالة تطبيق اللغة (محدثة لتعمل مع Master)
    function applyLanguage(lang){
      state.currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      // تحديث النصوص بناءً على لغة الأب
    }

    // قراءة اللغة من رابط الصفحة (Master Sync)
    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get('lang');
    if(urlLang) applyLanguage(urlLang);

    // استماع لقاعدة البيانات (Upgrade Windows فقط)
    function listenWindowsUpgrades(){ 
      onSnapshot(query(collection(db,'windows_upgrades')), snap=>{ 
        state.windowsUpgrades = snap.docs.map(d=>({id:d.id, ...d.data()})); 
        renderUpgradeWindowsTable(); 
      }); 
    }

    // جلب الفروع والبراندات لملء القوائم المنسدلة
    async function loadData() {
        const bSnap = await getDocs(collection(db, 'branches'));
        state.branches = bSnap.docs.map(d => ({id: d.id, ...d.data()}));
        const brSnap = await getDocs(collection(db, 'brand_assets'));
        state.brands = brSnap.docs.map(d => ({id: d.id, ...d.data()}));
        populateSelectors();
    }

    function populateSelectors() {
        const bOpts = state.branches.map(b => `<option value="${b.id}">${b.branchName || b.id}</option>`);
        if($('uwBranchSelect')) $('uwBranchSelect').innerHTML = '<option value="">اختر الفرع</option>' + bOpts.join('');
        
        const brOpts = state.brands.map(b => `<option value="${b.nameEn || b.brand}">${b.nameAr || b.brand}</option>`);
        if($('uwBrandSelect')) $('uwBrandSelect').innerHTML = '<option value="">اختر البراند</option>' + brOpts.join('');
    }

    function renderUpgradeWindowsTable(){
      const q = ($('uwSearch')?.value || '').toLowerCase();
      const rows = state.windowsUpgrades.filter(r => !q || [r.branchId, r.employeeName, r.deviceName].some(v => String(v||'').toLowerCase().includes(q)));
      $('uwTableBody').innerHTML = rows.map(r => `
        <tr>
            <td>${r.branchId || '-'}</td>
            <td>${r.brand || '-'}</td>
            <td>${r.city || '-'}</td>
            <td>${r.employeeId || '-'}</td>
            <td>${r.employeeName || '-'}</td>
            <td>${r.deviceName || '-'}</td>
            <td><span class="badge">${r.status || 'planned'}</span></td>
            <td><button class="btn small" onclick="editUW('${r.id}')">تعديل</button></td>
        </tr>`).join('');
      updateSummary();
    }

    function updateSummary() {
        $('upgradeWindowsStatTotal').textContent = state.windowsUpgrades.length;
        $('upgradeWindowsStatDevices').textContent = state.windowsUpgrades.length;
        $('upgradeWindowsStatCompleted').textContent = state.windowsUpgrades.filter(r => r.status === 'completed').length;
    }

    onAuthStateChanged(auth, user => {
      if(user){
        $('loginOverlay').classList.add('hidden');
        loadData();
        listenWindowsUpgrades();
      } else {
          // في حال لم يكن هناك جلسة، الأب سيقوم بالتوجيه أو عرض الدخول
      }
    });

  </script>
</body>
</html>
