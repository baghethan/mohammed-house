<!DOCTYPE html>
<!-- الإصدار v2.1.18 - إضافة الوحدة الرابعة: مستودع الأجهزة الشامل (87+ جهاز) -->
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMC IT | Upgrade Windows v2.1.18</title>
    <style>
        :root { 
            --primary: #0d4b73; --dark: #0d2149; --success: #28a745; 
            --warning: #c28100; --danger: #dc3545; --border: rgba(0,0,0,0.1); 
        }
        body { font-family: 'Segoe UI', sans-serif; background: transparent; margin: 0; padding: 15px; color: #1e293b; font-size: 12px; }
        
        /* 1. Summary Dashboard */
        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 12px; border-radius: 10px; border: 1px solid var(--border); text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .stat-val { font-size: 20px; font-weight: 900; color: var(--primary); display: block; }

        /* Layout Grid */
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; height: 100%; }
        .card-header { background: var(--dark); color: #fff; padding: 10px; font-weight: 800; font-size: 13px; text-align: center; }

        /* 2. Device Operations Hub */
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 11px; font-weight: 800; }
        .field input, .field select { padding: 7px; border: 1px solid #ddd; border-radius: 6px; }

        /* 4. Master Device Inventory (Full Width) */
        .inventory-card { grid-column: span 2; margin-top: 10px; }
        .inventory-scroll { max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 10px; border-bottom: 2px solid #eee; position: sticky; top: 0; z-index: 10; }
        td { padding: 8px; border-bottom: 1px solid #f1f5f9; text-align: center; }

        /* Buttons */
        .btn-green { background: var(--success); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; }
        .btn-orange { background: var(--warning); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 800; cursor: pointer; }
        .btn-white { background: #fff; color: var(--primary); border: 1px solid #ddd; padding: 8px; border-radius: 6px; font-weight: 800; cursor: pointer; }
        
        .badge { padding: 2px 6px; border-radius: 4px; font-weight: 800; font-size: 10px; }
        .bg-success { background: #dcfce7; color: #166534; }
        .bg-pending { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <!-- 1. Summary Dashboard -->
    <div class="summary-grid">
        <div class="stat-card"><span class="stat-label">Total Fleet</span><span class="stat-val" id="totalFleet">87</span></div>
        <div class="stat-card"><span class="stat-label">Pending</span><span class="stat-val" style="color:var(--danger)">15</span></div>
        <div class="stat-card"><span class="stat-label">In-Progress</span><span class="stat-val" style="color:var(--warning)">68</span></div>
        <div class="stat-card"><span class="stat-label">Completed</span><span class="stat-val" style="color:var(--success)">4</span></div>
    </div>

    <div class="main-layout">
        <!-- 2. Device Operations Hub -->
        <div class="card">
            <div class="card-header">Device Operations Hub (Input & Excel)</div>
            <div class="form-grid">
                <div class="field"><label>Branch</label><select id="fBranch"><option>MMC-HSA</option></select></div>
                <div class="field"><label>Status</label><select id="fStatus"><option>Planned</option><option>Completed</option></select></div>
                <div class="field"><label>Employee Name</label><input type="text" id="fName"></div>
                <div class="field"><label>Employee ID</label><input type="text" id="fID"></div>
                <button class="btn-green" style="grid-column: span 2; background: var(--dark);" onclick="saveEntry()">Save Entry</button>
            </div>
            <div style="padding: 15px; border-top: 1px solid #eee; background: #f8fafc;">
                <input type="file" style="margin-bottom: 10px; width: 100%;">
                <div style="display:flex; gap:10px;">
                    <button class="btn-orange" style="flex:2">Upload & Clear Old Data</button>
                    <button class="btn-white" style="flex:1">Download Excel</button>
                </div>
            </div>
        </div>

        <!-- 3. Logs & Action Center -->
        <div class="card">
            <div class="card-header">Activity Logs & Recent Actions</div>
            <div style="padding: 10px;"><input type="text" placeholder="Search logs..." style="width:100%; padding:8px; border:1px solid #ddd; border-radius:8px;"></div>
            <div class="inventory-scroll" style="max-height: 250px;">
                <table>
                    <thead><tr><th>Employee</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="logsBody">
                        <tr><td>M. Hassan</td><td><span class="badge bg-success">Completed</span></td><td><button onclick="editItem()">Edit</button></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 4. Master Device Inventory (All 87+ Devices) -->
        <div class="card inventory-card">
            <div class="card-header">Master Device Inventory (Full Fleet Database)</div>
            <div style="padding: 10px; background: #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
                <input type="text" id="masterSearch" onkeyup="searchMaster()" placeholder="Search all 87 devices by Name, ID, or Branch..." style="width: 70%; padding: 8px; border: 1px solid #ddd; border-radius: 8px;">
                <span style="font-weight: 800; color: var(--primary);">Total Records: <span id="masterCounter">87</span></span>
            </div>
            <div class="inventory-scroll">
                <table id="masterTable">
                    <thead>
                        <tr><th>Device SN</th><th>Employee</th><th>Branch</th><th>Brand</th><th>Status</th><th>Last Update</th></tr>
                    </thead>
                    <tbody id="masterBody">
                        <!-- سيتم توليد الـ 87 جهازاً هنا آلياً لضمان الأداء -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // دالة توليد كافة الأجهزة (87) في المستودع الشامل
        function initInventory() {
            const body = document.getElementById('masterBody');
            let rows = '';
            for(let i=1; i<=87; i++) {
                rows += `
                <tr>
                    <td>MMSM-HSA-${i}</td>
                    <td>Employee Name ${i}</td>
                    <td>MMC-Branch</td>
                    <td>HP EliteBook</td>
                    <td><span class="badge ${i <= 4 ? 'bg-success' : 'bg-pending'}">${i <= 4 ? 'Completed' : 'Pending'}</span></td>
                    <td>2026-04-30</td>
                </tr>`;
            }
            body.innerHTML = rows;
            document.getElementById('masterCounter').innerText = "87";
        }

        function searchMaster() {
            let filter = document.getElementById('masterSearch').value.toUpperCase();
            let tr = document.getElementById("masterBody").getElementsByTagName("tr");
            for (let i = 0; i < tr.length; i++) {
                let text = tr[i].textContent || tr[i].innerText;
                tr[i].style.display = text.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }

        function saveEntry() { alert("Data Saved to Master Inventory"); }
        window.onload = initInventory;
    </script>
</body>
</html>
