<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Windows 11 Upgrade Tracking</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #0d4b73; --bg: #f8fafc; --card: #ffffff; }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); padding: 20px; color: #334155; }
    
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; border: 1px solid #e2e8f0; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg); padding-bottom: 15px; margin-bottom: 20px; }
    h2 { color: var(--primary); margin: 0; font-weight: 900; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 800; margin-bottom: 8px; font-size: 14px; }
    select, input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; box-sizing: border-box; }
    
    .emp-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 15px; }
    .emp-input { border: 1px solid var(--primary); background: #f0f7ff; }

    button { 
      background: var(--primary); color: #fff; border: none; padding: 12px 30px; 
      border-radius: 8px; cursor: pointer; font-weight: 900; width: 100%; font-size: 16px; 
      transition: 0.3s; margin-top: 10px;
    }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; background: #10b981; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h2 id="t-title">ترقية ويندوز 11 | Windows 11 Upgrade</h2>
      <div id="status" class="status-badge">متصل بالمحرك ✅</div>
    </div>

    <form id="upgradeForm">
      <div class="form-group">
        <label id="t-question">هل تم ترقية أجهزة الفرع؟</label>
        <select id="isUpgraded" onchange="toggleInputs()">
          <option value="no">لا / No</option>
          <option value="yes">نعم / Yes</option>
        </select>
      </div>

      <div id="extraInputs" style="display: none;">
        <div class="form-group">
          <label id="t-count">كم عدد الأجهزة التي تمت ترقيتها؟</label>
          <input type="number" id="deviceCount" min="1" placeholder="مثلاً: 5" oninput="generateEmpFields()">
        </div>
        
        <div id="empNumbersContainer">
            <label id="t-emp-label">أدخل الأرقام الوظيفية للأجهزة:</label>
            <div class="emp-list" id="empList"></div>
        </div>
      </div>

      <button type="submit" id="t-save">حفظ البيانات | Save Data</button>
    </form>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  let state = { lang: 'ar' };

  // 1. استعارة المحرك من الصفحة الرئيسية (السر هنا!)
  const db = window.parent.appDb;
  const auth = window.parent.appAuth;

  function boot() {
    if (!db) {
        console.warn("في انتظار المحرك الرئيسي...");
        setTimeout(boot, 500);
        return;
    }
    applyLanguage(window.parent.currentLang || 'ar');
  }

  // 2. مزامنة اللغة مع الصفحة الرئيسية
  const i18n = {
    ar: { title: "ترقية ويندوز 11", question: "هل تم ترقية أجهزة الفرع؟", count: "عدد الأجهزة المرتقاة", save: "حفظ البيانات", emp: "الأرقام الوظيفية" },
    en: { title: "Windows 11 Upgrade", question: "Have the branch devices been upgraded?", count: "Number of upgraded devices", save: "Save Data", emp: "Employee IDs" }
  };

  function applyLanguage(lang) {
    state.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    const d = i18n[lang];
    $('t-title').innerText = d.title;
    $('t-question').innerText = d.question;
    $('t-count').innerText = d.count;
    $('t-save').innerText = d.save;
    $('t-emp-label').innerText = d.emp;
  }

  window.addEventListener('message', e => {
    if (e.data.type === 'LANG_CHANGE') applyLanguage(e.data.lang);
  });

  // 3. منطق النموذج (Logic)
  window.toggleInputs = () => {
    const isYes = $('isUpgraded').value === 'yes';
    $('extraInputs').style.display = isYes ? 'block' : 'none';
  };

  window.generateEmpFields = () => {
    const count = parseInt($('deviceCount').value) || 0;
    const container = $('empList');
    container.innerHTML = '';
    for (let i = 1; i <= count; i++) {
        container.innerHTML += `<input type="text" class="emp-input" placeholder="ID ${i}" required>`;
    }
  };

  $('upgradeForm').onsubmit = async (e) => {
    e.preventDefault();
    const empIds = Array.from(document.querySelectorAll('.emp-input')).map(input => input.value);
    
    try {
      await db.collection('windows_upgrades').add({
        isUpgraded: $('isUpgraded').value,
        deviceCount: $('deviceCount').value || 0,
        employeeIds: empIds,
        timestamp: new Date(),
        userEmail: auth.currentUser.email
      });
      alert(state.lang === 'ar' ? "تم الحفظ بنجاح!" : "Saved Successfully!");
      $('upgradeForm').reset();
      toggleInputs();
    } catch (err) {
      alert("Error: " + err.message);
    }
  };

  boot();
})();
</script>
</body>
</html>
