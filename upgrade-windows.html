<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upgrade Windows</title>

  <style>
    :root{
      --primary:#0d4b73;
      --border:#d7e0ea;
      --bg:#edf3f8;
      --card:#ffffff;
      --text:#163247;
      --muted:#6e8192;
      --shadow:0 10px 30px rgba(18,48,74,.08);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Segoe UI,Tahoma,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .hidden{display:none!important}

    body.embedded-shell header{display:none!important}

    header{
      background:var(--primary);
      color:#fff;
      padding:14px 18px;
      box-shadow:var(--shadow);
    }
    .title{font-size:22px;font-weight:800}

    .session-note{
      background:#fff7e6;
      border:1px solid #f5d08a;
      color:#8a5a00;
      border-radius:12px;
      padding:12px 14px;
      margin:18px;
    }

    .container{
      max-width:1600px;
      margin:18px auto;
      padding:0 14px 28px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:16px;
    }

    .card h3{
      margin:-16px -16px 14px;
      padding:12px 16px;
      background:var(--primary);
      color:#fff;
      font-size:15px;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(180px,1fr));
      gap:14px;
    }

    .stat{
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px;
    }
    .stat .label{font-size:13px;color:var(--muted)}
    .stat .value{font-size:32px;font-weight:800;color:var(--primary)}

    table{width:100%;border-collapse:collapse}
    th,td{
      padding:12px 10px;
      border-bottom:1px solid #edf2f7;
      text-align:right;
      font-size:14px;
      white-space:nowrap;
    }
    th{background:#f8fbff;color:var(--primary)}

    @media (max-width:1200px){
      .summary-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body class="embedded-shell">

<div id="sessionNotice" class="session-note hidden">
  الرجاء تسجيل الدخول من الصفحة الرئيسية أولًا، ثم افتح الصفحة من داخل النظام.
</div>

<header>
  <div class="title">Upgrade Windows</div>
</header>

<main id="appRoot" class="container hidden">

  <div class="card">
    <h3>ملخص Upgrade Windows</h3>
    <div class="summary-grid">
      <div class="stat"><span class="label">إجمالي السجلات</span><div class="value" id="statTotal">0</div></div>
      <div class="stat"><span class="label">مكتمل</span><div class="value" id="statCompleted">0</div></div>
      <div class="stat"><span class="label">قيد التنفيذ</span><div class="value" id="statProgress">0</div></div>
      <div class="stat"><span class="label">إجمالي الأجهزة</span><div class="value" id="statDevices">0</div></div>
    </div>
  </div>

  <div class="card">
    <h3>سجلات Upgrade Windows</h3>
    <table>
      <thead>
        <tr>
          <th>Branch ID</th>
          <th>Branch</th>
          <th>Brand</th>
          <th>City</th>
          <th>Region</th>
          <th>Employee</th>
          <th>Device</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="uwTableBody"></tbody>
    </table>
  </div>

</main>

<script>
/* =========================================================
   ✅ استخدام Firebase من الصفحة الأم (compat SDK)
   ========================================================= */

function getParentFirebase(){
  try { return window.parent.firebase || null; } catch(e){ return null; }
}
function getParentAuth(){
  try { return window.parent.appAuth || null; } catch(e){ return null; }
}
function getParentDb(){
  try { return window.parent.appDb || null; } catch(e){ return null; }
}

const firebaseParent = getParentFirebase();
const auth = getParentAuth();
const db   = getParentDb();

const $ = id => document.getElementById(id);

/* =========================================================
   ✅ أمان: لازم تكون داخل iframe ومع Firebase
   ========================================================= */
if (!firebaseParent || !auth || !db) {
  console.error("❌ Firebase غير متوفر");
  $('sessionNotice').classList.remove('hidden');
  throw new Error("Firebase not available");
}

/* =========================================================
   Helpers
   ========================================================= */
function esc(v){
  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

/* =========================================================
   Firestore Listener
   ========================================================= */
let unsubscribe = null;

function startListener(){
  if (unsubscribe) unsubscribe();

  unsubscribe = db.collection("windows_upgrades")
    .onSnapshot(snapshot=>{
      const rows = snapshot.docs.map(d=>d.data());

      $('statTotal').textContent = rows.length;

      let completed = 0, progress = 0, devices = 0;
      rows.forEach(r=>{
        devices += Number(r.devicesCount || 1);
        if (String(r.status).toLowerCase() === 'completed') completed++;
        else progress++;
      });

      $('statCompleted').textContent = completed;
      $('statProgress').textContent = progress;
      $('statDevices').textContent = devices;

      const body = $('uwTableBody');
      if (!rows.length){
        body.innerHTML = '<tr><td colspan="8">لا توجد سجلات</td></tr>';
        return;
      }

      body.innerHTML = rows.map(r=>`
        <tr>
          <td>${esc(r.branchId)}</td>
          <td>${esc(r.branchName)}</td>
          <td>${esc(r.brand)}</td>
          <td>${esc(r.city)}</td>
          <td>${esc(r.region)}</td>
          <td>${esc(r.employeeName)}</td>
          <td>${esc(r.deviceName)}</td>
          <td>${esc(r.status)}</td>
        </tr>
      `).join('');
    });
}

/* =========================================================
   ✅ Auth binding (حل مشكلة iframe)
   ========================================================= */
function showApp(user){
  if (!user){
    $('sessionNotice').classList.remove('hidden');
    $('appRoot').classList.add('hidden');
    return;
  }
  $('sessionNotice').classList.add('hidden');
  $('appRoot').classList.remove('hidden');
  startListener();
}

// ✅ فحص فوري
if (auth.currentUser) showApp(auth.currentUser);

// ✅ مراقبة الجلسة من Firebase الأب
firebaseParent.auth().onAuthStateChanged(user=>{
  showApp(user);
});
</script>

</body>
</html>
