<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MMC IT | Diagnostic Sync v2.9.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0d4b73; --success: #10b981; --danger: #ef4444; --bg: #edf3f8; --dark: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; }
        .status-header { background: var(--primary); color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid rgba(0,0,0,0.05); }
        .stat-val { font-size: 26px; font-weight: 900; color: var(--primary); display: block; }
        .main-container { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; }
        .card { background: #fff; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px; }
        .card-header { background: var(--dark); color: #fff; padding: 12px; font-weight: 800; text-align: center; }
        .btn-diag { background: #f59e0b; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-bulk { background: var(--success); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; }
        textarea { width: 100%; height: 60px; border-radius: 8px; border: 1px solid #cbd5e1; padding: 10px; font-size: 11px; resize: none; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .table-area { max-height: 450px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #f1f5f9; text-align: center; }
        th { background: #f8fbff; color: var(--primary); position: sticky; top: 0; z-index: 10; }
        .badge { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 10px; }
        .bg-planned { background: #dbeafe; color: #1e40af; }
        .bg-completed { background: #dcfce7; color: #166534; }
        .sync-log { background: #0f172a; color: #34d399; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 10px; height: 180px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="status-header">
        <span>نظام المزامنة والتشخيص (v2.9.0) - شركة المجدوعي للسيارات</span>
        <button onclick="exportToExcel()" style="background:#fff; color:var(--primary); border:none; padding:6px 15px; border-radius:6px; cursor:pointer; font-weight:bold;">تصدير Excel</button>
    </div>

    <div class="summary-grid">
        <div class="stat-card"><span>إجمالي الأجهزة</span><span class="stat-val" id="statTotal">0</span></div>
        <div class="stat-card"><span>قيد التنفيذ</span><span class="stat-val" id="statPlanned" style="color:var(--danger)">0</span></div>
        <div class="stat-card"><span>مكتمل (Completed)</span><span class="stat-val" id="statDone" style="color:var(--success)">0</span></div>
    </div>

    <div class="main-container">
        <section class="card">
            <div class="card-header">Master Inventory Status</div>
            <div class="table-area">
                <table>
                    <thead><tr><th>الجهاز</th><th>الموظف</th><th>الحالة</th></tr></thead>
                    <tbody id="masterBody"></tbody>
                </table>
            </div>
        </section>

        <section>
            <div class="card">
                <div class="card-header">أدوات الفحص والتشخيص</div>
                <div style="padding: 15px;">
                    <button class="btn-diag" id="btnDiag" onclick="runDiagnosticSync()">🛠️ تشغيل فحص تشخيصي عميق</button>
                    <p style="font-size:10px; color:#64748b; margin:10px 0;">هذا الإصدار خالي من الأخطاء البرمجية السابقة وسيظهر الأرقام فوراً.</p>
                    <textarea id="manualIds" placeholder="أدخل أرقام وظيفية يدوياً هنا..."></textarea>
                    <button class="btn-bulk" onclick="manualBulkUpdate()">تحديث يدوي ✅</button>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">سجل التشخيص (Diagnostic Log)</div>
                <div class="sync-log" id="syncLog">> بانتظار بدء التشخيص...</div>
            </div>
        </section>
    </div>

    <script>
        const db = window.parent.appDb;
        let fleetData = [];

        function forcePlainObject(data) {
            const parentObj = new window.parent.Object();
            for (const key in data) parentObj[key] = data[key];
            return parentObj;
        }

        function addLog(msg, color = "#34d399") {
            const log = document.getElementById('syncLog');
            log.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function init() {
            if (!db) {
                addLog("خطأ: لم يتم العثور على اتصال قاعدة البيانات.", "#f87171");
                return;
            }
            db.collection("windows_upgrades").onSnapshot(snap => {
                fleetData = snap.docs.map(d => ({id: d.id, ...d.data()}));
                updateDashboard();
                renderTable();
            });
        }

        async function runDiagnosticSync() {
            const btn = document.getElementById('btnDiag');
            btn.disabled = true;
            addLog("بدء الفحص التشخيصي الشامل...", "#fbbf24");
            
            try {
                const reports = await db.collection("branch_checklists").get();
                const batch = db.batch();
                let foundIds = new Set();
                let matches = 0;

                reports.forEach(doc => {
                    const answers = doc.data().dynamicAnswers || {};
                    Object.values(answers).forEach(val => {
                        const raw = String(val).split(/[\n,\s;]+/).map(s => s.trim()).filter(id => id.length > 2);
                        raw.forEach(id => foundIds.add(id));
                    });
                });

                const idsArray = Array.from(foundIds);
                addLog(`تم العثور على ${idsArray.length} رقم فريد في التقارير: (${idsArray.join(", ")})`, "#60a5fa");

                idsArray.forEach(empId => {
                    const target = fleetData.find(d => 
                        (String(d.employee_ID || d.employeeId || '').trim() === String(empId).trim()) && 
                        d.status === 'planned'
                    );

                    if (target) {
                        batch.update(db.collection("windows_upgrades").doc(target.id), forcePlainObject({
                            status: 'completed',
                            sync_date: new Date().toISOString()
                        }));
                        matches++;
                        addLog(`✅ تطابق: الموظف ${empId} مرتبط بالجهاز ${target.device_Name || target.id}`);
                    }
                });

                if (matches > 0) {
                    await batch.commit();
                    addLog(`تم تحديث ${matches} جهاز بنجاح!`, "#10b981");
                } else {
                    addLog("❌ لم يتم العثور على تطابق للأرقام في المستودع. تأكد من صحة الأرقام المدخلة من الفنيين.", "#f87171");
                }
            } catch (err) {
                addLog("خطأ: " + err.message, "#f87171");
            }
            btn.disabled = false;
        }

        async function manualBulkUpdate() {
            const input = document.getElementById('manualIds').value;
            if(!input.trim()) return;
            const ids = input.split(/[\n,\s;]+/).map(id => id.trim()).filter(id => id.length > 2);
            const batch = db.batch();
            let updated = 0;

            ids.forEach(empId => {
                const target = fleetData.find(d => String(d.employee_ID || d.employeeId || '').trim() === empId);
                if(target) {
                    batch.update(db.collection("windows_upgrades").doc(target.id), forcePlainObject({ status: 'completed' }));
                    updated++;
                }
            });

            if(updated > 0) { await batch.commit(); addLog(`تم تحديث ${updated} سجل يدوياً.`); document.getElementById('manualIds').value = ""; }
        }

        function updateDashboard() {
            document.getElementById('statTotal').innerText = fleetData.length;
            document.getElementById('statPlanned').innerText = fleetData.filter(d => d.status === 'planned').length;
            document.getElementById('statDone').innerText = fleetData.filter(d => d.status === 'completed').length;
        }

        function renderTable() {
            document.getElementById('masterBody').innerHTML = fleetData.slice(0, 50).map(d => `
                <tr><td><b>${d.device_Name || '-'}</b></td><td>${d.employee_ID || d.employeeId || '-'}</td>
                <td><span class="badge ${d.status==='completed'?'bg-completed':'bg-planned'}">${d.status}</span></td></tr>
            `).join('');
        }

        function exportToExcel() {
            const ws = XLSX.utils.json_to_sheet(fleetData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventory");
            XLSX.writeFile(wb, "MMC_Upgrade_Tracker.xlsx");
        }

        window.onload = init;
    </script>
</body>
</html>
