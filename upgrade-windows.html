<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MMC IT | Windows 11 Instant Sync v2.5.5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0d4b73; --success: #10b981; --danger: #ef4444; --bg: #edf3f8; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; font-size: 12px; }
        
        /* شريط الحالة الفورية */
        .live-status { background: var(--primary); color: #fff; padding: 10px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .dot { width: 10px; height: 10px; background: #34d399; border-radius: 50%; display: inline-block; animation: blink 1s infinite; margin-left: 8px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #fff; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-val { font-size: 24px; font-weight: 900; color: var(--primary); display: block; }

        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #f1f5f9; text-align: center; }
        th { background: #f8fbff; font-weight: 800; color: var(--primary); }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: 800; font-size: 10px; }
        .bg-planned { background: #dbeafe; color: #1e40af; }
        .bg-completed { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

    <div class="live-status">
        <span><span class="dot"></span> إصدار التحديث اللحظي (v2.5.5) نشط الآن</span>
        <button onclick="exportToExcel()" style="background:#fff; color:var(--primary); border:none; padding:6px 15px; border-radius:6px; cursor:pointer; font-weight:bold;">تصدير البيانات</button>
    </div>

    <div class="summary-grid">
        <div class="stat-card"><span>الإجمالي</span><span class="stat-val" id="statTotal">0</span></div>
        <div class="stat-card"><span>مخطط (Planned)</span><span class="stat-val" id="statPlanned" style="color:var(--danger)">0</span></div>
        <div class="stat-card"><span>مكتمل (Done)</span><span class="stat-val" id="statDone" style="color:var(--success)">0</span></div>
    </div>

    <div class="card">
        <div style="max-height: 500px; overflow-y: auto;">
            <table>
                <thead>
                    <tr><th>Device Name</th><th>Employee ID</th><th>Region</th><th>Status</th></tr>
                </thead>
                <tbody id="masterBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const db = window.parent.appDb;
        let fleetData = [];
        let isProcessing = false;

        // 1. مراقبة مستودع الأجهزة (Inventory) بشكل حي
        function startInventoryWatch() {
            db.collection("windows_upgrades").onSnapshot(snap => {
                fleetData = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderUI();
            });
        }

        // 2. مراقبة تقارير الـ Checklist "فورياً" وبدون تدخل يدوي
        function startAutoSync() {
            db.collection("branch_checklists").onSnapshot(async (snap) => {
                if (isProcessing) return;
                isProcessing = true;
                
                const batch = db.batch();
                let changesFound = false;

                snap.forEach(doc => {
                    const answers = doc.data().dynamicAnswers || {};
                    // فحص كل القيم داخل التقرير للبحث عن تطابق مع الأرقام الوظيفية
                    Object.values(answers).forEach(val => {
                        const ids = String(val).split(/[\n,]+/).map(s => s.trim()).filter(id => id.length > 3);
                        
                        ids.forEach(empId => {
                            // البحث عن الموظف في المستودع (بناءً على employee_ID كما في صورتك)
                            const target = fleetData.find(d => 
                                String(d.employee_ID || d.employeeId || '').trim() === empId && d.status === 'planned'
                            );
                            if (target) {
                                batch.update(db.collection("windows_upgrades").doc(target.id), {
                                    status: 'completed',
                                    sync_time: new Date().toISOString()
                                });
                                changesFound = true;
                            }
                        });
                    });
                });

                if (changesFound) {
                    await batch.commit();
                    console.log("تمت المزامنة الفورية بنجاح.");
                }
                isProcessing = false;
            });
        }

        function renderUI() {
            document.getElementById('statTotal').innerText = fleetData.length;
            document.getElementById('statPlanned').innerText = fleetData.filter(d => d.status === 'planned').length;
            document.getElementById('statDone').innerText = fleetData.filter(d => d.status === 'completed').length;
            
            document.getElementById('masterBody').innerHTML = fleetData.slice(0, 100).map(d => `
                <tr>
                    <td><b>${d.device_Name || d.id}</b></td>
                    <td>${d.employee_ID || '-'}</td>
                    <td>${d.region || '-'}</td>
                    <td><span class="badge ${d.status==='completed'?'bg-completed':'bg-planned'}">${d.status}</span></td>
                </tr>
            `).join('');
        }

        function exportToExcel() {
            const ws = XLSX.utils.json_to_sheet(fleetData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventory");
            XLSX.writeFile(wb, "MMC_Upgrade_Live_Report.xlsx");
        }

        window.onload = () => {
            if (!db) return;
            startInventoryWatch();
            startAutoSync(); // تفعيل التحديث التلقائي الفوري
        };
    </script>
</body>
</html>
