<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>upgrade-windows - Integrated v2.1.7</title>
  <style>
    :root{
      --primary:#0d4b73; --primary-2:#0a3b5a; --green:#2f9e66; --danger:#d64545; --warning:#c47f00;
      --border:#d7e0ea; --text:#163247; --muted:#6e8192; --bg:#edf3f8; --card:#fff; --shadow:0 10px 30px rgba(18,48,74,.08); --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:var(--text);background:var(--bg)}
    .hidden{display:none!important}
    
    header { display: none !important; }
    .container{max-width:1500px; margin:0 auto; padding: 10px 14px 28px;}
    
    .card,.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow); padding:16px; overflow:hidden;}
    .card h3{margin:-16px -16px 14px;padding:12px 16px;background:var(--primary);color:#fff;font-size:15px}
    
    .upgrade-summary-board{display:grid;gap:16px;margin-bottom:16px}
    .upgrade-summary-top{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}
    .stat .label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.stat .value{font-size:24px;font-weight:800;color:var(--primary)}
    
    /* تنسيق قائمة الإغلاق السريع */
    .quick-complete-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; margin-top: 10px; background: #fcfdfe; }
    .quick-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; gap: 10px; font-size: 13px; }
    .quick-item:last-child { border-bottom: none; }
    .quick-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .quick-info { flex: 1; }
    .quick-info strong { color: var(--primary); display: block; }
    .quick-info small { color: var(--muted); }

    .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .field label{display:block; font-size:13px; font-weight:700; margin-bottom:5px;}
    .field input, .field select, .field textarea {width:100%; border:1px solid var(--border); border-radius:10px; padding:8px 10px;}
    
    .btn{border:1px solid var(--border); border-radius:12px; padding:10px 16px; font-weight:700; cursor:pointer; transition: 0.2s;}
    .btn.green{background:var(--green); border-color:var(--green); color:#fff}
    .btn:hover { opacity: 0.9; }
    
    .table-wrap{overflow:auto; border:1px solid var(--border); border-radius:14px; background:#fff}
    table{width:100%; border-collapse:collapse} 
    th,td{padding:10px; border-bottom:1px solid #eee; text-align:right; font-size:13px;}
    th{background:#f8fbff; color:var(--primary)}
    
    @media (max-width:1000px){.grid-2,.grid-4,.upgrade-summary-top{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <main class="container" id="appRoot">
    <div class="card" style="margin-bottom:16px">
      <h3>ملخص سريع Upgrade Windows</h3>
      <div class="upgrade-summary-board">
        <div class="upgrade-summary-top">
          <div class="stat"><span class="label">إجمالي الأجهزة</span><div class="value" id="uwStatTotal">0</div></div>
          <div class="stat"><span class="label">قيد التنفيذ</span><div class="value" id="uwStatProgress">0</div></div>
          <div class="stat"><span class="label">مكتملة</span><div class="value" id="uwStatDone">0</div></div>
          <div class="stat" style="grid-column: span 1; background: #fffdf6; border: 1px solid #ffeeba;">
            <span class="label" style="color: #856404; font-weight: bold;">أجهزة جاهزة للإغلاق</span>
            <div id="quickCompleteContainer" class="quick-complete-list">
                <div class="note" style="padding:10px; font-size:11px;">سيظهر هنا الأجهزة التي تم فحصها ولم تكتمل.</div>
            </div>
            <button class="btn green" id="bulkCompleteBtn" style="width:100%; margin-top:8px; font-size:11px; padding:6px;" disabled>قفل المختار كمكتمل</button>
          </div>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>بيانات الجهاز</h3>
        <input type="hidden" id="uwEditingId">
        <div class="grid-4">
          <div class="field"><label>الفرع</label><select id="uwBranchSelect"></select></div>
          <div class="field"><label>Brand</label><select id="uwBrandSelect"></select></div>
          <div class="field"><label>اسم الموظف</label><input id="uwEmployeeName"></div>
          <div class="field"><label>Employee ID</label><input id="uwEmployeeId"></div>
          <div class="field"><label>الحالة</label><select id="uwStatus">
            <option value="planned">Planned</option>
            <option value="in progress">In Progress</option>
            <option value="completed">Completed</option>
          </select></div>
        </div>
        <div class="actions" style="margin-top:15px; display:flex; gap:10px;">
          <button class="btn green" id="saveUWBtn">حفظ التغييرات</button>
          <button class="btn" onclick="location.reload()">تحديث البيانات</button>
        </div>
        <div id="uwError" class="alert error hidden"></div>
      </div>

      <div class="card">
        <h3>سجلات الأجهزة</h3>
        <div class="field" style="margin-bottom:10px"><input id="uwSearch" placeholder="بحث..."></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Branch</th><th>Employee</th><th>Device</th><th>Status</th><th>إجراء</th></tr></thead>
            <tbody id="uwTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, doc, setDoc, onSnapshot, query, where, Timestamp, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs',
      authDomain:'baghethan-ba325.firebaseapp.com',
      projectId:'baghethan-ba325',
      storageBucket:'baghethan-ba325.firebasestorage.app',
      messagingSenderId:'944819735112',
      appId:'1:944819735112:web:07315600da39377320667d'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let allUpgrades = [];

    // قراءة اللغة من الماستر
    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'en';
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

    // الاستماع لبيانات الترقية
    onSnapshot(collection(db, 'windows_upgrades'), snap => {
        allUpgrades = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderUI();
    });

    function renderUI() {
        renderTable();
        renderSummary();
        renderQuickCompleteList();
    }

    function renderSummary() {
        document.getElementById('uwStatTotal').textContent = allUpgrades.length;
        document.getElementById('uwStatProgress').textContent = allUpgrades.filter(r => r.status !== 'completed').length;
        document.getElementById('uwStatDone').textContent = allUpgrades.filter(r => r.status === 'completed').length;
    }

    // عرض الأجهزة التي تم فحصها (لديها Checklist) ولم تكتمل بعد
    function renderQuickCompleteList() {
        const container = document.getElementById('quickCompleteContainer');
        // فلترة الأجهزة التي لديها تاريخ حفظ فحص ولكن حالتها ليست مكتملة
        const ready = allUpgrades.filter(r => r.checklistSavedDate && r.status !== 'completed');
        
        if(ready.length === 0) {
            container.innerHTML = '<div style="padding:10px; font-size:11px;">لا توجد أجهزة جاهزة للإغلاق حالياً.</div>';
            document.getElementById('bulkCompleteBtn').disabled = true;
            return;
        }

        container.innerHTML = ready.map(r => `
            <div class="quick-item">
                <input type="checkbox" class="bulk-check" value="${r.id}">
                <div class="quick-info">
                    <strong>${r.employeeName || 'موظف غير معروف'}</strong>
                    <small>${r.branchName || r.branchId} | فُحص في: ${r.checklistSavedDate}</small>
                </div>
            </div>
        `).join('');
        
        document.getElementById('bulkCompleteBtn').disabled = false;
    }

    // وظيفة الإغلاق الجماعي للأجهزة المختارة
    document.getElementById('bulkCompleteBtn').onclick = async () => {
        const selected = Array.from(document.querySelectorAll('.bulk-check:checked')).map(cb => cb.value);
        if(selected.length === 0) return;

        if(confirm(`هل أنت متأكد من قفل ${selected.length} أجهزة كمكتملة؟`)) {
            for(const id of selected) {
                await setDoc(doc(db, 'windows_upgrades', id), { status: 'completed', updatedAt: Timestamp.now() }, {merge:true});
            }
            alert('تم التحديث بنجاح');
        }
    };

    function renderTable() {
        const q = document.getElementById('uwSearch').value.toLowerCase();
        const rows = allUpgrades.filter(r => !q || (r.employeeName || '').toLowerCase().includes(q));
        document.getElementById('uwTableBody').innerHTML = rows.map(r => `
            <tr>
                <td>${r.branchId || '-'}</td>
                <td>${r.employeeName || '-'}</td>
                <td>${r.deviceName || '-'}</td>
                <td><span style="color:${r.status === 'completed' ? 'green' : 'orange'}">${r.status}</span></td>
                <td><button class="btn small" onclick="window.editUW('${r.id}')">تعديل</button></td>
            </tr>`).join('');
    }

    window.editUW = (id) => {
        const r = allUpgrades.find(x => x.id === id);
        if(!r) return;
        document.getElementById('uwEditingId').value = r.id;
        document.getElementById('uwEmployeeName').value = r.employeeName || '';
        document.getElementById('uwEmployeeId').value = r.employeeId || '';
        document.getElementById('uwStatus').value = r.status || 'planned';
        // التمرير لنموذج التعديل
        document.getElementById('uwEditingId').scrollIntoView();
    };

    document.getElementById('saveUWBtn').onclick = async () => {
        const id = document.getElementById('uwEditingId').value;
        if(!id) return alert('اختر جهازاً من الجدول أولاً');
        
        const payload = {
            employeeName: document.getElementById('uwEmployeeName').value,
            status: document.getElementById('uwStatus').value,
            updatedAt: Timestamp.now()
        };
        await setDoc(doc(db, 'windows_upgrades', id), payload, {merge:true});
        alert('تم الحفظ');
        document.getElementById('uwEditingId').value = '';
    };

    document.getElementById('uwSearch').oninput = renderTable;

    // تحميل البيانات المساعدة
    const bSnap = await getDocs(collection(db, 'branches'));
    document.getElementById('uwBranchSelect').innerHTML = '<option value="">اختر الفرع</option>' + bSnap.docs.map(d => `<option value="${d.id}">${d.data().branchName || d.id}</option>`).join('');

  </script>
</body>
</html>
