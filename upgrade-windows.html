<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Windows 11 Upgrade Management | v2.6.5</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #0d4b73; --bg: #f8fafc; --card: #ffffff; --success: #10b981; }
    
    body { 
      margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); 
      padding: 20px; padding-bottom: 50px; /* مساحة للفوتر */
    }
    
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; max-width: 1300px; margin: 0 auto; }
    
    .card { 
      background: var(--card); border-radius: 12px; border: 1px solid #e2e8f0; 
      padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column;
    }
    
    .card-header { 
      font-weight: 900; color: var(--primary); border-bottom: 2px solid var(--bg); 
      padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
    }

    /* تنسيق النموذج */
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 800; margin-bottom: 6px; font-size: 13px; color: #475569; }
    select, input { 
      width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; 
      font-family: inherit; font-size: 14px; box-sizing: border-box;
    }
    
    button { 
      background: var(--primary); color: #fff; border: none; padding: 14px; 
      border-radius: 8px; cursor: pointer; font-weight: 900; width: 100%; 
      margin-top: 10px; transition: 0.3s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }

    /* تنسيق الجدول */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f1f5f9; padding: 12px; text-align: right; color: var(--primary); font-weight: 900; }
    td { padding: 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    
    .badge { padding: 3px 10px; border-radius: 12px; color: #fff; font-size: 11px; font-weight: bold; }
    .emp-tag { 
      display: inline-block; background: #e0f2fe; color: #0369a1; 
      padding: 2px 8px; border-radius: 4px; margin: 2px; font-size: 11px; font-weight: bold;
    }

    /* شريط التحديث السفلي (Footer) */
    .update-footer {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; 
      border-top: 1px solid #e2e8f0; padding: 6px 25px; display: flex; 
      justify-content: space-between; align-items: center; font-size: 11px; 
      color: #64748b; font-weight: 700; z-index: 1000; box-sizing: border-box;
    }
    .status-dot { height: 8px; width: 8px; background: var(--success); border-radius: 50%; display: inline-block; margin-left: 6px; }
  </style>
</head>
<body>

<div class="grid">
  <aside class="card">
    <div class="card-header">
      <span id="t-form-title">إضافة تحديث جديد</span>
      <div style="font-size: 10px; background: #f1f5f9; padding: 2px 8px; border-radius: 5px;">FORM V2.6</div>
    </div>
    <form id="upgradeForm">
      <div class="form-group">
        <label id="t-q">هل تم ترقية أجهزة الفرع؟</label>
        <select id="isUpgraded" onchange="toggleInputs()">
          <option value="no">لا / No</option>
          <option value="yes">نعم / Yes</option>
        </select>
      </div>
      <div id="extraInputs" style="display: none;">
        <div class="form-group">
          <label id="t-cnt">عدد الأجهزة المرتقاة</label>
          <input type="number" id="deviceCount" min="1" placeholder="0" oninput="genFields()">
        </div>
        <div id="empList" style="display:grid; gap:8px; grid-template-columns: 1fr 1fr;"></div>
      </div>
      <button type="submit" id="t-btn">حفظ البيانات | Save Data</button>
    </form>
  </aside>

  <main class="card">
    <div class="card-header">
      <span id="t-list-title">سجل عمليات الترقية (Windows 11 History)</span>
      <div style="font-size: 12px; color: #64748b;">العمليات المسجلة: <b id="totalBadge" style="color:var(--primary)">0</b></div>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>المسؤول</th>
            <th>الحالة</th>
            <th>الأجهزة</th>
            <th>الأرقام الوظيفية</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr><td colspan="5" style="text-align:center; padding:50px; color:#94a3b8;">جاري جلب سجل البيانات...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<footer class="update-footer">
  <div>
    <span class="status-dot"></span>
    إصدار الصفحة: <b style="color:var(--primary)">v2.6.5 Turbo</b> 
    <span style="margin:0 10px; color:#e2e8f0;">|</span>
    آخر تحديث برمجيات: <b>2026-04-26</b>
  </div>
  <div>
    <span style="color:var(--success); margin-left:15px;">متصل بالمحرك الرئيسي ✅</span>
    الوقت: <b id="liveTime" style="color:var(--primary)">00:00:00</b>
  </div>
</footer>

<script>
(function(){
  const $ = id => document.getElementById(id);
  
  // استعارة المحرك
  const db = window.parent.appDb;
  const auth = window.parent.appAuth;

  function boot() {
    if (!db) { 
        console.log("Waiting for appDb..."); 
        setTimeout(boot, 500); 
        return; 
    }
    loadHistory();
    applyLang(window.parent.currentLang || 'ar');
  }

  // تحديث الساعة الحية
  setInterval(() => {
    $('liveTime').textContent = new Date().toLocaleTimeString('en-GB');
  }, 1000);

  // جلب البيانات التاريخية
  function loadHistory() {
    db.collection('windows_upgrades').orderBy('timestamp', 'desc').limit(20).onSnapshot(snap => {
      $('totalBadge').textContent = snap.size;
      if(snap.empty) {
        $('historyBody').innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">لا توجد بيانات مسجلة</td></tr>';
        return;
      }
      $('historyBody').innerHTML = snap.docs.map(doc => {
        const d = doc.data();
        const date = d.timestamp ? d.timestamp.toDate().toLocaleString('ar-EG', {dateStyle:'short', timeStyle:'short'}) : '-';
        const emps = (d.employeeIds || []).map(id => `<span class="emp-tag">${id}</span>`).join('');
        const statusColor = d.isUpgraded === 'yes' ? '#10b981' : '#ef4444';
        return `
          <tr>
            <td>${date}</td>
            <td style="font-weight:bold;">${d.userEmail ? d.userEmail.split('@')[0] : 'User'}</td>
            <td><span class="badge" style="background:${statusColor}">${d.isUpgraded.toUpperCase()}</span></td>
            <td style="text-align:center; font-weight:900;">${d.deviceCount || 0}</td>
            <td>${emps}</td>
          </tr>`;
      }).join('');
    });
  }

  window.toggleInputs = () => { $('extraInputs').style.display = ($('isUpgraded').value === 'yes') ? 'block' : 'none'; };
  
  window.genFields = () => {
    const c = parseInt($('deviceCount').value) || 0;
    $('empList').innerHTML = Array.from({length:c}).map((_,i)=> 
      `<input type="text" class="emp-in" placeholder="ID ${i+1}" required style="padding:8px; font-size:12px;">`
    ).join('');
  };

  $('upgradeForm').onsubmit = async (e) => {
    e.preventDefault();
    const emps = Array.from(document.querySelectorAll('.emp-in')).map(i => i.value);
    try {
      await db.collection('windows_upgrades').add({
        isUpgraded: $('isUpgraded').value,
        deviceCount: $('deviceCount').value || 0,
        employeeIds: emps,
        timestamp: new Date(),
        userEmail: auth.currentUser.email
      });
      $('upgradeForm').reset(); toggleInputs();
      alert(window.parent.currentLang === 'ar' ? "تم حفظ البيانات بنجاح" : "Data saved successfully");
    } catch (err) { alert("Error: " + err.message); }
  };

  function applyLang(l) {
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    const i = { 
      ar: {f:"إضافة تحديث جديد", l:"سجل عمليات الترقية", q:"هل تم الترقية؟", c:"عدد الأجهزة المرتقاة", b:"حفظ البيانات | Save"}, 
      en: {f:"Add New Update", l:"Upgrade History", q:"Is it upgraded?", c:"Device Count", b:"Save Data"} 
    };
    const d = i[l] || i.ar;
    $('t-form-title').innerText = d.f; $('t-list-title').innerText = d.l;
    $('t-q').innerText = d.q; $('t-cnt').innerText = d.c; $('t-btn').innerText = d.b;
  }

  boot();
})();
</script>
</body>
</html>
