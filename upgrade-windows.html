<!DOCTYPE html><!DOCTYPE الحقيقي -->
  <div id="appRoot" class="hidden">
    <div class="card">
      <h2>Iframe Safe Page ✅</h2>
      <p>هذه صفحة تعمل داخل iframe وتعتمد على الجلسة من الصفحة الأم.</p>

      <button class="btn" id="testBtn">اختبار الجلسة</button>
    </div>
  </div>

</div>

<script>
(function(){

  /* 1️⃣ تأكد أن الصفحة داخل iframe ولديها جلسة */
  if (!window.parent || window.parent === window ||
      !window.parent.appAuth ||
      !window.parent.appDb ||
      !window.parent.firebase) {

    document.getElementById('sessionNotice').classList.remove('hidden');
    document.getElementById('appRoot').classList.add('hidden');
    return;
  }

  /* 2️⃣ استخدم Firebase من الصفحة الأم */
  const auth = window.parent.appAuth;
  const db   = window.parent.appDb;

  const sessionNotice = document.getElementById('sessionNotice');
  const appRoot = document.getElementById('appRoot');

  /* 3️⃣ راقب حالة تسجيل الدخول */
  auth.onAuthStateChanged(user => {
    if (!user) {
      sessionNotice.classList.remove('hidden');
      appRoot.classList.add('hidden');
      return;
    }

    sessionNotice.classList.add('hidden');
    appRoot.classList.remove('hidden');

    // ✅ هنا منطق الصفحة الحقيقي
    console.log('Logged in as:', user.email);
  });

  /* مثال زر */
  document.getElementById('testBtn').addEventListener('click', () => {
    alert('Session OK ✅');
  });

})();
</script>

</body>
</html>
