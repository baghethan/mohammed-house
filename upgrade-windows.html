<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upgrade Windows</title>

  <!-- مكتبة Excel -->
  https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js</script>

  <style>
    :root{
      --primary:#0d4b73;
      --green:#2f9e66;
      --danger:#d64545;
      --warning:#c47f00;
      --border:#d7e0ea;
      --bg:#edf3f8;
      --card:#ffffff;
      --text:#163247;
      --muted:#6e8192;
      --shadow:0 10px 30px rgba(18,48,74,.08);
      --radius:16px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Segoe UI,Tahoma,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .hidden{display:none!important}

    /* iframe safe */
    body.embedded-shell header,
    body.embedded-shell #loginOverlay{
      display:none!important;
    }

    body.embedded-shell .container{
      max-width:1600px;
      margin:0 auto;
      padding:12px;
    }

    header{
      background:var(--primary);
      color:#fff;
      padding:14px 18px;
      box-shadow:var(--shadow);
    }

    .title{
      font-size:22px;
      font-weight:800;
    }

    .container{
      max-width:1600px;
      margin:18px auto;
      padding:0 14px 28px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      margin-bottom:16px;
    }

    .card h3{
      margin:-16px -16px 14px;
      padding:12px 16px;
      background:var(--primary);
      color:#fff;
      font-size:15px;
    }

    .grid-4{
      display:grid;
      grid-template-columns:repeat(4,minmax(180px,1fr));
      gap:14px;
    }

    .grid-3{
      display:grid;
      grid-template-columns:repeat(3,minmax(220px,1fr));
      gap:14px;
    }

    .field{
      display:grid;
      gap:6px;
    }

    .field label{
      font-size:13px;
      font-weight:700;
    }

    .field input,
    .field select,
    .field textarea{
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px;
      font:inherit;
      background:#fbfcfe;
      width:100%;
    }

    .field textarea{
      min-height:90px;
      resize:vertical;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .btn{
      border:1px solid var(--border);
      border-radius:999px;
      padding:10px 16px;
      background:#fff;
      color:var(--primary);
      font-weight:700;
      cursor:pointer;
    }

    .btn.green{
      background:var(--green);
      border-color:var(--green);
      color:#fff;
    }

    .btn.warning{
      background:var(--warning);
      border-color:var(--warning);
      color:#fff;
    }

    .btn.danger{
      background:var(--danger);
      border-color:var(--danger);
      color:#fff;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(180px,1fr));
      gap:14px;
      margin-bottom:16px;
    }

    .stat{
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      text-align:center;
    }

    .stat .label{
      font-size:13px;
      color:var(--muted);
      display:block;
      margin-bottom:6px;
    }

    .stat .value{
      font-size:28px;
      font-weight:800;
      color:var(--primary);
    }

    .meta-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
    }

    .meta-card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
    }

    .meta-card h4{
      margin:0 0 12px;
      color:var(--primary);
      font-size:15px;
    }

    .mini-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:12px;
    }

    .mini-card{
      border:1px solid var(--border);
      border-top:5px solid var(--primary);
      border-radius:14px;
      padding:12px;
      background:#fbfdff;
    }

    .mini-title{
      font-weight:800;
      color:var(--primary);
      margin-bottom:10px;
      font-size:14px;
      word-break:break-word;
    }

    .mini-stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:10px;
    }

    .mini-pill{
      border:1px solid var(--border);
      border-radius:12px;
      padding:8px 10px;
      background:#fff;
    }

    .mini-pill .label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:4px;
    }

    .mini-pill .value{
      display:block;
      font-size:18px;
      font-weight:800;
      color:var(--primary);
    }

    .progress-row{
      display:grid;
      gap:6px;
    }

    .progress-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      font-size:12px;
      color:var(--muted);
    }

    .progress-track{
      height:10px;
      background:#e9f0f6;
      border-radius:999px;
      overflow:hidden;
    }

    .progress-fill{
      height:100%;
      border-radius:999px;
      transition:width .25s ease;
    }

    .brand-head{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:10px;
    }

    .brand-logo,
    .brand-logo-placeholder{
      width:46px;
      height:46px;
      border-radius:12px;
      object-fit:cover;
      background:#fff;
      border:1px solid #dbe7f1;
    }

    .brand-logo-placeholder{
      display:flex;
      align-items:center;
      justify-content:center;
      color:#98a2b3;
      font-weight:700;
    }

    .table-wrap{
      overflow:auto;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th,td{
      padding:12px;
      border-bottom:1px solid #edf2f7;
      text-align:right;
      font-size:14px;
      white-space:nowrap;
    }

    th{
      background:#f8fbff;
      color:var(--primary);
    }

    .note{
      background:#f6fbff;
      border:1px dashed #bfd7e8;
      border-radius:12px;
      padding:10px;
      color:#33546b;
      margin-top:12px;
    }

    .alert{
      padding:10px;
      border-radius:12px;
      margin-top:10px;
    }

    .alert.error{
      background:#ffecec;
      border:1px solid #f3b0b0;
      color:#8a1f1f;
    }

    @media (max-width:1200px){
      .grid-4,
      .grid-3,
      .summary-grid,
      .meta-grid{
        grid-template-columns:1fr;
      }
      .mini-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
