<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upgrade Windows</title>

  <!-- Excel library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body{margin:0;font-family:Tahoma,Arial;background:#edf3f8}
    .hidden{display:none}
    .container{padding:16px}
    .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:16px}
    button{
      background:#0d4b73;color:#fff;border:none;border-radius:8px;
      padding:8px 14px;cursor:pointer;font-weight:bold;margin-left:8px
    }
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #eee;font-size:13px}
    th{background:#f3f6fa}
  </style>
</head>

<body>

<div class="container hidden" id="appRoot">

  <div class="card">
    <button id="exportBtn">⬇️ تصدير Excel</button>
    <button id="importBtn">⬆️ استيراد Excel</button>
    <input type="file" id="excelFile" accept=".xlsx" class="hidden">
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Branch ID</th>
          <th>Branch</th>
          <th>Brand</th>
          <th>City</th>
          <th>Region</th>
          <th>Employee</th>
          <th>Device</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<div id="notice" class="container">
  الرجاء تسجيل الدخول من النظام
</div>

<script>
/* ================= Firebase from parent ================= */
const firebaseParent = window.parent.firebase;
const auth = window.parent.appAuth;
const db = window.parent.appDb;

const appRoot = document.getElementById('appRoot');
const notice = document.getElementById('notice');
const tableBody = document.getElementById('tableBody');

let currentRows = [];

/* ================= Auth ================= */
if(auth.currentUser){ init(); }
firebaseParent.auth().onAuthStateChanged(u => u ? init() : 0);

function init(){
  notice.classList.add('hidden');
  appRoot.classList.remove('hidden');

  db.collection("windows_upgrades")
    .onSnapshot(snap=>{
      currentRows = snap.docs.map(d => d.data());
      renderTable(currentRows);
    });
}

/* ================= Render ================= */
function renderTable(rows){
  tableBody.innerHTML = rows.map(r=>`
    <tr>
      <td>${r.branchId||''}</td>
      <td>${r.branchName||''}</td>
      <td>${r.brand||''}</td>
      <td>${r.city||''}</td>
      <td>${r.region||''}</td>
      <td>${r.employeeName||''}</td>
      <td>${r.deviceName||''}</td>
      <td>${r.status||''}</td>
    </tr>
  `).join('');
}

/* ================= Export ================= */
document.getElementById('exportBtn').onclick = () => {
  if(!currentRows.length){ alert("لا توجد بيانات"); return; }

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(currentRows);
  XLSX.utils.book_append_sheet(wb, ws, "UpgradeWindows");
  XLSX.writeFile(wb, "Upgrade_Windows.xlsx");
};

/* ================= Import ================= */
document.getElementById('importBtn').onclick =
  () => document.getElementById('excelFile').click();

document.getElementById('excelFile').onchange = async (e)=>{
  if(!confirm("سيتم حذف كل البيانات القديمة. هل أنت متأكد؟")) return;

  const file = e.target.files[0];
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data);
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

  // ✅ حذف القديم
  const snap = await db.collection("windows_upgrades").get();
  const batch = db.batch();
  snap.docs.forEach(d => batch.delete(d.ref));
  await batch.commit();

  // ✅ رفع الجديد
  for(const r of rows){
    await db.collection("windows_upgrades").add(r);
  }

  alert("✅ تم الاستيراد بنجاح");
};
</script>

</body>
</html>
