<!DOCTYPE html>
<html lang="ar" dir="rtl" id="app-html">
<head>
    <meta charset="UTF-8">
    <title>Almajdouie Motors — Control Center V1.3.4</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --dark: #072d46; --success: #10b981; --warning: #f59e0b; --danger: #d64545; --bg: #f0f4f8; }
        body { margin: 0; display: flex; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #1e293b; height: 100vh; overflow: hidden; transition: 0.3s; }

        /* اتجاهات الصفحة */
        [dir="ltr"] { text-align: left; }
        [dir="rtl"] { text-align: right; }

        .sidebar { width: 260px; background: var(--dark); color: white; display: flex; flex-direction: column; transition: 0.3s; }
        .nav-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 15px; color: #cbd5e1; text-decoration: none; border-radius: 10px; margin: 5px 10px; }
        .nav-item.active { background: var(--primary); color: white; }

        .main-content { flex: 1; overflow-y: auto; padding: 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }

        /* زر اللغة */
        .lang-btn { background: white; color: var(--primary); border: 1px solid var(--primary); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .lang-btn:hover { background: var(--primary); color: white; }

        /* البطاقات */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; text-align: center; border-bottom: 5px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .admin-box { background: white; border-radius: 15px; overflow: hidden; margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 20px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: bold; color: #64748b; }
        input, select { padding: 9px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 12px; }

        table { width: 100%; border-collapse: collapse; min-width: 1400px; }
        th { background: #f8fafc; padding: 12px; color: var(--primary); font-size: 11px; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 11px; text-align: center; }
    </style>
</head>
<body>

<div class="sidebar">
    <div style="padding: 30px 20px; text-align: center;">
        <img src="LOGO-almajdouie.png" alt="Logo" style="width: 140px;">
    </div>
    <ul style="list-style: none; padding: 0;">
        <li class="nav-item active" id="nav-control"><i class="fas fa-tasks"></i> <span data-i18n="nav_control">إدارة البيانات</span></li>
        <a href="windows-report.html" class="nav-item"><i class="fas fa-print"></i> <span data-i18n="nav_print">صفحة التقارير</span></a>
        <li class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span data-i18n="nav_logout">خروج</span></li>
    </ul>
</div>

<div class="main-content">
    <div class="top-bar">
        <h2 id="page-title" data-i18n="page_title">لوحة التحكم المركزية</h2>
        <div style="display: flex; gap: 15px; align-items: center;">
            <button class="lang-btn" onclick="toggleLang()" id="langSwitcher">English</button>
            <div id="user-display" style="font-size: 12px; color: #64748b;">● ...</div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><span data-i18n="stat_total">إجمالي الأجهزة</span><h2 id="v-total">0</h2></div>
        <div class="stat-card" style="border-color:var(--warning)"><span data-i18n="stat_remain">متبقي</span><h2 id="v-remain" style="color:var(--warning)">0</h2></div>
        <div class="stat-card" style="border-color:var(--success)"><span data-i18n="stat_done">مكتمل</span><h2 id="v-done" style="color:var(--success)">0</h2></div>
    </div>

    <div class="admin-box">
        <div style="background:var(--primary); color:white; padding:12px 20px; font-weight:bold;">
            <i class="fas fa-edit"></i> <span id="form-header" data-i18n="form_add">إضافة سجل جديد</span>
        </div>
        <form id="mainForm">
            <div class="form-grid">
                <div class="field"><label data-i18n="lbl_branch_id">Branch ID</label><input type="text" id="in-branchId"></div>
                <div class="field"><label data-i18n="lbl_branch_name">Branch Name</label><input type="text" id="in-branchName"></div>
                <div class="field"><label data-i18n="lbl_brand">Brand</label><select id="in-brand"><option>Hyundai</option><option>Genesis</option><option>Changan</option></select></div>
                <div class="field"><label data-i18n="lbl_city">City</label><input type="text" id="in-city"></div>
                </div>
            <div style="padding: 15px 20px; border-top: 1px solid #eee; display: flex; gap: 10px;">
                <button type="button" style="background:var(--success); color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;" onclick="saveData()" data-i18n="btn_save">حفظ السجل</button>
                <button type="button" style="background:#e2e8f0; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;" onclick="clearForm()" data-i18n="btn_clear">تنظيف</button>
            </div>
        </form>
    </div>

    <div style="background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th data-i18n="th_bid">Branch ID</th><th data-i18n="th_name">Name</th><th data-i18n="th_brand">Brand</th><th data-i18n="th_status">Status</th><th data-i18n="th_action">Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // 1. نظام الترجمة (I18n System)
    const translations = {
        ar: {
            nav_control: "إدارة البيانات", nav_print: "صفحة التقارير", nav_logout: "خروج",
            page_title: "لوحة التحكم المركزية", lang_btn: "English",
            stat_total: "إجمالي الأجهزة", stat_remain: "متبقي", stat_done: "مكتمل",
            form_add: "إضافة سجل جديد", btn_save: "حفظ السجل", btn_clear: "تنظيف",
            lbl_branch_id: "رقم الفرع", lbl_branch_name: "اسم الفرع", lbl_brand: "البراند", lbl_city: "المدينة",
            th_bid: "رقم الفرع", th_name: "الاسم", th_brand: "البراند", th_status: "الحالة", th_action: "إجراء"
        },
        en: {
            nav_control: "Data Control", nav_print: "Report Page", nav_logout: "Logout",
            page_title: "Central Control Dashboard", lang_btn: "العربية",
            stat_total: "Total Devices", stat_remain: "Remaining", stat_done: "Completed",
            form_add: "Add New Record", btn_save: "Save Record", btn_clear: "Clear",
            lbl_branch_id: "Branch ID", lbl_branch_name: "Branch Name", lbl_brand: "Brand", lbl_city: "City",
            th_bid: "Branch ID", th_name: "Name", th_brand: "Brand", th_status: "Status", th_action: "Action"
        }
    };

    let currentLang = 'ar';

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const htmlTag = document.getElementById('app-html');
        htmlTag.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        htmlTag.lang = currentLang;

        // تحديث جميع العناصر التي تحمل الواصفة data-i18n
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.innerText = translations[currentLang][key];
        });

        document.getElementById('langSwitcher').innerText = translations[currentLang].lang_btn;
    }

    // 2. إعدادات Firebase والبيانات
    const firebaseConfig = { /* بياناتك هنا */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('user-display').innerText = "● " + user.email;
            startSync();
        } else { window.location.href = "login.html"; }
    });

    function startSync() {
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            snapshot.forEach(doc => {
                const d = doc.data();
                let c = parseInt(d.devicesCount || 1);
                total += c; if(String(d.status).toLowerCase().trim() === 'completed') done += c;

                tbody.innerHTML += `<tr>
                    <td>${d.branchId || '-'}</td><td>${d.branchName || '-'}</td><td>${d.brand || '-'}</td>
                    <td><b>${d.status || 'planned'}</b></td>
                    <td><i class="fas fa-trash" style="color:red;cursor:pointer" onclick="deleteDoc('${doc.id}')"></i></td>
                </tr>`;
            });
            document.getElementById('v-total').innerText = total;
            document.getElementById('v-done').innerText = done;
            document.getElementById('v-remain').innerText = total - done;
        });
    }

    async function saveData() { /* كود الحفظ المذكور سابقاً */ }
    function clearForm() { document.getElementById('mainForm').reset(); }
    function logout() { auth.signOut().then(() => window.location.href = "login.html"); }
</script>
</body>
</html>
