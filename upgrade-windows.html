<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Upgrade Windows</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --primary:#0d4b73;
      --border:#d7e0ea;
      --bg:#edf3f8;
      --card:#ffffff;
      --text:#163247;
      --muted:#6e8192;
      --shadow:0 10px 30px rgba(18,48,74,.08);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .hidden{display:none!important}

    body.embedded-shell header,
    body.embedded-shell #loginOverlay{display:none!important}

    header{background:var(--primary);color:#fff;padding:14px 18px;box-shadow:var(--shadow)}
    .title{font-size:22px;font-weight:800}

    .session-note{
      background:#fff7e6;border:1px solid #f5d08a;color:#8a5a00;
      border-radius:12px;padding:12px 14px;margin:18px;line-height:1.7
    }

    .container{max-width:1600px;margin:18px auto;padding:0 14px 28px}

    .card{
      background:var(--card);border:1px solid var(--border);
      border-radius:var(--radius);box-shadow:var(--shadow);
      padding:16px;margin-bottom:16px;overflow:hidden
    }

    .card h3{
      margin:-16px -16px 14px;padding:12px 16px;
      background:var(--primary);color:#fff;font-size:15px
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(180px,1fr));
      gap:14px;margin-bottom:16px
    }

    .stat{
      background:#fff;border:1px solid var(--border);
      border-radius:14px;padding:16px;
      box-shadow:0 6px 16px rgba(18,48,74,.05)
    }

    .stat .label{font-size:13px;color:var(--muted)}
    .stat .value{font-size:30px;font-weight:800;color:var(--primary)}

    .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

    .mini-card{
      border:1px solid var(--border);
      border-top:5px solid var(--primary);
      border-radius:14px;padding:12px;background:#fbfdff
    }

    .mini-title{font-weight:800;color:var(--primary);margin-bottom:10px}

    .mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}

    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{padding:12px;border-bottom:1px solid #edf2f7;text-align:right}
    th{background:#f8fbff;color:var(--primary)}

    @media (max-width:1200px){
      .summary-grid,.meta-grid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<div id="sessionNotice" class="session-note hidden">
  الرجاء تسجيل الدخول من الصفحة الرئيسية أولًا، ثم فتح الصفحة من داخل النظام.
</div>

<header>
  <div class="title" id="appTitle">Upgrade Windows</div>
</header>

<main class="container hidden" id="appRoot">

  <div class="card">
    <h3 id="summaryTitle">ملخص Upgrade Windows</h3>
    <div class="summary-grid">
      <div class="stat"><span id="statTotalLabel">إجمالي السجلات</span><div id="statTotal">0</div></div>
      <div class="stat"><span id="statDevicesLabel">إجمالي الأجهزة</span><div id="statDevices">0</div></div>
      <div class="stat"><span id="statProgressLabel">قيد التنفيذ</span><div id="statProgress">0</div></div>
      <div class="stat"><span id="statCompletedLabel">مكتمل</span><div id="statCompleted">0</div></div>
    </div>
  </div>

  <div class="card">
    <h3 id="tableTitle">سجلات Upgrade Windows</h3>
    <table>
      <thead>
        <tr>
          <th>Branch ID</th>
          <th>Branch Name</th>
          <th>Brand</th>
          <th>City</th>
          <th>Region</th>
          <th>Employee ID</th>
          <th>Employee</th>
          <th>Device</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="uwTableBody"></tbody>
    </table>
  </div>

</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "PUT_YOUR_KEY",
    authDomain: "PUT_YOUR_DOMAIN",
    projectId: "PUT_YOUR_PROJECT_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function escapeHtml(v){
    return String(v ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }

  onAuthStateChanged(auth, user => {
    if(!user){
      document.getElementById("sessionNotice").classList.remove("hidden");
      return;
    }

    document.getElementById("sessionNotice").classList.add("hidden");
    document.getElementById("appRoot").classList.remove("hidden");

    onSnapshot(collection(db,"windows_upgrades"), snap=>{
      const rows = snap.docs.map(d=>d.data());
      document.getElementById("statTotal").textContent = rows.length;
    });
  });
</script>

</body>
</html>
