<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upgrade Windows</title>

  <style>
    :root{
      --primary:#0d4b73;
      --green:#2f9e66;
      --danger:#d64545;
      --warning:#c47f00;
      --border:#d7e0ea;
      --text:#163247;
      --muted:#6e8192;
      --bg:#edf3f8;
      --card:#fff;
      --shadow:0 10px 30px rgba(18,48,74,.08);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .hidden{display:none!important}

    .session-note{
      background:#fff7e6;
      border:1px solid #f5d08a;
      color:#8a5a00;
      border-radius:12px;
      padding:12px 14px;
      margin:18px;
      line-height:1.7
    }

    header{background:var(--primary);color:#fff;padding:14px 18px}
    .container{max-width:1600px;margin:18px auto;padding:0 14px 28px}
    .card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
    .card h3{margin:-16px -16px 14px;padding:12px 16px;background:var(--primary);color:#fff;font-size:15px}

    .upgrade-meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .upgrade-mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .upgrade-mini-card{border:1px solid var(--border);border-top:5px solid var(--primary);border-radius:14px;padding:12px;background:#fbfdff}
    .upgrade-brand-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .upgrade-brand-logo,.upgrade-brand-logo-placeholder{
      width:46px;height:46px;border-radius:12px;object-fit:cover;
      background:#fff;border:1px solid #dbe7f1
    }
    .upgrade-brand-logo-placeholder{
      display:flex;align-items:center;justify-content:center;color:#999;font-weight:700
    }

    .embedded-shell header{display:none!important}
  </style>
</head>

<body>

<div id="sessionNotice" class="session-note hidden">
  الرجاء تسجيل الدخول من الصفحة الرئيسية أولًا، ثم افتح صفحة Upgrade Windows من داخل النظام.
</div>

<header>
  <h2>Upgrade Windows</h2>
</header>

<main class="container hidden" id="appRoot">

  <div class="card">
    <h3>ملخص Upgrade Windows</h3>

    <div class="upgrade-meta-grid">
      <div>
        <h4>المناطق</h4>
        <div id="upgradeWindowsRegionsGrid" class="upgrade-mini-grid"></div>
      </div>
      <div>
        <h4>المدن</h4>
        <div id="upgradeWindowsCitiesGrid" class="upgrade-mini-grid"></div>
      </div>
      <div>
        <h4>البراندات</h4>
        <div id="upgradeWindowsBrandsGrid" class="upgrade-mini-grid"></div>
      </div>
    </div>
  </div>

</main>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs',
    authDomain:'baghethan-ba325.firebaseapp.com',
    projectId:'baghethan-ba325'
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const embeddedIframe = (() => {
    try { return window.parent && window.parent !== window; }
    catch { return false; }
  })();

  if(embeddedIframe) document.body.classList.add('embedded-shell');

  function getShellAuth(){
    try{
      return window.parent?.appAuth || null;
    }catch{ return null }
  }

  function handleAuth(user){
    if(!user){
      document.getElementById('sessionNotice').classList.remove('hidden');
      document.getElementById('appRoot').classList.add('hidden');
      return;
    }
    document.getElementById('sessionNotice').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
  }

  function bootAuth(){
    if(embeddedIframe){
      let tries = 0;
      const t = setInterval(()=>{
        const shellAuth = getShellAuth();
        if(shellAuth){
          clearInterval(t);
          shellAuth.onAuthStateChanged(handleAuth);
        }
        if(++tries > 50){
          clearInterval(t);
          handleAuth(null);
        }
      },200);
    }else{
      onAuthStateChanged(auth, handleAuth);
    }
  }

  bootAuth();
</script>

</body>
</html>
