<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>visits.html - Branch Visits</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #edf3f8;
      font-family: Segoe UI, Tahoma, Arial, sans-serif;
    }
    .hidden { display: none !important; }
    .session-note {
      background:#fff7e6;
      border:1px solid #f5d08a;
      color:#8a5a00;
      border-radius:12px;
      padding:12px 14px;
      margin:18px;
      line-height:1.7;
    }
    #appRoot {
      width: 100%;
      height: 100vh;
    }
    #innerFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: block;
    }
  </style>
</head>
<body>
  <div id="sessionNotice" class="session-note hidden">الرجاء تسجيل الدخول من الصفحة الرئيسية أولًا، ثم افتح صفحة الزيارات من داخل النظام.</div>

  <div id="appRoot" class="hidden">
    <iframe id="innerFrame" src="visits_iframe_safe1.html"></iframe>
  </div>

  <script>
  (function(){
    function $(id){ return document.getElementById(id); }

    function showSessionOnly(){
      $('sessionNotice').classList.remove('hidden');
      $('appRoot').classList.add('hidden');
    }

    function showApp(){
      $('sessionNotice').classList.add('hidden');
      $('appRoot').classList.remove('hidden');
    }

    function forwardShellObjects(){
      if (!window.parent || window.parent === window) return false;
      if (!window.parent.appAuth || !window.parent.appDb || !window.parent.firebase) return false;
      window.appAuth = window.parent.appAuth;
      window.appDb = window.parent.appDb;
      window.firebase = window.parent.firebase;
      return true;
    }

    function injectHideTopbarStyle(){
      var frame = $('innerFrame');
      if (!frame) return;
      try {
        var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
        if (!doc) return;

        var style = doc.getElementById('hide-topbar-style');
        if (!style) {
          style = doc.createElement('style');
          style.id = 'hide-topbar-style';
          style.textContent = [
            '.lang-wrap{display:none !important;}',
            '.lang-wrap .lang-btn{display:none !important;}',
            '.lang-wrap .badge{display:none !important;}'
          ].join('\n');
          doc.head.appendChild(style);
        }
      } catch (e) {
        console.error('Unable to inject CSS into visits iframe:', e);
      }
    }

    function boot(){
      if (!forwardShellObjects()) {
        showSessionOnly();
        return;
      }

      showApp();

      var auth = window.parent.appAuth;
      var frame = $('innerFrame');
      if (frame) {
        frame.addEventListener('load', function(){
          injectHideTopbarStyle();
        });
      }

      auth.onAuthStateChanged(function(user){
        if (!user) {
          showSessionOnly();
          return;
        }
        showApp();
        injectHideTopbarStyle();
      });
    }

    boot();
  })();
  </script>
</body>
</html>
