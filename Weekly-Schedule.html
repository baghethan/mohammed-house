<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Schedule v1.1.3 - Almajdouie Motors</title>
  <style>
    :root {
      --primary: #0d2149; --primary2: #1b4fa3;
      --morning-bg: #eff6ff; --morning-t: #1e40af; --morning-b: #dbeafe;
      --night-bg: #f5f3ff; --night-t: #5b21b6; --night-b: #ede9fe;
      --vacation-bg: #fff1f2; --vacation-t: #9f1239; --vacation-b: #ffe4e6;
      --oncall-bg: #f0f9ff; --oncall-t: #075985; --oncall-b: #e0f2fe;
      --work-bg: #f0fdf4; --work-t: #166534; --work-b: #dcfce7;
      --off-bg: #f8fafc; --off-t: #475569; --off-b: #f1f5f9;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    body { margin: 0; padding: 15px; font-family: 'Segoe UI', sans-serif; background: transparent; }
    .container { background: #fff; padding: 25px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid #eee; }
    
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .nav-group { display: flex; gap: 8px; }
    .btn-nav { padding: 10px 18px; border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; font-weight: 800; font-size: 13px; transition: 0.2s; color: var(--primary); }
    .btn-nav:hover { background: #f8fafc; border-color: var(--primary2); transform: translateY(-1px); }
    input[type="date"] { padding: 10px 15px; border-radius: 12px; border: 1px solid #ddd; font-weight: 800; color: var(--primary); outline: none; }

    .legend-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; padding: 15px; background: #fafbfc; border-radius: 18px; border: 1px solid #f1f5f9; justify-content: center; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-size: 11px; font-weight: 800; border: 1px solid transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .pill span { opacity: 0.7; font-weight: 600; font-size: 10px; border-right: 1px solid rgba(0,0,0,0.1); padding-right: 8px; margin-right: 4px; }
    [dir="ltr"] .pill span { border-right: none; border-left: 1px solid rgba(0,0,0,0.1); padding-right: 0; padding-left: 8px; margin-right: 0; margin-left: 4px; }

    .Morning { background: var(--morning-bg); color: var(--morning-t); border-color: var(--morning-b); }
    .Night { background: var(--night-bg); color: var(--night-t); border-color: var(--night-b); }
    .Vacation { background: var(--vacation-bg); color: var(--vacation-t); border-color: var(--vacation-b); }
    .OnCall { background: var(--oncall-bg); color: var(--oncall-t); border-color: var(--oncall-b); }
    .Work { background: var(--work-bg); color: var(--work-t); border-color: var(--work-b); }
    .Off { background: var(--off-bg); color: var(--off-t); border-color: var(--off-b); }

    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
    th { padding: 15px; color: var(--primary); font-weight: 900; text-align: center; font-size: 13px; border-bottom: 2px solid #f1f5f9; }
    
    /* --- تعديل عمود الموظف --- */
    .emp-name { 
      text-align: right !important; 
      padding-right: 20px; 
      padding-left: 20px;
      font-weight: 900; 
      color: var(--primary); 
      border-right: 1px solid #f1f5f9; 
      border-radius: 0 15px 15px 0; 
      white-space: nowrap; /* يمنع نزول الاسم لسطر جديد */
      width: 1%; /* يجبر العمود على الانكماش ليناسب الاسم فقط */
    }

    .schedule-badge {
      width: 100%; max-width: 130px; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: 0.2s;
    }
    td { padding: 12px; text-align: center; background: #fff; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }

    .overlay { position: fixed; inset: 0; background: rgba(10,23,55,0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .dialog { background: #fff; width: 90%; max-width: 420px; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.2); }
    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
    .opt-btn { padding: 15px; border-radius: 15px; border: 1.5px solid #eee; background: #fff; cursor: pointer; font-weight: 800; text-align: center; font-size: 13px; }
    .opt-btn.active { border-color: var(--primary2); background: var(--morning-bg); color: var(--primary2); }
  </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <div style="display:flex; align-items:center; gap:12px">
            <img src="LOGO-almajdouie.png" style="height:40px" />
            <div style="font-weight: 900; color: var(--primary); font-size: 17px;">جدول المناوبات الأسبوعي v1.1.3</div>
        </div>
        <div class="nav-group">
            <button class="btn-nav" id="btnPrev">السابق</button>
            <button class="btn-nav" id="btnToday">الحالي</button>
            <button class="btn-nav" id="btnNext">التالي</button>
        </div>
        <div style="display:flex; gap:10px; align-items:center">
            <input type="date" id="datePicker" />
            <button class="btn-nav" id="btnToggleLang" style="min-width: 70px;">AR/EN</button>
        </div>
    </div>

    <div class="legend-bar" id="legendArea"></div>

    <div style="overflow-x:auto">
        <table>
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div class="overlay" id="shiftOverlay">
    <div class="dialog">
        <div style="padding:20px; background:#f8fafc; font-weight:900; color:var(--primary); border-bottom:1px solid #eee; text-align:center" id="dialogTitle"></div>
        <div class="opt-grid" id="shiftOptions"></div>
        <div style="padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 10px;">
            <button onclick="window.saveOverride()" style="width:100%; padding:14px; border-radius:12px; background:var(--primary); color:#fff; border:none; font-weight:800; cursor:pointer">تأكيد وحفظ</button>
            <button onclick="window.closeDialog()" style="width:100%; padding:10px; background:none; border:none; color:#64748b; font-weight:800; cursor:pointer">إلغاء</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, onSnapshot, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

const i18n = {
    ar: { morning:'صباحي', night:'ليلي', vacation:'إجازة', oncall:'أون كول', work:'تغطية', off:'أوف', employee:'الموظف', allDay:'طوال اليوم', help:'حسب الحاجة', days:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'] },
    en: { morning:'Morning', night:'Night', vacation:'Vacation', oncall:'On Call', work:'Coverage', off:'Off', employee:'Employee', allDay:'Full Day', help:'As Needed', days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] }
};

let emps = [], overrides = {}, currentLang = localStorage.getItem('lang') || 'ar', selectedCell = null, selectedOption = null;
const $ = id => document.getElementById(id);

window.updateLabels = () => {
    const t = i18n[currentLang];
    $('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    $('legendArea').innerHTML = `
        <div class="pill Morning">☀️ ${t.morning} <span>07:30 - 17:00</span></div>
        <div class="pill Night">🌙 ${t.night} <span>13:00 - 22:00</span></div>
        <div class="pill Vacation">🌴 ${t.vacation} <span>${t.allDay}</span></div>
        <div class="pill OnCall">📞 ${t.oncall} <span>${t.help}</span></div>
        <div class="pill Work">🏢 ${t.work} <span>10:00 - 19:00</span></div>
        <div class="pill Off">⌛ ${t.off} <span>${t.allDay}</span></div>
    `;
};

async function renderTable() {
    window.updateLabels();
    const t = i18n[currentLang];
    const dateInput = $('datePicker').value; if(!dateInput) return;
    const start = new Date(dateInput.replace(/-/g, '/'));
    
    let headHtml = `<th class="emp-name">${t.employee}</th>`;
    for(let i=0; i<7; i++) {
        const d = new Date(start.getTime() + i*86400000);
        headHtml += `<th>${t.days[d.getDay()]}<br><small style="opacity:0.5">${d.toLocaleDateString('en-GB')}</small></th>`;
    }
    $('tableHead').innerHTML = headHtml;

    $('tableBody').innerHTML = emps.filter(e => e.active).map(emp => {
        let row = `<td class="emp-name">${emp.name}</td>`;
        for(let i=0; i<7; i++) {
            const d = new Date(start.getTime() + i*86400000);
            const dStr = d.toISOString().split('T')[0];
            let shift = overrides[`${emp.id}_${dStr}`] || ((d.getDay() === 5 || d.getDay() === 6) ? 'Off' : (emp.fixed ? 'Night' : 'Morning'));
            const icons = { Morning:'☀️', Night:'🌙', Vacation:'🌴', OnCall:'📞', Work:'🏢', Off:'⌛' };
            row += `<td><div class="schedule-badge ${shift}" onclick="window.openDialog('${emp.id}','${dStr}','${emp.name}','${shift}')">${icons[shift]} ${t[shift.toLowerCase()]}</div></td>`;
        }
        return `<tr>${row}</tr>`;
    }).join('');
}

window.openDialog = (empId, date, name, current) => {
    selectedCell = { empId, date }; selectedOption = current;
    const t = i18n[currentLang];
    $('dialogTitle').innerHTML = `<div style="font-size:16px">${name}</div><div style="font-size:11px; opacity:0.6">${date}</div>`;
    const opts = ['Morning', 'Night', 'OnCall', 'Work', 'Vacation', 'Off'];
    $('shiftOptions').innerHTML = opts.map(o => `<div class="opt-btn ${selectedOption === o ? 'active' : ''}" onclick="window.selectOpt('${o}')">${t[o.toLowerCase()]}</div>`).join('');
    $('shiftOverlay').style.display = 'flex';
};

window.selectOpt = (id) => {
    selectedOption = id;
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
};

window.saveOverride = async () => {
    overrides[`${selectedCell.empId}_${selectedCell.date}`] = selectedOption;
    await setDoc(doc(db, 'schedule', 'manual_overrides'), overrides);
    window.closeDialog();
};

window.closeDialog = () => $('shiftOverlay').style.display = 'none';

$('btnPrev').onclick = () => { const p = $('datePicker'); const d = new Date(p.value.replace(/-/g, '/')); d.setDate(d.getDate()-7); p.value = d.toISOString().split('T')[0]; renderTable(); };
$('btnNext').onclick = () => { const p = $('datePicker'); const d = new Date(p.value.replace(/-/g, '/')); d.setDate(d.getDate()+7); p.value = d.toISOString().split('T')[0]; renderTable(); };
$('btnToday').onclick = () => { const d = new Date(); d.setDate(d.getDate() - d.getDay()); $('datePicker').value = d.toISOString().split('T')[0]; renderTable(); };
$('btnToggleLang').onclick = () => { currentLang = currentLang==='ar'?'en':'ar'; localStorage.setItem('lang', currentLang); renderTable(); };
$('datePicker').onchange = renderTable;

onSnapshot(doc(db, 'schedule', 'jadwal_v6'), s => { emps = s.data()?.data?.emps || []; renderTable(); });
onSnapshot(doc(db, 'schedule', 'manual_overrides'), s => { overrides = s.data() || {}; renderTable(); });

window.onload = () => {
    const d = new Date(); d.setDate(d.getDate() - d.getDay());
    $('datePicker').value = d.toISOString().split('T')[0];
    renderTable();
};
</script>
</body>
</html>
