<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Schedule - Almajdouie Motors</title>
  <style>
    :root {
      --primary: #0d2149;
      --primary2: #1b4fa3;
      --morning-bg: #e0f2fe; --morning-t: #0369a1;
      --night-bg: #f3e8ff; --night-t: #7e22ce;
      --oncall-bg: #ecfeff; --oncall-t: #0e7490;
      --off-bg: #f1f5f9; --off-t: #475569;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    body {
      margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif;
      background: transparent; /* ليعمل بجمالية داخل الـ iframe */
    }
    .container { background: #fff; padding: 25px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid #eee; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    input[type="date"] { padding: 10px 15px; border-radius: 12px; border: 1px solid #ddd; font-weight: bold; color: var(--primary); }
    
    /* Legend Style */
    .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; padding: 15px; background: #f8fafc; border-radius: 15px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--muted); }
    
    /* Table & Pills */
    table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 13px; }
    th { padding: 15px; color: var(--primary); font-weight: 900; text-align: center; border-bottom: 2px solid #f1f5f9; }
    td { padding: 10px; text-align: center; background: #fff; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
    td:first-child { border-right: 1px solid #f1f5f9; border-radius: 0 12px 12px 0; text-align: right; padding-right: 20px; font-weight: 900; color: var(--primary); }
    td:last-child { border-left: 1px solid #f1f5f9; border-radius: 12px 0 0 12px; }
    
    .badge {
      border-radius: 999px; padding: 8px 16px; font-size: 11px; font-weight: 800;
      display: inline-flex; align-items: center; gap: 6px; width: 100%; max-width: 120px;
      justify-content: center; cursor: pointer; transition: 0.2s; border: 1px solid rgba(0,0,0,0.02);
    }
    .badge:hover { transform: scale(1.05); filter: brightness(0.95); }
    .Morning { background: var(--morning-bg); color: var(--morning-t); }
    .Night { background: var(--night-bg); color: var(--night-t); }
    .OnCall { background: var(--oncall-bg); color: var(--oncall-t); }
    .Off { background: var(--off-bg); color: var(--off-t); }

    /* Overlay Dialog */
    .overlay { position: fixed; inset: 0; background: rgba(10,23,55,0.4); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .dialog { background: #fff; width: 90%; max-width: 450px; border-radius: 25px; overflow: hidden; box-shadow: 0 25px 70px rgba(0,0,0,0.3); }
    .dialog-header { padding: 20px; background: #f8fafc; border-bottom: 1px solid #eee; font-weight: 900; color: var(--primary); }
    .dialog-body { padding: 25px; display: flex; flex-direction: column; gap: 10px; }
    .opt-btn { padding: 12px; border-radius: 12px; border: 1px solid #eee; background: #fff; cursor: pointer; font-weight: 800; text-align: center; }
    .opt-btn.active { border-color: var(--primary2); background: var(--morning-bg); color: var(--primary2); }
  </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <div style="display:flex; align-items:center; gap:10px">
            <img src="LOGO-almajdouie.png" style="height:35px" />
            <div style="font-weight:900; color:var(--primary)">جدول المناوبات الأسبوعي</div>
        </div>
        <input type="date" id="datePicker" />
    </div>

    <div class="legend" id="legendArea">
        <div class="legend-item"><span class="badge Morning">☀️ صباحي</span> 07:30 - 17:00</div>
        <div class="legend-item"><span class="badge Night">🌙 ليلي</span> 13:00 - 22:00</div>
        <div class="legend-item"><span class="badge Off">⌛ أوف</span> طوال اليوم</div>
    </div>

    <div style="overflow-x:auto">
        <table>
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div class="overlay" id="shiftOverlay">
    <div class="dialog">
        <div class="dialog-header" id="dialogTitle">تعديل الدوام</div>
        <div class="dialog-body">
            <div id="shiftOptions" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px"></div>
            <div style="display:flex; gap:10px; margin-top:15px">
                <button onclick="window.saveOverride()" style="flex:2; padding:12px; border-radius:12px; background:var(--primary); color:#fff; border:none; font-weight:800; cursor:pointer">حفظ التعديل</button>
                <button onclick="window.closeDialog()" style="flex:1; padding:12px; border-radius:12px; background:#f1f5f9; color:#475569; border:none; font-weight:800; cursor:pointer">إغلاق</button>
            </div>
            <button onclick="window.resetOverride()" style="margin-top:10px; background:none; border:none; color:#ef4444; font-size:11px; font-weight:800; cursor:pointer">إعادة ضبط للوضع التلقائي</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, onSnapshot, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

let emps = [], overrides = {}, selectedCell = null, selectedOption = null;
const daysAr = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

// --- Functions ---
window.openDialog = (empId, date, name, current) => {
    selectedCell = { empId, date };
    selectedOption = current;
    document.getElementById('dialogTitle').innerText = `${name} - ${date}`;
    const opts = [
        {id:'Morning', n:'☀️ صباحي'}, {id:'Night', n:'🌙 ليلي'}, 
        {id:'OnCall', n:'📞 أون كول'}, {id:'Off', n:'⌛ أوف'}
    ];
    document.getElementById('shiftOptions').innerHTML = opts.map(o => `
        <div class="opt-btn ${selectedOption === o.id ? 'active' : ''}" onclick="window.selectOpt('${o.id}')">
            ${o.n}
        </div>
    `).join('');
    document.getElementById('shiftOverlay').style.display = 'flex';
};

window.selectOpt = (id) => {
    selectedOption = id;
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
};

window.saveOverride = async () => {
    const docRef = doc(db, 'schedule', 'manual_overrides');
    overrides[`${selectedCell.empId}_${selectedCell.date}`] = selectedOption;
    await setDoc(docRef, overrides);
    window.closeDialog();
};

window.resetOverride = async () => {
    const docRef = doc(db, 'schedule', 'manual_overrides');
    delete overrides[`${selectedCell.empId}_${selectedCell.date}`];
    await setDoc(docRef, overrides);
    window.closeDialog();
};

window.closeDialog = () => document.getElementById('shiftOverlay').style.display = 'none';

async function renderTable() {
    const dateInput = document.getElementById('datePicker').value;
    if(!dateInput) return;
    const start = new Date(dateInput.replace(/-/g, '/'));
    
    // Header
    let headHtml = '<th>الموظف</th>';
    for(let i=0; i<7; i++) {
        const d = new Date(start.getTime() + i*86400000);
        headHtml += `<th>${daysAr[d.getDay()]}<br><small style="font-size:9px; color:var(--muted)">${d.toLocaleDateString('en-GB')}</small></th>`;
    }
    document.getElementById('tableHead').innerHTML = headHtml;

    // Body
    document.getElementById('tableBody').innerHTML = emps.filter(e => e.active).map(emp => {
        let row = `<td>${emp.name}</td>`;
        for(let i=0; i<7; i++) {
            const d = new Date(start.getTime() + i*86400000);
            const dStr = d.toISOString().split('T')[0];
            
            // Logic: Manual Override > Weekend (Off) > Fixed Shift
            let shift = overrides[`${emp.id}_${dStr}`];
            if(!shift) {
                shift = (d.getDay() === 5 || d.getDay() === 6) ? 'Off' : (emp.fixed ? 'Night' : 'Morning');
            }

            const label = shift === 'Morning' ? '☀️ صباحي' : shift === 'Night' ? '🌙 ليلي' : shift === 'OnCall' ? '📞 أون كول' : '⌛ أوف';
            row += `<td><span class="badge ${shift}" onclick="window.openDialog('${emp.id}','${dStr}','${emp.name}','${shift}')">${label}</span></td>`;
        }
        return `<tr>${row}</tr>`;
    }).join('');
}

// --- Listeners ---
onSnapshot(doc(db, 'schedule', 'jadwal_v6'), s => {
    emps = s.exists() ? (s.data().data?.emps || []) : [];
    renderTable();
});

onSnapshot(doc(db, 'schedule', 'manual_overrides'), s => {
    overrides = s.exists() ? s.data() : {};
    renderTable();
});

document.getElementById('datePicker').addEventListener('change', renderTable);

window.onload = () => {
    const d = new Date();
    d.setDate(d.getDate() - d.getDay()); // البداية من الأحد
    document.getElementById('datePicker').value = d.toISOString().split('T')[0];
};
</script>
</body>
</html>
