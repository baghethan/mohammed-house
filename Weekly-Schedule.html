<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Schedule v1.1.7 - Compact Job Title Sort</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #0d2149; --primary2: #1b4fa3;
      /* الألوان الجديدة بناءً على طلبك */
      --morning-bg: #7f9ee5; --morning-t: #ffffff;
      --night-bg: #7551D3; --night-t: #ffffff;
      --vacation-bg: #ffe4e6; --vacation-t: #9f1239;
      --sick-bg: #dbeafe; --sick-t: #1e40af;
      --holiday-bg: #fff7ed; --holiday-t: #9a3412;
      --absent-bg: #fee2e2; --absent-t: #991b1b;
      --oncall-t: #075985;
      --work-bg: #dcfce7; --work-t: #166534;
      --off-bg: #8C8686; --off-t: #ffffff; /* خلفية رمادية وخط أبيض */
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    body { margin: 0; padding: 4px; font-family: 'Segoe UI', sans-serif; background: transparent; }
    .container { background: #fff; padding: 6px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid #eee; width: fit-content; max-width: calc(100vw - 8px); margin: 0 auto; box-sizing: border-box; }
    
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
    .nav-group { display: flex; gap: 8px; }
    .btn-nav { padding: 8px 12px; border-radius: 10px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; font-weight: 800; font-size: 12px; transition: 0.2s; color: var(--primary); }
    .btn-nav:hover { background: #f8fafc; border-color: var(--primary2); transform: translateY(-1px); }
    input[type="date"] { padding: 8px 12px; border-radius: 10px; border: 1px solid #ddd; font-weight: 800; color: var(--primary); outline: none; }

    .capture-card { background:#fff; border-radius:10px; padding:6px; border:1px solid #edf2f7; width:max-content; max-width:100%; margin:0 auto; box-sizing:border-box; }
    .capture-header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:3px; padding-bottom:3px; border-bottom:1px solid #eef2f7; }
    .capture-brand { display:flex; align-items:center; gap:6px; }
    .capture-logo { height:26px; width:auto; object-fit:contain; }
    .capture-title { color:var(--primary); font-size:14px; font-weight:900; line-height:1.05; }
    .capture-range { color:#475569; font-size:10px; font-weight:800; margin-top:1px; }
    .capture-meta { color:#475569; font-size:9px; font-weight:900; white-space:nowrap; }
    .legend-bar { display: flex; gap: 3px; flex-wrap: wrap; margin: 2px 0 3px; padding: 3px; background: #fafbfc; border-radius: 8px; border: 1px solid #f1f5f9; justify-content: center; }
    .pill { display: inline-flex; align-items: center; gap: 3px; padding: 3px 6px; border-radius: 999px; font-size: 8px; font-weight: 800; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .pill span { opacity: 0.8; font-weight: 600; font-size: 8px; border-right: 1px solid rgba(255,255,255,0.3); padding-right: 4px; margin-right: 2px; }

    /* تطبيق الألوان والتدرجات */
    .Morning { background-color: var(--morning-bg); color: var(--morning-t); }
    .Night { background-color: var(--night-bg); color: var(--night-t); }
    .Vacation { background-color: var(--vacation-bg); color: var(--vacation-t); }
    .Sick { background-color: var(--sick-bg); color: var(--sick-t); }
    .Holiday { background-color: var(--holiday-bg); color: var(--holiday-t); }
    .Absent { background-color: var(--absent-bg); color: var(--absent-t); }
    .Work { background-color: var(--work-bg); color: var(--work-t); }
    .Off { background-color: var(--off-bg); color: var(--off-t); }
    
    /* التدرج اللوني الخاص بالأون كول */
    .OnCall { 
        color: var(--oncall-t);
        background-image: radial-gradient(at 41.6% 72.5%, hsla(204, 93%, 93%, 1) 0%, hsla(204, 93%, 93%, 0) 100%), 
                          radial-gradient(at 46.5% 66.1%, hsla(203, 42%, 72%, 1) 0%, hsla(203, 42%, 72%, 0) 100%), 
                          radial-gradient(at 46.5% 14.6%, hsla(204, 45%, 76%, 1) 0%, hsla(204, 45%, 76%, 0) 100%), 
                          radial-gradient(at 34.8% 99.7%, hsla(204, 93%, 93%, 1) 0%, hsla(204, 93%, 93%, 0) 100%), 
                          radial-gradient(at 88.2% 74.2%, hsla(203, 42%, 72%, 1) 0%, hsla(203, 42%, 72%, 0) 100%);
    }

    .table-shell { overflow-x:auto; display:flex; justify-content:center; margin-top:0; }
    table { width: auto; min-width: 0; table-layout: auto; border-collapse: separate; border-spacing: 0 1px; margin:0 auto; }
    th { padding: 3px 4px; color: var(--primary); font-weight: 900; text-align: center; font-size: 10px; border-bottom: 2px solid #f1f5f9; min-width:72px; }
    th small { font-size: 8px !important; font-weight: 600; opacity: 0.7; display: block; margin-top: 1px; }

    .emp-name { text-align: right !important; padding: 0 6px; font-weight: 900; color: var(--primary); border-right: 1px solid #f1f5f9; border-radius: 0 7px 7px 0; white-space: nowrap; width: 150px; max-width:150px; font-size:10px; overflow:hidden; text-overflow:ellipsis; }
    .schedule-badge { width: 100%; max-width: 68px; min-height: 20px; padding: 3px 5px; border-radius: 6px; font-size: 8px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 3px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(0,0,0,0.03); }
    td { padding: 2px 3px; text-align: center; background: #fff; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }

    .overlay { position: fixed; inset: 0; background: rgba(10,23,55,0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .dialog { background: #fff; width: 90%; max-width: 420px; border-radius: 24px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.2); }
    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; }
    .opt-btn { padding: 15px; border-radius: 15px; border: 1.5px solid #eee; background: #fff; cursor: pointer; font-weight: 800; text-align: center; font-size: 13px; }
    .opt-btn.active { border-color: var(--primary2); background: #f0f9ff; color: var(--primary2); }
  </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <div style="display:flex; align-items:center; gap:12px">
            <img src="LOGO-almajdouie.png" style="height:40px" />
            <div style="font-weight: 900; color: var(--primary); font-size: 17px;">جدول المناوبات الأسبوعي v1.1.7</div>
        </div>
        <div class="nav-group">
            <button class="btn-nav" id="btnPrev">السابق</button>
            <button class="btn-nav" id="btnToday">الحالي</button>
            <button class="btn-nav" id="btnNext">التالي</button>
        </div>
        <div style="display:flex; gap:10px; align-items:center">
            <input type="date" id="datePicker" />
            <button class="btn-nav" id="btnToggleLang" style="min-width: 70px;">AR/EN</button>
            <button class="btn-nav" id="btnCopyImage" type="button">نسخ صورة</button>
        </div>
    </div>

    <div class="capture-card" id="scheduleCapture">
        <div class="capture-header">
            <div class="capture-brand">
                <img class="capture-logo" src="LOGO-almajdouie.png" alt="Almajdouie Motors" />
                <div>
                    <div class="capture-title" id="captureTitle">جدول المناوبات الأسبوعي</div>
                    <div class="capture-range" id="weekRangeText">من -- إلى --</div>
                </div>
            </div>
            <div class="capture-meta" id="captureGeneratedText"></div>
        </div>

        <div class="legend-bar" id="legendArea"></div>

        <div class="table-shell">
            <table>
                <thead><tr id="tableHead"></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="overlay" id="shiftOverlay">
    <div class="dialog">
        <div style="padding:20px; background:#f8fafc; font-weight:900; color:var(--primary); border-bottom:1px solid #eee; text-align:center" id="dialogTitle"></div>
        <div class="opt-grid" id="shiftOptions"></div>
        <div style="padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 10px;">
            <button onclick="window.saveOverride()" style="width:100%; padding:14px; border-radius:12px; background:var(--primary); color:#fff; border:none; font-weight:800; cursor:pointer">تأكيد وحفظ</button>
            <button onclick="window.closeDialog()" style="width:100%; padding:10px; background:none; border:none; color:#64748b; font-weight:800; cursor:pointer">إلغاء</button>
        </div>
    </div>
</div>

<script type="module">
import { db, waitForSignedInUser, logFirebaseError } from './firebase-session.js';
import { doc, collection, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const i18n = {
    ar: { title:'جدول المناوبات الأسبوعي', morning:'صباحي', night:'ليلي', vacation:'إجازة', sick:'مريض', holiday:'Holiday', absent:'غائب', oncall:'أون كول', work:'تغطية', off:'أوف', employee:'الموظف', allDay:'طوال اليوم', help:'حسب الحاجة', copyImage:'نسخ صورة', copied:'تم نسخ صورة الجدول.', downloaded:'تعذر النسخ المباشر، تم تنزيل الصورة بدلاً من ذلك.', copyFailed:'تعذر إنشاء صورة الجدول.', generated:'تم الإنشاء', range:(from,to)=>`من ${from} إلى ${to}`, days:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'] },
    en: { title:'Weekly Shift Schedule', morning:'Morning', night:'Night', vacation:'Vacation', sick:'Sick', holiday:'Holiday', absent:'Absent', oncall:'On Call', work:'Coverage', off:'Off', employee:'Employee', allDay:'Full Day', help:'As Needed', copyImage:'Copy Image', copied:'Schedule image copied.', downloaded:'Direct copy was blocked, so the image was downloaded instead.', copyFailed:'Could not create the schedule image.', generated:'Generated', range:(from,to)=>`From ${from} to ${to}`, days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] }
};

let emps = [], employeeRecords = [], holidayDuties = [], overrides = {}, annualLeaves = [], vacationPlans = [], currentLang = localStorage.getItem('lang') || 'ar', selectedCell = null, selectedOption = null;
const $ = id => document.getElementById(id);

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
    })[char]);
}

function safeJs(value) {
    return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' ');
}

function parseLocalDate(value) {
    const d = new Date(String(value || '').replace(/-/g, '/'));
    d.setHours(0, 0, 0, 0);
    return d;
}

function formatLocalDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function startOfWeek(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - d.getDay());
    return d;
}

function formatDisplayDate(date) {
    return date.toLocaleDateString('en-GB');
}

function normalizeRotation(emp) {
    const raw = String(emp?.rotType || emp?.rotation || 'none');
    if (raw === 'thu_fri') return 'thu';
    if (raw === 'fri_sat') return 'fri';
    return ['thu', 'fri', 'none'].includes(raw) ? raw : 'none';
}

function getEmployeeKeys(emp) {
    const aliases = Array.isArray(emp?.aliasIds) ? emp.aliasIds : [];
    return [emp?.id, emp?.empNum, emp?.empId, emp?.employeeId, emp?.technicianId, emp?.email, emp?.name, ...aliases]
        .filter(Boolean)
        .map(v => String(v).trim().toLowerCase());
}

function matchesEmployee(record, emp) {
    const keys = new Set(getEmployeeKeys(emp));
    return [record.empId, record.fireId, record.employeeId, record.technicianId, record.email, record.name].filter(Boolean).some(v => keys.has(String(v).trim().toLowerCase()));
}

function normalizeIdentityValue(value) {
    return String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function dedupeIdentityKeys(emp) {
    const keys = [];
    const add = (prefix, value) => {
        const normalized = normalizeIdentityValue(value);
        if (normalized) keys.push(`${prefix}:${normalized}`);
    };
    [emp?.empNum, emp?.empId, emp?.employeeId, emp?.technicianId].forEach(value => add('emp', value));
    (Array.isArray(emp?.aliasIds) ? emp.aliasIds : []).forEach(value => add('id', value));
    add('id', emp?.id);
    add('email', emp?.email);
    add('name', emp?.name);
    return [...new Set(keys)];
}

function employeeCompletenessScore(emp) {
    return [
        emp?.empNum || emp?.empId || emp?.employeeId || emp?.technicianId,
        emp?.email,
        emp?.jobTitle || emp?.jobTitleAr || emp?.jobTitleEn || emp?.position || emp?.title,
        emp?.dept || emp?.department,
        emp?.phone || emp?.mobile
    ].filter(Boolean).length + (emp?.source === 'employees' ? 2 : 0) + (findEmployeeRecord(emp) ? 3 : 0);
}

function mergeWeeklyEmployee(existing, incoming) {
    const preferred = employeeCompletenessScore(incoming) > employeeCompletenessScore(existing) ? incoming : existing;
    const fallback = preferred === incoming ? existing : incoming;
    const aliasIds = new Set([
        ...(Array.isArray(existing.aliasIds) ? existing.aliasIds : []),
        ...(Array.isArray(incoming.aliasIds) ? incoming.aliasIds : []),
        existing.id,
        incoming.id,
        existing.empNum,
        incoming.empNum
    ].filter(Boolean).map(value => String(value)));

    const preferredRotation = normalizeRotation(preferred);
    const fallbackRotation = normalizeRotation(fallback);
    const rotation = preferredRotation !== 'none' ? preferredRotation : fallbackRotation;

    return {
        ...fallback,
        ...preferred,
        id: preferred.id || fallback.id,
        empNum: preferred.empNum || preferred.empId || fallback.empNum || fallback.empId || '',
        name: preferred.name || fallback.name || '',
        dept: preferred.dept || preferred.department || fallback.dept || fallback.department || '',
        department: preferred.department || preferred.dept || fallback.department || fallback.dept || '',
        jobTitle: preferred.jobTitle || preferred.jobTitleAr || preferred.jobTitleEn || preferred.position || preferred.title ||
            fallback.jobTitle || fallback.jobTitleAr || fallback.jobTitleEn || fallback.position || fallback.title || '',
        email: preferred.email || fallback.email || '',
        phone: preferred.phone || preferred.mobile || fallback.phone || fallback.mobile || '',
        active: existing.active !== false || incoming.active !== false,
        fixed: preferred.fixed === true || fallback.fixed === true,
        rotation,
        rotType: rotation,
        aliasIds: Array.from(aliasIds)
    };
}

function dedupeWeeklyEmployees(list) {
    const result = [];
    const indexByKey = new Map();

    (list || []).forEach(employee => {
        const keys = dedupeIdentityKeys(employee);
        const foundKey = keys.find(key => indexByKey.has(key));
        if (!foundKey) {
            result.push(employee);
            const index = result.length - 1;
            keys.forEach(key => indexByKey.set(key, index));
            return;
        }

        const index = indexByKey.get(foundKey);
        result[index] = mergeWeeklyEmployee(result[index], employee);
        dedupeIdentityKeys(result[index]).forEach(key => indexByKey.set(key, index));
    });

    return result;
}

function isDateInRange(date, start, end) {
    if (!start || !end) return false;
    const d1 = parseLocalDate(start);
    const d2 = parseLocalDate(end);
    return date >= d1 && date <= d2;
}

function normalizeLeaveType(value) {
    const text = String(value || '').trim().toLowerCase();
    if (['sick', 'sick leave', 'medical', 'مرضية', 'مريض', 'اجازة مرضية', 'إجازة مرضية'].includes(text)) return 'sick';
    if (['absence', 'absent', 'غياب', 'غائب'].includes(text)) return 'absence';
    return 'annual';
}

function shiftForLeaveRecord(record) {
    const type = normalizeLeaveType(record.leaveType || record.type || record.leaveTypeLabel);
    if (type === 'sick') return 'Sick';
    if (type === 'absence') return 'Absent';
    return 'Vacation';
}

function leaveShiftForEmployee(emp, date) {
    const annual = annualLeaves.find(v => matchesEmployee(v, emp) && isDateInRange(date, v.start, v.end));
    if (annual) return shiftForLeaveRecord(annual);

    const approvedPlan = vacationPlans.find(p => String(p.status || 'pending') === 'approved' && matchesEmployee(p, emp) && isDateInRange(date, p.from, p.to));
    return approvedPlan ? shiftForLeaveRecord(approvedPlan) : '';
}

function isVacationDay(emp, date) {
    return !!leaveShiftForEmployee(emp, date);
}

function publicHolidayForDate(date) {
    return holidayDuties.find(holiday => isDateInRange(date, holiday.start, holiday.end)) || null;
}

function isAssignedHolidayEmployee(emp, holiday) {
    return !!holiday && matchesEmployee(holiday, emp);
}

function employeeIdsForOverrides(emp) {
    return [emp?.id, ...(Array.isArray(emp?.aliasIds) ? emp.aliasIds : [])]
        .filter(Boolean)
        .map(value => String(value));
}

function manualShiftForEmployee(emp, dateString) {
    return employeeIdsForOverrides(emp)
        .map(id => overrides[`${id}_${dateString}`])
        .find(Boolean) || '';
}

function isManualUnavailable(emp, date) {
    const shift = manualShiftForEmployee(emp, formatLocalDate(date));
    return shift === 'Vacation' || shift === 'Sick' || shift === 'Absent';
}

function isUnavailable(emp, date) {
    const holiday = publicHolidayForDate(date);
    return emp.active === false || isVacationDay(emp, date) || (holiday && isAssignedHolidayEmployee(emp, holiday)) || isManualUnavailable(emp, date);
}

function weekIndex(start) {
    const first = new Date(start.getFullYear(), 0, 1);
    first.setHours(0, 0, 0, 0);
    first.setDate(first.getDate() - first.getDay());
    return Math.floor((start - first) / 604800000);
}

function findDateByDay(dates, day) {
    return dates.find(date => date.getDay() === day);
}

function pickRotationEmployee(pool, start, datesToCheck) {
    if (!pool.length) return null;
    const ordered = [...pool].sort((a, b) => String(a.empNum || a.name || a.id).localeCompare(String(b.empNum || b.name || b.id), 'ar'));
    const startIndex = weekIndex(start) % ordered.length;
    for (let i = 0; i < ordered.length; i++) {
        const emp = ordered[(startIndex + i) % ordered.length];
        if (!datesToCheck.some(date => isUnavailable(emp, date))) return emp;
    }
    return null;
}

function baseShift(emp, date, rotations) {
    const nightShift = isNightShiftEmployee(emp);
    if (date.getDay() === 4) {
        if (rotations.thu?.id === emp.id) return 'Off';
        return nightShift ? 'Night' : 'Morning';
    }
    if (date.getDay() === 5) {
        if (rotations.thu?.id === emp.id) return 'Off';
        if (rotations.fri?.id === emp.id) return 'OnCall';
        return 'Off';
    }
    if (date.getDay() === 6) {
        if (rotations.thu?.id === emp.id) return 'Work';
        return 'Off';
    }
    return nightShift ? 'Night' : 'Morning';
}

function normalizeJobKey(value) {
    return String(value || '')
        .trim()
        .toLowerCase()
        .replace(/[إأآا]/g, 'ا')
        .replace(/[ىي]/g, 'ي')
        .replace(/[ة]/g, 'ه')
        .replace(/[()\[\]{}.:،؛]/g, '')
        .replace(/[\s_\-\/\\]+/g, '');
}

function isShiftLikeJobValue(value) {
    const key = normalizeJobKey(value);
    return [
        'morning', 'night', 'fixed', 'variable', 'shift', 'shifting',
        'active', 'inactive', 'hidden', 'morningvariable', 'none',
        'صباحي', 'ليلي', 'مناوبه', 'دوام', 'نشط', 'غيرنشط'
    ].includes(key);
}

function findEmployeeRecord(emp) {
    const keys = new Set(getEmployeeKeys(emp));
    return employeeRecords.find(record => getEmployeeKeys(record).some(key => keys.has(key))) || null;
}

function employeeJobValue(emp) {
    const record = findEmployeeRecord(emp);
    const directCandidates = [
        emp?.jobTitle, emp?.jobTitleAr, emp?.jobTitleEn, emp?.position, emp?.title, emp?.designation,
        record?.jobTitle, record?.jobTitleAr, record?.jobTitleEn, record?.position, record?.title, record?.designation
    ];
    const roleCandidates = [emp?.role, record?.role].filter(value => value && !isShiftLikeJobValue(value));
    const candidates = [...directCandidates, ...roleCandidates].filter(Boolean);
    return candidates.find(value => weeklyJobRankValue(value) < 99) || candidates[0] || '';
}

function weeklyJobRankValue(value) {
    const key = normalizeJobKey(value);
    if (!key) return 99;
    if (['الفني', 'فني', 'فنى', 'technician', 'tech', 'employee', 'user'].includes(key)) return 1;
    if (['المشرف', 'مشرف', 'supervisor', 'superviser', 'lead', 'leader'].includes(key)) return 2;
    if (['التمهير', 'تمهير', 'tamheer'].includes(key)) return 3;
    if (['المتدرب', 'متدرب', 'trainee', 'intern', 'internship', 'student'].includes(key)) return 4;
    if (['المدير', 'مدير', 'manager', 'admin', 'administrator'].includes(key)) return 5;
    return 99;
}

function weeklyJobRank(emp) {
    return weeklyJobRankValue(employeeJobValue(emp));
}

function employeeSortKey(emp) {
    return String(emp?.empNum || emp?.name || emp?.id || '').trim();
}

function isNightShiftEmployee(emp) {
    const record = findEmployeeRecord(emp) || {};
    const values = [emp?.fixed, record?.fixed, emp?.shiftType, record?.shiftType, emp?.shift, record?.shift, emp?.role, record?.role]
        .map(value => String(value ?? '').trim().toLowerCase());
    return values.includes('true') || values.includes('night') || values.includes('fixed') || values.includes('ليلي');
}

function weeklyManualOrder(emp) {
    const record = findEmployeeRecord(emp) || {};
    const value = emp?.weeklyOrder ?? emp?.scheduleOrder ?? emp?.sortOrder ?? record?.weeklyOrder ?? record?.scheduleOrder ?? record?.sortOrder;
    const number = Number(value);
    return Number.isFinite(number) && number > 0 ? number : 9999;
}

// ترتيب الموظفين: شفت الليل أولاً، ثم الترتيب اليدوي، ثم Job Title، ثم الرقم/الاسم.
function sortWeeklyEmployees(list) {
    return [...list].sort((a, b) => {
        const nightDiff = Number(!isNightShiftEmployee(a)) - Number(!isNightShiftEmployee(b));
        if (nightDiff) return nightDiff;

        const manualDiff = weeklyManualOrder(a) - weeklyManualOrder(b);
        if (manualDiff) return manualDiff;

        const rankDiff = weeklyJobRank(a) - weeklyJobRank(b);
        if (rankDiff) return rankDiff;

        return employeeSortKey(a).localeCompare(employeeSortKey(b), currentLang === 'ar' ? 'ar' : 'en', { numeric: true, sensitivity: 'base' });
    });
}

window.updateLabels = () => {
    const t = i18n[currentLang];
    $('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    $('captureTitle').textContent = t.title;
    $('btnCopyImage').textContent = t.copyImage;
    $('captureGeneratedText').textContent = `${t.generated}: ${new Date().toLocaleDateString('en-GB')}`;
    $('legendArea').innerHTML = `
        <div class="pill Morning">☀️ ${t.morning} <span>07:30 - 17:00</span></div>
        <div class="pill Night">🌙 ${t.night} <span>13:00 - 22:00</span></div>
        <div class="pill Vacation">🌴 ${t.vacation} <span>${t.allDay}</span></div>
        <div class="pill Sick">🏥 ${t.sick} <span>${t.allDay}</span></div>
        <div class="pill Holiday">🎊 ${t.holiday} <span>${t.allDay}</span></div>
        <div class="pill Absent">🚫 ${t.absent} <span>${t.allDay}</span></div>
        <div class="pill OnCall">📞 ${t.oncall} <span>${t.help}</span></div>
        <div class="pill Work">🏢 ${t.work} <span>10:00 - 19:00</span></div>
        <div class="pill Off">⌛ ${t.off} <span>${t.allDay}</span></div>
    `;
};

async function renderTable() {
    window.updateLabels();
    const t = i18n[currentLang];
    const dateInput = $('datePicker').value; if(!dateInput) return;
    const start = startOfWeek(parseLocalDate(dateInput));
    const normalizedStart = formatLocalDate(start);
    if ($('datePicker').value !== normalizedStart) $('datePicker').value = normalizedStart;
    const dates = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        return d;
    });
    $('weekRangeText').textContent = t.range(formatDisplayDate(dates[0]), formatDisplayDate(dates[6]));
    const thuDate = findDateByDay(dates, 4);
    const friDate = findDateByDay(dates, 5);
    const satDate = findDateByDay(dates, 6);
    const activeEmps = sortWeeklyEmployees(dedupeWeeklyEmployees(emps).filter(e => e.active !== false));
    const rotations = {
        thu: pickRotationEmployee(activeEmps.filter(e => normalizeRotation(e) === 'thu'), start, [thuDate, friDate, satDate].filter(Boolean)),
        fri: pickRotationEmployee(activeEmps.filter(e => normalizeRotation(e) === 'fri'), start, [friDate, satDate].filter(Boolean))
    };
    
    let headHtml = `<th class="emp-name">${t.employee}</th>`;
    dates.forEach(d => {
        headHtml += `<th>${t.days[d.getDay()]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
    });
    $('tableHead').innerHTML = headHtml;

    $('tableBody').innerHTML = activeEmps.map(emp => {
        let row = `<td class="emp-name">${escapeHtml(emp.name)}</td>`;
        dates.forEach(d => {
            const dStr = formatLocalDate(d);
            const manualShift = manualShiftForEmployee(emp, dStr);
            const publicHoliday = publicHolidayForDate(d);
            const isHolidayCoverage = publicHoliday && isAssignedHolidayEmployee(emp, publicHoliday);
            const leaveShift = leaveShiftForEmployee(emp, d);
            let shift = manualShift || (leaveShift || (publicHoliday ? (isHolidayCoverage ? 'Work' : 'Holiday') : baseShift(emp, d, rotations)));
            const icons = { Morning:'☀️', Night:'🌙', Vacation:'🌴', Sick:'🏥', Holiday:'🎊', Absent:'🚫', OnCall:'📞', Work:'🏢', Off:'⌛' };
            row += `<td><div class="schedule-badge ${shift}" onclick="window.openDialog('${safeJs(emp.id)}','${dStr}','${safeJs(emp.name)}','${shift}')">${icons[shift] || ''} ${t[shift.toLowerCase()] || shift}</div></td>`;
        });
        return `<tr>${row}</tr>`;
    }).join('');
}

window.openDialog = (empId, date, name, current) => {
    selectedCell = { empId, date }; selectedOption = current;
    const t = i18n[currentLang];
    $('dialogTitle').innerHTML = `<div style="font-size:16px">${escapeHtml(name)}</div><div style="font-size:11px; opacity:0.6">${escapeHtml(date)}</div>`;
    const opts = ['Morning', 'Night', 'OnCall', 'Work', 'Vacation', 'Sick', 'Holiday', 'Absent', 'Off'];
    $('shiftOptions').innerHTML = opts.map(o => `<div class="opt-btn ${selectedOption === o ? 'active' : ''}" onclick="window.selectOpt('${o}')">${t[o.toLowerCase()]}</div>`).join('');
    $('shiftOverlay').style.display = 'flex';
};

window.selectOpt = (id) => {
    selectedOption = id;
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
};

window.saveOverride = async () => {
    await waitForSignedInUser();
    overrides[`${selectedCell.empId}_${selectedCell.date}`] = selectedOption;
    await setDoc(doc(db, 'schedule', 'manual_overrides'), overrides);
    window.closeDialog();
};

window.closeDialog = () => $('shiftOverlay').style.display = 'none';

function downloadCanvas(canvas) {
    const a = document.createElement('a');
    const start = $('datePicker').value || new Date().toISOString().slice(0, 10);
    a.download = `Weekly_Schedule_${start}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
}

async function copyScheduleImage() {
    const t = i18n[currentLang];
    if (!window.html2canvas) {
        alert(t.copyFailed);
        return;
    }

    try {
        const canvas = await html2canvas($('scheduleCapture'), {
            backgroundColor: '#ffffff',
            scale: 2,
            useCORS: true
        });

        canvas.toBlob(async blob => {
            if (!blob) {
                alert(t.copyFailed);
                return;
            }

            try {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                alert(t.copied);
            } catch (error) {
                downloadCanvas(canvas);
                alert(t.downloaded);
            }
        }, 'image/png');
    } catch (error) {
        console.error(error);
        alert(t.copyFailed);
    }
}

$('btnPrev').onclick = () => { const p = $('datePicker'); const d = startOfWeek(parseLocalDate(p.value)); d.setDate(d.getDate()-7); p.value = formatLocalDate(d); renderTable(); };
$('btnNext').onclick = () => { const p = $('datePicker'); const d = startOfWeek(parseLocalDate(p.value)); d.setDate(d.getDate()+7); p.value = formatLocalDate(d); renderTable(); };
$('btnToday').onclick = () => { $('datePicker').value = formatLocalDate(startOfWeek(new Date())); renderTable(); };
$('btnToggleLang').onclick = () => { currentLang = currentLang==='ar'?'en':'ar'; localStorage.setItem('lang', currentLang); renderTable(); };
$('btnCopyImage').onclick = copyScheduleImage;
$('datePicker').onchange = renderTable;

async function bindSnapshots() {
    await waitForSignedInUser();
    onSnapshot(doc(db, 'schedule', 'jadwal_v6'), s => { emps = s.data()?.data?.emps || []; renderTable(); }, e => logFirebaseError('Weekly schedule employees listener failed', e));
    onSnapshot(collection(db, 'employees'), s => { employeeRecords = s.docs.map(item => ({ id: item.id, ...item.data() })); renderTable(); }, e => logFirebaseError('Weekly schedule employees collection listener failed', e));
    onSnapshot(doc(db, 'schedule', 'jadwal_holidays'), s => { holidayDuties = s.exists() ? (s.data().duties || []) : []; renderTable(); }, e => logFirebaseError('Weekly schedule public holidays listener failed', e));
    onSnapshot(doc(db, 'schedule', 'manual_overrides'), s => { overrides = s.data() || {}; renderTable(); }, e => logFirebaseError('Weekly schedule overrides listener failed', e));
    onSnapshot(doc(db, 'schedule', 'jadwal_annual_leave'), s => { annualLeaves = s.exists() ? (s.data().vacations || []) : []; renderTable(); }, e => logFirebaseError('Weekly schedule annual leave listener failed', e));
    onSnapshot(collection(db, 'vacations'), s => { vacationPlans = s.docs.map(item => ({ id: item.id, ...item.data() })); renderTable(); }, e => logFirebaseError('Weekly schedule vacation plans listener failed', e));
}

window.onload = () => {
    $('datePicker').value = formatLocalDate(startOfWeek(new Date()));
    renderTable();
    bindSnapshots().catch(e => logFirebaseError('Weekly schedule startup failed', e));
};
</script>
</body>
</html>
