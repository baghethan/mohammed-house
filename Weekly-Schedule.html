function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
    })[char]);
}

function safeJs(value) {
    return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' ');
}

function parseLocalDate(value) {

}

function formatLocalDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function startOfWeek(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - d.getDay());
    return d;
}

function formatDisplayDate(date) {
    return date.toLocaleDateString('en-GB');
}

function shiftTimeLabel(startKey, endKey, fallback) {
    const start = String(shiftSettings[startKey] || '').trim();
    const end = String(shiftSettings[endKey] || '').trim();
    return start && end ? `${start} - ${end}` : fallback;
}

function normalizeRotation(emp) {
    const raw = String(emp?.rotType || emp?.rotation || 'none');
    if (raw === 'thu_fri') return 'thu';
    if (raw === 'fri_sat') return 'fri';
    return ['thu', 'fri', 'none'].includes(raw) ? raw : 'none';
}


function normalizeWeeklyShiftHistory(history) {
    const rows = (Array.isArray(history) ? history : []).map((item, index) => {
        const effectiveFrom = String(item?.effectiveFrom || item?.from || item?.date || '').slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(effectiveFrom)) return null;
        const fixed = typeof item?.fixed === 'boolean'
            ? item.fixed
            : ['night', 'fixed', 'ليلي', 'ثابت'].includes(String(item?.shiftType || item?.shift || '').trim().toLowerCase());
        return {
            effectiveFrom,
            fixed,
            shiftType: fixed ? 'night' : 'morning',
            changedAt: String(item?.changedAt || item?.updatedAt || item?.createdAt || ''),
            source: String(item?.source || 'employees'),
            _index: index
        };
    }).filter(Boolean);
    rows.sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom) || a.changedAt.localeCompare(b.changedAt) || a._index - b._index);
    const byDate = new Map();
    rows.forEach(item => byDate.set(item.effectiveFrom, item));
    return Array.from(byDate.values())
        .sort((a, b) => a.effectiveFrom.localeCompare(b.effectiveFrom))
        .map(({ _index, ...item }) => item);
}

function mergeWeeklyShiftHistories(...records) {
    const rows = [];
    records.filter(Boolean).forEach(record => rows.push(...normalizeWeeklyShiftHistory(record.shiftHistory)));
    return normalizeWeeklyShiftHistory(rows);
}

function normalizeEmployeeRecord(record) {
    const source = record || {};
    const shiftHistory = normalizeWeeklyShiftHistory(source.shiftHistory);
    const shiftText = String(source.shiftType || source.shift || source.workType || '').trim().toLowerCase();
    const statusText = String(source.status || '').trim().toLowerCase();
    const active = typeof source.active === 'boolean'
        ? source.active
        : !['inactive', 'hidden', 'false', '0', 'مخفي', 'غيرنشط', 'غير نشط'].includes(statusText);
    const fixed = typeof source.fixed === 'boolean'
        ? source.fixed
        : ['night', 'fixed', 'ليلي', 'ثابت'].includes(shiftText);
    const rotation = normalizeRotation(source);

    return {
        ...source,
        id: String(source.id || source.uid || source.empId || source.empNum || source.employeeId || source.email || source.name || ''),
        empNum: source.empNum || source.empId || source.employeeId || source.technicianId || '',
        empId: source.empId || source.empNum || source.employeeId || source.technicianId || '',
        name: source.name || source.fullName || source.employeeName || '',
        dept: source.dept || source.department || '',
        department: source.department || source.dept || '',
        jobTitle: source.jobTitle || source.jobTitleAr || source.jobTitleEn || source.position || source.title || '',
        email: source.email || '',
        phone: source.phone || source.mobile || '',
        mobile: source.mobile || source.phone || '',
        fixed,
        shiftType: fixed ? 'night' : 'morning',
        rotation,
        rotType: rotation,
        weeklyOrder: source.weeklyOrder ?? source.scheduleOrder ?? source.sortOrder ?? '',
        scheduleOrder: source.scheduleOrder ?? source.weeklyOrder ?? source.sortOrder ?? '',
        active,
        status: active ? 'active' : 'inactive',
        shiftHistory,
        shiftEffectiveFrom: String(source.shiftEffectiveFrom || (shiftHistory.length ? shiftHistory[shiftHistory.length - 1].effectiveFrom : '')).slice(0, 10),
        source: 'employees'
    };
}

function weeklyEmployeeTimestamp(record) {
    const timestamp = Date.parse(record?.updatedAt || record?.createdAt || '');
    return Number.isFinite(timestamp) ? timestamp : 0;
}

function isCanonicalWeeklyEmployeeDocument(record) {
    const id = normalizeIdentityValue(record?.id || record?.employeeDocId);
    const empNum = normalizeIdentityValue(record?.empNum || record?.empId || record?.employeeId || record?.technicianId);
    return Boolean(id && empNum && id === empNum);
}

function preferIncomingWeeklyEmployee(existing, incoming) {
    const existingTime = weeklyEmployeeTimestamp(existing);
    const incomingTime = weeklyEmployeeTimestamp(incoming);
    if (incomingTime !== existingTime) return incomingTime > existingTime;

    const existingCanonical = isCanonicalWeeklyEmployeeDocument(existing);
    const incomingCanonical = isCanonicalWeeklyEmployeeDocument(incoming);
    if (incomingCanonical !== existingCanonical) return incomingCanonical;

    return employeeCompletenessScore(incoming) >= employeeCompletenessScore(existing);
}

function employeePrimaryKey(emp) {
    return String(emp?.empNum || emp?.empId || emp?.employeeId || emp?.technicianId || emp?.id || emp?.email || emp?.name || '').trim();
}

function getEmployeeKeys(emp) {
    const aliases = Array.isArray(emp?.aliasIds) ? emp.aliasIds : [];
    return [emp?.id, emp?.empNum, emp?.empId, emp?.employeeId, emp?.technicianId, emp?.email, emp?.name, ...aliases]
        .filter(Boolean)
        .map(v => String(v).trim().toLowerCase());
}

function matchesEmployee(record, emp) {
    const keys = new Set(getEmployeeKeys(emp));
    return [record.empId, record.empNum, record.fireId, record.employeeId, record.employeeDocId, record.technicianId, record.email, record.name, record.employeeName]
        .filter(Boolean)
        .some(v => keys.has(String(v).trim().toLowerCase()));
}

function normalizeIdentityValue(value) {
    return String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function dedupeIdentityKeys(emp) {
    const keys = [];
    const add = (prefix, value) => {
        const normalized = normalizeIdentityValue(value);
        if (normalized) keys.push(`${prefix}:${normalized}`);
    };
    [emp?.empNum, emp?.empId, emp?.employeeId, emp?.technicianId].forEach(value => add('emp', value));
    (Array.isArray(emp?.aliasIds) ? emp.aliasIds : []).forEach(value => add('id', value));
    add('id', emp?.id);
    add('email', emp?.email);
    add('name', emp?.name);
    return [...new Set(keys)];
}

function employeeCompletenessScore(emp) {
    return [
        emp?.empNum || emp?.empId || emp?.employeeId || emp?.technicianId,
        emp?.email,
        emp?.jobTitle || emp?.jobTitleAr || emp?.jobTitleEn || emp?.position || emp?.title,
        emp?.dept || emp?.department,
        emp?.phone || emp?.mobile
    ].filter(Boolean).length + (emp?.source === 'employees' ? 2 : 0) + (findEmployeeRecord(emp) ? 3 : 0);
}

function mergeWeeklyEmployee(existing, incoming) {
    const preferIncoming = preferIncomingWeeklyEmployee(existing, incoming);
    const preferred = preferIncoming ? incoming : existing;
    const fallback = preferIncoming ? existing : incoming;
    const aliasIds = new Set([
        ...(Array.isArray(existing.aliasIds) ? existing.aliasIds : []),
        ...(Array.isArray(incoming.aliasIds) ? incoming.aliasIds : []),
        existing.id,
        incoming.id,
        existing.empNum,
        incoming.empNum
    ].filter(Boolean).map(value => String(value)));

    const rotation = normalizeRotation(preferred);
    const preferredOrder = Number(preferred.weeklyOrder ?? preferred.scheduleOrder ?? preferred.sortOrder);
    const fallbackOrder = Number(fallback.weeklyOrder ?? fallback.scheduleOrder ?? fallback.sortOrder);
    const weeklyOrder = Number.isFinite(preferredOrder) && preferredOrder > 0
        ? preferredOrder
        : (Number.isFinite(fallbackOrder) && fallbackOrder > 0 ? fallbackOrder : '');
    const shiftHistory = mergeWeeklyShiftHistories(existing, incoming);

    return {
        ...fallback,
        ...preferred,
        id: preferred.id || fallback.id,
        empNum: preferred.empNum || preferred.empId || fallback.empNum || fallback.empId || '',
        empId: preferred.empId || preferred.empNum || fallback.empId || fallback.empNum || '',
        name: preferred.name || fallback.name || '',
        dept: preferred.dept || preferred.department || fallback.dept || fallback.department || '',
        department: preferred.department || preferred.dept || fallback.department || fallback.dept || '',
        jobTitle: preferred.jobTitle || preferred.jobTitleAr || preferred.jobTitleEn || preferred.position || preferred.title ||
            fallback.jobTitle || fallback.jobTitleAr || fallback.jobTitleEn || fallback.position || fallback.title || '',
        email: preferred.email || fallback.email || '',
        phone: preferred.phone || preferred.mobile || fallback.phone || fallback.mobile || '',
        active: preferred.active !== false,
        status: preferred.active !== false ? 'active' : 'inactive',
        fixed: preferred.fixed === true,
        shiftType: preferred.fixed === true ? 'night' : 'morning',
        rotation,
        rotType: rotation,
        weeklyOrder,
        scheduleOrder: weeklyOrder,
        shiftHistory,
        shiftEffectiveFrom: shiftHistory.length ? shiftHistory[shiftHistory.length - 1].effectiveFrom : (preferred.shiftEffectiveFrom || fallback.shiftEffectiveFrom || ''),
        employeeDocId: preferred.employeeDocId || preferred.id || fallback.employeeDocId || fallback.id || '',
        updatedAt: preferred.updatedAt || fallback.updatedAt || '',
        createdAt: preferred.createdAt || fallback.createdAt || '',
        aliasIds: Array.from(aliasIds)
    };
}

function dedupeWeeklyEmployees(list) {
    const result = [];
    const indexByKey = new Map();

    (list || []).forEach(employee => {
        const keys = dedupeIdentityKeys(employee);
        const foundKey = keys.find(key => indexByKey.has(key));
        if (!foundKey) {
            result.push(employee);
            const index = result.length - 1;
            keys.forEach(key => indexByKey.set(key, index));
            return;
        }

        const index = indexByKey.get(foundKey);
        result[index] = mergeWeeklyEmployee(result[index], employee);
        dedupeIdentityKeys(result[index]).forEach(key => indexByKey.set(key, index));
    });

    return result;
}

function isDateInRange(date, start, end) {
    if (!start || !end) return false;
    const d1 = parseLocalDate(start);
    const d2 = parseLocalDate(end);
    return date >= d1 && date <= d2;
}

function addDays(date, days) {
    const next = new Date(date);
    next.setHours(0, 0, 0, 0);
    next.setDate(next.getDate() + days);
    return next;
}

function holidayDateRange(holiday) {
    const start = parseLocalDate(holiday?.start);
    const end = parseLocalDate(holiday?.end);
    if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || start > end) return null;
    return { start, end };
}

function dateRangesOverlap(startA, endA, startB, endB) {
    return startA <= endB && endA >= startB;
}

function normalizeLeaveType(value) {
    const text = String(value || '').trim().toLowerCase();
    if (['sick', 'sick leave', 'medical', 'مرضية', 'مريض', 'اجازة مرضية', 'إجازة مرضية'].includes(text)) return 'sick';
    if (['absence', 'absent', 'غياب', 'غائب'].includes(text)) return 'absence';
    if (['delay', 'late', 'lateness', 'تأخير', 'تاخير'].includes(text)) return 'delay';
    return 'annual';
}

function shiftForLeaveRecord(record) {
    const type = normalizeLeaveType(record.leaveType || record.type || record.leaveTypeLabel);
    if (type === 'sick') return 'Sick';
    if (type === 'absence') return 'Absent';
    if (type === 'delay') return '';
    return 'Vacation';
}

function leaveShiftForEmployee(emp, date) {
    const annual = annualLeaves.find(v => normalizeLeaveType(v.leaveType || v.type || v.leaveTypeLabel) !== 'delay' && matchesEmployee(v, emp) && isDateInRange(date, v.start || v.from, v.end || v.to));
    if (annual) return shiftForLeaveRecord(annual);

    const approvedPlan = vacationPlans.find(p => normalizeLeaveType(p.leaveType || p.type || p.leaveTypeLabel) !== 'delay' && String(p.status || 'pending') === 'approved' && matchesEmployee(p, emp) && isDateInRange(date, p.from || p.start, p.to || p.end));
    return approvedPlan ? shiftForLeaveRecord(approvedPlan) : '';
}

function isVacationDay(emp, date) {
    return !!leaveShiftForEmployee(emp, date);
}

function publicHolidayForDate(date) {
    return holidayDuties.find(holiday => isDateInRange(date, holiday.start, holiday.end)) || null;
}

function normalizeHolidayDutyType(value, hasEmployee = false) {
    const raw = String(value || '').trim().toLowerCase();
    if (['oncall', 'on_call', 'on-call', 'call', 'اون كول', 'أون كول'].includes(raw)) return 'OnCall';
    if (['holiday', 'none', 'no_duty', 'no-duty', 'off', 'بدون دوام', 'عطلة'].includes(raw)) return 'Holiday';
    if (['work', 'coverage', 'cover', 'تغطية'].includes(raw)) return 'Work';
    return hasEmployee ? 'Work' : 'Holiday';
}

function holidayDutyType(holiday) {
    return normalizeHolidayDutyType(holiday?.dutyType || holiday?.coverageType || holiday?.type || holiday?.shift || holiday?.mode, !!holiday?.empId);
}

function isNoDutyHoliday(holiday) {
    return holidayDutyType(holiday) === 'Holiday';
}

function scheduleEndForWeek(weekStart) {
    const weekEnd = addDays(weekStart, 6);
    return holidayDuties.reduce((displayEnd, holiday) => {
        if (!isNoDutyHoliday(holiday)) return displayEnd;
        const range = holidayDateRange(holiday);
        if (!range || !dateRangesOverlap(weekStart, weekEnd, range.start, range.end)) return displayEnd;
        return range.end > displayEnd ? range.end : displayEnd;
    }, weekEnd);
}

function datesBetween(start, end) {
    const dates = [];
    for (let cursor = new Date(start); cursor <= end; cursor = addDays(cursor, 1)) {
        dates.push(new Date(cursor));
    }
    return dates;
}

function holidayShiftForEmployee(emp, date) {
    const duty = holidayDuties.find(holiday => isDateInRange(date, holiday.start, holiday.end) && matchesEmployee(holiday, emp));
    if (!duty) return '';
    const dutyType = holidayDutyType(duty);
    if (dutyType === 'OnCall') return 'OnCall';
    if (dutyType === 'Work') return 'Work';
    return 'Holiday';
}

function isAssignedHolidayEmployee(emp, holiday) {
    return !!holiday && matchesEmployee(holiday, emp);
}

function employeeIdsForOverrides(emp) {
    return [
        employeePrimaryKey(emp),
        emp?.id,
        emp?.empNum,
        emp?.empId,
        emp?.employeeId,
        emp?.technicianId,
        emp?.email,
        ...(Array.isArray(emp?.aliasIds) ? emp.aliasIds : [])
    ]
        .filter(Boolean)
        .map(value => String(value).trim())
        .filter((value, index, list) => list.indexOf(value) === index);
}

function manualShiftForEmployee(emp, dateString) {
    return employeeIdsForOverrides(emp)
        .map(id => overrides[`${id}_${dateString}`])
        .find(Boolean) || '';
}

function isManualUnavailable(emp, date) {
    const shift = manualShiftForEmployee(emp, formatLocalDate(date));
    return shift === 'Vacation' || shift === 'Sick' || shift === 'Absent';
}

function isUnavailable(emp, date) {
    const holiday = publicHolidayForDate(date);
    return emp.active === false || isVacationDay(emp, date) || (holiday && !!holidayShiftForEmployee(emp, date)) || isManualUnavailable(emp, date);
}

function weekIndex(start) {
    const first = new Date(start.getFullYear(), 0, 1);
    first.setHours(0, 0, 0, 0);
    first.setDate(first.getDate() - first.getDay());
    return Math.floor((start - first) / 604800000);
}

function findDateByDay(dates, day) {
    return dates.find(date => date.getDay() === day);
}

function pickRotationEmployee(pool, start, datesToCheck) {
    if (!pool.length) return null;
    const ordered = [...pool].sort((a, b) => String(a.empNum || a.name || a.id).localeCompare(String(b.empNum || b.name || b.id), 'ar'));
    const startIndex = weekIndex(start) % ordered.length;
    for (let i = 0; i < ordered.length; i++) {
        const emp = ordered[(startIndex + i) % ordered.length];
        if (!datesToCheck.some(date => isUnavailable(emp, date))) return emp;
    }
    return null;
}

function baseShift(emp, date, rotations) {
    const nightShift = isNightShiftEmployeeOnDate(emp, date);
    if (date.getDay() === 4) {
        if (rotations.thu?.id === emp.id) return 'Off';
        return nightShift ? 'Night' : 'Morning';
    }
    if (date.getDay() === 5) {
        if (rotations.thu?.id === emp.id) return 'Off';
        if (rotations.fri?.id === emp.id) return 'OnCall';
        return 'Off';
    }
    if (date.getDay() === 6) {
        if (rotations.thu?.id === emp.id) return 'Work';
        return 'Off';
    }
    return nightShift ? 'Night' : 'Morning';
}

function normalizeJobKey(value) {
    return String(value || '')
        .trim()
        .toLowerCase()
        .replace(/[إأآا]/g, 'ا')
        .replace(/[ىي]/g, 'ي')
        .replace(/[ة]/g, 'ه')
        .replace(/[()\[\]{}.:،؛]/g, '')
        .replace(/[\s_\-\/\\]+/g, '');
}

function isShiftLikeJobValue(value) {
    const key = normalizeJobKey(value);
    return [
        'morning', 'night', 'fixed', 'variable', 'shift', 'shifting',
        'active', 'inactive', 'hidden', 'morningvariable', 'none',
        'صباحي', 'ليلي', 'مناوبه', 'دوام', 'نشط', 'غيرنشط'
    ].includes(key);
}

function findEmployeeRecord(emp) {
    const keys = new Set(getEmployeeKeys(emp));
    return employeeRecords.find(record => getEmployeeKeys(record).some(key => keys.has(key))) || null;
}

function employeeJobValue(emp) {
    const record = findEmployeeRecord(emp);
    const directCandidates = [
        emp?.jobTitle, emp?.jobTitleAr, emp?.jobTitleEn, emp?.position, emp?.title, emp?.designation,
        record?.jobTitle, record?.jobTitleAr, record?.jobTitleEn, record?.position, record?.title, record?.designation
    ];
    const roleCandidates = [emp?.role, record?.role].filter(value => value && !isShiftLikeJobValue(value));
    const candidates = [...directCandidates, ...roleCandidates].filter(Boolean);
    return candidates.find(value => weeklyJobRankValue(value) < 99) || candidates[0] || '';
}

function weeklyJobRankValue(value) {
    const key = normalizeJobKey(value);
    if (!key) return 99;
    if (['الفني', 'فني', 'فنى', 'technician', 'tech', 'employee', 'user'].includes(key)) return 1;
    if (['المشرف', 'مشرف', 'supervisor', 'superviser', 'lead', 'leader'].includes(key)) return 2;
    if (['التمهير', 'تمهير', 'tamheer'].includes(key)) return 3;
    if (['المتدرب', 'متدرب', 'trainee', 'intern', 'internship', 'student'].includes(key)) return 4;
    if (['المدير', 'مدير', 'manager', 'admin', 'administrator'].includes(key)) return 5;
    return 99;
}

function weeklyJobRank(emp) {
    return weeklyJobRankValue(employeeJobValue(emp));
}

function employeeSortKey(emp) {
    return String(emp?.empNum || emp?.name || emp?.id || '').trim();
}

function isNightShiftEmployee(emp) {
    const record = findEmployeeRecord(emp) || {};
    if (typeof emp?.fixed === 'boolean') return emp.fixed;
    if (typeof record?.fixed === 'boolean') return record.fixed;
    const values = [emp?.shiftType, record?.shiftType, emp?.shift, record?.shift, emp?.role, record?.role]
        .map(value => String(value ?? '').trim().toLowerCase());
    return values.includes('night') || values.includes('fixed') || values.includes('ليلي');
}


function isNightShiftEmployeeOnDate(emp, date) {
    const record = findEmployeeRecord(emp) || {};
    const history = mergeWeeklyShiftHistories(emp, record);
    if (!history.length) return isNightShiftEmployee(emp);
    const dateKey = formatLocalDate(date);
    const applicable = history.filter(item => item.effectiveFrom <= dateKey);
    const state = applicable.length ? applicable[applicable.length - 1] : history[0];
    return state.fixed === true;
}

function weeklyManualOrder(emp) {
    const record = findEmployeeRecord(emp) || {};
    const value = emp?.weeklyOrder ?? emp?.scheduleOrder ?? emp?.sortOrder ?? record?.weeklyOrder ?? record?.scheduleOrder ?? record?.sortOrder;
    const number = Number(value);
    return Number.isFinite(number) && number > 0 ? number : 9999;
}

// ترتيب الموظفين: شفت الليل أولاً، ثم الترتيب اليدوي، ثم Job Title، ثم الرقم/الاسم.
function sortWeeklyEmployees(list) {
    return [...list].sort((a, b) => {
        const nightDiff = Number(!isNightShiftEmployee(a)) - Number(!isNightShiftEmployee(b));
        if (nightDiff) return nightDiff;

        const manualDiff = weeklyManualOrder(a) - weeklyManualOrder(b);
        if (manualDiff) return manualDiff;

        const rankDiff = weeklyJobRank(a) - weeklyJobRank(b);
        if (rankDiff) return rankDiff;

        return employeeSortKey(a).localeCompare(employeeSortKey(b), currentLang === 'ar' ? 'ar' : 'en', { numeric: true, sensitivity: 'base' });
    });
}

async function renderTable() {
    window.updateLabels();
    const t = i18n[currentLang];
    const dateInput = $('datePicker').value; if(!dateInput) return;
    const start = startOfWeek(parseLocalDate(dateInput));
    const normalizedStart = formatLocalDate(start);
    if ($('datePicker').value !== normalizedStart) $('datePicker').value = normalizedStart;
    const dates = datesBetween(start, scheduleEndForWeek(start));
    $('weekRangeText').textContent = t.range(formatDisplayDate(dates[0]), formatDisplayDate(dates[dates.length - 1]));
    const thuDate = findDateByDay(dates, 4);
    const friDate = findDateByDay(dates, 5);
    const satDate = findDateByDay(dates, 6);
    const activeEmps = sortWeeklyEmployees(dedupeWeeklyEmployees(emps).filter(e => e.active !== false));
    const rotations = {
        thu: pickRotationEmployee(activeEmps.filter(e => normalizeRotation(e) === 'thu'), start, [thuDate, friDate, satDate].filter(Boolean)),
        fri: pickRotationEmployee(activeEmps.filter(e => normalizeRotation(e) === 'fri'), start, [friDate, satDate].filter(Boolean))
    };
    
    let headHtml = `<th class="emp-name">${t.employee}</th>`;
    dates.forEach(d => {
        headHtml += `<th>${t.days[d.getDay()]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
    });
    $('tableHead').innerHTML = headHtml;

    $('tableBody').innerHTML = activeEmps.map(emp => {
        let row = `<td class="emp-name">${escapeHtml(emp.name)}</td>`;
        dates.forEach(d => {
            const dStr = formatLocalDate(d);
            const manualShift = manualShiftForEmployee(emp, dStr);
            const publicHoliday = publicHolidayForDate(d);
            const holidayShift = publicHoliday ? holidayShiftForEmployee(emp, d) : '';
            const leaveShift = leaveShiftForEmployee(emp, d);
            let shift = leaveShift || (manualShift || (publicHoliday ? (holidayShift || 'Holiday') : baseShift(emp, d, rotations)));
            const icons = { Morning:'☀️', Night:'🌙', Vacation:'', Sick:'🏥', Holiday:'🎊', Absent:'🚫', OnCall:'📞', Work:'🏢', Off:'⌛' };
            const icon = icons[shift] || '';
            const label = t[shift.toLowerCase()] || shift;
            row += `<td><div class="schedule-badge ${shift}" onclick="window.openDialog('${safeJs(employeePrimaryKey(emp))}','${dStr}','${safeJs(emp.name)}','${shift}')">${icon ? `${icon} ` : ''}${label}</div></td>`;
        });
        return `<tr>${row}</tr>`;
    }).join('');
}

window.openDialog = (empId, date, name, current) => {
    selectedCell = { empId, date }; selectedOption = current;
    const t = i18n[currentLang];
    $('dialogTitle').innerHTML = `<div style="font-size:16px">${escapeHtml(name)}</div><div style="font-size:11px; opacity:0.6">${escapeHtml(date)}</div>`;
    const opts = ['Morning', 'Night', 'OnCall', 'Work', 'Vacation', 'Sick', 'Holiday', 'Absent', 'Off'];
    $('shiftOptions').innerHTML = opts.map(o => `<div class="opt-btn ${selectedOption === o ? 'active' : ''}" onclick="window.selectOpt('${o}')">${t[o.toLowerCase()]}</div>`).join('');
    $('shiftOverlay').style.display = 'flex';
};

window.selectOpt = (id) => {
    selectedOption = id;
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
};

window.saveOverride = async () => {
    await waitForSignedInUser();
    overrides[`${selectedCell.empId}_${selectedCell.date}`] = selectedOption;
    await setDoc(doc(db, 'schedule', 'manual_overrides'), overrides);
    window.closeDialog();
};

window.closeDialog = () => $('shiftOverlay').style.display = 'none';

function downloadCanvas(canvas) {
    const a = document.createElement('a');
    const start = $('datePicker').value || new Date().toISOString().slice(0, 10);
    a.download = `Weekly_Schedule_${start}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
}

async function copyScheduleImage() {
    const t = i18n[currentLang];
    if (!window.html2canvas) {
        alert(t.copyFailed);
        return;
    }

    try {
        const canvas = await html2canvas($('scheduleCapture'), {
            backgroundColor: '#ffffff',
            scale: 2,
            useCORS: true
        });

        canvas.toBlob(async blob => {
            if (!blob) {
                alert(t.copyFailed);
                return;
            }

            try {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                alert(t.copied);
            } catch (error) {
                downloadCanvas(canvas);
                alert(t.downloaded);
            }
        }, 'image/png');
    } catch (error) {
        console.error(error);
        alert(t.copyFailed);
    }
}


function reportShiftLabel(shift) {
    const t = i18n[currentLang];
    return t[String(shift || '').toLowerCase()] || String(shift || '');
}

function shiftCountsAsConfirmedWork(shift) {
    return ['Morning', 'Night', 'Work'].includes(String(shift || ''));
}

function shiftShowsWeeklyRest(shift) {
    return ['Off', 'Holiday'].includes(String(shift || ''));
}

function activeWeeklyEmployees() {
    return sortWeeklyEmployees(dedupeWeeklyEmployees(emps).filter(e => e.active !== false));
}

function rotationsForWeek(weekStart) {
    const dates = datesBetween(weekStart, addDays(weekStart, 6));
    const thuDate = findDateByDay(dates, 4);
    const friDate = findDateByDay(dates, 5);
    const satDate = findDateByDay(dates, 6);
    const activeEmps = activeWeeklyEmployees();
    return {
        thu: pickRotationEmployee(activeEmps.filter(e => normalizeRotation(e) === 'thu'), weekStart, [thuDate, friDate, satDate].filter(Boolean)),
        fri: pickRotationEmployee(activeEmps.filter(e => normalizeRotation(e) === 'fri'), weekStart, [friDate, satDate].filter(Boolean))
    };
}

function resolveEmployeeShift(emp, date) {
    const dStr = formatLocalDate(date);
    const manualShift = manualShiftForEmployee(emp, dStr);
    const publicHoliday = publicHolidayForDate(date);
    const holidayShift = publicHoliday ? holidayShiftForEmployee(emp, date) : '';
    const leaveShift = leaveShiftForEmployee(emp, date);
    const rotations = rotationsForWeek(startOfWeek(date));
    return leaveShift || (manualShift || (publicHoliday ? (holidayShift || 'Holiday') : baseShift(emp, date, rotations)));
}

function renderMonthlyReportEmployeeOptions() {
    const select = $('reportEmployeeSelect');
    if (!select) return;
    const current = select.value;
    const t = i18n[currentLang];
    const rows = activeWeeklyEmployees();
    select.innerHTML = `<option value="">${escapeHtml(t.selectEmployee)}</option>` + rows.map(emp => {
        const key = employeePrimaryKey(emp);
        const label = emp.empNum ? `${emp.name} - ${emp.empNum}` : emp.name;
        return `<option value="${escapeHtml(key)}">${escapeHtml(label)}</option>`;
    }).join('');
    if (rows.some(emp => employeePrimaryKey(emp) === current)) select.value = current;
}

function findReportEmployee(key) {
    const normalized = String(key || '').trim().toLowerCase();
    return activeWeeklyEmployees().find(emp => employeeIdsForOverrides(emp).some(value => String(value).trim().toLowerCase() === normalized)) || null;
}

function monthBounds(monthValue) {
    const match = String(monthValue || '').match(/^(\d{4})-(\d{2})$/);
    if (!match) return null;
    const year = Number(match[1]);
    const month = Number(match[2]) - 1;
    return { start: new Date(year, month, 1), end: new Date(year, month + 1, 0) };
}

function reportPeriodBounds() {
    const mode = $('reportPeriodType')?.value || 'month';
    if (mode === 'range') {
        const fromValue = $('reportFromInput')?.value || '';
        const toValue = $('reportToInput')?.value || '';
        if (!fromValue || !toValue) return null;
        const start = parseLocalDate(fromValue);
        const end = parseLocalDate(toValue);
        if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || start > end) return null;
        return { start, end, mode };
    }
    const month = monthBounds($('reportMonthInput')?.value || '');
    return month ? { ...month, mode } : null;
}

function reportPeriodDisplay(bounds) {
    if (!bounds) return '';
    if (bounds.mode === 'month') return reportMonthLabel(bounds.start);
    const t = i18n[currentLang];
    return t.range(formatDisplayDate(bounds.start), formatDisplayDate(bounds.end));
}

function updateReportPeriodControls() {
    const mode = $('reportPeriodType')?.value || 'month';
    const monthField = $('reportMonthField');
    const fromField = $('reportFromField');
    const toField = $('reportToField');
    if (monthField) monthField.hidden = mode !== 'month';
    if (fromField) fromField.hidden = mode !== 'range';
    if (toField) toField.hidden = mode !== 'range';
    $('monthlyReportCapture').style.display = 'none';
    $('monthlyReportActions').style.display = 'none';
}

function monthlyEmployeeRows(emp, start, end) {
    return datesBetween(start, end).map(date => {
        const shift = resolveEmployeeShift(emp, date);
        return { date, shift, confirmedWork: shiftCountsAsConfirmedWork(shift), weeklyRest: shiftShowsWeeklyRest(shift) };
    });
}

function maxConsecutiveConfirmedWork(rows) {
    let current = 0, maximum = 0;
    rows.forEach(row => {
        current = row.confirmedWork ? current + 1 : 0;
        maximum = Math.max(maximum, current);
    });
    return maximum;
}

function weeklyComplianceRows(emp, monthStart, monthEnd) {
    const weeks = [];
    let cursor = startOfWeek(monthStart);
    const lastWeek = startOfWeek(monthEnd);
    while (cursor <= lastWeek) {
        const start = new Date(cursor);
        const end = addDays(start, 6);
        const rows = monthlyEmployeeRows(emp, start, end);
        const workDays = rows.filter(row => row.confirmedWork).length;
        const onCallDays = rows.filter(row => row.shift === 'OnCall').length;
        const restDays = rows.filter(row => row.weeklyRest).length;
        const maxConsecutive = maxConsecutiveConfirmedWork(rows);
        const level = maxConsecutive >= 7 ? 'risk' : (restDays < 1 ? 'review' : 'ok');
        weeks.push({ start, end, workDays, onCallDays, restDays, maxConsecutive, level });
        cursor = addDays(cursor, 7);
    }
    return weeks;
}

function monthlyReportSummary(rows) {
    const count = shift => rows.filter(row => row.shift === shift).length;
    const workDays = rows.filter(row => row.confirmedWork).length;
    const onCallDays = count('OnCall');
    return {
        workDays,
        onCallDays,
        dutyAssignments: workDays + onCallDays,
        offDays: count('Off'),
        vacationDays: count('Vacation'),
        sickDays: count('Sick'),
        absentDays: count('Absent'),
        holidayDays: count('Holiday'),
        maxConsecutive: maxConsecutiveConfirmedWork(rows)
    };
}

function reportDayName(date) {
    return i18n[currentLang].days[date.getDay()];
}

function reportMonthLabel(start) {
    return start.toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US', { year: 'numeric', month: 'long' });
}

function complianceOverall(summary, weeks) {
    if (summary.maxConsecutive >= 7 || weeks.some(item => item.level === 'risk')) return 'risk';
    if (weeks.some(item => item.level === 'review')) return 'review';
    return 'ok';
}

function complianceText(level) {
    const t = i18n[currentLang];
    return level === 'risk' ? t.complianceRisk : (level === 'review' ? t.complianceReview : t.complianceOk);
}

function renderMonthlyEmployeeReport() {
    const employeeKey = $('reportEmployeeSelect').value;
    const bounds = reportPeriodBounds();
    const t = i18n[currentLang];
    if (!employeeKey || !bounds) {
        alert(t.reportRequired);
        return;
    }
    const emp = findReportEmployee(employeeKey);
    if (!emp) {
        alert(t.reportRequired);
        return;
    }

    const rows = monthlyEmployeeRows(emp, bounds.start, bounds.end);
    const summary = monthlyReportSummary(rows);
    const weeks = weeklyComplianceRows(emp, bounds.start, bounds.end);
    const level = complianceOverall(summary, weeks);
    const levelClass = level === 'risk' ? 'compliance-risk' : (level === 'review' ? 'compliance-review' : 'compliance-ok');
    const empRecord = findEmployeeRecord(emp) || emp;
    const capture = $('monthlyReportCapture');

    const stat = (label, value) => `<div class="report-stat"><div class="report-stat-label">${escapeHtml(label)}</div><div class="report-stat-value">${escapeHtml(value)}</div></div>`;
    const meta = (label, value) => `<div class="report-meta-box"><div class="report-meta-label">${escapeHtml(label)}</div><div class="report-meta-value">${escapeHtml(value || '-')}</div></div>`;

    const dailyRows = rows.map(row => `<tr>
        <td>${escapeHtml(formatDisplayDate(row.date))}</td>
        <td>${escapeHtml(reportDayName(row.date))}</td>
        <td class="status-cell">${escapeHtml(reportShiftLabel(row.shift))}</td>
        <td>${escapeHtml(row.confirmedWork ? t.definiteWork : t.nonWork)}</td>
    </tr>`).join('');

    const weeklyRows = weeks.map(item => {
        const statusText = item.level === 'risk' ? t.risk : (item.level === 'review' ? t.review : t.ok);
        const cls = item.level === 'risk' ? 'weekly-risk' : (item.level === 'review' ? 'weekly-review' : 'weekly-ok');
        return `<tr>
            <td>${escapeHtml(formatDisplayDate(item.start))} - ${escapeHtml(formatDisplayDate(item.end))}</td>
            <td>${item.workDays}</td>
            <td>${item.onCallDays}</td>
            <td>${item.restDays ? t.yes : t.no}</td>
            <td>${item.maxConsecutive}</td>
            <td class="${cls}">${escapeHtml(statusText)}</td>
        </tr>`;
    }).join('');

    capture.innerHTML = `
        <div class="report-brand">
            <div class="report-brand-left">
                <img src="LOGO-almajdouie.png" alt="Almajdouie Motors" />
                <div><div class="report-main-title">${escapeHtml(t.monthlyReport)}</div><div class="report-subtitle">${escapeHtml(reportPeriodDisplay(bounds))}</div></div>
            </div>
            <div class="report-subtitle">${escapeHtml(t.generated)}: ${escapeHtml(new Date().toLocaleString('en-GB'))}</div>
        </div>
        <div class="report-employee-meta">
            ${meta(t.employee, emp.name)}
            ${meta(t.employeeId, emp.empNum || emp.empId || employeePrimaryKey(emp))}
            ${meta(t.reportPeriod, reportPeriodDisplay(bounds))}
            ${meta(t.department, emp.dept || emp.department || empRecord.dept || empRecord.department)}
            ${meta(t.jobTitle, employeeJobValue(emp))}
        </div>
        <div class="report-stats">
            ${stat(t.scheduledWorkDays, summary.workDays)}
            ${stat(t.onCallDays, summary.onCallDays)}
            ${stat(t.dutyAssignments, summary.dutyAssignments)}
            ${stat(t.offDays, summary.offDays)}
            ${stat(t.maxConsecutive, summary.maxConsecutive)}
            ${stat(t.leaveDays, summary.vacationDays)}
            ${stat(t.sickDays, summary.sickDays)}
            ${stat(t.absentDays, summary.absentDays)}
            ${stat(t.holidayDays, summary.holidayDays)}
        </div>
        <div class="compliance-box">
            <div class="compliance-title ${levelClass}">${escapeHtml(t.complianceTitle)}</div>
            <div class="compliance-line ${levelClass}">${escapeHtml(complianceText(level))}</div>
            <div class="compliance-line">${escapeHtml(t.onCallNote)}</div>
            <div class="compliance-line">${escapeHtml(t.hoursNotChecked)}</div>
        </div>
        <div class="report-table-wrap">
            <div class="compliance-title">${escapeHtml(t.weeklyCheck)}</div>
            <table class="report-table"><thead><tr>
                <th>${escapeHtml(t.week)}</th><th>${escapeHtml(t.workDays)}</th><th>${escapeHtml(t.oncall)}</th><th>${escapeHtml(t.restShown)}</th><th>${escapeHtml(t.maxConsecutive)}</th><th>${escapeHtml(t.result)}</th>
            </tr></thead><tbody>${weeklyRows}</tbody></table>
        </div>
        <div class="report-table-wrap">
            <div class="compliance-title">${escapeHtml(t.dailyDetails)}</div>
            <table class="report-table"><thead><tr>
                <th>${escapeHtml(t.date)}</th><th>${escapeHtml(t.day)}</th><th>${escapeHtml(t.shift)}</th><th>${escapeHtml(t.classification)}</th>
            </tr></thead><tbody>${dailyRows}</tbody></table>
        </div>
        <div class="report-footnote">${escapeHtml(t.legalNote)}</div>
    `;
    capture.style.display = 'block';
    $('monthlyReportActions').style.display = 'flex';
}

async function monthlyReportCanvas() {
    const capture = $('monthlyReportCapture');
    const t = i18n[currentLang];
    if (!capture || capture.style.display === 'none' || !capture.innerHTML.trim()) throw new Error(t.reportRequired);
    if (!window.html2canvas) throw new Error(t.reportExportFailed);
    return await html2canvas(capture, { backgroundColor: '#ffffff', scale: 2, useCORS: true, windowWidth: Math.max(capture.scrollWidth, 1100) });
}

function monthlyReportFilename(ext) {
    const employee = findReportEmployee($('reportEmployeeSelect').value);
    const bounds = reportPeriodBounds();
    const period = bounds ? `${formatLocalDate(bounds.start)}_to_${formatLocalDate(bounds.end)}` : formatLocalDate(new Date());
    const key = String(employee?.empNum || employee?.name || 'Employee').replace(/[^a-zA-Z0-9_-]+/g, '_');
    return `Employee_Duty_Report_${key}_${period}.${ext}`;
}

async function copyMonthlyReportImage() {
    const t = i18n[currentLang];
    try {
        const canvas = await monthlyReportCanvas();
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('png-blob-failed');
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        alert(t.reportCopied);
    } catch (error) {
        console.error(error);
        alert(`${t.reportExportFailed}: ${error?.message || error}`);
    }
}

async function downloadMonthlyReportPng() {
    const t = i18n[currentLang];
    try {
        const canvas = await monthlyReportCanvas();
        const a = document.createElement('a');
        a.download = monthlyReportFilename('png');
        a.href = canvas.toDataURL('image/png');
        a.click();
    } catch (error) {
        console.error(error);
        alert(`${t.reportExportFailed}: ${error?.message || error}`);
    }
}

async function downloadMonthlyReportPdf() {
    const t = i18n[currentLang];
    try {
        const canvas = await monthlyReportCanvas();
        if (!window.jspdf?.jsPDF) throw new Error('jsPDF library not loaded');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
        const margin = 7;
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const usableWidth = pageWidth - margin * 2;
        const usableHeight = pageHeight - margin * 2;
        const imgData = canvas.toDataURL('image/jpeg', 0.93);
        const imgHeight = canvas.height * usableWidth / canvas.width;
        let offset = 0;
        pdf.addImage(imgData, 'JPEG', margin, margin, usableWidth, imgHeight, undefined, 'FAST');
        offset += usableHeight;
        while (offset < imgHeight) {
            pdf.addPage();
            pdf.addImage(imgData, 'JPEG', margin, margin - offset, usableWidth, imgHeight, undefined, 'FAST');
            offset += usableHeight;
        }
        pdf.save(monthlyReportFilename('pdf'));
    } catch (error) {
        console.error(error);
        alert(`${t.reportExportFailed}: ${error?.message || error}`);
    }
}

function printMonthlyReport() {
    const capture = $('monthlyReportCapture');
    if (!capture || capture.style.display === 'none') {
        alert(i18n[currentLang].reportRequired);
        return;
    }
    window.print();
}

function updateMonthlyReportLabels() {
    const t = i18n[currentLang];
    if (!$('monthlyReportSectionTitle')) return;
    $('monthlyReportSectionTitle').textContent = `📊 ${t.monthlyReport}`;
    $('reportEmployeeLabel').textContent = t.reportEmployee;
    $('reportPeriodTypeLabel').textContent = t.reportPeriodType;
    $('reportMonthLabel').textContent = t.reportMonth;
    $('reportFromLabel').textContent = t.reportFrom;
    $('reportToLabel').textContent = t.reportTo;
    const periodType = $('reportPeriodType');
    if (periodType) {
        const currentMode = periodType.value || 'month';
        periodType.innerHTML = `<option value="month">${escapeHtml(t.periodMonthly)}</option><option value="range">${escapeHtml(t.periodRange)}</option>`;
        periodType.value = currentMode;
    }
    $('btnGenerateMonthlyReport').textContent = t.generateReport;
    $('btnCopyMonthlyReport').textContent = `📋 ${t.copyReport}`;
    $('btnDownloadMonthlyPng').textContent = `🖼️ ${t.downloadPng}`;
    $('btnDownloadMonthlyPdf').textContent = `📄 ${t.downloadPdf}`;
    $('btnPrintMonthlyReport').textContent = `🖨️ ${t.printReport}`;

}

$('btnPrev').onclick = () => { const p = $('datePicker'); const d = startOfWeek(parseLocalDate(p.value)); d.setDate(d.getDate()-7); p.value = formatLocalDate(d); renderTable(); };
$('btnNext').onclick = () => { const p = $('datePicker'); const d = startOfWeek(parseLocalDate(p.value)); d.setDate(d.getDate()+7); p.value = formatLocalDate(d); renderTable(); };
$('btnToday').onclick = () => { $('datePicker').value = formatLocalDate(startOfWeek(new Date())); renderTable(); };
$('btnToggleLang').onclick = () => { currentLang = currentLang==='ar'?'en':'ar'; localStorage.setItem('lang', currentLang); renderTable(); updateMonthlyReportLabels(); if ($('monthlyReportCapture')?.style.display !== 'none' && $('reportEmployeeSelect')?.value && reportPeriodBounds()) renderMonthlyEmployeeReport(); };
$('btnCopyImage').onclick = copyScheduleImage;
$('datePicker').onchange = renderTable;
$('reportPeriodType').onchange = updateReportPeriodControls;
$('btnGenerateMonthlyReport').onclick = renderMonthlyEmployeeReport;
$('btnCopyMonthlyReport').onclick = copyMonthlyReportImage;
$('btnDownloadMonthlyPng').onclick = downloadMonthlyReportPng;
$('btnDownloadMonthlyPdf').onclick = downloadMonthlyReportPdf;
$('btnPrintMonthlyReport').onclick = printMonthlyReport;

async function bindSnapshots() {
    await waitForSignedInUser();
    onSnapshot(collection(db, 'employees'), s => {
        employeeRecords = s.docs.map(item => normalizeEmployeeRecord({ id: item.id, ...item.data() }));
        emps = dedupeWeeklyEmployees(employeeRecords);
        renderTable();
        renderMonthlyReportEmployeeOptions();
    }, e => logFirebaseError('Weekly schedule employees collection listener failed', e));
    onSnapshot(doc(db, 'schedule', 'jadwal_holidays'), s => { holidayDuties = s.exists() ? (s.data().duties || []) : []; renderTable(); }, e => logFirebaseError('Weekly schedule public holidays listener failed', e));
    onSnapshot(doc(db, 'schedule', 'manual_overrides'), s => { overrides = s.data() || {}; renderTable(); }, e => logFirebaseError('Weekly schedule overrides listener failed', e));
    onSnapshot(doc(db, 'schedule', 'jadwal_annual_leave'), s => { annualLeaves = s.exists() ? (s.data().vacations || []) : []; renderTable(); }, e => logFirebaseError('Weekly schedule annual leave listener failed', e));
    onSnapshot(collection(db, 'vacations'), s => { vacationPlans = s.docs.map(item => ({ id: item.id, ...item.data() })); renderTable(); }, e => logFirebaseError('Weekly schedule vacation plans listener failed', e));
    onSnapshot(doc(db, 'schedule', 'shift_settings'), s => { shiftSettings = s.exists() ? ({ ...shiftSettings, ...s.data() }) : shiftSettings; renderTable(); }, e => logFirebaseError('Weekly schedule shift settings listener failed', e));
}

window.onload = () => {
    $('datePicker').value = formatLocalDate(startOfWeek(new Date()));
    $('reportMonthInput').value = formatLocalDate(new Date()).slice(0, 7);
    const today = new Date();
    $('reportFromInput').value = formatLocalDate(new Date(today.getFullYear(), today.getMonth(), 1));
    $('reportToInput').value = formatLocalDate(new Date(today.getFullYear(), today.getMonth() + 1, 0));
    updateMonthlyReportLabels();
    updateReportPeriodControls();
    renderTable();
    bindSnapshots().catch(e => logFirebaseError('Weekly schedule startup failed', e));
};
