<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Schedule v1.1.0 - Almajdouie Motors</title>
  <style>
    :root {
      --primary: #0d2149;
      --primary2: #1b4fa3;
      --morning-bg: #e0f2fe; --morning-t: #0369a1;
      --night-bg: #f3e8ff; --night-t: #7e22ce;
      --oncall-bg: #ecfeff; --oncall-t: #0e7490;
      --off-bg: #f1f5f9; --off-t: #475569;
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    body { margin: 0; padding: 15px; font-family: 'Segoe UI', sans-serif; background: transparent; }
    .container { background: #fff; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid #eee; }
    
    /* Toolbar Style */
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    .nav-group { display: flex; gap: 8px; }
    .btn-nav { padding: 10px 15px; border-radius: 10px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; font-weight: 800; font-size: 13px; transition: 0.2s; color: var(--primary); }
    .btn-nav:hover { background: #f8fafc; border-color: var(--primary2); }
    input[type="date"] { padding: 10px; border-radius: 10px; border: 1px solid #ddd; font-weight: bold; }

    /* Legend */
    .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; padding: 12px; background: #f8fafc; border-radius: 15px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; }

    /* Table */
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 12px; }
    th { padding: 12px; color: var(--primary); font-weight: 900; text-align: center; border-bottom: 2px solid #f1f5f9; }
    td { padding: 10px; text-align: center; background: #fff; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
    .emp-name { text-align: right !important; padding-right: 15px; font-weight: 900; color: var(--primary); border-right: 1px solid #f1f5f9; border-radius: 0 12px 12px 0; }

    .badge {
      border-radius: 999px; padding: 7px 12px; font-size: 10px; font-weight: 800;
      display: inline-flex; align-items: center; gap: 5px; width: 100%; max-width: 110px;
      justify-content: center; cursor: pointer; transition: 0.2s; border: 1px solid rgba(0,0,0,0.02);
    }
    .Morning { background: var(--morning-bg); color: var(--morning-t); }
    .Night { background: var(--night-bg); color: var(--night-t); }
    .OnCall { background: var(--oncall-bg); color: var(--oncall-t); }
    .Off { background: var(--off-bg); color: var(--off-t); }

    /* Overlay */
    .overlay { position: fixed; inset: 0; background: rgba(10,23,55,0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .dialog { background: #fff; width: 90%; max-width: 400px; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
    .opt-btn { padding: 12px; border-radius: 10px; border: 1px solid #eee; background: #fff; cursor: pointer; font-weight: 800; text-align: center; margin-bottom: 8px; }
    .opt-btn.active { border-color: var(--primary2); background: var(--morning-bg); }
  </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <div class="nav-group">
            <button class="btn-nav" id="btnPrev">السابق</button>
            <button class="btn-nav" id="btnToday">الحالي</button>
            <button class="btn-nav" id="btnNext">التالي</button>
        </div>
        <div style="display:flex; gap:10px; align-items:center">
            <input type="date" id="datePicker" />
            <button class="btn-nav" id="btnToggleLang">AR/EN</button>
        </div>
    </div>

    <div class="legend" id="legendArea"></div>

    <div style="overflow-x:auto">
        <table id="scheduleTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div class="overlay" id="shiftOverlay">
    <div class="dialog">
        <div style="padding:15px; background:#f8fafc; font-weight:900; color:var(--primary); border-bottom:1px solid #eee" id="dialogTitle"></div>
        <div style="padding:20px;">
            <div id="shiftOptions"></div>
            <button onclick="window.saveOverride()" style="width:100%; padding:12px; border-radius:10px; background:var(--primary); color:#fff; border:none; font-weight:800; cursor:pointer; margin-top:15px">حفظ</button>
            <button onclick="window.closeDialog()" style="width:100%; padding:12px; margin-top:8px; background:none; border:none; color:var(--muted); font-weight:800; cursor:pointer">إغلاق</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, onSnapshot, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

const i18n = {
    ar: { prev:'الأسبوع السابق', today:'اليوم/الحالي', next:'الأسبوع التالي', morning:'صباحي', night:'ليلي', oncall:'أون كول', off:'أوف', employee:'الموظف', days:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'] },
    en: { prev:'Prev Week', today:'Today/Current', next:'Next Week', morning:'Morning', night:'Night', oncall:'On Call', off:'Off', employee:'Employee', days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] }
};

let emps = [], overrides = {}, currentLang = localStorage.getItem('lang') || 'ar', selectedCell = null, selectedOption = null;
const $ = id => document.getElementById(id);

// --- Navigation Logic ---
window.navigateWeek = (days) => {
    const picker = $('datePicker');
    const current = new Date(picker.value.replace(/-/g, '/'));
    current.setDate(current.getDate() + days);
    picker.value = current.toISOString().split('T')[0];
    renderTable();
};

window.setToday = () => {
    const d = new Date(); d.setDate(d.getDate() - d.getDay()); // Reset to Sunday
    $('datePicker').value = d.toISOString().split('T')[0];
    renderTable();
};

// --- Language Engine ---
window.updateLabels = () => {
    const t = i18n[currentLang];
    $('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    $('btnPrev').innerText = t.prev; $('btnToday').innerText = t.today; $('btnNext').innerText = t.next;
    $('legendArea').innerHTML = `
        <div class="legend-item"><span class="badge Morning">☀️ ${t.morning}</span> 07:30-17:00</div>
        <div class="legend-item"><span class="badge Night">🌙 ${t.night}</span> 13:00-22:00</div>
        <div class="legend-item"><span class="badge Off">⌛ ${t.off}</span> طوال اليوم</div>
    `;
};

// --- Rendering ---
async function renderTable() {
    window.updateLabels();
    const t = i18n[currentLang];
    const dateInput = $('datePicker').value;
    if(!dateInput) return;
    const start = new Date(dateInput.replace(/-/g, '/'));
    
    let headHtml = `<th>${t.employee}</th>`;
    for(let i=0; i<7; i++) {
        const d = new Date(start.getTime() + i*86400000);
        headHtml += `<th>${t.days[d.getDay()]}<br><small style="opacity:0.6">${d.toLocaleDateString('en-GB')}</small></th>`;
    }
    $('tableHead').innerHTML = headHtml;

    $('tableBody').innerHTML = emps.filter(e => e.active).map(emp => {
        let row = `<td class="emp-name">${emp.name}</td>`;
        for(let i=0; i<7; i++) {
            const d = new Date(start.getTime() + i*86400000);
            const dStr = d.toISOString().split('T')[0];
            let shift = overrides[`${emp.id}_${dStr}`] || ((d.getDay() === 5 || d.getDay() === 6) ? 'Off' : (emp.fixed ? 'Night' : 'Morning'));
            const icon = shift==='Morning'?'☀️ ':shift==='Night'?'🌙 ':shift==='OnCall'?'📞 ': '⌛ ';
            row += `<td><span class="badge ${shift}" onclick="window.openDialog('${emp.id}','${dStr}','${emp.name}','${shift}')">${icon}${t[shift.toLowerCase()]}</span></td>`;
        }
        return `<tr>${row}</tr>`;
    }).join('');
}

// --- Shift Dialog ---
window.openDialog = (empId, date, name, current) => {
    selectedCell = { empId, date }; selectedOption = current;
    const t = i18n[currentLang];
    $('dialogTitle').innerText = `${name} | ${date}`;
    const opts = ['Morning', 'Night', 'OnCall', 'Off'];
    $('shiftOptions').innerHTML = opts.map(o => `<div class="opt-btn ${selectedOption === o ? 'active' : ''}" onclick="window.selectOpt('${o}')">${t[o.toLowerCase()]}</div>`).join('');
    $('shiftOverlay').style.display = 'flex';
};

window.selectOpt = (id) => {
    selectedOption = id;
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
};

window.saveOverride = async () => {
    overrides[`${selectedCell.empId}_${selectedCell.date}`] = selectedOption;
    await setDoc(doc(db, 'schedule', 'manual_overrides'), overrides);
    window.closeDialog();
};

window.closeDialog = () => $('shiftOverlay').style.display = 'none';

// --- Events ---
$('btnPrev').onclick = () => navigateWeek(-7);
$('btnNext').onclick = () => navigateWeek(7);
$('btnToday').onclick = () => setToday();
$('btnToggleLang').onclick = () => { currentLang = currentLang==='ar'?'en':'ar'; localStorage.setItem('lang', currentLang); renderTable(); };
$('datePicker').onchange = renderTable;

onSnapshot(doc(db, 'schedule', 'jadwal_v6'), s => { emps = s.data()?.data?.emps || []; renderTable(); });
onSnapshot(doc(db, 'schedule', 'manual_overrides'), s => { overrides = s.data() || {}; renderTable(); });

window.onload = () => { setToday(); };
</script>
</body>
</html>
