<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقرير المجدوعي للسيارات — Upgrade Windows</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --bg: #f4f7f9; }
        body { margin: 0; padding: 40px; font-family: 'Segoe UI', sans-serif; background: #e2e8f0; color: #1e293b; }
        
        .report-paper { 
            max-width: 1100px; margin: auto; background: white; padding: 50px; 
            border-radius: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); 
        }

        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; border-bottom: 3px solid var(--primary); padding-bottom: 20px; }
        .logo-box { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 65px; }
        .title-box h1 { margin: 0; font-size: 26px; color: var(--primary); }
        .title-box p { margin: 5px 0 0; font-size: 14px; color: #64748b; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: #fff; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid #f1f5f9; }
        .stat-card h2 { font-size: 52px; margin: 10px 0; color: var(--primary); }

        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .list-card { border: 1px solid #f1f5f9; border-radius: 18px; padding: 20px; }
        .list-card h4 { margin: 0 0 15px; color: var(--primary); border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        
        .item { background: #f8fafc; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
        .m-box { font-size: 10px; background: white; padding: 4px; border-radius: 6px; text-align: center; border: 1px solid #eee; }

        .brand-logo { width: 30px; height: 30px; object-fit: contain; margin-left: 8px; }

        .capture-btn { 
            position: fixed; bottom: 30px; left: 30px; background: var(--success); color: white; 
            border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; 
            font-weight: bold; box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4); z-index: 1000;
        }
    </style>
</head>
<body>

<button class="capture-btn" onclick="copyReport()">
    <i class="fas fa-camera"></i> نسخ التقرير كصورة للإيميل
</button>

<div class="report-paper" id="report-area">
    <div class="header">
        <div class="logo-box">
            <img src="LOGO-almajdouie.png" alt="Logo" class="logo-img">
            <div class="title-box">
                <h1>شركة المجدوعي للسيارات</h1>
                <p>إدارة ترقية الأنظمة - Upgrade Windows</p>
            </div>
        </div>
        <div style="text-align: left; font-size: 12px; color: #94a3b8;">
            بتاريخ: <span id="date-now"></span><br>
            <span id="user-tag" style="color:var(--primary)">جاري المزامنة...</span>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card"><span>إجمالي الأجهزة</span><h2 id="v-total">0</h2></div>
        <div class="stat-card" style="border-color:var(--warning)"><span>متبقي (Planned)</span><h2 id="v-remain" style="color:var(--warning)">0</h2></div>
        <div class="stat-card" style="border-color:var(--success)"><span>مكتمل (Completed)</span><h2 id="v-done" style="color:var(--success)">0</h2></div>
    </div>

    <div class="details-grid">
        <div class="list-card"><h4>المناطق</h4><div id="list-reg"></div></div>
        <div class="list-card"><h4>المدن</h4><div id="list-city"></div></div>
        <div class="list-card"><h4>البراندات</h4><div id="list-brand"></div></div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let brandLogos = {};

    document.getElementById('date-now').innerText = new Date().toLocaleDateString('ar-SA');

    // 💡 الربط بـ login.html: التحقق من الهوية أولاً
    auth.onAuthStateChanged(async user => {
        if (user) {
            document.getElementById('user-tag').innerText = "متصل: " + user.email;
            await loadBrandLogos();
            startReportSync();
        } else {
            // إذا لم يكن مسجلاً، اذهب لصفحة الدخول
            window.location.href = "login.html";
        }
    });

    async function loadBrandLogos() {
        const snap = await db.collection("brand_assets").get();
        snap.forEach(doc => { if(doc.data().brandKey) brandLogos[doc.data().brandKey.toLowerCase()] = doc.data().logoData; });
    }

    function startReportSync() {
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const sums = { region: {}, city: {}, brand: {} };

            snapshot.forEach(doc => {
                const d = doc.data();
                let c = parseInt(d.devicesCount || 1);
                let s = String(d.status || '').toLowerCase().trim();
                total += c; if(s === 'completed') done += c;

                ['region', 'city', 'brand'].forEach(k => {
                    let val = d[k] || 'غير محدد';
                    if(!sums[k][val]) sums[k][val] = { t:0, d:0 };
                    sums[k][val].t += c; if(s === 'completed') sums[k][val].d += c;
                });
            });

            document.getElementById('v-total').innerText = total;
            document.getElementById('v-done').innerText = done;
            document.getElementById('v-remain').innerText = total - done;

            render(sums.region, 'list-reg');
            render(sums.city, 'list-city');
            render(sums.brand, 'list-brand', true);
        }, err => {
            if(err.code === 'permission-denied') alert("خطأ: لا تملك صلاحية عرض البيانات. تأكد من تفعيل حسابك.");
        });
    }

    function render(data, containerId, isBrand = false) {
        const el = document.getElementById(containerId); el.innerHTML = '';
        Object.entries(data).sort((a,b)=>b[1].t - a[1].t).forEach(([name, v]) => {
            let logo = (isBrand && brandLogos[name.toLowerCase()]) ? `<img src="${brandLogos[name.toLowerCase()]}" class="brand-logo">` : '';
            el.innerHTML += `<div class="item">
                <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:13px; margin-bottom:8px;">
                    <div>${logo} ${name}</div> <span>${Math.round((v.d/v.t)*100)}%</span>
                </div>
                <div class="mini-stats">
                    <div class="m-box">إجمالي: ${v.t}</div>
                    <div class="m-box" style="color:orange">باقي: ${v.t-v.d}</div>
                    <div class="m-box" style="color:green">تم: ${v.d}</div>
                </div>
            </div>`;
        });
    }

    async function copyReport() {
        const btn = document.querySelector('.capture-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النسخ...';
        const canvas = await html2canvas(document.getElementById('report-area'), { scale: 2, backgroundColor: "#ffffff" });
        canvas.toBlob(blob => {
            navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ للحافظة!';
                setTimeout(() => btn.innerHTML = '<i class="fas fa-camera"></i> نسخ التقرير كصورة للإيميل', 2000);
            });
        });
    }
</script>
</body>
</html>
