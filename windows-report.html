<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقرير ترقية الأنظمة — شركة المجدوعي للسيارات</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --bg: #f4f7f9; }
        body { margin: 0; padding: 40px; font-family: 'Segoe UI', sans-serif; background: #e2e8f0; }
        
        /* البطاقة الرئيسية للتقرير */
        .report-paper { 
            max-width: 1100px; margin: auto; background: white; padding: 50px; 
            border-radius: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); 
            position: relative; overflow: hidden;
        }

        /* الهيدر الرسمي المعتمد */
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
        .logo-box { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 65px; }
        .title-box h1 { margin: 0; font-size: 26px; color: var(--primary); font-weight: 800; }
        .title-box p { margin: 5px 0 0; font-size: 14px; color: #64748b; }
        .date-label { font-size: 12px; color: #94a3b8; text-align: left; }

        /* البطاقات الثلاث الكبرى */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: #fff; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid #f1f5f9; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .stat-card h2 { font-size: 52px; margin: 10px 0; color: var(--primary); }
        .stat-card span { font-weight: bold; color: #475569; font-size: 16px; }

        /* القوائم الثلاث */
        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .list-card { border: 1px solid #f1f5f9; border-radius: 18px; padding: 20px; background: #fff; }
        .list-card h4 { margin: 0 0 15px; color: var(--primary); font-size: 16px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        
        .item { background: #f8fafc; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #f1f5f9; }
        .item-top { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
        .brand-logo { width: 30px; height: 30px; object-fit: contain; }
        
        .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .m-box { font-size: 10px; background: white; padding: 4px; border-radius: 6px; text-align: center; border: 1px solid #eee; font-weight: bold; }

        /* زر النسخ (عائم) */
        .capture-btn { 
            position: fixed; bottom: 30px; right: 30px; background: var(--success); color: white; 
            border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; 
            font-weight: bold; font-size: 14px; box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4); 
            display: flex; align-items: center; gap: 10px; z-index: 1000; transition: 0.3s;
        }
        .capture-btn:hover { transform: scale(1.05); background: #059669; }

        .footer-text { margin-top: 40px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 15px; }
    </style>
</head>
<body>

<button class="capture-btn" onclick="copyReport()">
    <i class="fas fa-camera"></i> نسخ التقرير كصورة للإيميل
</button>

<div class="report-paper" id="report-area">
    <div class="header">
        <div class="logo-box">
            <img src="LOGO-almajdouie.png" alt="Almajdouie Logo" class="logo-img">
            <div class="title-box">
                <h1>شركة المجدوعي للسيارات</h1>
                <p>نظام متابعة ترقية الأنظمة - Upgrade Windows Management</p>
            </div>
        </div>
        <div class="date-label">تاريخ التقرير: <span id="date-now"></span></div>
    </div>

    <div class="stats-row">
        <div class="stat-card"><span>إجمالي الأجهزة</span><h2 id="v-total">0</h2></div>
        <div class="stat-card" style="border-color:var(--warning)"><span>متبقي (Planned)</span><h2 id="v-remain" style="color:var(--warning)">0</h2></div>
        <div class="stat-card" style="border-color:var(--success)"><span>مكتمل (Completed)</span><h2 id="v-done" style="color:var(--success)">0</h2></div>
    </div>

    <div class="details-grid">
        <div class="list-card">
            <h4><i class="fas fa-map-marker-alt"></i> المناطق</h4>
            <div id="list-reg"></div>
        </div>
        <div class="list-card">
            <h4><i class="fas fa-city"></i> المدن</h4>
            <div id="list-city"></div>
        </div>
        <div class="list-card">
            <h4><i class="fas fa-car"></i> البراندات والشعارات</h4>
            <div id="list-brand"></div>
        </div>
    </div>

    <div class="footer-text">
        هذا التقرير تم إنشاؤه آلياً بواسطة نظام إدارة الترقيات - جميع الحقوق محفوظة لشركة المجدوعي للسيارات © 2026
    </div>
</div>

<script>
    // إعدادات Firebase (baghethan-ba325)
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let brandLogos = {};

    document.getElementById('date-now').innerText = new Date().toLocaleDateString('ar-SA');

    async function init() {
        // 1. جلب الشعارات أولاً
        const logoSnap = await db.collection("brand_assets").get();
        logoSnap.forEach(doc => { if(doc.data().brandKey) brandLogos[doc.data().brandKey.toLowerCase()] = doc.data().logoData; });

        // 2. مزامنة البيانات الحية
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const sums = { region: {}, city: {}, brand: {} };

            snapshot.forEach(doc => {
                const d = doc.data();
                let c = parseInt(d.devicesCount || 1);
                let s = String(d.status || '').toLowerCase().trim();
                
                total += c;
                if(s === 'completed') done += c;

                ['region', 'city', 'brand'].forEach(k => {
                    let val = d[k] || 'غير محدد';
                    if(!sums[k][val]) sums[k][val] = { t:0, d:0 };
                    sums[k][val].t += c;
                    if(s === 'completed') sums[k][val].d += c;
                });
            });

            document.getElementById('v-total').innerText = total;
            document.getElementById('v-done').innerText = done;
            document.getElementById('v-remain').innerText = total - done;

            renderList(sums.region, 'list-reg');
            renderList(sums.city, 'list-city');
            renderList(sums.brand, 'list-brand', true);
        });
    }

    function renderList(data, id, isBrand = false) {
        const el = document.getElementById(id); el.innerHTML = '';
        Object.entries(data).sort((a,b)=>b[1].t - a[1].t).forEach(([name, v]) => {
            let logoHtml = (isBrand && brandLogos[name.toLowerCase()]) ? `<img src="${brandLogos[name.toLowerCase()]}" class="brand-logo">` : '';
            el.innerHTML += `
                <div class="item">
                    <div class="item-top"><div>${logoHtml} ${name}</div> <span>${Math.round((v.d/v.t)*100)}%</span></div>
                    <div class="mini-stats">
                        <div class="m-box">إجمالي: ${v.t}</div>
                        <div class="m-box" style="color:var(--warning)">باقي: ${v.t-v.d}</div>
                        <div class="m-box" style="color:var(--success)">تم: ${v.d}</div>
                    </div>
                </div>`;
        });
    }

    // وظيفة نسخ الصورة للإيميل
    async function copyReport() {
        const report = document.getElementById('report-area');
        const btn = document.querySelector('.capture-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النسخ...';
        
        try {
            const canvas = await html2canvas(report, { scale: 2, backgroundColor: "#ffffff" });
            canvas.toBlob(blob => {
                const item = new ClipboardItem({ "image/png": blob });
                navigator.clipboard.write([item]).then(() => {
                    btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ! الصقها بالإيميل الآن';
                    setTimeout(() => btn.innerHTML = '<i class="fas fa-camera"></i> نسخ التقرير كصورة للإيميل', 2000);
                });
            });
        } catch(e) {
            alert("حدث خطأ أثناء النسخ");
            btn.innerHTML = '<i class="fas fa-camera"></i> نسخ التقرير كصورة للإيميل';
        }
    }

    init();
</script>
</body>
</html>
