<!DOCTYPE html>
<html lang="ar" dir="rtl" id="report-html">
<head>
    <meta charset="UTF-8">
    <title>تقرير الإنجاز — شركة المجدوعي للسيارات</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --bg: #f4f7f9; }
        body { margin: 0; padding: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #e2e8f0; }
        
        .report-paper { 
            max-width: 1150px; margin: auto; background: white; padding: 50px; 
            border-radius: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); 
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; }
        .logo-img { height: 65px; }
        .title-box h1 { margin: 0; font-size: 26px; color: var(--primary); }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: #fff; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid #f1f5f9; }
        .stat-card h2 { font-size: 52px; margin: 10px 0; color: var(--primary); }

        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .list-card { border: 1px solid #f1f5f9; border-radius: 18px; padding: 20px; background: #fff; }
        .list-card h4 { margin: 0 0 15px; color: var(--primary); font-size: 16px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        
        /* تصميم العنصر مع شريط التقدم */
        .item { background: #f8fafc; border-radius: 15px; padding: 15px; margin-bottom: 12px; border: 1px solid #edf2f7; }
        .item-top { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
        
        /* شريط التقدم المئوي */
        .progress-container { width: 100%; background: #e2e8f0; height: 8px; border-radius: 10px; margin: 10px 0; overflow: hidden; position: relative; }
        .progress-bar { height: 100%; background: var(--success); border-radius: 10px; transition: width 0.8s ease-in-out; }

        .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 5px; }
        .m-box { font-size: 10px; background: white; padding: 4px; border-radius: 6px; text-align: center; border: 1px solid #eee; font-weight: bold; }

        .controls { position: fixed; bottom: 30px; left: 30px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .btn { border: none; padding: 15px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="controls">
    <button class="btn" style="background:var(--primary); color:white;" onclick="toggleLanguage()">
        <i class="fas fa-language"></i> <span id="lang-text">English</span>
    </button>
    <button class="btn" style="background:var(--success); color:white;" onclick="copyReportImage()">
        <i class="fas fa-camera"></i> <span data-i18n="btn_capture">نسخ التقرير للإيميل</span>
    </button>
</div>

<div class="report-paper" id="report-content">
    <div class="header">
        <div style="display:flex; align-items:center; gap:20px;">
            <img src="LOGO-almajdouie.png" alt="Logo" class="logo-img">
            <div class="title-box">
                <h1 data-i18n="comp_name">شركة المجدوعي للسيارات</h1>
                <p data-i18n="sys_name">نظام متابعة ترقية الأنظمة - Upgrade Windows Management</p>
            </div>
        </div>
        <div style="text-align: left; font-size: 12px; color: #94a3b8;">
            <span data-i18n="date_lbl">التاريخ</span>: <span id="report-date"></span>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card"><span data-i18n="stat_total">إجمالي الأجهزة</span><h2 id="v-total">0</h2></div>
        <div class="stat-card" style="border-color:var(--warning)"><span data-i18n="stat_remain">متبقي</span><h2 id="v-remain" style="color:var(--warning)">0</h2></div>
        <div class="stat-card" style="border-color:var(--success)"><span data-i18n="stat_done">مكتمل</span><h2 id="v-done" style="color:var(--success)">0</h2></div>
    </div>

    <div class="details-grid">
        <div class="list-card"><h4 data-i18n="sec_reg">المناطق</h4><div id="list-reg"></div></div>
        <div class="list-card"><h4 data-i18n="sec_city">المدن</h4><div id="list-city"></div></div>
        <div class="list-card"><h4 data-i18n="sec_brand">البراندات</h4><div id="list-brand"></div></div>
    </div>
</div>

<script>
    // نظام الترجمة والبيانات
    const i18n = {
        ar: { comp_name: "شركة المجدوعي للسيارات", sys_name: "نظام متابعة ترقية الأنظمة", stat_total: "إجمالي الأجهزة", stat_remain: "متبقي", stat_done: "مكتمل", sec_reg: "المناطق", sec_city: "المدن", sec_brand: "البراندات", btn_capture: "نسخ التقرير للإيميل", t: "إجمالي", r: "باقي", d: "تم" },
        en: { comp_name: "Almajdouie Motors Co.", sys_name: "Systems Upgrade Management", stat_total: "Total Devices", stat_remain: "Remain", stat_done: "Done", sec_reg: "Regions", sec_city: "Cities", sec_brand: "Brands", btn_capture: "Copy Image for Email", t: "Total", r: "Remain", d: "Done" }
    };

    let currentLang = 'ar';
    const firebaseConfig = { /* إعداداتك هنا */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function startSync() {
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const sums = { region: {}, city: {}, brand: {} };

            snapshot.forEach(doc => {
                const d = doc.data();
                let c = parseInt(d.devicesCount || 1);
                let s = String(d.status || '').toLowerCase().trim();
                total += c; if(s === 'completed') done += c;

                ['region', 'city', 'brand'].forEach(k => {
                    let val = d[k] || 'N/A';
                    if(!sums[k][val]) sums[k][val] = { t:0, d:0 };
                    sums[k][val].t += c; if(s === 'completed') sums[k][val].d += c;
                });
            });

            document.getElementById('v-total').innerText = total;
            document.getElementById('v-done').innerText = done;
            document.getElementById('v-remain').innerText = total - done;

            renderList(sums.region, 'list-reg');
            renderList(sums.city, 'list-city');
            renderList(sums.brand, 'list-brand');
        });
    }

    function renderList(data, containerId) {
        const el = document.getElementById(containerId); el.innerHTML = '';
        const lang = i18n[currentLang];
        
        Object.entries(data).sort((a,b)=>b[1].t - a[1].t).forEach(([name, v]) => {
            let percent = Math.round((v.d / v.t) * 100) || 0;
            el.innerHTML += `
                <div class="item">
                    <div class="item-top"><span>${name}</span> <span>${percent}%</span></div>
                    
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${percent}%"></div>
                    </div>

                    <div class="mini-stats">
                        <div class="m-box">${lang.t}: ${v.t}</div>
                        <div class="m-box" style="color:orange">${lang.r}: ${v.t-v.d}</div>
                        <div class="m-box" style="color:green">${lang.d}: ${v.d}</div>
                    </div>
                </div>`;
        });
    }

    // وظائف اللغة والتصوير
    function toggleLanguage() { /* كود تغيير اللغة المذكور سابقاً */ }
    async function copyReportImage() {
        const canvas = await html2canvas(document.getElementById('report-content'), { scale: 2, backgroundColor: "#ffffff" });
        canvas.toBlob(blob => {
            navigator.clipboard.write([new ClipboardItem({"image/png": blob})]).then(() => alert("تم نسخ التقرير كصورة بنجاح!"));
        });
    }

    startSync();
    document.getElementById('report-date').innerText = new Date().toLocaleDateString('ar-SA');
</script>
</body>
</html>
