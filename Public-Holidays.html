<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Public Holidays - Almajdouie Motors</title>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--muted:#64748b;--border:#e5e7eb;--surface:rgba(255,255,255,.96);--danger:#b91c1c;--danger2:#dc2626;--success:#16a34a;--shadow:0 18px 50px rgba(13,33,73,.12)}
    *{box-sizing:border-box}
    body{margin:0;padding:18px;font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(180deg,rgba(12,31,73,.08),rgba(255,255,255,.25));color:#0f172a}
    .shell{width:100%;max-width:1180px;margin:0 auto}
    .topbar{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{height:46px;width:auto;object-fit:contain;background:#fff;border-radius:10px;padding:4px}
    .brand-title{font-size:20px;font-weight:900;line-height:1.2}
    .brand-sub{font-size:12px;opacity:.85;margin-top:3px}
    .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800}
    .card{background:var(--surface);border:1px solid rgba(255,255,255,.55);border-radius:22px;box-shadow:var(--shadow);padding:20px;overflow:hidden}
    .card + .card{margin-top:16px}
    .section-title{margin:0 0 6px;color:var(--primary);font-size:24px;font-weight:900}
    .section-desc{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.7;font-weight:700}
    .form-box{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr auto;gap:10px;align-items:end;background:#f8fafc;border:1px solid var(--border);border-radius:16px;padding:14px}
    label{display:block;font-size:12px;font-weight:900;color:var(--primary);margin-bottom:6px}
    input,select{width:100%;min-height:42px;border:1px solid #d8dee8;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:13px;background:#fff;font-weight:700}
    .btn,.btn2,.danger{border:none;border-radius:12px;min-height:42px;padding:10px 14px;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;transition:.2s;white-space:nowrap}
    .btn{background:#fff;color:var(--primary);border:1px solid var(--border)}
    .btn2{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
    .danger{background:linear-gradient(135deg,var(--danger2),var(--danger));color:#fff}
    .btn:hover,.btn2:hover,.danger:hover{transform:translateY(-1px)}
    .message{display:none;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:800;margin:0 0 14px}
    .message.ok{display:block;background:#ecfdf5;color:#166534}
    .message.warn{display:block;background:#fff7ed;color:#9a3412}
    .table-wrap{overflow-x:auto}
    table{width:100%;min-width:780px;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;font-size:13px}
    thead th{background:#f8fafc;color:var(--primary);font-weight:900;border-bottom:1px solid var(--border)}
    th,td{padding:12px 10px;text-align:center;border-left:1px solid rgba(15,23,42,.05);vertical-align:middle}
    th:last-child,td:last-child{border-left:none}
    tbody tr:not(:last-child) td{border-bottom:1px solid rgba(15,23,42,.06)}
    tbody tr:hover td{background:#f8fafc}
    .row-start{text-align:right;font-weight:900}
    html[dir="ltr"] .row-start{text-align:left}
    .empty{color:var(--muted);font-weight:800;padding:24px}
    @media(max-width:900px){body{padding:12px}.topbar,.card{border-radius:18px}.form-box{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand">
        <img src="LOGO-almajdouie.png" class="logo" alt="Almajdouie Motors" onerror="this.style.display='none'" />
        <div>
          <div class="brand-title">Almajdouie Motors</div>
          <div class="brand-sub" id="brandSub">Public Holidays Management</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="chip" id="statusChip">Connected</span>
        <button class="btn" id="btnRefresh" type="button">Refresh</button>
        <button class="btn" id="btnLang" type="button">AR / EN</button>
      </div>
    </div>

    <section class="card">
      <h1 class="section-title" id="pageTitle">Public Holidays</h1>
      <p class="section-desc" id="pageDesc">Add public holidays and assign the responsible employee. Employees are read from employees. Data is saved in schedule / jadwal_holidays.</p>
      <div id="messageBox" class="message"></div>

      <div class="form-box">
        <div>
          <label for="holidayName" id="lblName">Holiday Name</label>
          <input type="text" id="holidayName" placeholder="Example: Eid Holiday" />
        </div>
        <div>
          <label for="holidayStart" id="lblStart">Start Date</label>
          <input type="date" id="holidayStart" />
        </div>
        <div>
          <label for="holidayEnd" id="lblEnd">End Date</label>
          <input type="date" id="holidayEnd" />
        </div>
        <div>
          <label for="holidayEmployee" id="lblEmployee">Assigned Employee</label>
          <select id="holidayEmployee"><option value="">Loading employees...</option></select>
        </div>
        <button class="btn2" id="btnAddHoliday" type="button">+ Add</button>
      </div>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th id="thHoliday">Holiday</th>
              <th id="thEmployee">Assigned Employee</th>
              <th id="thStart">From</th>
              <th id="thEnd">To</th>
              <th id="thAction">Action</th>
            </tr>
          </thead>
          <tbody id="holidayBody">
            <tr><td colspan="5" class="empty">Loading data...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module">
    import { db, waitForSignedInUser, logFirebaseError } from './firebase-session.js';
    import { doc, collection, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const LANG_KEY = 'lang';
    const holidaysRef = doc(db, 'schedule', 'jadwal_holidays');
    const $ = id => document.getElementById(id);
    let currentLang = normalizeLang(localStorage.getItem(LANG_KEY) || 'ar');
    let employees = [];
    let holidayDuties = [];

    const i18n = {
      ar: {
        brandSub: 'إدارة العطل الرسمية',
        title: 'العطل الرسمية',
        desc: 'إضافة العطل الرسمية وتحديد الموظف المكلف. تقرأ الموظفين من employees وتحفظ العطل في schedule / jadwal_holidays.',
        connected: 'متصل',
        refresh: 'تحديث',
        name: 'اسم العطلة',
        start: 'من تاريخ',
        end: 'إلى تاريخ',
        employee: 'الموظف المكلف',
        add: '+ إضافة',
        placeholder: 'مثال: عيد الفطر',
        selectEmployee: 'اختر الموظف',
        loadingEmployees: 'جاري تحميل الموظفين...',
        noEmployees: 'لا يوجد موظفون نشطون',
        thHoliday: 'العطلة',
        thStart: 'من',
        thEnd: 'إلى',
        thAction: 'الإجراء',
        empty: 'لا توجد عطل رسمية.',
        loading: 'جاري تحميل البيانات...',
        delete: 'حذف',
        confirmDelete: 'هل تريد حذف هذه العطلة؟',
        required: 'يرجى تعبئة اسم العطلة والتاريخ والموظف المكلف.',
        dateError: 'تاريخ البداية لا يمكن أن يكون بعد تاريخ النهاية.',
        saved: 'تم حفظ العطلة الرسمية بنجاح.',
        deleted: 'تم حذف العطلة.',
        refreshed: 'تم تحديث العرض.',
        loadError: 'تعذر تحميل البيانات. تأكد من الصلاحيات.',
        saveError: 'تعذر الحفظ. تأكد من صلاحية Public Holidays.'
      },
      en: {
        brandSub: 'Public Holidays Management',
        title: 'Public Holidays',
        desc: 'Add public holidays and assign the responsible employee. Employees are read from employees. Data is saved in schedule / jadwal_holidays.',
        connected: 'Connected',
        refresh: 'Refresh',
        name: 'Holiday Name',
        start: 'Start Date',
        end: 'End Date',
        employee: 'Assigned Employee',
        add: '+ Add',
        placeholder: 'Example: Eid Holiday',
        selectEmployee: 'Select employee',
        loadingEmployees: 'Loading employees...',
        noEmployees: 'No active employees',
        thHoliday: 'Holiday',
        thStart: 'From',
        thEnd: 'To',
        thAction: 'Action',
        empty: 'No public holidays registered.',
        loading: 'Loading data...',
        delete: 'Delete',
        confirmDelete: 'Delete this holiday?',
        required: 'Please fill in holiday name, dates, and assigned employee.',
        dateError: 'Start date cannot be after end date.',
        saved: 'Public holiday saved successfully.',
        deleted: 'Holiday deleted.',
        refreshed: 'View refreshed.',
        loadError: 'Unable to load data. Check permissions.',
        saveError: 'Unable to save. Check Public Holidays permission.'
      }
    };

    function normalizeLang(value) {
      return String(value || '').toLowerCase() === 'en' ? 'en' : 'ar';
    }

    function t(key) {
      return i18n[currentLang][key] || key;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function showMessage(text, type = 'ok') {
      const box = $('messageBox');
      box.className = `message ${type}`;
      box.textContent = text;
      box.style.display = 'block';
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => {
        box.style.display = 'none';
      }, 3500);
    }

    function setText(id, key) {
      $(id).textContent = t(key);
    }

    function employeeName(empId) {
      const emp = employees.find(item => String(item.id) === String(empId) || String(item.empNum) === String(empId));
      return emp?.name || empId || '-';
    }

    function renderEmployeeSelect() {
      const selected = $('holidayEmployee').value;
      const activeEmployees = employees.filter(emp => emp.active !== false);

      if (!activeEmployees.length) {
        $('holidayEmployee').innerHTML = `<option value="">${escapeHtml(t('noEmployees'))}</option>`;
        return;
      }

      $('holidayEmployee').innerHTML = `<option value="">${escapeHtml(t('selectEmployee'))}</option>` + activeEmployees
        .map(emp => `<option value="${escapeHtml(emp.id || emp.empNum || emp.name)}">${escapeHtml(emp.name || emp.empNum || emp.id)}</option>`)
        .join('');

      if (selected) $('holidayEmployee').value = selected;
    }

    function renderHolidays() {
      const body = $('holidayBody');

      if (!holidayDuties.length) {
        body.innerHTML = `<tr><td colspan="5" class="empty">${t('empty')}</td></tr>`;
        return;
      }

      body.innerHTML = holidayDuties.map((holiday, index) => `
        <tr>
          <td class="row-start">${escapeHtml(holiday.name || '')}</td>
          <td>${escapeHtml(employeeName(holiday.empId))}</td>
          <td>${escapeHtml(holiday.start || '')}</td>
          <td>${escapeHtml(holiday.end || '')}</td>
          <td><button class="danger" type="button" data-index="${index}">${t('delete')}</button></td>
        </tr>
      `).join('');
    }

    function applyLanguage() {
      currentLang = normalizeLang(currentLang);
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.title = `${t('title')} - Almajdouie Motors`;
      setText('brandSub', 'brandSub');
      setText('pageTitle', 'title');
      setText('pageDesc', 'desc');
      setText('statusChip', 'connected');
      setText('btnRefresh', 'refresh');
      setText('lblName', 'name');
      setText('lblStart', 'start');
      setText('lblEnd', 'end');
      setText('lblEmployee', 'employee');
      setText('btnAddHoliday', 'add');
      setText('thHoliday', 'thHoliday');
      setText('thEmployee', 'employee');
      setText('thStart', 'thStart');
      setText('thEnd', 'thEnd');
      setText('thAction', 'thAction');
      $('holidayName').placeholder = t('placeholder');
      renderEmployeeSelect();
      renderHolidays();
    }

    async function saveHolidays(next) {
      await waitForSignedInUser();
      await setDoc(holidaysRef, { duties: next }, { merge: true });
      holidayDuties = next;
      renderHolidays();
    }

    async function addHoliday() {
      const name = $('holidayName').value.trim();
      const start = $('holidayStart').value;
      const end = $('holidayEnd').value;
      const empId = $('holidayEmployee').value;

      if (!name || !start || !end || !empId) {
        showMessage(t('required'), 'warn');
        return;
      }

      if (new Date(start) > new Date(end)) {
        showMessage(t('dateError'), 'warn');
        return;
      }

      try {
        await saveHolidays([...holidayDuties, { empId, name, start, end, createdAt: new Date().toISOString() }]);
        $('holidayName').value = '';
        $('holidayStart').value = '';
        $('holidayEnd').value = '';
        $('holidayEmployee').value = '';
        showMessage(t('saved'), 'ok');
      } catch (error) {
        logFirebaseError('Public holidays save failed', error);
        showMessage(t('saveError'), 'warn');
      }
    }

    async function deleteHoliday(index) {
      if (!confirm(t('confirmDelete'))) return;
      try {
        await saveHolidays(holidayDuties.filter((_, itemIndex) => itemIndex !== index));
        showMessage(t('deleted'), 'ok');
      } catch (error) {
        logFirebaseError('Public holidays delete failed', error);
        showMessage(t('saveError'), 'warn');
      }
    }

    async function bindData() {
      await waitForSignedInUser();
      // Unified mode: employees come from employees collection only.
      onSnapshot(collection(db, 'employees'), snapshot => {
        employees = snapshot.docs.map(item => {
          const data = item.data() || {};
          const empNum = data.empId || data.empNum || data.employeeId || data.technicianId || item.id;
          return {
            id: String(empNum || item.id),
            employeeDocId: item.id,
            empNum: String(empNum || ''),
            name: data.name || data.fullName || String(empNum || item.id),
            email: data.email || '',
            active: data.active !== false && String(data.status || 'active').toLowerCase() !== 'inactive'
          };
        });
        renderEmployeeSelect();
        renderHolidays();
      }, error => {
        logFirebaseError('Public holidays employees listener failed', error);
        showMessage(t('loadError'), 'warn');
      });

      onSnapshot(holidaysRef, snapshot => {
        holidayDuties = snapshot.exists() ? (snapshot.data().duties || []) : [];
        renderHolidays();
      }, error => {
        logFirebaseError('Public holidays listener failed', error);
        showMessage(t('loadError'), 'warn');
      });
    }

    $('btnLang').addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem(LANG_KEY, currentLang);
      applyLanguage();
    });

    $('btnRefresh').addEventListener('click', () => {
      renderEmployeeSelect();
      renderHolidays();
      showMessage(t('refreshed'), 'ok');
    });

    $('btnAddHoliday').addEventListener('click', () => addHoliday());
    $('holidayBody').addEventListener('click', event => {
      const button = event.target.closest('[data-index]');
      if (!button) return;
      deleteHoliday(Number(button.dataset.index));
    });

    applyLanguage();
    bindData().catch(error => {
      logFirebaseError('Public holidays startup failed', error);
      showMessage(t('loadError'), 'warn');
    });
  </script>
</body>
</html>
