<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>Site-Visit Permissions Management</title>
  <style>
    :root{--primary:#0d4b73;--border:#d7e0ea;--bg:#edf3f8;--card:#fff;--radius:16px}
    body{margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);padding:20px}
    .container{max-width:1200px;margin:auto}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
    .card h3{margin:0 0 20px;padding:12px;background:var(--primary);color:#fff;border-radius:8px;font-size:16px}
    .field{margin-bottom:15px} label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
    input, select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box}
    .perms-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .perm-item{border:1px solid var(--border);padding:10px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:13px}
    .btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}
    .btn-save{background:#2f9e66;color:#fff} .btn-clear{background:#f1f5f9;color:#475569}
    table{width:100%;border-collapse:collapse;margin-top:20px;background:#fff;border-radius:12px;overflow:hidden}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #eee;font-size:13px} th{background:#f8fbff;color:var(--primary)}
    tr:hover{background:#f9f9f9;cursor:pointer}
  </style>
</head>
<body>
<div class="container">
  <div class="grid">
    <div class="card">
      <h3>User Data Profile</h3>
      <div class="field"><label>UID</label><input id="uUid" type="text" readonly style="background:#f8fafc"></div>
      <div class="field"><label>Name</label><input id="uName" type="text" readonly style="background:#f8fafc"></div>
      <div class="field"><label>Email</label><input id="uEmail" type="text" readonly style="background:#f8fafc"></div>
      <div class="field"><label>Technician ID</label><input id="uTechId" type="text"></div>
      <div class="field"><label>Role</label><select id="uRole"><option value="technician">Technician</option><option value="supervisor">Supervisor</option><option value="admin">Admin</option></select></div>
    </div>
    <div class="card">
      <h3>Allowed Site-Visit Pages</h3>
      <div id="pagesGrid" class="perms-grid"></div>
      <button id="saveBtn" class="btn btn-save">💾 Save Site-Visit Permissions</button>
      <button id="clearBtn" class="btn btn-clear">Reset Form</button>
    </div>
  </div>
  <table><thead><tr><th>UID</th><th>Name</th><th>Role</th><th>Tech ID</th></tr></thead><tbody id="usersTable"></tbody></table>
</div>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
  const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
  const app = initializeApp(firebaseConfig); const db = initializeFirestore(app, { experimentalForceLongPolling: true });
  const PAGES = { dashboard: "Dashboard", checklist: "Check-List", brands: "Brands", upgrade: "Upgrade Windows", visit: "Visits Entry", branches: "Branches", technicians: "Tech Mgmt", permissions: "Permissions", dynamic: "Dynamic Check-List" };
  document.getElementById('pagesGrid').innerHTML = Object.keys(PAGES).map(k => `<div class="perm-item"><input type="checkbox" class="p-check" data-id="${k}"> ${PAGES[k]}</div>`).join('');
  async function loadList() {
    const snap = await getDocs(collection(db, 'app_users'));
    document.getElementById('usersTable').innerHTML = snap.docs.map(d => `<tr onclick="loadUser('${d.id}')"><td>${d.id}</td><td>${d.data().name||''}</td><td>${d.data().role||''}</td><td>${d.data().technicianId||''}</td></tr>`).join('');
  }
  window.loadUser = async (id) => {
    const d = await getDoc(doc(db, 'app_users', id));
    if(d.exists()) {
      const u = d.data(); document.getElementById('uUid').value = id;
      document.getElementById('uName').value = u.name||""; document.getElementById('uEmail').value = u.email||"";
      document.getElementById('uTechId').value = u.technicianId||""; document.getElementById('uRole').value = u.role||"technician";
      document.querySelectorAll('.p-check').forEach(c => c.checked = Array.isArray(u.permissions_site_visit) && u.permissions_site_visit.includes(c.dataset.id));
    }
  };
  document.getElementById('saveBtn').onclick = async () => {
    const uid = document.getElementById('uUid').value; if(!uid) return alert("Select user");
    const selected = Array.from(document.querySelectorAll('.p-check:checked')).map(c => c.dataset.id);
    const payload = JSON.parse(JSON.stringify({
      technicianId: document.getElementById('uTechId').value,
      role: document.getElementById('uRole').value,
      permissions_site_visit: selected,
      updatedAt: new Date().toISOString()
    }));
    await setDoc(doc(db, 'app_users', uid), payload, { merge: true });
    alert("✅ Site-Visit Data Updated"); loadList();
  };
  loadList();
</script>
</body>
</html>
