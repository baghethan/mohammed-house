<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المجدوعي الموحد — تسجيل الدخول</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.8);
            --primary: #0f5d95;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #d1d9e6 100%);
            min-height: 100vh; display: flex; overflow-x: hidden;
        }

        /* شاشة تسجيل الدخول */
        #loginOverlay {
            position: fixed; inset: 0; background: rgba(15, 93, 149, 0.4);
            backdrop-filter: blur(15px); display: flex; justify-content: center;
            align-items: center; z-index: 9999; transition: 0.5s;
        }

        .login-box {
            background: var(--glass); padding: 40px; border-radius: 25px;
            width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center; border: 1px solid rgba(255,255,255,0.4);
        }

        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px;
            border: 1px solid #ddd; outline: none; font-size: 16px;
        }

        .login-btn {
            width: 100%; padding: 14px; background: var(--primary); color: #fff;
            border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 15px;
        }

        /* الواجهة الرئيسية */
        #appContent { display: none; width: 100%; }

        .sidebar {
            width: 260px; background: var(--glass); backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255,255,255,0.3); padding: 25px;
            position: fixed; height: 100vh; display: flex; flex-direction: column;
        }

        .main-content { margin-right: 280px; padding: 40px; }

        .nav-item {
            padding: 14px; border-radius: 12px; cursor: pointer; display: flex;
            align-items: center; gap: 12px; font-weight: 600; transition: 0.3s; color: #333;
        }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: #fff; }

        .admin-only { display: none; } /* الأزرار المخفية للمستخدمين العاديين */

        /* لوحة إحصائيات ويندوز */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0; }
        .stat-card {
            background: #fff; padding: 20px; border-radius: 18px; text-align: center;
            border-bottom: 5px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .scroll-area { max-height: 500px; overflow-y: auto; }
        .mini-card { background: #fff; padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #eee; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <img src="LOGO-almajdouie.png" style="width: 180px; margin-bottom: 20px;">
        <h3>تسجيل الدخول للنظام</h3>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="login-btn" onclick="handleLogin()">دخول</button>
        <p id="loginError" style="color: red; font-size: 13px; margin-top: 10px; display: none;">خطأ في البيانات، حاول مجدداً</p>
    </div>
</div>

<div id="appContent">
    <aside class="sidebar">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="LOGO-almajdouie.png" style="width: 140px;">
        </div>
        <div class="nav-item active" onclick="showTab('upgrade')"><i class="fab fa-windows"></i> Upgrade Windows</div>
        <div class="nav-item" onclick="showTab('visits')"><i class="fas fa-map-marker-alt"></i> الزيارات الميدانية</div>
        
        <div style="margin-top: auto;">
            <div id="userInfo" style="font-size: 12px; margin-bottom: 10px; color: var(--primary);"></div>
            <button class="nav-item" style="width: 100%; border:none;" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </aside>

    <main class="main-content">
        <section id="upgradeSection" class="glass-card" style="padding: 30px; background: var(--glass); border-radius: 25px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>لوحة متابعة Upgrade Windows</h2>
                <div class="admin-only">
                    <button class="login-btn" style="margin: 0; padding: 10px 20px;" onclick="document.getElementById('fileIn').click()">رفع بيانات جديدة</button>
                    <input type="file" id="fileIn" hidden>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><span>إجمالي الأجهزة</span> <h2 id="total-val">0</h2></div>
                <div class="stat-card" style="border-color: var(--warning);"><span>متبقي</span> <h2 id="remain-val" style="color: var(--warning);">0</h2></div>
                <div class="stat-card" style="border-color: var(--success);"><span>مكتمل</span> <h2 id="done-val" style="color: var(--success);">0</h2></div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div><h4>المناطق</h4> <div id="reg-list" class="scroll-area"></div></div>
                <div><h4>المدن</h4> <div id="city-list" class="scroll-area"></div></div>
                <div><h4>البراندات</h4> <div id="brand-list" class="scroll-area"></div></div>
            </div>
        </section>
    </main>
</div>

<script>
    // 1. ضع إعدادات Firebase الخاصة بك هنا
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "your-project.firebaseapp.com",
        projectId: "your-project-id",
        storageBucket: "your-project.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abc123"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // إيميل المسؤول الوحيد بناءً على Rules الخاصة بك
    const ADMIN_EMAIL = "y.khyar@almajdouie.com";

    // التحقق من حالة الدخول
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            document.getElementById('userInfo').innerText = "متصل: " + user.email;

            // تفعيل ميزات الأدمن فقط لصاحب الإيميل المحدد
            if (user.email === ADMIN_EMAIL) {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            }
            loadDashboardData();
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('appContent').style.display = 'none';
        }
    });

    async function handleLogin() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        try {
            await auth.signInWithEmailAndPassword(e, p);
        } catch (error) {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function handleLogout() { auth.signOut(); }

    function loadDashboardData() {
        db.collection("UpgradeWindows").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const groups = { Region: {}, City: {}, Brand: {} };

            snapshot.forEach(doc => {
                const r = doc.data();
                const count = parseInt(r.Devices_Count || 1);
                const isDone = String(r.Status || '').toLowerCase() === 'completed';
                
                total += count;
                if (isDone) done += count;

                ['Region', 'City', 'Brand'].forEach(key => {
                    const val = r[key] || 'N/A';
                    if (!groups[key][val]) groups[key][val] = { t: 0, d: 0 };
                    groups[key][val].t += count;
                    if (isDone) groups[key][val].d += count;
                });
            });

            document.getElementById('total-val').innerText = total;
            document.getElementById('done-val').innerText = done;
            document.getElementById('remain-val').innerText = total - done;

            renderList('reg-list', groups.Region);
            renderList('city-list', groups.City);
            renderList('brand-list', groups.Brand);
        });
    }

    function renderList(id, obj) {
        const container = document.getElementById(id);
        container.innerHTML = '';
        Object.entries(obj).forEach(([name, s]) => {
            const pct = Math.round((s.d / s.t) * 100) || 0;
            container.innerHTML += `
                <div class="mini-card">
                    <div style="font-weight:bold; margin-bottom:5px;">${name}</div>
                    <div style="display:flex; font-size:11px; justify-content:space-between;">
                        <span>إجمالي: ${s.t}</span>
                        <span style="color:var(--warning)">متبقي: ${s.t - s.d}</span>
                        <span style="color:var(--success)">مكتمل: ${s.d}</span>
                    </div>
                    <div style="height:5px; background:#eee; border-radius:5px; margin-top:8px;">
                        <div style="width:${pct}%; height:100%; background:var(--primary); border-radius:5px;"></div>
                    </div>
                </div>`;
        });
    }
</script>
</body>
</html>
