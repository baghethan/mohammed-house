<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Windows — V1.1.0</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #0d4b73;
            --success: #10b981;
            --warning: #f59e0b;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;
            background: transparent; color: #1e293b;
        }

        .container-glass {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px;
            padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        /* تنسيق الجدول والبحث */
        .table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1500px; /* لضمان عدم تداخل الـ 13 عمود */
            font-size: 12px;
        }

        th {
            background: var(--primary);
            color: #fff;
            padding: 12px 8px;
            text-align: right;
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid #f1f5f9;
        }

        .search-input {
            width: 90%;
            padding: 5px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 11px;
            outline: none;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 10px;
            text-transform: capitalize;
        }

        /* الهيدر العلوي */
        .info-header {
            display: flex; justify-content: space-between;
            font-size: 11px; color: #64748b; font-weight: bold; margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container-glass">
    <div class="info-header">
        <div id="update-time">آخر تحديث: --:--</div>
        <div>VERSION 1.1.0</div>
    </div>

    <h2 style="color: var(--primary); margin: 0 0 20px;">سجلات تحديثات ويندوز الموسعة</h2>

    <div class="table-wrapper">
        <table id="mainTable">
            <thead>
                <tr>
                    <th>Branch ID <br><input type="text" class="search-input" onkeyup="filterTable(0)" placeholder="بحث..."></th>
                    <th>Branch Name <br><input type="text" class="search-input" onkeyup="filterTable(1)" placeholder="بحث..."></th>
                    <th>Brand <br><input type="text" class="search-input" onkeyup="filterTable(2)" placeholder="بحث..."></th>
                    <th>Function <br><input type="text" class="search-input" onkeyup="filterTable(3)" placeholder="بحث..."></th>
                    <th>City <br><input type="text" class="search-input" onkeyup="filterTable(4)" placeholder="بحث..."></th>
                    <th>Region <br><input type="text" class="search-input" onkeyup="filterTable(5)" placeholder="بحث..."></th>
                    <th>Employee ID <br><input type="text" class="search-input" onkeyup="filterTable(6)" placeholder="بحث..."></th>
                    <th>Employee Name <br><input type="text" class="search-input" onkeyup="filterTable(7)" placeholder="بحث..."></th>
                    <th>Device Name <br><input type="text" class="search-input" onkeyup="filterTable(8)" placeholder="بحث..."></th>
                    <th>Visit Date <br><input type="text" class="search-input" onkeyup="filterTable(9)" placeholder="بحث..."></th>
                    <th>Checklist Saved <br><input type="text" class="search-input" onkeyup="filterTable(10)" placeholder="بحث..."></th>
                    <th>Status <br><input type="text" class="search-input" onkeyup="filterTable(11)" placeholder="بحث..."></th>
                    <th style="text-align: center;">إجراء</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // ✅ إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1. جلب البيانات لحظياً من Firestore
    db.collection("windows_upgrades").onSnapshot(snapshot => {
        const data = [];
        snapshot.forEach(doc => {
            data.push({ id: doc.id, ...doc.data() });
        });
        renderTable(data);
        updateTime();
    });

    // 2. دالة رسم الجدول بالأعمدة الـ 13
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        data.forEach(item => {
            const tr = document.createElement('tr');
            
            // تحديد لون حالة التنفيذ
            const statusColor = item.status === 'completed' ? 'background:#d1fae5; color:#065f46' : 'background:#fff3cd; color:#856404';

            tr.innerHTML = `
                <td>${item.branchId || ''}</td>
                <td>${item.branchName || ''}</td>
                <td>${item.brand || ''}</td>
                <td>${item.functionName || item.function || ''}</td>
                <td>${item.city || ''}</td>
                <td>${item.region || ''}</td>
                <td>${item.employeeId || ''}</td>
                <td>${item.employeeName || ''}</td>
                <td>${item.deviceName || ''}</td>
                <td>${item.technicianVisitDate || ''}</td>
                <td>${item.checklistSavedDate || ''}</td>
                <td><span class="status-badge" style="${statusColor}">${item.status || 'planned'}</span></td>
                <td style="text-align: center;">
                    <i class="fas fa-edit" style="color:var(--primary); cursor:pointer; margin-left:8px;" title="تعديل"></i>
                    <i class="fas fa-trash" style="color:#d64545; cursor:pointer;" title="حذف"></i>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 3. دالة البحث (Filter) لكل عمود على حدة
    function filterTable(columnIndex) {
        const inputs = document.getElementsByClassName('search-input');
        const filter = inputs[columnIndex].value.toLowerCase();
        const table = document.getElementById('mainTable');
        const tr = table.getElementsByTagName('tr');

        for (let i = 1; i < tr.length; i++) {
            let display = true;
            // التحقق من كافة مدخلات البحث لضمان الفلترة المتقاطعة
            for (let j = 0; j < inputs.length; j++) {
                const currentFilter = inputs[j].value.toLowerCase();
                const td = tr[i].getElementsByTagName('td')[j];
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    if (txtValue.toLowerCase().indexOf(currentFilter) === -1) {
                        display = false;
                        break;
                    }
                }
            }
            tr[i].style.display = display ? "" : "none";
        }
    }

    function updateTime() {
        const now = new Date();
        document.getElementById('update-time').innerText = `آخر تحديث: ${now.toLocaleDateString('ar-SA')} | ${now.toLocaleTimeString('ar-SA')}`;
    }
</script>
</body>
</html>
