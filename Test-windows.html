<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlPage">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام متابعة تحديث الأجهزة — المجدوعي</title>
  
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --bg:#f8fafc;
      --card:#ffffff;
      --text:#1e293b;
      --muted:#64748b;
      --primary:#0f5d95;
      --success:#10b981;
      --warning:#f59e0b;
      --border:#e2e8f0;
      --radius:16px;
    }

    *{box-sizing:border-box;}
    body{ margin:0; padding:20px; background:var(--bg); color:var(--text); font-family:"Segoe UI", Tahoma, sans-serif; }
    .page{ max-width:1400px; margin:0 auto; }

    /* الهيدر */
    .page-header{
      background: linear-gradient(135deg, #0f5d95, #1e293b);
      color:#fff; padding:25px; border-radius:var(--radius); margin-bottom:20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-info h1{ margin:0; font-size:22px; }

    .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    
    .toolbar{ display:flex; gap:12px; margin-bottom:25px; }
    .btn {
      border:none; border-radius:10px; padding:12px 20px; background:var(--primary); color:#fff;
      font-weight:700; cursor:pointer; font-size: 14px;
    }
    .btn.upload { background: var(--success); }
    .btn.lang-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }

    /* الإحصائيات الرئيسية الثلاثة */
    .main-stats{ display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; margin-bottom: 30px; }
    .stat-box{ 
      background:#fff; border:1px solid var(--border); border-radius:16px; padding:25px; 
      text-align: center; border-bottom: 5px solid var(--primary);
    }
    .stat-box.success { border-bottom-color: var(--success); }
    .stat-box.warning { border-bottom-color: var(--warning); }
    
    .stat-label{ color:var(--muted); font-size:15px; font-weight: 600; margin-bottom: 10px; display: block; }
    .stat-value{ font-size:40px; font-weight:900; color: var(--primary); }
    .success .stat-value { color: var(--success); }
    .warning .stat-value { color: var(--warning); }

    /* تفاصيل البطاقات */
    .details-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
    .details-card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:15px; }
    .details-card h4{ margin-top:0; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; color: var(--primary); }

    .scroll-area{ max-height: 500px; overflow-y: auto; padding: 5px; }
    
    .mini-item{ 
      border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; 
      background: #fcfdfe;
    }
    .item-name{ font-weight: 800; font-size: 14px; margin-bottom: 8px; color: var(--primary); }
    
    .item-counts{ display:flex; justify-content: space-between; gap:10px; margin-bottom: 10px;}
    .count-pill{ flex:1; background:#fff; border:1px solid #edf2f7; padding:6px; border-radius:8px; text-align: center; font-size: 12px; }
    .count-pill b{ display: block; font-size: 15px; }

    .progress-bar { height: 6px; background: #eee; border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; transition: 0.5s; }

    #fileInput { display: none; }

    @media (max-width: 900px) { .main-stats, .details-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="page">
  <div class="page-header">
    <div class="header-info">
      <h1 id="txt-title">نظام متابعة تحديث الأجهزة — المجدوعي</h1>
    </div>
    <button class="btn lang-btn" onclick="toggleLanguage()">🌐 <span id="btn-lang-text">English</span></button>
  </div>

  <section class="card">
    <div class="toolbar">
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
      <button class="btn upload" onclick="document.getElementById('fileInput').click()">📁 <span id="txt-upload">رفع الملف</span></button>
    </div>

    <div class="main-stats">
      <div class="stat-box">
        <span class="stat-label" id="txt-total">إجمالي عدد الأجهزة</span>
        <div class="stat-value" id="val-total">0</div>
      </div>
      <div class="stat-box success">
        <span class="stat-label" id="txt-done">مكتمل</span>
        <div class="stat-value" id="val-done">0</div>
      </div>
      <div class="stat-box warning">
        <span class="stat-label" id="txt-remain">متبقي</span>
        <div class="stat-value" id="val-remain">0</div>
      </div>
    </div>

    <div class="details-grid">
      <div class="details-card">
        <h4 id="txt-reg">المناطق</h4>
        <div id="grid-reg" class="scroll-area"></div>
      </div>
      <div class="details-card">
        <h4 id="txt-city">المدن</h4>
        <div id="grid-city" class="scroll-area"></div>
      </div>
      <div class="details-card">
        <h4 id="txt-brand">البراندات</h4>
        <div id="grid-brand" class="scroll-area"></div>
      </div>
    </div>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);
  let lang = 'ar';
  let rawData = [];

  const labels = {
    ar: { title: "تحديث ويندوز — المجدوعي", upload: "رفع الملف", total: "إجمالي عدد الأجهزة", done: "مكتمل", remain: "متبقي", reg: "المناطق", city: "المدن", brand: "البراندات", lang: "English" },
    en: { title: "Windows Upgrade — Almajdouie", upload: "Upload File", total: "Total Devices", done: "Completed", remain: "Remaining", reg: "Regions", city: "Cities", brand: "Brands", lang: "العربية" }
  };

  function toggleLanguage() {
    lang = lang === 'ar' ? 'en' : 'ar';
    document.getElementById('htmlPage').dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('txt-title').textContent = labels[lang].title;
    $('txt-upload').textContent = labels[lang].upload;
    $('txt-total').textContent = labels[lang].total;
    $('txt-done').textContent = labels[lang].done;
    $('txt-remain').textContent = labels[lang].remain;
    $('txt-reg').textContent = labels[lang].reg;
    $('txt-city').textContent = labels[lang].city;
    $('txt-brand').textContent = labels[lang].brand;
    $('btn-lang-text').textContent = labels[lang].lang;
    if (rawData.length > 0) processData(rawData);
  }

  $('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = (ev) => {
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
      rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      processData(rawData);
    };
    reader.readAsArrayBuffer(file);
  });

  function processData(data) {
    let total = 0, done = 0;
    const stats = { region: {}, city: {}, brand: {} };

    data.forEach(row => {
      // استخدام أسماء الأعمدة من ملفك
      const count = parseInt(row.Devices_Count || row.devicesCount || 1) || 1;
      const isDone = String(row.Status || '').toLowerCase().trim() === 'completed';
      
      total += count;
      if (isDone) done += count;

      ['Region', 'City', 'Brand'].forEach(key => {
        const val = row[key] || 'N/A';
        const lowKey = key.toLowerCase();
        if (!stats[lowKey][val]) stats[lowKey][val] = { total: 0, done: 0 };
        stats[lowKey][val].total += count;
        if (isDone) stats[lowKey][val].done += count;
      });
    });

    $('val-total').textContent = total;
    $('val-done').textContent = done;
    $('val-remain').textContent = total - done;

    renderList('grid-reg', stats.region);
    renderList('grid-city', stats.city);
    renderList('grid-brand', stats.brand);
  }

  function renderList(id, obj) {
    const container = $(id);
    container.innerHTML = '';
    Object.entries(obj).sort((a,b) => b[1].total - a[1].total).forEach(([name, s]) => {
      const pct = Math.round((s.done / s.total) * 100) || 0;
      container.innerHTML += `
        <div class="mini-item">
          <div class="item-name">${name}</div>
          <div class="item-counts">
            <div class="count-pill">${labels[lang].done}: <b>${s.done}</b></div>
            <div class="count-pill">${labels[lang].remain}: <b>${s.total - s.done}</b></div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%; background:${pct === 100 ? 'var(--success)' : 'var(--primary)'}"></div>
          </div>
        </div>
      `;
    });
  }
</script>
</body>
</html>
