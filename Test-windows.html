<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <title>Upgrade Windows — V1.2.6</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --bg: #f4f7f9; }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background: var(--bg); }
        
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: white; padding: 10px 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .lang-switch { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* البطاقات العلوية */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; text-align: center; border-bottom: 5px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stat-card h2 { font-size: 38px; margin: 5px 0; color: var(--primary); }

        /* نموذج إدارة البيانات - تصميم مطابق للصورة */
        .admin-box { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .box-header { background: var(--primary); color: white; padding: 12px 20px; font-weight: bold; display: flex; justify-content: space-between; font-size: 14px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 25px; background: #fcfdfe; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; font-weight: bold; color: #475569; text-align: right; }
        input, select { padding: 10px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 13px; outline: none; background: #fff; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,75,115,0.1); }

        .btn-row { padding: 15px 25px; display: flex; gap: 12px; border-top: 1px solid #eee; background: #fff; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.3s; }
        
        /* إحصائيات المناطق والمدن */
        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .list-card { background: white; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0; }
        .item-row { background: #f8fafc; border-radius: 10px; padding: 10px; margin-bottom: 8px; border: 1px solid #edf2f7; }
        .item-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; text-align: center; margin-top: 5px; }
        .s-box { font-size: 10px; background: white; border: 1px solid #eee; border-radius: 5px; padding: 3px; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        th { background: #f1f5f9; padding: 12px; text-align: inherit; color: var(--primary); font-size: 12px; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; font-size: 12px; }
    </style>
</head>
<body>

<div class="info-bar">
    <div id="user-info">● جارِ التحقق...</div>
    <button class="lang-switch" onclick="toggleLang()" id="langBtn">English</button>
    <div><b>VERSION 1.2.6</b></div>
</div>

<div class="stats-row">
    <div class="stat-card"><span>إجمالي الأجهزة</span><h2 id="val-total">0</h2></div>
    <div class="stat-card" style="border-color:var(--warning)"><span>متبقي</span><h2 id="val-remain" style="color:var(--warning)">0</h2></div>
    <div class="stat-card" style="border-color:var(--success)"><span>مكتمل</span><h2 id="val-done" style="color:var(--success)">0</h2></div>
</div>

<div class="admin-box">
    <div class="box-header"><span>إدارة بيانات الترقية - Upgrade Windows</span> <i class="fas fa-database"></i></div>
    <form id="upgradeForm">
        <div class="form-grid">
            <div class="field"><label>الفرع</label><select id="in-branch"><option>اختر الفرع</option></select></div>
            <div class="field"><label>الموظف موجود في هذا الفرع؟</label><select id="in-isExist"><option>Yes</option><option>No</option></select></div>
            <div class="field"><label>Branch_ID</label><input type="text" id="in-brId" placeholder="ID الفرع"></div>
            <div class="field"><label>Branch_Name</label><input type="text" id="in-brName" placeholder="اسم الفرع"></div>

            <div class="field"><label>Brand</label><select id="in-brand"><option>اختر البراند</option><option>Hyundai</option><option>Genesis</option><option>Changan</option></select></div>
            <div class="field"><label>function</label><input type="text" id="in-func"></div>
            <div class="field"><label>City</label><input type="text" id="in-city"></div>
            <div class="field"><label>Region</label><input type="text" id="in-reg"></div>

            <div class="field"><label>اسم الموظف</label><input type="text" id="in-empName"></div>
            <div class="field"><label>Employee ID</label><input type="text" id="in-empId"></div>
            <div class="field"><label>Device Name</label><input type="text" id="in-devName"></div>
            <div class="field"><label>عدد الأجهزة</label><input type="number" id="in-count" value="1"></div>

            <div class="field"><label>تاريخ زيارة الفني</label><input type="date" id="in-visitDate"></div>
            <div class="field"><label>تاريخ حفظ Check-List</label><input type="date" id="in-checkDate"></div>
            <div class="field" style="grid-column: span 2;"><label>Status</label><select id="in-status"><option value="planned">Planned</option><option value="completed">Completed</option></select></div>
        </div>

        <div class="btn-row">
            <button type="button" style="background:var(--success); color:white" onclick="saveData()">حفظ السجل</button>
            <button type="button" style="background:#e2e8f0" onclick="document.getElementById('upgradeForm').reset()">تنظيف</button>
            <div style="flex:1"></div>
            <button type="button" style="background:white; border:1px solid #ddd" onclick="downloadXL()">تنزيل Excel</button>
            <input type="file" id="fileIn" style="display:none" onchange="uploadXL(this)">
            <button type="button" style="background:#b45309; color:white" onclick="document.getElementById('fileIn').click()">رفع ملف Excel (يمسح القديم)</button>
        </div>
    </form>
</div>

<div class="details-grid">
    <div class="list-card"><b>المناطق</b> <div id="list-reg" class="list-items" style="max-height:200px; overflow-y:auto"></div></div>
    <div class="list-card"><b>المدن</b> <div id="list-city" class="list-items" style="max-height:200px; overflow-y:auto"></div></div>
    <div class="list-card"><b>البراندات</b> <div id="list-brand" class="list-items" style="max-height:200px; overflow-y:auto"></div></div>
</div>

<table>
    <thead><tr><th>Branch ID</th><th>Name</th><th>Brand</th><th>City</th><th>Employee</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    // الإعدادات الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // مزامنة البيانات والتحقق من الدخول
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('user-info').innerText = "● متصل: " + user.email;
            loadData();
        } else {
            window.location.href = "login.html";
        }
    });

    function loadData() {
        db.collection("windows_upgrades").onSnapshot(snap => {
            let total = 0, done = 0;
            const sums = { region: {}, city: {}, brand: {} };
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            snap.forEach(doc => {
                const d = doc.data();
                let c = parseInt(d.devicesCount || d.Devices_Count) || 1;
                let s = String(d.status || '').toLowerCase();
                
                total += c;
                if(s === 'completed') done += c;

                // تجميع للإحصائيات
                ['region', 'city', 'brand'].forEach(k => {
                    let val = d[k] || 'غير محدد';
                    if(!sums[k][val]) sums[k][val] = { t:0, d:0 };
                    sums[k][val].t += c;
                    if(s === 'completed') sums[k][val].d += c;
                });

                tbody.innerHTML += `<tr><td>${d.branchId || '-'}</td><td>${d.branchName || '-'}</td><td>${d.brand || '-'}</td><td>${d.city || '-'}</td><td>${d.employeeName || '-'}</td><td><b>${d.status}</b></td><td><i class="fas fa-trash" style="color:red; cursor:pointer" onclick="del('${doc.id}')"></i></td></tr>`;
            });

            document.getElementById('val-total').innerText = total;
            document.getElementById('val-done').innerText = done;
            document.getElementById('val-remain').innerText = total - done;

            renderStats('list-reg', sums.region);
            renderStats('list-city', sums.city);
            renderStats('list-brand', sums.brand);
        });
    }

    function renderStats(id, data) {
        const el = document.getElementById(id); el.innerHTML = '';
        Object.entries(data).sort((a,b)=>b[1].t - a[1].t).forEach(([name, v]) => {
            el.innerHTML += `
                <div class="item-row">
                    <b>${name}</b>
                    <div class="item-stats">
                        <div class="s-box">إجمالي: ${v.t}</div>
                        <div class="s-box" style="color:orange">باقي: ${v.t - v.d}</div>
                        <div class="s-box" style="color:green">تم: ${v.d}</div>
                    </div>
                </div>`;
        });
    }

    // وظائف الأزرار
    async function saveData() {
        const data = {
            branchName: document.getElementById('in-brName').value,
            branchId: document.getElementById('in-brId').value,
            region: document.getElementById('in-reg').value,
            city: document.getElementById('in-city').value,
            brand: document.getElementById('in-brand').value,
            employeeName: document.getElementById('in-empName').value,
            employeeId: document.getElementById('in-empId').value,
            devicesCount: document.getElementById('in-count').value,
            status: document.getElementById('in-status').value,
            technicianVisitDate: document.getElementById('in-visitDate').value,
            checklistSavedDate: document.getElementById('in-checkDate').value,
            function: document.getElementById('in-func').value,
            deviceName: document.getElementById('in-devName').value,
            isExist: document.getElementById('in-isExist').value
        };
        await db.collection("windows_upgrades").add(data);
        alert("تم الحفظ بنجاح ✅");
    }

    async function uploadXL(input) {
        if(!confirm("سيتم مسح البيانات القديمة بالكامل. هل تريد الاستمرار؟")) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const json = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), {type:'array'}).Sheets[XLSX.read(new Uint8Array(e.target.result), {type:'array'}).SheetNames[0]]);
            const old = await db.collection("windows_upgrades").get();
            const batch = db.batch();
            old.forEach(d => batch.delete(d.ref));
            await batch.commit();
            for(let r of json) { await db.collection("windows_upgrades").add(r); }
            alert("تم التحديث بنجاح 🚀");
        };
        reader.readAsArrayBuffer(input.files[0]);
    }

    async function downloadXL() {
        const snap = await db.collection("windows_upgrades").get();
        XLSX.writeFile(XLSX.utils.book_new(), XLSX.utils.json_to_sheet(snap.docs.map(d => d.data())), "Upgrade_Report.xlsx");
    }

    async function del(id) { if(confirm("حذف؟")) await db.collection("windows_upgrades").doc(id).delete(); }
    
    function toggleLang() { /* كود تغيير اللغة كما في السابق */ }
</script>
</body>
</html>
