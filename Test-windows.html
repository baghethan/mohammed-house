<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار صلاحيات Firebase — المجدوعي</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 30px; background: #f4f7f9; text-align: center; }
        .test-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 450px; text-align: right; }
        .status-pill { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .online { background: #d1fae5; color: #065f46; }
        .offline { background: #fee2e2; color: #991b1b; }
        .log-box { background: #1e293b; color: #38bdf8; padding: 15px; border-radius: 10px; font-family: monospace; font-size: 12px; margin-top: 15px; max-height: 200px; overflow-y: auto; direction: ltr; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; }
        button { width: 100%; padding: 12px; background: #0f5d95; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="test-container">
    <h2 style="text-align: center; color: #0f5d95;">فحص الاتصال والصلاحيات</h2>
    
    <div style="margin-bottom: 20px; text-align: center;">
        حالة الاتصال: <span id="auth-status" class="status-pill offline">غير متصل</span>
    </div>

    <div id="login-section">
        <label>الايميل (يجب أن يكون y.khyar@almajdouie.com):</label>
        <input type="email" id="test-email" placeholder="email@almajdouie.com">
        <label>كلمة المرور:</label>
        <input type="password" id="test-pass" placeholder="******">
        <button onclick="testLogin()">تسجيل دخول واختبار القراءة</button>
    </div>

    <hr>

    <div id="results-section" style="display: none;">
        <h4 style="color: #10b981;">البيانات المستلمة من السحابة:</h4>
        <ul id="data-preview" style="font-size: 13px;"></ul>
    </div>

    <div class="log-box" id="debug-log">> جاري انتظار الأوامر...</div>
</div>

<script>
    // 1. ضع هنا بيانات Firebase Config الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "your-project.firebaseapp.com",
        projectId: "your-project-id",
        storageBucket: "your-project.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abc123"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function log(msg) {
        const l = document.getElementById('debug-log');
        l.innerHTML += `<br>> ${msg}`;
        l.scrollTop = l.scrollHeight;
    }

    async function testLogin() {
        const email = document.getElementById('test-email').value;
        const pass = document.getElementById('test-pass').value;

        log(`محاولة الدخول بـ ${email}...`);
        
        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, pass);
            log("نجح تسجيل الدخول ✅");
            document.getElementById('auth-status').innerText = "متصل: " + userCredential.user.email;
            document.getElementById('auth-status').className = "status-pill online";
            
            // البدء باختبار قراءة المجموعة UpgradeWindows
            testFirestoreRead();
        } catch (error) {
            log("فشل الدخول ❌: " + error.message);
        }
    }

    function testFirestoreRead() {
        log("محاولة قراءة مجموعة 'UpgradeWindows'...");
        
        db.collection("UpgradeWindows").get().then((querySnapshot) => {
            log(`نجحت القراءة! تم العثور على ${querySnapshot.size} سجلات ✅`);
            document.getElementById('results-section').style.display = 'block';
            const list = document.getElementById('data-preview');
            list.innerHTML = "";

            querySnapshot.forEach((doc) => {
                const d = doc.data();
                log(`استلام بيانات: ${d.Brand} - ${d.City}`);
                list.innerHTML += `<li>${d.Brand} (${d.Region}) - الحالة: ${d.Status}</li>`;
            });
        }).catch((error) => {
            log("فشل القراءة (خطأ صلاحيات/Permissions) ❌: " + error.message);
            log("تأكد أن الـ Rules تسمح لهذا الإيميل بالقراءة.");
        });
    }
</script>

</body>
</html>
