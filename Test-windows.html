<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار اتصال Firebase — المجدوعي</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 40px; background: #f0f2f5; text-align: center; }
        .status-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: inline-block; min-width: 400px; }
        .log-area { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 10px; text-align: left; font-family: monospace; margin-top: 20px; max-height: 300px; overflow-y: auto; font-size: 13px; }
        .stat-preview { display: flex; justify-content: space-around; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="status-box">
        <h2 style="color: #0f5d95;">فحص اتصال البيانات الحية</h2>
        <p id="conn-status" style="color: orange;">جاري محاولة الاتصال بـ Firebase...</p>
        
        <div class="stat-preview">
            <div>الإجمالي: <span id="t-v">0</span></div>
            <div>المتبقي: <span id="r-v" style="color: orange;">0</span></div>
            <div>المكتمل: <span id="d-v" style="color: green;">0</span></div>
        </div>

        <div class="log-area" id="log">
            > جاري بدء الفحص...
        </div>
    </div>

    <script>
        // 1. ضع بيانات الـ Config الخاصة بك هنا (مهم جداً)
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        function addLog(msg) {
            const log = document.getElementById('log');
            log.innerHTML += `<br>> ${msg}`;
            log.scrollTop = log.scrollHeight;
        }

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.firestore();
            addLog("تم تهيئة Firebase بنجاح.");

            // 2. محاولة جلب البيانات من مجموعة UpgradeWindows
            db.collection("UpgradeWindows").onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    addLog("تنبيه: المجموعة 'UpgradeWindows' فارغة أو غير موجودة.");
                    document.getElementById('conn-status').innerText = "المجموعة فارغة!";
                    document.getElementById('conn-status').style.color = "red";
                    return;
                }

                let total = 0, done = 0;
                addLog(`تم العثور على ${snapshot.size} سجلات.`);

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const count = parseInt(data.Devices_Count || 1);
                    const isDone = String(data.Status || '').toLowerCase() === 'completed';
                    
                    total += count;
                    if (isDone) done += count;
                    
                    addLog(`سجل مستلم: ${data.Brand || 'N/A'} - الحالة: ${data.Status}`);
                });

                document.getElementById('t-v').innerText = total;
                document.getElementById('d-v').innerText = done;
                document.getElementById('r-v').innerText = total - done;
                document.getElementById('conn-status').innerText = "تم جلب البيانات بنجاح ✅";
                document.getElementById('conn-status').style.color = "green";
                addLog("تم تحديث الواجهة بالبيانات الحية.");

            }, (error) => {
                addLog("خطأ في القراءة: " + error.message);
                document.getElementById('conn-status').innerText = "فشل الاتصال (خطأ صلاحيات)";
                document.getElementById('conn-status').style.color = "red";
            });

        } catch (e) {
            addLog("خطأ فني في الكود: " + e.message);
        }
    </script>
</body>
</html>
