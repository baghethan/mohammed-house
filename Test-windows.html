<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Windows — V1.1.2</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --glass: rgba(255, 255, 255, 0.9); }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background: transparent; color: #1e293b; }
        
        .container-glass { background: var(--glass); backdrop-filter: blur(15px); border-radius: 20px; padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        
        /* الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0; }
        .stat-card { background: #fff; padding: 20px; border-radius: 16px; text-align: center; border-bottom: 5px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .stat-card h2 { font-size: 38px; margin: 8px 0 0; color: var(--primary); }

        /* القوائم الثلاث */
        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .list-box { max-height: 350px; overflow-y: auto; background: rgba(255,255,255,0.5); border-radius: 15px; padding: 10px; border: 1px solid #eee; }
        .item-row { background: #fff; border-radius: 10px; padding: 10px; margin-bottom: 8px; border: 1px solid #f1f5f9; font-size: 13px; }

        /* البطاقة الجديدة للسجلات (مثل الصورة المطلوبة) */
        .records-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .card-header { background: var(--primary); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { margin: 0; font-size: 16px; }
        
        .search-container { padding: 15px; background: #f8fafc; border-bottom: 1px solid #eee; }
        .global-search { width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; outline: none; box-sizing: border-box; font-size: 14px; }

        .table-wrapper { overflow-x: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; font-size: 13px; text-align: right; }
        th { background: #fff; color: var(--primary); padding: 12px; border-bottom: 2px solid #eee; position: sticky; top: 0; z-index: 10; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        
        .info-header { display: flex; justify-content: space-between; font-size: 11px; color: #64748b; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container-glass">
    <div class="info-header">
        <div id="update-time">آخر تحديث: --:--</div>
        <div id="conn-status" style="color:var(--success)">● متصل بالسحابة</div>
    </div>

    <h2 style="color: var(--primary); margin: 0;">نظام متابعة التحديثات</h2>

    <div class="stats-grid">
        <div class="stat-card"><span>إجمالي الأجهزة</span><h2 id="total-val">0</h2></div>
        <div class="stat-card" style="border-color:var(--warning)"><span>متبقي</span><h2 id="remain-val" style="color:var(--warning)">0</h2></div>
        <div class="stat-card" style="border-color:var(--success)"><span>مكتمل</span><h2 id="done-val" style="color:var(--success)">0</h2></div>
    </div>

    <div class="details-grid">
        <div><h4>المناطق</h4><div id="reg-list" class="list-box"></div></div>
        <div><h4>المدن</h4><div id="city-list" class="list-box"></div></div>
        <div><h4>البراندات</h4><div id="brand-list" class="list-box"></div></div>
    </div>

    <div class="records-card">
        <div class="card-header">
            <h3>سجلات Upgrade Windows</h3>
            <span style="font-size: 11px; opacity: 0.8;">قاعدة البيانات الحية</span>
        </div>
        
        <div class="search-container">
            <input type="text" id="globalSearch" class="global-search" onkeyup="universalFilter()" placeholder="ابحث عن فرع، موظف، مدينة أو حالة...">
        </div>

        <div class="table-wrapper">
            <table id="recordsTable">
                <thead>
                    <tr>
                        <th>Branch ID</th>
                        <th>Branch Name</th>
                        <th>Brand</th>
                        <th>Function</th>
                        <th>City</th>
                        <th>Region</th>
                        <th>Status</th>
                        <th style="text-align: center;">إجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // جلب البيانات اللحظي
    db.collection("windows_upgrades").onSnapshot(snapshot => {
        let total = 0, done = 0;
        const stats = { Region: {}, City: {}, Brand: {} };
        const listData = [];

        snapshot.forEach(doc => {
            const data = doc.data();
            let count = parseInt(data.devicesCount) || 1;
            const isDone = (String(data.status).toLowerCase().trim() === 'completed');

            total += count; if (isDone) done += count;

            const updateS = (obj, key) => {
                if (!obj[key]) obj[key] = { t: 0, d: 0 };
                obj[key].t += count; if (isDone) obj[key].d += count;
            };
            updateS(stats.Region, data.region || 'N/A');
            updateS(stats.City, data.city || 'N/A');
            updateS(stats.Brand, data.brand || 'N/A');

            listData.push({ id: doc.id, ...data });
        });

        document.getElementById('total-val').innerText = total;
        document.getElementById('done-val').innerText = done;
        document.getElementById('remain-val').innerText = total - done;

        renderSummaries(stats);
        renderStyledTable(listData);
        updateTimeLabel();
    });

    function renderSummaries(stats) {
        const draw = (id, obj) => {
            const el = document.getElementById(id); el.innerHTML = '';
            Object.entries(obj).sort((a,b)=>b[1].t - a[1].t).forEach(([n, s]) => {
                el.innerHTML += `<div class="item-row"><b>${n}</b><br><small>الإجمالي: ${s.t} | المتبقي: ${s.t-s.d}</small></div>`;
            });
        };
        draw('reg-list', stats.Region); draw('city-list', stats.City); draw('brand-list', stats.Brand);
    }

    function renderStyledTable(data) {
        const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
        data.forEach(item => {
            const row = `<tr>
                <td>${item.branchId || '-'}</td>
                <td>${item.branchName || '-'}</td>
                <td>${item.brand || '-'}</td>
                <td>${item.functionName || item.function || '-'}</td>
                <td>${item.city || '-'}</td>
                <td>${item.region || '-'}</td>
                <td><b style="color:${item.status==='completed'?'#10b981':'#f59e0b'}">${item.status || 'planned'}</b></td>
                <td style="text-align:center"><i class="fas fa-edit" style="color:var(--primary);cursor:pointer"></i></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    // بحث موحد شامل (مثل الصورة)
    function universalFilter() {
        const query = document.getElementById('globalSearch').value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
        });
    }

    function updateTimeLabel() {
        const now = new Date(); document.getElementById('update-time').innerText = `تحديث: ${now.toLocaleTimeString('ar-SA')}`;
    }
</script>
</body>
</html>
