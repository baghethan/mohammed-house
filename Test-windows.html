<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Windows — V1.0.9</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --primary: #0d4b73;
            --success: #10b981;
            --warning: #f59e0b;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;
            background: transparent; color: #1e293b;
        }

        .container-glass {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px;
            padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            position: relative;
        }

        .info-header {
            display: flex; justify-content: space-between;
            font-size: 11px; color: #64748b; font-weight: bold; margin-bottom: 8px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0; }
        .stat-card {
            background: #fff; padding: 20px; border-radius: 16px; text-align: center;
            border-bottom: 5px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .stat-card.warning { border-bottom-color: var(--warning); }
        .stat-card.success { border-bottom-color: var(--success); }
        .stat-card h2 { font-size: 38px; margin: 8px 0 0; color: var(--primary); }

        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .list-box { max-height: 480px; overflow-y: auto; background: rgba(255,255,255,0.5); border-radius: 15px; padding: 10px; }
        .item-row { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #eee; }
        
        #conn-indicator { font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container-glass">
    <div class="info-header">
        <div id="update-time">توقيت العرض: --:--</div>
        <div>VERSION 1.0.9</div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="color: var(--primary); margin: 0;">لوحة متابعة تحديثات ويندوز</h2>
        <div id="conn-indicator" style="color: var(--warning);">● جاري فحص الصلاحيات...</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span>إجمالي الأجهزة</span>
            <h2 id="total-val">0</h2>
        </div>
        <div class="stat-card warning">
            <span>متبقي</span>
            <h2 id="remain-val" style="color: var(--warning);">0</h2>
        </div>
        <div class="stat-card success">
            <span>مكتمل</span>
            <h2 id="done-val" style="color: var(--success);">0</h2>
        </div>
    </div>

    <div class="details-grid">
        <div><h4>المناطق</h4> <div id="reg-list" class="list-box"></div></div>
        <div><h4>المدن</h4> <div id="city-list" class="list-box"></div></div>
        <div><h4>البراندات</h4> <div id="brand-list" class="list-box"></div></div>
    </div>
</div>

<script>
    // ✅ بيانات الربط الخاصة بمشروعك baghethan-ba325
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    function updateDateTime() {
        const now = new Date();
        document.getElementById('update-time').innerText = 
            `آخر تحديث: ${now.toLocaleDateString('ar-SA')} | ${now.toLocaleTimeString('ar-SA')}`;
    }

    function listenToData() {
        // الاستماع لمجموعة windows_upgrades بناءً على صورك وقواعدك
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            if (snapshot.empty) {
                document.getElementById('conn-indicator').innerText = "● لا توجد بيانات حالياً";
                document.getElementById('conn-indicator').style.color = "red";
                return;
            }

            document.getElementById('conn-indicator').innerText = "● متصل بالسحابة";
            document.getElementById('conn-indicator').style.color = "var(--success)";

            let total = 0, done = 0;
            const stats = { Region: {}, City: {}, Brand: {} };

            snapshot.forEach(doc => {
                const data = doc.data();
                
                // ✅ معالجة الحقول: إذا كان devicesCount نل، نفترضه جهازاً واحداً
                let count = parseInt(data.devicesCount);
                if (isNaN(count)) count = 1; 

                const status = String(data.status || '').toLowerCase().trim();
                const isDone = (status === 'completed');
                
                total += count;
                if (isDone) done += count;

                // تصنيف البيانات حسب الحقول الموجودة في الصورة
                const reg = data.region || 'غير محدد';
                const cit = data.city || 'غير محدد';
                const brd = data.brand || 'غير محدد';

                const updateObj = (obj, key) => {
                    if (!obj[key]) obj[key] = { t: 0, d: 0 };
                    obj[key].t += count;
                    if (isDone) obj[key].d += count;
                };

                updateObj(stats.Region, reg);
                updateObj(stats.City, cit);
                updateObj(stats.Brand, brd);
            });

            document.getElementById('total-val').innerText = total;
            document.getElementById('done-val').innerText = done;
            document.getElementById('remain-val').innerText = total - done;

            renderList('reg-list', stats.Region);
            renderList('city-list', stats.City);
            renderList('brand-list', stats.Brand);
            updateDateTime();

        }, error => {
            console.error(error);
            // سيظهر هذا الخطأ إذا حاولت فتح الصفحة بدون تسجيل دخول مسبق
            document.getElementById('conn-indicator').innerText = "● خطأ: " + error.code;
            document.getElementById('conn-indicator').style.color = "red";
        });
    }

    function renderList(id, obj) {
        const container = document.getElementById(id);
        container.innerHTML = '';
        Object.entries(obj).sort((a,b) => b[1].t - a[1].t).forEach(([name, s]) => {
            const pct = Math.round((s.d / s.t) * 100) || 0;
            container.innerHTML += `
                <div class="item-row">
                    <div style="font-weight:bold; font-size:13px;">${name}</div>
                    <div style="display:flex; justify-content:space-between; font-size:11px; margin:5px 0;">
                        <span>إجمالي: ${s.t}</span>
                        <span style="color:var(--warning)">متبقي: ${s.t - s.d}</span>
                        <span style="color:var(--success)">مكتمل: ${s.d}</span>
                    </div>
                    <div style="height:4px; background:#eee; border-radius:10px; overflow:hidden;">
                        <div style="width:${pct}%; height:100%; background:var(--primary);"></div>
                    </div>
                </div>`;
        });
    }

    // يجب التحقق من تسجيل الدخول أولاً للسماح بالقراءة
    auth.onAuthStateChanged(user => {
        if (user) {
            listenToData();
        } else {
            document.getElementById('conn-indicator').innerText = "● يرجى تسجيل الدخول أولاً";
            document.getElementById('conn-indicator').style.color = "red";
        }
    });
</script>
</body>
</html>
