<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <title>Upgrade Windows — V1.2.5</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --danger: #d64545; }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; }
        
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: white; padding: 10px 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .lang-switch { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        /* البطاقات العلوية */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; text-align: center; border-bottom: 5px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stat-card h2 { font-size: 42px; margin: 10px 0; color: var(--primary); }

        /* بطاقات القوائم المحدثة */
        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .list-card { background: white; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .list-card b { font-size: 14px; color: var(--primary); border-bottom: 2px solid #f1f5f9; display: block; padding-bottom: 8px; }
        .list-items { max-height: 250px; overflow-y: auto; margin-top: 10px; }
        
        /* تنسيق السطر الثلاثي الجديد */
        .item { background: #f8fafc; border-radius: 10px; padding: 10px; margin-bottom: 8px; border: 1px solid #edf2f7; }
        .item-name { font-weight: bold; font-size: 13px; margin-bottom: 5px; display: block; color: #334155; }
        .item-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; text-align: center; }
        .stat-box { font-size: 11px; font-weight: bold; padding: 4px; border-radius: 6px; background: white; border: 1px solid #f1f5f9; }
        .stat-label { font-size: 9px; display: block; color: #64748b; margin-bottom: 2px; }

        /* الإدارة والجدول */
        .admin-box { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .box-header { background: var(--primary); color: white; padding: 15px 20px; font-weight: bold; display: flex; justify-content: space-between; }
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: bold; color: #64748b; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; }
        .btn-row { padding: 12px 20px; display: flex; gap: 10px; border-top: 1px solid #eee; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; margin-top: 10px; }
        th { background: #f1f5f9; padding: 12px; text-align: inherit; color: var(--primary); font-size: 12px; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; font-size: 12px; }
    </style>
</head>
<body>

<div class="info-bar">
    <div id="user-info">● جارِ التحقق...</div>
    <div id="sys-version">VERSION 1.2.5</div>
    <button class="lang-switch" onclick="toggleLang()" id="langBtn">English</button>
</div>

<div class="stats-row">
    <div class="stat-card"><span id="txt-total">إجمالي الأجهزة</span><h2 id="val-total">0</h2></div>
    <div class="stat-card" style="border-color:var(--warning)"><span id="txt-remain">متبقي (Planned)</span><h2 id="val-remain" style="color:var(--warning)">0</h2></div>
    <div class="stat-card" style="border-color:var(--success)"><span id="txt-done">مكتمل (Completed)</span><h2 id="val-done" style="color:var(--success)">0</h2></div>
</div>

<div class="details-grid">
    <div class="list-card"><b id="txt-reg">إحصائيات المناطق</b> <div id="list-reg" class="list-items"></div></div>
    <div class="list-card"><b id="txt-city">إحصائيات المدن</b> <div id="list-city" class="list-items"></div></div>
    <div class="list-card"><b id="txt-brand">إحصائيات البراندات</b> <div id="list-brand" class="list-items"></div></div>
</div>

<div class="admin-box">
    <div class="box-header"><span id="txt-admin-title">إدارة بيانات الترقية</span> <i class="fas fa-edit"></i></div>
    <form id="upForm">
        <div class="form-grid">
            <div class="field"><label id="lbl-brId">Branch ID</label><input type="text" id="in-brId"></div>
            <div class="field"><label id="lbl-brName">اسم الفرع</label><input type="text" id="in-brName"></div>
            <div class="field"><label id="lbl-reg">المنطقة</label><input type="text" id="in-reg"></div>
            <div class="field"><label id="lbl-city">المدينة</label><input type="text" id="in-city"></div>
            <div class="field"><label id="lbl-brand">البراند</label><select id="in-brand"><option>Hyundai</option><option>Genesis</option><option>Changan</option><option>Stellantis</option></select></div>
            <div class="field"><label id="lbl-status">الحالة</label><select id="in-status"><option value="planned">Planned</option><option value="completed">Completed</option></select></div>
        </div>
        <div class="btn-row">
            <button type="button" style="background:var(--success); color:white" onclick="saveDoc()" id="btn-save">حفظ السجل</button>
            <div style="flex:1"></div>
            <button type="button" style="background:white; border:1px solid #ddd" onclick="exportXL()" id="btn-down">تنزيل Excel</button>
            <input type="file" id="xlFile" style="display:none" onchange="importXL(this)">
            <button type="button" style="background:#b45309; color:white" onclick="document.getElementById('xlFile').click()" id="btn-up">رفع Excel (مسح القديم)</button>
        </div>
    </form>
</div>

<table>
    <thead><tr><th>Branch ID</th><th>Branch Name</th><th>Brand</th><th>City</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    // الإعدادات
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const langData = {
        ar: { t: "الإجمالي", r: "متبقي", d: "مكتمل", lang: "English", dir: "rtl" },
        en: { t: "Total", r: "Remain", d: "Done", lang: "العربية", dir: "ltr" }
    };
    let currentLang = 'ar';

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.getElementById('mainHtml').dir = langData[currentLang].dir;
        document.getElementById('langBtn').innerText = langData[currentLang].lang;
        // تحديث النصوص الأخرى يدوياً هنا حسب الحاجة
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('user-info').innerText = "● متصل: " + user.email;
            db.collection("windows_upgrades").onSnapshot(snap => {
                let total = 0, done = 0;
                const sums = { region: {}, city: {}, brand: {} };
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                snap.forEach(doc => {
                    const d = doc.data();
                    let count = parseInt(d.devicesCount || d.Devices_Count) || 1;
                    let status = String(d.status || d.Status || '').toLowerCase().trim();
                    
                    total += count;
                    if(status === 'completed') done += count;

                    // تجميع الإحصائيات الثلاثية لكل فئة
                    ['region', 'city', 'brand'].forEach(k => {
                        let val = d[k] || d[k.charAt(0).toUpperCase() + k.slice(1)] || 'N/A';
                        if(!sums[k][val]) sums[k][val] = { t: 0, d: 0 };
                        sums[k][val].t += count;
                        if(status === 'completed') sums[k][val].d += count;
                    });

                    tbody.innerHTML += `<tr><td>${d.branchId||'-'}</td><td>${d.branchName||'-'}</td><td>${d.brand||'-'}</td><td>${d.city||'-'}</td><td>${status}</td><td><i class="fas fa-trash" style="color:red;cursor:pointer" onclick="delDoc('${doc.id}')"></i></td></tr>`;
                });

                document.getElementById('val-total').innerText = total;
                document.getElementById('val-done').innerText = done;
                document.getElementById('val-remain').innerText = total - done;

                renderStyledList('list-reg', sums.region);
                renderStyledList('list-city', sums.city);
                renderStyledList('list-brand', sums.brand);
            });
        } else { window.location.href = "login.html"; }
    });

    // دالة العرض الثلاثي الجديدة
    function renderStyledList(id, data) {
        const el = document.getElementById(id); el.innerHTML = '';
        const l = langData[currentLang];
        
        Object.entries(data).sort((a,b)=>b[1].t-a[1].t).forEach(([name, val]) => {
            el.innerHTML += `
                <div class="item">
                    <span class="item-name">${name}</span>
                    <div class="item-stats">
                        <div class="stat-box"><span class="stat-label">${l.t}</span>${val.t}</div>
                        <div class="stat-box" style="color:var(--warning)"><span class="stat-label">${l.r}</span>${val.t - val.d}</div>
                        <div class="stat-box" style="color:var(--success)"><span class="stat-label">${l.d}</span>${val.d}</div>
                    </div>
                </div>`;
        });
    }

    async function saveDoc() { /* كود الحفظ المذكور سابقاً */ }
    async function exportXL() { /* كود التنزيل المذكور سابقاً */ }
    async function importXL(input) { /* كود الرفع المذكور سابقاً */ }
    async function delDoc(id) { if(confirm("حذف؟")) await db.collection("windows_upgrades").doc(id).delete(); }
</script>
</body>
</html>
