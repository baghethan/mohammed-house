// استبدل قسم الـ <script> في ملفك بهذا الكود المطور
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // التحقق من حالة المستخدم فور تحميل الصفحة
    auth.onAuthStateChanged(user => {
        if (user) {
            console.log("✅ مسجل دخول كـ:", user.email);
            document.getElementById('update-time').innerHTML = `👤 متصل: ${user.email}`;
            startDataSync(); // ابدأ المزامنة فقط بعد التأكد من الهوية
        } else {
            console.error("❌ غير مسجل دخول!");
            alert("عذراً، يجب تسجيل الدخول من صفحة login.html أولاً لتظهر البيانات.");
            window.location.href = "login.html";
        }
    });

    function startDataSync() {
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const sums = { Region: {}, City: {}, Brand: {} };
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            snapshot.forEach(doc => {
                const d = doc.data();
                let c = parseInt(d.devicesCount) || 1;
                total += c;
                if(String(d.status).toLowerCase() === 'completed') done += c;

                // تحديث البطاقات
                ['region', 'city', 'brand'].forEach(key => {
                    let val = d[key] || 'N/A';
                    let group = key === 'region' ? 'reg-list' : key === 'city' ? 'city-list' : 'brand-list';
                    if(!sums[key]) sums[key] = {};
                    if(!sums[key][val]) sums[key][val] = 0;
                    sums[key][val] += c;
                });

                tbody.innerHTML += `<tr>
                    <td>${d.branchId || ''}</td><td>${d.branchName || ''}</td><td>${d.brand || ''}</td>
                    <td>${d.city || ''}</td><td>${d.employeeId || ''}</td>
                    <td><b style="color:${d.status==='completed'?'green':'orange'}">${d.status}</b></td>
                    <td><i class="fas fa-trash" style="color:red;cursor:pointer" onclick="deleteDoc('${doc.id}')"></i></td>
                </tr>`;
            });

            document.getElementById('total-val').innerText = total;
            document.getElementById('done-val').innerText = done;
            document.getElementById('remain-val').innerText = total - done;

            // رسم البطاقات
            updateDetailCards(sums);
        }, error => {
            if(error.code === 'permission-denied') {
                alert("خطأ: ليس لديك صلاحية لعرض هذه البيانات. تأكد أن حسابك 'Active' في Firestore.");
            }
        });
    }

    function updateDetailCards(sums) {
        const render = (id, data) => {
            const el = document.getElementById(id); if(!el) return;
            el.innerHTML = '';
            if(data) {
                Object.entries(data).sort((a,b)=>b[1]-a[1]).forEach(([n, v]) => {
                    el.innerHTML += `<div class="item-row"><span>${n}</span><b>${v}</b></div>`;
                });
            }
        };
        render('reg-list', sums.region);
        render('city-list', sums.city);
        render('brand-list', sums.brand);
    }

    // وظيفة الرفع (تحتاج صلاحية Admin)
    async function importData(input) {
        try {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
                const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                
                // مسح القديم
                const old = await db.collection("windows_upgrades").get();
                const batch = db.batch();
                old.forEach(d => batch.delete(d.ref));
                await batch.commit();

                // رفع الجديد
                for(let r of json) { await db.collection("windows_upgrades").add(r); }
                alert("تم تحديث البيانات بنجاح 🚀");
            };
            reader.readAsArrayBuffer(input.files[0]);
        } catch (err) {
            alert("فشل الرفع: قد لا تملك صلاحية Admin للقيام بهذه العملية.");
        }
    }
</script>
