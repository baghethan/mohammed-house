<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlPage">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upgrade Windows — Almajdouie Motors</title>
  
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --bg:#f3f6fb;
      --card:#ffffff;
      --text:#16324a;
      --muted:#6b7b8c;
      --primary:#0f5d95;
      --border:#d9e3ee;
      --success:#198754;
      --warning:#fd7e14;
      --shadow:0 10px 28px rgba(15,49,85,.08);
      --radius:18px;
    }

    *{box-sizing:border-box; transition: all 0.2s ease;}
    body{ margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:"Segoe UI", Tahoma, sans-serif; }
    .page{ max-width:1600px; margin:0 auto; }

    /* الهيدر */
    .page-header{
      background:linear-gradient(135deg,#0f5d95,#0f4c79);
      color:#fff; padding:22px; border-radius:18px; margin-bottom:18px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-info h1{ margin:0; font-size:24px; font-weight:800; }
    .header-info p{ margin:5px 0 0; opacity:0.8; font-size: 14px; }

    /* الأزرار */
    .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
    .toolbar{ display:flex; gap:12px; margin-bottom:20px; flex-wrap: wrap; }
    
    .btn {
      border:none; border-radius:12px; padding:10px 18px; background:var(--primary); color:#fff;
      font-weight:700; cursor:pointer; display: flex; align-items: center; gap: 8px;
    }
    .btn.upload { background: var(--success); }
    .btn.lang-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); }
    .btn.secondary { background:#fff; color:var(--primary); border: 1px solid var(--border); }

    /* الإحصائيات */
    .upgrade-summary-top{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom: 20px; }
    .stat{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:20px; text-align: center; }
    .stat .label{ color:var(--muted); font-size:14px; display: block; margin-bottom: 5px; font-weight: 600; }
    .stat .value{ color:var(--primary); font-size:32px; font-weight:900; }

    /* الجريد */
    .upgrade-meta-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
    .upgrade-meta-card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; min-height:400px; }
    .upgrade-meta-card h4{ margin-top:0; color:var(--primary); border-bottom: 2px solid #f0f4f8; padding-bottom: 10px; font-size: 18px; }

    .upgrade-mini-grid{ display:grid; gap:12px; max-height: 550px; overflow-y: auto; padding: 5px; }
    .upgrade-mini-card{ border:1px solid var(--border); border-top:5px solid var(--primary); border-radius:14px; padding:15px; background:#fbfdff; }
    .upgrade-mini-title{ font-weight:800; color:var(--primary); margin-bottom: 10px; font-size: 14px; }
    .upgrade-mini-stats{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
    
    .pill{ border-radius:8px; padding:6px; text-align: center; font-size: 12px; background: #fff; border: 1px solid #eee; }
    .pill b { display: block; font-size: 16px; }
    .done-text { color: var(--success); }
    .wait-text { color: var(--warning); }

    .progress-track { height: 8px; background: #eee; border-radius: 10px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; transition: 0.8s ease-in-out; }

    #fileInput { display: none; }

    /* تحسينات للشاشات الصغيرة */
    @media (max-width: 900px) {
      .upgrade-summary-top, .upgrade-meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="page-header">
    <div class="header-info">
      <h1 id="txt-title">شركة المجدوعي للسيارات — تحديث ويندوز</h1>
      <p id="txt-subtitle">نظام متابعة حالة الأجهزة المحدثة</p>
    </div>
    <button class="btn lang-btn" onclick="toggleLanguage()">
      🌐 <span id="btn-lang-text">English</span>
    </button>
  </div>

  <section class="card">
    <div class="toolbar">
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
      <button class="btn upload" onclick="document.getElementById('fileInput').click()">
        <span id="txt-upload">📁 ارفع ملف الإكسيل</span>
      </button>
      <button class="btn secondary" onclick="location.reload()" id="txt-reset">🔄 إعادة تعيين</button>
    </div>

    <div class="upgrade-summary-top">
      <div class="stat">
        <span class="label" id="txt-stat-total">إجمالي الأجهزة</span>
        <div class="value" id="totalDevices">0</div>
      </div>
      <div class="stat">
        <span class="label" id="txt-stat-done">مكتمل ✅</span>
        <div class="value" id="totalCompleted" style="color: var(--success);">0</div>
      </div>
      <div class="stat">
        <span class="label" id="txt-stat-remain">المتبقي ⏳</span>
        <div class="value" id="totalRemaining" style="color: var(--warning);">0</div>
      </div>
    </div>

    <div class="upgrade-meta-grid">
      <div class="upgrade-meta-card">
        <h4 id="txt-grid-regions">المناطق</h4>
        <div id="regionsGrid" class="upgrade-mini-grid"></div>
      </div>
      <div class="upgrade-meta-card">
        <h4><span id="txt-grid-cities">المدن</span></h4>
        <div id="citiesGrid" class="upgrade-mini-grid"></div>
      </div>
      <div class="upgrade-meta-card">
        <h4 id="txt-grid-brands">البراندات</h4>
        <div id="brandsGrid" class="upgrade-mini-grid"></div>
      </div>
    </div>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);
  let currentLang = 'ar';
  let lastData = [];

  // قاموس اللغات
  const i18n = {
    ar: {
      title: "شركة المجدوعي للسيارات — تحديث ويندوز",
      subtitle: "نظام متابعة حالة الأجهزة المحدثة",
      upload: "📁 ارفع ملف الإكسيل",
      reset: "🔄 إعادة تعيين",
      total: "إجمالي الأجهزة",
      done: "مكتمل ✅",
      remain: "المتبقي ⏳",
      regions: "المناطق",
      cities: "المدن",
      brands: "البراندات",
      pillDone: "مكتمل",
      pillWait: "متبقي",
      langBtn: "English",
      // ترجمة القيم داخل الداتا
      map: { "Eastern Province": "المنطقة الشرقية", "Central Province": "المنطقة الوسطى", "Western Province": "المنطقة الغربية" }
    },
    en: {
      title: "Almajdouie Motors — Windows Upgrade",
      subtitle: "Upgraded Devices Tracking System",
      upload: "📁 Upload Excel File",
      reset: "🔄 Reset",
      total: "Total Devices",
      done: "Completed ✅",
      remain: "Remaining ⏳",
      regions: "Regions",
      cities: "Cities",
      brands: "Brands",
      pillDone: "Done",
      pillWait: "Pending",
      langBtn: "العربية",
      map: { "المنطقة الشرقية": "Eastern Province", "المنطقة الوسطى": "Central Province", "المنطقة الغربية": "Western Province" }
    }
  };

  function toggleLanguage() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    const html = $('htmlPage');
    html.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    html.lang = currentLang;

    // تحديث النصوص الثابتة
    $('txt-title').textContent = i18n[currentLang].title;
    $('txt-subtitle').textContent = i18n[currentLang].subtitle;
    $('txt-upload').textContent = i18n[currentLang].upload;
    $('txt-reset').textContent = i18n[currentLang].reset;
    $('txt-stat-total').textContent = i18n[currentLang].total;
    $('txt-stat-done').textContent = i18n[currentLang].done;
    $('txt-stat-remain').textContent = i18n[currentLang].remain;
    $('txt-grid-regions').textContent = i18n[currentLang].regions;
    $('txt-grid-cities').textContent = i18n[currentLang].cities;
    $('txt-grid-brands').textContent = i18n[currentLang].brands;
    $('btn-lang-text').textContent = i18n[currentLang].langBtn;

    // إعادة رندر البيانات إذا كانت موجودة
    if (lastData.length > 0) renderDashboard(lastData);
  }

  $('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(event) {
      const data = new Uint8Array(event.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
      processData(json);
    };
    reader.readAsArrayBuffer(file);
  });

  function processData(raw) {
    lastData = raw.map(r => ({
      region: r.Region || r.region || 'N/A',
      city: r.City || r.city || 'N/A',
      brand: r.Brand || r.brand || 'General',
      count: parseInt(r.Devices_Count || r.devicesCount || 1) || 1,
      status: String(r.Status || r.status || '').toLowerCase().trim()
    }));
    renderDashboard(lastData);
  }

  function translateValue(val) {
    // محاولة ترجمة القيمة إذا كانت موجودة في القاموس
    return i18n[currentLang].map[val] || val;
  }

  function renderDashboard(data) {
    let t = 0, c = 0;
    const groups = { region: {}, city: {}, brand: {} };

    data.forEach(item => {
      t += item.count;
      const isDone = (item.status === 'completed');
      if (isDone) c += item.count;

      ['region', 'city', 'brand'].forEach(key => {
        const val = translateValue(item[key]);
        if (!groups[key][val]) groups[key][val] = { total: 0, done: 0 };
        groups[key][val].total += item.count;
        if (isDone) groups[key][val].done += item.count;
      });
    });

    $('totalDevices').textContent = t;
    $('totalCompleted').textContent = c;
    $('totalRemaining').textContent = t - c;

    renderCards('regionsGrid', groups.region);
    renderCards('citiesGrid', groups.city);
    renderCards('brandsGrid', groups.brand);
  }

  function renderCards(id, obj) {
    const grid = $(id);
    grid.innerHTML = '';
    
    Object.entries(obj).sort((a,b) => b[1].total - a[1].total).forEach(([name, stats]) => {
      const pct = Math.round((stats.done / stats.total) * 100) || 0;
      const color = pct === 100 ? 'var(--success)' : 'var(--primary)';
      
      grid.innerHTML += `
        <div class="upgrade-mini-card" style="border-top-color: ${color}">
          <div class="upgrade-mini-title">${name}</div>
          <div class="upgrade-mini-stats">
            <div class="pill"><span class="done-text">${i18n[currentLang].pillDone}</span><b>${stats.done}</b></div>
            <div class="pill"><span class="wait-text">${i18n[currentLang].pillWait}</span><b>${stats.total - stats.done}</b></div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${pct}%; background:${color}"></div>
          </div>
          <div style="font-size:11px; margin-top:5px; font-weight:bold; text-align: ${currentLang === 'ar' ? 'left' : 'right'}">${pct}%</div>
        </div>
      `;
    });
  }
</script>
</body>
</html>
