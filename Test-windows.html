<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة المتكامل — المجدوعي</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --primary: #0f5d95;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #1e293b;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e3ee 100%);
            min-height: 100vh;
            display: flex;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 260px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar[dir="ltr"] { border-left: none; border-right: 1px solid var(--glass-border); }

        .logo-area { text-align: center; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); margin-bottom: 10px; }
        .logo-area img { max-width: 150px; }

        .nav-item {
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            font-weight: 600;
            transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: #fff; }

        /* المحتوى الرئيسي */
        .main-content {
            margin-right: 280px;
            padding: 30px;
            width: 100%;
            transition: 0.3s;
        }
        html[lang="en"] .main-content { margin-right: 0; margin-left: 280px; }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        /* تنسيقات قسم Upgrade Windows */
        .upgrade-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 25px 0;
        }

        .stat-widget {
            padding: 20px;
            border-radius: 18px;
            background: rgba(255,255,255,0.5);
            text-align: center;
            border-bottom: 4px solid var(--primary);
        }
        .stat-widget.warning { border-bottom-color: var(--warning); }
        .stat-widget.success { border-bottom-color: var(--success); }

        .stat-widget span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; font-weight: bold; }
        .stat-widget h2 { margin: 0; font-size: 32px; color: var(--primary); }
        .warning h2 { color: var(--warning); }
        .success h2 { color: var(--success); }

        .details-layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .scroll-list { max-height: 500px; overflow-y: auto; padding-right: 5px; }

        .mini-card {
            background: #fff;
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .mini-card h5 { margin: 0 0 10px 0; color: var(--primary); font-size: 15px; }

        .mini-stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; }
        .p-badge { font-size: 10px; padding: 5px; border-radius: 8px; background: #f8fafc; text-align: center; border: 1px solid #eee; }
        .p-badge b { display: block; font-size: 14px; margin-top: 3px; }

        .progress-line { height: 6px; background: #eee; border-radius: 10px; overflow: hidden; }
        .progress-line div { height: 100%; transition: 0.5s; }

        /* الأزرار */
        .btn-action {
            border: none; border-radius: 10px; padding: 10px 20px;
            background: var(--primary); color: #fff; font-weight: bold; cursor: pointer;
        }
        .btn-lang { background: transparent; border: 1px solid var(--primary); color: var(--primary); margin-right: auto; }

        @media (max-width: 1024px) {
            .upgrade-stats-grid, .details-layout { grid-template-columns: 1fr; }
            .sidebar { width: 70px; }
            .sidebar span, .logo-area { display: none; }
            .main-content { margin-right: 90px; }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="logo-area">
        <img src="LOGO-almajdouie.png" alt="Logo">
    </div>
    <div class="nav-item active" onclick="switchTab('homeSection')">
        <i class="fas fa-home"></i> <span>الرئيسية</span>
    </div>
    <div class="nav-item" onclick="switchTab('visitSection')">
        <i class="fas fa-map-marker-alt"></i> <span>زيارة ميدانية</span>
    </div>
    <div class="nav-item" onclick="switchTab('upgradeSection')">
        <i class="fab fa-windows"></i> <span>Upgrade Windows</span>
    </div>
    <div class="nav-item" onclick="switchTab('reportSection')">
        <i class="fas fa-chart-bar"></i> <span>التقارير</span>
    </div>
    
    <div style="margin-top: auto;">
        <button class="nav-item btn-lang" onclick="toggleAppLanguage()">
            <i class="fas fa-language"></i> <span id="langText">English</span>
        </button>
    </div>
</aside>

<main class="main-content">
    <section id="homeSection" class="tab-content">
        <div class="glass-card">
            <h1 id="welcomeTitle">أهلاً بك في نظام الإدارة الموحد</h1>
            <p>اختر القسم المطلوب من القائمة الجانبية للبدء.</p>
        </div>
    </section>

    <section id="visitSection" class="tab-content" style="display:none;">
        <div class="glass-card">
            <h2>قسم الزيارة الميدانية</h2>
            <p>المحتوى الخاص بالزيارات الميدانية...</p>
        </div>
    </section>

    <section id="upgradeSection" class="tab-content" style="display:none;">
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 id="u-title">متابعة تحديثات ويندوز</h2>
                <div>
                    <input type="file" id="winExcel" accept=".xlsx, .xls, .csv" hidden>
                    <button class="btn-action" onclick="document.getElementById('winExcel').click()">
                        <i class="fas fa-file-upload"></i> <span id="u-upload">رفع ملف البيانات</span>
                    </button>
                </div>
            </div>

            <div class="upgrade-stats-grid">
                <div class="stat-widget">
                    <span id="u-total-label">إجمالي الأجهزة</span>
                    <h2 id="u-total-val">0</h2>
                </div>
                <div class="stat-widget warning">
                    <span id="u-remain-label">متبقي</span>
                    <h2 id="u-remain-val">0</h2>
                </div>
                <div class="stat-widget success">
                    <span id="u-done-label">مكتمل</span>
                    <h2 id="u-done-val">0</h2>
                </div>
            </div>

            <div class="details-layout">
                <div class="details-card">
                    <h4 id="u-reg-title">المناطق</h4>
                    <div id="u-reg-list" class="scroll-list"></div>
                </div>
                <div class="details-card">
                    <h4 id="u-city-title">المدن</h4>
                    <div id="u-city-list" class="scroll-list"></div>
                </div>
                <div class="details-card">
                    <h4 id="u-brand-title">البراندات</h4>
                    <div id="u-brand-list" class="scroll-list"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="reportSection" class="tab-content" style="display:none;">
        <div class="glass-card">
            <h2>التقارير والإحصائيات</h2>
        </div>
    </section>
</main>

<script>
    let currentLang = 'ar';
    let upgradeData = [];

    const uiTexts = {
        ar: {
            welcome: "أهلاً بك في نظام الإدارة الموحد",
            uTitle: "متابعة تحديثات ويندوز",
            uUpload: "رفع ملف البيانات",
            uTotal: "إجمالي الأجهزة",
            uRemain: "متبقي",
            uDone: "مكتمل",
            uReg: "المناطق",
            uCity: "المدن",
            uBrand: "البراندات",
            lang: "English"
        },
        en: {
            welcome: "Welcome to Unified Management System",
            uTitle: "Windows Upgrade Tracking",
            uUpload: "Upload Data File",
            uTotal: "Total Devices",
            uRemain: "Remaining",
            uDone: "Completed",
            uReg: "Regions",
            uCity: "Cities",
            uBrand: "Brands",
            lang: "العربية"
        }
    };

    function switchTab(id) {
        document.querySelectorAll('.tab-content').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    function toggleAppLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const html = document.getElementById('mainHtml');
        html.lang = currentLang;
        html.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

        // تحديث النصوص
        document.getElementById('welcomeTitle').textContent = uiTexts[currentLang].welcome;
        document.getElementById('u-title').textContent = uiTexts[currentLang].uTitle;
        document.getElementById('u-upload').textContent = uiTexts[currentLang].uUpload;
        document.getElementById('u-total-label').textContent = uiTexts[currentLang].uTotal;
        document.getElementById('u-remain-label').textContent = uiTexts[currentLang].uRemain;
        document.getElementById('u-done-label').textContent = uiTexts[currentLang].uDone;
        document.getElementById('u-reg-title').textContent = uiTexts[currentLang].uReg;
        document.getElementById('u-city-title').textContent = uiTexts[currentLang].uCity;
        document.getElementById('u-brand-title').textContent = uiTexts[currentLang].uBrand;
        document.getElementById('langText').textContent = uiTexts[currentLang].lang;

        if (upgradeData.length > 0) renderUpgradeDashboard(upgradeData);
    }

    // معالجة ملف الإكسيل المدمج
    document.getElementById('winExcel').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(ev) {
            const wb = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            upgradeData = json.map(r => ({
                region: r.Region || r.region || 'N/A',
                city: r.City || r.city || 'N/A',
                brand: r.Brand || r.brand || 'General',
                count: parseInt(r.Devices_Count || r.devicesCount || 1) || 1,
                status: String(r.Status || '').toLowerCase().trim()
            }));
            renderUpgradeDashboard(upgradeData);
        };
        reader.readAsArrayBuffer(file);
    });

    function renderUpgradeDashboard(data) {
        let t = 0, d = 0;
        const stats = { region: {}, city: {}, brand: {} };

        data.forEach(item => {
            t += item.count;
            const isDone = item.status === 'completed';
            if (isDone) d += item.count;

            ['region', 'city', 'brand'].forEach(key => {
                if (!stats[key][item[key]]) stats[key][item[key]] = { total: 0, done: 0 };
                stats[key][item[key]].total += item.count;
                if (isDone) stats[key][val = item[key]].done += item.count;
            });
        });

        document.getElementById('u-total-val').textContent = t;
        document.getElementById('u-done-val').textContent = d;
        document.getElementById('u-remain-val').textContent = t - d;

        renderMiniList('u-reg-list', stats.region);
        renderMiniList('u-city-list', stats.city);
        renderMiniList('u-brand-list', stats.brand);
    }

    function renderMiniList(containerId, dataObj) {
        const list = document.getElementById(containerId);
        list.innerHTML = '';
        Object.entries(dataObj).sort((a,b) => b[1].total - a[1].total).forEach(([name, s]) => {
            const pct = Math.round((s.done / s.total) * 100) || 0;
            list.innerHTML += `
                <div class="mini-card">
                    <h5>${name}</h5>
                    <div class="mini-stats-row">
                        <div class="p-badge">إجمالي<b>${s.total}</b></div>
                        <div class="p-badge" style="color:var(--warning)">متبقي<b>${s.total - s.done}</b></div>
                        <div class="p-badge" style="color:var(--success)">مكتمل<b>${s.done}</b></div>
                    </div>
                    <div class="progress-line">
                        <div style="width:${pct}%; background:${pct === 100 ? 'var(--success)' : 'var(--primary)'}"></div>
                    </div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
