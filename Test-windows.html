<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Windows — V1.1.3</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --glass: rgba(255, 255, 255, 0.9); }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background: transparent; color: #1e293b; }
        
        .container-glass { background: var(--glass); backdrop-filter: blur(15px); border-radius: 20px; padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        
        /* الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 20px 0; }
        .stat-card { background: #fff; padding: 20px; border-radius: 16px; text-align: center; border-bottom: 5px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .stat-card h2 { font-size: 38px; margin: 8px 0 0; color: var(--primary); }

        /* القوائم الثلاث */
        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .list-box { max-height: 400px; overflow-y: auto; background: rgba(255,255,255,0.5); border-radius: 15px; padding: 10px; border: 1px solid #eee; }
        
        /* تنسيق صف البراند مع الشعار */
        .item-row { 
            background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; 
            border: 1px solid #f1f5f9; display: flex; align-items: center; gap: 12px;
        }
        .brand-logo { width: 40px; height: 40px; border-radius: 8px; object-fit: contain; background: #f8fafc; padding: 4px; border: 1px solid #eee; }
        .brand-info { flex: 1; }

        .records-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; margin-top: 20px; }
        .card-header { background: var(--primary); color: #fff; padding: 12px 20px; }
        .search-container { padding: 15px; background: #f8fafc; border-bottom: 1px solid #eee; }
        .global-search { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; outline: none; }
        
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; text-align: right; font-size: 13px; }
        th { padding: 12px; border-bottom: 2px solid #eee; color: var(--primary); }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body>

<div class="container-glass">
    <div style="display:flex; justify-content:space-between; font-size:11px; color:#64748b; margin-bottom:15px;">
        <div id="update-time">تحديث: --:--</div>
        <div>VERSION 1.1.3</div>
    </div>

    <h2 style="color: var(--primary); margin: 0;">متابعة التحديثات والشعارات</h2>

    <div class="stats-grid">
        <div class="stat-card"><span>إجمالي الأجهزة</span><h2 id="total-val">0</h2></div>
        <div class="stat-card" style="border-color:var(--warning)"><span>متبقي</span><h2 id="remain-val" style="color:var(--warning)">0</h2></div>
        <div class="stat-card" style="border-color:var(--success)"><span>مكتمل</span><h2 id="done-val" style="color:var(--success)">0</h2></div>
    </div>

    <div class="details-grid">
        <div><h4>المناطق</h4><div id="reg-list" class="list-box"></div></div>
        <div><h4>المدن</h4><div id="city-list" class="list-box"></div></div>
        <div><h4>البراندات والشعارات</h4><div id="brand-list" class="list-box"></div></div>
    </div>

    <div class="records-card">
        <div class="card-header"><h3>سجلات تفصيلية</h3></div>
        <div class="search-container"><input type="text" id="globalSearch" class="global-search" onkeyup="universalFilter()" placeholder="بحث سريع في السجلات..."></div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Branch</th><th>Brand</th><th>City</th><th>Region</th><th>Status</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let brandLogos = {}; // مخزن الشعارات

    // 1. جلب الشعارات أولاً من brand_assets
    async function loadBrandAssets() {
        const snap = await db.collection("brand_assets").get();
        snap.forEach(doc => {
            const d = doc.data();
            // نستخدم اسم البراند الصغير كمفتاح للربط
            if (d.brandKey) brandLogos[d.brandKey.toLowerCase()] = d.logoData;
        });
        startRealtimeUpdates();
    }

    // 2. جلب بيانات التحديثات
    function startRealtimeUpdates() {
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const stats = { Region: {}, City: {}, Brand: {} };
            const listData = [];

            snapshot.forEach(doc => {
                const data = doc.data();
                let count = parseInt(data.devicesCount) || 1;
                const isDone = (String(data.status).toLowerCase().trim() === 'completed');

                total += count; if (isDone) done += count;

                const updateS = (obj, key) => {
                    if (!obj[key]) obj[key] = { t: 0, d: 0 };
                    obj[key].t += count; if (isDone) obj[key].d += count;
                };
                updateS(stats.Region, data.region || 'N/A');
                updateS(stats.City, data.city || 'N/A');
                updateS(stats.Brand, data.brand || 'N/A');
                listData.push({ id: doc.id, ...data });
            });

            document.getElementById('total-val').innerText = total;
            document.getElementById('done-val').innerText = done;
            document.getElementById('remain-val').innerText = total - done;

            renderBrandList(stats.Brand);
            renderOtherLists(stats);
            renderRecords(listData);
            document.getElementById('update-time').innerText = `تحديث: ${new Date().toLocaleTimeString('ar-SA')}`;
        });
    }

    // 3. عرض البراندات مع الشعارات
    function renderBrandList(brandStats) {
        const el = document.getElementById('brand-list'); el.innerHTML = '';
        Object.entries(brandStats).sort((a,b)=>b[1].t - a[1].t).forEach(([name, s]) => {
            const logo = brandLogos[name.toLowerCase()] || 'https://via.placeholder.com/40?text=?';
            el.innerHTML += `
                <div class="item-row">
                    <img src="${logo}" class="brand-logo" onerror="this.src='https://via.placeholder.com/40?text=Logo'">
                    <div class="brand-info">
                        <b style="font-size:14px;">${name}</b><br>
                        <small style="color:#64748b">إجمالي: ${s.t} | مكتمل: ${s.d}</small>
                    </div>
                    <div style="text-align:left"><b style="color:var(--primary)">${Math.round((s.d/s.t)*100)}%</b></div>
                </div>`;
        });
    }

    function renderOtherLists(stats) {
        const draw = (id, obj) => {
            const el = document.getElementById(id); el.innerHTML = '';
            Object.entries(obj).sort((a,b)=>b[1].t - a[1].t).forEach(([n, s]) => {
                el.innerHTML += `<div class="item-row" style="display:block"><b>${n}</b><br><small>الإجمالي: ${s.t} | متبقي: ${s.t-s.d}</small></div>`;
            });
        };
        draw('reg-list', stats.Region); draw('city-list', stats.City);
    }

    function renderRecords(data) {
        const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
        data.forEach(item => {
            tbody.innerHTML += `<tr>
                <td>${item.branchName || '-'}</td><td>${item.brand || '-'}</td>
                <td>${item.city || '-'}</td><td>${item.region || '-'}</td>
                <td><b style="color:${item.status==='completed'?'#10b981':'#f59e0b'}">${item.status || 'planned'}</b></td>
            </tr>`;
        });
    }

    function universalFilter() {
        const q = document.getElementById('globalSearch').value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none');
    }

    window.onload = loadBrandAssets;
</script>
</body>
</html>
