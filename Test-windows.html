<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Upgrade Windows — V1.2.0 (Management Mode)</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --danger: #d64545; }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background: #f4f7f9; direction: rtl; }
        
        /* تصميم الفورم (النموذج) */
        .admin-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 30px; }
        .card-header { background: var(--primary); color: #fff; padding: 15px 20px; font-weight: bold; }
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; background: #fcfdfe; }
        
        .field-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; font-weight: bold; color: #64748b; }
        input, select, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 6px; outline: none; font-size: 13px; }
        
        /* الأزرار */
        .btn-row { padding: 15px 20px; display: flex; gap: 10px; border-top: 1px solid #eee; background: #fff; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.3s; }
        .btn-save { background: var(--success); color: white; }
        .btn-clear { background: #e2e8f0; color: #475569; }
        .btn-excel { background: #fff; border: 1px solid #ddd; color: var(--primary); }
        .btn-upload { background: #b45309; color: white; }
        .btn-sync { background: #059669; color: white; }

        /* الجدول في الأسفل */
        .table-section { background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="card-header">Upgrade Windows - إدارة البيانات</div>
    
    <div style="padding: 10px 20px; font-size: 11px; color: #666; border-bottom: 1px dashed #eee;">
        الصفحة الأساسية للإدخال اليدوي أو من Excel. سيتم تحديث السجل تلقائياً إذا تطابق رقم الموظف.
    </div>

    <form id="deviceForm">
        <div class="form-grid">
            <div class="field-group"><label>الفرع</label><input type="text" id="branchName" placeholder="اسم الفرع"></div>
            <div class="field-group"><label>Branch_ID</label><input type="text" id="branchId" placeholder="ID الفرع"></div>
            <div class="field-group"><label>المنطقة (Region)</label><input type="text" id="region"></div>
            <div class="field-group"><label>المدينة (City)</label><input type="text" id="city"></div>
            
            <div class="field-group"><label>البراند (Brand)</label>
                <select id="brand">
                    <option value="">اختر البراند</option>
                    <option value="Hyundai">Hyundai</option>
                    <option value="Genesis">Genesis</option>
                    <option value="Changan">Changan</option>
                </select>
            </div>
            <div class="field-group"><label>Function</label><input type="text" id="function"></div>
            <div class="field-group"><label>اسم الموظف</label><input type="text" id="employeeName"></div>
            <div class="field-group"><label>Employee ID</label><input type="text" id="employeeId"></div>
            
            <div class="field-group"><label>Device Name</label><input type="text" id="deviceName"></div>
            <div class="field-group"><label>عدد الأجهزة</label><input type="number" id="devicesCount" value="1"></div>
            <div class="field-group"><label>تاريخ زيارة الفني</label><input type="date" id="technicianVisitDate"></div>
            <div class="field-group"><label>تاريخ حفظ Checklist</label><input type="date" id="checklistSavedDate"></div>
            
            <div class="field-group"><label>الحالة (Status)</label>
                <select id="status">
                    <option value="planned">Planned</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <div class="field-group" style="grid-column: span 3;"><label>ملاحظات (Notes)</label><textarea id="notes" rows="1"></textarea></div>
        </div>

        <div class="btn-row">
            <button type="button" class="btn-save" onclick="saveToFirebase()">حفظ السجل</button>
            <button type="button" class="btn-clear" onclick="clearForm()">تنظيف</button>
            <div style="flex:1"></div>
            
            <button type="button" class="btn-excel" onclick="downloadExcel()">تنزيل ملف Excel</button>
            <input type="file" id="excelFile" style="display:none" onchange="uploadExcel(this)">
            <button type="button" class="btn-upload" onclick="document.getElementById('excelFile').click()">رفع ملف Excel (يمسح القديم)</button>
            <button type="button" class="btn-sync">تحديث من Check-List</button>
        </div>
    </form>
</div>

<div class="table-section">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px">
        <h3 style="margin:0">سجلات الأجهزة المسجلة</h3>
        <input type="text" id="tableSearch" onkeyup="searchTable()" placeholder="بحث سريع..." style="padding:5px; width:250px; border-radius:5px; border:1px solid #ddd">
    </div>
    <div style="overflow-x:auto">
        <table id="dataTable" style="width:100%; border-collapse:collapse; font-size:12px; text-align:right">
            <thead style="background:#f8fafc">
                <tr>
                    <th>Branch ID</th><th>Branch Name</th><th>Brand</th><th>City</th><th>Employee</th><th>Status</th><th>إجراء</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = { /* بياناتك الحالية site-visit-87724 */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1. وظيفة الحفظ اليدوي
    async function saveToFirebase() {
        const docData = {
            branchId: document.getElementById('branchId').value,
            branchName: document.getElementById('branchName').value,
            region: document.getElementById('region').value,
            city: document.getElementById('city').value,
            brand: document.getElementById('brand').value,
            function: document.getElementById('function').value,
            employeeName: document.getElementById('employeeName').value,
            employeeId: document.getElementById('employeeId').value,
            deviceName: document.getElementById('deviceName').value,
            devicesCount: parseInt(document.getElementById('devicesCount').value) || 1,
            technicianVisitDate: document.getElementById('technicianVisitDate').value,
            checklistSavedDate: document.getElementById('checklistSavedDate').value,
            status: document.getElementById('status').value,
            notes: document.getElementById('notes').value,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("windows_upgrades").add(docData);
            alert("تم حفظ البيانات بنجاح ✅");
            clearForm();
        } catch (e) { alert("خطأ في الحفظ: " + e.message); }
    }

    // 2. وظيفة رفع إكسيل ومسح القديم
    async function uploadExcel(input) {
        if (!confirm("تحذير: سيتم مسح كافة البيانات الحالية ورفع بيانات الملف الجديد. هل أنت متأكد؟")) return;
        
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);

            // مسح القديم
            const oldDocs = await db.collection("windows_upgrades").get();
            const batch = db.batch();
            oldDocs.forEach(doc => batch.delete(doc.ref));
            await batch.commit();

            // رفع الجديد
            for(let row of json) {
                await db.collection("windows_upgrades").add(row);
            }
            alert("تم مسح القديم ورفع " + json.length + " سجل جديد بنجاح 🚀");
        };
        reader.readAsArrayBuffer(file);
    }

    // 3. وظيفة تنزيل إكسيل
    async function downloadExcel() {
        const snap = await db.collection("windows_upgrades").get();
        const data = snap.docs.map(doc => doc.data());
        const worksheet = XLSX.utils.json_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Upgrades");
        XLSX.writeFile(workbook, "Upgrade_Windows_Export.xlsx");
    }

    function clearForm() { document.getElementById('deviceForm').reset(); }

    // عرض البيانات في الجدول
    db.collection("windows_upgrades").onSnapshot(snapshot => {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        snapshot.forEach(doc => {
            const d = doc.data();
            tbody.innerHTML += `
                <tr style="border-bottom:1px solid #eee">
                    <td>${d.branchId || '-'}</td><td>${d.branchName || '-'}</td><td>${d.brand || '-'}</td>
                    <td>${d.city || '-'}</td><td>${d.employeeName || '-'}</td>
                    <td><b style="color:${d.status==='completed'?'green':'orange'}">${d.status}</b></td>
                    <td><button onclick="deleteRow('${doc.id}')" style="color:red; background:none; border:none">حذف</button></td>
                </tr>`;
        });
    });

    async function deleteRow(id) { if(confirm("حذف؟")) await db.collection("windows_upgrades").doc(id).delete(); }
</script>
</body>
</html>
