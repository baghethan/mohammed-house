<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upgrade Windows — Almajdouie Motors</title>
  
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --bg:#f3f6fb;
      --card:#ffffff;
      --text:#16324a;
      --muted:#6b7b8c;
      --primary:#0f5d95;
      --border:#d9e3ee;
      --success:#198754;
      --warning:#fd7e14;
      --shadow:0 10px 28px rgba(15,49,85,.08);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{ margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:"Segoe UI", Tahoma, sans-serif; }
    .page{ max-width:1600px; margin:0 auto; }

    .page-header{
      background:linear-gradient(135deg,#0f5d95,#0f4c79);
      color:#fff; padding:22px; border-radius:18px; margin-bottom:18px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
    .toolbar{ display:flex; gap:12px; margin-bottom:20px; }
    
    .btn {
      border:none; border-radius:12px; padding:12px 20px; background:var(--primary); color:#fff;
      font-weight:700; cursor:pointer; transition: 0.3s;
    }
    .btn.upload { background: var(--success); }
    .btn.secondary { background:#fff; color:var(--primary); border:1px solid var(--border); }

    .upgrade-summary-top{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom: 20px; }
    .stat{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:20px; text-align: center; }
    .stat .label{ color:var(--muted); font-size:14px; display: block; margin-bottom: 5px; }
    .stat .value{ color:var(--primary); font-size:32px; font-weight:900; }

    .upgrade-meta-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
    .upgrade-meta-card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; min-height:400px; }
    .upgrade-meta-card h4{ margin-top:0; color:var(--primary); border-bottom: 2px solid #f0f4f8; padding-bottom: 10px; }

    .upgrade-mini-grid{ display:grid; gap:12px; max-height: 600px; overflow-y: auto; padding-right: 5px; }
    .upgrade-mini-card{ border:1px solid var(--border); border-top:5px solid var(--primary); border-radius:14px; padding:15px; background:#fbfdff; }
    .upgrade-mini-title{ font-weight:800; color:var(--primary); margin-bottom: 8px; font-size: 14px; }
    .upgrade-mini-stats{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
    .pill{ border-radius:8px; padding:6px; text-align: center; font-size: 13px; background: #fff; border: 1px solid #eee; }
    .pill b { display: block; font-size: 16px; }
    .done-text { color: var(--success); }
    .wait-text { color: var(--warning); }

    .progress-track { height: 8px; background: #eee; border-radius: 10px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; transition: 0.5s; }

    #fileInput { display: none; }
  </style>
</head>
<body>

<div class="page">
  <div class="page-header">
    <div>
      <h1>شركة المجدوعي للسيارات — تحديث ويندوز</h1>
      <p style="margin:5px 0 0; opacity:0.8;">نظام متابعة حالة الأجهزة المحدثة</p>
    </div>
  </div>

  <section class="card">
    <div class="toolbar">
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
      <button class="btn upload" onclick="document.getElementById('fileInput').click()">📁 ارفع ملف الإكسيل المعدل</button>
      <button class="btn secondary" onclick="location.reload()">🔄 إعادة تعيين</button>
    </div>

    <div class="upgrade-summary-top">
      <div class="stat">
        <span class="label">إجمالي الأجهزة</span>
        <div class="value" id="totalDevices">0</div>
      </div>
      <div class="stat">
        <span class="label">مكتمل ✅</span>
        <div class="value" id="totalCompleted" style="color: var(--success);">0</div>
      </div>
      <div class="stat">
        <span class="label">المتبقي ⏳</span>
        <div class="value" id="totalRemaining" style="color: var(--warning);">0</div>
      </div>
    </div>

    <div class="upgrade-meta-grid">
      <div class="upgrade-meta-card">
        <h4>المناطق</h4>
        <div id="regionsGrid" class="upgrade-mini-grid"></div>
      </div>
      <div class="upgrade-meta-card">
        <h4>المدن</h4>
        <div id="citiesGrid" class="upgrade-mini-grid"></div>
      </div>
      <div class="upgrade-meta-card">
        <h4>البراندات</h4>
        <div id="brandsGrid" class="upgrade-mini-grid"></div>
      </div>
    </div>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);

  $('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(event) {
      const data = new Uint8Array(event.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
      
      processData(json);
    };
    reader.readAsArrayBuffer(file);
  });

  function processData(raw) {
    // معالجة البيانات لتتوافق مع مسميات ملفك
    const cleanData = raw.map(r => ({
      region: r.Region || r.region || 'غير محدد',
      city: r.City || r.city || 'غير محدد',
      brand: r.Brand || r.brand || 'عام',
      // إذا كان العدد غير موجود نعتبره سجل واحد (جهاز واحد)
      count: parseInt(r.Devices_Count || r.devicesCount || 1) || 1,
      status: String(r.Status || r.status || '').toLowerCase().trim()
    }));

    renderDashboard(cleanData);
  }

  function renderDashboard(data) {
    let t = 0, c = 0;
    const groups = { region: {}, city: {}, brand: {} };

    data.forEach(item => {
      t += item.count;
      const isDone = (item.status === 'completed');
      if (isDone) c += item.count;

      ['region', 'city', 'brand'].forEach(key => {
        const val = item[key];
        if (!groups[key][val]) groups[key][val] = { total: 0, done: 0 };
        groups[key][val].total += item.count;
        if (isDone) groups[key][val].done += item.count;
      });
    });

    $('totalDevices').textContent = t;
    $('totalCompleted').textContent = c;
    $('totalRemaining').textContent = t - c;

    renderCards('regionsGrid', groups.region);
    renderCards('citiesGrid', groups.city);
    renderCards('brandsGrid', groups.brand);
  }

  function renderCards(id, obj) {
    const grid = $(id);
    grid.innerHTML = '';
    
    // ترتيب العناصر تنازلياً حسب العدد
    Object.entries(obj).sort((a,b) => b[1].total - a[1].total).forEach(([name, stats]) => {
      const pct = Math.round((stats.done / stats.total) * 100) || 0;
      const color = pct === 100 ? 'var(--success)' : 'var(--primary)';
      
      grid.innerHTML += `
        <div class="upgrade-mini-card" style="border-top-color: ${color}">
          <div class="upgrade-mini-title">${name}</div>
          <div class="upgrade-mini-stats">
            <div class="pill"><span class="done-text">مكتمل</span><b>${stats.done}</b></div>
            <div class="pill"><span class="wait-text">متبقي</span><b>${stats.total - stats.done}</b></div>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${pct}%; background:${color}"></div>
          </div>
          <div style="font-size:11px; text-align:left; margin-top:5px; font-weight:bold;">${pct}%</div>
        </div>
      `;
    });
  }
</script>
</body>
</html>
