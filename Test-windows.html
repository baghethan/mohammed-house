<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainPage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة المجدوعي للسيارات — النظام الموحد</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.75);
            --border: rgba(255, 255, 255, 0.3);
            --primary: #0f5d95;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #1e293b;
        }

        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #d1d9e6 100%);
            min-height: 100vh; display: flex; color: var(--text);
        }

        /* Sidebar Glass UI */
        .sidebar {
            width: 260px; background: var(--glass); backdrop-filter: blur(12px);
            border-left: 1px solid var(--border); padding: 25px;
            display: flex; flex-direction: column; gap: 10px; position: fixed; height: 100vh;
        }

        .main-content { margin-right: 280px; padding: 40px; width: 100%; }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.04);
        }

        .nav-item {
            padding: 14px 18px; border-radius: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 12px; font-weight: 600; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { background: var(--primary); color: #fff; }

        /* Stats Grid: Total -> Remain -> Done */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        .stat-card {
            background: #fff; padding: 25px; border-radius: 20px; text-align: center;
            border-bottom: 5px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .stat-card.warning { border-bottom-color: var(--warning); }
        .stat-card.success { border-bottom-color: var(--success); }
        .stat-card h2 { font-size: 42px; margin: 10px 0 0; }

        /* Details Sections */
        .details-wrapper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .scroll-box { max-height: 550px; overflow-y: auto; padding-left: 10px; }
        
        .item-card {
            background: #fff; border: 1px solid var(--border); border-radius: 16px;
            padding: 15px; margin-bottom: 12px;
        }
        .item-card h5 { margin: 0 0 12px; color: var(--primary); font-size: 16px; }

        .mini-counts { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 10px; }
        .count-tag { flex: 1; font-size: 11px; text-align: center; background: #f8fafc; padding: 6px; border-radius: 8px; }
        .count-tag b { display: block; font-size: 15px; margin-top: 2px; }

        .progress-bar { height: 6px; background: #eee; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; transition: 0.6s; }

        #loadingOverlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8);
            display:flex; justify-content:center; align-items:center; z-index:999;
        }
    </style>
</head>
<body>

<div id="loadingOverlay"><h3>جاري التحميل من Firebase...</h3></div>

<aside class="sidebar">
    <div style="text-align:center; margin-bottom:30px;">
        <img src="LOGO-almajdouie.png" style="width:160px;"> </div>
    <div class="nav-item" onclick="showTab('home')"><i class="fas fa-th-large"></i> الرئيسية</div>
    <div class="nav-item active" onclick="showTab('upgrade')"><i class="fab fa-windows"></i> Upgrade Windows</div>
</aside>

<main class="main-content">
    <section id="upgradeTab" class="glass-card">
        <h2 id="titleText">تحديثات ويندوز — المجدوعي للسيارات</h2>
        
        <div class="stats-grid">
            <div class="stat-card">
                <span id="txt-total">إجمالي الأجهزة</span>
                <h2 id="val-total">0</h2>
            </div>
            <div class="stat-card warning">
                <span id="txt-remain">متبقي</span>
                <h2 id="val-remain" style="color:var(--warning)">0</h2>
            </div>
            <div class="stat-card success">
                <span id="txt-done">مكتمل</span>
                <h2 id="val-done" style="color:var(--success)">0</h2>
            </div>
        </div>

        <div class="details-wrapper">
            <div>
                <h4 id="h-reg">المناطق</h4>
                <div id="list-reg" class="scroll-box"></div>
            </div>
            <div>
                <h4 id="h-city">المدن</h4>
                <div id="list-city" class="scroll-box"></div>
            </div>
            <div>
                <h4 id="h-brand">البراندات</h4>
                <div id="list-brand" class="scroll-box"></div>
            </div>
        </div>
    </section>
</main>

<script>
    // 1. ضع إعدادات Firebase الخاصة بك هنا
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "your-app.firebaseapp.com",
        projectId: "your-project-id",
        storageBucket: "your-app.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abc123"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function showTab(id) {
        // منطق التبديل بين الأقسام
    }

    // 2. جلب البيانات من مجموعة UpgradeWindows كما في صورتك
    function listenToUpgrades() {
        db.collection("UpgradeWindows").onSnapshot((snapshot) => {
            let data = [];
            snapshot.forEach(doc => data.push(doc.data()));
            
            document.getElementById('loadingOverlay').style.display = 'none';
            calculateAndRender(data);
        }, (error) => {
            console.error("Firebase Error: ", error);
            alert("خطأ في جلب البيانات: تأكد من إعدادات Firestore Rules");
        });
    }

    function calculateAndRender(data) {
        let total = 0, done = 0;
        const groups = { Region: {}, City: {}, Brand: {} };

        data.forEach(row => {
            const count = parseInt(row.Devices_Count || 1); //
            const isDone = String(row.Status || '').toLowerCase() === 'completed';
            
            total += count;
            if (isDone) done += count;

            ['Region', 'City', 'Brand'].forEach(key => {
                const val = row[key] || 'N/A';
                if (!groups[key][val]) groups[key][val] = { t: 0, d: 0 };
                groups[key][val].t += count;
                if (isDone) groups[key][val].d += count;
            });
        });

        document.getElementById('val-total').textContent = total;
        document.getElementById('val-done').textContent = done;
        document.getElementById('val-remain').textContent = total - done;

        renderCards('list-reg', groups.Region);
        renderCards('list-city', groups.City);
        renderCards('list-brand', groups.Brand);
    }

    function renderCards(id, obj) {
        const container = document.getElementById(id);
        container.innerHTML = '';
        Object.entries(obj).sort((a,b) => b[1].t - a[1].t).forEach(([name, s]) => {
            const pct = Math.round((s.d / s.t) * 100) || 0;
            container.innerHTML += `
                <div class="item-card">
                    <h5>${name}</h5>
                    <div class="mini-counts">
                        <div class="count-tag">إجمالي<b>${s.t}</b></div>
                        <div class="count-tag" style="color:var(--warning)">متبقي<b>${s.t - s.d}</b></div>
                        <div class="count-tag" style="color:var(--success)">مكتمل<b>${s.d}</b></div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:${pct}%; background:${pct === 100 ? 'var(--success)' : 'var(--primary)'}"></div>
                    </div>
                </div>
            `;
        });
    }

    window.onload = listenToUpgrades;
</script>
</body>
</html>
