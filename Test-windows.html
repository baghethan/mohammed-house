<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upgrade Windows — نظام إدارة التحديثات</title>
  
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --bg:#f3f6fb;
      --card:#ffffff;
      --text:#16324a;
      --muted:#6b7b8c;
      --primary:#0f5d95;
      --primary-2:#1572b6;
      --border:#d9e3ee;
      --success:#198754;
      --warning:#fd7e14;
      --danger:#dc3545;
      --shadow:0 10px 28px rgba(15,49,85,.08);
      --radius:18px;
    }

    *{box-sizing:border-box}
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:"Segoe UI", Tahoma, Arial, sans-serif; }
    body{ padding:24px; }
    .page{ max-width:1600px; margin:0 auto; }

    .page-header{
      background:linear-gradient(135deg,#0f5d95,#0f4c79);
      color:#fff;
      padding:22px;
      border-radius:18px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-header h1{ margin:0; font-size:24px; font-weight:800; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
    }

    .section-title{ margin:0 0 16px 0; color:var(--primary); font-size:18px; font-weight:800; }

    .toolbar{ display:flex; gap:12px; margin-bottom:20px; flex-wrap: wrap; }
    
    .btn {
      border:none; border-radius:12px; padding:12px 20px;
      background:var(--primary); color:#fff; font-weight:700;
      cursor:pointer; transition: 0.3s; box-shadow:0 6px 14px rgba(15,93,149,.16);
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn.secondary { background:#fff; color:var(--primary); border:1px solid var(--border); box-shadow:none; }
    .btn.upload { background: var(--success); }

    .upgrade-summary-top{
      display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom: 20px;
    }

    .stat{
      background:#fff; border:1px solid var(--border); border-radius:16px;
      padding:20px; display:flex; flex-direction:column; gap:8px;
    }
    .stat .label{ color:var(--muted); font-size:14px; font-weight:600; }
    .stat .value{ color:var(--primary); font-size:32px; font-weight:900; }

    .upgrade-meta-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
    .upgrade-meta-card{
      background:#fff; border:1px solid var(--border); border-radius:16px;
      padding:16px; min-height:450px;
    }
    .upgrade-meta-card h4{ margin-bottom:15px; color:var(--primary); border-bottom: 2px solid #f0f4f8; padding-bottom: 8px; }

    .upgrade-mini-grid{ display:grid; gap:12px; }
    
    .upgrade-mini-card{
      border:1px solid var(--border); border-top:5px solid var(--primary);
      border-radius:14px; padding:15px; background:#fbfdff;
    }

    .upgrade-mini-title{ font-weight:800; color:var(--primary); margin-bottom: 10px; }

    .upgrade-mini-stats{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px; }
    .upgrade-mini-pill{ border:1px solid var(--border); border-radius:10px; padding:8px; background:#fff; text-align: center; }
    .upgrade-mini-pill .label{ display:block; font-size:11px; color:var(--muted); }
    .upgrade-mini-pill .value{ font-size:18px; font-weight:900; }
    .upgrade-mini-pill.completed .value { color: var(--success); }
    .upgrade-mini-pill.remaining .value { color: var(--warning); }

    .progress-bar-container { height: 8px; background: #eee; border-radius: 10px; overflow: hidden; margin-top: 10px; }
    .progress-bar-fill { height: 100%; transition: width 0.5s ease-out; }

    #fileInput { display: none; }
    
    @media (max-width: 1024px) {
      .upgrade-summary-top, .upgrade-meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="page-header">
    <div>
      <h1>Upgrade Windows — لوحة التحكم</h1>
      <p style="margin: 5px 0 0; opacity: 0.8; font-size: 14px;">قم برفع ملف الإكسيل لتحديث البيانات مباشرة</p>
    </div>
  </div>

  <section class="card">
    <div class="toolbar">
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
      <button class="btn upload" onclick="document.getElementById('fileInput').click()">📁 رفع ملف إكسيل / CSV</button>
      <button class="btn secondary" id="resetBtn">🔄 تفريغ البيانات</button>
    </div>

    <div class="upgrade-summary-top">
      <div class="stat">
        <span class="label">إجمالي الأجهزة</span>
        <div class="value" id="totalDevices">0</div>
      </div>
      <div class="stat">
        <span class="label">مكتمل ✅</span>
        <div class="value" id="totalCompleted" style="color: var(--success);">0</div>
      </div>
      <div class="stat">
        <span class="label">المتبقي ⏳</span>
        <div class="value" id="totalRemaining" style="color: var(--warning);">0</div>
      </div>
    </div>

    <div class="upgrade-meta-grid">
      <div class="upgrade-meta-card">
        <h4>المناطق (Regions)</h4>
        <div id="regionsGrid" class="upgrade-mini-grid"></div>
      </div>
      <div class="upgrade-meta-card">
        <h4>المدن (Cities)</h4>
        <div id="citiesGrid" class="upgrade-mini-grid"></div>
      </div>
      <div class="upgrade-meta-card">
        <h4>البراندات (Brands)</h4>
        <div id="brandsGrid" class="upgrade-mini-grid"></div>
      </div>
    </div>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);
  let appData = [];

  // مستمع لرفع الملف
  $('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const data = new Uint8Array(event.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      
      // تحويل الشيت إلى JSON
      const json = XLSX.utils.sheet_to_json(sheet);
      processData(json);
    };
    reader.readAsArrayBuffer(file);
  });

  function processData(data) {
    // توحيد مسميات الأعمدة (في حال كانت الحروف كبيرة أو صغيرة)
    appData = data.map(item => ({
      region: item.region || item.Region || 'غير محدد',
      city: item.city || item.City || 'غير محدد',
      brand: item.brand || item.Brand || 'غير محدد',
      count: parseInt(item.devicesCount || item.DevicesCount || 0),
      status: String(item.status || item.Status || '').toLowerCase().trim()
    }));

    renderDashboard();
  }

  function renderDashboard() {
    let total = 0, completed = 0;

    const stats = { regions: {}, cities: {}, brands: {} };

    appData.forEach(item => {
      total += item.count;
      if (item.status === 'completed') completed += item.count;

      // تجميع البيانات للبطاقات
      ['region', 'city', 'brand'].forEach(key => {
        const group = key + 's';
        if (!stats[group][item[key]]) stats[group][item[key]] = { total: 0, done: 0 };
        stats[group][item[key]].total += item.count;
        if (item.status === 'completed') stats[group][item[key]].done += item.count;
      });
    });

    $('totalDevices').textContent = total;
    $('totalCompleted').textContent = completed;
    $('totalRemaining').textContent = total - completed;

    renderCards('regionsGrid', stats.regions);
    renderCards('citiesGrid', stats.cities);
    renderCards('brandsGrid', stats.brands);
  }

  function renderCards(containerId, dataMap) {
    const container = $(containerId);
    container.innerHTML = '';

    Object.entries(dataMap).forEach(([name, val]) => {
      const pct = val.total > 0 ? Math.round((val.done / val.total) * 100) : 0;
      const color = pct === 100 ? 'var(--success)' : 'var(--primary)';

      container.innerHTML += `
        <div class="upgrade-mini-card" style="border-top-color: ${color}">
          <div class="upgrade-mini-title">${name}</div>
          <div class="upgrade-mini-stats">
            <div class="upgrade-mini-pill completed">
              <span class="label">مكتمل</span>
              <span class="value">${val.done}</span>
            </div>
            <div class="upgrade-mini-pill remaining">
              <span class="label">متبقي</span>
              <span class="value">${val.total - val.done}</span>
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">
            <span>الإنجاز</span>
            <strong>${pct}%</strong>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: ${pct}%; background: ${color}"></div>
          </div>
        </div>
      `;
    });
  }

  $('resetBtn').addEventListener('click', () => {
    appData = [];
    renderDashboard();
    $('fileInput').value = '';
  });
</script>

</body>
</html>
