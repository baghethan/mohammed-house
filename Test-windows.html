<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Almajdouie Motors — Upgrade Windows V1.3.1</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --bg: #f4f7f9; }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #1e293b; }
        
        .main-container { max-width: 1600px; margin: auto; }

        /* الهيدر الجديد مع الشعار واسم الشركة */
        .corporate-header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #fff; padding: 15px 30px; border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; 
        }
        .branding { display: flex; align-items: center; gap: 20px; }
        .logo-main { height: 50px; } /* شعار المجدوعي */
        .company-name { border-right: 2px solid #ddd; padding-right: 20px; }
        .company-name h1 { margin: 0; font-size: 20px; color: var(--primary); }
        .company-name p { margin: 0; font-size: 12px; color: #64748b; }

        /* أزرار التحكم */
        .header-actions { display: flex; gap: 10px; }
        .btn-action { 
            padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; 
            font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-copy { background: #6366f1; color: white; } /* زر نسخ الصورة */
        .btn-copy:hover { background: #4f46e5; }

        /* الأقسام الإحصائية */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 15px; text-align: center; border-bottom: 5px solid var(--primary); }
        .stat-card h2 { font-size: 38px; margin: 5px 0; color: var(--primary); }

        /* قسم المنتصف (كما في الصورة السابقة) */
        .middle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .detail-card { background: #fff; border-radius: 15px; padding: 15px; border: 1px solid #e2e8f0; }
        .item-row { background: #f8fafc; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
        .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; text-align: center; margin-top: 8px; }
        .m-box { font-size: 10px; font-weight: bold; padding: 4px; border-radius: 6px; background: white; border: 1px solid #eee; }

        .brand-logo-img { width: 30px; height: 30px; object-fit: contain; vertical-align: middle; margin-left: 8px; }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="main-container" id="dashboard-capture">
    <div class="corporate-header">
        <div class="branding">
            <img src="LOGO-almajdouie.png" alt="Almajdouie Logo" class="logo-main">
            <div class="company-name">
                <h1>شركة المجدوعي للسيارات</h1>
                <p>نظام متابعة ترقيات ويندوز - Upgrade Windows Management</p>
            </div>
        </div>
        
        <div class="header-actions no-print">
            <button class="btn-action btn-copy" onclick="copyDashboardAsImage()">
                <i class="fas fa-copy"></i> نسخ كصورة للإيميل
            </button>
            <div id="auth-status" style="font-size:11px; color:#64748b; margin-top:5px">● جارِ المزامنة...</div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><span>إجمالي الأجهزة</span><h2 id="v-total">0</h2></div>
        <div class="stat-card" style="border-color:var(--warning)"><span>متبقي (Planned)</span><h2 id="v-remain" style="color:var(--warning)">0</h2></div>
        <div class="stat-card" style="border-color:var(--success)"><span>مكتمل (Completed)</span><h2 id="v-done" style="color:var(--success)">0</h2></div>
    </div>

    <div class="middle-grid">
        <div class="detail-card">
            <h4><i class="fas fa-map-marker-alt"></i> المناطق</h4>
            <div id="list-reg" style="max-height:300px; overflow-y:auto"></div>
        </div>
        <div class="detail-card">
            <h4><i class="fas fa-city"></i> المدن</h4>
            <div id="list-city" style="max-height:300px; overflow-y:auto"></div>
        </div>
        <div class="detail-card">
            <h4><i class="fas fa-car"></i> البراندات</h4>
            <div id="list-brand" style="max-height:300px; overflow-y:auto"></div>
        </div>
    </div>

    <div style="background:white; padding:20px; border-radius:15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);">
        <h4 style="margin:0 0 15px 0">سجلات البيانات التفصيلية</h4>
        <div style="overflow-x:auto">
            <table style="width:100%; border-collapse:collapse; text-align:center; font-size:12px;">
                <thead style="background:#f8fafc">
                    <tr>
                        <th>Branch ID</th><th>Branch Name</th><th>Brand</th><th>City</th><th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- إعدادات Firebase والبيانات تبقى كما في النسخة السابقة ---
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let brandLogos = {};

    auth.onAuthStateChanged(async user => {
        if (user) {
            document.getElementById('auth-status').innerText = "● " + user.email;
            await loadLogos();
            startSync();
        } else { window.location.href = "login.html"; }
    });

    async function loadLogos() {
        const snap = await db.collection("brand_assets").get();
        snap.forEach(doc => { if(doc.data().brandKey) brandLogos[doc.data().brandKey.toLowerCase()] = doc.data().logoData; });
    }

    function startSync() {
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const sums = { region: {}, city: {}, brand: {} };
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            snapshot.forEach(doc => {
                const d = doc.data();
                let c = parseInt(d.devicesCount || 1);
                let s = String(d.status || '').toLowerCase().trim();
                total += c; if(s === 'completed') done += c;

                ['region', 'city', 'brand'].forEach(k => {
                    let val = d[k] || 'N/A';
                    if(!sums[k][val]) sums[k][val] = { t:0, d:0 };
                    sums[k][val].t += c; if(s === 'completed') sums[k][val].d += c;
                });

                tbody.innerHTML += `<tr><td>${d.branchId||'-'}</td><td>${d.branchName||'-'}</td><td>${d.brand||'-'}</td><td>${d.city||'-'}</td><td><b style="color:${s==='completed'?'green':'orange'}">${d.status}</b></td></tr>`;
            });

            document.getElementById('v-total').innerText = total;
            document.getElementById('v-done').innerText = done;
            document.getElementById('v-remain').innerText = total - done;

            renderStats('list-reg', sums.region);
            renderStats('list-city', sums.city);
            renderStats('list-brand', sums.brand, true);
        });
    }

    function renderStats(id, data, isBrand = false) {
        const el = document.getElementById(id); el.innerHTML = '';
        Object.entries(data).sort((a,b)=>b[1].t - a[1].t).forEach(([name, v]) => {
            let logo = (isBrand && brandLogos[name.toLowerCase()]) ? `<img src="${brandLogos[name.toLowerCase()]}" class="brand-logo-img">` : '';
            el.innerHTML += `
                <div class="item-row">
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <div style="display:flex; align-items:center">${logo} <b>${name}</b></div>
                        <span style="font-size:10px; color:#64748b">${Math.round((v.d/v.t)*100)}%</span>
                    </div>
                    <div class="mini-stats">
                        <div class="m-box">إجمالي: ${v.t}</div>
                        <div class="m-box" style="color:orange">باقي: ${v.t-v.d}</div>
                        <div class="m-box" style="color:green">تم: ${v.d}</div>
                    </div>
                </div>`;
        });
    }

    // --- وظيفة النسخ كصورة (جديد) ---
    async function copyDashboardAsImage() {
        const btn = document.querySelector('.btn-copy');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري النسخ...';
        
        const dashboard = document.getElementById('dashboard-capture');
        
        try {
            const canvas = await html2canvas(dashboard, {
                scale: 2, // جودة عالية
                useCORS: true,
                backgroundColor: "#f4f7f9"
            });
            
            canvas.toBlob(blob => {
                const item = new ClipboardItem({ "image/png": blob });
                navigator.clipboard.write([item]).then(() => {
                    btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ للحافظة!';
                    setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> نسخ كصورة للإيميل', 2000);
                });
            });
        } catch (err) {
            console.error(err);
            alert("فشل النسخ، يرجى استخدام تصوير الشاشة اليدوي.");
            btn.innerHTML = '<i class="fas fa-copy"></i> نسخ كصورة للإيميل';
        }
    }
</script>
</body>
</html>
