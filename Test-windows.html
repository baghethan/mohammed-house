<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Windows — V1.0.7</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

    <style>
        :root {
            --primary: #0f5d95;
            --success: #10b981;
            --warning: #f59e0b;
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;
            background: transparent; color: #1e293b;
        }

        .container-glass {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px;
            padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            position: relative;
        }

        .info-header {
            display: flex; justify-content: space-between;
            font-size: 11px; color: #64748b; font-weight: bold; margin-bottom: 5px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 25px 0; }
        .stat-card {
            background: #fff; padding: 20px; border-radius: 16px; text-align: center;
            border-bottom: 5px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .stat-card.warning { border-bottom-color: var(--warning); }
        .stat-card.success { border-bottom-color: var(--success); }
        .stat-card h2 { font-size: 38px; margin: 8px 0 0; color: var(--primary); }

        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .list-box { max-height: 500px; overflow-y: auto; background: rgba(255,255,255,0.4); border-radius: 15px; padding: 10px; }
        .item-row { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid #eee; }
        
        #conn-indicator { font-size: 12px; transition: 0.3s; }
    </style>
</head>
<body>

<div class="container-glass">
    <div class="info-header">
        <div id="update-time">توقيت العرض: --:--</div>
        <div>VERSION 1.0.7</div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="color: var(--primary); margin: 0;">لوحة متابعة تحديثات ويندوز</h2>
        <div id="conn-indicator" style="color: var(--warning);">● جاري الاتصال...</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span>إجمالي الأجهزة</span>
            <h2 id="total-val">0</h2>
        </div>
        <div class="stat-card warning">
            <span>متبقي</span>
            <h2 id="remain-val" style="color: var(--warning);">0</h2>
        </div>
        <div class="stat-card success">
            <span>مكتمل</span>
            <h2 id="done-val" style="color: var(--success);">0</h2>
        </div>
    </div>

    <div class="details-grid">
        <div><h4>المناطق</h4> <div id="reg-list" class="list-box"></div></div>
        <div><h4>المدن</h4> <div id="city-list" class="list-box"></div></div>
        <div><h4>البراندات</h4> <div id="brand-list" class="list-box"></div></div>
    </div>
</div>

<script>
    // ✅ بيانات الربط الخاصة بمشروعك (مأخوذة من صورتك eb4544)
    const firebaseConfig = {
        apiKey: "AIzaSyCzH9tL_y0iXk9p0U6...", // تأكد من وضع المفتاح كاملاً من الصورة
        authDomain: "site-visit-87724.firebaseapp.com",
        projectId: "site-visit-87724",
        storageBucket: "site-visit-87724.appspot.com",
        messagingSenderId: "367252877543",
        appId: "1:367252877543:web:9f0007e99996d91f4682ba"
    };

    // تهيئة Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    function updateDateTime() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('ar-SA');
        const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('update-time').innerText = `توقيت التحديث: ${dateStr} | ${timeStr}`;
    }

    // ✅ جلب البيانات وفحص الأخطاء
    function listenToData() {
        db.collection("UpgradeWindows").onSnapshot(snapshot => {
            if (snapshot.empty) {
                console.warn("المجموعة فارغة أو غير موجودة.");
                document.getElementById('conn-indicator').innerText = "● لا توجد بيانات";
                document.getElementById('conn-indicator').style.color = "red";
                return;
            }

            document.getElementById('conn-indicator').innerText = "● متصل أونلاين";
            document.getElementById('conn-indicator').style.color = "var(--success)";

            let total = 0, done = 0;
            const stats = { Region: {}, City: {}, Brand: {} };

            snapshot.forEach(doc => {
                const data = doc.data();
                // ✅ استخدام الحقول كما في صورتك (Devices_Count و Status)
                const count = parseInt(data.Devices_Count || 0); 
                const status = String(data.Status || '').toLowerCase().trim();
                const isDone = (status === 'completed');
                
                total += count;
                if (isDone) done += count;

                ['Region', 'City', 'Brand'].forEach(key => {
                    const val = data[key] || 'غير محدد';
                    if (!stats[key][val]) stats[key][val] = { t: 0, d: 0 };
                    stats[key][val].t += count;
                    if (isDone) stats[key][val].d += count;
                });
            });

            // تحديث الأرقام
            document.getElementById('total-val').innerText = total;
            document.getElementById('done-val').innerText = done;
            document.getElementById('remain-val').innerText = total - done;

            render('reg-list', stats.Region);
            render('city-list', stats.City);
            render('brand-list', stats.Brand);
            updateDateTime();

        }, error => {
            console.error("خطأ Firebase:", error);
            document.getElementById('conn-indicator').innerText = "● خطأ في الصلاحيات";
            document.getElementById('conn-indicator').style.color = "red";
            // إذا ظهر هذا الخطأ، فهذا يعني أن المستخدم لم يسجل دخوله
        });
    }

    function render(id, obj) {
        const container = document.getElementById(id);
        container.innerHTML = '';
        Object.entries(obj).sort((a,b) => b[1].t - a[1].t).forEach(([name, s]) => {
            const pct = Math.round((s.d / s.t) * 100) || 0;
            container.innerHTML += `
                <div class="item-row">
                    <div style="font-weight:bold; font-size:14px;">${name}</div>
                    <div style="display:flex; justify-content:space-between; font-size:11px; margin:5px 0;">
                        <span>إجمالي: ${s.t}</span>
                        <span style="color:var(--warning)">متبقي: ${s.t - s.d}</span>
                        <span style="color:var(--success)">مكتمل: ${s.d}</span>
                    </div>
                    <div style="height:4px; background:#eee; border-radius:10px; overflow:hidden;">
                        <div style="width:${pct}%; height:100%; background:var(--primary);"></div>
                    </div>
                </div>`;
        });
    }

    // البدء عند التحميل
    window.onload = () => {
        updateDateTime();
        listenToData();
    };
</script>
</body>
</html>
