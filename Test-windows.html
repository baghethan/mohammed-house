<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تقرير شركة المجدوعي للسيارات — Upgrade Windows</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --bg: #ffffff; }
        body { margin: 0; padding: 40px; font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1e293b; }
        
        /* الحاوية الرئيسية التي سيتم تصويرها */
        .report-container { 
            max-width: 1200px; margin: auto; background: white; padding: 40px; 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }

        /* الهيدر الرسمي */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary); padding-bottom: 20px; margin-bottom: 30px; }
        .logo-section { display: flex; align-items: center; gap: 20px; }
        .logo-img { height: 60px; }
        .title-section h1 { margin: 0; font-size: 24px; color: var(--primary); }
        .title-section p { margin: 5px 0 0; font-size: 14px; color: #64748b; }

        /* البطاقات الثلاث الكبرى */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #f8fafc; padding: 25px; border-radius: 15px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-card h2 { font-size: 48px; margin: 10px 0; color: var(--primary); }
        .stat-card span { font-weight: bold; font-size: 16px; color: #475569; }

        /* الأقسام الثلاثة (مناطق، مدن، براندات) */
        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        .list-box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; background: #fff; }
        .list-box h4 { margin: 0 0 15px; color: var(--primary); font-size: 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        
        .item-row { background: #f8fafc; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid #edf2f7; }
        .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 13px; }
        .brand-icon { width: 30px; height: 30px; object-fit: contain; }
        
        .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; text-align: center; }
        .s-box { font-size: 10px; background: white; padding: 4px; border-radius: 5px; border: 1px solid #eee; font-weight: bold; }

        /* زر النسخ (يختفي عند التصوير) */
        .no-print-btn { 
            position: fixed; bottom: 30px; left: 30px; background: var(--success); color: white; 
            border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; 
            font-weight: bold; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); z-index: 100;
        }
    </style>
</head>
<body>

<button class="no-print-btn" onclick="captureReport()">
    <i class="fas fa-camera"></i> نسخ التقرير كصورة للإيميل
</button>

<div class="report-container" id="report">
    <div class="header">
        <div class="logo-section">
            <img src="LOGO-almajdouie.png" alt="Logo" class="logo-img">
            <div class="title-section">
                <h1>شركة المجدوعي للسيارات</h1>
                <p>إدارة ترقية الأنظمة - Upgrade Windows Management</p>
            </div>
        </div>
        <div style="text-align: left; font-size: 12px; color: #64748b;">
            تاريخ التقرير: <span id="date-now"></span>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><span>إجمالي الأجهزة</span><h2 id="v-total">0</h2></div>
        <div class="stat-card" style="border-color:var(--warning)"><span>متبقي (Planned)</span><h2 id="v-remain" style="color:var(--warning)">0</h2></div>
        <div class="stat-card" style="border-color:var(--success)"><span>مكتمل (Completed)</span><h2 id="v-done" style="color:var(--success)">0</h2></div>
    </div>

    <div class="details-grid">
        <div class="list-box">
            <h4><i class="fas fa-map-marker-alt"></i> المناطق</h4>
            <div id="list-reg"></div>
        </div>
        <div class="list-box">
            <h4><i class="fas fa-city"></i> المدن</h4>
            <div id="list-city"></div>
        </div>
        <div class="list-box">
            <h4><i class="fas fa-car"></i> البراندات والشعارات</h4>
            <div id="list-brand"></div>
        </div>
    </div>

    <div style="margin-top: 30px; text-align: center; font-size: 10px; color: #cbd5e1; border-top: 1px solid #f1f5f9; padding-top: 10px;">
        هذا التقرير تم إنشاؤه آلياً بواسطة نظام إدارة الترقيات - جميع الحقوق محفوظة لشركة المجدوعي للسيارات © 2026
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let brandLogos = {};

    document.getElementById('date-now').innerText = new Date().toLocaleDateString('ar-SA');

    async function init() {
        // جلب الشعارات
        const logoSnap = await db.collection("brand_assets").get();
        logoSnap.forEach(doc => { if(doc.data().brandKey) brandLogos[doc.data().brandKey.toLowerCase()] = doc.data().logoData; });

        // جلب البيانات
        db.collection("windows_upgrades").onSnapshot(snapshot => {
            let total = 0, done = 0;
            const sums = { region: {}, city: {}, brand: {} };

            snapshot.forEach(doc => {
                const d = doc.data();
                let c = parseInt(d.devicesCount || 1);
                let s = String(d.status || '').toLowerCase().trim();
                total += c; if(s === 'completed') done += c;

                ['region', 'city', 'brand'].forEach(k => {
                    let val = d[k] || 'N/A';
                    if(!sums[k][val]) sums[k][val] = { t:0, d:0 };
                    sums[k][val].t += c; if(s === 'completed') sums[k][val].d += c;
                });
            });

            document.getElementById('v-total').innerText = total;
            document.getElementById('v-done').innerText = done;
            document.getElementById('v-remain').innerText = total - done;

            render(sums.region, 'list-reg');
            render(sums.city, 'list-city');
            render(sums.brand, 'list-brand', true);
        });
    }

    function render(data, containerId, isBrand = false) {
        const el = document.getElementById(containerId); el.innerHTML = '';
        Object.entries(data).sort((a,b)=>b[1].t - a[1].t).forEach(([name, v]) => {
            let logo = (isBrand && brandLogos[name.toLowerCase()]) ? `<img src="${brandLogos[name.toLowerCase()]}" class="brand-icon">` : '';
            el.innerHTML += `
                <div class="item-row">
                    <div class="item-top"><div>${logo} ${name}</div> <span>${Math.round((v.d/v.t)*100)}%</span></div>
                    <div class="mini-stats">
                        <div class="s-box">إجمالي: ${v.t}</div>
                        <div class="s-box" style="color:var(--warning)">باقي: ${v.t-v.d}</div>
                        <div class="s-box" style="color:var(--success)">تم: ${v.d}</div>
                    </div>
                </div>`;
        });
    }

    async function captureReport() {
        const container = document.getElementById('report');
        const canvas = await html2canvas(container, { scale: 2, backgroundColor: "#f0f4f8" });
        canvas.toBlob(blob => {
            const item = new ClipboardItem({ "image/png": blob });
            navigator.clipboard.write([item]).then(() => alert("تم نسخ التقرير كصورة! يمكنك الآن لصقه (Paste) في الإيميل مباشرة."));
        });
    }

    init();
</script>
</body>
</html>
