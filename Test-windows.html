<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <title>Upgrade Windows — V1.2.4</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --primary: #0d4b73; --success: #10b981; --warning: #f59e0b; --danger: #d64545; }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f9; transition: 0.3s; }
        
        /* زر اللغة */
        .lang-switch { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: white; padding: 10px 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* البطاقات الإحصائية */
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; text-align: center; border-bottom: 5px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stat-card h2 { font-size: 42px; margin: 10px 0; color: var(--primary); }
        .stat-card.yellow { border-color: var(--warning); }
        .stat-card.green { border-color: var(--success); }

        /* بطاقات التفاصيل */
        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .list-card { background: white; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0; }
        .list-items { max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .item { display: flex; justify-content: space-between; padding: 8px; background: #f8fafc; border-radius: 8px; margin-bottom: 5px; font-size: 13px; }

        /* الإدارة */
        .admin-box { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .box-header { background: var(--primary); color: white; padding: 15px 20px; font-weight: bold; display: flex; justify-content: space-between; }
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; font-weight: bold; color: #64748b; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; }

        .btn-row { padding: 15px 20px; display: flex; gap: 10px; border-top: 1px solid #eee; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th { background: #f1f5f9; padding: 15px; text-align: inherit; color: var(--primary); }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }

        /* تنسيق اللغات */
        [dir="ltr"] .info-bar, [dir="ltr"] .stats-row, [dir="ltr"] .form-grid { direction: ltr; }
    </style>
</head>
<body>

<div class="info-bar">
    <div id="user-info">● Checking Connection...</div>
    <div id="sys-version">VERSION 1.2.4</div>
    <button class="lang-switch" onclick="toggleLang()" id="langBtn">English</button>
</div>

<div class="stats-row">
    <div class="stat-card"><span id="txt-total">إجمالي الأجهزة</span><h2 id="val-total">0</h2></div>
    <div class="stat-card yellow"><span id="txt-remain">متبقي (Planned)</span><h2 id="val-remain" style="color:var(--warning)">0</h2></div>
    <div class="stat-card green"><span id="txt-done">مكتمل (Completed)</span><h2 id="val-done" style="color:var(--success)">0</h2></div>
</div>

<div class="details-grid">
    <div class="list-card"><b id="txt-reg">المناطق</b> <div id="list-reg" class="list-items"></div></div>
    <div class="list-card"><b id="txt-city">المدن</b> <div id="list-city" class="list-items"></div></div>
    <div class="list-card"><b id="txt-brand">البراندات</b> <div id="list-brand" class="list-items"></div></div>
</div>

<div class="admin-box">
    <div class="box-header"><span id="txt-admin-title">إدارة بيانات الترقية</span> <i class="fas fa-tools"></i></div>
    <form id="upForm">
        <div class="form-grid">
            <div class="field"><label id="lbl-brName">الفرع</label><input type="text" id="in-brName"></div>
            <div class="field"><label id="lbl-brId">Branch ID</label><input type="text" id="in-brId"></div>
            <div class="field"><label id="lbl-reg">المنطقة</label><input type="text" id="in-reg"></div>
            <div class="field"><label id="lbl-city">المدينة</label><input type="text" id="in-city"></div>
            <div class="field"><label id="lbl-brand">البراند</label><select id="in-brand"><option>Hyundai</option><option>Genesis</option><option>Changan</option></select></div>
            <div class="field"><label id="lbl-status">الحالة</label><select id="in-status"><option value="planned">Planned</option><option value="completed">Completed</option></select></div>
        </div>
        <div class="btn-row">
            <button type="button" style="background:var(--success); color:white" onclick="saveDoc()" id="btn-save">حفظ السجل</button>
            <div style="flex:1"></div>
            <button type="button" onclick="exportXL()" id="btn-down">تنزيل Excel</button>
            <input type="file" id="xlFile" style="display:none" onchange="importXL(this)">
            <button type="button" style="background:#b45309; color:white" onclick="document.getElementById('xlFile').click()" id="btn-up">رفع Excel (مسح القديم)</button>
        </div>
    </form>
</div>

<table>
    <thead><tr id="table-head"><th>Branch ID</th><th>Branch Name</th><th>Brand</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    // الإعدادات
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // نصوص اللغات
    const langData = {
        ar: {
            total: "إجمالي الأجهزة", remain: "متبقي", done: "مكتمل", 
            reg: "المناطق", city: "المدن", brand: "البراندات",
            admin: "إدارة بيانات الترقية", save: "حفظ السجل", down: "تنزيل Excel", up: "رفع Excel (مسح القديم)",
            lang: "English", dir: "rtl"
        },
        en: {
            total: "Total Devices", remain: "Remaining", done: "Completed", 
            reg: "Regions", city: "Cities", brand: "Brands",
            admin: "Upgrade Management", save: "Save Record", down: "Download Excel", up: "Upload Excel (Overwrite)",
            lang: "العربية", dir: "ltr"
        }
    };

    let currentLang = 'ar';

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const d = langData[currentLang];
        document.getElementById('mainHtml').dir = d.dir;
        document.getElementById('langBtn').innerText = d.lang;
        document.getElementById('txt-total').innerText = d.total;
        document.getElementById('txt-remain').innerText = d.remain;
        document.getElementById('txt-done').innerText = d.done;
        document.getElementById('txt-reg').innerText = d.reg;
        document.getElementById('txt-city').innerText = d.city;
        document.getElementById('txt-brand').innerText = d.brand;
        document.getElementById('txt-admin-title').innerText = d.admin;
        document.getElementById('btn-save').innerText = d.save;
        document.getElementById('btn-down').innerText = d.down;
        document.getElementById('btn-up').innerText = d.up;
    }

    // مزامنة البيانات
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('user-info').innerText = "● Connected: " + user.email;
            db.collection("windows_upgrades").onSnapshot(snap => {
                let total = 0, done = 0;
                const sums = { region: {}, city: {}, brand: {} };
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                snap.forEach(doc => {
                    const d = doc.data();
                    // حل مشكلة الصفر: التأكد من قراءة الحقل الصحيح
                    let count = parseInt(d.devicesCount || d.Devices_Count) || 1;
                    let status = String(d.status || d.Status || '').toLowerCase();
                    
                    total += count;
                    if(status === 'completed') done += count;

                    ['region', 'city', 'brand'].forEach(k => {
                        let val = d[k] || d[k.charAt(0).toUpperCase() + k.slice(1)] || 'N/A';
                        sums[k][val] = (sums[k][val] || 0) + count;
                    });

                    tbody.innerHTML += `<tr><td>${d.branchId||'-'}</td><td>${d.branchName||'-'}</td><td>${d.brand||'-'}</td><td>${status}</td><td><i class="fas fa-trash" style="color:red;cursor:pointer" onclick="delDoc('${doc.id}')"></i></td></tr>`;
                });

                document.getElementById('val-total').innerText = total;
                document.getElementById('val-done').innerText = done;
                document.getElementById('val-remain').innerText = total - done;

                renderL('list-reg', sums.region);
                renderL('list-city', sums.city);
                renderL('list-brand', sums.brand);
            });
        } else {
            window.location.href = "login.html";
        }
    });

    function renderL(id, data) {
        const el = document.getElementById(id); el.innerHTML = '';
        Object.entries(data).sort((a,b)=>b[1]-a[1]).forEach(([n, v]) => {
            el.innerHTML += `<div class="item"><span>${n}</span><b>${v}</b></div>`;
        });
    }

    // وظائف الإدارة
    async function saveDoc() {
        const data = {
            branchName: document.getElementById('in-brName').value,
            branchId: document.getElementById('in-brId').value,
            region: document.getElementById('in-reg').value,
            city: document.getElementById('in-city').value,
            brand: document.getElementById('in-brand').value,
            status: document.getElementById('in-status').value,
            devicesCount: 1
        };
        await db.collection("windows_upgrades").add(data);
        alert("Done ✅");
    }

    async function importXL(input) {
        if(!confirm("Overwrite all data?")) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            const old = await db.collection("windows_upgrades").get();
            const batch = db.batch();
            old.forEach(d => batch.delete(d.ref));
            await batch.commit();
            for(let r of json) { await db.collection("windows_upgrades").add(r); }
            alert("Updated! 🚀");
        };
        reader.readAsArrayBuffer(input.files[0]);
    }

    async function exportXL() {
        const snap = await db.collection("windows_upgrades").get();
        const ws = XLSX.utils.json_to_sheet(snap.docs.map(d => d.data()));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, "Upgrade_Windows.xlsx");
    }

    async function delDoc(id) { if(confirm("Delete?")) await db.collection("windows_upgrades").doc(id).delete(); }
</script>
</body>
</html>
