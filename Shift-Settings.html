<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Settings v1.2.0 - Almajdouie Motors</title>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--text:#1f2937;--muted:#64748b;--surface:rgba(255,255,255,.94);--surface2:#fff;--shadow:0 18px 50px rgba(13,33,73,.16);--success:#10b981}
    *{box-sizing:border-box} 
    body{margin:0;padding:20px;font-family:'Segoe UI',sans-serif;background:linear-gradient(180deg, rgba(12,31,73,.1), rgba(255,255,255,.2)), url('image_dba186.png') center/cover fixed no-repeat;min-height:100vh;display:flex;justify-content:center}
    .shell{width:100%;max-width:850px}
    .glass{width:100%;background:var(--surface);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;padding:35px}
    .card{background:var(--surface2);border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:22px;box-shadow:0 10px 24px rgba(0,0,0,0.05);margin-bottom:20px}
    .btn,.btn2{border:none;border-radius:12px;padding:12px 25px;font-weight:800;cursor:pointer;transition:.2s;font-size:14px}
    .btn{background:#fff;color:var(--primary);border:1px solid #e2e8f0}
    .btn2{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff; width:100%; margin-top:10px}
    .row{display:flex;gap:20px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
    .input-group{flex:1; min-width:200px; display:flex; flex-direction:column; gap:8px}
    label{font-weight:800; color:var(--primary); font-size:13px; display:flex; align-items:center; gap:8px}
    input[type="time"]{padding:12px; border-radius:10px; border:1px solid #d8dee8; background:#fff; font-family:inherit; font-size:15px; color:var(--primary); font-weight:700}
    .shift-title { font-size:17px; font-weight:900; margin-bottom:15px; display:block; color:var(--primary); border-right:4px solid var(--primary); padding-right:10px; }
    .status-msg{padding:12px; border-radius:12px; text-align:center; font-weight:800; font-size:13px; display:none; margin-top:15px}
  </style>
</head>
<body>
<div class="shell">
  <div class="glass">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:20px; margin-bottom:30px">
        <div style="display:flex; align-items:center; gap:15px">
            <img src="LOGO-almajdouie.png" style="height:45px" />
            <div>
                <h2 id="title" style="margin:0; color:var(--primary); font-weight:900; font-size:20px">إعدادات توقيت العمل</h2>
                <p id="subtitle" style="margin:0; color:var(--muted); font-size:11px; font-weight:700">تخصيص ساعات الورديات الرسمية - المجدوعي للسيارات</p>
            </div>
        </div>
        <button class="btn" id="btnLang">AR / EN</button>
    </div>

    <div class="card">
        <span class="shift-title">☀️ وردية الصباح (Morning Shift)</span>
        <div class="row">
            <div class="input-group">
                <label class="lblStart">وقت الحضور:</label>
                <input type="time" id="morningStart" value="07:30" />
            </div>
            <div class="input-group">
                <label class="lblEnd">وقت الانصراف:</label>
                <input type="time" id="morningEnd" value="17:00" />
            </div>
        </div>
    </div>

    <div class="card">
        <span class="shift-title">🌙 وردية المساء (Night Shift)</span>
        <div class="row">
            <div class="input-group">
                <label class="lblStart">وقت الحضور:</label>
                <input type="time" id="nightStart" value="13:00" />
            </div>
            <div class="input-group">
                <label class="lblEnd">وقت الانصراف:</label>
                <input type="time" id="nightEnd" value="22:00" />
            </div>
        </div>
    </div>

    <div class="card" style="border-right: 4px solid #10b981;">
        <span class="shift-title" style="border-right-color: #10b981;">🏢 دوام العمل (Work Shift)</span>
        <div class="row">
            <div class="input-group">
                <label class="lblStart">وقت الحضور:</label>
                <input type="time" id="workStart" value="10:00" />
            </div>
            <div class="input-group">
                <label class="lblEnd">وقت الانصراف:</label>
                <input type="time" id="workEnd" value="19:00" />
            </div>
        </div>
    </div>

    <button class="btn2" id="saveBtn" onclick="window.saveSettings()">💾 حفظ كافة الإعدادات</button>
    <div id="statusBox" class="status-msg"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

const i18n = {
    ar: { title:'إعدادات توقيت العمل', subtitle:'تخصيص ساعات الورديات الرسمية - المجدوعي للسيارات', start:'وقت الحضور:', end:'وقت الانصراف:', save:'💾 حفظ كافة الإعدادات', success:'✅ تم حفظ التوقيتات بنجاح!' },
    en: { title:'Work Shift Settings', subtitle:'Official Shift Times Customization - Almajdouie Motors', start:'Start Time:', end:'End Time:', save:'💾 Save All Settings', success:'✅ Shift times saved successfully!' }
};

let currentLang=localStorage.getItem('lang')||'ar';
const $=id=>document.getElementById(id);

window.saveSettings = async () => {
    const data = {
        morningStart: $('morningStart').value, morningEnd: $('morningEnd').value,
        nightStart: $('nightStart').value, nightEnd: $('nightEnd').value,
        workStart: $('workStart').value, workEnd: $('workEnd').value,
        updatedAt: new Date().toISOString()
    };
    try {
        await setDoc(doc(db, 'schedule', 'shift_settings'), data, { merge: true });
        const box = $('statusBox');
        box.innerText = i18n[currentLang].success;
        box.style.display = 'block';
        box.style.background = '#ecfdf5'; box.style.color = '#059669';
        setTimeout(() => box.style.display = 'none', 3000);
    } catch (e) { alert("Error saving settings"); }
};

async function loadSettings(){
    const snap = await getDoc(doc(db, 'schedule', 'shift_settings'));
    if(snap.exists()){
        const d = snap.data();
        if(d.morningStart) $('morningStart').value = d.morningStart;
        if(d.morningEnd) $('morningEnd').value = d.morningEnd;
        if(d.nightStart) $('nightStart').value = d.nightStart;
        if(d.nightEnd) $('nightEnd').value = d.nightEnd;
        if(d.workStart) $('workStart').value = d.workStart;
        if(d.workEnd) $('workEnd').value = d.workEnd;
    }
}

$('btnLang').addEventListener('click', () => {
    currentLang = currentLang==='ar'?'en':'ar'; localStorage.setItem('lang', currentLang); location.reload();
});

window.addEventListener('DOMContentLoaded', () => {
    if(currentLang==='en') { document.getElementById('mainHtml').dir='ltr'; }
    const t = i18n[currentLang];
    $('title').innerText = t.title; $('subtitle').innerText = t.subtitle; 
    $('saveBtn').innerText = t.save;
    document.querySelectorAll('.lblStart').forEach(el => el.innerText = t.start);
    document.querySelectorAll('.lblEnd').forEach(el => el.innerText = t.end);
    loadSettings();
});
</script>
</body>
</html>
