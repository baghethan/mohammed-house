<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift Settings v1.2.1 - Almajdouie Motors</title>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--text:#1f2937;--muted:#64748b;--surface:rgba(255,255,255,.94);--surface2:#fff;--shadow:0 18px 50px rgba(13,33,73,.16);--success:#10b981}
    *{box-sizing:border-box} 
    body{margin:0;padding:20px;font-family:'Segoe UI',sans-serif;background:transparent;min-height:100vh;display:flex;justify-content:center}
    .shell{width:100%;max-width:850px}
    .glass{width:100%;background:var(--surface);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;padding:35px}
    .card{background:var(--surface2);border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:22px;box-shadow:0 10px 24px rgba(0,0,0,0.05);margin-bottom:20px}
    .btn2{border:none;border-radius:12px;padding:15px 25px;font-weight:800;cursor:pointer;transition:.2s;font-size:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff; width:100%; margin-top:10px}
    .row{display:flex;gap:20px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
    .input-group{flex:1; min-width:200px; display:flex; flex-direction:column; gap:8px}
    label{font-weight:800; color:var(--primary); font-size:13px; display:flex; align-items:center; gap:8px}
    input[type="time"]{padding:12px; border-radius:10px; border:1px solid #d8dee8; background:#fff; font-family:inherit; font-size:15px; color:var(--primary); font-weight:700}
    .shift-title { font-size:17px; font-weight:900; margin-bottom:15px; display:block; color:var(--primary); border-right:4px solid var(--primary); padding-right:10px; }
    .status-msg{padding:12px; border-radius:12px; text-align:center; font-weight:800; font-size:13px; display:none; margin-top:15px}
  </style>
</head>
<body>
<div class="shell">
  <div class="glass">
    <div style="display:flex; align-items:center; gap:15px; margin-bottom:30px; border-bottom:2px solid #eee; padding-bottom:20px">
        <img src="LOGO-almajdouie.png" style="height:45px" />
        <h2 style="margin:0; color:var(--primary); font-weight:900; font-size:20px">إعدادات توقيت العمل v1.2.1</h2>
    </div>

    <div class="card">
        <span class="shift-title">☀️ وردية الصباح (Morning Shift)</span>
        <div class="row">
            <div class="input-group"><label>وقت الحضور:</label><input type="time" id="morningStart" /></div>
            <div class="input-group"><label>وقت الانصراف:</label><input type="time" id="morningEnd" /></div>
        </div>
    </div>

    <div class="card">
        <span class="shift-title">🌙 وردية المساء (Night Shift)</span>
        <div class="row">
            <div class="input-group"><label>وقت الحضور:</label><input type="time" id="nightStart" /></div>
            <div class="input-group"><label>وقت الانصراف:</label><input type="time" id="nightEnd" /></div>
        </div>
    </div>

    <div class="card" style="border-right: 4px solid #10b981;">
        <span class="shift-title" style="border-right-color: #10b981;">🏢 دوام العمل (Work Shift)</span>
        <div class="row">
            <div class="input-group"><label>وقت الحضور:</label><input type="time" id="workStart" /></div>
            <div class="input-group"><label>وقت الانصراف:</label><input type="time" id="workEnd" /></div>
        </div>
    </div>

    <button class="btn2" id="saveBtn" onclick="window.saveSettings()">💾 حفظ كافة الإعدادات</button>
    <div id="statusBox" class="status-msg"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { 
    initializeFirestore, doc, setDoc, getDoc, 
    persistentLocalCache, persistentMultipleTabManager 
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
const app = initializeApp(firebaseConfig);

// --- الحل لإجبار الاتصال وتجاوز الحظر ---
const db = initializeFirestore(app, {
    experimentalForceLongPolling: true,
    localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
});

const $=id=>document.getElementById(id);

window.saveSettings = async () => {
    const btn = $('saveBtn');
    btn.innerText = "جاري الحفظ..."; btn.disabled = true;

    const data = {
        morningStart: $('morningStart').value, morningEnd: $('morningEnd').value,
        nightStart: $('nightStart').value, nightEnd: $('nightEnd').value,
        workStart: $('workStart').value, workEnd: $('workEnd').value,
        updatedAt: new Date().toISOString()
    };

    try {
        await setDoc(doc(db, 'schedule', 'shift_settings'), data, { merge: true });
        const box = $('statusBox');
        box.innerText = "✅ تم حفظ التوقيتات بنجاح!";
        box.style.display = 'block'; box.style.background = '#ecfdf5'; box.style.color = '#059669';
        setTimeout(() => box.style.display = 'none', 3000);
    } catch (e) {
        alert("فشل الحفظ: تأكد من الاتصال بالإنترنت.");
    } finally {
        btn.innerText = "💾 حفظ كافة الإعدادات"; btn.disabled = false;
    }
};

async function loadSettings(){
    try {
        const snap = await getDoc(doc(db, 'schedule', 'shift_settings'));
        if(snap.exists()){
            const d = snap.data();
            if(d.morningStart) $('morningStart').value = d.morningStart;
            if(d.morningEnd) $('morningEnd').value = d.morningEnd;
            if(d.nightStart) $('nightStart').value = d.nightStart;
            if(d.nightEnd) $('nightEnd').value = d.nightEnd;
            if(d.workStart) $('workStart').value = d.workStart;
            if(d.workEnd) $('workEnd').value = d.workEnd;
        }
    } catch(e) { console.error("Error loading:", e); }
}

window.onload = loadSettings;
</script>
</body>
</html>
