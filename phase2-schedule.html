<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة إنجازات زيارات الفروع والفنيين</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    linear-gradient(rgba(240,245,250,.95),rgba(240,245,250,.95)),
    url('image_dba186.png') center/cover no-repeat fixed;
}

/* ===== HEADER ===== */
header{
  background:#0d4b73;
  color:#fff;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-logo{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.header-logo img{
  height:40px;
}

.app-version{
  font-size:11px;
  color:#e0e0e0;
}

.logout-btn{
  background:#d64545;
  color:#fff;
  border:none;
  border-radius:20px;
  padding:6px 14px;
  cursor:pointer;
}

/* ===== LOGIN ===== */
#loginBox{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  background:#fff;
  padding:30px;
  border-radius:18px;
  width:380px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.login-card img{
  height:55px;
}

.login-version{
  font-size:11px;
  color:#666;
  margin:6px 0 14px;
}

.login-card input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:12px;
}

.login-card button{
  width:100%;
  padding:12px;
  background:#2f9e66;
  color:#fff;
  border:none;
  border-radius:999px;
  font-weight:bold;
  cursor:pointer;
}

/* ===== DASHBOARD ===== */
#app{
  display:none;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 16px;
}

.dashboard-title{
  text-align:center;
  margin-bottom:20px;
  font-weight:bold;
}

/* الكروت نفس الشكل القديم */
.cards-top{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:18px;
}

.card-blue{
  background:#0d4b73;
  color:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.card-blue span{
  font-size:13px;
}

.card-blue strong{
  display:block;
  font-size:28px;
}

.cards-bottom{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card-white{
  background:#fff;
  padding:16px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.card-white strong{
  display:block;
  font-size:24px;
  color:#0d4b73;
}

.card-white span{
  font-size:13px;
  color:#555;
}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox">
  <div class="login-card">
    <img src="LOGO-almajdouie.png">
    <div class="login-version">v3.6 • آخر تحديث: 2026‑04‑21</div>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button id="loginBtn">تسجيل الدخول</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">

<header>
  <div class="header-left">
    <div class="header-logo">
      <img src="LOGO-almajdouie.png">
      <small class="app-version">v3.6 • آخر تحديث: 2026‑04‑21</small>
    </div>
    <div>إدارة إنجازات زيارات الفروع والفنيين</div>
  </div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<div class="container">

  <div class="dashboard-title">Dashboard</div>

  <!-- الصف العلوي -->
  <div class="cards-top">
    <div class="card-blue"><span>Check‑Lists</span><strong id="statChecklists">0</strong></div>
    <div class="card-blue"><span>إجمالي الزيارات</span><strong id="statVisits">0</strong></div>
    <div class="card-blue"><span>الفنيين</span><strong id="statTechnicians">0</strong></div>
    <div class="card-blue"><span>الفروع</span><strong id="statBranches">0</strong></div>
  </div>

  <!-- الصف السفلي -->
  <div class="cards-bottom">
    <div class="card-white"><strong id="statVisitedTechnicians">0</strong><span>فنيين قاموا بزيارة</span></div>
    <div class="card-white"><strong id="statBrands">0</strong><span>عدد البراندات</span></div>
    <div class="card-white"><strong id="statPendingVisits">0</strong><span>زيارات معلّقة</span></div>
    <div class="card-white"><strong id="statCompletedVisits">0</strong><span>زيارات مكتملة</span></div>
  </div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

const loginBox = document.getElementById('loginBox');
const appBox = document.getElementById('app');

/* ===== LOGIN ===== */
document.getElementById('loginBtn').onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(
      auth,
      loginEmail.value.trim(),
      loginPassword.value
    );
  }catch(e){
    loginMsg.textContent = e.message;
  }
};

document.getElementById('logoutBtn').onclick = ()=>signOut(auth);

/* ===== DASHBOARD DATA (STAGE 1 + 2) ===== */
const state = { branches:[], technicians:[], visits:[], checklists:[] };

function startDashboard(){

  onSnapshot(collection(db,'branches'), snap=>{
    state.branches = snap.docs.map(d=>d.data());
    render();
  });

  onSnapshot(collection(db,'technicians'), snap=>{
    state.technicians = snap.docs.map(d=>d.data());
    render();
  });

  onSnapshot(collection(db,'siteVisits'), snap=>{
    state.visits = snap.docs.map(d=>d.data());
    render();
  });

  onSnapshot(collection(db,'branch_checklists'), snap=>{
    state.checklists = snap.docs.map(d=>d.data());
    render();
  });
}

function render(){
  statBranches.textContent = state.branches.length;
  statTechnicians.textContent = state.technicians.length;
  statVisits.textContent = state.visits.length;
  statChecklists.textContent = state.checklists.length;

  const completed = state.visits.filter(v=>v.status==='completed'||v.checklistCompleted===true);
  const pending = state.visits.filter(v=>v.status!=='completed'&&v.status!=='cancelled');

  statCompletedVisits.textContent = completed.length;
  statPendingVisits.textContent = pending.length;

  const techs = new Set(state.visits.map(v=>v.technicianDocId||v.technicianId||v.technicianEmail).filter(Boolean));
  const brands = new Set(state.visits.map(v=>v.brand).filter(Boolean));

  statVisitedTechnicians.textContent = techs.size;
  statBrands.textContent = brands.size;
}

/* ===== AUTH STATE ===== */
onAuthStateChanged(auth,user=>{
  if(user){
    loginBox.style.display='none';
    appBox.style.display='block';
    startDashboard();
  }else{
    loginBox.style.display='flex';
    appBox.style.display='none';
  }
});
</script>

</body>
</html>
``
