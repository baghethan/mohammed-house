<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Site Visit v3.6 – Modern KPI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --blue:#0d4b73;
  --green:#2f9e66;
  --red:#d64545;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    linear-gradient(rgba(240,245,250,.95),rgba(240,245,250,.95)),
    url('image_dba186.png') center/cover no-repeat fixed;
}

/* ===== UTIL ===== */
.hidden{display:none}

/* ===== LOGIN ===== */
.login-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  background:#fff;
  padding:32px;
  border-radius:22px;
  width:380px;
  text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.25);
}

.login-logo{
  height:60px;
}

.login-version{
  font-size:11px;
  color:#777;
  margin:6px 0 16px;
}

.login-card h3{
  margin:0 0 16px;
}

.login-card input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ccc;
  margin-bottom:12px;
}

.login-card button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:999px;
  background:var(--green);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

/* ===== APP ===== */
header{
  background:var(--blue);
  color:#fff;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-logo{
  display:flex;
  flex-direction:column;
}

.header-logo img{
  height:44px;
}

.app-version{
  font-size:11px;
  color:#e0e0e0;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 16px;
}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox" class="login-overlay">
  <div class="login-card">
    <img src="LOGO-almajdouie.png" class="login-logo" alt="Logo">
    <div class="login-version">v3.6 • آخر تحديث: 21‑04‑2026</div>

    <h3>تسجيل الدخول</h3>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button id="loginBtn">دخول</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">

<header>
  <div class="header-left">
    <div class="header-logo">
      <img src="LOGO-almajdouie.png" alt="Logo">
      <small class="app-version">v3.6 • آخر تحديث: 21‑04‑2026</small>
    </div>
    <div>إدارة إنجازات زيارات الفروع والفنيين</div>
  </div>
  <button id="logoutBtn" style="background:var(--red);color:#fff;border:none;border-radius:999px;padding:8px 16px">
    Logout
  </button>
</header>

<div class="container">
  <h2>✅ تم الدخول بنجاح</h2>
  <p>هذه نسخة تجريبية للتأكد من الدخول والـ Version</p>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginBox = document.getElementById('loginBox');
const appBox   = document.getElementById('app');

document.getElementById('loginBtn').onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(
      auth,
      document.getElementById('loginEmail').value.trim(),
      document.getElementById('loginPassword').value
    );
  }catch(e){
    document.getElementById('loginMsg').textContent = e.message;
  }
};

document.getElementById('logoutBtn').onclick = ()=>signOut(auth);

onAuthStateChanged(auth, user=>{
  console.log('AUTH STATE:', user);
  if(user){
    loginBox.style.display = 'none';
    appBox.style.display = 'block';
  }else{
    loginBox.style.display = 'flex';
    appBox.style.display = 'none';
  }
});
</script>

</body>
</html>
``
