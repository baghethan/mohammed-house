<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Site Visit v3.0 – Clean</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef3f8}
header{background:#0d4b73;color:#fff;padding:14px}
.container{max-width:1200px;margin:20px auto;padding:0 14px}
.hidden{display:none}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:999px;border:1px solid #ccc;cursor:pointer;background:#fff}
.tab.active{background:#0d4b73;color:#fff}
.panel{display:none}
.panel.active{display:block}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
input,select,button{padding:8px;border-radius:8px;border:1px solid #ccc}
button{background:#2f9e66;color:#fff;border:none;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #eee}
th{background:#f0f5fa}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox" class="container">
  <div class="card">
    <h3>تسجيل الدخول</h3>
    <div class="grid">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
    </div>
    <br>
    <button id="loginBtn">Login</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
<header>
  <strong>إدارة زيارات الفروع والفنيين – v3.0</strong>
  <button id="logoutBtn" style="float:left;background:#d64545">Logout</button>
</header>

<div class="container">

<div class="tabs">
  <div class="tab active" data-tab="dashboard">Dashboard</div>
  <div class="tab" data-tab="visits">Visits</div>
  <div class="tab" data-tab="technicians">Technicians</div>
</div>

<!-- Dashboard -->
<section id="dashboard" class="panel active">
  <div class="card">
    <h3>لوحة التحكم</h3>
    <p>الموقع يعمل ✅</p>
    <p id="stats"></p>
  </div>
</section>

<!-- Visits -->
<section id="visits" class="panel">
  <div class="card">
    <h3>إضافة زيارة</h3>
    <div class="grid">
      <input id="vBranch" placeholder="Branch">
      <input id="vBrand" placeholder="Brand">
      <select id="vTech"></select>
      <input id="vDate" type="date">
    </div>
    <br>
    <button id="saveVisitBtn">Save Visit</button>
  </div>

  <div class="card">
    <h3>الزيارات</h3>
    <table>
      <thead>
        <tr><th>Branch</th><th>Brand</th><th>Technician</th><th>Date</th></tr>
      </thead>
      <tbody id="visitsTable"></tbody>
    </table>
  </div>
</section>

<!-- Technicians -->
<section id="technicians" class="panel">
  <div class="card">
    <h3>إضافة فني</h3>
    <div class="grid">
      <input id="tName" placeholder="Technician Name">
    </div>
    <br>
    <button id="saveTechBtn">Save Technician</button>
  </div>

  <div class="card">
    <h3>الفنيين</h3>
    <ul id="techList"></ul>
  </div>
</section>

</div>
</div>

<script>
/* ===== State ===== */
const state = {
  technicians: [],
  visits: [],
  user: null
};

const $ = id => document.getElementById(id);

/* ===== Tabs ===== */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    $(tab.dataset.tab).classList.add('active');
  }
});

/* ===== Login (Mock) ===== */
$('loginBtn').onclick=()=>{
  if(!$('email').value || !$('password').value){
    $('loginMsg').textContent='أدخل البريد وكلمة المرور';
    return;
  }
  state.user = $('email').value;
  $('loginBox').classList.add('hidden');
  $('app').classList.remove('hidden');
  renderStats();
};

$('logoutBtn').onclick=()=>{
  location.reload();
};

/* ===== Technicians ===== */
$('saveTechBtn').onclick=()=>{
  const name=$('tName').value.trim();
  if(!name) return;
  state.technicians.push(name);
  $('tName').value='';
  renderTechnicians();
};

function renderTechnicians(){
  $('techList').innerHTML='';
  $('vTech').innerHTML='<option value="">Select Technician</option>';
  state.technicians.forEach(t=>{
    $('techList').innerHTML+=`<li>${t}</li>`;
    $('vTech').innerHTML+=`<option>${t}</option>`;
  });
  renderStats();
}

/* ===== Visits ===== */
$('saveVisitBtn').onclick=()=>{
  const v={
    branch:$('vBranch').value,
    brand:$('vBrand').value,
    tech:$('vTech').value,
    date:$('vDate').value
  };
  if(!v.branch||!v.brand||!v.tech||!v.date) return;
  state.visits.push(v);
  renderVisits();
};

function renderVisits(){
  $('visitsTable').innerHTML='';
  state.visits.forEach(v=>{
    $('visitsTable').innerHTML+=`
      <tr>
        <td>${v.branch}</td>
        <td>${v.brand}</td>
        <td>${v.tech}</td>
        <td>${v.date}</td>
      </tr>`;
  });
  renderStats();
}

/* ===== Dashboard ===== */
function renderStats(){
  $('stats').textContent =
    `Technicians: ${state.technicians.length} | Visits: ${state.visits.length}`;
}
</script>

</body>
</html>
