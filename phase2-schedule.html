<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Check‑List (Firebase)</title>

  <style>
    body{font-family:Segoe UI,Tahoma,Arial,sans-serif;background:#edf3f8;margin:0;color:#163247}
    header{background:#0d4b73;color:#fff;padding:14px 18px}
    .container{max-width:1100px;margin:16px auto;padding:0 14px}
    .card{background:#fff;border:1px solid #d7e0ea;border-radius:16px;padding:16px;margin-bottom:16px}
    h3{margin:0 0 12px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{display:grid;gap:6px}
    label{font-weight:700}
    input,select,textarea{padding:10px;border:1px solid #d7e0ea;border-radius:10px;font:inherit}
    textarea{min-height:90px}
    .btn{padding:10px 14px;border-radius:999px;border:1px solid #0d4b73;background:#0d4b73;color:#fff;cursor:pointer}
    .btn.secondary{background:#fff;color:#0d4b73}
    .btn.danger{background:#d64545;border-color:#d64545}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .hidden{display:none}
    .item{border:1px dashed #bfd7e8;border-radius:12px;padding:10px;margin-bottom:10px}
    .badge{background:#eef5ff;color:#295fa5;border-radius:999px;padding:4px 8px;font-size:12px}
    ol{list-style:none;padding:0;margin:0;counter-reset:ck}
    li{position:relative;padding-inline-start:36px;margin-bottom:12px}
    li::before{counter-increment:ck;content:counter(ck) " -";position:absolute;inset-inline-start:0;top:2px;font-weight:800;color:#0d4b73}
  </style>
</head>

<body>
<header>
  <strong>Dynamic Check‑List (مرتبط بالفنيين والزيارة)</strong>
</header>

<div class="container">

  <!-- ===== ADMIN BUILDER (Admin فقط) ===== -->
  <div class="card" id="adminBox">
    <h3>إدارة بنود Check‑List (Admin)</h3>

    <div class="grid">
      <div class="field">
        <label>اسم البند</label>
        <input id="f_label" placeholder="مثال: Network Cabinets Condition">
      </div>

      <div class="field">
        <label>نوع البند</label>
        <select id="f_type">
          <option value="checkbox">Checkbox</option>
          <option value="select">Select</option>
          <option value="date">Date</option>
          <option value="text">Text</option>
          <option value="textarea">Textarea</option>
          <option value="number">Number</option>
        </select>
      </div>

      <div class="field">
        <label>خيارات (في حال Select – مفصولة بفاصلة)</label>
        <input id="f_options" placeholder="Yes,No,Other">
      </div>

      <div class="field">
        <label>ترتيب</label>
        <input id="f_order" type="number" value="1">
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="addField()">+ إضافة بند</button>
    </div>

    <div id="adminList" style="margin-top:12px"></div>
  </div>

  <!-- ===== CHECKLIST FORM ===== -->
  <div class="card">
    <h3>نموذج Check‑List</h3>
    <ol id="checklistForm"></ol>

    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="saveChecklist()">حفظ Check‑List</button>
    </div>
  </div>

</div>

<!-- ===== Firebase ===== -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, Timestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* 🔴 ضع إعدادات Firebase الخاصة بك */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== Admin Flag (غيّره حسب صلاحيتك) ===== */
const IS_ADMIN = true;

/* ===== Render Fields ===== */
const q = query(collection(db,'checklist_fields'), orderBy('order'));
onSnapshot(q, snap => {
  renderAdminList(snap);
  renderChecklist(snap);
});

function renderChecklist(snap){
  const ol = document.getElementById('checklistForm');
  ol.innerHTML = '';
  snap.docs.forEach(d=>{
    const f = d.data();
    if(f.active === false) return;

    const li = document.createElement('li');
    li.innerHTML = renderField(f, d.id);
    ol.appendChild(li);
  });
}

function renderField(f,id){
  if(f.type==='checkbox') return `<div class="field"><label>${f.label}</label><input type="checkbox" data-id="${id}"></div>`;
  if(f.type==='date') return `<div class="field"><label>${f.label}</label><input type="date" data-id="${id}"></div>`;
  if(f.type==='number') return `<div class="field"><label>${f.label}</label><input type="number" data-id="${id}"></div>`;
  if(f.type==='textarea') return `<div class="field"><label>${f.label}</label><textarea data-id="${id}"></textarea></div>`;
  if(f.type==='select'){
    const opts=(f.options||[]).map(o=>`<option>${o}</option>`).join('');
    return `<div class="field"><label>${f.label}</label><select data-id="${id}">${opts}</select></div>`;
  }
  return `<div class="field"><label>${f.label}</label><input type="text" data-id="${id}"></div>`;
}

/* ===== Admin ===== */
function renderAdminList(snap){
  const box = document.getElementById('adminList');
  box.innerHTML='';
  if(!IS_ADMIN){ document.getElementById('adminBox').classList.add('hidden'); return; }

  snap.docs.forEach(d=>{
    const f=d.data();
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`<strong>${f.label}</strong> <span class="badge">${f.type}</span>
      <button class="btn danger" style="float:left" onclick="removeField('${d.id}')">حذف</button>`;
    box.appendChild(div);
  });
}

window.addField = async function(){
  const label=f_label.value.trim();
  if(!label) return alert('أدخل اسم البند');
  const type=f_type.value;
  const options=f_options.value?f_options.value.split(',').map(x=>x.trim()):[];
  const order=Number(f_order.value||1);

  await addDoc(collection(db,'checklist_fields'),{
    label,type,options,order,active:true,createdAt:Timestamp.now()
  });

  f_label.value=''; f_options.value='';
}

window.removeField = async function(id){
  if(confirm('حذف البند؟')) await deleteDoc(doc(db,'checklist_fields',id));
}

/* ===== Save Checklist ===== */
window.saveChecklist = function(){
  const data={};
  document.querySelectorAll('#checklistForm [data-id]').forEach(el=>{
    data[el.dataset.id]= el.type==='checkbox'?el.checked:el.value;
  });
  console.log('Checklist Saved:',data);
  alert('تم حفظ Check‑List (انظر Console)');
}
</script>
</body>
</html>
