/* ===== HEADER ===== */
header{
  background:#0d4b73;
  color:#fff;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

  display:flex;

  gap:14px;

  display:flex;

/* ===== LOGIN ===== */
#loginBox{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;

.login-card{
  background:#fff;

  width:100%;

  background:#2f9e66;

  border-radius:999px;
  font-weight:bold;
  cursor:pointer;
}

#app{display:none;}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 16px;
}

/* ===== DASHBOARD CARDS ===== */
.cards-top{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:18px;
}

}

  padding:16px;

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="login-card">
    LOGO-almajdouie.png
    <div class="login-version">v3.7 • آخر تحديث: 2026‑04‑21</div>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn">تسجيل الدخول</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">

<header>
  <div class="header-left">
    <div class="header-logo">
      LOGO-almajdouie.png
      <small class="app-version">v3.7 • آخر تحديث: 2026‑04‑21</small>
    </div>
    <div>إدارة إنجازات زيارات الفروع والفنيين</div>
  </div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<div class="container">

<h3>Brand Summary</h3>
<div class="brand-grid" id="brandGrid"></div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

loginBtn.onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
  }catch(e){ loginMsg.textContent = e.message; }
};

logoutBtn.onclick = ()=>signOut(auth);

const state = {
  visits:[],
  brands:[]
};

function startDashboard(){
  onSnapshot(collection(db,'siteVisits'), s=>{
    state.visits = s.docs.map(d=>d.data());
    renderBrands();
  });

  onSnapshot(collection(db,'brands'), s=>{
    state.brands = s.docs.map(d=>d.data());
    renderBrands();
  });
}

/* ===== BRAND SUMMARY WITH LOGOS ===== */
function renderBrands(){
  brandGrid.innerHTML='';

  const brandMap={};

  state.visits.forEach(v=>{
    if(!v.brand) return;
    if(!brandMap[v.brand]){
      brandMap[v.brand]={visits:0,completed:0,pending:0};
    }
    brandMap[v.brand].visits++;
    if(v.status==='completed'||v.checklistCompleted) brandMap[v.brand].completed++;
    else brandMap[v.brand].pending++;
  });

  Object.keys(brandMap).forEach(b=>{
    const brandInfo = state.brands.find(x=>x.name===b);
    const logo = brandInfo?.logoUrl || '';

    const d = brandMap[b];
    brandGrid.innerHTML += `
      <div class="brand-card">
        ${logo ? `<img src="${logo}" alt="${b${b}</h4>
        <div>إجمالي الزيارات: ${d.visits}</div>
        <div>مكتملة: ${d.completed}</div>
        <div>معلّقة: ${d.pending}</div>
      </div>
    `;
  });
}

onAuthStateChanged(auth,user=>{
  if(user){
    loginBox.style.display='none';
    app.style.display='block';
    startDashboard();
  }else{
    loginBox.style.display='flex';
    app.style.display='none';
  }
});
</script>

</body>
