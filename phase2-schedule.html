<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Site Visit v3.5 – Modern KPI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --blue:#0d4b73;
  --green:#2f9e66;
  --orange:#c47f00;
  --red:#d64545;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    linear-gradient(rgba(240,245,250,.92),rgba(240,245,250,.92)),
    url('image_dba186.png') center/cover no-repeat fixed;
}

.hidden{display:none}

/* ===== HEADER ===== */
header{
  background:var(--blue);
  color:#fff;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-left img{
  height:44px;
  object-fit:contain;
}

.header-title{
  font-size:18px;
  font-weight:700;
}

.header-right{
  display:flex;
  align-items:center;
  gap:16px;
  font-size:13px;
}

button{
  padding:8px 16px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  font-weight:700;
}

button.logout{
  background:var(--red);
  color:#fff;
}

/* ===== LAYOUT ===== */
.container{
  max-width:1400px;
  margin:26px auto;
  padding:0 16px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 12px 32px rgba(18,48,74,.14);
}

/* ===== KPI ===== */
.kpi-main{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-bottom:20px;
}

.kpi{
  border-radius:20px;
  padding:20px;
  color:#fff;
}

.kpi.blue{background:linear-gradient(135deg,#0d4b73,#1a6aa8)}
.kpi.green{background:linear-gradient(135deg,#2f9e66,#4fd38c)}
.kpi.orange{background:linear-gradient(135deg,#c47f00,#f2b84b)}

.kpi span{
  font-size:13px;
  opacity:.9;
}

.kpi strong{
  display:block;
  font-size:36px;
  margin-top:6px;
}

.kpi-sub{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

.kpi-box{
  background:#f9fbfe;
  border:1px solid #dde6ef;
  border-radius:18px;
  padding:18px;
}

.kpi-box strong{
  font-size:30px;
  color:var(--blue);
}

.kpi-box span{
  display:block;
  font-size:13px;
  color:#555;
  margin-top:6px;
}

.status-ok{
  color:var(--green);
  font-size:13px;
  font-weight:700;
}

/* ===== LOGIN ===== */
.login-overlay{
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(240,245,250,.94),rgba(240,245,250,.94)),
    url('image_dba186.png') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  background:#fff;
  padding:32px;
  border-radius:22px;
  width:380px;
  text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.25);
}

.login-logo{
  height:64px;
  margin-bottom:18px;
}

.login-card h3{
  margin:0 0 16px;
}

.login-card input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ccc;
  margin-bottom:12px;
  font-size:14px;
}

.login-card button{
  width:100%;
  background:var(--green);
  color:#fff;
  font-size:15px;
}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox" class="login-overlay">
  <div class="login-card">
    <img src="LOGO-almajdouie.png" class="login-logo" alt="Logo">
    <h3>تسجيل الدخول</h3>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn">دخول</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">

<header>
  <div class="header-left">
    <img src="LOGO-almajdouie.png" alt="Logo">
    <div class="header-title">إدارة إنجازات زيارات الفروع والفنيين</div>
  </div>
  <div class="header-right">
    <div id="loginTime">—</div>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>
</header>

<div class="container">

<div class="card">
  <h3 style="margin-top:0">Dashboard (بيانات مباشرة من Firebase)</h3>

  <div class="kpi-main">
    <div class="kpi blue"><span>Check‑Lists</span><strong id="statChecklists">0</strong></div>
    <div class="kpi blue"><span>إجمالي الزيارات</span><strong id="statVisits">0</strong></div>
    <div class="kpi blue"><span>الفنيين</span><strong id="statTechnicians">0</strong></div>
    <div class="kpi green"><span>الفروع</span><strong id="statBranches">0</strong></div>
  </div>

  <div class="kpi-sub">
    <div class="kpi-box"><strong id="statCompletedVisits">0</strong><span>زيارات مكتملة</span></div>
    <div class="kpi-box"><strong id="statPendingVisits">0</strong><span>زيارات معلّقة</span></div>
    <div class="kpi-box"><strong id="statVisitedTechnicians">0</strong><span>فنيون قاموا بزيارة</span></div>
    <div class="kpi-box"><strong id="statBrands">0</strong><span>عدد البراندات (من الزيارات)</span></div>
  </div>
</div>

<div class="card">
  <span class="status-ok">✅ تم تسجيل الدخول وجلب البيانات من Firebase بنجاح</span>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325",
  storageBucket:"baghethan-ba325.appspot.com",
  messagingSenderId:"944819735112",
  appId:"1:944819735112:web:07315600da39377320667d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

const state = {branches:[],technicians:[],visits:[],checklists:[]};

function renderStats(){
  $('statBranches').textContent = state.branches.length;
  $('statTechnicians').textContent = state.technicians.length;
  $('statVisits').textContent = state.visits.length;
  $('statChecklists').textContent = state.checklists.length;

  const completed = state.visits.filter(v =>
    String(v.status||'').toLowerCase()==='completed' || v.checklistCompleted===true
  ).length;

  const pending = state.visits.filter(v=>{
    const s=String(v.status||'').toLowerCase();
    return s!=='completed' && s!=='cancelled';
  }).length;

  const techs = new Set(state.visits.map(v=>v.technicianDocId||v.technicianId||v.technicianEmail).filter(Boolean));
  const brands = new Set(state.visits.map(v=>(v.brand||'').trim()).filter(Boolean));

  $('statCompletedVisits').textContent = completed;
  $('statPendingVisits').textContent = pending;
  $('statVisitedTechnicians').textContent = techs.size;
  $('statBrands').textContent = brands.size;
}

$('loginBtn').onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(
      auth,
      $('loginEmail').value.trim(),
      $('loginPassword').value
    );
  }catch(e){
    $('loginMsg').textContent = e.code + ' : ' + e.message;
  }
};

$('logoutBtn').onclick = ()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  if(user){
    $('loginBox').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('loginTime').textContent = '🕒 آخر تسجيل دخول: ' + new Date().toLocaleString('ar-SA');
    start();
  }else{
    $('loginBox').classList.remove('hidden');
    $('app').classList.add('hidden');
  }
});

function start(){
  onSnapshot(collection(db,'branches'),s=>{state.branches=s.docs.map(d=>d.data());renderStats();});
  onSnapshot(query(collection(db,'technicians'),orderBy('name')),s=>{state.technicians=s.docs.map(d=>d.data());renderStats();});
  onSnapshot(query(collection(db,'siteVisits'),orderBy('date','desc')),s=>{state.visits=s.docs.map(d=>d.data());renderStats();});
  onSnapshot(query(collection(db,'branch_checklists'),orderBy('visitDate','desc')),s=>{state.checklists=s.docs.map(d=>d.data());renderStats();});
}
</script>

</body>
</html>
``
