<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة زيارات الفروع والفنيين</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#eef3f8;
}

/* ===== HEADER ===== */
header{
  background:#0d4b73;
  color:#fff;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-left img{height:40px}

.app-version{
  font-size:11px;
  color:#d0d0d0;
}

.header-actions button{
  margin-left:6px;
  padding:6px 14px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

.logout-btn{background:#d64545;color:#fff}
.print-btn{background:#2f9e66;color:#fff}

/* ===== NAV ===== */
nav{
  background:#083c5a;
  display:flex;
  flex-wrap:wrap;
}

nav button{
  background:none;
  border:none;
  color:#fff;
  padding:12px 16px;
  cursor:pointer;
}

nav button.active{
  background:#0d4b73;
}

/* ===== LAYOUT ===== */
#app{display:none}
section{display:none;padding:20px}
section.active{display:block}

/* ===== CARDS ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:20px;
}

.card{
  background:#0d4b73;
  color:#fff;
  padding:16px;
  border-radius:14px;
  text-align:center;
}

.card strong{font-size:28px}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

thead{background:#0d4b73;color:#fff}

/* ===== ROLES ===== */
.role-admin{display:none}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox" style="padding:40px;text-align:center">
  <h2>تسجيل الدخول</h2>
  <input id="loginEmail" placeholder="Email"><br><br>
  <input id="loginPassword" type="password" placeholder="Password"><br><br>
  <button id="loginBtn">دخول</button>
  <div id="loginMsg"></div>
</div>

<!-- ===== APP ===== -->
<div id="app">

<header>
  <div class="header-left">
    <img src="LOGO-almajdouie.png">
    <div>
      <div>إدارة زيارات الفروع والفنيين</div>
      <div class="app-version">v4.1 • 2026‑04‑21</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="print-btn role-admin" onclick="window.print()">Print</button>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</header>

<nav>
  <button class="active" onclick="openTab('dashboard')">Dashboard</button>
  <button onclick="openTab('checklist')">Check‑List</button>
  <button class="role-admin" onclick="openTab('dynamic')">Dynamic Check‑List</button>
  <button onclick="openTab('visits')">إدخال زيارة</button>
  <button onclick="openTab('branches')">إدارة الفروع</button>
  <button onclick="openTab('technicians')">إدارة الفنيين</button>
  <button onclick="openTab('brands')">البراندات</button>
  <button class="role-admin" onclick="openTab('upgrade')">Upgrade Windows</button>
  <button class="role-admin" onclick="openTab('permissions')">الصلاحيات</button>
</nav>

<!-- ===== DASHBOARD ===== -->
<section id="dashboard" class="active">
  <h2>Dashboard</h2>
  <div class="cards">
    <div class="card"><span>Check‑Lists</span><strong id="statChecklists">0</strong></div>
    <div class="card"><span>Visits</span><strong id="statVisits">0</strong></div>
    <div class="card"><span>Technicians</span><strong id="statTechnicians">0</strong></div>
    <div class="card"><span>Branches</span><strong id="statBranches">0</strong></div>
  </div>
  <p>✅ كل المراحل التحليلية هنا (Stages 1–8)</p>
</section>

<!-- ===== OTHER SECTIONS ===== -->
<section id="checklist"><h2>Check‑List</h2></section>
<section id="dynamic"><h2>Dynamic Check‑List (Admin)</h2></section>
<section id="visits"><h2>إدخال زيارة</h2></section>
<section id="branches"><h2>إدارة الفروع</h2></section>
<section id="technicians"><h2>إدارة الفنيين</h2></section>
<section id="brands"><h2>البراندات</h2></section>
<section id="upgrade"><h2>Upgrade Windows</h2></section>
<section id="permissions"><h2>الصلاحيات</h2></section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserRole = 'admin'; // ✅ أثناء التطوير

loginBtn.onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
  }catch(e){ loginMsg.textContent=e.message }
};

logoutBtn.onclick = ()=>signOut(auth);

function applyRole(){
  document.querySelectorAll('.role-admin').forEach(el=>{
    el.style.display = currentUserRole==='admin'?'inline-block':'none';
  });
}

onAuthStateChanged(auth, async user=>{
  if(user){
    loginBox.style.display='none';
    app.style.display='block';

    const q=query(collection(db,'app_users'),where('email','==',user.email));
    const snap=await getDocs(q);
    if(!snap.empty) currentUserRole=snap.docs[0].data().role||'viewer';

    applyRole();
  }else{
    loginBox.style.display='block';
    app.style.display='none';
  }
});

window.openTab = id=>{
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
};
</script>

</body>
</html>
