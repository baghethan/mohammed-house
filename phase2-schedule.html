<!DOCTYPE html>
="UTF-8"><html lang="ar" dir="rtl">
<title>إدارة زيارات الفروع والفنيين</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef3f8}

/* ===== DEV MODE ===== */
body.dev-mode .dev-section{
  border:2px dashed #ff9800;
  margin:20px 0;
  padding:12px;
  position:relative;
}
body.dev-mode .dev-section::before{
  content:attr(data-title);
  position:absolute;
  top:-12px;
  right:12px;
  background:#ff9800;
  color:#000;
  font-size:11px;
  padding:2px 8px;
  border-radius:6px;
  font-weight:bold;
}

/* ===== HEADER ===== */
header{
  background:#0d4b73;color:#fff;
  padding:12px 20px;
  display:flex;justify-content:space-between;align-items:center;
}
.header-left{display:flex;align-items:center;gap:14px}
.header-left img{height:40px}
.app-version{font-size:11px;color:#d0d0d0}
.logout-btn{background:#d64545;color:#fff;border:none;border-radius:20px;padding:6px 14px}

/* ===== NAV ===== */
nav{background:#083c5a;display:flex;flex-wrap:wrap}
nav button{
  background:none;border:none;color:#fff;
  padding:12px 16px;cursor:pointer
}
nav button.active{background:#0d4b73}

/* ===== LAYOUT ===== */
#app{display:none}
section{display:none;padding:20px}
section.active{display:block}

/* ===== FORMS ===== */
form{
  background:#fff;
  padding:16px;
  border-radius:12px;
  margin-bottom:20px;
}
form input,form select,form button{
  padding:8px;margin:6px 0;width:100%;
}
form button{background:#0d4b73;color:#fff;border:none}

/* ===== TABLE ===== */
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:center}
thead{background:#0d4b73;color:#fff}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" style="padding:40px;text-align:center">
  <h2>تسجيل الدخول</h2>
  <input id="loginEmail" placeholder="Email"><br><br>
  <input id="loginPassword" type="password" placeholder="Password"><br><br>
  <button id="loginBtn">دخول</button>
  <div id="loginMsg"></div>
</div>

<!-- APP -->
<div id="app">

<header>
  <div class="header-left">
    LOGO-almajdouie.png
    <div>
      <div>إدارة زيارات الفروع والفنيين</div>
      <div class="app-version">v4.2 • 2026‑04‑21</div>
    </div>
  </div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<nav>
  <button class="active" onclick="openTab('checklist',this)">Check‑List</button>
  <button onclick="openTab('visits',this)">إدخال زيارة</button>
  <button onclick="openTab('branches',this)">إدارة الفروع</button>
</nav>

<!-- ================= CHECK‑LIST ================= -->
<section id="checklist" class="active dev-section" data-title="CHECK‑LIST">
<h2>Check‑List</h2>

<form id="checklistForm">
  <input id="cl_branch" placeholder="اسم الفرع">
  <input id="cl_technician" placeholder="اسم الفني">
  <select id="cl_status">
    <option value="completed">مكتملة</option>
    <option value="pending">معلّقة</option>
  </select>
  <button type="submit">حفظ Check‑List</button>
</form>

<table>
<thead>
<tr><th>الفرع</th><th>الفني</th><th>الحالة</th></tr>
</thead>
<tbody id="checklistTable"></tbody>
</table>
</section>

<!-- ================= VISITS ================= -->
<section id="visits" class="dev-section" data-title="VISITS">
<h2>إدخال زيارة</h2>

<form id="visitForm">
  <input id="v_branch" placeholder="اسم الفرع">
  <input id="v_technician" placeholder="اسم الفني">
  <input id="v_date" type="date">
  <select id="v_status">
    <option value="completed">مكتملة</option>
    <option value="pending">معلّقة</option>
  </select>
  <button type="submit">حفظ زيارة</button>
</form>

<table>
<thead>
<tr><th>الفرع</th><th>الفني</th><th>التاريخ</th><th>الحالة</th></tr>
</thead>
<tbody id="visitsTable"></tbody>
</table>
</section>

<!-- ================= BRANCHES ================= -->
<section id="branches" class="dev-section" data-title="BRANCHES">
<h2>إدارة الفروع</h2>

<form id="branchForm">
  <input id="b_name" placeholder="اسم الفرع">
  <button type="submit">إضافة فرع</button>
</form>

<table>
<thead><tr><th>اسم الفرع</th></tr></thead>
<tbody id="branchesTable"></tbody>
</table>
</section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===== LOGIN ===== */
loginBtn.onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
  }catch(e){ loginMsg.textContent=e.message }
};
logoutBtn.onclick = ()=>signOut(auth);

/* ===== AUTH STATE ===== */
onAuthStateChanged(auth,user=>{
  if(user){
    loginBox.style.display='none';
    app.style.display='block';
    loadData();
  }else{
    loginBox.style.display='block';
    app.style.display='none';
  }
});

/* ===== TAB SWITCH ===== */
window.openTab=(id,btn)=>{
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
};

/* ===== CHECK‑LIST ===== */
checklistForm.onsubmit=async e=>{
  e.preventDefault();
  await addDoc(collection(db,'branch_checklists'),{
    branch:cl_branch.value,
    technician:cl_technician.value,
    status:cl_status.value
  });
  checklistForm.reset();
};

onSnapshot(collection(db,'branch_checklists'),s=>{
  checklistTable.innerHTML='';
  s.docs.forEach(d=>{
    const c=d.data();
    checklistTable.innerHTML+=`<tr><td>${c.branch}</td><td>${c.technician}</td><td>${c.status}</td></tr>`;
  });
});

/* ===== VISITS ===== */
visitForm.onsubmit=async e=>{
  e.preventDefault();
  await addDoc(collection(db,'siteVisits'),{
    branch:v_branch.value,
    technician:v_technician.value,
    date:v_date.value,
    status:v_status.value
  });
  visitForm.reset();
};

onSnapshot(collection(db,'siteVisits'),s=>{
  visitsTable.innerHTML='';
  s.docs.forEach(d=>{
    const v=d.data();
    visitsTable.innerHTML+=`<tr><td>${v.branch}</td><td>${v.technician}</td><td>${v.date}</td><td>${v.status}</td></tr>`;
  });
});

/* ===== BRANCHES ===== */
branchForm.onsubmit=async e=>{
  e.preventDefault();
  await addDoc(collection(db,'branches'),{name:b_name.value});
  branchForm.reset();
};

onSnapshot(collection(db,'branches'),s=>{
  branchesTable.innerHTML='';
  s.docs.forEach(d=>{
    branchesTable.innerHTML+=`<tr><td>${d.data().name}</td></tr>`;
  });
});

/* ===== DEV MODE ===== */
if(location.search.includes('debug=1')){
  document.body.classList.add('dev-mode');
}
</script>

</body>
</html>
