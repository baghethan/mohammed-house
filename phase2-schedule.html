<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة زيارات الفروع والفنيين</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    linear-gradient(rgba(240,245,250,.95),rgba(240,245,250,.95)),
    url('image_dba186.png') center/cover no-repeat fixed;
}

/* ===== HEADER ===== */
header{
  background:#0d4b73;
  color:#fff;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}
.header-left img{height:40px}
.app-version{font-size:11px;color:#d0d0d0}
.logout-btn{
  background:#d64545;color:#fff;border:none;
  border-radius:20px;padding:6px 14px;cursor:pointer;
}

/* ===== NAV ===== */
nav{background:#083c5a;display:flex}
nav button{
  background:none;border:none;color:#fff;
  padding:12px 18px;cursor:pointer
}
nav button.active{background:#0d4b73}

/* ===== LAYOUT ===== */
#app{display:none}
section{display:none;padding:20px}
section.active{display:block}

/* ===== DASHBOARD ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:20px;
}
.card{
  background:#0d4b73;color:#fff;
  padding:16px;border-radius:14px;text-align:center;
}
.card span{font-size:13px}
.card strong{display:block;font-size:28px}

/* ===== TABLE ===== */
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:center}
thead{background:#0d4b73;color:#fff}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox" style="padding:40px;text-align:center">
  <h2>تسجيل الدخول</h2>
  <input id="loginEmail" placeholder="Email"><br><br>
  <input id="loginPassword" type="password" placeholder="Password"><br><br>
  <button id="loginBtn">دخول</button>
  <div id="loginMsg"></div>
</div>

<!-- ===== APP ===== -->
<div id="app">

<header>
  <div class="header-left">
    <img src="LOGO-almajdouie.png">
    <div>
      <div>إدارة زيارات الفروع والفنيين</div>
      <div class="app-version">v5.0 • 2026‑04‑23</div>
    </div>
  </div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<nav>
  <button class="active" onclick="openTab('dashboard',this)">Dashboard</button>
  <button onclick="openTab('checklist',this)">Check‑List</button>
  <button onclick="openTab('visits',this)">إدخال زيارة</button>
  <button onclick="openTab('branches',this)">إدارة الفروع</button>
</nav>

<!-- ===== DASHBOARD ===== -->
<section id="dashboard" class="active">
  <h2>Dashboard</h2>
  <div class="cards">
    <div class="card"><span>الفروع</span><strong id="statBranches">0</strong></div>
    <div class="card"><span>الفنيين</span><strong id="statTechnicians">0</strong></div>
    <div class="card"><span>الزيارات</span><strong id="statVisits">0</strong></div>
    <div class="card"><span>Check‑Lists</span><strong id="statChecklists">0</strong></div>
  </div>
</section>

<!-- ===== CHECK‑LIST ===== -->
<section id="checklist">
<h2>Check‑List</h2>
<table>
<thead>
<tr>
  <th>الفرع</th>
  <th>البراند</th>
  <th>عدد الأسئلة</th>
  <th>تاريخ الحفظ</th>
</tr>
</thead>
<tbody id="checklistTable"></tbody>
</table>
</section>

<!-- ===== VISITS ===== -->
<section id="visits">
<h2>إدخال زيارة</h2>
<table>
<thead>
<tr>
  <th>الفرع</th>
  <th>الفني</th>
  <th>التاريخ</th>
  <th>الحالة</th>
</tr>
</thead>
<tbody id="visitsTable"></tbody>
</table>
</section>

<!-- ===== BRANCHES ===== -->
<section id="branches">
<h2>إدارة الفروع</h2>
<table>
<thead>
<tr>
  <th>اسم الفرع</th>
  <th>المدينة</th>
  <th>المنطقة</th>
  <th>البراند</th>
</tr>
</thead>
<tbody id="branchesTable"></tbody>
</table>
</section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325"
};

const appFB = initializeApp(firebaseConfig);
const auth = getAuth(appFB);
const db = getFirestore(appFB);

const loginBox = document.getElementById('loginBox');
const app = document.getElementById('app');

/* ===== LOGIN ===== */
loginBtn.onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
  }catch(e){ loginMsg.textContent=e.message }
};
logoutBtn.onclick = ()=>signOut(auth);

/* ===== AUTH ===== */
onAuthStateChanged(auth,user=>{
  if(user){
    loginBox.style.display='none';
    app.style.display='block';
  }else{
    loginBox.style.display='block';
    app.style.display='none';
  }
});

/* ===== TABS ===== */
window.openTab=(id,btn)=>{
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
};

/* ===== DASHBOARD COUNTERS ===== */
onSnapshot(collection(db,'branches'),s=>{
  statBranches.textContent = s.size;
});
onSnapshot(collection(db,'technicians'),s=>{
  statTechnicians.textContent = s.size;
});
onSnapshot(collection(db,'siteVisits'),s=>{
  statVisits.textContent = s.size;
});
onSnapshot(collection(db,'branch_checklists'),s=>{
  statChecklists.textContent = s.size;
});

/* ===== CHECK‑LIST TABLE ===== */
onSnapshot(collection(db,'branch_checklists'),s=>{
  checklistTable.innerHTML='';
  s.docs.forEach(d=>{
    const c=d.data();
    const answersCount = c.dynamicAnswers ? Object.keys(c.dynamicAnswers).length : 0;
    checklistTable.innerHTML+=`
      <tr>
        <td>${c.branchName}</td>
        <td>${c.brand}</td>
        <td>${answersCount}</td>
        <td>${c.checkListSavedAt}</td>
      </tr>`;
  });
});

/* ===== VISITS TABLE ===== */
onSnapshot(collection(db,'siteVisits'),s=>{
  visitsTable.innerHTML='';
  s.docs.forEach(d=>{
    const v=d.data();
    visitsTable.innerHTML+=`
      <tr>
        <td>${v.branchName}</td>
        <td>${v.technicianName}</td>
        <td>${v.date}</td>
        <td>${v.status}</td>
      </tr>`;
  });
});

/* ===== BRANCHES TABLE ===== */
onSnapshot(collection(db,'branches'),s=>{
  branchesTable.innerHTML='';
  s.docs.forEach(d=>{
    const b=d.data();
    branchesTable.innerHTML+=`
      <tr>
        <td>${b.branchName}</td>
        <td>${b.city}</td>
        <td>${b.region}</td>
        <td>${b.brand}</td>
      </tr>`;
  });
});
</script>

</body>
</html>
``
