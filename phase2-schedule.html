<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Site Visit v3.6 – Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --blue:#0d4b73;
  --green:#2f9e66;
  --red:#d64545;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    linear-gradient(rgba(240,245,250,.95),rgba(240,245,250,.95)),
    url('image_dba186.png') center/cover no-repeat fixed;
}

/* ===== UTIL ===== */
.hidden{display:none}

/* ===== LOGIN ===== */
.login-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  background:#fff;
  padding:32px;
  border-radius:22px;
  width:380px;
  text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.25);
}

.login-logo{
  height:60px;
}

.login-version{
  font-size:11px;
  color:#777;
  margin:6px 0 16px;
}

.login-card h3{
  margin:0 0 16px;
}

.login-card input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ccc;
  margin-bottom:12px;
}

.login-card button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:999px;
  background:var(--green);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

/* ===== APP ===== */
header{
  background:var(--blue);
  color:#fff;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-logo{
  display:flex;
  flex-direction:column;
}

.header-logo img{
  height:44px;
}

.app-version{
  font-size:11px;
  color:#e0e0e0;
}

.header-title{
  font-size:18px;
  font-weight:700;
}

button.logout{
  background:var(--red);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:8px 16px;
  cursor:pointer;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 16px;
}

/* ===== DASHBOARD ===== */
.kpi-main{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:20px;
}

.kpi{
  background:#0d4b73;
  color:#fff;
  padding:18px;
  border-radius:16px;
}

.kpi span{
  font-size:13px;
  opacity:.9;
}

.kpi strong{
  display:block;
  font-size:32px;
}

.kpi-sub{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.kpi-box{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.kpi-box strong{
  font-size:26px;
  color:var(--blue);
}

.kpi-box span{
  font-size:13px;
  color:#555;
}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox" class="login-overlay">
  <div class="login-card">
    <img src="LOGO-almajdouie.png" class="loginersion">v3.6 • آخر تحديث: 21‑04‑2026</div>

    <h3>تسجيل الدخول</h3>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button id="loginBtn">دخول</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" style="display:none">

<header>
  <div class="header-left">
    <div class="header-logo">
      <img src="LOGO-almajdou   <small class="app-version">v3.6 • آخر تحديث: 21‑04‑2026</small>
    </div>
    <div class="header-title">إدارة إنجازات زيارات الفروع والفنيين</div>
  </div>
  <button class="logout" id="logoutBtn">Logout</button>
</header>

<div class="container">

  <h2>Dashboard</h2>

  <div class="kpi-main">
    <div class="kpi"><span>الفروع</span><strong id="statBranches">0</strong></div>
    <div class="kpi"><span>الفنيين</span><strong id="statTechnicians">0</strong></div>
    <div class="kpi"><span>إجمالي الزيارات</span><strong id="statVisits">0</strong></div>
    <div class="kpi"><span>Check‑Lists</span><strong id="statChecklists">0</strong></div>
  </div>

  <div class="kpi-sub">
    <div class="kpi-box"><strong id="statCompletedVisits">0</strong><span>زيارات مكتملة</span></div>
    <div class="kpi-box"><strong id="statPendingVisits">0</strong><span>زيارات معلّقة</span></div>
    <div class="kpi-box"><strong id="statVisitedTechnicians">0</strong><span>فنيون قاموا بزيارة</span></div>
    <div class="kpi-box"><strong id="statBrands">0</strong><span>عدد البراندات</span></div>
  </div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBox = document.getElementById('loginBox');
const appBox   = document.getElementById('app');

/* ===== LOGIN ===== */
document.getElementById('loginBtn').onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(
      auth,
      document.getElementById('loginEmail').value.trim(),
      document.getElementById('loginPassword').value
    );
  }catch(e){
    document.getElementById('loginMsg').textContent = e.message;
  }
};

document.getElementById('logoutBtn').onclick = ()=>signOut(auth);

/* ===== DASHBOARD STATE ===== */
const dashboardState = {
  branches: [],
  technicians: [],
  visits: [],
  checklists: []
};

function startDashboardListeners(){

  onSnapshot(collection(db,'branches'), snap=>{
    dashboardState.branches = snap.docs.map(d=>d.data());
    renderDashboard();
  });

  onSnapshot(collection(db,'technicians'), snap=>{
    dashboardState.technicians = snap.docs.map(d=>d.data());
    renderDashboard();
  });

  onSnapshot(collection(db,'siteVisits'), snap=>{
    dashboardState.visits = snap.docs.map(d=>d.data());
    renderDashboard();
  });

  onSnapshot(collection(db,'branch_checklists'), snap=>{
    dashboardState.checklists = snap.docs.map(d=>d.data());
    renderDashboard();
  });
}

function renderDashboard(){
  document.getElementById('statBranches').textContent = dashboardState.branches.length;
  document.getElementById('statTechnicians').textContent = dashboardState.technicians.length;
  document.getElementById('statVisits').textContent = dashboardState.visits.length;
  document.getElementById('statChecklists').textContent = dashboardState.checklists.length;

  const completed = dashboardState.visits.filter(v=>v.status==='completed'||v.checklistCompleted===true);
  const pending = dashboardState.visits.filter(v=>v.status!=='completed'&&v.status!=='cancelled');

  document.getElementById('statCompletedVisits').textContent = completed.length;
  document.getElementById('statPendingVisits').textContent = pending.length;

  const techs = new Set(dashboardState.visits.map(v=>v.technicianDocId||v.technicianId||v.technicianEmail).filter(Boolean));
  const brands = new Set(dashboardState.visits.map(v=>v.brand).filter(Boolean));

  document.getElementById('statVisitedTechnicians').textContent = techs.size;
  document.getElementById('statBrands').textContent = brands.size;
}

/* ===== AUTH STATE ===== */
onAuthStateChanged(auth, user=>{
  if(user){
    loginBox.style.display = 'none';
    appBox.style.display = 'block';
    startDashboardListeners();
  }else{
    loginBox.style.display = 'flex';
    appBox.style.display = 'none';
  }
});
</script>

</body>
</html>
