<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة إنجازات زيارات الفروع والفنيين</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ===== GENERAL ===== */
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:
    linear-gradient(rgba(240,245,250,.95),rgba(240,245,250,.95)),
    url('image_dba186.png') center/cover no-repeat fixed;
}

/* ===== ROLE VISIBILITY ===== */
.role-admin{display:none;}
.role-viewer{display:none;}

/* ===== HEADER ===== */
header{
  background:#0d4b73;
  color:#fff;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-logo{
  display:flex;
  flex-direction:column;
}

.header-logo img{height:40px;}

.app-version{
  font-size:11px;
  color:#e0e0e0;
}

.header-actions{
  display:flex;
  gap:10px;
}

.logout-btn,
.print-btn{
  border:none;
  border-radius:20px;
  padding:6px 14px;
  cursor:pointer;
}

.logout-btn{background:#d64545;color:#fff;}
.print-btn{background:#2f9e66;color:#fff;}

/* ===== LOGIN ===== */
#loginBox{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login-card{
  background:#fff;
  padding:30px;
  border-radius:18px;
  width:380px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.login-card img{height:55px;}

.login-version{
  font-size:11px;
  color:#666;
  margin:6px 0 14px;
}

.login-card input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:12px;
}

.login-card button{
  width:100%;
  padding:12px;
  background:#2f9e66;
  color:#fff;
  border:none;
  border-radius:999px;
  font-weight:bold;
  cursor:pointer;
}

/* ===== APP ===== */
#app{display:none;}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 16px;
}

.dashboard-title{
  text-align:center;
  margin-bottom:20px;
  font-weight:bold;
}

/* ===== FILTER BAR ===== */
.filter-bar{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.filter-bar input,
.filter-bar select,
.filter-bar button{
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

.filter-bar button{
  background:#0d4b73;
  color:#fff;
  border:none;
  cursor:pointer;
}

/* ===== DASHBOARD CARDS ===== */
.cards-top{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:18px;
}

.card-blue{
  background:#0d4b73;
  color:#fff;
  padding:18px;
  border-radius:14px;
  text-align:center;
}

.cards-bottom{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:30px;
}

.card-white{
  background:#fff;
  padding:16px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}

/* ===== TABLES ===== */
table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:30px;
}

thead{background:#0d4b73;color:#fff;}
th,td{
  padding:10px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

/* ===== TECH COMPARISON ===== */
.tech-section{
  margin-bottom:40px;
}

.tech-chart{
  background:#fff;
  padding:16px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox">
  <div class="login-card">
    LOGO-almajdouie.png
    <div class="login-version">v4.0 • آخر تحديث: 2026‑04‑21</div>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn">تسجيل الدخول</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">

<header>
  <div class="header-left">
    <div class="header-logo">
      LOGO-almajdouie.png
      <small class="app-version">v4.0 • آخر تحديث: 2026‑04‑21</small>
    </div>
    <div>إدارة إنجازات زيارات الفروع والفنيين</div>
  </div>

  <div class="header-actions">
    <button class="print-btn role-admin" onclick="window.print()">Print</button>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</header>

<div class="container">

<div class="dashboard-title">Dashboard</div>

<div class="filter-bar role-admin">
  <input type="date" id="filterFrom">
  <input type="date" id="filterTo">
  <button onclick="applyFilters()">تطبيق الفلتر</button>
</div>

<!-- ===== TECH COMPARISON (ADMIN ONLY) ===== -->
<div class="tech-section role-admin">
  <h3>مقارنة الفنيين</h3>
  <table>
    <thead>
      <tr>
        <th>الفني</th>
        <th>الزيارات</th>
        <th>مكتملة</th>
        <th>معلّقة</th>
      </tr>
    </thead>
    <tbody id="techTable"></tbody>
  </table>

  <div class="tech-chart">
    <canvas id="techChart"></canvas>
  </div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, onSnapshot }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain:"baghethan-ba325.firebaseapp.com",
  projectId:"baghethan-ba325"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let currentUserRole = 'viewer';

loginBtn.onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
  }catch(e){ loginMsg.textContent = e.message; }
};

logoutBtn.onclick = ()=>signOut(auth);

/* ===== LOAD USER ROLE ===== */
async function loadUserRole(email){
  const q = query(collection(db,'app_users'), where('email','==',email));
  const snap = await getDocs(q);
  if(!snap.empty){
    currentUserRole = snap.docs[0].data().role || 'viewer';
  }
  applyRoleVisibility();
}

function applyRoleVisibility(){
  document.querySelectorAll('.role-admin').forEach(el=>{
    el.style.display = currentUserRole==='admin'?'block':'none';
  });
  document.querySelectorAll('.role-viewer').forEach(el=>{
    el.style.display = currentUserRole==='viewer'?'block':'none';
  });
}

/* ===== TECH COMPARISON ===== */
function startDashboard(){
  onSnapshot(collection(db,'siteVisits'),s=>{
    const map={};
    s.docs.forEach(d=>{
      const v=d.data();
      if(!map[v.technicianName]){
        map[v.technicianName]={visits:0,completed:0,pending:0};
      }
      map[v.technicianName].visits++;
      if(v.status==='completed') map[v.technicianName].completed++;
      else map[v.technicianName].pending++;
    });

    techTable.innerHTML='';
    Object.keys(map).forEach(t=>{
      const d=map[t];
      techTable.innerHTML+=`
        <tr>
          <td>${t}</td>
          <td>${d.visits}</td>
          <td>${d.completed}</td>
          <td>${d.pending}</td>
        </tr>`;
    });
  });
}

/* ===== AUTH STATE ===== */
onAuthStateChanged(auth,async user=>{
  if(user){
    loginBox.style.display='none';
    app.style.display='block';
    await loadUserRole(user.email);
    startDashboard();
  }else{
    loginBox.style.display='flex';
    app.style.display='none';
  }
});
</script>

</body>
</html>
``
