<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MMC IT Service Delivery</title>
  <style>
    :root{--dark:#0d2149;--primary:#0d4b73;--red:#ef4444;--green:#15803d;--muted:#64748b}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#dfe8f3,#f8fafc);display:flex;align-items:center;justify-content:center;padding:20px;color:#0f172a}
    .card{width:min(430px,96vw);background:#fff;border-radius:22px;box-shadow:0 28px 80px rgba(13,33,73,.18);overflow:hidden;border:1px solid #dbe4ef}.head{background:var(--dark);color:#fff;padding:22px;border-bottom:4px solid var(--red);text-align:center}.logo{height:48px;background:#fff;padding:4px;border-radius:5px}.head h1{font-size:19px;margin:10px 0 2px}.head p{font-size:11px;margin:0;opacity:.8}.version{display:inline-block;margin-top:9px;font-size:10px;background:#ffffff18;border:1px solid #ffffff30;border-radius:999px;padding:5px 8px;font-weight:900}
    .body{padding:22px}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:900;color:#334155;margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;outline:none}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.btn{width:100%;min-height:44px;border:0;border-radius:10px;background:var(--dark);color:#fff;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.status{margin:12px 0;min-height:20px;font-size:12px;font-weight:800;line-height:1.5}.status.ok{color:var(--green)}.status.error{color:#b91c1c}.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}.links a,.link-btn{color:var(--primary);font-size:12px;font-weight:800;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}.pending-box{display:none;margin-bottom:14px;padding:12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;line-height:1.6}.pending-box.show{display:block}
@media(max-width:520px){
}
  </style>
</head>
<body>
  <main class="card">
    <header class="head"><img class="logo" src="LOGO-almajdouie.png" alt="Almajdouie"><h1>MMC IT Service Delivery</h1><p>Admin Approval Required · Email Verification Disabled</p><span class="version">Login v2.0.3</span></header>
    <section class="body">
      <div id="notice" class="pending-box"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="name@almajdouie.com"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"></div>
      <button id="loginBtn" class="btn" type="button">Login</button>
      <div id="status" class="status"></div>
<div class="links"><button id="forgotBtn" class="link-btn" type="button">Forgot password?</button><a href="register.html">New user? Request Access</a></div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig={apiKey:"AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",authDomain:"baghethan-ba325.firebaseapp.com",projectId:"baghethan-ba325"};
    firebase.initializeApp(firebaseConfig); const auth=firebase.auth(), db=firebase.firestore();
    const PORTAL_URL='test3.html'; const $=id=>document.getElementById(id);
    function setStatus(m,t=''){ $('status').textContent=m||''; $('status').className=('status '+t).trim(); }
    function showNotice(m){ if(!m)return; $('notice').textContent=m; $('notice').classList.add('show'); }
    function clearNotice(){ $('notice').textContent=''; $('notice').classList.remove('show'); }
    const qs=new URLSearchParams(location.search); const access=qs.get('access');
    const notices={requested:'Your access request was submitted. Verify your email and wait for administrator approval.',pending:'Your account is waiting for administrator approval.',rejected:'Your access request was rejected. Contact the administrator if you need access.',inactive:'Your account is inactive. Contact the administrator.',missing:'No approved portal profile was found for this account.'};
    if(access && notices[access]) showNotice(notices[access]);

    async function login(){
      const email=String($('email').value||'').trim().toLowerCase(), password=$('password').value;
      if(!email||!password){setStatus('Enter email and password.','error');return;}
      const btn=$('loginBtn');
      btn.disabled=true;
      clearNotice();
      setStatus('Signing in...');
      try{
        const cred=await auth.signInWithEmailAndPassword(email,password);
        const user=cred.user;

        const userSnap=await db.collection('app_users').doc(user.uid).get();
        if(userSnap.exists){
          const p=userSnap.data()||{};
          const approval=String(p.approvalStatus||'approved').toLowerCase();


          if(p.active===false){
            await auth.signOut(); showNotice(notices.inactive); setStatus('Account is inactive.','error'); return;
          }
          if(approval==='pending'){
            await auth.signOut(); showNotice(notices.pending); setStatus('Waiting for approval.','error'); return;
          }
          if(approval==='rejected'){
            await auth.signOut(); showNotice(notices.rejected); setStatus('Access rejected.','error'); return;
          }

          setStatus('Verified. Opening portal...','ok');
          location.replace(PORTAL_URL);
          return;
        }

        const req=await db.collection('access_requests').doc(user.uid).get();
        if(req.exists){
          const r=req.data()||{}, s=String(r.status||r.approvalStatus||'pending').toLowerCase();
          await auth.signOut();
          if(s==='rejected'){showNotice(notices.rejected);setStatus('Access rejected.','error');}
          else if(s==='approved'){showNotice(notices.missing);setStatus('Approval exists but portal profile is missing. Contact administrator.','error');}
          else {showNotice(notices.pending);setStatus('Waiting for administrator approval.','error');}
          return;
        }

        await auth.signOut();
        showNotice(notices.missing);
        setStatus('Use Request Access if you are a new user.','error');
      }catch(error){
        console.error(error);
        const code=String(error?.code||'');
        let msg='Unable to sign in.';
        if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found'))msg='Invalid email or password.';
        else if(code.includes('too-many-requests'))msg='Too many attempts. Try again later.';
        setStatus(msg,'error');
      }finally{
        btn.disabled=false;
      }
    }

    async function forgot(){ const email=String($('email').value||'').trim().toLowerCase(); if(!email){setStatus('Enter your email first.','error');return;} try{await auth.sendPasswordResetEmail(email);setStatus('Password reset email sent.','ok');}catch(e){setStatus(e.message||'Unable to send reset email.','error');} }
    $('loginBtn').addEventListener('click',login); $('forgotBtn').addEventListener('click',forgot); $('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
  </script>
</body>
</html>
