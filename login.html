<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول | نظام إدارة الزيارات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(13,75,115,.85), rgba(13,75,115,.85)),
        url('image_dba186.png') center/cover no-repeat fixed;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .login-box{
      background:#fff;
      width:380px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
      padding:22px;
      text-align:center;
    }

    .logo{
      margin-bottom:10px;
    }

    .logo img{
      height:55px;
    }

    h2{
      margin:10px 0 15px;
      color:#0d4b73;
      font-size:18px;
    }

    input{
      width:100%;
      padding:10px;
      margin-bottom:12px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:14px;
    }

    button{
      width:100%;
      padding:10px;
      background:#0d4b73;
      color:#fff;
      border:none;
      border-radius:20px;
      cursor:pointer;
      font-size:14px;
    }

    .error{
      color:#c62828;
      font-size:13px;
      display:none;
      margin-bottom:10px;
    }

    .version{
      margin-top:15px;
      font-size:11px;
      color:#777;
    }
  </style>
</head>
<body>

  <div class="login-box">

    <div class="logo">
      <img src="LOGO-almajdouie.png" alt="Almajdouie Logo">
    </div>

    <h2>تسجيل الدخول</h2>

    <div class="error" id="errorMsg"></div>

    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">

    <button onclick="login()">دخول</button>

    <div class="version">
      v1.0 • Updated 2026‑04‑20
    </div>

  </div>

  <!-- ✅ Firebase SDKs (صحيحة 100%) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- ✅ Firebase Init -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d",
      measurementId: "G-45X2SXD2E4"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <!-- ✅ Login Logic -->
  <script>
    function login(){
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      errorMsg.style.display = "none";

      auth.signInWithEmailAndPassword(email, password)
        .then((cred) => {
          return db.collection("app_users").doc(cred.user.uid).get();
        })
        .then((doc) => {
          if (!doc.exists) {
            throw new Error("لا توجد صلاحيات لهذا المستخدم");
          }

          if (doc.data().status !== "active") {
            throw new Error("الحساب غير مفعّل");
          }

          window.location.href = "Site-Visit2.html";
        })
        .catch((err) => {
          console.error(err);
          errorMsg.innerText = err.message;
          errorMsg.style.display = "block";
        });
    }
  </script>

</body>
</html>
