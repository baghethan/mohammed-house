<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول | نظام إدارة الزيارات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background:
        linear-gradient(rgba(13,75,115,.85), rgba(13,75,115,.85)),
        url('image_dba186.png') center/cover no-repeat fixed;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .login-box{
      background:#fff;
      width:380px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
      padding:25px;
      text-align:center;
    }

    .logo img{ height:60px; margin-bottom:15px; }
    h2{ margin:10px 0 20px; color:#0d4b73; font-size:20px; font-weight: 800; }
    input{ width:100%; padding:12px; margin-bottom:15px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; box-sizing: border-box; outline: none; }
    input:focus { border-color: #0d4b73; box-shadow: 0 0 0 2px rgba(13,75,115,0.1); }
    button{ width:100%; padding:12px; background:#0d4b73; color:#fff; border:none; border-radius:25px; cursor:pointer; font-size:15px; font-weight: bold; transition: 0.3s; }
    button:hover { background: #1b4fa3; transform: translateY(-1px); }
    .error{ background: #fee2e2; color:#c62828; padding: 10px; border-radius: 6px; font-size:13px; display:none; margin-bottom:15px; border: 1px solid #fecaca; }
    .version{ margin-top:20px; font-size:11px; color:#64748b; border-top: 1px solid #f1f5f9; padding-top: 15px; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo"><img src="LOGO-almajdouie.png" alt="Almajdouie Logo"></div>
    <h2>تسجيل الدخول للنظام</h2>
    <div class="error" id="errorMsg"></div>

    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">

    <button id="loginBtn" onclick="login()">دخول آمن</button>

    <div class="version">
      <div>System: <strong>v2.0.25</strong> | Login: <strong>v1.2.2</strong></div>
      <div id="buildTime"></div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Init
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function login(){
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const loginBtn = document.getElementById("loginBtn");

      errorMsg.style.display = "none";
      if (!email || !password) {
        errorMsg.innerText = "أدخل البريد الإلكتروني وكلمة المرور أولاً.";
        errorMsg.style.display = "block";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = "جاري الدخول...";

      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .then(() => auth.signInWithEmailAndPassword(email, password))
        .then((cred) => {
          return db.collection("app_users").doc(cred.user.uid).get();
        })
        .then((doc) => {
          if (!doc.exists) throw new Error("لا توجد صلاحيات لهذا المستخدم");
          
          // التحقق من حالة الحساب[cite: 1]
          if (doc.data().active !== true) throw new Error("الحساب غير مفعّل");

          // ✅ التعديل الجديد: التوجيه لصفحة test3.html[cite: 1]
          window.location.href = "test3.html"; 
        })
        .catch((err) => {
          console.error(err);
          const messages = {
            'auth/invalid-email': 'صيغة البريد الإلكتروني غير صحيحة.',
            'auth/invalid-login-credentials': 'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
            'auth/user-not-found': 'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
            'auth/wrong-password': 'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
            'auth/too-many-requests': 'تم إيقاف المحاولات مؤقتاً. حاول لاحقاً.'
          };
          errorMsg.innerText = messages[err.code] || err.message || 'تعذر تسجيل الدخول.';
          errorMsg.style.display = "block";
        })
        .finally(() => {
          loginBtn.disabled = false;
          loginBtn.innerText = "دخول آمن";
        });
    }

    document.getElementById("password").addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });

    const now = new Date();
    document.getElementById("buildTime").innerText = "Last Update: " + now.toLocaleDateString("ar-SA");
  </script>
</body>
</html>
