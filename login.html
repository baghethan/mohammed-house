<script>
  // تأكد أن firebase.initializeApp(firebaseConfig) موجود مرة واحدة فقط

  const auth = firebase.auth();
  const db = firebase.firestore();

  function login(){
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.style.display = "none";

    auth.signInWithEmailAndPassword(email, password)
      .then((cred) => {
        const uid = cred.user.uid;

        // ✅ الآن فقط نقرأ Firestore (بعد Auth)
        return db.collection("app_users").doc(uid).get();
      })
      .then((doc) => {
        if (!doc.exists) {
          throw new Error("لا توجد صلاحيات لهذا المستخدم");
        }

        if (doc.data().status !== "active") {
          throw new Error("الحساب غير مفعّل");
        }

        // ✅ نجاح كامل
        window.location.href = "Site-Visit2.html";
      })
      .catch((err) => {
        console.error(err);
        errorMsg.innerText = err.message;
        errorMsg.style.display = "block";
      });
  }
</script>
``
