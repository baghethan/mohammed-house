<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:#0d4b73;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .login-box{
      background:#fff;
      width:360px;
      border-radius:10px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
      padding:20px;
    }

    h2{
      text-align:center;
      margin-top:0;
      color:#0d4b73;
    }

    input{
      width:100%;
      padding:10px;
      margin-bottom:12px;
      border:1px solid #ccc;
      border-radius:6px;
    }

    button{
      width:100%;
      padding:10px;
      background:#0d4b73;
      color:#fff;
      border:none;
      border-radius:20px;
      cursor:pointer;
      font-size:14px;
    }

    .error{
      color:#c62828;
      font-size:13px;
      display:none;
      margin-bottom:10px;
      text-align:center;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>تسجيل الدخول</h2>

    <div class="error" id="errorMsg"></div>

    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">

    <button onclick="login()">دخول</button>
  </div>

  <!-- ===== Firebase SDKs (مهم جدًا) ===== -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- ===== Firebase Init ===== -->
  <script>
    const firebaseConfig = {
      apiKey: "PUT_YOUR_API_KEY",
      authDomain: "baghethan.firebaseapp.com",
      projectId: "baghethan"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <!-- ===== Login Logic ===== -->
  <script>
    function login(){
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      errorMsg.style.display = "none";

      auth.signInWithEmailAndPassword(email, password)
        .then((cred) => {
          const uid = cred.user.uid;

          // ✅ نقرأ Firestore بعد نجاح Auth فقط
          return db.collection("app_users").doc(uid).get();
        })
        .then((doc) => {
          if (!doc.exists) {
            throw new Error("لا توجد صلاحيات لهذا المستخدم");
          }

          if (doc.data().status !== "active") {
            throw new Error("الحساب غير مفعّل");
          }

          // ✅ دخول ناجح
          window.location.href = "Site-Visit2.html";
        })
        .catch((err) => {
          console.error(err);
          errorMsg.innerText = err.message;
          errorMsg.style.display = "block";
        });
    }
  </script>

</body>
</html>
