<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Scheduling System - Almajdouie</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #eeeeee; --off-text: #555;
            --leave: #f8d7da; --leave-text: #721c24;
            
            /* Button Colors from Image */
            --btn-edit: #1a3a5f;
            --btn-night: #512da8;
            --btn-stop: #e65100;
            --btn-del: #b71c1c;
            --btn-active: #e8f5e9; --btn-active-text: #2e7d32;
            --btn-fixed: #f5f5f5; --btn-fixed-text: #424242;
        }

        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-image: url('image_dba186.png'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }

        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.2); z-index: -1; }

        .toolbar {
            width: 100%; max-width: 1250px; background: var(--primary-blue);
            padding: 12px 20px; border-radius: 12px;
            display: flex; justify-content: flex-start; gap: 10px; margin-bottom: 20px;
        }

        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }

        .glass-container {
            width: 100%; max-width: 1250px; background: rgba(255, 255, 255, 0.98);
            border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .logo-img { max-height: 55px; }

        .tabs { display: flex; justify-content: flex-start; gap: 25px; margin-bottom: 20px; }
        .tab { cursor: pointer; font-weight: bold; color: #555; display: flex; align-items: center; gap: 5px; padding-bottom: 5px; transition: 0.2s; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--primary-blue); border-bottom-color: var(--primary-blue); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 12px 8px; text-align: center; border: 1px solid #f0f0f0; }
        th { background: #fbfbfb; color: var(--primary-blue); font-weight: 800; }

        /* Badges */
        .badge { border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; min-width: 70px; justify-content: center; }
        .Morning { background: var(--morning); color: var(--morning-text); }
        .Evening { background: var(--evening); color: var(--evening-text); }
        .Night { background: var(--night); color: var(--night-text); }
        .Off { background: var(--off); color: var(--off-text); }
        .Vacation { background: var(--leave); color: var(--leave-text); }

        /* Custom Action Buttons from Image */
        .btn-action { border: none; border-radius: 6px; padding: 6px 12px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-action:hover { opacity: 0.8; transform: translateY(-1px); }
        
        .row-fixed { background: var(--btn-fixed); color: var(--btn-fixed-text); border: 1px solid #ddd; }
        .row-active { background: var(--btn-active); color: var(--btn-active-text); border: 1px solid #c8e6c9; }
        .row-edit { background: var(--btn-edit); }
        .row-night { background: var(--btn-night); }
        .row-stop { background: var(--btn-stop); }
        .row-del { background: var(--btn-del); }

        .form-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .btn-save { background: var(--primary-blue); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        @media print { .toolbar, .tabs, .form-box { display: none; } }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="toolbar">
    <button class="btn-tool" onclick="window.setCurrentWeek()">Current Week</button>
    <button class="btn-tool" onclick="window.changeWeek(-7)">Previous Week</button>
    <button class="btn-tool" onclick="window.changeWeek(7)">Next Week</button>
    <button class="btn-tool" onclick="window.print()">Print / PDF</button>
</div>

<div class="glass-container">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" alt="Logo" class="logo-img">
            <div style="text-align: left; border-left: 2px solid #ddd; padding-left: 15px;">
                <div style="font-weight: 900; font-size: 18px; color: var(--primary-blue);">Almajdouie Motors Company</div>
                <div style="font-size: 10px; color: #555;">Scheduling Management System</div>
            </div>
        </div>
        <div style="font-weight: 900; font-size: 22px;">Schedule Dashboard</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="window.switchTab('schedule', this)">🗓️ Schedule</div>
        <div class="tab" onclick="window.switchTab('admin', this)">👥 Employee Management</div>
        <div class="tab" onclick="window.switchTab('vacations', this)">🏖️ Vacations</div>
    </div>

    <div id="schedule" class="tab-content active">
        <input type="date" id="datePicker" onchange="window.renderAll()" style="margin-bottom: 15px;">
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <div class="form-box">
            <input type="hidden" id="editEmpId">
            <div style="display:flex; flex-direction:column; gap:5px">
                <label style="font-size:11px">Full Name:</label>
                <input type="text" id="newEmpName">
            </div>
            <div style="display:flex; flex-direction:column; gap:5px">
                <label style="font-size:11px">Role/Category:</label>
                <select id="newEmpCat">
                    <option>Staff</option><option>Supervisor</option><option>Manager</option><option>Tamheer</option>
                </select>
            </div>
            <div style="display:flex; flex-direction:column; gap:5px">
                <label style="font-size:11px">Shift Logic:</label>
                <select id="newEmpRole">
                    <option value="MORNING">Morning Shift</option>
                    <option value="FIXED">Fixed Night Shift</option>
                </select>
            </div>
            <button id="btnSubmit" class="btn-save" onclick="window.handleEmployeeSubmit()">Save Employee</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Employee Name</th>
                    <th>Status & Actions</th>
                </tr>
            </thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>

    <div id="vacations" class="tab-content">
        <div class="form-box">
            <select id="vacationEmpSelect"></select>
            <input type="date" id="vacationStart">
            <input type="date" id="vacationEnd">
            <button class="btn-save" style="background:#f57c00" onclick="window.addVacation()">Add Vacation</button>
        </div>
        <table>
            <thead><tr><th>Employee</th><th>From</th><th>To</th><th>Action</th></tr></thead>
            <tbody id="vacationList"></tbody>
        </table>
    </div>
</div>
