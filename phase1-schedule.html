<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almajdouie Motors - Scheduling v8.4</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --oncall-bg: #e3f2fd; --oncall-text: #1976d2;
            --night-bg: #f3e5f5; --night-text: #7b1fa2;
            --off-bg: #eeeeee; --off-text: #616161;
            --h-bg: #fff9c4; --h-text: #fbc02d;
            --work-bg: #e8f5e9; --work-text: #2e7d32;
            --morning-bg: #fff3e0; --morning-text: #ef6c00;
            --national-bg: #004d40; --national-text: #ffffff;
            --annual-bg: #ffe0b2; --annual-text: #e65100; /* ألوان الإجازة السنوية */
        }

        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .toolbar { width: 100%; max-width: 1250px; background: var(--primary-blue); padding: 12px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .glass-container { width: 100%; max-width: 1250px; background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .tabs { display: flex; gap: 25px; margin-bottom: 20px; }
        .tab { cursor: pointer; font-weight: bold; color: #555; padding-bottom: 5px; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--primary-blue); border-bottom-color: var(--primary-blue); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th, td { padding: 10px 8px; text-align: center; border: 1px solid #f0f0f0; }
        th { background: #fbfbfb; color: var(--primary-blue); }
        
        .badge { border-radius: 6px; padding: 6px 10px; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; min-width: 110px; justify-content: center; }
        .OnCall, .أون_كول { background: var(--oncall-bg); color: var(--oncall-text); }
        .Night, .ليلي { background: var(--night-bg); color: var(--night-text); }
        .Off, .أوف { background: var(--off-bg); color: var(--off-text); }
        .Holiday, .إجازة { background: var(--h-bg); color: var(--h-text); }
        .Work, .دوام { background: var(--work-bg); color: var(--work-text); }
        .Morning, .صباحي { background: var(--morning-bg); color: var(--morning-text); }
        .NationalDay, .اليوم_الوطني { background: var(--national-bg); color: var(--national-text); }
        .Annual, .سنوية { background: var(--annual-bg); color: var(--annual-text); }
        
        .admin-form { background: #e3f2fd; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        .holiday-form { background: #fff9c4; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .annual-form { background: #ffe0b2; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .btn-action { border: none; border-radius: 6px; padding: 6px 12px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

<div class="toolbar">
    <div style="display:flex; gap:10px">
        <button class="btn-tool" onclick="window.changeWeek(7)">Next Week</button>
        <button class="btn-tool" onclick="window.setCurrentWeek()">Current Week</button>
        <button class="btn-tool" onclick="window.changeWeek(-7)">Previous Week</button>
    </div>
    <button class="btn-tool" style="background:#ffc107; color:#000" onclick="window.toggleLanguage()">AR / EN</button>
</div>

<div class="glass-container">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" class="logo-img" style="max-height:50px">
            <div>
                <div style="font-weight: 900; font-size: 18px; color: var(--primary-blue);">Almajdouie Motors</div>
                <div style="font-size: 10px; color: #555;">Scheduling System v8.4</div>
            </div>
        </div>
        <div id="mainT" style="font-weight: 900; font-size: 20px;">Schedule Dashboard</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="window.switchTab('schedule', this)">🗓️ Schedule</div>
        <div class="tab" onclick="window.switchTab('admin', this)">👥 Employees</div>
        <div class="tab" onclick="window.switchTab('holidays', this)">🎊 Public Holidays</div>
        <div class="tab" onclick="window.switchTab('annual', this)">🌴 Annual Leave</div>
    </div>

    <div id="schedule" class="tab-content active">
        <input type="date" id="datePicker" onchange="window.renderAll()" style="margin-bottom:15px; padding:8px;">
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <div class="admin-form">
            <input type="text" id="newEmpName" placeholder="New Employee Name" style="padding:8px; flex:1; border:1px solid #ccc; border-radius:5px;">
            <select id="newEmpShift" style="padding:8px; border-radius:5px; border:1px solid #ccc;">
                <option value="morning">Morning Shift</option>
                <option value="night">Night Shift</option>
            </select>
            <button class="btn-tool" style="background: var(--primary-blue); color:white" onclick="window.addEmployee()">+ Add Employee</button>
        </div>
        <table>
            <thead><tr><th>Name</th><th>Shift</th><th>Rotation</th><th>Visibility</th><th>Actions</th></tr></thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>

    <div id="holidays" class="tab-content">
        <div class="holiday-form">
            <select id="hEmpSelect" style="padding:8px"></select>
            <input type="text" id="hName" placeholder="Holiday Name" style="padding:8px">
            <input type="date" id="hStart" style="padding:8px">
            <input type="date" id="hEnd" style="padding:8px">
            <button class="btn-tool" style="background: var(--primary-blue); color:white" onclick="window.addHolidayDuty()">Add Assignment</button>
        </div>
        <table>
            <thead><tr><th>Name</th><th>Staff</th><th>Range</th><th>Action</th></tr></thead>
            <tbody id="holidayBody"></tbody>
        </table>
    </div>

    <div id="annual" class="tab-content">
        <div class="annual-form">
            <select id="aEmpSelect" style="padding:8px"></select>
            <input type="date" id="aStart" style="padding:8px">
            <input type="date" id="aEnd" style="padding:8px">
            <button class="btn-tool" style="background: #e65100; color:white" onclick="window.addAnnualLeave()">Add Annual Leave</button>
        </div>
        <table>
            <thead><tr><th>Staff Name</th><th>From</th><th>To</th><th>Action</th></tr></thead>
            <tbody id="annualBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let employees = [], holidayDuties = [], annualLeaves = [], currentLang = 'en';

    window.switchTab = (id, btn) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    };

    window.toggleLanguage = () => {
        currentLang = currentLang === 'en' ? 'ar' : 'en';
        document.getElementById('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        window.renderAll();
    };

    // Firebase Listeners
    onSnapshot(doc(db, "schedule", "jadwal_v6"), (snap) => {
        if(snap.exists()){ employees = snap.data().data.emps || []; window.renderAll(); }
    });
    onSnapshot(doc(db, "schedule", "jadwal_holidays"), (snap) => {
        if(snap.exists()){ holidayDuties = snap.data().duties || []; window.renderAll(); }
    });
    onSnapshot(doc(db, "schedule", "jadwal_annual_leave"), (snap) => {
        if(snap.exists()){ annualLeaves = snap.data().leaves || []; window.renderAll(); }
    });

    window.renderAll = () => {
        const dateInput = document.getElementById('datePicker').value;
        const parts = dateInput.split('-');
        const start = new Date(parts[0], parts[1] - 1, parts[2]);
        start.setHours(0,0,0,0);

        const t = { 
            onCall: currentLang === 'ar' ? 'أون كول' : 'On Call', 
            night: currentLang === 'ar' ? 'ليلي' : 'Night', 
            off: currentLang === 'ar' ? 'أوف' : 'Off', 
            h: currentLang === 'ar' ? 'إجازة' : 'Holiday',
            work: currentLang === 'ar' ? 'دوام' : 'Work',
            morning: currentLang === 'ar' ? 'صباحي' : 'Morning',
            national: currentLang === 'ar' ? 'اليوم الوطني' : 'National Day',
            annual: currentLang === 'ar' ? 'إجازة سنوية' : 'Annual Leave'
        };

        const firstDayOfYear = new Date(start.getFullYear(), 0, 1);
        const pastDays = (start - firstDayOfYear) / 86400000;
        const weekNum = Math.ceil((pastDays + firstDayOfYear.getDay() + 1) / 7);

        const thuPool = employees.filter(e => e.rotType === 'thu' && e.active);
        const friPool = employees.filter(e => e.rotType === 'fri' && e.active);
        let currentThuMan = thuPool.length > 0 ? thuPool[weekNum % thuPool.length].id : null;
        let currentFriMan = friPool.length > 0 ? friPool[weekNum % friPool.length].id : null;

        // Header
        let h = `<th>${currentLang === 'en' ? 'Employee' : 'الموظف'}</th>`;
        const daysArr = currentLang === 'en' ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${daysArr[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        // Body
        document.getElementById('scheduleBody').innerHTML = employees.filter(e => e.active).map(emp => {
            let row = `<tr><td style="text-align:left"><b>${emp.name}</b></td>`;
            for(let d=0; d<7; d++) {
                let cellDate = new Date(start); cellDate.setDate(start.getDate() + d); cellDate.setHours(0,0,0,0);
                
                // 1. Check Annual Leave (Highest Priority)
                const activeAL = annualLeaves.find(leave => {
                    const ds = new Date(leave.start + 'T00:00:00');
                    const de = new Date(leave.end + 'T00:00:00');
                    return String(leave.empId) === String(emp.id) && cellDate >= ds && cellDate <= de;
                });

                // 2. Check Public Holidays
                const activeH = holidayDuties.find(duty => {
                    const ds = new Date(duty.start + 'T00:00:00');
                    const de = new Date(duty.end + 'T00:00:00');
                    return cellDate >= ds && cellDate <= de;
                });

                let shift = "", icon = "", badgeClass = "Morning";

                if (activeAL) {
                    shift = t.annual; badgeClass = "Annual"; icon = "🌴";
                } else if (activeH) {
                    if (String(activeH.empId) === String(emp.id)) {
                        shift = emp.fixed ? t.night : t.onCall; badgeClass = emp.fixed ? "Night" : "OnCall"; icon = emp.fixed ? "🌙" : "📞";
                    } else { shift = t.h; badgeClass = "Holiday"; icon = "🎊"; }
                } else if (cellDate.getMonth() === 8 && cellDate.getDate() === 23) {
                    shift = t.onCall; badgeClass = "NationalDay"; icon = "🇸🇦";
                } else if (d === 4) { 
                    if (emp.id === currentThuMan) { shift = t.off; badgeClass = "Off"; }
                    else { shift = emp.fixed ? t.night : t.morning; badgeClass = emp.fixed ? "Night" : "Morning"; icon = emp.fixed ? "🌙" : "☀️"; }
                } else if (d === 5) {
                    if (emp.id === currentThuMan) { shift = t.off; badgeClass = "Off"; }
                    else if (emp.id === currentFriMan) { shift = t.onCall; badgeClass = "OnCall"; icon = "📞"; }
                    else { shift = t.off; badgeClass = "Off"; }
                } else if (d === 6) {
                    if (emp.id === currentThuMan) { shift = t.work; badgeClass = "Work"; icon = "🏢"; }
                    else { shift = t.off; badgeClass = "Off"; }
                } else {
                    shift = emp.fixed ? t.night : t.morning; badgeClass = emp.fixed ? "Night" : "Morning"; icon = emp.fixed ? "🌙" : "☀️";
                }
                row += `<td><span class="badge ${badgeClass}">${icon} ${shift}</span></td>`;
            }
            return row + "</tr>";
        }).join('');
        updateUILists();
    };

    function updateUILists() {
        // Admin List
        document.getElementById('adminList').innerHTML = employees.map((e, i) => `
            <tr>
                <td style="text-align:left"><b>${e.name}</b></td>
                <td><button onclick="window.toggleProp(${i}, 'fixed')" style="background:${e.fixed?'#512da8':'#ef6c00'}; color:white; border:none; padding:5px; border-radius:4px; min-width:80px;">${e.fixed?'Night':'Morning'}</button></td>
                <td>
                    <select class="small-sel" onchange="window.updateRot(${i}, this.value)">
                        <option value="none" ${e.rotType==='none'?'selected':''}>No Rotation</option>
                        <option value="thu" ${e.rotType==='thu'?'selected':''}>Thu Rotation</option>
                        <option value="fri" ${e.rotType==='fri'?'selected':''}>Fri Rotation</option>
                    </select>
                </td>
                <td><button onclick="window.toggleProp(${i}, 'active')" style="background:${e.active?'#2e7d32':'#616161'}; color:white; border:none; padding:5px; border-radius:4px;">${e.active?'Active':'Hidden'}</button></td>
                <td><button onclick="window.deleteEmployee(${i})" style="color:red; border:none; background:none; cursor:pointer; font-weight:bold;">Delete</button></td>
            </tr>`).join('');
        
        // Populate Selects
        const activeEmps = employees.filter(e => e.active);
        document.getElementById('hEmpSelect').innerHTML = activeEmps.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        document.getElementById('aEmpSelect').innerHTML = activeEmps.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        
        // Holiday List
        document.getElementById('holidayBody').innerHTML = holidayDuties.map((d, i) => {
            const emp = employees.find(e => String(e.id) === String(d.empId));
            return `<tr><td>${d.name}</td><td>${emp?emp.name:'-'}</td><td>${d.start}/${d.end}</td><td><button onclick="window.delDuty(${i})" style="color:red">X</button></td></tr>`;
        }).join('');

        // Annual Leave List
        document.getElementById('annualBody').innerHTML = annualLeaves.map((l, i) => {
            const emp = employees.find(e => String(e.id) === String(l.empId));
            return `<tr><td><b>${emp?emp.name:'-'}</b></td><td>${l.start}</td><td>${l.end}</td><td><button onclick="window.delAnnual(${i})" style="color:red">Delete</button></td></tr>`;
        }).join('');
    }

    // Actions
    window.addEmployee = async () => {
        const name = document.getElementById('newEmpName').value;
        const shift = document.getElementById('newEmpShift').value;
        if(!name) return;
        const newE = { id: "emp_" + Date.now(), name, fixed: (shift==='night'), active: true, rotType: 'none' };
        await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": [...employees, newE] });
        document.getElementById('newEmpName').value = "";
    };

    window.deleteEmployee = async (i) => { if(confirm("Delete employee?")) { let a = [...employees]; a.splice(i,1); await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": a }); } };
    window.toggleProp = async (i, p) => { let a = [...employees]; a[i][p] = !a[i][p]; await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": a }); };
    window.updateRot = async (i, v) => { let a = [...employees]; a[i].rotType = v; await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": a }); };

    window.addHolidayDuty = async () => {
        const id = document.getElementById('hEmpSelect').value, s = document.getElementById('hStart').value, e = document.getElementById('hEnd').value, n = document.getElementById('hName').value;
        if(!s || !e || !n) return;
        await updateDoc(doc(db, "schedule", "jadwal_holidays"), { duties: [...holidayDuties, { empId: id, start: s, end: e, name: n }] });
    };
    window.delDuty = async (i) => { let a = [...holidayDuties]; a.splice(i,1); await updateDoc(doc(db, "schedule", "jadwal_holidays"), { duties: a }); };

    window.addAnnualLeave = async () => {
        const id = document.getElementById('aEmpSelect').value, s = document.getElementById('aStart').value, e = document.getElementById('aEnd').value;
        if(!s || !e) return;
        await updateDoc(doc(db, "schedule", "jadwal_annual_leave"), { leaves: [...annualLeaves, { empId: id, start: s, end: e }] });
        alert("Annual leave added!");
    };
    window.delAnnual = async (i) => { let a = [...annualLeaves]; a.splice(i,1); await updateDoc(doc(db, "schedule", "jadwal_annual_leave"), { leaves: a }); };

    window.setCurrentWeek = () => {
        let now = new Date(); now.setHours(0,0,0,0);
        let s = new Date(now); s.setDate(now.getDate() - now.getDay());
        const y = s.getFullYear(), m = String(s.getMonth() + 1).padStart(2, '0'), d = String(s.getDate()).padStart(2, '0');
        document.getElementById('datePicker').value = `${y}-${m}-${d}`;
        window.renderAll();
    };
    window.changeWeek = (v) => {
        const parts = document.getElementById('datePicker').value.split('-');
        let current = new Date(parts[0], parts[1]-1, parts[2]);
        current.setDate(current.getDate() + v);
        const y = current.getFullYear(), m = String(current.getMonth() + 1).padStart(2, '0'), d = String(current.getDate()).padStart(2, '0');
        document.getElementById('datePicker').value = `${y}-${m}-${d}`;
        window.renderAll();
    };

    window.setCurrentWeek();
</script>
</body>
</html>
