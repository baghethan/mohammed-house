<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جدول الدوام الأسبوعي</title>
    <style>
        :root {
            --morning: #e3f2fd; --morning-text: #1976d2;
            --evening: #fff3e0; --evening-text: #f57c00;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #eeeeee; --off-text: #757575;
            --friday: #ffebee; --friday-text: #c62828;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 25px; background: #f9f9f9; padding: 15px; border-radius: 10px; }
        input[type="date"] { padding: 8px; border-radius: 5px; border: 1px solid #ddd; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #edf2f7; padding: 12px; text-align: center; }
        th { background: #f8fafc; color: #4a5568; font-weight: 600; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; min-width: 60px; }
        .morning { background: var(--morning); color: var(--morning-text); }
        .evening { background: var(--evening); color: var(--evening-text); }
        .night { background: var(--night); color: var(--night-text); }
        .off { background: var(--off); color: var(--off-text); }
        .friday-shift { background: var(--friday); color: var(--friday-text); }
        .emp-name { font-weight: bold; color: #2d3748; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h2>جدول الدوام الأسبوعي الذكي</h2>
    
    <div class="controls">
        <label>اختر تاريخ بداية الأسبوع (الأحد): </label>
        <input type="date" id="datePicker" onchange="generateSchedule()">
    </div>

    <table id="scheduleTable">
        <thead>
            <tr id="headerRow">
                <th>الموظف</th>
                <!-- التواريخ ستظهر هنا -->
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- البيانات ستظهر هنا -->
        </tbody>
    </table>
</div>

<script>
    // تعيين تاريخ اليوم تلقائياً عند الفتح
    document.getElementById('datePicker').valueAsDate = new Date();

    const employees = [
        { id: 'abdulrahman', name: 'Abdulrahman Al-Sulaimani', type: 'fixed-night' },
        { id: 'hamad', name: 'Hamad Al-Khathran (مكتب)', type: 'rotation-a' },
        { id: 'essa', name: 'Essa Swaydi Alsalami', type: 'rotation-a' },
        { id: 'ziyad', name: 'Ziyad Althaqfiy (مكتب)', type: 'rotation-b' },
        { id: 'saleh', name: 'Saleh Aljuraydi', type: 'rotation-b' }
    ];

    const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function generateSchedule() {
        const selectedDate = new Date(document.getElementById('datePicker').value);
        const startOfWeek = new Date(selectedDate);
        // التعديل لتبدأ من يوم الأحد
        startOfWeek.setDate(selectedDate.getDate() - selectedDate.getDay());
        
        const weekNum = getWeekNumber(startOfWeek);
        const isEven = weekNum % 2 === 0;

        // تحديث الهيدر بالتواريخ
        let headerHtml = '<th>الموظف</th>';
        for (let i = 0; i < 7; i++) {
            let d = new Date(startOfWeek);
            d.setDate(startOfWeek.getDate() + i);
            headerHtml += `<th>${days[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerRow').innerHTML = headerHtml;

        let bodyHtml = '';
        employees.forEach(emp => {
            bodyHtml += `<tr><td class="emp-name">${emp.name}</td>`;
            for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
                bodyHtml += `<td>${getShiftBadge(emp, dayIdx, isEven)}</td>`;
            }
            bodyHtml += `</tr>`;
        });
        document.getElementById('tableBody').innerHTML = bodyHtml;
    }

    function getShiftBadge(emp, dayIdx, isEven) {
        // 0=الأحد, 1=الاثنين... 5=الجمعة, 6=السبت

        // 1. عبدالرحمن (ليل ثابت الأحد-الخميس)
        if (emp.id === 'abdulrahman') {
            if (dayIdx >= 0 && dayIdx <= 4) return '<span class="badge night">ليلي</span>';
            return '<span class="badge off">أوف</span>';
        }

        // 2. توزيع الجمعة (شخص واحد بالتناوب)
        if (dayIdx === 5) {
            if (isEven && emp.id === 'ziyad') return '<span class="badge friday-shift">جمعة</span>';
            if (!isEven && emp.id === 'hamad') return '<span class="badge friday-shift">جمعة</span>';
            return '<span class="badge off">أوف</span>';
        }

        // 3. توزيع السبت (شخصين بالتناوب)
        if (dayIdx === 6) {
            if (isEven && (emp.type === 'rotation-b')) return '<span class="badge morning">صباحي</span>';
            if (!isEven && (emp.type === 'rotation-a')) return '<span class="badge morning">صباحي</span>';
            return '<span class="badge off">أوف</span>';
        }

        // 4. الأيام العادية (أحد - خميس)
        if (isEven) {
            // الأسبوع الزوجي: B صباحي، A مسائي
            if (emp.type === 'rotation-b') return '<span class="badge morning">صباحي</span>';
            return '<span class="badge evening">مسائي</span>';
        } else {
            // الأسبوع الفردي: A صباحي، B مسائي
            if (emp.type === 'rotation-a') return '<span class="badge morning">صباحي</span>';
            return '<span class="badge evening">مسائي</span>';
        }
    }

    // تشغيل الدالة فور التحميل
    generateSchedule();
</script>

</body>
</html>
