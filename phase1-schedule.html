<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة الدوام المتكامل - V6</title>
    <style>
        :root {
            --primary: #4a90e2; --bg: #f1f4f9;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #e9ecef; --off-text: #6c757d;
            --leave: #f8d7da; --leave-text: #721c24;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }
        .tabs { display: flex; gap: 5px; margin-bottom: -1px; }
        .tab { padding: 12px 25px; background: #e0e0e0; border-radius: 12px 12px 0 0; cursor: pointer; font-weight: bold; color: #666; border: 1px solid #ccc; border-bottom: none; }
        .tab.active { background: white; color: var(--primary); border-top: 4px solid var(--primary); }
        .content-card { background: white; padding: 30px; border-radius: 0 15px 15px 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 500px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #f0f0f0; padding: 12px; text-align: center; }
        th { background: #fafafa; color: #444; font-size: 14px; }
        .badge { border-radius: 10px; padding: 4px 12px; font-size: 12px; font-weight: bold; display: inline-block; min-width: 65px; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }
        .form-box { background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; align-items: flex-end; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-add { background: var(--primary); color: white; }
        .btn-edit { background: #ffc107; color: #222; margin-left: 5px; }
        .btn-delete { background: #dc3545; color: white; }
        .reset-btn { background: #6c757d; color: white; float: left; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="showTab('schedule-tab', this)">📅 جدول الدوام</div>
        <div class="tab" onclick="showTab('admin-tab', this)">👥 الموظفين والفئات</div>
        <div class="tab" onclick="showTab('leave-tab', this)">🏖️ الإجازات الطويلة</div>
    </div>

    <div class="content-card">
        <div id="schedule-tab" class="tab-content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="margin:0; color:#2c3e50;">جدول الدوام الأسبوعي</h2>
                <input type="date" id="dateInput" onchange="renderAll()">
            </div>
            <table>
                <thead>
                    <tr id="headerRow">
                        <th>الموظف</th><th>الفئة</th><th>الأحد</th><th>الاثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th><th>الجمعة</th><th>السبت</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>

        <div id="admin-tab" class="tab-content">
            <h3 id="formTitle">إدارة الموظفين</h3>
            <div class="form-box">
                <input type="hidden" id="editEmpId">
                <div class="grid-inputs">
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <label>الاسم</label>
                        <input type="text" id="empName" placeholder="الاسم الكامل">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <label>الفئة</label>
                        <select id="empCatSelect"></select>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <label>الشفت</label>
                        <select id="empRole">
                            <option value="MORNING">صباحي</option>
                            <option value="EVENING">مسائي</option>
                            <option value="FIXED">ليلي (ثابت)</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="inRotation" checked>
                        <label for="inRotation" style="font-size:12px;">تدوير السبت</label>
                    </div>
                    <button id="btnAction" class="btn btn-add" onclick="handleEmployeeAction()">حفظ / إضافة</button>
                    <button id="btnCancel" class="btn" style="display:none; background:#aaa; color:white;" onclick="cancelEdit()">إلغاء</button>
                </div>
            </div>
            <table>
                <thead><tr><th>الاسم</th><th>الفئة</th><th>النظام</th><th>تدوير</th><th>إجراءات</th></tr></thead>
                <tbody id="adminListBody"></tbody>
            </table>
            <button class="btn reset-btn" onclick="resetSystem()">⚠️ إعادة تعيين النظام بالكامل</button>
        </div>

        <div id="leave-tab" class="tab-content">
            <h3>تسجيل إجازة طويلة</h3>
            <div class="form-box">
                <div class="grid-inputs">
                    <select id="leaveEmpSelect"></select>
                    <input type="date" id="leaveStart">
                    <input type="date" id="leaveEnd">
                    <button class="btn btn-add" style="background:#f57c00;" onclick="addLongLeave()">تسجيل</button>
                </div>
            </div>
            <table>
                <thead><tr><th>الموظف</th><th>من</th><th>إلى</th><th>إجراء</th></tr></thead>
                <tbody id="leaveListBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // البيانات الافتراضية للتشغيل الأول
    const defaultEmployees = [
        { id: 1, name: "Abdulrahman Ghulam Al-Sulaimani", cat: "مدير", role: "FIXED", inRotation: false },
        { id: 2, name: "Hamad Rashid Al-Khathran", cat: "مشرف", role: "MORNING", inRotation: true },
        { id: 3, name: "Ziyad Fawaz Althaqfiy", cat: "مشرف", role: "EVENING", inRotation: true },
        { id: 4, name: "Essa Alsalami", cat: "موظف اساسي", role: "MORNING", inRotation: false },
        { id: 5, name: "Saleh Aljuraydi", cat: "موظف اساسي", role: "EVENING", inRotation: false }
    ];
    const defaultCategories = ["موظف اساسي", "مشرف", "مدير", "متدرب", "التمهير"];

    let employees = JSON.parse(localStorage.getItem('employees')) || defaultEmployees;
    let categories = JSON.parse(localStorage.getItem('categories')) || defaultCategories;
    let longLeaves = JSON.parse(localStorage.getItem('longLeaves')) || [];

    const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    window.onload = () => {
        const today = new Date();
        const sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('dateInput').valueAsDate = sun;
        renderAll();
    };

    function save() {
        localStorage.setItem('employees', JSON.stringify(employees));
        localStorage.setItem('categories', JSON.stringify(categories));
        localStorage.setItem('longLeaves', JSON.stringify(longLeaves));
    }

    function renderAll() {
        renderCategoriesUI();
        renderAdminList();
        renderSchedule();
        renderLeaveUI();
    }

    function renderCategoriesUI() {
        const select = document.getElementById('empCatSelect');
        select.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function handleEmployeeAction() {
        const id = document.getElementById('editEmpId').value;
        const name = document.getElementById('empName').value.trim();
        const cat = document.getElementById('empCatSelect').value;
        const role = document.getElementById('empRole').value;
        const inRotation = document.getElementById('inRotation').checked;

        if(!name) return alert("اكتب الاسم أولاً");

        if(id) {
            const i = employees.findIndex(e => e.id == id);
            employees[i] = { id: parseInt(id), name, cat, role, inRotation };
            cancelEdit();
        } else {
            employees.push({ id: Date.now(), name, cat, role, inRotation });
        }
        save(); renderAll();
        document.getElementById('empName').value = "";
    }

    function startEdit(id) {
        const e = employees.find(emp => emp.id == id);
        document.getElementById('editEmpId').value = e.id;
        document.getElementById('empName').value = e.name;
        document.getElementById('empCatSelect').value = e.cat;
        document.getElementById('empRole').value = e.role;
        document.getElementById('inRotation').checked = e.inRotation;
        
        document.getElementById('formTitle').innerText = "تعديل الموظف: " + e.name;
        document.getElementById('btnAction').innerText = "حفظ التعديلات";
        document.getElementById('btnCancel').style.display = "inline-block";
    }

    function cancelEdit() {
        document.getElementById('editEmpId').value = "";
        document.getElementById('empName').value = "";
        document.getElementById('formTitle').innerText = "إدارة الموظفين";
        document.getElementById('btnAction').innerText = "حفظ / إضافة";
        document.getElementById('btnCancel').style.display = "none";
    }

    function deleteEmp(id) {
        if(confirm("حذف الموظف نهائياً؟")) {
            employees = employees.filter(e => e.id !== id);
            longLeaves = longLeaves.filter(l => l.empId !== id);
            save(); renderAll();
        }
    }

    function renderAdminList() {
        document.getElementById('adminListBody').innerHTML = employees.map(e => `
            <tr>
                <td style="text-align:right; font-weight:bold;">${e.name}</td>
                <td>${e.cat}</td>
                <td>${e.role}</td>
                <td>${e.inRotation?'✅':'🛑'}</td>
                <td>
                    <button class="btn btn-edit" onclick="startEdit(${e.id})">تعديل</button>
                    <button class="btn btn-delete" onclick="deleteEmp(${e.id})">حذف</button>
                </td>
            </tr>
        `).join('');
    }

    function renderSchedule() {
        const start = new Date(document.getElementById('dateInput').value);
        const isEven = Math.ceil(start.getDate() / 7) % 2 === 0;
        const rotating = employees.filter(e => e.inRotation);

        let html = '';
        employees.forEach(emp => {
            html += `<tr><td style="text-align:right; font-weight:bold;">${emp.name}</td><td style="color:#888">${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let s = calculateShift(emp, d, isEven, curr, rotating);
                html += `<td><span class="badge ${s}">${s}</span></td>`;
            }
            html += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = html;
    }

    function calculateShift(emp, day, isEven, currDate, rotating) {
        if(longLeaves.find(l => { 
            let s=new Date(l.start); let e=new Date(l.end); 
            currDate.setHours(0,0,0,0); s.setHours(0,0,0,0); e.setHours(0,0,0,0);
            return l.empId===emp.id && currDate>=s && currDate<=e; 
        })) return "إجازة";

        if(day === 5) return "أوف"; // الجمعة
        if(emp.role === "FIXED") return (day <= 4) ? "ليلي" : "أوف";
        
        if(day === 6) { // السبت
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx === -1) return "أوف";
            return ((idx === 0 && !isEven) || (idx === 1 && isEven)) ? "صباحي" : "أوف";
        }
        if(day === 4) { // الخميس أوف لمداوم السبت
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx !== -1 && ((idx === 0 && !isEven) || (idx === 1 && isEven))) return "أوف";
        }
        return (emp.role === "MORNING") ? "صباحي" : "مسائي";
    }

    function addLongLeave() {
        const id = document.getElementById('leaveEmpSelect').value;
        const s = document.getElementById('leaveStart').value;
        const e = document.getElementById('leaveEnd').value;
        if(!id || !s || !e) return alert("أكمل التواريخ");
        longLeaves.push({ id: Date.now(), empId: parseInt(id), start: s, end: e });
        save(); renderAll();
    }

    function deleteLeave(id) { longLeaves = longLeaves.filter(l => l.id !== id); save(); renderAll(); }

    function renderLeaveUI() {
        document.getElementById('leaveEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        document.getElementById('leaveListBody').innerHTML = longLeaves.map(l => {
            const emp = employees.find(e => e.id === l.empId);
            return `<tr><td>${emp?emp.name:'-'}</td><td>${l.start}</td><td>${l.end}</td><td><button class="btn btn-delete" onclick="deleteLeave(${l.id})">حذف</button></td></tr>`;
        }).join('');
    }

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    }

    function resetSystem() {
        if(confirm("هذا سيمسح كل بياناتك ويعيد الموظفين الأصليين فقط. هل أنت متأكد؟")) {
            localStorage.clear();
            location.reload();
        }
    }
</script>
</body>
</html>
