<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة الدوام - الجمعة أوف</title>
    <style>
        :root {
            --primary: #4a90e2; --bg: #f1f4f9;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #e9ecef; --off-text: #6c757d;
            --leave: #f8d7da; --leave-text: #721c24;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1350px; margin: auto; }
        .tabs { display: flex; gap: 5px; margin-bottom: -1px; }
        .tab { padding: 12px 25px; background: #e0e0e0; border-radius: 12px 12px 0 0; cursor: pointer; font-weight: bold; color: #666; border: 1px solid #ccc; border-bottom: none; }
        .tab.active { background: white; color: var(--primary); border-top: 4px solid var(--primary); }
        .content-card { background: white; padding: 30px; border-radius: 0 15px 15px 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 500px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #f0f0f0; padding: 12px; text-align: center; }
        th { background: #fafafa; color: #444; font-size: 14px; }
        .badge { border-radius: 10px; padding: 4px 12px; font-size: 12px; font-weight: bold; display: inline-block; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }
        .form-box { background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-add { background: var(--primary); color: white; }
        .btn-delete { background: #ff4d4d; color: white; padding: 5px 12px; font-size: 11px; }
        .sum-card { flex: 1; background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="showTab('schedule-tab', this)">📅 الجدول الأسبوعي</div>
        <div class="tab" onclick="showTab('admin-tab', this)">👥 الموظفين</div>
        <div class="tab" onclick="showTab('leave-tab', this)">🏖️ الإجازات</div>
    </div>

    <div class="content-card">
        <div id="schedule-tab" class="tab-content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin:0;">الجدول (الجمعة أوف - السبت موظف)</h2>
                <input type="date" id="dateInput" onchange="renderSchedule()">
            </div>
            <table>
                <thead><tr id="headerRow"><th>الموظف</th><th>الفئة</th></tr></thead>
                <tbody id="scheduleBody"></tbody>
            </table>
            <div style="display:flex; gap:15px; margin-top:30px;" id="summaryArea"></div>
        </div>

        <div id="admin-tab" class="tab-content">
            <h2>إضافة موظف</h2>
            <div class="form-box">
                <div class="grid-inputs">
                    <input type="text" id="empName" placeholder="اسم الموظف">
                    <select id="empCat"><option>موظف</option><option>مشرف</option><option>مدير</option></select>
                    <select id="empRole">
                        <option value="MORNING">صباحي</option>
                        <option value="EVENING">مسائي</option>
                        <option value="FIXED">ليلي (ثابت)</option>
                    </select>
                    <label><input type="checkbox" id="inRotation" checked> تدوير السبت</label>
                    <button class="btn btn-add" onclick="addNewEmployee()">+ إضافة</button>
                </div>
            </div>
            <table id="adminListTable">
                <thead><tr><th>الاسم</th><th>الفئة</th><th>النظام</th><th>التدوير</th><th>إجراءات</th></tr></thead>
                <tbody id="adminListBody"></tbody>
            </table>
        </div>

        <div id="leave-tab" class="tab-content">
            <h2>تسجيل إجازة طويلة</h2>
            <div class="form-box">
                <div class="grid-inputs">
                    <select id="leaveEmpSelect"></select>
                    <input type="date" id="leaveStart">
                    <input type="date" id="leaveEnd">
                    <button class="btn btn-add" style="background:#f57c00;" onclick="addLongLeave()">تسجيل</button>
                </div>
            </div>
            <tbody id="leaveListBody"></tbody>
        </table>
        </div>
    </div>
</div>

<script>
    let employees = JSON.parse(localStorage.getItem('employees')) || [
        { id: 1, name: "Abdulrahman Al-Sulaimani", cat: "مدير", role: "FIXED", inRotation: false },
        { id: 2, name: "Hamad Al-Khathran", cat: "مشرف", role: "MORNING", inRotation: true },
        { id: 3, name: "Ziyad Althaqfiy", cat: "مشرف", role: "EVENING", inRotation: true },
        { id: 4, name: "Essa Alsalami", cat: "موظف", role: "MORNING", inRotation: false },
        { id: 5, name: "Saleh Aljuraydi", cat: "موظف", role: "EVENING", inRotation: false }
    ];
    let longLeaves = JSON.parse(localStorage.getItem('longLeaves')) || [];
    const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    window.onload = () => {
        const today = new Date();
        const sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('dateInput').valueAsDate = sun;
        renderAll();
    };

    function save() { localStorage.setItem('employees', JSON.stringify(employees)); localStorage.setItem('longLeaves', JSON.stringify(longLeaves)); }

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
        renderAll();
    }

    function addNewEmployee() {
        const name = document.getElementById('empName').value;
        if(!name) return;
        employees.push({ id: Date.now(), name, cat: document.getElementById('empCat').value, role: document.getElementById('empRole').value, inRotation: document.getElementById('inRotation').checked });
        save(); renderAll();
    }

    function addLongLeave() {
        longLeaves.push({ id: Date.now(), empId: parseInt(document.getElementById('leaveEmpSelect').value), start: document.getElementById('leaveStart').value, end: document.getElementById('leaveEnd').value });
        save(); renderAll();
    }

    function deleteEmp(id) { employees = employees.filter(e => e.id !== id); save(); renderAll(); }

    function renderAll() { renderSchedule(); renderAdminList(); updateLeaveUI(); }

    function updateLeaveUI() {
        document.getElementById('leaveEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
    }

    function renderAdminList() {
        document.getElementById('adminListBody').innerHTML = employees.map(e => `<tr><td>${e.name}</td><td>${e.cat}</td><td>${e.role}</td><td>${e.inRotation?'✅':'🛑'}</td><td><button class="btn btn-delete" onclick="deleteEmp(${e.id})">حذف</button></td></tr>`).join('');
    }

    function renderSchedule() {
        const start = new Date(document.getElementById('dateInput').value);
        const weekNum = Math.ceil(start.getDate() / 7);
        const isEven = weekNum % 2 === 0;

        let h = '<th>الموظف</th><th>الفئة</th>';
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate()+i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerRow').innerHTML = h;

        let b = ''; let counts = { صباحي:0, مسائي:0, ليلي:0, إجازات:0 };
        const rotating = employees.filter(e => e.inRotation);

        employees.forEach(emp => {
            b += `<tr><td style="text-align:right; font-weight:bold;">${emp.name}</td><td>${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let shift = calculateShift(emp, d, isEven, curr, rotating);
                b += `<td><span class="badge ${shift}">${shift}</span></td>`;
                if(shift==="صباحي") counts.صباحي++; else if(shift==="مسائي") counts.مسائي++; else if(shift==="ليلي") counts.ليلي++; else if(shift==="إجازة") counts.إجازات++;
            }
            b += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = b;
        document.getElementById('summaryArea').innerHTML = `<div class="sum-card"><h3>${counts.صباحي}</h3><p>صباحي</p></div><div class="sum-card"><h3>${counts.مسائي}</h3><p>مسائي</p></div><div class="sum-card"><h3>${counts.ليلي}</h3><p>ليلي</p></div>`;
    }

    function calculateShift(emp, day, isEven, currDate, rotating) {
        // إجازة طويلة
        if(longLeaves.find(l => { let s=new Date(l.start); let e=new Date(l.end); currDate.setHours(0,0,0,0); return l.empId===emp.id && currDate>=s && currDate<=e; })) return "إجازة";

        // الجمعة أوف للكل
        if(day === 5) return "أوف";

        // عبدالرحمن / ليلي ثابت
        if(emp.role === "FIXED") return (day <= 4) ? "ليلي" : "أوف";

        // السبت (موظف واحد بالتناوب)
        if(day === 6) {
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx === 0 && !isEven) return "صباحي";
            if(idx === 1 && isEven) return "صباحي";
            return "أوف";
        }

        // الخميس أوف للشخص اللي بيداوم السبت (عشان يكمل 5 أيام)
        if(day === 4) {
            const idx = rotating.findIndex(r => r.id === emp.id);
            if((idx === 0 && !isEven) || (idx === 1 && isEven)) return "أوف";
        }

        // الأيام العادية (أحد - خميس)
        return (emp.role === "MORNING") ? "صباحي" : "مسائي";
    }
</script>
</body>
</html>
