<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام الجدولة الاحترافي - شركة الجدارة</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: rgba(233, 236, 239, 0.8); --off-text: #6c757d;
            --leave: #f8d7da; --leave-text: #721c24;
            --logout-bg: #ffebee; --logout-text: #c62828;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            /* استدعاء الخلفية */
            background-image: url('image_dba186.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* طبقة حماية لتحسين وضوح النص فوق الصورة */
        .page-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 33, 73, 0.25);
            z-index: -1;
        }

        .container { max-width: 1400px; margin: auto; position: relative; }

        /* شريط الأدوات العلوي - مطابق للصورة */
        .toolbar { 
            background: rgba(13, 33, 73, 0.85); 
            backdrop-filter: blur(15px);
            padding: 15px 25px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: flex-end; 
            gap: 12px; 
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-tool {
            background: white;
            color: #0d2149;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-tool:hover { background: #e3f2fd; transform: translateY(-2px); }
        .btn-logout { background: var(--logout-bg); color: var(--logout-text); }

        /* التبويبات الشفافة */
        .tabs { display: flex; gap: 5px; margin-bottom: -1px; }
        .tab { 
            padding: 12px 25px; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(10px);
            border-radius: 12px 12px 0 0; 
            cursor: pointer; 
            font-weight: bold; 
            color: #444; 
            border: 1px solid rgba(255,255,255,0.4);
            border-bottom: none;
        }
        .tab.active { 
            background: white; 
            color: var(--primary-blue); 
            border-top: 5px solid var(--primary-blue); 
        }

        /* الكارت الرئيسي بنمط الزجاج */
        .content-card { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(20px);
            padding: 30px; 
            border-radius: 0 15px 15px 15px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); 
            min-height: 500px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* الجداول الأنيقة */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; margin-top: 15px; }
        th, td { border: 1px solid #eee; padding: 14px 8px; text-align: center; }
        th { background: #fdfdfd; color: #555; font-size: 13px; font-weight: 800; }
        
        .badge { border-radius: 10px; padding: 5px 15px; font-size: 12px; font-weight: bold; display: inline-block; min-width: 60px; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }

        .btn-action { background: var(--primary-blue); color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        @media print {
            .toolbar, .tabs, .page-overlay { display: none; }
            body { background: white; padding: 0; }
            .content-card { box-shadow: none; border: none; }
        }
    </style>
</head>
<body>

<div class="page-overlay"></div>

<div class="container">
    <div class="toolbar">
        <button class="btn-tool btn-logout" onclick="logout()">تسجيل الخروج</button>
        <button class="btn-tool" onclick="alert('جاري التصدير...')">تصدير Excel</button>
        <button class="btn-tool" onclick="alert('نسخ للـ Outlook...')">نسخ Outlook</button>
        <button class="btn-tool" onclick="window.print()">طباعة / PDF</button>
        <button class="btn-tool" onclick="changeWeek(7)">الأسبوع التالي</button>
        <button class="btn-tool" onclick="setCurrentWeek()">الأسبوع الحالي</button>
        <button class="btn-tool" onclick="changeWeek(-7)">الأسبوع السابق</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="showTab('schedule-tab', this)">🗓️ جدول الدوام الأسبوعي</div>
        <div class="tab" onclick="showTab('admin-tab', this)">👥 إدارة الموظفين والفئات</div>
        <div class="tab" onclick="showTab('leave-tab', this)">🏖️ الإجازات الطويلة</div>
    </div>

    <div class="content-card">
        <div id="schedule-tab" class="tab-content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="color: var(--primary-blue); margin: 0;">جدول الدوام (الجمعة أوف - السبت موظف)</h2>
                <input type="date" id="dateInput" onchange="renderSchedule()" style="padding:8px; border-radius:8px; border:1px solid #ddd;">
            </div>
            <table>
                <thead>
                    <tr id="headerRow">
                        <th>الموظف</th><th>الفئة</th><th>الأحد</th><th>الاثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th><th>الجمعة</th><th>السبت</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>

        <div id="admin-tab" class="tab-content">
            <h3>إضافة وتعديل بيانات الموظفين</h3>
            <div style="background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                <input type="text" id="empName" placeholder="الاسم الكامل">
                <select id="empCatSelect"></select>
                <select id="empRole">
                    <option value="MORNING">صباحي</option>
                    <option value="EVENING">مسائي</option>
                    <option value="FIXED">ليلي (ثابت)</option>
                </select>
                <label style="font-weight:bold;"><input type="checkbox" id="inRotation" checked> تدوير السبت</label>
                <button class="btn-action" onclick="addNewEmployee()">+ إضافة الموظف</button>
            </div>
            <table>
                <thead><tr><th>الاسم</th><th>الفئة</th><th>النظام</th><th>تدوير</th><th>إجراءات</th></tr></thead>
                <tbody id="adminListBody"></tbody>
            </table>
        </div>

        <div id="leave-tab" class="tab-content">
            <h3>تسجيل إجازة طويلة</h3>
            <div style="background: #f9f9f9; padding: 20px; border-radius: 10px; display: flex; gap: 10px;">
                <select id="leaveEmpSelect" style="flex:1"></select>
                <input type="date" id="leaveStart">
                <input type="date" id="leaveEnd">
                <button class="btn-action" style="background: orange;" onclick="addLongLeave()">حفظ الإجازة</button>
            </div>
            <table>
                <thead><tr><th>الموظف</th><th>البداية</th><th>النهاية</th><th>حذف</th></tr></thead>
                <tbody id="leaveListBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // تهيئة البيانات
    let employees = JSON.parse(localStorage.getItem('employees')) || [
        { id: 1, name: "Abdulrahman Al-Sulaimani", cat: "مدير", role: "FIXED", inRotation: false },
        { id: 2, name: "Hamad Al-Khathran", cat: "مشرف", role: "MORNING", inRotation: true },
        { id: 3, name: "Ziyad Althaqfiy", cat: "مشرف", role: "EVENING", inRotation: true }
    ];
    let categories = ["موظف اساسي", "مشرف", "مدير", "متدرب", "التمهير"];
    let longLeaves = JSON.parse(localStorage.getItem('longLeaves')) || [];
    const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    window.onload = () => { setCurrentWeek(); };

    function save() {
        localStorage.setItem('employees', JSON.stringify(employees));
        localStorage.setItem('longLeaves', JSON.stringify(longLeaves));
    }

    function changeWeek(days) {
        let d = new Date(document.getElementById('dateInput').value);
        d.setDate(d.getDate() + days);
        document.getElementById('dateInput').valueAsDate = d;
        renderSchedule();
    }

    function setCurrentWeek() {
        let today = new Date();
        let sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('dateInput').valueAsDate = sun;
        renderAll();
    }

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
        renderAll();
    }

    function renderAll() {
        renderSchedule();
        renderAdminList();
        renderLeaveUI();
        document.getElementById('empCatSelect').innerHTML = categories.map(c => `<option>${c}</option>`).join('');
        document.getElementById('leaveEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
    }

    function renderSchedule() {
        const start = new Date(document.getElementById('dateInput').value);
        const isEven = Math.ceil(start.getDate() / 7) % 2 === 0;
        const rotating = employees.filter(e => e.inRotation);

        let html = '';
        employees.forEach(emp => {
            html += `<tr><td style="text-align:right; font-weight:bold;">${emp.name}</td><td>${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let s = calculateShift(emp, d, isEven, curr, rotating);
                html += `<td><span class="badge ${s}">${s}</span></td>`;
            }
            html += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = html;
    }

    function calculateShift(emp, day, isEven, currDate, rotating) {
        if(longLeaves.find(l => { 
            let s=new Date(l.start); let e=new Date(l.end); 
            currDate.setHours(0,0,0,0); s.setHours(0,0,0,0); e.setHours(0,0,0,0);
            return l.empId===emp.id && currDate>=s && currDate<=e; 
        })) return "إجازة";
        if(day === 5) return "أوف";
        if(emp.role === "FIXED") return (day <= 4) ? "ليلي" : "أوف";
        if(day === 6) {
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx === -1) return "أوف";
            return ((idx === 0 && !isEven) || (idx === 1 && isEven)) ? "صباحي" : "أوف";
        }
        if(day === 4) {
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx !== -1 && ((idx === 0 && !isEven) || (idx === 1 && isEven))) return "أوف";
        }
        return (emp.role === "MORNING") ? "صباحي" : "مسائي";
    }

    function addNewEmployee() {
        const name = document.getElementById('empName').value;
        if(!name) return;
        employees.push({ id: Date.now(), name, cat: document.getElementById('empCatSelect').value, role: document.getElementById('empRole').value, inRotation: document.getElementById('inRotation').checked });
        document.getElementById('empName').value = "";
        save(); renderAll();
    }

    function renderAdminList() {
        document.getElementById('adminListBody').innerHTML = employees.map(e => `
            <tr><td>${e.name}</td><td>${e.cat}</td><td>${e.role}</td><td>${e.inRotation?'✅':'🛑'}</td>
            <td><button onclick="deleteEmp(${e.id})" style="background:red; color:white; border:none; border-radius:5px; cursor:pointer;">حذف</button></td></tr>
        `).join('');
    }

    function deleteEmp(id) { employees = employees.filter(e => e.id !== id); save(); renderAll(); }

    function addLongLeave() {
        longLeaves.push({ id: Date.now(), empId: parseInt(document.getElementById('leaveEmpSelect').value), start: document.getElementById('leaveStart').value, end: document.getElementById('leaveEnd').value });
        save(); renderAll();
    }

    function renderLeaveUI() {
        document.getElementById('leaveListBody').innerHTML = longLeaves.map(l => {
            const emp = employees.find(e => e.id === l.empId);
            return `<tr><td>${emp?emp.name:'-'}</td><td>${l.start}</td><td>${l.end}</td><td><button onclick="deleteLeave(${l.id})">حذف</button></td></tr>`;
        }).join('');
    }

    function deleteLeave(id) { longLeaves = longLeaves.filter(l => l.id !== id); save(); renderAll(); }
    function logout() { if(confirm("هل تريد الخروج؟")) location.reload(); }
</script>
</body>
</html>
