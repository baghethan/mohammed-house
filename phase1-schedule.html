<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام جدولة الموظفين الذكي</title>
    <style>
        :root {
            --morning: #e3f2fd; --morning-text: #1976d2;
            --evening: #fff3e0; --evening-text: #f57c00;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #f1f1f1; --off-text: #9e9e9e;
            --friday: #e8f5e9; --friday-text: #2e7d32;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; padding: 30px; }
        .card { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .controls { background: #fafafa; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: center; border: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #555; }
        .badge { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; display: inline-block; }
        .morning { background: var(--morning); color: var(--morning-text); }
        .evening { background: var(--evening); color: var(--evening-text); }
        .night { background: var(--night); color: var(--night-text); }
        .off { background: var(--off); color: var(--off-text); }
        .weekend { background: var(--friday); color: var(--friday-text); }
        .name-col { font-weight: bold; text-align: right; width: 220px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>جدول الدوام السنوي (نظام 5 أيام عمل)</h2>
        <div class="controls">
            <label>تاريخ بداية الأسبوع (الأحد): </label>
            <input type="date" id="dateInput" onchange="updateTable()">
        </div>
    </div>

    <table id="schedule">
        <thead>
            <tr id="daysHeader">
                <th>الموظف</th>
                </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    
    <div style="margin-top: 20px; font-size: 0.9em; color: #666;">
        * ملاحظة: عبدالرحمن ثابت (ليل). حمد وزياد يتبادلان أدوار التغطية لضمان وجود مسؤول مكتب دائماً.
    </div>
</div>

<script>
    // تعيين التاريخ ليوم الأحد الحالي
    const today = new Date();
    const sunday = new Date(today.setDate(today.getDate() - today.getDay()));
    document.getElementById('dateInput').valueAsDate = sunday;

    const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        return Math.ceil((((d - new Date(Date.UTC(d.getUTCFullYear(), 0, 1))) / 86400000) + 1) / 7);
    }

    function updateTable() {
        const startDay = new Date(document.getElementById('dateInput').value);
        const weekNum = getWeekNumber(startDay);
        const isEven = weekNum % 2 === 0;

        // تحديث رؤوس الجدول
        let header = '<th>الموظف</th>';
        for(let i=0; i<7; i++) {
            let d = new Date(startDay);
            d.setDate(startDay.getDate() + i);
            header += `<th>${dayNames[i]}<br><small style="font-weight:normal">${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('daysHeader').innerHTML = header;

        // تحديد الأدوار (Rotation)
        // الدور A: إجازة خميس/جمعة، يعمل سبت
        // الدور B: إجازة أربعاء/خميس، يعمل جمعة/سبت
        // الأدوار C و D: إجازة جمعة/سبت
        
        let p1, p2, p3, p4;
        if(isEven) {
            p1 = { name: "Hamad Al-Khathran (مكتب)", role: "A" };
            p2 = { name: "Ziyad Althaqfiy (مكتب)", role: "B" };
            p3 = { name: "Essa Swaydi Alsalami", role: "C" };
            p4 = { name: "Saleh Aljuraydi", role: "D" };
        } else {
            p1 = { name: "Ziyad Althaqfiy (مكتب)", role: "A" };
            p2 = { name: "Hamad Al-Khathran (مكتب)", role: "B" };
            p3 = { name: "Saleh Aljuraydi", role: "C" };
            p4 = { name: "Essa Swaydi Alsalami", role: "D" };
        }

        const emps = [
            { name: "Abdulrahman Al-Sulaimani", role: "FIXED" },
            p1, p2, p3, p4
        ];

        let html = '';
        emps.forEach(emp => {
            html += `<tr><td class="name-col">${emp.name}</td>`;
            for(let d=0; d<7; d++) {
                html += `<td>${getBadge(emp, d)}</td>`;
            }
            html += `</tr>`;
        });
        document.getElementById('tableBody').innerHTML = html;
    }

    function getBadge(emp, day) {
        // عبدالرحمن: ليل ثابت أحد-خميس
        if(emp.role === "FIXED") {
            return (day >= 0 && day <= 4) ? '<span class="badge night">
