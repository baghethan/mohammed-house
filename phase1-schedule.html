<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almajdouie Motors - Schedule System v6</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning-bg: #e3f2fd; --morning-text: #1976d2;
            --night-bg: #f3e5f5; --night-text: #7b1fa2;
            --off-bg: #eeeeee; --off-text: #616161;
        }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background-image: url('image_dba186.png'); background-size: cover; background-attachment: fixed; }
        .toolbar { width: 100%; max-width: 1250px; background: var(--primary-blue); padding: 12px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin: 0 auto 20px auto; }
        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .glass-container { width: 100%; max-width: 1250px; background: rgba(255, 255, 255, 0.98); border-radius: 15px; padding: 25px; margin: auto; }
        .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .logo-img { max-height: 50px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: center; border: 1px solid #f0f0f0; }
        th { background: #fbfbfb; color: var(--primary-blue); }
        .badge { border-radius: 6px; padding: 5px; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 90px; }
        .Morning, .صباحي { background: var(--morning-bg); color: var(--morning-text); }
        .Night, .ليلي { background: var(--night-bg); color: var(--night-text); }
        .Off, .أوف { background: var(--off-bg); color: var(--off-text); }
    </style>
</head>
<body>

<div class="toolbar">
    <div style="display:flex; gap:10px">
        <button class="btn-tool" onclick="window.changeWeek(7)">Next Week</button>
        <button class="btn-tool" onclick="window.setCurrentWeek()">Current</button>
        <button class="btn-tool" onclick="window.changeWeek(-7)">Previous</button>
    </div>
    <button class="btn-tool" style="background:#ffc107" onclick="window.toggleLanguage()">AR / EN</button>
</div>

<div class="glass-container">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" class="logo-img">
            <div>
                <b id="compName">Almajdouie Motors</b>
                <div id="subTitle" style="font-size: 10px;">Schedule Management</div>
            </div>
        </div>
        <h2 id="mainTitle">Schedule Dashboard</h2>
    </div>

    <input type="date" id="datePicker" onchange="window.renderAll()" style="margin-bottom:15px">
    
    <table>
        <thead><tr id="headerDates"></tr></thead>
        <tbody id="scheduleBody"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let employees = [], currentLang = 'en';

    const trans = {
        en: { morning: "Morning", night: "Night", off: "Off" },
        ar: { morning: "صباحي", night: "ليلي", off: "أوف" }
    };

    // الربط مع المستند الموضح في الصورة
    onSnapshot(doc(db, "schedule", "jadwal_v6"), (docSnap) => {
        if (docSnap.exists()) {
            // الوصول إلى المصفوفة داخل data.emps
            employees = docSnap.data().data.emps || [];
            window.renderAll();
        }
    });

    window.renderAll = () => {
        const t = trans[currentLang];
        const start = new Date(document.getElementById('datePicker').value);
        
        // حساب الموظف المناوب لهذا الأسبوع
        const firstDay = new Date(start.getFullYear(), 0, 1);
        const weekNum = Math.ceil((((start - firstDay) / 86400000) + firstDay.getDay() + 1) / 7);
        const rotatingStaff = employees.filter(e => e.rotates && e.active);

        // العناوين
        let h = `<th>${currentLang === 'en' ? 'Employee' : 'الموظف'}</th>`;
        const dayNames = currentLang === 'en' ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        // محتوى الجدول
        document.getElementById('scheduleBody').innerHTML = employees.filter(e => e.active).map(emp => {
            let row = `<tr><td style="text-align:left"><b>${emp.name}</b><br><small>${emp.jobTitle}</small></td>`;
            
            let isRotatingThisWeek = false;
            if (emp.rotates && rotatingStaff.length > 0) {
                if (rotatingStaff[weekNum % rotatingStaff.length].id === emp.id) isRotatingThisWeek = true;
            }

            for(let d=0; d<7; d++) {
                let shift = "";
                // تطبيق المنطق المطلوب:
                if (d === 5) shift = t.off; // الجمعة أوف دائماً
                else if (d === 6) shift = isRotatingThisWeek ? (emp.fixed ? t.night : t.morning) : t.off; // السبت: دوام للمناوب فقط
                else if (d === 4) shift = isRotatingThisWeek ? t.off : (emp.fixed ? t.night : t.morning); // الخميس: أوف للمناوب فقط
                else shift = emp.fixed ? t.night : t.morning; // الأحد-الأربعاء: دوام

                let icon = shift === t.morning ? '☀️' : (shift === t.night ? '🌙' : '');
                row += `<td><span class="badge ${shift}">${icon} ${shift}</span></td>`;
            }
            return row + "</tr>";
        }).join('');
    };

    window.toggleLanguage = () => {
        currentLang = currentLang === 'en' ? 'ar' : 'en';
        document.getElementById('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        window.renderAll();
    };

    window.setCurrentWeek = () => {
        let t = new Date(); let s = new Date(t.setDate(t.getDate() - t.getDay()));
        document.getElementById('datePicker').valueAsDate = s;
        window.renderAll();
    };

    window.changeWeek = (v) => {
        let d = new Date(document.getElementById('datePicker').value);
        d.setDate(d.getDate() + v);
        document.getElementById('datePicker').valueAsDate = d;
        window.renderAll();
    };

    document.getElementById('datePicker').valueAsDate = new Date();
    window.setCurrentWeek();
</script>
</body>
</html>
