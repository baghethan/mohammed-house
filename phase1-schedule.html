<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام جدولة الموظفين - المجدوعي للسيارات</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning: #e3f2fd; --morning-text: #1976d2;
            --evening: #fff3e0; --evening-text: #e65100;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #eeeeee; --off-text: #616161;
            --leave: #ffebee; --leave-text: #c62828;
        }

        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-image: url('image_dba186.png'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }

        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.1); z-index: -1; }

        .toolbar {
            width: 100%; max-width: 1250px; background: var(--primary-blue);
            padding: 12px 20px; border-radius: 12px;
            display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px;
        }

        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }

        .glass-container {
            width: 100%; max-width: 1250px; background: rgba(255, 255, 255, 0.98);
            border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .logo-img { max-height: 55px; }

        .tabs { display: flex; justify-content: flex-end; gap: 25px; margin-bottom: 20px; }
        .tab { cursor: pointer; font-weight: bold; color: #555; display: flex; align-items: center; gap: 5px; padding-bottom: 5px; transition: 0.2s; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--primary-blue); border-bottom-color: var(--primary-blue); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px 8px; text-align: center; border: 1px solid #f0f0f0; }
        th { background: #fbfbfb; color: var(--primary-blue); font-weight: 800; }

        .badge { border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; min-width: 75px; justify-content: center; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }

        .form-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; align-items: flex-end; border: 1px solid #eee; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #666; }

        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .btn-save { background: var(--primary-blue); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #ffc107; color: #000; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-del { background: #ff5252; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

        @media print { .toolbar, .tabs, .form-box, .btn-edit, .btn-del { display: none; } .glass-container { box-shadow: none; border: none; width: 100%; } }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="toolbar">
    <button class="btn-tool" onclick="window.print()">طباعة PDF</button>
    <button class="btn-tool" onclick="window.changeWeek(7)">الأسبوع التالي</button>
    <button class="btn-tool" onclick="window.setCurrentWeek()">الأسبوع الحالي</button>
    <button class="btn-tool" onclick="window.changeWeek(-7)">الأسبوع السابق</button>
</div>

<div class="glass-container">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" alt="Logo" class="logo-img">
            <div style="text-align: right; border-right: 2px solid #ddd; padding-right: 15px;">
                <div style="font-weight: 900; font-size: 18px; color: var(--primary-blue);">شركة المجدوعي للسيارات</div>
                <div style="font-size: 10px; color: #555;">Almajdouie Motors Company</div>
            </div>
        </div>
        <div style="font-weight: 900; font-size: 20px;">نظام إدارة الجدولة</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="window.switchTab('schedule', this)">🗓️ الجدول</div>
        <div class="tab" onclick="window.switchTab('admin', this)">👥 إدارة الموظفين</div>
        <div class="tab" onclick="window.switchTab('vacations', this)">🏖️ الإجازات</div>
    </div>

    <div id="schedule" class="tab-content active">
        <input type="date" id="datePicker" onchange="window.renderAll()" style="margin-bottom: 15px;">
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <div class="form-box">
            <input type="hidden" id="editEmpId">
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" id="newEmpName">
            </div>
            <div class="form-group">
                <label>الفئة:</label>
                <select id="newEmpCat">
                    <option>موظف</option><option>مشرف</option><option>مدير</option><option>تمهير</option>
                </select>
            </div>
            <div class="form-group">
                <label>نظام الشفت:</label>
                <select id="newEmpRole">
                    <option value="MORNING">☀️ صباحي</option>
                    <option value="FIXED">🌙 ليلي ثابت</option>
                </select>
            </div>
            <div class="form-group">
                <label>الحالة:</label>
                <select id="newEmpStatus">
                    <option value="active">✅ نشط</option>
                    <option value="inactive">🛑 إيقاف</option>
                </select>
            </div>
            <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
                <input type="checkbox" id="newEmpRotate" style="width: 18px; height: 18px;">
                <label style="font-size: 13px;">تفعيل التناوب 🔄</label>
            </div>
            <button id="btnSubmit" class="btn-save" onclick="window.handleEmployeeSubmit()">حفظ البيانات</button>
        </div>
        <table>
            <thead><tr><th>الاسم</th><th>النظام</th><th>الحالة</th><th>إجراءات</th></tr></thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>

    <div id="vacations" class="tab-content">
        <div class="form-box">
            <select id="vacationEmpSelect"></select>
            <input type="date" id="vacationStart">
            <input type="date" id="vacationEnd">
            <button class="btn-save" style="background:#f57c00" onclick="window.addVacation()">تسجيل إجازة</button>
        </div>
        <table>
            <thead><tr><th>الموظف</th><th>من</th><th>إلى</th><th>إجراء</th></tr></thead>
            <tbody id="vacationList"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let employees = [];
    let vacations = [];

    // --- ربط الدوال بـ Window فوراً لضمان عدم ظهور خطأ "Not a function" ---
    
    window.switchTab = (id, btn) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    };

    window.renderAll = () => {
        renderSchedule();
        renderAdmin();
        renderVacationList();
    };

    window.handleEmployeeSubmit = async () => {
        const id = document.getElementById('editEmpId').value;
        const data = {
            name: document.getElementById('newEmpName').value,
            cat: document.getElementById('newEmpCat').value,
            role: document.getElementById('newEmpRole').value,
            status: document.getElementById('newEmpStatus').value,
            rotate: document.getElementById('newEmpRotate').checked
        };
        if(!data.name) return;
        if(id) await updateDoc(doc(db, "employees", id), data);
        else await addDoc(collection(db, "employees"), data);
        
        document.getElementById('editEmpId').value = "";
        document.getElementById('newEmpName').value = "";
        document.getElementById('newEmpRotate').checked = false;
        document.getElementById('btnSubmit').innerText = "حفظ البيانات";
    };

    window.startEdit = (id) => {
        const emp = employees.find(e => e.id === id);
        document.getElementById('editEmpId').value = emp.id;
        document.getElementById('newEmpName').value = emp.name;
        document.getElementById('newEmpCat').value = emp.cat;
        document.getElementById('newEmpRole').value = emp.role;
        document.getElementById('newEmpStatus').value = emp.status || 'active';
        document.getElementById('newEmpRotate').checked = emp.rotate || false;
        document.getElementById('btnSubmit').innerText = "تحديث البيانات";
    };

    window.deleteEmployee = async (id) => {
        if(confirm("حذف الموظف نهائياً؟")) await deleteDoc(doc(db, "employees", id));
    };

    window.addVacation = async () => {
        const empId = document.getElementById('vacationEmpSelect').value;
        const s = document.getElementById('vacationStart').value;
        const e = document.getElementById('vacationEnd').value;
        if(s && e) await addDoc(collection(db, "vacations"), { empId, s, e });
    };

    window.deleteVacation = async (id) => {
        await deleteDoc(doc(db, "vacations", id));
    };

    window.setCurrentWeek = () => {
        let today = new Date();
        let sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('datePicker').valueAsDate = sun;
        window.renderAll();
    };

    window.changeWeek = (days) => {
        let d = new Date(document.getElementById('datePicker').value);
        d.setDate(d.getDate() + days);
        document.getElementById('datePicker').valueAsDate = d;
        window.renderAll();
    };

    // --- المنطق الداخلي للجدول ---

    function renderSchedule() {
        const start = new Date(document.getElementById('datePicker').value);
        const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        const weekNum = Math.ceil(start.getDate() / 7);

        let h = '<th>الموظف</th><th>الفئة</th>';
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        let b = '';
        employees.filter(e => e.status !== 'inactive').forEach(emp => {
            b += `<tr><td style="font-weight:bold;">${emp.name}</td><td>${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let shift = getShift(emp, d, curr, weekNum);
                let icon = shift === 'صباحي' ? '☀️' : (shift === 'ليلي' ? '🌙' : (shift === 'مسائي' ? '🌆' : ''));
                b += `<td><span class="badge ${shift}">${icon} ${shift}</span></td>`;
            }
            b += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = b;
    }

    function getShift(emp, day, curr, weekNum) {
        const isVac = vacations.find(v => {
            let s = new Date(v.s); let e = new Date(v.e);
            curr.setHours(0,0,0,0);
            return v.empId === emp.id && curr >= s && curr <= e;
        });
        if(isVac) return "إجازة";
        if(day >= 4) return "أوف"; // خميس، جمعة، سبت
        if(emp.role === "FIXED") return "ليلي";
        if(emp.rotate) return (weekNum % 2 === 0) ? "صباحي" : "مسائي";
        return "صباحي";
    }

    function renderAdmin() {
        document.getElementById('adminList').innerHTML = employees.map(e => `
            <tr style="${e.status === 'inactive' ? 'opacity:0.5' : ''}">
                <td style="text-align:right; font-weight:bold; padding-right:20px;">${e.name}</td>
                <td><span class="badge ${e.role==='FIXED'?'ليلي':'صباحي'}">${e.role==='FIXED'?'🌙 ليلي':'☀️ صباحي'} ${e.rotate?'🔄':''}</span></td>
                <td>${e.status === 'inactive' ? '🛑 موقف' : '✅ نشط'}</td>
                <td>
                    <button class="btn-edit" onclick="window.startEdit('${e.id}')">تعديل</button>
                    <button class="btn-del" onclick="window.deleteEmployee('${e.id}')">حذف</button>
                </td>
            </tr>
        `).join('');
    }

    function renderVacationList() {
        document.getElementById('vacationEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        document.getElementById('vacationList').innerHTML = vacations.map(v => {
            const emp = employees.find(e => e.id === v.empId);
            return `<tr><td>${emp?emp.name:'-'}</td><td>${v.s}</td><td>${v.e}</td><td><button class="btn-del" onclick="window.deleteVacation('${v.id}')">حذف</button></td></tr>`;
        }).join('');
    }

    // الاستماع لقاعدة البيانات
    onSnapshot(collection(db, "employees"), (snap) => {
        employees = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        window.renderAll();
    });
    onSnapshot(collection(db, "vacations"), (snap) => {
        vacations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        window.renderAll();
    });

    document.getElementById('datePicker').valueAsDate = new Date();
    window.setCurrentWeek();
</script>
</body>
</html>
