<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almajdouie Schedule - Fixed v6</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning-bg: #e3f2fd; --morning-text: #1976d2;
            --night-bg: #f3e5f5; --night-text: #7b1fa2;
            --off-bg: #eeeeee; --off-text: #616161;
            --btn-edit: #1a3a5f; --btn-night: #512da8; --btn-stop: #e65100; --btn-del: #b71c1c; --btn-rotate: #00796b;
        }

        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;
            background-image: url('image_dba186.png'); background-size: cover; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }

        .toolbar {
            width: 100%; max-width: 1250px; background: var(--primary-blue);
            padding: 12px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }

        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-lang { background: #ffc107; color: #000; }

        .glass-container { width: 100%; max-width: 1250px; background: rgba(255, 255, 255, 0.98); border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px; }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .logo-img { max-height: 55px; }

        .tabs { display: flex; gap: 25px; margin-bottom: 20px; }
        .tab { cursor: pointer; font-weight: bold; color: #555; padding-bottom: 5px; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab.active { color: var(--primary-blue); border-bottom-color: var(--primary-blue); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 12px 8px; text-align: center; border: 1px solid #f0f0f0; }
        th { background: #fbfbfb; color: var(--primary-blue); font-weight: 800; }

        .badge { border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; min-width: 90px; justify-content: center; }
        .Morning, .صباحي { background: var(--morning-bg); color: var(--morning-text); }
        .Night, .ليلي { background: var(--night-bg); color: var(--night-text); }
        .Off, .أوف { background: var(--off-bg); color: var(--off-text); }

        .btn-action { border: none; border-radius: 6px; padding: 6px 12px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; min-width: 105px; justify-content: center; }
        .row-edit { background: var(--btn-edit); } .row-night { background: var(--btn-night); } .row-stop { background: var(--btn-stop); } .row-del { background: var(--btn-del); } .row-rotate { background: var(--btn-rotate); }

        .form-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }

        [dir="rtl"] .toolbar { flex-direction: row-reverse; }
    </style>
</head>
<body>

<div class="toolbar">
    <div style="display:flex; gap:10px">
        <button class="btn-tool" onclick="window.changeWeek(7)">Next Week</button>
        <button class="btn-tool" onclick="window.setCurrentWeek()">Current Week</button>
        <button class="btn-tool" onclick="window.changeWeek(-7)">Previous Week</button>
    </div>
    <div style="display:flex; gap:10px">
        <button class="btn-tool btn-lang" onclick="window.toggleLanguage()">AR / EN</button>
        <button class="btn-tool" onclick="window.print()">Print PDF</button>
    </div>
</div>

<div class="glass-container">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" class="logo-img">
            <div>
                <div id="companyName" style="font-weight: 900; font-size: 18px; color: var(--primary-blue);">Almajdouie Motors Company</div>
                <div id="systemSub" style="font-size: 10px; color: #555;">Scheduling Management System</div>
            </div>
        </div>
        <div id="mainTitle" style="font-weight: 900; font-size: 22px;">Schedule Dashboard</div>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab1" onclick="window.switchTab('schedule', this)">🗓️ Schedule</div>
        <div class="tab" id="tab2" onclick="window.switchTab('admin', this)">👥 Employee Management</div>
        <div class="tab" id="tab3" onclick="window.switchTab('vacations', this)">🏖️ Vacations</div>
    </div>

    <div id="schedule" class="tab-content active">
        <input type="date" id="datePicker" onchange="window.renderAll()" style="margin-bottom:15px">
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <div class="form-box">
            <input type="hidden" id="editEmpId">
            <input type="text" id="newEmpName" placeholder="Employee Name">
            <button id="btnSubmit" class="btn-tool" style="background:var(--primary-blue); color:white" onclick="window.handleEmployeeSubmit()">Add/Update</button>
        </div>
        <table>
            <thead><tr><th>Name</th><th>Status & Actions</th></tr></thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>

    <div id="vacations" class="tab-content">
        <div class="form-box">
            <select id="vacationEmpSelect"></select>
            <input type="date" id="vacationStart">
            <input type="date" id="vacationEnd">
            <button class="btn-tool" style="background:#f57c00; color:white" onclick="window.addVacation()">Add Vacation</button>
        </div>
        <table>
            <thead><tr><th>Employee</th><th>From</th><th>To</th><th>Del</th></tr></thead>
            <tbody id="vacationList"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let employees = [], vacations = [], currentLang = 'en';

    const tMap = {
        en: { morning: "Morning", night: "Night", off: "Off", vac: "Vacation", edit: "Edit ✏️", setNight: "Set Night 🌙", setMorning: "Set Morning ☀️", stop: "Stop ⏸️", enable: "Enable ✅", rotOn: "Rotation 🔄", rotOff: "Fixed 📍", del: "Delete ❌" },
        ar: { morning: "صباحي", night: "ليلي", off: "أوف", vac: "إجازة", edit: "تعديل ✏️", setNight: "تثبيت ليل 🌙", setMorning: "تحويل صباحي ☀️", stop: "إيقاف ⏸️", enable: "تفعيل ✅", rotOn: "تناوب 🔄", rotOff: "ثابت 📍", del: "حذف ❌" }
    };

    // --- Critical: Bind functions to window ---
    window.switchTab = (id, btn) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    };

    window.toggleLanguage = () => {
        currentLang = currentLang === 'en' ? 'ar' : 'en';
        document.getElementById('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        updateUI(); window.renderAll();
    };

    function updateUI() {
        const tr = currentLang === 'ar' ? translations.ar : translations.en; // Simple toggle for headers
        document.getElementById('companyName').innerText = currentLang === 'ar' ? "شركة المجدوعي للسيارات" : "Almajdouie Motors Company";
        document.getElementById('mainTitle').innerText = currentLang === 'ar' ? "لوحة تحكم الجدول" : "Schedule Dashboard";
    }

    window.renderAll = () => {
        const t = tMap[currentLang];
        const dateVal = document.getElementById('datePicker').value;
        const start = new Date(dateVal);
        const dayNames = currentLang === 'en' ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        
        // Rotation Calculation
        const firstDayOfYear = new Date(start.getFullYear(), 0, 1);
        const pastDays = (start - firstDayOfYear) / 86400000;
        const weekNum = Math.ceil((pastDays + firstDayOfYear.getDay() + 1) / 7);
        const rotatingStaff = employees.filter(e => e.rotates && e.active);

        // Header
        let h = `<th>${currentLang === 'en' ? 'Employee' : 'الموظف'}</th>`;
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        // Schedule Body
        document.getElementById('scheduleBody').innerHTML = employees.filter(e => e.active).map(emp => {
            let row = `<tr><td style="text-align:left; padding-left:15px"><b>${emp.name}</b></td>`;
            
            // Logic for Saturday Rotation
            let isRotatingThisWeek = false;
            if (emp.rotates && rotatingStaff.length > 0) {
                if (rotatingStaff[weekNum % rotatingStaff.length].id === emp.id) isRotatingThisWeek = true;
            }

            for(let d=0; d<7; d++) {
                let shift = "";
                let currDate = new Date(start); currDate.setDate(start.getDate() + d);
                const onVac = vacations.find(v => {
                    let s = new Date(v.s); let e = new Date(v.e);
                    currDate.setHours(0,0,0,0); return v.empId === emp.id && currDate >= s && currDate <= e;
                });

                if (onVac) shift = t.vac;
                else if (d === 5) shift = t.off; // Friday always Off
                else if (d === 6) shift = isRotatingThisWeek ? (emp.fixed ? t.night : t.morning) : t.off; // Saturday Work for rotation only
                else if (d === 4) shift = isRotatingThisWeek ? t.off : (emp.fixed ? t.night : t.morning); // Thursday Off for rotation only
                else shift = emp.fixed ? t.night : t.morning; // Sun-Wed always Work

                let icon = (shift === t.morning) ? '☀️' : (shift === t.night ? '🌙' : '');
                row += `<td><span class="badge ${shift}">${icon} ${shift}</span></td>`;
            }
            return row + "</tr>";
        }).join('');

        // Admin Table
        document.getElementById('adminList').innerHTML = employees.map((e, idx) => `
            <tr>
                <td style="text-align:left; padding-left:15px; font-weight:bold">${e.name}</td>
                <td style="display:flex; justify-content:center; gap:5px">
                    <button class="btn-action row-edit" onclick="window.startEdit('${idx}')">${t.edit}</button>
                    <button class="btn-action ${e.fixed?'row-morning':'row-night'}" onclick="window.toggleAction('${idx}', 'fixed')">${e.fixed?t.setMorning:t.setNight}</button>
                    <button class="btn-action row-rotate" style="background:${e.rotates?'#00796b':'#78909c'}" onclick="window.toggleAction('${idx}', 'rotates')">${e.rotates?t.rotOn:t.rotOff}</button>
                    <button class="btn-action ${!e.active?'row-enable':'row-stop'}" onclick="window.toggleAction('${idx}', 'active')">${!e.active?t.enable:t.stop}</button>
                    <button class="btn-action row-del" onclick="window.deleteEmployee('${idx}')">${t.del}</button>
                </td>
            </tr>
        `).join('');

        // Vacations Logic
        document.getElementById('vacationEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        document.getElementById('vacationList').innerHTML = vacations.map(v => {
            const emp = employees.find(e => e.id === v.empId);
            return `<tr><td>${emp?emp.name:'-'}</td><td>${v.s}</td><td>${v.e}</td><td><button class="btn-tool" style="background:#ff4444; color:white" onclick="window.deleteVacation('${v.id}')">X</button></td></tr>`;
        }).join('');
    };

    // Firebase Core Functions
    onSnapshot(doc(db, "schedule", "jadwal_v6"), (snap) => { if(snap.exists()){ employees = snap.data().data.emps; window.renderAll(); } });
    onSnapshot(collection(db, "vacations"), (snap) => { vacations = snap.docs.map(d => ({id: d.id, ...d.data()})); window.renderAll(); });

    async function updateDB(arr) { await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": arr }); }

    window.toggleAction = async (idx, field) => { let arr = [...employees]; arr[idx][field] = !arr[idx][field]; await updateDB(arr); };
    window.startEdit = (idx) => { document.getElementById('editEmpId').value = idx; document.getElementById('newEmpName').value = employees[idx].name; window.switchTab('admin', document.getElementById('tab2')); };
    window.handleEmployeeSubmit = async () => {
        const idx = document.getElementById('editEmpId').value; const name = document.getElementById('newEmpName').value; if(!name) return;
        let arr = [...employees];
        if(idx !== "") arr[idx].name = name;
        else arr.push({ id: Date.now().toString(), name, active: true, fixed: false, rotates: false });
        await updateDB(arr); document.getElementById('editEmpId').value = ""; document.getElementById('newEmpName').value = "";
    };
    window.deleteEmployee = async (idx) => { if(confirm("Del?")){ let arr = [...employees]; arr.splice(idx,1); await updateDB(arr); } };
    window.addVacation = async () => { 
        const empId = document.getElementById('vacationEmpSelect').value; const s = document.getElementById('vacationStart').value; const e = document.getElementById('vacationEnd').value;
        if(s && e) await addDoc(collection(db, "vacations"), { empId, s, e });
    };
    window.deleteVacation = async (id) => { await deleteDoc(doc(db, "vacations", id)); };
    window.setCurrentWeek = () => { let t = new Date(); let s = new Date(t.setDate(t.getDate() - t.getDay())); document.getElementById('datePicker').valueAsDate = s; window.renderAll(); };
    window.changeWeek = (v) => { let d = new Date(document.getElementById('datePicker').value); d.setDate(d.getDate() + v); document.getElementById('datePicker').valueAsDate = d; window.renderAll(); };

    document.getElementById('datePicker').valueAsDate = new Date();
    window.setCurrentWeek();
</script>
</body>
</html>
