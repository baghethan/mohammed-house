<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة الدوام المتكامل - النسخة الاحترافية</title>
    <style>
        :root {
            --primary: #4a90e2; --bg: #f1f4f9;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #e9ecef; --off-text: #6c757d;
            --leave: #f8d7da; --leave-text: #721c24;
            --cover: #d4edda; --cover-text: #155724;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1350px; margin: auto; }
        
        /* Tabs Navigation */
        .tabs { display: flex; gap: 5px; margin-bottom: -1px; }
        .tab { padding: 12px 25px; background: #e0e0e0; border-radius: 12px 12px 0 0; cursor: pointer; font-weight: bold; color: #666; border: 1px solid #ccc; border-bottom: none; }
        .tab.active { background: white; color: var(--primary); border-top: 4px solid var(--primary); }
        
        .content-card { background: white; padding: 30px; border-radius: 0 15px 15px 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 500px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #f0f0f0; padding: 12px; text-align: center; }
        th { background: #fafafa; color: #444; font-size: 14px; }
        .emp-name { font-weight: bold; text-align: right; color: #333; }
        
        .badge { border-radius: 10px; padding: 4px 12px; font-size: 12px; font-weight: bold; display: inline-block; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }
        .تغطية { background: var(--cover); color: var(--cover-text); }

        /* Admin Forms */
        .form-box { background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; font-weight: bold; color: #555; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        .btn-delete { background: #ff4d4d; color: white; padding: 5px 12px; font-size: 11px; }

        /* Summary Section */
        .summary-grid { display: flex; gap: 15px; margin-top: 30px; }
        .sum-card { flex: 1; background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .sum-card h3 { margin: 0; font-size: 28px; color: var(--primary); }
        .sum-card p { margin: 5px 0 0; color: #777; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="showTab('schedule-tab', this)">📅 جدول الدوام</div>
        <div class="tab" onclick="showTab('admin-tab', this)">👥 إدارة الموظفين</div>
        <div class="tab" onclick="showTab('leave-tab', this)">🏖️ الإجازات الطويلة</div>
    </div>

    <div class="content-card">
        
        <div id="schedule-tab" class="tab-content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin:0; color:#333;">الجدول الأسبوعي الذكي</h2>
                <div class="form-group">
                    <label>تاريخ بداية الأسبوع (الأحد):</label>
                    <input type="date" id="dateInput" onchange="renderSchedule()">
                </div>
            </div>
            <table>
                <thead>
                    <tr id="headerRow">
                        <th>الموظف</th>
                        <th>الفئة</th>
                        </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>
            <div class="summary-grid" id="summaryArea"></div>
        </div>

        <div id="admin-tab" class="tab-content">
            <h2 style="color:#333;">إضافة موظف جديد</h2>
            <div class="form-box">
                <div class="grid-inputs">
                    <div class="form-group">
                        <label>الاسم بالكامل</label>
                        <input type="text" id="empName" placeholder="مثال: صالح Sabri">
                    </div>
                    <div class="form-group">
                        <label>الفئة</label>
                        <select id="empCat">
                            <option>موظف</option><option>مشرف</option><option>مدير</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>نظام الدوام الأساسي</label>
                        <select id="empRole">
                            <option value="MORNING">صباحي (07:30 - 05:00)</option>
                            <option value="EVENING">مسائي (01:00 - 10:30)</option>
                            <option value="FIXED">ليلي (عبدالرحمن)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex-direction: row; align-items: center; gap: 10px; margin-bottom: 10px;">
                        <input type="checkbox" id="inRotation" checked>
                        <label for="inRotation">دخول في تغيير الدوام (الويكيند)</label>
                    </div>
                    <button class="btn btn-add" onclick="addNewEmployee()">+ إضافة الموظف</button>
                </div>
            </div>
            <h3>قائمة الموظفين المسجلين</h3>
            <table id="adminListTable">
                <thead>
                    <tr><th>الاسم</th><th>الفئة</th><th>النظام</th><th>حالة التدوير</th><th>إجراءات</th></tr>
                </thead>
                <tbody id="adminListBody"></tbody>
            </table>
        </div>

        <div id="leave-tab" class="tab-content">
            <h2 style="color:#333;">تسجيل إجازة طويلة</h2>
            <div class="form-box">
                <div class="grid-inputs">
                    <div class="form-group">
                        <label>اختر الموظف</label>
                        <select id="leaveEmpSelect"></select>
                    </div>
                    <div class="form-group">
                        <label>من تاريخ</label>
                        <input type="date" id="leaveStart">
                    </div>
                    <div class="form-group">
                        <label>إلى تاريخ</label>
                        <input type="date" id="leaveEnd">
                    </div>
                    <button class="btn btn-add" style="background:#f57c00;" onclick="addLongLeave()">تسجيل الإجازة</button>
                </div>
            </div>
            <h3>سجل الإجازات المحفوظة</h3>
            <table>
                <thead>
                    <tr><th>الموظف</th><th>تاريخ البدء</th><th>تاريخ الانتهاء</th><th>إجراءات</th></tr>
                </thead>
                <tbody id="leaveListBody"></tbody>
            </table>
        </div>

    </div>
</div>

<script>
    // تهيئة البيانات (من الذاكرة المحلية إن وجدت)
    let employees = JSON.parse(localStorage.getItem('employees')) || [
        { id: 1, name: "Abdulrahman Ghulam Al-Sulaimani", cat: "مدير", role: "FIXED", inRotation: false },
        { id: 2, name: "Hamad Rashid Al-Khathran", cat: "مشرف", role: "MORNING", inRotation: true },
        { id: 3, name: "Ziyad Fawaz Althaqfiy", cat: "مشرف", role: "EVENING", inRotation: true }
    ];

    let longLeaves = JSON.parse(localStorage.getItem('longLeaves')) || [];

    const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    window.onload = () => {
        const today = new Date();
        const sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('dateInput').valueAsDate = sun;
        renderAll();
    };

    function saveToStorage() {
        localStorage.setItem('employees', JSON.stringify(employees));
        localStorage.setItem('longLeaves', JSON.stringify(longLeaves));
    }

    function showTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        renderAll();
    }

    function addNewEmployee() {
        const name = document.getElementById('empName').value;
        const cat = document.getElementById('empCat').value;
        const role = document.getElementById('empRole').value;
        const inRotation = document.getElementById('inRotation').checked;

        if(!name) return alert("يرجى كتابة الاسم");
        employees.push({ id: Date.now(), name, cat, role, inRotation });
        saveToStorage();
        document.getElementById('empName').value = "";
        renderAll();
    }

    function addLongLeave() {
        const empId = document.getElementById('leaveEmpSelect').value;
        const start = document.getElementById('leaveStart').value;
        const end = document.getElementById('leaveEnd').value;

        if(!empId || !start || !end) return alert("أكمل بيانات الإجازة");
        longLeaves.push({ id: Date.now(), empId: parseInt(empId), start, end });
        saveToStorage();
        renderAll();
    }

    function deleteEmp(id) {
        if(confirm("هل تريد حذف الموظف نهائياً؟")) {
            employees = employees.filter(e => e.id !== id);
            saveToStorage();
            renderAll();
        }
    }

    function deleteLeave(id) {
        longLeaves = longLeaves.filter(l => l.id !== id);
        saveToStorage();
        renderAll();
    }

    function renderAll() {
        renderSchedule();
        renderAdminList();
        renderLeaveList();
        updateLeaveDropdown();
    }

    function updateLeaveDropdown() {
        const select = document.getElementById('leaveEmpSelect');
        select.innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
    }

    function renderAdminList() {
        document.getElementById('adminListBody').innerHTML = employees.map(e => `
            <tr>
                <td class="emp-name">${e.name}</td>
                <td>${e.cat}</td>
                <td>${e.role}</td>
                <td>${e.inRotation ? '✅ يدخل في التغيير' : '🛑 ثابت (أحد-خميس)'}</td>
                <td><button class="btn btn-delete" onclick="deleteEmp(${e.id})">حذف</button></td>
            </tr>
        `).join('');
    }

    function renderLeaveList() {
        document.getElementById('leaveListBody').innerHTML = longLeaves.map(l => {
            const emp = employees.find(e => e.id === l.empId);
            return `<tr>
                <td>${emp ? emp.name : 'موظف محذوف'}</td>
                <td>${l.start}</td>
                <td>${l.end}</td>
                <td><button class="btn btn-delete" onclick="deleteLeave(${l.id})">إلغاء الإجازة</button></td>
            </tr>`;
        }).join('');
    }

    function renderSchedule() {
        const start = new Date(document.getElementById('dateInput').value);
        const weekNum = Math.ceil(start.getDate() / 7);
        const isEven = weekNum % 2 === 0;

        // تحديث الهيدر
        let hHtml = '<th>الموظف</th><th>الفئة</th>';
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            hHtml += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerRow').innerHTML = hHtml;

        // توليد الجدول
        let bHtml = '';
        let counts = { صباحي:0, مسائي:0, ليلي:0, إجازات:0 };

        employees.forEach(emp => {
            bHtml += `<tr><td class="emp-name">${emp.name}</td><td style="color:#888; font-size:12px;">${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let currDate = new Date(start);
                currDate.setDate(start.getDate() + d);
                
                let shift = calculateShift(emp, d, isEven, currDate);
                bHtml += `<td><span class="badge ${shift}">${shift === 'تغطية' ? 'جمعة' : shift}</span></td>`;
                
                if(shift === "صباحي" || shift === "تغطية") counts.صباحي++;
                else if(shift === "مسائي") counts.مسائي++;
                else if(shift === "ليلي") counts.ليلي++;
                else if(shift === "إجازة") counts.إجازات++;
            }
            bHtml += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = bHtml;

        document.getElementById('summaryArea').innerHTML = `
            <div class="sum-card"><h3>${counts.صباحي}</h3><p>الصباحي</p></div>
            <div class="sum-card"><h3>${counts.مسائي}</h3><p>المسائي</p></div>
            <div class="sum-card"><h3>${counts.ليلي}</h3><p>الليلي</p></div>
            <div class="sum-card"><h3>${counts.إجازات}</h3><p>الإجازات</p></div>
        `;
    }

    function calculateShift(emp, day, isEven, currDate) {
        // 1. التحقق من الإجازة الطويلة أولاً
        const isOnLeave = longLeaves.find(l => {
            const s = new Date(l.start); const e = new Date(l.end);
            currDate.setHours(0,0,0,0); s.setHours(0,0,0,0); e.setHours(0,0,0,0);
            return l.empId === emp.id && currDate >= s && currDate <= e;
        });
        if(isOnLeave) return "إجازة";

        // 2. عبدالرحمن أو النظام الليلي الثابت
        if(emp.role === "FIXED") return (day <= 4) ? "ليلي" : "أوف";

        // 3. الموظف الذي لا يدخل في التدوير (يبقى ثابت أحد-خميس)
        if(!emp.inRotation) {
            if(day >= 5) return "أوف";
            return (emp.role === "MORNING") ? "صباحي" : "مسائي";
        }

        // 4. نظام المشرفين والتدوير للويكيند (حمد وزياد ومن في حكمهم)
        // إذا كان الموظف في مجموعة التدوير:
        const rotatingStaff = employees.filter(e => e.inRotation && e.role !== "FIXED");
        const idx = rotatingStaff.findIndex(s => s.id === emp.id);
        
        // منطق التبادل بين أول اثنين في التدوير للجمعة والسبت
        if(idx === 0 || idx === 1) {
            const myTurn = (idx === 0) ? (isEven ? "A" : "B") : (isEven ? "B" : "A");
            if(myTurn === "A") { // أوف خميس وجمعة، يداوم سبت
                if(day === 4 || day === 5) return "أوف";
                return "صباحي";
            } else { // أوف أربعاء وخميس، يداوم جمعة وسبت
                if(day === 3 || day === 4) return "أوف";
                if(day === 5) return "تغطية";
                return (day === 6) ? "صباحي" : "مسائي";
            }
        }

        // بقية الموظفين في التدوير
        if(day >= 5) return "أوف";
        return (emp.role === "MORNING") ? "صباحي" : "مسائي";
    }
</script>

</body>
</html>
