<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة الدوام - النسخة الاحترافية V7</title>
    <style>
        :root {
            --primary-dark: #1a237e;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #e9ecef; --off-text: #6c757d;
            --leave: #f8d7da; --leave-text: #721c24;
            --logout-bg: #ffebee; --logout-text: #c62828;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f4f9; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }

        /* شريط الأدوات الجديد المطابق للصورة */
        .toolbar { 
            background: #0d2149; 
            padding: 15px 25px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: flex-end; 
            gap: 10px; 
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-tool {
            background: white;
            color: #0d2149;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-tool:hover { background: #e3f2fd; }
        .btn-logout {
            background: var(--logout-bg);
            color: var(--logout-text);
        }
        .btn-logout:hover { background: #ffcdd2; }

        /* التبويبات */
        .tabs { display: flex; gap: 5px; margin-bottom: -1px; }
        .tab { padding: 12px 25px; background: #e0e0e0; border-radius: 12px 12px 0 0; cursor: pointer; font-weight: bold; color: #666; border: 1px solid #ccc; border-bottom: none; }
        .tab.active { background: white; color: #1a237e; border-top: 4px solid #1a237e; }
        
        .content-card { background: white; padding: 30px; border-radius: 0 15px 15px 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 500px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* الجداول */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #f0f0f0; padding: 12px; text-align: center; }
        th { background: #fafafa; color: #444; font-size: 14px; }
        .badge { border-radius: 10px; padding: 4px 12px; font-size: 12px; font-weight: bold; display: inline-block; min-width: 65px; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }

        .form-box { background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee; }
        .btn-action { background: #4a90e2; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="toolbar">
        <button class="btn-tool btn-logout" onclick="logout()">تسجيل الخروج</button>
        <button class="btn-tool" onclick="exportExcel()">تصدير Excel</button>
        <button class="btn-tool" onclick="copyOutlook()">نسخ Outlook</button>
        <button class="btn-tool" onclick="window.print()">طباعة / PDF</button>
        <button class="btn-tool" onclick="changeWeek(7)">الأسبوع التالي</button>
        <button class="btn-tool" onclick="setCurrentWeek()">الأسبوع الحالي</button>
        <button class="btn-tool" onclick="changeWeek(-7)">الأسبوع السابق</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="showTab('schedule-tab', this)">📅 جدول الدوام الأسبوعي</div>
        <div class="tab" onclick="showTab('admin-tab', this)">👥 إدارة الموظفين والفئات</div>
        <div class="tab" onclick="showTab('leave-tab', this)">🏖️ الإجازات الطويلة</div>
    </div>

    <div class="content-card">
        <div id="schedule-tab" class="tab-content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 id="currentWeekTitle" style="margin:0; color:#2c3e50;">جدول الدوام</h2>
                <input type="date" id="dateInput" onchange="renderAll()" style="padding:5px; border-radius:5px; border:1px solid #ccc;">
            </div>
            <table>
                <thead>
                    <tr id="headerRow">
                        <th>الموظف</th><th>الفئة</th><th>الأحد</th><th>الاثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th><th>الجمعة</th><th>السبت</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>

        <div id="admin-tab" class="tab-content">
            <h3 id="formTitle">إضافة موظف جديد</h3>
            <div class="form-box">
                <input type="hidden" id="editEmpId">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: flex-end;">
                    <input type="text" id="empName" placeholder="الاسم الكامل" style="padding:10px; border-radius:5px; border:1px solid #ddd;">
                    <select id="empCatSelect" style="padding:10px; border-radius:5px; border:1px solid #ddd;"></select>
                    <select id="empRole" style="padding:10px; border-radius:5px; border:1px solid #ddd;">
                        <option value="MORNING">صباحي</option>
                        <option value="EVENING">مسائي</option>
                        <option value="FIXED">ليلي (ثابت)</option>
                    </select>
                    <label style="font-size:12px;"><input type="checkbox" id="inRotation" checked> تدوير السبت</label>
                    <button class="btn-action" onclick="handleEmployeeAction()">حفظ البيانات</button>
                </div>
            </div>
            <table id="adminListTable">
                <thead><tr><th>الاسم</th><th>الفئة</th><th>النظام</th><th>تدوير</th><th>إجراءات</th></tr></thead>
                <tbody id="adminListBody"></tbody>
            </table>
        </div>

        <div id="leave-tab" class="tab-content">
            <h3>تسجيل إجازة طويلة</h3>
            <div class="form-box">
                <div style="display: flex; gap: 15px;">
                    <select id="leaveEmpSelect" style="padding:10px; flex:1;"></select>
                    <input type="date" id="leaveStart" style="padding:10px;">
                    <input type="date" id="leaveEnd" style="padding:10px;">
                    <button class="btn-action" onclick="addLongLeave()">تسجيل</button>
                </div>
            </div>
            <tbody id="leaveListBody"></tbody>
        </table>
        </div>
    </div>
</div>

<script>
    // البيانات الافتراضية
    let employees = JSON.parse(localStorage.getItem('employees')) || [
        { id: 1, name: "Abdulrahman Ghulam Al-Sulaimani", cat: "مدير", role: "FIXED", inRotation: false },
        { id: 2, name: "Hamad Rashid Al-Khathran", cat: "مشرف", role: "MORNING", inRotation: true },
        { id: 3, name: "Ziyad Fawaz Althaqfiy", cat: "مشرف", role: "EVENING", inRotation: true },
        { id: 4, name: "Essa Alsalami", cat: "موظف اساسي", role: "MORNING", inRotation: false },
        { id: 5, name: "Saleh Aljuraydi", cat: "موظف اساسي", role: "EVENING", inRotation: false }
    ];
    let categories = JSON.parse(localStorage.getItem('categories')) || ["موظف اساسي", "مشرف", "مدير", "متدرب", "التمهير"];
    let longLeaves = JSON.parse(localStorage.getItem('longLeaves')) || [];

    window.onload = () => {
        setCurrentWeek();
    };

    function save() {
        localStorage.setItem('employees', JSON.stringify(employees));
        localStorage.setItem('longLeaves', JSON.stringify(longLeaves));
    }

    // وظائف شريط الأدوات الجديد
    function changeWeek(days) {
        let current = new Date(document.getElementById('dateInput').value);
        current.setDate(current.getDate() + days);
        document.getElementById('dateInput').valueAsDate = current;
        renderAll();
    }

    function setCurrentWeek() {
        let today = new Date();
        let sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('dateInput').valueAsDate = sun;
        renderAll();
    }

    function logout() {
        if(confirm("هل تريد تسجيل الخروج؟ سيتم إغلاق الجلسة.")) {
            alert("تم تسجيل الخروج بنجاح.");
            // هنا يمكنك إضافة إعادة توجيه لصفحة الدخول إذا كانت متوفرة
        }
    }

    function exportExcel() { alert("جاري تجهيز ملف Excel..."); }
    function copyOutlook() { alert("تم نسخ الجدول بتنسيق Outlook."); }

    // وظائف الجدول الأساسية
    function renderAll() {
        renderAdminList();
        renderSchedule();
        renderLeaveUI();
        document.getElementById('empCatSelect').innerHTML = categories.map(c => `<option>${c}</option>`).join('');
    }

    function renderSchedule() {
        const start = new Date(document.getElementById('dateInput').value);
        const isEven = Math.ceil(start.getDate() / 7) % 2 === 0;
        const rotating = employees.filter(e => e.inRotation);

        document.getElementById('scheduleBody').innerHTML = employees.map(emp => {
            let row = `<tr><td style="text-align:right; font-weight:bold;">${emp.name}</td><td>${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let s = calculateShift(emp, d, isEven, curr, rotating);
                row += `<td><span class="badge ${s}">${s}</span></td>`;
            }
            return row + `</tr>`;
        }).join('');
    }

    function calculateShift(emp, day, isEven, currDate, rotating) {
        if(longLeaves.find(l => { 
            let s=new Date(l.start); let e=new Date(l.end); 
            currDate.setHours(0,0,0,0); s.setHours(0,0,0,0); e.setHours(0,0,0,0);
            return l.empId===emp.id && currDate>=s && currDate<=e; 
        })) return "إجازة";
        if(day === 5) return "أوف";
        if(emp.role === "FIXED") return (day <= 4) ? "ليلي" : "أوف";
        if(day === 6) {
            const idx = rotating.findIndex(r => r.id === emp.id);
            return (idx !== -1 && ((idx === 0 && !isEven) || (idx === 1 && isEven))) ? "صباحي" : "أوف";
        }
        if(day === 4) {
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx !== -1 && ((idx === 0 && !isEven) || (idx === 1 && isEven))) return "أوف";
        }
        return (emp.role === "MORNING") ? "صباحي" : "مسائي";
    }

    // بقية وظائف الإدارة (إضافة، حذف، تعديل)
    function handleEmployeeAction() {
        const name = document.getElementById('empName').value;
        if(!name) return;
        employees.push({ id: Date.now(), name, cat: document.getElementById('empCatSelect').value, role: document.getElementById('empRole').value, inRotation: document.getElementById('inRotation').checked });
        save(); renderAll();
    }

    function deleteEmp(id) {
        employees = employees.filter(e => e.id !== id);
        save(); renderAll();
    }

    function renderAdminList() {
        document.getElementById('adminListBody').innerHTML = employees.map(e => `
            <tr><td>${e.name}</td><td>${e.cat}</td><td>${e.role}</td><td>${e.inRotation?'✅':'🛑'}</td>
            <td><button class="btn-action" style="background:red;" onclick="deleteEmp(${e.id})">حذف</button></td></tr>
        `).join('');
    }

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    }

    function addLongLeave() {
        longLeaves.push({ id: Date.now(), empId: parseInt(document.getElementById('leaveEmpSelect').value), start: document.getElementById('leaveStart').value, end: document.getElementById('leaveEnd').value });
        save(); renderAll();
    }

    function renderLeaveUI() {
        document.getElementById('leaveEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
    }
</script>
</body>
</html>
