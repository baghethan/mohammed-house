<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almajdouie Motors - Scheduling v9.4</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --oncall-bg: #e3f2fd; --oncall-text: #1976d2;
            --night-bg: #f3e5f5; --night-text: #7b1fa2;
            --off-bg: #eeeeee; --off-text: #616161;
            --h-bg: #fff9c4; --h-text: #fbc02d;
            --work-bg: #e8f5e9; --work-text: #2e7d32;
            --morning-bg: #fff3e0; --morning-text: #ef6c00;
            --national-bg: #004d40; --national-text: #ffffff;
            --annual-bg: #ffe0b2; --annual-text: #e65100;
            --plan-bg: #e0f2f1; --plan-text: #00796b;
        }

        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .toolbar { width: 100%; max-width: 1250px; background: var(--primary-blue); padding: 12px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .glass-container { width: 100%; max-width: 1250px; background: white; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px; min-height: 600px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { cursor: pointer; font-weight: bold; color: #555; padding: 10px 15px; border-radius: 8px; font-size: 13px; transition: 0.2s; background: #f8f9fa; border: 1px solid #ddd; }
        .tab.active { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        th, td { padding: 10px 5px; text-align: center; border: 1px solid #f0f0f0; }
        th { background: #fbfbfb; color: var(--primary-blue); font-weight: 900; }
        
        .editable-cell { cursor: pointer; transition: 0.2s; }
        .editable-cell:hover { background: #f0f0f0; transform: scale(1.02); }

        .badge { border-radius: 6px; padding: 6px 4px; font-size: 10px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; min-width: 95px; justify-content: center; pointer-events: none; }
        .OnCall { background: var(--oncall-bg); color: var(--oncall-text); }
        .Night { background: var(--night-bg); color: var(--night-text); }
        .Off { background: var(--off-bg); color: var(--off-text); }
        .Holiday { background: var(--h-bg); color: var(--h-text); }
        .Work { background: var(--work-bg); color: var(--work-text); }
        .Morning { background: var(--morning-bg); color: var(--morning-text); }
        .NationalDay { background: var(--national-bg); color: var(--national-text); }
        .Annual { background: var(--annual-bg); color: var(--annual-text); }
        .Planned { background: var(--plan-bg); color: var(--plan-text); }

        .form-box { padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .btn-action { border: none; border-radius: 6px; padding: 6px 12px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; min-width: 90px; }
    </style>
</head>
<body>

<div class="toolbar">
    <div style="display:flex; gap:10px">
        <button class="btn-tool" onclick="window.changeWeek(7)">Next Week</button>
        <button class="btn-tool" onclick="window.setCurrentWeek()">Current Week</button>
        <button class="btn-tool" onclick="window.changeWeek(-7)">Previous Week</button>
    </div>
    <button class="btn-tool" style="background:#ffc107; color:#000" onclick="window.toggleLanguage()">AR / EN</button>
</div>

<div class="glass-container">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" class="logo-img" style="max-height:45px">
            <div>
                <div style="font-weight: 900; font-size: 18px; color: var(--primary-blue);">Almajdouie Motors</div>
                <div style="font-size: 10px; color: #555;">Scheduling System v9.4</div>
            </div>
        </div>
        <div id="mainT" style="font-weight: 900; font-size: 20px;">Schedule Dashboard</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="window.switchTab('schedule', this)">🗓️ Schedule</div>
        <div class="tab" onclick="window.switchTab('admin', this)">👥 Employees</div>
        <div class="tab" onclick="window.switchTab('holidays', this)">🎊 Public Holidays</div>
        <div class="tab" onclick="window.switchTab('annual', this)">🌴 Annual Leave</div>
        <div class="tab" onclick="window.switchTab('planning', this)">📅 Vacation Plan</div>
    </div>

    <div id="schedule" class="tab-content active">
        <div style="font-size: 11px; color: #666; margin-bottom: 10px;">💡 Click any cell to manually change shift or set as Off.</div>
        <input type="date" id="datePicker" onchange="window.renderAll()" style="margin-bottom:15px; padding:8px;">
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <div class="form-box" style="background: #e3f2fd;">
            <input type="text" id="newEmpName" placeholder="New Employee Name" style="flex:1; padding:8px;">
            <button class="btn-tool" style="background: var(--primary-blue); color:white" onclick="window.addEmployee()">+ Add Employee</button>
        </div>
        <table>
            <thead><tr><th>Name</th><th>Shift</th><th>Rotation</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>

    <div id="planning" class="tab-content">
        <div class="form-box" style="background: #e0f2f1;">
            <select id="pEmpSelect"></select>
            <input type="date" id="pStart"><input type="date" id="pEnd">
            <button class="btn-tool" style="background:#00796b; color:white" onclick="window.addVacationPlan()">Add Plan</button>
        </div>
        <table><thead><tr><th>Employee Name</th><th>From</th><th>To</th><th>Action</th></tr></thead><tbody id="planningBody"></tbody></table>
    </div>

    <div id="holidays" class="tab-content">
        <div class="form-box" style="background: #fff9c4;"><select id="hEmpSelect"></select><input type="text" id="hName" placeholder="Holiday"><input type="date" id="hStart"><input type="date" id="hEnd"><button class="btn-tool" onclick="window.addHolidayDuty()">Add</button></div>
        <table><thead><tr><th>Holiday</th><th>Staff</th><th>Range</th><th>Action</th></tr></thead><tbody id="holidayBody"></tbody></table>
    </div>

    <div id="annual" class="tab-content">
        <div class="form-box" style="background: #ffe0b2;"><select id="aEmpSelect"></select><input type="date" id="aStart"><input type="date" id="aEnd"><button class="btn-tool" onclick="window.addAnnualLeave()">Assign</button></div>
        <table><thead><tr><th>Employee</th><th>From</th><th>To</th><th>Action</th></tr></thead><tbody id="annualBody"></tbody></table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, collection, onSnapshot, updateDoc, setDoc, deleteDoc, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let employees = [], holidayDuties = [], vacationsList = [], planList = [], manualOverrides = {}, currentLang = 'en';

    const formatLocal = (d) => {
        const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    };

    window.switchTab = (id, btn) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    };

    window.toggleLanguage = () => {
        currentLang = currentLang === 'en' ? 'ar' : 'en';
        document.getElementById('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        window.renderAll();
    };

    // Listeners
    onSnapshot(doc(db, "schedule", "jadwal_v6"), (snap) => { employees = snap.exists() ? (snap.data().data?.emps || []) : []; window.renderAll(); });
    onSnapshot(doc(db, "schedule", "jadwal_holidays"), (snap) => { holidayDuties = snap.exists() ? (snap.data().duties || []) : []; window.renderAll(); });
    onSnapshot(doc(db, "schedule", "jadwal_annual_leave"), (snap) => { vacationsList = snap.exists() ? (snap.data().vacations || []) : []; window.renderAll(); });
    onSnapshot(doc(db, "schedule", "manual_overrides"), (snap) => { manualOverrides = snap.exists() ? snap.data() : {}; window.renderAll(); });
    onSnapshot(collection(db, "vacations"), (snap) => { planList = snap.docs.map(d => ({ id: d.id, ...d.data() })); window.renderAll(); });

    window.renderAll = () => {
        const dp = document.getElementById('datePicker');
        if(!dp.value) return;
        const parts = dp.value.split('-');
        const start = new Date(parts[0], parts[1]-1, parts[2]);
        start.setHours(0,0,0,0);

        const t = { 
            onCall: currentLang === 'ar' ? 'أون كول' : 'On Call', night: currentLang === 'ar' ? 'ليلي' : 'Night', 
            off: currentLang === 'ar' ? 'أوف' : 'Off', h: currentLang === 'ar' ? 'إجازة' : 'Holiday',
            work: currentLang === 'ar' ? 'دوام' : 'Work', morning: currentLang === 'ar' ? 'صباحي' : 'Morning',
            national: currentLang === 'ar' ? 'اليوم الوطني' : 'National Day', annual: currentLang === 'ar' ? 'إجازة سنوية' : 'Annual Leave',
            planned: currentLang === 'ar' ? 'مخطط له' : 'Planned'
        };

        const weekNum = Math.ceil(((start - new Date(start.getFullYear(), 0, 1)) / 86400000 + new Date(start.getFullYear(), 0, 1).getDay() + 1) / 7);
        const thuPool = employees.filter(e => e.rotType === 'thu' && e.active);
        const friPool = employees.filter(e => e.rotType === 'fri' && e.active);
        let curThu = thuPool.length > 0 ? thuPool[weekNum % thuPool.length].id : null;
        let curFri = friPool.length > 0 ? friPool[weekNum % friPool.length].id : null;

        let h = `<th>${currentLang === 'en' ? 'Employee' : 'الموظف'}</th>`;
        const daysArr = currentLang === 'en' ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        for(let i=0; i<7; i++) {
            let d = new Date(start.getTime()); d.setDate(start.getDate()+i);
            h += `<th>${daysArr[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        document.getElementById('scheduleBody').innerHTML = employees.filter(e => e.active).map(emp => {
            let row = `<tr><td style="text-align:left; font-weight:bold;">${emp.name}</td>`;
            for(let d=0; d<7; d++) {
                let cellD = new Date(start.getTime()); cellD.setDate(start.getDate()+d); cellD.setHours(0,0,0,0);
                const dateKey = formatLocal(cellD);
                const overrideKey = `${emp.id}_${dateKey}`;

                let shift = manualOverrides[overrideKey], bC = "Morning", icon = "";

                if (!shift) {
                    const isAnn = vacationsList.find(v => String(v.empId) === String(emp.id) && cellD >= new Date(v.start.replace(/-/g, '/')) && cellD <= new Date(v.end.replace(/-/g, '/')));
                    const isPlan = planList.find(p => (String(p.empId) === String(emp.id) || p.name === emp.name) && cellD >= new Date(p.from.replace(/-/g, '/')) && cellD <= new Date(p.to.replace(/-/g, '/')));
                    const isH = holidayDuties.find(duty => cellD >= new Date(duty.start.replace(/-/g, '/')) && cellD <= new Date(duty.end.replace(/-/g, '/')));

                    if (isAnn) { shift = t.annual; bC = "Annual"; icon = "🌴"; }
                    else if (isPlan) { shift = t.planned; bC = "Planned"; icon = "📅"; }
                    else if (isH) {
                        if (String(isH.empId) === String(emp.id)) { shift = emp.fixed?t.night:t.onCall; bC = emp.fixed?"Night":"OnCall"; icon = emp.fixed?"🌙":"📞"; }
                        else { shift = t.h; bC = "Holiday"; icon = "🎊"; }
                    } else if (cellD.getMonth() === 8 && cellD.getDate() === 23) { shift = t.onCall; bC = "NationalDay"; icon = "🇸🇦"; }
                    else if (d === 4) { if(emp.id === curThu) { shift = t.off; bC = "Off"; } else { shift = emp.fixed?t.night:t.morning; bC = emp.fixed?"Night":"Morning"; icon = emp.fixed?"🌙":"☀️"; } }
                    else if (d === 5) { if(emp.id === curThu) { shift = t.off; bC = "Off"; } else if(emp.id === curFri) { shift = t.onCall; bC = "OnCall"; icon = "📞"; } else { shift = t.off; bC = "Off"; } }
                    else if (d === 6) { if(emp.id === curThu) { shift = t.work; bC = "Work"; icon = "🏢"; } else { shift = t.off; bC = "Off"; } }
                    else { shift = emp.fixed?t.night:t.morning; bC = emp.fixed?"Night":"Morning"; icon = emp.fixed?"🌙":"☀️"; }
                } else {
                    if (shift === 'Night') { shift = t.night; bC = "Night"; icon = "🌙"; }
                    else if (shift === 'Off') { shift = t.off; bC = "Off"; icon = ""; }
                    else { shift = t.morning; bC = "Morning"; icon = "☀️"; }
                }
                
                row += `<td class="editable-cell" onclick="window.promptOverride('${emp.id}', '${dateKey}', '${emp.name}')"><span class="badge ${bC}">${icon} ${shift}</span></td>`;
            }
            return row + "</tr>";
        }).join('');
        updateUI();
    };

    window.promptOverride = async (empId, date, name) => {
        const choices = currentLang === 'ar' ? "1. ليلي | 2. أوف | 3. صباحي | 4. تلقائي" : "1. Night | 2. Off | 3. Morning | 4. Reset";
        const res = prompt(`${name} (${date})\n${choices}`);
        let s = null;
        if(res === '1') s = 'Night'; if(res === '2') s = 'Off'; if(res === '3') s = 'Morning';
        if(res !== null) {
            const docRef = doc(db, "schedule", "manual_overrides");
            let updates = { ...manualOverrides };
            if(s) updates[`${empId}_${date}`] = s; else delete updates[`${empId}_${date}`];
            await setDoc(docRef, updates);
        }
    };

    window.toggleExclusiveNight = async (i) => {
        let list = [...employees];
        const on = !list[i].fixed;
        if(on) { list = list.map(e => ({ ...e, fixed: false })); list[i].fixed = true; }
        else { list[i].fixed = false; }
        await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": list });
    };

    function updateUI() {
        const emps = employees.filter(e => e.active);
        const options = emps.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        document.getElementById('pEmpSelect').innerHTML = options;
        document.getElementById('hEmpSelect').innerHTML = options;
        document.getElementById('aEmpSelect').innerHTML = options;

        document.getElementById('adminList').innerHTML = employees.map((e, i) => `
            <tr>
                <td style="text-align:left">${e.name}</td>
                <td><button class="btn-action" style="background:${e.fixed?'#512da8':'#ef6c00'}" onclick="window.toggleExclusiveNight(${i})">${e.fixed?'🌙 Night':'☀️ Morning'}</button></td>
                <td><select onchange="window.updateRot(${i}, this.value)"><option value="none" ${!e.rotType||e.rotType=='none'?'selected':''}>None</option><option value="thu" ${e.rotType=='thu'?'selected':''}>Thu</option><option value="fri" ${e.rotType=='fri'?'selected':''}>Fri</option></select></td>
                <td><button class="btn-action" style="background:${e.active?'#2e7d32':'#616161'}" onclick="window.toggleProp(${i}, 'active')">${e.active?'Active':'Hidden'}</button></td>
                <td><button onclick="window.deleteEmployee(${i})" style="color:red; background:none; border:none; cursor:pointer;">[X]</button></td>
            </tr>`).join('');

        document.getElementById('planningBody').innerHTML = planList.map(p => `<tr><td>${p.name || employees.find(x=>x.id===p.empId)?.name}</td><td>${p.from}</td><td>${p.to}</td><td><button onclick="window.delPlan('${p.id}')" style="color:red">X</button></td></tr>`).join('');
        document.getElementById('holidayBody').innerHTML = holidayDuties.map((d, i) => `<tr><td>${d.name}</td><td>${employees.find(x=>x.id===d.empId)?.name}</td><td>${d.start}/${d.end}</td><td><button onclick="window.delDuty(${i})" style="color:red">X</button></td></tr>`).join('');
        document.getElementById('annualBody').innerHTML = vacationsList.map((v, i) => `<tr><td>${employees.find(x=>x.id===v.empId)?.name}</td><td>${v.start}</td><td>${v.end}</td><td><button onclick="window.delAnnual(${i})" style="color:red">X</button></td></tr>`).join('');
    }

    window.addEmployee = async () => {
        const n = document.getElementById('newEmpName').value; if(!n) return;
        await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": [...employees, { id: "emp_" + Date.now(), name: n, fixed: false, active: true, rotType: 'none' }] });
        document.getElementById('newEmpName').value = "";
    };
    window.deleteEmployee = async (i) => { if(confirm("Del?")) { let a = [...employees]; a.splice(i,1); await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": a }); } };
    window.toggleProp = async (i, p) => { let a = [...employees]; a[i][p] = !a[i][p]; await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": a }); };
    window.updateRot = async (i, v) => { let a = [...employees]; a[i].rotType = v; await updateDoc(doc(db, "schedule", "jadwal_v6"), { "data.emps": a }); };
    window.addVacationPlan = async () => {
        const id = document.getElementById('pEmpSelect').value, s = document.getElementById('pStart').value, e = document.getElementById('pEnd').value;
        const emp = employees.find(x => x.id === id); if(!s || !e) return;
        await addDoc(collection(db, "vacations"), { empId: id, name: emp.name, from: s, to: e, role: "Employee" });
    };
    window.delPlan = async (id) => { if(confirm("Del?")) await deleteDoc(doc(db, "vacations", id)); };
    window.addHolidayDuty = async () => {
        const id = document.getElementById('hEmpSelect').value, s = document.getElementById('hStart').value, e = document.getElementById('hEnd').value, n = document.getElementById('hName').value;
        await updateDoc(doc(db, "schedule", "jadwal_holidays"), { duties: [...holidayDuties, { empId: id, start: s, end: e, name: n }] });
    };
    window.delDuty = async (i) => { let a = [...holidayDuties]; a.splice(i,1); await updateDoc(doc(db, "schedule", "jadwal_holidays"), { duties: a }); };
    window.addAnnualLeave = async () => {
        const id = document.getElementById('aEmpSelect').value, s = document.getElementById('aStart').value, e = document.getElementById('aEnd').value;
        await updateDoc(doc(db, "schedule", "jadwal_annual_leave"), { vacations: [...vacationsList, { empId: id, start: s, end: e }] });
    };
    window.delAnnual = async (i) => { let a = [...vacationsList]; a.splice(i,1); await updateDoc(doc(db, "schedule", "jadwal_annual_leave"), { vacations: a }); };

    window.setCurrentWeek = () => {
        let now = new Date(); now.setHours(0,0,0,0);
        let s = new Date(now.setDate(now.getDate() - now.getDay()));
        document.getElementById('datePicker').value = formatLocal(s);
        window.renderAll();
    };
    window.changeWeek = (v) => {
        let c = new Date(document.getElementById('datePicker').value.replace(/-/g, '/'));
        c.setDate(c.getDate() + v);
        document.getElementById('datePicker').value = formatLocal(c);
        window.renderAll();
    };

    window.setCurrentWeek();
</script>
</body>
</html>
