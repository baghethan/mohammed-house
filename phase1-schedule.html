<div id="admin" class="tab-content">
    <div class="form-box">
        <input type="hidden" id="editEmpId"> <input type="text" id="newEmpName" placeholder="الاسم الكامل">
        <select id="newEmpCat">
            <option>موظف</option><option>مشرف</option><option>مدير</option><option>تمهير</option>
        </select>
        <select id="newEmpRole">
            <option value="MORNING">صباحي</option>
            <option value="FIXED">ليلي (ثابت)</option>
        </select>
        <select id="newEmpStatus">
            <option value="active">مفعل (يظهر بالجدول)</option>
            <option value="inactive">إيقاف (مخفي)</option>
        </select>
        <button id="btnSubmit" class="btn-add" onclick="handleEmployeeSubmit()">حفظ الموظف</button>
        <button id="btnCancel" class="btn-del" style="display:none; background:#666" onclick="cancelEdit()">إلغاء</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>النظام</th>
                <th>الحالة</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="adminList"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let employees = [];

    // جلب البيانات مع فلترة العرض
    onSnapshot(collection(db, "employees"), (snapshot) => {
        employees = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAll();
    });

    // إضافة أو تعديل موظف
    window.handleEmployeeSubmit = async () => {
        const id = document.getElementById('editEmpId').value;
        const data = {
            name: document.getElementById('newEmpName').value,
            cat: document.getElementById('newEmpCat').value,
            role: document.getElementById('newEmpRole').value,
            status: document.getElementById('newEmpStatus').value
        };

        if(!data.name) return alert("يرجى إدخال الاسم");

        if(id) {
            // تحديث موظف موجود
            await updateDoc(doc(db, "employees", id), data);
            cancelEdit();
        } else {
            // إضافة موظف جديد
            await addDoc(collection(db, "employees"), data);
        }
        resetForm();
    };

    // وضع التعديل: جلب البيانات للحقول
    window.startEdit = (id) => {
        const emp = employees.find(e => e.id === id);
        document.getElementById('editEmpId').value = emp.id;
        document.getElementById('newEmpName').value = emp.name;
        document.getElementById('newEmpCat').value = emp.cat;
        document.getElementById('newEmpRole').value = emp.role;
        document.getElementById('newEmpStatus').value = emp.status || 'active';
        
        document.getElementById('btnSubmit').innerText = "تحديث البيانات";
        document.getElementById('btnCancel').style.display = "inline-block";
    };

    window.cancelEdit = () => {
        document.getElementById('editEmpId').value = "";
        resetForm();
        document.getElementById('btnSubmit').innerText = "إضافة موظف";
        document.getElementById('btnCancel').style.display = "none";
    };

    function resetForm() {
        document.getElementById('newEmpName').value = "";
    }

    // حذف موظف
    window.deleteEmployee = async (id) => {
        if(confirm("هل أنت متأكد من الحذف النهائي؟")) await deleteDoc(doc(db, "employees", id));
    };

    // منطق عرض الجدول (يظهر المفعلين فقط)
    function renderSchedule() {
        const start = new Date(document.getElementById('datePicker').value);
        const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        
        let h = '<th>الموظف</th><th>الفئة</th>';
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        let b = '';
        // فلترة: عرض الموظفين الذين حالتهم 'active' فقط
        const visibleEmployees = employees.filter(e => e.status !== 'inactive');

        visibleEmployees.forEach(emp => {
            b += `<tr><td style="font-weight:bold;">${emp.name}</td><td>${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let shift = getShiftLogic(emp, d);
                b += `<td><span class="badge ${shift}">${shift}</span></td>`;
            }
            b += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = b;
    }

    function getShiftLogic(emp, day) {
        // إذا كان اليوم خميس أو جمعة أو سبت
        if(day === 4 || day === 5 || day === 6) return "أوف";
        // إذا كان الموظف مثبت على شفت ليلي
        if(emp.role === "FIXED") return "ليلي";
        return "صباحي";
    }

    function renderAdmin() {
        document.getElementById('adminList').innerHTML = employees.map(e => `
            <tr style="${e.status === 'inactive' ? 'opacity:0.5; background:#f0f0f0' : ''}">
                <td>${e.name}</td>
                <td>${e.role === 'FIXED' ? '🌙 ليلي ثابت' : '☀️ صباحي'}</td>
                <td>${e.status === 'inactive' ? '🛑 متوقف' : '✅ مفعل'}</td>
                <td>
                    <button class="btn-tool" onclick="startEdit('${e.id}')" style="background:#ffc107">تعديل</button>
                    <button class="btn-del" onclick="deleteEmployee('${e.id}')">حذف</button>
                </td>
            </tr>
        `).join('');
    }

    // ... باقي الدوال (renderVacationList, switchTab, changeWeek) تبقى كما هي في الكود السابق
</script>
