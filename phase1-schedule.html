<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جدول الدوام المطور - نظام 5 أيام</title>
    <style>
        :root {
            --morning: #e3f2fd; --morning-text: #1976d2;
            --evening: #fff3e0; --evening-text: #f57c00;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #f5f5f5; --off-text: #bdbdbd;
            --friday-color: #e8f5e9; --friday-text: #2e7d32;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
        .date-picker { background: #f1f3f4; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        th, td { border: 1px solid #f0f0f0; padding: 12px 8px; text-align: center; font-size: 14px; }
        th { background: #fafafa; color: #666; font-weight: 600; }
        .badge { padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 12px; display: block; margin: 2px auto; }
        .morning { background: var(--morning); color: var(--morning-text); }
        .evening { background: var(--evening); color: var(--evening-text); }
        .night { background: var(--night); color: var(--night-text); }
        .off { background: var(--off); color: var(--off-text); }
        .friday-shift { background: var(--friday-color); color: var(--friday-text); }
        .emp-name { font-weight: bold; color: #333; text-align: right; width: 180px; }
        .time-info { font-size: 10px; font-weight: normal; display: block; margin-top: 3px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>نظام جدولة الموظفين السنوي</h2>
        <div class="date-picker">
            <label>اختر الأسبوع (يوم الأحد): </label>
            <input type="date" id="mainDate" onchange="buildSchedule()">
        </div>
    </div>

    <table id="targetTable">
        <thead>
            <tr id="headRow">
                <th>الموظف</th>
                </tr>
        </thead>
        <tbody id="bodyContent"></tbody>
    </table>

    <div style="margin-top:20px; padding:15px; background:#fff9c4; border-radius:8px; font-size:13px;">
        <strong>ملاحظات النظام المبرمج:</strong><br>
        • الجمعة: شخص واحد فقط (1:00م - 10:00م). <br>
        • السبت: شخصان (7:30ص - 5:00م). <br>
        • عبدالرحمن: ثابت ليلي (أحد-خميس). <br>
        • الموظفون (حمد، زياد، عيسى، صالح) يعملون بنظام 5 أيام بتبادل الأوفات (أربعاء/خميس) و (خميس/جمعة).
    </div>
</div>

<script>
    // تهيئة التاريخ
    const d = new Date();
    const sun = new Date(d.setDate(d.getDate() - d.getDay()));
    document.getElementById('mainDate').valueAsDate = sun;

    const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    function buildSchedule() {
        const start = new Date(document.getElementById('mainDate').value);
        const weekNo = Math.ceil(start.getDate() / 7); 
        const isEven = weekNo % 2 === 0;

        // تحديث التاريخ في الرأس
        let h = '<th>الموظف</th>';
        for(let i=0; i<7; i++) {
            let curr = new Date(start);
            curr.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${curr.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headRow').innerHTML = h;

        // تحديد من يأخذ أدوار الإجازة بالتناوب لضمان العدالة
        // الدور 1: أوف (خميس/جمعة) - يعمل سبت
        // الدور 2: أوف (أربعاء/خميس) - يعمل جمعة/سبت
        // الدور 3 و 4: أوف (جمعة/سبت) - يعمل أحد/خميس
        
        let staff = [];
        if(isEven) {
            staff = [
                { n: "Abdulrahman Al-Sulaimani", r: "FIXED" },
                { n: "Hamad Al-Khathran", r: "THU_FRI_OFF" },
                { n: "Ziyad Althaqfiy", r: "WED_THU_OFF" },
                { n: "Essa Swaydi Alsalami", r: "FRI_SAT_OFF_M" },
                { n: "Saleh Aljuraydi", r: "FRI_SAT_OFF_E" }
            ];
        } else {
            staff = [
                { n: "Abdulrahman Al-Sulaimani", r: "FIXED" },
                { n: "Ziyad Althaqfiy", r: "THU_FRI_OFF" },
                { n: "Hamad Al-Khathran", r: "WED_THU_OFF" },
                { n: "Saleh Aljuraydi", r: "FRI_SAT_OFF_M" },
                { n: "Essa Swaydi Alsalami", r: "FRI_SAT_OFF_E" }
            ];
        }

        let b = '';
        staff.forEach(e => {
            b += `<tr><td class="emp-name">${e.n}</td>`;
            for(let day=0; day<7; day++) {
                b += `<td>${getShift(e.r, day)}</td>`;
            }
            b += `</tr>`;
        });
        document.getElementById('bodyContent').innerHTML = b;
    }

    function getShift(role, day) {
        const mTime = '<span class="time-info">07:30 - 05:00</span>';
        const eTime = '<span class="time-info">01:00 - 10:30</span>';
        const nTime = '<span class="time-info">ليل (ثابت)</span>';
        const friTime = '<span class="time-info">01:00 - 10:00</span>';

        // عبدالرحمن
        if(role === "FIXED") {
            return (day >= 0 && day <= 4) ? `<span class="badge night">ليلي${nTime}</span>` : '<span class="badge off">أوف</span>';
        }

        // الدور: أوف (خميس وجمعة) - يعمل السبت (5 أيام عمل)
        if(role === "THU_FRI_OFF") {
            if(day === 4 || day === 5) return '<span class="badge off">أوف</span>';
            return `<span class="badge morning">صباحي${mTime}</span>`;
        }

        // الدور: أوف (أربعاء وخميس) - يعمل الجمعة والسبت (5 أيام عمل)
        if(role === "WED_THU_OFF") {
            if(day === 3 || day === 4) return '<span class="badge off">أوف</span>';
            if(day === 5) return `<span class="badge friday-shift">جمعة${friTime}</span>`;
            if(day === 6) return `<span class="badge morning">صباحي${mTime}</span>`;
            return `<span class="badge evening">مسائي${eTime}</span>`;
        }

        // الأدوار: أوف (جمعة وسبت) - 5 أيام عمل
        if(day === 5 || day === 6) return '<span class="badge off">أوف</span>';
        if(role === "FRI_SAT_OFF_M") return `<span class="badge morning">صباحي${mTime}</span>`;
        if(role === "FRI_SAT_OFF_E") return `<span class="badge evening">مسائي${eTime}</span>`;
    }

    buildSchedule();
</script>

</body>
</html>
