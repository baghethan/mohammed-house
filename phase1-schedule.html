<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام جدولة المجدوعي - الإصدار النهائي</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning: #d1e9ff; --morning-text: #007bff;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: rgba(220, 220, 220, 0.6); --off-text: #555;
            --leave: #f8d7da; --leave-text: #721c24;
        }

        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-image: url('image_dba186.png'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }

        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(13, 33, 73, 0.2); z-index: -1; }

        .toolbar {
            width: 100%; max-width: 1250px; background: rgba(13, 33, 73, 0.85);
            backdrop-filter: blur(15px); padding: 12px 20px; border-radius: 12px;
            display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px;
        }

        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-tool:hover { transform: translateY(-2px); background: #eee; }

        .glass-container {
            width: 100%; max-width: 1200px; background: rgba(255, 255, 255, 0.95);
            border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); padding: 25px;
        }

        .logo-img { max-height: 60px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: #666; transition: 0.3s; }
        .tab.active { color: var(--primary-blue); border-bottom: 3px solid var(--primary-blue); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border: 1px solid #eee; }
        th { background: #f8f9fa; color: var(--primary-blue); font-size: 14px; }

        .badge { border-radius: 15px; padding: 4px 12px; font-size: 11px; font-weight: bold; display: inline-block; min-width: 60px; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }

        .form-box { background: #f0f2f5; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; align-items: flex-end; }
        
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        .btn-add { background: var(--primary-blue); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #ffc107; color: #333; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-left: 5px; }
        .btn-del { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

        @media print { .toolbar, .tabs, .form-box, .btn-del, .btn-edit { display: none; } }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="toolbar">
    <button class="btn-tool" onclick="window.print()">طباعة PDF</button>
    <button class="btn-tool" onclick="window.changeWeek(7)">الأسبوع التالي</button>
    <button class="btn-tool" onclick="window.setCurrentWeek()">الأسبوع الحالي</button>
    <button class="btn-tool" onclick="window.changeWeek(-7)">الأسبوع السابق</button>
</div>

<div class="glass-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" alt="Logo" class="logo-img">
            <div style="text-align: right; border-right: 2px solid #ddd; padding-right: 15px;">
                <div style="font-weight: 900; font-size: 18px; color: var(--primary-blue);">شركة المجدوعي للسيارات</div>
                <div style="font-size: 10px; color: #555;">Almajdouie Motors Company</div>
            </div>
        </div>
        <div style="font-weight: 800; font-size: 20px; color: var(--primary-blue);">نظام إدارة الجدولة</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="window.switchTab('schedule', this)">📅 الجدول</div>
        <div class="tab" onclick="window.switchTab('admin', this)">👥 إدارة الموظفين</div>
        <div class="tab" onclick="window.switchTab('vacations', this)">🏖️ الإجازات</div>
    </div>

    <div id="schedule" class="tab-content active">
        <div style="margin-bottom: 10px;">
            <label>اختر التاريخ:</label>
            <input type="date" id="datePicker" onchange="window.renderAll()">
        </div>
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <div class="form-box">
            <input type="hidden" id="editEmpId">
            <div>
                <label style="font-size: 12px; display: block;">الاسم الكامل:</label>
                <input type="text" id="newEmpName" style="width: 90%;">
            </div>
            <div>
                <label style="font-size: 12px; display: block;">الفئة:</label>
                <select id="newEmpCat" style="width: 100%;">
                    <option>موظف</option><option>مشرف</option><option>مدير</option><option>تمهير</option>
                </select>
            </div>
            <div>
                <label style="font-size: 12px; display: block;">نظام الشفت:</label>
                <select id="newEmpRole" style="width: 100%;">
                    <option value="MORNING">☀️ صباحي</option>
                    <option value="FIXED">🌙 ليلي ثابت</option>
                </select>
            </div>
            <div>
                <label style="font-size: 12px; display: block;">الحالة:</label>
                <select id="newEmpStatus" style="width: 100%;">
                    <option value="active">✅ مفعل</option>
                    <option value="inactive">🛑 إيقاف</option>
                </select>
            </div>
            <button id="btnSubmit" class="btn-add" onclick="window.handleEmployeeSubmit()">حفظ البيانات</button>
            <button id="btnCancel" class="btn-del" style="display:none; background:#666" onclick="window.cancelEdit()">إلغاء</button>
        </div>
        <table>
            <thead><tr><th>الاسم</th><th>النظام</th><th>الحالة</th><th>إجراءات</th></tr></thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>

    <div id="vacations" class="tab-content">
        <div class="form-box">
            <select id="vacationEmpSelect"></select>
            <input type="date" id="vacationStart">
            <input type="date" id="vacationEnd">
            <button class="btn-add" style="background:#f57c00" onclick="window.addVacation()">تسجيل إجازة</button>
        </div>
        <table>
            <thead><tr><th>الموظف</th><th>من</th><th>إلى</th><th>حذف</th></tr></thead>
            <tbody id="vacationList"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let employees = [];
    let vacations = [];

    // --- ربط الدوال بـ Window لتعمل من الـ HTML ---

    window.renderAll = () => {
        renderSchedule();
        renderAdmin();
        renderVacationList();
    };

    window.switchTab = (id, btn) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    };

    window.handleEmployeeSubmit = async () => {
        const id = document.getElementById('editEmpId').value;
        const name = document.getElementById('newEmpName').value;
        const cat = document.getElementById('newEmpCat').value;
        const role = document.getElementById('newEmpRole').value;
        const status = document.getElementById('newEmpStatus').value;

        if(!name) return alert("الرجاء كتابة الاسم");

        if(id) {
            await updateDoc(doc(db, "employees", id), { name, cat, role, status });
            window.cancelEdit();
        } else {
            await addDoc(collection(db, "employees"), { name, cat, role, status });
        }
        document.getElementById('newEmpName').value = "";
    };

    window.startEdit = (id) => {
        const emp = employees.find(e => e.id === id);
        document.getElementById('editEmpId').value = emp.id;
        document.getElementById('newEmpName').value = emp.name;
        document.getElementById('newEmpCat').value = emp.cat;
        document.getElementById('newEmpRole').value = emp.role;
        document.getElementById('newEmpStatus').value = emp.status || 'active';
        
        document.getElementById('btnSubmit').innerText = "تحديث";
        document.getElementById('btnCancel').style.display = "inline-block";
    };

    window.cancelEdit = () => {
        document.getElementById('editEmpId').value = "";
        document.getElementById('newEmpName').value = "";
        document.getElementById('btnSubmit').innerText = "حفظ البيانات";
        document.getElementById('btnCancel').style.display = "none";
    };

    window.deleteEmployee = async (id) => {
        if(confirm("حذف نهائي؟")) await deleteDoc(doc(db, "employees", id));
    };

    window.addVacation = async () => {
        const empId = document.getElementById('vacationEmpSelect').value;
        const s = document.getElementById('vacationStart').value;
        const e = document.getElementById('vacationEnd').value;
        if(s && e) await addDoc(collection(db, "vacations"), { empId, s, e });
    };

    window.deleteVacation = async (id) => {
        await deleteDoc(doc(db, "vacations", id));
    };

    window.setCurrentWeek = () => {
        let today = new Date();
        let sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('datePicker').valueAsDate = sun;
        window.renderAll();
    };

    window.changeWeek = (days) => {
        let d = new Date(document.getElementById('datePicker').value);
        d.setDate(d.getDate() + days);
        document.getElementById('datePicker').valueAsDate = d;
        window.renderAll();
    };

    // --- دوام المنطق الداخلي ---

    function renderSchedule() {
        const start = new Date(document.getElementById('datePicker').value);
        const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        
        let h = '<th>الموظف</th><th>الفئة</th>';
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        let b = '';
        // فلترة الموظفين النشطين فقط
        const visible = employees.filter(e => e.status !== 'inactive');
        
        visible.forEach(emp => {
            b += `<tr><td style="font-weight:bold;">${emp.name}</td><td>${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let shift = getShift(emp, d, curr);
                b += `<td><span class="badge ${shift}">${shift}</span></td>`;
            }
            b += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = b;
    }

    function getShift(emp, day, curr) {
        const isVac = vacations.find(v => {
            let s = new Date(v.s); let e = new Date(v.e);
            curr.setHours(0,0,0,0);
            return v.empId === emp.id && curr >= s && curr <= e;
        });
        if(isVac) return "إجازة";
        if(day >= 4) return "أوف"; // خميس، جمعة، سبت
        return (emp.role === "FIXED") ? "ليلي" : "صباحي";
    }

    function renderAdmin() {
        document.getElementById('adminList').innerHTML = employees.map(e => `
            <tr style="${e.status === 'inactive' ? 'opacity:0.5' : ''}">
                <td>${e.name}</td>
                <td>${e.role === 'FIXED' ? '🌙 ليلي' : '☀️ صباحي'}</td>
                <td>${e.status === 'inactive' ? '🛑 موقف' : '✅ نشط'}</td>
                <td>
                    <button class="btn-edit" onclick="window.startEdit('${e.id}')">تعديل</button>
                    <button class="btn-del" onclick="window.deleteEmployee('${e.id}')">حذف</button>
                </td>
            </tr>
        `).join('');
    }

    function renderVacationList() {
        document.getElementById('vacationEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        document.getElementById('vacationList').innerHTML = vacations.map(v => {
            const emp = employees.find(e => e.id === v.empId);
            return `<tr><td>${emp ? emp.name : '-'}</td><td>${v.s}</td><td>${v.e}</td>
            <td><button class="btn-del" onclick="window.deleteVacation('${v.id}')">حذف</button></td></tr>`;
        }).join('');
    }

    // الاستماع لقاعدة البيانات
    onSnapshot(collection(db, "employees"), (snap) => {
        employees = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        window.renderAll();
    });

    onSnapshot(collection(db, "vacations"), (snap) => {
        vacations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        window.renderAll();
    });

    // تهيئة البداية
    document.getElementById('datePicker').valueAsDate = new Date();
    window.setCurrentWeek();

</script>
</body>
</html>
