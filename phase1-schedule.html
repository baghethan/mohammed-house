<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام جدولة الموظفين - شركة المجدوعي للسيارات</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: rgba(220, 220, 220, 0.6); --off-text: #555;
            --leave: #f8d7da; --leave-text: #721c24;
            --cover: #d4edda; --cover-text: #155724;
        }

        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            /* الخلفية المعتمدة */
            background-image: url('image_dba186.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* طبقة حماية للشفافية */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 33, 73, 0.2); z-index: -1;
        }

        /* شريط الأدوات العلوي */
        .toolbar {
            width: 100%; max-width: 1300px;
            background: rgba(13, 33, 73, 0.85);
            backdrop-filter: blur(15px);
            padding: 12px 20px; border-radius: 12px;
            display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-tool {
            background: white; color: var(--primary-blue); border: none;
            padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .btn-tool:hover { background: #e3f2fd; transform: translateY(-2px); }
        .btn-logout { background: #ffebee; color: #c62828; }

        /* الحاوية الزجاجية */
        .glass-container {
            width: 100%; max-width: 1250px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            padding: 25px;
        }

        .logo-img { max-height: 65px; width: auto; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 10px; }
        .tab { padding: 10px 22px; border-radius: 10px; cursor: pointer; font-weight: bold; color: #444; transition: 0.2s; }
        .tab.active { background: var(--primary-blue); color: white; }

        table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.4); border-radius: 15px; overflow: hidden; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        th { background: rgba(255, 255, 255, 0.9); color: #333; font-weight: 800; font-size: 13px; }

        .badge { border-radius: 15px; padding: 4px 12px; font-size: 11px; font-weight: bold; display: inline-block; min-width: 60px; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }

        .form-box { background: rgba(0,0,0,0.03); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; align-items: flex-end; }
        
        .btn-action { background: var(--primary-blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #ffc107; color: #333; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-left: 5px; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        @media print { .toolbar, .tabs, .form-box { display: none; } body { background: white; } .glass-container { box-shadow: none; border: none; } }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="toolbar">
    <button class="btn-tool btn-logout" onclick="location.reload()">تسجيل الخروج</button>
    <button class="btn-tool" onclick="window.print()">طباعة / PDF</button>
    <button class="btn-tool" onclick="changeWeek(7)">الأسبوع التالي</button>
    <button class="btn-tool" onclick="setCurrentWeek()">الأسبوع الحالي</button>
    <button class="btn-tool" onclick="changeWeek(-7)">الأسبوع السابق</button>
</div>

<div class="glass-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" alt="شعار المجدوعي" class="logo-img">
            <div style="text-align: right; border-right: 2px solid #ddd; padding-right: 15px;">
                <div style="font-weight: 900; font-size: 20px; color: var(--primary-blue);">شركة المجدوعي للسيارات</div>
                <div style="font-size: 11px; color: #555; letter-spacing: 1px;">Almajdouie Motors Company</div>
            </div>
        </div>
        <div style="font-weight: 800; font-size: 22px; color: var(--primary-blue);">جدول الدوام الأسبوعي</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('schedule', this)">📅 جدول الدوام</div>
        <div class="tab" onclick="switchTab('admin', this)">👥 إدارة الموظفين</div>
        <div class="tab" onclick="switchTab('leaves', this)">🏖️ الإجازات الطويلة</div>
    </div>

    <div id="schedule" class="tab-content active">
        <input type="date" id="datePicker" onchange="renderAll()" style="background: transparent; border: none; font-weight: bold; font-size: 16px; margin-bottom: 10px;">
        <table>
            <thead>
                <tr id="headerDates">
                    <th>الموظف</th><th>الفئة</th><th>الأحد</th><th>الاثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th><th>الجمعة</th><th>السبت</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <h3 id="formTitle">إضافة موظف جديد</h3>
        <div class="form-box">
            <input type="hidden" id="editEmpId">
            <div class="grid-inputs">
                <input type="text" id="empName" placeholder="الاسم">
                <select id="empCat">
                    <option>موظف اساسي</option><option>مشرف</option><option>مدير</option><option>متدرب</option><option>التمهير</option>
                </select>
                <select id="empRole">
                    <option value="MORNING">صباحي</option><option value="EVENING">مسائي</option><option value="FIXED">ليلي (ثابت)</option>
                </select>
                <label style="font-size: 12px;"><input type="checkbox" id="inRotate" checked> تدوير السبت</label>
                <button id="btnAction" class="btn-action" onclick="handleEmployeeAction()">حفظ البيانات</button>
            </div>
        </div>
        <table>
            <thead><tr><th>الاسم</th><th>الفئة</th><th>النظام</th><th>تدوير</th><th>إجراءات</th></tr></thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>

    <div id="leaves" class="tab-content">
        <h3>تسجيل إجازة طويلة</h3>
        <div class="form-box">
            <div class="grid-inputs">
                <select id="leaveEmpSelect"></select>
                <input type="date" id="leaveStart">
                <input type="date" id="leaveEnd">
                <button class="btn-action" style="background: #f57c00;" onclick="addLongLeave()">تسجيل</button>
            </div>
        </div>
        <table>
            <thead><tr><th>الموظف</th><th>من</th><th>إلى</th><th>حذف</th></tr></thead>
            <tbody id="leaveListBody"></tbody>
        </table>
    </div>
</div>

<script>
    let employees = JSON.parse(localStorage.getItem('employees')) || [
        { id: 1, name: "عبدالرحمن السليماني", cat: "مدير", role: "FIXED", inRotation: false },
        { id: 2, name: "حمد الخثران", cat: "مشرف", role: "MORNING", inRotation: true },
        { id: 3, name: "زياد الثقفي", cat: "مشرف", role: "EVENING", inRotation: true }
    ];
    let longLeaves = JSON.parse(localStorage.getItem('longLeaves')) || [];

    function save() { localStorage.setItem('employees', JSON.stringify(employees)); localStorage.setItem('longLeaves', JSON.stringify(longLeaves)); }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
        renderAll();
    }

    function setCurrentWeek() {
        let today = new Date();
        let sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('datePicker').valueAsDate = sun;
        renderAll();
    }

    function changeWeek(days) {
        let d = new Date(document.getElementById('datePicker').value);
        d.setDate(d.getDate() + days);
        document.getElementById('datePicker').valueAsDate = d;
        renderAll();
    }

    function handleEmployeeAction() {
        const id = document.getElementById('editEmpId').value;
        const name = document.getElementById('empName').value;
        if(!name) return;

        if(id) {
            const index = employees.findIndex(e => e.id == id);
            employees[index] = { id: parseInt(id), name, cat: document.getElementById('empCat').value, role: document.getElementById('empRole').value, inRotation: document.getElementById('inRotation').checked };
            cancelEdit();
        } else {
            employees.push({ id: Date.now(), name, cat: document.getElementById('empCat').value, role: document.getElementById('empRole').value, inRotation: document.getElementById('inRotation').checked });
        }
        save(); renderAll(); document.getElementById('empName').value = "";
    }

    function startEdit(id) {
        const e = employees.find(emp => emp.id == id);
        document.getElementById('editEmpId').value = e.id;
        document.getElementById('empName').value = e.name;
        document.getElementById('empCat').value = e.cat;
        document.getElementById('empRole').value = e.role;
        document.getElementById('inRotation').checked = e.inRotation;
        document.getElementById('formTitle').innerText = "تعديل بيانات: " + e.name;
        document.getElementById('btnAction').innerText = "حفظ التعديل";
    }

    function cancelEdit() {
        document.getElementById('editEmpId').value = "";
        document.getElementById('formTitle').innerText = "إضافة موظف جديد";
        document.getElementById('btnAction').innerText = "حفظ البيانات";
    }

    function deleteEmp(id) { if(confirm('حذف الموظف؟')){ employees = employees.filter(e => e.id !== id); save(); renderAll(); } }

    function renderAll() {
        renderSchedule();
        renderAdmin();
        renderLeaves();
    }

    function renderSchedule() {
        const start = new Date(document.getElementById('datePicker').value);
        const isEven = Math.ceil(start.getDate() / 7) % 2 === 0;
        const rotating = employees.filter(e => e.inRotation);
        const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

        let h = '<th>الموظف</th><th>الفئة</th>';
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        let b = '';
        employees.forEach(emp => {
            b += `<tr><td style="font-weight:bold;">${emp.name}</td><td>${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let shift = getShift(emp, d, isEven, curr, rotating);
                b += `<td><span class="badge ${shift}">${shift}</span></td>`;
            }
            b += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = b;
    }

    function getShift(emp, day, isEven, curr, rotating) {
        if(longLeaves.find(l => { let s=new Date(l.s); let e=new Date(l.e); curr.setHours(0,0,0,0); return l.empId === emp.id && curr >= s && curr <= e; })) return "إجازة";
        if(day === 5) return "أوف"; 
        if(emp.role === "FIXED") return (day <= 4) ? "ليلي" : "أوف";
        if(day === 6) { 
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx === -1) return "أوف";
            return ((idx === 0 && !isEven) || (idx === 1 && isEven)) ? "صباحي" : "أوف";
        }
        if(day === 4) {
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx !== -1 && ((idx === 0 && !isEven) || (idx === 1 && isEven))) return "أوف";
        }
        return (emp.role === "MORNING") ? "صباحي" : "مسائي";
    }

    function renderAdmin() {
        document.getElementById('adminList').innerHTML = employees.map(e => `
            <tr><td>${e.name}</td><td>${e.cat}</td><td>${e.role}</td><td>${e.inRotation?'✅':'🛑'}</td>
            <td><button class="btn-edit" onclick="startEdit(${e.id})">تعديل</button><button class="btn-delete" onclick="deleteEmp(${e.id})">حذف</button></td></tr>
        `).join('');
    }

    function addLongLeave() {
        longLeaves.push({ id: Date.now(), empId: parseInt(document.getElementById('leaveEmpSelect').value), s: document.getElementById('leaveStart').value, e: document.getElementById('leaveEnd').value });
        save(); renderAll();
    }

    function renderLeaves() {
        document.getElementById('leaveEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        document.getElementById('leaveListBody').innerHTML = longLeaves.map(l => {
            const emp = employees.find(e => e.id === l.empId);
            return `<tr><td>${emp?emp.name:'-'}</td><td>${l.s}</td><td>${l.e}</td><td><button onclick="deleteLeave(${l.id})">حذف</button></td></tr>`;
        }).join('');
    }
    function deleteLeave(id) { longLeaves = longLeaves.filter(l => l.id !== id); save(); renderAll(); }

    window.onload = setCurrentWeek;
</script>
</body>
</html>
