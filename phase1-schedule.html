<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Almajdouie Motors - Schedule v10.2.6</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
  font-family:Segoe UI, Tahoma;
  background:#eef3f9;
  margin:0;
  padding:20px;
}
.container{
  max-width:1200px;
  margin:auto;
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.12);
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.header h2{margin:0;color:#0d2149}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
button{
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}
.copy{background:#0d2149;color:white}
.download{background:#ff7a18;color:white}

.legend{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:12px 0;
}
.legend span{
  padding:8px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.Morning{background:#dbeafe;color:#1d4ed8}
.Night{background:#ede9fe;color:#6d28d9}
.Work{background:#d8f3dc;color:#2e7d32}
.OnCall{background:#e3f2fd;color:#1976d2}
.Annual{background:#fdecea;color:#c62828}
.Off{background:#eeeeee;color:#616161}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #e5e7eb;
  padding:10px;
  text-align:center;
}
th{background:#f8fafc;color:#0d2149}
.name{text-align:left;font-weight:800}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}
</style>
</head>

<body>

<div class="container" id="captureArea">

  <div class="header">
    <h2>Almajdouie Motors – Weekly Schedule</h2>
    <input type="date" id="weekDate">
  </div>

  <div class="controls">
    <button class="copy" onclick="copyImage()">📋 Copy Schedule Image</button>
    <button class="download" onclick="downloadImage()">📸 Download Schedule Image</button>
  </div>

  <div class="legend">
    <span class="Morning">Morning 08:00–17:00</span>
    <span class="Night">Night 17:00–00:00</span>
    <span class="Work">Work / Coverage 09:00–18:00</span>
    <span class="OnCall">On Call</span>
    <span class="Annual">Annual Leave</span>
    <span class="Off">Off</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Employee</th>
        <th>Sun</th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Wed</th>
        <th>Thu</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="name">Mohammed</td>
        <td><span class="badge Morning">Morning</span></td>
        <td><span class="badge Off">Off</span></td>
        <td><span class="badge Night">Night</span></td>
        <td><span class="badge Work">Work</span></td>
        <td><span class="badge OnCall">On Call</span></td>
      </tr>
      <tr>
        <td class="name">Ahmed</td>
        <td><span class="badge Work">Work</span></td>
        <td><span class="badge Morning">Morning</span></td>
        <td><span class="badge Off">Off</span></td>
        <td><span class="badge Night">Night</span></td>
        <td><span class="badge Annual">Annual</span></td>
      </tr>
    </tbody>
  </table>

</div>

<script>
function downloadImage(){
  html2canvas(document.getElementById('captureArea'),{scale:2})
  .then(canvas=>{
    const a=document.createElement('a');
    a.download='schedule.png';
    a.href=canvas.toDataURL();
    a.click();
  });
}
function copyImage(){
  html2canvas(document.getElementById('captureArea'),{scale:2})
  .then(canvas=>{
    canvas.toBlob(blob=>{
      navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      alert('Image copied ✅');
    });
  });
}
</script>

</body>
</html>
