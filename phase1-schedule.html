<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام جدولة الموظفين - المجدوعي</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning: #d1e9ff; --morning-text: #007bff;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: rgba(220, 220, 220, 0.6); --off-text: #555;
        }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; }
        .toolbar { width: 100%; max-width: 1200px; background: var(--primary-blue); padding: 12px; border-radius: 12px; display: flex; justify-content: flex-end; gap: 10px; margin: 0 auto 20px auto; }
        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .container { width: 95%; max-width: 1200px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; margin: auto; }
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px; text-align: center; border: 1px solid #eee; }
        th { background: #f8f9fa; color: var(--primary-blue); }
        .badge { border-radius: 15px; padding: 5px 12px; font-size: 12px; font-weight: bold; display: inline-block; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn-tool" onclick="window.print()">طباعة PDF</button>
    <button class="btn-tool" onclick="changeWeek(7)">الأسبوع التالي</button>
    <button class="btn-tool" onclick="setCurrentWeek()">الأسبوع الحالي</button>
    <button class="btn-tool" onclick="changeWeek(-7)">الأسبوع السابق</button>
</div>

<div class="container">
    <h2 style="text-align: center; color: var(--primary-blue);">جدول دوام الموظفين - متصل بـ Firebase</h2>
    <div style="text-align: center; margin-bottom: 20px;">
        <input type="date" id="datePicker" onchange="renderSchedule()" style="padding: 8px;">
    </div>
    <div class="table-wrapper">
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody">
                <tr><td colspan="9">جاري الاتصال بقاعدة البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // بياناتك الحقيقية من الصورة التي أرسلتها
    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d",
        measurementId: "G-45X2SXD2E4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let employees = [];

    async function fetchEmployees() {
        try {
            const querySnapshot = await getDocs(collection(db, "employees"));
            employees = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            console.log("تم جلب الموظفين:", employees);
            renderSchedule();
        } catch (error) {
            console.error("خطأ في جلب البيانات:", error);
            document.getElementById('scheduleBody').innerHTML = `<tr><td colspan="9">خطأ: ${error.message}</td></tr>`;
        }
    }

    window.renderSchedule = function() {
        const start = new Date(document.getElementById('datePicker').value);
        const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

        let h = '<th>الموظف</th><th>الفئة</th>';
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        let b = '';
        if (employees.length === 0) {
            b = '<tr><td colspan="9">لا يوجد موظفين في مجموعة employees</td></tr>';
        } else {
            employees.forEach(emp => {
                b += `<tr><td style="font-weight:bold;">${emp.name || 'بدون اسم'}</td><td>${emp.cat || 'موظف'}</td>`;
                for(let d=0; d<7; d++) {
                    let curr = new Date(start); curr.setDate(start.getDate()+d);
                    let shift = getShiftLogic(emp, d);
                    b += `<td><span class="badge ${shift}">${shift}</span></td>`;
                }
                b += `</tr>`;
            });
        }
        document.getElementById('scheduleBody').innerHTML = b;
    }

    function getShiftLogic(emp, day) {
        if(day === 4 || day === 5 || day === 6) return "أوف"; 
        if(emp.role === "FIXED" || emp.role === "night" || emp.role === "ليلي") return "ليلي";
        return "صباحي";
    }

    window.setCurrentWeek = function() {
        let today = new Date();
        let sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('datePicker').valueAsDate = sun;
        renderSchedule();
    }

    window.changeWeek = function(days) {
        let d = new Date(document.getElementById('datePicker').value);
        d.setDate(d.getDate() + days);
        document.getElementById('datePicker').valueAsDate = d;
        renderSchedule();
    }

    // التشغيل عند التحميل
    document.getElementById('datePicker').valueAsDate = new Date();
    fetchEmployees();
    setCurrentWeek();
</script>
</body>
</html>
