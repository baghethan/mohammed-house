<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almajdouie Motors - Scheduling v10.2.5</title>

  <!-- html2canvas (للنسخ والتنزيل كصورة) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root{
      --surface: rgba(255,255,255,.90);
      --surface-strong: rgba(255,255,255,.97);
      --primary:#0d2149; --primary-2:#1b4fa3;
      --text:#1f2937; --muted:#64748b;
      --danger:#c62828; --success:#1f7a4f;
      --shadow:0 18px 50px rgba(13,33,73,.16);

      --oncall-bg:#e3f2fd; --oncall-text:#1976d2;
      --night-bg:#f3e5f5; --night-text:#7b1fa2;
      --off-bg:#eeeeee; --off-text:#616161;
      --holiday-bg:#fff9c4; --holiday-text:#fbc02d;
      --work-bg:#d8f3dc; --work-text:#2e7d32;
      --morning-bg:#dbeafe; --morning-text:#1d4ed8;
      --annual-bg:#fdecea; --annual-text:#c62828;
      --national-bg:#004d40; --national-text:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;padding:18px;font-family:'Segoe UI',Tahoma,sans-serif;
      background:linear-gradient(180deg, rgba(12,31,73,.10), rgba(255,255,255,.25)),
                 url('image_dba186.png') center/cover fixed no-repeat;
      min-height:100vh;color:var(--text);display:flex;justify-content:center
    }
    .shell{width:100%;max-width:1280px}

    /* Toolbar */
    .toolbar{
      width:100%;background:linear-gradient(135deg, rgba(13,33,73,.98), rgba(27,79,163,.95));
      border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);
      position:sticky;top:10px;z-index:50;
      display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap
    }
    .toolbar-left,.toolbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .btn-tool,.primary-btn,.secondary-btn,.danger-btn{
      border:none;border-radius:12px;padding:10px 14px;
      font-weight:800;cursor:pointer;transition:.2s;font-size:13px;font-family:inherit
    }
    .btn-tool{background:rgba(255,255,255,.96);color:var(--primary);box-shadow:0 4px 14px rgba(0,0,0,.08)}
    .btn-tool:hover,.primary-btn:hover,.secondary-btn:hover,.danger-btn:hover{transform:translateY(-1px)}
    .btn-logout{display:none;background:#ef5350;color:white}
    .lang-btn{background:linear-gradient(135deg,#ffd54f,#f7b500);color:#1f2937}
    .user-chip{
      display:none;padding:8px 12px;border-radius:999px;
      background:rgba(255,255,255,.12);color:white;font-weight:700;font-size:12px
    }

    /* Container */
    .glass-container{
      margin-top:14px;width:100%;background:var(--surface);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.45);
      border-radius:24px;box-shadow:var(--shadow);overflow:hidden
    }
    .header-top{
      display:flex;justify-content:space-between;align-items:center;
      padding:20px 24px 16px;border-bottom:1px solid rgba(15,23,42,.08);
      gap:16px;flex-wrap:wrap
    }
    .brand-wrap{display:flex;align-items:center;gap:16px}
    .brand-logo{max-height:48px;width:auto}
    .brand-title{font-size:19px;font-weight:900;color:var(--primary)}
    .brand-subtitle{font-size:11px;color:var(--muted)}
    .page-title{font-size:24px;font-weight:900}

    /* Tabs */
    .tabs{display:flex;gap:10px;flex-wrap:wrap;padding:0 24px 16px}
    .tab{
      cursor:pointer;padding:11px 14px;border-radius:14px;border:1px solid #e5e7eb;
      background:white;color:#475569;font-size:13px;font-weight:800
    }
    .tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white}
    .tab-content{display:none;padding:0 24px 24px}
    .tab-content.active{display:block}

    /* Table */
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;background:white;border-radius:16px}
    thead th{background:#f8fafc;color:var(--primary);font-weight:900;font-size:11px}
    th,td{padding:11px 6px;text-align:center}
    .row-start{text-align:left;font-weight:800}

    .badge{
      border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;
      display:inline-flex;align-items:center;min-width:100px;justify-content:center
    }
    .Morning{background:var(--morning-bg);color:var(--morning-text)}
    .Night{background:var(--night-bg);color:var(--night-text)}
    .OnCall{background:var(--oncall-bg);color:var(--oncall-text)}
    .Work{background:var(--work-bg);color:var(--work-text)}
    .Annual{background:var(--annual-bg);color:var(--annual-text)}
    .Off{background:var(--off-bg);color:var(--off-text)}
    .Holiday{background:var(--holiday-bg);color:var(--holiday-text)}
    .NationalDay{background:var(--national-bg);color:var(--national-text)}

    .editable-cell{cursor:pointer}

    /* Legend + Capture */
    .legend-actions{display:flex;gap:10px;margin-bottom:14px}
    .copy-btn{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white}
    .download-btn{background:linear-gradient(135deg,#ff7a18,#ff5722);color:white}
    .capture-card{background:white;border-radius:18px;padding:18px}
    .legend-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .legend-chip{padding:10px 14px;border-radius:999px;font-weight:800;font-size:12px}
    .legend-time{font-size:11px;opacity:.85}
  </style>
</head>

<body>
<div class="shell">

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn-tool" onclick="changeWeek(-7)">Previous Week</button>
      <button class="btn-tool" onclick="setCurrentWeek()">Current Week</button>
      <button class="btn-tool" onclick="changeWeek(7)">Next Week</button>
    </div>
    <div class="toolbar-right">
      <div class="user-chip" id="userChip"></div>
      <button class="btn-tool btn-logout" id="btnLogout" onclick="logout()">Logout</button>
      <button class="btn-tool lang-btn" onclick="toggleLanguage()">AR / EN</button>
    </div>
  </div>

  <div class="glass-container">
    <div class="header-top">
      <div class="brand-wrap">
        <img src="LOGO-almajdouie.png" class="brand-logo">
        <div>
          <div class="brand-title">Almajdouie Motors</div>
          <div class="brand-subtitle">Scheduling System v10.2.5</div>
        </div>
      </div>
      <div class="page-title">Schedule Dashboard</div>
    </div>

    <!-- Schedule -->
    <div class="tab-content active">
      <div class="legend-actions">
        <input type="date" id="datePicker">
        <button class="btn-tool copy-btn" onclick="copyScheduleImage()">📋 Copy Schedule Image</button>
        <button class="btn-tool download-btn" onclick="downloadScheduleImage()">📸 Download Schedule Image</button>
      </div>

      <div class="capture-card" id="scheduleCaptureArea">
        <div class="legend-bar" id="shiftLegendBar"></div>
        <table>
          <thead><tr id="headerDates"></tr></thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== CONFIG ===== */
const SHIFT_TIMES = {
  Morning:'08:00 - 17:00',
  Night:'17:00 - 00:00',
  Annual:'طوال اليوم',
  OnCall:'حسب الحاجة',
  Work:'09:00 - 18:00',
  Off:'طوال اليوم'
};
const LEGEND_ORDER=['Morning','Night','Annual','OnCall','Work','Off'];

/* ===== Legend (بدون أيقونة Annual و Off) ===== */
function renderShiftLegend(){
  const bar=document.getElementById('shiftLegendBar');
  bar.innerHTML = LEGEND_ORDER.map(k=>{
    const icon = (k==='Annual' || k==='Off') ? '' :
      k==='Morning'?'☀️':k==='Night'?'🌙':k==='OnCall'?'📞':'🏢';
    return `<div class="legend-chip ${k}">
      ${icon ? icon+' ' : ''}${k}
      <div class="legend-time">${SHIFT_TIMES[k]}</div>
    </div>`;
  }).join('');
}

/* ===== Table (مثال توضيحي) ===== */
function renderAll(){
  renderShiftLegend();
  const h=document.getElementById('headerDates');
  const b=document.getElementById('scheduleBody');
  h.innerHTML='<th>Employee</th><th>Sun</th><th>Mon</th>';
  b.innerHTML=`
    <tr>
      <td class="row-start">Mohammed</td>
      <td><span class="badge Morning">Morning</span></td>
      <td><span class="badge Off">Off</span></td>
    </tr>`;
}

/* ===== Image Export ===== */
async function downloadScheduleImage(){
  const el=document.getElementById('scheduleCaptureArea');
  const c=await html2canvas(el,{backgroundColor:'#fff',scale:2});
  const a=document.createElement('a');
  a.download='schedule.png';
  a.href=c.toDataURL();
  a.click();
}
async function copyScheduleImage(){
  const el=document.getElementById('scheduleCaptureArea');
  const c=await html2canvas(el,{backgroundColor:'#fff',scale:2});
  c.toBlob(b=>navigator.clipboard.write([new ClipboardItem({'image/png':b})]));
}

function setCurrentWeek(){ renderAll(); }
function changeWeek(){ renderAll(); }
function toggleLanguage(){}
function logout(){}

setCurrentWeek();
</script>
</body>
</html>
