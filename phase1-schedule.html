<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام جدولة الموظفين - المجدوعي (مرتبط بـ Firebase)</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning: #d1e9ff; --morning-text: #007bff;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: rgba(220, 220, 220, 0.6); --off-text: #555;
            --leave: #f8d7da; --leave-text: #721c24;
        }
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; }
        .toolbar { width: 100%; max-width: 1300px; background: var(--primary-blue); padding: 12px 20px; border-radius: 12px; display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .glass-container { width: 95%; max-width: 1300px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 25px; }
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 15px 10px; text-align: center; border: 1px solid #eee; }
        th { background: #f8f9fa; color: var(--primary-blue); }
        .badge { border-radius: 15px; padding: 5px 12px; font-size: 12px; font-weight: bold; display: inline-block; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: #666; }
        .tab.active { color: var(--primary-blue); border-bottom: 3px solid var(--primary-blue); }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn-tool" onclick="window.print()">طباعة PDF</button>
    <button class="btn-tool" onclick="changeWeek(7)">الأسبوع التالي</button>
    <button class="btn-tool" onclick="setCurrentWeek()">الأسبوع الحالي</button>
    <button class="btn-tool" onclick="changeWeek(-7)">الأسبوع السابق</button>
</div>

<div class="glass-container">
    <h2 style="text-align: center; color: var(--primary-blue);">نظام الجدولة - المجدوعي (Firebase)</h2>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('schedule', this)">📅 الجدول</div>
    </div>

    <div id="schedule" class="tab-content active">
        <input type="date" id="datePicker" onchange="renderSchedule()" style="margin-bottom: 15px; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
        <div class="table-wrapper">
            <table>
                <thead><tr id="headerDates"></tr></thead>
                <tbody id="scheduleBody">
                    <tr><td colspan="9">جاري تحميل البيانات من Firebase...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 1. ضع إعدادات Firebase الخاصة بك هنا (Firebase Config)
    // تجدها في Firebase Console > Project Settings
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let employees = [];

    // جلب البيانات من Firebase
    async function fetchEmployees() {
        try {
            const querySnapshot = await getDocs(collection(db, "employees"));
            employees = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderSchedule();
        } catch (error) {
            console.error("Error fetching employees: ", error);
            document.getElementById('scheduleBody').innerHTML = '<tr><td colspan="9">فشل تحميل البيانات. تأكد من إعدادات Firebase والـ Rules.</td></tr>';
        }
    }

    // عرض الجدول
    window.renderSchedule = function() {
        const start = new Date(document.getElementById('datePicker').value);
        const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

        // رسم العناوين
        let h = '<th>الموظف</th><th>الفئة</th>';
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        // رسم الصفوف
        let b = '';
        employees.forEach(emp => {
            b += `<tr><td style="font-weight:bold;">${emp.name || 'بدون اسم'}</td><td>${emp.cat || 'موظف'}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let shift = getShiftLogic(emp, d);
                b += `<td><span class="badge ${shift}">${shift}</span></td>`;
            }
            b += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = b || '<tr><td colspan="9">لا يوجد موظفين في Firebase</td></tr>';
    }

    function getShiftLogic(emp, day) {
        if(day === 4 || day === 5 || day === 6) return "أوف"; // خميس، جمعة، سبت
        if(emp.role === "FIXED" || emp.role === "night") return "ليلي";
        return "صباحي";
    }

    // وظائف التنقل بالوقت
    window.setCurrentWeek = function() {
        let today = new Date();
        let sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('datePicker').valueAsDate = sun;
        renderSchedule();
    }

    window.changeWeek = function(days) {
        let d = new Date(document.getElementById('datePicker').value);
        d.setDate(d.getDate() + days);
        document.getElementById('datePicker').valueAsDate = d;
        renderSchedule();
    }

    window.switchTab = function(id, btn) { renderSchedule(); }

    // البدء
    document.getElementById('datePicker').valueAsDate = new Date();
    fetchEmployees();
    setCurrentWeek();
</script>
</body>
</html>
