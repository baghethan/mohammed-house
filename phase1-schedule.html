<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة الدوام الأسبوعي</title>
    <style>
        :root {
            --bg-body: #f1f4f9;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #e9ecef; --off-text: #6c757d;
            --leave: #f8d7da; --leave-text: #721c24;
            --oncall: #d1ecf1; --oncall-text: #0c5460;
            --cover: #d4edda; --cover-text: #155724;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 40px; margin: 0; }
        .main-card { background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 25px; max-width: 1300px; margin: auto; }
        
        /* Header & Legend */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .legend { display: flex; gap: 10px; }
        .legend-item { padding: 4px 12px; border-radius: 15px; font-size: 13px; font-weight: 500; }
        
        /* Date Picker */
        .controls { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        input[type="date"] { border: 1px solid #ddd; padding: 5px 10px; border-radius: 5px; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #f0f0f0; padding: 12px 8px; text-align: center; }
        th { background: #fafafa; color: #333; font-weight: 600; font-size: 14px; }
        
        .badge { border-radius: 12px; padding: 4px 15px; font-size: 12px; font-weight: bold; display: inline-block; min-width: 60px; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }
        .تغطية { background: var(--cover); color: var(--cover-text); }

        /* Summary Cards */
        .summary-title { margin-top: 40px; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .summary-container { display: flex; gap: 20px; }
        .sum-card { flex: 1; background: white; border: 1px solid #eee; border-radius: 15px; padding: 20px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .sum-card .label { font-weight: bold; color: #444; }
        .sum-card .value { font-size: 24px; font-weight: bold; color: #333; }

        .emp-name { font-weight: bold; text-align: right; color: #444; width: 180px; }
        .category { color: #888; font-size: 13px; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <div class="legend">
            <span class="legend-item صباحي">صباحي</span>
            <span class="legend-item ليلي">ليلي</span>
            <span class="legend-item مسائي">مسائي</span>
            <span class="legend-item إجازة">إجازة</span>
            <span class="legend-item تغطية">تغطية</span>
            <span class="legend-item oncall-text" style="background:var(--oncall)">أون كول</span>
            <span class="legend-item أوف">أوف</span>
        </div>
        <div style="font-weight: bold; font-size: 20px;">جدول الدوام الأسبوعي</div>
    </div>

    <div class="controls">
        <label>تاريخ بداية الأسبوع (الأحد): </label>
        <input type="date" id="dateInput" onchange="renderAll()">
    </div>

    <table>
        <thead>
            <tr id="headerDates">
                <th>الموظف</th>
                <th>الفئة</th>
                </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="summary-title">ملخص التغطية الأسبوعية</div>
<div class="summary-container" id="summaryCards">
    </div>

<script>
    const picker = document.getElementById('dateInput');
    const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    // الإعداد الأولي
    window.onload = () => {
        const d = new Date();
        const sun = new Date(d.setDate(d.getDate() - d.getDay()));
        picker.valueAsDate = sun;
        renderAll();
    };

    function renderAll() {
        const start = new Date(picker.value);
        const isEven = Math.ceil(start.getDate() / 7) % 2 === 0;
        
        updateHeader(start);
        const data = generateData(isEven);
        drawTable(data);
        drawSummary(data);
    }

    function updateHeader(start) {
        const hRow = document.getElementById('headerDates');
        let hHtml = '<th>الموظف</th><th>الفئة</th>';
        for(let i=0; i<7; i++) {
            let curr = new Date(start);
            curr.setDate(start.getDate() + i);
            hHtml += `<th>${dayNames[i]}<br><small>(${curr.toLocaleDateString('en-GB')})</small></th>`;
        }
        hRow.innerHTML = hHtml;
    }

    function generateData(isEven) {
        const staff = isEven ? [
            { n: "A. Al-Sulaimani", c: "مدير", r: "FIXED" },
            { n: "Hamad Al-Khathran", c: "مشرف", r: "THU_FRI" },
            { n: "Ziyad Althaqfiy", c: "مشرف", r: "WED_THU" },
            { n: "Essa Alsalami", c: "موظف", r: "MORNING" },
            { n: "Saleh Aljuraydi", c: "موظف", r: "EVENING" }
        ] : [
            { n: "A. Al-Sulaimani", c: "مدير", r: "FIXED" },
            { n: "Ziyad Althaqfiy", c: "مشرف", r: "THU_FRI" },
            { n: "Hamad Al-Khathran", c: "مشرف", r: "WED_THU" },
            { n: "Saleh Aljuraydi", c: "موظف", r: "MORNING" },
            { n: "Essa Alsalami", c: "موظف", r: "EVENING" }
        ];

        return staff.map(emp => {
            let row = { name: emp.n, cat: emp.c, shifts: [] };
            for(let d=0; d<7; d++) {
                row.shifts.push(calculateShift(emp.r, d));
            }
            return row;
        });
    }

    function calculateShift(role, day) {
        if(role === "FIXED") return (day <= 4) ? "ليلي" : "أوف";
        if(role === "THU_FRI") {
            if(day === 4) return "إجازة";
            if(day === 5) return "أوف";
            return "صباحي";
        }
        if(role === "WED_THU") {
            if(day === 3 || day === 4) return "أوف";
            if(day === 5) return "تغطية"; // دوام الجمعة
            return (day === 6) ? "صباحي" : "مسائي";
        }
        if(day === 5 || day === 6) return "أوف";
        return (role === "MORNING") ? "صباحي" : "مسائي";
    }

    function drawTable(data) {
        let html = '';
        data.forEach(row => {
            html += `<tr><td class="emp-name">${row.name}</td><td class="category">${row.cat}</td>`;
            row.shifts.forEach(s => {
                let label = (s === "تغطية") ? "جمعة" : s;
                html += `<td><span class="badge ${s}">${label}</span></td>`;
            });
            html += `</tr>`;
        });
        document.getElementById('tableBody').innerHTML = html;
    }

    function drawSummary(data) {
        let counts = { "صباحي": 0, "ليلي": 0, "مسائي": 0, "إجازات": 0 };
        data.forEach(row => {
            row.shifts.forEach(s => {
                if(s === "صباحي" || s === "تغطية") counts["صباحي"]++;
                else if(s === "ليلي") counts["ليلي"]++;
                else if(s === "مسائي") counts["مسائي"]++;
                else if(s === "إجازة") counts["إجازات"]++;
            });
        });

        const labels = ["الصباحي", "الليلي", "المسائي", "الإجازات"];
        const keys = ["صباحي", "ليلي", "مسائي", "إجازات"];
        let sHtml = '';
        labels.forEach((l, i) => {
            sHtml += `<div class="sum-card"><div class="value">${counts[keys[i]]}</div><div class="label">${l}</div></div>`;
        });
        document.getElementById('summaryCards').innerHTML = sHtml;
    }
</script>
</body>
</html>
