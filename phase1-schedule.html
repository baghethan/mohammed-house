<section id="adminFields" class="panel">
  <div class="card admin-card">
    <div class="card-h" style="background: #0d4b73; color: #fff;">إدارة البنود</div>
    <div class="card-b">
      
      <div class="grid-form" style="margin-bottom: 20px;">
        <div class="field"><label>اسم البند</label><input id="f_label" placeholder="مثال: Upgrade Windows 10 to 11"></div>
        <div class="field"><label>نوع السؤال</label>
          <select id="f_type">
            <option value="text">Text</option>
            <option value="choice">سؤال خيارات</option>
            <option value="number">Number</option>
            <option value="boolean">صح / خطأ</option>
          </select>
        </div>
        <div class="field"><label>الترتيب</label><input id="f_order" type="number" value="1"></div>
        <div class="field"><label>القسم</label><input id="f_section" placeholder="Systems Assessment"></div>
        <div class="field"><label>إجباري؟</label><select id="f_req"><option value="true">نعم</option><option value="false">لا</option></select></div>
        <div class="field"><label>نشط؟</label><select id="f_active"><option value="true">نعم</option><option value="false">لا</option></select></div>
      </div>

      <div class="section-title">الظهور الشرطي</div>
      <div class="logic-container-dashed">
        <div class="grid-form">
          <div class="field"><label>تفعيل الشرط؟</label><select id="f_logic_enabled"><option value="false">لا</option><option value="true">نعم</option></select></div>
          <div class="field"><label>يعتمد على بند</label><select id="f_logic_ref"><option value="">اختر بنداً</option></select></div>
          <div class="field"><label>المشغّل</label><select><option>يساوي</option></select></div>
          <div class="field"><label>القيمة</label><input id="f_logic_val" placeholder="yes"></div>
        </div>
      </div>

      <div class="section-title" style="margin-top: 20px;">التكرار حسب العدد</div>
      <div class="logic-container-dashed">
        <div class="grid-form">
          <div class="field"><label>تفعيل التكرار؟</label><select id="f_repeat_enabled"><option value="false">لا</option><option value="true">نعم</option></select></div>
          <div class="field"><label>العدد من بند</label><select id="f_repeat_ref"><option value="">اختر بنداً عددياً</option></select></div>
          <div class="field"><label>قالب التسمية</label><input id="f_repeat_label" placeholder="رقم الموظف للجهاز {index}"></div>
          <div class="field"><label>الحفظ كمصفوفة؟</label><select><option value="true">نعم</option><option value="false">لا</option></select></div>
        </div>
      </div>

      <div class="section-title" style="margin-top: 20px;">الربط بعد الحفظ</div>
      <div class="logic-container-dashed">
        <div class="grid-form">
          <div class="field"><label>الهدف</label><select id="f_int_target"><option value="none">بدون</option><option value="windows_upgrades">windows_upgrades</option></select></div>
          <div class="field"><label>الربط بواسطة</label><select><option>employeeId</option></select></div>
          <div class="field"><label>نفّذ عند بند</label><select id="f_int_trigger"><option value="">بدون شرط</option></select></div>
          <div class="field"><label>وقيمته</label><input id="f_int_val" placeholder="yes"></div>
        </div>
      </div>

      <div style="margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px;">
        <button id="seedWindowsBtn" class="btn" style="background: #c47f00; color: #fff;">إنشاء مثال Upgrade Windows تلقائياً</button>
        <button id="clearBuilderBtn" class="btn" style="background: #fff; border: 1px solid #d7e0ea; color: #0d4b73;">تنظيف</button>
        <button id="saveFieldBtn" class="btn" style="background: #2f9e66; color: #fff;">حفظ البند</button>
      </div>
    </div>
  </div>
</section>

<style>
  /* تنسيقات إضافية لمطابقة الصورة تماماً */
  .logic-container-dashed {
    border: 1px dashed #d7e0ea;
    border-radius: 12px;
    padding: 15px;
    background: #fbfcfe;
    margin-bottom: 15px;
  }
  .section-title {
    font-weight: 800;
    color: #0d4b73;
    margin-bottom: 10px;
    padding-right: 10px;
    border-right: 4px solid #0d4b73;
  }
  .admin-card {
    border: 1px solid #d7e0ea;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  }
  .field label {
    margin-bottom: 5px;
    display: block;
    text-align: center; /* لمطابقة مظهر الصورة في التوسيط */
  }
  .field input, .field select {
    text-align: center;
  }
</style>
