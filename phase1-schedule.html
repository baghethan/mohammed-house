<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة الدوام - التعديل والحذف الكامل</title>
    <style>
        :root {
            --primary: #4a90e2; --bg: #f1f4f9;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #e9ecef; --off-text: #6c757d;
            --leave: #f8d7da; --leave-text: #721c24;
            --edit: #ffc107; --delete: #dc3545;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }
        .tabs { display: flex; gap: 5px; margin-bottom: -1px; }
        .tab { padding: 12px 25px; background: #e0e0e0; border-radius: 12px 12px 0 0; cursor: pointer; font-weight: bold; color: #666; border: 1px solid #ccc; border-bottom: none; }
        .tab.active { background: white; color: var(--primary); border-top: 4px solid var(--primary); }
        .content-card { background: white; padding: 30px; border-radius: 0 15px 15px 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 500px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #f0f0f0; padding: 12px; text-align: center; }
        th { background: #fafafa; color: #444; font-size: 14px; }
        .badge { border-radius: 10px; padding: 4px 12px; font-size: 12px; font-weight: bold; display: inline-block; min-width: 60px; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }
        .form-box { background: #f9f9f9; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #eee; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; align-items: flex-end; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        .btn-update { background: #28a745; color: white; }
        .btn-edit { background: var(--edit); color: #333; margin-left: 5px; }
        .btn-delete { background: var(--delete); color: white; }
        .cat-tag { display: inline-flex; align-items: center; background: #fff; border: 1px solid #ddd; padding: 5px 15px; border-radius: 20px; margin: 5px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="showTab('schedule-tab', this)">📅 جدول الدوام الأسبوعي</div>
        <div class="tab" onclick="showTab('admin-tab', this)">👥 إدارة الموظفين والفئات</div>
        <div class="tab" onclick="showTab('leave-tab', this)">🏖️ الإجازات الطويلة</div>
    </div>

    <div class="content-card">
        
        <div id="schedule-tab" class="tab-content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin:0; color:#2c3e50;">جدول الدوام (الجمعة أوف - السبت موظف)</h2>
                <input type="date" id="dateInput" onchange="renderSchedule()">
            </div>
            <table>
                <thead><tr id="headerRow"><th>الموظف</th><th>الفئة</th><th>الأحد</th><th>الاثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th><th>الجمعة</th><th>السبت</th></tr></thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>

        <div id="admin-tab" class="tab-content">
            <h3 id="formTitle">إضافة موظف جديد</h3>
            <div class="form-box">
                <input type="hidden" id="editEmpId"> <div class="grid-inputs">
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <label>اسم الموظف</label>
                        <input type="text" id="empName" placeholder="الاسم الكامل">
                    </div>
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <label>الفئة</label>
                        <select id="empCatSelect"></select>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <label>الشفت</label>
                        <select id="empRole">
                            <option value="MORNING">صباحي</option>
                            <option value="EVENING">مسائي</option>
                            <option value="FIXED">ليلي (ثابت)</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; padding-bottom:12px;">
                        <input type="checkbox" id="inRotation" checked>
                        <label for="inRotation" style="font-size:12px;">يدخل في تدوير السبت</label>
                    </div>
                    <button id="btnAction" class="btn btn-add" onclick="handleEmployeeAction()">+ إضافة الموظف</button>
                    <button id="btnCancel" class="btn" style="display:none; background:#6c757d; color:white;" onclick="cancelEdit()">إلغاء</button>
                </div>
            </div>

            <h3>قائمة الموظفين الحاليين</h3>
            <table>
                <thead>
                    <tr><th>الاسم</th><th>الفئة</th><th>النظام</th><th>التدوير</th><th>إجراءات التحكم</th></tr>
                </thead>
                <tbody id="adminListBody"></tbody>
            </table>
        </div>

        <div id="leave-tab" class="tab-content">
            <h2>تسجيل إجازة طويلة</h2>
            <div class="form-box">
                <div class="grid-inputs">
                    <select id="leaveEmpSelect"></select>
                    <input type="date" id="leaveStart">
                    <input type="date" id="leaveEnd">
                    <button class="btn btn-add" style="background:#f57c00;" onclick="addLongLeave()">تسجيل</button>
                </div>
            </div>
            <table>
                <thead><tr><th>الموظف</th><th>من</th><th>إلى</th><th>إجراء</th></tr></thead>
                <tbody id="leaveListBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let categories = JSON.parse(localStorage.getItem('categories')) || ["موظف اساسي", "مشرف", "مدير", "متدرب", "التمهير"];
    let employees = JSON.parse(localStorage.getItem('employees')) || [];
    let longLeaves = JSON.parse(localStorage.getItem('longLeaves')) || [];
    const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    window.onload = () => {
        const today = new Date();
        const sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('dateInput').valueAsDate = sun;
        renderAll();
    };

    function save() {
        localStorage.setItem('employees', JSON.stringify(employees));
        localStorage.setItem('longLeaves', JSON.stringify(longLeaves));
    }

    function handleEmployeeAction() {
        const id = document.getElementById('editEmpId').value;
        const name = document.getElementById('empName').value.trim();
        const cat = document.getElementById('empCatSelect').value;
        const role = document.getElementById('empRole').value;
        const inRotation = document.getElementById('inRotation').checked;

        if(!name) return alert("يرجى إدخال الاسم");

        if(id) { // حالة التعديل
            const index = employees.findIndex(e => e.id == id);
            employees[index] = { id: parseInt(id), name, cat, role, inRotation };
            cancelEdit();
        } else { // حالة الإضافة
            employees.push({ id: Date.now(), name, cat, role, inRotation });
        }
        
        document.getElementById('empName').value = "";
        save(); renderAll();
    }

    function startEdit(id) {
        const emp = employees.find(e => e.id == id);
        document.getElementById('editEmpId').value = emp.id;
        document.getElementById('empName').value = emp.name;
        document.getElementById('empCatSelect').value = emp.cat;
        document.getElementById('empRole').value = emp.role;
        document.getElementById('inRotation').checked = emp.inRotation;
        
        document.getElementById('formTitle').innerText = "تعديل بيانات الموظف";
        document.getElementById('btnAction').innerText = "حفظ التغييرات";
        document.getElementById('btnAction').className = "btn btn-update";
        document.getElementById('btnCancel').style.display = "inline-block";
    }

    function cancelEdit() {
        document.getElementById('editEmpId').value = "";
        document.getElementById('empName').value = "";
        document.getElementById('formTitle').innerText = "إضافة موظف جديد";
        document.getElementById('btnAction').innerText = "+ إضافة الموظف";
        document.getElementById('btnAction').className = "btn btn-add";
        document.getElementById('btnCancel').style.display = "none";
    }

    function deleteEmp(id) {
        if(confirm("هل أنت متأكد من إنهاء خدمة الموظف؟ سيتم حذفه نهائياً من كافة السجلات.")) {
            employees = employees.filter(e => e.id !== id);
            longLeaves = longLeaves.filter(l => l.empId !== id);
            save(); renderAll();
        }
    }

    function renderAll() {
        renderCategories();
        renderAdminList();
        renderLeaveUI();
        renderSchedule();
    }

    function renderCategories() {
        document.getElementById('empCatSelect').innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderAdminList() {
        document.getElementById('adminListBody').innerHTML = employees.map(e => `
            <tr>
                <td style="text-align:right; font-weight:bold;">${e.name}</td>
                <td>${e.cat}</td>
                <td>${e.role}</td>
                <td>${e.inRotation ? '✅' : '🛑'}</td>
                <td>
                    <button class="btn btn-edit" onclick="startEdit(${e.id})">تعديل</button>
                    <button class="btn btn-delete" onclick="deleteEmp(${e.id})">حذف / إنهاء خدمة</button>
                </td>
            </tr>
        `).join('');
    }

    // وظائف الإجازات والجدول تتبع نفس منطق النسخ السابقة لضمان الدقة
    function addLongLeave() {
        longLeaves.push({ id: Date.now(), empId: parseInt(document.getElementById('leaveEmpSelect').value), start: document.getElementById('leaveStart').value, end: document.getElementById('leaveEnd').value });
        save(); renderAll();
    }
    function deleteLeave(id) { longLeaves = longLeaves.filter(l => l.id !== id); save(); renderAll(); }

    function renderLeaveUI() {
        document.getElementById('leaveEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        document.getElementById('leaveListBody').innerHTML = longLeaves.map(l => {
            const emp = employees.find(e => e.id === l.empId);
            return `<tr><td>${emp?emp.name:'-'}</td><td>${l.start}</td><td>${l.end}</td><td><button class="btn btn-delete" onclick="deleteLeave(${l.id})">حذف</button></td></tr>`;
        }).join('');
    }

    function renderSchedule() {
        const start = new Date(document.getElementById('dateInput').value);
        const isEven = Math.ceil(start.getDate() / 7) % 2 === 0;
        const rotating = employees.filter(e => e.inRotation);

        document.getElementById('scheduleBody').innerHTML = employees.map(emp => {
            let row = `<tr><td style="text-align:right; font-weight:bold;">${emp.name}</td><td style="color:#888">${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let s = calculateShift(emp, d, isEven, curr, rotating);
                row += `<td><span class="badge ${s}">${s}</span></td>`;
            }
            return row + `</tr>`;
        }).join('');
    }

    function calculateShift(emp, day, isEven, currDate, rotating) {
        if(longLeaves.find(l => { let s=new Date(l.start); let e=new Date(l.end); currDate.setHours(0,0,0,0); return l.empId===emp.id && currDate>=s && currDate<=e; })) return "إجازة";
        if(day === 5) return "أوف"; 
        if(emp.role === "FIXED") return (day <= 4) ? "ليلي" : "أوف";
        if(day === 6) { 
            const idx = rotating.findIndex(r => r.id === emp.id);
            return ((idx === 0 && !isEven) || (idx === 1 && isEven)) ? "صباحي" : "أوف";
        }
        if(day === 4) {
            const idx = rotating.findIndex(r => r.id === emp.id);
            if((idx === 0 && !isEven) || (idx === 1 && isEven)) return "أوف";
        }
        return (emp.role === "MORNING") ? "صباحي" : "مسائي";
    }

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    }
</script>
</body>
</html>
