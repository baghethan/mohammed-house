<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة الدوام الأسبوعي المتطور</title>
    <style>
        :root {
            --bg-body: #f1f4f9;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #e9ecef; --off-text: #6c757d;
            --leave: #f8d7da; --leave-text: #721c24;
            --oncall: #d1ecf1; --oncall-text: #0c5460;
            --cover: #d4edda; --cover-text: #155724;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-body); padding: 20px; margin: 0; }
        .main-card { background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 25px; max-width: 1350px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .legend { display: flex; gap: 8px; flex-wrap: wrap; }
        .legend-item { padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: 500; }
        
        /* Dashboard for Adding Employees */
        .admin-panel { background: #f8fafc; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 15px; align-items: flex-end; border: 1px solid #e2e8f0; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-add { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-add:hover { background: #218838; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #f0f0f0; padding: 10px 5px; text-align: center; }
        th { background: #fafafa; color: #333; font-weight: 600; font-size: 13px; }
        
        .badge { border-radius: 12px; padding: 3px 10px; font-size: 11px; font-weight: bold; display: inline-block; min-width: 55px; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }
        .تغطية { background: var(--cover); color: var(--cover-text); }

        .summary-container { display: flex; gap: 15px; margin-top: 25px; }
        .sum-card { flex: 1; background: white; border: 1px solid #eee; border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .sum-card .label { font-weight: bold; color: #666; font-size: 14px; }
        .sum-card .value { font-size: 20px; font-weight: bold; color: #333; }

        .emp-name { font-weight: bold; text-align: right; color: #444; width: 200px; display: flex; justify-content: space-between; align-items: center; }
        .category { color: #888; font-size: 12px; }
        .btn-delete { color: #dc3545; cursor: pointer; font-size: 16px; margin-right: 10px; border:none; background:none; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <div class="legend">
            <span class="legend-item صباحي">صباحي</span>
            <span class="legend-item ليلي">ليلي</span>
            <span class="legend-item مسائي">مسائي</span>
            <span class="legend-item إجازة">إجازة</span>
            <span class="legend-item تغطية">تغطية</span>
            <span class="legend-item أوف">أوف</span>
        </div>
        <div style="font-weight: bold; font-size: 22px; color: #2d3748;">إدارة الموظفين والجدولة</div>
    </div>

    <div class="admin-panel">
        <div class="input-group">
            <label>اسم الموظف</label>
            <input type="text" id="newName" placeholder="مثال: خالد محمد">
        </div>
        <div class="input-group">
            <label>الفئة</label>
            <select id="newCat">
                <option value="موظف">موظف</option>
                <option value="مشرف">مشرف</option>
                <option value="مدير">مدير</option>
            </select>
        </div>
        <div class="input-group">
            <label>الدور الوظيفي</label>
            <select id="newRole">
                <option value="MORNING">صباحي (أحد-خميس)</option>
                <option value="EVENING">مسائي (أحد-خميس)</option>
                <option value="FIXED">ليلي (ثابت)</option>
            </select>
        </div>
        <button class="btn-add" onclick="addEmployee()">+ إضافة للجدول</button>
        <div style="margin-right: auto;">
            <label>الأسبوع: </label>
            <input type="date" id="dateInput" onchange="renderAll()">
        </div>
    </div>

    <table>
        <thead>
            <tr id="headerDates">
                <th>الموظف</th>
                <th>الفئة</th>
                </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="summary-container" id="summaryCards"></div>
