<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almajdouie Motors - National Day Logic v7.1</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning-bg: #e3f2fd; --morning-text: #1976d2;
            --night-bg: #f3e5f5; --night-text: #7b1fa2;
            --off-bg: #eeeeee; --off-text: #616161;
            --h-bg: #fff9c4; --h-text: #fbc02d; /* لون الإجازة الرسمية */
            --btn-edit: #1a3a5f; --btn-night: #512da8; --btn-stop: #e65100; --btn-del: #b71c1c;
        }

        body { margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; background-image: url('image_dba186.png'); background-size: cover; background-attachment: fixed; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .toolbar { width: 100%; max-width: 1250px; background: var(--primary-blue); padding: 12px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .glass-container { width: 100%; max-width: 1250px; background: rgba(255, 255, 255, 0.98); border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .logo-img { max-height: 55px; }
        .tabs { display: flex; gap: 25px; margin-bottom: 20px; }
        .tab { cursor: pointer; font-weight: bold; color: #555; padding-bottom: 5px; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--primary-blue); border-bottom-color: var(--primary-blue); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px 8px; text-align: center; border: 1px solid #f0f0f0; }
        th { background: #fbfbfb; color: var(--primary-blue); }
        .badge { border-radius: 6px; padding: 6px 10px; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; min-width: 90px; justify-content: center; }
        .Morning, .صباحي { background: var(--morning-bg); color: var(--morning-text); }
        .Night, .ليلي { background: var(--night-bg); color: var(--night-text); }
        .Off, .أوف { background: var(--off-bg); color: var(--off-text); }
        .Holiday, .إجازة { background: var(--h-bg); color: var(--h-text); border: 1px solid #fdd835; }
        .form-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: flex-end; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>

<div class="toolbar">
    <div style="display:flex; gap:10px">
        <button class="btn-tool" onclick="window.changeWeek(7)">Next Week</button>
        <button class="btn-tool" onclick="window.setCurrentWeek()">Current Week</button>
        <button class="btn-tool" onclick="window.changeWeek(-7)">Previous Week</button>
    </div>
    <button class="btn-tool" style="background:#ffc107" onclick="window.toggleLanguage()">AR / EN</button>
</div>

<div class="glass-container">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" class="logo-img">
            <div>
                <div style="font-weight: 900; font-size: 18px; color: var(--primary-blue);">Almajdouie Motors Company</div>
                <div style="font-size: 10px; color: #555;">Scheduling System v7.1</div>
            </div>
        </div>
        <div id="mainTitle" style="font-weight: 900; font-size: 20px;">Schedule Dashboard</div>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab1" onclick="window.switchTab('schedule', this)">🗓️ Schedule</div>
        <div class="tab" id="tab2" onclick="window.switchTab('admin', this)">👥 Employees</div>
        <div class="tab" id="tab3" onclick="window.switchTab('holidays', this)">🎊 Public Holidays</div>
    </div>

    <div id="schedule" class="tab-content active">
        <input type="date" id="datePicker" onchange="window.renderAll()" style="margin-bottom:15px">
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <div class="form-box">
            <input type="text" id="inpName" placeholder="Name">
            <input type="text" id="inpJob" placeholder="Job Title">
            <button class="btn-tool" style="background:var(--primary-blue); color:white" onclick="window.handleEmployeeSubmit()">Save</button>
        </div>
        <table><thead><tr><th>Employee</th><th>Actions</th></tr></thead><tbody id="adminList"></tbody></table>
    </div>

    <div id="holidays" class="tab-content">
        <div class="form-box" style="background:#fff9c4">
            <div style="display:flex; flex-direction:column; gap:5px"><label>Employee to Work:</label><select id="hEmpSelect"></select></div>
            <div style="display:flex; flex-direction:column; gap:5px"><label>From:</label><input type="date" id="hStart"></div>
            <div style="display:flex; flex-direction:column; gap:5px"><label>To:</label><input type="date" id="hEnd"></div>
            <div style="display:flex; flex-direction:column; gap:5px"><label>Holiday Name:</label><input type="text" id="hName" placeholder="e.g. National Day"></div>
            <button class="btn-tool" style="background:#fbc02d" onclick="window.addHolidayDuty()">Add Assignment</button>
        </div>
        <table><thead><tr><th>Holiday</th><th>Working Staff</th><th>Period</th><th>Action</th></tr></thead><tbody id="holidayBody"></tbody></table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let employees = [], holidayDuties = [], currentLang = 'en';

    window.switchTab = (id, btn) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    };

    window.toggleLanguage = () => {
        currentLang = currentLang === 'en' ? 'ar' : 'en';
        document.getElementById('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        window.renderAll();
    };

    onSnapshot(doc(db, "schedule", "jadwal_v6"), (snap) => {
        if(snap.exists()){ employees = snap.data().data.emps || []; window.renderAll(); }
    });

    onSnapshot(doc(db, "schedule", "jadwal_holidays"), (snap) => {
        if(snap.exists()){ holidayDuties = snap.data().duties || []; window.renderAll(); }
    });

    window.renderAll = () => {
        const start = new Date(document.getElementById('datePicker').value);
        const t = { 
            morning: currentLang === 'ar' ? 'صباحي' : 'Morning', 
            night: currentLang === 'ar' ? 'ليلي' : 'Night', 
            off: currentLang === 'ar' ? 'أوف' : 'Off', 
            h: currentLang === 'ar' ? 'إجازة' : 'Holiday' 
        };
        
        // Rotation Helper
        const firstDay = new Date(start.getFullYear(), 0, 1);
        const weekNum = Math.ceil((((start - firstDay) / 86400000) + firstDay.getDay() + 1) / 7);
        const rotatingStaff = employees.filter(e => e.rotates && e.active);

        // Header
        let h = `<th>${currentLang === 'en' ? 'Employee' : 'الموظف'}</th>`;
        const days = currentLang === 'en' ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${days[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        // Table Content
        document.getElementById('scheduleBody').innerHTML = employees.filter(e => e.active).map(emp => {
            let row = `<tr><td style="text-align:left"><b>${emp.name}</b></td>`;
            
            let isRotatingThisWeek = false;
            if (emp.rotates && rotatingStaff.length > 0) {
                if (rotatingStaff[weekNum % rotatingStaff.length].id === emp.id) isRotatingThisWeek = true;
            }

            for(let d=0; d<7; d++) {
                let cellDate = new Date(start); cellDate.setDate(start.getDate() + d);
                cellDate.setHours(0,0,0,0);

                // --- CRITICAL HOLIDAY LOGIC ---
                const activeDuty = holidayDuties.find(duty => {
                    const ds = new Date(duty.start); ds.setHours(0,0,0,0);
                    const de = new Date(duty.end); de.setHours(0,0,0,0);
                    return cellDate >= ds && cellDate <= de;
                });

                let shift = "";
                if (activeDuty) {
                    // إذا كان هذا اليوم هو إجازة رسمية مسجلة
                    if (activeDuty.empId === emp.id) {
                        // الموظف المختار فقط هو من يداوم
                        shift = emp.fixed ? t.night : t.morning;
                    } else {
                        // بقية الموظفين تظهر لهم "إجازة"
                        shift = t.h;
                    }
                } else {
                    // المنطق العادي
                    if (d === 5) shift = t.off;
                    else if (d === 6) shift = isRotatingThisWeek ? (emp.fixed ? t.night : t.morning) : t.off;
                    else if (d === 4) shift = isRotatingThisWeek ? t.off : (emp.fixed ? t.night : t.morning);
                    else shift = emp.fixed ? t.night : t.morning;
                }

                let icon = shift.includes('Morning') || shift.includes('صباحي') ? '☀️' : (shift.includes('Night') || shift.includes('ليلي') ? '🌙' : '');
                let badgeClass = shift === t.h ? 'Holiday' : (shift === t.off ? 'Off' : (shift.includes('Night') || shift.includes('ليلي') ? 'Night' : 'Morning'));
                
                row += `<td><span class="badge ${badgeClass}">${icon} ${shift}</span></td>`;
            }
            return row + "</tr>";
        }).join('');

        updateAdminAndHolidayLists();
    };

    function updateAdminAndHolidayLists() {
        // Admin List
        document.getElementById('adminList').innerHTML = employees.map((e, i) => `
            <tr><td style="text-align:left"><b>${e.name}</b></td>
            <td><button class="btn-tool" style="background:#f0f0f0" onclick="window.startEdit('${i}')">Edit</button></td></tr>
        `).join('');

        // Holiday assignment select
        document.getElementById('hEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');

        // Duty table
        document.getElementById('holidayBody').innerHTML = holidayDuties.map((d, i) => {
            const emp = employees.find(e => e.id === d.empId);
            return `<tr><td>${d.name}</td><td>${emp?emp.name:'-'}</td><td>${d.start} to ${d.end}</td><td><button class="btn-tool" style="background:#ff4444; color:white" onclick="window.delDuty(${i})">X</button></td></tr>`;
        }).join('');
    }

    // Firebase Sync
    window.addHolidayDuty = async () => {
        const d = { 
            empId: document.getElementById('hEmpSelect').value, 
            start: document.getElementById('hStart').value, 
            end: document.getElementById('hEnd').value, 
            name: document.getElementById('hName').value 
        };
        if(!d.start || !d.end || !d.name) return alert("Please fill all holiday duty fields.");
        let arr = [...holidayDuties, d];
        await updateDoc(doc(db, "schedule", "jadwal_holidays"), { duties: arr });
        document.getElementById('hName').value = "";
    };

    window.delDuty = async (idx) => {
        let arr = [...holidayDuties]; arr.splice(idx, 1);
        await updateDoc(doc(db, "schedule", "jadwal_holidays"), { duties: arr });
    };

    window.setCurrentWeek = () => { let t = new Date(); let s = new Date(t.setDate(t.getDate() - t.getDay())); document.getElementById('datePicker').valueAsDate = s; window.renderAll(); };
    window.changeWeek = (v) => { let d = new Date(document.getElementById('datePicker').value); d.setDate(d.getDate() + v); document.getElementById('datePicker').valueAsDate = d; window.renderAll(); };

    document.getElementById('datePicker').valueAsDate = new Date();
    window.setCurrentWeek();
</script>
</body>
</html>
