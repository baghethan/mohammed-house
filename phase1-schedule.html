<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almajdouie Motors - Holiday Management v6.3</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning-bg: #e3f2fd; --morning-text: #1976d2;
            --night-bg: #f3e5f5; --night-text: #7b1fa2;
            --off-bg: #eeeeee; --off-text: #616161;
            --holiday-bg: #fff9c4; --holiday-text: #fbc02d;
            --btn-edit: #1a3a5f; --btn-night: #512da8; --btn-stop: #e65100; --btn-del: #b71c1c; --btn-rotate: #00796b;
        }

        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;
            background-image: url('image_dba186.png'); background-size: cover; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }

        .toolbar {
            width: 100%; max-width: 1250px; background: var(--primary-blue);
            padding: 12px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }

        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-lang { background: #ffc107; color: #000; }

        .glass-container { width: 100%; max-width: 1250px; background: rgba(255, 255, 255, 0.98); border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px; }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .logo-img { max-height: 55px; }

        .tabs { display: flex; gap: 20px; margin-bottom: 20px; overflow-x: auto; }
        .tab { cursor: pointer; font-weight: bold; color: #555; padding: 5px 10px; border-bottom: 3px solid transparent; transition: 0.3s; white-space: nowrap; }
        .tab.active { color: var(--primary-blue); border-bottom-color: var(--primary-blue); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { padding: 10px 5px; text-align: center; border: 1px solid #f0f0f0; }
        th { background: #fbfbfb; color: var(--primary-blue); font-weight: 800; }

        .badge { border-radius: 6px; padding: 5px 8px; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; min-width: 85px; justify-content: center; }
        .Morning, .صباحي { background: var(--morning-bg); color: var(--morning-text); }
        .Night, .ليلي { background: var(--night-bg); color: var(--night-text); }
        .Off, .أوف { background: var(--off-bg); color: var(--off-text); }
        .Holiday, .إجازة { background: var(--holiday-bg); color: var(--holiday-text); }

        .btn-action { border: none; border-radius: 6px; padding: 5px 10px; color: white; font-weight: bold; cursor: pointer; font-size: 10px; display: inline-flex; align-items: center; gap: 4px; min-width: 90px; justify-content: center; }
        .row-edit { background: var(--btn-edit); } .row-del { background: var(--btn-del); }

        .form-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #666; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }

        [dir="rtl"] .toolbar { flex-direction: row-reverse; }
    </style>
</head>
<body>

<div class="toolbar">
    <div style="display:flex; gap:10px">
        <button class="btn-tool" onclick="window.changeWeek(7)">Next Week</button>
        <button class="btn-tool" onclick="window.setCurrentWeek()">Current Week</button>
        <button class="btn-tool" onclick="window.changeWeek(-7)">Previous Week</button>
    </div>
    <div style="display:flex; gap:10px">
        <button class="btn-tool btn-lang" onclick="window.toggleLanguage()">AR / EN</button>
        <button class="btn-tool" onclick="window.print()">Print PDF</button>
    </div>
</div>

<div class="glass-container">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" class="logo-img">
            <div>
                <div id="companyName" style="font-weight: 900; font-size: 18px; color: var(--primary-blue);">Almajdouie Motors Company</div>
                <div id="systemSub" style="font-size: 10px; color: #555;">Scheduling Management System</div>
            </div>
        </div>
        <div id="mainTitle" style="font-weight: 900; font-size: 20px;">Schedule Dashboard</div>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab1" onclick="window.switchTab('schedule', this)">🗓️ Schedule</div>
        <div class="tab" id="tab2" onclick="window.switchTab('admin', this)">👥 Employees</div>
        <div class="tab" id="tab3" onclick="window.switchTab('holidays', this)">🎊 Public Holidays</div>
    </div>

    <div id="schedule" class="tab-content active">
        <input type="date" id="datePicker" onchange="window.renderAll()" style="margin-bottom:15px">
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <div class="form-box">
            <input type="hidden" id="editEmpId"><div class="form-group"><label>Name:</label><input type="text" id="inpName"></div>
            <div class="form-group"><label>Job Title:</label><input type="text" id="inpJob"></div>
            <button class="btn-tool" style="background:var(--primary-blue); color:white" onclick="window.handleEmployeeSubmit()">Save</button>
        </div>
        <table>
            <thead><tr><th>Employee Info</th><th>Actions</th></tr></thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>

    <div id="holidays" class="tab-content">
        <h3 id="holidayTitle">Add Holiday Duty (One Works, Others Off)</h3>
        <div class="form-box" style="background: #fff9c4;">
            <div class="form-group"><label>Select Employee to Work:</label><select id="hEmpSelect"></select></div>
            <div class="form-group"><label>From Date:</label><input type="date" id="hStart"></div>
            <div class="form-group"><label>To Date:</label><input type="date" id="hEnd"></div>
            <div class="form-group"><label>Holiday Name:</label><input type="text" id="hName" placeholder="e.g. National Day"></div>
            <button class="btn-tool" style="background:#fbc02d; color:#000" onclick="window.addHolidayDuty()">Save Holiday Duty</button>
        </div>
        <table>
            <thead><tr><th>Holiday Name</th><th>Employee Working</th><th>Period</th><th>Action</th></tr></thead>
            <tbody id="holidayListBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let employees = [], holidayDuties = [], currentLang = 'en';

    const tMap = {
        en: { morning: "Morning", night: "Night", off: "Off", holiday: "Holiday", edit: "Edit", del: "Delete" },
        ar: { morning: "صباحي", night: "ليلي", off: "أوف", holiday: "إجازة", edit: "تعديل", del: "حذف" }
    };

    window.switchTab = (id, btn) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
    };

    window.toggleLanguage = () => {
        currentLang = currentLang === 'en' ? 'ar' : 'en';
        document.getElementById('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        window.renderAll();
    };

    // --- Database Fetch ---
    onSnapshot(doc(db, "schedule", "jadwal_v6"), (snap) => {
        if(snap.exists()){ employees = snap.data().data.emps || []; window.renderAll(); }
    });

    onSnapshot(doc(db, "schedule", "jadwal_holidays"), (snap) => {
        if(snap.exists()){ holidayDuties = snap.data().duties || []; window.renderAll(); }
    });

    window.renderAll = () => {
        const t = tMap[currentLang];
        const start = new Date(document.getElementById('datePicker').value);
        
        // Rotation & Header
        const firstDay = new Date(start.getFullYear(), 0, 1);
        const weekNum = Math.ceil((((start - firstDay) / 86400000) + firstDay.getDay() + 1) / 7);
        const rotatingStaff = employees.filter(e => e.rotates && e.active);

        let h = `<th>${currentLang === 'en' ? 'Employee' : 'الموظف'}</th>`;
        const days = currentLang === 'en' ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${days[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        // Schedule Logic
        document.getElementById('scheduleBody').innerHTML = employees.filter(e => e.active).map(emp => {
            let row = `<tr><td style="text-align:left; padding-left:10px"><b>${emp.name}</b></td>`;
            
            let isRotatingThisWeek = false;
            if (emp.rotates && rotatingStaff.length > 0) {
                if (rotatingStaff[weekNum % rotatingStaff.length].id === emp.id) isRotatingThisWeek = true;
            }

            for(let d=0; d<7; d++) {
                let currDate = new Date(start); currDate.setDate(start.getDate() + d);
                currDate.setHours(0,0,0,0);

                // --- HOLIDAY DUTY LOGIC ---
                const activeDuty = holidayDuties.find(duty => {
                    const ds = new Date(duty.start); const de = new Date(duty.end);
                    return currDate >= ds && currDate <= de;
                });

                let shiftText = "";
                if (activeDuty) {
                    // إذا وجدنا تكليف إجازة في هذا اليوم:
                    if (activeDuty.empId === emp.id) {
                        // الموظف المكلف يداوم
                        shiftText = emp.fixed ? t.night : t.morning;
                    } else {
                        // البقية إجازة رسمية
                        shiftText = t.holiday;
                    }
                } else {
                    // المنطق الطبيعي (جمعة وسبت أوف)
                    if (d === 5) shiftText = t.off;
                    else if (d === 6) shiftText = isRotatingThisWeek ? (emp.fixed ? t.night : t.morning) : t.off;
                    else if (d === 4) shiftText = isRotatingThisWeek ? t.off : (emp.fixed ? t.night : t.morning);
                    else shiftText = emp.fixed ? t.night : t.morning;
                }

                let icon = (shiftText === t.morning) ? '☀️' : (shiftText === t.night ? '🌙' : '');
                row += `<td><span class="badge ${shiftText}">${icon} ${shiftText}</span></td>`;
            }
            return row + "</tr>";
        }).join('');

        renderAdminLists();
    };

    function renderAdminLists() {
        // Admin
        document.getElementById('adminList').innerHTML = employees.map((e, idx) => `
            <tr><td><b>${e.name}</b></td><td><button class="btn-action row-edit" onclick="window.startEdit('${idx}')">Edit</button></td></tr>
        `).join('');
        // Holiday duty Tab
        document.getElementById('hEmpSelect').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        document.getElementById('holidayListBody').innerHTML = holidayDuties.map((d, idx) => {
            const emp = employees.find(e => e.id === d.empId);
            return `<tr><td>${d.name}</td><td>${emp?emp.name:'-'}</td><td>${d.start} to ${d.end}</td><td><button class="btn-tool" style="background:#ff4444; color:white" onclick="window.delHolidayDuty(${idx})">X</button></td></tr>`;
        }).join('');
    }

    window.addHolidayDuty = async () => {
        const empId = document.getElementById('hEmpSelect').value;
        const start = document.getElementById('hStart').value;
        const end = document.getElementById('hEnd').value;
        const name = document.getElementById('hName').value;
        if(!start || !end || !name) return alert("Fill all fields");
        
        const newDuties = [...holidayDuties, { empId, start, end, name }];
        await updateDoc(doc(db, "schedule", "jadwal_holidays"), { duties: newDuties });
        document.getElementById('hName').value = "";
    };

    window.delHolidayDuty = async (idx) => {
        let newDuties = [...holidayDuties]; newDuties.splice(idx, 1);
        await updateDoc(doc(db, "schedule", "jadwal_holidays"), { duties: newDuties });
    };

    window.setCurrentWeek = () => { let t = new Date(); let s = new Date(t.setDate(t.getDate() - t.getDay())); document.getElementById('datePicker').valueAsDate = s; window.renderAll(); };
    window.changeWeek = (v) => { let d = new Date(document.getElementById('datePicker').value); d.setDate(d.getDate() + v); document.getElementById('datePicker').valueAsDate = d; window.renderAll(); };

    document.getElementById('datePicker').valueAsDate = new Date();
    window.setCurrentWeek();
</script>
</body>
</html>
