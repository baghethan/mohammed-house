<!DOCTYPE html>
<html lang="en" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - Almajdouie</title>
    <style>
        :root {
            --primary-blue: #0d2149;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: #eeeeee; --off-text: #555;
            --leave: #f8d7da; --leave-text: #721c24;
            /* Action Button Colors */
            --btn-edit: #1a3a5f; --btn-night: #512da8; --btn-stop: #e65100; --btn-del: #b71c1c;
        }

        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;
            background-image: url('image_dba186.png'); background-size: cover; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; transition: 0.3s;
        }

        .toolbar {
            width: 100%; max-width: 1250px; background: var(--primary-blue);
            padding: 12px 20px; border-radius: 12px; display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px;
        }

        .btn-tool { background: white; color: var(--primary-blue); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-lang { background: #ffc107; color: #000; }

        .glass-container { width: 100%; max-width: 1250px; background: rgba(255, 255, 255, 0.98); border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px; }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .logo-img { max-height: 55px; }

        .tabs { display: flex; gap: 25px; margin-bottom: 20px; }
        .tab { cursor: pointer; font-weight: bold; color: #555; padding-bottom: 5px; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--primary-blue); border-bottom-color: var(--primary-blue); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 12px 8px; text-align: center; border: 1px solid #f0f0f0; }
        th { background: #fbfbfb; color: var(--primary-blue); font-weight: 800; }

        .badge { border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; min-width: 70px; justify-content: center; }
        .Morning, .صباحي { background: var(--morning); color: var(--morning-text); }
        .Night, .ليلي { background: var(--night); color: var(--night-text); }
        .Off, .أوف { background: var(--off); color: var(--off-text); }

        .btn-action { border: none; border-radius: 6px; padding: 6px 12px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }
        .row-edit { background: var(--btn-edit); } .row-night { background: var(--btn-night); } .row-stop { background: var(--btn-stop); } .row-del { background: var(--btn-del); }
        .row-active { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }

        .form-box { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }

        [dir="rtl"] .tabs, [dir="rtl"] .header-top { flex-direction: row; }
        [dir="rtl"] .toolbar { flex-direction: row-reverse; }
    </style>
</head>
<body>

<div class="toolbar">
    <div style="display:flex; gap:10px">
        <button class="btn-tool" onclick="window.changeWeek(7)">Next Week</button>
        <button class="btn-tool" onclick="window.setCurrentWeek()">Current Week</button>
        <button class="btn-tool" onclick="window.changeWeek(-7)">Previous Week</button>
    </div>
    <div style="display:flex; gap:10px">
        <button class="btn-tool btn-lang" id="langBtn" onclick="window.toggleLanguage()">عربي / English</button>
        <button class="btn-tool" onclick="window.print()">Print PDF</button>
    </div>
</div>

<div class="glass-container">
    <div class="header-top">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" class="logo-img">
            <div>
                <div id="companyName" style="font-weight: 900; font-size: 18px; color: var(--primary-blue);">Almajdouie Motors Company</div>
                <div id="systemSub" style="font-size: 10px; color: #555;">Scheduling Management System</div>
            </div>
        </div>
        <div id="mainTitle" style="font-weight: 900; font-size: 22px;">Schedule Dashboard</div>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab1" onclick="window.switchTab('schedule', this)">🗓️ Schedule</div>
        <div class="tab" id="tab2" onclick="window.switchTab('admin', this)">👥 Employee Management</div>
        <div class="tab" id="tab3" onclick="window.switchTab('vacations', this)">🏖️ Vacations</div>
    </div>

    <div id="schedule" class="tab-content active">
        <input type="date" id="datePicker" onchange="window.renderAll()">
        <table>
            <thead><tr id="headerDates"></tr></thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <div id="admin" class="tab-content">
        <div class="form-box">
            <input type="hidden" id="editEmpId">
            <input type="text" id="newEmpName" placeholder="Name">
            <select id="newEmpCat"><option>Staff</option><option>Supervisor</option><option>Manager</option></select>
            <select id="newEmpRole"><option value="MORNING">Morning</option><option value="FIXED">Night</option></select>
            <button id="btnSubmit" class="btn-tool" style="background:var(--primary-blue); color:white" onclick="window.handleEmployeeSubmit()">Save</button>
        </div>
        <table>
            <thead><tr><th id="thName">Name</th><th id="thActions">Status & Actions</th></tr></thead>
            <tbody id="adminList"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBsvEEHEgBuw9pDml-Om90mm8MLDw8gWs",
        authDomain: "baghethan-ba325.firebaseapp.com",
        projectId: "baghethan-ba325",
        storageBucket: "baghethan-ba325.firebasestorage.app",
        messagingSenderId: "944819735112",
        appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let employees = [], vacations = [], currentLang = 'en';

    const translations = {
        en: { company: "Almajdouie Motors Company", sub: "Scheduling Management System", title: "Schedule Dashboard", tab1: "🗓️ Schedule", tab2: "👥 Employee Management", tab3: "🏖️ Vacations", morning: "Morning", night: "Night", off: "Off", save: "Save", edit: "Edit ✏️", setNight: "Set Night 🌙", stop: "Stop ⏸️", enable: "Enable ✅", del: "Delete ❌" },
        ar: { company: "شركة المجدوعي للسيارات", sub: "نظام إدارة الجدولة", title: "لوحة تحكم الجدول", tab1: "🗓️ الجدول", tab2: "👥 إدارة الموظفين", tab3: "🏖️ الإجازات", morning: "صباحي", night: "ليلي", off: "أوف", save: "حفظ", edit: "تعديل ✏️", setNight: "تثبيت ليل 🌙", stop: "إيقاف ⏸️", enable: "تفعيل ✅", del: "حذف ❌" }
    };

    // CRITICAL: Attach all functions to window to solve "Not a function" error
    window.toggleLanguage = () => {
        currentLang = currentLang === 'en' ? 'ar' : 'en';
        document.getElementById('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        updateUI();
        window.renderAll();
    };

    function updateUI() {
        const t = translations[currentLang];
        document.getElementById('companyName').innerText = t.company;
        document.getElementById('systemSub').innerText = t.sub;
        document.getElementById('mainTitle').innerText = t.title;
        document.getElementById('tab1').innerText = t.tab1;
        document.getElementById('tab2').innerText = t.tab2;
        document.getElementById('tab3').innerText = t.tab3;
        document.getElementById('btnSubmit').innerText = t.save;
    }

    window.switchTab = (id, btn) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    };

    window.renderAll = () => {
        const t = translations[currentLang];
        const start = new Date(document.getElementById('datePicker').value);
        const days = currentLang === 'en' ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        
        // Header Render
        let h = `<th>${currentLang === 'en' ? 'Employee' : 'الموظف'}</th><th>${currentLang === 'en' ? 'Category' : 'الفئة'}</th>`;
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${days[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        // Schedule Render
        document.getElementById('scheduleBody').innerHTML = employees.filter(e => e.status !== 'inactive').map(emp => {
            let row = `<tr><td><b>${emp.name}</b></td><td>${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let shift = d >= 4 ? t.off : (emp.role === 'FIXED' ? t.night : t.morning);
                row += `<td><span class="badge ${shift}">${shift}</span></td>`;
            }
            return row + "</tr>";
        }).join('');

        // Admin Table Render
        document.getElementById('adminList').innerHTML = employees.map(e => `
            <tr>
                <td>${e.name}</td>
                <td style="display:flex; justify-content:center; gap:5px">
                    <button class="btn-action row-edit" onclick="window.startEdit('${e.id}')">${t.edit}</button>
                    <button class="btn-action row-night" onclick="window.setNightShift('${e.id}')">${t.setNight}</button>
                    <button class="btn-action row-stop" onclick="window.updateStatus('${e.id}', 'inactive')">${t.stop}</button>
                    <button class="btn-action row-active" onclick="window.updateStatus('${e.id}', 'active')">${t.enable}</button>
                    <button class="btn-action row-del" onclick="window.deleteEmployee('${e.id}')">${t.del}</button>
                </td>
            </tr>
        `).join('');
    };

    window.handleEmployeeSubmit = async () => {
        const name = document.getElementById('newEmpName').value;
        if(!name) return;
        await addDoc(collection(db, "employees"), { name, cat: document.getElementById('newEmpCat').value, role: document.getElementById('newEmpRole').value, status: 'active' });
        document.getElementById('newEmpName').value = "";
    };

    window.updateStatus = async (id, status) => { await updateDoc(doc(db, "employees", id), { status }); };
    window.setNightShift = async (id) => { await updateDoc(doc(db, "employees", id), { role: 'FIXED' }); };
    window.deleteEmployee = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "employees", id)); };
    window.setCurrentWeek = () => { let t = new Date(); let s = new Date(t.setDate(t.getDate() - t.getDay())); document.getElementById('datePicker').valueAsDate = s; window.renderAll(); };
    window.changeWeek = (v) => { let d = new Date(document.getElementById('datePicker').value); d.setDate(d.getDate() + v); document.getElementById('datePicker').valueAsDate = d; window.renderAll(); };

    onSnapshot(collection(db, "employees"), (s) => { employees = s.docs.map(d => ({ id: d.id, ...d.data() })); window.renderAll(); });
    document.getElementById('datePicker').valueAsDate = new Date();
    window.setCurrentWeek();
</script>
</body>
</html>
