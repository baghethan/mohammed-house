<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة المجدوعي للسيارات - نظام الجدولة</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.4);
            --primary-blue: #0d2149;
            --morning: #d1e9ff; --morning-text: #007bff;
            --evening: #fff3cd; --evening-text: #856404;
            --night: #f3e5f5; --night-text: #7b1fa2;
            --off: rgba(220, 220, 220, 0.6); --off-text: #555;
            --leave: #f8d7da; --leave-text: #721c24;
            --cover: #d4edda; --cover-text: #155724;
        }

        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            /* الخلفية الجديدة */
            background-image: url('image_dba186.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* شريط الأدوات العلوي */
        .toolbar {
            width: 100%; max-width: 1300px;
            background: rgba(13, 33, 73, 0.85);
            backdrop-filter: blur(15px);
            padding: 12px 20px; border-radius: 12px;
            display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-tool {
            background: white; color: var(--primary-blue); border: none;
            padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .btn-tool:hover { background: #e3f2fd; transform: translateY(-2px); }
        .btn-logout { background: #ffebee; color: #c62828; }

        /* الحاوية الزجاجية */
        .glass-container {
            width: 100%; max-width: 1250px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            padding: 25px;
        }

        .logo-img {
            max-height: 70px; /* حجم الشعار الجديد */
            width: auto;
        }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 10px; }
        .tab { padding: 10px 22px; border-radius: 10px; cursor: pointer; font-weight: bold; color: #444; }
        .tab.active { background: var(--primary-blue); color: white; }

        table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.4); border-radius: 15px; overflow: hidden; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.05); }
        th { background: rgba(255, 255, 255, 0.9); color: #333; font-weight: 800; font-size: 13px; }

        .badge { border-radius: 15px; padding: 4px 12px; font-size: 11px; font-weight: bold; display: inline-block; min-width: 60px; }
        .صباحي { background: var(--morning); color: var(--morning-text); }
        .مسائي { background: var(--evening); color: var(--evening-text); }
        .ليلي { background: var(--night); color: var(--night-text); }
        .أوف { background: var(--off); color: var(--off-text); }
        .إجازة { background: var(--leave); color: var(--leave-text); }

        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .sum-card { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(10px); 
            padding: 15px; border-radius: 15px; 
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--glass-border); 
        }
        .sum-val { font-size: 24px; font-weight: bold; }
        .sum-label { font-size: 13px; font-weight: bold; color: #555; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn-tool btn-logout" onclick="location.reload()">تسجيل الخروج</button>
    <button class="btn-tool" onclick="window.print()">طباعة / PDF</button>
    <button class="btn-tool" onclick="changeWeek(7)">الأسبوع التالي</button>
    <button class="btn-tool" onclick="setCurrentWeek()">الأسبوع الحالي</button>
    <button class="btn-tool" onclick="changeWeek(-7)">الأسبوع السابق</button>
</div>

<div class="glass-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" alt="شعار المجدوعي" class="logo-img">
            <div style="text-align: right; border-right: 2px solid #ddd; padding-right: 15px;">
                <div style="font-weight: 900; font-size: 20px; color: var(--primary-blue);">شركة المجدوعي للسيارات</div>
                <div style="font-size: 11px; color: #555; letter-spacing: 1px;">Almajdouie Motors Company</div>
            </div>
        </div>
        <div style="font-weight: 800; font-size: 22px; color: var(--primary-blue);">جدول الدوام الأسبوعي</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('schedule', this)">📅 جدول الدوام</div>
        <div class="tab" onclick="showTabAdmin('admin', this)">👥 إدارة الموظفين</div>
        <div class="tab" onclick="switchTab('leaves', this)">🏖️ الإجازات الطويلة</div>
    </div>

    <div id="schedule" class="tab-content active">
        <div style="margin-bottom: 12px; text-align: left;">
            <input type="date" id="datePicker" onchange="renderAll()" style="background: transparent; border: none; font-weight: bold; font-size: 16px;">
        </div>
        <table>
            <thead>
                <tr id="headerDates">
                    <th>الموظف</th><th>الفئة</th><th>الأحد</th><th>الاثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th><th>الجمعة</th><th>السبت</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
        <div style="margin-top: 30px; font-weight: 800; color: var(--primary-blue);">ملخص التغطية الأسبوعية</div>
        <div class="summary-grid" id="summaryArea"></div>
    </div>

    <div id="admin" class="tab-content">
        <div style="background: rgba(0,0,0,0.03); padding: 20px; border-radius: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;">
            <input type="text" id="empName" placeholder="اسم الموظف">
            <select id="empCat"><option>موظف اساسي</option><option>مشرف</option><option>مدير</option></select>
            <select id="empRole"><option value="MORNING">صباحي</option><option value="EVENING">مسائي</option><option value="FIXED">ليلي (ثابت)</option></select>
            <button onclick="addEmployee()" style="background: var(--primary-blue); color:white; border:none; padding:10px; border-radius:8px; cursor:pointer;">+ إضافة</button>
        </div>
        <table style="margin-top: 20px; background:white;"><tbody id="adminList"></tbody></table>
    </div>
</div>

<script>
    // القوانين: 5 أيام عمل، الجمعة أوف، السبت تدوير (شخص واحد)
    let employees = JSON.parse(localStorage.getItem('employees')) || [
        { id: 1, name: "عبدالرحمن السليماني", cat: "مدير", role: "FIXED", inRotation: false },
        { id: 2, name: "حمد الخثران", cat: "مشرف", role: "MORNING", inRotation: true },
        { id: 3, name: "زياد الثقفي", cat: "مشرف", role: "EVENING", inRotation: true }
    ];
    let longLeaves = JSON.parse(localStorage.getItem('longLeaves')) || [];

    function save() { localStorage.setItem('employees', JSON.stringify(employees)); localStorage.setItem('longLeaves', JSON.stringify(longLeaves)); }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active'); btn.classList.add('active');
        renderAll();
    }
    
    function showTabAdmin(id, btn) { switchTab(id, btn); renderAdmin(); }

    function setCurrentWeek() {
        let today = new Date();
        let sun = new Date(today.setDate(today.getDate() - today.getDay()));
        document.getElementById('datePicker').valueAsDate = sun;
        renderAll();
    }

    function changeWeek(days) {
        let d = new Date(document.getElementById('datePicker').value);
        d.setDate(d.getDate() + days);
        document.getElementById('datePicker').valueAsDate = d;
        renderAll();
    }

    function renderAll() {
        const start = new Date(document.getElementById('datePicker').value);
        const isEven = Math.ceil(start.getDate() / 7) % 2 === 0;
        const rotating = employees.filter(e => e.inRotation);

        let h = '<th>الموظف</th><th>الفئة</th>';
        const dayNames = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        for(let i=0; i<7; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            h += `<th>${dayNames[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`;
        }
        document.getElementById('headerDates').innerHTML = h;

        let b = ''; let counts = { صباحي:0, ليلي:0, مسائي:0, إجازات:0 };
        employees.forEach(emp => {
            b += `<tr><td style="font-weight:bold;">${emp.name}</td><td style="color:#666; font-size:11px;">${emp.cat}</td>`;
            for(let d=0; d<7; d++) {
                let curr = new Date(start); curr.setDate(start.getDate()+d);
                let shift = getShift(emp, d, isEven, curr, rotating);
                b += `<td><span class="badge ${shift}">${shift === 'تغطية' ? 'جمعة' : shift}</span></td>`;
                if(shift === "صباحي" || shift === "تغطية") counts.صباحي++;
                else if(shift === "ليلي") counts.ليلي++;
                else if(shift === "مسائي") counts.مسائي++;
                else if(shift === "إجازة") counts.إجازات++;
            }
            b += `</tr>`;
        });
        document.getElementById('scheduleBody').innerHTML = b;

        document.getElementById('summaryArea').innerHTML = `
            <div class="sum-card"><span class="sum-val" style="color:#007bff">${counts.صباحي}</span><span class="sum-label">الصباحي</span></div>
            <div class="sum-card"><span class="sum-val" style="color:#7b1fa2">${counts.ليلي}</span><span class="sum-label">الليلي</span></div>
            <div class="sum-card"><span class="sum-val" style="color:#f57c00">${counts.مسائي}</span><span class="sum-label">المسائي</span></div>
            <div class="sum-card"><span class="sum-val" style="color:#c62828">${counts.إجازات}</span><span class="sum-label">الإجازات</span></div>
        `;
    }

    function getShift(emp, day, isEven, curr, rotating) {
        if(longLeaves.find(l => { let s=new Date(l.s); let e=new Date(l.e); curr.setHours(0,0,0,0); return l.empId === emp.id && curr >= s && curr <= e; })) return "إجازة";
        if(day === 5) return "أوف"; 
        if(emp.role === "FIXED") return (day <= 4) ? "ليلي" : "أوف";
        if(day === 6) { 
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx === -1) return "أوف";
            return ((idx === 0 && !isEven) || (idx === 1 && isEven)) ? "صباحي" : "أوف";
        }
        if(day === 4) {
            const idx = rotating.findIndex(r => r.id === emp.id);
            if(idx !== -1 && ((idx === 0 && !isEven) || (idx === 1 && isEven))) return "أوف";
        }
        return (emp.role === "MORNING") ? "صباحي" : "مسائي";
    }

    function addEmployee() {
        const name = document.getElementById('empName').value;
        if(!name) return;
        employees.push({ id: Date.now(), name, cat: document.getElementById('empCat').value, role: document.getElementById('empRole').value, inRotation: true });
        save(); renderAll(); document.getElementById('empName').value = "";
    }

    function renderAdmin() {
        document.getElementById('adminList').innerHTML = employees.map(e => `<tr><td>${e.name}</td><td>${e.cat}</td><td><button onclick="deleteEmp(${e.id})">حذف</button></td></tr>`).join('');
    }
    function deleteEmp(id) { employees = employees.filter(e => e.id !== id); save(); renderAll(); renderAdmin(); }

    window.onload = setCurrentWeek;
</script>
</body>
</html>
