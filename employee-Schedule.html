<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Employee Management v1.3.0</title>
  <style>
    :root { --primary:#0d2149; --primary2:#1b4fa3; --surface:rgba(255,255,255,.94); --shadow:0 10px 30px rgba(0,0,0,0.08); }
    body { margin:0; padding:20px; font-family:'Segoe UI',sans-serif; background:transparent; }
    .glass { background:var(--surface); backdrop-filter:blur(10px); border-radius:24px; border:1px solid rgba(255,255,255,0.5); padding:30px; box-shadow:var(--shadow); }
    .card { background:#fff; border-radius:18px; padding:20px; margin-bottom:20px; border:1px solid #eee; }
    .btn-add { background:var(--primary); color:#fff; border:none; padding:12px 25px; border-radius:12px; font-weight:800; cursor:pointer; }
    input[type="text"] { padding:12px; border-radius:12px; border:1px solid #ddd; width:100%; max-width:400px; }
    
    table { width:100%; border-collapse:separate; border-spacing:0 8px; margin-top:20px; }
    th { padding:15px; color:var(--primary); font-weight:900; border-bottom:2px solid #f1f5f9; text-align:center; font-size:14px; }
    td { padding:15px; background:#fff; border-top:1px solid #f1f5f9; border-bottom:1px solid #f1f5f9; text-align:center; vertical-align: middle; }
    .emp-row:hover td { background:#f8fafc; }

    /* استايل الـ Rotation Dropdown مطابق للصورة */
    .rotation-select {
        padding: 10px 15px;
        border-radius: 12px;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #1f2937;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        width: 160px;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: left 12px center;
        background-size: 14px;
        text-align: center;
    }
    
    .status-active { color: #10b981; font-weight: 900; }
    .status-hidden { color: #ef4444; font-weight: 900; }
  </style>
</head>
<body>

<div class="glass">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px">
        <div style="display:flex; align-items:center; gap:12px">
            <img src="LOGO-almajdouie.png" style="height:45px" />
            <h2 style="color:var(--primary); margin:0">إدارة سجل الموظفين v1.3.0</h2>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; gap:10px">
            <input type="text" id="newEmpName" placeholder="أدخل اسم الموظف الجديد..." />
            <button class="btn-add" onclick="window.addEmployee()">إضافة موظف +</button>
        </div>
    </div>

    <div class="card">
        <h3 style="color:var(--primary); margin-top:0">👥 قائمة الموظفين والروتيشن</h3>
        <table>
            <thead>
                <tr>
                    <th style="text-align:right">اسم الموظف</th>
                    <th>الدوام</th>
                    <th>الروتيشن (الإجازة)</th>
                    <th>الحالة</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="empTableBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { 
    initializeFirestore, doc, onSnapshot, updateDoc, 
    persistentLocalCache, persistentMultipleTabManager 
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
    experimentalForceLongPolling: true,
    localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})
});

let emps = [];
const docRef = doc(db, 'schedule', 'jadwal_v6');

// الاستماع للبيانات
onSnapshot(docRef, (snap) => {
    if(snap.exists()) {
        emps = snap.data().data?.emps || [];
        render();
    }
});

window.addEmployee = async () => {
    const name = document.getElementById('newEmpName').value;
    if(!name) return;
    const newEmp = { 
        id: "emp_" + Date.now(), 
        name: name, 
        active: true, 
        fixed: false,
        rotation: 'none' // افتراضي لا يوجد
    };
    await updateDoc(docRef, { "data.emps": [...emps, newEmp] });
    document.getElementById('newEmpName').value = "";
};

window.updateRotation = async (id, val) => {
    const updated = emps.map(e => e.id === id ? {...e, rotation: val} : e);
    await updateDoc(docRef, { "data.emps": updated });
};

window.toggleActive = async (id) => {
    const updated = emps.map(e => e.id === id ? {...e, active: !e.active} : e);
    await updateDoc(docRef, { "data.emps": updated });
};

window.toggleShift = async (id) => {
    const updated = emps.map(e => e.id === id ? {...e, fixed: !e.fixed} : e);
    await updateDoc(docRef, { "data.emps": updated });
};

function render() {
    const tbody = document.getElementById('empTableBody');
    tbody.innerHTML = emps.map(e => `
        <tr class="emp-row">
            <td style="text-align:right; font-weight:800; color:var(--primary)">${e.name}</td>
            <td>
                <button onclick="window.toggleShift('${e.id}')" style="background:none; border:1px solid #ddd; padding:6px 12px; border-radius:10px; cursor:pointer; font-size:12px; font-weight:700">
                    ${e.fixed ? '🌙 ليلي ثابت' : '🔄 متغير'}
                </button>
            </td>
            <td>
                <select class="rotation-select" onchange="window.updateRotation('${e.id}', this.value)">
                    <option value="none" ${e.rotation === 'none' ? 'selected' : ''}>لا يوجد</option>
                    <option value="thu_fri" ${e.rotation === 'thu_fri' ? 'selected' : ''}>الخميس والجمعة</option>
                    <option value="fri_sat" ${e.rotation === 'fri_sat' ? 'selected' : ''}>الجمعة والسبت</option>
                </select>
            </td>
            <td>
                <span class="${e.active ? 'status-active' : 'status-hidden'}">
                    ${e.active ? '● نشط' : '● مخفي'}
                </span>
            </td>
            <td>
                <button onclick="window.toggleActive('${e.id}')" style="background:${e.active ? '#fee2e2' : '#f0fdf4'}; color:${e.active ? '#b91c1c' : '#166534'}; border:none; padding:8px 15px; border-radius:10px; font-weight:800; cursor:pointer; font-size:12px">
                    ${e.active ? 'إخفاء' : 'إظهار'}
                </button>
            </td>
        </tr>
    `).join('');
}
</script>
</body>
</html>
