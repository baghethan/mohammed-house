<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Employee Management v1.2.0</title>
  <style>
    :root { --primary:#0d2149; --primary2:#1b4fa3; --surface:rgba(255,255,255,.9); --shadow:0 10px 30px rgba(0,0,0,0.08); }
    body { margin:0; padding:20px; font-family:'Segoe UI',sans-serif; background:transparent; }
    .glass { background:var(--surface); backdrop-filter:blur(10px); border-radius:24px; border:1px solid rgba(255,255,255,0.5); padding:30px; box-shadow:var(--shadow); }
    .card { background:#fff; border-radius:18px; padding:20px; margin-bottom:20px; border:1px solid #eee; }
    .btn-add { background:var(--primary); color:#fff; border:none; padding:12px 25px; border-radius:12px; font-weight:800; cursor:pointer; }
    input { padding:12px; border-radius:12px; border:1px solid #ddd; width:100%; max-width:400px; margin-left:10px; }
    table { width:100%; border-collapse:separate; border-spacing:0 8px; margin-top:20px; }
    th { padding:15px; color:var(--primary); font-weight:900; border-bottom:2px solid #f1f5f9; text-align:center; }
    td { padding:15px; background:#fff; border-top:1px solid #f1f5f9; border-bottom:1px solid #f1f5f9; text-align:center; }
    .emp-row:hover td { background:#f8fafc; }
    /* Loading Indicator */
    #loadingOverlay { position:fixed; top:0; left:0; width:100%; height:4px; background:#e2e8f0; display:none; }
    #loadingBar { height:100%; background:var(--primary2); width:0%; transition: 0.3s; }
  </style>
</head>
<body>

<div id="loadingOverlay"><div id="loadingBar"></div></div>

<div class="glass">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px">
        <div style="display:flex; align-items:center; gap:12px">
            <img src="LOGO-almajdouie.png" style="height:45px" />
            <h2 style="color:var(--primary); margin:0">إدارة سجل الموظفين</h2>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; gap:10px">
            <input type="text" id="newEmpName" placeholder="أدخل اسم الموظف الجديد..." />
            <button class="btn-add" onclick="window.addEmployee()">إضافة موظف +</button>
        </div>
    </div>

    <div class="card">
        <h3 style="color:var(--primary); margin-top:0">👥 قائمة الموظفين المسجلين</h3>
        <table>
            <thead>
                <tr>
                    <th style="text-align:right">الاسم</th>
                    <th>نوع الدوام</th>
                    <th>الحالة</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="empTableBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { 
    getFirestore, doc, onSnapshot, updateDoc, 
    initializeFirestore, persistentLocalCache, persistentMultipleTabManager 
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain:'baghethan-ba325.firebaseapp.com', 
    projectId:'baghethan-ba325', 
    storageBucket:'baghethan-ba325.firebasestorage.app', 
    messagingSenderId:'944819735112', 
    appId:'1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);

// --- الحل السحري لمشكلة الـ 10 ثواني ---
const db = initializeFirestore(app, {
    experimentalForceLongPolling: true, // إجبار الاتصال عبر HTTP لتجاوز جدار الحماية
    localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) // تفعيل الكاش لسرعة التحميل
});

let emps = [];
const docRef = doc(db, 'schedule', 'jadwal_v6');

// جلب البيانات
onSnapshot(docRef, (snap) => {
    document.getElementById('loadingOverlay').style.display = 'none';
    if(snap.exists()) {
        emps = snap.data().data?.emps || [];
        render();
    }
}, (error) => {
    console.error("Firestore Error:", error);
    if(error.code === 'unavailable') {
        alert("فشل الاتصال بالخادم. يرجى التأكد من الإنترنت أو تحديث الصفحة.");
    }
});

window.addEmployee = async () => {
    const name = document.getElementById('newEmpName').value;
    if(!name) return;
    const newEmp = { 
        id: "emp_" + Date.now(), 
        name: name, 
        active: true, 
        fixed: false 
    };
    const updatedEmps = [...emps, newEmp];
    await updateDoc(docRef, { "data.emps": updatedEmps });
    document.getElementById('newEmpName').value = "";
};

window.toggleActive = async (id) => {
    const updated = emps.map(e => e.id === id ? {...e, active: !e.active} : e);
    await updateDoc(docRef, { "data.emps": updated });
};

window.toggleShift = async (id) => {
    const updated = emps.map(e => e.id === id ? {...e, fixed: !e.fixed} : e);
    await updateDoc(docRef, { "data.emps": updated });
};

function render() {
    const tbody = document.getElementById('empTableBody');
    tbody.innerHTML = emps.map(e => `
        <tr class="emp-row">
            <td style="text-align:right; font-weight:800">${e.name}</td>
            <td>
                <button onclick="window.toggleShift('${e.id}')" style="background:none; border:1px solid #ddd; padding:5px 10px; border-radius:8px; cursor:pointer">
                    ${e.fixed ? '🌙 ليلي ثابت' : '🔄 متغير'}
                </button>
            </td>
            <td>
                <span style="color:${e.active ? '#10b981' : '#ef4444'}; font-weight:900">
                    ${e.active ? '● نشط' : '● مخفي'}
                </span>
            </td>
            <td>
                <button onclick="window.toggleActive('${e.id}')" style="background:${e.active ? '#fee2e2' : '#f0fdf4'}; color:${e.active ? '#b91c1c' : '#166534'}; border:none; padding:8px 12px; border-radius:8px; font-weight:800; cursor:pointer">
                    ${e.active ? 'إخفاء' : 'إظهار'}
                </button>
            </td>
        </tr>
    `).join('');
}

// تشغيل شريط التحميل الوهمي
document.getElementById('loadingOverlay').style.display = 'block';
document.getElementById('loadingBar').style.width = '70%';
</script>
</body>
</html>
