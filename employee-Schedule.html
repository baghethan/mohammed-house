<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management - Almajdouie Motors</title>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--text:#1f2937;--muted:#64748b;--surface:rgba(255,255,255,.94);--surface2:#fff;--shadow:0 18px 50px rgba(13,33,73,.16);--ok-bg:#ecfdf5;--ok-t:#166534;--ok-border:#86efac}
    *{box-sizing:border-box} 
    body{margin:0;padding:20px;font-family:'Segoe UI',sans-serif;background:linear-gradient(180deg, rgba(12,31,73,.1), rgba(255,255,255,.2)), url('image_dba186.png') center/cover fixed no-repeat;min-height:100vh;display:flex;justify-content:center}
    .shell{width:100%;max-width:1200px}
    .glass{width:100%;background:var(--surface);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;padding:30px}
    .card{background:var(--surface2);border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:20px;box-shadow:0 10px 24px rgba(0,0,0,.05);margin-bottom:20px}
    .btn,.btn2,.danger{border:none;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer;transition:.2s;font-size:13px}
    .btn{background:#fff;color:var(--primary);border:1px solid #e2e8f0}
    .btn2{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
    .danger{background:linear-gradient(135deg,#d32f2f,#b71c1c);color:#fff}
    .form-box{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
    input{padding:12px 15px;border-radius:12px;border:1px solid #d8dee8;background:#fff;min-height:45px;font-size:14px;flex:1}
    
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eee}
    thead th{background:#f8fafc;color:var(--primary);font-weight:900;padding:15px;text-align:center;border-bottom:2px solid #eef2f7}
    td{padding:15px;text-align:center;border-bottom:1px solid #f9f9f9}
    .row-start{text-align:right !important;font-weight:900;color:var(--primary);padding-right:25px}
    .badge-status{padding:4px 10px;border-radius:8px;font-weight:800;font-size:11px}
    .status-active{background:#ecfdf5;color:#059669}
    .status-hidden{background:#fef2f2;color:#dc2626}
  </style>
</head>
<body>
<div class="shell">
  <div class="glass">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:20px; margin-bottom:25px">
        <div style="display:flex; align-items:center; gap:15px">
            <img src="LOGO-almajdouie.png" style="height:55px" />
            <div>
                <h2 id="title" style="margin:0; color:var(--primary); font-weight:900; font-size:22px">إدارة الموظفين</h2>
                <p style="margin:0; color:var(--muted); font-size:12px; font-weight:700">سجل الموظفين والورديات - المجدوعي للسيارات</p>
            </div>
        </div>
        <button class="btn" id="btnLang">AR / EN</button>
    </div>

    <div class="card">
        <div class="form-box">
            <input type="text" id="newEmpName" placeholder="أدخل اسم الموظف الجديد..." />
            <button class="btn2" onclick="window.addEmployee()">+ إضافة موظف</button>
        </div>
    </div>

    <div class="card">
        <h3 id="listTitle" style="margin-top:0; color:var(--primary); margin-bottom:20px">👥 قائمة الموظفين المسجلين</h3>
        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th id="thName" style="text-align:right; padding-right:25px">الاسم</th>
                        <th id="thShift">الوردية</th>
                        <th id="thStatus">الحالة</th>
                        <th id="thAction">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="adminBody"></tbody>
            </table>
        </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

// Configuration extracted from Schedule.html
const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

const i18n = {
    ar: { title:'إدارة الموظفين', list:'👥 قائمة الموظفين المسجلين', name:'الاسم', shift:'الوردية', status:'الحالة', action:'الإجراءات', morning:'صباحي', night:'ليلي', active:'نشط', hidden:'مخفي', edit:'تعديل', delete:'حذف' },
    en: { title:'Employee Management', list:'👥 Registered Employees List', name:'Name', shift:'Shift', status:'Status', action:'Actions', morning:'Morning', night:'Night', active:'Active', hidden:'Hidden', edit:'Edit', delete:'Delete' }
};

let employees=[], currentLang=localStorage.getItem('lang')||'ar';
const $=id=>document.getElementById(id), tr=()=>i18n[currentLang];

// --- 1. Admin Logic ---
window.addEmployee = async () => {
    const nameInput = $('newEmpName');
    const n = nameInput.value.trim();
    if(!n) return;
    employees.push({ id:'emp_'+Date.now(), name:n, fixed:false, active:true, rotType:'none' });
    nameInput.value = '';
    await window.saveToDatabase();
};

window.saveToDatabase = async () => {
    await setDoc(doc(db, 'schedule', 'jadwal_v6'), { data: { emps: employees } }, { merge: true });
};

window.editEmployeeName = async (id) => {
    const emp = employees.find(e => e.id === id);
    const n = prompt(currentLang==='ar'?"تعديل اسم الموظف:":"Edit Employee Name:", emp.name);
    if(n && n.trim()) {
        employees = employees.map(e => e.id === id ? { ...e, name: n.trim() } : e);
        await window.saveToDatabase();
    }
};

window.toggleShift = async (id) => {
    employees = employees.map(e => e.id === id ? { ...e, fixed: !e.fixed } : e);
    await window.saveToDatabase();
};

window.toggleStatus = async (id) => {
    employees = employees.map(e => e.id === id ? { ...e, active: !e.active } : e);
    await window.saveToDatabase();
};

window.deleteEmployee = async (id) => {
    if(!confirm(currentLang==='ar'?"هل أنت متأكد من حذف الموظف؟":"Are you sure you want to delete this employee?")) return;
    employees = employees.filter(e => e.id !== id);
    await window.saveToDatabase();
};

// --- 2. Rendering ---
function renderEmployees() {
    const t = tr();
    $('adminBody').innerHTML = employees.map(e => `
        <tr>
            <td class="row-start">${e.name}</td>
            <td>
                <button class="btn" onclick="window.toggleShift('${e.id}')" style="min-width:90px">
                    ${e.fixed ? '🌙 '+t.night : '☀️ '+t.morning}
                </button>
            </td>
            <td>
                <span class="badge-status ${e.active ? 'status-active' : 'status-hidden'}">
                    ${e.active ? t.active : t.hidden}
                </span>
            </td>
            <td>
                <div style="display:flex; gap:8px; justify-content:center">
                    <button class="btn" onclick="window.editEmployeeName('${e.id}')">✏️ ${t.edit}</button>
                    <button class="btn" onclick="window.toggleStatus('${e.id}')">👁️</button>
                    <button class="danger" onclick="window.deleteEmployee('${e.id}')" style="padding:10px">X</button>
                </div>
            </td>
        </tr>
    `).join('');
}

// --- 3. Initializing ---
async function bindSnapshots(){
    onSnapshot(doc(db, 'schedule', 'jadwal_v6'), s => {
        employees = s.exists() ? (s.data().data?.emps || []) : [];
        renderEmployees();
    });
}

$('btnLang').addEventListener('click', () => {
    currentLang = currentLang==='ar'?'en':'ar'; localStorage.setItem('lang', currentLang); location.reload();
});

window.addEventListener('DOMContentLoaded', () => {
    if(currentLang==='en') { $('mainHtml').dir='ltr'; $('mainHtml').lang='en'; }
    const t = tr();
    $('title').innerText = t.title; $('listTitle').innerText = t.list;
    $('thName').innerText = t.name; $('thShift').innerText = t.shift;
    $('thStatus').innerText = t.status; $('thAction').innerText = t.action;
    bindSnapshots();
});
</script>
</body>
</html>
