<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>نظام الإجازات الذكي v4.1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .vacation-bar { height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); position: absolute; z-index: 10; }
        .date-text-inside { color: white; font-size: 8px; font-weight: 700; white-space: nowrap; padding: 0 5px; }
        .gantt-grid-row { display: grid; width: 100%; min-width: 1100px; }
        .tab-active { border-bottom: 3px solid #1e3a8a; color: #1e3a8a; font-weight: 700; }
        .color-0 { background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%); }
        .color-1 { background: linear-gradient(90deg, #0d9488 0%, #14b8a6 100%); }
        .color-2 { background: linear-gradient(90deg, #7c3aed 0%, #a78bfa 100%); }
    </style>
</head>
<body class="p-4 md:p-8 pb-20 text-right">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-xl font-bold text-[#1e3a8a] border-r-4 border-[#1e3a8a] pr-4">نظام إدارة الإجازات السنوية</h1>
                <p class="text-xs text-slate-400 pr-4 mt-1">الإصدار v4.1.0 | تقارير ذكية وشاملة</p>
            </div>
            <div class="flex gap-2">
                <label class="cursor-pointer bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 shadow-sm transition-all">
                    <span>رفع Excel</span>
                    <input type="file" id="uploadExcel" class="hidden" accept=".xlsx, .xls" />
                </label>
                <button onclick="downloadExcel()" class="bg-[#1e3a8a] text-white px-5 py-2 rounded-lg text-sm font-medium shadow-md">تنزيل Excel</button>
            </div>
        </div>

        <nav class="flex border-b border-slate-200 gap-8 mb-4 px-2">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="py-2 text-sm transition-all tab-active">Dashboard (لوحة العرض)</button>
            <button onclick="switchTab('management')" id="btn-management" class="py-2 text-sm text-slate-400 hover:text-slate-600 transition-all">إدارة الطلبات</button>
        </nav>

        <div id="tab-dashboard" class="space-y-6">
            
            <div class="flex justify-end mb-2">
                 <button onclick="copyFullDashboard()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl text-sm font-bold shadow-lg hover:bg-emerald-700 transition-all">
                    نسخ التقرير كامل كصورة 📸
                </button>
            </div>

            <div id="captureArea" class="space-y-6 p-4 bg-[#f8fafc] rounded-3xl">
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="statsGrid"></div>

                <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-md font-bold text-slate-700">المخطط الزمني (Timeline)</h2>
                        <select id="viewRange" onchange="refreshUI()" class="border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-700 bg-slate-50 outline-none">
                            <option value="year">السنة كاملة (Jan - Dec)</option>
                            <option value="q1">الربع الأول (Jan - Mar)</option>
                            <option value="q2">الربع الثاني (Apr - Jun)</option>
                            <option value="q3">الربع الثالث (Jul - Sep)</option>
                            <option value="q4">الربع الرابع (Oct - Dec)</option>
                        </select>
                    </div>
                    <div class="overflow-x-auto border border-slate-100 rounded-xl bg-white p-1">
                        <div id="ganttArea"></div>
                    </div>
                </section>
            </div>
        </div>

        <div id="tab-management" class="hidden space-y-6">
            <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-700 mb-4">إضافة طلب إجازة</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <div><label class="text-xs font-bold text-slate-500">اسم الموظف</label><input type="text" id="empName" class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-100"></div>
                    <div><label class="text-xs font-bold text-slate-500">من</label><input type="date" id="dateFrom" class="w-full border rounded-lg px-3 py-2 text-sm outline-none"></div>
                    <div><label class="text-xs font-bold text-slate-500">إلى</label><input type="date" id="dateTo" class="w-full border rounded-lg px-3 py-2 text-sm outline-none"></div>
                    <button onclick="processEntry()" class="bg-[#0d9488] text-white px-4 py-2 rounded-lg font-bold shadow-md">+ إضافة</button>
                </div>
            </section>
            <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <div class="overflow-hidden rounded-xl border border-slate-100"><table class="w-full text-right" id="requestsTable"><thead class="bg-slate-50 text-xs font-bold text-slate-600"><tr><th class="px-6 py-4">الموظف</th><th class="px-6 py-4 text-center">من</th><th class="px-6 py-4 text-center">إلى</th><th class="px-6 py-4 text-center">الحالة</th><th class="px-6 py-4 text-center">الإجراءات</th></tr></thead><tbody id="tableBody" class="text-sm divide-y"></tbody></table></div>
            </section>
        </div>
    </div>

    <script>
        let vacationsData = [];
        const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

        function switchTab(tab) {
            document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('tab-management').classList.toggle('hidden', tab !== 'management');
            document.getElementById('btn-dashboard').classList.toggle('tab-active', tab === 'dashboard');
            document.getElementById('btn-management').classList.toggle('tab-active', tab === 'management');
            if(tab === 'dashboard') refreshUI();
        }

        function refreshUI() {
            updateStats();
            renderGantt();
            updateTable();
        }

        function updateStats() {
            const range = document.getElementById('viewRange').value;
            let startM = 0, endM = 11;
            if(range === 'q1') endM = 2; else if(range === 'q2') {startM=3; endM=5;} else if(range === 'q3') {startM=6; endM=8;} else if(range === 'q4') {startM=9; endM=11;}

            // فلترة البيانات بناء على النطاق المختار للحصول على إحصائيات دقيقة
            const filtered = vacationsData.filter(v => {
                const m = new Date(v.from).getMonth();
                return m >= startM && m <= endM;
            });

            const activeToday = vacationsData.filter(v => {
                const t = new Date().toISOString().split('T')[0];
                return t >= v.from && t <= v.to;
            }).length;

            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <h3 class="text-slate-400 text-[10px] font-bold mb-1 uppercase tracking-tighter">إجمالي الموظفين المجازين (الفترة)</h3>
                    <p class="text-2xl font-bold text-[#1e3a8a]">${filtered.length}</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <h3 class="text-slate-400 text-[10px] font-bold mb-1 uppercase tracking-tighter">إجازات نشطة اليوم</h3>
                    <p class="text-2xl font-bold text-emerald-600">${activeToday}</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <h3 class="text-slate-400 text-[10px] font-bold mb-1 uppercase tracking-tighter">طلبات بانتظار الموافقة</h3>
                    <p class="text-2xl font-bold text-amber-500">${vacationsData.filter(v => v.status === 'PENDING').length}</p>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <h3 class="text-slate-400 text-[10px] font-bold mb-1 uppercase tracking-tighter">حالة التغطية</h3>
                    <p class="text-xl font-bold text-purple-600">Optimal</p>
                </div>
            `;
        }

        function renderGantt() {
            const range = document.getElementById('viewRange').value;
            const area = document.getElementById('ganttArea');
            let startM = 0, endM = 11;
            if(range === 'q1') endM = 2; else if(range === 'q2') {startM=3; endM=5;} else if(range === 'q3') {startM=6; endM=8;} else if(range === 'q4') {startM=9; endM=11;}
            
            const totalMonths = (endM - startM) + 1;
            const gridCols = 2 + totalMonths;

            // فلترة وتجميع الموظفين الذين لديهم إجازات في هذا النطاق فقط
            const grouped = {};
            vacationsData.forEach(v => {
                const vStartM = new Date(v.from).getMonth();
                const vEndM = new Date(v.to).getMonth();
                if (vEndM >= startM && vStartM <= endM) {
                    if(!grouped[v.name]) grouped[v.name] = [];
                    grouped[v.name].push(v);
                }
            });

            let html = `<div class="gantt-grid-row" style="grid-template-columns: repeat(${gridCols}, 1fr);">
                <div class="col-span-2 p-3 text-sm font-bold text-slate-600 bg-slate-50 border-l border-b">الموظف</div>`;
            for(let i = startM; i <= endM; i++) html += `<div class="p-3 text-[10px] font-bold text-slate-400 bg-slate-50 border-l border-b text-center uppercase">${monthNames[i]}</div>`;
            html += `</div>`;

            Object.keys(grouped).forEach(emp => {
                html += `<div class="gantt-grid-row border-b border-slate-100 h-16 relative" style="grid-template-columns: repeat(${gridCols}, 1fr);">
                    <div class="col-span-2 p-3 text-[11px] font-bold text-slate-700 border-l flex items-center bg-white z-20 sticky right-0 shadow-sm">${emp}</div>
                    <div class="col-span-${totalMonths} relative flex items-center h-full bg-slate-50/10">`;
                grouped[emp].forEach((vac, idx) => {
                    const d1 = new Date(vac.from), d2 = new Date(vac.to);
                    if (d2.getMonth() >= startM && d1.getMonth() <= endM) {
                        const sM = Math.max(d1.getMonth(), startM), eM = Math.min(d2.getMonth(), endM);
                        const mWidth = 100 / totalMonths, right = (sM - startM) * mWidth, width = ((eM - sM) + 1) * mWidth;
                        html += `<div class="vacation-bar color-${idx % 3} shadow-sm" style="right: ${right}%; width: ${width - 0.5}%;">
                            <span class="date-text-inside">${vac.from.split('-').slice(1).join('/')}</span>
                        </div>`;
                    }
                });
                html += `</div></div>`;
            });
            area.innerHTML = html || `<div class="p-10 text-center text-slate-400">لا توجد إجازات في هذه الفترة</div>`;
        }

        async function copyFullDashboard() {
            const area = document.getElementById('captureArea');
            const canvas = await html2canvas(area, { scale: 2, backgroundColor: "#f8fafc" });
            canvas.toBlob(async blob => {
                await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
                alert("تم نسخ التقرير كاملاً (البطاقات + المخطط) إلى الحافظة!");
            });
        }

        function processEntry() {
            const name = document.getElementById('empName').value, from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
            if(!name || !from || !to) return;
            vacationsData.push({ id: Date.now(), name, from, to, status: 'PENDING' });
            refreshUI();
            document.getElementById('empName').value = '';
        }

        function updateTable() {
            document.getElementById('tableBody').innerHTML = vacationsData.map(v => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 font-bold text-slate-700">${v.name}</td>
                    <td class="px-6 py-4 text-center font-mono text-slate-500">${v.from}</td>
                    <td class="px-6 py-4 text-center font-mono text-slate-500">${v.to}</td>
                    <td class="px-6 py-4 text-center"><span class="px-3 py-1 rounded-full ${v.status==='APPROVED'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'} text-[10px] font-bold uppercase">${v.status}</span></td>
                    <td class="px-6 py-4 flex justify-center gap-1"><button onclick="updateStat(${v.id}, 'APPROVED')" class="bg-emerald-500 text-white px-3 py-1 rounded text-[10px] font-bold">موافقة</button></td>
                </tr>`).reverse().join('');
        }

        function updateStat(id, stat) { const item = vacationsData.find(v => v.id === id); if(item) item.status = stat; refreshUI(); }
        function formatExcelDate(s) { if(!s || isNaN(s)) return s; return new Date(Math.round((s-25569)*86400*1000)).toISOString().split('T')[0]; }
        document.getElementById('uploadExcel').addEventListener('change', function(e) {
            const reader = new FileReader(); reader.onload = function(event) {
                const workbook = XLSX.read(new Uint8Array(event.target.result), { type: 'array' });
                XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]).forEach(row => {
                    const n = row['الموظف'] || row['Employee'], f = formatExcelDate(row['من'] || row['From']), t = formatExcelDate(row['إلى'] || row['To']);
                    if(n && f && t) vacationsData.push({ id: Date.now() + Math.random(), name: n, from: f, to: t, status: 'PENDING' });
                });
                refreshUI();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });
        function downloadExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("requestsTable")), "Vacations_Report.xlsx"); }
        refreshUI();
    </script>
</body>
</html>
