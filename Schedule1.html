<!DOCTYPE html>
<html class="light" lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Almajdouie Motors - Scheduling v10.5.8</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: { "primary": "#00244a", "primary-light": "#003a70", "dark-bg": "#0f172a", "dark-surface": "#1e293b" }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; transition: background-color 0.3s; overflow-x: hidden; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .badge { @apply px-3 py-1 text-[10px] font-bold rounded-full uppercase flex items-center justify-center gap-1; }
    
    /* Gantt Chart Styling - Matched to Image 2 */
    .gantt-grid { display: grid; grid-template-columns: repeat(12, 1fr) 180px; min-width: 1000px; border: 1px solid #edf2f7; border-radius: 12px; overflow: hidden; background: #fff; }
    .ghead { padding: 12px; background: #f8fafc; color: #64748b; text-align: center; font-weight: 800; font-size: 11px; border: 1px solid #f1f5f9; }
    .gname { padding: 14px; background: #ffffff; font-weight: 700; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: flex-start; font-size: 11px; color: var(--primary); border-right: 1px solid #f1f5f9; }
    .gmonths-row { display: grid; grid-template-columns: repeat(12, 1fr); grid-column: 1 / 13; border-bottom: 1px solid #f1f5f9; position: relative; height: 50px; }
    .month-slot { border-left: 1px solid #f8fafc; height: 100%; }
    .vacation-bar-gradient { position: absolute; height: 22px; background: linear-gradient(90deg, #4ade80 0%, #3b82f6 100%); top: 14px; border-radius: 999px; color: white; font-size: 9px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); z-index: 10; padding: 0 10px; font-weight: 800; white-space: nowrap; }

    html[dir="rtl"] .sidebar { @apply right-0 border-l; }
    html[dir="ltr"] .sidebar { @apply left-0 border-r; }
    html[dir="rtl"] main { @apply mr-[280px] ml-0; }
    html[dir="ltr"] main { @apply ml-[280px] mr-0; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 999; display: none; align-items: center; justify-content: center; }
  </style>
</head>
<body class="bg-[#f7f9ff] dark:bg-dark-bg text-slate-900 dark:text-slate-100 min-h-screen text-start">

<aside class="sidebar fixed top-0 h-full w-[280px] bg-white z-40 flex flex-col shadow-2xl transition-all duration-300">
  <div class="p-8 text-center">
    <img src="LOGO-almajdouie.png" class="h-14 w-auto mx-auto mb-4" alt="Logo" />
    <h1 class="text-lg font-black text-primary leading-none uppercase">المجدوعي للسيارات</h1>
    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Personnel Management</p>
  </div>
  <nav class="space-y-1 text-start px-4 flex-1 overflow-y-auto">
    <button data-tab="dashboard" class="tab-btn active w-full flex items-center gap-3 px-4 py-3.5 text-primary bg-blue-50 border-r-4 border-primary rounded-xl transition-all shadow-sm">
      <span class="material-symbols-outlined">dashboard</span> <span class="text-sm font-bold">لوحة القيادة</span>
    </button>
    <button data-tab="planning" class="tab-btn w-full flex items-center gap-3 px-4 py-3.5 text-slate-500 hover:bg-slate-50 rounded-xl transition-all">
      <span class="material-symbols-outlined">event_note</span> <span class="text-sm font-bold">خطة الإجازات</span>
    </button>
  </nav>
</aside>

<header class="fixed top-0 h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 z-30 flex items-center justify-between px-10">
  <div class="flex items-center gap-4 flex-1"><div class="relative w-full max-w-md"><input class="w-full bg-slate-100 border-none rounded-full py-2 ps-12 pe-5 text-xs" placeholder="البحث..." type="text"/></div></div>
</header>

<main class="pt-24 p-8 lg:p-12 transition-all">
  <div class="max-w-7xl mx-auto space-y-10">

    <section id="dashboard" class="tab-content active"><h2 class="text-3xl font-black">Dashboard</h2></section>

    <section id="planning" class="tab-content text-start space-y-8">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-3xl font-black text-primary tracking-tighter">المخطط السنوي للإجازات</h2>
                <div class="flex items-center gap-2 mt-2"><span class="w-3 h-3 rounded-full bg-blue-500"></span><p class="text-[10px] font-bold text-slate-500 uppercase">فترة الإجازة</p></div>
            </div>
        </div>

        <div class="bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10 pb-10 border-b">
                <select id="pEmp" class="rounded-xl border-slate-200 text-sm font-bold h-12"></select>
                <input type="date" id="pStart" class="rounded-xl border-slate-200 text-sm h-12" />
                <input type="date" id="pEnd" class="rounded-xl border-slate-200 text-sm h-12" />
                <button class="bg-primary text-white py-3 rounded-xl font-black text-sm h-12" onclick="window.addVacationPlan()">+ إضافة للخطة</button>
            </div>

            <div class="overflow-x-auto p-4 bg-slate-50 rounded-3xl border shadow-inner">
                <div class="gantt-grid" id="gantt">
                    <div class="ghead">ديسمبر</div><div class="ghead">نوفمبر</div><div class="ghead">أكتوبر</div><div class="ghead">سبتمبر</div>
                    <div class="ghead">أغسطس</div><div class="ghead">يوليو</div><div class="ghead">يونيو</div><div class="ghead">مايو</div>
                    <div class="ghead">أبريل</div><div class="ghead">مارس</div><div class="ghead">فبراير</div><div class="ghead">يناير</div>
                    <div class="ghead" style="text-align: right; padding-right: 20px;">الموظف</div>
                </div>
            </div>
        </div>

        <div class="bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-2xl">
            <h3 class="text-2xl font-black text-primary mb-8 tracking-tighter">إدارة الطلبات</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-start border-collapse">
                    <thead><tr class="text-slate-400 text-[10px] font-black uppercase bg-slate-50">
                      <th class="py-4 px-6 text-start">الموظف</th>
                      <th class="py-4 text-center">من</th>
                      <th class="py-4 text-center">إلى</th>
                      <th class="py-4 text-center">الحالة</th>
                      <th class="py-4 text-end px-6">الإجراءات</th>
                    </tr></thead>
                    <tbody id="planningBody"></tbody>
                </table>
            </div>
        </div>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325' };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

let employees=[], planList=[];
const $=id=>document.getElementById(id);

async function bindSnapshots(){
    // جلب الموظفين
    onSnapshot(doc(db,'schedule','jadwal_v6'), s=>{ 
        employees=s.exists()?s.data().data?.emps:[]; 
        updateSelectors(); 
        renderAll(); 
    });
    // جلب الطلبات (هنا كان الخلل في مسميات الحقول)
    onSnapshot(collection(db,'vacations'), s=>{ 
        planList=s.docs.map(d=>({id:d.id, ...d.data()})); 
        renderAll(); 
    });
}

function updateSelectors(){ 
    const opts=employees.filter(e=>e.active).map(e=>`<option value="${e.id}">${e.name}</option>`).join(''); 
    if($('pEmp')) $('pEmp').innerHTML=opts; 
}

// دالة الإضافة مع توحيد مسميات الحقول (from, to, status)
window.addVacationPlan = async() => {
    const id=$('pEmp').value, s=$('pStart').value, e=$('pEnd').value;
    if(!id||!s||!e) return;
    const emp = employees.find(x=>x.id===id);
    await addDoc(collection(db,'vacations'), { 
        empId: id, // استخدام المعرف النصي الموحد
        name: emp.name, 
        from: s, 
        to: e, 
        status: 'pending' 
    });
    $('pStart').value=''; $('pEnd').value='';
};

window.approveVacation = async(id)=>{
    const plan = planList.find(x=>x.id===id);
    if(!plan) return;
    const annualRef = doc(db,'schedule','jadwal_annual_leave');
    const snap = await getDoc(annualRef);
    const existing = snap.exists() ? snap.data().vacations : [];
    await setDoc(annualRef, { vacations: [...existing, { empId: plan.empId, start: plan.from, end: plan.to }] }, {merge:true});
    await updateDoc(doc(db,'vacations', id), { status: 'approved' });
};

window.rejectVacation = async(id)=>{
    if(confirm('هل تريد رفض وحذف هذا الطلب؟')) await deleteDoc(doc(db,'vacations', id));
};

function renderAll(){
    renderGantt(); 
    renderPlanList(); 
}

function renderPlanList(){
    // التأكد من قراءة الحقول الصحيحة (from, to, status) لمنع ظهور undefined
    $('planningBody').innerHTML = planList.map(p=>`
        <tr class="border-b border-slate-50 transition-colors hover:bg-slate-50/50">
            <td class="py-4 px-6 font-bold text-xs text-primary text-start">${p.name || 'موظف غير معروف'}</td>
            <td class="py-4 text-xs text-center text-slate-500">${p.from || '-'}</td>
            <td class="py-4 text-xs text-center text-slate-500">${p.to || '-'}</td>
            <td class="py-4 text-center">
                <span class="badge mx-auto ${p.status==='approved'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}">
                    ${p.status==='approved'?'مكتمل':'قيد الانتظار'}
                </span>
            </td>
            <td class="py-4 px-6 text-end flex justify-end gap-2">
                <button onclick="window.approveVacation('${p.id}')" class="bg-green-500 text-white px-4 py-1.5 rounded-lg text-[10px] font-black shadow-sm">موافقة</button>
                <button onclick="window.rejectVacation('${p.id}')" class="bg-red-100 text-red-600 px-4 py-1.5 rounded-lg text-[10px] font-black">رفض</button>
            </td>
        </tr>`).join('');
}

function renderGantt(){
    const chart=$('gantt'); 
    const heads = Array.from(chart.children).slice(0, 13);
    chart.innerHTML=''; heads.forEach(h=>chart.appendChild(h));

    employees.filter(e=>e.active).forEach(emp=>{
        const monthsRow=document.createElement('div'); 
        monthsRow.className='gmonths-row'; 
        for(let i=0;i<12;i++) monthsRow.innerHTML+='<div class="month-slot"></div>';

        // تصفية الخطط للموظف الحالي باستخدام empId الموحد
        const empPlans = planList.filter(p=> String(p.empId) === String(emp.id));
        empPlans.forEach(p=>{
            if(!p.from || !p.to) return;
            const dFrom=new Date(p.from.replace(/-/g,'/')), dTo=new Date(p.to.replace(/-/g,'/'));
            const year=new Date().getFullYear(), yStart=new Date(year,0,1), yEnd=new Date(year+1,0,1);
            const totalDays=(yEnd-yStart)/86400000;
            const bar=document.createElement('div'); bar.className='vacation-bar-gradient';
            const rightPos = ((dFrom-yStart)/86400000/totalDays*100);
            bar.style.right = rightPos + '%';
            bar.style.width = (((dTo-dFrom)/86400000+1)/totalDays*100)+'%';
            bar.innerText = `${p.from.split('-')[1]}/${p.from.split('-')[2]}`;
            monthsRow.appendChild(bar);
        });
        chart.appendChild(monthsRow);

        const nameCell=document.createElement('div'); 
        nameCell.className='gname'; 
        nameCell.innerText=emp.name; 
        chart.appendChild(nameCell);
    });
}

document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{ 
    document.querySelectorAll('.tab-btn, .tab-content').forEach(x=>x.classList.remove('active','bg-blue-50','text-primary'));
    b.classList.add('active','bg-blue-50','text-primary'); 
    document.getElementById(b.dataset.tab).classList.add('active'); 
});

window.addEventListener('DOMContentLoaded', ()=> { bindSnapshots(); });
</script>
</body>
</html>
