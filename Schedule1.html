<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>إدارة الإجازات السنوية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; }
        .card-shadow { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 border-r-4 border-[#1e3a8a] pr-4">إدارة الإجازات السنوية</h1>
                <p class="text-slate-500 mt-1 pr-4 text-sm">تصدير واستيراد البيانات عبر Excel</p>
            </div>
            
            <div class="flex gap-3">
                <label class="cursor-pointer flex items-center gap-2 bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                    <span>رفع Excel</span>
                    <input type="file" id="uploadExcel" class="hidden" accept=".xlsx, .xls" />
                </label>

                <button onclick="downloadExcel()" class="flex items-center gap-2 bg-[#1e3a8a] text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-900 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                    <span>تنزيل Excel</span>
                </button>
            </div>
        </div>

        <section class="bg-white rounded-2xl p-8 card-shadow border border-slate-100">
            <h2 class="text-md font-bold text-slate-800 mb-6 text-left">جدول الطلبات الحالي</h2>
            <div class="overflow-x-auto">
                <table id="vacationTable" class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-blue-50/50 text-slate-600 text-xs font-bold">
                            <th class="px-6 py-4 rounded-r-xl">الموظف (EMPLOYEE)</th>
                            <th class="px-6 py-4">من (FROM)</th>
                            <th class="px-6 py-4">إلى (TO)</th>
                            <th class="px-6 py-4 rounded-l-xl">الحالة (STATUS)</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm divide-y divide-slate-50">
                        <tr class="hover:bg-slate-50/50 transition-colors">
                            <td class="px-6 py-5 font-bold text-slate-700">Abdullah Al-Sulaimani</td>
                            <td class="px-6 py-5 text-slate-400">2026-05-01</td>
                            <td class="px-6 py-5 text-slate-400">2026-05-15</td>
                            <td class="px-6 py-5">
                                <span class="px-3 py-1 rounded-full bg-amber-100 text-amber-600 text-[10px] font-bold uppercase tracking-wider">Pending</span>
                            </td>
                        </tr>
                        <tr class="hover:bg-slate-50/50 transition-colors">
                            <td class="px-6 py-5 font-bold text-slate-700">Almajdouie Motors</td>
                            <td class="px-6 py-5 text-slate-400">2026-06-10</td>
                            <td class="px-6 py-5 text-slate-400">2026-06-20</td>
                            <td class="px-6 py-5">
                                <span class="px-3 py-1 rounded-full bg-blue-100 text-blue-600 text-[10px] font-bold uppercase tracking-wider">Completed</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // دالة التنزيل
        function downloadExcel() {
            const table = document.getElementById("vacationTable");
            const workbook = XLSX.utils.table_to_book(table, { sheet: "Vacation" });
            XLSX.writeFile(workbook, "Vacation_Report.xlsx");
        }

        // دالة الرفع
        document.getElementById('uploadExcel').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                alert("تم استلام ملف Excel بنجاح وجاري معالجة البيانات...");
                console.log("Sheet Names:", workbook.SheetNames);
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
