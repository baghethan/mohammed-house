<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Annual Leave - Excel Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; }
        .vacation-bar {
            height: 20px;
            border-radius: 10px;
            background: linear-gradient(90deg, #2563eb 0%, #14b8a6 100%);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 border-l-4 border-[#1e3a8a] pl-4">إدارة الإجازات السنوية</h1>
                <p class="text-slate-500 mt-1">تصدير واستيراد البيانات عبر Excel</p>
            </div>
            
            <div class="flex flex-wrap gap-2">
                <label class="cursor-pointer flex items-center space-x-2 bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                    <span>رفع Excel</span>
                    <input type="file" id="uploadExcel" class="hidden" accept=".xlsx, .xls" />
                </label>

                <button onclick="downloadExcel()" class="flex items-center space-x-2 bg-[#1e3a8a] text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-900 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                    <span>تنزيل Excel</span>
                </button>
            </div>
        </div>

        <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <h2 class="text-lg font-semibold text-slate-700 mb-6 text-right">جدول الطلبات الحالي</h2>
            <div class="overflow-x-auto">
                <table id="vacationTable" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-blue-50 text-slate-600 text-xs uppercase tracking-wider font-bold">
                            <th class="px-6 py-4 rounded-l-xl">الموظف (Employee)</th>
                            <th class="px-6 py-4">من (From)</th>
                            <th class="px-6 py-4">إلى (To)</th>
                            <th class="px-6 py-4 rounded-r-xl">الحالة (Status)</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm divide-y divide-slate-100">
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 font-semibold text-slate-700">Abdullah Al-Sulaimani</td>
                            <td class="px-6 py-4 text-slate-500">2026-05-01</td>
                            <td class="px-6 py-4 text-slate-500">2026-05-15</td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-[10px] font-bold uppercase">Pending</span>
                            </td>
                        </tr>
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 font-semibold text-slate-700">Almajdouie Motors</td>
                            <td class="px-6 py-4 text-slate-500">2026-06-10</td>
                            <td class="px-6 py-4 text-slate-500">2026-06-20</td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-[10px] font-bold uppercase">Completed</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // دالة تنزيل الجدول كملف إكسيل
        function downloadExcel() {
            const table = document.getElementById("vacationTable");
            const workbook = XLSX.utils.table_to_book(table, { sheet: "Vacation Schedule" });
            XLSX.writeFile(workbook, "Annual_Leave_Plan.xlsx");
        }

        // دالة رفع وقراءة ملف إكسيل
        document.getElementById('uploadExcel').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                // قراءة أول ورقة في الملف
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // تحويل البيانات إلى JSON
                const jsonData = XLSX.utils.sheet_to_json(worksheet);
                
                // تحديث الجدول في الصفحة بالبيانات الجديدة (تبسيط للعرض)
                alert("تم قراءة الملف بنجاح! عدد الأسطر المكتشفة: " + jsonData.length);
                console.log(jsonData);
            };

            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
