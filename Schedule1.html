<!DOCTYPE html>
<html class="light" lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Almajdouie Motors - Scheduling v10.5.2</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: { "primary": "#00244a", "primary-light": "#003a70", "dark-bg": "#0f172a", "dark-surface": "#1e293b" }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }
    .schedule-table { border-spacing: 0; width: 100%; border-collapse: separate; }
    .schedule-table th { @apply border-b-2 border-slate-100 dark:border-slate-700 p-5 font-black text-[10px] uppercase tracking-widest text-slate-400 text-center; }
    .schedule-table td { @apply border-b border-r border-slate-50 dark:border-slate-800/50 p-3 transition-all text-center; }
    .schedule-table tr:hover td { @apply bg-blue-50/40 dark:bg-slate-800/40; }
    .badge { @apply px-3 py-1.5 text-[10px] font-bold rounded-lg uppercase flex items-center justify-center gap-1 shadow-sm transition-transform hover:scale-105; }
    .Morning { @apply bg-blue-600 text-white; }
    .Night { @apply bg-indigo-900 text-white; }
    .Off { @apply bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300; }
    .Annual { @apply bg-red-600 text-white; } 
    .OnCall { @apply bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300; }
    .Work { @apply bg-green-600 text-white; }
    .Holiday { @apply bg-amber-100 text-amber-700 dark:bg-amber-900/20 dark:text-amber-400; }
    html[dir="rtl"] .sidebar { @apply right-0 border-l; }
    html[dir="ltr"] .sidebar { @apply left-0 border-r; }
    html[dir="rtl"] main { @apply mr-[280px] ml-0; }
    html[dir="ltr"] main { @apply ml-[280px] mr-0; }
    html[dir="rtl"] header { @apply pr-[280px] pl-0; }
    html[dir="ltr"] header { @apply pl-[280px] pr-0; }
    .dark .sidebar { @apply bg-dark-surface border-slate-700; }
    .dark .bg-white { @apply bg-dark-surface border-slate-700 text-white; }
    .dark header { @apply bg-dark-surface/90 border-slate-700; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 999; display: none; align-items: center; justify-content: center; }
  </style>
</head>
<body class="bg-[#f7f9ff] dark:bg-dark-bg text-slate-900 dark:text-slate-100 min-h-screen text-start">

<div class="overlay" id="loginOverlay" style="display:flex;">
  <div class="bg-white dark:bg-dark-surface rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200 dark:border-slate-700 m-4">
    <div class="p-10 text-center bg-primary text-white">
      <img src="LOGO-almajdouie.png" class="h-12 mx-auto mb-6 dark:brightness-200" alt="Logo" />
      <h2 class="text-2xl font-black mb-1" id="loginHeader">تسجيل الدخول</h2>
      <p class="text-blue-200 text-xs font-bold uppercase tracking-widest">Version 10.5.2</p>
    </div>
    <form class="p-10 space-y-5" id="loginForm">
      <div id="loginErr" class="hidden p-3 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-xl text-xs font-bold border border-red-100"></div>
      <input id="loginEmail" type="email" class="w-full rounded-2xl border-slate-200 dark:border-slate-600 dark:bg-slate-800 p-4 text-sm" placeholder="Email" required />
      <input id="loginPassword" type="password" class="w-full rounded-2xl border-slate-200 dark:border-slate-600 dark:bg-slate-800 p-4 text-sm" placeholder="Password" required />
      <button class="w-full bg-primary hover:bg-primary-light text-white font-black py-4 rounded-2xl shadow-xl transition-all" id="loginBtn" type="submit">دخول النظام</button>
    </form>
  </div>
</div>

<aside class="sidebar fixed top-0 h-full w-[280px] bg-white z-40 flex flex-col shadow-2xl transition-all duration-300">
  <div class="p-8 text-center">
    <div class="flex flex-col items-center mb-10 gap-4">
      <img src="LOGO-almajdouie.png" class="h-14 w-auto object-contain dark:brightness-200" alt="Logo" />
      <div>
        <h1 class="text-lg font-black text-primary dark:text-blue-400 leading-none">المجدوعي للسيارات</h1>
        <p class="text-[9px] font-bold text-slate-400 mt-2 uppercase tracking-widest">v10.5.2 Operational Portal</p>
      </div>
    </div>
    <nav class="space-y-2 text-start">
      <button data-tab="schedule" class="tab-btn active w-full flex items-center gap-3 px-5 py-4 text-primary dark:text-white bg-blue-50 dark:bg-blue-900/20 border-inline-start-4 border-primary rounded-2xl transition-all">
        <span class="material-symbols-outlined">grid_view</span> <span class="text-sm font-bold tab-text-schedule">الجدول الرئيسي</span>
      </button>
      <button data-tab="admin" class="tab-btn w-full flex items-center gap-3 px-5 py-4 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-2xl transition-all">
        <span class="material-symbols-outlined">badge</span> <span class="text-sm font-bold tab-text-admin">إدارة الموظفين</span>
      </button>
    </nav>
  </div>
  <div class="mt-auto p-8 border-t border-slate-100 dark:border-slate-700 space-y-4">
    <button onclick="window.toggleDarkMode()" class="w-full flex items-center justify-between px-5 py-4 bg-slate-50 dark:bg-slate-800 rounded-2xl transition-all border border-slate-100 dark:border-slate-700">
      <span class="text-xs font-black dark:hidden uppercase tracking-tight">الوضع الليلي</span>
      <span class="text-xs font-black hidden dark:inline text-blue-400 uppercase tracking-tight">الوضع النهاري</span>
      <span class="material-symbols-outlined text-slate-500 dark:text-blue-400">dark_mode</span>
    </button>
    <div class="grid grid-cols-2 gap-2">
        <button onclick="window.setLanguage('ar')" class="py-2.5 text-[10px] font-black rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800">AR</button>
        <button onclick="window.setLanguage('en')" class="py-2.5 text-[10px] font-black rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800">EN</button>
    </div>
    <button id="btnLogout" class="w-full flex items-center gap-3 px-5 py-3 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 rounded-2xl transition-all">
      <span class="material-symbols-outlined text-xl">power_settings_new</span> <span class="text-xs font-bold btn-logout-text">خروج</span>
    </button>
  </div>
</aside>

<header class="fixed top-0 h-16 bg-white/90 dark:bg-dark-surface/90 backdrop-blur-md border-b border-slate-100 dark:border-slate-700 z-30 flex items-center justify-between px-10 transition-all duration-300">
  <div class="flex items-center gap-4 flex-1">
    <div class="relative w-full max-w-md">
      <span class="material-symbols-outlined absolute inset-y-0 start-4 flex items-center text-slate-400 text-xl">search</span>
      <input class="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-full py-2.5 ps-12 pe-5 text-xs focus:ring-2 focus:ring-primary/20" placeholder="Search..." type="text"/>
    </div>
  </div>
  <div class="flex items-center gap-6">
    <div class="text-end border-inline-start ps-5 dark:border-slate-700 hidden sm:block">
      <p class="text-xs font-black text-primary dark:text-blue-400" id="userDisplayName">Admin</p>
      <p class="text-[9px] text-slate-400 font-bold uppercase">v10.5.2</p>
    </div>
  </div>
</header>

<main class="pt-24 p-8 lg:p-12 transition-all">
  <div class="max-w-7xl mx-auto text-start">
    <div class="mb-10">
      <div class="bg-primary dark:bg-blue-900/40 text-white px-6 py-4 rounded-3xl shadow-xl flex items-center gap-3 border border-blue-800/20">
        <span class="material-symbols-outlined text-blue-300">verified</span>
        <span class="text-xs font-black tracking-wide uppercase" id="bannerText">إصدار v10.5.2 المستقر — تم تفعيل نظام اللغات الكامل للورديات.</span>
      </div>
    </div>

    <section id="schedule" class="tab-content active">
      <div class="flex flex-col md:flex-row justify-between items-end gap-6 mb-10">
        <div>
          <h2 class="text-4xl font-black text-primary dark:text-blue-400 tracking-tighter mb-2" id="mainTitle">جدول المناوبات</h2>
          <p class="text-xs text-slate-400 font-black uppercase tracking-widest" id="capRange"></p>
        </div>
        <button class="bg-primary text-white px-8 py-4 rounded-2xl text-[11px] font-black flex items-center gap-3 shadow-2xl hover:scale-[1.02] transition-all" id="downBtn">
            <span class="material-symbols-outlined text-sm">photo_camera</span> <span id="btnDownloadText">Download Schedule</span>
        </button>
      </div>

      <div class="bg-white dark:bg-dark-surface p-6 rounded-[2rem] border border-slate-100 dark:border-slate-700 mb-10 flex flex-wrap items-center justify-between gap-6 shadow-sm">
        <div class="flex items-center gap-3">
          <button class="p-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-primary dark:text-blue-400 transition-all" id="btnPrevWeek"><span class="material-symbols-outlined">chevron_right</span></button>
          <button class="px-8 py-3 bg-slate-50 dark:bg-slate-800 text-[10px] font-black rounded-2xl border border-slate-100 dark:border-slate-700" id="btnCurrentWeek">Today</button>
          <button class="p-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-primary dark:text-blue-400 transition-all" id="btnNextWeek"><span class="material-symbols-outlined">chevron_left</span></button>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter" id="lblSelectDate">Select Date:</span>
            <input type="date" id="datePicker" class="rounded-2xl border-slate-200 dark:border-slate-700 dark:bg-slate-800 text-xs font-black h-12 px-5 focus:ring-primary shadow-sm" />
        </div>
      </div>

      <div class="bg-white dark:bg-dark-surface rounded-[2.5rem] border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden" id="scheduleCapture">
        <div class="overflow-x-auto">
          <table class="schedule-table">
            <thead><tr id="headerDates" class="bg-slate-50/50 dark:bg-slate-900/30"></tr></thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
        <div class="p-8 bg-slate-50/30 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700 flex flex-wrap gap-5 justify-center" id="legendBar"></div>
      </div>
    </section>

    <section id="admin" class="tab-content">
        <div class="bg-white dark:bg-dark-surface p-10 rounded-[2.5rem] border border-slate-200 dark:border-slate-700 shadow-2xl">
            <h3 class="text-2xl font-black text-primary dark:text-blue-400 mb-8 tracking-tighter" id="adminTitle">إدارة الموظفين</h3>
            <div class="flex flex-col sm:flex-row gap-4 mb-12">
                <input type="text" id="newEmpName" class="flex-1 rounded-2xl border-slate-200 dark:border-slate-700 dark:bg-slate-800 p-5 text-sm focus:ring-primary shadow-sm" placeholder="Employee Name..." />
                <button class="bg-primary text-white px-12 py-5 rounded-2xl font-black shadow-xl" id="btnAddEmployee">+ Add</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-start divide-y divide-slate-100 dark:divide-slate-800">
                    <thead><tr class="text-slate-400 text-[10px] font-black uppercase tracking-widest">
                      <th class="pb-6" id="thName">Name</th>
                      <th class="pb-6" id="thShift">Fixed Shift</th>
                      <th class="pb-6" id="thRot">Rotation</th>
                      <th class="pb-6 text-center" id="thStatus">Status</th>
                      <th></th>
                    </tr></thead>
                    <tbody id="adminBody"></tbody>
                </table>
            </div>
        </div>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, doc, getDoc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325' };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

const i18n = { 
    ar: { 
      mainTitle:'جدول المناوبات', login:'دخول النظام', logout:'خروج', schedule:'الجدول الرئيسي', admin:'إدارة الموظفين', download:'تحميل الجدول كصورة', today:'اليوم', selectDate:'اختر التاريخ:', staff:'الموظف', name:'الاسم', shift:'الوردية الثابتة', rotation:'التناوب', status:'الحالة', add:'+ إضافة', banner:'إصدار v10.5.2 المستقر — تم تفعيل نظام اللغات الكامل للورديات.',
      days:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],
      shifts: { Morning:'صباحي', Night:'ليلي', Annual:'إجازة', Off:'أوف', OnCall:'أون كول', Work:'تغطية', Holiday:'عطلة', National:'وطني' }
    }, 
    en: { 
      mainTitle:'Shift Schedule', login:'Login', logout:'Logout', schedule:'Main Dashboard', admin:'Staff Admin', download:'Download Image', today:'Today', selectDate:'Select Date:', staff:'Staff', name:'Name', shift:'Fixed Shift', rotation:'Rotation', status:'Status', add:'+ Add', banner:'v10.5.2 Stable — Multi-language shift labels now active.',
      days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
      shifts: { Morning:'Morning', Night:'Night', Annual:'Annual', Off:'Off', OnCall:'OnCall', Work:'Work', Holiday:'Holiday', National:'National' }
    } 
};

let currentLang=localStorage.getItem('almajdouie_lang')||'ar', employees=[], manualOverrides={};
const $=id=>document.getElementById(id);

window.toggleDarkMode = () => {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
};

window.setLanguage = (lang) => {
    currentLang = lang;
    localStorage.setItem('almajdouie_lang', lang);
    applyLanguage();
    renderAll();
};

function applyLanguage(){
    const html = $('mainHtml'), t = i18n[currentLang];
    html.lang = currentLang; html.dir = currentLang==='ar'?'rtl':'ltr';
    $('mainTitle').textContent = t.mainTitle;
    $('loginBtn').textContent = t.login;
    $('btnDownloadText').textContent = t.download;
    $('bannerText').textContent = t.banner;
    $('btnCurrentWeek').textContent = t.today;
    $('lblSelectDate').textContent = t.selectDate;
    $('adminTitle').textContent = t.admin;
    $('btnAddEmployee').textContent = t.add;
    $('thName').textContent = t.name;
    $('thShift').textContent = t.shift;
    $('thRot').textContent = t.rotation;
    $('thStatus').textContent = t.status;
    document.querySelector('.btn-logout-text').textContent = t.logout;
    document.querySelector('.tab-text-schedule').textContent = t.schedule;
    document.querySelector('.tab-text-admin').textContent = t.admin;
    
    const icons = { ar:['chevron_right','chevron_left'], en:['chevron_left','chevron_right'] };
    $('btnPrevWeek').innerHTML = `<span class="material-symbols-outlined">${icons[currentLang][0]}</span>`;
    $('btnNextWeek').innerHTML = `<span class="material-symbols-outlined">${icons[currentLang][1]}</span>`;
}

const SHIFT_META = { 
    'Morning': {cls:'Morning', icon:'☀️'}, 'Night': {cls:'Night', icon:'🌙'}, 'Annual': {cls:'Annual', icon:''}, 
    'Off': {cls:'Off', icon:'🏠'}, 'OnCall': {cls:'OnCall', icon:'📞'}, 'Work': {cls:'Work', icon:'🏢'},
    'Holiday': {cls:'Holiday', icon:'🎊'}, 'National': {cls:'NationalDay', icon:'🇸🇦'}
};

async function bindSnapshots(){
    onSnapshot(doc(db,'schedule','jadwal_v6'), s=>{ employees=s.exists()?s.data().data?.emps:[]; renderAll(); });
    onSnapshot(doc(db,'schedule','manual_overrides'), s=>{ manualOverrides=s.exists()?s.data():{}; renderAll(); });
}

function renderAll(){
    const dp=$('datePicker'), t=i18n[currentLang]; 
    if(!dp.value) { window.setCurrentWeek(); return; }

    const start=new Date(dp.value.replace(/-/g,'/'));
    const weekNum=Math.ceil(((start - new Date(start.getFullYear(),0,1))/86400000 + new Date(start.getFullYear(),0,1).getDay() + 1)/7);
    const thuPool=employees.filter(e=>e.rotType==='thu'&&e.active), friPool=employees.filter(e=>e.rotType==='fri'&&e.active);
    const curThu=thuPool.length>0?thuPool[weekNum % thuPool.length].id:null, curFri=friPool.length>0?friPool[weekNum % friPool.length].id:null;

    let h=`<th class="ps-10 py-6 text-start">${t.staff}</th>`;
    for(let i=0;i<7;i++){ 
        let d=new Date(start.getTime()); d.setDate(start.getDate()+i); 
        h+=`<th class="text-center">${t.days[d.getDay()]}<br><span class="text-[9px] opacity-40 font-black">${d.getDate()}/${d.getMonth()+1}</span></th>`; 
    }
    $('headerDates').innerHTML=h;

    $('scheduleBody').innerHTML = employees.filter(e=>e.active).map(emp=>{
        let row=`<tr><td class="ps-10 py-6 font-black text-primary dark:text-blue-400 text-xs text-start">${emp.name}</td>`;
        for(let d=0;d<7;d++){
            let cell=new Date(start.getTime()); cell.setDate(start.getDate()+d);
            let dateKey=cell.toISOString().split('T')[0];
            let shift=manualOverrides[`${emp.id}_${dateKey}`];
            if(!shift){
                if(d===4) shift=(emp.id===curThu)?'Off':(emp.fixed?'Night':'Morning');
                else if(d===5) shift=(emp.id===curThu)?'Off':(emp.id===curFri?'OnCall':'Off');
                else if(d===6) shift=(emp.id===curThu)?'Work':'Off';
                else shift=emp.fixed?'Night':'Morning';
            }
            let s=SHIFT_META[shift]||SHIFT_META['Morning'];
            row+=`<td><span class="badge ${s.cls} mx-auto">${s.icon} ${t.shifts[shift]||shift}</span></td>`;
        } return row+'</tr>';
    }).join('');
    renderAdmin(); renderLegend();
}

function renderAdmin(){
    const t=i18n[currentLang];
    $('adminBody').innerHTML = employees.map((e,i)=>`
        <tr class="border-b border-slate-50 dark:border-slate-800/50 hover:bg-slate-50/50">
            <td class="py-6 font-bold text-xs text-start ps-4">${e.name}</td>
            <td class="py-6"><span class="px-3 py-1.5 bg-primary text-white text-[10px] rounded-lg font-black">${e.fixed?t.shifts.Night:t.shifts.Morning}</span></td>
            <td class="py-6 text-[10px] font-black text-slate-400 uppercase">${e.rotType||'None'}</td>
            <td class="py-6 text-center"><span class="px-3 py-1 bg-green-50 dark:bg-green-900/20 text-green-600 text-[10px] font-black rounded-lg">${e.active?'ACTIVE':'HIDDEN'}</span></td>
            <td class="py-6 text-end pe-4"><button class="text-red-300 hover:text-red-500 transition-all"><span class="material-symbols-outlined">delete</span></button></td>
        </tr>`).join('');
}

function renderLegend(){
    const t=i18n[currentLang];
    $('legendBar').innerHTML = Object.keys(SHIFT_META).map(k=>`<div class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-2xl shadow-sm"><span class="badge ${SHIFT_META[k].cls}">${SHIFT_META[k].icon} ${t.shifts[k]||k}</span></div>`).join('');
}

$('loginForm').onsubmit=async e=>{
    e.preventDefault(); const err=$('loginErr'); err.classList.add('hidden');
    try{ 
        const cred=await signInWithEmailAndPassword(auth,$('loginEmail').value,$('loginPassword').value);
        const snap=await getDoc(doc(db,'app_users',cred.user.uid));
        if(!snap.exists() || snap.data().role!=='admin') throw new Error('Unauthorized');
    } catch(e){ err.textContent=e.message; err.classList.remove('hidden'); }
};

onAuthStateChanged(auth, u=>{ 
    if(!u){ $('loginOverlay').style.display='flex'; } 
    else { $('loginOverlay').style.display='none'; $('userDisplayName').textContent=u.email; bindSnapshots(); window.setCurrentWeek(); } 
});

window.setCurrentWeek=()=>{ let n=new Date(); n.setDate(n.getDate()-n.getDay()); $('datePicker').value=n.toISOString().split('T')[0]; renderAll(); };
$('btnPrevWeek').onclick=()=>{ let d=new Date($('datePicker').value); d.setDate(d.getDate()-7); $('datePicker').value=d.toISOString().split('T')[0]; renderAll(); };
$('btnNextWeek').onclick=()=>{ let d=new Date($('datePicker').value); d.setDate(d.getDate()+7); $('datePicker').value=d.toISOString().split('T')[0]; renderAll(); };
$('btnLogout').onclick=()=>signOut(auth);
$('datePicker').onchange=()=>renderAll();

if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark');
window.addEventListener('DOMContentLoaded', ()=> { applyLanguage(); });
</script>
</body>
</html>
