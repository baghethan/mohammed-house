<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المجدوعي للسيارات</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,sans-serif; direction:rtl; padding:20px; background-color: #f0f2f5;}
        
        /* شاشة تسجيل الدخول */
        #login-screen {
            max-width: 400px; margin: 100px auto; background: white; padding: 30px;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;
        }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        .btn-login { width: 100%; padding: 12px; background: #0369a1; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* شاشة النظام الأساسية (مخفية في البداية) */
        #main-system { display: none; max-width: 850px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }

        /* التبويبات */
        .tabs-header { display: flex; background: #e2e8f0; border-bottom: 3px solid #0369a1; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-weight: bold; color: #475569; }
        .tab-btn.active { background: #0369a1; color: #fff; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        /* زر الإجازة المعدل */
        .btn-vacation { display: inline-block; font-size: 18px; font-weight: bold; background: #0369a1; color: #fff !important; border-radius: 10px; padding: 15px 40px; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="color:#0369a1; margin-bottom:20px;">تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="btn-login" onclick="checkLogin()">دخول</button>
        <p id="error-msg" style="color:red; font-size:12px; margin-top:10px; display:none;">خطأ في اسم المستخدم أو كلمة المرور!</p>
    </div>

    <div id="main-system">
        <div class="tabs-header">
            <button class="tab-btn active" onclick="openTab(event, 'schedule-tab')">📅 جدول الدوام</button>
            <button class="tab-btn" onclick="openTab(event, 'vacation-tab')">📝 خطة الإجازات</button>
        </div>

        <div id="schedule-tab" class="tab-content active">
            <h2 style="text-align:center; color:#0369a1;">جدول الدوام الأسبوعي</h2>
            <div id="schedule-data" style="margin-top:20px;">
                <p style="text-align:center;">مرحباً بك.. جاري تحميل جدولك الخاص.</p>
            </div>
        </div>

        <div id="vacation-tab" class="tab-content">
            <div style="text-align: center;">
                <h2>نظام خطة الإجازات</h2>
                <p>اضغط على الزر أدناه للانتقال لصفحة التخطيط</p>
                <a href="https://baghethan.com/plan-Vacation.html" target="_blank" class="btn-vacation">
                    <span style="font-size:24px; vertical-align:middle; margin-left:8px;">&#128197;</span> تخطيط الإجازة
                </a>
            </div>
        </div>
    </div>

<script>
    // وظيفة التحقق من تسجيل الدخول
    function checkLogin() {
        var user = document.getElementById('username').value;
        var pass = document.getElementById('password').value;

        // يمكنك تغيير "admin" و "1234" بما تفضله
        if (user === "admin" && pass === "1234") {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-system').style.display = 'block';
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    }

    // وظيفة التبديل بين التبويبات
    function openTab(evt, tabName) {
        var tabcontent = document.getElementsByClassName("tab-content");
        for (var i = 0; i < tabcontent.length; i++) tabcontent[i].classList.remove("active");
        
        var tablinks = document.getElementsByClassName("tab-btn");
        for (var i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
        
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }
</script>

</body>
</html>
