<!DOCTYPE html>
<html class="light" lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Almajdouie Motors - Scheduling v10.5.0</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00244a",
            "primary-light": "#003a70",
            "dark-bg": "#0f172a",
            "dark-surface": "#1e293b"
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }
    
    /* تنسيق الجدول الجمالي بلمسة عصرية */
    .schedule-table { border-spacing: 0; width: 100%; border-collapse: separate; }
    .schedule-table th { @apply border-b-2 border-slate-100 dark:border-slate-700 p-5 font-black text-[10px] uppercase tracking-widest text-slate-400; }
    .schedule-table td { @apply border-b border-r border-slate-50 dark:border-slate-800/50 p-2.5 transition-all; }
    .schedule-table tr:hover td { @apply bg-blue-50/30 dark:bg-slate-800/40; }

    /* شارات الورديات (تم حذف النخلة) */
    .badge { @apply px-3 py-1.5 text-[10px] font-bold rounded-lg uppercase flex items-center justify-center gap-1 shadow-sm transition-transform hover:scale-105; }
    .Morning { @apply bg-blue-600 text-white; }
    .Night { @apply bg-indigo-900 text-white; }
    .Off { @apply bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300; }
    .Annual { @apply bg-red-600 text-white; } 
    .OnCall { @apply bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300; }
    .Work { @apply bg-green-600 text-white; }
    .Holiday { @apply bg-amber-100 text-amber-700 dark:bg-amber-900/20 dark:text-amber-400; }

    /* التحكم في الاتجاهات والقوائم */
    html[dir="rtl"] .sidebar { @apply right-0 border-l; }
    html[dir="ltr"] .sidebar { @apply left-0 border-r; }
    html[dir="rtl"] main { @apply mr-[280px] ml-0; }
    html[dir="ltr"] main { @apply ml-[280px] mr-0; }
    
    .dark .sidebar { @apply bg-dark-surface border-slate-700; }
    .dark .bg-white { @apply bg-dark-surface border-slate-700 text-white; }
    .dark header { @apply bg-dark-surface/90 border-slate-700; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 999; display: none; align-items: center; justify-content: center; }
  </style>
</head>
<body class="bg-[#f7f9ff] dark:bg-dark-bg text-slate-900 dark:text-slate-100 min-h-screen text-start">

<div class="overlay" id="loginOverlay" style="display:flex;">
  <div class="bg-white dark:bg-dark-surface rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200 dark:border-slate-700 m-4">
    <div class="p-10 text-center bg-primary text-white">
      <img src="LOGO-almajdouie.png" class="h-12 mx-auto mb-6 dark:brightness-200" alt="Almajdouie Logo" />
      <h2 class="text-2xl font-black mb-1">تسجيل الدخول</h2>
      <p class="text-blue-200 text-xs font-bold uppercase tracking-widest">Version 10.5.0</p>
    </div>
    <form class="p-10 space-y-5" id="loginForm">
      <div id="loginErr" class="hidden p-3 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-xl text-xs font-bold border border-red-100 dark:border-red-800"></div>
      <input id="loginEmail" type="email" class="w-full rounded-2xl border-slate-200 dark:border-slate-600 dark:bg-slate-800 p-4 text-sm focus:ring-primary" placeholder="Email" required />
      <input id="loginPassword" type="password" class="w-full rounded-2xl border-slate-200 dark:border-slate-600 dark:bg-slate-800 p-4 text-sm focus:ring-primary" placeholder="Password" required />
      <button class="w-full bg-primary hover:bg-primary-light text-white font-black py-4 rounded-2xl shadow-xl transition-all" id="loginBtn" type="submit">دخول النظام</button>
    </form>
  </div>
</div>

<aside class="sidebar fixed top-0 h-full w-[280px] bg-white z-40 flex flex-col shadow-2xl transition-all duration-300">
  <div class="p-8">
    <div class="flex flex-col items-center mb-10 gap-4">
      <img src="LOGO-almajdouie.png" class="h-14 w-auto object-contain dark:brightness-200" alt="Almajdouie Logo" />
      <div class="text-center">
        <h1 class="text-lg font-black text-primary dark:text-blue-400 leading-none">المجدوعي للسيارات</h1>
        <p class="text-[9px] font-bold text-slate-400 mt-2 uppercase tracking-widest">v10.5.0 Operational Portal</p>
      </div>
    </div>
    <nav class="space-y-2">
      <button data-tab="schedule" class="tab-btn active w-full flex items-center gap-3 px-5 py-4 text-primary dark:text-white bg-blue-50 dark:bg-blue-900/20 border-r-4 border-primary rounded-2xl transition-all shadow-sm">
        <span class="material-symbols-outlined">grid_view</span> <span class="text-sm font-bold">الجدول الرئيسي</span>
      </button>
      <button data-tab="admin" class="tab-btn w-full flex items-center gap-3 px-5 py-4 text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-2xl transition-all">
        <span class="material-symbols-outlined">badge</span> <span class="text-sm font-bold">إدارة الموظفين</span>
      </button>
    </nav>
  </div>

  <div class="mt-auto p-8 border-t border-slate-100 dark:border-slate-700 space-y-4">
    <button onclick="window.toggleDarkMode()" class="w-full flex items-center justify-between px-5 py-4 bg-slate-50 dark:bg-slate-800 rounded-2xl transition-all hover:scale-[1.02] border border-slate-100 dark:border-slate-700">
      <span class="text-xs font-black dark:hidden uppercase tracking-tight">الوضع الليلي</span>
      <span class="text-xs font-black hidden dark:inline text-blue-400 uppercase tracking-tight">الوضع النهاري</span>
      <span class="material-symbols-outlined text-slate-500 dark:text-blue-400">dark_mode</span>
    </button>
    
    <div class="grid grid-cols-2 gap-2">
        <button onclick="window.setLanguage('ar')" class="py-2.5 text-[10px] font-black rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-slate-50 transition-all">AR</button>
        <button onclick="window.setLanguage('en')" class="py-2.5 text-[10px] font-black rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 hover:bg-slate-50 transition-all">EN</button>
    </div>
    
    <button id="btnLogout" class="w-full flex items-center gap-3 px-5 py-3 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 rounded-2xl transition-all">
      <span class="material-symbols-outlined text-xl">power_settings_new</span> <span class="text-xs font-bold">خروج</span>
    </button>
  </div>
</aside>

<header class="fixed top-0 inset-x-0 h-16 bg-white/90 dark:bg-dark-surface/90 backdrop-blur-md border-b border-slate-100 dark:border-slate-700 z-30 flex items-center justify-between px-10">
  <div class="flex items-center gap-4 flex-1">
    <div class="relative w-full max-w-md">
      <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">search</span>
      <input class="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-full py-2.5 pr-12 pl-5 text-xs focus:ring-2 focus:ring-primary/20" placeholder="بحث سريع عن موظف..." type="text"/>
    </div>
  </div>
  <div class="flex items-center gap-6">
    <div class="text-left border-l pl-5 dark:border-slate-700">
      <p class="text-xs font-black text-primary dark:text-blue-400" id="userDisplayName">Admin</p>
      <p class="text-[9px] text-slate-400 font-bold uppercase">v10.5.0</p>
    </div>
  </div>
</header>

<main class="pt-24 p-8 lg:p-12 transition-all">
  <div class="max-w-7xl mx-auto">
    
    <div class="mb-10">
      <div class="bg-primary dark:bg-blue-900/40 text-white px-6 py-4 rounded-3xl shadow-xl flex items-center justify-between border border-blue-800/20">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-blue-300">rocket_launch</span>
          <span class="text-xs font-black tracking-wide uppercase">إصدار v10.5.0 — تم تفعيل الوضع الليلي وتحديث أيقونات الإجازات.</span>
        </div>
      </div>
    </div>

    <section id="schedule" class="tab-content active text-start">
      <div class="flex flex-col md:flex-row justify-between items-end gap-6 mb-10">
        <div>
          <h2 class="text-4xl font-black text-primary dark:text-blue-400 tracking-tighter mb-2">جدول المناوبات</h2>
          <p class="text-xs text-slate-400 font-black uppercase tracking-widest" id="capRange"></p>
        </div>
        <button class="bg-primary text-white px-8 py-4 rounded-2xl text-[11px] font-black flex items-center gap-3 shadow-2xl hover:scale-[1.02] transition-all" id="downBtn">
            <span class="material-symbols-outlined text-sm">photo_camera</span> تحميل الجدول كصورة
        </button>
      </div>

      <div class="bg-white dark:bg-dark-surface p-6 rounded-[2rem] border border-slate-100 dark:border-slate-700 mb-10 flex flex-wrap items-center justify-between gap-6 shadow-sm">
        <div class="flex items-center gap-3">
          <button class="p-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-primary dark:text-blue-400 transition-all" id="btnPrevWeek"><span class="material-symbols-outlined">chevron_right</span></button>
          <button class="px-8 py-3 bg-slate-50 dark:bg-slate-800 text-[10px] font-black rounded-2xl border border-slate-100 dark:border-slate-700" id="btnCurrentWeek">اليوم</button>
          <button class="p-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-primary dark:text-blue-400 transition-all" id="btnNextWeek"><span class="material-symbols-outlined">chevron_left</span></button>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">اختر التاريخ:</span>
            <input type="date" id="datePicker" class="rounded-2xl border-slate-200 dark:border-slate-700 dark:bg-slate-800 text-xs font-black h-12 px-5 focus:ring-primary shadow-sm" />
        </div>
      </div>

      <div class="bg-white dark:bg-dark-surface rounded-[2.5rem] border border-slate-200 dark:border-slate-700 shadow-2xl overflow-hidden" id="scheduleCapture">
        <div class="overflow-x-auto">
          <table class="schedule-table text-right">
            <thead><tr id="headerDates" class="bg-slate-50/50 dark:bg-slate-900/30"></tr></thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
        <div class="p-8 bg-slate-50/30 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700 flex flex-wrap gap-5 justify-center" id="legendBar"></div>
      </div>
    </section>

    <section id="admin" class="tab-content">
        <div class="bg-white dark:bg-dark-surface p-10 rounded-[2.5rem] border border-slate-200 dark:border-slate-700 shadow-2xl">
            <h3 class="text-2xl font-black text-primary dark:text-blue-400 mb-8 tracking-tighter">إدارة الموظفين والورديات</h3>
            <div class="flex flex-col sm:flex-row gap-4 mb-12">
                <input type="text" id="newEmpName" class="flex-1 rounded-2xl border-slate-200 dark:border-slate-700 dark:bg-slate-800 p-5 text-sm focus:ring-primary shadow-sm" placeholder="اسم الموظف الجديد..." />
                <button class="bg-primary text-white px-12 py-5 rounded-2xl font-black shadow-xl" id="btnAddEmployee">+ إضافة</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right divide-y divide-slate-100 dark:divide-slate-800">
                    <thead><tr class="text-slate-400 text-[10px] font-black uppercase tracking-widest"><th class="pb-6">الاسم</th><th class="pb-6">الوردية</th><th class="pb-6">التناوب</th><th class="pb-6">الحالة</th><th></th></tr></thead>
                    <tbody id="adminBody"></tbody>
                </table>
            </div>
        </div>
    </section>

  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, doc, getDoc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325' };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

let currentLang='ar', employees=[], manualOverrides={};
const $=id=>document.getElementById(id);

window.toggleDarkMode = () => {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
};

const SHIFTS = { 
    'Morning': {t:'صباحي', cls:'Morning', icon:'☀️'}, 
    'Night': {t:'ليلي', cls:'Night', icon:'🌙'}, 
    'Annual': {t:'إجازة', cls:'Annual', icon:''}, // تم حذف النخلة هنا بناءً على طلبك
    'Off': {t:'أوف', cls:'Off', icon:'🏠'}, 
    'OnCall': {t:'أون كول', cls:'OnCall', icon:'📞'}, 
    'Work': {t:'تغطية', cls:'Work', icon:'🏢'},
    'Holiday': {t:'عطلة', cls:'Holiday', icon:'🎊'}
};

function renderAll(){
    const dp=$('datePicker'); if(!dp.value) return;
    const start=new Date(dp.value.replace(/-/g,'/')), t=currentLang==='ar'?'ar-SA':'en-GB';
    
    let h=`<th class="pr-10 py-6 text-start">Employee</th>`;
    for(let i=0;i<7;i++){ 
        let d=new Date(start.getTime()); d.setDate(start.getDate()+i); 
        h+=`<th class="text-center">${d.toLocaleDateString(t,{weekday:'short'})}<br><span class="text-[9px] opacity-40 font-black tracking-tighter">${d.getDate()}/${d.getMonth()+1}</span></th>`; 
    }
    $('headerDates').innerHTML=h;

    $('scheduleBody').innerHTML = employees.filter(e=>e.active).map(emp=>{
        let row=`<tr><td class="pr-10 py-6 font-black text-primary dark:text-blue-400 text-xs">${emp.name}</td>`;
        for(let d=0;d<7;d++){
            let cell=new Date(start.getTime()); cell.setDate(start.getDate()+d);
            let dateKey=cell.toISOString().split('T')[0];
            let shiftKey=manualOverrides[`${emp.id}_${dateKey}`] || (emp.fixed?'Night':'Morning');
            let s=SHIFTS[shiftKey] || SHIFTS['Morning'];
            row+=`<td class="text-center"><span class="badge ${s.cls} mx-auto">${s.icon} ${s.t}</span></td>`;
        } return row+'</tr>';
    }).join('');
    renderAdmin(); renderLegend();
}

function renderAdmin(){
    $('adminBody').innerHTML = employees.map((e,i)=>`
        <tr class="border-b border-slate-50 dark:border-slate-800/50 transition-colors hover:bg-slate-50/50 dark:hover:bg-slate-800/30">
            <td class="py-6 font-bold text-xs">${e.name}</td>
            <td class="py-6"><span class="px-3 py-1.5 bg-primary text-white text-[10px] rounded-lg font-black">${e.fixed?'🌙 Night':'☀️ Morning'}</span></td>
            <td class="py-6 text-[10px] font-black text-slate-400 uppercase tracking-tighter">${e.rotType||'None'}</td>
            <td class="py-6"><span class="px-3 py-1 bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 text-[10px] font-black rounded-lg border border-green-100 dark:border-green-800/50">${e.active?'ACTIVE':'HIDDEN'}</span></td>
            <td class="py-6 text-end"><button class="text-red-300 hover:text-red-500 transition-all"><span class="material-symbols-outlined">delete</span></button></td>
        </tr>`).join('');
}

function renderLegend(){
    $('legendBar').innerHTML = Object.keys(SHIFTS).map(k=>`<div class="flex items-center gap-2 px-4 py-2 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-2xl shadow-sm"><span class="badge ${SHIFTS[k].cls}">${SHIFTS[k].icon} ${SHIFTS[k].t}</span></div>`).join('');
}

$('loginForm').onsubmit=async e=>{
    e.preventDefault(); const err=$('loginErr'); err.classList.add('hidden');
    try{ 
        const cred=await signInWithEmailAndPassword(auth,$('loginEmail').value,$('loginPassword').value);
        const snap=await getDoc(doc(db,'app_users',cred.user.uid));
        if(!snap.exists() || snap.data().role!=='admin') throw new Error('Unauthorized Access');
    } catch(e){ err.textContent=e.message; err.classList.remove('hidden'); }
};

onAuthStateChanged(auth, u=>{ 
    if(!u){ $('loginOverlay').style.display='flex'; } 
    else { $('loginOverlay').style.display='none'; $('userDisplayName').textContent=u.email; bindSnapshots(); window.setCurrentWeek(); } 
});

window.setCurrentWeek=()=>{ let n=new Date(); n.setDate(n.getDate()-n.getDay()); $('datePicker').value=n.toISOString().split('T')[0]; renderAll(); };
$('btnPrevWeek').onclick=()=>{ let d=new Date($('datePicker').value); d.setDate(d.getDate()-7); $('datePicker').value=d.toISOString().split('T')[0]; renderAll(); };
$('btnNextWeek').onclick=()=>{ let d=new Date($('datePicker').value); d.setDate(d.getDate()+7); $('datePicker').value=d.toISOString().split('T')[0]; renderAll(); };
$('btnLogout').onclick=()=>signOut(auth);
if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark');
window.addEventListener('DOMContentLoaded', ()=> { 
    onSnapshot(doc(db,'schedule','jadwal_v6'), s=>{ employees=s.exists()?s.data().data?.emps:[]; renderAll(); });
    onSnapshot(doc(db,'schedule','manual_overrides'), s=>{ manualOverrides=s.exists()?s.data():{}; renderAll(); });
});
</script>
</body>
</html>
