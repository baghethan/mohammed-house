body::before{content:'';position:fixed;inset:0;background:rgba(10,25,50,0.55);z-index:0;}
.card{position:relative;z-index:1;}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:10px;overflow:hidden}
.top{background:#1a3558;padding:10px 18px;text-align:center}
.top h1{color:#fff;font-size:15px;font-weight:700}
.top p{color:#a8c8f0;font-size:10px;margin-top:3px}
.nav{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;background:#f0f5fb;flex-wrap:wrap;border-bottom:1px solid #e0eaf5}
.nb{border:none;border-radius:7px;padding:6px 13px;font-size:11.5px;cursor:pointer;font-weight:700}
.nb:hover{filter:brightness(1.1)}
.bn{background:#1a3558;color:#fff}.bg{background:#1b5e20;color:#fff}
.br{background:#b71c1c;color:#fff}.by{background:#e65100;color:#fff}
.bpur{background:#7b1fa2;color:#fff}
.wlbl{font-size:11px;color:#1a3558;font-weight:700;background:#ddeeff;border-radius:6px;padding:4px 11px}
.rotA{font-size:10.5px;font-weight:700;border-radius:6px;padding:4px 9px;background:#e8f5e9;color:#1b5e20}
.rotB{font-size:10.5px;font-weight:700;border-radius:6px;padding:4px 9px;background:#fff3e0;color:#e65100}
.rotC{font-size:10.5px;font-weight:700;border-radius:6px;padding:4px 9px;background:#f3e5f5;color:#6a1b9a}
.rotD{font-size:10.5px;font-weight:700;border-radius:6px;padding:4px 9px;background:#fce4ec;color:#b71c1c}
.ncbanner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#f3e5f5;border-bottom:2px solid #ce93d8;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:8px 14px 0;background:#f0f5fb;border-bottom:1px solid #dde8f5}
.tab{padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;border-radius:7px 7px 0 0;border:1px solid transparent;color:#666;background:transparent}
.tab.active{background:#fff;color:#1a3558;border-color:#dde8f5;border-bottom-color:#fff;margin-bottom:-1px}
.tab:hover:not(.active){background:#e8f0fb;color:#1a3558}
.inf{background:#e8f4fd;border-top:1px solid #b3d9f5;padding:6px 14px;font-size:10px;color:#0d47a1;text-align:center;line-height:1.7}
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:1020px}
th{background:#1a3558;color:#fff;padding:7px 4px;text-align:center;border:1px solid #2a4878;font-size:10px;white-space:nowrap}
td{border:1px solid #dde8f5;padding:4px 3px;text-align:center;vertical-align:middle}
.en{text-align:right;padding-right:8px;font-weight:700;color:#1a3558;font-size:11px}
.sh{border-radius:5px;padding:3px 6px;display:inline-block;font-size:10px;font-weight:700;white-space:nowrap;line-height:1.45}
.sh small{font-size:8.5px;font-weight:400;display:block}
.sm{background:#e3f2fd;color:#0d47a1}.sn{background:#ede7f6;color:#4527a0}
.sa{background:#fff3e0;color:#bf6000}.so{background:#fce4ec;color:#b71c1c}
.sl{background:#f3e5f5;color:#6a1b9a}.si{background:#f5f5f5;color:#9e9e9e;border:1px dashed #ccc}
.sw{background:#e8f5e9;color:#1b5e20}.sc{background:#ede7f6;color:#4a148c;border:2px solid #ce93d8}
.frih{background:#1a4a2a!important}.sath{background:#1d3d72!important}
.fric{background:#f1faf4!important}.satc{background:#eef3fb!important}
.covr td{background:#0f2035;color:#a8c8f0;font-size:10px;border-color:#1a3558;padding:4px}
.cn{font-size:12px;font-weight:800}
.dof{font-size:10px;font-weight:700;color:#1b5e20;background:#f0fff4;padding:3px 6px;border-radius:5px;display:inline-block;white-space:nowrap}
.cat{font-size:9px;font-weight:700;border-radius:4px;padding:2px 7px;display:inline-block;margin:1px;white-space:nowrap}
.cat-emp{background:#e3f2fd;color:#0d47a1}.cat-sup{background:#fff3e0;color:#bf6000}
.cat-mgr{background:#e8eaf6;color:#283593}.cat-tra{background:#f3e5f5;color:#6a1b9a}
.cat-tam{background:#e8f5e9;color:#1b5e20}
.tag{font-size:9px;font-weight:700;border-radius:4px;padding:1px 6px;display:inline-block;margin:0 1px}
.tag-leave{background:#f3e5f5;color:#6a1b9a}
.tag-cover{background:#ede7f6;color:#4a148c;border:1px solid #ce93d8}
.cat-sep td{background:#f8f9fa;font-size:10px;font-weight:700;color:#555;padding:4px 8px;border-color:#e0e8f0}
.formbox{padding:14px 16px;background:#f8fafc;border-top:1px solid #e0eaf5}
.formbox h3{color:#1a3558;font-size:13px;font-weight:700;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:10px}
.fgrid label{font-size:11px;color:#444;display:block;margin-bottom:3px}
.fgrid input,.fgrid select{border:1px solid #b0c8e8;border-radius:6px;padding:7px 10px;font-size:12px;color:#1a3558;background:#fff;width:100%}
.fnote{font-size:10px;color:#555;margin-top:6px;background:#fff8e1;border-radius:5px;padding:6px 10px;border:1px solid #ffe082;line-height:1.6}
.fnote-n{background:#f3e5f5;border-color:#ce93d8;color:#4a148c}
.fbtn-row{display:flex;gap:8px;margin-top:10px}
.nsec{background:#f9f4ff;border:1px solid #ce93d8;border-radius:8px;padding:12px;margin-top:10px}
.nsec h4{font-size:12px;font-weight:700;color:#4a148c;margin-bottom:8px}
.leave-list,.emp-list{padding:10px 14px}
.lv-item,.emp-item{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:8px;border:1px solid #e0eaf5;margin-bottom:7px;background:#fff;flex-wrap:wrap}
.lv-item.lv-active{border-color:#ce93d8;background:#fdf5ff}
.lv-item.lv-abd{border-color:#7b1fa2;border-width:2px;background:#faf3ff}
.lv-item.lv-past{opacity:.6}
.ls-a{font-size:10px;font-weight:700;border-radius:5px;padding:3px 8px;background:#f3e5f5;color:#6a1b9a}
.ls-f{font-size:10px;font-weight:700;border-radius:5px;padding:3px 8px;background:#e8f5e9;color:#1b5e20}
.ls-p{font-size:10px;font-weight:700;border-radius:5px;padding:3px 8px;background:#f5f5f5;color:#888}
.cvbadge{font-size:10px;font-weight:700;border-radius:5px;padding:3px 9px;background:#ede7f6;color:#4a148c;border:1px solid #ce93d8}
.emp-item.emp-off{background:#fafafa;border-color:#ddd}
.emp-item.emp-on{background:#f9fff9;border-color:#c8e6c9}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e8f0f8}
.sec-hdr h3{color:#1a3558;font-size:13px;font-weight:700}
.alrt td{background:#fff8e1;color:#7f4f00;font-size:11px;font-weight:600;padding:5px;border-color:#f0d080;text-align:center}
.leg{display:flex;flex-wrap:wrap;gap:7px;padding:8px 14px;border-top:1px solid #e8f0f8}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:#444}
.ld{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.empty{text-align:center;padding:30px;color:#aaa;font-size:13px}
.badge-rot{font-size:10px;color:#7b1fa2;background:#f3e5f5;border-radius:5px;padding:4px 10px;font-weight:700;white-space:nowrap}
.badge-fix{font-size:10px;color:#555;background:#f0f0f0;border-radius:5px;padding:4px 10px;white-space:nowrap}
.badge-night{font-size:10px;color:#b71c1c;font-weight:700;background:#fce4ec;border-radius:5px;padding:4px 10px;white-space:nowrap}
.badge-on{font-size:10px;color:#1b5e20;font-weight:700;background:#e8f5e9;border-radius:5px;padding:4px 10px;white-space:nowrap}
.badge-off{font-size:10px;color:#888;background:#f5f5f5;border-radius:5px;padding:4px 10px;border:1px dashed #ccc;white-space:nowrap}

.email-row{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:9px;border:1px solid #e0eaf5;margin-bottom:10px;background:#fff;flex-wrap:wrap;}
.email-row.has-email{border-color:#c8e6c9;background:#f9fff9;}
.emp-card{flex:1;min-width:200px;}.emp-card .ename{font-weight:700;color:#1a3558;font-size:12.5px;}
.emp-card .emeta{font-size:10px;color:#888;margin-top:3px;line-height:1.6;}
.rotC,.rotD{font-size:10.5px;font-weight:700;border-radius:6px;padding:4px 9px;}
.rotC{background:#f3e5f5;color:#6a1b9a;}.rotD{background:#fce4ec;color:#b71c1c;}
.bbl{background:#1565c0;color:#fff;}.bpur{background:#6a1b9a;color:#fff;}
.badge-rot,.badge-fix,.badge-on,.badge-night,.badge-off2{font-size:10px;border-radius:5px;padding:4px 10px;white-space:nowrap;}
.badge-rot{color:#7b1fa2;background:#f3e5f5;font-weight:700;}
.badge-fix{color:#555;background:#f0f0f0;}.badge-on{color:#1b5e20;font-weight:700;background:#e8f5e9;}
.badge-night{color:#b71c1c;font-weight:700;background:#fce4ec;}.badge-off2{color:#888;background:#f5f5f5;border:1px dashed #ccc;}

    if(toDate&&d>toDate)return false;

window.applyCellEdit=function(empId,dayIdx,newShift,overlayEl){
  /* Save per-day override: empId_date_dayIdx */
  var dt=aD(curSun,dayIdx);
  var key=empId+'_'+fmtI(curSun)+'_d'+dayIdx;
  if(newShift==='clear'||newShift===getShifts(findEmp(empId),curSun)[dayIdx]){
    delete OVERRIDES[key];
  } else {
    OVERRIDES[key]=newShift;
  }
  saveOverrides();
  overlayEl.remove();
  render();
};

var currentUser = null;

function checkLogin() {
  var saved = sessionStorage.getItem('jadwal_user');
  if(saved) {
    try { currentUser = JSON.parse(saved); return true; } catch(e){}
  }
  return false;
}

function doLogin() {
  var u = document.getElementById('l-user').value.trim();
  var p = document.getElementById('l-pass').value;
  /* If users not loaded yet, try loading first */
  if(USERS.length === 0) {
    var btn = document.querySelector('#login-screen button');
    if(btn) btn.textContent = '⏳ جاري التحميل...';
    loadUsers(function(){
      if(btn) btn.innerHTML = '🔒 دخول';
      doLogin();
    });
    return;
  }
  var found = USERS.find(function(x){ return x.username===u && x.password===p; });
  if(found) {
    currentUser = found;
    sessionStorage.setItem('jadwal_user', JSON.stringify(found));
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    apiLoad(function(serverData){
      if(serverData){
        if(serverData['jadwal_v6']&&serverData['jadwal_v6'].data){var d=serverData['jadwal_v6'].data;if(d.emps&&d.emps.length)EMPS=d.emps;if(d.leaves)LEAVES=d.leaves;}
        if(serverData['jadwal_holidays']&&serverData['jadwal_holidays'].data)HOLIDAYS=Array.isArray(serverData['jadwal_holidays'].data)?serverData['jadwal_holidays'].data:HOLIDAYS;
        if(serverData['jadwal_overrides']&&serverData['jadwal_overrides'].data)OVERRIDES=serverData['jadwal_overrides'].data;
        if(serverData['jadwal_region']&&serverData['jadwal_region'].data)REGION=serverData['jadwal_region'].data;
        try{localStorage.setItem('jadwal_v6',JSON.stringify({emps:EMPS,leaves:LEAVES}));}catch(x){}
      }
      render();
    });
  } else {
    document.getElementById('l-err').style.display = 'block';
    document.getElementById('l-pass').value = '';
    document.getElementById('l-pass').focus();
  }
}

function doLogout() {
  sessionStorage.removeItem('jadwal_user');
  currentUser = null;
  location.reload();
}

function isAdmin() { return currentUser && currentUser.role === 'admin'; }



function fbInit(db) {
  _db = db;
  console.log('Firebase ready');
}

function fbSave(key, data) {
  if(!window._db) return;
  window._db.collection('schedule').doc(key).set({data: data, updated: new Date()})
    .then(function(){ showSyncBadge(true); })
    .catch(function(e){ console.warn('fbSave error:', e); showSyncBadge(false); });
}

function fbSaveAll() {
  if(!window._db) return;
  var batch = window._db.batch();
  var col = window._db.collection('schedule');
  batch.set(col.doc('jadwal_v6'),       {data:{emps:EMPS,leaves:LEAVES}, updated:new Date()});
  batch.set(col.doc('jadwal_holidays'), {data:HOLIDAYS, updated:new Date()});
  batch.set(col.doc('jadwal_overrides'),{data:OVERRIDES, updated:new Date()});
  batch.set(col.doc('jadwal_region'),   {data:REGION, updated:new Date()});
  batch.commit()
    .then(function(){ showSyncBadge(true); })
    .catch(function(e){ console.warn('fbSaveAll error:', e); showSyncBadge(false); });
}

function fbLoad(callback) {
  if(!window._db){ callback(null); return; }
  window._db.collection('schedule').get()
    .then(function(snap) {
      if(snap.empty){ callback(null); return; }
      var result = {};
      snap.forEach(function(doc){ result[doc.id] = doc.data(); });
      callback(result);
    })
    .catch(function(){ callback(null); });
}

function apiSave(key, data)  { fbSave(key, data); }
function apiSaveAll()        { fbSaveAll(); }
function apiLoad(callback)   { fbLoad(callback); }

function getHolidayName(date){
  var h=isHoliday(date);
  if(!h)return null;
  return LANG==='en'?h.name_en:h.name_ar;
}

function isHoliday(date){
  var d=new Date(date);d.setHours(0,0,0,0);
  for(var i=0;i<HOLIDAYS.length;i++){
    var h=HOLIDAYS[i];
    var s=pd(h.startDate);s.setHours(0,0,0,0);
    var e2=pd(h.endDate);e2.setHours(0,0,0,0);
    if(d>=s&&d<=e2)return h;
  }
  return null;
}

function gwStart(d){var dt=new Date(d);dt.setDate(dt.getDate()-dt.getDay());dt.setHours(0,0,0,0);return dt;}
function aD(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtF(d){return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();}

function onLeave(eid,date){
  var d=new Date(date);d.setHours(0,0,0,0);
  for(var i=0;i<LEAVES.length;i++){
    var lv=LEAVES[i];
    if(lv.empId!==eid)continue;
    var s=pd(lv.startDate);s.setHours(0,0,0,0);
    var e2=pd(lv.endDate);e2.setHours(0,0,0,0);
    if(d>=s&&d<=e2)return true;
  }
  return false;
}
function nightCover(date){
  var d=new Date(date);d.setHours(0,0,0,0);
  /* find leave for any fixed-night employee with a cover assigned */
  for(var i=0;i<LEAVES.length;i++){
    var lv=LEAVES[i];
    if(!lv.nightCoverId)continue;
    var fe=EMPS.find(function(e){return e.id===lv.empId&&e.fixed;});
    if(!fe)continue;
    var s=pd(lv.startDate);s.setHours(0,0,0,0);
    var e2=pd(lv.endDate);e2.setHours(0,0,0,0);
    if(d>=s&&d<=e2)return lv.nightCoverId;
  }
  return null;
}
function lvStatus(lv){
  var now=new Date();now.setHours(0,0,0,0);
  var s=pd(lv.startDate);s.setHours(0,0,0,0);
  var e2=pd(lv.endDate);e2.setHours(0,0,0,0);
  if(now>=s&&now<=e2)return 'active';
  if(now<s)return 'future';
  return 'past';
}

function rotPool(){return EMPS.filter(function(e){return e.active&&e.rotates&&!e.fixed&&(e.category==='emp'||e.category==='tra'||e.category==='tam');});}

function baseShifts(emp,ws){
  if(!emp.active)return [I,I,I,I,I,I,I];
  /* non-emp categories */
  if(emp.category!=='emp'){
    if(emp.fixed)return [N,N,N,N,N,O,O];
    if(emp.rotates){ /* fall through to rotation logic below */ }
    else if(emp.category==='sup'){
      /* rotate on-call Friday — skip on-leave AND skip last week's on-call */
      var fridayDate=aD(ws,5);
      var lastWeekSun=new Date(ws.getTime()-7*86400000);
      var lastFriday=aD(lastWeekSun,5);
      /* Find who was on-call last week */
      var allSups=EMPS.filter(function(e){return e.active&&e.category==='sup';});
      var lastPool=allSups.filter(function(e){return !onLeave(e.id,lastFriday);});
      var lastWeekNum=Math.abs(Math.round((lastWeekSun-REF)/(7*86400000)));
      var lastOnCallId=lastPool.length>0?lastPool[lastWeekNum%lastPool.length].id:null;
      /* This week: exclude on-leave AND last week's on-call */
      var supPool=EMPS.filter(function(e){
        return e.active&&e.category==='sup'&&!onLeave(e.id,fridayDate)&&e.id!==lastOnCallId;
      });
      /* fallback: if all excluded, allow last week's person (better than nobody) */
      if(supPool.length===0){
        supPool=EMPS.filter(function(e){
          return e.active&&e.category==='sup'&&!onLeave(e.id,fridayDate);
        });
      }
      var sn2=supPool.length;
      if(sn2>0){
        var weekNum=Math.abs(Math.round((ws-REF)/(7*86400000)));
        var swk=weekNum%sn2;
        var onCallEmp=supPool[swk];
        if(onCallEmp&&onCallEmp.id===emp.id)return [W,W,W,W,W,OC,O];
      }
      return [W,W,W,W,W,O,O];
    }
    else if(emp.category==='mgr')return [W,W,W,W,W,O,O]; /* المدير: إجازة جمعة دائماً */
    else return [W,W,W,W,W,O,O];
  }
  if(emp.fixed)return [N,N,N,N,N,O,O]; /* ليلي ثابت: أحد-خميس ليلي | إجازة جمعة+سبت ✓ */
  if(!emp.rotates)return [M,M,M,M,M,O,O];
  var pool=rotPool();
  var n=pool.length;
  if(!n)return [M,M,M,M,M,O,O];
  var wk=Math.abs(Math.round((ws-REF)/(7*86400000)))%n;
  var mi=pool.findIndex(function(e){return e.id===emp.id;});
  if(mi<0)return [M,M,M,M,M,O,O];
  /* دورة معتمدة — جميع الإجازات متتالية ✓ — 5 أيام لكل موظف ✓
     سبت ليلي  : إجازة أحد+اثنين  → ث+أ+خ صباحي + جمعة مسائي + سبت ليلي
     سبت صباحي: إجازة خميس+جمعة → أحد+اثنين+ث+أ صباحي + سبت صباحي
     الباقون  : إجازة جمعة+سبت   → أحد–خميس صباحي
     التغطية: أحد=3 | اثنين=3 | ث+أ=4 | خميس=3 | جمعة=1مسائي | سبت=2 */
  /* دورة معتمدة — الجمعة إجازة للجميع — سبت=1 صباحي فقط — كل الإجازات متتالية ✓
     سبت صباحي (idx=wk): إجازة خميس+جمعة ✓ → أحد،اثنين،ثلاثاء،أربعاء،سبت صباحي
     الباقون (3)        : إجازة جمعة+سبت  ✓ → أحد–خميس صباحي
     التغطية: أحد–أربعاء=4 | خميس=3 | جمعة=0 | سبت=1 */
  /* دورة معتمدة — الجمعة إجازة للجميع — السبت شخص واحد صباحي — إجازات متتالية ✓
     idx=wk: سبت صباحي → أحد-أربعاء صباحي + سبت صباحي | إجازة خميس+جمعة ✓
     الباقون: أحد-خميس صباحي                           | إجازة جمعة+سبت  ✓ */
  if(mi===wk%n) return [M,M,M,M,O,O,M]; /* سبت صباحي (10:00ص-7:00م) | إجازة خميس+جمعة ✓ */
  return [M,M,M,M,M,O,O];               /* أحد-خميس                 | إجازة جمعة+سبت  ✓ */
}
function getShifts(emp,ws){
  var b=baseShifts(emp,ws);
  for(var d=0;d<7;d++){
    var dt=aD(ws,d);
    var wd=dt.getDay();
    /* 0. Per-day manual override — highest priority */
    var dayKey=emp.id+'_'+fmtI(ws)+'_d'+d;
    if(OVERRIDES[dayKey]!==undefined){b[d]=OVERRIDES[dayKey];continue;}
    /* 1. Official holiday — highest priority */
    var hol=isHoliday(dt);
    if(hol){
      if(hol.dutyEmpId&&hol.dutyEmpId===emp.id){
        b[d]=OC; /* مناوب = أون كول */
      } else {
        b[d]=L;  /* الجميع = إجازة رسمية */
      }
      continue;
    }
    /* 2. Special personal leave */
    if(onLeave(emp.id,dt)){b[d]=L;continue;}
    /* 3. Night cover */
    var cv=nightCover(dt);
    var anyFixedOnLeave=EMPS.some(function(fe){return fe.fixed&&onLeave(fe.id,dt);});
    if(cv&&cv===emp.id&&anyFixedOnLeave&&wd>=0&&wd<=4)b[d]=C;
  }
  return b;
}
function getOff(s){var days=LANG==='en'?DAYS_EN:DAYS_AR;return days.map(function(d,i){return s[i]===O?d:null;}).filter(Boolean).join(' + ');}
function consec(s){
  var offs=s.map(function(v,i){return v===O?i:-1;}).filter(function(x){return x>=0;});
  if(offs.length!==2)return false;
  return(offs[1]-offs[0]===1)||(offs[0]===0&&offs[1]===6);
}

function rotBadge(ws){
  var pool=rotPool();var n=pool.length;if(!n)return '';
  var wk=Math.abs(Math.round((ws-REF)/(7*86400000)))%n;
  var lb=['\u0623','\u0628','\u062c','\u062f','\u0647','\u0648','\u0632','\u062d'];

  return '<span class="'+cl[wk%8]+'">دورة '+(lb[wk%8]||(wk+1))+' / اسبوع '+(Math.abs(Math.round((ws-REF)/(7*86400000)))+1)+'</span>';
}

window.sendEmail=function(id){
  var e=findEmp(id);
  if(!e||!e.email){alert(T('اضف البريد الإلكتروني اولاً من تبويب الموظفون','Add email first in Employees tab'));return;}
  if(!validEmail(e.email)){alert(T('البريد يجب ان يكون @almajdouie.com','Email must be @almajdouie.com'));return;}
  var sh=getShifts(e,curSun);
  var we=aD(curSun,6);
  var wn=Math.abs(Math.round((curSun-REF)/(7*86400000)))+1;
  var shiftName={
    morning:T('صباحي','Morning')+' ('+morningTime(e.region)+')',
    night:T('ليلي','Night')+' ('+T('12م-9م','12pm-9pm')+')',
    afternoon:T('مسائي','Afternoon')+' ('+T('1م-10م','1pm-10pm')+')',
    off:T('إجازة','Day Off'),
    leave:T('إجازة خاصة','Vacation'),
    inactive:T('موقوف','Inactive'),
    watch:T('دوام صباحي','Morning Shift'),
    cover:T('ليلي بديل','Night Cover'),
    oncall:T('أون كول','On-Call')
  };
  var sep='════════════════════════════';
  var days=LANG==='en'?DAYS_EN:DAYS_AR;

  var body=T('السلام عليكم ورحمة الله وبركاته','Dear')+' '+e.name+',\n\n';
  body+=sep+'\n';
  body+=T('📋 جدول الدوام الأسبوعي','📋 Weekly Duty Schedule')+'\n';
  body+=sep+'\n\n';
  if(e.empNum)body+=T('رقم الموظف','Employee No.')+': '+e.empNum+'\n';
  if(e.jobTitle)body+=T('المسمى الوظيفي','Job Title')+': '+e.jobTitle+'\n';
  if(e.dept)body+=T('القسم','Department')+': '+e.dept+'\n';
  var rgnLabel=REGIONS[e.region||'eastern'];
  body+=T('المنطقة','Region')+': '+(LANG==='en'?rgnLabel.label_en:rgnLabel.label_ar)+'\n';
  body+='\n';
  body+=T('الأسبوع','Week')+' '+wn+' | '+fmtF(curSun)+' '+T('إلى','to')+' '+fmtF(we)+'\n';
  body+='\n';

  /* Day-by-day schedule */
  var workDays=[];var offDays=[];
  days.forEach(function(day,i){
    var dt=aD(curSun,i);
    var sLabel=shiftName[sh[i]]||sh[i];
    var holName=getHolidayName(dt);
    if(holName&&sh[i]==='leave')sLabel=T('إجازة','Holiday')+': '+holName;
    body+='  '+day+' ('+fmtAR(dt)+'): '+sLabel+'\n';
    if(sh[i]!=='off'&&sh[i]!=='leave'&&sh[i]!=='inactive')workDays.push(day);
    else offDays.push(day);
  });

  body+='\n'+sep+'\n';
  body+=T('أيام الدوام','Work days')+' ('+workDays.length+'): '+workDays.join(' - ')+'\n';
  body+=T('أيام الإجازة','Off days')+': '+offDays.join(' - ')+'\n';
  body+='\n'+sep+'\n';
  body+=T('فريق الدعم الفني | المجدوعي السيارات','IT Support Team | Almajdouie Motors')+'\n';
  body+=T('هذا الجدول للأسبوع المحدد فقط — للاستفسار تواصل مع المشرف المباشر','This schedule is for the selected week only');

  var subj=T('جدول دوامك','Your Duty Schedule')+' — '+T('الأسبوع','Week')+' '+wn+' ('+fmtF(curSun)+' — '+fmtF(we)+')';
  window.location.href='mailto:'+e.email+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
};
window.sendAll=function(){
  var pool=EMPS.filter(function(e){return e.active&&e.email&&validEmail(e.email);});
  if(!pool.length){alert(T('لا يوجد موظفون لديهم بريد almajdouie.com مضاف','No employees with almajdouie.com email'));return;}

  var we=aD(curSun,6);
  var wn=Math.abs(Math.round((curSun-REF)/(7*86400000)))+1;
  var shiftLbl={morning:T('صباحي','Morning'),night:T('ليلي','Night'),afternoon:T('مسائي','Afternoon'),
    off:T('إجازة','Off'),leave:T('إجازة خاصة','Vacation'),inactive:T('موقوف','Inactive'),
    watch:T('صباحي','Morning'),cover:T('بديل','Cover'),oncall:T('أون كول','On-Call')};
  var days=LANG==='en'?DAYS_EN:DAYS_AR;
  var sep='============================================';

  var body=T('السلام عليكم ورحمة الله وبركاته','Dear Team,')+'\n\n';
  body+=sep+'\n';
  body+=T('جداول الدوام الاسبوعية','Weekly Duty Schedules')+'\n';
  body+=T('الاسبوع','Week')+' '+wn+' | '+fmtF(curSun)+' - '+fmtF(we)+'\n';
  body+=sep+'\n\n';

  pool.forEach(function(emp){
    var sh=getShifts(emp,curSun);
    var rgn=REGIONS[emp.region||'eastern'];
    body+='>> '+emp.name+(emp.empNum?' (#'+emp.empNum+')':'')+(emp.jobTitle?' - '+emp.jobTitle:'')+' | '+(LANG==='en'?rgn.label_en:rgn.label_ar)+'\n';
    days.forEach(function(day,i){
      var dt=aD(curSun,i);
      var sl=shiftLbl[sh[i]]||sh[i];
      var dtForTime=aD(curSun,i);
      var dayOfWeek=dtForTime.getDay();
      if(sh[i]==='morning'){
        var mt2=morningTime(emp.region);
        if(dayOfWeek===6)mt2=satTime(); /* Saturday */
        sl+=T(' ('+mt2+')','('+mt2+')');
      } else if(sh[i]==='night'){sl+=T(' (12م-9م)','(12pm-9pm)');}
      else if(sh[i]==='afternoon'||dayOfWeek===5){sl=T('مسائي','Afternoon')+T(' (10ص-10م)','(10am-10pm)');}


      if(sh[i]==='leave'){var hn=getHolidayName(dt);if(hn)sl=hn;}
      body+='   '+day+': '+sl+'\n';
    });
    body+='\n';
  });

  body+=sep+'\n';
  body+=T('فريق الدعم الفني | المجدوعي السيارات','IT Support Team | Almajdouie Motors');

  var allEmails=pool.map(function(e){return e.email;}).join(';');
  var subj=T('جداول الدوام - الاسبوع','Duty Schedules - Week')+' '+wn+' ('+fmtF(curSun)+' - '+fmtF(we)+')';
  window.location.href='mailto:'+allEmails+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
};

window.handleImport=function(input){
  var file=input.files[0];
  if(!file)return;
  var ext=file.name.split('.').pop().toLowerCase();
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      if(ext==='json'){
        var data=JSON.parse(ev.target.result);
        if(!data.emps||!Array.isArray(data.emps)){alert('ملف JSON غير صالح');return;}
        data.emps.forEach(function(emp){
          if(emp.email&&!validEmail(emp.email))emp.email='';
          EXTRA_FIELDS.forEach(function(f){if(emp[f.key]===undefined)emp[f.key]='';});
          if(emp.active===undefined)emp.active=true;
          if(emp.rotates===undefined)emp.rotates=false;
          if(emp.fixed===undefined)emp.fixed=false;
        });
        if(confirm('استيراد '+data.emps.length+' موظف - هل تريد المتابعة؟')){
          EMPS=data.emps;
          if(data.leaves)LEAVES=data.leaves;
          saveState();render();
          alert('تم الاستيراد بنجاح');
        }
      } else if(ext==='csv'){
        var lines2=ev.target.result.replace(/^\uFEFF/,'').split('\n').filter(function(l){return l.trim();});
        if(lines2.length<2){alert('الملف فارغ');return;}
        var catMap={};
        Object.keys(CATS).forEach(function(k){catMap[CATS[k].label]=k;});
        var updated=0,added=0;
        for(var i=1;i<lines2.length;i++){
          var cols=lines2[i].split(',').map(function(c){return c.replace(/^"|"$/g,'').trim();});
          if(!cols[0])continue;
          var ex=EMPS.find(function(e2){return e2.name===cols[0];});
          if(ex){
            if(cols[1])ex.category=catMap[cols[1]]||ex.category;
            if(cols[2])ex.jobTitle=cols[2];
            if(cols[3])ex.empNum=cols[3];
            if(cols[4]&&validEmail(cols[4]))ex.email=cols[4];
            if(cols[5])ex.phone=cols[5];
            if(cols[6])ex.dept=cols[6];
            if(cols[7])ex.active=cols[7]!=='موقوف';
            if(cols[8])ex.rotates=cols[8]==='نعم';
            updated++;
          } else {
            var em2=(cols[4]&&validEmail(cols[4]))?cols[4]:'';
            var obj2={id:'e'+Date.now()+i,name:cols[0],category:catMap[cols[1]]||'emp',
              jobTitle:cols[2]||'',empNum:cols[3]||'',email:em2,phone:cols[5]||'',dept:cols[6]||'',
              active:cols[7]!=='موقوف',rotates:cols[8]==='نعم',fixed:false,core:false};
            EXTRA_FIELDS.forEach(function(f){if(obj2[f.key]===undefined)obj2[f.key]='';});
            EMPS.push(obj2);added++;
          }
        }
        saveState();render();
        alert('تم: '+updated+' معدّل، '+added+' جديد');
      } else {
        alert('يرجى رفع ملف JSON او CSV فقط');
      }
    } catch(err){alert('خطا في قراءة الملف: '+err.message);}
  };
  reader.readAsText(file,'UTF-8');
  input.value='';
};

    }

    } else if(d4===6){
      var ok6=cv.dy>=1&&cv.nt>=1;
      h+='<td style="background:'+(ok6?'#1a3a2a':'#4a1010')+'">';
      h+='<span class="cn" style="color:'+(cv.dy>=1?'#6ee8a0':'#ff8a80')+'">'+cv.dy+'</span><span style="color:#a8c8f0;font-size:8.5px"> ص</span><br>';
      h+='<span class="cn" style="color:'+(cv.nt>=1?'#6ee8a0':'#ff8a80')+'">'+cv.nt+'</span><span style="color:#a8c8f0;font-size:8.5px"> ل</span></td>';
    } else {
      h+='<td style="background:#1a3558">';
      h+='<span class="cn" style="color:#a8c8f0">'+cv.dy+'</span><span style="color:#6a8faf;font-size:8.5px"> ص</span><br>';
      h+='<span class="cn" style="color:'+(cv.nt>=1?'#6ee8a0':'#ff8a80')+'">'+cv.nt+'</span><span style="color:#6a8faf;font-size:8.5px"> ل</span></td>';
    }
  }
  h+='<td colspan="2" style="background:#0f2035"></td></tr>';
  var ha=findEmp('hamad'),za=findEmp('ziyad');
  if(ha&&za){
    var al=[];
    for(var d5=0;d5<7;d5++){
      var hs=getShifts(ha,curSun)[d5],zs=getShifts(za,curSun)[d5];
      if((hs===O||hs===L||hs===I)&&(zs===O||zs===L||zs===I))al.push(DAYS_AR[d5]);
    }
    if(al.length)h+='<tr class="alrt"><td colspan="11">&#9888; لا حمد ولا زياد: '+al.join('، ')+'</td></tr>';
  }
  if(abdLv&&!abdLv.nightCoverId)h+='<tr class="alrt"><td colspan="10" style="background:#f3e5f5;color:#6a1b9a;border-color:#ce93d8">&#127761; عبدالرحمن في اجازة ولم يُحدد بديل ليلي</td></tr>';
  /* ── تحقق: لا يزيد عن شخصين إجازة يوم الخميس لكل منطقة ── */
  var THU=4;
  var regions=['eastern','riyadh','jeddah'];
  regions.forEach(function(rgn){
    var offInRgn=EMPS.filter(function(e){
      if(!e.active)return false;
      if(e.fixed)return false; /* عبدالرحمن خميسه ثابت — لا يُحسب */
      var thuShift=getShifts(e,curSun)[THU];
      var empRgn=e.region||'eastern';
      return empRgn===rgn&&(thuShift===O||thuShift===L||thuShift===I);
    });
    if(offInRgn.length>2){
      var rgnName=LANG==='en'?REGIONS[rgn].label_en:REGIONS[rgn].label_ar;
      var names=offInRgn.map(function(e){return e.name.split(' ')[0];}).join('، ');
      h+='<tr class="alrt" style="background:#fff3e0;border-color:#ffb74d"><td colspan="10" style="color:#e65100">&#9888; '+T('تنبيه','Warning')+': '+rgnName+' — '+offInRgn.length+' '+T('أشخاص إجازة يوم الخميس (الحد الأقصى 2)','employees off on Thursday (max 2)')+': '+names+'</td></tr>';
    }
  });
  h+='</tbody></table></div>';

  return h;
}

    }
    h+='</div>';
  });
  h+='</div>';
  h+='<div style="padding:10px 16px;font-size:10px;color:#888;border-top:1px solid #eef0f5;line-height:1.8">';
  h+='&#128737; '+T('المدير','Admin')+': '+T('يستطيع التعديل والإضافة والحذف','Can edit, add and delete')+'<br>';
  h+='&#128065; '+T('مشاهدة فقط','Viewer')+': '+T('يستطيع مشاهدة الجدول فقط','Can only view the schedule');
  h+='</div>';
  return h;
}

function renderEmail(){
  var we=aD(curSun,6);
  var wn=Math.abs(Math.round((curSun-REF)/(7*86400000)))+1;
  var withEmail=EMPS.filter(function(e){return e.active&&e.email&&validEmail(e.email);});
  var h='<div class="sec-hdr"><h3>&#9993; ارسال جداول الدوام عبر Outlook</h3>';
  h+='<button class="nb bg" onclick="sendAll()" style="font-size:12px">&#128232; '+T('ارسال نص عادي','Send Plain Text')+' ('+withEmail.length+')</button>';
  h+='<button class="nb" onclick="openTeamScheduleHTML()" style="font-size:12px;background:#166534;color:#fff;border:none;border-radius:7px;padding:7px 14px;cursor:pointer;margin-right:6px">&#128203; '+T('إنشاء جدول ملون للإيميل','Create Colored Table for Email')+'</button>';
  h+='</div>';
  h+='<div style="padding:10px 16px;background:#e8f4fd;border-bottom:1px solid #b3d9f5;font-size:11px;color:#0d47a1;line-height:1.7">';
  h+='&#128197; <b>الاسبوع '+wn+':</b> '+fmtF(curSun)+' - '+fmtF(we)+'&nbsp;|&nbsp;';
  h+='&#9993; يفتح Outlook تلقائياً مع الجدول&nbsp;|&nbsp;';
  h+='&#128274; يُقبل فقط <b>@almajdouie.com</b></div>';
  h+='<div style="padding:12px 16px">';
  for(var ei=0;ei<EMPS.length;ei++){
    var e=EMPS[ei];
    if(!e.active)continue;
    var sh=getShifts(e,curSun);

    var _sn={morning:T('صباحي',getLabel('morning')),night:T('ليلي',getLabel('night')),afternoon:T('مسائي',getLabel('afternoon')),off:T('إجازة',getLabel('off')),leave:T('إجازة خاصة',getLabel('leave')),inactive:T('موقوف',getLabel('inactive')),watch:T('صباحي',getLabel('watch')),cover:T('بديل',getLabel('cover')),oncall:T('أون كول',getLabel('oncall'))};
    var schedTxt=DAYS_AR.map(function(day,i){return day+': '+(_sn[sh[i]]||sh[i]);}).join(' | ');
    var hasEm=!!(e.email&&validEmail(e.email));
    h+='<div class="email-row'+(hasEm?' has-email':'')+'">';
    h+='<div class="emp-card">';
    h+='<div class="ename">'+e.name;
    if(e.empNum)h+=' <span style="font-size:9.5px;color:#888">#'+e.empNum+'</span>';
    h+='</div>';
    h+='<div class="emeta">'+catBadge(e.category);
    if(e.jobTitle)h+=' '+e.jobTitle;
    h+='<br><span style="font-size:9.5px;color:#aaa">'+schedTxt+'</span>';
    h+='</div></div>';
    h+='<div style="flex:1;min-width:220px">';
    h+='<div style="font-size:10px;color:#555;margin-bottom:4px">البريد الالكتروني:</div>';
    if(hasEm){
      h+='<div style="font-size:12px;font-weight:700;color:#1565c0;direction:ltr;background:#e8f4fd;border-radius:6px;padding:6px 10px;border:1px solid #90cbe8">'+e.email+'</div>';
      h+='<div style="font-size:9.5px;color:#1b5e20;margin-top:3px">&#9989; جاهز للإرسال</div>';
    } else {
      h+='<div style="font-size:11px;color:#b71c1c;background:#fce4ec;border-radius:6px;padding:6px 10px;border:1px solid #f48fb1">&#9888; لم يُضف بريد &nbsp;<a href="#" onclick="editEmp(\''+e.id+'\');return false;" style="color:#1565c0">اضف الان</a></div>';
    }
    h+='</div>';
    if(hasEm){
      h+='<button class="nb bbl" style="padding:8px 16px;font-size:12px;white-space:nowrap" onclick="sendEmail(\''+e.id+'\')">&#128231; فتح Outlook</button>';
    } else {
      h+='<button class="nb" style="padding:8px 14px;font-size:11px;background:#ddd;color:#999;cursor:not-allowed" disabled>اضف البريد اولاً</button>';
    }
    h+='</div>';
  }
  h+='</div>';
  h+='<div style="padding:8px 16px 12px;font-size:10px;color:#888;border-top:1px solid #eef0f5;line-height:1.7">';
  h+='&#128204; لإضافة البريد: تبويب الموظفون &rarr; تعديل &nbsp;|&nbsp; &#9993; الإرسال يفتح Outlook مع الجدول جاهزاً &nbsp;|&nbsp; &#128274; @almajdouie.com فقط';
  h+='</div>';
  return h;
}
