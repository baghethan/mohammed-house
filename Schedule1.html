<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almajdouie Motors - Ultra Portal v10.10.0</title>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--text:#1f2937;--muted:#64748b;--surface:rgba(255,255,255,.94);--shadow:0 18px 50px rgba(13,33,73,.16)}
    *{box-sizing:border-box} body{margin:0;padding:18px;font-family:'Segoe UI',sans-serif;background:linear-gradient(180deg, rgba(12,31,73,.1), rgba(255,255,255,.2)), url('image_dba186.png') center/cover fixed no-repeat;min-height:100vh;overflow-x:hidden}
    .shell{width:100%;max-width:1500px;margin:0 auto}
    .toolbar{width:100%;background:linear-gradient(135deg,rgba(13,33,73,.98),rgba(27,79,163,.95));border-radius:20px;padding:12px 24px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;position:sticky;top:10px;z-index:1000}
    .user-info{display:flex;align-items:center;gap:12px;color:#fff}
    .user-avatar{width:38px;height:38px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;border:1px solid rgba(255,255,255,0.3)}
    .btn,.btn2{border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;transition:.2s;font-size:13px}.btn{background:#fff;color:var(--primary);border:1px solid #e2e8f0}.btn2{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
    .glass{margin-top:16px;width:100%;background:var(--surface);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.45);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;min-height:82vh;display:flex;flex-direction:column}
    .header{display:flex;justify-content:space-between;align-items:center;padding:24px 30px;border-bottom:1px solid rgba(15,23,42,.08)}
    .tabs-container{display:flex;gap:10px;flex-wrap:wrap;padding:15px 30px;background:rgba(255,255,255,0.5);border-bottom:1px solid #ddd}
    .tab{cursor:pointer;padding:12px 20px;border-radius:14px;border:1px solid #e5e7eb;background:#fff;color:#475569;font-size:13px;font-weight:800;display:none} 
    .tab.active{background:var(--primary);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(13,33,73,0.2)}
    .panel{display:none;flex:1;background:transparent}
    .panel.active{display:block}
    iframe{width:100%;height:100%;min-height:70vh;border:none}
    .overlay{position:fixed;inset:0;background:rgba(10,23,55,.3);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:9999}
    .dialog{width:100%;max-width:480px;background:#fff;border-radius:30px;overflow:hidden}
  </style>
</head>
<body>

<div class="shell">
  <div class="overlay" id="loginOverlay" style="display:none;">
    <div class="dialog">
        <div style="padding:30px;background:#f8fafc;text-align:center">
            <img src="LOGO-almajdouie.png" style="height:60px" />
            <h2 style="color:var(--primary);margin-top:15px">نظام المجدوعي</h2>
            <p style="font-size:12px;color:var(--muted)">v10.10.0 - دخول سريع</p>
        </div>
        <form id="loginForm" style="padding:30px;display:flex;flex-direction:column;gap:15px">
            <input id="loginEmail" type="email" placeholder="البريد الإلكتروني" required style="padding:14px;border-radius:12px;border:1px solid #ddd"/>
            <input id="loginPassword" type="password" placeholder="كلمة المرور" required style="padding:14px;border-radius:12px;border:1px solid #ddd"/>
            <button class="btn2" type="submit" style="padding:15px;">دخول آمن</button>
        </form>
    </div>
  </div>

  <div class="toolbar">
    <div class="user-info">
        <div class="user-avatar" id="userInitial">M</div>
        <div>
            <div id="userNameTop" style="font-weight:900;font-size:14px">جاري التحميل...</div>
            <div id="userEmailTop" style="font-size:10px;opacity:0.8">...</div>
        </div>
    </div>
    <div style="display:flex; gap:12px">
        <button class="btn" id="btnLogout" style="background:#fee2e2;color:#b91c1c;border:none">خروج</button>
    </div>
  </div>

  <div class="glass">
    <div class="header">
        <div style="display:flex; align-items:center; gap:15px">
            <img src="LOGO-almajdouie.png" style="max-height:50px" />
            <div style="font-weight:900;color:var(--primary);font-size:20px">المجدوعي للسيارات</div>
        </div>
        <div id="currentTime" style="font-weight:900;color:var(--primary)"></div>
    </div>

    <div class="tabs-container" id="tabsBox">
      <div class="tab" data-tab="dashboard" data-src="dashboard-plan-Vacation.html">📊 Dashboard</div>
      <div class="tab" data-tab="schedule" data-src="Weekly-Schedule.html">🗓️ الجدول الأسبوعي</div>
      <div class="tab" data-tab="employees" data-src="employee-Schedule.html">👥 الموظفون</div>
      <div class="tab" data-tab="annual" data-src="Annual-Leave.html">🌴 الإجازات</div>
      <div class="tab" data-tab="planning" data-src="plan-Vacation.html">📅 خطة الإجازات</div>
      <div class="tab" data-tab="settings" data-src="Shift-Settings.html">⏰ الإعدادات</div>
      <div class="tab" data-tab="permissions" data-src="Permissions1.html">🔐 الصلاحيات</div>
    </div>

    <div id="panelContainer" style="flex:1;">
        <div class="panel" id="dashboard"><iframe id="frame_dashboard" src=""></iframe></div>
        <div class="panel" id="schedule"><iframe id="frame_schedule" src=""></iframe></div>
        <div class="panel" id="employees"><iframe id="frame_employees" src=""></iframe></div>
        <div class="panel" id="annual"><iframe id="frame_annual" src=""></iframe></div>
        <div class="panel" id="planning"><iframe id="frame_planning" src=""></iframe></div>
        <div class="panel" id="settings"><iframe id="frame_settings" src=""></iframe></div>
        <div class="panel" id="permissions"><iframe id="frame_permissions" src=""></iframe></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { initializeFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
const app = initializeApp(firebaseConfig); 
const auth = getAuth(app);

// السر وراء السرعة: تحويل الاتصال إلى طلبات فورية وتعطيل الـ Streaming
const db = initializeFirestore(app, { 
    experimentalForceLongPolling: true,
    useFetchStreams: false 
});

async function checkAccess(user) {
    try {
        // طلب البيانات لمرة واحدة فقط لسرعة الاستجابة
        const snap = await getDoc(doc(db, 'app_users', user.uid));
        const userData = snap.exists() ? snap.data() : {};
        
        document.getElementById('userNameTop').innerText = userData.name || "مستخدم";
        document.getElementById('userEmailTop').innerText = user.email;
        document.getElementById('userInitial').innerText = (userData.name || "U").charAt(0);

        const perms = userData.permissions || {};
        let firstTab = null;

        document.querySelectorAll('.tab').forEach(tab => {
            const tid = tab.dataset.tab;
            if(user.email === 'baghethanmh@almajdouie.com' || perms[tid]?.view === true) {
                tab.style.display = 'block';
                if(!firstTab) firstTab = tab;
            }
        });

        if(firstTab) loadTab(firstTab.dataset.tab, firstTab.dataset.src);
    } catch (e) {
        console.error("Connection slow, using failsafe.");
        if(user.email === 'baghethanmh@almajdouie.com') {
            document.querySelectorAll('.tab').forEach(t => t.style.display = 'block');
            loadTab('dashboard', 'dashboard-plan-Vacation.html');
        }
    }
}

function loadTab(tabId, src) {
    const frame = document.getElementById('frame_' + tabId);
    if(frame && (frame.src === '' || frame.src === 'about:blank')) frame.src = src;
    
    document.querySelectorAll('.tab, .panel').forEach(el => el.classList.remove('active'));
    const targetTab = document.querySelector(`[data-tab="${tabId}"]`);
    if(targetTab) targetTab.classList.add('active');
    document.getElementById(tabId).classList.add('active');
}

document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => loadTab(t.dataset.tab, t.dataset.src));
});

onAuthStateChanged(auth, user => {
    if(user) {
        document.getElementById('loginOverlay').style.display = 'none';
        checkAccess(user);
    } else {
        document.getElementById('loginOverlay').style.display = 'flex';
    }
});

document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
        await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
    } catch(err) { alert("خطأ في الاتصال أو البيانات"); }
});

document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

setInterval(() => {
    document.getElementById('currentTime').innerText = new Date().toLocaleTimeString('ar-SA');
}, 1000);
</script>
</body>
</html>
