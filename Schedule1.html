<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule Management v1.4.0 - Almajdouie Motors</title>
  <style>
    :root {
      --primary: #0d2149;
      --primary-light: #1b4fa3;
      --accent: #10b981;
      --bg: #f0f4f8;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #1e293b;
      --border: #e2e8f0;
      --radius: 20px;
    }
    body {
      margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg); color: var(--text); transition: 0.3s;
    }
    .glass-panel {
      background: var(--card-bg); backdrop-filter: blur(10px);
      border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.05);
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--border);
    }
    .logo-section { display: flex; align-items: center; gap: 15px; }
    .logo-section img { height: 50px; }
    .nav-controls { display: flex; gap: 10px; align-items: center; }
    
    table { width: 100%; border-collapse: separate; border-spacing: 0 10px; margin-top: 20px; }
    th { padding: 15px; background: var(--primary); color: #fff; font-weight: 800; text-align: center; font-size: 14px; }
    th:first-child { border-radius: 0 12px 12px 0; }
    th:last-child { border-radius: 12px 0 0 12px; }
    
    td { padding: 15px; background: #fff; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); text-align: center; font-weight: 700; }
    
    .status-badge { padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 900; }
    .on-call { background: #fff7ed; color: #c2410c; }
    .night-shift { background: #f1f5f9; color: #475569; }
    
    .btn { padding: 10px 18px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .btn-lang { background: #fff; border: 1px solid var(--border); color: var(--primary); }
    
    /* LTR Support */
    html[dir="ltr"] th:first-child { border-radius: 12px 0 0 12px; }
    html[dir="ltr"] th:last-child { border-radius: 0 12px 12px 0; }
  </style>
</head>
<body>

<div class="glass-panel">
    <div class="header">
        <div class="logo-section">
            <img src="LOGO-almajdouie.png" alt="Almajdouie Logo">
            <div>
                <h2 id="txt-title" style="margin:0">الجدول الأسبوعي للموظفين</h2>
                <small id="txt-subtitle">بوابة الإدارة المتكاملة v1.4.0</small>
            </div>
        </div>
        <div class="nav-controls">
            <button id="langBtn" class="btn btn-lang">English</button>
            <div id="connectionStatus" style="font-size:12px; color:var(--accent); font-weight:900">🟢 متصل</div>
        </div>
    </div>

    <div style="overflow-x: auto;">
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th id="th-name">اسم الموظف</th>
                    <th id="th-sun">الأحد</th>
                    <th id="th-mon">الاثنين</th>
                    <th id="th-tue">الثلاثاء</th>
                    <th id="th-wed">الأربعاء</th>
                    <th id="th-thu">الخميس</th>
                    <th id="th-fri">الجمعة</th>
                    <th id="th-sat">السبت</th>
                </tr>
            </thead>
            <tbody id="scheduleBody">
                </tbody>
        </table>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { 
    initializeFirestore, doc, onSnapshot, collection, 
    persistentLocalCache, persistentMultipleTabManager 
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { 
    apiKey: 'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', 
    authDomain: 'baghethan-ba325.firebaseapp.com', 
    projectId: 'baghethan-ba325', 
    storageBucket: 'baghethan-ba325.firebasestorage.app', 
    messagingSenderId: '944819735112', 
    appId: '1:944819735112:web:07315600da39377320667d' 
};

const app = initializeApp(firebaseConfig);

// --- الحل الجذري لمشكلة الاتصال في شبكة الشركة ---
const db = initializeFirestore(app, {
    experimentalForceLongPolling: true, // إجبار الاتصال لتخطي جدار الحماية
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

const I18N = {
    ar: {
        title: "الجدول الأسبوعي للموظفين",
        subtitle: "بوابة الإدارة المتكاملة v1.4.0",
        name: "اسم الموظف",
        days: ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"],
        lang: "English",
        loading: "جاري تحميل البيانات..."
    },
    en: {
        title: "Weekly Staff Schedule",
        subtitle: "Integrated Management Portal v1.4.0",
        name: "Employee Name",
        days: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        lang: "العربية",
        loading: "Loading data..."
    }
};

let currentLang = 'ar';
let employees = [];
let scheduleData = {};

function applyLanguage(lang) {
    currentLang = lang;
    const t = I18N[lang];
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('txt-title').innerText = t.title;
    document.getElementById('txt-subtitle').innerText = t.subtitle;
    document.getElementById('langBtn').innerText = t.lang;
    document.getElementById('th-name').innerText = t.name;
    
    const dayIds = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    dayIds.forEach((id, index) => {
        document.getElementById('th-' + id).innerText = t.days[index];
    });
    renderTable();
}

document.getElementById('langBtn').onclick = () => {
    applyLanguage(currentLang === 'ar' ? 'en' : 'ar');
};

// سحب قائمة الموظفين النشطين تلقائياً
onSnapshot(collection(db, 'app_users'), (snap) => {
    employees = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(u => u.active === true);
    renderTable();
});

// سحب بيانات الجدول
onSnapshot(doc(db, 'schedule', 'jadwal_v6'), (snap) => {
    if (snap.exists()) {
        scheduleData = snap.data().data || {};
        renderTable();
    }
});

function renderTable() {
    const tbody = document.getElementById('scheduleBody');
    if (employees.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8">${I18N[currentLang].loading}</td></tr>`;
        return;
    }

    tbody.innerHTML = employees.map(emp => {
        const rowData = scheduleData[emp.id] || {};
        return `
            <tr>
                <td style="text-align:right; color:var(--primary); font-weight:900">${emp.name}</td>
                ${['sun','mon','tue','wed','thu','fri','sat'].map(day => {
                    const shift = rowData[day] || '-';
                    let shiftClass = '';
                    if(shift === 'On Call') shiftClass = 'status-badge on-call';
                    if(shift.includes('Night')) shiftClass = 'status-badge night-shift';
                    return `<td><span class="${shiftClass}">${shift}</span></td>`;
                }).join('')}
            </tr>
        `;
    }).join('');
}

window.onload = () => applyLanguage('ar');
</script>
</body>
</html>
