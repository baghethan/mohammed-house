<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المجدوعي للسيارات</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,sans-serif; direction:rtl; padding:12px; background-color: #f4f7f6;}
        .container { max-width: 850px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .tabs-header { display: flex; background: #e2e8f0; border-bottom: 3px solid #0369a1; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-weight: bold; font-size: 16px; color: #475569; }
        .tab-btn.active { background: #0369a1; color: #fff; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        .employee-card { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-vacation { display: inline-block; font-size: 18px; font-weight: bold; background: #0369a1; color: #fff !important; border-radius: 10px; padding: 15px 40px; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs-header">
        <button class="tab-btn active" onclick="openTab(event, 'schedule-tab')">📅 جدول الدوام</button>
        <button class="tab-btn" onclick="openTab(event, 'vacation-tab')">📝 خطة الإجازات</button>
    </div>

    <div id="schedule-tab" class="tab-content active">
        <div id="main-content">
            </div>
    </div>

    <div id="vacation-tab" class="tab-content">
        <div style="text-align: center;">
            <h2>نظام خطة الإجازات</h2>
            <a href="https://baghethan.com/plan-Vacation.html" target="_blank" class="btn-vacation">
                <span style="font-size:24px;">&#128197;</span> تخطيط الإجازة
            </a>
        </div>
    </div>
</div>

<script>
    // 1. بيانات تجريبية (تأكد من وجود بيانات هنا)
    var employees = [
        {id: "101", name: "محمد العتيبي", email: "m.otaibi@almajdouie.com", sched: "7:00 AM - 3:00 PM"},
        {id: "102", name: "سعد الشهري", email: "", sched: "8:00 AM - 4:00 PM"}
    ];

    // 2. وظيفة عرض البيانات في الجدول
    function renderSchedule() {
        var html = '';
        employees.forEach(function(e) {
            html += '<div class="employee-card">';
            html += '<div><strong>' + e.name + '</strong><br><small>' + e.sched + '</small></div>';
            if(e.email) {
                html += '<div style="color:green">✅ ' + e.email + '</div>';
            } else {
                html += '<div style="color:red">⚠️ بريد مفقود</div>';
            }
            html += '</div>';
        });
        document.getElementById('main-content').innerHTML = html;
    }

    // 3. وظيفة التبديل بين التبويبات
    function openTab(evt, tabName) {
        var tabcontent = document.getElementsByClassName("tab-content");
        for (var i = 0; i < tabcontent.length; i++) tabcontent[i].classList.remove("active");
        
        var tablinks = document.getElementsByClassName("tab-btn");
        for (var i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
        
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    // تشغيل العرض فور فتح الصفحة
    renderSchedule();
</script>

</body>
</html>
