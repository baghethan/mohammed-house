<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>نظام الإجازات v4.4.0 - إضافة الشعار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .vacation-bar { 
            height: 30px; border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            position: absolute; z-index: 10;
        }
        .date-text-inside { color: white; font-size: 10px; font-weight: 800; white-space: nowrap; padding: 0 10px; }
        .gantt-grid-row { display: grid; width: 100%; min-width: 1200px; background: white; }
        .tab-active { border-bottom: 4px solid #1e3a8a; color: #1e3a8a; font-weight: 800; }
        .color-0 { background: linear-gradient(90deg, #1e40af 0%, #3b82f6 100%); }
        .color-1 { background: linear-gradient(90deg, #0f766e 0%, #14b8a6 100%); }
        .color-2 { background: linear-gradient(90deg, #6d28d9 0%, #a78bfa 100%); }

        #rangeIndicator {
            border: 2px solid #ef4444;
            color: #ef4444;
            padding: 4px 20px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
            background-color: #fef2f2;
            display: inline-block;
        }
    </style>
</head>
<body class="p-4 md:p-8 pb-20 text-right">

    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-100 gap-4">
            <div class="flex items-center gap-6">
                <img src="logo_0.png" alt="شعار المجدوعي - Almajdouie Logo" class="h-16 w-auto object-contain">
                
                <div class="border-r-4 border-[#1e3a8a] pr-6">
                    <h1 class="text-2xl font-extrabold text-[#1e3a8a]">نظام إدارة الإجازات السنوية</h1>
                    <p class="text-xs text-slate-400 mt-1 font-medium">إصدار v4.4.0 | إضافة الشعار الرسمي</p>
                </div>
            </div>
            
            <div class="flex gap-2 shrink-0">
                <label class="cursor-pointer bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold hover:bg-slate-50 transition-all">
                    <span>رفع Excel</span>
                    <input type="file" id="uploadExcel" class="hidden" accept=".xlsx, .xls" />
                </label>
                <button onclick="downloadExcel()" class="bg-[#1e3a8a] text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg">تنزيل Excel</button>
            </div>
        </div>

        <nav class="flex border-b-2 border-slate-100 gap-10 mb-4 px-4 bg-white rounded-t-2xl">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="py-4 text-sm transition-all tab-active">Dashboard (لوحة العرض)</button>
            <button onclick="switchTab('management')" id="btn-management" class="py-4 text-sm text-slate-400 font-bold hover:text-slate-600">إدارة العمليات</button>
        </nav>

        <div id="tab-dashboard" class="space-y-6">
            <div class="flex justify-end px-2">
                 <button onclick="copyFullDashboard()" class="bg-emerald-600 text-white px-8 py-3 rounded-2xl text-sm font-extrabold shadow-xl hover:bg-emerald-700 transition-all">
                    نسخ التقرير كامل كصورة 📸
                </button>
            </div>

            <div id="captureArea" class="space-y-6 p-6 bg-[#f8fafc] rounded-3xl">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6" id="statsGrid"></div>

                <section class="bg-white rounded-3xl p-8 shadow-md border border-slate-100">
                    <div class="flex justify-between items-center mb-8 gap-4">
                        <h2 class="text-xl font-extrabold text-slate-800 shrink-0">المخطط الزمني (Timeline)</h2>
                        
                        <div id="rangeIndicator">السنة كاملة</div>

                        <select id="viewRange" onchange="refreshUI()" class="border-2 border-slate-100 rounded-xl px-4 py-2 text-sm font-extrabold text-slate-700 bg-slate-50 outline-none">
                            <option value="year">السنة كاملة (JAN - DEC)</option>
                            <option value="q1">الربع الأول (JAN - MAR)</option>
                            <option value="q2">الربع الثاني (APR - JUN)</option>
                            <option value="q3">الربع الثالث (JUL - SEP)</option>
                            <option value="q4">الربع الرابع (OCT - DEC)</option>
                        </select>
                    </div>
                    <div class="overflow-x-auto border border-slate-100 rounded-2xl bg-white">
                        <div id="ganttArea"></div>
                    </div>
                </section>
            </div>
        </div>

        <div id="tab-management" class="hidden space-y-6">
             <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-md font-bold mb-4">إضافة طلب جديد</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <input type="text" id="empName" placeholder="اسم الموظف" class="border rounded-xl p-2 text-sm outline-none focus:ring-2">
                    <input type="date" id="dateFrom" class="border rounded-xl p-2 text-sm outline-none">
                    <input type="date" id="dateTo" class="border rounded-xl p-2 text-sm outline-none">
                    <button onclick="processEntry()" class="bg-[#0d9488] text-white p-2 rounded-xl font-bold">+ حفظ</button>
                </div>
             </section>
             <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="overflow-hidden rounded-xl border border-slate-100"><table class="w-full text-right" id="requestsTable"><thead class="bg-slate-50 text-xs font-bold"><tr><th class="p-4">الموظف</th><th class="p-4 text-center">من</th><th class="p-4 text-center">إلى</th><th class="p-4 text-center border-x">الحالة</th><th class="p-4 text-center">الإجراءات</th></tr></thead><tbody id="tableBody" class="text-sm divide-y"></tbody></table></div>
             </section>
        </div>
    </div>

    <script>
        let vacationsData = [];
        const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

        function switchTab(tab) {
            document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('tab-management').classList.toggle('hidden', tab !== 'management');
            document.getElementById('btn-dashboard').classList.toggle('tab-active', tab === 'dashboard');
            document.getElementById('btn-management').classList.toggle('tab-active', tab === 'management');
            if(tab === 'dashboard') refreshUI();
        }

        function refreshUI() {
            updateStats();
            renderGantt();
            updateTable();
            updateRangeIndicator();
        }

        function updateRangeIndicator() {
            const range = document.getElementById('viewRange').value;
            const indicator = document.getElementById('rangeIndicator');
            const rangeText = {
                'year': 'السنة كاملة',
                'q1': 'الربع الأول (Q1)',
                'q2': 'الربع الثاني (Q2)',
                'q3': 'الربع الثالث (Q3)',
                'q4': 'الربع الرابع (Q4)'
            };
            indicator.innerText = rangeText[range];
        }

        function updateStats() {
            const range = document.getElementById('viewRange').value;
            let startM = 0, endM = 11;
            if(range === 'q1') endM = 2; else if(range === 'q2') {startM=3; endM=5;} else if(range === 'q3') {startM=6; endM=8;} else if(range === 'q4') {startM=9; endM=11;}

            const filtered = vacationsData.filter(v => {
                const m = new Date(v.from).getMonth();
                return m >= startM && m <= endM;
            });

            const activeToday = vacationsData.filter(v => {
                const t = new Date().toISOString().split('T')[0];
                return t >= v.from && t <= v.to;
            }).length;

            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm border-b-4 border-b-blue-500">
                    <h3 class="text-slate-400 text-xs font-bold mb-2 uppercase tracking-widest">إجمالي الموظفين (الفترة)</h3>
                    <p class="text-3xl font-black text-slate-800">${filtered.length}</p>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm border-b-4 border-b-emerald-500">
                    <h3 class="text-slate-400 text-xs font-bold mb-2 uppercase tracking-widest">إجازات نشطة اليوم</h3>
                    <p class="text-3xl font-black text-emerald-600">${activeToday}</p>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm border-b-4 border-b-amber-500">
                    <h3 class="text-slate-400 text-xs font-bold mb-2 uppercase tracking-widest">بانتظار الموافقة</h3>
                    <p class="text-3xl font-black text-amber-500">${vacationsData.filter(v => v.status === 'PENDING').length}</p>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm border-b-4 border-b-purple-500">
                    <h3 class="text-slate-400 text-xs font-bold mb-2 uppercase tracking-widest">حالة التغطية</h3>
                    <p class="text-2xl font-black text-purple-600 uppercase">Optimal</p>
                </div>
            `;
        }

        function renderGantt() {
            const range = document.getElementById('viewRange').value;
            const area = document.getElementById('ganttArea');
            let startM = 0, endM = 11;
            if(range === 'q1') endM = 2; else if(range === 'q2') {startM=3; endM=5;} else if(range === 'q3') {startM=6; endM=8;} else if(range === 'q4') {startM=9; endM=11;}
            
            const totalMonths = (endM - startM) + 1;
            const gridCols = 2 + totalMonths;

            const grouped = {};
            vacationsData.forEach(v => {
                const d1 = new Date(v.from);
                const d2 = new Date(v.to);
                if (d2.getMonth() >= startM && d1.getMonth() <= endM) {
                    if(!grouped[v.name]) grouped[v.name] = [];
                    grouped[v.name].push(v);
                }
            });

            let html = `<div class="gantt-grid-row border-b-2 border-slate-100 bg-slate-50" style="grid-template-columns: repeat(${gridCols}, 1fr);">
                <div class="col-span-2 p-5 text-md font-black text-slate-700 border-l-2">الموظف</div>`;
            for(let i = startM; i <= endM; i++) html += `<div class="p-5 text-xs font-black text-slate-500 border-l-2 text-center">${monthNames[i]}</div>`;
            html += `</div>`;

            Object.keys(grouped).forEach(emp => {
                html += `<div class="gantt-grid-row border-b border-slate-100 h-20 relative" style="grid-template-columns: repeat(${gridCols}, 1fr);">
                    <div class="col-span-2 p-4 text-xs font-bold text-slate-800 border-l-2 flex items-center bg-white z-20 sticky right-0">${emp}</div>
                    <div class="col-span-${totalMonths} relative flex items-center h-full bg-slate-50/20">`;
                grouped[emp].forEach((vac, idx) => {
                    const d1 = new Date(vac.from), d2 = new Date(vac.to);
                    const sM = Math.max(d1.getMonth(), startM), eM = Math.min(d2.getMonth(), endM);
                    const mWidth = 100 / totalMonths;
                    const right = (sM - startM) * mWidth, width = ((eM - sM) + 1) * mWidth;
                    html += `<div class="vacation-bar color-${idx % 3}" style="right: ${right}%; width: ${width - 0.5}%;">
                        <span class="date-text-inside">${vac.from} إلى ${vac.to}</span>
                    </div>`;
                });
                html += `</div></div>`;
            });
            area.innerHTML = html || `<div class="p-20 text-center font-bold text-slate-400">لا توجد بيانات لهذا النطاق</div>`;
        }

        async function copyFullDashboard() {
            const area = document.getElementById('captureArea');
            const canvas = await html2canvas(area, { 
                scale: 3, 
                backgroundColor: "#f8fafc",
                useCORS: true
            });
            canvas.toBlob(async blob => {
                await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
                alert("✅ تم نسخ التقرير كاملاً!");
            }, "image/png");
        }

        function processEntry() {
            const n = document.getElementById('empName').value, f = document.getElementById('dateFrom').value, t = document.getElementById('dateTo').value;
            if(!n || !f || !t) return;
            vacationsData.push({ id: Date.now(), name: n, from: f, to: t, status: 'PENDING' });
            refreshUI();
            document.getElementById('empName').value = '';
        }

        function updateTable() {
            document.getElementById('tableBody').innerHTML = vacationsData.map(v => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-bold text-slate-700">${v.name}</td>
                    <td class="p-4 text-center font-mono text-slate-500">${v.from}</td>
                    <td class="p-4 text-center font-mono text-slate-500">${v.to}</td>
                    <td class="p-4 text-center border-x"><span class="px-3 py-1 rounded-full ${v.status==='APPROVED'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'} text-[10px] font-bold">${v.status}</span></td>
                    <td class="p-4 flex justify-center gap-1"><button onclick="updateStat(${v.id}, 'APPROVED')" class="bg-emerald-500 text-white px-3 py-1 rounded-lg text-[10px] font-bold">موافقة</button></td>
                </tr>`).reverse().join('');
        }

        function updateStat(id, stat) { const item = vacationsData.find(v => v.id === id); if(item) item.status = stat; refreshUI(); }
        function formatExcelDate(s) { if(!s || isNaN(s)) return s; return new Date(Math.round((s-25569)*86400*1000)).toISOString().split('T')[0]; }
        
        document.getElementById('uploadExcel').addEventListener('change', function(e) {
            const reader = new FileReader(); reader.onload = function(event) {
                const workbook = XLSX.read(new Uint8Array(event.target.result), { type: 'array' });
                XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]).forEach(row => {
                    const n = row['الموظف'] || row['Employee'], f = formatExcelDate(row['من'] || row['From']), t = formatExcelDate(row['إلى'] || row['To']);
                    if(n && f && t) vacationsData.push({ id: Date.now() + Math.random(), name: n, from: f, to: t, status: 'PENDING' });
                });
                refreshUI();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });
        function downloadExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("requestsTable")), "Vacation_Plan.xlsx"); }
        refreshUI();
    </script>
</body>
</html>
