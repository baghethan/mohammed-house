<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختبار تسجيل الدخول</title>
  <style>
    body{
      margin:0;
      font-family:Tahoma, Arial, sans-serif;
      background:#f3f4f6;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }
    .box{
      width:420px;
      background:#fff;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.12);
      overflow:hidden;
    }
    .top{
      background:#1d4ed8;
      color:#fff;
      padding:20px;
    }
    .top h1{
      margin:0;
      font-size:24px;
    }
    .content{
      padding:20px;
    }
    .field{
      margin-bottom:15px;
    }
    label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
    }
    input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
    }
    button{
      width:100%;
      padding:12px;
      background:#1d4ed8;
      color:#fff;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }
    button:hover{
      background:#1e40af;
    }
    .msg{
      margin-top:15px;
      padding:10px;
      border-radius:10px;
      display:none;
      font-weight:bold;
      text-align:center;
    }
    .success{
      background:#dcfce7;
      color:#166534;
      display:block;
    }
    .error{
      background:#fee2e2;
      color:#991b1b;
      display:block;
    }
    .app{
      display:none;
      padding:20px;
      text-align:center;
    }
    .hint{
      margin-top:12px;
      font-size:14px;
      color:#666;
      text-align:center;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="top">
      <h1>اختبار تسجيل الدخول</h1>
    </div>

    <div class="content" id="loginBox">
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input type="text" id="username" placeholder="اكتب admin" />
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="اكتب 1234" />
      </div>

      <button id="loginBtn">دخول</button>

      <div class="hint">
        بيانات التجربة: <strong>admin / 1234</strong><br>
        أو <strong>viewer / 1234</strong>
      </div>

      <div id="message" class="msg"></div>
    </div>

    <div class="app" id="appBox">
      <h2>✅ تم تسجيل الدخول بنجاح</h2>
      <p id="welcomeText"></p>
      <button id="logoutBtn">تسجيل الخروج</button>
    </div>
  </div>

  <script>
    const users = [
      { username: "admin", password: "1234", role: "admin" },
      { username: "viewer", password: "1234", role: "viewer" }
    ];

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const loginBox = document.getElementById("loginBox");
    const appBox = document.getElementById("appBox");
    const welcomeText = document.getElementById("welcomeText");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "msg " + type;
    }

    function login() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      const user = users.find(
        u => u.username === username && u.password === password
      );

      if (!user) {
        showMessage("❌ اسم المستخدم أو كلمة المرور غير صحيحة", "error");
        return;
      }

      showMessage("✅ تم تسجيل الدخول بنجاح", "success");

      setTimeout(() => {
        loginBox.style.display = "none";
        appBox.style.display = "block";
        welcomeText.textContent =
          "مرحبًا " + user.username + " | الصلاحية: " + user.role;
      }, 500);
    }

    function logout() {
      appBox.style.display = "none";
      loginBox.style.display = "block";
      usernameInput.value = "";
      passwordInput.value = "";
      message.className = "msg";
      message.textContent = "";
    }

    loginBtn.addEventListener("click", login);
    logoutBtn.addEventListener("click", logout);

    passwordInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
