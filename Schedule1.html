<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>نظام إجازات المجدوعي v4.5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-image: url('image_dba186.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        /* تجميل البطاقات لتظهر فوق الخلفية */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .vacation-bar { 
            height: 32px; border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            position: absolute; z-index: 10;
        }

        .date-text-inside { color: white; font-size: 10px; font-weight: 800; white-space: nowrap; padding: 0 12px; }
        .gantt-grid-row { display: grid; width: 100%; min-width: 1200px; background: white; }
        .tab-active { border-bottom: 4px solid #1e3a8a; color: #1e3a8a; font-weight: 800; }
        
        .color-0 { background: linear-gradient(90deg, #1e40af 0%, #3b82f6 100%); }
        .color-1 { background: linear-gradient(90deg, #0f766e 0%, #14b8a6 100%); }
        .color-2 { background: linear-gradient(90deg, #6d28d9 0%, #a78bfa 100%); }

        #rangeIndicator {
            border: 2px solid #ef4444;
            color: #ef4444;
            padding: 4px 20px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
            background-color: #fef2f2;
            display: inline-block;
        }
    </style>
</head>
<body class="p-4 md:p-8 pb-20 text-right">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <div class="flex justify-between items-center glass-panel p-5 rounded-2xl shadow-xl gap-4">
            <div class="flex items-center gap-6">
                <img src="LOGO-almajdouie.png" alt="Almajdouie Logo" class="h-16 w-auto object-contain">
                
                <div class="border-r-4 border-[#1e3a8a] pr-6">
                    <h1 class="text-2xl font-extrabold text-[#1e3a8a]">نظام إدارة الإجازات السنوية</h1>
                    <p class="text-xs text-slate-500 mt-1 font-bold uppercase tracking-wider">v4.5.0 | Professional Edition</p>
                </div>
            </div>
            
            <div class="flex gap-2">
                <label class="cursor-pointer bg-white border border-slate-300 text-slate-700 px-5 py-2 rounded-xl text-sm font-bold hover:bg-slate-50 transition-all shadow-sm">
                    <span>رفع Excel</span>
                    <input type="file" id="uploadExcel" class="hidden" accept=".xlsx, .xls" />
                </label>
                <button onclick="downloadExcel()" class="bg-[#1e3a8a] text-white px-6 py-2 rounded-xl text-sm font-bold shadow-lg hover:bg-blue-900 transition-all">تنزيل Excel</button>
            </div>
        </div>

        <nav class="flex border-b-2 border-slate-200 gap-10 mb-4 px-6 glass-panel rounded-t-2xl">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="py-4 text-sm transition-all tab-active">لوحة البيانات (Dashboard)</button>
            <button onclick="switchTab('management')" id="btn-management" class="py-4 text-sm text-slate-500 font-bold hover:text-slate-700">إدارة العمليات</button>
        </nav>

        <div id="tab-dashboard" class="space-y-6">
            <div class="flex justify-end px-2">
                 <button onclick="copyFullDashboard()" class="bg-emerald-600 text-white px-10 py-3 rounded-2xl text-sm font-extrabold shadow-xl hover:bg-emerald-700 transition-all transform hover:scale-105 active:scale-95">
                    نسخ التقرير كامل كصورة 📸
                </button>
            </div>

            <div id="captureArea" class="space-y-6 p-6 bg-[#f8fafc] rounded-3xl border-2 border-slate-100 shadow-2xl">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6" id="statsGrid"></div>

                <section class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-8 gap-4">
                        <h2 class="text-xl font-extrabold text-slate-800 shrink-0">المخطط الزمني للموظفين</h2>
                        
                        <div id="rangeIndicator">السنة كاملة</div>

                        <select id="viewRange" onchange="refreshUI()" class="border-2 border-slate-100 rounded-xl px-4 py-2 text-sm font-extrabold text-slate-700 bg-slate-50 outline-none">
                            <option value="year">السنة كاملة (JAN - DEC)</option>
                            <option value="q1">الربع الأول (JAN - MAR)</option>
                            <option value="q2">الربع الثاني (APR - JUN)</option>
                            <option value="q3">الربع الثالث (JUL - SEP)</option>
                            <option value="q4">الربع الرابع (OCT - DEC)</option>
                        </select>
                    </div>
                    <div class="overflow-x-auto border border-slate-100 rounded-2xl">
                        <div id="ganttArea"></div>
                    </div>
                </section>
            </div>
        </div>

        <div id="tab-management" class="hidden space-y-6">
             <section class="glass-panel p-8 rounded-2xl shadow-xl">
                <h2 class="text-lg font-bold text-slate-800 mb-6 border-r-4 border-emerald-500 pr-4">إضافة طلب إجازة جديد</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-end">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2">اسم الموظف</label>
                        <input type="text" id="empName" placeholder="أدخل اسم الموظف..." class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2">من تاريخ</label>
                        <input type="date" id="dateFrom" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-200">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-2">إلى تاريخ</label>
                        <input type="date" id="dateTo" class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-blue-200">
                    </div>
                    <button onclick="processEntry()" class="bg-[#0d9488] text-white p-3 rounded-xl font-extrabold shadow-lg hover:bg-teal-700 transition-all hover:scale-105 active:scale-95">+ حفظ الطلب</button>
                </div>
             </section>

             <section class="glass-panel p-6 rounded-2xl shadow-xl">
                <div class="overflow-hidden rounded-xl border border-slate-200">
                    <table class="w-full text-right" id="requestsTable">
                        <thead class="bg-slate-50 text-xs font-extrabold text-slate-600 uppercase tracking-widest">
                            <tr>
                                <th class="p-5">الموظف</th>
                                <th class="p-5 text-center">من</th>
                                <th class="p-5 text-center">إلى</th>
                                <th class="p-5 text-center border-x">الحالة</th>
                                <th class="p-5 text-center">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="text-sm divide-y divide-slate-100 bg-white"></tbody>
                    </table>
                </div>
             </section>
        </div>
    </div>

    <script>
        let vacationsData = [];
        const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

        function switchTab(tab) {
            document.getElementById('tab-dashboard').classList.toggle('hidden', tab !== 'dashboard');
            document.getElementById('tab-management').classList.toggle('hidden', tab !== 'management');
            document.getElementById('btn-dashboard').classList.toggle('tab-active', tab === 'dashboard');
            document.getElementById('btn-management').classList.toggle('tab-active', tab === 'management');
            if(tab === 'dashboard') refreshUI();
        }

        function refreshUI() {
            updateStats();
            renderGantt();
            updateTable();
            updateRangeIndicator();
        }

        function updateRangeIndicator() {
            const range = document.getElementById('viewRange').value;
            const indicator = document.getElementById('rangeIndicator');
            const rangeText = { 'year': 'السنة كاملة', 'q1': 'الربع الأول (Q1)', 'q2': 'الربع الثاني (Q2)', 'q3': 'الربع الثالث (Q3)', 'q4': 'الربع الرابع (Q4)' };
            indicator.innerText = rangeText[range];
        }

        function updateStats() {
            const range = document.getElementById('viewRange').value;
            let startM = 0, endM = 11;
            if(range === 'q1') endM = 2; else if(range === 'q2') {startM=3; endM=5;} else if(range === 'q3') {startM=6; endM=8;} else if(range === 'q4') {startM=9; endM=11;}

            const filtered = vacationsData.filter(v => {
                const m = new Date(v.from).getMonth();
                return m >= startM && m <= endM;
            });

            const activeToday = vacationsData.filter(v => {
                const t = new Date().toISOString().split('T')[0];
                return t >= v.from && t <= v.to;
            }).length;

            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="bg-white p-6 rounded-3xl border-b-4 border-b-blue-600 shadow-lg">
                    <h3 class="text-slate-400 text-[10px] font-bold mb-2 uppercase tracking-widest text-center">إجمالي الإجازات (الفترة)</h3>
                    <p class="text-4xl font-black text-slate-800 text-center">${filtered.length}</p>
                </div>
                <div class="bg-white p-6 rounded-3xl border-b-4 border-b-emerald-600 shadow-lg">
                    <h3 class="text-slate-400 text-[10px] font-bold mb-2 uppercase tracking-widest text-center">إجازات نشطة اليوم</h3>
                    <p class="text-4xl font-black text-emerald-600 text-center">${activeToday}</p>
                </div>
                <div class="bg-white p-6 rounded-3xl border-b-4 border-b-amber-500 shadow-lg">
                    <h3 class="text-slate-400 text-[10px] font-bold mb-2 uppercase tracking-widest text-center">بانتظار الموافقة</h3>
                    <p class="text-4xl font-black text-amber-500 text-center">${vacationsData.filter(v => v.status === 'PENDING').length}</p>
                </div>
                <div class="bg-white p-6 rounded-3xl border-b-4 border-b-purple-600 shadow-lg">
                    <h3 class="text-slate-400 text-[10px] font-bold mb-2 uppercase tracking-widest text-center">حالة التغطية</h3>
                    <p class="text-2xl font-black text-purple-600 text-center uppercase mt-1">Optimal</p>
                </div>
            `;
        }

        function renderGantt() {
            const range = document.getElementById('viewRange').value;
            const area = document.getElementById('ganttArea');
            let startM = 0, endM = 11;
            if(range === 'q1') endM = 2; else if(range === 'q2') {startM=3; endM=5;} else if(range === 'q3') {startM=6; endM=8;} else if(range === 'q4') {startM=9; endM=11;}
            
            const totalMonths = (endM - startM) + 1;
            const gridCols = 2 + totalMonths;

            const grouped = {};
            vacationsData.forEach(v => {
                const d1 = new Date(v.from);
                const d2 = new Date(v.to);
                if (d2.getMonth() >= startM && d1.getMonth() <= endM) {
                    if(!grouped[v.name]) grouped[v.name] = [];
                    grouped[v.name].push(v);
                }
            });

            let html = `<div class="gantt-grid-row border-b-2 border-slate-100 bg-slate-50" style="grid-template-columns: repeat(${gridCols}, 1fr);">
                <div class="col-span-2 p-5 text-sm font-black text-slate-800 border-l-2">الموظف</div>`;
            for(let i = startM; i <= endM; i++) html += `<div class="p-5 text-[10px] font-black text-slate-500 border-l-2 text-center uppercase tracking-widest">${monthNames[i]}</div>`;
            html += `</div>`;

            Object.keys(grouped).forEach(emp => {
                html += `<div class="gantt-grid-row border-b border-slate-100 h-20 relative" style="grid-template-columns: repeat(${gridCols}, 1fr);">
                    <div class="col-span-2 p-4 text-[11px] font-bold text-slate-800 border-l-2 flex items-center bg-white z-20 sticky right-0 shadow-sm">${emp}</div>
                    <div class="col-span-${totalMonths} relative flex items-center h-full bg-slate-50/10">`;
                grouped[emp].forEach((vac, idx) => {
                    const d1 = new Date(vac.from), d2 = new Date(vac.to);
                    const sM = Math.max(d1.getMonth(), startM), eM = Math.min(d2.getMonth(), endM);
                    const mWidth = 100 / totalMonths;
                    const right = (sM - startM) * mWidth, width = ((eM - sM) + 1) * mWidth;
                    html += `<div class="vacation-bar color-${idx % 3}" style="right: ${right}%; width: ${width - 0.5}%;">
                        <span class="date-text-inside">${vac.from} إلى ${vac.to}</span>
                    </div>`;
                });
                html += `</div></div>`;
            });
            area.innerHTML = html || `<div class="p-24 text-center font-bold text-slate-400">لا توجد إجازات مجدولة لهذا النطاق</div>`;
        }

        async function copyFullDashboard() {
            const area = document.getElementById('captureArea');
            const canvas = await html2canvas(area, { scale: 3, backgroundColor: "#f8fafc", useCORS: true });
            canvas.toBlob(async blob => {
                await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
                alert("✅ تم نسخ التقرير كاملاً بجودة عالية!");
            }, "image/png");
        }

        function processEntry() {
            const n = document.getElementById('empName').value, f = document.getElementById('dateFrom').value, t = document.getElementById('dateTo').value;
            if(!n || !f || !t) { alert("أكمل البيانات"); return; }
            vacationsData.push({ id: Date.now(), name: n, from: f, to: t, status: 'PENDING' });
            refreshUI();
            document.getElementById('empName').value = '';
        }

        function updateTable() {
            document.getElementById('tableBody').innerHTML = vacationsData.map(v => `
                <tr class="hover:bg-slate-50 transition-all">
                    <td class="p-5 font-bold text-slate-700">${v.name}</td>
                    <td class="p-5 text-center font-mono text-slate-500 font-bold">${v.from}</td>
                    <td class="p-5 text-center font-mono text-slate-500 font-bold">${v.to}</td>
                    <td class="p-5 text-center border-x">
                        <span class="px-4 py-1.5 rounded-full ${v.status==='APPROVED'?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'} text-[10px] font-black uppercase tracking-tighter">${v.status}</span>
                    </td>
                    <td class="p-5 flex justify-center gap-2">
                        <button onclick="updateStat(${v.id}, 'APPROVED')" class="bg-emerald-600 text-white px-4 py-1.5 rounded-xl text-[10px] font-bold shadow-sm hover:bg-emerald-700 transition-all">موافقة</button>
                        <button onclick="editItem(${v.id})" class="bg-sky-600 text-white px-4 py-1.5 rounded-xl text-[10px] font-bold shadow-sm hover:bg-sky-700 transition-all">تعديل</button>
                    </td>
                </tr>`).reverse().join('');
        }

        function updateStat(id, stat) { const item = vacationsData.find(v => v.id === id); if(item) item.status = stat; refreshUI(); }
        function editItem(id) {
            const item = vacationsData.find(v => v.id === id); if(!item) return;
            document.getElementById('empName').value = item.name; document.getElementById('dateFrom').value = item.from; document.getElementById('dateTo').value = item.to;
            vacationsData = vacationsData.filter(v => v.id !== id);
            refreshUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formatExcelDate(s) { if(!s || isNaN(s)) return s; return new Date(Math.round((s-25569)*86400*1000)).toISOString().split('T')[0]; }
        document.getElementById('uploadExcel').addEventListener('change', function(e) {
            const reader = new FileReader(); reader.onload = function(event) {
                const workbook = XLSX.read(new Uint8Array(event.target.result), { type: 'array' });
                XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]).forEach(row => {
                    const n = row['الموظف'] || row['Employee'], f = formatExcelDate(row['من'] || row['From']), t = formatExcelDate(row['إلى'] || row['To']);
                    if(n && f && t) vacationsData.push({ id: Date.now() + Math.random(), name: n, from: f, to: t, status: 'PENDING' });
                });
                refreshUI();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });
        function downloadExcel() { XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("requestsTable")), "Almajdouie_Vacations.xlsx"); }
        refreshUI();
    </script>
</body>
</html>
