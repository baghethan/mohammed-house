<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Security & Permissions Management</title>
  <style>
    :root {
      --primary: #123c69;
      --primary-strong: #0d2149;
      --accent: #2f6f8f;
      --success: #15803d;
      --danger: #b91c1c;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe4ef;
      --soft-line: #edf2f7;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --page: #eef3f8;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #eef3f8 0%, #f8fafc 42%, #f8fafc 100%);
    }

    .permissions-shell {
      max-width: 1220px;
      margin: 0 auto;
      padding: 24px;
    }

    .page-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--primary-strong);
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .version-pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 7px 12px;
      border: 1px solid #c7d7e8;
      border-radius: 999px;
      background: #ffffff;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 8px 22px rgba(18, 60, 105, 0.08);
    }

    .workspace {
      display: grid;
      gap: 16px;
    }

    .surface {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .editor {
      padding: 18px;
    }

    .section-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .section-bar h2,
    .panel-title h2,
    .table-title h2 {
      margin: 0;
      color: var(--primary-strong);
      font-size: 15px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .selected-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--soft-line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .field {
      min-width: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #274260;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      min-height: 40px;
      padding: 9px 11px;
      border: 1px solid #cbd8e6;
      border-radius: 7px;
      background: #ffffff;
      color: var(--ink);
      font-size: 13px;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
    }

    input[readonly] {
      background: #edf2f7;
      color: #475569;
      cursor: not-allowed;
    }

    .mono-input,
    .uid-cell {
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 11px;
    }

    .toggle-field {
      height: 100%;
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 22px 12px 0;
      border-radius: 7px;
      color: var(--primary-strong);
      letter-spacing: 0;
      text-transform: none;
      background: #ffffff;
      border: 1px solid #d9e4ef;
    }

    .toggle-field input {
      width: 18px;
      min-height: 18px;
      height: 18px;
      padding: 0;
      accent-color: var(--primary);
    }

    .permission-layout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .permission-panel {
      overflow: hidden;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--soft-line);
      background: #fbfdff;
    }

    .action-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn-mini,
    .save-btn {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
    }

    .btn-mini {
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid #cbd8e6;
      border-radius: 7px;
      background: #ffffff;
      color: var(--primary);
      font-size: 11px;
    }

    .btn-mini:hover {
      background: #eef5fb;
      border-color: #a8bfd7;
    }

    .check-list {
      display: grid;
      gap: 8px;
      padding: 14px;
      background: #ffffff;
    }

    .check-item {
      display: grid;
      grid-template-columns: 22px 1fr;
      align-items: center;
      min-height: 42px;
      margin: 0;
      padding: 9px 11px;
      border: 1px solid #e8eef5;
      border-radius: 7px;
      background: #f8fafc;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .check-item:hover {
      border-color: #a8bfd7;
      background: #f1f7fc;
    }

    .check-item input {
      width: 16px;
      min-height: 16px;
      height: 16px;
      padding: 0;
      accent-color: var(--primary);
    }

    .save-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .save-btn {
      min-height: 44px;
      min-width: 230px;
      padding: 12px 18px;
      border-radius: 8px;
      background: var(--primary-strong);
      color: #ffffff;
      font-size: 13px;
      box-shadow: 0 12px 24px rgba(13, 33, 73, 0.18);
    }

    .save-btn:hover {
      background: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(13, 33, 73, 0.24);
    }

    .save-btn:disabled {
      opacity: 0.72;
      cursor: wait;
      transform: none;
    }

    .table-section {
      overflow: hidden;
    }

    .table-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--soft-line);
      background: #fbfdff;
    }

    .user-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .table-wrap {
      overflow-x: auto;
      max-height: 360px;
    }

    table {
      width: 100%;
      min-width: 840px;
      border-collapse: collapse;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 12px 14px;
      background: #f6f9fc;
      color: #54677e;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--soft-line);
      color: #162033;
      font-size: 13px;
      vertical-align: middle;
    }

    tbody tr {
      cursor: pointer;
      transition: background 0.12s ease;
    }

    tbody tr:hover {
      background: #f4f8fc;
    }

    tbody tr.selected {
      background: #edf6ff;
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
    }

    .status-pill.is-active {
      color: #0f5132;
      background: #dcfce7;
    }

    .status-pill.is-inactive {
      color: #7f1d1d;
      background: #fee2e2;
    }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 22px;
      cursor: default;
    }

    @media (max-width: 900px) {
      .permissions-shell {
        padding: 16px;
      }

      .page-top,
      .section-bar,
      .table-title {
        align-items: flex-start;
        flex-direction: column;
      }

      .field-grid,
      .permission-layout {
        grid-template-columns: 1fr;
      }

      .save-row {
        justify-content: stretch;
      }

      .save-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="permissions-shell">
    <header class="page-top">
      <div>
        <p class="eyebrow">MMC IT Service Delivery</p>
        <h1>Unified Security & Permissions</h1>
      </div>
      <span class="version-pill">v3.3.3</span>
    </header>

    <div class="workspace">
      <section class="surface editor">
        <div class="section-bar">
          <h2>User Access Profile</h2>
          <span class="selected-hint" id="selectedHint">No user selected</span>
        </div>

        <div class="field-grid">
          <div class="field">
            <label for="uName">Full Name</label>
            <input id="uName" type="text" readonly>
          </div>
          <div class="field">
            <label for="uEmail">Email Address</label>
            <input id="uEmail" type="text" readonly>
          </div>
          <div class="field">
            <label for="uId">System UID</label>
            <input id="uId" class="mono-input" type="text" readonly>
          </div>
          <div class="field">
            <label for="uTechId">Technician ID / Code</label>
            <input id="uTechId" type="text" placeholder="e.g. 71988">
          </div>
          <div class="field">
            <label for="uRole">Assigned Role</label>
            <select id="uRole">
              <option value="technician">Technician</option>
              <option value="supervisor">Supervisor</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <label class="toggle-field" for="uActive">
            <input type="checkbox" id="uActive">
            <span>Account active status</span>
          </label>
        </div>
      </section>

      <section class="permission-layout">
        <div class="surface permission-panel">
          <div class="panel-title">
            <h2>Schedule Pages</h2>
            <div class="action-group">
              <button class="btn-mini" onclick="selAll('sch-c', true)">Select All</button>
              <button class="btn-mini" onclick="selAll('sch-c', false)">Clear</button>
            </div>
          </div>
          <div id="schGrid" class="check-list"></div>
        </div>

        <div class="surface permission-panel">
          <div class="panel-title">
            <h2>Site-Visit Pages</h2>
            <div class="action-group">
              <button class="btn-mini" onclick="selAll('sv-c', true)">Select All</button>
              <button class="btn-mini" onclick="selAll('sv-c', false)">Clear</button>
            </div>
          </div>
          <div id="svGrid" class="check-list"></div>
        </div>
      </section>

      <div class="save-row">
        <button class="save-btn" id="saveBtn">Deploy Security Policies</button>
      </div>

      <section class="surface table-section">
        <div class="table-title">
          <h2>Users</h2>
          <span class="user-count" id="userCount">Connecting</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tech ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Status</th>
                <th>UID</th>
              </tr>
            </thead>
            <tbody id="userList">
              <tr><td colspan="5" class="empty-state">Connecting to system...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const config = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325"
    };

    const app = initializeApp(config);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const SCH = {
      dashboard: "Dashboard",
      schedule: "Schedule",
      employees: "Employees",
      annual: "Annual Leave",
      planning: "Plan-Vacation",
      settings: "Shift Settings"
    };

    const SV = {
      dashboard: "Dashboard",
      checklist: "Check-List",
      brands: "Brands",
      upgrade: "Upgrade Windows",
      visit: "Visits Entry",
      branches: "Branches",
      checklist_admin: "Checklist Admin",
      reports: "Reports windows",
      permissions: "Permissions"
    };

    const userList = document.getElementById('userList');
    const userCount = document.getElementById('userCount');
    const selectedHint = document.getElementById('selectedHint');
    const saveBtn = document.getElementById('saveBtn');

    document.getElementById('schGrid').innerHTML = renderPermissionItems(SCH, 'sch-c');
    document.getElementById('svGrid').innerHTML = renderPermissionItems(SV, 'sv-c');

    window.selAll = (cls, state) => {
      document.querySelectorAll('.' + cls).forEach(input => input.checked = state);
    };

    function renderPermissionItems(items, cls) {
      return Object.keys(items)
        .map(key => `<label class="check-item"><input type="checkbox" class="${cls}" data-id="${key}"><span>${escapeHtml(items[key])}</span></label>`)
        .join('');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    async function loadTable() {
      try {
        const snap = await getDocs(collection(db, 'app_users'));
        userCount.textContent = `${snap.size} users`;

        if (snap.empty) {
          userList.innerHTML = `<tr><td colspan="5" class="empty-state">No users found.</td></tr>`;
          return;
        }

        userList.innerHTML = snap.docs.map(documentSnapshot => {
          const user = documentSnapshot.data();
          const active = user.active !== false;

          return `<tr data-uid="${escapeHtml(documentSnapshot.id)}">
            <td><strong>${escapeHtml(user.technicianId || '-')}</strong></td>
            <td>${escapeHtml(user.name || 'Unknown')}</td>
            <td>${escapeHtml((user.role || 'technician').toUpperCase())}</td>
            <td><span class="status-pill ${active ? 'is-active' : 'is-inactive'}">${active ? 'Active' : 'Inactive'}</span></td>
            <td class="uid-cell">${escapeHtml(documentSnapshot.id)}</td>
          </tr>`;
        }).join('');

        userList.querySelectorAll('tr[data-uid]').forEach(row => {
          row.addEventListener('click', () => window.fetchUser(row.dataset.uid));
        });
      } catch (error) {
        userCount.textContent = 'Error';
        userList.innerHTML = `<tr><td colspan="5" class="empty-state" style="color: var(--danger)">Error: ${escapeHtml(error.message)}</td></tr>`;
      }
    }

    window.fetchUser = async (id) => {
      const userDoc = await getDoc(doc(db, 'app_users', id));
      if (!userDoc.exists()) return;

      const user = userDoc.data();
      document.getElementById('uId').value = id;
      document.getElementById('uName').value = user.name || "";
      document.getElementById('uEmail').value = user.email || "";
      document.getElementById('uTechId').value = user.technicianId || "";
      document.getElementById('uRole').value = (user.role || "technician").toLowerCase();
      document.getElementById('uActive').checked = user.active !== false;
      document.querySelectorAll('.sch-c').forEach(input => input.checked = (user.permissions_schedule || []).includes(input.dataset.id));
      document.querySelectorAll('.sv-c').forEach(input => input.checked = (user.permissions_site_visit || []).includes(input.dataset.id));

      userList.querySelectorAll('tr[data-uid]').forEach(row => {
        row.classList.toggle('selected', row.dataset.uid === id);
      });
      selectedHint.textContent = user.name ? `Selected: ${user.name}` : 'User selected';
    };

    saveBtn.onclick = async () => {
      const uid = document.getElementById('uId').value;
      if (!uid) return alert("Select user first.");

      const schedulePermissions = Array.from(document.querySelectorAll('.sch-c:checked')).map(input => input.dataset.id);
      const siteVisitPermissions = Array.from(document.querySelectorAll('.sv-c:checked')).map(input => input.dataset.id);
      const mainTabs = ['diagnostics'];
      if (schedulePermissions.length) mainTabs.push('schedule');
      if (siteVisitPermissions.some(key => key !== 'permissions')) mainTabs.push('site_visit');
      if (siteVisitPermissions.includes('permissions')) mainTabs.push('permissions');

      const data = {
        technicianId: document.getElementById('uTechId').value,
        role: document.getElementById('uRole').value.toLowerCase(),
        active: document.getElementById('uActive').checked,
        permissions_schedule: schedulePermissions,
        permissions_site_visit: siteVisitPermissions,
        permissions_main_tabs: mainTabs,
        updatedAt: new Date().toISOString()
      };

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        await setDoc(doc(db, 'app_users', uid), data, { merge: true });
        alert("Permissions updated successfully.");
        await loadTable();
        await window.fetchUser(uid);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Deploy Security Policies';
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) loadTable();
      else {
        userCount.textContent = 'Waiting';
        userList.innerHTML = `<tr><td colspan="5" class="empty-state">Waiting for session...</td></tr>`;
      }
    });
  </script>
</body>
</html>
