<!DOCTYPE html>
<!-- MASTER PERMISSIONS - VERSION 3.3.0 - AL-MAJDOUIE MOTORS -->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Master Permissions Management</title>
  <style>
    :root{--primary:#0d2149;--accent:#1b4fa3;--bg:#f8fafc;--border:#cbd5e1}
    body{font-family: 'Segoe UI', sans-serif; background:var(--bg); padding:25px; color:#1e293b}
    .card{background:#fff; border-radius:15px; padding:30px; border:1px solid var(--border); max-width:1150px; margin:auto; box-shadow: 0 4px 20px rgba(0,0,0,0.05)}
    .header-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; background:#f1f5f9; padding:20px; border-radius:12px; border:1px solid #e2e8f0 }
    label{display:block; font-size:12px; font-weight:800; color:var(--primary); margin-bottom:8px}
    input, select { width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box; font-size:14px }
    .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
    .perm-box { background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px; }
    .box-title { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #f1f5f9; padding-bottom:12px; margin-bottom:15px }
    .btn-mini { padding:5px 12px; font-size:11px; font-weight:bold; cursor:pointer; background:#fff; border:1px solid var(--border); border-radius:5px; transition:0.2s }
    .btn-mini:hover { background:var(--primary); color:#fff }
    .save-btn { width:100%; padding:18px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; transition:0.3s; box-shadow:0 4px 15px rgba(13,33,73,0.2) }
    .save-btn:hover { background:var(--accent); transform:translateY(-1px) }
    table { width:100%; border-collapse:collapse; margin-top:25px; border-radius:10px; overflow:hidden }
    th { background:#f8fafc; padding:15px; text-align:left; font-size:11px; color:#64748b; border-bottom:2px solid #e2e8f0 }
    td { padding:12px 15px; border-bottom:1px solid #f1f5f9; font-size:13px; cursor:pointer }
    tr:hover { background:#f1f5f9 }
    .check-item { display:flex; align-items:center; gap:10px; background:#f9fafb; padding:10px; border-radius:8px; margin-bottom:5px; font-size:14px; cursor:pointer }
  </style>
</head>
<body>
<div class="card">
    <h2 style="text-align:center; color:var(--primary); margin-bottom:30px">Unified Security & Permissions v3.3.0</h2>
    
    <!-- User Information Section -->
    <div class="header-grid">
        <div><label>Employee Name</label><input id="uName" type="text" readonly style="background:#e2e8f0"></div>
        <div><label>Email Address</label><input id="uEmail" type="text" readonly style="background:#e2e8f0"></div>
        <div><label>UID (System Key)</label><input id="uId" type="text" readonly style="background:#e2e8f0; font-size:10px"></div>
        <div><label>Technician ID</label><input id="uTechId" type="text" placeholder="Enter Tech ID"></div>
        <div><label>System Role</label>
            <select id="uRole">
                <option value="technician">Technician</option>
                <option value="supervisor">Supervisor</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding-top:25px">
            <input type="checkbox" id="uActive" style="width:22px; height:22px"> <label style="margin:0" for="uActive">Account Is Active</label>
        </div>
    </div>

    <!-- Permissions Grid Section -->
    <div class="perm-grid">
        <div class="perm-box">
            <div class="box-title"><b>🗓️ Schedule Services</b> <div><button class="btn-mini" onclick="selAll('sch-c',true)">Select All</button><button class="btn-mini" onclick="selAll('sch-c',false)">Clear</button></div></div>
            <div id="schGrid"></div>
        </div>
        <div class="perm-box">
            <div class="box-title"><b>📍 Site-Visit Services</b> <div><button class="btn-mini" onclick="selAll('sv-c',true)">Select All</button><button class="btn-mini" onclick="selAll('sv-c',false)">Clear</button></div></div>
            <div id="svGrid"></div>
        </div>
    </div>

    <button class="save-btn" id="saveBtn">💾 Save All Security Policies</button>

    <!-- Users Registry Table -->
    <table><thead><tr><th>Tech ID</th><th>Name</th><th>Role</th><th>Status</th><th>UID</th></tr></thead><tbody id="userList"></tbody></table>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    
    const config = { apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs", authDomain: "baghethan-ba325.firebaseapp.com", projectId: "baghethan-ba325" };
    const app = initializeApp(config); const db = initializeFirestore(app, { experimentalForceLongPolling: true });

    const SCH = { dashboard: "Dashboard", schedule: "Weekly-Schedule", employees: "Employees", annual: "Annual Leave", planning: "Planning" };
    const SV = { dashboard: "Dashboard", checklist: "Check-List", brands: "Brands", upgrade: "Upgrade Windows", visit: "Visits Entry", branches: "Branches", permissions: "Permissions" };

    document.getElementById('schGrid').innerHTML = Object.keys(SCH).map(k => `<label class="check-item"><input type="checkbox" class="sch-c" data-id="${k}"> ${SCH[k]}</label>`).join('');
    document.getElementById('svGrid').innerHTML = Object.keys(SV).map(k => `<label class="check-item"><input type="checkbox" class="sv-c" data-id="${k}"> ${SV[k]}</label>`).join('');

    window.selAll = (cls, stat) => document.querySelectorAll('.'+cls).forEach(i => i.checked = stat);

    async function loadTable() {
        const snap = await getDocs(collection(db, 'app_users'));
        document.getElementById('userList').innerHTML = snap.docs.map(d => {
            const u = d.data();
            return `<tr onclick="fetchUser('${d.id}')"><td>${u.technicianId || '-'}</td><td>${u.name}</td><td><b>${u.role}</b></td><td>${u.active ? '✅' : '❌'}</td><td style="font-size:10px">${d.id}</td></tr>`;
        }).join('');
    }

    window.fetchUser = async (id) => {
        const d = await getDoc(doc(db, 'app_users', id));
        if(d.exists()) {
            const u = d.data();
            document.getElementById('uId').value = id;
            document.getElementById('uName').value = u.name; document.getElementById('uEmail').value = u.email;
            document.getElementById('uTechId').value = u.technicianId || "";
            document.getElementById('uRole').value = (u.role || "technician").toLowerCase();
            document.getElementById('uActive').checked = u.active !== false;
            document.querySelectorAll('.sch-c').forEach(c => c.checked = (u.permissions_schedule || []).includes(c.dataset.id));
            document.querySelectorAll('.sv-c').forEach(c => c.checked = (u.permissions_site_visit || []).includes(c.dataset.id));
        }
    };

    document.getElementById('saveBtn').onclick = async () => {
        const uid = document.getElementById('uId').value; if(!uid) return alert("Select user first");
        const data = {
            technicianId: document.getElementById('uTechId').value,
            role: document.getElementById('uRole').value.toLowerCase(), // حفظ كـ admin صغير ليتوافق مع القواعد
            active: document.getElementById('uActive').checked,
            permissions_schedule: Array.from(document.querySelectorAll('.sch-c:checked')).map(c => c.dataset.id),
            permissions_site_visit: Array.from(document.querySelectorAll('.sv-c:checked')).map(c => c.dataset.id),
            updatedAt: new Date().toISOString()
        };
        await setDoc(doc(db, 'app_users', uid), data, { merge: true });
        alert("✅ Security Policies Deployed!"); loadTable();
    };
    loadTable();
</script>
</body>
</html>
