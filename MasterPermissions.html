<!DOCTYPE html>
<!-- MASTER PERMISSIONS - VERSION 3.3.1 - AL-MAJDOUIE MOTORS -->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Unified Security & Permissions Management</title>
  <style>
    :root{ --primary: #0d2149; --accent: #1b4fa3; --bg: #f8fafc; --border: #cbd5e1; }
    body{ font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; color: #1e293b; margin: 0; }
    .card{ background: #fff; border-radius: 15px; padding: 25px; border: 1px solid var(--border); max-width: 1200px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    
    /* Header Section */
    .header-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; background: #f1f5f9; padding: 15px; border-radius: 12px; }
    label { display: block; font-size: 11px; font-weight: 800; color: var(--primary); margin-bottom: 5px; text-transform: uppercase; }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 13px; outline: none; }
    input[readonly] { background: #e2e8f0; cursor: not-allowed; }

    /* Permissions Section */
    .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .perm-box { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 15px; }
    .box-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 12px; font-weight: bold; color: var(--primary); }
    .btn-mini { padding: 4px 10px; font-size: 10px; font-weight: bold; cursor: pointer; background: #fff; border: 1px solid var(--border); border-radius: 4px; }
    .btn-mini:hover { background: var(--primary); color: #fff; }

    .check-item { display: flex; align-items: center; gap: 10px; background: #f9fafb; padding: 8px 12px; border-radius: 6px; margin-bottom: 5px; font-size: 13px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .check-item:hover { border-color: var(--accent); background: #f0f7ff; }

    /* Action Buttons */
    .save-btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .save-btn:hover { background: var(--accent); box-shadow: 0 4px 15px rgba(13,33,73,0.2); }

    /* Table Section */
    .table-container { margin-top: 25px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th { background: #f8fafc; padding: 12px; text-align: left; font-size: 11px; color: #64748b; border-bottom: 2px solid #e2e8f0; }
    td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; cursor: pointer; }
    tr:hover { background: #f1f5f9; }
    .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
    .status-active { background: #dcfce7; color: #166534; }
    .status-inactive { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="card">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: var(--primary); margin: 0;">Unified Security & Permissions v3.3.1</h2>
        <small style="color: #64748b;">MMC IT Service Delivery | Internal Management System</small>
    </div>
    
    <!-- Employee Profile Section -->
    <div class="header-grid">
        <div><label>Full Name</label><input id="uName" type="text" readonly></div>
        <div><label>Email Address</label><input id="uEmail" type="text" readonly></div>
        <div><label>System UID</label><input id="uId" type="text" readonly style="font-family: monospace; font-size: 10px;"></div>
        <div><label>Technician ID / Code</label><input id="uTechId" type="text" placeholder="e.g. 71988"></div>
        <div>
            <label>Assigned Role</label>
            <select id="uRole">
                <option value="technician">Technician</option>
                <option value="supervisor">Supervisor</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding-top:20px">
            <input type="checkbox" id="uActive" style="width:18px; height:18px"> 
            <label style="margin:0" for="uActive">Account Active Status</label>
        </div>
    </div>

    <!-- Permissions Grids -->
    <div class="perm-grid">
        <div class="perm-box">
            <div class="box-title">
                <span>🗓️ Schedule Pages</span>
                <div>
                    <button class="btn-mini" onclick="selAll('sch-c', true)">Select All</button>
                    <button class="btn-mini" onclick="selAll('sch-c', false)">Clear</button>
                </div>
            </div>
            <div id="schGrid"></div>
        </div>
        <div class="perm-box">
            <div class="box-title">
                <span>📍 Site-Visit Pages</span>
                <div>
                    <button class="btn-mini" onclick="selAll('sv-c', true)">Select All</button>
                    <button class="btn-mini" onclick="selAll('sv-c', false)">Clear</button>
                </div>
            </div>
            <div id="svGrid"></div>
        </div>
    </div>

    <button class="save-btn" id="saveBtn">💾 Deploy Security & Permission Policies</button>

    <!-- User List Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>TECH ID</th>
                    <th>NAME</th>
                    <th>ROLE</th>
                    <th>STATUS</th>
                    <th>UID</th>
                </tr>
            </thead>
            <tbody id="userList">
                <tr><td colspan="5" style="text-align:center; padding:20px;">Synchronizing with Firebase...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    // Firebase Modular Imports
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { initializeFirestore, doc, setDoc, getDoc, getDocs, collection } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const config = { 
        apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs", 
        authDomain: "baghethan-ba325.firebaseapp.com", 
        projectId: "baghethan-ba325" 
    };

    const app = initializeApp(config);
    const db = initializeFirestore(app);
    const auth = getAuth(app);

    // Page Definitions
    const SCH = { dashboard: "Dashboard", schedule: "Schedule", employees: "Employees", annual: "Annual Leave", planning: "Plan-Vacation", settings: "Settings" };
    const SV = { dashboard: "Dashboard", checklist: "Check-List", brands: "Brands", upgrade: "Upgrade Windows", visit: "Visits Entry", branches: "Branches", permissions: "Permissions", tech: "Tech Management", admin: "Dynamic Check-List (Admin)" };

    // Render Grids
    document.getElementById('schGrid').innerHTML = Object.keys(SCH).map(k => `<label class="check-item"><input type="checkbox" class="sch-c" data-id="${k}"> ${SCH[k]}</label>`).join('');
    document.getElementById('svGrid').innerHTML = Object.keys(SV).map(k => `<label class="check-item"><input type="checkbox" class="sv-c" data-id="${k}"> ${SV[k]}</label>`).join('');

    window.selAll = (cls, state) => document.querySelectorAll('.' + cls).forEach(i => i.checked = state);

    // Load Table with All Users
    async function loadTable() {
        try {
            const snap = await getDocs(collection(db, 'app_users'));
            document.getElementById('userList').innerHTML = snap.docs.map(d => {
                const u = d.data();
                const status = u.active !== false ? '<span class="status-badge status-active">ACTIVE</span>' : '<span class="status-badge status-inactive">INACTIVE</span>';
                return `<tr onclick="window.fetchUser('${d.id}')">
                    <td><b>${u.technicianId || '-'}</b></td>
                    <td>${u.name || 'Unknown'}</td>
                    <td>${(u.role || 'technician').toUpperCase()}</td>
                    <td>${status}</td>
                    <td style="font-family:monospace; font-size:10px">${d.id}</td>
                </tr>`;
            }).join('');
        } catch (error) {
            console.error("Table Load Error:", error);
            document.getElementById('userList').innerHTML = `<tr><td colspan="5" style="color:red; text-align:center">Error: ${error.message}</td></tr>`;
        }
    }

    // Fetch Single User Data
    window.fetchUser = async (id) => {
        const d = await getDoc(doc(db, 'app_users', id));
        if (d.exists()) {
            const u = d.data();
            document.getElementById('uId').value = id;
            document.getElementById('uName').value = u.name || "";
            document.getElementById('uEmail').value = u.email || "";
            document.getElementById('uTechId').value = u.technicianId || "";
            document.getElementById('uRole').value = (u.role || "technician").toLowerCase();
            document.getElementById('uActive').checked = u.active !== false;
            
            document.querySelectorAll('.sch-c').forEach(c => c.checked = (u.permissions_schedule || []).includes(c.dataset.id));
            document.querySelectorAll('.sv-c').forEach(c => c.checked = (u.permissions_site_visit || []).includes(c.dataset.id));
        }
    };

    // Save Data[cite: 1]
    document.getElementById('saveBtn').onclick = async () => {
        const uid = document.getElementById('uId').value;
        if (!uid) return alert("Please select a user from the table first.");

        const data = {
            technicianId: document.getElementById('uTechId').value,
            role: document.getElementById('uRole').value.toLowerCase(),
            active: document.getElementById('uActive').checked,
            permissions_schedule: Array.from(document.querySelectorAll('.sch-c:checked')).map(c => c.dataset.id),
            permissions_site_visit: Array.from(document.querySelectorAll('.sv-c:checked')).map(c => c.dataset.id),
            updatedAt: new Date().toISOString()
        };

        try {
            await setDoc(doc(db, 'app_users', uid), data, { merge: true });
            alert("🚀 Security Policies Deployed Successfully!");
            loadTable();
        } catch (error) {
            alert("Error saving: " + error.message);
        }
    };

    // --- FIX: Wait for Auth State before loading data ---[cite: 1]
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log("Admin session verified:", user.uid);
            loadTable();
        } else {
            console.warn("No active session found. Redirection might be needed.");
        }
    });
</script>

</body>
</html>
