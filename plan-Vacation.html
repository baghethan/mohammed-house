<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, where } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ⚠️ تأكد من وضع بيانات Firebase الخاصة بك هنا
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const empCol = collection(db, "employees");
    const vacCol = collection(db, "vacations");

    let allEmployees = [];

    // --- 1. إضافة موظف يدوياً (تأكد من المسميات) ---
    window.addNewEmployee = async () => {
        const id = document.getElementById('newEmpId').value.trim();
        const name = document.getElementById('newEmpName').value.trim();
        const dept = document.getElementById('newEmpDept').value.trim();
        const role = document.getElementById('newEmpRole').value;

        if(!id || !name) return alert("Please fill ID and Name!");

        await addDoc(empCol, { 
            empId: String(id), 
            name: name, 
            dept: dept, 
            role: role 
        });
        alert("Employee Registered Successfully! ✅");
        document.getElementById('newEmpId').value = ""; document.getElementById('newEmpName').value = "";
    };

    // --- 2. تحديث القائمة المنسدلة (حل مشكلة القوسين الفارغين) ---
    onSnapshot(empCol, (snap) => {
        const select = document.getElementById('selectEmployee');
        select.innerHTML = '<option value="">-- Choose Employee --</option>';
        allEmployees = [];
        
        snap.forEach(d => {
            const emp = d.data();
            allEmployees.push(emp);
            
            // البحث عن الاسم والرقم حتى لو المسميات مختلفة في الداتابيز
            const displayName = emp.name || emp.Name || "No Name";
            const displayId = emp.empId || emp.ID || emp.Id || "0000";

            const opt = document.createElement('option');
            opt.value = displayId;
            opt.innerText = `${displayName} (${displayId})`;
            select.appendChild(opt);
        });
    });

    // --- 3. استيراد الموظفين (دعم كافة أنواع ملفات الإكسل) ---
    document.getElementById('importEmpFile').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const wb = XLSX.read(ev.target.result, {type:'binary'});
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            
            let count = 0;
            for(let r of rows) {
                // مسميات مرنة جداً للأعمدة
                const id = r["ID"] || r["Employee ID"] || r["id"] || r["الرقم"] || r["رقم الموظف"];
                const name = r["Name"] || r["Full Name"] || r["name"] || r["الاسم"] || r["الاسم الكامل"];
                const dept = r["Dept"] || r["Department"] || r["dept"] || r["القسم"];
                const role = r["Role"] || r["role"] || r["المسمى"] || "Employee";

                if(id && name) {
                    await addDoc(empCol, { 
                        empId: String(id), 
                        name: String(name), 
                        dept: String(dept || ""), 
                        role: String(role) 
                    });
                    count++;
                }
            }
            alert(`Imported ${count} employees successfully! ✅`);
        };
        reader.readAsBinaryString(e.target.files[0]);
    };

    // --- 4. ربط الإجازة (Submit Vacation) ---
    document.getElementById('addVacBtn').onclick = async () => {
        const empId = document.getElementById('selectEmployee').value;
        const from = document.getElementById('vacFrom').value;
        const to = document.getElementById('vacTo').value;

        if(!empId || !from || !to) return alert("Select Employee and Dates!");

        const emp = allEmployees.find(e => (e.empId || e.ID || e.Id) == empId);
        if(!emp) return alert("Employee data error!");

        const start = new Date(from);
        const key = `${start.getMonth() + 1}-${start.getFullYear()}`;

        await addDoc(vacCol, { ...emp, from, to, monthKey: key });
        alert("Vacation Linked! ✅");
    };

    // --- 5. عرض الجدول والبارات ---
    onSnapshot(vacCol, (snap) => {
        const tbody = document.getElementById('vacationTable');
        const bars = document.getElementById('barsContainer');
        tbody.innerHTML = ""; bars.innerHTML = "";
        let offset = 0;
        const colors = { Employee: "#10b981", Supervisor: "#a855f7", Manager: "#3b82f6", Director: "#f97316" };

        snap.forEach(dSnap => {
            const v = dSnap.data();
            const id = dSnap.id;
            const displayName = v.name || v.Name || "Unknown";
            const displayId = v.empId || v.ID || "0000";

            tbody.innerHTML += `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-4">${displayId}</td>
                    <td class="p-4 font-bold text-blue-900">${displayName}</td>
                    <td class="p-4 text-xs font-bold text-gray-600">${v.role}</td>
                    <td class="p-4 text-gray-500 text-xs">${v.from}</td>
                    <td class="p-4 text-gray-500 text-xs">${v.to}</td>
                    <td class="p-4 text-center"><button class="text-red-500 font-bold" onclick="deleteVacation('${id}')">X</button></td>
                </tr>`;
            
            const s = (new Date(v.from) - new Date(2026,0,1)) / (1000*3600*24*365) * 100;
            const e = (new Date(v.to) - new Date(2026,0,1)) / (1000*3600*24*365) * 100;
            bars.innerHTML += `<div class="vacation-bar" style="left:${s}%; width:${Math.max(e-s, 2)}%; top:${offset}px; background:${colors[v.role] || '#ccc'}">${displayName}</div>`;
            offset += 35;
        });
        bars.style.height = `${offset + 20}px`;
    });

    window.deleteVacation = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db, "vacations", id)); };
    
    // تصدير الموظفين
    window.exportEmployees = async () => {
        const snap = await getDocs(empCol);
        const data = snap.docs.map(d => d.data());
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Employees");
        XLSX.writeFile(wb, "Employees_Database.xlsx");
    };

    // تحويل اللغة
    window.toggleLanguage = () => {
        const html = document.getElementById('htmlTag');
        html.dir = html.dir === 'rtl' ? 'ltr' : 'rtl';
    };
</script>
