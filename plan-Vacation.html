<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, where } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ⚠️ ضع بيانات Firebase الخاصة بك هنا
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const empCol = collection(db, "employees");
    const vacCol = collection(db, "vacations");

    let allEmployees = [];

    // --- 1. إضافة موظف يدوياً ---
    window.addNewEmployee = async () => {
        const id = document.getElementById('newEmpId').value;
        const name = document.getElementById('newEmpName').value;
        const dept = document.getElementById('newEmpDept').value;
        const role = document.getElementById('newEmpRole').value;

        if (!id || !name) return alert("Please fill ID and Name!");
        await addDoc(empCol, { empId: id, name, dept, role });
        alert("Employee Added! ✅");
        document.getElementById('newEmpId').value = ""; document.getElementById('newEmpName').value = "";
    };

    // --- 2. تحديث قائمة الموظفين (Dropdown) تلقائياً ---
    onSnapshot(empCol, (snap) => {
        const select = document.getElementById('selectEmployee');
        if(!select) return;
        select.innerHTML = '<option value="">-- Choose from Database --</option>';
        allEmployees = [];
        snap.forEach(d => {
            const emp = d.data();
            allEmployees.push(emp);
            const opt = document.createElement('option');
            opt.value = emp.empId;
            opt.innerText = `${emp.name} (${emp.empId})`;
            select.appendChild(opt);
        });
    });

    // --- 3. استيراد الموظفين من إكسل (الإصلاح الجديد) ---
    const importInput = document.getElementById('importEmpFile');
    if (importInput) {
        importInput.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = ev.target.result;
                    const workbook = XLSX.read(data, { type: 'binary' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);

                    if (rows.length === 0) return alert("File is empty!");

                    let count = 0;
                    for (let row of rows) {
                        // محاولة قراءة الأعمدة بمسميات مختلفة (ID أو Employee ID)
                        const empId = row["ID"] || row["Employee ID"] || row["رقم الموظف"];
                        const name = row["Name"] || row["Full Name"] || row["الاسم"];
                        const dept = row["Department"] || row["Dept"] || row["القسم"];
                        const role = row["Role"] || row["المسمى"] || "Employee";

                        if (empId && name) {
                            await addDoc(empCol, { empId: String(empId), name, dept, role });
                            count++;
                        }
                    }
                    alert(`Successfully imported ${count} employees! ✅`);
                } catch (err) {
                    console.error(err);
                    alert("Error reading Excel. Please check column names.");
                }
            };
            reader.readAsBinaryString(file);
        };
    }

    // --- 4. تصدير الموظفين ---
    window.exportEmployees = async () => {
        const snap = await getDocs(empCol);
        const data = snap.docs.map(d => d.data());
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Employees");
        XLSX.writeFile(wb, "Employees_Database.xlsx");
    };

    // --- 5. ربط الإجازة ---
    document.getElementById('addVacBtn').onclick = async () => {
        const empId = document.getElementById('selectEmployee').value;
        const from = document.getElementById('vacFrom').value;
        const to = document.getElementById('vacTo').value;
        if(!empId || !from) return alert("Select Employee and Dates!");

        const emp = allEmployees.find(e => e.empId === empId);
        const start = new Date(from);
        const key = `${start.getMonth() + 1}-${start.getFullYear()}`;

        await addDoc(vacCol, { ...emp, from, to, monthKey: key });
        alert("Vacation Linked! ✅");
    };
</script>
