<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المجدوعي لإدارة الإجازات - الإصدار الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f7fa; color: #1e293b; }
        
        /* تصميم بار الإجازة */
        .vacation-bar { 
            height: 24px; border-radius: 12px; position: absolute; z-index: 20; 
            top: 50%; transform: translateY(-50%); box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }

        /* خطوط الشبكة للفصل بين الشهور */
        .grid-line { border-left: 1px solid #e2e8f0; height: 100%; position: absolute; top: 0; }
        
        .nav-btn { background: white; color: #334155; padding: 12px 24px; border-radius: 14px; font-weight: 700; border: 1px solid #e2e8f0; transition: 0.3s; }
        .nav-btn.active { background: #1e3a8a; color: white; border-color: #1e3a8a; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2); }
        
        .section-content { display: none; }
        .section-content.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* سطر الجدول */
        .chart-row { display: flex; border-bottom: 1px solid #f1f5f9; height: 60px; align-items: center; background: white; }
        .chart-row:nth-child(even) { background-color: #f9fbff; }
        
        /* الأعمدة الجانبية ثابتة العرض */
        .info-cols { display: flex; width: 650px; flex-shrink: 0; border-left: 3px solid #1e3a8a; height: 100%; position: sticky; right: 0; z-index: 30; background: white; }
        
        .col-name { width: 280px; padding: 0 20px; }
        .col-date { width: 125px; text-align: center; justify-content: center; border-left: 1px solid #f1f5f9; }
        .col-days { width: 120px; text-align: center; justify-content: center; }

        .cell { display: flex; align-items: center; height: 100%; font-size: 13px; }
        .name-txt { font-weight: 900; color: #0f172a; font-size: 14px; }
        .date-txt { color: #64748b; font-weight: 700; font-family: sans-serif; font-size: 12px; }
        .days-badge { background: #dcfce7; color: #166534; font-weight: 900; padding: 4px 14px; border-radius: 10px; font-size: 12px; }

        /* منطقة المخطط الزمني */
        .timeline-wrapper { flex-grow: 1; overflow-x: auto; background: white; }
        .timeline-content { min-width: 1500px; position: relative; height: 100%; }
        
        .month-header-cell { 
            display: flex; align-items: center; justify-content: center; 
            border-left: 1px solid #334155; font-weight: 900; font-size: 12px;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-[1850px] mx-auto">
        <div class="flex justify-between items-center mb-10 bg-white p-6 rounded-3xl shadow-sm border-r-8 border-blue-900">
            <div class="flex gap-4">
                <button onclick="switchTab('employees')" id="btn-employees" class="nav-btn active">قاعدة البيانات 👥</button>
                <button onclick="switchTab('leaves')" id="btn-leaves" class="nav-btn">إضافة إجازة 🗓️</button>
                <button onclick="switchTab('schedule')" id="btn-schedule" class="nav-btn">مخطط الإجازات 📊</button>
            </div>
            <img src="https://cafs.org.sa/wp-content/uploads/2023/03/Logo-Almajdouie-Holding-Company.jpg" alt="Logo" class="h-14 w-auto">
        </div>

        <div id="sec-employees" class="section-content active">
            <div class="bg-white p-8 rounded-3xl shadow-xl border-t-8 border-emerald-500">
                <h2 class="text-2xl font-black mb-6 text-slate-800">سجل الموظفين</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <input id="newEmpId" type="text" placeholder="رقم الموظف" class="border-2 p-3 rounded-2xl outline-none focus:border-emerald-500">
                    <input id="newEmpName" type="text" placeholder="الاسم الكامل" class="border-2 p-3 rounded-2xl outline-none focus:border-emerald-500">
                    <input id="newEmpDept" type="text" placeholder="القسم" class="border-2 p-3 rounded-2xl outline-none focus:border-emerald-500">
                    <select id="newEmpRole" class="border-2 p-3 rounded-2xl bg-gray-50 font-bold">
                        <option value="Employee">Employee</option>
                        <option value="Supervisor">Supervisor</option>
                        <option value="Manager">Manager</option>
                        <option value="Director">Director</option>
                    </select>
                    <button onclick="addNewEmployee()" class="bg-emerald-600 text-white font-black py-4 rounded-2xl md:col-span-4 shadow-lg hover:bg-emerald-700 transition">تسجيل الموظف في النظام</button>
                </div>
                <div id="empList"></div>
            </div>
        </div>

        <div id="sec-leaves" class="section-content">
            <div class="bg-white p-10 rounded-3xl shadow-xl border-t-8 border-blue-900">
                <h2 class="text-2xl font-black mb-8 text-slate-800">حجز موعد إجازة</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <select id="selectEmployee" class="border-2 p-4 rounded-2xl bg-slate-50 font-black"></select>
                    <input id="vacFrom" type="date" class="border-2 p-4 rounded-2xl font-bold">
                    <input id="vacTo" type="date" class="border-2 p-4 rounded-2xl font-bold">
                    <button id="addVacBtn" class="bg-blue-900 text-white font-black py-4 rounded-2xl md:col-span-3 shadow-xl hover:bg-blue-800 transition">تأكيد وحفظ الإجازة</button>
                </div>
            </div>
        </div>

        <div id="sec-schedule" class="section-content">
            <div class="flex justify-start mb-6">
                <button onclick="copyChartToClipboard()" class="bg-blue-600 text-white px-12 py-4 rounded-2xl font-black shadow-xl hover:bg-blue-700 transition flex items-center gap-3">
                    <span>نسخ المخطط للإيميل (Outlook)</span> 📸
                </button>
            </div>
            
            <div id="captureArea" class="bg-white rounded-[40px] shadow-2xl overflow-hidden border border-slate-200 p-10">
                <div class="flex justify-between items-center mb-12 pb-8 border-b-4 border-slate-100">
                    <img src="https://cafs.org.sa/wp-content/uploads/2023/03/Logo-Almajdouie-Holding-Company.jpg" class="h-28 w-auto">
                    <div class="text-left">
                        <h2 class="text-4xl font-black text-slate-800 uppercase tracking-tighter">جدول الإجازات السنوية - 2026</h2>
                        <p class="text-slate-400 font-bold uppercase tracking-widest">Almajdouie Motors - Official Report</p>
                    </div>
                </div>

                <div class="timeline-wrapper">
                    <div class="timeline-content">
                        <div id="monthHeaderRow" class="flex bg-slate-900 text-white font-black rounded-t-2xl">
                            <div class="info-cols bg-slate-900 border-l border-slate-700">
                                <div class="col-name cell border-l border-slate-700 text-center justify-center">الموظف / المنصب</div>
                                <div class="col-date cell border-l border-slate-700">بداية الإجازة</div>
                                <div class="col-date cell border-l border-slate-700">نهاية الإجازة</div>
                                <div class="col-days cell">عدد الأيام</div>
                            </div>
                            <div id="monthsContainer" class="flex-grow flex">
                                </div>
                        </div>
                        <div id="ganttContainer" class="border border-t-0 border-slate-100 rounded-b-2xl"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
            authDomain: "baghethan-ba325.firebaseapp.com",
            projectId: "baghethan-ba325",
            storageBucket: "baghethan-ba325.firebasestorage.app",
            messagingSenderId: "944819735112",
            appId: "1:944819735112:web:07315600da39377320667d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const empCol = collection(db, "employees");
        const vacCol = collection(db, "vacations");

        const months = [
            { name: "يناير", days: 31 }, { name: "فبراير", days: 28 }, { name: "مارس", days: 31 },
            { name: "أبريل", days: 30 }, { name: "مايو", days: 31 }, { name: "يونيو", days: 30 },
            { name: "يوليو", days: 31 }, { name: "أغسطس", days: 31 }, { name: "سبتمبر", days: 30 },
            { name: "أكتوبر", days: 31 }, { name: "نوفمبر", days: 30 }, { name: "ديسمبر", days: 31 }
        ];
        const totalYearDays = 365;

        let allEmployees = [];

        window.switchTab = (t) => {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sec-${t}`).classList.add('active');
            document.getElementById(`btn-${t}`).classList.add('active');
        };

        // توليد رأس جدول الشهور بدقة الأيام
        const renderMonthHeader = () => {
            const container = document.getElementById('monthsContainer');
            container.innerHTML = months.map(m => {
                const width = (m.days / totalYearDays) * 100;
                return `<div class="month-header-cell" style="width: ${width}%">${m.name}</div>`;
            }).join('');
        };
        renderMonthHeader();

        const getWorkDays = (s, e) => {
            let count = 0, cur = new Date(s), stop = new Date(e);
            while (cur <= stop) {
                if (cur.getDay() !== 5 && cur.getDay() !== 6) count++;
                cur.setDate(cur.getDate() + 1);
            }
            return count;
        };

        window.copyChartToClipboard = () => {
            const area = document.getElementById('captureArea');
            html2canvas(area, { scale: 3, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
                canvas.toBlob(blob => {
                    navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(() => alert("تم نسخ التقرير بجودة عالية! ✅\nالآن اذهب لـ Outlook واضغط Ctrl+V."));
                });
            });
        };

        // مزامنة الموظفين
        onSnapshot(empCol, (snap) => {
            const select = document.getElementById('selectEmployee');
            const list = document.getElementById('empList');
            select.innerHTML = '<option value="">-- اختر الموظف من القائمة --</option>';
            list.innerHTML = "";
            snap.forEach(d => {
                const e = d.data();
                allEmployees.push({ ...e, fireId: d.id });
                select.innerHTML += `<option value="${e.empId}">${e.name}</option>`;
                list.innerHTML += `<div class="flex justify-between items-center p-4 border-b"><div><span class="font-bold text-blue-900">${e.name}</span> <span class="text-xs text-gray-400">#${e.empId}</span></div><button onclick="deleteData('employees', '${d.id}')" class="text-red-500 font-bold text-xs">حذف</button></div>`;
            });
        });

        // مزامنة الإجازات والشارت
        onSnapshot(vacCol, (snap) => {
            const gantt = document.getElementById('ganttContainer');
            gantt.innerHTML = "";
            const colors = { employee: "#3b82f6", supervisor: "#8b5cf6", manager: "#10b981", director: "#f59e0b" };
            let vData = [];
            snap.forEach(d => vData.push({ ...d.data(), id: d.id }));
            vData.sort((a, b) => a.name.localeCompare(b.name));

            vData.forEach(v => {
                const days = getWorkDays(v.from, v.to);
                const roleK = String(v.role).toLowerCase();
                
                // حسابات الموضع الدقيق باليوم
                const startDayOfYear = (new Date(v.from) - new Date(2026,0,1)) / (1000*3600*24);
                const endDayOfYear = (new Date(v.to) - new Date(2026,0,1)) / (1000*3600*24);
                
                const leftPercent = (startDayOfYear / totalYearDays) * 100;
                const widthPercent = ((endDayOfYear - startDayOfYear) / totalYearDays) * 100;

                const row = document.createElement('div');
