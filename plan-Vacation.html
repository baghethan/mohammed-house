<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation System - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-wrap justify-between items-center mb-8 gap-4">
            <h1 id="title" class="text-2xl md:text-3xl font-bold text-blue-900 border-r-4 border-blue-600 pr-4">نظام تخطيط الإجازات السنوية</h1>
            <div class="flex gap-2">
                <button onclick="exportToExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-bold shadow-sm flex items-center gap-2">
                    <span id="btnExport">تصدير Excel</span>
                </button>
                <label class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600 font-bold shadow-sm cursor-pointer flex items-center gap-2">
                    <span id="btnImport">استيراد Excel</span>
                    <input type="file" id="importFile" class="hidden" accept=".xlsx, .xls">
                </label>
                <button onclick="toggleLanguage()" class="bg-white border border-blue-600 text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50 font-bold">
                    EN / عربي
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md mb-8 border-t-4 border-blue-600">
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div>
                    <label id="labelID" class="block text-sm font-bold mb-1 text-gray-600">الرقم الوظيفي</label>
                    <input id="empId" type="text" placeholder="ID" class="border p-2 rounded w-full outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label id="labelName" class="block text-sm font-bold mb-1 text-gray-600">الاسم الكامل</label>
                    <input id="empName" type="text" placeholder="Full Name" class="border p-2 rounded w-full outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label id="labelDept" class="block text-sm font-bold mb-1 text-gray-600">قسم الإدارة</label>
                    <input id="empDept" type="text" placeholder="Department" class="border p-2 rounded w-full outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label id="labelRole" class="block text-sm font-bold mb-1 text-gray-600">الدور</label>
                    <select id="empRole" class="border p-2 rounded w-full">
                        <option value="Employee" id="optEmp">موظف</option>
                        <option value="Supervisor" id="optSup">مشرف</option>
                    </select>
                </div>
                <div>
                    <label id="labelFrom" class="block text-sm font-bold mb-1 text-gray-600">من تاريخ</label>
                    <input id="dateFrom" type="date" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label id="labelTo" class="block text-sm font-bold mb-1 text-gray-600">إلى تاريخ</label>
                    <input id="dateTo" type="date" class="border p-2 rounded w-full">
                </div>
                <div class="flex items-end lg:col-span-2">
                    <button id="addBtn" class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 font-bold transition shadow-md">إضافة الخطة</button>
                </div>
            </div>
            <p id="errorMsg" class="text-red-500 mt-3 hidden font-bold text-sm"></p>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse" id="mainTable">
                    <thead class="bg-blue-600 text-white">
                        <tr>
                            <th class="p-4" id="thID">الرقم</th>
                            <th class="p-4" id="thName">الاسم</th>
                            <th class="p-4" id="thDept">القسم</th>
                            <th class="p-4" id="thRole">الدور</th>
                            <th class="p-4" id="thFrom">من</th>
                            <th class="p-4" id="thTo">إلى</th>
                            <th class="p-4" id="thAction">الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="vacationTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, where, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ ضع بياناتك هنا
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const vacCollection = collection(db, "vacations");

        // --- الترجمة ---
        let currentLang = 'ar';
        const translations = {
            ar: {
                title: "نظام تخطيط الإجازات السنوية",
                labelID: "الرقم الوظيفي", labelName: "الاسم الكامل", labelDept: "القسم", labelRole: "الدور", labelFrom: "من", labelTo: "إلى",
                addBtn: "إضافة الخطة", btnExport: "تصدير Excel", btnImport: "استيراد Excel",
                thID: "الرقم", thName: "الاسم", thDept: "القسم", thRole: "الدور", thFrom: "من", thTo: "إلى", thAction: "حذف",
                optEmp: "موظف", optSup: "مشرف", delConfirm: "حذف الطلب؟"
            },
            en: {
                title: "Annual Vacation Planner",
                labelID: "Employee ID", labelName: "Full Name", labelDept: "Department", labelRole: "Role", labelFrom: "From", labelTo: "To",
                addBtn: "Add Plan", btnExport: "Export Excel", btnImport: "Import Excel",
                thID: "ID", thName: "Name", thDept: "Dept", thRole: "Role", thFrom: "From", thTo: "To", thAction: "Action",
                optEmp: "Employee", optSup: "Supervisor", delConfirm: "Delete this record?"
            }
        };

        window.toggleLanguage = () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            const t = translations[currentLang];
            document.getElementById('title').innerText = t.title;
            document.getElementById('labelID').innerText = t.labelID;
            document.getElementById('labelName').innerText = t.labelName;
            document.getElementById('labelDept').innerText = t.labelDept;
            document.getElementById('labelRole').innerText = t.labelRole;
            document.getElementById('labelFrom').innerText = t.labelFrom;
            document.getElementById('labelTo').innerText = t.labelTo;
            document.getElementById('addBtn').innerText = t.addBtn;
            document.getElementById('btnExport').innerText = t.btnExport;
            document.getElementById('btnImport').innerText = t.btnImport;
            document.getElementById('thID').innerText = t.thID;
            document.getElementById('thName').innerText = t.thName;
            document.getElementById('thDept').innerText = t.thDept;
            document.getElementById('thRole').innerText = t.thRole;
            document.getElementById('thFrom').innerText = t.thFrom;
            document.getElementById('thTo').innerText = t.thTo;
            document.getElementById('thAction').innerText = t.thAction;
            document.getElementById('optEmp').innerText = t.optEmp;
            document.getElementById('optSup').innerText = t.optSup;
        };

        // --- إضافة بيانات ---
        async function checkAndAdd(data) {
            const startDate = new Date(data.from);
            const key = `${startDate.getMonth() + 1}-${startDate.getFullYear()}`;
            const q = query(vacCollection, where("monthKey", "==", key), where("role", "==", data.role));
            const snap = await getDocs(q);
            
            if (data.role === "Employee" && snap.size >= 1) return {success: false, msg: "تعارض موظفين في شهر " + key};
            if (data.role === "Supervisor" && snap.size >= 2) return {success: false, msg: "تعارض مشرفين في شهر " + key};

            await addDoc(vacCollection, {...data, monthKey: key, createdAt: new Date()});
            return {success: true};
        }

        document.getElementById('addBtn').onclick = async () => {
            const data = {
                empId: document.getElementById('empId').value,
                name: document.getElementById('empName').value,
                dept: document.getElementById('empDept').value,
                role: document.getElementById('empRole').value,
                from: document.getElementById('dateFrom').value,
                to: document.getElementById('dateTo').value
            };
            if(!data.empId || !data.name || !data.from) return alert("أكمل البيانات");
            
            const res = await checkAndAdd(data);
            if(!res.success) showError(res.msg);
            else {
                document.getElementById('errorMsg').classList.add('hidden');
                document.getElementById('empId').value = ""; document.getElementById('empName').value = "";
            }
        };

        // --- تصدير Excel ---
        window.exportToExcel = async () => {
            const snap = await getDocs(vacCollection);
            const data = snap.docs.map(doc => {
                const v = doc.data();
                return { "رقم الموظف": v.empId, "الاسم": v.name, "القسم": v.dept, "الدور": v.role, "من": v.from, "إلى": v.to };
            });
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Vacations");
            XLSX.writeFile(workbook, "Vacation_Plan_2026.xlsx");
        };

        // --- استيراد Excel ---
        document.getElementById('importFile').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (event) => {
                const workbook = XLSX.read(event.target.result, { type: 'binary' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);
                
                for(let row of rows) {
                    // خريطة لتناسب أسماء الأعمدة في الاكسيل
                    await checkAndAdd({
                        empId: row["رقم الموظف"] || row["ID"],
                        name: row["الاسم"] || row["Name"],
                        dept: row["القسم"] || row["Dept"],
                        role: row["الدور"] || row["Role"],
                        from: row["من"] || row["From"],
                        to: row["إلى"] || row["To"]
                    });
                }
                alert("تمت عملية الاستيراد بنجاح");
            };
            reader.readAsBinaryString(file);
        };

        // --- تحديث الجدول ---
        onSnapshot(vacCollection, (snap) => {
            const tbody = document.getElementById('vacationTable');
            tbody.innerHTML = "";
            snap.forEach(docSnap => {
                const v = docSnap.data();
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="p-4">${v.empId}</td>
                        <td class="p-4 font-bold">${v.name}</td>
                        <td class="p-4">${v.dept}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded text-xs ${v.role=='Supervisor'?'bg-purple-100 text-purple-700':'bg-green-100 text-green-700'}">${v.role}</span></td>
                        <td class="p-4">${v.from}</td>
                        <td class="p-4">${v.to}</td>
                        <td class="p-4 text-red-500 cursor-pointer font-bold" onclick="deleteVacation('${docSnap.id}')">X</td>
                    </tr>`;
            });
        });

        window.deleteVacation = async (id) => { if(confirm("Confirm?")) await deleteDoc(doc(db, "vacations", id)); };
        function showError(m) { const e = document.getElementById('errorMsg'); e.innerText = m; e.classList.remove('hidden'); }
    </script>
</body>
</html>
