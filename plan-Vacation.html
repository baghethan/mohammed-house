<div class="bg-white p-6 rounded-xl shadow-md mb-8 border-l-4 border-green-500">
    <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-blue-900" id="sectionEmp">1. Employee Database</h2>
        <div class="flex gap-2">
            <button onclick="exportEmployees()" class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded text-xs font-bold border border-emerald-300 hover:bg-emerald-200 transition">
                Export Employees (Excel)
            </button>
            <label class="bg-orange-100 text-orange-700 px-3 py-1 rounded text-xs font-bold border border-orange-300 hover:bg-orange-200 cursor-pointer transition">
                Import Employees (Excel)
                <input type="file" id="importEmpFile" class="hidden" accept=".xlsx, .xls">
            </label>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <input id="newEmpId" type="text" placeholder="Employee ID" class="border p-2 rounded-lg outline-none focus:ring-2 focus:ring-green-400">
        <input id="newEmpName" type="text" placeholder="Full Name" class="border p-2 rounded-lg outline-none focus:ring-2 focus:ring-green-400">
        <input id="newEmpDept" type="text" placeholder="Department" class="border p-2 rounded-lg outline-none focus:ring-2 focus:ring-green-400">
        <select id="newEmpRole" class="border p-2 rounded-lg bg-gray-50">
            <option value="Employee">Employee</option>
            <option value="Supervisor">Supervisor</option>
            <option value="Manager">Manager</option>
            <option value="Director">Director</option>
        </select>
        <button onclick="addNewEmployee()" class="bg-green-600 text-white font-bold py-2 rounded-lg md:col-span-4 hover:bg-green-700 transition shadow-md">
            Add Employee to Database
        </button>
    </div>
</div>

<script type="module">
    // ... (تأكد من وجود استيراد Firebase و initializeApp في بداية السكريبت كما في الأكواد السابقة)
    
    // --- وظيفة تصدير الموظفين إلى إكسل ---
    window.exportEmployees = async () => {
        try {
            const snap = await getDocs(empCol); // جلب قائمة الموظفين فقط
            const data = snap.docs.map(doc => {
                const e = doc.data();
                return {
                    "Employee ID": e.empId,
                    "Full Name": e.name,
                    "Department": e.dept,
                    "Role": e.role
                };
            });
            
            if (data.length === 0) return alert("No employees found to export!");

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Employees_Database");
            XLSX.writeFile(wb, "Almajdouie_Employees_List.xlsx");
        } catch (error) {
            console.error("Export Error:", error);
        }
    };

    // --- وظيفة استيراد الموظفين من إكسل ---
    document.getElementById('importEmpFile').onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        
        reader.onload = async (event) => {
            try {
                const data = event.target.result;
                const workbook = XLSX.read(data, { type: 'binary' });
                const sheetName = workbook.SheetNames[0];
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

                let addedCount = 0;
                for (const row of rows) {
                    const empData = {
                        empId: String(row["Employee ID"] || row["ID"] || ""),
                        name: row["Full Name"] || row["Name"] || "",
                        dept: row["Department"] || row["Dept"] || "",
                        role: row["Role"] || "Employee"
                    };

                    if (empData.empId && empData.name) {
                        // إضافة الموظف لقاعدة البيانات
                        await addDoc(empCol, empData);
                        addedCount++;
                    }
                }
                alert(`Successfully imported ${addedCount} employees!`);
            } catch (err) {
                console.error("Import Error:", err);
                alert("Error reading Excel file. Check column headers.");
            }
        };
        reader.readAsBinaryString(file);
    };
</script>
