<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almajdouie Vacation System - Master Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f0f4f8; margin: 0; }
        
        /* تصميم البارات الملونة */
        .vacation-bar { 
            height: 26px; border-radius: 6px; position: absolute; z-index: 20; 
            top: 50%; transform: translateY(-50%); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255,255,255,0.4);
            transition: all 0.3s;
        }

        /* الثوابت لضبط المحاذاة */
        :root { --info-w: 650px; --name-w: 280px; --date-w: 125px; --days-w: 120px; }

        .chart-row { display: flex; border-bottom: 1px solid #e2e8f0; height: 65px; align-items: center; background: white; }
        .chart-row:hover { background-color: #f9fbff; }

        .info-cols { display: flex; width: var(--info-w); flex-shrink: 0; border-inline-end: 3px solid #1e3a8a; height: 100%; position: sticky; inset-inline-start: 0; z-index: 40; background: white; }
        
        .col-name { width: var(--name-w); padding: 0 20px; flex-shrink: 0; }
        .col-date { width: var(--date-w); text-align: center; justify-content: center; border-inline-end: 1px solid #f1f5f9; flex-shrink: 0; }
        .col-days { width: var(--days-w); text-align: center; justify-content: center; flex-shrink: 0; }

        .cell { display: flex; align-items: center; height: 100%; font-size: 13px; }
        .name-txt { font-weight: 900; color: #0f172a; font-size: 14px; text-transform: uppercase; }
        .badge-days { background: #dcfce7; color: #166534; font-weight: 900; padding: 4px 12px; border-radius: 10px; font-size: 12px; }

        .timeline-wrapper { flex-grow: 1; overflow-x: auto; background: white; position: relative; }
        .timeline-content { min-width: 1600px; position: relative; height: 100%; }
        
        .month-header-cell { display: flex; align-items: center; justify-content: center; border-inline-end: 1px solid #334155; font-weight: 900; font-size: 12px; }
        .grid-line { border-inline-end: 1px solid #f1f5f9; height: 100%; position: absolute; top: 0; }

        .nav-btn { background: white; color: #1e3a8a; padding: 12px 24px; border-radius: 14px; font-weight: 800; border: 1px solid #e2e8f0; transition: 0.3s; }
        .nav-btn.active { background: #1e3a8a; color: white; box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.3); }
        .section-content { display: none; }
        .section-content.active { display: block; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-[1900px] mx-auto">
        <div id="mainHeader" class="flex justify-between items-center mb-10 bg-white p-6 rounded-3xl shadow-sm border-b-4 border-blue-900">
            <img id="mainLogo" src="https://cafs.org.sa/wp-content/uploads/2023/03/Logo-Almajdouie-Holding-Company.jpg" class="h-14 w-auto">
            <div class="flex gap-3">
                <button onclick="switchTab('employees')" id="btn-employees" class="nav-btn active">Staff Database 👥</button>
                <button onclick="switchTab('leaves')" id="btn-leaves" class="nav-btn">Add Vacations 🗓️</button>
                <button onclick="switchTab('schedule')" id="btn-schedule" class="nav-btn">Schedule Chart 📊</button>
                <button onclick="toggleLanguage()" class="border-2 border-blue-900 text-blue-900 px-6 py-2 rounded-xl font-black ml-4">AR / EN</button>
            </div>
        </div>

        <div id="sec-employees" class="section-content active">
            <div class="bg-white p-8 rounded-3xl shadow-xl border-t-8 border-emerald-500">
                <h2 class="text-2xl font-black mb-6">Staff Registry</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <input id="newEmpId" type="text" placeholder="ID" class="border-2 p-3 rounded-2xl outline-none">
                    <input id="newEmpName" type="text" placeholder="Full Name" class="border-2 p-3 rounded-2xl outline-none">
                    <input id="newEmpDept" type="text" placeholder="Dept" class="border-2 p-3 rounded-2xl outline-none">
                    <select id="newEmpRole" class="border-2 p-3 rounded-2xl bg-gray-50">
                        <option value="Employee">Employee</option>
                        <option value="Supervisor">Supervisor</option>
                        <option value="Manager">Manager</option>
                        <option value="Director">Director</option>
                    </select>
                    <button onclick="addNewEmployee()" class="bg-emerald-600 text-white font-black py-4 rounded-2xl md:col-span-4 shadow-lg hover:bg-emerald-700 transition">+ Register Staff</button>
                </div>
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-xs font-bold uppercase"><tr><th class="p-4">ID</th><th class="p-4">Name</th><th class="p-4 text-center">Action</th></tr></thead>
                    <tbody id="registeredEmpTable"></tbody>
                </table>
            </div>
        </div>

        <div id="sec-leaves" class="section-content">
            <div class="bg-white p-10 rounded-3xl shadow-xl border-t-8 border-blue-900 mb-8">
                <h2 class="text-2xl font-black mb-8">Link Vacation</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <select id="selectEmployee" class="border-2 p-4 rounded-2xl bg-slate-50 font-black"></select>
                    <input id="vacFrom" type="date" class="border-2 p-4 rounded-2xl">
                    <input id="vacTo" type="date" class="border-2 p-4 rounded-2xl">
                    <button id="addVacBtn" onclick="addVacation()" class="bg-blue-900 text-white font-black py-4 rounded-2xl md:col-span-3 shadow-xl">Confirm Vacation</button>
                </div>
            </div>
            <div id="vacList" class="bg-white p-6 rounded-3xl shadow-lg"></div>
        </div>

        <div id="sec-schedule" class="section-content">
            <div class="flex justify-end mb-6">
                <button onclick="copyChartToClipboard()" class="bg-blue-600 text-white px-12 py-4 rounded-2xl font-black shadow-xl hover:bg-blue-700 transition">Copy for Outlook 📸</button>
            </div>
            
            <div id="captureArea" class="bg-white rounded-[40px] shadow-2xl overflow-hidden border p-10">
                <div id="reportHeader" class="flex justify-between items-center mb-10 pb-8 border-b-4 border-slate-100">
                    <img src="https://cafs.org.sa/wp-content/uploads/2023/03/Logo-Almajdouie-Holding-Company.jpg" class="h-28 w-auto">
                    <div class="text-end" id="brandingText">
                        <h2 class="text-4xl font-black text-slate-800 uppercase tracking-tighter">Annual Vacation Schedule - 2026</h2>
                        <p class="text-slate-400 font-bold tracking-widest">Almajdouie Motors - Official Records</p>
                    </div>
                </div>

                <div class="timeline-wrapper">
                    <div class="timeline-content">
                        <div class="flex bg-slate-900 text-white font-black uppercase tracking-widest rounded-t-2xl">
                            <div class="info-cols bg-slate-900 border-r border-slate-700">
                                <div class="col-name cell border-r border-slate-700 text-center justify-center">Employee / Role</div>
                                <div class="col-date cell border-r border-slate-700">Latest Start</div>
                                <div class="col-date cell border-r border-slate-700">Latest End</div>
                                <div class="col-days cell">Total Days</div>
                            </div>
                            <div id="monthsContainer" class="flex-grow flex"></div>
                        </div>
                        <div id="ganttContainer" class="border border-t-0 border-slate-100 rounded-b-2xl"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
            authDomain: "baghethan-ba325.firebaseapp.com",
            projectId: "baghethan-ba325",
            storageBucket: "baghethan-ba325.firebasestorage.app",
            messagingSenderId: "944819735112",
            appId: "1:944819735112:web:07315600da39377320667d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const empCol = collection(db, "employees");
        const vacCol = collection(db, "vacations");

        const months = [
            { en: "Jan", ar: "يناير", days: 31 }, { en: "Feb", ar: "فبراير", days: 28 },
            { en: "Mar", ar: "مارس", days: 31 }, { en: "Apr", ar: "أبريل", days: 30 },
            { en: "May", ar: "مايو", days: 31 }, { en: "Jun", ar: "يونيو", days: 30 },
            { en: "Jul", ar: "يوليو", days: 31 }, { en: "Aug", ar: "أغسطس", days: 31 },
            { en: "Sep", ar: "سبتمبر", days: 30 }, { en: "Oct", ar: "أكتوبر", days: 31 },
            { en: "Nov", ar: "نوفمبر", days: 30 }, { en: "Dec", ar: "ديسمبر", days: 31 }
        ];

        let allEmployees = [];
        let allVacations = [];
        let currentLang = 'en';

        // تصدير الدوال للعالم الخارجي لتعمل onclick
        window.switchTab = (t) => {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sec-${t}`).classList.add('active');
            document.getElementById(`btn-${t}`).classList.add('active');
        };

        window.toggleLanguage = () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            const h1 = document.getElementById('mainHeader');
            const h2 = document.getElementById('reportHeader');
            [h1, h2].forEach(h => h.style.flexDirection = currentLang === 'ar' ? 'row-reverse' : 'row');
            renderMonths();
            renderGantt();
        };

        const renderMonths = () => {
            const container = document.getElementById('monthsContainer');
            container.innerHTML = months.map(m => {
                const width = (m.days / 365) * 100;
                return `<div class="month-header-cell" style="width: ${width}%">${currentLang === 'ar' ? m.ar : m.en}</div>`;
            }).join('');
        };
        renderMonths();

        window.copyChartToClipboard = () => {
            html2canvas(document.getElementById('captureArea'), { scale: 3, useCORS: true }).then(canvas => {
                canvas.toBlob(blob => {
                    navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(() => alert("Copied! ✅"));
                });
            });
        };

        window.deleteData = async (c, id) => { 
            if(confirm("Confirm Delete?")) await deleteDoc(doc(db, c, id));
        };

        // مزامنة الموظفين
        onSnapshot(empCol, (snap) => {
            const select = document.getElementById('selectEmployee');
            const table = document.getElementById('registeredEmpTable');
            select.innerHTML = '<option value="">-- Choose Staff --</option>';
            table.innerHTML = "";
            allEmployees = [];
            snap.forEach(d => {
                const e = d.data();
                allEmployees.push({ ...e, fireId: d.id });
                let opt = document.createElement('option');
                opt.value = e.empId; opt.textContent = e.name;
                select.appendChild(opt);
                table.innerHTML += `<tr class="border-b"><td class="p-4 font-bold text-slate-400 text-xs">${e.empId}</td><td class="p-4 font-bold text-slate-800">${e.name}</td><td class="p-4 text-center"><button class="text-red-500 font-bold text-xs" onclick="deleteData('employees', '${d.id}')">Remove</button></td></tr>`;
            });
            renderGantt();
        });

        // مزامنة الإجازات
        onSnapshot(vacCol, (snap) => {
            allVacations = [];
            const list = document.getElementById('vacList');
            list.innerHTML = "";
            snap.forEach(d => {
                const v = d.data();
                allVacations.push({ ...v, id: d.id });
                list.innerHTML += `<div class="flex justify-between items-center p-3 border-b text-sm">
                    <span><b>${v.name}</b> (${v.from} to ${v.to})</span>
                    <button class="text-red-500 font-bold" onclick="deleteData('vacations', '${d.id}')">Delete</button>
                </div>`;
            });
            renderGantt();
        });

        // ✅ رسم الشارت الاحترافي (تجميع الموظفين)
        const renderGantt = () => {
            const container = document.getElementById('ganttContainer');
            container.innerHTML = "";
            const colors = ["#3b82f6", "#8b5cf6", "#10b981", "#f59e0b", "#ef4444", "#06b6d4"];

            allEmployees.sort((a,b) => a.name.localeCompare(b.name)).forEach(emp => {
                const empVacations = allVacations.filter(v => v.empId === emp.empId);
                if(empVacations.length === 0) return;

                const totalDays = empVacations.reduce((acc, v) => acc + ((new Date(v.to) - new Date(v.from))/(1000*3600*24) + 1), 0);
                const latest = empVacations.sort((a,b) => new Date(b.from) - new Date(a.from))[0];

                const row = document.createElement('div');
                row.className = "chart-row";
                row.innerHTML = `
                    <div class="info-cols bg-white">
                        <div class="col-name cell border-r border-slate-100"><div class="flex flex-col"><span class="name-txt uppercase">${emp.name}</span><span class="text-[9px] text-slate-400 font-bold uppercase tracking-tighter">${emp.role}</span></div></div>
                        <div class="col-date cell border-r border-slate-100 justify-center"><span class="font-bold text-gray-500">${latest.from}</span></div>
                        <div class="col-date cell border-r border-slate-100 justify-center"><span class="font-bold text-gray-500">${latest.to}</span></div>
                        <div class="col-days cell justify-center"><span class="badge-days">${Math.round(totalDays)}D</span></div>
                    </div>
                    <div class="timeline-cell relative h-full flex-grow">
                        <div class="absolute inset-0
