<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation System - Export to Outlook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .vacation-bar { height: 24px; border-radius: 4px; position: absolute; z-index: 20; top: 50%; transform: translateY(-50%); }
        .grid-line { border-right: 1px solid #e2e8f0; height: 100%; position: absolute; top: 0; }
        .nav-btn { background: white; color: #1e3a8a; padding: 10px 20px; border-radius: 10px; font-weight: bold; border: 1px solid #e2e8f0; transition: 0.2s; }
        .nav-btn.active { background: #1e3a8a; color: white; border-color: #1e3a8a; }
        .section-content { display: none; }
        .section-content.active { display: block; }
        .chart-row { display: flex; border-bottom: 1px solid #e2e8f0; height: 50px; align-items: center; background: white; }
        .info-cols { display: flex; width: 620px; flex-shrink: 0; border-right: 2px solid #cbd5e1; height: 100%; background: white; position: sticky; left: 0; z-index: 30; }
        .col-name { width: 260px; padding: 0 15px; flex-shrink: 0; }
        .col-date { width: 120px; padding: 0 10px; flex-shrink: 0; text-align: center; }
        .col-days { width: 120px; padding: 0 10px; flex-shrink: 0; text-align: center; }
        .cell { display: flex; align-items: center; height: 100%; border-right: 1px solid #f1f5f9; font-size: 12px; }
        .timeline-cell { flex-grow: 1; position: relative; height: 100%; background: #ffffff; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-[1600px] mx-auto">
        <div class="flex justify-between items-center mb-6 bg-white p-5 rounded-2xl shadow-sm border-b-4 border-blue-900">
            <img src="https://cafs.org.sa/wp-content/uploads/2023/03/Logo-Almajdouie-Holding-Company.jpg" alt="Logo" class="h-10 w-auto">
            <div class="flex gap-2">
                <button onclick="switchTab('employees')" id="btn-employees" class="nav-btn active">Staff 👥</button>
                <button onclick="switchTab('leaves')" id="btn-leaves" class="nav-btn">Vacations 🗓️</button>
                <button onclick="switchTab('schedule')" id="btn-schedule" class="nav-btn">Schedule View 📊</button>
            </div>
        </div>

        <div id="sec-employees" class="section-content active">
            <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-green-600">
                <h2 class="text-xl font-bold mb-4">Staff Database</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <input id="newEmpId" type="text" placeholder="ID" class="border p-2 rounded">
                    <input id="newEmpName" type="text" placeholder="Name" class="border p-2 rounded">
                    <input id="newEmpDept" type="text" placeholder="Dept" class="border p-2 rounded">
                    <select id="newEmpRole" class="border p-2 rounded">
                        <option value="Employee">Employee</option>
                        <option value="Supervisor">Supervisor</option>
                        <option value="Manager">Manager</option>
                    </select>
                    <button onclick="addNewEmployee()" class="bg-green-600 text-white p-2 rounded md:col-span-4">Add Staff</button>
                </div>
                <table class="w-full text-left text-sm border">
                    <tbody id="registeredEmpTable"></tbody>
                </table>
            </div>
        </div>

        <div id="sec-leaves" class="section-content">
            <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-blue-800">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Vacation Data</h2>
                    <button onclick="exportVacationsToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-sm">Download Table for Excel</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <select id="selectEmployee" class="border p-3 rounded bg-blue-50"></select>
                    <input id="vacFrom" type="date" class="border p-3 rounded">
                    <input id="vacTo" type="date" class="border p-3 rounded">
                    <button id="addVacBtn" class="bg-blue-800 text-white p-3 rounded md:col-span-3">Add Vacation</button>
                </div>
                <table class="w-full text-left text-sm border" id="vacTable">
                    <thead class="bg-blue-900 text-white">
                        <tr><th class="p-3">ID</th><th class="p-3">Name</th><th class="p-3">From</th><th class="p-3">To</th><th class="p-3">Days</th><th class="p-3">Action</th></tr>
                    </thead>
                    <tbody id="vacationTable"></tbody>
                </table>
            </div>
        </div>

        <div id="sec-schedule" class="section-content">
            <div class="flex justify-end mb-4 gap-2">
                <button onclick="copyChartToClipboard()" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold shadow-lg hover:bg-blue-700">Copy Chart for Outlook (Image) 📸</button>
                <button onclick="downloadChartAsImage()" class="bg-slate-700 text-white px-5 py-2 rounded-xl font-bold shadow-lg">Download as PNG</button>
            </div>
            
            <div id="captureArea" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 p-2">
                <div class="flex bg-blue-900 text-white font-bold text-[10px] uppercase">
                    <div class="info-cols bg-blue-900">
                        <div class="col-name cell border-blue-800 text-center justify-center">Employee / Role</div>
                        <div class="col-date cell border-blue-800 text-center justify-center">Start Date</div>
                        <div class="col-date cell border-blue-800 text-center justify-center">End Date</div>
                        <div class="col-days cell border-blue-800 text-center justify-center">Days</div>
                    </div>
                    <div class="flex-grow grid grid-cols-12 text-center items-center">
                        ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map(m => `<div class="border-r border-blue-800 py-4">${m}</div>`).join('')}
                    </div>
                </div>
                <div id="ganttContainer" class="min-h-[400px]"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
            authDomain: "baghethan-ba325.firebaseapp.com",
            projectId: "baghethan-ba325",
            storageBucket: "baghethan-ba325.firebasestorage.app",
            messagingSenderId: "944819735112",
            appId: "1:944819735112:web:07315600da39377320667d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const empCol = collection(db, "employees");
        const vacCol = collection(db, "vacations");

        let allEmployees = [];

        window.switchTab = (t) => {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sec-${t}`).classList.add('active');
            document.getElementById(`btn-${t}`).classList.add('active');
        };

        // دالة التقاط الشارت ونسخه كصورة لـ Outlook
        window.copyChartToClipboard = () => {
            const area = document.getElementById('captureArea');
            html2canvas(area, { scale: 2 }).then(canvas => {
                canvas.toBlob(blob => {
                    const item = new ClipboardItem({ "image/png": blob });
                    navigator.clipboard.write([item]).then(() => {
                        alert("تم نسخ المخطط كصورة! ✅\nالآن اذهب إلى Outlook واضغط Ctrl+V (لصق).");
                    });
                });
            });
        };

        window.downloadChartAsImage = () => {
            const area = document.getElementById('captureArea');
            html2canvas(area, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Almajdouie_Vacation_Chart.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        };

        const getWorkDays = (s, e) => {
            let count = 0, cur = new Date(s), stop = new Date(e);
            while (cur <= stop) {
                if (cur.getDay() !== 5 && cur.getDay() !== 6) count++;
                cur.setDate(cur.getDate() + 1);
            }
            return count;
        };

        onSnapshot(empCol, (snap) => {
            const select = document.getElementById('selectEmployee');
            const table = document.getElementById('registeredEmpTable');
            select.innerHTML = '<option value="">-- Choose Staff --</option>';
            table.innerHTML = "";
            snap.forEach(d => {
                const e = d.data();
                allEmployees.push({ ...e, fireId: d.id });
                select.innerHTML += `<option value="${e.empId}">${e.name}</option>`;
                table.innerHTML += `<tr class="border-b"><td class="p-2">${e.empId}</td><td class="p-2 font-bold">${e.name}</td><td class="p-2 text-xs">${e.role}</td><td class="p-2"><button onclick="deleteData('employees', '${d.id}')" class="text-red-500">Delete</button></td></tr>`;
            });
        });

        onSnapshot(vacCol, (snap) => {
            const tbody = document.getElementById('vacationTable');
            const gantt = document.getElementById('ganttContainer');
            tbody.innerHTML = ""; gantt.innerHTML = "";
            const colors = { employee: "#3b82f6", supervisor: "#8b5cf6", manager: "#10b981", director: "#f59e0b" };
            let vData = [];
            snap.forEach(d => vData.push({ ...d.data(), id: d.id }));
            vData.sort((a, b) => a.name.localeCompare(b.name));

            vData.forEach(v => {
                const days = getWorkDays(v.from, v.to);
                tbody.innerHTML += `<tr class="border-b"><td>${v.empId}</td><td class="font-bold">${v.name}</td><td>${v.from}</td><td>${v.to}</td><td class="text-blue-600 font-bold">${days}</td><td><button onclick="deleteData('vacations', '${v.id}')">X</button></td></tr>`;
                
                const startP = (new Date(v.from) - new Date(2026,0,1)) / (1000*3600*24*365) * 100;
                const endP = (new Date(v.to) - new Date(2026,0,1)) / (1000*3600*24*365) * 100;
                const width = Math.max(endP - startP, 1.2);

                const row = document.createElement('div');
                row.className = "chart-row";
                row.innerHTML = `
                    <div class="info-cols">
                        <div class="col-name cell border-r font-bold text-blue-900">${v.name}</div>
                        <div class="col-date cell border-r justify-center font-semibold text-gray-500">${v.from}</div>
                        <div class="col-date cell border-r justify-center font-semibold text-gray-500">${v.to}</div>
                        <div class="col-days cell justify-center font-black text-blue-600">${days}d</div>
                    </div>
                    <div class="timeline-cell">
                        <div class="absolute inset-0 grid grid-cols-12 pointer-events-none">
                            ${Array(12).fill('<div class="grid-line"></div>').join('')}
                        </div>
                        <div class="vacation-bar" style="left:${startP}%; width:${width}%; background-color:${colors[String(v.role).toLowerCase()] || '#64748b'}"></div>
                    </div>
                `;
                gantt.appendChild(row);
            });
        });

        window.addNewEmployee = async () => {
            const id = document.getElementById('newEmpId').value;
            const name = document.getElementById('newEmpName').value;
            await addDoc(empCol, { empId: id, name, dept: document.getElementById('newEmpDept').value, role: document.getElementById('newEmpRole').value });
            alert("Added!");
        };

        document.getElementById('addVacBtn').onclick = async () => {
            const empId = document.getElementById('selectEmployee').value;
            const from = document.getElementById('vacFrom').value;
            const to = document.getElementById('vacTo').value;
            const emp = allEmployees.find(e => e.empId == empId);
            await addDoc(vacCol, { ...emp, from, to });
            alert("Vacation Linked!");
        };

        window.deleteData = async (c, id) => { if(confirm("Delete?")) await deleteDoc(doc(db, c, id)); };

        window.exportVacationsToExcel = async () => {
            const snap = await getDocs(vacCol);
            const data = snap.docs.map(d => ({
                ID: d.data().empId,
                Name: d.data().name,
                Start: d.data().from,
                End: d.data().to,
                WorkDays: getWorkDays(d.data().from, d.data().to)
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Vacations");
            XLSX.writeFile(wb, "Vacation_Data.xlsx");
        };
    </script>
</body>
</html>
