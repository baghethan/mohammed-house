<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee & Vacation Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        /* تصميم مخصص للبار والخلفية */
        .bg-custom { 
            background-image: url('https://i.ibb.co/vzYpXfN/almajdouie-logo.png'); 
            background-size: cover; background-position: center; 
            background-color: rgba(255, 255, 255, 0.95); background-blend-mode: overlay; 
        }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-10">

    <div class="max-w-7xl mx-auto">
        
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-l-8 border-green-600">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-2xl font-bold text-blue-900">1. Employee Database</h2>
                
                <div class="flex flex-wrap gap-2">
                    <button onclick="exportEmployees()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-emerald-700 shadow-md transition">
                        Export Employees
                    </button>
                    
                    <label class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-orange-600 cursor-pointer shadow-md transition">
                        Import From Excel
                        <input type="file" id="importEmpFile" class="hidden" accept=".xlsx, .xls">
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input id="newEmpId" type="text" placeholder="Employee ID" class="border-2 p-3 rounded-lg outline-none focus:border-green-500 transition">
                <input id="newEmpName" type="text" placeholder="Full Name" class="border-2 p-3 rounded-lg outline-none focus:border-green-500 transition">
                <input id="newEmpDept" type="text" placeholder="Department" class="border-2 p-3 rounded-lg outline-none focus:border-green-500 transition">
                <select id="newEmpRole" class="border-2 p-3 rounded-lg bg-gray-50 outline-none">
                    <option value="Employee">Employee</option>
                    <option value="Supervisor">Supervisor</option>
                    <option value="Manager">Manager</option>
                    <option value="Director">Director</option>
                </select>
                <button onclick="addNewEmployee()" class="bg-green-600 text-white font-bold py-3 rounded-lg md:col-span-4 hover:bg-green-700 shadow-lg transform active:scale-95 transition">
                    + Add Employee to Database
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-l-8 border-blue-800">
            <h2 class="text-2xl font-bold text-blue-900 mb-6">2. Vacation Planner (Linked)</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Select Registered Employee</label>
                    <select id="selectEmployee" class="border-2 p-3 rounded-lg w-full bg-blue-50 font-bold outline-none focus:border-blue-800">
                        <option value="">-- Choose from Database --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Vacation Starts</label>
                    <input id="vacFrom" type="date" class="border-2 p-3 rounded-lg w-full outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Vacation Ends</label>
                    <input id="vacTo" type="date" class="border-2 p-3 rounded-lg w-full outline-none">
                </div>
                <button id="addVacBtn" class="bg-blue-800 text-white font-bold py-3 rounded-lg md:col-span-3 hover:bg-blue-900 shadow-lg transition">
                    Submit Linked Vacation Plan
                </button>
            </div>
        </div>

        <div class="text-center text-gray-400 py-10">
            Timeline and Vacation Table will appear here based on your database...
        </div>

    </div>

    <script type="module">
        // تأكد من إضافة بيانات Firebase الخاصة بك هنا لكي تعمل الأزرار
        console.log("System Ready...");
    </script>

</body>
</html>
