<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><title>Weekly Schedule</title>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--morning-bg:#e0f2fe;--morning-t:#0369a1;--night-bg:#f3e8ff;--night-t:#7e22ce;--off-bg:#f1f5f9;--off-t:#475569}
    body{margin:0;padding:20px;font-family:sans-serif;background:transparent}
    .badge{border-radius:999px;padding:8px 16px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:6px;width:120px;justify-content:center;cursor:pointer;border:1px solid rgba(0,0,0,0.03)}
    .Morning{background:var(--morning-bg);color:var(--morning-t)} .Night{background:var(--night-bg);color:var(--night-t)} .Off{background:var(--off-bg);color:var(--off-t)}
    table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.05)}
    thead th{background:#f8fafc;color:var(--primary);padding:15px;border-bottom:1px solid #eee}
    td{padding:12px;text-align:center;border-bottom:1px solid #f9f9f9}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:99}
    .dialog{background:#fff;padding:25px;border-radius:20px;width:400px;text-align:center}
  </style>
</head>
<body>
    <div style="display:flex;justify-content:space-between;margin-bottom:15px">
        <input type="date" id="datePicker" style="padding:10px;border-radius:10px;border:1px solid #ddd">
        <div id="rangeLabel" style="font-weight:bold;color:var(--primary)"></div>
    </div>
    <table><thead id="h"></thead><tbody id="b"></tbody></table>

    <div class="overlay" id="ov"><div class="dialog">
        <h3 id="targetName"></h3>
        <div id="opts" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"></div>
        <button onclick="save()" style="margin-top:20px;padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:10px">حفظ</button>
        <button onclick="closeOv()" style="margin-top:20px;padding:10px 20px;background:#eee;border:none;border-radius:10px">إغلاق</button>
    </div></div>

<script type="module">
import { db, waitForSignedInUser, logFirebaseError } from './firebase-session.js';
import { doc, onSnapshot, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

let emps=[], selTarget=null, selOpt=null;
const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

window.openOv = (id, d, n) => {
    selTarget={id,d,n}; document.getElementById('targetName').innerText = n + ' - ' + d;
    document.getElementById('opts').innerHTML = ['Morning','Night','Off','OnCall'].map(s=>`<div class="badge ${s}" onclick="window.sel('${s}')" id="p_${s}">${s}</div>`).join('');
    document.getElementById('ov').style.display='flex';
}
window.sel = (s) => { selOpt=s; document.querySelectorAll('#opts .badge').forEach(b=>b.style.border='none'); document.getElementById('p_'+s).style.border='2px solid blue'; }
window.save = async () => { if(!selOpt) return; await waitForSignedInUser(); const mo = (await getDoc(doc(db,'schedule','manual_overrides'))).data() || {}; mo[`${selTarget.id}_${selTarget.d}`]=selOpt; await setDoc(doc(db,'schedule','manual_overrides'), mo); closeOv(); }
window.closeOv = () => document.getElementById('ov').style.display='none';

async function draw(){
    const picker = document.getElementById('datePicker');
    if(!picker.value) return;
    const start = new Date(picker.value.replace(/-/g,'/'));
    let h = '<th>الموظف</th>';
    for(let i=0;i<7;i++){ const d=new Date(start.getTime()+i*86400000); h+=`<th>${days[i]}<br><small>${d.toLocaleDateString('en-GB')}</small></th>`; }
    document.getElementById('h').innerHTML = h;
    const mo = (await getDoc(doc(db,'schedule','manual_overrides'))).data() || {};
    document.getElementById('b').innerHTML = emps.filter(e=>e.active).map(e => {
        let r = `<td style="font-weight:bold;text-align:right">${e.name}</td>`;
        for(let i=0;i<7;i++){
            const dStr = new Date(start.getTime()+i*86400000).toISOString().split('T')[0];
            const s = mo[`${e.id}_${dStr}`] || (i>=5?'Off':(e.fixed?'Night':'Morning'));
            r += `<td><span class="badge ${s}" onclick="window.openOv('${e.id}','${dStr}','${e.name}')">${s}</span></td>`;
        }
        return `<tr>${r}</tr>`;
    }).join('');
}

document.getElementById('datePicker').addEventListener('change', () => draw().catch(e => logFirebaseError('Plan vacation draw failed', e)));

async function bindSnapshots() {
    await waitForSignedInUser();
    onSnapshot(doc(db,'schedule','jadwal_v6'), s => { emps = s.data()?.data?.emps || []; draw().catch(e => logFirebaseError('Plan vacation draw failed', e)); }, e => logFirebaseError('Plan vacation employees listener failed', e));
    onSnapshot(doc(db,'schedule','manual_overrides'), () => draw().catch(e => logFirebaseError('Plan vacation draw failed', e)), e => logFirebaseError('Plan vacation overrides listener failed', e));
}

window.onload = () => {
    const d=new Date(); d.setDate(d.getDate()-d.getDay());
    document.getElementById('datePicker').value=d.toISOString().split('T')[0];
    bindSnapshots().catch(e => logFirebaseError('Plan vacation startup failed', e));
};
</script>
</body>
</html>
