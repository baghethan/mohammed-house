<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacation Planner - نظام الإجازات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; transition: all 0.3s ease; }
        .ltr { direction: ltr; }
        .rtl { direction: rtl; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 id="title" class="text-2xl md:text-3xl font-bold text-blue-800">نظام تخطيط الإجازات السنوية</h1>
            <button onclick="toggleLanguage()" class="bg-white border border-blue-600 text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50 font-bold">
                English / عربي
            </button>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-t-4 border-blue-600">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <div>
                    <label id="labelName" class="block text-sm font-bold mb-1 text-gray-600">اسم الموظف</label>
                    <input id="empName" type="text" placeholder="Name" class="border p-2 rounded w-full outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label id="labelRole" class="block text-sm font-bold mb-1 text-gray-600">الدور</label>
                    <select id="empRole" class="border p-2 rounded w-full">
                        <option value="Employee" id="optEmp">موظف</option>
                        <option value="Supervisor" id="optSup">مشرف</option>
                    </select>
                </div>
                <div>
                    <label id="labelFrom" class="block text-sm font-bold mb-1 text-gray-600">من تاريخ</label>
                    <input id="dateFrom" type="date" class="border p-2 rounded w-full">
                </div>
                <div>
                    <label id="labelTo" class="block text-sm font-bold mb-1 text-gray-600">إلى تاريخ</label>
                    <input id="dateTo" type="date" class="border p-2 rounded w-full">
                </div>
                <div class="flex items-end">
                    <button id="addBtn" class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 font-bold transition shadow-md">إضافة</button>
                </div>
            </div>
            <p id="errorMsg" class="text-red-500 mt-3 hidden font-bold text-sm"></p>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse" id="mainTable">
                    <thead>
                        <tr class="bg-blue-600 text-white">
                            <th class="p-4" id="thName">الموظف</th>
                            <th class="p-4" id="thRole">الدور</th>
                            <th class="p-4" id="thFrom">من</th>
                            <th class="p-4" id="thTo">إلى</th>
                            <th class="p-4" id="thAction">الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="vacationTable">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, where, getDocs } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ استبدل البيانات ببيانات مشروعك
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const vacCollection = collection(db, "vacations");

        // --- نظام اللغات ---
        let currentLang = 'ar';
        const translations = {
            ar: {
                title: "نظام تخطيط الإجازات السنوية",
                labelName: "اسم الموظف",
                labelRole: "الدور",
                labelFrom: "من تاريخ",
                labelTo: "إلى تاريخ",
                addBtn: "إضافة الخطة",
                thName: "الموظف",
                thRole: "الدور",
                thFrom: "من",
                thTo: "إلى",
                thAction: "الإجراء",
                optEmp: "موظف",
                optSup: "مشرف",
                errConflictEmp: "⚠️ تعارض: مسموح بموظف واحد فقط في هذا الشهر!",
                errConflictSup: "⚠️ تعارض: مسموح بحد أقصى مشرفين اثنين في هذا الشهر!",
                errDates: "يرجى اختيار التواريخ بشكل صحيح",
                delConfirm: "هل أنت متأكد من الحذف؟",
                btnDel: "حذف"
            },
            en: {
                title: "Annual Vacation Planner",
                labelName: "Employee Name",
                labelRole: "Role",
                labelFrom: "From Date",
                labelTo: "To Date",
                addBtn: "Add Plan",
                thName: "Employee",
                thRole: "Role",
                thFrom: "From",
                thTo: "To",
                thAction: "Action",
                optEmp: "Employee",
                optSup: "Supervisor",
                errConflictEmp: "⚠️ Conflict: Only 1 employee allowed per month!",
                errConflictSup: "⚠️ Conflict: Max 2 supervisors allowed per month!",
                errDates: "Please select valid dates",
                delConfirm: "Are you sure you want to delete?",
                btnDel: "Delete"
            }
        };

        window.toggleLanguage = () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('mainTable').className = currentLang === 'ar' ? 'w-full text-right border-collapse' : 'w-full text-left border-collapse';
            
            // تحديث النصوص
            const t = translations[currentLang];
            document.getElementById('title').innerText = t.title;
            document.getElementById('labelName').innerText = t.labelName;
            document.getElementById('labelRole').innerText = t.labelRole;
            document.getElementById('labelFrom').innerText = t.labelFrom;
            document.getElementById('labelTo').innerText = t.labelTo;
            document.getElementById('addBtn').innerText = t.addBtn;
            document.getElementById('thName').innerText = t.thName;
            document.getElementById('thRole').innerText = t.thRole;
            document.getElementById('thFrom').innerText = t.thFrom;
            document.getElementById('thTo').innerText = t.thTo;
            document.getElementById('thAction').innerText = t.thAction;
            document.getElementById('optEmp').innerText = t.optEmp;
            document.getElementById('optSup').innerText = t.optSup;
        };

        // --- وظيفة الإضافة ---
        async function addVacation() {
            const name = document.getElementById('empName').value;
            const role = document.getElementById('empRole').value;
            const from = document.getElementById('dateFrom').value;
            const to = document.getElementById('dateTo').value;
            const t = translations[currentLang];

            if (!name || !from || !to) { alert(t.errDates); return; }

            // استخراج الشهر والسنة من تاريخ البداية للفحص
            const startDate = new Date(from);
            const monthYearKey = `${startDate.getMonth() + 1}-${startDate.getFullYear()}`;

            const q = query(vacCollection, where("monthKey", "==", monthYearKey), where("role", "==", role));
            const querySnapshot = await getDocs(q);
            const count = querySnapshot.size;

            if (role === "Employee" && count >= 1) { showError(t.errConflictEmp); return; }
            if (role === "Supervisor" && count >= 2) { showError(t.errConflictSup); return; }

            await addDoc(vacCollection, {
                name, role, from, to, monthKey: monthYearKey, createdAt: new Date()
            });

            document.getElementById('empName').value = "";
            document.getElementById('errorMsg').classList.add('hidden');
        }

        // --- التحديث الحي للجدول ---
        onSnapshot(vacCollection, (snapshot) => {
            const tableBody = document.getElementById('vacationTable');
            tableBody.innerHTML = "";
            const t = translations[currentLang];

            snapshot.forEach((docSnap) => {
                const v = docSnap.data();
                const id = docSnap.id;
                const roleDisplay = v.role === "Supervisor" ? t.optSup : t.optEmp;
                
                const row = `
                    <tr class="border-b hover:bg-gray-50 transition">
                        <td class="p-4 font-medium">${v.name}</td>
                        <td class="p-4"><span class="${v.role === 'Supervisor' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'} px-2 py-1 rounded text-xs font-bold">${roleDisplay}</span></td>
                        <td class="p-4 text-gray-600">${v.from}</td>
                        <td class="p-4 text-gray-600">${v.to}</td>
                        <td class="p-4">
                            <button onclick="deleteVacation('${id}')" class="text-red-500 hover:text-red-700 font-bold">${t.btnDel}</button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        });

        window.deleteVacation = async (id) => {
            if(confirm(translations[currentLang].delConfirm)) {
                await deleteDoc(doc(db, "vacations", id));
            }
        };

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }

        document.getElementById('addBtn').addEventListener('click', addVacation);
    </script>
</body>
</html>
