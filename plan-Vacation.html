<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, where } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 1. ⚠️ ضع بيانات Firebase الخاصة بك هنا (مهم جداً)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const empCol = collection(db, "employees");
    const vacCol = collection(db, "vacations");

    let allEmployees = []; // لتخزين الموظفين محلياً وتحديث القائمة

    // --- وظيفة: إضافة موظف جديد للقاعدة ---
    window.addNewEmployee = async () => {
        const id = document.getElementById('newEmpId').value;
        const name = document.getElementById('newEmpName').value;
        const dept = document.getElementById('newEmpDept').value;
        const role = document.getElementById('newEmpRole').value;

        if (!id || !name) return alert("الرجاء إدخال الرقم الوظيفي والاسم!");

        try {
            await addDoc(empCol, { empId: id, name: name, dept: dept, role: role });
            alert("تم إضافة الموظف لقاعدة البيانات بنجاح ✅");
            // مسح الحقول بعد الإضافة
            document.getElementById('newEmpId').value = "";
            document.getElementById('newEmpName').value = "";
            document.getElementById('newEmpDept').value = "";
        } catch (e) {
            console.error("Error adding employee: ", e);
        }
    };

    // --- وظيفة: تحديث القائمة المنسدلة تلقائياً (Dropdown) ---
    onSnapshot(empCol, (snap) => {
        const select = document.getElementById('selectEmployee');
        select.innerHTML = '<option value="">-- Choose from Database --</option>';
        allEmployees = [];

        snap.forEach(doc => {
            const emp = doc.data();
            allEmployees.push(emp);
            // إضافة الاسم للقائمة المنسدلة
            const option = document.createElement('option');
            option.value = emp.empId;
            option.innerText = `${emp.name} (${emp.empId})`;
            select.appendChild(option);
        });
        console.log("Database updated: ", allEmployees.length, " employees found.");
    });

    // --- وظيفة: تصدير الموظفين إلى إكسل (Fixed) ---
    window.exportEmployees = async () => {
        const snap = await getDocs(empCol);
        const data = snap.docs.map(doc => doc.data());
        
        if (data.length === 0) return alert("لا يوجد موظفين لتصديرهم!");

        const worksheet = XLSX.utils.json_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Employees");
        XLSX.writeFile(workbook, "Employee_Database.xlsx");
    };

    // --- وظيفة: إضافة خطة إجازة مرتبطة بالموظف المختار ---
    document.getElementById('addVacBtn').onclick = async () => {
        const empId = document.getElementById('selectEmployee').value;
        const from = document.getElementById('vacFrom').value;
        const to = document.getElementById('vacTo').value;

        if (!empId || !from || !to) return alert("يرجى اختيار الموظف والتواريخ!");

        // العثور على بيانات الموظف من القائمة التي جلبناها
        const empData = allEmployees.find(e => e.empId === empId);

        try {
            // إضافة الإجازة مع بيانات الموظف كاملة
            const start = new Date(from);
            const key = `${start.getMonth() + 1}-${start.getFullYear()}`;

            await addDoc(vacCol, {
                ...empData,
                from: from,
                to: to,
                monthKey: key,
                createdAt: new Date()
            });

            alert(`تم ربط إجازة الموظف ${empData.name} بنجاح ✅`);
        } catch (e) {
            alert("حدث خطأ أثناء الربط!");
        }
    };
</script>
