<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vacation Plan - Almajdouie Motors</title>
  <style>
    :root{
      --primary:#0d2149;
      --primary2:#1b4fa3;
      --text:#1f2937;
      --muted:#64748b;
      --surface:rgba(255,255,255,.94);
      --surface2:#fff;
      --shadow:0 18px 50px rgba(13,33,73,.16);
      --danger:#d32f2f;
      --ok-bg:#ecfdf5;
      --ok-t:#166534;
      --warn-bg:#fff7ed;
      --warn-t:#9a3412;
      --cancel-bg:#fef2f2;
      --cancel-t:#b91c1c;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:20px;
      font-family:'Segoe UI',Tahoma,sans-serif;
      background:linear-gradient(180deg, rgba(12,31,73,.1), rgba(255,255,255,.2)), url('image_dba186.png') center/cover fixed no-repeat;
      min-height:100vh;
      color:var(--text);
      display:flex;
      justify-content:center;
    }
    .shell{width:100%;max-width:1120px}
    .glass{
      width:100%;
      background:var(--surface);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.45);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
      padding:30px;
    }
    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
      border-bottom:2px solid #eef2f7;
      padding-bottom:20px;
      margin-bottom:24px;
    }
    .brand{display:flex;align-items:center;gap:15px}
    .logo{height:55px;width:auto;object-fit:contain}
    h2,h3,p{margin:0}
    .title{color:var(--primary);font-size:23px;font-weight:900}
    .subtitle{color:var(--muted);font-size:12px;font-weight:700;margin-top:3px}
    .card{
      background:var(--surface2);
      border:1px solid rgba(15,23,42,.08);
      border-radius:18px;
      padding:20px;
      box-shadow:0 10px 24px rgba(0,0,0,.05);
      margin-bottom:20px;
    }
    .form-box{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}
    label{display:block;color:var(--primary);font-size:12px;font-weight:900;margin-bottom:7px}
    input,select{
      width:100%;
      min-height:45px;
      padding:11px 13px;
      border-radius:12px;
      border:1px solid #d8dee8;
      background:#fff;
      font:inherit;
      font-size:14px;
    }
    .btn,.btn2,.danger-btn{
      border:none;
      border-radius:12px;
      padding:11px 18px;
      min-height:45px;
      font-weight:900;
      cursor:pointer;
      transition:.2s;
      font-family:inherit;
      white-space:nowrap;
    }
    .btn{background:#fff;color:var(--primary);border:1px solid #e2e8f0}
    .btn2{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
    .danger-btn{background:var(--danger);color:#fff}
    .btn:hover,.btn2:hover,.danger-btn:hover{transform:translateY(-1px)}
    .list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .count-pill{background:#f8fafc;color:var(--primary);border:1px solid #e2e8f0;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}
    .table-wrap{overflow-x:auto}
    table{
      width:100%;
      min-width:820px;
      border-collapse:separate;
      border-spacing:0;
      font-size:13px;
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      border:1px solid #eef2f7;
    }
    thead th{
      background:#f8fafc;
      color:var(--primary);
      font-weight:900;
      padding:14px;
      text-align:center;
      border-bottom:2px solid #eef2f7;
    }
    td{
      padding:14px;
      text-align:center;
      border-bottom:1px solid #f1f5f9;
      vertical-align:middle;
    }
    tbody tr:last-child td{border-bottom:none}
    .emp-cell{text-align:right;font-weight:900;color:var(--primary)}
    .status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:96px;
      border-radius:999px;
      padding:7px 12px;
      font-size:12px;
      font-weight:900;
    }
    .pending{background:var(--warn-bg);color:var(--warn-t)}
    .approved{background:var(--ok-bg);color:var(--ok-t)}
    .cancelled{background:var(--cancel-bg);color:var(--cancel-t)}
    .actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    .empty{padding:26px;color:var(--muted);font-weight:800;text-align:center;background:#fff}
    .hidden{display:none!important}
    @media (max-width:850px){
      body{padding:12px}
      .glass{padding:18px;border-radius:18px}
      .form-box{grid-template-columns:1fr}
      .header{align-items:flex-start}
      .brand{align-items:flex-start}
    }
  </style>
</head>
<body>
<div class="shell">
  <div class="glass">
    <div class="header">
      <div class="brand">
        <img src="LOGO-almajdouie.png" class="logo" alt="Almajdouie Motors" />
        <div>
          <h2 class="title">خطة الإجازات</h2>
          <p class="subtitle">Vacation Plan - Almajdouie Motors</p>
        </div>
      </div>
      <button class="btn" id="refreshBtn" type="button">تحديث</button>
    </div>

    <div class="card">
      <div class="form-box">
        <div>
          <label for="pEmp">الموظف</label>
          <select id="pEmp">
            <option value="">اختر الموظف...</option>
          </select>
        </div>
        <div>
          <label for="pStart">من التاريخ</label>
          <input type="date" id="pStart" />
        </div>
        <div>
          <label for="pEnd">إلى التاريخ</label>
          <input type="date" id="pEnd" />
        </div>
        <button class="btn2" id="btnAddPlan" type="button">إضافة الخطة</button>
      </div>
    </div>

    <div class="card" id="planListCard">
      <div class="list-head">
        <h3 style="color:var(--primary);font-size:20px;font-weight:900">📋 Plan List</h3>
        <div class="count-pill" id="planCount">0 خطة</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="text-align:right">الموظف</th>
              <th>من التاريخ</th>
              <th>إلى التاريخ</th>
              <th>الحالة</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody id="planningBody">
            <tr><td class="empty" colspan="5">لا توجد خطط إجازات حالياً</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { db, waitForSignedInUser, logFirebaseError } from './firebase-session.js';
import {
  doc,
  collection,
  onSnapshot,
  addDoc,
  deleteDoc,
  updateDoc,
  getDoc
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

let employees = [];
let scheduleEmployees = [];
let employeeRecords = [];
let planList = [];
let currentUser = null;
let currentProfile = null;
let canManagePlans = false;
const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function byDate(a, b) {
  return String(a.from || '').localeCompare(String(b.from || '')) || String(a.name || '').localeCompare(String(b.name || ''));
}

function normalizeVacationEmployee(record, source) {
  const status = norm(record.status);
  return {
    id: String(record.id || record.uid || record.empId || record.empNum || `emp_${Date.now()}`),
    empNum: record.empId || record.empNum || record.technicianId || '',
    name: record.name || record.fullName || '',
    dept: record.dept || record.department || '',
    jobTitle: record.jobTitle || record.role || 'Employee',
    email: record.email || '',
    active: !(record.active === false || status === 'inactive' || status === 'hidden'),
    source
  };
}

function employeeKey(emp) {
  return norm(emp.empNum || emp.empId || emp.email || emp.id || emp.name);
}

function refreshEmployeeSources() {
  const merged = new Map();
  [...scheduleEmployees, ...employeeRecords].forEach(emp => {
    const normalized = normalizeVacationEmployee(emp, emp.source || 'employees');
    const key = employeeKey(normalized);
    if (!key) return;
    merged.set(key, { ...(merged.get(key) || {}), ...normalized });
  });
  employees = Array.from(merged.values());
  renderEmployees();
}

function norm(value) {
  return String(value || '').trim().toLowerCase();
}

function getUserProfileFromParent(user) {
  const profile = window.parent && window.parent.currentUserData;
  if (profile && profile.uid === user.uid) return profile;
  return null;
}

async function loadCurrentProfile(user) {
  const parentProfile = getUserProfileFromParent(user);
  if (parentProfile) return parentProfile;

  const snap = await getDoc(doc(db, 'app_users', user.uid));
  if (snap.exists()) return { id: snap.id, uid: user.uid, ...snap.data() };

  return {
    uid: user.uid,
    email: user.email || '',
    name: user.displayName || '',
    role: 'employee',
    active: true
  };
}

function isManagerProfile(profile) {
  const role = norm(profile && profile.role);
  return role === 'admin' || role === 'supervisor' || profile?.superAdmin === true;
}

function employeeMatchesCurrentUser(emp) {
  if (!emp || !currentUser) return false;
  const profile = currentProfile || {};
  const candidates = [
    profile.uid,
    currentUser.uid,
    profile.email,
    currentUser.email,
    profile.technicianId,
    profile.empNum,
    profile.employeeId,
    profile.name
  ].map(norm).filter(Boolean);

  const empValues = [
    emp.id,
    emp.fireId,
    emp.uid,
    emp.email,
    emp.empNum,
    emp.technicianId,
    emp.employeeId,
    emp.name
  ].map(norm).filter(Boolean);

  return empValues.some(value => candidates.includes(value));
}

function getFallbackCurrentEmployee() {
  if (!currentUser) return null;
  const profile = currentProfile || {};
  const id = profile.uid || currentUser.uid;
  if (!id) return null;

  return {
    id,
    empNum: profile.technicianId || profile.empNum || profile.employeeId || id,
    name: profile.name || currentUser.displayName || currentUser.email || 'Employee',
    dept: profile.dept || profile.department || '',
    jobTitle: profile.jobTitle || profile.role || 'Employee',
    email: profile.email || currentUser.email || '',
    active: true
  };
}

function getVisibleEmployees() {
  const activeEmployees = employees.filter(emp => emp.active !== false);
  if (canManagePlans) return activeEmployees;
  const matchedEmployees = activeEmployees.filter(employeeMatchesCurrentUser);
  if (matchedEmployees.length) return matchedEmployees;
  const fallbackEmployee = getFallbackCurrentEmployee();
  return fallbackEmployee ? [fallbackEmployee] : [];
}

function applyRoleUi() {
  $('planListCard').classList.toggle('hidden', !canManagePlans);
  $('pEmp').disabled = !canManagePlans;
}

function renderEmployees() {
  const currentValue = $('pEmp').value;
  const visibleEmployees = getVisibleEmployees();
  const options = visibleEmployees
    .map(emp => `<option value="${escapeHtml(emp.id)}">${escapeHtml(emp.name || emp.id)}</option>`)
    .join('');

  $('pEmp').innerHTML = `<option value="">اختر الموظف...</option>${options}`;
  if (visibleEmployees.some(emp => String(emp.id) === String(currentValue))) $('pEmp').value = currentValue;
  else if (!canManagePlans && visibleEmployees.length === 1) $('pEmp').value = visibleEmployees[0].id;
}

function statusLabel(status) {
  const value = String(status || 'pending');
  if (value === 'approved') return 'معتمدة';
  if (value === 'cancelled') return 'ملغاة';
  return 'معلقة';
}

function statusClass(status) {
  const value = String(status || 'pending');
  if (value === 'approved') return 'approved';
  if (value === 'cancelled') return 'cancelled';
  return 'pending';
}

function renderPlanList() {
  const sortedPlans = [...planList].sort(byDate);
  $('planCount').textContent = `${sortedPlans.length} خطة`;

  if (!sortedPlans.length) {
    $('planningBody').innerHTML = '<tr><td class="empty" colspan="5">لا توجد خطط إجازات حالياً</td></tr>';
    return;
  }

  $('planningBody').innerHTML = sortedPlans.map(plan => {
    const status = String(plan.status || 'pending');
    const decisionButtons = status === 'pending'
      ? `<button class="btn2" type="button" onclick="window.setPlanStatus('${plan.id}', 'approved')">اعتماد</button>
         <button class="btn" type="button" onclick="window.setPlanStatus('${plan.id}', 'cancelled')">إلغاء</button>`
      : '';

    return `
      <tr>
        <td class="emp-cell">${escapeHtml(plan.name || plan.empId || '')}</td>
        <td>${escapeHtml(plan.from || '')}</td>
        <td>${escapeHtml(plan.to || '')}</td>
        <td><span class="status ${statusClass(status)}">${statusLabel(status)}</span></td>
        <td>
          <div class="actions">
            ${decisionButtons}
            <button class="danger-btn" type="button" onclick="window.deletePlan('${plan.id}')">حذف</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

window.addVacationPlan = async () => {
  const empId = $('pEmp').value;
  const from = $('pStart').value;
  const to = $('pEnd').value;

  if (!empId || !from || !to) {
    alert('يرجى اختيار الموظف وتحديد تاريخ البداية والنهاية');
    return;
  }

  if (new Date(from) > new Date(to)) {
    alert('تاريخ النهاية يجب أن يكون بعد تاريخ البداية');
    return;
  }

  const emp = getVisibleEmployees().find(item => String(item.id) === String(empId));
  if (!emp) {
    alert(canManagePlans ? 'لم يتم العثور على الموظف المحدد' : 'لا يمكنك إضافة خطة إلا باسمك فقط');
    return;
  }

  await waitForSignedInUser();
  await addDoc(collection(db, 'vacations'), {
    empId: emp.empNum || emp.id,
    fireId: emp.id || '',
    name: emp.name || '',
    dept: emp.dept || '',
    role: emp.jobTitle || 'Employee',
    from,
    to,
    status: 'pending',
    createdByUid: currentUser?.uid || '',
    createdByEmail: currentUser?.email || currentProfile?.email || '',
    createdAt: new Date().toISOString(),
    actionBy: '',
    actionAt: ''
  });

  $('pStart').value = '';
  $('pEnd').value = '';
};

window.setPlanStatus = async (id, status) => {
  if (!canManagePlans) {
    alert('هذه العملية مخصصة للمشرف فقط');
    return;
  }
  await waitForSignedInUser();
  await updateDoc(doc(db, 'vacations', id), {
    status,
    actionAt: new Date().toISOString()
  });
};

window.deletePlan = async id => {
  if (!canManagePlans) {
    alert('هذه العملية مخصصة للمشرف فقط');
    return;
  }
  if (!confirm('هل تريد حذف خطة الإجازة؟')) return;
  await waitForSignedInUser();
  await deleteDoc(doc(db, 'vacations', id));
};

async function bindSnapshots() {
  currentUser = await waitForSignedInUser();
  currentProfile = await loadCurrentProfile(currentUser);
  canManagePlans = isManagerProfile(currentProfile);
  applyRoleUi();

  onSnapshot(doc(db, 'schedule', 'jadwal_v6'), snap => {
    scheduleEmployees = snap.exists() ? (snap.data().data?.emps || []) : [];
    refreshEmployeeSources();
  }, error => logFirebaseError('Vacation plan employees listener failed', error));

  onSnapshot(collection(db, 'employees'), snap => {
    employeeRecords = snap.docs.map(item => ({ id: item.id, ...item.data() }));
    refreshEmployeeSources();
  }, error => logFirebaseError('Vacation plan employees collection listener failed', error));

  if (canManagePlans) {
    onSnapshot(collection(db, 'vacations'), snap => {
      planList = snap.docs.map(item => ({ id: item.id, ...item.data() }));
      renderPlanList();
    }, error => logFirebaseError('Vacation plan list listener failed', error));
  }
}

$('btnAddPlan').addEventListener('click', () => {
  window.addVacationPlan().catch(error => logFirebaseError('Add vacation plan failed', error));
});

$('refreshBtn').addEventListener('click', () => {
  renderEmployees();
  if (canManagePlans) renderPlanList();
});

window.addEventListener('DOMContentLoaded', () => {
  bindSnapshots().catch(error => logFirebaseError('Vacation plan startup failed', error));
});
</script>
</body>
</html>
