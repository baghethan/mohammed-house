<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإجازات - Firebase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-gray-50 p-8">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-blue-800 mb-8">نظام تخطيط الإجازات (سحابي)</h1>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8 border-t-4 border-blue-600">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">إضافة طلب إجازة جديد</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input id="empName" type="text" placeholder="اسم الموظف" class="border p-2 rounded w-full outline-none focus:ring-2 focus:ring-blue-400">
                
                <select id="empRole" class="border p-2 rounded w-full">
                    <option value="موظف">موظف</option>
                    <option value="مشرف">مشرف</option>
                </select>

                <select id="vacMonth" class="border p-2 rounded w-full">
                    <option value="1">يناير</option>
                    <option value="2">فبراير</option>
                    <option value="3">مارس</option>
                    <option value="4">أبريل</option>
                    <option value="5">مايو</option>
                    <option value="6">يونيو</option>
                    <option value="7">يوليو</option>
                    <option value="8">أغسطس</option>
                    <option value="9">سبتمبر</option>
                    <option value="10">أكتوبر</option>
                    <option value="11">نوفمبر</option>
                    <option value="12">ديسمبر</option>
                </select>

                <button id="addBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">إضافة الخطة</button>
            </div>
            <p id="errorMsg" class="text-red-500 mt-3 hidden font-bold"></p>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full text-right border-collapse">
                <thead>
                    <tr class="bg-blue-600 text-white">
                        <th class="p-3">الموظف</th>
                        <th class="p-3">الدور</th>
                        <th class="p-3">الشهر</th>
                        <th class="p-3">الإجراء</th>
                    </tr>
                </thead>
                <tbody id="vacationTable">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, where } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ استبدل البيانات التالية ببيانات مشروعك من Firebase Console
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة فايربيس
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const vacCollection = collection(db, "vacations");

        const monthNames = ["", "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

        // --- وظيفة الإضافة مع التحقق من التعارض أونلاين ---
        async function addVacation() {
            const name = document.getElementById('empName').value;
            const role = document.getElementById('empRole').value;
            const month = document.getElementById('vacMonth').value;
            const errorMsg = document.getElementById('errorMsg');
            const addBtn = document.getElementById('addBtn');

            if (!name) return alert("يرجى إدخال اسم الموظف");

            addBtn.disabled = true; // تعطيل الزر مؤقتاً
            errorMsg.classList.add('hidden');

            try {
                // جلب البيانات الحالية لهذا الشهر والدور من السحابة للتحقق
                const q = query(vacCollection, where("month", "==", month), where("role", "==", role));
                const querySnapshot = await getDocs(q);
                const count = querySnapshot.size;

                // تطبيق شروطك
                if (role === "موظف" && count >= 1) {
                    showError("⚠️ تعارض: يوجد موظف بالفعل في هذا الشهر!");
                    addBtn.disabled = false;
                    return;
                }
                if (role === "مشرف" && count >= 2) {
                    showError("⚠️ تعارض: الحد الأقصى للمشرفين (2) مكتمل لهذا الشهر!");
                    addBtn.disabled = false;
                    return;
                }

                // إضافة البيانات لفايربيس
                await addDoc(vacCollection, {
                    name: name,
                    role: role,
                    month: month,
                    createdAt: new Date()
                });

                document.getElementById('empName').value = "";
            } catch (e) {
                console.error("خطأ في الإضافة: ", e);
                showError("حدث خطأ أثناء الاتصال بالقاعدة.");
            }
            addBtn.disabled = false;
        }

        // --- وظيفة عرض البيانات (تحديث حي - Realtime) ---
        onSnapshot(vacCollection, (snapshot) => {
            const tableBody = document.getElementById('vacationTable');
            tableBody.innerHTML = "";
            
            snapshot.forEach((docSnap) => {
                const v = docSnap.data();
                const id = docSnap.id;
                
                const row = `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-medium">${v.name}</td>
                        <td class="p-3"><span class="${v.role === 'مشرف' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'} px-2 py-1 rounded text-sm">${v.role}</span></td>
                        <td class="p-3 text-gray-600">${monthNames[v.month]}</td>
                        <td class="p-3">
                            <button onclick="deleteVacation('${id}')" class="text-red-500 hover:underline">حذف</button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        });

        // --- وظيفة الحذف ---
        window.deleteVacation = async (id) => {
            if(confirm("هل أنت متأكد من حذف هذا الطلب؟")) {
                await deleteDoc(doc(db, "vacations", id));
            }
        };

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }

        // ربط الزر بالدالة
        document.getElementById('addBtn').addEventListener('click', addVacation);

    </script>
</body>
</html>
