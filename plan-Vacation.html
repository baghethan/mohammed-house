<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vacation Planning - Almajdouie Motors</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--text:#1f2937;--muted:#64748b;--surface:rgba(255,255,255,.94);--surface2:#fff;--shadow:0 18px 50px rgba(13,33,73,.16);--ok-bg:#ecfdf5;--ok-t:#166534;--ok-border:#86efac}
    *{box-sizing:border-box} 
    body{margin:0;padding:20px;font-family:'Segoe UI',sans-serif;background:linear-gradient(180deg, rgba(12,31,73,.1), rgba(255,255,255,.2)), url('image_dba186.png') center/cover fixed no-repeat;min-height:100vh;display:flex;justify-content:center}
    .shell{width:100%;max-width:1300px}
    .glass{width:100%;background:var(--surface);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;padding:30px}
    .card{background:var(--surface2);border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:20px;box-shadow:0 10px 24px rgba(0,0,0,.05);margin-bottom:20px}
    .btn,.btn2,.danger{border:none;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;transition:.2s}
    .btn{background:#fff;color:var(--primary);border:1px solid #e2e8f0}
    .btn2{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
    .danger{background:linear-gradient(135deg,#d32f2f,#b71c1c);color:#fff}
    .row,.form-box{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    input,select{padding:10px 12px;border-radius:12px;border:1px solid #d8dee8;background:#fff;min-height:42px;font-size:13px}
    
    /* Gantt Chart Styles */
    .gantt-wrap{overflow-x:auto;margin-top:12px;border:1px solid rgba(15,23,42,.08);padding:18px;border-radius:18px;background:#fff}
    .gantt{display:grid;grid-template-columns:180px repeat(12,1fr);min-width:1120px}
    .ghead{padding:11px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;text-align:center;font-weight:800;font-size:11px;border:1px solid rgba(255,255,255,0.1)}
    .gname{padding:12px;border:1px solid rgba(15,23,42,.06);font-weight:800;background:#fcfcfd;font-size:11px;display:flex;align-items:center;justify-content:flex-end}
    .gmonths{display:grid;grid-template-columns:repeat(12,1fr);grid-column:2 / 14;border-bottom:1px solid rgba(15,23,42,.05);position:relative;height:46px}
    .slot{border-left:1px solid rgba(15,23,42,0.04)}
    .bar{position:absolute;height:24px;background:linear-gradient(135deg,#35b39a,#2cc3a7);top:10px;border-radius:999px;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(53,179,154,.24);white-space:nowrap;font-weight:800;z-index:5;padding:0 6px}
    
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eee}
    thead th{background:#f8fafc;color:var(--primary);font-weight:900;padding:12px;border-bottom:1px solid #eee}
    td{padding:12px;text-align:center;border-bottom:1px solid #f9f9f9}
  </style>
</head>
<body>
<div class="shell">
  <div class="glass">
    <div class="row" style="justify-content:space-between; border-bottom:2px solid #eee; padding-bottom:15px; margin-bottom:25px">
        <div style="display:flex; align-items:center; gap:15px">
            <img src="LOGO-almajdouie.png" style="height:50px" />
            <div>
                <h2 id="title" style="margin:0; color:var(--primary); font-weight:900">إدارة خطة الإجازات</h2>
                <p style="margin:0; color:var(--muted); font-size:12px">نظام التخطيط السنوي للموظفين</p>
            </div>
        </div>
        <button class="btn" id="btnLang">AR / EN</button>
    </div>

    <div class="card">
        <div class="form-box">
            <select id="pEmp" style="flex:1"><option value="">اختر الموظف...</option></select>
            <input type="date" id="pStart" />
            <input type="date" id="pEnd" />
            <button class="btn2" onclick="window.addVacationPlan()">+ إضافة للخطة</button>
        </div>
    </div>

    <div class="card">
        <div class="row" style="justify-content:space-between">
            <h3 id="timelineTitle" style="margin:0; color:var(--primary)">📅 المخطط السنوي للإجازات</h3>
            <button class="btn" onclick="window.downloadChart()">📸 تنزيل المخطط</button>
        </div>
        <div class="gantt-wrap" id="ganttWrap">
            <div class="gantt" id="gantt">
                <div class="ghead" id="gEmp">الموظف</div>
                <div class="ghead">يناير</div><div class="ghead">فبراير</div><div class="ghead">مارس</div>
                <div class="ghead">أبريل</div><div class="ghead">مايو</div><div class="ghead">يونيو</div>
                <div class="ghead">يوليو</div><div class="ghead">أغسطس</div><div class="ghead">سبتمبر</div>
                <div class="ghead">أكتوبر</div><div class="ghead">نوفمبر</div><div class="ghead">ديسمبر</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 id="listTitle" style="margin-top:0; color:var(--primary)">📋 قائمة طلبات الخطة</h3>
        <table>
            <thead>
                <tr><th id="thName">الاسم</th><th id="thFrom">من</th><th id="thTo">إلى</th><th id="thStatus">الحالة</th><th id="thAction">الإجراء</th></tr>
            </thead>
            <tbody id="planningBody"></tbody>
        </table>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

const i18n = {
    ar: { title:'إدارة خطة الإجازات', timeline:'📅 المخطط السنوي للإجازات', list:'📋 قائمة طلبات الخطة', months:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'], name:'الاسم', from:'من', to:'إلى', status:'الحالة', action:'الإجراء', employee:'الموظف' },
    en: { title:'Vacation Planning Management', timeline:'📅 Yearly Vacation Timeline', list:'📋 Planning Requests List', months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], name:'Name', from:'From', to:'To', status:'Status', action:'Action', employee:'Employee' }
};

let employees=[], planList=[], currentLang=localStorage.getItem('lang')||'ar';
const $=id=>document.getElementById(id), tr=()=>i18n[currentLang];

// --- 1. Planning Logic ---
window.addVacationPlan = async () => {
    const id=$('pEmp').value, s=$('pStart').value, e=$('pEnd').value;
    if(!id || !s || !e) { alert("أكمل البيانات"); return; }
    const emp = employees.find(x => x.id === id);
    await addDoc(collection(db, 'vacations'), {
        empId: emp.empNum || emp.id, fireId: emp.id, name: emp.name, from: s, to: e, status: 'pending', createdAt: new Date().toISOString()
    });
    $('pStart').value = ''; $('pEnd').value = '';
};

window.updatePlanStatus = async (id, status) => {
    await updateDoc(doc(db, 'vacations', id), { status });
};

window.deletePlan = async (id) => {
    if(confirm("هل تريد الحذف؟")) await deleteDoc(doc(db, 'vacations', id));
};

window.downloadChart = () => {
    html2canvas($('ganttWrap'), {scale:2}).then(c => {
        const a = document.createElement('a'); a.download=`Plan_${new Date().getFullYear()}.png`; a.href=c.toDataURL(); a.click();
    });
};

// --- 2. Rendering ---
function renderGantt() {
    const chart = $('gantt');
    const headers = Array.from(chart.children).slice(0, 13);
    chart.innerHTML = '';
    headers.forEach(h => chart.appendChild(h));

    employees.filter(e => e.active).forEach(emp => {
        const nameCell = document.createElement('div'); nameCell.className='gname'; nameCell.innerText=emp.name;
        const monthsWrap = document.createElement('div'); monthsWrap.className='gmonths';
        for(let i=0; i<12; i++) { const s=document.createElement('div'); s.className='slot'; monthsWrap.appendChild(s); }
        
        planList.filter(p => p.fireId === emp.id || p.name === emp.name).forEach(p => {
            const d1 = new Date(p.from), d2 = new Date(p.to);
            const year = d1.getFullYear();
            const startYear = new Date(year, 0, 1), endYear = new Date(year + 1, 0, 1);
            const total = (endYear - startYear) / 86400000;
            const bar = document.createElement('div'); bar.className='bar';
            bar.style.left = ((d1 - startYear) / 86400000 / total * 100) + '%';
            bar.style.width = (((d2 - d1) / 86400000 + 1) / total * 100) + '%';
            bar.innerText = `${d1.getMonth()+1}/${d1.getDate()}`;
            monthsWrap.appendChild(bar);
        });
        chart.appendChild(nameCell); chart.appendChild(monthsWrap);
    });
}

function renderPlanList() {
    $('planningBody').innerHTML = planList.map(p => `
        <tr>
            <td style="font-weight:800">${p.name}</td>
            <td>${p.from}</td>
            <td>${p.to}</td>
            <td><span style="color:${p.status==='approved'?'green':'orange'}">${p.status}</span></td>
            <td>
                <button class="btn" onclick="window.updatePlanStatus('${p.id}','approved')">✅</button>
                <button class="danger" onclick="window.deletePlan('${p.id}')">X</button>
            </td>
        </tr>
    `).join('');
}

// --- 3. Initializing ---
async function bindSnapshots(){
    onSnapshot(doc(db,'schedule','jadwal_v6'), s => {
        employees = s.exists() ? (s.data().data?.emps || []) : [];
        $('pEmp').innerHTML = '<option value="">اختر الموظف...</option>' + employees.filter(e=>e.active).map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
        renderGantt();
    });
    onSnapshot(collection(db, 'vacations'), s => {
        planList = s.docs.map(d => ({id:d.id, ...d.data()}));
        renderPlanList(); renderGantt();
    });
}

$('btnLang').addEventListener('click', () => {
    currentLang = currentLang==='ar'?'en':'ar'; localStorage.setItem('lang', currentLang); location.reload();
});

window.addEventListener('DOMContentLoaded', () => {
    if(currentLang==='en') { $('mainHtml').dir='ltr'; $('mainHtml').lang='en'; }
    const t = tr();
    $('title').innerText = t.title; $('timelineTitle').innerText = t.timeline; $('listTitle').innerText = t.list;
    $('gEmp').innerText = t.employee; $('thName').innerText = t.name; $('thFrom').innerText = t.from;
    $('thTo').innerText = t.to; $('thStatus').innerText = t.status; $('thAction').innerText = t.action;
    bindSnapshots();
});
</script>
</body>
</html>
