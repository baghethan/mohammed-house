let employees=[], planList=[], currentLang=localStorage.getItem('lang')||'ar'; const $=id=>document.getElementById(id), tr=()=>i18n[currentLang];
function loadEmployees(){try{employees=JSON.parse(localStorage.getItem(STORAGE_EMPLOYEES)||'null')||EMBEDDED_EMPLOYEES;}catch(e){employees=EMBEDDED_EMPLOYEES;} employees=employees.filter(e=>e&&(e.active!==false)&&String(e.status||'active').toLowerCase()!=='inactive');}
function loadPlans(){try{planList=JSON.parse(localStorage.getItem(STORAGE_PLANS)||'[]');}catch(e){planList=[];}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
window.refreshDashboard=()=>{loadEmployees();loadPlans();const t=tr();const range=$('dbViewRange').value;const rangeMap={year:[0,11,t.year],q1:[0,2,'Q1'],q2:[3,5,'Q2'],q3:[6,8,'Q3'],q4:[9,11,'Q4']};const [sm,em,txt]=rangeMap[range];$('rangeIndicator').innerText=txt;const filtered=planList.filter(p=>{const d=new Date(p.from); if(isNaN(d)) return false; const m=d.getMonth(); return m>=sm&&m<=em;});const today=new Date();$('dashboardStats').innerHTML=`<div class="stat-card" style="border-color:#1e40af"><div class="muted">${t.total}</div><div class="stat-val">${filtered.length}</div></div><div class="stat-card" style="border-color:#10b981"><div class="muted">${t.active}</div><div class="stat-val">${planList.filter(p=>today>=new Date(p.from)&&today<=new Date(p.to)).length}</div></div><div class="stat-card" style="border-color:#f59e0b"><div class="muted">${t.pending}</div><div class="stat-val">${planList.filter(p=>p.status==='pending').length}</div></div><div class="stat-card" style="border-color:#6d28d9"><div class="muted">${t.employees}</div><div class="stat-val">${employees.length}</div></div>`;let html=`<div style="display:grid;grid-template-columns:190px 1fr;background:var(--primary);color:#fff;font-weight:800;font-size:11px"><div style="padding:12px;text-align:center">${t.employee}</div><div style="display:grid;grid-template-columns:repeat(${em-sm+1},1fr)">`;for(let i=sm;i<=em;i++)html+=`<div style="padding:12px;text-align:center;border-left:1px solid rgba(255,255,255,.1)">${t.months[i]}</div>`;html+='</div></div>';const grouped={};filtered.forEach(p=>{const name=p.name||p.empId||'Employee';(grouped[name]||(grouped[name]=[])).push(p);});const names=Object.keys(grouped).sort((a,b)=>a.localeCompare(b));if(!names.length) html+=`<div class="empty">لا توجد بيانات في هذا النطاق</div>`;names.forEach(name=>{html+=`<div style="display:grid;grid-template-columns:190px 1fr;border-bottom:1px solid #f1f5f9;min-height:52px;align-items:center"><div class="gname-db">${esc(name)}</div><div style="display:grid;grid-template-columns:repeat(${em-sm+1},1fr);position:relative;min-height:52px">`;grouped[name].forEach((p,idx)=>{const d1=new Date(p.from);const d2=new Date(p.to||p.from);const sM=Math.max(d1.getMonth(),sm);const eM=Math.min(d2.getMonth(),em);const mWidth=100/(em-sm+1);const colors=['#1e40af','#0f766e','#6d28d9','#b45309'];const width=Math.max(mWidth-0.5,(eM-sM+1)*mWidth-0.5);html+=`<div class="gantt-bar-db" style="${currentLang==='ar'?'right':'left'}:${(sM-sm)*mWidth}%;width:${width}%;background:${colors[idx%colors.length]}">${esc(p.from)}</div>`;});html+='</div></div>';});$('dbGanttArea').innerHTML=html;};
function normalizeImportedEmployee(row,i){const pick=(names)=>{for(const n of names){if(row[n]!==undefined&&String(row[n]).trim())return row[n];}return '';};return {empId:String(pick(['empId','Employee ID','Assignment Number','رقم الموظف'])||('emp_'+i)).trim(),name:String(pick(['name','Person Full Name','Employee Name','اسم الموظف'])).trim(),email:String(pick(['email','Employee Email Address','Email'])).trim(),departmentName:String(pick(['departmentName','Department Name','Department'])).trim(),departmentId:String(pick(['departmentId','Department ID'])).trim(),active:true,status:'active'};}
async function importExcel(ev){const file=ev.target.files[0]; if(!file)return; const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{defval:''}); const list=rows.map(normalizeImportedEmployee).filter(e=>e.empId&&e.name); if(!list.length) return alert('لم يتم العثور على موظفين'); localStorage.setItem(STORAGE_EMPLOYEES,JSON.stringify(list)); alert(`تم تحميل ${list.length} موظف`); ev.target.value=''; window.refreshDashboard();}
