<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام ترقية الويندوز - Upgrade Windows</title>
  <style>
    :root{
      --primary:#0d4b73; --primary-2:#0a3b5a; --green:#2f9e66; --danger:#d64545; --warning:#c47f00;
      --border:#d7e0ea; --text:#163247; --muted:#6e8192; --bg:#edf3f8; --card:#fff; --shadow:0 10px 30px rgba(18,48,74,.08); --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;color:var(--text);background:var(--bg)}
    header{background:var(--primary);color:#fff;padding:14px 18px;box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
    .container{max-width:1500px;margin:18px auto;padding:0 14px 28px}
    .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}
    .grid-4{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px}
    .card,.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
    .card{padding:16px;overflow:hidden;margin-bottom:16px}
    .card h3{margin:-16px -16px 14px;padding:12px 16px;background:var(--primary);color:#fff;font-size:15px}
    .stat{padding:16px}.stat .label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.stat .value{font-size:30px;font-weight:800;color:var(--primary)}
    .field{display:grid;gap:8px;margin-bottom:12px}.field label{font-size:14px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:10px 12px;font:inherit;background:#fbfcfe}
    .btn{border:1px solid var(--border);border-radius:999px;padding:10px 16px;background:#fff;color:var(--primary);font-weight:700;cursor:pointer}
    .btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.warning{background:var(--warning);border-color:var(--warning);color:#fff}
    .btn.small{padding:7px 11px;font-size:12px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;margin-bottom:14px}
    .note{background:#f6fbff;border:1px dashed #bfd7e8;color:#33546b;border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.7;font-size:13px}
    .alert{padding:10px 12px;border-radius:12px;margin-top:10px}.alert.error{background:#ffecec;border:1px solid #f3b0b0;color:#8a1f1f}.hidden{display:none}
    .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:#fff} table{width:100%;border-collapse:collapse} th,td{padding:12px 10px;border-bottom:1px solid #edf2f7;text-align:right;white-space:nowrap;font-size:13px} th{background:#f8fbff;color:var(--primary)}
    
    /* Upgrade Summary Specific */
    .upgrade-summary-top{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px;margin-bottom:16px}
    .upgrade-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .upgrade-meta-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
    .upgrade-meta-card h4{margin:0 0 12px;color:var(--primary);font-size:16px}
    .upgrade-mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
    .upgrade-mini-card{border:1px solid var(--border);border-top:5px solid var(--primary);border-radius:14px;padding:12px;background:#fbfdff}
    .upgrade-mini-title{font-weight:800;color:var(--primary);margin-bottom:10px;font-size:14px}
    .upgrade-mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .upgrade-mini-pill{border:1px solid var(--border);border-radius:12px;padding:8px 10px;background:#fff;text-align:center}
    .upgrade-mini-pill .label{display:block;font-size:10px;color:var(--muted)}
    .upgrade-mini-pill .value{font-size:16px;font-weight:800}
    .upgrade-progress-track{height:8px;background:#e9f0f6;border-radius:999px;overflow:hidden;margin-top:5px}
    .upgrade-progress-fill{height:100%;border-radius:999px;transition:width .25s ease}
    
    @media (max-width:1200px){ .grid-2, .grid-3, .grid-4, .upgrade-summary-top, .upgrade-meta-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <div class="container" style="margin:0 auto; padding:0">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <div style="font-size:22px; font-weight:800">ترقية أنظمة الويندوز | Windows Upgrade Portal</div>
      <div id="userInfo" style="font-size:14px">جاري التحميل...</div>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <h3>ملخص ترقية الأجهزة</h3>
    <div class="upgrade-summary-top">
      <div class="stat"><span class="label">إجمالي السجلات</span><div class="value" id="upgradeWindowsStatTotal">0</div></div>
      <div class="stat"><span class="label">إجمالي الأجهزة</span><div class="value" id="upgradeWindowsStatDevices">0</div></div>
      <div class="stat"><span class="label">قيد التنفيذ</span><div class="value" id="upgradeWindowsStatInProgress">0</div></div>
      <div class="stat"><span class="label">مكتمل</span><div class="value" id="upgradeWindowsStatCompleted">0</div></div>
    </div>
    <div class="upgrade-meta-grid">
      <div class="upgrade-meta-card">
        <h4>المناطق</h4>
        <div class="upgrade-mini-grid" id="upgradeWindowsRegionsGrid"></div>
      </div>
      <div class="upgrade-meta-card">
        <h4>المدن</h4>
        <div class="upgrade-mini-grid" id="upgradeWindowsCitiesGrid"></div>
      </div>
    </div>
  </section>

  <div class="grid-2">
    <section class="card">
      <h3>إدخال / تعديل بيانات الترقية</h3>
      <input type="hidden" id="uwEditingId">
      
      <div class="grid-3">
        <div class="field"><label>الفرع</label><select id="uwBranchSelect"></select></div>
        <div class="field"><label>الموظف في الفرع؟</label><select id="uwEmployeeInBranch"><option value="yes">نعم</option><option value="no">لا</option></select></div>
        <div class="field"><label>Branch ID</label><input id="uwBranchId" readonly></div>
      </div>

      <div class="grid-3">
        <div class="field"><label>البراند</label><select id="uwBrandSelect"></select></div>
        <div class="field"><label>المدينة</label><input id="uwCity" readonly></div>
        <div class="field"><label>المنطقة</label><input id="uwRegion" readonly></div>
      </div>

      <div class="grid-3">
        <div class="field"><label>اسم الموظف</label><input id="uwEmployeeName"></div>
        <div class="field"><label>رقم الموظف</label><input id="uwEmployeeId"></div>
        <div class="field"><label>اسم الجهاز</label><input id="uwDeviceName"></div>
      </div>

      <div class="grid-3">
        <div class="field"><label>عدد الأجهزة</label><input id="uwDevicesCount" type="number" min="1"></div>
        <div class="field"><label>تاريخ الزيارة</label><input id="uwTechnicianVisitDate" type="date"></div>
        <div class="field"><label>الحالة</label><select id="uwStatus">
          <option value="planned">Planned</option>
          <option value="in progress">In Progress</option>
          <option value="completed">Completed</option>
        </select></div>
      </div>

      <div class="field"><label>ملاحظات</label><textarea id="uwNotes"></textarea></div>

      <div class="actions">
        <button class="btn green" id="saveUWBtn">حفظ السجل</button>
        <button class="btn" id="clearUWBtn">تنظيف الحقول</button>
      </div>

      <hr style="border:0; border-top:1px solid var(--border); margin:20px 0">

      <div class="grid-3">
        <div class="field"><label>ملف Excel</label><input id="uwExcelFile" type="file" accept=".xlsx,.xls"></div>
        <div class="field"><label>&nbsp;</label><button class="btn warning" id="importUWBtn">استيراد من Excel</button></div>
        <div class="field"><label>&nbsp;</label><button class="btn" id="exportUWBtn">تصدير إلى Excel</button></div>
      </div>
      
      <div id="uwMessage" class="note">جاهز للعمل.</div>
      <div id="uwError" class="alert error hidden"></div>
    </section>

    <section class="card">
      <h3>سجلات الترقية الحالية</h3>
      <div class="field"><input id="uwSearch" placeholder="بحث سريع عن موظف، فرع، أو جهاز..."></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Branch ID</th>
              <th>الموظف</th>
              <th>الجهاز</th>
              <th>الحالة</th>
              <th>إجراء</th>
            </tr>
          </thead>
          <tbody id="uwTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, query, onSnapshot, Timestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs',
    authDomain:'baghethan-ba325.firebaseapp.com',
    projectId:'baghethan-ba325',
    storageBucket:'baghethan-ba325.firebasestorage.app',
    messagingSenderId:'944819735112',
    appId:'1:944819735112:web:07315600da39377320667d'
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const state = {
    windowsUpgrades: [],
    branches: [],
    brands: [],
    currentUser: null
  };

  const $ = id => document.getElementById(id);

  // --- Functions Logics ---

  function renderUpgradeWindowsSummary() {
    const total = state.windowsUpgrades.length;
    const devices = state.windowsUpgrades.reduce((s, r) => s + (Number(r.devicesCount) || 0), 0);
    const inProgress = state.windowsUpgrades.filter(r => ['planned', 'in progress'].includes(String(r.status || '').toLowerCase())).length;
    const completed = state.windowsUpgrades.filter(r => String(r.status || '').toLowerCase() === 'completed').length;

    $('upgradeWindowsStatTotal').textContent = total;
    $('upgradeWindowsStatDevices').textContent = devices;
    $('upgradeWindowsStatInProgress').textContent = inProgress;
    $('upgradeWindowsStatCompleted').textContent = completed;

    const buildCards = (key) => {
        const map = new Map();
        state.windowsUpgrades.forEach(r => {
            const val = r[key] || 'غير محدد';
            if(!map.has(val)) map.set(val, { p:0, c:0 });
            const b = map.get(val);
            if(r.status === 'completed') b.c++; else b.p++;
        });
        return [...map.entries()].map(([name, counts]) => {
            const pct = Math.round((counts.c / (counts.c + counts.p)) * 100) || 0;
            return `
                <div class="upgrade-mini-card">
                    <div class="upgrade-mini-title">${name}</div>
                    <div class="upgrade-mini-stats">
                        <div class="upgrade-mini-pill"><span class="label">معلق</span><span class="value">${counts.p}</span></div>
                        <div class="upgrade-mini-pill"><span class="label">مكتمل</span><span class="value">${counts.c}</span></div>
                    </div>
                    <div class="upgrade-progress-track"><div class="upgrade-progress-fill" style="width:${pct}%; background:var(--green)"></div></div>
                </div>`;
        }).join('');
    };

    $('upgradeWindowsRegionsGrid').innerHTML = buildCards('region');
    $('upgradeWindowsCitiesGrid').innerHTML = buildCards('city');
  }

  function renderUpgradeWindowsTable() {
    const q = ($('uwSearch').value || '').toLowerCase();
    const filtered = state.windowsUpgrades.filter(r => 
        !q || [r.employeeName, r.branchId, r.deviceName, r.status].some(v => String(v||'').toLowerCase().includes(q))
    );

    $('uwTableBody').innerHTML = filtered.map(r => `
      <tr>
        <td>${r.branchId || '-'}</td>
        <td>${r.employeeName || '-'}</td>
        <td>${r.deviceName || '-'}</td>
        <td><span style="color:${r.status === 'completed' ? 'var(--green)' : 'var(--warning)'}">${r.status}</span></td>
        <td><button class="btn small" onclick="editRecord('${r.id}')">تعديل</button></td>
      </tr>
    `).join('');
    renderUpgradeWindowsSummary();
  }

  window.editRecord = (id) => {
    const r = state.windowsUpgrades.find(x => x.id === id);
    if(!r) return;
    $('uwEditingId').value = r.id;
    $('uwBranchSelect').value = r.branchId || '';
    $('uwBranchId').value = r.branchId || '';
    $('uwBrandSelect').value = r.brand || '';
    $('uwCity').value = r.city || '';
    $('uwRegion').value = r.region || '';
    $('uwEmployeeName').value = r.employeeName || '';
    $('uwEmployeeId').value = r.employeeId || '';
    $('uwDeviceName').value = r.deviceName || '';
    $('uwDevicesCount').value = r.devicesCount || 1;
    $('uwTechnicianVisitDate').value = r.technicianVisitDate || '';
    $('uwStatus').value = r.status || 'planned';
    $('uwNotes').value = r.notes || '';
  };

  async function saveRecord() {
    try {
        const id = $('uwEditingId').value;
        const payload = {
            branchId: $('uwBranchId').value,
            brand: $('uwBrandSelect').value,
            city: $('uwCity').value,
            region: $('uwRegion').value,
            employeeName: $('uwEmployeeName').value,
            employeeId: $('uwEmployeeId').value,
            deviceName: $('uwDeviceName').value,
            devicesCount: Number($('uwDevicesCount').value),
            technicianVisitDate: $('uwTechnicianVisitDate').value,
            status: $('uwStatus').value,
            notes: $('uwNotes').value,
            updatedAt: Timestamp.now()
        };
        if(id) await setDoc(doc(db, 'windows_upgrades', id), payload, {merge:true});
        else await addDoc(collection(db, 'windows_upgrades'), { ...payload, createdAt: Timestamp.now() });
        
        $('uwMessage').textContent = "تم الحفظ بنجاح";
        clearForm();
    } catch(e) { $('uwError').textContent = e.message; $('uwError').classList.remove('hidden'); }
  }

  function clearForm() {
    $('uwEditingId').value = '';
    $('uwBranchId').value = '';
    $('uwEmployeeName').value = '';
    $('uwEmployeeId').value = '';
    $('uwDeviceName').value = '';
    $('uwNotes').value = '';
    $('uwBranchSelect').value = '';
  }

  // --- Listeners ---
  onAuthStateChanged(auth, user => {
    if(user) {
        state.currentUser = user;
        $('userInfo').textContent = `متصل كـ: ${user.email}`;
        
        onSnapshot(collection(db, 'windows_upgrades'), snap => {
            state.windowsUpgrades = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderUpgradeWindowsTable();
        });

        onSnapshot(collection(db, 'branches'), snap => {
            state.branches = snap.docs.map(d => ({id: d.id, ...d.data()}));
            $('uwBranchSelect').innerHTML = '<option value="">اختر الفرع</option>' + 
                state.branches.map(b => `<option value="${b.id}">${b.branchName || b.id}</option>`).join('');
        });

        onSnapshot(collection(db, 'brand_assets'), snap => {
            state.brands = snap.docs.map(d => ({id: d.id, ...d.data()}));
            $('uwBrandSelect').innerHTML = '<option value="">اختر البراند</option>' + 
                state.brands.map(b => `<option value="${b.brand || b.nameEn}">${b.nameAr || b.brand}</option>`).join('');
        });
    } else {
        window.location.href = "Site-Visit.html"; // العودة لصفحة الدخول إذا لم يكن مسجلاً
    }
  });

  $('uwBranchSelect').addEventListener('change', e => {
      const b = state.branches.find(x => x.id === e.target.value);
      if(b) {
          $('uwBranchId').value = b.id;
          $('uwCity').value = b.city || '';
          $('uwRegion').value = b.region || '';
      }
  });

  $('saveUWBtn').addEventListener('click', saveRecord);
  $('clearUWBtn').addEventListener('click', clearForm);
  $('uwSearch').addEventListener('input', renderUpgradeWindowsTable);

  // التصدير للاكسل
  $('exportUWBtn').addEventListener('click', () => {
      const ws = XLSX.utils.json_to_sheet(state.windowsUpgrades);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Upgrades");
      XLSX.writeFile(wb, "Windows_Upgrade_Report.xlsx");
  });

</script>
</body>
</html>
