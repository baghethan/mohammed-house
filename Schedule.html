<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almajdouie Motors - Integrated System v10.4.3</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root { --primary: #0d2149; --primary2: #1b4fa3; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f9; }
    .vacation-bar {
      position: absolute; height: 20px; border-radius: 10px;
      background: linear-gradient(90deg, #2563eb 0%, #14b8a6 100%);
      filter: drop-shadow(0 2px 4px rgba(37, 99, 235, 0.2));
      z-index: 5; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 10px; font-weight: bold;
    }
    .gantt-row { border-bottom: 1px solid #f8fafc; height: 56px; display: flex; }
    .gantt-cell { border-right: 1px solid #f8fafc; flex: 1; min-width: 60px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .login-overlay { position: fixed; inset: 0; background: rgba(13, 33, 73, 0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <img src="LOGO-almajdouie.png" class="h-12 mx-auto mb-6">
    <h2 class="text-2xl font-bold text-center text-[#0d2149] mb-6">تسجيل الدخول</h2>
    <form id="loginForm" class="space-y-4">
      <input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="w-full rounded-lg border-gray-300" required>
      <input id="loginPassword" type="password" placeholder="كلمة المرور" class="w-full rounded-lg border-gray-300" required>
      <button type="submit" class="w-full bg-[#1b4fa3] text-white py-2 rounded-lg font-bold">دخول</button>
      <div id="loginErr" class="text-red-500 text-sm hidden text-center"></div>
    </form>
  </div>
</div>

<div id="mainContent" class="hidden">
  <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-4">
      <img src="LOGO-almajdouie.png" class="h-10">
      <span class="font-bold text-[#0d2149]">نظام المجدوعي للجدولة</span>
    </div>
    <div class="flex gap-2">
      <span id="userChip" class="bg-blue-50 px-3 py-1 rounded-full text-xs font-bold text-blue-700"></span>
      <button id="btnLogout" class="text-red-600 text-sm font-bold">خروج</button>
    </div>
  </header>

  <nav class="max-w-7xl mx-auto p-4 flex gap-2 overflow-x-auto">
    <button class="tab-btn active px-4 py-2 rounded-full bg-white shadow-sm text-sm" data-tab="schedule">🗓️ الجدول</button>
    <button class="tab-btn px-4 py-2 rounded-full bg-white shadow-sm text-sm" data-tab="planning">📅 خطة الإجازات</button>
    </nav>

  <main class="max-w-7xl mx-auto p-4">
    <div id="schedule" class="tab-content active">
       <div class="bg-white p-6 rounded-2xl shadow-sm">هنا يظهر الجدول الأسبوعي الأصلي...</div>
    </div>

    <div id="planning" class="tab-content">
      <section class="bg-white rounded-2xl p-6 mb-6 shadow-sm grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
          <div><label class="block text-xs font-bold mb-2">الموظف</label><select id="pEmp" class="w-full rounded-lg border-gray-200 text-sm"></select></div>
          <div><label class="block text-xs font-bold mb-2">من</label><input type="date" id="pStart" class="w-full rounded-lg border-gray-200 text-sm"></div>
          <div><label class="block text-xs font-bold mb-2">إلى</label><input type="date" id="pEnd" class="w-full rounded-lg border-gray-200 text-sm"></div>
          <button onclick="window.addVacationPlan()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">إضافة للخطة</button>
      </section>

      <section class="bg-white rounded-2xl p-6 mb-6 shadow-sm overflow-hidden" id="ganttCapture">
          <h2 class="text-lg font-bold mb-4 text-right">المخطط السنوي للإجازات</h2>
          <div class="overflow-x-auto border rounded-xl">
              <div class="min-w-[900px]" id="ganttBody">
                  <div class="flex gantt-row bg-gray-50 text-xs font-bold text-center">
                      <div class="min-w-[200px] border-l p-3 sticky right-0 bg-gray-50 z-20">الموظف</div>
                      <div class="flex-1 grid grid-cols-12"><div class="p-3">Jan</div><div class="p-3">Feb</div><div class="p-3">Mar</div><div class="p-3">Apr</div><div class="p-3">May</div><div class="p-3">Jun</div><div class="p-3">Jul</div><div class="p-3">Aug</div><div class="p-3">Sep</div><div class="p-3">Oct</div><div class="p-3">Nov</div><div class="p-3">Dec</div></div>
                  </div>
                  <div id="ganttRows"></div>
              </div>
          </div>
      </section>

      <section class="bg-white rounded-2xl p-6 shadow-sm">
          <table class="w-full text-right text-sm">
              <thead class="bg-blue-50 text-blue-900 font-bold"><tr><th class="p-4">الموظف</th><th class="p-4">من</th><th class="p-4">إلى</th><th class="p-4">الحالة</th><th class="p-4">الإجراء</th></tr></thead>
              <tbody id="planningTable" class="divide-y"></tbody>
          </table>
      </section>
    </div>
  </main>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
  import { getFirestore, doc, onSnapshot, collection, addDoc, updateDoc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  // الإعدادات (نفس الإعدادات الأصلية)
  const firebaseConfig = { apiKey:'AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs', authDomain:'baghethan-ba325.firebaseapp.com', projectId:'baghethan-ba325', storageBucket:'baghethan-ba325.firebasestorage.app', messagingSenderId:'944819735112', appId:'1:944819735112:web:07315600da39377320667d' };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let employees = [], planList = [];

  // نظام تسجيل الدخول
  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('mainContent').classList.remove('hidden');
      document.getElementById('userChip').innerText = user.email;
      bindSnapshots();
    } else {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('mainContent').classList.add('hidden');
    }
  });

  // جلب البيانات
  function bindSnapshots() {
    onSnapshot(doc(db, 'schedule', 'jadwal_v6'), s => {
      employees = s.exists() ? (s.data().data?.emps || []) : [];
      populateSelectors();
      renderPlanning();
    });
    onSnapshot(collection(db, 'vacations'), s => {
      planList = s.docs.map(d => ({ id: d.id, ...d.data() }));
      renderPlanning();
    });
  }

  // تبديل التبويبات
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('bg-blue-600', 'text-white'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('bg-blue-600', 'text-white');
      document.getElementById(btn.dataset.tab).classList.add('active');
    };
  });

  // دوال الإجازات (التصميم الجديد)
  window.addVacationPlan = async () => {
    const id = document.getElementById('pEmp').value;
    const s = document.getElementById('pStart').value;
    const e = document.getElementById('pEnd').value;
    const emp = employees.find(x => x.id === id);
    await addDoc(collection(db, 'vacations'), { empId: id, name: emp.name, from: s, to: e, status: 'pending' });
  };

  function renderPlanning() {
    const rows = document.getElementById('ganttRows');
    const table = document.getElementById('planningTable');
    rows.innerHTML = '';
    table.innerHTML = '';

    employees.filter(e => e.active).forEach(emp => {
      const row = document.createElement('div');
      row.className = 'gantt-row';
      row.innerHTML = `<div class="min-w-[200px] border-l p-3 sticky right-0 bg-white z-20 text-xs font-bold">${emp.name}</div><div class="flex-1 grid grid-cols-12 relative h-full">` + 
                      '<div class="gantt-cell"></div>'.repeat(12) + '</div>';
      
      const timeline = row.querySelector('.relative');
      planList.filter(p => p.empId === emp.id).forEach(p => {
        const start = new Date(p.from), end = new Date(p.to);
        const year = new Date().getFullYear();
        if(start.getFullYear() === year) {
           const offset = (start - new Date(year, 0, 1)) / 86400000;
           const duration = ((end - start) / 86400000) + 1;
           const bar = document.createElement('div');
           bar.className = 'vacation-bar';
           bar.style.right = (offset/365*100) + '%';
           bar.style.width = (duration/365*100) + '%';
           bar.innerText = p.status === 'approved' ? '✓' : '...';
           timeline.appendChild(bar);
        }
      });
      rows.appendChild(row);
    });

    table.innerHTML = planList.map(p => `<tr><td class="p-4">${p.name}</td><td class="p-4">${p.from}</td><td class="p-4">${p.to}</td><td class="p-4">${p.status}</td><td class="p-4"><button onclick="window.approvePlan('${p.id}')" class="text-teal-600 font-bold">قبول</button></td></tr>`).join('');
  }

  function populateSelectors() {
    document.getElementById('pEmp').innerHTML = employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
  }
</script>
</body>
</html>
