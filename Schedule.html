<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تسجيل بيانات</title>
</head>
<body>

  <h2>نموذج تسجيل</h2>

  <input type="text" id="name" placeholder="الاسم"><br><br>
  <input type="text" id="phone" placeholder="رقم الجوال"><br><br>

  <button onclick="saveData()">حفظ</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function saveData() {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;

      if (!name || !phone) {
        alert("يرجى تعبئة جميع الحقول");
        return;
      }

      await addDoc(collection(db, "users"), {
        name: name,
        phone: phone,
        time: new Date()
      });

      alert("تم الحفظ بنجاح ✅");
    }

    window.saveData = saveData;
  </script>

</body>
</html>
