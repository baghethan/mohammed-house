<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تسجيل دخول</title>
</head>
<body>

<h2>إنشاء حساب</h2>
<input type="email" id="email" placeholder="البريد الإلكتروني"><br><br>
<input type="password" id="password" placeholder="كلمة المرور"><br><br>
<button onclick="register()">تسجيل</button>

<hr>

<h2>تسجيل دخول</h2>
<input type="email" id="loginEmail" placeholder="البريد الإلكتروني"><br><br>
<input type="password" id="loginPassword" placeholder="كلمة المرور"><br><br>
<button onclick="login()">دخول</button>

<p id="status"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain: "baghethan-ba325.firebaseapp.com",
  projectId: "baghethan-ba325",
  appId: "1:944819735112:web:07315600da39377320667d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// تسجيل حساب
async function register() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    document.getElementById("status").innerText = "تم إنشاء الحساب ✅";
  } catch (error) {
    document.getElementById("status").innerText = error.message;
  }
}

// تسجيل دخول
async function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("status").innerText = "تم تسجيل الدخول 🎉";
  } catch (error) {
    document.getElementById("status").innerText = error.message;
  }
}

window.register = register;
window.login = login;
</script>

</body>
</html>
