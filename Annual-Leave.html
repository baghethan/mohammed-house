<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annual Leave Management - Almajdouie Motors</title>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--text:#1f2937;--muted:#64748b;--surface:rgba(255,255,255,.94);--surface2:#fff;--shadow:0 18px 50px rgba(13,33,73,.16);--danger:#d32f2f}
    *{box-sizing:border-box} 
    body{margin:0;padding:20px;font-family:'Segoe UI',sans-serif;background:linear-gradient(180deg, rgba(12,31,73,.1), rgba(255,255,255,.2)), url('image_dba186.png') center/cover fixed no-repeat;min-height:100vh;display:flex;justify-content:center}
    .shell{width:100%;max-width:1100px}
    .glass{width:100%;background:var(--surface);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;padding:30px}
    .card{background:var(--surface2);border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:20px;box-shadow:0 10px 24px rgba(0,0,0,.05);margin-bottom:20px}
    .btn,.btn2,.danger-btn{border:none;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer;transition:.2s;font-size:13px}
    .btn{background:#fff;color:var(--primary);border:1px solid #e2e8f0}
    .btn2{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
    .danger-btn{background:var(--danger);color:#fff; padding: 8px 12px;}
    .form-box{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
    input,select{padding:12px 15px;border-radius:12px;border:1px solid #d8dee8;background:#fff;min-height:45px;font-size:14px}
    
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eee}
    thead th{background:#f8fafc;color:var(--primary);font-weight:900;padding:15px;text-align:center;border-bottom:2px solid #eef2f7}
    td{padding:15px;text-align:center;border-bottom:1px solid #f9f9f9}
    .emp-name-cell{text-align:right !important; font-weight:800; color:var(--primary); padding-right:25px}
  </style>
</head>
<body>
<div class="shell">
  <div class="glass">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:20px; margin-bottom:25px">
        <div style="display:flex; align-items:center; gap:15px">
            <img src="LOGO-almajdouie.png" style="height:55px" />
            <div>
                <h2 id="title" style="margin:0; color:var(--primary); font-weight:900; font-size:22px">إدارة الإجازات السنوية</h2>
                <p id="subtitle" style="margin:0; color:var(--muted); font-size:12px; font-weight:700">تخطيط وتوثيق الإجازات - المجدوعي للسيارات</p>
            </div>
        </div>
        <button class="btn" id="btnLang">AR / EN</button>
    </div>

    <div class="card">
        <div class="form-box">
            <select id="aEmp" style="flex:2"><option value="">اختر الموظف...</option></select>
            <input type="date" id="aStart" style="flex:1" />
            <input type="date" id="aEnd" style="flex:1" />
            <button class="btn2" onclick="window.addAnnualLeave()">🌴 تعيين إجازة</button>
        </div>
    </div>

    <div class="card">
        <h3 id="listTitle" style="margin-top:0; color:var(--primary); margin-bottom:20px">🌴 سجل الإجازات السنوية</h3>
        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th id="thName" style="text-align:right; padding-right:25px">الموظف</th>
                        <th id="thFrom">تاريخ البداية</th>
                        <th id="thTo">تاريخ النهاية</th>
                        <th id="thAction">الإجراء</th>
                    </tr>
                </thead>
                <tbody id="annualBody"></tbody>
            </table>
        </div>
    </div>
  </div>
</div>

<script type="module">
import { db, waitForSignedInUser, logFirebaseError } from './firebase-session.js';
import { doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const i18n = {
    ar: { title:'إدارة الإجازات السنوية', subtitle:'تخطيط وتوثيق الإجازات - المجدوعي للسيارات', list:'🌴 سجل الإجازات السنوية', name:'الموظف', from:'من', to:'إلى', action:'الإجراء', selectEmp:'اختر الموظف...', assign:'تعيين إجازة' },
    en: { title:'Annual Leave Management', subtitle:'Leave Planning & Documentation - Almajdouie Motors', list:'🌴 Annual Leave Records', name:'Employee', from:'From', to:'To', action:'Action', selectEmp:'Select Employee...', assign:'Assign Leave' }
};

let employees=[], vacationsList=[], currentLang=localStorage.getItem('lang')||'ar';
const $=id=>document.getElementById(id), tr=()=>i18n[currentLang];

// --- 1. Logic ---
window.addAnnualLeave = async () => {
    const empId = $('aEmp').value;
    const start = $('aStart').value;
    const end = $('aEnd').value;

    if(!empId || !start || !end) {
        alert(currentLang==='ar'?'يرجى إكمال جميع الحقول':'Please complete all fields');
        return;
    }

    const newVacation = { empId, start, end, createdAt: new Date().toISOString() };
    const updatedList = [...vacationsList, newVacation];
    
    await waitForSignedInUser();
    await setDoc(doc(db, 'schedule', 'jadwal_annual_leave'), { vacations: updatedList }, { merge: true });
    
    $('aStart').value = ''; 
    $('aEnd').value = '';
};

window.deleteVacation = async (index) => {
    if(!confirm(currentLang==='ar'?'هل تريد حذف هذه الإجازة؟':'Are you sure you want to delete this leave?')) return;
    const updatedList = vacationsList.filter((_, i) => i !== index);
    await waitForSignedInUser();
    await setDoc(doc(db, 'schedule', 'jadwal_annual_leave'), { vacations: updatedList }, { merge: true });
};

// --- 2. Rendering ---
function renderUI() {
    const t = tr();
    // Dropdown
    const select = $('aEmp');
    const currentVal = select.value;
    select.innerHTML = `<option value="">${t.selectEmp}</option>` + 
        employees.filter(e => e.active).map(e => `<option value="${e.id}">${e.name}</option>`).join('');
    select.value = currentVal;

    // Table
    $('annualBody').innerHTML = vacationsList.map((v, index) => {
        const emp = employees.find(e => e.id === v.empId);
        return `
            <tr>
                <td class="emp-name-cell">${emp ? emp.name : v.empId}</td>
                <td>${v.start}</td>
                <td>${v.end}</td>
                <td>
                    <button class="danger-btn" onclick="window.deleteVacation(${index})">X</button>
                </td>
            </tr>
        `;
    }).join('');
}

// --- 3. Data Sync ---
async function bindSnapshots(){
    await waitForSignedInUser();
    // Fetch Employees
    onSnapshot(doc(db, 'schedule', 'jadwal_v6'), s => {
        employees = s.exists() ? (s.data().data?.emps || []) : [];
        renderUI();
    }, e => logFirebaseError('Annual leave employees listener failed', e));
    // Fetch Vacations
    onSnapshot(doc(db, 'schedule', 'jadwal_annual_leave'), s => {
        vacationsList = s.exists() ? (s.data().vacations || []) : [];
        renderUI();
    }, e => logFirebaseError('Annual leave vacations listener failed', e));
}

$('btnLang').addEventListener('click', () => {
    currentLang = currentLang==='ar'?'en':'ar'; localStorage.setItem('lang', currentLang); location.reload();
});

window.addEventListener('DOMContentLoaded', () => {
    if(currentLang==='en') { $('mainHtml').dir='ltr'; $('mainHtml').lang='en'; }
    const t = tr();
    $('title').innerText = t.title; $('subtitle').innerText = t.subtitle; 
    $('listTitle').innerText = t.list; $('thName').innerText = t.name;
    $('thFrom').innerText = t.from; $('thTo').innerText = t.to; $('thAction').innerText = t.action;
    bindSnapshots().catch(e => logFirebaseError('Annual leave startup failed', e));
});
</script>
</body>
</html>
