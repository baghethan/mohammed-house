<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annual Leave Management - Almajdouie Motors</title>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--text:#1f2937;--muted:#64748b;--surface:rgba(255,255,255,.94);--surface2:#fff;--shadow:0 18px 50px rgba(13,33,73,.16);--danger:#d32f2f}
    *{box-sizing:border-box} 
    body{margin:0;padding:20px;font-family:'Segoe UI',sans-serif;background:linear-gradient(180deg, rgba(12,31,73,.1), rgba(255,255,255,.2)), url('image_dba186.png') center/cover fixed no-repeat;min-height:100vh;display:flex;justify-content:center}
    .shell{width:100%;max-width:1100px}
    .glass{width:100%;background:var(--surface);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;padding:30px}
    .card{background:var(--surface2);border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:20px;box-shadow:0 10px 24px rgba(0,0,0,.05);margin-bottom:20px}
    .btn,.btn2,.danger-btn{border:none;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer;transition:.2s;font-size:13px}
    .btn{background:#fff;color:var(--primary);border:1px solid #e2e8f0}
    .btn2{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
    .danger-btn{background:var(--danger);color:#fff; padding: 8px 12px;}
    .form-box{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
    input,select{padding:12px 15px;border-radius:12px;border:1px solid #d8dee8;background:#fff;min-height:45px;font-size:14px}
    .filter-box{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
    .search-input{min-width:260px;flex:1}
    .request-pill{background:#eef6ff;color:var(--primary);border:1px solid #cfe3ff;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:900;white-space:nowrap}
    .empty-row{color:var(--muted);font-weight:800}
    
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eee}
    thead th{background:#f8fafc;color:var(--primary);font-weight:900;padding:15px;text-align:center;border-bottom:2px solid #eef2f7}
    td{padding:15px;text-align:center;border-bottom:1px solid #f9f9f9}
    .emp-name-cell{text-align:right !important; font-weight:800; color:var(--primary); padding-right:25px}
  </style>
</head>
<body>
<div class="shell">
  <div class="glass">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:20px; margin-bottom:25px">
        <div style="display:flex; align-items:center; gap:15px">
            <img src="LOGO-almajdouie.png" style="height:55px" />
            <div>
                <h2 id="title" style="margin:0; color:var(--primary); font-weight:900; font-size:22px">إدارة الإجازات السنوية</h2>
                <p id="subtitle" style="margin:0; color:var(--muted); font-size:12px; font-weight:700">تخطيط وتوثيق الإجازات - المجدوعي للسيارات</p>
            </div>
        </div>
        <button class="btn" id="btnLang">AR / EN</button>
    </div>

    <div class="card">
        <div class="form-box">
            <select id="aEmp" style="flex:2"><option value="">اختر الموظف...</option></select>
            <select id="aType" style="flex:1">
                <option value="">نوع الإجازة...</option>
                <option value="annual">إجازة سنوية</option>
                <option value="sick">مرضية</option>
                <option value="absence">غياب</option>
            </select>
            <input type="date" id="aStart" style="flex:1" />
            <input type="date" id="aEnd" style="flex:1" />
            <button class="btn2" onclick="window.addAnnualLeave()">🌴 تعيين إجازة</button>
        </div>
    </div>

    <div class="card">
        <h3 id="listTitle" style="margin-top:0; color:var(--primary); margin-bottom:20px">🌴 سجل الإجازات السنوية</h3>
        <div class="filter-box">
            <input id="empSearch" class="search-input" type="search" placeholder="ابحث باسم أو رقم الموظف..." />
            <div id="requestCount" class="request-pill">عدد الطلبات: 0</div>
        </div>
        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th id="thName" style="text-align:right; padding-right:25px">الموظف</th>
                        <th id="thType">نوع الإجازة</th>
                        <th id="thFrom">تاريخ البداية</th>
                        <th id="thTo">تاريخ النهاية</th>
                        <th id="thAction">الإجراء</th>
                    </tr>
                </thead>
                <tbody id="annualBody"></tbody>
            </table>
        </div>
    </div>
  </div>
</div>

<script type="module">
import { db, waitForSignedInUser, logFirebaseError } from './firebase-session.js';
import { collection, doc, onSnapshot, addDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const i18n = {
    ar: { title:'إدارة الإجازات السنوية', subtitle:'تخطيط وتوثيق الإجازات - المجدوعي للسيارات', list:'🌴 سجل الإجازات السنوية', name:'الموظف', type:'نوع الإجازة', from:'من', to:'إلى', action:'الإجراء', selectEmp:'اختر الموظف...', selectType:'نوع الإجازة...', assign:'تعيين إجازة', searchEmp:'ابحث باسم أو رقم الموظف...', requestCount:'عدد الطلبات', allRequests:'كل الطلبات', noRecords:'لا توجد طلبات مطابقة' },
    en: { title:'Annual Leave Management', subtitle:'Leave Planning & Documentation - Almajdouie Motors', list:'🌴 Annual Leave Records', name:'Employee', type:'Leave Type', from:'From', to:'To', action:'Action', selectEmp:'Select Employee...', selectType:'Leave Type...', assign:'Assign Leave', searchEmp:'Search by employee name or number...', requestCount:'Requests', allRequests:'All requests', noRecords:'No matching requests' }
};

const leaveTypes = {
    annual: { ar: 'إجازة سنوية', en: 'Annual Leave' },
    sick: { ar: 'مرضية', en: 'Sick Leave' },
    absence: { ar: 'غياب', en: 'Absence' }
};

let employees=[], vacationsList=[], currentLang=localStorage.getItem('lang')||'ar';
const $=id=>document.getElementById(id), tr=()=>i18n[currentLang];

// --- 1. Logic ---
window.addAnnualLeave = async () => {
    const empId = $('aEmp').value;
    const leaveType = $('aType').value;
    const start = $('aStart').value;
    const end = $('aEnd').value;

    if(!empId || !leaveType || !start || !end) {
        alert(currentLang==='ar'?'يرجى إكمال جميع الحقول':'Please complete all fields');
        return;
    }

    const emp = employees.find(e => String(e.key) === String(empId));
    const now = new Date().toISOString();
    const newVacation = {
        empId,
        employeeDocId: emp?.id || empId,
        employeeName: emp?.name || '',
        start,
        end,
        from: start,
        to: end,
        type: leaveType,
        leaveType,
        leaveTypeLabel: leaveTypes[leaveType]?.en || leaveType,
        status: 'approved',
        createdAt: now,
        updatedAt: now,
        source: 'Annual-Leave'
    };
    
    await waitForSignedInUser();
    await addDoc(collection(db, 'vacations'), newVacation);
    
    $('aStart').value = ''; 
    $('aEnd').value = '';
    $('aType').value = '';
};

window.deleteVacation = async (id) => {
    if(!confirm(currentLang==='ar'?'هل تريد حذف هذه الإجازة؟':'Are you sure you want to delete this leave?')) return;
    await waitForSignedInUser();
    await deleteDoc(doc(db, 'vacations', id));
};

// --- 2. Rendering ---
function renderUI() {
    const t = tr();
    // Dropdown
    const select = $('aEmp');
    const currentVal = select.value;
    select.innerHTML = `<option value="">${t.selectEmp}</option>` + 
        employees.filter(e => e.active !== false).map(e => `<option value="${e.key}">${e.name}</option>`).join('');
    select.value = currentVal;

    const typeSelect = $('aType');
    const currentType = typeSelect.value;
    typeSelect.innerHTML = `<option value="">${t.selectType}</option>` +
        Object.entries(leaveTypes).map(([key, label]) => `<option value="${key}">${label[currentLang]}</option>`).join('');
    typeSelect.value = currentType;

    const searchBox = $('empSearch');
    const searchTerm = String(searchBox?.value || '').trim().toLowerCase();
    const filteredVacations = searchTerm
        ? vacationsList.filter(v => vacationMatchesSearch(v, searchTerm))
        : vacationsList;
    const selectedEmployee = employees.find(e => String(e.key) === String(select.value));
    const selectedCount = selectedEmployee ? countEmployeeVacations(selectedEmployee) : filteredVacations.length;
    $('requestCount').innerText = `${selectedEmployee ? selectedEmployee.name : t.allRequests}: ${t.requestCount} ${selectedCount}`;

    // Table
    $('annualBody').innerHTML = filteredVacations.length ? filteredVacations.map((v) => {
        const emp = findVacationEmployee(v);
        return `
            <tr>
                <td class="emp-name-cell">${emp ? emp.name : getVacationEmployeeLabel(v)}</td>
                <td>${getLeaveTypeLabel(v)}</td>
                <td>${v.start || v.from || ''}</td>
                <td>${v.end || v.to || ''}</td>
                <td>
                    <button class="danger-btn" onclick="window.deleteVacation('${v.id}')">X</button>
                </td>
            </tr>
        `;
    }).join('') : `<tr><td colspan="5" class="empty-row">${t.noRecords}</td></tr>`;
}

// --- 3. Data Sync ---
function normalizeEmployee(record) {
    const empId = record.empId || record.empNum || record.employeeId || record.technicianId || record.id;
    const status = String(record.status || '').toLowerCase();
    return {
        ...record,
        key: String(empId || record.id),
        name: record.name || record.fullName || empId || '',
        active: record.active !== false && !['inactive', 'hidden', 'false', '0'].includes(status)
    };
}

function normalizeLeaveType(value) {
    const text = String(value || '').trim().toLowerCase();
    if (['annual', 'annual leave', 'vacation', 'إجازة سنوية', 'اجازة سنوية'].includes(text)) return 'annual';
    if (['sick', 'sick leave', 'medical', 'مرضية', 'اجازة مرضية', 'إجازة مرضية'].includes(text)) return 'sick';
    if (['absence', 'absent', 'غياب'].includes(text)) return 'absence';
    return text || 'annual';
}

function getLeaveTypeLabel(record) {
    const type = normalizeLeaveType(record.leaveType || record.type);
    return leaveTypes[type]?.[currentLang] || record.leaveTypeLabel || record.type || '';
}

function getEmployeeKeys(emp) {
    return [emp?.key, emp?.id, emp?.empId, emp?.empNum, emp?.employeeId, emp?.technicianId, emp?.fireId]
        .filter(v => v !== undefined && v !== null && String(v).trim() !== '')
        .map(v => String(v));
}

function getVacationEmployeeKeys(record) {
    return [record.empId, record.employeeId, record.employeeDocId, record.technicianId, record.fireId]
        .filter(v => v !== undefined && v !== null && String(v).trim() !== '')
        .map(v => String(v));
}

function vacationMatchesEmployee(record, emp) {
    const employeeKeys = new Set(getEmployeeKeys(emp));
    return getVacationEmployeeKeys(record).some(key => employeeKeys.has(key));
}

function findVacationEmployee(record) {
    return employees.find(emp => vacationMatchesEmployee(record, emp));
}

function getVacationEmployeeLabel(record) {
    return record.employeeName || record.name || record.empId || record.employeeId || record.employeeDocId || '';
}

function vacationMatchesSearch(record, searchTerm) {
    const emp = findVacationEmployee(record);
    const haystack = [
        emp?.name,
        ...getEmployeeKeys(emp),
        getVacationEmployeeLabel(record),
        ...getVacationEmployeeKeys(record)
    ].join(' ').toLowerCase();
    return haystack.includes(searchTerm);
}

function countEmployeeVacations(emp) {
    return vacationsList.filter(v => vacationMatchesEmployee(v, emp)).length;
}

function normalizeVacation(record) {
    const leaveType = normalizeLeaveType(record.leaveType || record.type);
    return {
        ...record,
        empId: record.empId || record.employeeId || record.employeeDocId || record.technicianId || record.fireId || '',
        start: record.start || record.from || '',
        end: record.end || record.to || '',
        leaveType
    };
}

async function bindSnapshots(){
    await waitForSignedInUser();
    // Master employees source: employees only
    onSnapshot(collection(db, 'employees'), s => {
        employees = s.docs.map(item => normalizeEmployee({ id: item.id, ...item.data() }));
        renderUI();
    }, e => logFirebaseError('Annual leave employees listener failed', e));
    // Master vacations source: vacations only
    onSnapshot(collection(db, 'vacations'), s => {
        vacationsList = s.docs.map(item => normalizeVacation({ id: item.id, ...item.data() }));
        renderUI();
    }, e => logFirebaseError('Annual leave vacations listener failed', e));
}

$('btnLang').addEventListener('click', () => {
    currentLang = currentLang==='ar'?'en':'ar'; localStorage.setItem('lang', currentLang); location.reload();
});

window.addEventListener('DOMContentLoaded', () => {
    if(currentLang==='en') { $('mainHtml').dir='ltr'; $('mainHtml').lang='en'; }
    const t = tr();
    $('title').innerText = t.title; $('subtitle').innerText = t.subtitle; 
    $('listTitle').innerText = t.list; $('thName').innerText = t.name;
    $('thType').innerText = t.type; $('thFrom').innerText = t.from; $('thTo').innerText = t.to; $('thAction').innerText = t.action;
    $('empSearch').placeholder = t.searchEmp;
    $('empSearch').addEventListener('input', renderUI);
    $('aEmp').addEventListener('change', renderUI);
    bindSnapshots().catch(e => logFirebaseError('Annual leave startup failed', e));
});
</script>
</body>
</html>
