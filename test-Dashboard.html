<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | شركة المجدوعي للسيارات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-gradient); background-attachment: fixed;
      color: var(--text-main); font-family: 'Cairo', sans-serif; direction: rtl;
    }
    .container { max-width: 1360px; margin: 20px auto; padding: 0 15px 30px; }
    .hidden { display: none !important; }
    
    .card {
      background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 24px; margin-bottom: 20px;
    }

    .dashboard-board { background: rgba(15, 23, 42, 0.4); border-radius: 28px; overflow: hidden; border: 1px solid var(--glass-border); }
    .board-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 750px; direction: ltr; }
    
    /* تعديل الشريط الجانبي والشعارات */
    .side { background: rgba(0, 0, 0, 0.2); border-right: 1px solid var(--glass-border); padding: 20px; direction: rtl; }
    .side-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 20px; }
    
    .brand-item {
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 15px; margin-bottom: 12px; 
      display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
    }
    .brand-logo { 
      width: 80px; height: 60px; /* توحيد المقاس */
      object-fit: contain; /* منع تمدد الشعار */
      background: #fff; border-radius: 8px; padding: 5px; 
    }
    .brand-name { font-size: 13px; font-weight: bold; color: var(--text-main); }

    .main { padding: 25px; direction: rtl; }
    .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 20px; margin-bottom: 20px; overflow: hidden; }
    .panel-header { padding: 15px; border-bottom: 1px solid var(--glass-border); font-weight: bold; color: var(--primary); }
    
    .bars { height: 160px; display: flex; align-items: flex-end; justify-content: space-around; padding: 10px; }
    .bar { width: 30px; border-radius: 8px 8px 4px 4px; position: relative; transition: 0.8s ease; }
    .bar.blue { background: linear-gradient(180deg, #7fc0ff, #4f8fdb); }
    .bar.orange { background: linear-gradient(180deg, #ffb16f, #f97316); }

    button {
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: white; border: none; padding: 10px 20px; border-radius: 12px;
      cursor: pointer; font-weight: bold; transition: 0.3s;
    }
    button.logout-btn { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>

<div class="container">
  <div id="sessionNotice" class="card" style="text-align:center;">
    <h3 style="color:var(--accent-orange)">تنبيه!</h3>
    <p>يرجى تسجيل الدخول أولاً لرؤية بيانات المجدوعي للسيارات.</p>
    <button onclick="window.location.href='login.html'">انتقل لصفحة الدخول</button>
  </div>

  <div id="dashboardRoot" class="hidden">
    <div class="card" style="padding:0;">
      <div style="padding:24px; display:flex; justify-content:space-between; align-items:center;">
        <h3>Dashboard التقييمات | المجدوعي</h3>
        <div style="display:flex; gap:10px;">
            <button id="copyEvalBtn">نسخ الصورة</button>
            <button class="logout-btn" id="logoutBtn">خروج</button>
        </div>
      </div>

      <div id="dashboardCapture" class="dashboard-board">
        <div class="board-layout">
          <aside class="side">
            <div class="side-box"><span>الزيارات الميدانية</span><strong id="sideTotalVisits" style="font-size:32px; color:var(--primary)">0</strong></div>
            <div id="sideBrandList"></div>
          </aside>
          <main class="main">
            <section class="panel">
                <div class="panel-header">ملخص أداء الأقسام</div>
                <div style="padding:20px; display:grid; grid-template-columns: 1fr 1fr; gap:15px; text-align:center;">
                    <div class="side-box"><span>ممتاز</span><strong style="color:var(--accent-green); font-size:28px" id="posCount">0</strong></div>
                    <div class="side-box"><span>يحتاج صيانة</span><strong style="color:var(--accent-orange); font-size:28px" id="negCount">0</strong></div>
                </div>
            </section>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <section class="panel"><div class="panel-header">الشبكات</div><div id="networkPanelBody" class="panel-body"></div></section>
              <section class="panel"><div class="panel-header">الأجهزة</div><div id="hardwarePanelBody" class="panel-body"></div></section>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const $ = id => document.getElementById(id);
  
  let state = { checklists: [], visits: [], brands: [] };

  function render(){
    if ($('sideTotalVisits')) $('sideTotalVisits').textContent = state.visits.length;
    
    // تحسين عرض قائمة البراندات
    if ($('sideBrandList')) {
      $('sideBrandList').innerHTML = state.brands.map(b => `
        <div class="brand-item">
          <img src="${b.logoData || 'https://placehold.jp/24/38bdf8/ffffff/80x60.png?text=LOGO'}" class="brand-logo" alt="logo">
          <div class="brand-name">${b.nameAr || b.brand || 'براند'}</div>
          <div style="font-size:11px; color:var(--text-muted)">زيارات: ${state.visits.filter(v => v.brand === b.brand).length}</div>
        </div>
      `).join('');
    }

    $('posCount').textContent = Math.floor(state.checklists.length * 0.75);
    $('negCount').textContent = Math.floor(state.checklists.length * 0.25);

    const bar = (h, c) => `<div class="bar ${c}" style="height:${h}%"><span style="position:absolute;top:-20px;font-size:9px">${h}%</span></div>`;
    $('networkPanelBody').innerHTML = `<div class="bars">${bar(88,'blue')}${bar(12,'orange')}</div>`;
    $('hardwarePanelBody').innerHTML = `<div class="bars">${bar(75,'orange')}${bar(25,'blue')}</div>`;
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      $('sessionNotice').classList.add('hidden');
      $('dashboardRoot').classList.remove('hidden');
      db.collection('branch_checklists').onSnapshot(s => { state.checklists = s.docs.map(d=>d.data()); render(); });
      db.collection('brand_assets').onSnapshot(s => { state.brands = s.docs.map(d=>d.data()); render(); });
      db.collection('siteVisits').onSnapshot(s => { state.visits = s.docs.map(d=>d.data()); render(); });
    } else {
      $('sessionNotice').classList.remove('hidden');
      $('dashboardRoot').classList.add('hidden');
    }
  });

  $('logoutBtn').onclick = () => auth.signOut().then(() => window.location.href = 'login.html');
  
  $('copyEvalBtn').onclick = async () => {
    const canvas = await html2canvas($('dashboardCapture'), { backgroundColor: '#0f172a', scale: 2 });
    const link = document.createElement('a');
    link.download = 'Almajdouie-Dashboard.png';
    link.href = canvas.toDataURL();
    link.click();
  };
})();
</script>
</body>
</html>
