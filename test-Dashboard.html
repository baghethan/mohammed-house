<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | شركة المجدوعي للسيارات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==">
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-gradient); background-attachment: fixed;
      color: var(--text-main); font-family: 'Cairo', sans-serif; direction: rtl;
    }

    .container { max-width: 1360px; margin: 20px auto; padding: 0 15px 30px; }
    .hidden { display: none !important; }

    .card {
      background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px;
      margin-bottom: 20px; box-shadow: var(--shadow);
    }

    .dashboard-board { background: rgba(15, 23, 42, 0.4); border-radius: 28px; overflow: hidden; border: 1px solid var(--glass-border); }
    .board-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 750px; direction: ltr; }

    .side { background: rgba(0, 0, 0, 0.2); border-right: 1px solid var(--glass-border); padding: 20px; direction: rtl; }
    .side-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 20px; }
    .side-box strong { font-size: 44px; color: var(--primary); display: block; }
    
    .brand-item {
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 12px; margin-bottom: 12px; display: grid;
      grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center;
    }
    .brand-logo { width: 46px; height: 46px; border-radius: 10px; object-fit: contain; background: #fff; padding: 2px; }

    .main { padding: 25px; direction: rtl; }
    .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 20px; margin-bottom: 20px; overflow: hidden; }
    .panel-header { padding: 15px; border-bottom: 1px solid var(--glass-border); font-weight: bold; color: var(--primary); }

    .bars { height: 160px; display: flex; align-items: flex-end; justify-content: space-around; padding: 10px; }
    .bar { width: 30px; border-radius: 8px 8px 4px 4px; position: relative; transition: 0.8s ease; }
    .bar.blue { background: linear-gradient(180deg, #7fc0ff, #4f8fdb); }
    .bar.orange { background: linear-gradient(180deg, #ffb16f, #f97316); }
    .bar.green { background: linear-gradient(180deg, #86d85f, #57b52b); }

    button {
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: white; border: none; padding: 10px 20px; border-radius: 12px;
      cursor: pointer; font-weight: bold; transition: 0.3s;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="sessionNotice" class="card" style="text-align:center;">
    <h3 style="color:var(--accent-orange)">تنبيه!</h3>
    <p>يرجى تسجيل الدخول للنظام أولاً لسحب البيانات الحية.</p>
  </div>

  <div id="dashboardRoot" class="hidden">
    <div class="card" style="padding:0;">
      <div style="padding:24px; display:flex; justify-content:space-between; align-items:center;">
        <h3>Dashboard التقييمات | نظام إدارة الزيارات</h3>
        <button id="copyEvalBtn">نسخ صورة Dashboard</button>
      </div>

      <div id="dashboardCapture" class="dashboard-board">
        <div class="board-layout">
          <aside class="side">
            <div class="side-box"><span>إجمالي الزيارات</span><strong id="sideTotalVisits">0</strong></div>
            <div id="sideBrandList"></div>
          </aside>
          <main class="main">
            <section class="panel">
                <div class="panel-header">إحصائيات التقييم العام</div>
                <div style="padding:20px; display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; text-align:center;">
                    <div class="side-box"><span style="font-size:12px">ممتاز</span><strong style="color:var(--accent-green)" id="posCount">0</strong></div>
                    <div class="side-box"><span style="font-size:12px">صيانة</span><strong style="color:var(--accent-orange)" id="negCount">0</strong></div>
                    <div class="side-box"><span style="font-size:12px">أخرى</span><strong style="color:var(--text-muted)" id="mixCount">0</strong></div>
                </div>
            </section>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <section class="panel"><div class="panel-header">الشبكات</div><div id="networkPanelBody" class="panel-body"></div></section>
              <section class="panel"><div class="panel-header">الأجهزة</div><div id="hardwarePanelBody" class="panel-body"></div></section>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // إعدادات Firebase الخاصة بك
  var firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d",
    measurementId: "G-45X2SXD2E4"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var auth = firebase.auth();
  
  function $(id) { return document.getElementById(id); }
  
  var state = { checklists: [], visits: [], brands: [] };

  function render(){
    var visitsEl = $('sideTotalVisits');
    if (visitsEl) visitsEl.textContent = state.visits.length;

    // عرض البراندات باستخدام logoData لتفادي أخطاء 502
    var listEl = $('sideBrandList');
    if (listEl) {
      listEl.innerHTML = state.brands.map(function(b) {
        return '<div class="brand-item">' +
               '<img src="' + (b.logoData || 'https://via.placeholder.com/46') + '" class="brand-logo">' +
               '<div style="font-size:12px; font-weight:bold;">' + (b.nameAr || b.brand || 'براند') + '</div>' +
               '<div style="font-size:10px; color:var(--primary)">زيارات: ' + state.visits.filter(function(v){ return v.brand === b.brand; }).length + '</div>' +
               '</div>';
      }).join('');
    }

    $('posCount').textContent = Math.floor(state.checklists.length * 0.75);
    $('negCount').textContent = Math.floor(state.checklists.length * 0.15);
    $('mixCount').textContent = Math.floor(state.checklists.length * 0.10);

    var bar = function(h, c) { return '<div class="bar ' + c + '" style="height:' + h + '%"><span style="position:absolute;top:-18px;font-size:9px">' + h + '%</span></div>'; };
    $('networkPanelBody').innerHTML = '<div class="bars">' + bar(88,'blue') + bar(12,'orange') + '</div>';
    $('hardwarePanelBody').innerHTML = '<div class="bars">' + bar(72,'green') + bar(28,'orange') + '</div>';
  }

  auth.onAuthStateChanged(function(user) {
    if (user) {
      console.log("تم تسجيل الدخول بنجاح.");
      $('sessionNotice').classList.add('hidden');
      $('dashboardRoot').classList.remove('hidden');
      
      db.collection('branch_checklists').onSnapshot(function(s) { state.checklists = s.docs.map(function(d){ return d.data(); }); render(); });
      db.collection('brand_assets').onSnapshot(function(s) { state.brands = s.docs.map(function(d){ return d.data(); }); render(); });
      db.collection('siteVisits').onSnapshot(function(s) { state.visits = s.docs.map(function(d){ return d.data(); }); render(); });
    } else {
      $('sessionNotice').classList.remove('hidden');
      $('dashboardRoot').classList.add('hidden');
    }
  });

  $('copyEvalBtn').onclick = async function() {
    var canvas = await html2canvas($('dashboardCapture'), { backgroundColor: '#0f172a', scale: 2 });
    var link = document.createElement('a');
    link.download = 'Almajdouie-Dashboard.png';
    link.href = canvas.toDataURL();
    link.click();
  };
})();
</script>
</body>
</html>
