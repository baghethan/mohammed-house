<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Professional Check-List Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* ألوان احترافية متناسقة */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Cairo', sans-serif;
      line-height: 1.6;
    }

    .container { max-width: 1360px; margin: 20px auto; padding: 0 15px 30px; }

    /* الكروت الزجاجية (Glassmorphism) */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    h3 { color: var(--primary); margin: 0 0 10px 0; font-size: 22px; }
    .muted { color: var(--text-muted); font-size: 14px; }

    /* تحسين المدخلات والأزرار */
    input, select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      width: 100%;
      margin-top: 5px;
    }

    button {
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4); }

    /* تنسيق لوحة البيانات (The Board) */
    .dashboard-board {
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }

    .side { background: rgba(255, 255, 255, 0.02); border-left: 1px solid var(--glass-border); }
    
    .brand-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      transition: 0.3s;
    }

    .brand-item:hover { background: rgba(255, 255, 255, 0.1); }

    /* الرسوم البيانية */
    .donut-hole { background: #1e293b !important; }
    .panel { 
        background: rgba(255, 255, 255, 0.03); 
        border: 1px solid var(--glass-border);
        border-radius: 18px;
    }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
    </body>
</html>
