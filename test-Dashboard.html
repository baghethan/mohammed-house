<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | شركة المجدوعي للسيارات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --blue: #4f8fdb; --blue2: #7fc0ff; 
      --orange: #f97316; --orange2: #ffb16f; 
      --green: #57b52b; --green2: #86d85f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-gradient); background-attachment: fixed;
      color: var(--text-main); font-family: 'Cairo', sans-serif;
    }

    .container { max-width: 1360px; margin: 20px auto; padding: 0 15px 30px; }
    .hidden { display: none !important; }

    .card {
      background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px;
      margin-bottom: 20px; box-shadow: var(--shadow);
    }

    button {
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: white; border: none; padding: 12px 24px; border-radius: 12px;
      cursor: pointer; font-weight: bold; transition: 0.3s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3); }

    input, select { 
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); 
      color: #fff; padding: 12px; border-radius: 12px; width: 100%; margin-top: 5px;
    }

    .dashboard-board { background: rgba(15, 23, 42, 0.4); border-radius: 28px; overflow: hidden; border: 1px solid var(--glass-border); }
    .board-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 750px; direction: ltr; }

    .side { background: rgba(0, 0, 0, 0.2); border-right: 1px solid var(--glass-border); padding: 20px; direction: rtl; }
    .side-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 20px; }
    .side-box strong { font-size: 44px; color: var(--primary); display: block; }
    
    .brand-item {
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 12px; margin-bottom: 12px; display: grid;
      grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; transition: 0.3s;
    }

    .main { padding: 25px; direction: rtl; }
    .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 20px; margin-bottom: 20px; overflow: hidden; }
    .panel-header { padding: 15px; border-bottom: 1px solid var(--glass-border); font-weight: bold; color: var(--primary); }

    .donut { width: 180px; height: 180px; border-radius: 50%; margin: auto; position: relative; }
    .donut-hole { position: absolute; inset: 25px; border-radius: 50%; background: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .bars { height: 160px; display: flex; align-items: flex-end; justify-content: space-around; padding: 10px; }
    .bar { width: 30px; border-radius: 8px 8px 4px 4px; position: relative; transition: 0.8s ease; }
    .bar.blue { background: linear-gradient(180deg, var(--blue2), var(--blue)); }
    .bar.orange { background: linear-gradient(180deg, var(--orange2), var(--orange)); }
    .bar.green { background: linear-gradient(180deg, var(--green2), var(--green)); }
  </style>
</head>
<body>

<div class="container">
  <div id="sessionNotice" class="card" style="text-align:center;">
    <h3 style="color:var(--accent-orange)">تنبيه!</h3>
    <p>يرجى تسجيل الدخول للنظام أولاً لسحب البيانات من Firestore.</p>
  </div>

  <div id="dashboardRoot" class="hidden">
    <div class="card">
      <h3>فلاتر الفترة</h3>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
        <div><label class="text-muted">نوع الفترة</label>
          <select id="periodMode"><option value="all">كل التواريخ</option><option value="month">شهر محدد</option></select>
        </div>
        <div><label class="text-muted">التاريخ</label><input type="month" id="filterMonth"></div>
      </div>
      <button id="applyDateFilter" style="margin-top:20px;">تطبيق الفلتر</button>
    </div>

    <div class="card" style="padding:0;">
      <div style="padding:24px; display:flex; justify-content:space-between; align-items:center;">
        <h3>Dashboard التقييمات | شركة المجدوعي</h3>
        <button id="copyEvalBtn">نسخ صورة Dashboard</button>
      </div>

      <div id="dashboardCapture" class="dashboard-board">
        <div class="board-layout">
          <aside class="side">
            <div class="side-box"><span class="text-muted">البراندات المزورة</span><strong id="sideTotalBrands">0</strong></div>
            <div id="sideBrandList"></div>
          </aside>
          <main class="main">
            <section class="panel"><div class="panel-header">Overall Assessment</div><div class="panel-body" id="overallPanelBody"></div></section>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <section class="panel"><div class="panel-header">Network</div><div id="networkPanelBody"></div></section>
              <section class="panel"><div class="panel-header">Hardware</div><div id="hardwarePanelBody"></div></section>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // تم استخراج هذه البيانات من الصورة التي أرسلتها
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d",
    measurementId: "G-45X2SXD2E4"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  var $ = function(id){ return document.getElementById(id); };
  var state = { checklists: [], visits: [], brands: [] };

  function renderBar(val, color) {
    return `<div class="bar ${color}" style="height:${Math.max(val, 5)}%"><span style="position:absolute;top:-20px;font-size:10px">${val}%</span></div>`;
  }

  function render(){
    // البراندات
    $('sideTotalBrands').textContent = state.visits.length;
    $('sideBrandList').innerHTML = state.brands.map(b => `
      <div class="brand-item">
        <img src="${b.logoUrl || ''}" class="brand-logo" onerror="this.src='https://via.placeholder.com/46'">
        <div class="brand-name">${b.brandName || b.name || 'براند'}</div>
        <div style="font-size:10px">${Math.floor(Math.random()*100)}%</div>
      </div>
    `).join('');

    // التقييم العام (مثال)
    $('overallPanelBody').innerHTML = `
      <div class="donut" style="background:conic-gradient(var(--primary) 0% 75%, rgba(255,255,255,0.1) 75% 100%)">
        <div class="donut-hole"><strong>75%</strong><span class="text-muted">النتيجة</span></div>
      </div>
    `;
    
    // الأقسام
    $('networkPanelBody').innerHTML = `<div class="bars">${renderBar(80, 'blue')}${renderBar(20, 'orange')}</div>`;
    $('hardwarePanelBody').innerHTML = `<div class="bars">${renderBar(65, 'green')}${renderBar(35, 'orange')}</div>`;
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      $('sessionNotice').classList.add('hidden');
      $('dashboardRoot').classList.remove('hidden');
      // بدء جلب البيانات من المجموعات التي تظهر في Firestore لديك
      db.collection('branch_checklists').onSnapshot(s => { state.checklists = s.docs.map(d=>d.data()); render(); });
      db.collection('brand_assets').onSnapshot(s => { state.brands = s.docs.map(d=>d.data()); render(); });
      db.collection('siteVisits').onSnapshot(s => { state.visits = s.docs.map(d=>d.data()); render(); });
    }
  });

  $('copyEvalBtn').onclick = async () => {
    const canvas = await html2canvas($('dashboardCapture'), { backgroundColor: '#0f172a', scale: 2 });
    const link = document.createElement('a');
    link.download = 'Almajdouie-Dashboard.png';
    link.href = canvas.toDataURL();
    link.click();
  };
})();
</script>
</body>
</html>
