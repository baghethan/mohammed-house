<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | المجدوعي للسيارات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --deep: #0b3048; --deep2: #0d405e; --deep3: #07283d; --deep4: #123f5c; /* [cite: 2] */
      --blue: #4f8fdb; --orange: #f97316; --green: #57b52b; /* [cite: 2] */
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Cairo', sans-serif;
    }

    .container { max-width: 1360px; margin: 20px auto; padding: 0 15px 30px; } /* [cite: 3] */
    .hidden { display: none !important; } /* [cite: 3] */

    /* التصميم الزجاجي للكروت */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .session-note { /* [cite: 3] */
      background: rgba(255, 247, 230, 0.1);
      border: 1px solid #f5d08a;
      color: #f5d08a;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    /* تحسين الأزرار والقوائم */
    button { /* [cite: 3] */
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: white; border: none; padding: 10px 20px; border-radius: 12px;
      cursor: pointer; font-weight: bold; transition: 0.3s;
    }
    button.light { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border); }

    .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; } /* [cite: 3] */
    input, select { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: #fff; padding: 10px; border-radius: 10px; width: 100%; }

    /* اللوحة الرئيسية */
    .dashboard-board { background: var(--deep); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); } /* [cite: 4] */
    .board-layout { display: grid; grid-template-columns: 260px 1fr; direction: ltr; } /* [cite: 4] */
    
    .side { background: rgba(0,0,0,0.2); border-right: 1px solid var(--glass-border); padding: 20px; direction: rtl; } /* [cite: 4] */
    .main { padding: 20px; direction: rtl; } /* [cite: 6] */

    .panel { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 18px; margin-bottom: 15px; } /* [cite: 6] */
    .panel-header { padding: 12px; border-bottom: 1px solid var(--glass-border); }
    
    /* الدائرة البيانية */
    .donut { width: 180px; height: 180px; border-radius: 50%; margin: auto; position: relative; } /* [cite: 6] */
    .donut-hole { position: absolute; inset: 25px; border-radius: 50%; background: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div class="container">
  <div id="sessionNotice" class="session-note">الرجاء تسجيل الدخول من الصفحة الرئيسية أولًا لرؤية البيانات.</div>

  <div id="dashboardRoot" class="hidden"> <div class="card">
      <h3>فلاتر البحث</h3>
      <div class="filters-grid">
        <div><label>نوع الفترة</label>
          <select id="periodMode"><option value="all">كل التواريخ</option><option value="month">شهر</option></select>
        </div>
        <div><label>التاريخ</label><input type="month" id="filterMonth"></div>
      </div>
      <div style="margin-top:15px;">
        <button id="applyDateFilter">تطبيق الفلتر</button>
        <button id="resetDateFilter" class="light">إعادة تعيين</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3>Check-List Dashboard</h3>
        <button id="copyEvalBtn">نسخ صورة Dashboard</button>
      </div>

      <div id="dashboardCapture" class="dashboard-board">
        <div class="board-layout">
          <aside class="side">
            <div style="text-align:center; margin-bottom:20px;">
              <h4 style="color:var(--primary)">البراندات المزورة</h4>
              <strong id="sideTotalBrands" style="font-size:32px;">0</strong>
            </div>
            <div id="sideBrandList"></div>
          </aside>

          <main class="main">
            <div id="overallPanel" class="panel">
              <div class="panel-header">التقييم العام</div>
              <div class="panel-body" id="overallPanelBody" style="padding:20px;"></div>
            </div>
            <div id="networkPanel" class="panel"><div class="panel-header">الشبكات</div><div class="panel-body" id="networkPanelBody"></div></div>
          </main>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
  // ملاحظة: هذا السكريبت يتوقع وجود Firebase في النافذة الأب (window.parent) [cite: 140]
  (function(){
    var $ = function(id){ return document.getElementById(id); };
    
    // محاكاة بسيطة للتشغيل في حال كنت تفتح الملف للتجربة فقط بدون سيرفر
    if (!window.parent || !window.parent.firebase) {
        console.log("Firebase not found, showing layout for preview.");
        $('sessionNotice').innerHTML = "نمط المعاينة: (Firebase غير متصل)";
        $('dashboardRoot').classList.remove('hidden');
    }

    // هنا تضع بقية منطق الـ JavaScript الخاص بك من الملف الأصلي...
    // [cite: 29 - 142]
  })();
</script>

</body>
</html>
