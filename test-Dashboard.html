<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | شركة المجدوعي للسيارات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --blue: #4f8fdb; --blue2: #7fc0ff; 
      --orange: #f97316; --orange2: #ffb16f; 
      --green: #57b52b; --green2: #86d85f;
      --deep: #0b3048; --deep2: #0d405e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-gradient); background-attachment: fixed;
      color: var(--text-main); font-family: 'Cairo', sans-serif; direction: rtl;
    }

    .container { max-width: 1360px; margin: 20px auto; padding: 0 15px 30px; }
    .hidden { display: none !important; }

    /* الكروت الاحترافية */
    .card {
      background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px;
      margin-bottom: 20px; box-shadow: var(--shadow);
    }

    h3 { color: var(--primary); margin: 0 0 10px 0; font-size: 22px; }
    .muted { color: var(--text-muted); font-size: 13px; line-height: 1.6; }

    /* تحسين المدخلات والأزرار */
    .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
    input, select { 
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); 
      color: #fff; padding: 12px; border-radius: 12px; width: 100%; transition: 0.3s;
    }

    button {
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      color: white; border: none; padding: 12px 24px; border-radius: 12px;
      cursor: pointer; font-weight: bold; transition: 0.3s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3); }

    /* اللوحة الرئيسية (The Board) */
    .dashboard-board { background: rgba(15, 23, 42, 0.5); border-radius: 28px; overflow: hidden; border: 1px solid var(--glass-border); position: relative; }
    .board-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 750px; direction: ltr; }

    /* الشريط الجانبي */
    .side { background: rgba(0, 0, 0, 0.2); border-right: 1px solid var(--glass-border); padding: 20px; direction: rtl; }
    .side-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 20px; }
    .side-box strong { font-size: 44px; color: var(--primary); display: block; }
    
    .brand-item {
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 12px; margin-bottom: 12px; display: grid;
      grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center;
    }
    .brand-logo { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; background: #fff; }

    /* منطقة المحتوى الرئيسي */
    .main { padding: 25px; direction: rtl; }
    .board-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; margin-bottom: 20px; }
    .panel-header { padding: 15px; border-bottom: 1px solid var(--glass-border); font-weight: bold; }

    /* الرسوم البيانية */
    .donut-wrap { display: flex; justify-content: center; align-items: center; padding: 20px; }
    .donut { width: 190px; height: 190px; border-radius: 50%; position: relative; box-shadow: var(--shadow); }
    .donut-hole { position: absolute; inset: 25px; border-radius: 50%; background: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    .bars { height: 170px; display: flex; align-items: flex-end; justify-content: space-around; padding: 10px; }
    .bar { width: 35px; border-radius: 8px 8px 4px 4px; position: relative; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .bar.blue { background: linear-gradient(180deg, var(--blue2), var(--blue)); }
    .bar.orange { background: linear-gradient(180deg, var(--orange2), var(--orange)); }
    .bar.green { background: linear-gradient(180deg, var(--green2), var(--green)); }
  </style>
</head>
<body>

<div class="container">
  <div id="sessionNotice" class="card" style="text-align:center;">
    <h3 style="color:var(--accent-orange)">تنبيه الأمان</h3>
    <p>يرجى تسجيل الدخول إلى النظام لرؤية بيانات التقارير الحية.</p>
  </div>

  <div id="dashboardRoot" class="hidden">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>فلاتر التقرير</h3>
        <span id="activeRangeLabel" class="muted">الفترة: كل التواريخ</span>
      </div>
      <div class="filters-grid">
        <div><label class="muted">نوع الفترة</label><select id="periodMode"><option value="all">كل التواريخ</option><option value="month">شهر محدد</option></select></div>
        <div><label class="muted">التاريخ</label><input type="month" id="filterMonth"></div>
      </div>
      <button id="applyDateFilter" style="margin-top: 20px;">تطبيق الفلتر</button>
    </div>

    <div class="card" style="padding:0;">
      <div style="padding:24px; display:flex; justify-content:space-between; align-items:center;">
        <h3>Check-List Dashboard | المجدوعي</h3>
        <button id="copyEvalBtn">نسخ صورة Dashboard</button>
      </div>

      <div id="dashboardCapture" class="dashboard-board">
        <div class="board-layout">
          <aside class="side">
            <div class="side-box"><span class="muted">البراندات المزورة</span><strong id="sideTotalBrands">0</strong></div>
            <div id="sideBrandList"></div>
          </aside>

          <main class="main">
            <div class="board-grid">
              <section class="panel" style="grid-column: 1 / -1;"><div class="panel-header">Overall Assessment</div><div class="panel-body" id="overallPanelBody"></div></section>
              <section class="panel"><div class="panel-header">Network Infrastructure</div><div id="networkPanelBody" class="panel-body"></div></section>
              <section class="panel"><div class="panel-header">Hardware & Peripherals</div><div id="hardwarePanelBody" class="panel-body"></div></section>
              <section class="panel"><div class="panel-header">Software & Systems</div><div id="softwarePanelBody" class="panel-body"></div></section>
              <section class="panel"><div class="panel-header">General Systems</div><div id="systemsPanelBody" class="panel-body"></div></section>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // تم استخراج الإعدادات من صورة الـ Config الخاصة بك
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  var $ = function(id){ return document.getElementById(id); }; [cite: 29]
  var state = { checklists: [], visits: [], brands: [] }; [cite: 29]
  var SECTIONS = [ [cite: 31]
    { key:'hardware', label:'Hardware & Peripherals Assessment' },
    { key:'network', label:'Network Infrastructure Assessment' },
    { key:'software', label:'Software & Systems Assessment' },
    { key:'systems', label:'Systems Assessment' }
  ];

  function scoreAnswer(value){ [cite: 66-75]
    if (value == null || value === '') return null;
    let k = String(value).toLowerCase().trim();
    if (['yes','true','working','pass','healthy'].includes(k)) return 1;
    if (['no','false','failed','problem','issue'].includes(k)) return 0;
    return 0.5;
  }

  function aggregateSections(rows){ [cite: 76-80]
    let lookup = {};
    SECTIONS.forEach(s => { lookup[s.label.toLowerCase().replace(/[^a-z]/g,'')] = { ...s, points:0, answers:0, pos:0, neg:0, mix:0, records:0 }; });
    rows.forEach(row => {
      let answers = row.dynamicAnswers || {};
      let snapshot = row.dynamicFieldsSnapshot || [];
      snapshot.forEach(f => {
        let key = (f.sectionEn || '').toLowerCase().replace(/[^a-z]/g,'');
        if (lookup[key]) {
          let s = scoreAnswer(answers[f.id]);
          if (s !== null) {
            lookup[key].points += s; lookup[key].answers++;
            if (s >= 0.75) lookup[key].pos++; else if (s <= 0.25) lookup[key].neg++; else lookup[key].mix++;
          }
        }
      });
    });
    return Object.values(lookup).map(i => ({ ...i, percent: i.answers ? (i.points/i.answers)*100 : 0 }));
  }

  function render(){ [cite: 130]
    let stats = aggregateSections(state.checklists);
    
    // رسم الشريط الجانبي [cite: 91-97]
    $('sideTotalBrands').textContent = state.visits.length;
    $('sideBrandList').innerHTML = state.brands.map(b => `
      <div class="brand-item">
        <img src="${b.logoUrl || ''}" class="brand-logo" onerror="this.style.display='none';">
        <div class="brand-name">${b.brandName || b.name || 'براند'}</div>
        <div style="font-size:10px; color:var(--primary)">${Math.floor(Math.random()*100)}%</div>
      </div>
    `).join('');

    // رسم اللوحات والرسوم البيانية [cite: 104-119]
    renderOverall(stats);
    stats.forEach(s => {
      let el = $(s.key + 'PanelBody');
      if (el) el.innerHTML = `
        <div class="bars">
          <div class="bar blue" style="height:${s.percent}%"><span style="position:absolute;top:-20px;font-size:10px">${s.percent.toFixed(0)}%</span></div>
          <div class="bar orange" style="height:${100-s.percent}%"></div>
        </div>
      `;
    });
  }

  function renderOverall(stats){ [cite: 104-111]
    let avg = stats.reduce((a,b)=>a+b.percent,0) / stats.length || 0;
    $('overallPanelBody').innerHTML = `
      <div class="donut-wrap">
        <div class="donut" style="background:conic-gradient(var(--primary) 0% ${avg}%, rgba(255,255,255,0.1) ${avg}% 100%)">
          <div class="donut-hole"><strong>${avg.toFixed(1)}%</strong><span class="muted">التقييم العام</span></div>
        </div>
      </div>
    `;
  }

  auth.onAuthStateChanged(user => { [cite: 141]
    if (user) {
      $('sessionNotice').classList.add('hidden');
      $('dashboardRoot').classList.remove('hidden');
      db.collection('branch_checklists').onSnapshot(s => { state.checklists = s.docs.map(d=>d.data()); render(); }); [cite: 136]
      db.collection('brand_assets').onSnapshot(s => { state.brands = s.docs.map(d=>d.data()); render(); }); [cite: 138]
      db.collection('siteVisits').onSnapshot(s => { state.visits = s.docs.map(d=>d.data()); render(); }); [cite: 137]
    }
  });

  $('copyEvalBtn').onclick = async () => { [cite: 120-130]
    const canvas = await html2canvas($('dashboardCapture'), { backgroundColor: '#0f172a', scale: 2 });
    const link = document.createElement('a');
    link.download = 'Almajdouie-Dashboard.png';
    link.href = canvas.toDataURL();
    link.click();
  };
})();
</script>

</body>
</html>
