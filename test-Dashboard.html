<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Test | نظام المجدوعي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==">
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --text-main: #f1f5f9;
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-gradient); background-attachment: fixed;
      color: var(--text-main); font-family: 'Cairo', sans-serif; direction: rtl;
    }
    .container { max-width: 1360px; margin: 20px auto; padding: 0 15px 30px; }
    .hidden { display: none !important; }
    .card {
      background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow);
    }
    .dashboard-board { background: rgba(15, 23, 42, 0.4); border-radius: 28px; overflow: hidden; border: 1px solid var(--glass-border); }
    .board-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 750px; direction: ltr; }
    .side { background: rgba(0, 0, 0, 0.2); border-right: 1px solid var(--glass-border); padding: 20px; direction: rtl; }
    .side-box { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 20px; }
    .side-box strong { font-size: 44px; color: var(--primary); display: block; }
    .brand-item {
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 12px; margin-bottom: 12px; display: grid;
      grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center;
    }
    .brand-logo { width: 46px; height: 46px; border-radius: 10px; object-fit: contain; background: #fff; padding: 2px; }
    .main { padding: 25px; direction: rtl; }
    .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 20px; margin-bottom: 20px; overflow: hidden; }
    .panel-header { padding: 15px; border-bottom: 1px solid var(--glass-border); font-weight: bold; color: var(--primary); }
    .bars { height: 160px; display: flex; align-items: flex-end; justify-content: space-around; padding: 10px; }
    .bar { width: 30px; border-radius: 8px; position: relative; transition: 0.5s ease; }
    .bar.blue { background: #4f8fdb; }
    .bar.orange { background: #f97316; }
    button { background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div id="sessionNotice" class="card" style="text-align:center;">
    <h3 style="color:var(--accent-orange)">وضع المعاينة (تجريبي)</h3>
    <p>أنت تشاهد التصميم حالياً. للربط مع البيانات الحية، يرجى تسجيل الدخول من صفحة login.html.</p>
    <button id="showPreviewBtn">إظهار اللوحة للتجربة</button>
  </div>

  <div id="dashboardRoot" class="hidden">
    <div class="card" style="padding:0;">
      <div style="padding:24px; display:flex; justify-content:space-between; align-items:center;">
        <h3>Dashboard التقييمات | بيئة الاختبار</h3>
        <button id="copyEvalBtn">نسخ الصورة</button>
      </div>

      <div id="dashboardCapture" class="dashboard-board">
        <div class="board-layout">
          <aside class="side">
            <div class="side-box"><span>إجمالي الزيارات</span><strong id="sideTotalVisits">0</strong></div>
            <div id="sideBrandList"></div>
          </aside>
          <main class="main">
            <section class="panel">
                <div class="panel-header">ملخص الأداء الميداني</div>
                <div style="padding:20px; display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; text-align:center;">
                    <div class="side-box"><span>حالة ممتازة</span><strong style="color:var(--accent-green)" id="posCount">0</strong></div>
                    <div class="side-box"><span>تحت الصيانة</span><strong style="color:var(--accent-orange)" id="negCount">0</strong></div>
                </div>
            </section>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <section class="panel"><div class="panel-header">قسم الشبكات</div><div id="networkPanelBody" class="panel-body"></div></section>
              <section class="panel"><div class="panel-header">قسم الأجهزة</div><div id="hardwarePanelBody" class="panel-body"></div></section>
            </div>
          </main>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // إعدادات Firebase من مشروعك
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  
  const $ = id => document.getElementById(id);
  let state = { checklists: [], visits: [], brands: [] };

  function render(){
    if($('sideTotalVisits')) $('sideTotalVisits').textContent = state.visits.length || "9"; // قيمة افتراضية للاختبار
    
    // عرض البراندات مع حماية من الأخطاء
    if($('sideBrandList')) {
      $('sideBrandList').innerHTML = state.brands.length > 0 ? state.brands.map(b => `
        <div class="brand-item">
          <img src="${b.logoData || 'https://via.placeholder.com/46'}" class="brand-logo">
          <div style="font-size:12px; font-weight:bold;">${b.nameAr || b.brand || 'براند'}</div>
          <div style="font-size:10px">زيارات: ${state.visits.filter(v => v.brand === b.brand).length}</div>
        </div>
      `).join('') : '<div class="muted">بانتظار البيانات...</div>';
    }

    $('posCount').textContent = state.checklists.length || "75%";
    $('negCount').textContent = "25%";

    const bar = (h, c) => `<div class="bar ${c}" style="height:${h}%"><span style="position:absolute;top:-20px;font-size:9px">${h}%</span></div>`;
    $('networkPanelBody').innerHTML = `<div class="bars">${bar(85,'blue')}${bar(15,'orange')}</div>`;
    $('hardwarePanelBody').innerHTML = `<div class="bars">${bar(60,'orange')}${bar(40,'blue')}</div>`;
  }

  // السماح بالدخول للمعاينة قبل الربط كما طلبت
  $('showPreviewBtn').onclick = () => {
    $('sessionNotice').classList.add('hidden');
    $('dashboardRoot').classList.remove('hidden');
    render();
  };

  // الربط التلقائي عند تسجيل الدخول الفعلي
  auth.onAuthStateChanged(user => {
    if (user) {
      $('sessionNotice').classList.add('hidden');
      $('dashboardRoot').classList.remove('hidden');
      db.collection('branch_checklists').onSnapshot(s => { state.checklists = s.docs.map(d => d.data()); render(); });
      db.collection('brand_assets').onSnapshot(s => { state.brands = s.docs.map(d => d.data()); render(); });
      db.collection('siteVisits').onSnapshot(s => { state.visits = s.docs.map(d => d.data()); render(); });
    }
  });

  $('copyEvalBtn').onclick = async () => {
    const canvas = await html2canvas($('dashboardCapture'), { backgroundColor: '#0f172a', scale: 2 });
    const link = document.createElement('a');
    link.download = 'Dashboard_Test.png';
    link.href = canvas.toDataURL();
    link.click();
  };
})();
</script>
</body>
</html>
