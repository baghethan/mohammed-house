<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Advanced Site Visits Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e2e8f0; --header-blue: #0d4b73; --text-dark: #1e293b;
      --bar-blue: #4f8fdb; --bar-orange: #f97316; --bar-gray: #94a3b8; --bar-green: #57b52b;
    }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text-dark); }
    .dashboard { display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden; }

    /* الشريط الجانبي (Visits) */
    .sidebar { background: #fff; border-left: 3px solid var(--header-blue); padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .side-num { font-size: 72px; font-weight: 800; color: var(--header-blue); margin: 0; }

    /* الشبكة الرئيسية (مثل PowerPoint) */
    .main-grid { display: grid; grid-template-columns: 1.5fr 1fr; grid-template-rows: auto auto; gap: 15px; padding: 20px; overflow-y: auto; }
    .card { background: #fff; border-radius: 4px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .card-header { background: var(--header-blue); color: #fff; padding: 10px 15px; font-size: 14px; font-weight: bold; }
    .card-subheader { background: #f1f5f9; padding: 5px 15px; font-size: 12px; border-bottom: 1px solid #ddd; }
    .card-body { padding: 15px; flex-grow: 1; display: flex; align-items: flex-end; justify-content: space-around; min-height: 180px; }

    /* تنسيق الأعمدة البيانية */
    .bar-group { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 60px; }
    .bar-container { display: flex; align-items: flex-end; gap: 4px; height: 120px; width: 100%; justify-content: center; }
    .bar { width: 18px; border-radius: 2px 2px 0 0; position: relative; transition: 0.5s ease-out; }
    .bar-val { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: bold; }
    .bar-label { font-size: 10px; color: #64748b; text-align: center; line-height: 1.2; }
  </style>
</head>
<body>

<div class="dashboard">
  <aside class="sidebar">
    <div style="text-align:center; margin-top:20px;">
        <span style="font-size:14px; font-weight:bold;">Number of Visits</span>
        <h1 class="side-num" id="totalVisits">0</h1>
    </div>
    <div id="brandList" style="width:100%; margin-top:30px;"></div>
  </aside>

  <main class="main-grid">
    <div class="card" style="grid-column: span 1;">
      <div class="card-header">Network Infrastructure Services</div>
      <div class="card-subheader">Network Appliances</div>
      <div class="card-body" id="networkChart"></div>
    </div>

    <div class="card">
      <div class="card-header">End User Services</div>
      <div class="card-subheader">PCs & Peripherals</div>
      <div class="card-body" id="endUserChart"></div>
    </div>

    <div class="card">
      <div class="card-header">Network Infrastructure Services</div>
      <div class="card-subheader">Connectivity Status</div>
      <div class="card-body" id="connectivityChart"></div>
    </div>
  </main>
</div>

<script>
(function(){
  // محاكي للبيانات القادمة من صورتك لغرض الاختبار
  // في النسخة الحقيقية، هذه البيانات تأتي من Firestore snapshot
  const mockData = [
    { 
      dynamicAnswers: { 
        "0NQrLqvsNNYgd0Iyy6by": "fully_functioning", // End User
        "8LQ9F3Rj4MsNDkTbO5Pi": "in_shape",          // Network
        "BcjdipZxDmVgodHk9t1B": "above_the_range",   // Connectivity
        "6fx4HNunJZrYPziv5r02": "no"                 // Requires Service
      }
    }
  ];

  function processData(docs) {
    let stats = {
      network: { in_shape: 0, requires: 0 },
      endUser: { fully: 0, requires: 0 },
      conn: { above: 0, within: 0, below: 0 }
    };

    docs.forEach(doc => {
      const ans = doc.dynamicAnswers || {};
      // قراءة القيم بناءً على المعرفات في صورتك
      if (ans["8LQ9F3Rj4MsNDkTbO5Pi"] === "in_shape") stats.network.in_shape++;
      if (ans["0NQrLqvsNNYgd0Iyy6by"] === "fully_functioning") stats.endUser.fully++;
      if (ans["BcjdipZxDmVgodHk9t1B"] === "above_the_range") stats.conn.above++;
      if (ans["6fx4HNunJZrYPziv5r02"] === "no") stats.endUser.requires++;
    });

    renderCharts(stats, docs.length);
  }

  function renderCharts(stats, total) {
    $('totalVisits').textContent = total;
    
    // رسم الشبكة (مثال لعمود واحد)
    $('networkChart').innerHTML = createBarGroup("Infrastructure", (stats.network.in_shape/total)*100, "var(--bar-gray)");
    $('endUserChart').innerHTML = createBarGroup("PCs", (stats.endUser.fully/total)*100, "var(--bar-blue)") + 
                                  createBarGroup("Service", (stats.endUser.requires/total)*100, "var(--bar-orange)");
    $('connectivityChart').innerHTML = createBarGroup("Server Room", (stats.conn.above/total)*100, "var(--bar-orange)");
  }

  function createBarGroup(label, percent, color) {
    return `
      <div class="bar-group">
        <div class="bar-container">
          <div class="bar" style="height:${percent}%; background:${color}">
            <span class="bar-val">${Math.round(percent)}%</span>
          </div>
        </div>
        <div class="bar-label">${label}</div>
      </div>
    `;
  }

  const $ = id => document.getElementById(id);
  
  // تشغيل المحلل
  processData(mockData);

  // ملاحظة للمستخدم: اربط هذا الجزء بـ db.collection('branch_checklists').onSnapshot ليعمل بشكل حي
})();
</script>
</body>
</html>
