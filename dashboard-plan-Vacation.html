<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vacation Dashboard - Almajdouie Motors</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--text:#1f2937;--muted:#64748b;--surface:rgba(255,255,255,.94);--surface2:#fff;--shadow:0 18px 50px rgba(13,33,73,.16);
    --morning-bg:#e0f2fe; --morning-t:#0369a1; --night-bg:#f3e8ff; --night-t:#7e22ce; --oncall-bg:#ecfeff; --oncall-t:#0e7490; --off-bg:#f1f5f9; --off-t:#475569; --annual-bg:#fef2f2; --annual-t:#b91c1c; --work-bg:#f0fdf4; --work-t:#15803d}
    *{box-sizing:border-box} 
    body{margin:0;padding:20px;font-family:'Segoe UI',sans-serif;background:linear-gradient(180deg, rgba(12,31,73,.1), rgba(255,255,255,.2)), url('image_dba186.png') center/cover fixed no-repeat;min-height:100vh;display:flex;justify-content:center}
    .shell{width:100%;max-width:1300px}
    .glass{width:100%;background:var(--surface);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;padding:30px}
    .btn2{border:none;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;transition:.2s}
    .btn{background:#fff;color:var(--primary);border:1px solid #e2e8f0;border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:20px;margin-bottom:24px}
    .stat-card{background:#fff;padding:24px;border-radius:24px;border-bottom:6px solid var(--primary);box-shadow:0 10px 30px rgba(0,0,0,.04);text-align:center}
    .stat-val{font-size:36px;font-weight:900;color:var(--primary);margin:8px 0}
    .card{background:var(--surface2);border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:20px;box-shadow:0 10px 24px rgba(0,0,0,.05)}
    .row{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    .gantt-bar-db{position:absolute;height:28px;top:50%;transform:translateY(-50%);border-radius:14px;color:#fff;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 10px;z-index:5;cursor:pointer;box-shadow:0 3px 10px rgba(15,23,42,.12)}
    .gantt-bar-db:hover{filter:brightness(1.08);transform:translateY(-50%) scale(1.02);z-index:8}
    .gname-db{padding:0 15px;font-weight:800;color:var(--primary);font-size:11px;border-left:1px solid #f1f5f9;height:100%;display:flex;align-items:center;justify-content:flex-end;gap:7px;background:#fafbfc}
    .new-plan-badge{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:4px 7px;border-radius:999px;background:#dc2626;color:#fff;font-size:9px;font-weight:900;line-height:1;box-shadow:0 3px 10px rgba(220,38,38,.22);animation:newPulse 1.8s infinite}
    .new-year-badge{display:inline-flex;align-items:center;justify-content:center;padding:4px 7px;border-radius:999px;background:#7c3aed;color:#fff;font-size:9px;font-weight:900;line-height:1}
    @keyframes newPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    .plan-modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999;backdrop-filter:blur(4px)}
    .plan-modal.show{display:flex}
    .plan-modal-card{width:min(720px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 25px 70px rgba(0,0,0,.28);padding:22px;position:relative}
    .plan-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;border-bottom:1px solid #e5e7eb;padding-bottom:14px;margin-bottom:16px}
    .plan-modal-title{font-size:20px;font-weight:900;color:var(--primary);margin:0}
    .modal-close{border:none;background:#f1f5f9;color:#334155;width:38px;height:38px;border-radius:12px;font-size:20px;font-weight:900;cursor:pointer}
    .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .detail-box{border:1px solid #e5e7eb;border-radius:14px;padding:12px;background:#f8fafc}
    .detail-label{font-size:10px;font-weight:900;color:var(--muted);margin-bottom:5px}
    .detail-value{font-size:13px;font-weight:900;color:var(--text);word-break:break-word}
    .edit-yes{color:#b91c1c}.edit-no{color:#15803d}
    .history-wrap{margin-top:16px;border-top:1px solid #e5e7eb;padding-top:14px}
    .history-item{border:1px solid #dbeafe;background:#eff6ff;border-radius:14px;padding:12px;margin-top:10px;font-size:12px;line-height:1.7}
    .history-arrow{font-weight:900;color:var(--primary)}
    @media(max-width:650px){.detail-grid{grid-template-columns:1fr}.plan-modal-card{padding:16px}}
  </style>
</head>
<body>
<div class="shell">
  <div class="glass">
    <div class="row" style="justify-content:space-between; margin-bottom:20px">
        <button class="btn" id="btnLang">AR / EN</button>
        <button class="btn2" id="copyDashboardBtn">📋 نسخ التقرير كصورة</button>
    </div>

    <div id="dashboardCaptureArea" style="padding:20px; background:#f8fafc; border-radius:24px">
        <div class="row" style="border-bottom:2px solid #eee; padding-bottom:15px; margin-bottom:20px">
            <img src="LOGO-almajdouie.png" style="height:60px" />
            <div>
                <h2 id="dbBrand" style="margin:0;font-weight:900;color:var(--primary)">المجدوعي للسيارات</h2>
                <p id="dbSub" style="margin:0;color:var(--muted);font-weight:700">تقرير إحصائيات الإجازات السنوية</p>
            </div>
        </div>

        <div class="stat-grid" id="dashboardStats"></div>
        <div id="newPlanNotice" style="display:none;margin:-8px 0 18px;padding:12px 16px;border:1px solid #fecaca;background:#fff1f2;color:#991b1b;border-radius:14px;font-weight:900;font-size:12px"></div>

        <div class="card">
            <div class="row" style="justify-content:space-between">
                <h3 id="dbGanttTitle" style="margin:0;color:var(--primary)">📉 المخطط الزمني الذكي</h3>
                <div class="row" style="margin:0">
                    <select id="dbYear" onchange="window.refreshDashboard()" class="btn" aria-label="Year"></select>
                    <select id="dbViewRange" onchange="window.refreshDashboard()" class="btn">
                        <option value="year">Full Year</option>
                        <option value="q1">Q1</option>
                        <option value="q2">Q2</option>
                        <option value="q3">Q3</option>
                        <option value="q4">Q4</option>
                    </select>
                </div>
            </div>
            <center>
                <div id="rangeIndicator" style="border:2px solid #ef4444;color:#ef4444;padding:5px 30px;border-radius:10px;font-weight:900;margin:10px 0">السنة كاملة</div>
            </center>
            <div id="dbGanttArea" style="min-width:1100px; background:#fff; border-radius:16px; border:1px solid #eef2f7; overflow:hidden"></div>
        </div>
    </div>
  </div>
</div>

<div class="plan-modal" id="planDetailsModal" aria-hidden="true">
  <div class="plan-modal-card" role="dialog" aria-modal="true" aria-labelledby="planModalTitle">
    <div class="plan-modal-head">
      <div>
        <h3 class="plan-modal-title" id="planModalTitle">تفاصيل خطة الإجازة</h3>
        <div id="planModalSub" style="font-size:11px;color:var(--muted);font-weight:800;margin-top:4px"></div>
      </div>
      <button type="button" class="modal-close" id="planModalClose" aria-label="Close">×</button>
    </div>
    <div id="planModalBody"></div>
  </div>
</div>

<script type="module">
import { db, waitForSignedInUser, logFirebaseError } from './firebase-session.js';
import { doc, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const i18n = {
    ar: {
        brand:'المجدوعي للسيارات', dbSub:'تقرير إحصائيات الإجازات السنوية', ganttTitle:'📉 المخطط الزمني الذكي',
        total:'إجمالي الإجازات', active:'نشطة اليوم', pending:'طلبات معلقة', newPlans:'خطط جديدة', employee:'الموظف',
        months:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],
        year:'السنة كاملة', newBadge:'جديد', newYearBadge:'سنة جديدة', from:'من', to:'إلى', status:'الحالة', added:'تمت الإضافة'
    },
    en: {
        brand:'Almajdouie Motors', dbSub:'Annual Leave Statistics Report', ganttTitle:'📉 Smart Timeline',
        total:'Total Leaves', active:'Active Today', pending:'Pending', newPlans:'New Plans', employee:'Employee',
        months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
        year:'Full Year', newBadge:'NEW', newYearBadge:'NEW YEAR', from:'From', to:'To', status:'Status', added:'Added'
    }
};

let employees=[], planList=[], currentLang=localStorage.getItem('lang')||'ar';
const $=id=>document.getElementById(id), tr=()=>i18n[currentLang];

// يبقى ثابتاً طوال جلسة فتح اللوحة، حتى تظل علامة "جديد" ظاهرة أثناء المراجعة.
const dashboardPreviousSeenAt = localStorage.getItem('vacationDashboardLastSeenAt') || '';
const dashboardOpenedAt = new Date().toISOString();

function escapeHtml(value){
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function validDate(value){
    const d = value ? new Date(value) : null;
    return d && !Number.isNaN(d.getTime()) ? d : null;
}

function getPlanYear(plan){
    const d = validDate(plan?.from);
    return d ? d.getFullYear() : null;
}

function isPlanNew(plan){
    const created = validDate(plan?.createdAt);
    if(!created) return false;
    if(!dashboardPreviousSeenAt) {
        // أول استخدام للميزة: نعتبر الإضافات خلال آخر 14 يوماً جديدة فقط.
        return (Date.now() - created.getTime()) <= 14 * 24 * 60 * 60 * 1000;
    }
    const seen = validDate(dashboardPreviousSeenAt);
    return !!seen && created > seen;
}

function updateYearOptions(){
    const yearSelect = $('dbYear');
    if(!yearSelect) return;
    const currentYear = new Date().getFullYear();
    const years = [...new Set(planList.map(getPlanYear).filter(Boolean))].sort((a,b)=>b-a);
    if(!years.includes(currentYear)) years.push(currentYear);
    years.sort((a,b)=>b-a);

    const oldValue = Number(yearSelect.value);
    const newestUnseenYear = [...new Set(planList.filter(isPlanNew).map(getPlanYear).filter(Boolean))].sort((a,b)=>b-a)[0];
    yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
    if(years.includes(oldValue)) yearSelect.value = String(oldValue);
    else if(newestUnseenYear && years.includes(newestUnseenYear)) yearSelect.value = String(newestUnseenYear);
    else if(years.includes(currentYear)) yearSelect.value = String(currentYear);
    else if(years.length) yearSelect.value = String(years[0]);
}

function statusText(status){
    const s = String(status || 'pending').toLowerCase();
    if(currentLang === 'ar') {
        if(s === 'approved') return 'معتمدة';
        if(s === 'cancelled') return 'ملغاة';
        return 'معلقة';
    }
    if(s === 'approved') return 'Approved';
    if(s === 'cancelled') return 'Cancelled';
    return 'Pending';
}

function formatDate(value){
    const d = validDate(value);
    if(!d) return value || '-';
    if(/^\d{4}-\d{2}-\d{2}$/.test(String(value))) {
        return d.toLocaleDateString(currentLang==='ar'?'ar-SA':'en-GB', {year:'numeric',month:'long',day:'numeric'});
    }
    return d.toLocaleString(currentLang==='ar'?'ar-SA':'en-GB', {year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function detailBox(label, value, extraClass=''){
    return `<div class="detail-box"><div class="detail-label">${escapeHtml(label)}</div><div class="detail-value ${extraClass}">${escapeHtml(value ?? '-')}</div></div>`;
}

window.openPlanDetails = id => {
    const p = planList.find(item => String(item.id) === String(id));
    if(!p) return;
    const t = tr();
    const edited = Number(p.editCount || 0) > 0 || !!p.updatedAt;
    const creator = p.createdByName || p.createdByEmail || '-';
    const updater = p.updatedByName || p.updatedByEmail || '-';
    const history = Array.isArray(p.editHistory) ? p.editHistory : [];
    const modal = $('planDetailsModal');
    $('planModalTitle').textContent = currentLang==='ar' ? 'تفاصيل خطة الإجازة' : 'Vacation Plan Details';
    $('planModalSub').textContent = p.name || p.empId || p.employeeId || '';

    let historyHtml = '';
    if(edited){
        if(history.length){
            historyHtml = `<div class="history-wrap"><div style="font-weight:900;color:var(--primary)">${currentLang==='ar'?'سجل التعديلات':'Edit History'}</div>` + history.map((h, i) => `
                <div class="history-item">
                  <div><strong>${currentLang==='ar'?'التعديل':'Edit'} ${i+1}</strong> — ${escapeHtml(formatDate(h.changedAt || ''))}</div>
                  <div><span class="history-arrow">${escapeHtml(h.previousFrom || '-')} → ${escapeHtml(h.newFrom || '-')}</span></div>
                  <div><span class="history-arrow">${escapeHtml(h.previousTo || '-')} → ${escapeHtml(h.newTo || '-')}</span></div>
                  <div>${currentLang==='ar'?'بواسطة':'By'}: ${escapeHtml(h.changedByName || h.changedByEmail || '-')}</div>
                </div>`).join('') + `</div>`;
        } else {
            historyHtml = `<div class="history-wrap"><div class="history-item">${currentLang==='ar'?'تم تعديل هذه الخطة سابقًا، لكن التاريخ السابق غير محفوظ لأن التعديل تم قبل إضافة سجل التعديلات.':'This plan was edited before edit history tracking was added, so the previous dates are not available.'}</div></div>`;
        }
    }

    $('planModalBody').innerHTML = `
      <div class="detail-grid">
        ${detailBox(currentLang==='ar'?'الموظف':'Employee', p.name || p.empId || p.employeeId || '-')}
        ${detailBox(t.status, statusText(p.status))}
        ${detailBox(t.from, `${p.from || '-'} — ${formatDate(p.from)}`)}
        ${detailBox(t.to, `${p.to || '-'} — ${formatDate(p.to)}`)}
        ${detailBox(currentLang==='ar'?'تم التعديل؟':'Edited?', edited ? (currentLang==='ar'?'نعم':'Yes') : (currentLang==='ar'?'لا':'No'), edited?'edit-yes':'edit-no')}
        ${detailBox(currentLang==='ar'?'عدد التعديلات':'Edit Count', String(p.editCount || 0))}
        ${detailBox(currentLang==='ar'?'وقت الإضافة':'Created At', formatDate(p.createdAt))}
        ${detailBox(currentLang==='ar'?'أضيفت بواسطة':'Created By', creator)}
        ${detailBox(currentLang==='ar'?'آخر تعديل':'Last Updated', edited ? formatDate(p.updatedAt) : (currentLang==='ar'?'لا يوجد تعديل':'Not edited'))}
        ${detailBox(currentLang==='ar'?'عدلها':'Updated By', edited ? updater : '-')}
      </div>
      ${historyHtml}
    `;
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
};

window.closePlanDetails = () => {
    const modal = $('planDetailsModal');
    if(!modal) return;
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
};

window.refreshDashboard = () => {
    const t = tr();
    updateYearOptions();
    const selectedYear = Number($('dbYear')?.value || new Date().getFullYear());
    const range = $('dbViewRange').value;
    const rangeMap = { 'year':[0,11,t.year], 'q1':[0,2,'Q1'], 'q2':[3,5,'Q2'], 'q3':[6,8,'Q3'], 'q4':[9,11,'Q4'] };
    const [sm, em, txt] = rangeMap[range];
    $('rangeIndicator').innerText = `${txt} - ${selectedYear}`;

    const yearPlans = planList.filter(p => getPlanYear(p) === selectedYear);
    const filtered = yearPlans.filter(p => {
        const d = validDate(p.from);
        const m = d ? d.getMonth() : -1;
        return m>=sm && m<=em;
    });
    const newPlans = filtered.filter(isPlanNew);
    const allNewPlans = planList.filter(isPlanNew);
    const notice = $('newPlanNotice');
    if(notice){
        if(allNewPlans.length){
            const people = [...new Set(allNewPlans.map(p => `${p.name || p.empId || p.employeeId || 'Employee'} (${getPlanYear(p) || '-'})`))];
            notice.style.display = 'block';
            notice.innerHTML = `🆕 ${currentLang==='ar'?'يوجد خطط إجازة جديدة':'New vacation plans'}: ${escapeHtml(people.join('، '))}`;
        } else {
            notice.style.display = 'none';
            notice.innerHTML = '';
        }
    }

    $('dashboardStats').innerHTML = `
        <div class="stat-card" style="border-color:#1e40af"><div style="font-size:11px;font-weight:800;color:var(--muted)">${t.total}</div><div class="stat-val">${filtered.length}</div></div>
        <div class="stat-card" style="border-color:#10b981"><div style="font-size:11px;font-weight:800;color:var(--muted)">${t.active}</div><div class="stat-val">${yearPlans.filter(p=>{const f=validDate(p.from),to=validDate(p.to),now=new Date();return f&&to&&now>=f&&now<=to;}).length}</div></div>
        <div class="stat-card" style="border-color:#f59e0b"><div style="font-size:11px;font-weight:800;color:var(--muted)">${t.pending}</div><div class="stat-val">${yearPlans.filter(p=>p.status==='pending').length}</div></div>
        <div class="stat-card" style="border-color:#dc2626"><div style="font-size:11px;font-weight:800;color:var(--muted)">🆕 ${t.newPlans}</div><div class="stat-val">${newPlans.length}</div></div>`;

    let html = `<div style="display:grid;grid-template-columns:220px 1fr;background:var(--primary);color:#fff;font-weight:800;font-size:11px"><div style="padding:12px;text-align:center">${t.employee}</div><div style="display:grid;grid-template-columns:repeat(${em-sm+1},1fr)">`;
    for(let i=sm; i<=em; i++) html += `<div style="padding:12px;text-align:center;border-left:1px solid rgba(255,255,255,0.1)">${t.months[i]}</div>`;
    html += `</div></div>`;

    const grouped = {};
    filtered.forEach(p => {
        const key = p.name || p.empId || p.employeeId || 'Employee';
        if(!grouped[key]) grouped[key] = [];
        grouped[key].push(p);
    });

    Object.keys(grouped).sort((a,b)=>a.localeCompare(b, currentLang==='ar'?'ar':'en')).forEach(name => {
        const personPlans = grouped[name];
        const hasNew = personPlans.some(isPlanNew);
        const hasFutureYearPlan = selectedYear > new Date().getFullYear();
        const badges = `${hasNew ? `<span class="new-plan-badge" title="${escapeHtml(t.newPlans)}">🆕 ${escapeHtml(t.newBadge)}</span>` : ''}${hasFutureYearPlan ? `<span class="new-year-badge">${escapeHtml(t.newYearBadge)}</span>` : ''}`;

        html += `<div style="display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid #f1f5f9;min-height:58px;align-items:center"><div class="gname-db">${escapeHtml(name)} ${badges}</div><div style="display:grid;grid-template-columns:repeat(${em-sm+1},1fr);position:relative;min-height:58px">`;
        personPlans.forEach((p, idx) => {
            const d1 = validDate(p.from);
            const d2 = validDate(p.to);
            if(!d1 || !d2) return;
            const sM = Math.max(d1.getMonth(), sm);
            const eM = Math.min(d2.getMonth(), em);
            const mWidth = 100 / (em-sm+1);
            const leftIndex = (sM-sm)*mWidth;
            const spanMonths = Math.max(1, eM-sM+1);
            const barWidth = Math.max(mWidth-0.5, spanMonths*mWidth-0.5);
            const colors = ['#1e40af', '#0f766e', '#6d28d9'];
            const tooltip = `${t.from}: ${p.from || '-'}  |  ${t.to}: ${p.to || '-'}  |  ${t.status}: ${statusText(p.status)}${p.createdAt ? `  |  ${t.added}: ${new Date(p.createdAt).toLocaleString(currentLang==='ar'?'ar-SA':'en-GB')}` : ''}`;
            html += `<div class="gantt-bar-db" role="button" tabindex="0" onclick="window.openPlanDetails('${String(p.id).replace(/'/g, "\\'")}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.openPlanDetails('${String(p.id).replace(/'/g, "\\'")}')}" title="${escapeHtml(tooltip)}" aria-label="${escapeHtml(tooltip)}" style="${currentLang==='ar'?'right':'left'}:${leftIndex}%; width:${barWidth}%; background:${colors[idx%3]}">${escapeHtml(p.from || '')}${isPlanNew(p)?' 🆕':''}</div>`;
        });
        html += `</div></div>`;
    });

    if(!Object.keys(grouped).length){
        html += `<div style="padding:28px;text-align:center;color:var(--muted);font-weight:800">${currentLang==='ar'?'لا توجد خطط إجازة في هذه الفترة':'No vacation plans in this period'}</div>`;
    }

    $('dbGanttArea').innerHTML = html;
};

async function bindSnapshots(){
    await waitForSignedInUser();
    onSnapshot(collection(db,'employees'), s=>{ employees=s.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.active!==false && String(e.status||'active').toLowerCase()!=='inactive'); window.refreshDashboard(); }, e=>logFirebaseError('Employees dashboard listener failed', e));
    onSnapshot(collection(db,'vacations'), s=>{ planList=s.docs.map(d=>({id:d.id,...d.data()})); window.refreshDashboard(); localStorage.setItem('vacationDashboardLastSeenAt', dashboardOpenedAt); }, e=>logFirebaseError('Schedule dashboard vacations listener failed', e));
}

$('btnLang').addEventListener('click', ()=>{ currentLang=currentLang==='ar'?'en':'ar'; localStorage.setItem('lang',currentLang); location.reload(); });
$('copyDashboardBtn').addEventListener('click', async () => {
    const canvas = await html2canvas($('dashboardCaptureArea'), { scale: 3, backgroundColor: "#f8fafc", useCORS: true });
    canvas.toBlob(async b => { await navigator.clipboard.write([new ClipboardItem({"image/png":b})]); alert("✅ تم النسخ!"); });
});

$('planModalClose').addEventListener('click', window.closePlanDetails);
$('planDetailsModal').addEventListener('click', event => { if(event.target === $('planDetailsModal')) window.closePlanDetails(); });
document.addEventListener('keydown', event => { if(event.key === 'Escape') window.closePlanDetails(); });

window.addEventListener('DOMContentLoaded', () => { 
    if(currentLang==='en') { $('mainHtml').dir='ltr'; $('mainHtml').lang='en'; }
    $('dbBrand').innerText = tr().brand; $('dbSub').innerText = tr().dbSub; $('dbGanttTitle').innerText = tr().ganttTitle;
    bindSnapshots().catch(e=>logFirebaseError('Schedule dashboard startup failed', e));
});
</script>
