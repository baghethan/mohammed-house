<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vacation Dashboard - Almajdouie Motors</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root{--primary:#0d2149;--primary2:#1b4fa3;--text:#1f2937;--muted:#64748b;--surface:rgba(255,255,255,.94);--surface2:#fff;--shadow:0 18px 50px rgba(13,33,73,.16);
    --morning-bg:#e0f2fe; --morning-t:#0369a1; --night-bg:#f3e8ff; --night-t:#7e22ce; --oncall-bg:#ecfeff; --oncall-t:#0e7490; --off-bg:#f1f5f9; --off-t:#475569; --annual-bg:#fef2f2; --annual-t:#b91c1c; --work-bg:#f0fdf4; --work-t:#15803d}
    *{box-sizing:border-box} 
    body{margin:0;padding:20px;font-family:'Segoe UI',sans-serif;background:linear-gradient(180deg, rgba(12,31,73,.1), rgba(255,255,255,.2)), url('image_dba186.png') center/cover fixed no-repeat;min-height:100vh;display:flex;justify-content:center}
    .shell{width:100%;max-width:1300px}
    .glass{width:100%;background:var(--surface);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;padding:30px}
    .btn2{border:none;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;transition:.2s}
    .btn{background:#fff;color:var(--primary);border:1px solid #e2e8f0;border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:20px;margin-bottom:24px}
    .stat-card{background:#fff;padding:24px;border-radius:24px;border-bottom:6px solid var(--primary);box-shadow:0 10px 30px rgba(0,0,0,.04);text-align:center}
    .stat-val{font-size:36px;font-weight:900;color:var(--primary);margin:8px 0}
    .card{background:var(--surface2);border:1px solid rgba(15,23,42,.08);border-radius:18px;padding:20px;box-shadow:0 10px 24px rgba(0,0,0,.05)}
    .row{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    .gantt-bar-db{position:absolute;height:28px;top:50%;transform:translateY(-50%);border-radius:14px;color:#fff;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 10px;z-index:5;border:none;cursor:pointer;font-family:inherit}
    .gantt-bar-db:hover{filter:brightness(1.08);box-shadow:0 4px 12px rgba(13,33,73,.20)}
    .gantt-bar-db:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .gname-db{padding:0 15px;font-weight:800;color:var(--primary);font-size:11px;border-left:1px solid #f1f5f9;height:100%;display:flex;align-items:center;justify-content:flex-end;background:#fafbfc}
    .plan-modal-overlay{position:fixed;inset:0;background:rgba(2,6,23,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}
    .plan-modal-overlay.show{display:flex}
    .plan-modal{width:min(620px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 28px 80px rgba(0,0,0,.26);border:1px solid #e2e8f0}
    .plan-modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid #e2e8f0;background:#f8fafc;position:sticky;top:0;z-index:2}
    .plan-modal-title{font-size:18px;font-weight:900;color:var(--primary)}
    .plan-modal-close{border:none;background:#fff;border:1px solid #e2e8f0;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px;color:#475569}
    .plan-modal-body{padding:20px}
    .plan-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .plan-detail{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:12px;min-width:0}
    .plan-detail-label{font-size:10px;font-weight:900;color:#64748b;margin-bottom:5px}
    .plan-detail-value{font-size:13px;font-weight:900;color:#0f172a;word-break:break-word}
    .plan-detail.full{grid-column:1/-1}
    .plan-change-badge{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:900}
    .plan-change-badge.changed{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
    .plan-change-badge.unchanged{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
    .plan-history{margin-top:16px;border-top:1px solid #e2e8f0;padding-top:14px}
    .plan-history-title{font-size:13px;font-weight:900;color:var(--primary);margin-bottom:8px}
    .plan-history-item{padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid #e5e7eb;margin-top:7px;font-size:11px;color:#334155;line-height:1.6}
    @media(max-width:560px){.plan-detail-grid{grid-template-columns:1fr}.plan-detail.full{grid-column:auto}}
  </style>
</head>
<body>
<div class="shell">
  <div class="glass">
    <div class="row" style="justify-content:space-between; margin-bottom:20px">
        <button class="btn" id="btnLang">AR / EN</button>
        <button class="btn2" id="copyDashboardBtn">📋 نسخ التقرير كصورة</button>
    </div>

    <div id="dashboardCaptureArea" style="padding:20px; background:#f8fafc; border-radius:24px">
        <div class="row" style="border-bottom:2px solid #eee; padding-bottom:15px; margin-bottom:20px">
            <img src="LOGO-almajdouie.png" style="height:60px" />
            <div>
                <h2 id="dbBrand" style="margin:0;font-weight:900;color:var(--primary)">المجدوعي للسيارات</h2>
                <p id="dbSub" style="margin:0;color:var(--muted);font-weight:700">تقرير إحصائيات الإجازات السنوية</p>
            </div>
        </div>

        <div class="stat-grid" id="dashboardStats"></div>

        <div class="card">
            <div class="row" style="justify-content:space-between">
                <h3 id="dbGanttTitle" style="margin:0;color:var(--primary)">📉 المخطط الزمني الذكي</h3>
                <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                    <select id="dbYear" onchange="window.refreshDashboard()" class="btn" aria-label="Year"></select>
                    <select id="dbViewRange" onchange="window.refreshDashboard()" class="btn">
                        <option value="year">Full Year</option>
                        <option value="q1">Q1</option>
                        <option value="q2">Q2</option>
                        <option value="q3">Q3</option>
                        <option value="q4">Q4</option>
                    </select>
                </div>
            </div>
            <center>
                <div id="rangeIndicator" style="border:2px solid #ef4444;color:#ef4444;padding:5px 30px;border-radius:10px;font-weight:900;margin:10px 0">السنة كاملة</div>
            </center>
            <div id="dbGanttArea" style="min-width:1100px; background:#fff; border-radius:16px; border:1px solid #eef2f7; overflow:hidden"></div>
        </div>
    </div>
  </div>
</div>

<div class="plan-modal-overlay" id="planDetailsOverlay" role="dialog" aria-modal="true" aria-labelledby="planDetailsTitle">
  <div class="plan-modal">
    <div class="plan-modal-head">
      <div class="plan-modal-title" id="planDetailsTitle">تفاصيل خطة الإجازة</div>
      <button type="button" class="plan-modal-close" id="planDetailsClose" aria-label="إغلاق">×</button>
    </div>
    <div class="plan-modal-body" id="planDetailsBody"></div>
  </div>
</div>

<script type="module">
import { db, waitForSignedInUser, logFirebaseError } from './firebase-session.js';
import { doc, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const i18n = {
    ar: { brand:'المجدوعي للسيارات', dbSub:'تقرير إحصائيات الإجازات السنوية', ganttTitle:'📉 المخطط الزمني الذكي', total:'إجمالي الإجازات', active:'نشطة اليوم', pending:'طلبات معلقة', employee:'الموظف', months:['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'], year:'السنة كاملة', yearLabel:'السنة', detailsTitle:'تفاصيل خطة الإجازة', from:'من', to:'إلى', days:'عدد الأيام', status:'الحالة', createdAt:'تم إنشاء الخطة', updatedAt:'آخر تحديث', changed:'تم التعديل', yes:'نعم', no:'لا', notRecorded:'غير مسجل', history:'سجل التغييرات', createdBy:'أضيف بواسطة', updatedBy:'آخر تعديل بواسطة' },
    en: { brand:'Almajdouie Motors', dbSub:'Annual Leave Statistics Report', ganttTitle:'📉 Smart Timeline', total:'Total Leaves', active:'Active Today', pending:'Pending', employee:'Employee', months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], year:'Full Year', yearLabel:'Year', detailsTitle:'Vacation Plan Details', from:'From', to:'To', days:'Days', status:'Status', createdAt:'Plan Created', updatedAt:'Last Updated', changed:'Modified', yes:'Yes', no:'No', notRecorded:'Not recorded', history:'Change History', createdBy:'Created By', updatedBy:'Last Updated By' }
};

let employees=[], planList=[], currentLang=localStorage.getItem('lang')||'ar';
const $=id=>document.getElementById(id), tr=()=>i18n[currentLang];

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>\"']/g, char => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[char]);
}

function normalizeEmployeeKey(value) {
    return String(value ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function employeeIdentityKeys(emp) {
    return [
        emp?.id, emp?.empId, emp?.empNum, emp?.employeeId, emp?.employeeDocId,
        emp?.technicianId, emp?.fireId, emp?.email, emp?.name, emp?.fullName
    ].filter(Boolean).map(normalizeEmployeeKey);
}

function planEmployeeKeys(plan) {
    return [
        plan?.empId, plan?.empNum, plan?.employeeId, plan?.employeeDocId,
        plan?.technicianId, plan?.fireId, plan?.email, plan?.employeeName, plan?.name
    ].filter(Boolean).map(normalizeEmployeeKey);
}

function findPlanEmployee(plan) {
    const keys = new Set(planEmployeeKeys(plan));
    if (!keys.size) return null;
    return employees.find(emp => employeeIdentityKeys(emp).some(key => keys.has(key))) || null;
}

function looksLikeEmployeeNumber(value) {
    return /^\d+$/.test(String(value ?? '').trim());
}

function resolveEmployeeName(plan) {
    const emp = findPlanEmployee(plan);
    if (emp) return emp.name || emp.fullName || emp.empNum || emp.empId || emp.id || '';

    const labels = [plan?.employeeName, plan?.name].filter(Boolean);
    const readable = labels.find(value => !looksLikeEmployeeNumber(value));
    if (readable) return String(readable).trim();

    return String(labels[0] || plan?.empNum || plan?.empId || plan?.employeeId || plan?.employeeDocId || '—').trim();
}

function resolveEmployeeGroupKey(plan) {
    const emp = findPlanEmployee(plan);
    if (emp) return normalizeEmployeeKey(emp.id || emp.empNum || emp.empId || emp.email || emp.name);
    return planEmployeeKeys(plan)[0] || `plan:${plan?.id || Math.random()}`;
}

function parseDateOnly(value) {
    const match = String(value || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (!match) return null;
    const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    return Number.isNaN(date.getTime()) ? null : date;
}

function planYears(plan) {
    const start = parseDateOnly(plan?.from || plan?.start);
    const end = parseDateOnly(plan?.to || plan?.end) || start;
    if (!start) return [];
    const first = start.getFullYear();
    const last = end ? end.getFullYear() : first;
    const years = [];
    for (let year = Math.min(first, last); year <= Math.max(first, last); year++) years.push(year);
    return years;
}

function availablePlanYears() {
    const years = new Set();
    planList.forEach(plan => planYears(plan).forEach(year => years.add(year)));
    if (!years.size) years.add(new Date().getFullYear());
    return Array.from(years).sort((a, b) => a - b);
}

function syncYearOptions() {
    const select = $('dbYear');
    if (!select) return new Date().getFullYear();
    const years = availablePlanYears();
    const previous = Number(select.value);
    const currentYear = new Date().getFullYear();
    const fallback = years.includes(currentYear) ? currentYear : years[years.length - 1];
    const selected = years.includes(previous) ? previous : fallback;
    select.innerHTML = years.map(year => `<option value=\"${year}\">${year}</option>`).join('');
    select.value = String(selected);
    return selected;
}

function planOverlapsYear(plan, year) {
    return planYears(plan).includes(Number(year));
}

function planStartMonthForYear(plan, year) {
    const start = parseDateOnly(plan?.from || plan?.start);
    if (!start) return -1;
    return start.getFullYear() < Number(year) ? 0 : start.getMonth();
}

function inclusiveDays(fromValue, toValue) {
    const from = parseDateOnly(fromValue);
    const to = parseDateOnly(toValue) || from;
    if (!from || !to) return 0;
    const a = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
    const b = Date.UTC(to.getFullYear(), to.getMonth(), to.getDate());
    return Math.max(1, Math.floor((b - a) / 86400000) + 1);
}

function timestampToDate(value) {
    if (!value) return null;
    if (value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
    if (typeof value?.toDate === 'function') {
        const date = value.toDate();
        return Number.isNaN(date.getTime()) ? null : date;
    }
    const seconds = value?.seconds ?? value?._seconds;
    if (seconds !== undefined && seconds !== null && Number.isFinite(Number(seconds))) {
        return new Date(Number(seconds) * 1000);
    }
    if (typeof value === 'number') {
        const millis = value < 100000000000 ? value * 1000 : value;
        const date = new Date(millis);
        return Number.isNaN(date.getTime()) ? null : date;
    }
    if (typeof value === 'string') {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? null : date;
    }
    return null;
}

function formatTimestamp(value) {
    const date = timestampToDate(value);
    if (!date) return tr().notRecorded;
    return date.toLocaleString(currentLang === 'ar' ? 'ar-SA' : 'en-GB', {
        year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'
    });
}

function planCreatedValue(plan) {
    return plan?.createdAt || plan?.created_at || plan?.addedAt || plan?.addDate || plan?.createdDate || plan?.dateAdded || null;
}

function planUpdatedValue(plan) {
    return plan?.updatedAt || plan?.updated_at || plan?.modifiedAt || plan?.modified_at || plan?.lastUpdatedAt || plan?.lastModified || null;
}

function planHistoryEntries(plan) {
    const candidates = [plan?.editHistory, plan?.history, plan?.changeHistory, plan?.changes, plan?.updateHistory];
    return candidates.find(Array.isArray) || [];
}

function planWasChanged(plan) {
    const history = planHistoryEntries(plan);
    if (history.length) return true;
    const created = timestampToDate(planCreatedValue(plan));
    const updated = timestampToDate(planUpdatedValue(plan));
    if (!created || !updated) return false;
    return Math.abs(updated.getTime() - created.getTime()) > 60000;
}

function planActor(plan, kind) {
    const values = kind === 'created'
        ? [plan?.createdByName, plan?.createdBy, plan?.addedByName, plan?.addedBy, plan?.creatorName, plan?.creatorEmail]
        : [plan?.updatedByName, plan?.updatedBy, plan?.modifiedByName, plan?.modifiedBy, plan?.editorName, plan?.editorEmail];
    return values.find(Boolean) || '';
}

function planStatusLabel(value) {
    const raw = String(value || '').trim();
    if (!raw) return '—';
    const key = raw.toLowerCase();
    if (currentLang === 'ar') {
        if (key === 'approved') return 'معتمد';
        if (key === 'pending') return 'معلق';
        if (key === 'rejected') return 'مرفوض';
        if (key === 'cancelled' || key === 'canceled') return 'ملغي';
    }
    return raw;
}

function historyEntryText(entry, index) {
    if (typeof entry === 'string') return entry;
    if (!entry || typeof entry !== 'object') return `${currentLang === 'ar' ? 'تعديل' : 'Change'} ${index + 1}`;
    const when = entry.updatedAt || entry.modifiedAt || entry.changedAt || entry.at || entry.date || entry.timestamp;
    const from = entry.from || entry.start || entry.oldFrom || entry.previousFrom;
    const to = entry.to || entry.end || entry.oldTo || entry.previousTo;
    const newFrom = entry.newFrom || entry.fromNew || entry.afterFrom;
    const newTo = entry.newTo || entry.toNew || entry.afterTo;
    const actor = entry.updatedByName || entry.updatedBy || entry.modifiedByName || entry.modifiedBy || entry.by || '';
    const parts = [];
    if (when) parts.push(formatTimestamp(when));
    if (from || to) parts.push(`${currentLang === 'ar' ? 'السابق' : 'Previous'}: ${from || '—'} → ${to || '—'}`);
    if (newFrom || newTo) parts.push(`${currentLang === 'ar' ? 'الجديد' : 'New'}: ${newFrom || '—'} → ${newTo || '—'}`);
    if (actor) parts.push(`${currentLang === 'ar' ? 'بواسطة' : 'By'}: ${actor}`);
    return parts.join(' | ') || `${currentLang === 'ar' ? 'تعديل' : 'Change'} ${index + 1}`;
}

window.openPlanDetails = planId => {
    const plan = planList.find(item => String(item.id) === String(planId));
    if (!plan) return;
    const t = tr();
    const employeeName = resolveEmployeeName(plan);
    const from = plan.from || plan.start || '—';
    const to = plan.to || plan.end || from;
    const days = inclusiveDays(from, to);
    const created = planCreatedValue(plan);
    const updated = planUpdatedValue(plan);
    const changed = planWasChanged(plan);
    const createdBy = planActor(plan, 'created');
    const updatedBy = planActor(plan, 'updated');
    const history = planHistoryEntries(plan);
    const historyHtml = history.length ? `
        <div class="plan-history">
            <div class="plan-history-title">${escapeHtml(t.history)}</div>
            ${history.map((entry, index) => `<div class="plan-history-item">${escapeHtml(historyEntryText(entry, index))}</div>`).join('')}
        </div>` : '';

    $('planDetailsTitle').textContent = t.detailsTitle;
    $('planDetailsBody').innerHTML = `
        <div class="plan-detail-grid">
            <div class="plan-detail full"><div class="plan-detail-label">${escapeHtml(t.employee)}</div><div class="plan-detail-value">${escapeHtml(employeeName)}</div></div>
            <div class="plan-detail"><div class="plan-detail-label">${escapeHtml(t.from)}</div><div class="plan-detail-value">${escapeHtml(from)}</div></div>
            <div class="plan-detail"><div class="plan-detail-label">${escapeHtml(t.to)}</div><div class="plan-detail-value">${escapeHtml(to)}</div></div>
            <div class="plan-detail"><div class="plan-detail-label">${escapeHtml(t.days)}</div><div class="plan-detail-value">${days}</div></div>
            <div class="plan-detail"><div class="plan-detail-label">${escapeHtml(t.status)}</div><div class="plan-detail-value">${escapeHtml(planStatusLabel(plan.status))}</div></div>
            <div class="plan-detail"><div class="plan-detail-label">${escapeHtml(t.createdAt)}</div><div class="plan-detail-value">${escapeHtml(formatTimestamp(created))}</div></div>
            <div class="plan-detail"><div class="plan-detail-label">${escapeHtml(t.updatedAt)}</div><div class="plan-detail-value">${escapeHtml(formatTimestamp(updated))}</div></div>
            <div class="plan-detail"><div class="plan-detail-label">${escapeHtml(t.changed)}</div><div class="plan-detail-value"><span class="plan-change-badge ${changed ? 'changed' : 'unchanged'}">${changed ? t.yes : t.no}</span></div></div>
            ${createdBy ? `<div class="plan-detail"><div class="plan-detail-label">${escapeHtml(t.createdBy)}</div><div class="plan-detail-value">${escapeHtml(createdBy)}</div></div>` : ''}
            ${updatedBy ? `<div class="plan-detail"><div class="plan-detail-label">${escapeHtml(t.updatedBy)}</div><div class="plan-detail-value">${escapeHtml(updatedBy)}</div></div>` : ''}
        </div>
        ${historyHtml}`;
    $('planDetailsOverlay').classList.add('show');
};

window.closePlanDetails = () => $('planDetailsOverlay').classList.remove('show');

window.refreshDashboard = () => {
    const t = tr();
    const selectedYear = syncYearOptions();
    const range = $('dbViewRange').value;
    const rangeMap = { 'year':[0,11,t.year], 'q1':[0,2,'Q1'], 'q2':[3,5,'Q2'], 'q3':[6,8,'Q3'], 'q4':[9,11,'Q4'] };
    const [sm, em, txt] = rangeMap[range];
    $('rangeIndicator').innerText = `${txt} - ${selectedYear}`;

    const plansForYear = planList.filter(p => planOverlapsYear(p, selectedYear));
    const filtered = plansForYear.filter(p => {
        const m = planStartMonthForYear(p, selectedYear);
        return m >= sm && m <= em;
    });

    const today = new Date();
    today.setHours(0,0,0,0);
    const activeToday = plansForYear.filter(p => {
        const from = parseDateOnly(p.from || p.start);
        const to = parseDateOnly(p.to || p.end) || from;
        return from && to && today >= from && today <= to;
    }).length;

    $('dashboardStats').innerHTML = `
        <div class="stat-card" style="border-color:#1e40af"><div style="font-size:11px;font-weight:800;color:var(--muted)">${t.total}</div><div class="stat-val">${filtered.length}</div></div>
        <div class="stat-card" style="border-color:#10b981"><div style="font-size:11px;font-weight:800;color:var(--muted)">${t.active}</div><div class="stat-val">${activeToday}</div></div>
        <div class="stat-card" style="border-color:#f59e0b"><div style="font-size:11px;font-weight:800;color:var(--muted)">${t.pending}</div><div class="stat-val">${plansForYear.filter(p=>p.status==='pending').length}</div></div>`;

    let html = `<div style="display:grid;grid-template-columns:200px 1fr;background:var(--primary);color:#fff;font-weight:800;font-size:11px"><div style="padding:12px;text-align:center">${t.employee}</div><div style="display:grid;grid-template-columns:repeat(${em-sm+1},1fr)">`;
    for(let i=sm; i<=em; i++) html += `<div style="padding:12px;text-align:center;border-left:1px solid rgba(255,255,255,0.1)">${t.months[i]}</div>`;
    html += `</div></div>`;
    
    const grouped = {};
    plansForYear.forEach(p => {
        const m = planStartMonthForYear(p, selectedYear);
        if(m < sm || m > em) return;
        const key = resolveEmployeeGroupKey(p);
        if(!grouped[key]) grouped[key] = { name: resolveEmployeeName(p), plans: [] };
        // Prefer the resolved master employee name whenever it becomes available.
        const resolvedName = resolveEmployeeName(p);
        if (resolvedName && !looksLikeEmployeeNumber(resolvedName)) grouped[key].name = resolvedName;
        grouped[key].plans.push(p);
    });

    Object.values(grouped)
      .sort((a,b) => String(a.name).localeCompare(String(b.name), currentLang==='ar' ? 'ar' : 'en', {numeric:true, sensitivity:'base'}))
      .forEach(group => {
        html += `<div style="display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid #f1f5f9;min-height:55px;align-items:center"><div class="gname-db">${escapeHtml(group.name)}</div><div style="display:grid;grid-template-columns:repeat(${em-sm+1},1fr);position:relative">`;
        group.plans.forEach((p, idx) => {
            const sM = Math.max(planStartMonthForYear(p, selectedYear), sm);
            const mWidth = 100 / (em-sm+1); const colors = ['#1e40af', '#0f766e', '#6d28d9'];
            html += `<button type="button" class="gantt-bar-db" data-plan-id="${escapeHtml(String(p.id))}" title="${escapeHtml(currentLang==='ar' ? 'اضغط لعرض تفاصيل الخطة' : 'Click to view plan details')}" style="${currentLang==='ar'?'right':'left'}:${(sM-sm)*mWidth}%; width:${mWidth-0.5}%; background:${colors[idx%3]}">${escapeHtml(p.from || p.start || '')}</button>`;
        });
        html += `</div></div>`;
    });
    $('dbGanttArea').innerHTML = html;
    $('dbGanttArea').querySelectorAll('[data-plan-id]').forEach(button => {
        button.addEventListener('click', () => window.openPlanDetails(button.dataset.planId));
    });
};

function isVacationPlanRecord(record) {
    const source = String(record?.source || '').trim().toLowerCase();
    // Records created from Annual Leave Management are official leave records,
    // not vacation plans, so they must not appear in this dashboard.
    if (source === 'annual-leave' || source === 'annual_leave' || source === 'annual leave') return false;
    return true;
}

async function bindSnapshots(){
    await waitForSignedInUser();
    // Keep all employee master records available for historical name resolution,
    // including inactive employees who may still have older vacation plans.
    onSnapshot(collection(db,'employees'), s=>{ employees=s.docs.map(d=>({id:d.id,...d.data()})); window.refreshDashboard(); }, e=>logFirebaseError('Employees dashboard listener failed', e));
    onSnapshot(collection(db,'vacations'), s=>{
        planList = s.docs
            .map(d=>({id:d.id,...d.data()}))
            .filter(isVacationPlanRecord);
        window.refreshDashboard();
    }, e=>logFirebaseError('Vacation plan dashboard listener failed', e));
}

$('btnLang').addEventListener('click', ()=>{ currentLang=currentLang==='ar'?'en':'ar'; localStorage.setItem('lang',currentLang); location.reload(); });
$('copyDashboardBtn').addEventListener('click', async () => {
    const canvas = await html2canvas($('dashboardCaptureArea'), { scale: 3, backgroundColor: "#f8fafc", useCORS: true });
    canvas.toBlob(async b => { await navigator.clipboard.write([new ClipboardItem({"image/png":b})]); alert("✅ تم النسخ!"); });
});

$('planDetailsClose').addEventListener('click', window.closePlanDetails);
$('planDetailsOverlay').addEventListener('click', event => {
    if (event.target === $('planDetailsOverlay')) window.closePlanDetails();
});
document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('planDetailsOverlay').classList.contains('show')) window.closePlanDetails();
});

window.addEventListener('DOMContentLoaded', () => { 
    if(currentLang==='en') { $('mainHtml').dir='ltr'; $('mainHtml').lang='en'; }
    $('dbBrand').innerText = tr().brand; $('dbSub').innerText = tr().dbSub; $('dbGanttTitle').innerText = tr().ganttTitle;
    $('dbYear').setAttribute('aria-label', tr().yearLabel);
    $('planDetailsTitle').textContent = tr().detailsTitle;
    syncYearOptions();
    bindSnapshots().catch(e=>logFirebaseError('Schedule dashboard startup failed', e));
});
</script>
</body>
</html>
