<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Site Visit Management – Shell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ===== BASE ===== */
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(240,245,250,.95),rgba(240,245,250,.95)),
        url('image_dba186.png') center/cover no-repeat fixed;
    }

    /* ===== HEADER ===== */
    header{
      background:#0d4b73;
      color:#fff;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .header-left{
      display:flex;
      align-items:center;
      gap:14px;
    }
    .header-left img{height:40px}
    .app-title{
      font-weight:bold;
    }
    .app-version{
      font-size:11px;
      color:#d0d0d0;
    }
    .logout-btn{
      background:#d64545;
      color:#fff;
      border:none;
      border-radius:20px;
      padding:6px 14px;
      cursor:pointer;
    }

    /* ===== NAV ===== */
    nav{
      background:#083c5a;
      display:flex;
      flex-wrap:wrap;
    }
    nav button{
      background:none;
      border:none;
      color:#fff;
      padding:10px 14px;
      cursor:pointer;
      font-size:13px;
    }
    nav button.active{
      background:#0d4b73;
      border-bottom:3px solid #ffd54f;
    }

    /* ===== IFRAME AREA ===== */
    #content{
      height:calc(100vh - 110px);
    }
    #content iframe{
      width:100%;
      height:100%;
      border:none;
      background:#fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <img src="LOGO-almajdouie.png" alt="Logo" />
      <div>
        <div class="app-title">إدارة زيارات الفروع والفنيين</div>
        <div class="app-version">Shell v1.0 • 2026‑04‑23</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <nav>
    <button class="active" onclick="loadPage('dashboard', this)">Dashboard</button>
    <button onclick="loadPage('checklist', this)">Check‑List</button>
    <button onclick="loadPage('dynamic', this)">Dynamic Check‑List (Admin)</button>
    <button onclick="loadPage('visits', this)">إدخال زيارة</button>
    <button onclick="loadPage('branches', this)">إدارة الفروع</button>
    <button onclick="loadPage('technicians', this)">إدارة الفنيين</button>
    <button onclick="loadPage('brands', this)">البراندات</button>
    <button onclick="loadPage('upgrade', this)">Upgrade Windows</button>
    <button onclick="loadPage('permissions', this)">الصلاحيات</button>
  </nav>

  <div id="content">
    <iframe id="appFrame" src="dashboard.html"></iframe>
  </div>

  <script>
    /* ===== PAGE MAP ===== */
    const pages = {
      dashboard: "dashboard.html",
      checklist: "check-list.html",
      dynamic: "dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html",
      visits: "visits.html",
      branches: "branches.html",
      technicians: "technicians.html",
      brands: "brands.html",
      upgrade: "upgrade-windows.html",
      permissions: "permissions.html"
    };

    /* ===== LOAD PAGE ===== */
    function loadPage(key, btn){
      if(!pages[key]){
        alert("Page not mapped: " + key);
        return;
      }

      /* صفحة الـ Dynamic تفتح خارج الـ iframe */
      if(key === "dynamic"){
        window.location.href = pages[key];
        return;
      }

      document.querySelectorAll("nav button")
        .forEach(b => b.classList.remove("active"));

      if(btn){
        btn.classList.add("active");
      }

      document.getElementById("appFrame").src = pages[key];
    }

    /* ===== LOGOUT (PLACEHOLDER) ===== */
    function logout(){
      location.reload();
    }
  </script>

</body>
</html>
