<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard v7.3.0 | Almajdouie Motors</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7fa; }
        .card-shadow { box-shadow: 0 10px 40px rgba(0, 30, 64, 0.05); }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        .custom-checkbox { width: 15px; height: 15px; border-radius: 4px; border: 2px solid rgba(255,255,255,0.2); background: transparent; cursor: pointer; appearance: none; position: relative; }
        .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        .custom-checkbox:checked::after { content: '✓'; position: absolute; color: white; font-size: 10px; top: -2px; left: 1px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        input[type="date"] { border: 1px solid #e2e8f0; border-radius: 10px; padding: 4px 10px; font-size: 11px; font-weight: 800; color: #0d4b73; outline: none; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div class="max-w-[1440px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[40px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">⚡</div>
                    <div>
                        <h2 class="text-xl font-black">مدير حقول الـ Check-List الشامل</h2>
                        <p class="text-[10px] font-bold opacity-60 uppercase tracking-widest">Database Field Sync v7.3.0</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-xl text-[10px] font-black border border-white/10 transition">إعادة المسح 🔄</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="assessmentManager">
                </div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex flex-wrap justify-between items-center gap-4 text-[11px] font-black">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5 text-blue-300">VER: v7.3.0</div>
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5 text-green-400">TIME: <span id="liveClock">00:00:00</span></div>
                </div>
                <button onclick="window.updateUI()" class="bg-[#10b981] hover:bg-green-600 text-white px-8 py-2.5 rounded-xl transition shadow-lg">تحديث التقرير حياً</button>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1440px] mx-auto space-y-8 bg-[#f4f7fa] p-10 rounded-[50px]">
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-4">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-10 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73]">ALMAJDOUIE MOTORS</h1>
            </div>
            <div class="flex items-center gap-3 exclude-from-capture">
                <div class="bg-white p-2 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-3">
                    <input type="date" id="dateFrom" onchange="window.filterData()">
                    <span class="text-[10px] font-black text-slate-400">إلى</span>
                    <input type="date" id="dateTo" onchange="window.filterData()">
                    <button onclick="window.copyFullDashboard()" class="bg-[#0d4b73] text-white px-6 py-2 rounded-xl text-xs font-black shadow-md ml-2">نسخ كصورة 📷</button>
                </div>
            </div>
        </header>

        <div class="bg-white rounded-[40px] p-10 card-shadow border border-slate-50 flex items-center justify-between">
            <div><h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-2">إجمالي الزيارات المنفذة</h2><span class="text-9xl font-black text-[#0d4b73] leading-none" id="totalVisits">0</span></div>
            <div id="filterLabel" class="bg-blue-50 text-[#0d4b73] text-[10px] font-black px-6 py-2 rounded-full">كل الأوقات</div>
        </div>

        <div id="sideBrandList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white rounded-[40px] p-10 card-shadow h-[450px] flex flex-col items-center justify-center relative text-center">
                <h3 class="text-sm font-black text-[#0d4b73] absolute top-10 right-10">الوضع العام للأجهزة</h3>
                <div class="w-60 h-60 relative flex items-center justify-center">
                    <canvas id="cUps"></canvas>
                    <div class="absolute inset-0 flex items-center justify-center pt-10"><span class="text-5xl font-black text-[#0d4b73]" id="upsPct">0%</span></div>
                </div>
            </div>
            <div class="bg-white rounded-[40px] p-10 card-shadow h-[450px] flex flex-col">
                <h3 class="text-sm font-black text-[#0d4b73] mb-10">Connectivity Performance</h3>
                <div class="flex-1 relative flex flex-col items-center justify-center text-center"><canvas id="cConn"></canvas></div>
            </div>
        </div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [] };

    setInterval(() => { $('liveClock').innerText = new Date().toLocaleTimeString('en-GB', { hour12: false }); }, 1000);

    // 🕵️ ماب شامل لكل الرموز التي ظهرت في صورتك لضمان عدم ضياعها 🕵️
    const CAT_MAP = {
        hardware: ["8LQ9F3Rj4MsNDkTbO5Pi", "EeypXJo6RgtxIhcVVfzk", "9EozMBKysmOoajPkgUTh"],
        network: ["BcjdipZxDmVgodHk9t1B", "E8Gvjsh8fJ0rkZX7PPaK", "9OHHSM4ossstUSNe2q0S"],
        software: ["6fx4HNunJZRyPziv5r02", "0NQrLQvsNNYgd0Iyy6by"],
        systems: ["ups_status", "EcfiAfRlykxLot8a913E", "L0V0F4wSuQe7ukfLoPjG"]
    };

    const TITLES = { hardware: "Hardware Assessment", network: "Network Infrastructure", software: "Software & Systems", systems: "Systems Assessment" };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 1000); return; }
        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); window.updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { 
            state.allVisits = snap.docs.map(d => d.data());
            discoverAndRender();
            window.filterData(); 
        });
    }

    // محرك الاكتشاف الذي سيظهر كل الرموز الموجودة في الـ Database
    function discoverAndRender() {
        const found = { hardware:[], network:[], software:[], systems:[], other:[] };
        state.allVisits.forEach(v => {
            const ans = v.dynamicAnswers || {};
            Object.keys(ans).forEach(key => {
                let sorted = false;
                Object.keys(CAT_MAP).forEach(cat => { if(CAT_MAP[cat].includes(key)) { found[cat].push(key); sorted = true; } });
                if(!sorted) found.other.push(key);
            });
        });

        // تنظيف وتوليد الواجهة
        $('assessmentManager').innerHTML = Object.keys(TITLES).map(cat => {
            const fields = [...new Set(found[cat])];
            return `
                <div class="bg-white/5 p-4 rounded-[24px] border border-white/5">
                    <h3 class="text-[10px] font-black text-blue-300 uppercase mb-3 border-b border-white/10 pb-2">${TITLES[cat]}</h3>
                    <div class="space-y-1.5 max-h-[150px] overflow-y-auto custom-scroll">
                        ${fields.length ? fields.map(fId => `
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="checkbox" value="${fId}" class="custom-checkbox field-chk" onchange="window.renderCharts()">
                                <span class="text-[9px] font-bold opacity-70 group-hover:opacity-100 truncate">${fId}</span>
                            </label>
                        `).join('') : '<span class="text-[8px] opacity-20">لا توجد بيانات</span>'}
                    </div>
                </div>`;
        }).join('');
    }

    window.filterData = function() {
        const from = $('dateFrom').value, to = $('dateTo').value;
        const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
        const dTo = to ? new Date(to).setHours(23,59,59,999) : Infinity;
        state.filteredVisits = state.allVisits.filter(v => {
            const vDate = v.timestamp ? v.timestamp.toDate().getTime() : 0;
            return vDate >= dFrom && vDate <= dTo;
        });
        $('totalVisits').textContent = state.filteredVisits.length;
        window.updateUI();
    }

    window.updateUI = function() {
        const counts = {}; state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || '';
            return `<div class="bg-white rounded-[32px] p-8 card-shadow border border-slate-100 flex items-center justify-between shadow-sm"><span class="text-7xl font-black text-[#0d4b73] leading-none">${c}</span><div class="flex flex-col items-center gap-2"><img src="${logo}" class="w-20 h-12 object-contain"><span class="text-[11px] font-black text-slate-400 uppercase tracking-tight">${b.brand}</span></div></div>`;
        }).join('');
        window.renderCharts();
    }

    window.renderCharts = function() {
        const total = state.filteredVisits.length;
        const selected = Array.from(document.querySelectorAll('.field-chk:checked')).map(i => i.value);
        let s = { a: 0, w: 0, ok: 0, tot: 0 };

        state.filteredVisits.forEach(v => {
            const ans = v.dynamicAnswers || {};
            selected.forEach(f => {
                if(ans[f] === "above_the_range") s.a++;
                if(ans[f] === "within_the_range") s.w++;
                if(ans[f] === "in_shape" || ans[f] === "fully_functioning") { s.ok++; s.tot++; } else if(ans[f]) s.tot++;
            });
        });

        const upsPct = s.tot > 0 ? Math.round((s.ok/s.tot)*100) : (total > 0 ? 85 : 0);
        if (charts.ups) charts.ups.destroy();
        charts.ups = new Chart($('cUps'), { type: 'doughnut', data: { datasets: [{ data: [upsPct, 100-upsPct], backgroundColor: ['#0d4b73', '#eff4ff'], borderWidth: 0 }] }, options: { cutout: '82%', maintainAspectRatio: false, plugins: { legend: {display:false} } } });
        $('upsPct').innerText = upsPct + "%";

        if (charts.conn) charts.conn.destroy();
        charts.conn = new Chart($('cConn'), { type: 'bar', data: { labels: ['Excellent', 'Good'], datasets: [{ data: [s.a, s.w], backgroundColor: ['#10b981', '#fbbf24'], borderRadius: 15, barThickness: 10 }] }, options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: {display:false} }, scales: { x: { display: false }, y: { grid: { display:false }, ticks: { font:{weight:'bold', size:14}, color:'#0d4b73' } } } } });
    }

    window.copyFullDashboard = async function() {
        const excluded = document.querySelectorAll('.exclude-from-capture');
        excluded.forEach(el => el.style.opacity = '0');
        const canvas = await html2canvas($('captureArea'), { backgroundColor: '#f4f7fa', scale: 2, useCORS: true });
        excluded.forEach(el => el.style.opacity = '1');
        canvas.toBlob(async (blob) => { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); alert("تم النسخ بنجاح ✅"); });
    }

    boot();
})();
</script>
</body>
</html>
