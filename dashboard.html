<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Dashboard v2.0.0 | الأرقام الضخمة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #38bdf8; --green: #10b981; }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    
    .dashboard-wrapper { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
    
    /* الشريط الجانبي - أرقام ضخمة */
    .sidebar { background: #fff; color: #000; border-left: 2px solid #ddd; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
    .side-header { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 3px solid #f1f5f9; }
    .side-header span { font-size: 16px; font-weight: bold; color: #64748b; }
    #totalVisits { font-size: 90px; font-weight: 900; line-height: 1; margin: 10px 0; color: #0d4b73; }
    
    .brand-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .brand-logo { width: 60px; height: 40px; object-fit: contain; background: #fff; border-radius: 6px; }
    .brand-name { font-size: 15px; font-weight: 800; color: #1e293b; }

    .main-content { display: flex; flex-direction: column; width: 100%; overflow-y: auto; padding-bottom: 60px; }
    .top-nav { padding: 15px 25px; background: #020617; color: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
    .card { background: var(--card); border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    .card-header { background: #0d4b73; color: #fff; padding: 12px 20px; font-size: 16px; font-weight: 900; }
    .card-body { padding: 30px; flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 380px; position: relative; }
    
    /* النسبة الضخمة في الدائرة */
    .overall-val { position: absolute; top: 52%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    #overallPct { font-size: 75px; font-weight: 900; color: var(--green); margin: 0; line-height: 1; }
    .overall-lbl { font-size: 16px; color: #94a3b8; font-weight: bold; }

    .footer { position: fixed; bottom: 0; width: 100%; background: #fff; color: #0d4b73; padding: 8px 25px; font-size: 12px; display: flex; justify-content: space-between; font-weight: bold; border-top: 2px solid #ddd; }
  </style>
</head>
<body>

<div class="dashboard-wrapper">
  <aside class="sidebar">
    <div class="side-header">
        <span id="lblTotal">إجمالي التقارير</span>
        <h1 id="totalVisits">0</h1>
    </div>
    <div id="sideBrandList"></div>
  </aside>

  <main class="main-content">
    <div class="top-nav">
        <div style="font-weight:900; font-size: 18px;">ALMAJDOUIE MOTORS | DASHBOARD v2.0</div>
        <div id="statusTxt" style="color:var(--green); font-weight:bold;">LIVE CONNECTED ✅</div>
    </div>

    <div class="main-grid">
        <div class="card">
            <div class="card-header">التقييم العام للجاهزية (Overall Readiness)</div>
            <div class="card-body">
                <canvas id="doughnutChart"></canvas>
                <div class="overall-val">
                    <h2 id="overallPct">0%</h2>
                    <div class="overall-lbl">نسبة الإنجاز</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">تحليل أداء الأقسام (Technical Breakdown)</div>
            <div class="card-body">
                <canvas id="barChart"></canvas>
            </div>
        </div>
    </div>
  </main>
</div>

<div class="footer">
    <div>VERSION 2.0.0 - POWERPOINT STYLE</div>
    <div id="liveClock"></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  Chart.register(ChartDataLabels); // تفعيل إضافة الأرقام فوق الأعمدة

  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  let doughnutChart, barChart;
  let state = { brands: [], checklists: [] };

  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      db.collection('brand_assets').onSnapshot(s => { state.brands = s.docs.map(d => ({id:d.id,...d.data()})); render(); });
      db.collection('branch_checklists').onSnapshot(s => { state.checklists = s.docs.map(d => d.data()); render(); });
    }
  });

  function render() {
    $('totalVisits').textContent = state.checklists.length;
    
    // تحديث قائمة البراندات
    $('sideBrandList').innerHTML = state.brands.map(b => {
      const count = state.checklists.filter(c => c.brand === b.brand || c.brandId === b.id).length;
      return `
        <div class="brand-card">
          <img src="${b.logoData || b.logoUrl || ''}" class="brand-logo">
          <div><div class="brand-name">${b.nameAr || b.brand}</div><div style="font-size:12px; color:#64748b;">الزيارات: <b>${count}</b></div></div>
        </div>`;
    }).join('');

    const total = state.checklists.length || 1;
    let counts = { infra: 0, hardware: 0, conn: 0 };
    state.checklists.forEach(c => {
      const a = c.dynamicAnswers || {};
      if (a["8LQ9F3Rj4MsNDkTbO5Pi"] === "in_shape") counts.infra++;
      if (a["0NQrLqvsNNYgd0Iyy6by"] === "fully_functioning") counts.hardware++;
      if (a["BcjdipZxDmVgodHk9t1B"] === "above_the_range") counts.conn++;
    });

    const avg = Math.round(((counts.infra + counts.hardware + counts.conn) / (total * 3)) * 100);
    $('overallPct').innerText = avg + "%";

    // رسم الدائرة
    if (doughnutChart) doughnutChart.destroy();
    doughnutChart = new Chart($('doughnutChart'), {
      type: 'doughnut',
      data: { datasets: [{ data: [avg, 100 - avg], backgroundColor: ['#10b981', '#334155'], borderWidth: 0 }] },
      options: { cutout: '82%', plugins: { datalabels: { display: false }, legend: { display: false } } }
    });

    // رسم الأعمدة مع الأرقام فوقها
    if (barChart) barChart.destroy();
    barChart = new Chart($('barChart'), {
      type: 'bar',
      data: {
        labels: ['البنية التحتية', 'الأجهزة', 'الاتصال'],
        datasets: [{
          data: [Math.round((counts.infra/total)*100), Math.round((counts.hardware/total)*100), Math.round((counts.conn/total)*100)],
          backgroundColor: '#38bdf8', borderRadius: 10, barThickness: 50
        }]
      },
      options: {
        scales: { 
            y: { max: 115, display: false }, 
            x: { ticks: { color: '#f8fafc', font: { size: 14, weight: 'bold' } }, grid: { display: false } } 
        },
        plugins: {
          legend: { display: false },
          datalabels: { // الأرقام فوق الأعمدة
            anchor: 'end', align: 'top', color: '#fff', font: { size: 20, weight: '900' },
            formatter: (v) => v + '%'
          }
        }
      }
    });
  }

  setInterval(() => { $('liveClock').innerText = new Date().toLocaleString('ar-SA'); }, 1000);
})();
</script>
</body>
</html>
