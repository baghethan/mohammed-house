<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IT Analytics v8.8.0 | Color-Coded Logic</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .card-shadow { box-shadow: 0 20px 50px rgba(0, 30, 64, 0.05); }
        .stat-huge { font-size: 6rem; font-weight: 900; color: #0d4b73; line-height: 1; letter-spacing: -3px; }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        
        /* ألوان لوحة المفاتيح */
        .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .bg-success { background-color: #10b981; }
        .bg-warning { background-color: #f59e0b; }
        .bg-danger { background-color: #f43f5e; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div class="max-w-[1600px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[45px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">🎨</div>
                    <div>
                        <h2 class="text-xl font-black uppercase tracking-tight">IT DASHBOARD MASTER v8.8.0</h2>
                        <p class="text-[9px] font-bold opacity-50 uppercase">Type-Based Color Coding Active</p>
                    </div>
                </div>
                <div class="flex gap-4 text-[9px] font-black uppercase bg-white/5 p-3 rounded-2xl border border-white/5">
                    <div class="flex items-center"><span class="color-dot bg-success"></span> ممــتـاز</div>
                    <div class="flex items-center"><span class="color-dot bg-warning"></span> تـنبيه</div>
                    <div class="flex items-center"><span class="color-dot bg-danger"></span> صيانة</div>
                </div>
            </div>

            <div id="configGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex justify-between items-center text-[10px] font-black uppercase">
                <span class="text-blue-300">Logic: Multi-Color Frequency Distribution ✅</span>
                <button onclick="window.renderCharts()" class="bg-[#10b981] text-white px-12 py-3 rounded-2xl shadow-lg transition active:scale-95">تحديث كافة الشارتات 🔃</button>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1600px] mx-auto space-y-8 bg-[#f8fafc] p-12 rounded-[70px]">
        
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-5">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-12 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73] border-r-4 border-blue-900 pr-4 uppercase tracking-tighter">IT Assessment Report</h1>
            </div>
            
            <div class="flex items-center gap-4 exclude-from-capture">
                <div class="bg-white px-5 py-2 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                    <input type="date" id="dateFrom" onchange="window.filterData()" class="border-none text-xs font-bold text-[#0d4b73]">
                    <span class="text-[10px] font-black text-slate-400">إلى</span>
                    <input type="date" id="dateTo" onchange="window.filterData()" class="border-none text-xs font-bold text-[#0d4b73]">
                </div>
                <button onclick="window.copyFullDashboard()" class="bg-[#0d4b73] text-white px-8 py-3 rounded-2xl text-sm font-black shadow-xl">نسخ التقرير 📷</button>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-8 items-stretch">
            <div class="col-span-12 lg:col-span-4 bg-white rounded-[55px] p-12 card-shadow border border-slate-50 flex flex-col justify-center text-center">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">إجمالي الزيارات المنفذة</h2>
                <span class="text-9xl font-black text-[#0d4b73] leading-none" id="totalVisits">0</span>
            </div>
            <div id="sideBrandList" class="col-span-12 lg:col-span-8 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10" id="reportsGrid"></div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [] };

    // 🕵️ خريطة الألوان بناءً على نوع الرد 🕵️
    const COLOR_LOGIC = {
        // ممتاز - أخضر
        "fully_functioning": "#10b981", "above_the_range": "#10b981", "yes": "#10b981", "in_shape": "#10b981",
        // تنبيه - أصفر
        "within_the_range": "#f59e0b", "partially": "#f59e0b", "up_to_date": "#f59e0b",
        // سيئ - أحمر
        "requires_service": "#f43f5e", "below_the_range": "#f43f5e", "no": "#f43f5e", "requires_arrangement": "#f43f5e", "requires_maintenance": "#f43f5e"
    };

    const SCHEMA = {
        hardware: { title: "1. Hardware & Peripherals", opts: ["fully_functioning", "requires_service"], items: { "8LQ9F3Rj4MsNDkTbO5Pi": "PCs Condition", "EeypXJo6RgtxIhcVVfzk": "Printers Condition", "9EozMBKysmOoajPkgUTh": "Unified Communication", "unused_damaged": "Unused/Damaged Assets" } },
        network: { title: "2. Network Infrastructure", opts: ["in_shape", "requires_arrangement", "above_the_range", "within_the_range", "below_the_range"], items: { "BcjdipZxDmVgodHk9t1B": "Cabinets Condition", "E8Gvjsh8fJ0rkZX7PPaK": "Upload 4-6 Mbps", "low_current": "Low Current Infra", "9OHHSM4ossstUSNe2q0S": "Download 6-9 Mbps", "room_temp": "Room Temp", "ups_status": "UPS Status" } },
        software: { title: "3. Software & Systems", opts: ["yes", "no", "partially", "requires_maintenance"], items: { "6fx4HNunJZRyPziv5r02": "OS Up to Date", "cleanup": "Remove Unwanted Apps", "0NQrLQvsNNYgd0Iyy6by": "OneDrive Backup", "portals": "Customer Portals", "erp_apps": "ERP Apps", "L0V0F4wSuQe7ukfLoPjG": "Training Need" } },
        systems: { title: "4. Systems Assessment", opts: ["yes", "no", "fully_functioning"], items: { "EcfiAfRlykxLot8a913E": "Windows 11 Upgrades" } }
    };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 1000); return; }

        $('configGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white/5 p-5 rounded-[30px] border border-white/10">
                <h3 class="text-[10px] font-black text-blue-300 uppercase mb-4">${SCHEMA[key].title}</h3>
                <select id="view-${key}" class="w-full bg-white/10 text-white text-[10px] border-none mb-4" onchange="window.renderCharts()">
                    <option value="bar">توزيع الألوان والأعداد (Color Bar)</option>
                    <option value="stats">ملخص الأرقام (Stats)</option>
                </select>
                <div class="space-y-1.5 max-h-[100px] overflow-y-auto custom-scroll">
                    ${Object.keys(SCHEMA[key].items).map(fId => `<label class="flex items-center gap-2 py-0.5 opacity-70"><input type="checkbox" value="${fId}" data-cat="${key}" checked class="w-3 h-3 rounded" onchange="window.renderCharts()"><span class="text-[9px] font-bold">${SCHEMA[key].items[fId]}</span></label>`).join('')}
                </div>
            </div>`).join('');

        $('reportsGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white rounded-[55px] p-10 card-shadow min-h-[480px] flex flex-col">
                <h3 class="text-sm font-black text-[#0d4b73] mb-8 uppercase border-b pb-4">${SCHEMA[key].title}</h3>
                <div class="flex-1 relative flex items-center justify-center">
                    <canvas id="chart-${key}"></canvas>
                    <div id="stats-${key}" class="hidden text-center"><div class="stat-huge" id="val-${key}">0</div><p class="font-bold text-slate-400 mt-2">Active Entries</p></div>
                </div>
            </div>`).join('');

        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); window.updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { state.allVisits = snap.docs.map(d => d.data()); window.filterData(); });
    }

    window.filterData = function() {
        const from = $('dateFrom').value, to = $('dateTo').value;
        const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
        const dTo = to ? new Date(to).setHours(23,59,59,999) : Infinity;
        state.filteredVisits = state.allVisits.filter(v => (v.timestamp?.toDate().getTime() || 0) >= dFrom && (v.timestamp?.toDate().getTime() || Infinity) <= dTo);
        $('totalVisits').textContent = state.filteredVisits.length;
        window.updateUI();
    }

    window.updateUI = function() {
        const counts = {}; state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => `<div class="bg-white rounded-[35px] p-8 shadow-sm border border-slate-50 flex items-center justify-between"><span class="text-7xl font-black text-[#0d4b73]">${counts[b.brand]}</span><div class="flex flex-col items-center gap-1"><img src="${b.logoData || b.logoUrl}" class="w-16 h-10 object-contain"><span class="text-[10px] font-black text-slate-400 uppercase">${b.brand}</span></div></div>`).join('');
        window.renderCharts();
    }

    window.renderCharts = function() {
        Object.keys(SCHEMA).forEach(catKey => {
            const viewType = $(`view-${catKey}`).value;
            const selectedFields = Array.from(document.querySelectorAll(`input[data-cat="${catKey}"]:checked`)).map(i => i.value);
            
            let chartLabels = [], chartValues = [], chartColors = [];
            let globalSum = 0;

            selectedFields.forEach(fId => {
                const fieldName = SCHEMA[catKey].items[fId];
                SCHEMA[catKey].opts.forEach(opt => {
                    let count = 0;
                    state.filteredVisits.forEach(v => { if ((v.dynamicAnswers || {})[fId] === opt) count++; });
                    if (count > 0) {
                        chartLabels.push(`${fieldName} (${opt.replace(/_/g,' ')})`);
                        chartValues.push(count);
                        chartColors.push(COLOR_LOGIC[opt] || "#CBD5E1"); // لون الرد أو رمادي افتراضي
                        globalSum += count;
                    }
                });
            });

            $(`chart-${catKey}`).style.display = (viewType === 'stats') ? 'none' : 'block';
            $(`stats-${catKey}`).style.display = (viewType === 'stats') ? 'block' : 'none';

            if (viewType === 'stats') { $(`val-${catKey}`).innerText = globalSum; }
            else {
                if (charts[catKey]) charts[catKey].destroy();
                charts[catKey] = new Chart($(`chart-${catKey}`), {
                    type: 'bar',
                    data: { labels: chartLabels, datasets: [{ data: chartValues, backgroundColor: chartColors, borderRadius: 12, barThickness: 15 }] },
                    options: { 
                        indexAxis: 'y', maintainAspectRatio: false, 
                        plugins: { legend: { display: false } },
                        scales: { 
                            x: { grid: { display: false }, ticks: { font: { weight: 'bold' }, stepSize: 1 } }, 
                            y: { grid: { display: false }, ticks: { font: { weight: 'bold', size: 9 }, color: '#0d4b73' } } 
                        }
                    }
                });
            }
        });
    }

    window.copyFullDashboard = async function() {
        const excluded = document.querySelectorAll('.exclude-from-capture');
        excluded.forEach(el => el.style.opacity = '0');
        const canvas = await html2canvas($('captureArea'), { backgroundColor: '#f8fafc', scale: 2, useCORS: true });
        excluded.forEach(el => el.style.opacity = '1');
        canvas.toBlob(async (blob) => { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); alert("Report Copied ✅"); });
    }
    boot();
})();
</script>
</body>
</html>
