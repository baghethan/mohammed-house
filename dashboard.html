<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Check‑List Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #eef3f8;
      color: #163247;
    }

    .container {
      max-width: 1440px;
      margin: 18px auto;
      padding: 0 14px 28px;
    }

    .dashboard-board {
      background: linear-gradient(180deg,#0b3048,#07283d);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(6,24,38,.22);
    }

    .board-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      min-height: 700px;
    }

    /* ===== Main ===== */
    .main {
      padding: 24px;
      color: #fff;
    }

    /* ===== Sidebar ===== */
    .side {
      background: #f9fbfe;
      border-right: 1px solid #dbe7f1;
      display: flex;
      flex-direction: column;
    }

    .side-header {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #dbe7f1;
    }

    .side-header h4 {
      margin: 0;
      font-size: 16px;
      color: #0d4b73;
      font-weight: 800;
    }

    .side-header strong {
      display: block;
      margin-top: 6px;
      font-size: 28px;
      color: #0d4b73;
    }

    .side-header span {
      font-size: 12px;
      color: #667085;
    }

    .side-list {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      overflow-y: auto;
    }

    /* ===== Brand Card ===== */
    .brand-item {
      background: #fff;
      border: 1px solid #dbe7f1;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.04);
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      border: 1px solid #e3e9f1;
      object-fit: contain;
      background: #fff;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
      color: #22364a;
    }

    .brand-sub {
      font-size: 12px;
      color: #667085;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="dashboard-board">
    <div class="board-layout">

      <!-- ===== Main Content ===== -->
      <main class="main">
        <h2>Overall Assessment</h2>
        <p style="opacity:.8">لوحة التقييم العامة للأقسام</p>
      </main>

      <!-- ===== Sidebar ===== -->
      <aside class="side">
        <div class="side-header">
          <h4>Visited Brands</h4>
          <strong id="sideTotalVisits">0</strong>
          <span>إجمالي الزيارات</span>
        </div>

        <div id="sideBrandList" class="side-list"></div>
      </aside>

    </div>
  </div>

</div>

<script>
(function(){

  const state = {
    visits: [],
    brands: []
  };

  function escapeHtml(v){
    return String(v || '').replace(/[&<>"']/g, s =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])
    );
  }

  function getBrandName(v){
    return v.brand || v.brandName || v.brandKey || 'بدون اسم';
  }

  function getBrandLogo(brandName){
    if (!brandName) return '';
    const key = brandName.toLowerCase();

    const asset = state.brands.find(b =>
      (b.brand && b.brand.toLowerCase() === key) ||
      (b.brandKey && b.brandKey.toLowerCase() === key) ||
      (b.key && b.key.toLowerCase() === key)
    );

    if (!asset) return '';

    if (asset.logoUrl) return asset.logoUrl;

    if (asset.logoData) {
      return asset.logoData.startsWith('data:image')
        ? asset.logoData
        : 'data:image/png;base64,' + asset.logoData;
    }

    return '';
  }

  function renderBrands(){
    const list = document.getElementById('sideBrandList');
    const totalBox = document.getElementById('sideTotalVisits');

    const map = {};
    state.visits.forEach(v => {
      const name = getBrandName(v);
      map[name] = (map[name] || 0) + 1;
    });

    const items = Object.entries(map).map(([name, count]) => ({
      name,
      count,
      logo: getBrandLogo(name)
    }));

    totalBox.textContent = state.visits.length;

    if (!items.length){
      list.innerHTML = `
        <div class="brand-item">
          <div class="brand-name">لا توجد زيارات</div>
          <div class="brand-sub">ضمن الفترة</div>
        </div>`;
      return;
    }

    list.innerHTML = items.map(item => `
      <div class="brand-item">
        ${
          item.logo
            ? `<img class="brand-logo" src="${item.logo}" alt="${escapeHtml(item.name)};align-items:center;justify-content:center;color:#94a3b8">—</div>`
        }
        <div class="brand-name">${escapeHtml(item.name)}</div>
        <div class="brand-sub">${item.count} زيارة</div>
      </div>
    `).join('');
  }

  function start(db){
    db.collection('siteVisits').onSnapshot(snap => {
      state.visits = snap.docs.map(d => d.data());
      renderBrands();
    });

    db.collection('brand_assets').onSnapshot(snap => {
      state.brands = snap.docs.map(d => d.data());
      renderBrands();
    });
  }

  if (window.parent && window.parent.firebase){
    start(window.parent.firebase.firestore());
  }

})();
</script>

</body>
</html>
