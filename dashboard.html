<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Dashboard v3.2.0 | Almajdouie Motors</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <style>
    :root { --bg: #f4f7fa; --header-blue: #0d4b73; --card: #fff; }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
    
    /* الشريط الجانبي للبراندات */
    .sidebar { width: 280px; background: #fff; border-left: 2px solid #e2e8f0; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-title { font-size: 12px; font-weight: 900; color: #64748b; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .brand-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-bottom: 1px solid #f0f0f0; transition: 0.2s; }
    .brand-info { display: flex; align-items: center; gap: 10px; }
    .brand-logo { width: 40px; height: 25px; object-fit: contain; }
    .brand-count { background: var(--header-blue); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }

    /* المنطقة الرئيسية */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .top-bar { padding: 10px 20px; background: var(--header-blue); color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .stats-summary { text-align: center; padding: 20px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    #totalVisits { font-size: 72px; color: var(--header-blue); font-weight: 900; margin: 0; line-height: 1; }
    
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px; }
    .card { background: var(--card); border-radius: 6px; border: 1px solid #e2e8f0; min-height: 280px; position: relative; }
    .card-header { background: var(--header-blue); color: #fff; padding: 6px 12px; font-size: 12px; font-weight: 900; }
    canvas { padding: 10px; max-height: 240px; }
    
    .hidden { display: none; }
  </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-title">زيارات البراندات (Brands Activity)</div>
    <div id="sideBrandList">
        </div>
</aside>

<main class="main-wrapper">
    <div class="top-bar">
        <div style="font-weight:900; font-size:14px;">ALMAJDOUIE MOTORS | DASHBOARD v3.2 FULL TURBO</div>
        <div id="statusTxt" style="font-size:11px; font-weight:bold; color:#10b981;">متصل عبر المحرك الرئيسي ✅</div>
    </div>

    <div class="stats-summary">
        <h1 id="totalVisits">0</h1>
        <div style="font-size:14px; font-weight:bold; color:#64748b;">إجمالي الزيارات الميدانية</div>
    </div>

    <div class="grid">
        <div class="card"><div class="card-header">Network Appliances (In Shape)</div><canvas id="cNet"></canvas></div>
        <div class="card"><div class="card-header">Connectivity Status</div><canvas id="cConn"></canvas></div>
        <div class="card">
            <div class="card-header">UPS Status</div>
            <canvas id="cUps"></canvas>
            <div style="position:absolute; top:55%; left:50%; transform:translate(-50%,-50%); text-align:center;">
                <h2 id="upsPct" style="font-size:32px; color:var(--header-blue); margin:0;">0%</h2>
            </div>
        </div>
        <div class="card" style="grid-column: span 3;"><div class="card-header">Training Requirements Overview</div><canvas id="cTrain"></canvas></div>
    </div>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  Chart.register(ChartDataLabels);

  let charts = {};
  let state = { visits: [], brands: [] };

  function boot(){
    const db = window.parent.appDb;
    if (!db) { 
        console.log("Waiting for engine..."); 
        setTimeout(boot, 500); 
        return; 
    }

    // 1. مراقبة البراندات والشعارات
    db.collection('brand_assets').onSnapshot(snap => {
        state.brands = snap.docs.map(d => ({id: d.id, ...d.data()}));
        updateUI();
    });

    // 2. مراقبة الزيارات والنتائج
    db.collection('branch_checklists').onSnapshot(snap => {
        state.visits = snap.docs.map(d => d.data());
        $('totalVisits').textContent = state.visits.length;
        updateUI();
    });
  }

  function updateUI() {
    // حساب أعداد الزيارات لكل براند
    const counts = {};
    state.visits.forEach(v => {
        const b = v.brand || 'Other';
        counts[b] = (counts[b] || 0) + 1;
    });

    // تحديث السايدبار بالشعارات والعدد المكتمل
    $('sideBrandList').innerHTML = state.brands.map(b => {
        const c = counts[b.brand] || 0;
        return `
          <div class="brand-item">
            <div class="brand-info">
              <img src="${b.logoUrl || 'https://placehold.jp/24/0d4b73/ffffff/40x25.png?text=Logo'}" class="brand-logo" onerror="this.src='https://placehold.jp/40x25.png'">
              <span style="font-size:11px; font-weight:bold;">${b.brand}</span>
            </div>
            <span class="brand-count">${c}</span>
          </div>`;
    }).join('');

    processChartsData(state.visits);
  }

  function processChartsData(docs) {
    const total = docs.length || 0;
    let s = { net: 0, conn: {a:0, w:0, b:0}, ups: 0 };

    docs.forEach(d => {
      const a = d.dynamicAnswers || {};
      // مطابقة الحقول من الـ Checklist
      if(a["8LQ9F3Rj4MsNDkTbO5Pi"] === "in_shape") s.net++;
      if(a["BcjdipZxDmVgodHk9t1B"] === "above_the_range") s.conn.a++;
      if(a["BcjdipZxDmVgodHk9t1B"] === "within_the_range") s.conn.w++;
      if(a["BcjdipZxDmVgodHk9t1B"] === "below_the_range") s.conn.b++;
    });

    const calc = (v) => total > 0 ? Math.round((v/total)*100) : 0;

    renderBar('cNet', ['In Shape', 'Need Arr.'], [calc(s.net), 100-calc(s.net)], ['#10b981', '#cbd5e1']);
    renderBar('cConn', ['Above', 'Within', 'Below'], [calc(s.conn.a), calc(s.conn.w), calc(s.conn.b)], ['#10b981', '#f59e0b', '#ef4444']);
    renderDoughnut('cUps', calc(s.ups));
  }

  function renderBar(id, labels, data, colors) {
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart($(id), {
      type: 'bar',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 5 }] },
      options: { 
        indexAxis: 'y',
        plugins: { legend: {display:false}, datalabels: { color:'#fff', font:{weight:'bold'}, formatter: v => v+'%' } },
        scales: { x: { max: 100, display: false }, y: { grid: { display:false } } }
      }
    });
  }

  function renderDoughnut(id, val) {
    $('upsPct').innerText = val + "%";
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart($(id), {
      type: 'doughnut',
      data: { datasets: [{ data: [val, 100-val], backgroundColor: ['#0d4b73', '#e2e8f0'] }] },
      options: { cutout: '80%', plugins: { datalabels: {display:false} } }
    });
  }

  boot();
})();
</script>
</body>
</html>
