<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard v7.1.0 | Almajdouie Motors</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7fa; }
        .card-shadow { box-shadow: 0 10px 40px rgba(0, 30, 64, 0.05); }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        .custom-checkbox { width: 14px; height: 14px; border-radius: 4px; border: 2px solid rgba(255,255,255,0.2); background: transparent; cursor: pointer; appearance: none; position: relative; }
        .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        .custom-checkbox:checked::after { content: '✓'; position: absolute; color: white; font-size: 9px; top: -2px; left: 1px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        input[type="date"] { border: 1px solid #e2e8f0; border-radius: 10px; padding: 4px 10px; font-size: 11px; font-weight: 800; color: #0d4b73; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div class="max-w-[1440px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[40px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">🔍</div>
                    <div>
                        <h2 class="text-xl font-black">مدير حقول الـ Check-List الشامل</h2>
                        <p class="text-[10px] font-bold opacity-60 uppercase tracking-widest">v7.1.0 Turbo Sync</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-[9px] opacity-50">نوع العرض:</p>
                        <select id="viewType" class="bg-white/10 text-white text-[11px] font-bold border-none rounded-lg p-1" onchange="window.renderCharts()">
                            <option value="bar" class="text-black">أعمدة</option>
                            <option value="doughnut" class="text-black">دونات</option>
                            <option value="stats" class="text-black">أرقام</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="assessmentManager">
                <div class="col-span-4 text-center py-10 opacity-50 italic text-sm">جاري مسح قاعدة البيانات واكتشاف الأقسام...</div>
            </div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex flex-wrap justify-between items-center gap-4 text-[11px] font-black">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">VERSION: <span class="text-blue-300">v7.1.0</span></div>
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">DATE: <span id="currentDate">--</span></div>
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">TIME: <span id="liveClock" class="text-green-400">00:00:00</span></div>
                </div>
                <button onclick="window.updateUI()" class="bg-[#10b981] text-white px-8 py-2.5 rounded-xl transition shadow-lg font-black uppercase tracking-tighter">تحديث التقرير الآن</button>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1440px] mx-auto space-y-8 bg-[#f4f7fa] p-10 rounded-[50px]">
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-4">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-10 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73]">ALMAJDOUIE MOTORS</h1>
            </div>
            
            <div class="flex items-center gap-3 exclude-from-capture bg-white p-2 rounded-2xl border border-slate-100 shadow-sm">
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-black text-slate-400">من</span>
                    <input type="date" id="dateFrom" onchange="window.filterData()">
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-black text-slate-400">إلى</span>
                    <input type="date" id="dateTo" onchange="window.filterData()">
                </div>
                <button onclick="window.copyFullDashboard()" class="bg-[#0d4b73] text-white px-5 py-2 rounded-xl text-xs font-black shadow-md ml-2">نسخ التقرير 📷</button>
            </div>
        </header>

        <div class="bg-white rounded-[40px] p-10 card-shadow border border-slate-50 flex items-center justify-between">
            <div>
                <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-2">إجمالي الزيارات المنفذة</h2>
                <span class="text-9xl font-black text-[#0d4b73] leading-none" id="totalVisits">0</span>
            </div>
            <div id="filterLabel" class="bg-blue-50 text-[#0d4b73] text-[10px] font-black px-6 py-2 rounded-full h-fit">كل الأوقات</div>
        </div>

        <div id="sideBrandList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white rounded-[40px] p-10 card-shadow h-[450px] flex flex-col items-center justify-center relative text-center">
                <h3 class="text-sm font-black text-[#0d4b73] absolute top-10 right-10">الوضع العام للأجهزة</h3>
                <div class="w-60 h-60 relative flex items-center justify-center">
                    <canvas id="cUps"></canvas>
                    <div id="statsUps" class="hidden"><div id="valUps" class="text-7xl font-black text-[#0d4b73]">0</div><div id="pctUps" class="text-xl font-black text-green-500">0%</div></div>
                    <div class="absolute inset-0 flex items-center justify-center pt-10" id="upsPctOverlay"><span class="text-5xl font-black text-[#0d4b73]" id="upsPct">0%</span></div>
                </div>
            </div>
            <div class="bg-white rounded-[40px] p-10 card-shadow h-[450px] flex flex-col">
                <h3 class="text-sm font-black text-[#0d4b73] mb-10">Connectivity Performance</h3>
                <div id="containerConn" class="flex-1 relative flex flex-col items-center justify-center text-center">
                    <canvas id="cConn"></canvas>
                    <div id="statsConn" class="hidden"><div id="valConn" class="text-7xl font-black text-[#0d4b73]">0</div><div id="pctConn" class="text-xl font-black text-[#10b981]">0%</div></div>
                </div>
            </div>
        </div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [] };

    // 1. تثبيت الساعة والمعلومات الحية
    setInterval(() => {
        const now = new Date();
        $('currentDate').innerText = now.toLocaleDateString('en-GB').replace(/\//g, ' - ');
        $('liveClock').innerText = now.toLocaleTimeString('en-GB', { hour12: false });
    }, 1000);

    const CATEGORIES = { hardware: "Hardware & Peripherals", network: "Network Infrastructure", software: "Software & Systems", systems: "Systems Assessment" };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 1000); return; }
        
        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); window.updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { 
            state.allVisits = snap.docs.map(d => d.data());
            discoverAllFields();
            window.filterData(); 
        });
    }

    function discoverAllFields() {
        const discovered = { hardware:[], network:[], software:[], systems:[], other:[] };
        state.allVisits.forEach(v => {
            const answers = v.dynamicAnswers || {};
            Object.keys(answers).forEach(key => {
                if (key.includes('Bcjdip') || key.includes('net')) discovered.network.push(key);
                else if (key.includes('8LQ9F') || key.includes('pc')) discovered.hardware.push(key);
                else if (key.includes('soft') || key.includes('win')) discovered.software.push(key);
                else if (key.includes('ups') || key.includes('pwr')) discovered.systems.push(key);
            });
        });
        Object.keys(discovered).forEach(k => discovered[k] = [...new Set(discovered[k])]);
        renderDiscoveryUI(discovered);
    }

    function renderDiscoveryUI(data) {
        $('assessmentManager').innerHTML = Object.keys(CATEGORIES).map(cat => `
            <div class="bg-white/5 p-4 rounded-[24px] border border-white/5">
                <h3 class="text-[10px] font-black text-blue-300 uppercase mb-3 border-b border-white/10 pb-2">${CATEGORIES[cat]}</h3>
                <div class="space-y-1.5 max-h-[180px] overflow-y-auto custom-scroll">
                    ${data[cat].map(fId => `
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" value="${fId}" class="custom-checkbox field-chk" onchange="window.renderCharts()">
                            <span class="text-[9px] font-bold opacity-70 group-hover:opacity-100 truncate">${fId}</span>
                        </label>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    // ✅ إصلاح نطاق الدوال (Global Scope) لحل مشكلة ReferenceError ✅
    window.filterData = function() {
        const from = $('dateFrom').value, to = $('dateTo').value;
        if (!from && !to) {
            state.filteredVisits = [...state.allVisits];
            $('filterLabel').innerText = "كل الأوقات";
        } else {
            const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
            const dTo = to ? new Date(to).setHours(23,59,59,999) : Infinity;
            state.filteredVisits = state.allVisits.filter(v => {
                const vDate = v.timestamp ? v.timestamp.toDate().getTime() : 0;
                return vDate >= dFrom && vDate <= dTo;
            });
            $('filterLabel').innerText = "فترة مخصصة";
        }
        $('totalVisits').textContent = state.filteredVisits.length;
        window.updateUI();
    }

    window.updateUI = function() {
        const counts = {}; 
        state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || '';
            return `<div class="bg-white rounded-[32px] p-8 card-shadow border border-slate-100 flex items-center justify-between transition hover:shadow-lg"><span class="text-7xl font-black text-[#0d4b73] leading-none">${c}</span><div class="flex flex-col items-center gap-2"><img src="${logo}" class="w-20 h-12 object-contain"><span class="text-[11px] font-black text-slate-400 uppercase tracking-tight">${b.brand}</span></div></div>`;
        }).join('');
        window.renderCharts();
    }

    window.renderCharts = function() {
        const total = state.filteredVisits.length;
        const vType = $('viewType').value;
        const selected = Array.from(document.querySelectorAll('.field-chk:checked')).map(i => i.value);

        let s = { a: 0, w: 0, ok: 0, tot: 0 };
        state.filteredVisits.forEach(v => {
            const ans = v.dynamicAnswers || {};
            selected.forEach(f => {
                if(ans[f] === "above_the_range") s.a++;
                if(ans[f] === "within_the_range") s.w++;
                if(ans[f] === "in_shape") { s.ok++; s.tot++; } else if(ans[f]) s.tot++;
            });
        });

        const pct = s.tot > 0 ? Math.round((s.ok/s.tot)*100) : (total > 0 ? 85 : 0);
        const cPct = total > 0 ? Math.round(((s.a+s.w)/total)*100) : 0;

        drawView('cConn', 'statsConn', vType, 'conn', [s.a, s.w], ['#10b981', '#fbbf24'], s.a+s.w, cPct);
        drawView('cUps', 'statsUps', vType, 'ups', [pct, 100-pct], ['#0d4b73', '#eff4ff'], s.ok, pct);
    }

    function drawView(cid, sid, type, key, data, colors, raw, pct) {
        $(cid).style.display = (type === 'stats') ? 'none' : 'block';
        $(sid).style.display = (type === 'stats') ? 'block' : 'none';
        if (cid === 'cUps') $('upsPctOverlay').style.display = (type === 'doughnut') ? 'flex' : 'none';

        if (type === 'stats') {
            $(sid).querySelector('div:first-child').innerText = raw;
            $(sid).querySelector('div:last-child').innerText = pct + "%";
            return;
        }

        if (charts[key]) charts[key].destroy();
        charts[key] = new Chart($(cid), {
            type: type,
            data: { labels: ['ممتاز', 'جيد'], datasets: [{ data, backgroundColor: colors, borderRadius: 15, barThickness: 10 }] },
            options: { indexAxis: (type==='bar'?'y':'x'), maintainAspectRatio: false, plugins: { legend: {display: type==='doughnut'} }, cutout: (type==='doughnut'?'82%':0) }
        });
        if (cid === 'cUps') $('upsPct').innerText = pct + "%";
    }

    window.copyFullDashboard = async function() {
        const excluded = document.querySelectorAll('.exclude-from-capture');
        excluded.forEach(el => el.style.opacity = '0');
        const canvas = await html2canvas($('captureArea'), { backgroundColor: '#f4f7fa', scale: 2, useCORS: true });
        excluded.forEach(el => el.style.opacity = '1');
        canvas.toBlob(async (blob) => { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); alert("تم النسخ ✅"); });
    }

    boot();
})();
</script>
</body>
</html>
