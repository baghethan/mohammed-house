<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Site Visit v3.2 – Auth Enabled</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef3f8}
.hidden{display:none}
header{background:#0d4b73;color:#fff;padding:14px}
.container{max-width:1200px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
input,button{padding:10px;border-radius:8px;border:1px solid #ccc;width:100%}
button{background:#2f9e66;color:#fff;border:none;cursor:pointer}
button.danger{background:#d64545}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{padding:14px;border-radius:12px;background:#f8fbff;border:1px solid #dde6ef}
.stat strong{display:block;font-size:26px;color:#0d4b73}
.stat span{font-size:13px;color:#555}
</style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginBox" class="container">
  <div class="card">
    <h3>تسجيل الدخول</h3>
    <input id="loginEmail" type="email" placeholder="Email">
    <br><br>
    <input id="loginPassword" type="password" placeholder="Password">
    <br><br>
    <button id="loginBtn">دخول</button>
    <p id="loginMsg"></p>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">

<header>
  <strong>إدارة زيارات الفروع والفنيين – v3.2</strong>
  <button id="logoutBtn" class="danger" style="float:left">Logout</button>
</header>

<div class="container">

<div class="card">
  <h3>Dashboard (بيانات من Firebase)</h3>
  <div class="stats">
    <div class="stat"><strong id="statBranches">0</strong><span>الفروع</span></div>
    <div class="stat"><strong id="statTechnicians">0</strong><span>الفنيين</span></div>
    <div class="stat"><strong id="statVisits">0</strong><span>الزيارات</span></div>
    <div class="stat"><strong id="statChecklists">0</strong><span>Check‑Lists</span></div>
    <div class="stat"><strong id="statBrands">0</strong><span>البراندات</span></div>
  </div>
</div>

<div class="card">
  <div id="status">✅ تم تسجيل الدخول وتحميل البيانات</div>
</div>

</div>
</div>

<script type="module">
/* ===== Firebase Imports ===== */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, query, orderBy, onSnapshot } 
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ===== Firebase Config (نفس مشروعك) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain: "baghethan-ba325.firebaseapp.com",
  projectId: "baghethan-ba325",
  storageBucket: "baghethan-ba325.appspot.com",
  messagingSenderId: "944819735112",
  appId: "1:944819735112:web:07315600da39377320667d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

/* ===== State ===== */
const state = {
  branches: [], technicians: [], visits: [], checklists: [], brands: []
};

/* ===== Render ===== */
function renderStats(){
  $('statBranches').textContent = state.branches.length;
  $('statTechnicians').textContent = state.technicians.length;
  $('statVisits').textContent = state.visits.length;
  $('statChecklists').textContent = state.checklists.length;
  $('statBrands').textContent = state.brands.length;
}

/* ===== Auth ===== */
$('loginBtn').onclick = async () => {
  try{
    await signInWithEmailAndPassword(
      auth,
      $('loginEmail').value.trim(),
      $('loginPassword').value
    );
  }catch(err){
    $('loginMsg').textContent = err.message;
  }
};

$('logoutBtn').onclick = async () => {
  await signOut(auth);
};

onAuthStateChanged(auth, user=>{
  if(user){
    $('loginBox').classList.add('hidden');
    $('app').classList.remove('hidden');
    startListeners();
  }else{
    $('loginBox').classList.remove('hidden');
    $('app').classList.add('hidden');
  }
});

/* ===== Firestore Listeners ===== */
function startListeners(){

  onSnapshot(collection(db,'branches'), snap=>{
    state.branches = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStats();
  });

  onSnapshot(query(collection(db,'technicians'), orderBy('name')), snap=>{
    state.technicians = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStats();
  });

  onSnapshot(query(collection(db,'siteVisits'), orderBy('date','desc')), snap=>{
    state.visits = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStats();
  });

  onSnapshot(query(collection(db,'branch_checklists'), orderBy('visitDate','desc')), snap=>{
    state.checklists = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStats();
  });

  onSnapshot(collection(db,'brand_assets'), snap=>{
    state.brands = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderStats();
  });
}
</script>

</body>
</html>
