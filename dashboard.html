<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard v7.0.0 | Almajdouie Master Assessment</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7fa; }
        .card-shadow { box-shadow: 0 10px 40px rgba(0, 30, 64, 0.05); }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        
        .custom-checkbox {
            width: 14px; height: 14px; border-radius: 4px; border: 2px solid rgba(255,255,255,0.2);
            background: transparent; cursor: pointer; appearance: none; position: relative;
        }
        .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        .custom-checkbox:checked::after { content: '✓'; position: absolute; color: white; font-size: 9px; top: -2px; left: 1px; }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .stat-huge { font-size: 5rem; font-weight: 900; color: #0d4b73; line-height: 1; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div class="max-w-[1440px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[40px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">🔍</div>
                    <div>
                        <h2 class="text-xl font-black">مدير حقول الـ Check-List الشامل</h2>
                        <p class="text-[10px] font-bold opacity-60 uppercase tracking-widest">Full Assessment Discovery & Categorization</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-[9px] opacity-50">نوع عرض التقرير:</p>
                        <select id="viewType" class="bg-white/10 text-white text-[11px] font-bold border-none rounded-lg p-1" onchange="renderCharts()">
                            <option value="bar" class="text-black">أعمدة (Bar)</option>
                            <option value="doughnut" class="text-black">دونات (Doughnut)</option>
                            <option value="stats" class="text-black">أرقام (Stats)</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="assessmentManager">
                </div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex flex-wrap justify-between items-center gap-4 text-[11px] font-black">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">VERSION: <span class="text-blue-300">v7.0.0 Turbo</span></div>
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">DATE: <span id="currentDate">--</span></div>
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">TIME: <span id="liveClock" class="text-green-400">00:00:00</span></div>
                </div>
                <div class="flex gap-2">
                    <button onclick="boot()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl transition">إعادة مسح الحقول 🔃</button>
                    <button onclick="updateUI()" class="bg-[#10b981] hover:bg-green-600 text-white px-8 py-2.5 rounded-xl transition shadow-lg">تحديث الرسوم</button>
                </div>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1440px] mx-auto space-y-8 bg-[#f4f7fa] p-10 rounded-[50px]">
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-4">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-10 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73]">ALMAJDOUIE MOTORS</h1>
            </div>
            <div class="flex items-center gap-4 exclude-from-capture">
                <input type="date" id="dateFrom" onchange="filterData()" class="rounded-xl border-slate-200 text-xs font-bold">
                <button onclick="copyFullDashboard()" class="bg-[#0d4b73] text-white px-8 py-3 rounded-[20px] text-sm font-black shadow-xl">نسخ التقرير 📷</button>
            </div>
        </header>

        <div class="bg-white rounded-[40px] p-10 card-shadow border border-slate-50 flex items-center justify-between">
            <div>
                <h2 class="text-sm font-black text-slate-400 uppercase mb-2">إجمالي الزيارات المنفذة</h2>
                <span class="text-9xl font-black text-[#0d4b73] leading-none" id="totalVisits">0</span>
            </div>
            <div id="filterLabel" class="bg-blue-50 text-[#0d4b73] text-xs font-black px-6 py-2 rounded-full">كل الأوقات</div>
        </div>

        <div id="sideBrandList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white rounded-[40px] p-10 card-shadow h-[450px] flex flex-col items-center justify-center relative">
                <h3 class="text-sm font-black text-[#0d4b73] absolute top-10 right-10" id="t-chart-1">UPS Status</h3>
                <div class="w-60 h-60 relative flex items-center justify-center">
                    <canvas id="cUps"></canvas>
                    <div id="statsUps" class="hidden text-center"><div id="valUps" class="stat-huge">0</div><div id="pctUps" class="stat-pct">0%</div></div>
                    <div class="absolute inset-0 flex items-center justify-center pt-10" id="upsPctOverlay"><span class="text-4xl font-black text-[#0d4b73]" id="upsPct">0%</span></div>
                </div>
            </div>
            <div class="bg-white rounded-[40px] p-10 card-shadow h-[450px] flex flex-col">
                <h3 class="text-sm font-black text-[#0d4b73] mb-10" id="t-chart-2">Connectivity & Network</h3>
                <div id="containerConn" class="flex-1 relative flex flex-col items-center justify-center">
                    <canvas id="cConn"></canvas>
                    <div id="statsConn" class="hidden text-center"><div id="valConn" class="stat-huge">0</div><div id="pctConn" class="stat-pct">0%</div></div>
                </div>
            </div>
        </div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [], fields: {} };

    // تحديث الوقت الحي
    setInterval(() => {
        const now = new Date();
        $('currentDate').innerText = now.toLocaleDateString('en-GB');
        $('liveClock').innerText = now.toLocaleTimeString('en-GB', { hour12: false });
    }, 1000);

    // 🕵️ ماب ذكي لتوزيع الحقول آلياً بناءً على الكلمات المفتاحية 🕵️
    const CATEGORIES = {
        "hardware": "Hardware & Peripherals",
        "network": "Network Infrastructure",
        "software": "Software & Systems",
        "systems": "Systems Assessment"
    };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 500); return; }
        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { 
            state.allVisits = snap.docs.map(d => d.data());
            discoverAllFields(); // سحب كل شيء من التشيك ليست
            filterData(); 
        });
    }

    function discoverAllFields() {
        const discovered = { hardware:[], network:[], software:[], systems:[], other:[] };
        state.allVisits.forEach(v => {
            const answers = v.dynamicAnswers || {};
            Object.keys(answers).forEach(key => {
                // منطق التوزيع الذكي
                if (key.includes('Bcjdip') || key.includes('net') || key.includes('wifi')) discovered.network.push(key);
                else if (key.includes('8LQ9F') || key.includes('pc') || key.includes('print')) discovered.hardware.push(key);
                else if (key.includes('software') || key.includes('win') || key.includes('app')) discovered.software.push(key);
                else if (key.includes('ups') || key.includes('pwr') || key.includes('server')) discovered.systems.push(key);
                else discovered.other.push(key);
            });
        });

        // تنظيف التكرارات وتوليد الواجهة
        Object.keys(discovered).forEach(k => discovered[k] = [...new Set(discovered[k])]);
        renderDiscoveryUI(discovered);
    }

    function renderDiscoveryUI(data) {
        $('assessmentManager').innerHTML = Object.keys(CATEGORIES).map(cat => `
            <div class="bg-white/5 p-4 rounded-[24px] border border-white/5">
                <h3 class="text-[10px] font-black text-blue-300 uppercase mb-3 border-b border-white/10 pb-2">${CATEGORIES[cat]}</h3>
                <div class="space-y-1.5 max-h-[180px] overflow-y-auto custom-scroll">
                    ${data[cat].map(fId => `
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" value="${fId}" class="custom-checkbox field-chk" data-cat="${cat}" onchange="renderCharts()">
                            <span class="text-[9px] font-bold opacity-70 group-hover:opacity-100 truncate">${fId}</span>
                        </label>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    window.filterData = function() {
        const from = $('dateFrom').value;
        const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
        state.filteredVisits = state.allVisits.filter(v => (v.timestamp ? v.timestamp.toDate().getTime() : 0) >= dFrom);
        $('totalVisits').textContent = state.filteredVisits.length;
        updateUI();
    }

    window.updateUI = function() {
        const counts = {}; state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || '';
            return `<div class="bg-white rounded-[32px] p-8 shadow-sm border border-slate-100 flex items-center justify-between transition hover:shadow-lg"><span class="text-7xl font-black text-[#0d4b73] leading-none">${c}</span><div class="flex flex-col items-center gap-2"><img src="${logo}" class="w-20 h-12 object-contain"><span class="text-[12px] font-black text-slate-400 uppercase tracking-tight">${b.brand}</span></div></div>`;
        }).join('');
        renderCharts();
    }

    function renderCharts() {
        const total = state.filteredVisits.length;
        const vType = $('viewType').value;
        const selectedFields = Array.from(document.querySelectorAll('.field-chk:checked')).map(i => i.value);

        let s = { a: 0, w: 0, ok: 0, total: 0 };
        state
