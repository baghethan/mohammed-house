<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IT Assessment Master v8.1.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; transition: all 0.3s ease; }
        .card-shadow { box-shadow: 0 20px 50px rgba(0, 30, 64, 0.08); }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        .stat-huge { font-size: 5rem; font-weight: 900; color: #0d4b73; line-height: 1; letter-spacing: -2px; }
        .stat-pct { font-size: 1.5rem; font-weight: 900; color: #10b981; }
        input[type="date"], select { border: 1px solid #e2e8f0; border-radius: 10px; padding: 5px 10px; font-size: 11px; font-weight: 700; color: #0d4b73; outline: none; }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body class="p-4 lg:p-8 overflow-x-hidden">

    <div class="max-w-[1600px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[45px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">⚙️</div>
                    <div>
                        <h2 class="text-xl font-black">مدير تخصيص تقارير الـ IT</h2>
                        <p class="text-[9px] font-bold opacity-50 uppercase tracking-widest">Independent Section Control v8.1.0</p>
                    </div>
                </div>
                <div id="liveClock" class="text-lg font-black text-green-400 font-mono">00:00:00</div>
            </div>

            <div id="configGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                </div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex justify-between items-center text-[10px] font-black">
                <div class="flex items-center gap-4 text-blue-300 uppercase">
                    <span>Engine: Stable ✅</span>
                    <span>Version: v8.1.0 Turbo</span>
                </div>
                <button onclick="window.renderCharts()" class="bg-[#10b981] hover:bg-green-600 text-white px-10 py-3 rounded-2xl transition shadow-lg">تحديث كافة البيانات 🔃</button>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1600px] mx-auto space-y-8 bg-[#f0f2f5] p-12 rounded-[70px]">
        
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-5">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-12 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73] uppercase tracking-tighter border-r-4 border-blue-900 pr-4">IT Assessment Report</h1>
            </div>
            
            <div class="flex items-center gap-4 exclude-from-capture">
                <div class="bg-white px-5 py-2.5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                    <div class="flex items-center gap-2 border-l pl-4">
                        <span class="text-[10px] font-black text-slate-400 uppercase">From</span>
                        <input type="date" id="dateFrom" onchange="window.filterData()">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black text-slate-400 uppercase">To</span>
                        <input type="date" id="dateTo" onchange="window.filterData()">
                    </div>
                </div>
                <button onclick="window.copyFullDashboard()" class="bg-[#0d4b73] text-white px-8 py-3 rounded-2xl text-sm font-black shadow-xl active:scale-95 transition">Copy Image 📷</button>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-8 items-stretch">
            <div class="col-span-12 lg:col-span-4 bg-white rounded-[55px] p-12 card-shadow border border-slate-50 flex flex-col justify-center text-center">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Total Execution | إجمالي الزيارات</h2>
                <span class="text-9xl font-black text-[#0d4b73] leading-none tracking-tighter" id="totalVisits">0</span>
            </div>
            <div id="sideBrandList" class="col-span-12 lg:col-span-8 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10" id="reportsGrid">
            </div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [] };

    setInterval(() => { $('liveClock').innerText = new Date().toLocaleTimeString('en-GB', { hour12: false }); }, 1000);

    // 🕵️ ماب الأقسام والبنود مع تحديد منطق النجاح لكل نوع سؤال 🕵️
    const SCHEMA = {
        hardware: {
            title: "Hardware & Peripherals Assessment",
            color: "#3b82f6",
            items: {
                "8LQ9F3Rj4MsNDkTbO5Pi": { label: "PCs Condition", success: ["fully_functioning"] },
                "EeypXJo6RgtxIhcVVfzk": { label: "Printers Condition", success: ["fully_functioning"] },
                "9EozMBKysmOoajPkgUTh": { label: "Unified Communication", success: ["fully_functioning"] },
                "unused_assets": { label: "Unused or Damaged Assets", success: ["no"] }
            }
        },
        network: {
            title: "Network Infrastructure Assessment",
            color: "#10b981",
            items: {
                "BcjdipZxDmVgodHk9t1B": { label: "Network Cabinets Condition", success: ["in_shape"] },
                "upload_speed": { label: "Upload 4-6 Mbps", success: ["above_the_range", "within_the_range"] },
                "infra_cond": { label: "Low Current Infrastructure", success: ["in_shape"] },
                "download_speed": { label: "Download 6-9 Mbps", success: ["above_the_range", "within_the_range"] },
                "room_temp": { label: "Server Room Temperature", success: ["within_the_range"] },
                "ups_status": { label: "UPS Status", success: ["fully_functioning"] }
            }
        },
        software: {
            title: "Software & Systems Assessment",
            color: "#f59e0b",
            items: {
                "6fx4HNunJZRyPziv5r02": { label: "Operating System Up to Date", success: ["yes"] },
                "cleanup_apps": { label: "Cleanup/Remove Unwanted Apps", success: ["yes"] },
                "onedrive": { label: "OneDrive Backup", success: ["yes", "partially"] },
                "portals": { label: "Customer Facing Portals", success: ["yes", "partially"] },
                "erp_apps": { label: "ERP & Business Applications", success: ["yes"] },
                "training_req": { label: "Training Requirement", type: "multi" }
            }
        },
        systems: {
            title: "Systems Assessment",
            color: "#0d4b73",
            items: {
                "EcfiAfRlykxLot8a913E": { label: "Upgrade Windows_11", success: ["yes"] }
            }
        }
    };

    const TRAINING_OPTS = ["Customer Facing Portals", "ERP Functions", "Business Solutions", "Service Desk & End User Support", "IT Soft Skills", "No Requirement for IT Training", "Other"];

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 1000); return; }

        // 1. توليد لوحة التحكم
        $('configGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white/5 p-5 rounded-[30px] border border-white/10">
                <h3 class="text-[10px] font-black text-blue-300 uppercase mb-4 tracking-tighter">${SCHEMA[key].title}</h3>
                <select id="type-${key}" class="w-full bg-white/10 text-white text-[10px] font-black border-none rounded-xl p-2 mb-4" onchange="window.renderCharts()">
                    <option value="bar" class="text-black">شارت أعمدة (Bar)</option>
                    <option value="doughnut" class="text-black">دونات (Doughnut)</option>
                    <option value="stats" class="text-black">أرقام ونسبة (Stats)</option>
                </select>
                <div class="space-y-1 max-h-[100px] overflow-y-auto custom-scroll">
                    ${Object.keys(SCHEMA[key].items).map(fId => `<label class="flex items-center gap-2 cursor-pointer opacity-70 hover:opacity-100"><input type="checkbox" value="${fId}" data-cat="${key}" checked class="w-3 h-3 rounded text-green-500 border-none" onchange="window.renderCharts()"><span class="text-[9px] font-bold truncate">${SCHEMA[key].items[fId].label}</span></label>`).join('')}
                </div>
            </div>
        `).join('');

        // 2. توليد كروت التقارير
        $('reportsGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white rounded-[55px] p-10 card-shadow flex flex-col min-h-[500px]">
                <h3 class="text-sm font-black text-[#0d4b73] mb-8 uppercase border-b border-slate-50 pb-4">${SCHEMA[key].title}</h3>
                <div id="container-${key}" class="flex-1 relative flex flex-col items-center justify-center">
                    <canvas id="chart-${key}"></canvas>
                    <div id="stats-${key}" class="hidden text-center">
                        <div class="stat-huge" id="val-${key}">0</div>
                        <div class="stat-pct" id="pct-${key}">0%</div>
                        <p class="text-[10px] font-bold text-slate-400 mt-2">Section Compliance</p>
                    </div>
                </div>
            </div>
        `).join('');

        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); window.updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { state.allVisits = snap.docs.map(d => d.data()); window.filterData(); });
    }

    window.filterData = function() {
        const from = $('dateFrom').value, to = $('dateTo').value;
        const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
        const dTo = to ? new Date(to).setHours(23,59,59,999) : Infinity;
        state.filteredVisits = state.allVisits.filter(v => {
            const vDate = v.timestamp ? v.timestamp.toDate().getTime() : 0;
            return vDate >= dFrom && vDate <= dTo;
        });
        $('totalVisits').textContent = state.filteredVisits.length;
        window.updateUI();
    }

    window.updateUI = function() {
        const counts = {}; state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || '';
            return `<div class="bg-white rounded-[35px] p-8 shadow-sm border border-slate-50 flex items-center justify-between"><span class="text-7xl font-black text-[#0d4b73]">${c}</span><div class="flex flex-col items-center gap-1"><img src="${logo}" class="w-16 h-10 object-contain"><span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">${b.brand}</span></div></div>`;
        }).join('');
        window.renderCharts();
    }

    window.renderCharts = function() {
        Object.keys(SCHEMA).forEach(catKey => {
            const type = $(`type-${catKey}`).value;
            const selectedFields = Array.from(document.querySelectorAll(`input[data-cat="${catKey}"]:checked`)).map(i => i.value);
            const dataSet = { labels: [], values: [], successCount: 0, totalCount: 0, training: {} };

            TRAINING_OPTS.forEach(opt => dataSet.training[opt] = 0);

            selectedFields.forEach(fId => {
                const config = SCHEMA[catKey].items[fId];
                let itemOk = 0, itemTot = 0;

                state.filteredVisits.forEach(v => {
                    const ans = (v.dynamicAnswers || {})[fId];
                    if (ans) {
                        if (config.type === "multi") {
                            TRAINING_OPTS.forEach(opt => { if (ans.includes(opt)) dataSet.training[opt]++; });
                            itemTot++; 
                        } else {
                            itemTot++; dataSet.totalCount++;
                            if (config.success.includes(ans)) { itemOk++; dataSet.successCount++; }
                        }
                    }
                });

                if (config.type !== "multi") {
                    dataSet.labels.push(config.label);
                    dataSet.values.push(itemTot > 0 ? Math.round((itemOk/itemTot)*100) : 0);
                } else {
                    Object.keys(dataSet.training).forEach(opt => { dataSet.labels.push(opt); dataSet.values.push(dataSet.training[opt]); });
                }
            });

            const overallPct = dataSet.totalCount > 0 ? Math.round((dataSet.successCount/dataSet.totalCount)*100) : 0;
            
            // تبديل واجهة العرض
            $(`chart-${catKey}`).style.display = (type === 'stats') ? 'none' : 'block';
            $(`stats-${catKey}`).style.display = (type === 'stats') ? 'block' : 'none';

            if (type === 'stats') {
                $(`val-${catKey}`).innerText = dataSet.successCount;
                $(`pct-${catKey}`).innerText = overallPct + "%";
            } else {
                if (charts[catKey]) charts[catKey].destroy();
                charts[catKey] = new Chart($(`chart-${catKey}`), {
                    type: type,
                    data: {
                        labels: dataSet.labels,
                        datasets: [{ 
                            data: (type === 'doughnut' && catKey !== 'software' ? [overallPct, 100-overallPct] : dataSet.values), 
                            backgroundColor: (type === 'doughnut' ? [SCHEMA[catKey].color, '#eff4ff'] : SCHEMA[catKey].color), 
                            borderRadius: 15, barThickness: 14 
                        }]
                    },
                    options: {
                        indexAxis: (type === 'bar' ? 'y' : 'x'),
                        maintainAspectRatio: false,
                        plugins: { legend: { display: (type === 'doughnut') } },
                        scales: type === 'bar' ? { x: { max: (catKey === 'software' && selectedFields.includes('training_req')) ? undefined : 100, display: false }, y: { grid: { display: false }, ticks: { font: { weight: 'bold', size: 11 }, color: '#0d4b73' } } } : { display: false }
                    }
                });
            }
        });
    }

    window.copyFullDashboard = async function() {
        const area = $('captureArea');
        const excluded = document.querySelectorAll('.exclude-from-capture');
        excluded.forEach(el => el.style.opacity = '0');
        const canvas = await html2canvas(area, { backgroundColor: '#f0f2f5', scale: 2, useCORS: true });
        excluded.forEach(el => el.style.opacity = '1');
        canvas.toBlob(async (blob) => { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); alert("تم نسخ التقرير كصورة بنجاح ✅"); });
    }

    boot();
})();
</script>
</body>
</html>
