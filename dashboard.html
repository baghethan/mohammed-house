<section id="reports" class="panel">

  <div class="card">
    <h3>تقارير Check‑List (Dashboard)</h3>

    <div class="grid-4">
      <div class="field">
        <label>الفني</label>
        <select id="reportTechnicianFilter">
          <option value="">كل الفنيين</option>
        </select>
      </div>

      <div class="field">
        <label>البراند</label>
        <select id="reportBrandFilter">
          <option value="">كل البراندات</option>
        </select>
      </div>

      <div class="field">
        <label>من تاريخ</label>
        <input type="date" id="reportFromDate">
      </div>

      <div class="field">
        <label>إلى تاريخ</label>
        <input type="date" id="reportToDate">
      </div>

      <div class="field">
        <label>نوع الشارت</label>
        <select id="reportChartType">
          <option value="bar">Bar</option>
          <option value="stacked">Stacked</option>
        </select>
      </div>

      <div class="field">
        <label>هدف الإنجاز (%)</label>
        <input type="number" id="reportTargetValue" value="80" min="0" max="100">
      </div>
    </div>
  </div>

  <div class="card">
    <h3>تقييم Check‑List حسب الأقسام</h3>
    <canvas id="assessmentChart" height="120"></canvas>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>نسبة الإنجاز الإجمالية</h3>
    <canvas id="assessmentPie" height="120"></canvas>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>تطور الأداء الزمني + خط الهدف</h3>
    <canvas id="performanceLine" height="120"></canvas>
  </div>

</section>
