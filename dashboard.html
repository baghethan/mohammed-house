<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Dashboard v3.6.0 | Almajdouie Motors</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <style>
    :root { --bg: #f8fafc; --primary: #0d4b73; --accent: #ffd54f; --card: #ffffff; }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
    
    /* الشريط الجانبي المطور */
    .sidebar { 
      width: 320px; background: #fff; border-inline-start: 2px solid #e2e8f0; 
      padding: 20px; display: flex; flex-direction: column; overflow-y: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.05); z-index: 10;
    }
    
    .total-section { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid var(--bg); }
    #totalVisits { font-size: 80px; font-weight: 900; color: var(--primary); margin: 0; line-height: 1; }
    .total-label { font-size: 14px; font-weight: 800; color: #64748b; margin-top: 10px; }

    .sidebar-title { font-size: 16px; font-weight: 900; color: var(--primary); margin-bottom: 20px; text-align: center; }
    
    /* تصميم بطاقة البراند الجديد (عمودي) */
    .brand-item { 
      display: flex; flex-direction: column; align-items: center; 
      padding: 15px; background: #f9fafb; border-radius: 12px; 
      margin-bottom: 15px; border: 1px solid #edf2f7; transition: 0.3s;
    }
    .brand-logo { width: 70px; height: 40px; object-fit: contain; margin-bottom: 8px; }
    .brand-name { font-size: 15px; font-weight: 900; color: #334155; margin-bottom: 5px; }
    .brand-count { 
      background: var(--primary); color: #fff; font-size: 18px; 
      padding: 2px 15px; border-radius: 20px; font-weight: 900; 
      box-shadow: 0 2px 5px rgba(13, 75, 115, 0.2);
    }

    /* المنطقة الرئيسية للرسوم */
    .main-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .top-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: var(--card); border-radius: 12px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
    .card-header { background: var(--primary); color: #fff; padding: 12px 20px; font-size: 14px; font-weight: 800; }
    .card-body { padding: 15px; position: relative; min-height: 240px; flex: 1; display: flex; align-items: center; justify-content: center; }
    #upsPct { position: absolute; font-size: 35px; font-weight: 900; color: var(--primary); }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="total-section">
      <h1 id="totalVisits">0</h1>
      <div id="t-total-label" class="total-label">إجمالي الزيارات الميدانية</div>
    </div>
    <div class="sidebar-title" id="t-brands">البراندات التي تمت زيارتها</div>
    <div id="sideBrandList">
      </div>
  </aside>

  <main class="main-content">
    <div class="top-row">
      <div class="card">
        <div class="card-header" id="t-ups">حالة الـ UPS</div>
        <div class="card-body">
          <canvas id="cUps"></canvas>
          <div id="upsPct">0%</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header" id="t-conn">جودة الاتصال</div>
        <div class="card-body"><canvas id="cConn"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header" id="t-net">أجهزة الشبكة</div>
        <div class="card-body"><canvas id="cNet"></canvas></div>
      </div>
    </div>

    <div class="card" style="flex:1;">
      <div class="card-header" id="t-train">المتطلبات التدريبية</div>
      <div class="card-body" style="min-height: 300px;"><canvas id="cTrain"></canvas></div>
    </div>
  </main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  Chart.register(ChartDataLabels);
  let charts = {}, state = { visits: [], brands: [], lang: 'ar' };

  const i18n = {
    ar: { brands: "البراندات النشطة", totalLabel: "إجمالي الزيارات", net: "أجهزة الشبكة", conn: "جودة الاتصال", ups: "حالة الـ UPS", train: "المتطلبات التدريبية", inShape: "ممتاز", needArr: "ترتيب" },
    en: { brands: "Active Brands", totalLabel: "Total Visits", net: "Network", conn: "Connection", ups: "UPS Status", train: "Training Needs", inShape: "In Shape", needArr: "Needs Arr." }
  };

  function applyLanguage(lang) {
    state.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    const d = i18n[lang];
    $('t-brands').innerText = d.brands; $('t-total-label').innerText = d.totalLabel;
    $('t-net').innerText = d.net; $('t-conn').innerText = d.conn;
    $('t-ups').innerText = d.ups; $('t-train').innerText = d.train;
    updateUI();
  }

  window.addEventListener('message', e => { if (e.data.type === 'LANG_CHANGE') applyLanguage(e.data.lang); });

  function boot(){
    const db = window.parent.appDb;
    if (!db) { setTimeout(boot, 500); return; }
    applyLanguage(window.parent.currentLang || 'ar');

    db.collection('brand_assets').onSnapshot(snap => {
        state.brands = snap.docs.map(d => d.data());
        updateUI();
    });

    db.collection('branch_checklists').onSnapshot(snap => {
        state.visits = snap.docs.map(d => d.data());
        $('totalVisits').textContent = state.visits.length;
        updateUI();
    });
  }

  function updateUI() {
    const counts = {};
    state.visits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });

    // فلترة البراندات لعرض النشطة فقط (> 0 زيارة)
    const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);

    $('sideBrandList').innerHTML = activeBrands.map(b => {
        const c = counts[b.brand];
        const logo = b.logoData || b.logoUrl || 'https://placehold.jp/70x40.png';
        return `
          <div class="brand-item">
            <img src="${logo}" class="brand-logo">
            <span class="brand-name">${b.brand}</span>
            <span class="brand-count">${c}</span>
          </div>`;
    }).join('');

    renderCharts();
  }

  function renderCharts() {
    const total = state.visits.length, d = i18n[state.lang];
    let s = { net: 0, conn: {a:0, w:0}, train: {} };
    state.visits.forEach(v => {
      const a = v.dynamicAnswers || {};
      if(a["8LQ9F3Rj4MsNDkTbO5Pi"] === "in_shape") s.net++;
      if(a["BcjdipZxDmVgodHk9t1B"] === "above_the_range") s.conn.a++;
      if(a["BcjdipZxDmVgodHk9t1B"] === "within_the_range") s.conn.w++;
      Object.keys(a).forEach(k => { if(k.toLowerCase().includes('train')) { let t = a[k]; if(t) s.train[t] = (s.train[t]||0)+1; }});
    });

    const calc = v => total > 0 ? Math.round((v/total)*100) : 0;
    drawBar('cNet', [d.inShape, d.needArr], [calc(s.net), 100-calc(s.net)], ['#10b981', '#cbd5e1']);
    drawBar('cConn', ['Above', 'Within'], [calc(s.conn.a), calc(s.conn.w)], ['#10b981', '#f59e0b']);
    drawDoughnut('cUps', 0);
    
    const tL = Object.keys(s.train), tD = Object.values(s.train);
    drawBar('cTrain', tL.length ? tL : ['-'], tD.length ? tD : [0], ['#0d4b73'], true);
  }

  function drawBar(id, labels, data, colors, horiz = false) {
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart($(id), {
      type: 'bar', data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 6 }] },
      options: { 
        indexAxis: horiz ? 'x' : 'y', maintainAspectRatio: false,
        plugins: { legend: {display:false}, datalabels: { color: horiz?'#475569':'#fff', font:{weight:'bold'} } },
        scales: { x: { grid:{display:false} }, y: { grid:{display:false} } }
      }
    });
  }

  function drawDoughnut(id, val) {
    $('upsPct').innerText = val + "%"; if (charts[id]) charts[id].destroy();
    charts[id] = new Chart($(id), {
      type: 'doughnut', data: { datasets: [{ data: [val, 100-val], backgroundColor: ['#0d4b73', '#e2e8f0'] }] },
      options: { cutout: '80%', maintainAspectRatio: false, plugins: { datalabels: {display:false} } }
    });
  }
  boot();
})();
</script>
</body>
</html>
