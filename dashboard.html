<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IT Dashboard v8.3.0 | Windows 11 Counter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .card-shadow { box-shadow: 0 25px 50px -12px rgba(0, 30, 64, 0.1); }
        .stat-huge { font-size: 6rem; font-weight: 900; color: #0d4b73; line-height: 1; letter-spacing: -3px; }
        .stat-label { font-size: 1rem; font-weight: 800; color: #64748b; margin-top: 10px; }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        .custom-checkbox { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); appearance: none; cursor: pointer; position: relative; }
        .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        .custom-checkbox:checked::after { content: '✓'; position: absolute; color: white; font-size: 10px; top: -2px; left: 1px; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div class="max-w-[1600px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[45px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">💻</div>
                    <div>
                        <h2 class="text-xl font-black italic">IT DASHBOARD MASTER</h2>
                        <p class="text-[9px] font-bold opacity-50 uppercase tracking-widest">Windows 11 Upgrade Tracking v8.3.0</p>
                    </div>
                </div>
                <div id="liveClock" class="text-xl font-black text-green-400 font-mono">00:00:00</div>
            </div>

            <div id="configGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex justify-between items-center text-[11px] font-black">
                <span class="text-blue-300">Logic: Dynamic Summation Active ✅</span>
                <button onclick="window.renderCharts()" class="bg-[#10b981] hover:bg-green-600 text-white px-10 py-3 rounded-2xl transition shadow-lg">تحديث البيانات حياً 🔃</button>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1600px] mx-auto space-y-8 bg-[#f1f5f9] p-12 rounded-[70px]">
        
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-5">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-12 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73] uppercase tracking-tighter pr-4 border-r-4 border-blue-900">AlMajdouie Assessment</h1>
            </div>
            
            <div class="flex items-center gap-4 exclude-from-capture">
                <div class="bg-white px-5 py-2 rounded-2xl border border-slate-200 flex items-center gap-4 shadow-sm">
                    <div class="flex items-center gap-2 border-l pl-4">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">From</span>
                        <input type="date" id="dateFrom" onchange="window.filterData()" class="border-none text-xs font-bold text-[#0d4b73]">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">To</span>
                        <input type="date" id="dateTo" onchange="window.filterData()" class="border-none text-xs font-bold text-[#0d4b73]">
                    </div>
                </div>
                <button onclick="window.copyFullDashboard()" class="bg-[#0d4b73] text-white px-8 py-3 rounded-2xl text-sm font-black shadow-xl">نسخ التقرير 📷</button>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-8 items-stretch">
            <div class="col-span-12 lg:col-span-4 bg-white rounded-[55px] p-12 card-shadow border border-slate-50 flex flex-col justify-center text-center">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Total Execution | إجمالي الزيارات</h2>
                <span class="text-9xl font-black text-[#0d4b73] leading-none tracking-tighter" id="totalVisits">0</span>
            </div>
            <div id="sideBrandList" class="col-span-12 lg:col-span-8 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10" id="reportsGrid"></div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [] };

    setInterval(() => { $('liveClock').innerText = new Date().toLocaleTimeString('en-GB', { hour12: false }); }, 1000);

    // 🕵️ ماب الأقسام والبنود مع منطق "الجمع" لقسم الأنظمة 🕵️
    const SCHEMA = {
        hardware: { title: "Hardware & Peripherals", color: "#3b82f6", items: { "8LQ9F3Rj4MsNDkTbO5Pi": { label: "PCs Condition", ok: ["fully_functioning"] }, "EeypXJo6RgtxIhcVVfzk": { label: "Printers Condition", ok: ["fully_functioning"] }, "9EozMBKysmOoajPkgUTh": { label: "Unified Communication", ok: ["fully_functioning"] }, "unused_assets": { label: "Unused/Damaged Assets", ok: ["no"] } } },
        network: { title: "Network Infrastructure", color: "#10b981", items: { "BcjdipZxDmVgodHk9t1B": { label: "Cabinets Condition", ok: ["in_shape"] }, "E8Gvjsh8fJ0rkZX7PPaK": { label: "Upload 4-6 Mbps", ok: ["above_the_range", "within_the_range"] }, "infra_cond": { label: "Low Current Infra", ok: ["in_shape"] }, "9OHHSM4ossstUSNe2q0S": { label: "Download 6-9 Mbps", ok: ["above_the_range", "within_the_range"] }, "room_temp": { label: "Server Room Temp", ok: ["within_the_range"] }, "ups_status": { label: "UPS Status", ok: ["fully_functioning"] } } },
        software: { title: "Software & Systems", color: "#f59e0b", items: { "6fx4HNunJZRyPziv5r02": { label: "OS Up to Date", ok: ["yes"] }, "cleanup": { label: "Remove Unwanted Apps", ok: ["yes"] }, "onedrive": { label: "OneDrive Backup", ok: ["yes", "partially"] }, "portals": { label: "Customer Portals", ok: ["yes", "partially"] }, "erp_apps": { label: "ERP & Business Apps", ok: ["yes"] }, "training_req": { label: "Training Requirement", type: "multi" } } },
        systems: { title: "Systems Assessment", color: "#0d4b73", items: { "EcfiAfRlykxLot8a913E": { label: "Upgrade Windows_11", ok: ["yes"], type: "sum" } } }
    };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 1000); return; }

        // توليد واجهة التحكم
        $('configGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white/5 p-5 rounded-[30px] border border-white/10">
                <h3 class="text-[10px] font-black text-blue-300 uppercase mb-4">${SCHEMA[key].title}</h3>
                <select id="type-${key}" class="w-full bg-white/10 text-white text-[10px] border-none mb-4" onchange="window.renderCharts()">
                    <option value="${key === 'systems' ? 'stats' : 'bar'}" class="text-black">${key === 'systems' ? 'إجمالي العدد (Counter)' : 'شارت أعمدة (Bar)'}</option>
                    <option value="doughnut" class="text-black">دونات (Doughnut)</option>
                    <option value="stats" class="text-black">أرقام فقط (Stats)</option>
                </select>
                <div class="space-y-1.5 max-h-[100px] overflow-y-auto custom-scroll">
                    ${Object.keys(SCHEMA[key].items).map(fId => `<label class="flex items-center gap-2 cursor-pointer opacity-70"><input type="checkbox" value="${fId}" data-cat="${key}" checked class="custom-checkbox" onchange="window.renderCharts()"><span class="text-[9px] font-bold truncate">${SCHEMA[key].items[fId].label}</span></label>`).join('')}
                </div>
            </div>
        `).join('');

        // توليد كروت التقارير
        $('reportsGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white rounded-[55px] p-10 card-shadow flex flex-col min-h-[480px]">
                <h3 class="text-sm font-black text-[#0d4b73] mb-8 uppercase border-b border-slate-50 pb-4">${SCHEMA[key].title}</h3>
                <div id="container-${key}" class="flex-1 relative flex flex-col items-center justify-center">
                    <canvas id="chart-${key}"></canvas>
                    <div id="stats-${key}" class="hidden text-center">
                        <div class="stat-huge" id="val-${key}">0</div>
                        <div class="stat-label" id="lbl-${key}">Count of "Yes" Answers</div>
                        <div class="stat-pct mt-2" id="pct-${key}">0%</div>
                    </div>
                </div>
            </div>
        `).join('');

        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); window.updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { state.allVisits = snap.docs.map(d => d.data()); window.filterData(); });
    }

    window.filterData = function() {
        const from = $('dateFrom').value, to = $('dateTo').value;
        const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
        const dTo = to ? new Date(to).setHours(23,59,59,999) : Infinity;
        state.filteredVisits = state.allVisits.filter(v => (v.timestamp ? v.timestamp.toDate().getTime() : 0) >= dFrom && (v.timestamp ? v.timestamp.toDate().getTime() : Infinity) <= dTo);
        $('totalVisits').textContent = state.filteredVisits.length;
        window.updateUI();
    }

    window.updateUI = function() {
        const counts = {}; state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || '';
            return `<div class="bg-white rounded-[35px] p-8 shadow-sm border border-slate-50 flex items-center justify-between transition hover:shadow-lg"><span class="text-7xl font-black text-[#0d4b73]">${c}</span><div class="flex flex-col items-center gap-1"><img src="${logo}" class="w-16 h-10 object-contain"><span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">${b.brand}</span></div></div>`;
        }).join('');
        window.renderCharts();
    }

    window.renderCharts = function() {
        Object.keys(SCHEMA).forEach(catKey => {
            const type = $(`type-${catKey}`).value;
            const selectedFields = Array.from(document.querySelectorAll(`input[data-cat="${catKey}"]:checked`)).map(i => i.value);
            const dataSet = { labels: [], values: [], okSum: 0, totalCount: 0 };

            selectedFields.forEach(fId => {
                const config = SCHEMA[catKey].items[fId];
                let itemOk = 0, itemTot = 0;

                state.filteredVisits.forEach(v => {
                    const ans = (v.dynamicAnswers || {})[fId];
                    if (ans) {
                        itemTot++; dataSet.totalCount++;
                        if (config.ok.includes(ans)) { itemOk++; dataSet.okSum++; }
                    }
                });

                dataSet.labels.push(config.label);
                // إذا كان النوع "جمع رقمي"، نعرض العدد الحقيقي، وإلا نعرض النسبة المئوية
                dataSet.values.push(config.type === 'sum' ? itemOk : (itemTot > 0 ? Math.round((itemOk/itemTot)*100) : 0));
            });

            const overallPct = dataSet.totalCount > 0 ? Math.round((dataSet.okSum/dataSet.totalCount)*100) : 0;
            
            $(`chart-${catKey}`).style.display = (type === 'stats') ? 'none' : 'block';
            $(`stats-${catKey}`).style.display = (type === 'stats') ? 'block' : 'none';

            if (type === 'stats') {
                $(`val-${catKey}`).innerText = dataSet.okSum; // يجمع كم عددها (نعم)
                $(`lbl-${catKey}`).innerText = catKey === 'systems' ? 'Total Windows 11 Upgrades' : 'Total Success Count';
                $(`pct-${catKey}`).innerText = catKey === 'systems' ? '' : overallPct + "%";
            } else {
                if (charts[catKey]) charts[catKey].destroy();
                charts[catKey] = new Chart($(`chart-${catKey}`), {
                    type: type,
                    data: {
                        labels: dataSet.labels,
                        datasets: [{ 
                            data: (type === 'doughnut' ? [dataSet.okSum, Math.max(0, state.filteredVisits.length - dataSet.okSum)] : dataSet.values), 
                            backgroundColor: (type === 'doughnut' ? [SCHEMA[catKey].color, '#f1f5f9'] : SCHEMA[catKey].color), 
                            borderRadius: 20, barThickness: 16 
                        }]
                    },
                    options: {
                        indexAxis: (type === 'bar' ? 'y' : 'x'),
                        maintainAspectRatio: false,
                        plugins: { legend: { display: (type === 'doughnut') } },
                        scales: type === 'bar' ? { x: { display: (catKey === 'systems'), ticks: { font: { weight: 'bold' } } }, y: { grid: { display: false }, ticks: { font: { weight: 'bold', size: 12 }, color: '#0d4b73' } } } : { display: false }
                    }
                });
            }
        });
    }

    window.copyFullDashboard = async function() {
        const excluded = document.querySelectorAll('.exclude-from-capture');
        excluded.forEach(el => el.style.opacity = '0');
        const canvas = await html2canvas($('captureArea'), { backgroundColor: '#f1f5f9', scale: 2, useCORS: true });
        excluded.forEach(el => el.style.opacity = '1');
        canvas.toBlob(async (blob) => { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); alert("Report Copied ✅"); });
    }

    boot();
})();
</script>
</body>
</html>
