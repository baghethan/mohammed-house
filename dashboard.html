<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Branch Visits Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg:#eef3f8;
  --card:#ffffff;
  --primary:#0d4b73;
  --muted:#667085;
  --blue:#4f8fdb;
  --orange:#f97316;
  --green:#22c55e;
  --deep:#0b3048;
  --deep2:#0d405e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#163247}
.hidden{display:none!important}
.container{max-width:1320px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.section-head h3{margin:0;color:var(--primary)}
button{background:#0d4b73;color:#fff;border:none;border-radius:8px;padding:10px 14px;cursor:pointer}

/* ===== Evaluation Board ===== */
.eval-board{background:linear-gradient(180deg,var(--deep),#07283d);border-radius:22px;padding:20px;color:#fff}
.eval-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.eval-header h4{margin:0;font-size:22px}
.eval-sub{font-size:13px;color:#d0d5dd}

.eval-top{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}

/* Pie */
.pie{width:220px;height:220px;border-radius:50%;background:conic-gradient(var(--blue) 0deg 210deg,var(--orange) 210deg 280deg,var(--green) 280deg 360deg);position:relative;margin:auto}
.pie-center{position:absolute;inset:36px;border-radius:50%;background:var(--deep2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pie-center strong{font-size:32px}
.pie-center span{font-size:12px;color:#d0d5dd}

.legend{display:grid;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.blue{background:var(--blue)}
.dot.orange{background:var(--orange)}
.dot.green{background:var(--green)}

/* Bars */
.eval-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}
.eval-card{background:var(--deep2);border-radius:16px;padding:14px}
.eval-card h5{margin:0 0 10px;font-size:15px}
.bar-wrap{height:140px;display:flex;align-items:flex-end;gap:12px}
.bar{width:42px;border-radius:10px 10px 0 0}
.bar.blue{background:var(--blue)}
.bar.orange{background:var(--orange)}
.percent{text-align:center;margin-top:6px;font-size:13px;color:#e5e7eb}

.session-note{background:#fff7e6;border:1px solid #f5d08a;color:#8a5a00;border-radius:14px;padding:14px}
</style>
</head>
<body>
<div class="container">

<div id="sessionNotice" class="session-note hidden">الرجاء تسجيل الدخول من الصفحة الرئيسية أولاً</div>

<div id="dashboardRoot" class="hidden">

<div class="card">
  <div class="section-head">
    <h3>التقييم من نموذج Check‑List</h3>
    <button onclick="captureEval()">نسخ صورة التقييم</button>
  </div>

  <div id="evalSection" class="eval-board">
    <div class="eval-header">
      <div>
        <h4>Overall Assessment</h4>
        <div class="eval-sub">Pie + Bar Charts (Live Data)</div>
      </div>
    </div>

    <div class="eval-top">
      <div>
        <div class="pie">
          <div class="pie-center">
            <strong>58%</strong>
            <span>Overall</span>
          </div>
        </div>
      </div>

      <div class="legend">
        <div><span class="dot blue"></span> Fully Functioning</div>
        <div><span class="dot orange"></span> Requires Service</div>
        <div><span class="dot green"></span> Other / Mixed</div>
      </div>
    </div>

    <div class="eval-grid">
      <div class="eval-card">
        <h5>Hardware & Peripherals</h5>
        <div class="bar-wrap">
          <div class="bar blue" style="height:75%"></div>
          <div class="bar orange" style="height:25%"></div>
        </div>
        <div class="percent">75%</div>
      </div>

      <div class="eval-card">
        <h5>Network Infrastructure</h5>
        <div class="bar-wrap">
          <div class="bar blue" style="height:60%"></div>
          <div class="bar orange" style="height:40%"></div>
        </div>
        <div class="percent">60%</div>
      </div>

      <div class="eval-card">
        <h5>Software & Systems</h5>
        <div class="bar-wrap">
          <div class="bar blue" style="height:85%"></div>
          <div class="bar orange" style="height:15%"></div>
        </div>
        <div class="percent">85%</div>
      </div>

      <div class="eval-card">
        <h5>Systems Assessment</h5>
        <div class="bar-wrap">
          <div class="bar blue" style="height:20%"></div>
          <div class="bar orange" style="height:80%"></div>
        </div>
        <div class="percent">20%</div>
      </div>
    </div>
  </div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
function captureEval(){
  const el = document.getElementById('evalSection');
  html2canvas(el,{backgroundColor:null,scale:2}).then(c=>{
    c.toBlob(b=>{
      if(navigator.clipboard){
        navigator.clipboard.write([new ClipboardItem({'image/png':b})]);
        alert('✅ تم نسخ صورة التقييم');
      }
    })
  })
}
(function(){
  if(!window.parent || !window.parent.firebase){
    document.getElementById('sessionNotice').classList.remove('hidden');
    return;
  }
  document.getElementById('dashboardRoot').classList.remove('hidden');
})();
</script>
</body>
</html>
