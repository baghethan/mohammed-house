<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Check‑List Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #eef3f8;
      color: #163247;
    }

    .container {
      max-width: 1440px;
      margin: 18px auto;
      padding: 0 14px 28px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }

    /* ===== Dashboard Layout ===== */
    .dashboard-board {
      background: linear-gradient(180deg,#0b3048,#07283d);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(6,24,38,.22);
    }

    .board-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 700px;
    }

    /* ===== Sidebar ===== */
    .side {
      background: #f4f7fb;
      border-left: 4px solid rgba(13,75,115,.14);
      display: flex;
      flex-direction: column;
    }

    .side-title {
      text-align: center;
      font-weight: 800;
      color: #0d4b73;
      padding: 16px;
      border-bottom: 1px solid #dbe7f1;
    }

    .side-total {
      text-align: center;
      padding: 16px;
    }

    .side-total strong {
      font-size: 32px;
      color: #0d4b73;
      display: block;
    }

    .side-total span {
      font-size: 13px;
      color: #667085;
    }

    .side-list {
      padding: 12px;
      display: grid;
      gap: 12px;
      overflow-y: auto;
    }

    /* ===== Brand Card ===== */
    .brand-item {
      background: #fff;
      border: 1px solid #dbe7f1;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 12px rgba(0,0,0,.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: contain;
      border: 1px solid #dbe7f1;
    }

    .brand-name {
      font-weight: 800;
      font-size: 15px;
      color: #22364a;
    }

    .brand-sub {
      font-size: 13px;
      color: #667085;
    }

    /* ===== Main ===== */
    .main {
      padding: 22px;
      color: #fff;
    }

    h3 {
      margin-top: 0;
    }
  </style>
</head>

<body>
<div class="container">

  <div class="card">
    <h3>Check‑List Dashboard</h3>
  </div>

  <div class="dashboard-board" id="dashboardCapture">
    <div class="board-layout">

      <!-- ===== Sidebar ===== -->
      <aside class="side">
        <div class="side-title">Visited Brands</div>

        <div class="side-total">
          <strong id="sideTotalVisits">0</strong>
          <span>إجمالي الزيارات</span>
        </div>

        <div class="side-list" id="sideBrandList"></div>
      </aside>

      <!-- ===== Main Content ===== -->
      <main class="main">
        <h3>Overall Assessment</h3>
        <p>لوحة التقييم العامة (الأقسام كما هي)</p>
      </main>

    </div>
  </div>

</div>

<script>
(function(){

  var state = {
    visits: [],
    brands: []
  };

  function escapeHtml(v){
    return String(v || '').replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  /* ===== Date Handler (حل مشكلتك) ===== */
  function getVisitDate(item){
    if (item.date && typeof item.date === 'string') {
      const d = new Date(item.date + 'T00:00:00');
      return isNaN(d.getTime()) ? null : d;
    }
    if (item.createdAt && typeof item.createdAt.toDate === 'function') {
      return item.createdAt.toDate();
    }
    return null;
  }

  function getBrandName(v){
    return v.brand || v.brandName || v.brandKey || 'بدون اسم';
  }

  function aggregateVisitedBrands(visits){
    const map = new Map();

    visits.forEach(v => {
      const name = getBrandName(v);
      if (!map.has(name)) map.set(name, 0);
      map.set(name, map.get(name) + 1);
    });

    return {
      total: visits.length,
      items: Array.from(map.entries()).map(([name, count]) => ({
        name,
        count
      }))
    };
  }

  function renderBrands(){
    const list = document.getElementById('sideBrandList');
    const totalBox = document.getElementById('sideTotalVisits');

    const agg = aggregateVisitedBrands(state.visits);
    totalBox.textContent = agg.total;

    if (!agg.items.length) {
      list.innerHTML =
        '<div class="brand-item">' +
        '<div class="brand-name">لا توجد زيارات</div>' +
        '<div class="brand-sub">ضمن الفترة</div>' +
        '</div>';
      return;
    }

    list.innerHTML = agg.items.map(item => `
      <div class="brand-item">
        <img class="brand-logo" src="" alt="">
        <div class="brand-name">${escapeHtml(item.name)}</div>
        <div class="brand-sub">${item.count} زيارة</div>
      </div>
    `).join('');
  }

  /* ===== Firebase Hook ===== */
  function start(db){
    db.collection('siteVisits').onSnapshot(snap => {
      state.visits = snap.docs.map(d => d.data());
      renderBrands();
    });
  }

  /* ===== Bootstrap ===== */
  if (window.parent && window.parent.firebase) {
    start(window.parent.firebase.firestore());
  }

})();
</script>

</body>
</html>
``
