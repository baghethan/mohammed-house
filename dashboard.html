<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Check‑List Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#eef3f8;
}

.container{
  max-width:1400px;
  margin:16px auto;
  padding:0 12px;
}

.dashboard{
  display:grid;
  grid-template-columns:1fr 300px;
  background:linear-gradient(180deg,#0b3048,#07283d);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.25);
  min-height:650px;
}

/* MAIN */
.main{
  padding:24px;
  color:#fff;
}

.main h2{
  margin-top:0;
}

/* SIDEBAR */
.side{
  background:#f9fbfe;
  border-right:1px solid #dbe7f1;
  display:flex;
  flex-direction:column;
}

.side-header{
  padding:16px;
  text-align:center;
  border-bottom:1px solid #dbe7f1;
}

.side-header h4{
  margin:0;
  font-size:16px;
  font-weight:800;
  color:#0d4b73;
}

.side-header strong{
  display:block;
  font-size:28px;
  margin-top:6px;
  color:#0d4b73;
}

.side-header span{
  font-size:12px;
  color:#667085;
}

/* Diagnostic Button */
#diagnosticBtn{
  margin-top:10px;
  padding:8px 14px;
  border-radius:8px;
  border:1px solid #cfd8e3;
  background:#eef4fb;
  color:#0d4b73;
  font-size:12px;
  cursor:pointer;
}

/* Brand list */
.side-list{
  padding:14px;
  display:grid;
  gap:12px;
  overflow-y:auto;
}

.brand-item{
  background:#fff;
  border:1px solid #dbe7f1;
  border-radius:14px;
  padding:12px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.brand-logo{
  width:64px;
  height:64px;
  border-radius:12px;
  object-fit:contain;
  border:1px solid #e3e9f1;
  background:#fff;
}

.brand-name{
  margin-top:6px;
  font-size:14px;
  font-weight:800;
  color:#22364a;
}

.brand-sub{
  font-size:12px;
  color:#667085;
}
</style>
</head>

<body>
<div class="container">
  <div class="dashboard">

    <!-- MAIN -->
    <div class="main">
      <h2>Overall Assessment</h2>
      <p style="opacity:.8">لوحة التقييم العامة</p>
    </div>

    <!-- SIDEBAR -->
    <aside class="side">
      <div class="side-header">
        <h4>Visited Brands</h4>
        <strong id="sideTotalVisits">0</strong>
        <span>إجمالي الزيارات</span>
        <button id="diagnosticBtn">فحص البيانات</button>
      </div>

      <div id="sideBrandList" class="side-list"></div>
    </aside>

  </div>
</div>

<script>
(function(){

  const state = {
    visits: [],
    brands: []
  };

  function getBrandName(v){
    return v.brand || v.brandName || v.brandKey || 'بدون اسم';
  }

  function getBrandLogo(name){
    if(!name) return '';
    const key = name.toLowerCase();
    const asset = state.brands.find(b =>
      (b.brand && b.brand.toLowerCase() === key) ||
      (b.brandKey && b.brandKey.toLowerCase() === key) ||
      (b.key && b.key.toLowerCase() === key)
    );
    if(!asset) return '';
    if(asset.logoUrl) return asset.logoUrl;
    if(asset.logoData){
      return asset.logoData.startsWith('data:image')
        ? asset.logoData
        : 'data:image/png;base64,' + asset.logoData;
    }
    return '';
  }

  function render(){
    const list = document.getElementById('sideBrandList');
    const totalBox = document.getElementById('sideTotalVisits');

    const map = {};
    state.visits.forEach(v=>{
      const name = getBrandName(v);
      map[name]=(map[name]||0)+1;
    });

    totalBox.textContent = state.visits.length;

    if(!Object.keys(map).length){
      list.innerHTML = `
        <div class="brand-item">
          <div class="brand-name">لا توجد زيارات</div>
        </div>`;
      return;
    }

    list.innerHTML = Object.entries(map).map(([name,count])=>{
      const logo = getBrandLogo(name);
      return `
        <div class="brand-item">
          ${logo
            ? `<img class="brand-logo" src="${logo"brand-logo" style="display:flex;align-items:center;justify-content:center;color:#94a3b8">—</div>`
          }
          <div class="brand-name">${name}</div>
          <div class="brand-sub">${count} زيارة</div>
        </div>`;
    }).join('');
  }

  /* ========== Diagnostic ========== */
  function runDiagnostic(){
    let report=[];

    if(window.parent && window.parent.firebase){
      report.push('✅ Firebase متصل');
    }else{
      report.push('❌ Firebase غير متصل (ليست داخل النظام)');
      alert(report.join('\n'));
      return;
    }

    report.push(`✅ siteVisits: ${state.visits.length}`);
    report.push(`✅ brand_assets: ${state.brands.length}`);

    const missing=[];
    state.visits.forEach(v=>{
      const name=getBrandName(v).toLowerCase();
      const found=state.brands.some(b =>
        (b.brand && b.brand.toLowerCase()===name) ||
        (b.brandKey && b.brandKey.toLowerCase()===name)
      );
      if(!found) missing.push(name);
    });

    if(missing.length){
      report.push('⚠️ براندات بدون شعار:');
      missing.forEach(b=>report.push(' - '+b));
    }else{
      report.push('✅ جميع البراندات لها شعارات');
    }

    alert(report.join('\n'));
  }

  function start(db){
    db.collection('siteVisits').onSnapshot(s=>{
      state.visits=s.docs.map(d=>d.data());
      render();
    });
    db.collection('brand_assets').onSnapshot(s=>{
      state.brands=s.docs.map(d=>d.data());
      render();
    });
  }

  document.getElementById('diagnosticBtn')
    .addEventListener('click',runDiagnostic);

  if(window.parent && window.parent.firebase){
    start(window.parent.firebase.firestore());
  }

})();
</script>

</body>
</html>
