<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Reports – Check‑List Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Chart.js -->
  https://cdn.jsdelivr.net/npm/chart.js

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #edf3f8;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(18,48,74,.08);
    }
    h3 {
      margin-top: 0;
      color: #0d4b73;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-weight: bold;
      font-size: 14px;
    }
    input, select {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn.green {
      background: #2f9e66;
      color: #fff;
    }
  </style>
</head>

<body>

<!-- ================= SETTINGS ================= -->
<div class="card">
  <h3>إعدادات التقارير</h3>
  <div class="grid-3">
    <div class="field">
      <label>الفني</label>
      <select id="reportTechnicianFilter">
        <option value="">كل الفنيين</option>
      </select>
    </div>

    <div class="field">
      <label>البراند</label>
      <select id="reportBrandFilter">
        <option value="">كل البراندات</option>
      </select>
    </div>

    <div class="field">
      <label>نوع الشارت</label>
      <select id="reportChartType">
        <option value="bar">Bar</option>
        <option value="stacked">Stacked Bar</option>
      </select>
    </div>

    <div class="field">
      <label>من تاريخ</label>
      <input type="date" id="reportFromDate" />
    </div>

    <div class="field">
      <label>إلى تاريخ</label>
      <input type="date" id="reportToDate" />
    </div>

    <div class="field">
      <label>هدف الإنجاز (%)</label>
      <input type="number" id="reportTargetValue" value="80" min="0" max="100" />
    </div>
  </div>
</div>

<!-- ================= BAR CHART ================= -->
<div class="card">
  <h3>Check‑List Assessment (مكتمل / معلق)</h3>
  <canvas id="assessmentChart"></canvas>
  <br />
  <button class="btn green" id="exportChartBtn">تصدير الشارت كصورة</button>
</div>

<!-- ================= PIE ================= -->
<div class="card">
  <h3>نسبة الإنجاز الإجمالية</h3>
  <canvas id="assessmentPie"></canvas>
</div>

<!-- ================= LINE ================= -->
<div class="card">
  <h3>تطور الأداء الزمني + خط الهدف</h3>
  <canvas id="performanceLine"></canvas>
</div>

<script>
/* ================= MOCK DATA (مثال) =================
   احذف هذا الجزء عند ربطه مع نظامك الحقيقي
*/
const state = {
  technicians: [
    { id: 't1', name: 'Ahmed' },
    { id: 't2', name: 'Fahad' }
  ],
  checklists: [
    {
      technicianDocId: 't1',
      brand: 'Toyota',
      visitDate: '2024-01-15',
      checklistCompleted: true,
      dynamicFieldsSnapshot: [{ section: 'Hardware & Peripherals Assessment' }]
    },
    {
      technicianDocId: 't1',
      brand: 'Toyota',
      visitDate: '2024-02-10',
      checklistCompleted: false,
      dynamicFieldsSnapshot: [{ section: 'Software & Systems Assessment' }]
    },
    {
      technicianDocId: 't2',
      brand: 'Nissan',
      visitDate: '2024-03-05',
      checklistCompleted: true,
      dynamicFieldsSnapshot: [{ section: 'Network Infrastructure Assessment' }]
    }
  ]
};
/* ================================================== */

let barChart, pieChart, lineChart;

/* ================= HELPERS ================= */
function populateFilters() {
  document.getElementById('reportTechnicianFilter').innerHTML =
    '<option value="">كل الفنيين</option>' +
    state.technicians.map(t =>
      `<option value="${t.id}">${t.name}</option>`
    ).join('');

  document.getElementById('reportBrandFilter').innerHTML =
    '<option value="">كل البراندات</option>' +
    [...new Set(state.checklists.map(r => r.brand))]
      .map(b => `<option value="${b}">${b}</option>`).join('');
}

/* ================= DATA ================= */
function getFilteredChecklists() {
  const tech = reportTechnicianFilter.value;
  const brand = reportBrandFilter.value;
  const from = reportFromDate.value;
  const to = reportToDate.value;

  return state.checklists.filter(r => {
    if (tech && r.technicianDocId !== tech) return false;
    if (brand && r.brand !== brand) return false;
    if (from && r.visitDate < from) return false;
    if (to && r.visitDate > to) return false;
    return true;
  });
}

/* ================= BAR & PIE ================= */
function renderBarAndPie() {
  const sections = {
    'Hardware & Peripherals Assessment': { c: 0, p: 0 },
    'Network Infrastructure Assessment': { c: 0, p: 0 },
    'Software & Systems Assessment': { c: 0, p: 0 },
    'Systems Assessment': { c: 0, p: 0 }
  };

  getFilteredChecklists().forEach(r => {
    const status = r.checklistCompleted ? 'c' : 'p';
    (r.dynamicFieldsSnapshot || []).forEach(f => {
      if (sections[f.section]) sections[f.section][status]++;
    });
  });

  const labels = Object.keys(sections);
  const completed = labels.map(l => sections[l].c);
  const pending = labels.map(l => sections[l].p);

  if (barChart) barChart.destroy();
  barChart = new Chart(assessmentChart, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'مكتمل', data: completed, backgroundColor: '#2f9e66' },
        { label: 'معلق', data: pending, backgroundColor: '#d64545' }
      ]
    },
    options: {
      scales: reportChartType.value === 'stacked'
        ? { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
        : { y: { beginAtZero: true } }
    }
  });

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(assessmentPie, {
    type: 'pie',
    data: {
      labels: ['مكتمل', 'معلق'],
      datasets: [{
        data: [
          completed.reduce((a,b)=>a+b,0),
          pending.reduce((a,b)=>a+b,0)
        ],
        backgroundColor: ['#2f9e66', '#d64545']
      }]
    }
  });
}

/* ================= LINE + TARGET ================= */
function renderLine() {
  const target = Number(reportTargetValue.value);
  const timeline = {};

  getFilteredChecklists().forEach(r => {
    const m = r.visitDate.slice(0,7);
    if (!timeline[m]) timeline[m] = { c:0, p:0 };
    r.checklistCompleted ? timeline[m].c++ : timeline[m].p++;
  });

  const labels = Object.keys(timeline).sort();
  const pct = labels.map(m => {
    const t = timeline[m].c + timeline[m].p;
    return t ? Math.round((timeline[m].c / t) * 100) : 0;
  });

  if (lineChart) lineChart.destroy();
  lineChart = new Chart(performanceLine, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'نسبة الإنجاز',
          data: pct,
          borderColor: '#0d6efd',
          backgroundColor: 'rgba(13,110,253,0.15)',
          fill: true,
          tension: 0.4
        },
        {
          label: 'الهدف',
          data: labels.map(()=>target),
          borderColor: '#dc3545',
          borderDash: [6,6],
          pointRadius: 0
        }
      ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
          max: 100,
          ticks: { callback: v => v + '%' }
        }
      }
    }
  });
}

/* ================= EXPORT ================= */
exportChartBtn.onclick = () => {
  const link = document.createElement('a');
  link.download = 'chart.png';
  link.href = assessmentChart.toDataURL();
  link.click();
};

/* ================= INIT ================= */
function renderAll() {
  renderBarAndPie();
  renderLine();
}

populateFilters();
renderAll();

document.querySelectorAll(
  '#reportTechnicianFilter,#reportBrandFilter,#reportFromDate,#reportToDate,#reportChartType,#reportTargetValue'
).forEach(el => el.addEventListener('change', renderAll));
</script>

</body>
</html>
