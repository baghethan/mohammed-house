<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Turbo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f4f7fa; padding: 20px; }
    .stat-card { background: #fff; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .big-num { font-size: 60px; color: #0d4b73; font-weight: 900; margin: 10px 0; }
  </style>
</head>
<body>

  <div class="stat-card">
    <h3>إجمالي الزيارات (Visits)</h3>
    <div class="big-num" id="totalNum">...</div>
    <div id="status">جاري جلب البيانات من المحرك الرئيسي...</div>
  </div>

  <script>
    // ✅ استعارة المحرك من الصفحة الرئيسية فوراً وبدون انتظار
    const db = window.parent.appDb;
    const auth = window.parent.appAuth;

    if (!db) {
        document.getElementById('status').innerHTML = "⚠️ خطأ: لا يمكن الوصول للمحرك الرئيسي";
    } else {
        // الاتصال هنا فوري (Zero Latency)
        db.collection('branch_checklists').onSnapshot(snap => {
            document.getElementById('totalNum').innerText = snap.size;
            document.getElementById('status').innerText = "متصل مباشر ✅";
        });
    }
  </script>
</body>
</html>
