<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IT Analytics v8.5.0 | Almajdouie Motors</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .card-shadow { box-shadow: 0 20px 50px rgba(0, 30, 64, 0.05); }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        .stat-huge { font-size: 5rem; font-weight: 900; color: #0d4b73; line-height: 1; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        select, input[type="date"] { border: 1px solid #e2e8f0; border-radius: 10px; padding: 5px 10px; font-size: 11px; font-weight: 700; color: #0d4b73; outline: none; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div class="max-w-[1600px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[45px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">📊</div>
                    <div>
                        <h2 class="text-xl font-black">مدير تحليل بنود الـ Check-List</h2>
                        <p class="text-[9px] font-bold opacity-50 uppercase tracking-widest">Detailed Frequency Analysis v8.5.0</p>
                    </div>
                </div>
                <div class="text-lg font-black text-green-400 font-mono" id="liveClock">00:00:00</div>
            </div>

            <div id="configGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex justify-between items-center text-[10px] font-black uppercase">
                <span class="text-blue-300 italic">Logic: Smart Grouping & Multi-Answer Counting ✅</span>
                <button onclick="window.renderCharts()" class="bg-[#10b981] hover:bg-green-600 text-white px-10 py-3 rounded-2xl transition shadow-lg">تحديث وتوزيع البيانات 🔃</button>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1600px] mx-auto space-y-8 bg-[#f8fafc] p-12 rounded-[70px]">
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-5">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-12 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73] border-r-4 border-blue-900 pr-4 uppercase tracking-tighter">IT Quality Assessment</h1>
            </div>
            
            <div class="flex items-center gap-4 exclude-from-capture">
                <div class="bg-white px-5 py-2 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                    <input type="date" id="dateFrom" onchange="window.filterData()">
                    <span class="text-[10px] font-black text-slate-400">إلى</span>
                    <input type="date" id="dateTo" onchange="window.filterData()">
                </div>
                <button onclick="window.copyFullDashboard()" class="bg-[#0d4b73] text-white px-8 py-3 rounded-2xl text-sm font-black shadow-xl">نسخ التقرير 📷</button>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-8 items-stretch">
            <div class="col-span-12 lg:col-span-4 bg-white rounded-[55px] p-12 card-shadow border border-slate-50 flex flex-col justify-center text-center">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Total Execution | إجمالي الزيارات</h2>
                <span class="text-9xl font-black text-[#0d4b73] leading-none tracking-tighter" id="totalVisits">0</span>
            </div>
            <div id="sideBrandList" class="col-span-12 lg:col-span-8 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10" id="reportsGrid"></div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [] };

    setInterval(() => { $('liveClock').innerText = new Date().toLocaleTimeString('en-GB', { hour12: false }); }, 1000);

    // 🕵️ هيكلة البيانات الدقيقة لكل نوع سؤال 🕵️
    const SCHEMA = {
        hardware: {
            title: "Hardware & Peripherals Assessment", color: "#3b82f6",
            items: {
                "8LQ9F3Rj4MsNDkTbO5Pi": { label: "PCs Condition", types: ["fully_functioning", "requires_service"] },
                "EeypXJo6RgtxIhcVVfzk": { label: "Printers Condition", types: ["fully_functioning", "requires_service"] },
                "9EozMBKysmOoajPkgUTh": { label: "Unified Communication", types: ["fully_functioning", "requires_service"] },
                "unused_damaged": { label: "Unused/Damaged Assets", types: ["yes", "no"] }
            }
        },
        network: {
            title: "Network Infrastructure Assessment", color: "#10b981",
            items: {
                "BcjdipZxDmVgodHk9t1B": { label: "Cabinets Condition", types: ["in_shape", "requires_arrangement"] },
                "upload_speed": { label: "Upload 4-6 Mbps", types: ["above_the_range", "within_the_range", "below_the_range"] },
                "low_current": { label: "Low Current Infrastructure", types: ["in_shape", "requires_arrangement"] },
                "download_speed": { label: "Download 6-9 Mbps", types: ["above_the_range", "within_the_range", "below_the_range"] },
                "room_temp": { label: "Room Temperature", types: ["above_the_range", "within_the_range", "below_the_range"] },
                "ups_status": { label: "UPS Status", types: ["fully_functioning", "requires_service"] }
            }
        },
        software: {
            title: "Software & Systems Assessment", color: "#f59e0b",
            items: {
                "6fx4HNunJZRyPziv5r02": { label: "OS Up to Date", types: ["yes", "no"] },
                "cleanup": { label: "Remove Unwanted Apps", types: ["yes", "no"] },
                "onedrive": { label: "OneDrive Backup", types: ["yes", "no", "partially"] },
                "portals": { label: "Customer Facing Portals", types: ["yes", "no", "partially"] },
                "erp_apps": { label: "ERP Applications", types: ["yes", "no", "requires_maintenance"] },
                "training_req": { label: "Training Requirement", isMulti: true, 
                    types: ["Customer Facing Portals", "ERP Functions", "Business Solutions", "Service Desk & End User Support", "IT Soft Skills", "No Requirement for IT Training", "Other"] 
                }
            }
        },
        systems: {
            title: "Systems Assessment", color: "#0d4b73",
            items: { "EcfiAfRlykxLot8a913E": { label: "Upgrade Windows_11", types: ["yes", "no"] } }
        }
    };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 1000); return; }

        $('configGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white/5 p-5 rounded-[30px] border border-white/10">
                <h3 class="text-[10px] font-black text-blue-300 uppercase mb-4">${SCHEMA[key].title}</h3>
                <select id="type-${key}" class="w-full bg-white/10 text-white text-[10px] mb-4" onchange="window.renderCharts()">
                    <option value="bar">عرض أرقام (Bar Count)</option>
                    <option value="stats">ملخص نصي</option>
                </select>
                <div class="space-y-1 max-h-[120px] overflow-y-auto custom-scroll">
                    ${Object.keys(SCHEMA[key].items).map(fId => `<label class="flex items-center gap-2 py-0.5"><input type="checkbox" value="${fId}" data-cat="${key}" checked class="w-3 h-3 rounded" onchange="window.renderCharts()"><span class="text-[9px] font-bold">${SCHEMA[key].items[fId].label}</span></label>`).join('')}
                </div>
            </div>`).join('');

        $('reportsGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white rounded-[55px] p-10 card-shadow min-h-[500px] flex flex-col">
                <h3 class="text-sm font-black text-[#0d4b73] mb-8 uppercase border-b pb-4">${SCHEMA[key].title}</h3>
                <div class="flex-1 relative flex items-center justify-center">
                    <canvas id="chart-${key}"></canvas>
                    <div id="stats-${key}" class="hidden text-center"><div class="stat-huge" id="val-${key}">0</div><p class="font-bold text-slate-400 mt-2">Active Items</p></div>
                </div>
            </div>`).join('');

        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); window.updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { state.allVisits = snap.docs.map(d => d.data()); window.filterData(); });
    }

    window.filterData = function() {
        const from = $('dateFrom').value, to = $('dateTo').value;
        const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
        const dTo = to ? new Date(to).setHours(23,59,59,999) : Infinity;
        state.filteredVisits = state.allVisits.filter(v => {
            const vDate = v.timestamp?.toDate().getTime() || 0;
            return vDate >= dFrom && vDate <= dTo;
        });
        $('totalVisits').textContent = state.filteredVisits.length;
        window.updateUI();
    }

    window.updateUI = function() {
        const counts = {}; state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => `<div class="bg-white rounded-[35px] p-8 shadow-sm border border-slate-50 flex items-center justify-between"><span class="text-7xl font-black text-[#0d4b73]">${counts[b.brand]}</span><div class="flex flex-col items-center gap-1"><img src="${b.logoData || b.logoUrl}" class="w-16 h-10 object-contain"><span class="text-[10px] font-black text-slate-400 uppercase">${b.brand}</span></div></div>`).join('');
        window.renderCharts();
    }

    window.renderCharts = function() {
        Object.keys(SCHEMA).forEach(catKey => {
            const type = $(`type-${catKey}`).value;
            const selectedFields = Array.from(document.querySelectorAll(`input[data-cat="${catKey}"]:checked`)).map(i => i.value);
            
            // محرك التحليل المتقدم
            let chartLabels = [], chartData = {};
            let globalTotal = 0;

            selectedFields.forEach(fId => {
                const config = SCHEMA[catKey].items[fId];
                
                if (config.isMulti) {
                    // معالجة خاصة للتدريب (Checkbox)
                    config.types.forEach(t => { chartLabels.push(t); chartData[t] = 0; });
                    state.filteredVisits.forEach(v => {
                        const ans = (v.dynamicAnswers || {})[fId];
                        if (Array.isArray(ans)) {
                            ans.forEach(val => { if(chartData[val] !== undefined) { chartData[val]++; globalTotal++; } });
                        }
                    });
                } else {
                    // معالجة البنود العادية (أكثر من حالة لكل بند)
                    config.types.forEach(t => {
                        const labelName = `${config.label} (${t.replace(/_/g,' ')})`;
                        chartLabels.push(labelName);
                        chartData[labelName] = 0;
                        state.filteredVisits.forEach(v => {
                            const ans = (v.dynamicAnswers || {})[fId];
                            if (ans === t) { chartData[labelName]++; globalTotal++; }
                        });
                    });
                }
            });

            $(`chart-${catKey}`).style.display = (type === 'stats') ? 'none' : 'block';
            $(`stats-${catKey}`).style.display = (type === 'stats') ? 'block' : 'none';

            if (type === 'stats') {
                $(`val-${catKey}`).innerText = globalTotal;
            } else {
                if (charts[catKey]) charts[catKey].destroy();
                charts[catKey] = new Chart($(`chart-${catKey}`), {
                    type: 'bar',
                    data: { 
                        labels: chartLabels, 
                        datasets: [{ 
                            data: chartLabels.map(l => chartData[l]), 
                            backgroundColor: SCHEMA[catKey].color, borderRadius: 12, barThickness: 15 
                        }] 
                    },
                    options: { 
                        indexAxis: 'y', maintainAspectRatio: false, 
                        plugins: { legend: { display: false } },
                        scales: { 
                            x: { grid: { display: false }, ticks: { font: { weight: 'bold' } } }, 
                            y: { grid: { display: false }, ticks: { font: { weight: 'bold', size: 10 }, color: '#0d4b73' } } 
                        }
                    }
                });
            }
        });
    }

    window.copyFullDashboard = async function() {
        const excluded = document.querySelectorAll('.exclude-from-capture');
        excluded.forEach(el => el.style.opacity = '0');
        const canvas = await html2canvas($('captureArea'), { backgroundColor: '#f8fafc', scale: 2, useCORS: true });
        excluded.forEach(el => el.style.opacity = '1');
        canvas.toBlob(async (blob) => { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); alert("Report Copied ✅"); });
    }
    boot();
})();
</script>
</body>
</html>
