<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Site Visit v4.3 – Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ===================== CSS ===================== -->
<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef3f8}
.hidden{display:none}
header{background:#0d4b73;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.container{max-width:1300px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
input,button{padding:10px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;font-size:14px}
button{background:#2f9e66;color:#fff;border:none;cursor:pointer}
button.capture-btn{background:#0d4b73;width:auto;min-width:140px}
button.danger{background:#d64545;width:auto}
.stats-main,.stats-sub{display:grid;gap:14px;margin-bottom:16px}
.stats-main{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stats-sub{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat{padding:14px;border-radius:14px;background:#f8fbff;border:1px solid #dde6ef}
.stat strong{display:block;font-size:26px;color:#0d4b73}
.stat span{font-size:13px;color:#555}
.stat.primary{background:#0d4b73;color:#fff}
.stat.primary strong,.stat.primary span{color:#fff}
.stat.success{border-right:6px solid #2f9e66}
.stat.warning{border-right:6px solid #c47f00}
.stat.info{border-right:6px solid #295fa5}
.stat.progress{border-right:6px solid #7a5af8}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:#667085;font-size:13px}

/* Progress */
.progress-track{width:100%;height:12px;border-radius:999px;background:#e9eef5;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#7a5af8,#6941c6);transition:width .8s ease}
.progress-on-scroll{width:0%}

/* Brand cards */
.brand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.brand-card{border:1px solid #dbe7f1;border-radius:18px;padding:18px;background:#fff}
.brand-card-head{display:flex;gap:14px;align-items:center}
.brand-logo{width:90px;height:90px;border-radius:18px;object-fit:cover;border:1px solid #dbe7f1}
.brand-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}

/* Table */
.table-wrap{overflow-x:auto;border:1px solid #e3ebf3;border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:1100px}
th,td{padding:10px;border-bottom:1px solid #edf2f7;font-size:13px;text-align:right}
thead th{background:#f4f8fc;color:#0d4b73;position:sticky;top:0}

/* Badges */
.badge{padding:6px 10px;border-radius:999px;font-size:12px}
.badge-success{background:#ecfdf3;color:#067647}
.badge-warning{background:#fffaeb;color:#b54708}
.badge-danger{background:#fef3f2;color:#b42318}

</style>
</head>

<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginBox" class="container">
  <div class="card">
    <h3>تسجيل الدخول</h3>
    <input id="loginEmail" type="email" placeholder="Email"><br><br>
    <input id="loginPassword" type="password" placeholder="Password"><br><br>
    <button id="loginBtn">دخول</button>
    <p id="loginMsg"></p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
<header>
  <strong>Dashboard – v4.3</strong>
  <button id="logoutBtn" class="danger">Logout</button>
</header>

<div class="container">

<!-- ===================== DASHBOARD ===================== -->
<div class="card">
  <div class="section-head">
    <h3>Dashboard</h3>
    <button class="capture-btn">نسخ صورة Dashboard</button>
  </div>

  <div class="stats-main">
    <div class="stat primary"><strong id="statVisits">0</strong><span>إجمالي الزيارات</span></div>
    <div class="stat success"><strong id="statCompleted">0</strong><span>مكتمل</span></div>
    <div class="stat warning"><strong id="statPending">0</strong><span>معلّق</span></div>
    <div class="stat progress">
      <strong id="statRate">0%</strong>
      <span>نسبة الإنجاز</span>
      <div class="progress-track">
        <div id="overallProgress" class="progress-fill progress-on-scroll" data-progress="0"></div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== WINDOWS UPGRADE SUMMARY ===================== -->
<div class="card">
  <h3>ملخص سريع Upgrade Windows</h3>
  <div class="stats-sub">
    <div class="stat primary"><strong id="upTotal">0</strong><span>إجمالي الطلبات</span></div>
    <div class="stat success"><strong id="upCompleted">0</strong><span>مكتمل</span></div>
    <div class="stat warning"><strong id="upPending">0</strong><span>معلّق</span></div>
    <div class="stat info"><strong id="upProgress">0</strong><span>قيد التنفيذ</span></div>
  </div>
  <div class="progress-track">
    <div id="upgradeProgress" class="progress-fill progress-on-scroll" data-progress="0"></div>
  </div>
</div>

<!-- ===================== BRAND SUMMARY ===================== -->
<div class="card">
  <h3>أسماء البراندات + الشعار</h3>
  <div id="brandGrid" class="brand-grid"></div>
</div>

<!-- ===================== VISITS TABLE ===================== -->
<div class="card">
  <h3>كل الزيارات</h3>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>التاريخ</th><th>البراند</th><th>الحالة</th>
        </tr>
      </thead>
      <tbody id="visitsTable"></tbody>
    </table>
  </div>
</div>

</div>
</div>

<!-- ===================== FIREBASE ===================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

// ===================== LOGIN =====================
loginBtn.onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
  }catch(e){ loginMsg.textContent = e.message }
};

logoutBtn.onclick = ()=>signOut(auth);

// ===================== STATE =====================
let visits = [], upgrades = [];

// ===================== AUTH =====================
onAuthStateChanged(auth, user=>{
  if(!user){
    loginBox.classList.remove("hidden");
    app.classList.add("hidden");
    return;
  }
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");

  onSnapshot(collection(db,"siteVisits"), snap=>{
    visits = snap.docs.map(d=>d.data());
    render();
  });

  onSnapshot(collection(db,"windows_upgrades"), snap=>{
    upgrades = snap.docs.map(d=>d.data());
    render();
  });
});

// ===================== RENDER =====================
function render(){
  statVisits.textContent = visits.length;
  const completed = visits.filter(v=>v.status==="completed").length;
  statCompleted.textContent = completed;
  statPending.textContent = visits.length-completed;
  const rate = visits.length ? (completed/visits.length)*100 : 0;
  statRate.textContent = rate.toFixed(1)+"%";
  overallProgress.dataset.progress = rate;
  upgradeProgress.dataset.progress = upgrades.length ? (upgrades.filter(u=>u.status==="completed").length/upgrades.length)*100 : 0;
  activateProgress();
}

// ===================== SCROLL PROGRESS =====================
function activateProgress(){
  document.querySelectorAll(".progress-on-scroll").forEach(el=>{
    el.style.width="0%";
    const v = el.dataset.progress||0;
    setTimeout(()=>el.style.width=v+"%",200);
  });
}
</script>

</body>
</html>
