<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Almajdouie Dashboard v5.0.0</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9ff; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0, 30, 64, 0.05); }
        .chart-height { height: 220px; }
    </style>
</head>
<body class="p-4 lg:p-6 overflow-x-hidden">

    <div class="max-w-[1400px] mx-auto space-y-6">
        
        <header class="flex flex-wrap items-center justify-between gap-4 px-2">
            <div class="flex items-center gap-3">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-8 object-contain" alt="Logo">
                <h1 class="text-lg font-black text-[#0d4b73]" id="t-welcome">ALMAJDOUIE MOTORS</h1>
            </div>
            <div id="statusTxt" class="text-[10px] font-bold bg-green-100 text-green-700 px-3 py-1 rounded-full">متصل بالمحرك الرئيسي ✅</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="bg-[#3b82f6] p-6 rounded-2xl text-white flex justify-between items-center shadow-lg transform transition hover:scale-[1.02]">
                <div><h3 class="font-black text-lg" id="t-nav-visits">Branch Visits</h3><p class="text-[11px] opacity-80">Manage and track visits</p></div>
                <div class="bg-white/20 p-3 rounded-full">📍</div>
            </div>
            <div class="bg-[#10b981] p-6 rounded-2xl text-white flex justify-between items-center shadow-lg transform transition hover:scale-[1.02]">
                <div><h3 class="font-black text-lg" id="t-nav-checklist">Check-List</h3><p class="text-[11px] opacity-80">Quality assessment forms</p></div>
                <div class="bg-white/20 p-3 rounded-full">📋</div>
            </div>
            <div class="bg-[#a855f7] p-6 rounded-2xl text-white flex justify-between items-center shadow-lg transform transition hover:scale-[1.02]">
                <div><h3 class="font-black text-lg" id="t-nav-reports">Reports</h3><p class="text-[11px] opacity-80">View analytics</p></div>
                <div class="bg-white/20 p-3 rounded-full">📊</div>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-5">
            <div class="col-span-12 lg:col-span-4 bg-white rounded-2xl border border-slate-100 p-6 card-shadow flex flex-col min-h-[450px]">
                <h2 class="text-sm font-bold text-slate-400 mb-2 uppercase" id="t-total-label">Total Visits</h2>
                <div class="flex items-center gap-3 mb-6">
                    <span class="text-5xl font-black text-[#0d4b73]" id="totalVisits">0</span>
                    <span class="bg-blue-50 text-[#0d4b73] text-[10px] font-black px-2 py-1 rounded-full">+12%</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="sideBrandList">
                    </div>
            </div>

            <div class="col-span-12 lg:col-span-4 bg-white rounded-2xl border border-slate-100 p-6 card-shadow flex flex-col items-center justify-center relative">
                <h2 class="text-sm font-black text-[#0d4b73] absolute top-6 right-6" id="t-ups">UPS Status</h2>
                <div class="w-48 h-48 mt-6">
                    <canvas id="cUps"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pt-10">
                        <span class="text-3xl font-black text-[#0d4b73]" id="upsPct">0%</span>
                        <span class="text-[9px] font-bold text-slate-400">Healthy</span>
                    </div>
                </div>
            </div>

            <div class="col-span-12 lg:col-span-4 bg-white rounded-2xl border border-slate-100 p-6 card-shadow">
                <h2 class="text-sm font-black text-[#0d4b73] mb-8" id="t-conn">Connectivity Status</h2>
                <div class="space-y-8 mt-10"><canvas id="cConn"></canvas></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div class="bg-white rounded-2xl border border-slate-100 p-6 card-shadow">
                <h2 class="text-sm font-black text-[#0d4b73] mb-4" id="t-net">Network Appliances</h2>
                <div class="chart-height"><canvas id="cNet"></canvas></div>
            </div>
            <div class="bg-white rounded-2xl border border-slate-100 p-6 card-shadow">
                <h2 class="text-sm font-black text-[#0d4b73] mb-4" id="t-train">Training Requirement Trend</h2>
                <div class="chart-height"><canvas id="cTrain"></canvas></div>
            </div>
        </div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { visits: [], brands: [], lang: 'ar' };

    const i18n = {
        ar: { welcome: "المجدوعي للسيارات", brands: "إحصائيات البراندات", totalLabel: "إجمالي الزيارات", ups: "حالة الـ UPS", conn: "جودة الاتصال", net: "أجهزة الشبكة", train: "المتطلبات التدريبية", navVisits: "زيارات الفروع", navChecklist: "قائمة الفحص", navReports: "التقارير" },
        en: { welcome: "Almajdouie Motors", brands: "Brand Stats", totalLabel: "Total Visits", ups: "UPS Status", conn: "Connectivity Status", net: "Network Appliances", train: "Training Trend", navVisits: "Branch Visits", navChecklist: "Check-List", navReports: "Reports" }
    };

    function applyLanguage(lang) {
        state.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        const d = i18n[lang];
        $('t-welcome').innerText = d.welcome; $('t-total-label').innerText = d.totalLabel;
        $('t-ups').innerText = d.ups; $('t-conn').innerText = d.conn;
        $('t-net').innerText = d.net; $('t-train').innerText = d.train;
        $('t-nav-visits').innerText = d.navVisits; $('t-nav-checklist').innerText = d.navChecklist;
        $('t-nav-reports').innerText = d.navReports;
        updateUI();
    }

    window.addEventListener('message', e => { if (e.data.type === 'LANG_CHANGE') applyLanguage(e.data.lang); });

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 500); return; }
        applyLanguage(window.parent.currentLang || 'ar');

        db.collection('brand_assets').onSnapshot(snap => {
            state.brands = snap.docs.map(d => d.data());
            updateUI();
        });

        db.collection('branch_checklists').onSnapshot(snap => {
            state.visits = snap.docs.map(d => d.data());
            $('totalVisits').textContent = state.visits.length;
            updateUI();
        });
    }

    function updateUI() {
        const counts = {}; state.visits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || 'https://placehold.jp/40x25.png';
            const pct = state.visits.length > 0 ? Math.round((c/state.visits.length)*100) : 0;
            return `
                <div class="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-100 transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-7 flex items-center justify-center bg-white rounded border border-slate-100 p-0.5"><img src="${logo}" class="max-h-full max-w-full object-contain"></div>
                        <span class="text-[11px] font-bold text-slate-700">${b.brand}</span>
                    </div>
                    <div class="text-right">
                        <div class="text-sm font-black text-[#0d4b73]">${c}</div>
                        <div class="text-[8px] font-bold text-slate-400">${pct}%</div>
                    </div>
                </div>`;
        }).join('');
        renderCharts();
    }

    function renderCharts() {
        const total = state.visits.length;
        let s = { net: 0, conn: {a:0, w:0}, train: {} };
        state.visits.forEach(v => {
            const a = v.dynamicAnswers || {};
            if(a["8LQ9F3Rj4MsNDkTbO5Pi"] === "in_shape") s.net++;
            if(a["BcjdipZxDmVgodHk9t1B"] === "above_the_range") s.conn.a++;
            if(a["BcjdipZxDmVgodHk9t1B"] === "within_the_range") s.conn.w++;
            Object.keys(a).forEach(k => { if(k.toLowerCase().includes('train')) { let t = a[k]; if(t) s.train[t] = (s.train[t]||0)+1; }});
        });
        
        const calc = v => total > 0 ? Math.round((v/total)*100) : 0;
        drawBar('cNet', ['In Shape', 'Arrangement'], [calc(s.net), 100-calc(s.net)], ['#10b981', '#0d4b73']);
        drawBar('cConn', ['Online', 'Offline'], [calc(s.conn.a), calc(s.conn.w)], ['#0d4b73', '#ffd54f']);
        drawDoughnut('cUps', 85);
        drawTrend('cTrain', Object.keys(s.train), Object.values(s.train));
    }

    function drawBar(id, labels, data, colors) {
        if (charts[id]) charts[id].destroy();
        charts[id] = new Chart($(id), {
            type: 'bar',
            data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 10 }] },
            options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: {display:false} }, scales: { x: { max: 100, display: false }, y: { grid: { display:false }, ticks: { font:{weight:'bold', size:11} } } } }
        });
    }

    function drawDoughnut(id, val) {
        $('upsPct').innerText = val + "%";
        if (charts[id]) charts[id].destroy();
        charts[id] = new Chart($(id), {
            type: 'doughnut',
            data: { datasets: [{ data: [val, 100-val], backgroundColor: ['#0d4b73', '#eff4ff'], borderWidth: 0 }] },
            options: { cutout: '85%', maintainAspectRatio: false, plugins: { legend: {display:false} } }
        });
    }

    function drawTrend(id, labels, data) {
        if (charts[id]) charts[id].destroy();
        charts[id] = new Chart($(id), {
            type: 'line',
            data: { labels: labels.length ? labels : ['Q1', 'Q2', 'Q3', 'Q4'], datasets: [{ data: data.length ? data : [5, 12, 8, 15], borderColor: '#0d4b73', tension: 0.4, fill: true, backgroundColor: 'rgba(13, 75, 115, 0.05)' }] },
            options: { maintainAspectRatio: false, plugins: { legend: {display:false} }, scales: { y: { beginAtZero: true, display: false }, x: { grid: { display: false }, ticks: { font:{size:10} } } } }
        });
    }

    boot();
})();
</script>
</body>
</html>
