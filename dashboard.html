<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Dashboard v3.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { margin: 0; font-family: 'Cairo', sans-serif; background: #f4f7fa; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 260px; background: #fff; border-left: 1px solid #e2e8f0; padding: 15px; }
    .main { flex: 1; padding: 20px; overflow-y: auto; text-align: center; }
    .big-num { font-size: 80px; color: #0d4b73; font-weight: 900; margin: 10px 0; }
    .brand-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; }
    .brand-logo { width: 35px; height: 20px; object-fit: contain; }
  </style>
</head>
<body>

<aside class="sidebar">
  <h4 style="font-size: 12px; color: #64748b;">إحصائيات البراندات</h4>
  <div id="brandList"></div>
</aside>

<main class="main">
  <div style="font-weight: 900; color: #0d4b73; margin-bottom: 20px;">ALMAJDOUIE DASHBOARD v3.1 TURBO</div>
  <h1 class="big-num" id="visitCount">0</h1>
  <p style="color: #64748b; font-weight: bold;">إجمالي الزيارات الميدانية</p>
  <div id="status" style="font-size: 11px; color: #10b981;">متصل بالمحرك الرئيسي...</div>
</main>

<script>
  (function boot(){
    const db = window.parent.appDb;
    if (!db) { setTimeout(boot, 500); return; } // محاولة إعادة الاتصال بالأب

    // جلب الزيارات فوراً (بدون تأخير الـ 10 ثوانٍ)
    db.collection('branch_checklists').onSnapshot(snap => {
      document.getElementById('visitCount').innerText = snap.size;
      document.getElementById('status').innerText = "بيانات حية ✅";
    });

    // جلب الشعارات
    db.collection('brand_assets').onSnapshot(snap => {
      document.getElementById('brandList').innerHTML = snap.docs.map(d => {
        const b = d.data();
        return `<div class="brand-item"><img src="${b.logoUrl}" class="brand-logo"> <span style="font-size:11px;">${b.brand}</span></div>`;
      }).join('');
    });
  })();
</script>
</body>
</html>
