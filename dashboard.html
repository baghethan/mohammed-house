<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard v5.1.0 | Almajdouie</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9ff; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0, 30, 64, 0.05); }
    </style>
</head>
<body class="p-4 lg:p-6 overflow-x-hidden">

    <div id="captureArea" class="max-w-[1400px] mx-auto space-y-6 bg-[#f8f9ff] p-4 rounded-3xl">
        
        <header class="flex flex-wrap items-center justify-between gap-4 px-2">
            <div class="flex items-center gap-3">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-8 object-contain" alt="Logo">
                <h1 class="text-lg font-black text-[#0d4b73]" id="t-welcome">ALMAJDOUIE MOTORS</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="copyAsImage()" class="flex items-center gap-2 bg-[#0d4b73] hover:bg-blue-800 text-white px-4 py-2 rounded-xl text-xs font-black transition shadow-md active:scale-95">
                    <span id="copyBtnTxt">نسخ اللوحة كصورة</span>
                    <span class="text-lg">📷</span>
                </button>
                <div id="statusTxt" class="text-[10px] font-bold bg-green-100 text-green-700 px-3 py-1 rounded-full">LIVE SYNC ✅</div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="bg-[#3b82f6] p-6 rounded-2xl text-white flex justify-between items-center shadow-lg">
                <div><h3 class="font-black text-lg">Branch Visits</h3><p class="text-[11px] opacity-80">Track activity</p></div>
                <div class="bg-white/20 p-2 rounded-full">📍</div>
            </div>
            <div class="bg-[#10b981] p-6 rounded-2xl text-white flex justify-between items-center shadow-lg">
                <div><h3 class="font-black text-lg">Check-List</h3><p class="text-[11px] opacity-80">Quality forms</p></div>
                <div class="bg-white/20 p-2 rounded-full">📋</div>
            </div>
            <div class="bg-[#a855f7] p-6 rounded-2xl text-white flex justify-between items-center shadow-lg">
                <div><h3 class="font-black text-lg">Reports</h3><p class="text-[11px] opacity-80">Data Analysis</p></div>
                <div class="bg-white/20 p-2 rounded-full">📊</div>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-5">
            <div class="col-span-12 lg:col-span-4 bg-white rounded-2xl p-6 card-shadow min-h-[400px]">
                <h2 class="text-sm font-bold text-slate-400 mb-2 uppercase">Total Visits</h2>
                <span class="text-5xl font-black text-[#0d4b73]" id="totalVisits">0</span>
                <div class="mt-6 space-y-3" id="sideBrandList"></div>
            </div>

            <div class="col-span-12 lg:col-span-8 bg-white rounded-2xl p-6 card-shadow grid grid-cols-2 gap-4">
                <div class="relative flex flex-col items-center">
                    <h3 class="text-xs font-black text-[#0d4b73] self-start">UPS Status</h3>
                    <canvas id="cUps" class="max-h-[180px]"></canvas>
                    <div class="absolute inset-0 flex items-center justify-center pt-6">
                        <span class="text-2xl font-black text-[#0d4b73]" id="upsPct">0%</span>
                    </div>
                </div>
                <div>
                    <h3 class="text-xs font-black text-[#0d4b73] mb-4">Connectivity</h3>
                    <canvas id="cConn"></canvas>
                </div>
            </div>
        </div>
    </div>

<script>
// --- منطق نسخ الصورة ---
async function copyAsImage() {
    const btn = document.getElementById('copyBtnTxt');
    const originalTxt = btn.innerText;
    
    try {
        btn.innerText = "جاري التقاط الصورة...";
        
        // التقاط منطقة الحاوية
        const canvas = await html2canvas(document.getElementById('captureArea'), {
            backgroundColor: '#f8f9ff',
            scale: 2, // جودة عالية
            useCORS: true // للسماح بنسخ الصور الخارجية (الشعارات)
        });

        // تحويل الكانفاس إلى Blob (صورة)
        canvas.toBlob(async (blob) => {
            const item = new ClipboardItem({ "image/png": blob });
            await navigator.clipboard.write([item]);
            
            btn.innerText = "✅ تم النسخ للحافظة!";
            setTimeout(() => { btn.innerText = originalTxt; }, 2000);
        });
    } catch (err) {
        console.error(err);
        btn.innerText = "❌ فشل النسخ";
        setTimeout(() => { btn.innerText = originalTxt; }, 2000);
    }
}

// --- بقية أكواد Firebase و Chart.js المستعارة من v5.0.0 ---
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { visits: [], brands: [] };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 500); return; }

        db.collection('brand_assets').onSnapshot(snap => {
            state.brands = snap.docs.map(d => d.data());
            updateUI();
        });

        db.collection('branch_checklists').onSnapshot(snap => {
            state.visits = snap.docs.map(d => d.data());
            $('totalVisits').textContent = state.visits.length;
            updateUI();
        });
    }

    function updateUI() {
        const counts = {}; state.visits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || '';
            return `
                <div class="flex items-center justify-between p-2 bg-slate-50 rounded-xl border border-slate-100">
                    <div class="flex items-center gap-2">
                        <img src="${logo}" class="w-8 h-5 object-contain">
                        <span class="text-[10px] font-bold text-slate-700">${b.brand}</span>
                    </div>
                    <span class="text-sm font-black text-[#0d4b73]">${c}</span>
                </div>`;
        }).join('');
        renderCharts();
    }

    function renderCharts() {
        const total = state.visits.length;
        let s = { conn: {a:0, w:0} };
        state.visits.forEach(v => {
            const a = v.dynamicAnswers || {};
            if(a["BcjdipZxDmVgodHk9t1B"] === "above_the_range") s.conn.a++;
            if(a["BcjdipZxDmVgodHk9t1B"] === "within_the_range") s.conn.w++;
        });

        if (charts.conn) charts.conn.destroy();
        charts.conn = new Chart($('cConn'), {
            type: 'bar',
            data: { labels: ['Above', 'Within'], datasets: [{ data: [s.conn.a, s.conn.w], backgroundColor: ['#0d4b73', '#ffd54f'], borderRadius: 5 }] },
            options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: {display:false} } }
        });

        if (charts.ups) charts.ups.destroy();
        charts.ups = new Chart($('cUps'), {
            type: 'doughnut',
            data: { datasets: [{ data: [85, 15], backgroundColor: ['#0d4b73', '#eff4ff'], borderWidth: 0 }] },
            options: { cutout: '80%', plugins: { legend: {display:false} } }
        });
        $('upsPct').innerText = "85%";
    }

    boot();
})();
</script>
</body>
</html>
