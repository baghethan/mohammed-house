<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Dashboard v1.8.0 | الرسوم المتقدمة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #38bdf8; --orange: #f97316; }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    .dashboard-wrapper { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
    .sidebar { background: #fff; color: #000; border-left: 2px solid #ddd; padding: 15px; overflow-y: auto; }
    .main-content { display: flex; flex-direction: column; width: 100%; overflow-y: auto; padding-bottom: 50px; }
    .top-nav { padding: 12px 15px; background: #020617; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    
    .main-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px; padding: 20px; }
    .card { background: var(--card); border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
    .card-header { background: #0d4b73; color: #fff; padding: 10px 15px; font-size: 14px; font-weight: bold; }
    .card-body { padding: 20px; flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 300px; }
    
    canvas { max-width: 100% !important; max-height: 100% !important; }
    .footer { position: fixed; bottom: 0; width: 100%; background: #fff; color: #64748b; padding: 5px 20px; font-size: 11px; display: flex; justify-content: space-between; border-top: 1px solid #ddd; }
  </style>
</head>
<body>

<div class="dashboard-wrapper">
  <aside class="sidebar">
    <div style="text-align:center; border-bottom:1px solid #eee; margin-bottom:20px; padding-bottom:10px;">
        <span style="font-size:12px; font-weight:bold;">إجمالي التقارير المستلمة</span>
        <h1 style="font-size:54px; margin:0; color:#0d4b73;" id="totalVisits">0</h1>
    </div>
    <div id="sideBrandList"></div>
  </aside>

  <main class="main-content">
    <div class="top-nav">
        <div style="font-weight:bold;">ALMAJDOUIE Dashboard v1.8.0</div>
        <div id="statusTxt" style="color:#10b981; font-size:12px;">متصل حي ✅</div>
    </div>

    <div class="main-grid">
        <div class="card">
            <div class="card-header">التقييم العام للأداء (Overall Status)</div>
            <div class="card-body">
                <canvas id="doughnutChart"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-header">مقارنة أداء الأقسام التقنية</div>
            <div class="card-body">
                <canvas id="barChart"></canvas>
            </div>
        </div>
    </div>
  </main>
</div>

<div class="footer">
    <div>v1.8.0-Charts-Edition</div>
    <div id="liveClock"></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  
  let doughnutChart, barChart;

  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      db.collection('branch_checklists').onSnapshot(snap => {
        const docs = snap.docs.map(d => d.data());
        $('totalVisits').textContent = docs.length;
        updateCharts(docs);
      });
    }
  });

  function updateCharts(docs) {
    let stats = { fully: 0, maintenance: 0, infra: 0, pcs: 0, conn: 0 };
    const total = docs.length || 1;

    docs.forEach(doc => {
      const a = doc.dynamicAnswers || {};
      // تحليل البيانات بناءً على معرفاتك الحقيقية
      if (a["8LQ9F3Rj4MsNDkTbO5Pi"] === "in_shape") { stats.infra++; stats.fully++; } else { stats.maintenance++; }
      if (a["0NQrLqvsNNYgd0Iyy6by"] === "fully_functioning") { stats.pcs++; stats.fully++; } else { stats.maintenance++; }
      if (a["BcjdipZxDmVgodHk9t1B"] === "above_the_range") { stats.conn++; stats.fully++; } else { stats.maintenance++; }
    });

    // --- 1. إعداد Doughnut Chart ---
    const doughnutCtx = $('doughnutChart').getContext('2d');
    if (doughnutChart) doughnutChart.destroy();
    doughnutChart = new Chart(doughnutCtx, {
      type: 'doughnut',
      data: {
        labels: ['ممتاز / مكتمل', 'يحتاج صيانة / نقص'],
        datasets: [{
          data: [stats.fully, stats.maintenance],
          backgroundColor: ['#10b981', '#f97316'],
          borderWidth: 0,
          hoverOffset: 10
        }]
      },
      options: {
        plugins: { legend: { position: 'bottom', labels: { color: '#f8fafc', font: { family: 'Cairo' } } } },
        cutout: '70%'
      }
    });

    // --- 2. إعداد Bar Chart ---
    const barCtx = $('barChart').getContext('2d');
    if (barChart) barChart.destroy();
    barChart = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['البنية التحتية', 'الأجهزة', 'الاتصال'],
        datasets: [{
          label: 'نسبة الجاهزية %',
          data: [
            (stats.infra/total)*100, 
            (stats.pcs/total)*100, 
            (stats.conn/total)*100
          ],
          backgroundColor: '#38bdf8',
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true, max: 100, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          x: { ticks: { color: '#f8fafc', font: { family: 'Cairo' } }, grid: { display: false } }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  setInterval(() => { $('liveClock').innerText = new Date().toLocaleTimeString('ar-SA'); }, 1000);
})();
</script>
</body>
</html>
