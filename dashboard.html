<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard v6.8.0 | Multi-View Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7fa; }
        .card-shadow { box-shadow: 0 10px 30px rgba(0, 30, 64, 0.05); }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        
        .custom-checkbox {
            width: 16px; height: 16px; border-radius: 4px; border: 2px solid rgba(255,255,255,0.3);
            background: transparent; cursor: pointer; appearance: none; position: relative;
        }
        .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        .custom-checkbox:checked::after { content: '✓'; position: absolute; color: white; font-size: 10px; top: -2px; left: 2px; }
        
        .section-header { background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 8px; margin-top: 15px; margin-bottom: 8px; border-right: 3px solid #10b981; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* تنسيق الأرقام الضخمة للوضع الإحصائي */
        .stat-huge { font-size: 5rem; font-weight: 900; line-height: 1; color: #0d4b73; }
        .stat-pct { font-size: 1.5rem; font-weight: 900; color: #10b981; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div class="max-w-[1440px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[40px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">📊</div>
                    <div>
                        <h2 class="text-xl font-black">مدير حقول الـ Check-List الذكي</h2>
                        <p class="text-[10px] font-bold opacity-60 uppercase tracking-widest">Multi-View Display Controller</p>
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-black text-blue-300">📡 جودة الاتصال</h3>
                        <select id="viewTypeConn" class="bg-white/10 text-white text-[11px] font-bold border-none rounded-lg focus:ring-0" onchange="renderCharts()">
                            <option value="bar" class="text-black">شارت أعمدة (Bar)</option>
                            <option value="doughnut" class="text-black">دونات (Doughnut)</option>
                            <option value="stats" class="text-black">أرقام ونسبة (Stats)</option>
                        </select>
                    </div>
                    <div id="connStructured" class="max-h-[250px] overflow-y-auto pr-4 custom-scroll"></div>
                </div>

                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-black text-yellow-400">⚡ حالة الـ UPS</h3>
                        <select id="viewTypeUps" class="bg-white/10 text-white text-[11px] font-bold border-none rounded-lg focus:ring-0" onchange="renderCharts()">
                            <option value="doughnut" class="text-black">دونات (Doughnut)</option>
                            <option value="bar" class="text-black">شارت أعمدة (Bar)</option>
                            <option value="stats" class="text-black">أرقام ونسبة (Stats)</option>
                        </select>
                    </div>
                    <div id="upsStructured" class="max-h-[250px] overflow-y-auto pr-4 custom-scroll"></div>
                </div>
            </div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex flex-wrap justify-between items-center gap-4 text-[11px] font-black">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">VERSION: <span class="text-blue-300">v6.8.0 Turbo</span></div>
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">DATE: <span id="currentDate">--</span></div>
                    <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/5">TIME: <span id="liveClock" class="text-green-400">00:00:00</span></div>
                </div>
                <button onclick="updateUI()" class="bg-[#10b981] text-white px-8 py-2.5 rounded-xl transition shadow-lg">تحديث التقرير الآن</button>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1440px] mx-auto space-y-8 bg-[#f4f7fa] p-10 rounded-[50px]">
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-4">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-10 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73]">ALMAJDOUIE MOTORS</h1>
            </div>
            <div class="flex items-center gap-4 exclude-from-capture">
                <input type="date" id="dateFrom" onchange="filterData()" class="rounded-xl border-slate-200 text-xs font-bold">
                <button onclick="copyFullDashboard()" class="bg-[#0d4b73] text-white px-8 py-3 rounded-[20px] text-sm font-black shadow-xl">نسخ التقرير 📷</button>
            </div>
        </header>

        <div class="bg-white rounded-[40px] p-10 card-shadow border border-slate-50 flex items-center justify-between">
            <div><h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-2">إجمالي الزيارات الميدانية</h2><span class="text-9xl font-black text-[#0d4b73] leading-none" id="totalVisits">0</span></div>
            <div id="filterLabel" class="bg-blue-50 text-[#0d4b73] text-xs font-black px-6 py-2 rounded-full">كل الأوقات</div>
        </div>

        <div id="sideBrandList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white rounded-[40px] p-10 card-shadow flex flex-col h-[450px]">
                <h3 class="text-lg font-black text-[#0d4b73] mb-8" id="t-title-conn">Connectivity Status</h3>
                <div id="containerConn" class="flex-1 relative flex flex-col items-center justify-center">
                    <canvas id="cConn"></canvas>
                    <div id="statsConn" class="hidden text-center">
                        <div id="valConn" class="stat-huge">0</div>
                        <div id="pctConn" class="stat-pct">0%</div>
                        <div class="text-slate-400 text-xs font-bold mt-2">مرتبطة بالجودة العالية</div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-[40px] p-10 card-shadow flex flex-col h-[450px]">
                <h3 class="text-lg font-black text-[#0d4b73] mb-8" id="t-title-ups">UPS Status</h3>
                <div id="containerUps" class="flex-1 relative flex flex-col items-center justify-center">
                    <canvas id="cUps"></canvas>
                    <div id="statsUps" class="hidden text-center">
                        <div id="valUps" class="stat-huge">0</div>
                        <div id="pctUps" class="stat-pct">0%</div>
                        <div class="text-slate-400 text-xs font-bold mt-2">أجهزة تعمل بكفاءة</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [] };

    // تحديث الوقت الحي
    setInterval(() => {
        const now = new Date();
        $('currentDate').innerText = now.toLocaleDateString('en-GB');
        $('liveClock').innerText = now.toLocaleTimeString('en-GB', { hour12: false });
    }, 1000);

    const SCHEMA = {
        "أجهزة الشبكة": { "BcjdipZxDmVgodHk9t1B": "جودة اتصال الفروع", "8LQ9F3Rj4MsNDkTbO5Pi": "حالة الروترات" },
        "الطاقة": { "ups_status": "كفاءة الـ UPS", "ups_battery": "فحص البطاريات" }
    };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 500); return; }
        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { state.allVisits = snap.docs.map(d => d.data()); renderDiscoveryPanels(); filterData(); });
    }

    function renderDiscoveryPanels() {
        const createHTML = (prefix) => Object.keys(SCHEMA).map(sec => {
            const items = Object.keys(SCHEMA[sec]).map(fId => {
                const checked = (fId === "BcjdipZxDmVgodHk9t1B" && prefix === "conn") || (fId === "ups_status" && prefix === "ups");
                return `<label class="flex items-center gap-3 py-1 cursor-pointer"><input type="checkbox" value="${fId}" ${checked?'checked':''} class="custom-checkbox discovery-${prefix}" onchange="renderCharts()"><span class="text-[11px] font-bold opacity-80">${SCHEMA[sec][fId]}</span></label>`;
            }).join('');
            return `<div class="mb-4"><div class="section-header text-[10px] font-black">${sec}</div><div class="space-y-1">${items}</div></div>`;
        }).join('');
        $('connStructured').innerHTML = createHTML('conn');
        $('upsStructured').innerHTML = createHTML('ups');
    }

    window.filterData = function() {
        const from = $('dateFrom').value;
        const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
        state.filteredVisits = state.allVisits.filter(v => (v.timestamp ? v.timestamp.toDate().getTime() : 0) >= dFrom);
        $('totalVisits').textContent = state.filteredVisits.length;
        updateUI();
    }

    window.updateUI = function() {
        const counts = {}; state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || '';
            return `<div class="bg-white rounded-[32px] p-8 shadow-sm border border-slate-100 flex items-center justify-between"><span class="text-7xl font-black text-[#0d4b73]">${c}</span><div class="flex flex-col items-center gap-2"><img src="${logo}" class="w-16 h-10 object-contain"><span class="text-[10px] font-black text-slate-400 uppercase">${b.brand}</span></div></div>`;
        }).join('');
        renderCharts();
    }

    function renderCharts() {
        const total = state.filteredVisits.length;
        const typeConn = $('viewTypeConn').value, typeUps = $('viewTypeUps').value;
        const selConn = Array.from(document.querySelectorAll('.discovery-conn:checked')).map(i => i.value);
        const selUps = Array.from(document.querySelectorAll('.discovery-ups:checked')).map(i => i.value);

        let s = { conn: {a:0, w:0}, ups: {ok:0, total:0} };
        state.filteredVisits.forEach(v => {
            const a = v.dynamicAnswers || {};
            selConn.forEach(f => { if(a[f]==="above_the_range") s.conn.a++; if(a[f]==="within_the_range") s.conn.w++; });
            selUps.forEach(f => { if(a[f]) { s.ups.total++; if(a[f]==="in_shape") s.ups.ok++; } });
        });

        const upsFinal = s.ups.total > 0 ? Math.round((s.ups.ok/s.ups.total)*100) : 0;
        const connFinal = total > 0 ? Math.round(((s.conn.a+s.conn.w)/total)*100) : 0;

        // منطق تبديل العرض للاتصال
        drawDynamic('cConn', 'statsConn', typeConn, 'conn', [s.conn.a, s.conn.w], ['#10b981', '#fbbf24'], s.conn.a + s.conn.w, connFinal);
        // منطق تبديل العرض للـ UPS
        drawDynamic('cUps', 'statsUps', typeUps, 'ups', [upsFinal, 100-upsFinal], ['#0d4b73', '#eff4ff'], s.ups.ok, upsFinal);
    }

    function drawDynamic(canvasId, statsId, type, chartKey, data, colors, rawVal, pct) {
        $(canvasId).style.display = (type === 'stats') ? 'none' : 'block';
        $(statsId).style.display = (type === 'stats') ? 'block' : 'none';
        
        if (type === 'stats') {
            $(statsId).querySelector('.stat-huge').innerText = rawVal;
            $(statsId).querySelector('.stat-pct').innerText = pct + "%";
            return;
        }

        if (charts[chartKey]) charts[chartKey].destroy();
        charts[chartKey] = new Chart($(canvasId), {
            type: type,
            data: { 
                labels: (type==='bar') ? ['ممتاز', 'جيد'] : ['نشط', 'غير نشط'],
                datasets: [{ data: data, backgroundColor: colors, borderRadius: 10, barThickness: 8 }] 
            },
            options: { 
                indexAxis: (type==='bar') ? 'y' : 'x', 
                maintainAspectRatio: false, 
                plugins: { legend: {display: type==='doughnut'} },
                cutout: (type==='doughnut') ? '80%' : 0
            }
        });
    }

    window.copyFullDashboard = async function() {
        const area = $('captureArea');
        const excluded = document.querySelectorAll('.exclude-from-capture');
        excluded.forEach(el => el.style.opacity = '0');
        const canvas = await html2canvas(area, { backgroundColor: '#f4f7fa', scale: 2, useCORS: true });
        excluded.forEach(el => el.style.opacity = '1');
        canvas.toBlob(async (blob) => { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); alert("تم النسخ ✅"); });
    }

    boot();
})();
</script>
</body>
</html>
