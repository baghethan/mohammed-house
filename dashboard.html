<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Dashboard v3.5.0 | Almajdouie Motors</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <style>
    :root { --bg: #f8fafc; --primary: #0d4b73; --accent: #ffd54f; --card: #ffffff; }
    
    body { 
      margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); 
      display: flex; height: 100vh; overflow: hidden; 
    }
    
    /* الشريط الجانبي - سيتحرك تلقائياً مع dir=rtl/ltr */
    .sidebar { 
      width: 320px; background: #fff; border-inline-start: 2px solid #e2e8f0; 
      padding: 25px; display: flex; flex-direction: column; overflow-y: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.05); z-index: 10;
    }
    
    /* منطقة إجمالي الزيارات داخل السايدبار */
    .total-box { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--bg); }
    #totalVisits { font-size: 80px; font-weight: 900; color: var(--primary); margin: 0; line-height: 1; }
    .total-label { font-size: 14px; font-weight: 800; color: #64748b; margin-top: 10px; }

    .sidebar-title { font-size: 15px; font-weight: 900; color: var(--primary); margin-bottom: 15px; }
    .brand-list { display: flex; flex-direction: column; gap: 8px; }
    .brand-item { 
      display: flex; align-items: center; justify-content: space-between; 
      padding: 12px; background: var(--bg); border-radius: 8px; 
    }
    .brand-logo { width: 50px; height: 30px; object-fit: contain; }
    .brand-count { background: var(--primary); color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 20px; font-weight: 900; }

    /* المنطقة الرئيسية للرسوم */
    .main-content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    
    /* الشبكة العلوية (3 رسوم) */
    .top-grid { 
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; 
    }
    
    /* الرسم السفلي (عرض كامل) */
    .bottom-full { width: 100%; }

    .card { background: var(--card); border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
    .card-header { background: var(--primary); color: #fff; padding: 12px 20px; font-size: 14px; font-weight: 800; border-radius: 12px 12px 0 0; }
    .card-body { padding: 15px; flex: 1; position: relative; min-height: 250px; }
    
    #upsPct { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: 900; color: var(--primary); }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="total-box">
      <h1 id="totalVisits">0</h1>
      <div id="t-total-label" class="total-label">إجمالي الزيارات الميدانية</div>
    </div>

    <div class="sidebar-title" id="t-brands">إحصائيات البراندات</div>
    <div id="sideBrandList" class="brand-list">
      </div>
  </aside>

  <main class="main-content">
    <div class="top-grid">
      <div class="card">
        <div class="card-header" id="t-net">حالة أجهزة الشبكة</div>
        <div class="card-body"><canvas id="cNet"></canvas></div>
      </div>
      
      <div class="card">
        <div class="card-header" id="t-conn">جودة الاتصال</div>
        <div class="card-body"><canvas id="cConn"></canvas></div>
      </div>

      <div class="card">
        <div class="card-header" id="t-ups">حالة الـ UPS</div>
        <div class="card-body">
          <canvas id="cUps"></canvas>
          <div id="upsPct">0%</div>
        </div>
      </div>
    </div>

    <div class="bottom-full card">
      <div class="card-header" id="t-train">نظرة عامة على المتطلبات التدريبية</div>
      <div class="card-body"><canvas id="cTrain"></canvas></div>
    </div>
  </main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  Chart.register(ChartDataLabels);
  let charts = {}, state = { visits: [], brands: [], lang: 'ar' };

  // قاموس اللغات
  const i18n = {
    ar: { brands: "إحصائيات البراندات", totalLabel: "إجمالي الزيارات الميدانية", net: "حالة أجهزة الشبكة", conn: "جودة الاتصال", ups: "حالة الـ UPS", train: "نظرة عامة على المتطلبات التدريبية", inShape: "ممتاز", needArr: "يحتاج ترتيب" },
    en: { brands: "Brand Statistics", totalLabel: "Total Field Visits", net: "Network Appliances", conn: "Connectivity Status", ups: "UPS Status", train: "Training Requirements Overview", inShape: "In Shape", needArr: "Need Arr." }
  };

  function applyLanguage(lang) {
    state.lang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    
    const d = i18n[lang];
    $('t-brands').innerText = d.brands;
    $('t-total-label').innerText = d.totalLabel;
    $('t-net').innerText = d.net;
    $('t-conn').innerText = d.conn;
    $('t-ups').innerText = d.ups;
    $('t-train').innerText = d.train;
    updateUI();
  }

  // الاستماع لتغيير اللغة من الأب
  window.addEventListener('message', e => { if (e.data.type === 'LANG_CHANGE') applyLanguage(e.data.lang); });

  function boot(){
    const db = window.parent.appDb;
    if (!db) { setTimeout(boot, 500); return; }
    applyLanguage(window.parent.currentLang || 'ar');

    db.collection('brand_assets').onSnapshot(snap => {
        state.brands = snap.docs.map(d => d.data());
        updateUI();
    });

    db.collection('branch_checklists').onSnapshot(snap => {
        state.visits = snap.docs.map(d => d.data());
        $('totalVisits').textContent = state.visits.length;
        updateUI();
    });
  }

  function updateUI() {
    const counts = {};
    state.visits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });

    $('sideBrandList').innerHTML = state.brands.map(b => {
        const c = counts[b.brand] || 0;
        const logo = b.logoData || b.logoUrl || 'https://placehold.jp/50x30.png';
        return `
          <div class="brand-item">
            <div style="display:flex; align-items:center; gap:12px;">
              <img src="${logo}" class="brand-logo">
              <span style="font-weight:800; font-size:13px; color:#475569;">${b.brand}</span>
            </div>
            <span class="brand-count">${c}</span>
          </div>`;
    }).join('');

    renderCharts();
  }

  function renderCharts() {
    const total = state.visits.length, d = i18n[state.lang];
    let s = { net: 0, conn: {a:0, w:0, b:0} };
    state.visits.forEach(v => {
      const a = v.dynamicAnswers || {};
      if(a["8LQ9F3Rj4MsNDkTbO5Pi"] === "in_shape") s.net++;
      if(a["BcjdipZxDmVgodHk9t1B"] === "above_the_range") s.conn.a++;
      if(a["BcjdipZxDmVgodHk9t1B"] === "within_the_range") s.conn.w++;
    });

    const calc = v => total > 0 ? Math.round((v/total)*100) : 0;
    drawBar('cNet', [d.inShape, d.needArr], [calc(s.net), 100-calc(s.net)], ['#10b981', '#cbd5e1']);
    drawBar('cConn', ['Above', 'Within'], [calc(s.conn.a), calc(s.conn.w)], ['#10b981', '#f59e0b']);
    drawDoughnut('cUps', 0);
  }

  function drawBar(id, labels, data, colors) {
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart($(id), {
      type: 'bar',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 8 }] },
      options: { 
        indexAxis: 'y', maintainAspectRatio: false,
        plugins: { legend: {display:false}, datalabels: { color:'#fff', font:{weight:'bold', size:12}, formatter: v => v+'%' } },
        scales: { x: { max: 100, display: false }, y: { ticks: { font: { weight: 'bold', size: 12 } }, grid: { display:false } } }
      }
    });
  }

  function drawDoughnut(id, val) {
    $('upsPct').innerText = val + "%";
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart($(id), {
      type: 'doughnut',
      data: { datasets: [{ data: [val, 100-val], backgroundColor: ['#0d4b73', '#e2e8f0'] }] },
      options: { cutout: '80%', maintainAspectRatio: false, plugins: { datalabels: {display:false} } }
    });
  }

  boot();
})();
</script>
</body>
</html>
