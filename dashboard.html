<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8">
  <title>Dashboard v1.7.1 | إصلاح الصلاحيات والشعارات</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #38bdf8; }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    .dashboard-wrapper { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
    .sidebar { background: #fff; color: #000; border-left: 2px solid #ddd; padding: 15px; overflow-y: auto; }
    .brand-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .brand-logo { width: 50px; height: 35px; object-fit: contain; background: #fff; border: 1px solid #eee; }
    .main-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px; }
    .card { background: var(--card); border-radius: 8px; border: 1px solid #334155; display: flex; flex-direction: column; }
    .card-header { background: #0d4b73; color: #fff; padding: 8px 12px; font-size: 13px; font-weight: bold; }
    .card-body { padding: 15px; min-height: 180px; display: flex; align-items: flex-end; justify-content: space-around; }
    .bar { width: 25px; background: var(--primary); border-radius: 4px; position: relative; transition: 1s; }
    .footer { position: fixed; bottom: 0; width: 100%; background: #fff; color: #64748b; padding: 5px 20px; font-size: 11px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

<div class="dashboard-wrapper">
  <aside class="sidebar">
    <div style="text-align:center; border-bottom:1px solid #eee; margin-bottom:15px; padding-bottom:10px;">
        <span style="font-size:12px; font-weight:bold;">إجمالي الزيارات</span>
        <h1 style="font-size:48px; margin:0; color:#0d4b73;" id="totalVisits">0</h1>
    </div>
    <div id="sideBrandList"></div>
  </aside>

  <main style="display:flex; flex-direction:column; width:100%;">
    <div style="padding:12px; background:#020617; color:#fff; display:flex; justify-content:space-between;">
        <div style="font-weight:bold;">إصدار التحديث v1.7.1 | فحص الشعارات</div>
        <div id="statusTxt" style="color:#ef4444; font-size:12px;">جاري الاتصال...</div>
    </div>
    <div class="main-grid">
        <div class="card"><div class="card-header">Infrastructure</div><div class="card-body" id="chart1"></div></div>
        <div class="card"><div class="card-header">Hardware</div><div class="card-body" id="chart2"></div></div>
        <div class="card"><div class="card-header">Connectivity</div><div class="card-body" id="chart3"></div></div>
    </div>
  </main>
</div>

<div class="footer">
    <div>v1.7.1-Fix</div>
    <div id="liveClock"></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  let state = { brands: [], checklists: [] };

  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      // 1. جلب الشعارات
      db.collection('brand_assets').onSnapshot(s => {
        state.brands = s.docs.map(d => ({id: d.id, ...d.data()}));
        render();
      }, err => console.error("خطأ شعارات:", err.message));

      // 2. جلب الزيارات
      db.collection('branch_checklists').onSnapshot(s => {
        state.checklists = s.docs.map(d => d.data());
        $('statusTxt').innerText = "متصل بنجاح"; $('statusTxt').style.color = "#10b981";
        render();
      }, err => {
        console.error("خطأ زيارات:", err.message);
        $('statusTxt').innerText = "خطأ صلاحيات: راجع الـ Rules";
      });
    }
  });

  function render() {
    $('totalVisits').innerText = state.checklists.length;
    
    // رسم قائمة البراندات
    $('sideBrandList').innerHTML = state.brands.map(b => {
      const count = state.checklists.filter(c => c.brand === b.brand || c.brandId === b.id).length;
      return `
        <div class="brand-card">
          <img src="${b.logoData || b.logoUrl || ''}" class="brand-logo">
          <div><div style="font-weight:bold; font-size:12px;">${b.nameAr || b.brand}</div>
          <div style="font-size:10px; color:#64748b;">زيارات: ${count}</div></div>
        </div>`;
    }).join('');

    // رسم الرسوم البيانية
    const total = state.checklists.length || 1;
    let counts = { infra: 0, hardware: 0, conn: 0 };
    state.checklists.forEach(c => {
        const a = c.dynamicAnswers || {};
        if(a["8LQ9F3Rj4MsNDkTbO5Pi"] === "in_shape") counts.infra++;
        if(a["0NQrLqvsNNYgd0Iyy6by"] === "fully_functioning") counts.hardware++;
        if(a["BcjdipZxDmVgodHk9t1B"] === "above_the_range") counts.conn++;
    });

    const bar = (p) => `<div class="bar" style="height:${p}%"><span style="position:absolute;top:-18px;width:100%;text-align:center;font-size:10px;font-weight:bold;">${Math.round(p)}%</span></div>`;
    $('chart1').innerHTML = bar((counts.infra/total)*100);
    $('chart2').innerHTML = bar((counts.hardware/total)*100);
    $('chart3').innerHTML = bar((counts.conn/total)*100);
  }

  setInterval(() => { $('liveClock').innerText = new Date().toLocaleTimeString(); }, 1000);
})();
</script>
</body>
</html>
