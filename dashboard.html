<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --primary: #0d4b73;
            --bg: #edf3f8;
            --card: rgba(255, 255, 255, 0.9);
            --border: #d7e0ea;
        }
        body { 
            margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg); padding: 25px; color: #163247;
        }
        .welcome-section {
            background: linear-gradient(135deg, #0d4b73, #0a3b5a);
            color: white; padding: 30px; border-radius: 20px;
            margin-bottom: 30px; box-shadow: 0 10px 20px rgba(13, 75, 115, 0.2);
        }
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            padding: 25px; border-radius: 16px; text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 { margin: 0; font-size: 14px; color: #6e8192; }
        .stat-card .value { font-size: 28px; font-weight: 800; color: var(--primary); margin: 10px 0; }
        .badge { background: #eaf9f0; color: #2f9e66; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="welcome-section">
        <h1 id="welcomeMsg">مرحباً بك في نظام المجدوعي للسيارات</h1>
        <p>لوحة التحكم الذكية - نظرة عامة على أداء النظام اليوم.</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>إجمالي الفروع</h3>
            <div class="value" id="branchCount">..</div>
            <span class="badge">تحديث فوري</span>
        </div>
        <div class="stat-card">
            <h3>طلبات الإجازات</h3>
            <div class="value" id="holidayCount">..</div>
            <span class="badge" style="background:#fff7e6; color:#c47f00;">تحت المراجعة</span>
        </div>
        <div class="stat-card">
            <h3>الفنيين المسجلين</h3>
            <div class="value" id="techCount">..</div>
            <span class="badge">نشط الآن</span>
        </div>
        <div class="stat-card">
            <h3>الزيارات الميدانية</h3>
            <div class="value">0</div>
            <span class="badge">اليوم</span>
        </div>
    </div>

    <script type="module">
        // جلب البيانات من الماستر (test2.html)
        const db = window.parent.appDb;
        const userData = window.parent.currentUserData;

        if (userData) {
            document.getElementById('welcomeMsg').innerText = `أهلاً، ${userData.name}`;
        }

        // جلب إحصائيات سريعة من Firestore
        async function fetchStats() {
            const branches = await db.collection('branches').get();
            document.getElementById('branchCount').innerText = branches.size;

            const holidays = await db.collection('schedule').where('status', '==', 'pending').get();
            document.getElementById('holidayCount').innerText = holidays.size;

            const techs = await db.collection('technicians').get();
            document.getElementById('techCount').innerText = techs.size;
        }

        fetchStats();
    </script>
</body>
</html>
