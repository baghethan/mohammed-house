<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Check-List Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
 --bg:#eef3f8; --card:#ffffff; --primary:#0d4b73; --muted:#667085; --border:#dbe7f1;
 --deep:#0b3048; --deep2:#0d405e; --deep3:#07283d; --deep4:#123f5c;
 --grid:rgba(255,255,255,.10); --line:rgba(255,255,255,.12); --shadow:0 12px 32px rgba(6,24,38,.22);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#163247}
.hidden{display:none!important}
.container{max-width:1440px;margin:18px auto;padding:0 14px 28px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 6px 20px rgba(0,0,0,.08)}

.dashboard-board{
 background:linear-gradient(180deg,var(--deep),var(--deep3));
 border-radius:24px;overflow:hidden;box-shadow:var(--shadow)
}

.board-layout{
 display:grid;
 grid-template-columns:320px 1fr;
 min-height:760px;
}

/* ===== SIDEBAR ===== */
.side{
 background:#f4f7fb;
 border-right:4px solid rgba(13,75,115,.14);
}

.side-title{
 text-align:center;
 font-weight:800;
 color:#0d4b73;
 padding:14px;
 border-bottom:1px solid #dbe7f1
}

.side-content{
 padding:16px;
}

/* ===== BRAND CARD (MODIFIED) ===== */
.side-list{
 display:grid;
 gap:12px;
 max-height:620px;
 overflow:auto
}

.brand-item{
 display:flex;
 flex-direction:column;
 align-items:center;
 text-align:center;
 gap:8px;
 padding:14px;
 background:#fff;
 border:1px solid #dbe7f1;
 border-radius:16px;
 box-shadow:0 4px 12px rgba(0,0,0,.04)
}

.brand-logo{
 width:64px;
 height:64px;
 border-radius:14px;
 object-fit:contain;
 border:1px solid #dbe7f1;
 background:#fff
}

.brand-logo-placeholder{
 width:64px;height:64px;
 border-radius:14px;
 border:1px solid #dbe7f1;
 display:flex;align-items:center;justify-content:center;
 color:#94a3b8
}

.brand-name{
 font-size:14px;
 font-weight:800;
 color:#22364a
}

.brand-sub{
 font-size:12px;
 color:#667085
}

/* ===== MAIN ===== */
.main{
 padding:20px;
 color:#fff
}
</style>
</head>

<body>
<div class="container">

<div id="sessionNotice" class="card hidden">
 الرجاء تسجيل الدخول من داخل النظام
</div>

<div id="dashboardRoot" class="hidden">

<div class="card">
 <h3>Check‑List Dashboard</h3>
</div>

<div id="dashboardCapture" class="dashboard-board">
<div class="board-layout">

<!-- ===== SIDEBAR ===== -->
<aside class="side">
 <div class="side-title">Visited Brands</div>
 <div class="side-content">
  <strong id="sideTotalVisits">0</strong>
  <div class="side-list" id="sideBrandList"></div>
 </div>
</aside>

<!-- ===== MAIN ===== -->
<main class="main">
 <h3>Overall Assessment</h3>
</main>

</div>
</div>
</div>
</div>

<script>
(function(){
 var $=id=>document.getElementById(id);
 var state={visits:[],brands:[]};

 function escapeHtml(v){
  return String(v||'').replace(/[&<>"']/g,s=>(
   {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]
  ));
 }

 function normalize(v){
  return String(v||'').toLowerCase().replace(/\s+/g,'');
 }

 function getBrandName(v){
  return v.brand||v.brandName||v.brandKey||'بدون اسم';
 }

 function getBrandLogo(asset){
  if(!asset) return '';
  var raw=asset.logoUrl||asset.logoData||'';
  if(raw.startsWith('data:image')) return raw;
  if(raw.length>100) return 'data:image/png;base64,'+raw;
  return '';
 }

 function renderBrands(){
  var list=$('sideBrandList');
  var total=$('sideTotalVisits');

  var map=new Map();
  state.visits.forEach(v=>{
   var name=getBrandName(v);
   map.set(name,(map.get(name)||0)+1);
  });

  total.textContent=state.visits.length;

  if(!map.size){
   list.innerHTML='<div class="brand-item"><div class="brand-name">لا توجد زيارات</div></div>';
   return;
  }

  list.innerHTML=[...map.entries()].map(([name,count])=>{
   var asset=state.brands.find(b=>normalize(b.brand)==normalize(name)||normalize(b.brandKey)==normalize(name));
   var logo=getBrandLogo(asset);
   return `
    <div class="brand-item">
     ${logo?`<img class="brand-logo" src="${logoaceholder">—</div>`}
     <div class="brand-name">${escapeHtml(name)}</div>
     <div class="brand-sub">${count} زيارة</div>
    </div>`;
  }).join('');
 }

 function boot(){
  var fb=window.firebase||(window.parent&&window.parent.firebase);
  if(!fb){$('sessionNotice').classList.remove('hidden');return;}

  fb.auth().onAuthStateChanged(user=>{
   if(!user){$('sessionNotice').classList.remove('hidden');return;}
   $('dashboardRoot').classList.remove('hidden');

   fb.firestore().collection('siteVisits')
    .onSnapshot(s=>{
     state.visits=s.docs.map(d=>d.data());
     renderBrands();
    });

   fb.firestore().collection('brand_assets')
    .onSnapshot(s=>{
     state.brands=s.docs.map(d=>d.data());
     renderBrands();
    });
  });
 }

 boot();
})();
</script>
</body>
</html>
