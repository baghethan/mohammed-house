<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard v5.3.0 | Almajdouie</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9ff; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0, 30, 64, 0.04); }
        /* حاويات الرسوم لضبط الارتفاع ومنع التمدد البشع */
        .conn-chart-box { height: 160px; width: 100%; margin-top: 20px; }
        .ups-chart-box { height: 200px; width: 100%; position: relative; }
        /* شريط التمرير للبراندات */
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-4 lg:p-6 overflow-x-hidden">

    <div id="captureArea" class="max-w-[1400px] mx-auto space-y-6 bg-[#f8f9ff] p-4 rounded-3xl">
        
        <header class="flex flex-wrap items-center justify-between gap-4 px-2">
            <div class="flex items-center gap-3">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-8 object-contain" alt="Logo">
                <h1 class="text-lg font-black text-[#0d4b73]" id="t-welcome">ALMAJDOUIE MOTORS</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="copyAsImage()" class="flex items-center gap-2 bg-[#0d4b73] hover:bg-blue-800 text-white px-5 py-2 rounded-xl text-xs font-black transition shadow-md active:scale-95">
                    <span id="copyBtnTxt">نسخ اللوحة كصورة</span>
                    <span class="text-lg">📷</span>
                </button>
                <div id="statusTxt" class="text-[10px] font-bold bg-green-100 text-green-700 px-3 py-1 rounded-full">LIVE SYNC ✅</div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="bg-[#3b82f6] p-6 rounded-2xl text-white flex justify-between items-center shadow-lg transform transition hover:scale-[1.01]">
                <div><h3 class="font-black text-lg">Branch Visits</h3><p class="text-[11px] opacity-85">Manage and track visits</p></div>
                <div class="bg-white/20 p-3 rounded-full text-xl">📍</div>
            </div>
            <div class="bg-[#10b981] p-6 rounded-2xl text-white flex justify-between items-center shadow-lg transform transition hover:scale-[1.01]">
                <div><h3 class="font-black text-lg">Check-List</h3><p class="text-[11px] opacity-85">Quality assessment forms</p></div>
                <div class="bg-white/20 p-3 rounded-full text-xl">📋</div>
            </div>
            <div class="bg-[#a855f7] p-6 rounded-2xl text-white flex justify-between items-center shadow-lg transform transition hover:scale-[1.01]">
                <div><h3 class="font-black text-lg">Reports</h3><p class="text-[11px] opacity-85">View analytics</p></div>
                <div class="bg-white/20 p-3 rounded-full text-xl">📊</div>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-5">
            <div class="col-span-12 lg:col-span-4 bg-white rounded-2xl p-6 card-shadow flex flex-col h-[450px]">
                <h2 class="text-sm font-bold text-slate-400 mb-2 uppercase">Total Visits</h2>
                <div class="flex items-center gap-3 mb-6">
                    <span class="text-6xl font-black text-[#0d4b73]" id="totalVisits">0</span>
                    <span class="bg-blue-50 text-[#0d4b73] text-[10px] font-black px-2 py-1 rounded-full">+12%</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scroll" id="sideBrandList"></div>
            </div>

            <div class="col-span-12 lg:col-span-4 bg-white rounded-2xl p-6 card-shadow flex flex-col items-center justify-center relative h-[450px]">
                <h2 class="text-sm font-black text-[#0d4b73] absolute top-6 right-6">UPS Status</h2>
                <div class="ups-chart-box">
                    <canvas id="cUps"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pt-8">
                        <span class="text-3xl font-black text-[#0d4b73]" id="upsPct">0%</span>
                        <span class="text-[10px] font-bold text-slate-400">Healthy</span>
                    </div>
                </div>
            </div>

            <div class="col-span-12 lg:col-span-4 bg-white rounded-2xl p-6 card-shadow h-[450px]">
                <h2 class="text-sm font-black text-[#0d4b73] mb-2">Connectivity Status</h2>
                <div class="conn-chart-box">
                    <canvas id="cConn"></canvas>
                </div>
                <div class="mt-4 text-[10px] text-slate-400 font-bold border-t pt-4">Real-time connectivity tracking</div>
            </div>
        </div>
    </div>

<script>
// --- دالة نسخ الصورة ---
async function copyAsImage() {
    const btn = document.getElementById('copyBtnTxt');
    try {
        btn.innerText = "جاري الحفظ...";
        const canvas = await html2canvas(document.getElementById('captureArea'), { backgroundColor: '#f8f9ff', scale: 2, useCORS: true });
        canvas.toBlob(async (blob) => {
            await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
            btn.innerText = "✅ تم النسخ!";
            setTimeout(() => { btn.innerText = "نسخ اللوحة كصورة"; }, 2000);
        });
    } catch (err) { btn.innerText = "❌ خطأ"; }
}

// --- ربط البيانات والرسوم ---
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { visits: [], brands: [] };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 500); return; }

        db.collection('brand_assets').onSnapshot(snap => {
            state.brands = snap.docs.map(d => d.data());
            updateUI();
        });

        db.collection('branch_checklists').onSnapshot(snap => {
            state.visits = snap.docs.map(d => d.data());
            $('totalVisits').textContent = state.visits.length;
            updateUI();
        });
    }

    function updateUI() {
        const counts = {}; state.visits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || '';
            return `
                <div class="flex items-center justify-between p-2.5 bg-slate-50/50 rounded-xl border border-slate-100">
                    <div class="flex items-center gap-3">
                        <img src="${logo}" class="w-9 h-6 object-contain rounded bg-white p-0.5 border border-slate-200">
                        <span class="text-[11px] font-bold text-slate-700">${b.brand}</span>
                    </div>
                    <span class="text-sm font-black text-[#0d4b73]">${c}</span>
                </div>`;
        }).join('');
        renderCharts();
    }

    function renderCharts() {
        const total = state.visits.length;
        let s = { conn: {a:0, w:0, b:0} };
        state.visits.forEach(v => {
            const a = v.dynamicAnswers || {};
            // قراءة حقل جودة الاتصال
            if(a["BcjdipZxDmVgodHk9t1B"] === "above_the_range") s.conn.a++;
            if(a["BcjdipZxDmVgodHk9t1B"] === "within_the_range") s.conn.w++;
            if(a["BcjdipZxDmVgodHk9t1B"] === "below_the_range") s.conn.b++;
        });

        // ❌ الإصلاح: جعل Connectivity ملموماً ونحيفاً ❌
        if (charts.conn) charts.conn.destroy();
        charts.conn = new Chart($('cConn'), {
            type: 'bar',
            data: { 
                labels: ['Online', 'Offline', 'Mainten.'], 
                datasets: [{ 
                    data: [s.conn.a, s.conn.w, s.conn.b], 
                    backgroundColor: ['#0d4b73', '#ffd54f', '#cbd5e1'], 
                    borderRadius: 20,
                    barThickness: 6, // ✅ تحديد سمك ثابت ونحيف للعمود
                }] 
            },
            options: { 
                indexAxis: 'y', 
                maintainAspectRatio: false, // ✅ لضمان احترام الارتفاع الملموم
                plugins: { legend: {display:false} },
                scales: { 
                    x: { display: false }, 
                    y: { 
                        grid: { display:false, drawBorder: false }, // ✅ حذف الخطوط البشعة
                        ticks: { font:{weight:'bold', size:11}, color: '#64748b' } 
                    } 
                } 
            }
        });

        if (charts.ups) charts.ups.destroy();
        charts.ups = new Chart($('cUps'), {
            type: 'doughnut',
            data: { datasets: [{ data: [85, 15], backgroundColor: ['#0d4b73', '#eff4ff'], borderWidth: 0 }] },
            options: { cutout: '82%', maintainAspectRatio: false, plugins: { legend: {display:false} } }
        });
        $('upsPct').innerText = "85%";
    }

    boot();
})();
</script>
</body>
</html>
