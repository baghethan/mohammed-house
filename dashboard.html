<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8">
  <title>Dashboard v1.6.2 | فحص الصلاحيات</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root { --header: #020617; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #38bdf8; }
    body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    .dashboard-wrapper { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
    .sidebar { background: #fff; color: #000; border-left: 2px solid #ddd; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
    .side-title { color: #0d4b73; font-size: 26px; font-weight: 800; transform: rotate(-90deg); position: absolute; left: -65px; top: 220px; white-space: nowrap; }
    .top-nav { padding: 12px 15px; background: var(--header); color: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
    .main-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 15px; }
    .card { background: var(--card); border-radius: 8px; border: 1px solid #334155; display: flex; flex-direction: column; }
    .card-header { background: #0d4b73; color: #fff; padding: 8px 12px; font-size: 13px; font-weight: bold; }
    .card-body { padding: 15px; flex-grow: 1; min-height: 190px; display: flex; align-items: flex-end; justify-content: space-around; }
    .bar { width: 28px; background: var(--primary); border-radius: 4px; position: relative; transition: height 1s; }
    .footer-info { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; color: #64748b; padding: 6px 20px; display: flex; justify-content: space-between; font-size: 11px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="dashboardRoot" class="dashboard-wrapper">
  <aside class="sidebar">
    <div class="side-title">Site Visits Dashboard</div>
    <div style="text-align: center; margin-top: 20px;">
        <span style="font-size: 11px; font-weight: bold;">إجمالي الزيارات</span>
        <h1 style="font-size: 60px; margin: 5px 0; color: #0d4b73;" id="totalVisits">0</h1>
    </div>
  </aside>

  <div class="main-content">
    <div class="top-nav">
        <div style="font-weight: bold; font-size: 14px;">نظام إدارة الزيارات | إصدار الفحص v1.6.2</div>
        <div style="display:flex; gap:10px;">
            <button onclick="setLang('ar')" style="background:none; color:#fff; border:1px solid #fff; cursor:pointer;">AR</button>
            <button onclick="setLang('en')" style="background:none; color:#fff; border:1px solid #fff; cursor:pointer;">EN</button>
        </div>
    </div>
    <main class="main-grid">
        <div class="card"><div class="card-header">Network Infrastructure</div><div class="card-body" id="networkChart"></div></div>
        <div class="card"><div class="card-header">End User Services</div><div class="card-body" id="pcsChart"></div></div>
        <div class="card"><div class="card-header">Connectivity Status</div><div class="card-body" id="connChart"></div></div>
    </main>
  </div>
</div>

<div class="footer-info">
    <div>إصدار: <strong>v1.6.2-Live</strong></div>
    <div id="liveClock"></div>
    <div>الحالة: <strong id="statusTxt" style="color:#ef4444">بانتظار الصلاحيات...</strong></div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  auth.onAuthStateChanged(user => {
    if (user) {
      console.log("تم تسجيل الدخول بنجاح.");
      console.log("Your UID is:", user.uid); // افحص هذا الـ ID في Console وقارنه بـ app_users
      
      // جلب البيانات مع مراقبة أخطاء الصلاحيات
      db.collection('branch_checklists').onSnapshot(snap => {
        $('statusTxt').innerText = "متصل حي بنجاح";
        $('statusTxt').style.color = "#10b981";
        const docs = snap.docs.map(d => d.data());
        $('totalVisits').textContent = docs.length;
        renderCharts(docs);
      }, err => {
        console.error("خطأ في الصلاحيات:", err.message);
        $('statusTxt').innerText = "خطأ صلاحيات: راجع الـ Rules";
      });
    } else {
      window.location.href = 'login.html';
    }
  });

  function renderCharts(docs) {
    let stats = { infra: 0, pcs: 0, conn: 0 };
    docs.forEach(doc => {
      const ans = doc.dynamicAnswers || {};
      if (ans["8LQ9F3Rj4MsNDkTbO5Pi"] === "in_shape") stats.infra++;
      if (ans["0NQrLqvsNNYgd0Iyy6by"] === "fully_functioning") stats.pcs++;
      if (ans["BcjdipZxDmVgodHk9t1B"] === "above_the_range") stats.conn++;
    });
    const total = docs.length || 1;
    $('networkChart').innerHTML = createBar((stats.infra/total)*100, "#94a3b8");
    $('pcsChart').innerHTML = createBar((stats.pcs/total)*100, "#38bdf8");
    $('connChart').innerHTML = createBar((stats.conn/total)*100, "#f97316");
  }

  function createBar(val, color) {
    return `<div class="bar" style="height:${val}%; background:${color}"><span style="position:absolute;top:-20px;width:100%;text-align:center;font-size:10px;font-weight:bold;">${Math.round(val)}%</span></div>`;
  }
})();
</script>
</body>
</html>
