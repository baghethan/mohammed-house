<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard v7.7.0 | AlMajdouie IT Assessment</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7fa; }
        .card-shadow { box-shadow: 0 10px 40px rgba(0, 30, 64, 0.05); }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        .custom-checkbox { width: 14px; height: 14px; border-radius: 4px; border: 2px solid rgba(255,255,255,0.2); background: transparent; cursor: pointer; appearance: none; position: relative; }
        .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        .custom-checkbox:checked::after { content: '✓'; position: absolute; color: white; font-size: 9px; top: -2px; left: 1px; }
        .stat-huge { font-size: 5rem; font-weight: 900; color: #0d4b73; line-height: 1; }
        .stat-pct { font-size: 1.5rem; font-weight: 900; color: #10b981; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div class="max-w-[1600px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[40px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">⚙️</div>
                    <h2 class="text-xl font-black">مدير تخصيص التقارير (v7.7.0)</h2>
                </div>
                <div class="bg-white/10 px-4 py-2 rounded-xl text-[11px] font-black tracking-widest">
                    MASTER CONTROL PANEL
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <script>
                    const cats = [
                        {id: 'hardware', title: 'Hardware & Peripherals'},
                        {id: 'network', title: 'Network Infrastructure'},
                        {id: 'software', title: 'Software & Systems'},
                        {id: 'systems', title: 'Systems Assessment'}
                    ];
                </script>
                <div id="configGrid" class="contents"></div>
            </div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex justify-between items-center text-[11px] font-black">
                <div class="flex items-center gap-4 text-blue-300">
                    <span>VERSION: v7.7.0 Master</span>
                    <span id="liveClock" class="text-green-400">00:00:00</span>
                </div>
                <button onclick="window.renderCharts()" class="bg-[#10b981] text-white px-10 py-3 rounded-2xl transition shadow-lg font-black text-xs uppercase tracking-tighter">تحديث كافة التقارير</button>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1600px] mx-auto space-y-8 bg-[#f4f7fa] p-10 rounded-[60px]">
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-4">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-10 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73]">ALMAJDOUIE MOTORS</h1>
            </div>
            
            <div class="flex items-center gap-4 exclude-from-capture">
                <div class="bg-white px-4 py-2 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-3">
                    <div class="flex items-center gap-2 border-l pl-3">
                        <span class="text-[10px] font-black text-slate-400">من / From</span>
                        <input type="date" id="dateFrom" onchange="window.filterData()" class="border-none text-xs font-black text-[#0d4b73] focus:ring-0">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black text-slate-400">إلى / To</span>
                        <input type="date" id="dateTo" onchange="window.filterData()" class="border-none text-xs font-black text-[#0d4b73] focus:ring-0">
                    </div>
                </div>
                <button onclick="window.copyFullDashboard()" class="bg-[#0d4b73] text-white px-8 py-3 rounded-2xl text-sm font-black shadow-xl transition active:scale-95">نسخ كصورة 📷</button>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-8 items-stretch">
            <div class="col-span-12 lg:col-span-4 bg-white rounded-[45px] p-10 card-shadow border border-slate-50 flex flex-col justify-center text-center">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Total Execution | إجمالي الزيارات</h2>
                <span class="text-9xl font-black text-[#0d4b73] leading-none" id="totalVisits">0</span>
            </div>
            <div id="sideBrandList" class="col-span-12 lg:col-span-8 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8" id="reportsGrid"></div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [] };

    // 🕵️ ماب البنود الرسمية كما طلبت 🕵️
    const SCHEMA = {
        hardware: { title: "Hardware & Peripherals Assessment", color: "#3b82f6", items: { "8LQ9F3Rj4MsNDkTbO5Pi": "PCs Condition", "EeypXJo6RgtxIhcVVfzk": "Printers Condition", "9EozMBKysmOoajPkgUTh": "Unified Communication", "unused_assets": "Unused/Damaged Assets" } },
        network: { title: "Network Infrastructure Assessment", color: "#10b981", items: { "BcjdipZxDmVgodHk9t1B": "Cabinets Condition", "E8Gvjsh8fJ0rkZX7PPaK": "Upload 4-6 Mbps", "infrastructure_cond": "Low Current Infra", "9OHHSM4ossstUSNe2q0S": "Download 6-9 Mbps", "room_temp": "Server Room Temp", "ups_status": "UPS Status" } },
        software: { title: "Software & Systems Assessment", color: "#f59e0b", items: { "6fx4HNunJZRyPziv5r02": "OS Up to Date", "0NQrLQvsNNYgd0Iyy6by": "Cleanup Apps", "onedrive_backup": "OneDrive Backup", "customer_portals": "Customer Portals", "erp_apps": "ERP Applications", "training_req": "Training Requirement" } },
        systems: { title: "Systems Assessment", color: "#0d4b73", items: { "EcfiAfRlykxLot8a913E": "Upgrade Windows_11" } }
    };

    setInterval(() => { $('liveClock').innerText = new Date().toLocaleTimeString('en-GB', { hour12: false }); }, 1000);

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 1000); return; }
        
        // توليد لوحة التحكم
        $('configGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white/5 p-5 rounded-[24px] border border-white/10">
                <h3 class="text-[10px] font-black text-blue-300 uppercase mb-4">${SCHEMA[key].title}</h3>
                <div class="mb-4">
                    <p class="text-[9px] opacity-50 mb-1">نوع الشارت:</p>
                    <select id="type-${key}" class="w-full bg-white/10 text-white text-[10px] border-none rounded-lg p-1" onchange="window.renderCharts()">
                        <option value="bar" class="text-black">أعمدة (Bar Chart)</option>
                        <option value="doughnut" class="text-black">دونات (Doughnut Chart)</option>
                        <option value="stats" class="text-black">أرقام فقط (Stats)</option>
                    </select>
                </div>
                <div class="space-y-1 max-h-[100px] overflow-y-auto custom-scroll">
                    ${Object.keys(SCHEMA[key].items).map(fId => `<label class="flex items-center gap-2 py-0.5"><input type="checkbox" value="${fId}" data-cat="${key}" checked class="custom-checkbox field-chk" onchange="window.renderCharts()"><span class="text-[9px] font-bold opacity-70">${SCHEMA[key].items[fId]}</span></label>`).join('')}
                </div>
            </div>
        `).join('');

        // توليد كروت التقارير في منطقة الطباعة
        $('reportsGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white rounded-[45px] p-10 card-shadow flex flex-col min-h-[450px]">
                <h3 class="text-sm font-black text-[#0d4b73] mb-8 uppercase border-b border-slate-50 pb-4">${SCHEMA[key].title}</h3>
                <div id="container-${key}" class="flex-1 relative flex flex-col items-center justify-center">
                    <canvas id="chart-${key}"></canvas>
                    <div id="stats-${key}" class="hidden text-center">
                        <div class="stat-huge" id="val-${key}">0</div>
                        <div class="stat-pct" id="pct-${key}">0%</div>
                    </div>
                </div>
            </div>
        `).join('');

        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); window.updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { state.allVisits = snap.docs.map(d => d.data()); window.filterData(); });
    }

    window.filterData = function() {
        const from = $('dateFrom').value, to = $('dateTo').value;
        if (!from && !to) { state.filteredVisits = [...state.allVisits]; }
        else {
            const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
            const dTo = to ? new Date(to).setHours(23,59,59,999) : Infinity;
            state.filteredVisits = state.allVisits.filter(v => {
                const vDate = v.timestamp ? v.timestamp.toDate().getTime() : 0;
                return vDate >= dFrom && vDate <= dTo;
            });
        }
        $('totalVisits').textContent = state.filteredVisits.length;
        window.updateUI();
    }

    window.updateUI = function() {
        const counts = {}; state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => {
            const c = counts[b.brand], logo = b.logoData || b.logoUrl || '';
            return `<div class="bg-white rounded-[32px] p-8 shadow-sm border border-slate-50 flex items-center justify-between"><span class="text-7xl font-black text-[#0d4b73]">${c}</span><div class="flex flex-col items-center gap-1"><img src="${logo}" class="w-16 h-10 object-contain"><span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">${b.brand}</span></div></div>`;
        }).join('');
        window.renderCharts();
    }

    window.renderCharts = function() {
        Object.keys(SCHEMA).forEach(catKey => {
            const type = $(`type-${catKey}`).value;
            const selectedFields = Array.from(document.querySelectorAll(`.field-chk[data-cat="${catKey}"]:checked`)).map(i => i.value);
            const dataSet = { labels: [], values: [], okCount: 0, totalCount: 0 };

            selectedFields.forEach(fId => {
                let ok = 0, total = 0;
                state.filteredVisits.forEach(v => {
                    const ans = (v.dynamicAnswers || {})[fId];
                    if (ans) {
                        total++; dataSet.totalCount++;
                        if (["fully_functioning", "in_shape", "above_the_range", "within_the_range", "yes", "up_to_date"].includes(ans)) {
                            ok++; dataSet.okCount++;
                        }
                    }
                });
                dataSet.labels.push(SCHEMA[catKey].items[fId]);
                dataSet.values.push(total > 0 ? Math.round((ok/total)*100) : 0);
            });

            const overallPct = dataSet.totalCount > 0 ? Math.round((dataSet.okCount / dataSet.totalCount) * 100) : 0;
            
            // تبديل واجهة العرض
            $(`chart-${catKey}`).style.display = (type === 'stats') ? 'none' : 'block';
            $(`stats-${catKey}`).style.display = (type === 'stats') ? 'block' : 'none';

            if (type === 'stats') {
                $(`val-${catKey}`).innerText = dataSet.okCount;
                $(`pct-${catKey}`).innerText = overallPct + "%";
            } else {
                if (charts[catKey]) charts[catKey].destroy();
                charts[catKey] = new Chart($(`chart-${catKey}`), {
                    type: type,
                    data: {
                        labels: dataSet.labels,
                        datasets: [{ data: (type === 'doughnut' ? [overallPct, 100-overallPct] : dataSet.values), backgroundColor: (type === 'doughnut' ? [SCHEMA[catKey].color, '#eff4ff'] : SCHEMA[catKey].color), borderRadius: 15, barThickness: 14 }]
                    },
                    options: {
                        indexAxis: (type === 'bar' ? 'y' : 'x'),
                        maintainAspectRatio: false,
                        plugins: { legend: { display: (type === 'doughnut') } },
                        scales: type === 'bar' ? { x: { max: 100, display: false }, y: { grid: { display: false }, ticks: { font: { weight: 'bold', size: 12 } } } } : { display: false }
                    }
                });
            }
        });
    }

    window.copyFullDashboard = async function() {
        const excluded = document.querySelectorAll('.exclude-from-capture');
        excluded.forEach(el => el.style.opacity = '0');
        const canvas = await html2canvas($('captureArea'), { backgroundColor: '#f4f7fa', scale: 2, useCORS: true });
        excluded.forEach(el => el.style.opacity = '1');
        canvas.toBlob(async (blob) => { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); alert("تم النسخ بنجاح ✅"); });
    }

    boot();
})();
</script>
</body>
</html>
