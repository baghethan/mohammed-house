<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Branch Visits Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef3f8;color:#163247}
.hidden{display:none!important}
.container{max-width:1320px;margin:20px auto;padding:0 14px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h3{margin:0;color:#0d4b73}
.muted{color:#667085;font-size:13px}
button{background:#0d4b73;color:#fff;border:none;border-radius:8px;padding:10px 14px;cursor:pointer}

/* Evaluation Board */
.eval-board{background:linear-gradient(180deg,#0b3048,#07283d);border-radius:20px;padding:18px;color:#fff}
.eval-title{font-size:22px;font-weight:bold;margin-bottom:6px}
.eval-sub{font-size:13px;color:#d0d5dd;margin-bottom:14px}

.pie-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.pie{width:180px;height:180px;border-radius:50%;background:conic-gradient(#4f8fdb 0deg 210deg,#f97316 210deg 280deg,#5ac036 280deg 360deg);position:relative}
.pie span{position:absolute;inset:30px;border-radius:50%;background:#0d405e;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:bold}

.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.bar-card{background:#0d405e;border-radius:14px;padding:12px}
.bar-card h4{margin:0 0 8px;font-size:15px}
.bar-wrap{display:flex;align-items:flex-end;gap:10px;height:120px}
.bar{width:36px;border-radius:8px 8px 0 0}
.bar.blue{background:#4f8fdb}
.bar.orange{background:#f97316}

.session-note{background:#fff7e6;border:1px solid #f5d08a;color:#8a5a00;border-radius:14px;padding:14px}
</style>
</head>

<body>
<div class="container">

<div id="sessionNotice" class="session-note hidden">الرجاء تسجيل الدخول من الصفحة الرئيسية أولاً</div>

<div id="dashboardRoot" class="hidden">

<div class="card">
  <div class="section-head">
    <h3>التقييم من نموذج Check-List</h3>
    <button onclick="captureEval()">نسخ صورة التقييم</button>
  </div>

  <div id="evalSection" class="eval-board">
    <div class="eval-title">Overall Assessment</div>
    <div class="eval-sub">Pie + Bar Charts (Live Data)</div>

    <div class="pie-wrap">
      <div class="pie"><span><div>58%</div><small>Overall</small></span></div>
      <div>
        <div>🔵 Fully Functioning</div>
        <div>🟠 Requires Service</div>
        <div>🟢 Other / Mixed</div>
      </div>
    </div>

    <div class="bars">
      <div class="bar-card">
        <h4>Hardware & Peripherals</h4>
        <div class="bar-wrap">
          <div class="bar blue" style="height:75%"></div>
          <div class="bar orange" style="height:25%"></div>
        </div>
      </div>

      <div class="bar-card">
        <h4>Network Infrastructure</h4>
        <div class="bar-wrap">
          <div class="bar blue" style="height:60%"></div>
          <div class="bar orange" style="height:40%"></div>
        </div>
      </div>
    </div>

  </div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
function captureEval(){
  const el = document.getElementById('evalSection');
  html2canvas(el,{backgroundColor:null,scale:2}).then(canvas=>{
    canvas.toBlob(b=>{
      if(navigator.clipboard){
        navigator.clipboard.write([new ClipboardItem({'image/png':b})]);
        alert('✅ تم نسخ صورة التقييم');
      }
    })
  })
}

(function(){
  if(!window.parent || !window.parent.firebase){
    document.getElementById('sessionNotice').classList.remove('hidden');
    return;
  }
  document.getElementById('dashboardRoot').classList.remove('hidden');
})();
</script>
</body>
</html>
