<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Site Visit v3.4 – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #eef3f8;
    }

    .hidden {
      display: none;
    }

    header {
      background: #0d4b73;
      color: #fff;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .container {
      max-width: 1300px;
      margin: 20px auto;
      padding: 0 14px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    input,
    button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background: #2f9e66;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    button.danger {
      background: #d64545;
      width: auto;
      min-width: 120px;
    }

    .stats-main,
    .stats-sub {
      display: grid;
      gap: 14px;
      margin-bottom: 16px;
    }

    .stats-main {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .stats-sub {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .stat {
      padding: 14px;
      border-radius: 14px;
      background: #f8fbff;
      border: 1px solid #dde6ef;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      color: #0d4b73;
      margin-bottom: 6px;
    }

    .stat span {
      font-size: 13px;
      color: #555;
    }

    .stat.primary {
      background: #0d4b73;
      color: #fff;
    }

    .stat.primary strong {
      color: #fff;
    }

    .stat.primary span {
      color: #eaf4ff;
    }

    .stat.success {
      border-right: 6px solid #2f9e66;
    }

    .stat.warning {
      border-right: 6px solid #c47f00;
    }

    .stat.info {
      border-right: 6px solid #295fa5;
    }

    .footer-note {
      font-size: 13px;
      color: #2f9e66;
    }

    #loginMsg {
      color: #d64545;
      font-size: 14px;
      margin-top: 10px;
    }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      button.danger {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- ===== LOGIN ===== -->
  <div id="loginBox" class="container">
    <div class="card">
      <h3>تسجيل الدخول</h3>

      <input id="loginEmail" type="email" placeholder="Email" />
      <br /><br />

      <input id="loginPassword" type="password" placeholder="Password" />
      <br /><br />

      <button id="loginBtn">دخول</button>
      <p id="loginMsg"></p>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div id="app" class="hidden">
    <header>
      <strong>إدارة زيارات الفروع والفنيين – v3.4</strong>
      <button id="logoutBtn" class="danger">Logout</button>
    </header>

    <div class="container">
      <div class="card">
        <h3>Dashboard (بيانات مباشرة من Firebase)</h3>

        <!-- الصف الأول -->
        <div class="stats-main">
          <div class="stat primary">
            <strong id="statBranches">0</strong>
            <span>الفروع</span>
          </div>

          <div class="stat primary">
            <strong id="statTechnicians">0</strong>
            <span>الفنيين</span>
          </div>

          <div class="stat primary">
            <strong id="statVisits">0</strong>
            <span>إجمالي الزيارات</span>
          </div>

          <div class="stat primary">
            <strong id="statChecklists">0</strong>
            <span>Check-Lists</span>
          </div>
        </div>

        <!-- الصف الثاني -->
        <div class="stats-sub">
          <div class="stat success">
            <strong id="statCompletedVisits">0</strong>
            <span>زيارات مكتملة</span>
          </div>

          <div class="stat warning">
            <strong id="statPendingVisits">0</strong>
            <span>زيارات معلّقة</span>
          </div>

          <div class="stat info">
            <strong id="statVisitedTechnicians">0</strong>
            <span>فنيون قاموا بزيارة</span>
          </div>
        </div>

        <!-- الصف الثالث -->
        <div class="stats-sub">
          <div class="stat">
            <strong id="statBrands">0</strong>
            <span>عدد البراندات</span>
          </div>

          <div class="stat">
            <strong id="statBrandTypes">0</strong>
            <span>أنواع البراند</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="footer-note">✅ تم تسجيل الدخول وتحميل البيانات من Firebase بنجاح</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.appspot.com",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);

    const state = {
      branches: [],
      technicians: [],
      visits: [],
      checklists: [],
      brands: []
    };

    let unsubscribeFns = [];

    function clearListeners() {
      unsubscribeFns.forEach((fn) => {
        if (typeof fn === 'function') fn();
      });
      unsubscribeFns = [];
    }

    function normalizeStatus(value) {
      const s = String(value ?? '').trim().toLowerCase();

      if (['completed', 'complete', 'done', 'closed', 'مكتمل'].includes(s)) {
        return 'completed';
      }

      if (['pending', 'open', 'in progress', 'معلق', 'معلّق'].includes(s)) {
        return 'pending';
      }

      if (['cancelled', 'canceled', 'ملغي', 'ملغى'].includes(s)) {
        return 'cancelled';
      }

      return s;
    }

    function renderStats() {
      $('statBranches').textContent = state.branches.length;
      $('statTechnicians').textContent = state.technicians.length;
      $('statVisits').textContent = state.visits.length;
      $('statChecklists').textContent = state.checklists.length;

      const completed = state.visits.filter((v) => {
        const status = normalizeStatus(v.status);
        return status === 'completed' || v.checklistCompleted === true;
      }).length;

      const pending = state.visits.filter((v) => {
        const status = normalizeStatus(v.status);

        if (status === 'pending') return true;

        if (
          status !== 'completed' &&
          status !== 'cancelled' &&
          v.checklistCompleted !== true
        ) {
          return true;
        }

        return false;
      }).length;

      const visitedTechs = new Set(
        state.visits
          .map((v) => v.technicianDocId || v.technicianId || v.technicianEmail)
          .filter(Boolean)
      );

      const brands = new Set(
        state.visits
          .map((v) => String(v.brand ?? v.brandName ?? '').trim())
          .filter(Boolean)
      );

      const brandTypes = new Set(
        [
          ...state.visits.map((v) => v.brandType ?? v.brand_type ?? v.type ?? ''),
          ...state.brands.map((b) => b.brandType ?? b.brand_type ?? b.type ?? '')
        ]
          .map((x) => String(x).trim())
          .filter(Boolean)
      );

      $('statCompletedVisits').textContent = completed;
      $('statPendingVisits').textContent = pending;
      $('statVisitedTechnicians').textContent = visitedTechs.size;
      $('statBrands').textContent = brands.size;
      $('statBrandTypes').textContent = brandTypes.size;
    }

    $('loginBtn').onclick = async () => {
      $('loginMsg').textContent = '';

      try {
        await signInWithEmailAndPassword(
          auth,
          $('loginEmail').value.trim(),
          $('loginPassword').value
        );
      } catch (err) {
        $('loginMsg').textContent = err.message;
      }
    };

    $('logoutBtn').onclick = async () => {
      clearListeners();
      await signOut(auth);
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        $('loginBox').classList.add('hidden');
        $('app').classList.remove('hidden');

        clearListeners();
        startListeners();
      } else {
        clearListeners();
        $('loginBox').classList.remove('hidden');
        $('app').classList.add('hidden');
      }
    });

    function startListeners() {
      unsubscribeFns.push(
        onSnapshot(collection(db, 'branches'), (snapshot) => {
          state.branches = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderStats();
        })
      );

      unsubscribeFns.push(
        onSnapshot(
          query(collection(db, 'technicians'), orderBy('name')),
          (snapshot) => {
            state.technicians = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderStats();
          }
        )
      );

      unsubscribeFns.push(
        onSnapshot(
          query(collection(db, 'siteVisits'), orderBy('date', 'desc')),
          (snapshot) => {
            state.visits = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderStats();
          }
        )
      );

      unsubscribeFns.push(
        onSnapshot(
          query(collection(db, 'branch_checklists'), orderBy('visitDate', 'desc')),
          (snapshot) => {
            state.checklists = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderStats();
          }
        )
      );

      unsubscribeFns.push(
        onSnapshot(collection(db, 'brand_assets'), (snapshot) => {
          state.brands = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderStats();
        })
      );
    }
  </script>
</body>
</html>
