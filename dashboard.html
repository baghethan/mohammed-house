<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --primary: #0d4b73; --bg: #ffffff; }
        
        /* منع التمرير المزدوج وإزالة الفراغات */
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg);
            box-sizing: border-box;
        }

        .header-banner {
            background: linear-gradient(135deg, #0d4b73, #0a3b5a);
            color: white; padding: 25px; border-radius: 15px;
            margin-bottom: 25px; position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-banner h1 { margin: 0; font-size: 22px; }
        .header-banner p { margin: 5px 0 0; opacity: 0.8; font-size: 14px; }

        .stats-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: #f8fafc; border: 1px solid #e2e8f0;
            padding: 20px; border-radius: 12px; text-align: center;
            transition: 0.2s;
        }
        .card:hover { border-color: var(--primary); background: #f0f7ff; }
        .card h3 { margin: 0; font-size: 13px; color: #64748b; text-transform: uppercase; }
        .card .value { font-size: 32px; font-weight: 800; color: var(--primary); margin: 10px 0; }
        .card .status { font-size: 11px; font-weight: bold; color: #22c55e; background: #f0fdf4; padding: 4px 10px; border-radius: 20px; }
    </style>
</head>
<body>

    <div class="header-banner">
        <h1 id="welcomeTitle">مرحباً بك في لوحة تحكم المجدوعي</h1>
        <p>متابعة أداء الفروع والأنظمة بشكل لحظي ومباشر.</p>
    </div>

    <div class="stats-grid">
        <div class="card">
            <h3>إجمالي الفروع</h3>
            <div class="value" id="bCount">0</div>
            <span class="status">متصل الآن</span>
        </div>
        <div class="card">
            <h3>طلبات الإجازة</h3>
            <div class="value" id="hCount">0</div>
            <span class="status" style="color:#f59e0b; background:#fffbeb;">انتظار المراجعة</span>
        </div>
        <div class="card">
            <h3>الفنيين</h3>
            <div class="value" id="tCount">0</div>
            <span class="status">نشط</span>
        </div>
    </div>

    <script type="module">
        const db = window.parent.appDb;
        const user = window.parent.currentUserData;

        if(user) document.getElementById('welcomeTitle').innerText = `أهلاً بك، ${user.name}`;

        async function updateStats() {
            try {
                const bSnap = await db.collection('branches').get();
                document.getElementById('bCount').innerText = bSnap.size;

                const hSnap = await db.collection('schedule').where('status', '==', 'pending').get();
                document.getElementById('hCount').innerText = hSnap.size;

                const tSnap = await db.collection('technicians').get();
                document.getElementById('tCount').innerText = tSnap.size;
            } catch(e) { console.log("Stats error:", e); }
        }

        updateStats();
    </script>
</body>
</html>
