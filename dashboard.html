<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>IT Analytics Ultimate v8.7.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .card-shadow { box-shadow: 0 25px 50px -12px rgba(0, 30, 64, 0.08); }
        .exclude-from-capture { transition: opacity 0.3s ease; }
        .stat-huge { font-size: 6rem; font-weight: 900; color: #0d4b73; line-height: 1; letter-spacing: -3px; }
        .stat-pct { font-size: 1.8rem; font-weight: 900; color: #10b981; margin-top: 10px; }
        .custom-checkbox { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); appearance: none; cursor: pointer; position: relative; }
        .custom-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        .custom-checkbox:checked::after { content: '✓'; position: absolute; color: white; font-size: 10px; top: -2px; left: 1px; }
        select { background: rgba(255,255,255,0.1) !important; color: white !important; border: 1px solid rgba(255,255,255,0.2) !important; border-radius: 12px; padding: 6px 30px 6px 12px; font-size: 11px; font-weight: 800; cursor: pointer; }
        select option { background: #001e40; color: white; }
    </style>
</head>
<body class="p-4 lg:p-8">

    <div class="max-w-[1600px] mx-auto mb-8 exclude-from-capture">
        <div class="bg-[#001e40] text-white p-8 rounded-[45px] shadow-2xl border-b-8 border-blue-900">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-4">
                    <div class="bg-white/10 p-3 rounded-2xl text-2xl">⚙️</div>
                    <div>
                        <h2 class="text-xl font-black italic">IT DASHBOARD MASTER v8.7.0</h2>
                        <p class="text-[9px] font-bold opacity-50 uppercase tracking-widest">Multi-View Options Enabled</p>
                    </div>
                </div>
                <div id="liveClock" class="text-xl font-black text-green-400 font-mono">00:00:00</div>
            </div>

            <div id="configGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            
            <div class="mt-8 pt-6 border-t border-white/5 flex justify-between items-center">
                <div class="flex items-center gap-4 text-[10px] font-black uppercase text-blue-300">
                    <span>Database: Connected ✅</span>
                    <span>Options: Full Visuals Active</span>
                </div>
                <button onclick="window.renderCharts()" class="bg-[#10b981] hover:bg-green-600 text-white px-12 py-3 rounded-2xl transition shadow-lg font-black text-xs">تحديث كافة الشارتات والبيانات 🔃</button>
            </div>
        </div>
    </div>

    <div id="captureArea" class="max-w-[1600px] mx-auto space-y-8 bg-[#f1f5f9] p-12 rounded-[70px]">
        <header class="flex flex-wrap items-center justify-between gap-6 px-4">
            <div class="flex items-center gap-5">
                <img src="https://www.almajdouie.com/assets/images/logo.png" class="h-12 object-contain">
                <h1 class="text-2xl font-black text-[#0d4b73] border-r-4 border-blue-900 pr-4 uppercase tracking-tighter">IT Assessment Report</h1>
            </div>
            
            <div class="flex items-center gap-4 exclude-from-capture">
                <div class="bg-white px-5 py-2 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <input type="date" id="dateFrom" onchange="window.filterData()" class="border-none text-xs font-bold text-[#0d4b73]">
                    <span class="text-[10px] font-black text-slate-400 uppercase">To</span>
                    <input type="date" id="dateTo" onchange="window.filterData()" class="border-none text-xs font-bold text-[#0d4b73]">
                </div>
                <button onclick="window.copyFullDashboard()" class="bg-[#0d4b73] text-white px-8 py-3 rounded-2xl text-sm font-black shadow-xl">نسخ التقرير 📷</button>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-8 items-stretch">
            <div class="col-span-12 lg:col-span-4 bg-white rounded-[55px] p-12 card-shadow border border-slate-50 flex flex-col justify-center text-center">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Total Execution | إجمالي الزيارات</h2>
                <span class="text-9xl font-black text-[#0d4b73] leading-none tracking-tighter" id="totalVisits">0</span>
            </div>
            <div id="sideBrandList" class="col-span-12 lg:col-span-8 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10" id="reportsGrid"></div>
    </div>

<script>
(function(){
    const $ = id => document.getElementById(id);
    let charts = {}, state = { allVisits: [], filteredVisits: [], brands: [] };

    setInterval(() => { $('liveClock').innerText = new Date().toLocaleTimeString('en-GB', { hour12: false }); }, 1000);

    // 🕵️ ماب الأقسام والبنود مع منطق النجاح المتكامل 🕵️
    const SCHEMA = {
        hardware: {
            title: "Hardware Assessment", color: "#3b82f6",
            items: {
                "8LQ9F3Rj4MsNDkTbO5Pi": { label: "PCs Condition", opts: ["fully_functioning", "requires_service"], ok: ["fully_functioning"] },
                "EeypXJo6RgtxIhcVVfzk": { label: "Printers Condition", opts: ["fully_functioning", "requires_service"], ok: ["fully_functioning"] },
                "9EozMBKysmOoajPkgUTh": { label: "Unified Communication", opts: ["fully_functioning", "requires_service"], ok: ["fully_functioning"] },
                "unused_damaged": { label: "Unused/Damaged Assets", opts: ["yes", "no"], ok: ["no"] }
            }
        },
        network: {
            title: "Network Infrastructure", color: "#10b981",
            items: {
                "BcjdipZxDmVgodHk9t1B": { label: "Cabinets Condition", opts: ["in_shape", "requires_arrangement"], ok: ["in_shape"] },
                "E8Gvjsh8fJ0rkZX7PPaK": { label: "Upload 4-6 Mbps", opts: ["above_the_range", "within_the_range", "below_the_range"], ok: ["above_the_range", "within_the_range"] },
                "low_current": { label: "Low Current Infra", opts: ["in_shape", "requires_arrangement"], ok: ["in_shape"] },
                "9OHHSM4ossstUSNe2q0S": { label: "Download 6-9 Mbps", opts: ["above_the_range", "within_the_range", "below_the_range"], ok: ["above_the_range", "within_the_range"] },
                "room_temp": { label: "Server Room Temp", opts: ["above_the_range", "within_the_range", "below_the_range"], ok: ["within_the_range"] },
                "ups_status": { label: "UPS Status", opts: ["fully_functioning", "requires_service"], ok: ["fully_functioning"] }
            }
        },
        software: {
            title: "Software & Systems", color: "#f59e0b",
            items: {
                "6fx4HNunJZRyPziv5r02": { label: "OS Up to Date", opts: ["yes", "no"], ok: ["yes"] },
                "cleanup": { label: "Cleanup Unwanted Apps", opts: ["yes", "no"], ok: ["yes"] },
                "0NQrLQvsNNYgd0Iyy6by": { label: "OneDrive Backup", opts: ["yes", "no", "partially"], ok: ["yes", "partially"] },
                "portals": { label: "Customer Portals", opts: ["yes", "no", "partially"], ok: ["yes", "partially"] },
                "erp_apps": { label: "ERP Applications", opts: ["yes", "no", "requires_maintenance"], ok: ["yes"] },
                "L0V0F4wSuQe7ukfLoPjG": { label: "Training Requirement", isMulti: true, opts: ["Customer Facing Portals", "ERP Functions", "Business Solutions", "Service Desk & End User Support", "IT Soft Skills", "No Requirement for IT Training", "Other"] }
            }
        },
        systems: {
            title: "Systems Assessment", color: "#0d4b73",
            items: { "EcfiAfRlykxLot8a913E": { label: "Upgrade Windows_11", opts: ["yes", "no", "fully_functioning"], ok: ["yes", "fully_functioning"], isSum: true } }
        }
    };

    function boot(){
        const db = window.parent.appDb;
        if (!db) { setTimeout(boot, 1000); return; }

        // توليد لوحة التحكم مع تفعيل كافة خيارات العرض
        $('configGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white/5 p-5 rounded-[30px] border border-white/10">
                <h3 class="text-[10px] font-black text-blue-300 uppercase mb-4 tracking-tighter">${SCHEMA[key].title}</h3>
                <div class="mb-4">
                    <p class="text-[8px] opacity-40 mb-1 font-bold">نوع العرض / View Type:</p>
                    <select id="view-${key}" class="w-full" onchange="window.renderCharts()">
                        <option value="bar">📊 توزيع الأعداد (Bar Chart)</option>
                        <option value="doughnut">🍩 دونات (Doughnut)</option>
                        <option value="stats">🔢 أرقام (Stats)</option>
                    </select>
                </div>
                <div class="space-y-1.5 max-h-[80px] overflow-y-auto custom-scroll">
                    ${Object.keys(SCHEMA[key].items).map(fId => `<label class="flex items-center gap-2 cursor-pointer opacity-70"><input type="checkbox" value="${fId}" data-cat="${key}" checked class="custom-checkbox" onchange="window.renderCharts()"><span class="text-[9px] font-black truncate">${SCHEMA[key].items[fId].label}</span></label>`).join('')}
                </div>
            </div>`).join('');

        // توليد كروت التقارير
        $('reportsGrid').innerHTML = Object.keys(SCHEMA).map(key => `
            <div class="bg-white rounded-[55px] p-10 card-shadow min-h-[480px] flex flex-col">
                <h3 class="text-sm font-black text-[#0d4b73] mb-8 uppercase border-b border-slate-50 pb-4">${SCHEMA[key].title}</h3>
                <div class="flex-1 relative flex flex-col items-center justify-center">
                    <canvas id="chart-${key}"></canvas>
                    <div id="stats-${key}" class="hidden text-center">
                        <div class="stat-huge" id="val-${key}">0</div>
                        <div class="stat-pct" id="pct-${key}">0%</div>
                        <p class="text-[10px] font-bold text-slate-400 mt-2 uppercase tracking-widest">Compliance Rate</p>
                    </div>
                </div>
            </div>`).join('');

        db.collection('brand_assets').onSnapshot(snap => { state.brands = snap.docs.map(d => d.data()); window.updateUI(); });
        db.collection('branch_checklists').onSnapshot(snap => { state.allVisits = snap.docs.map(d => d.data()); window.filterData(); });
    }

    window.filterData = function() {
        const from = $('dateFrom').value, to = $('dateTo').value;
        const dFrom = from ? new Date(from).setHours(0,0,0,0) : 0;
        const dTo = to ? new Date(to).setHours(23,59,59,999) : Infinity;
        state.filteredVisits = state.allVisits.filter(v => {
            const vTime = v.timestamp?.toDate().getTime() || 0;
            return vTime >= dFrom && vTime <= dTo;
        });
        $('totalVisits').textContent = state.filteredVisits.length;
        window.updateUI();
    }

    window.updateUI = function() {
        const counts = {}; state.filteredVisits.forEach(v => { const b = v.brand || 'Other'; counts[b] = (counts[b] || 0) + 1; });
        const activeBrands = state.brands.filter(b => (counts[b.brand] || 0) > 0);
        $('sideBrandList').innerHTML = activeBrands.map(b => `<div class="bg-white rounded-[35px] p-8 shadow-sm border border-slate-50 flex items-center justify-between"><span class="text-7xl font-black text-[#0d4b73]">${counts[b.brand]}</span><div class="flex flex-col items-center gap-1"><img src="${b.logoData || b.logoUrl}" class="w-16 h-10 object-contain"><span class="text-[10px] font-black text-slate-400 uppercase">${b.brand}</span></div></div>`).join('');
        window.renderCharts();
    }

    window.renderCharts = function() {
        Object.keys(SCHEMA).forEach(catKey => {
            const viewType = $(`view-${catKey}`).value;
            const selectedFields = Array.from(document.querySelectorAll(`input[data-cat="${catKey}"]:checked`)).map(i => i.value);
            
            let labels = [], values = [], okCount = 0, totalCount = 0;

            selectedFields.forEach(fId => {
                const config = SCHEMA[catKey].items[fId];
                if (config.isMulti) {
                    config.opts.forEach(opt => {
                        let c = 0;
                        state.filteredVisits.forEach(v => { if (Array.isArray(v.dynamicAnswers?.[fId]) && v.dynamicAnswers[fId].includes(opt)) c++; });
                        labels.push(opt); values.push(c); okCount += c;
                    });
                } else {
                    config.opts.forEach(opt => {
                        let c = 0;
                        state.filteredVisits.forEach(v => { if (v.dynamicAnswers?.[fId] === opt) c++; });
                        if (viewType === 'bar') { labels.push(`${config.label} (${opt.replace(/_/g,' ')})`); values.push(c); }
                        if (config.ok.includes(opt)) okCount += c;
                    });
                    totalCount += state.filteredVisits.length;
                }
            });

            const pct = totalCount > 0 ? Math.round((okCount / totalCount) * 100) : 0;
            
            $(`chart-${catKey}`).style.display = (viewType === 'stats') ? 'none' : 'block';
            $(`stats-${catKey}`).style.display = (viewType === 'stats') ? 'block' : 'none';

            if (viewType === 'stats') {
                $(`val-${catKey}`).innerText = okCount;
                $(`pct-${catKey}`).innerText = pct + "%";
            } else {
                if (charts[catKey]) charts[catKey].destroy();
                charts[catKey] = new Chart($(`chart-${catKey}`), {
                    type: (viewType === 'doughnut' ? 'doughnut' : 'bar'),
                    data: {
                        labels: (viewType === 'doughnut' ? ['مكتمل', 'يطلب إجراء'] : labels),
                        datasets: [{ 
                            data: (viewType === 'doughnut' ? [pct, 100 - pct] : values), 
                            backgroundColor: (viewType === 'doughnut' ? [SCHEMA[catKey].color, '#eff6ff'] : SCHEMA[catKey].color), 
                            borderRadius: 15, barThickness: 15 
                        }]
                    },
                    options: {
                        indexAxis: (viewType === 'bar' ? 'y' : 'x'), maintainAspectRatio: false,
                        plugins: { legend: { display: (viewType === 'doughnut') } },
                        scales: viewType === 'bar' ? { x: { grid: { display: false } }, y: { grid: { display: false }, ticks: { font: { weight: 'bold', size: 9 }, color: '#0d4b73' } } } : { display: false }
                    }
                });
            }
        });
    }

    window.copyFullDashboard = async function() {
        const excluded = document.querySelectorAll('.exclude-from-capture');
        excluded.forEach(el => el.style.opacity = '0');
        const canvas = await html2canvas($('captureArea'), { backgroundColor: '#f1f5f9', scale: 2, useCORS: true });
        excluded.forEach(el => el.style.opacity = '1');
        canvas.toBlob(async (blob) => { await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); alert("تم النسخ بنجاح ✅"); });
    }
    boot();
})();
</script>
</body>
</html>
