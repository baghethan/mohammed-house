<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الفروع | المجدوعي للسيارات</title>
    <style>
        :root {
            --primary: #0d4b73;
            --secondary: #6e8192;
            --success: #2f9e66;
            --danger: #d64545;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
        }
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg); 
            color: #1e293b;
            padding: 20px;
        }

        /* تنسيق البطاقات الجمالي */
        .card {
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .card-header {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body { padding: 20px; }

        /* تنظيم الحقول في شبكة (Grid) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 13px; font-weight: 600; color: var(--secondary); }
        .field input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }
        .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13, 75, 115, 0.1); }

        /* الأزرار */
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* تنسيق الجدول */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f1f5f9; padding: 12px; text-align: right; font-size: 13px; color: var(--secondary); }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tr:hover { background: #f8fafc; }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
            background: white;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <span>إدارة الفروع واستيراد البيانات</span>
            <div style="font-size: 11px; font-weight: normal;">المجدوعي للسيارات v1.2.5</div>
        </div>
        <div class="card-body">
            <div style="background: #f0f7ff; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 1px dashed #0d4b73;">
                <label style="font-weight: bold; display: block; margin-bottom: 10px;">استيراد من ملف Excel:</label>
                <div class="btn-group">
                    <input type="file" id="excelFile" accept=".xlsx, .xls" style="font-size: 12px;">
                    <button class="btn btn-primary" onclick="importExcel()">رفع وتحديث القائمة</button>
                    <button class="btn btn-success" onclick="exportExcel()">تصدير Excel الحالي</button>
                </div>
            </div>

            <div class="grid">
                <div class="field"><label>كود الفرع (ID)</label><input id="bId"></div>
                <div class="field"><label>اسم الفرع</label><input id="bName"></div>
                <div class="field"><label>العلامة التجارية</label><input id="bBrand"></div>
                <div class="field"><label>المنطقة</label><input id="bRegion"></div>
                <div class="field"><label>المدينة</label><input id="bCity"></div>
                <div class="field"><label>الموقع</label><input id="bLoc"></div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveBranch()">حفظ البيانات</button>
                <button class="btn btn-danger" onclick="clearForm()">تنظيف الحقول</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header" style="background: #334155;">الفروع المسجلة بالنظام</div>
        <div class="card-body">
            <input type="text" class="search-box" id="searchInput" placeholder="ابحث عن فرع، مدينة، أو منطقة..." oninput="filterTable()">
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>كود الفرع</th>
                            <th>اسم الفرع</th>
                            <th>الماركة</th>
                            <th>المنطقة/المدينة</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="branchesBody">
                        <tr><td colspan="5" style="text-align: center;">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module">
        // الارتباط بالصفحة الرئيسية (Master Page)
        const db = window.parent.appDb;

        // وظيفة جلب البيانات وعرضها في الجدول
        async function loadBranches() {
            db.collection('branches').orderBy('branchName').onSnapshot(snap => {
                const tbody = document.getElementById('branchesBody');
                tbody.innerHTML = '';
                snap.forEach(doc => {
                    const b = doc.data();
                    tbody.innerHTML += `
                        <tr>
                            <td>${doc.id}</td>
                            <td><b>${b.branchName}</b></td>
                            <td>${b.brand}</td>
                            <td>${b.region} - ${b.city}</td>
                            <td>
                                <button onclick="deleteBranch('${doc.id}')" style="color:red; border:none; background:none; cursor:pointer;">حذف</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        // حفظ فرع يدوي
        window.saveBranch = async () => {
            const id = document.getElementById('bId').value;
            if(!id) return alert("يرجى إدخال كود الفرع");
            
            await db.collection('branches').doc(id).set({
                branchName: document.getElementById('bName').value,
                brand: document.getElementById('bBrand').value,
                region: document.getElementById('bRegion').value,
                city: document.getElementById('bCity').value,
                location: document.getElementById('bLoc').value,
                updatedAt: new Date()
            }, { merge: true });
            alert("تم الحفظ بنجاح");
            clearForm();
        };

        window.clearForm = () => {
            ['bId','bName','bBrand','bRegion','bCity','bLoc'].forEach(id => document.getElementById(id).value = '');
        };

        window.deleteBranch = async (id) => {
            if(confirm("هل أنت متأكد من حذف هذا الفرع؟")) {
                await db.collection('branches').doc(id).delete();
            }
        };

        loadBranches();
    </script>
</body>
</html>
