<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMC IT Vacation Portal</title>
  <style>
    :root{--primary:#0d4b73;--dark:#0d2149;--line:#e2e8f0;--bg:#f1f5f9;--shadow:0 10px 30px rgba(0,0,0,.12)}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden;color:#0f172a}
    header{background:var(--dark);color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .brand img{height:34px;background:#fff;border-radius:4px;object-fit:contain}
    .title{font-weight:900;letter-spacing:.9px;text-transform:uppercase;text-align:center;flex:1}
    .mode{background:#16a34a;color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;white-space:nowrap}
    nav{background:#fff;display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
    button.tab{padding:16px 28px;border:0;background:#fff;cursor:pointer;font-weight:900;color:#64748b;border-bottom:4px solid transparent;font-family:inherit;font-size:15px;white-space:nowrap}
    button.tab.active{color:#003f65;border-bottom-color:#003f65;background:#f8fafc}
    main{flex:1;padding:12px;min-height:0}
    .framebox{width:100%;height:100%;background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border:1px solid #e5e7eb}
    iframe{width:100%;height:100%;border:0;background:#fff}
    @media(max-width:720px){header{padding:10px}.title{font-size:13px}.mode{display:none}button.tab{padding:14px 18px;font-size:13px}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><img src="LOGO-almajdouie.png" alt="Almajdouie"><strong>MMC IT</strong></div>
    <div class="title">MMC IT Vacation Portal</div>
    <div class="mode">NO FIREBASE</div>
  </header>
  <nav>
    <button class="tab active" data-file="dashboard-plan-Vacation-MMC-IT.html">Vacation Dashboard</button>
    <button class="tab" data-file="plan-Vacation-MMC-IT.html">Vacation Plan</button>
  </nav>
  <main><div class="framebox"><iframe id="contentFrame" src="dashboard-plan-Vacation-MMC-IT.html"></iframe></div></main>
  <script>
    const frame = document.getElementById('contentFrame');
    document.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        frame.src = btn.dataset.file;
      });
    });
  </script>
</body>
</html>
