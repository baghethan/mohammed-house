<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-Majdouie Motors | MMC IT Service Delivery</title>
    <style>
        :root { 
            --primary: #0d4b73; --dark: #0d2149; --new-update: #d64545; 
            --shadow: 0 18px 50px rgba(13, 33, 73, 0.16);
        }
        
        body { 
            margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, rgba(12, 31, 73, 0.15), rgba(255, 255, 255, 0.25)), 
                        url('image_dba186.png') center/cover fixed no-repeat; 
            height: 100vh; display: flex; flex-direction: column;
        }

        header { 
            background: rgba(13, 33, 73, 0.98); backdrop-filter: blur(10px); color: white; 
            padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10; 
        }

        .main-logo { height: 50px; object-fit: contain; }
        @keyframes textPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
        .pulse-text { animation: textPulse 2.5s infinite ease-in-out; }

        .nav-tabs { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); display: flex; overflow-x: auto; z-index: 9; }
        
        .tab { 
            padding: 12px 25px; border: none; background: none; cursor: pointer; 
            color: #475569; border-bottom: 3px solid transparent; transition: 0.3s; 
            display: flex; flex-direction: column; align-items: center; min-width: 140px;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: rgba(255, 255, 255, 0.6); }

        .badge-new {
            background: var(--new-update); color: white; font-size: 9px; padding: 2px 6px;
            border-radius: 4px; margin-top: 3px; font-weight: 900;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red { 0%, 100% { transform: scale(0.95); } 50% { transform: scale(1); } }

        .sub-nav-tabs { background: rgba(241, 245, 249, 0.95); display: flex; padding: 8px 20px; gap: 12px; overflow-x: auto; }

        .sub-item {
            padding: 8px 16px; font-size: 13px; font-weight: 700; color: #475569;
            cursor: pointer; border-radius: 8px; background: #fff; border: 1px solid #e2e8f0;
            display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: 0.2s;
        }
        .sub-item.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .sub-item.is-new { border: 2px solid var(--new-update); background: #fff5f5; }

        .main-content { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow: hidden; }
        #viewContainer { flex: 1; background: rgba(255, 255, 255, 0.98); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="LOGO-almajdouie.png" class="main-logo" alt="MMC Logo" />
            <div id="userDisplay" class="pulse-text" style="font-size: 13px; border-inline-start: 1px solid rgba(255,255,255,0.3); padding-inline-start: 15px;"></div>
        </div>
        <div id="masterVersion" class="pulse-text" style="font-weight: 900; font-size: 18px; letter-spacing: 0.2px;">
            AL-Majdouie Motors (MMC IT) Service Delivery
        </div>
        <!-- زر الخروج المحدث -->
        <button onclick="handleLogout()" style="background:#fee2e2; color:#b91c1c; border:none; padding:8px 20px; border-radius:12px; cursor:pointer; font-weight:800;">Logout</button>
    </header>

    <nav class="nav-tabs" id="mainTabsBox"></nav>
    <nav class="sub-nav-tabs hidden" id="subTabsBox"></nav>
    
    <main class="main-content">
        <div id="viewContainer"><iframe id="contentFrame"></iframe></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        let currentLang = 'en';
        let activeMainTab = 'diagnostics';

        const hierarchy = {
            'diagnostics': { en: 'Diagnostics', file: 'Diagnostics.html', ver: 'v2.1.16', date: '2026-04-30' },
            'schedule': { 
                en: 'Schedule', isParent: true, ver: 'v10.10.0', date: '2026-05-03',
                children: [
                    { id: 'dashVac', en: '📊 Dashboard', file: 'dashboard-plan-Vacation.html', ver: 'v1.0.0', date: '2026-05-03' },
                    { id: 'weeklySch', en: '🗓️ Schedule', file: 'Weekly-Schedule.html', ver: 'v1.0.0', date: '2026-05-03' },
                    { id: 'empSch', en: '👥 employee', file: 'employee-Schedule.html', ver: 'v1.0.0', date: '2026-05-03' },
                    { id: 'annLeave', en: 'Annual-Leave', file: 'Annual-Leave.html', ver: 'v1.0.0', date: '2026-05-03' },
                    { id: 'planVac', en: '📅 plan-Vacation', file: 'plan-Vacation.html', ver: 'v1.0.0', date: '2026-05-03' },
                    { id: 'shiftSet', en: '⏰ Shift-Settings', file: 'Shift-Settings.html', ver: 'v1.0.0', date: '2026-05-03' }
                ]
            },
            'site-visit': { 
                en: 'Site-Visit', isParent: true, ver: 'v1.6.3', date: '2026-04-30',
                children: [
                    { id: 'dashboard', en: 'Dashboard', file: 'dashboard.html', ver: 'v1.0.2', date: '2026-04-20' },
                    { id: 'checklist', en: 'Checklist', file: 'check-list.html', ver: 'v1.2.0', date: '2026-04-30' },
                    { id: 'allDevices', en: 'Full Device Management', file: 'all-devices.html', ver: 'v3.0.1', date: '2026-04-30' },
                    { id: 'upgradeWindows', en: 'Upgrade Windows', file: 'upgrade-windows.html', ver: 'v2.1.16', date: '2026-04-30' },
                    { id: 'checklistAdmin', en: 'Checklist Admin', file: 'dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html', ver: 'v2.1.6', date: '2026-04-30' },
                    { id: 'reports', en: 'Reports windows', file: 'windows-report.html', ver: 'v1.0.5', date: '2026-04-22' }
                ]
            },
            'permissions': {
                en: 'Permissions', isParent: true, ver: 'v1.0.0', date: '2026-05-03',
                children: [
                    { id: 'permSite', en: 'Permissions-Site-Visit', file: 'permissions.html', ver: 'v1.0.0', date: '2026-05-03' },
                    { id: 'permSch', en: 'Permissions-Schedule', file: 'Permissions1.htm', ver: 'v1.0.0', date: '2026-05-03' }
                ]
            }
        };

        const firebaseConfig = { apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs", authDomain: "baghethan-ba325.firebaseapp.com", projectId: "baghethan-ba325", storageBucket: "baghethan-ba325.firebasestorage.app", messagingSenderId: "944819735112", appId: "1:944819735112:web:07315600da39377320667d" };
        firebase.initializeApp(firebaseConfig);
        window.appAuth = firebase.auth(); window.appDb = firebase.firestore();

        // تحديث مراقب حالة الدخول
        window.appAuth.onAuthStateChanged(async (user) => { 
            if (user) { 
                const snap = await window.appDb.collection('app_users').doc(user.uid).get(); 
                if (snap.exists) { 
                    window.currentUserData = snap.data(); 
                    window.currentUserData.uid = user.uid; 
                    document.getElementById('userDisplay').innerHTML = `Welcome: <b>${window.currentUserData.name}</b>`;
                    renderMainTabs();
                    updateHeaderVersion();
                    document.getElementById('contentFrame').src = `Diagnostics.html?lang=en&auth=active&user=${user.uid}`;
                } 
            } else {
                // إذا تم الخروج بنجاح، يوجه المستخدم لصفحة الدخول الأساسية (تأكد من اسم الملف لديك)
                window.location.href = "login.html"; 
            }
        });

        // دالة تسجيل الخروج الفعلية
        async function handleLogout() {
            if(confirm("Are you sure you want to logout?")) {
                await window.appAuth.signOut();
            }
        }

        function isNew(dateStr) {
            const upDate = new Date(dateStr);
            const now = new Date();
            return (now - upDate) / (1000 * 60 * 60) <= 48;
        }

        function updateHeaderVersion() {
            const baseTitle = "AL-Majdouie Motors (MMC IT) Service Delivery";
            document.getElementById('masterVersion').innerText = `${baseTitle} v${hierarchy['site-visit'].ver}`;
        }

        function renderMainTabs() {
            const box = document.getElementById('mainTabsBox');
            box.innerHTML = '';
            Object.entries(hierarchy).forEach(([id, info]) => {
                const b = document.createElement('button');
                b.className = `tab ${activeMainTab === id ? 'active' : ''}`;
                const newTag = isNew(info.date) ? `<span class="badge-new">NEW</span>` : '';
                b.innerHTML = `<span style="font-weight:800">${info.en}</span><span style="font-size:10px">${info.ver}</span>${newTag}`;
                b.onclick = () => {
                    activeMainTab = id; renderMainTabs();
                    if (info.isParent) renderSubTabs(id);
                    else {
                        document.getElementById('subTabsBox').classList.add('hidden');
                        document.getElementById('contentFrame').src = `${info.file}?lang=en&auth=active&user=${window.currentUserData.uid}`;
                    }
                };
                box.appendChild(b);
            });
        }

        function renderSubTabs(parentId) {
            const subBox = document.getElementById('subTabsBox');
            const data = hierarchy[parentId];
            subBox.classList.remove('hidden'); subBox.innerHTML = '';
            data.children.forEach(item => {
                const s = document.createElement('div');
                const isRecentlyUpdated = isNew(item.date);
                s.className = `sub-item ${isRecentlyUpdated ? 'is-new' : ''}`;
                const newTag = isRecentlyUpdated ? `<span class="badge-new" style="margin:0">NEW</span>` : '';
                s.innerHTML = `${item.en} <span style="font-size:10px;opacity:0.6">${item.ver}</span> ${newTag}`;
                s.onclick = () => {
                    document.querySelectorAll('.sub-item').forEach(si => si.classList.remove('active'));
                    s.classList.add('active');
                    document.getElementById('contentFrame').src = `${item.file}?lang=en&auth=active&user=${window.currentUserData.uid}`;
                };
                subBox.appendChild(s);
            });
        }
    </script>
</body>
</html>
