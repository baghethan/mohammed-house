<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة زيارات الفروع والفنيين</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(240,245,250,.95), rgba(240,245,250,.95)),
        url('image_dba186.png') center/cover no-repeat fixed;
    }

    header{
      background:#0d4b73;
      color:#fff;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .header-left img{
      height:40px;
    }

    .app-title{
      font-weight:bold;
    }

    .app-version{
      font-size:11px;
      color:#d0d0d0;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .user-info{
      display:flex;
      align-items:center;
      gap:8px;
      background:rgba(255,255,255,.15);
      padding:4px 10px;
      border-radius:20px;
    }

    .user-info img{
      width:32px;
      height:32px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid rgba(255,255,255,.6);
    }

    .user-name{
      font-size:13px;
      white-space:nowrap;
    }

    .logout-btn{
      background:#d64545;
      color:#fff;
      border:none;
      border-radius:20px;
      padding:6px 14px;
      cursor:pointer;
    }

    nav{
      background:#083c5a;
      display:flex;
      flex-wrap:wrap;
    }

    nav button{
      background:none;
      border:none;
      color:#fff;
      padding:10px 14px;
      cursor:pointer;
      font-size:13px;
    }

    nav button.active{
      background:#0d4b73;
      border-bottom:3px solid #ffd54f;
    }

    #content{
      height:calc(100vh - 110px);
    }

    #content iframe{
      width:100%;
      height:100%;
      border:none;
      background:#fff;
    }
  </style>
</head>
<body>

<!-- ✅ Firebase SDKs (Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- ✅ Firebase Init + Auth Guard -->
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  // ✅ تهيئة آمنة (مرة واحدة فقط)
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();
  const db   = firebase.firestore();

  // ✅ Guard واحد فقط (بدون Loop)
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    try {
      const doc = await db.collection("app_users").doc(user.uid).get();
      if (doc.exists) {
        const data = doc.data();
        document.getElementById("userName").innerText = data.name || user.email;
        document.getElementById("userAvatar").src =
          data.photoURL || data.avatar || "user-avatar.png";
      }
    } catch (e) {
      console.error(e);
    }
  });

  function logout(){
    auth.signOut().then(() => {
      window.location.href = "login.html";
    });
  }
</script>

<header>
  <div class="header-left">
    <img src="LOGO-almajdouie.png" alt="Logo">
    <div>
      <div class="app-title">إدارة زيارات الفروع والفنيين</div>
      <div class="app-version">Shell v1.4 • 2026‑04‑20</div>
    </div>
  </div>

  <div class="header-right">
    <div class="user-info">
      <img id="userAvatar" src="user-avatar.png">
      <div class="user-name" id="userName">...</div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>
