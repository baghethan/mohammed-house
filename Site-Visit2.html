<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Branch Visits System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(240,245,250,.95), rgba(240,245,250,.95)),
        url('image_dba186.png') center/cover no-repeat fixed;
    }
    header{
      background:#0d4b73;
      color:#fff;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .header-left{
      display:flex;
      align-items:center;
      gap:14px;
    }
    .app-title{ font-weight:bold; }
    .header-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .user-name{ font-size:13px; }
    .logout-btn{
      background:#d64545;
      color:#fff;
      border:none;
      border-radius:20px;
      padding:6px 14px;
      cursor:pointer;
      font-size:13px;
    }
    .lang-switch button{
      background:#fff;
      color:#0d4b73;
      border:none;
      border-radius:16px;
      padding:4px 10px;
      cursor:pointer;
      font-weight:bold;
      font-size:12px;
    }
    nav{
      background:#083c5a;
      display:flex;
      flex-wrap:wrap;
    }
    nav button{
      background:none;
      border:none;
      color:#fff;
      padding:10px 14px;
      cursor:pointer;
      font-size:13px;
      display:none; /* ✅ مخفي افتراضيًا */
    }
    nav button.active{
      background:#0d4b73;
      border-bottom:3px solid #ffd54f;
    }
    #content{
      height:calc(100vh - 110px);
    }
    iframe{
      width:100%;
      height:100%;
      border:none;
      background:#fff;
    }
  </style>
</head>

<body>

<!-- ✅ Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* =========================
   Firebase Init
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain: "baghethan-ba325.firebaseapp.com",
  projectId: "baghethan-ba325",
  storageBucket: "baghethan-ba325.firebasestorage.app",
  messagingSenderId: "944819735112",
  appId: "1:944819735112:web:07315600da39377320667d"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db   = firebase.firestore();

/* ✅ تعريض Firebase للصفحات الداخلية */
window.firebase = firebase;
window.appAuth  = auth;
window.appDb    = db;

/* =========================
   الصلاحيات الافتراضية
========================= */
const ROLE_PAGES = {
  admin: [
    "dashboard","checklist","dynamic","visits",
    "branches","technicians","brands","upgrade","permissions"
  ],
  supervisor: [
    "dashboard","checklist","visits","branches","technicians","brands"
  ],
  technician: [
    "dashboard","checklist","visits"
  ],
  user: [
    "dashboard"
  ]
};

/* =========================
   اللغات
========================= */
const LANG = {
  ar: {
    dashboard:"لوحة التحكم",
    checklist:"Check‑List",
    dynamic:"Dynamic Check‑List",
    visits:"الزيارات",
    branches:"الفروع",
    technicians:"الفنيين",
    brands:"البراندات",
    upgrade:"Upgrade Windows",
    permissions:"الصلاحيات"
  },
  en: {
    dashboard:"Dashboard",
    checklist:"Check‑List",
    dynamic:"Dynamic Check‑List",
    visits:"Visits",
    branches:"Branches",
    technicians:"Technicians",
    brands:"Brands",
    upgrade:"Upgrade Windows",
    permissions:"Permissions"
  }
};

function setLang(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang === "ar" ? "rtl" : "ltr";
  localStorage.setItem("appLang", lang);

  document.querySelectorAll("nav button[data-page]").forEach(btn=>{
    btn.textContent = LANG[lang][btn.dataset.page] || btn.dataset.page;
  });

  const frame = document.getElementById("appFrame");
  if (frame && frame.contentWindow){
    frame.contentWindow.postMessage({ type:"LANG_CHANGE", lang }, "*");
  }
}

/* =========================
   التبويبات
========================= */
const pages = {
  dashboard:  "dashboard.html",
  checklist:  "check-list.html",
  dynamic:    "dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html",
  visits:     "visits.html",
  branches:   "branches.html",
  technicians:"technicians.html",
  brands:     "brands.html",
  upgrade:    "upgrade-windows.html",
  permissions:"permissions.html"
};

function loadPage(key, btn){
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  if (btn) btn.classList.add("active");

  if (key === "dynamic"){
    window.location.href = pages[key];
    return;
  }
  document.getElementById("appFrame").src = pages[key];
}

/* =========================
   إظهار التبويبات حسب الصلاحية
========================= */
function applyPagePermissions(profile){
  const role = profile.role || "user";
  const allowed =
    Array.isArray(profile.pages) && profile.pages.length
      ? profile.pages
      : (ROLE_PAGES[role] || []);

  document.querySelectorAll("nav button[data-page]").forEach(btn=>{
    btn.style.display = allowed.includes(btn.dataset.page) ? "" : "none";
  });

  const firstAllowed = document.querySelector("nav button[data-page]:not([style*='display: none'])");
  if (firstAllowed) firstAllowed.click();
}

/* =========================
   Auth Guard
========================= */
auth.onAuthStateChanged(async user=>{
  if (!user){
    window.location.href = "login.html";
    return;
  }

  const snap = await db.collection("app_users").doc(user.uid).get();
  if (snap.exists){
    const profile = snap.data();
    document.getElementById("userName").textContent = profile.name || user.email;
    applyPagePermissions(profile);

    const savedLang = profile.lang || localStorage.getItem("appLang") || "ar";
    setLang(savedLang);
  }
});

function logout(){
  auth.signOut().then(()=>location.href="login.html");
}
</script>

<header>
  <div class="header-left">
    <div class="app-title">Branch Visits System</div>
  </div>
  <div class="header-right">
    <div class="lang-switch">
      <button onclick="setLang('ar')">AR</button>
      <button onclick="setLang('en')">EN</button>
    </div>
    <div class="user-name" id="userName">...</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<nav>
  <button data-page="dashboard" onclick="loadPage('dashboard',this)"></button>
  <button data-page="checklist" onclick="loadPage('checklist',this)"></button>
  <button data-page="dynamic" onclick="loadPage('dynamic',this)"></button>
  <button data-page="visits" onclick="loadPage('visits',this)"></button>
  <button data-page="branches" onclick="loadPage('branches',this)"></button>
  <button data-page="technicians" onclick="loadPage('technicians',this)"></button>
  <button data-page="brands" onclick="loadPage('brands',this)"></button>
  <button data-page="upgrade" onclick="loadPage('upgrade',this)"></button>
  <button data-page="permissions" onclick="loadPage('permissions',this)"></button>
</nav>

<div id="content">
  <iframe id="appFrame"></iframe>
</div>

</body>
</html>
