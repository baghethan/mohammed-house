<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة زيارات الفروع والفنيين</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(240,245,250,.95), rgba(240,245,250,.95)),
        url('image_dba186.png') center/cover no-repeat fixed;
    }

    header{
      background:#0d4b73;
      color:#fff;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .header-left img{
      height:40px;
    }

    .app-title{
      font-weight:bold;
    }

    .app-version{
      font-size:11px;
      color:#d0d0d0;
    }

    .logout-btn{
      background:#d64545;
      color:#fff;
      border:none;
      border-radius:20px;
      padding:6px 14px;
      cursor:pointer;
    }

    nav{
      background:#083c5a;
      display:flex;
      flex-wrap:wrap;
    }

    nav button{
      background:none;
      border:none;
      color:#fff;
      padding:10px 14px;
      cursor:pointer;
      font-size:13px;
    }

    nav button.active{
      background:#0d4b73;
      border-bottom:3px solid #ffd54f;
    }

    #content{
      height:calc(100vh - 110px);
    }

    #content iframe{
      width:100%;
      height:100%;
      border:none;
      background:#fff;
    }
  </style>
</head>
<body>

<!-- ✅ Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<!-- ✅ Firebase Init + Auth Guard -->
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();

  // ✅ Guard الصحيح (بدون Loop)
  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "login.html";
    }
  });

  function logout(){
    auth.signOut().then(() => {
      window.location.href = "login.html";
    });
  }
</script>

<header>
  <div class="header-left">
    <img src="LOGO-almajdouie.png" alt="Logo">
    <div>
      <div class="app-title">إدارة زيارات الفروع والفنيين</div>
      <div class="app-version">Shell v1.1 • 2026‑04‑20</div>
    </div>
  </div>

  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<nav>
  <button class="active" onclick="loadPage('dashboard', this)">Dashboard</button>
  <button onclick="loadPage('checklist', this)">Check‑List</button>
  <button onclick="loadPage('dynamic', this)">Dynamic Check‑List (Admin)</button>
  <button onclick="loadPage('visits', this)">إدخال زيارة</button>
  <button onclick="loadPage('branches', this)">إدارة الفروع</button>
  <button onclick="loadPage('technicians', this)">إدارة الفنيين</button>
  <button onclick="loadPage('brands', this)">البراندات</button>
  <button onclick="loadPage('upgrade', this)">Upgrade Windows</button>
  <button onclick="loadPage('permissions', this)">الصلاحيات</button>
</nav>

<div id="content">
  <iframe id="appFrame" src="dashboard.html"></iframe>
</div>

<script>
  const pages = {
    dashboard: "dashboard.html",
    checklist: "check-list.html",
    dynamic: "dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html",
    visits: "visits.html",
    branches: "branches.html",
    technicians: "technicians.html",
    brands: "brands.html",
    upgrade: "upgrade-windows.html",
    permissions: "permissions.html"
  };

  function loadPage(key, btn){
    if(!pages[key]) return;

    document.querySelectorAll("nav button")
      .forEach(b => b.classList.remove("active"));

    if(btn) btn.classList.add("active");

    // Dynamic صفحة مستقلة
    if(key === "dynamic"){
      window.location.href = pages[key];
      return;
    }

    document.getElementById("appFrame").src = pages[key];
  }
</script>

</body>
</html>
