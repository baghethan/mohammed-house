<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة زيارات الفروع | Almajdouie Motors</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root { --primary: #0d4b73; --bg: #f8fafc; --nav-text: #64748b; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: var(--primary); color: #fff; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .logo { height: 38px; filter: brightness(0) invert(1); }
    .user-area { display: flex; align-items: center; gap: 15px; font-size: 13px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; }

    nav { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 15px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav button { background: none; border: none; padding: 12px 18px; font-size: 13px; cursor: pointer; color: var(--nav-text); border-bottom: 3px solid transparent; transition: 0.2s; white-space: nowrap; font-weight: 500; }
    nav button:hover { color: var(--primary); background: #f1f5f9; }
    nav button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }
    .hidden { display: none !important; }

    main { flex-grow: 1; background: #fff; position: relative; }
    iframe { width: 100%; height: 100%; border: none; display: block; }

    .lang-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; }
    .lang-btn.active { background: #fff; color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="https://www.almajdouie.com/assets/images/logo.png" class="logo" alt="Almajdouie">
    <div>
      <div id="shellTitle" style="font-weight: bold; font-size: 15px;">نظام زيارات الفروع</div>
      <div style="font-size: 10px; opacity: 0.7;">Turbo Edition v2.8.5</div>
    </div>
  </div>

  <div class="user-area">
    <div class="lang-switch">
      <button class="lang-btn" id="btnAr" onclick="setLang('ar')">AR</button>
      <button class="lang-btn" id="btnEn" onclick="setLang('en')">EN</button>
    </div>
    <div style="height: 20px; width: 1px; background: rgba(255,255,255,0.3);"></div>
    <span id="userName">...</span>
    <img id="userAvatar" class="user-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    <button onclick="logout()" style="background: #ef4444; color: #fff; border: none; padding: 4px 12px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold;">خروج</button>
  </div>
</header>

<nav id="mainNav">
  <button data-page="dashboard" onclick="loadPage('dashboard', this)">لوحة البيانات</button>
  <button data-page="checklist" onclick="loadPage('checklist', this)">Check-List</button>
  <button data-page="dynamic" onclick="loadPage('dynamic', this)">نماذج ديناميكية</button>
  <button data-page="visits" onclick="loadPage('visits', this)">الزيارات</button>
  <button data-page="branches" onclick="loadPage('branches', this)">الفروع</button>
  <button data-page="technicians" onclick="loadPage('technicians', this)">الفنيين</button>
  <button data-page="brands" onclick="loadPage('brands', this)">البراندات</button>
  <button data-page="upgrade" onclick="loadPage('upgrade', this)">Windows Upgrade</button>
  <button data-page="permissions" onclick="loadPage('permissions', this)">الصلاحيات</button>
</nav>

<main>
  <iframe id="appFrame" name="appFrame" src=""></iframe>
</main>

<script>
  // 1. إعدادات Firebase الموحدة
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  // 2. التهيئة الذكية - تعريف واحد فقط لمنع خطأ "already declared"
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // تفعيل السرعة القصوى وإزالة تأخير الـ 10 ثوانٍ
  db.settings({ cacheSizeBytes: 1048576, experimentalForceLongPolling: true });
  db.enablePersistence().catch(() => {});

  // تصدير الأدوات لفتحها داخل الـ iframes دون إعادة تحميل
  window.appAuth = auth;
  window.appDb = db;

  // 3. إدارة الصفحات واللغات
  const PAGES = {
    dashboard:  { file: 'dashboard.html', ar: 'لوحة التحكم', en: 'Dashboard' },
    checklist:  { file: 'check-list.html', ar: 'Check-List', en: 'Check-List' },
    dynamic:    { file: 'dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html', ar: 'النماذج الديناميكية', en: 'Dynamic Forms' },
    visits:     { file: 'visits.html', ar: 'الزيارات', en: 'Visits' },
    branches:   { file: 'branches.html', ar: 'إدارة الفروع', en: 'Branches' },
    technicians:{ file: 'technicians.html', ar: 'الفنيين', en: 'Technicians' },
    brands:     { file: 'brands.html', ar: 'البراندات', en: 'Brands' },
    upgrade:    { file: 'upgrade-windows.html', ar: 'ترقية Windows', en: 'Windows Upgrade' },
    permissions:{ file: 'permissions.html', ar: 'الصلاحيات', en: 'Permissions' }
  };

  const ROLE_DEFAULTS = {
    admin: Object.keys(PAGES),
    supervisor: ['dashboard', 'checklist', 'visits', 'branches'],
    technician: ['dashboard', 'checklist'],
    user: ['dashboard']
  };

  const $ = id => document.getElementById(id);
  let currentLang = localStorage.getItem('appLang') || 'ar';

  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('appLang', lang);
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('btnAr').classList.toggle('active', lang === 'ar');
    $('btnEn').classList.toggle('active', lang === 'en');
    $('shellTitle').textContent = lang === 'ar' ? 'نظام إدارة الزيارات' : 'Branch Visits System';
    
    document.querySelectorAll('nav button[data-page]').forEach(btn => {
      btn.textContent = PAGES[btn.dataset.page][lang];
    });
  }

  function loadPage(key, btn) {
    if (!PAGES[key]) return;
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    $('appFrame').src = PAGES[key].file;
  }

  // 4. مراقبة الدخول وتوزيع الصلاحيات
  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'login.html'; return; }
    
    try {
      // قراءة البروفايل (الأولوية للسرعة)
      const snap = await db.collection('app_users').doc(user.uid).get();
      const profile = snap.exists ? snap.data() : { role: 'user' };

      $('userName').textContent = profile.name || user.email;
      if (profile.photoURL) $('userAvatar').src = profile.photoURL;

      const allowed = profile.pages || ROLE_DEFAULTS[profile.role || 'user'];
      
      document.querySelectorAll('nav button[data-page]').forEach(btn => {
        btn.classList.toggle('hidden', !allowed.includes(btn.dataset.page));
      });

      setLang(currentLang);
      
      // فتح أول صفحة مصرح بها تلقائياً
      const defaultPage = allowed.includes('dashboard') ? 'dashboard' : allowed[0];
      const defaultBtn = document.querySelector(`button[data-page="${defaultPage}"]`);
      loadPage(defaultPage, defaultBtn);

    } catch (err) {
      console.error("Auth error:", err);
      loadPage('dashboard', document.querySelector('button[data-page="dashboard"]'));
    }
  });

  window.logout = () => auth.signOut().then(() => location.href = 'login.html');
</script>

</body>
</html>
