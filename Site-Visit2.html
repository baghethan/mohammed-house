<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>إدارة زيارات الفروع والفنيين</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:linear-gradient(rgba(240,245,250,.95), rgba(240,245,250,.95)), url('image_dba186.png') center/cover no-repeat fixed;
    }
    header{
      background:#0d4b73;
      color:#fff;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .header-left{display:flex;align-items:center;gap:14px;min-width:0}
    .header-left img.logo{height:40px;flex:0 0 auto}
    .title-wrap{min-width:0}
    .app-title{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .app-version{font-size:11px;color:#d0d0d0;margin-top:2px}
    .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .user-info{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px}
    .user-info img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.6);background:#fff}
    .user-name{font-size:13px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
    .logout-btn{background:#d64545;color:#fff;border:none;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px}
    .lang-switch{display:flex;gap:6px;align-items:center}
    .lang-switch button{background:#fff;color:#0d4b73;border:none;border-radius:20px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700}
    .lang-switch button.active{background:#ffd54f;color:#083c5a}
    nav{background:#083c5a;display:flex;flex-wrap:wrap;min-height:43px}
    nav button{background:none;border:none;color:#fff;padding:10px 14px;cursor:pointer;font-size:13px;display:inline-block}
    nav button.active{background:#0d4b73;border-bottom:3px solid #ffd54f}
    nav button.tab-hidden{display:none !important}
    #content{height:calc(100vh - 110px)}
    #content iframe{width:100%;height:100%;border:none;background:#fff}
    .status-bar{background:#fff7e6;color:#8a5a00;border-top:1px solid #f5d08a;border-bottom:1px solid #f5d08a;padding:8px 14px;font-size:13px;display:none}
    .status-bar.show{display:block}
    @media (max-width:768px){header{flex-direction:column;align-items:stretch}.header-right{justify-content:space-between}.user-name{max-width:140px}}
  </style>
</head>
<body>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <header>
    <div class="header-left">
      <img class="logo" src="LOGO-almajdouie.png" alt="Almajdouie Logo" />
      <div class="title-wrap">
        <div class="app-title" id="shellTitle">إدارة زيارات الفروع والفنيين</div>
        <div class="app-version" id="shellVersion">Shell v2.0 • 2026‑04‑20 20:42</div>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-switch">
        <button id="btnLangAr" type="button">AR</button>
        <button id="btnLangEn" type="button">EN</button>
      </div>
      <div class="user-info">
        <img id="userAvatar" src="user-avatar.png" alt="User Avatar" />
        <div class="user-name" id="userName">...</div>
      </div>
      <button class="logout-btn" id="logoutBtn" type="button">Logout</button>
    </div>
  </header>

  <div id="statusBar" class="status-bar"></div>

  <nav id="mainNav">
    <button data-page="dashboard" onclick="loadPage('dashboard', this)"></button>
    <button data-page="checklist" onclick="loadPage('checklist', this)"></button>
    <button data-page="dynamic" onclick="loadPage('dynamic', this)"></button>
    <button data-page="visits" onclick="loadPage('visits', this)"></button>
    <button data-page="branches" onclick="loadPage('branches', this)"></button>
    <button data-page="technicians" onclick="loadPage('technicians', this)"></button>
    <button data-page="brands" onclick="loadPage('brands', this)"></button>
    <button data-page="upgrade" onclick="loadPage('upgrade', this)"></button>
    <button data-page="permissions" onclick="loadPage('permissions', this)"></button>
  </nav>

  <div id="content">
    <iframe id="appFrame" src=""></iframe>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    window.firebase = firebase;
    window.appAuth = auth;
    window.appDb = db;

    const pageMeta = {
      dashboard:  { file: 'dashboard.html', label: { ar: 'لوحة التحكم', en: 'Dashboard' } },
      checklist:  { file: 'check-list.html', label: { ar: 'Check‑List', en: 'Check‑List' } },
      dynamic:    { file: 'dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html', label: { ar: 'Dynamic Check‑List', en: 'Dynamic Check‑List (Admin)' } },
      visits:     { file: 'visits.html', label: { ar: 'الزيارات', en: 'Visits' } },
      branches:   { file: 'branches.html', label: { ar: 'إدارة الفروع', en: 'Branches' } },
      technicians:{ file: 'technicians.html', label: { ar: 'إدارة الفنيين', en: 'Technicians' } },
      brands:     { file: 'brands.html', label: { ar: 'البراندات', en: 'Brands' } },
      upgrade:    { file: 'upgrade-windows.html', label: { ar: 'Upgrade Windows', en: 'Upgrade Windows' } },
      permissions:{ file: 'permissions.html', label: { ar: 'الصلاحيات', en: 'Permissions' } }
    };

    const ROLE_PAGES = {
      admin: Object.keys(pageMeta),
      supervisor: ['dashboard','checklist','dynamic','visits','branches','technicians','brands','upgrade','permissions'],
      technician: ['dashboard','checklist','visits'],
      user: ['dashboard']
    };

    const LANG = {
      ar: { shellTitle:'إدارة زيارات الفروع والفنيين', logout:'Logout', noTabs:'لا توجد تبويبات مصرح بها لهذا المستخدم.' },
      en: { shellTitle:'Branch Visits System', logout:'Logout', noTabs:'No tabs are allowed for this user.' }
    };

    let currentLang = localStorage.getItem('appLang') || 'ar';
    let currentAllowedPages = [];
    let currentUserProfile = null;
    let currentUser = null;

    function $(id){ return document.getElementById(id); }
    function showStatus(msg){ const bar = $('statusBar'); bar.textContent = msg || ''; bar.classList.toggle('show', !!msg); }
    function hideStatus(){ showStatus(''); }

    function normalizePageKey(value){
      const v = String(value || '').trim().toLowerCase();
      const aliases = {
        'visit':'visits','visits':'visits','check-list':'checklist','checklist':'checklist','dashboard':'dashboard',
        'dynamicchecklistadmin':'dynamic','dynamic-checklist-admin':'dynamic','dynamic':'dynamic',
        'branches':'branches','technicians':'technicians','brands':'brands','permissions':'permissions',
        'upgradewindows':'upgrade','upgrade-windows':'upgrade','upgrade_windows':'upgrade','upgrade':'upgrade'
      };
      return aliases[v] || v;
    }

    function getAllowedPages(profile){
      const role = String((profile && profile.role) || 'user').trim().toLowerCase();
      const roleDefaults = ROLE_PAGES[role] || ROLE_PAGES.user || ['dashboard'];
      const profilePages = Array.isArray(profile && profile.pages) ? profile.pages.map(normalizePageKey).filter(Boolean) : [];
      const shellPages = Array.isArray(profile && profile.shellPages) ? profile.shellPages.map(normalizePageKey).filter(Boolean) : [];
      const merged = Array.from(new Set([].concat(roleDefaults, profilePages, shellPages))).filter(key => pageMeta[key]);
      return merged.length ? merged : ['dashboard'];
    }

    function setLang(lang, persist){
      currentLang = lang === 'en' ? 'en' : 'ar';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      if (persist !== false) localStorage.setItem('appLang', currentLang);
      $('shellTitle').textContent = LANG[currentLang].shellTitle;
      $('logoutBtn').textContent = LANG[currentLang].logout;
      $('btnLangAr').classList.toggle('active', currentLang === 'ar');
      $('btnLangEn').classList.toggle('active', currentLang === 'en');
      document.querySelectorAll('nav button[data-page]').forEach(btn => {
        const meta = pageMeta[btn.dataset.page];
        btn.textContent = meta ? meta.label[currentLang] : btn.dataset.page;
      });
      const frame = $('appFrame');
      if (frame && frame.contentWindow) frame.contentWindow.postMessage({ type:'LANG_CHANGE', lang: currentLang }, '*');
    }

    async function persistUserLang(lang){
      try {
        if (!currentUser) return;
        const byUid = await db.collection('app_users').doc(currentUser.uid).get();
        if (byUid.exists) {
          await db.collection('app_users').doc(currentUser.uid).set({ lang: lang }, { merge:true });
          return;
        }
        if (currentUser.email) {
          const alt = await db.collection('app_users').where('email', '==', currentUser.email).limit(1).get();
          if (!alt.empty) await alt.docs[0].ref.set({ lang: lang }, { merge:true });
        }
      } catch (e) { console.warn('Unable to persist language:', e); }
    }

    function applyPagePermissions(profile){
      currentAllowedPages = getAllowedPages(profile);
      document.querySelectorAll('nav button[data-page]').forEach(btn => {
        btn.classList.toggle('tab-hidden', !currentAllowedPages.includes(btn.dataset.page));
      });
      if (!currentAllowedPages.length) {
        showStatus(LANG[currentLang].noTabs);
        $('appFrame').src = '';
        return;
      }
      hideStatus();
      const currentSrc = $('appFrame').getAttribute('src') || '';
      const currentKey = Object.keys(pageMeta).find(key => pageMeta[key].file === currentSrc);
      const targetKey = currentAllowedPages.includes(currentKey) ? currentKey : currentAllowedPages[0];
      const targetBtn = document.querySelector('nav button[data-page="' + targetKey + '"]');
      loadPage(targetKey, targetBtn, true);
    }

    function loadPage(key, btn, force){
      if (!pageMeta[key]) { showStatus('Page not mapped: ' + key); return; }
      if (!force && currentAllowedPages.length && !currentAllowedPages.includes(key)) { showStatus(LANG[currentLang].noTabs); return; }
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      // FIX: dynamic now opens inside the same iframe tab, not external page
      $('appFrame').src = pageMeta[key].file;
      setTimeout(() => { const frame = $('appFrame'); if (frame && frame.contentWindow) frame.contentWindow.postMessage({ type:'LANG_CHANGE', lang: currentLang }, '*'); }, 150);
    }
    window.loadPage = loadPage;

    function logout(){ auth.signOut().then(function(){ window.location.href = 'login.html'; }); }
    window.logout = logout;
    $('logoutBtn').addEventListener('click', logout);
    $('btnLangAr').addEventListener('click', async function(){ setLang('ar'); await persistUserLang('ar'); });
    $('btnLangEn').addEventListener('click', async function(){ setLang('en'); await persistUserLang('en'); });
    setLang(currentLang, false);

    auth.onAuthStateChanged(async function(user){
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      try {
        let profile = null;
        const snap = await db.collection('app_users').doc(user.uid).get();
        if (snap.exists) profile = snap.data() || {};
        if (!profile && user.email) {
          const alt = await db.collection('app_users').where('email', '==', user.email).limit(1).get();
          if (!alt.empty) profile = alt.docs[0].data() || {};
        }
        currentUserProfile = profile || { role:'user' };
        $('userName').textContent = (currentUserProfile && currentUserProfile.name) || user.email || 'User';
        $('userAvatar').src = (currentUserProfile && (currentUserProfile.photoURL || currentUserProfile.avatar)) || 'user-avatar.png';
        const preferredLang = (currentUserProfile && currentUserProfile.lang) || localStorage.getItem('appLang') || 'ar';
        setLang(preferredLang, false);
        applyPagePermissions(currentUserProfile);
      } catch (e) {
        console.error('User profile load error:', e);
        $('userName').textContent = user.email || 'User';
        currentUserProfile = { role:'user' };
        applyPagePermissions(currentUserProfile);
      }
    });
  </script>
</body>
</html>
