<!DOCTYPE html>
<html lang="ar" dir <meta charset="UTF-8"><html lang="ar" dir="rtl">
  <title>إدارة زيارات الفروع والفنيين</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(240,245,250,.95), rgba(240,245,250,.95)),
        url('image_dba186.png') center/cover no-repeat fixed;
    }

    header{
      background:#0d4b73;
      color:#fff;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .header-left img.logo{
      height:40px;
      flex:0 0 auto;
    }

    .title-wrap{
      min-width:0;
    }

    .app-title{
      font-weight:bold;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .app-version{
      font-size:11px;
      color:#d0d0d0;
      margin-top:2px;
    }

    .header-right{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .user-info{
      display:flex;
      align-items:center;
      gap:8px;
      background:rgba(255,255,255,.15);
      padding:4px 10px;
      border-radius:20px;
    }

    .user-info img{
      width:32px;
      height:32px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid rgba(255,255,255,.6);
      background:#fff;
    }

    .user-name{
      font-size:13px;
      white-space:nowrap;
      max-width:220px;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .logout-btn{
      background:#d64545;
      color:#fff;
      border:none;
      border-radius:20px;
      padding:6px 14px;
      cursor:pointer;
      font-size:13px;
    }

    nav{
      background:#083c5a;
      display:flex;
      flex-wrap:wrap;
    }

    nav button{
      background:none;
      border:none;
      color:#fff;
      padding:10px 14px;
      cursor:pointer;
      font-size:13px;
    }

    nav button.active{
      background:#0d4b73;
      border-bottom:3px solid #ffd54f;
    }

    #content{
      height:calc(100vh - 110px);
    }

    #content iframe{
      width:100%;
      height:100%;
      border:none;
      background:#fff;
    }

    @media (max-width: 768px){
      header{
        flex-direction:column;
        align-items:stretch;
      }

      .header-right{
        justify-content:space-between;
      }

      .user-name{
        max-width:140px;
      }
    }
  </style>
</head>
<body>

  <!-- ✅ Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- ✅ Firebase Init + Auth Guard -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
      authDomain: "baghethan-ba325.firebaseapp.com",
      projectId: "baghethan-ba325",
      storageBucket: "baghethan-ba325.firebasestorage.app",
      messagingSenderId: "944819735112",
      appId: "1:944819735112:web:07315600da39377320667d"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    /* ✅ تعريض Firebase للصفحات الداخلية داخل iframe */
    window.firebase = firebase;
    window.appAuth = auth;
    window.appDb = db;

    auth.onAuthStateChanged(async function(user){
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {
        const snap = await db.collection("app_users").doc(user.uid).get();
        if (snap.exists) {
          const data = snap.data() || {};
          const name = data.name || user.email || "User";
          const avatar = data.photoURL || data.avatar || "user-avatar.png";

          const userNameEl = document.getElementById("userName");
          const userAvatarEl = document.getElementById("userAvatar");

          if (userNameEl) userNameEl.textContent = name;
          if (userAvatarEl) userAvatarEl.src = avatar;
        } else {
          const userNameEl = document.getElementById("userName");
          if (userNameEl) userNameEl.textContent = user.email || "User";
        }
      } catch (e) {
        console.error("User profile load error:", e);
      }
    });

    function logout(){
      auth.signOut().then(function(){
        window.location.href = "login.html";
      });
    }
  </script>

  <header>
    <div class="header-left">
      <img class="logo" src="LOGO-almajdouie.png" alt="Almajdouie Logo">
      <div class="title-wrap">
        <div class="app-title">إدارة زيارات الفروع والفنيين</div>
        <div class="app-version">Shell v1.6 • 2026‑04‑20 20:42</div>
      </div>
    </div>

    <div class="header-right">
      <div class="user-info">
        <img id="userAvatar" src="user-avatar.png" alt="User Avatar">
        <div class="user-name" id="userName">...</div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <nav>
    <button class="active" onclick="loadPage('dashboard', this)">Dashboard</button>
    <button onclick="loadPage('checklist', this)">Check‑List</button>
    <button onclick="loadPage('dynamic', this)">Dynamic Check‑List (Admin)</button>
    <button onclick="loadPage('visits', this)">إدخال زيارة</button>
    <button onclick="loadPage('branches', this)">إدارة الفروع</button>
    <button onclick="loadPage('technicians', this)">إدارة الفنيين</button>
    <button onclick="loadPage('brands', this)">البراندات</button>
    <button onclick="loadPage('upgrade', this)">Upgrade Windows</button>
    <button onclick="loadPage('permissions', this)">الصلاحيات</button>
  </nav>

  <div id="content">
    <iframe id="appFrame" src="dashboard.html"></iframe>
  </div>

  <script>
    const pages = {
      dashboard: "dashboard.html",
      checklist: "check-list.html",
      dynamic: "dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html",
      visits: "visits.html",
      branches: "branches.html",
      technicians: "technicians.html",
      brands: "brands.html",
      upgrade: "upgrade-windows.html",
      permissions: "permissions.html"
    };

    function loadPage(key, btn){
      if (!pages[key]) {
        alert("Page not mapped: " + key);
        return;
      }

      document.querySelectorAll("nav button").forEach(function(b){
        b.classList.remove("active");
      });

      if (btn) {
        btn.classList.add("active");
      }

      /* ✅ مؤقتًا نخلي Dynamic خارج iframe حتى يتم تنظيفها */
      if (key === "dynamic") {
        window.location.href = pages[key];
        return;
      }

      document.getElementById("appFrame").src = pages[key];
    }
  </script>

</body>
</html>
