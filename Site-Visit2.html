<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Branch Visits System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(240,245,250,.95), rgba(240,245,250,.95)),
        url('image_dba186.png') center/cover no-repeat fixed;
    }
    header{
      background:#0d4b73;
      color:#fff;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .header-left{display:flex;align-items:center;gap:14px}
    .header-left img{height:40px}
    .app-title{font-weight:bold}
    .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .lang-switch button{
      background:#fff;color:#0d4b73;border:none;border-radius:16px;
      padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer
    }
    .lang-switch button.active{background:#ffd54f}
    .logout-btn{
      background:#d64545;color:#fff;border:none;border-radius:16px;
      padding:6px 14px;cursor:pointer
    }
    nav{
      background:#083c5a;
      display:flex;
      flex-wrap:wrap;
      min-height:44px;
    }
    nav button{
      background:none;
      border:none;
      color:#fff;
      padding:10px 14px;
      cursor:pointer;
      font-size:13px;
      display:inline-block;
    }
    nav button.active{
      background:#0d4b73;
      border-bottom:3px solid #ffd54f;
    }
    nav button.hidden{display:none!important}
    #content{height:calc(100vh - 110px)}
    iframe{width:100%;height:100%;border:none;background:#fff}
  </style>
</head>

<body>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<header>
  <div class="header-left">
    <img src="LOGO-almajdouie.png" alt="Logo">
    <div class="app-title" id="shellTitle">Branch Visits System</div>
  </div>
  <div class="header-right">
    <div class="lang-switch">
      <button id="btnAr">AR</button>
      <button id="btnEn">EN</button>
    </div>
    <div id="userName">...</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<nav id="mainNav">
  <button data-page="dashboard" onclick="loadPage('dashboard',this)"></button>
  <button data-page="checklist" onclick="loadPage('checklist',this)"></button>
  <button data-page="dynamic" onclick="loadPage('dynamic',this)"></button>
  <button data-page="visits" onclick="loadPage('visits',this)"></button>
  <button data-page="branches" onclick="loadPage('branches',this)"></button>
  <button data-page="technicians" onclick="loadPage('technicians',this)"></button>
  <button data-page="brands" onclick="loadPage('brands',this)"></button>
  <button data-page="upgrade" onclick="loadPage('upgrade',this)"></button>
  <button data-page="permissions" onclick="loadPage('permissions',this)"></button>
</nav>

<div id="content">
  <iframe id="appFrame"></iframe>
</div>

<script>
/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain: "baghethan-ba325.firebaseapp.com",
  projectId: "baghethan-ba325"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
window.appAuth = auth;
window.appDb = db;
window.firebase = firebase;

/* ================= Pages ================= */
const PAGES = {
  dashboard:  {file:'dashboard.html',  ar:'لوحة التحكم', en:'Dashboard'},
  checklist:  {file:'check-list.html', ar:'Check‑List',   en:'Check‑List'},
  dynamic:    {file:'dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html', ar:'Dynamic Check‑List', en:'Dynamic Check‑List'},
  visits:     {file:'visits.html',     ar:'Visits',       en:'Visits'},
  branches:   {file:'branches.html',   ar:'Branches',     en:'Branches'},
  technicians:{file:'technicians.html',ar:'Technicians', en:'Technicians'},
  brands:     {file:'brands.html',     ar:'Brands',       en:'Brands'},
  upgrade:    {file:'upgrade-windows.html', ar:'Upgrade Windows', en:'Upgrade Windows'},
  permissions:{file:'permissions.html',ar:'Permissions', en:'Permissions'}
};

/* ================= Language ================= */
let currentLang = localStorage.getItem('appLang') || 'ar';
function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('appLang', lang);
  btnAr.classList.toggle('active', lang==='ar');
  btnEn.classList.toggle('active', lang==='en');
  document.querySelectorAll('nav button[data-page]').forEach(b=>{
    b.textContent = PAGES[b.dataset.page][lang];
  });
  appFrame.contentWindow?.postMessage({type:'LANG_CHANGE',lang},'*');
}
btnAr.onclick=()=>setLang('ar');
btnEn.onclick=()=>setLang('en');

/* ================= ✅ THIS IS THE FIX ================= */
/* إذا pages موجودة → نستخدمها فقط */
function getAllowedPages(profile){
  if (Array.isArray(profile.pages) && profile.pages.length){
    return profile.pages.map(p=>p.toLowerCase());
  }
  const role = (profile.role||'user').toLowerCase();
  const ROLE_DEFAULTS = {
    admin: Object.keys(PAGES),
    supervisor:['dashboard','checklist','dynamic','visits'],
    technician:['dashboard','checklist'],
    user:['dashboard']
  };
  return ROLE_DEFAULTS[role] || ['dashboard'];
}

/* ================= Navigation ================= */
function loadPage(key, btn){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn?.classList.add('active');
  appFrame.src = PAGES[key].file;
}

/* ================= Auth ================= */
auth.onAuthStateChanged(async user=>{
  if(!user){ location.href='login.html'; return; }
  const snap = await db.collection('app_users').doc(user.uid).get();
  const profile = snap.exists ? snap.data() : {role:'user'};
  userName.textContent = profile.name || user.email;

  const allowed = getAllowedPages(profile);

  document.querySelectorAll('nav button[data-page]').forEach(btn=>{
    btn.classList.toggle('hidden', !allowed.includes(btn.dataset.page));
  });

  setLang(currentLang);
  loadPage(allowed[0], document.querySelector(`nav button[data-page="${allowed[0]}"]`));
});

function logout(){
  auth.signOut().then(()=>location.href='login.html');
}
</script>

</body>
</html>
