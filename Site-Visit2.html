<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة الزيارات | Almajdouie Motors v2.9.9</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root { --primary: #0d4b73; --accent: #ffd54f; --bg: #f4f7f9; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--primary); color: #fff; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .logo { height: 42px; filter: brightness(0) invert(1); }
    .user-box { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 25px; }
    .user-name { font-size: 14px; font-weight: 700; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); }
    .lang-btn { background: #fff; color: var(--primary); border: none; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 11px; }
    .lang-btn.active { background: var(--accent); color: #000; }
    nav { background: #083c5a; display: flex; padding: 0 15px; overflow-x: auto; scrollbar-width: none; }
    nav button { background: none; border: none; color: #cbd5e1; padding: 12px 18px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; transition: 0.2s; }
    nav button.active { color: var(--accent); border-bottom: 3px solid var(--accent); background: rgba(255,255,255,0.05); }
    nav button.hidden { display: none !important; }
    main { flex: 1; position: relative; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; }
    .update-footer { background: #fff; border-top: 1px solid #e2e8f0; padding: 5px 25px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #64748b; font-weight: 600; }
    .status-dot { height: 8px; width: 8px; background: #10b981; border-radius: 50%; display: inline-block; margin-left: 5px; }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <img src="https://www.almajdouie.com/assets/images/logo.png" class="logo" alt="Logo">
    <div style="font-weight: 800; font-size: 16px;" id="shellTitle">نظام إدارة الزيارات الميدانية</div>
  </div>
  <div style="display: flex; align-items: center; gap: 15px;">
    <div class="lang-switch">
      <button class="lang-btn" id="btnAr" onclick="setLang('ar')">AR</button>
      <button class="lang-btn" id="btnEn" onclick="setLang('en')">EN</button>
    </div>
    <div class="user-box">
      <span class="user-name" id="userName">Loading...</span>
      <img id="userAvatar" class="user-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    </div>
    <button onclick="logout()" style="background:#ef4444; color:#fff; border:none; padding:5px 15px; border-radius:15px; cursor:pointer; font-weight:bold; font-size:12px;">خروج</button>
  </div>
</header>
<nav id="mainNav">
  <button data-page="dashboard" onclick="loadPage('dashboard', this)">لوحة البيانات</button>
  <button data-page="checklist" onclick="loadPage('checklist', this)">Check-List</button>
  <button data-page="dynamicChecklistAdmin" onclick="loadPage('dynamicChecklistAdmin', this)">النماذج الديناميكية</button>
  <button data-page="visit" onclick="loadPage('visit', this)">الزيارات</button>
  <button data-page="branches" onclick="loadPage('branches', this)">الفروع</button>
  <button data-page="technicians" onclick="loadPage('technicians', this)">الفنيين</button>
  <button data-page="brands" onclick="loadPage('brands', this)">البراندات</button>
  <button data-page="upgradeWindows" onclick="loadPage('upgradeWindows', this)">Upgrade Windows</button>
  <button data-page="permissions" onclick="loadPage('permissions', this)">الصلاحيات</button>
</nav>
<main><iframe id="appFrame" name="appFrame"></iframe></main>
<footer class="update-footer">
  <div><span class="status-dot"></span>إصدار النظام: <b style="color:var(--primary)">v2.9.9 Master Turbo</b> | تحديث: <b>2026-04-26</b></div>
  <div>متصل حي ✅ | الوقت: <b id="liveClock" style="color:var(--primary)">00:00:00</b></div>
</footer>
<script>
  const firebaseConfig = { apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs", authDomain: "baghethan-ba325.firebaseapp.com", projectId: "baghethan-ba325", storageBucket: "baghethan-ba325.firebasestorage.app", messagingSenderId: "944819735112", appId: "1:944819735112:web:07315600da39377320667d" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth(), db = firebase.firestore();
  db.settings({ cacheSizeBytes: 1048576 });
  db.enablePersistence().catch(()=>{});
  window.appAuth = auth; window.appDb = db; window.firebase = firebase;

  const PAGES = {
    dashboard: { file:'dashboard.html', ar:'لوحة البيانات', en:'Dashboard' },
    checklist: { file:'check-list.html', ar:'Check‑List', en:'Check‑List' },
    dynamicChecklistAdmin: { file:'dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html', ar:'النماذج الديناميكية', en:'Dynamic Forms' },
    visit: { file:'visits.html', ar:'الزيارات', en:'Visits' },
    branches: { file:'branches.html', ar:'إدارة الفروع', en:'Branches' },
    technicians: { file:'technicians.html', ar:'إدارة الفنيين', en:'Technicians' },
    brands: { file:'brands.html', ar:'البراندات', en:'Brands' },
    upgradeWindows: { file:'upgrade-windows.html', ar:'ترقية Windows', en:'Windows Upgrade' },
    permissions: { file:'permissions.html', ar:'الصلاحيات', en:'Permissions' }
  };

  const $ = id => document.getElementById(id);
  let currentLang = localStorage.getItem('appLang') || 'ar';

  function setLang(lang) {
    currentLang = lang; localStorage.setItem('appLang', lang);
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('btnAr').classList.toggle('active', lang === 'ar');
    $('btnEn').classList.toggle('active', lang === 'en');
    $('shellTitle').textContent = lang === 'ar' ? 'نظام إدارة الزيارات الميدانية' : 'Branch Visits Management';
    document.querySelectorAll('nav button[data-page]').forEach(btn => { btn.textContent = PAGES[btn.dataset.page][lang]; });
    const frame = $('appFrame');
    if (frame && frame.contentWindow) frame.contentWindow.postMessage({ type: 'LANG_CHANGE', lang: lang }, '*');
  }

  function loadPage(key, btn) {
    if (!PAGES[key]) return;
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    $('appFrame').src = PAGES[key].file;
  }

  setInterval(() => { $('liveClock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);

  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'login.html'; return; }
    try {
      const snap = await db.collection('app_users').doc(user.uid).get();
      if (!snap.exists) {
        alert("لا توجد صلاحيات لهذا المستخدم");
        auth.signOut();
        return;
      }
      const profile = snap.data();
      if (profile.active !== true) {
        alert("الحساب غير مفعّل");
        auth.signOut();
        return;
      }
      $('userName').textContent = profile.name || user.email;
      if (profile.photoURL) $('userAvatar').src = profile.photoURL;
      const allowed = profile.pages || ['dashboard'];
      document.querySelectorAll('nav button[data-page]').forEach(btn => { btn.classList.toggle('hidden', !allowed.includes(btn.dataset.page)); });
      setLang(currentLang);
      const first = allowed.includes('dashboard') ? 'dashboard' : allowed[0];
      if (first) {
        loadPage(first, document.querySelector(`button[data-page="${first}"]`));
      }
    } catch (err) { console.error(err); }
  });

  window.logout = () => auth.signOut().then(() => location.href = 'login.html');
</script>
</body>
</html>
