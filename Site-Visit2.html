<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة زيارات المجدوعي | Shell v2.9.5</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root { --primary: #0d4b73; --bg: #f8fafc; --nav-text: #64748b; --success: #10b981; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--primary); color: #fff; padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .logo { height: 40px; filter: brightness(0) invert(1); }
    .user-area { display: flex; align-items: center; gap: 15px; font-size: 13px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; }
    nav { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 15px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    nav button { background: none; border: none; padding: 12px 18px; font-size: 13px; cursor: pointer; color: var(--nav-text); border-bottom: 3px solid transparent; transition: 0.2s; white-space: nowrap; font-weight: 500; }
    nav button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }
    .hidden { display: none !important; }
    main { flex-grow: 1; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }
    .update-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #e2e8f0; padding: 4px 20px; display: flex; justify-content: space-between; font-size: 10.5px; z-index: 9999; }
    .status-dot { height: 7px; width: 7px; background: var(--success); border-radius: 50%; display: inline-block; margin-left: 5px; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="https://www.almajdouie.com/assets/images/logo.png" class="logo" alt="Logo">
    <div id="shellTitle" style="font-weight: bold; font-size: 14px;">نظام إدارة الزيارات الميدانية</div>
  </div>
  <div class="user-area">
    <span id="userName">...</span>
    <img id="userAvatar" class="user-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
    <button onclick="logout()" style="background: #ef4444; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer;">خروج</button>
  </div>
</header>

<nav id="mainNav">
  <button data-page="dashboard" onclick="loadPage('dashboard', this)">لوحة البيانات</button>
  <button data-page="checklist" onclick="loadPage('checklist', this)">Check-List</button>
  <button data-page="dynamicChecklistAdmin" onclick="loadPage('dynamicChecklistAdmin', this)">النماذج الديناميكية</button>
  <button data-page="visit" onclick="loadPage('visit', this)">الزيارات</button>
  <button data-page="branches" onclick="loadPage('branches', this)">الفروع</button>
  <button data-page="technicians" onclick="loadPage('technicians', this)">الفنيين</button>
  <button data-page="brands" onclick="loadPage('brands', this)">البراندات</button>
  <button data-page="upgradeWindows" onclick="loadPage('upgradeWindows', this)">Windows Upgrade</button>
  <button data-page="permissions" onclick="loadPage('permissions', this)">الصلاحيات</button>
</nav>

<main><iframe id="appFrame" name="appFrame" src=""></iframe></main>

<div class="update-footer">
  <div><span class="status-dot"></span>إصدار النظام: <b>v2.9.5 Master Turbo</b> | التحديث: <b>2026-04-26</b></div>
  <div><span id="connStatus" style="color: var(--success);">متصل حي ✅</span> | الوقت: <b id="currentTime">--:--:--</b></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
    authDomain: "baghethan-ba325.firebaseapp.com",
    projectId: "baghethan-ba325",
    storageBucket: "baghethan-ba325.firebasestorage.app",
    messagingSenderId: "944819735112",
    appId: "1:944819735112:web:07315600da39377320667d"
  };

  // تهيئة المحرك لمرة واحدة فقط
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // تنظيف الإعدادات لمنع البطء
  db.settings({ cacheSizeBytes: 1048576, experimentalForceLongPolling: true });
  db.enablePersistence().catch(() => {});

  // ✅ تصدير المحرك لكل الصفحات الفرعية
  window.appAuth = auth;
  window.appDb = db;
  window.firebase = firebase;

  const PAGES = {
    dashboard: { file: 'dashboard.html' },
    checklist: { file: 'check-list.html' },
    dynamicChecklistAdmin: { file: 'dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html' },
    visit: { file: 'visits.html' },
    branches: { file: 'branches.html' },
    technicians: { file: 'technicians.html' },
    brands: { file: 'brands.html' },
    upgradeWindows: { file: 'upgrade-windows.html' },
    permissions: { file: 'permissions.html' }
  };

  function loadPage(key, btn) {
    if (!PAGES[key]) return;
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('appFrame').src = PAGES[key].file;
  }

  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'login.html'; return; }
    try {
      const snap = await db.collection('app_users').doc(user.uid).get();
      const profile = snap.exists ? snap.data() : { pages: ['dashboard', 'checklist'] };
      document.getElementById('userName').textContent = profile.name || user.email;
      
      const allowed = profile.pages || [];
      document.querySelectorAll('nav button[data-page]').forEach(btn => {
        btn.classList.toggle('hidden', !allowed.includes(btn.dataset.page));
      });

      const first = allowed.includes('dashboard') ? 'dashboard' : allowed[0];
      loadPage(first, document.querySelector(`button[data-page="${first}"]`));
    } catch (err) { console.error(err); }
  });

  setInterval(() => { document.getElementById('currentTime').textContent = new Date().toLocaleTimeString('en-US'); }, 1000);
  window.logout = () => auth.signOut().then(() => location.href = 'login.html');
</script>
</body>
</html>
