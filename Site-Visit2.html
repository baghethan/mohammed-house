<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Branch Visits System</title>
  <style>
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      background:
        linear-gradient(rgba(240,245,250,.95), rgba(240,245,250,.95)),
        url('image_dba186.png') center/cover no-repeat fixed;
    }
    header{
      background:#0d4b73;
      color:#fff;
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .header-left{display:flex;align-items:center;gap:14px;min-width:0}
    .header-left img{height:40px;flex:0 0 auto}
    .title-wrap{min-width:0}
    .app-title{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .app-version{font-size:11px;color:#d0d0d0;margin-top:2px}
    .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .lang-switch{display:flex;gap:6px;align-items:center}
    .lang-switch button{
      background:#fff;color:#0d4b73;border:none;border-radius:16px;
      padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer
    }
    .lang-switch button.active{background:#ffd54f;color:#083c5a}
    .user-info{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px}
    .user-info img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.6);background:#fff}
    .user-name{font-size:13px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
    .logout-btn{background:#d64545;color:#fff;border:none;border-radius:16px;padding:6px 14px;cursor:pointer}
    nav{background:#083c5a;display:flex;flex-wrap:wrap;min-height:44px}
    nav button{
      background:none;border:none;color:#fff;padding:10px 14px;cursor:pointer;font-size:13px;display:inline-block
    }
    nav button.active{background:#0d4b73;border-bottom:3px solid #ffd54f}
    nav button.hidden{display:none !important}
    #content{height:calc(100vh - 110px)}
    #appFrame{width:100%;height:100%;border:none;background:#fff}
    .status-bar{background:#fff7e6;color:#8a5a00;border-top:1px solid #f5d08a;border-bottom:1px solid #f5d08a;padding:8px 14px;font-size:13px;display:none}
    .status-bar.show{display:block}
    @media (max-width:768px){
      header{flex-direction:column;align-items:stretch}
      .header-right{justify-content:space-between}
      .user-name{max-width:140px}
    }
  </style>
</head>
<body>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <header>
    <div class="header-left">
      <img src="LOGO-almajdouie.png" alt="Almajdouie Logo" />
      <div class="title-wrap">
        <div class="app-title" id="shellTitle">Branch Visits System</div>
        <div class="app-version" id="shellVersion">Shell v2.1 • 2026-04-20</div>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-switch">
        <button id="btnAr" type="button">AR</button>
        <button id="btnEn" type="button">EN</button>
      </div>
      <div class="user-info">
        <img id="userAvatar" src="user-avatar.png" alt="User Avatar" />
        <div id="userName" class="user-name">...</div>
      </div>
      <button class="logout-btn" id="logoutBtn" type="button">Logout</button>
    </div>
  </header>

  <div id="statusBar" class="status-bar"></div>

  <nav id="mainNav">
    <button data-page="dashboard" onclick="loadPage('dashboard', this)"></button>
    <button data-page="checklist" onclick="loadPage('checklist', this)"></button>
    <button data-page="dynamic" onclick="loadPage('dynamic', this)"></button>
    <button data-page="visits" onclick="loadPage('visits', this)"></button>
    <button data-page="branches" onclick="loadPage('branches', this)"></button>
    <button data-page="technicians" onclick="loadPage('technicians', this)"></button>
    <button data-page="brands" onclick="loadPage('brands', this)"></button>
    <button data-page="upgrade" onclick="loadPage('upgrade', this)"></button>
    <button data-page="permissions" onclick="loadPage('permissions', this)"></button>
  </nav>

  <div id="content">
    <iframe id="appFrame"></iframe>
  </div>

  <script>
    // كود التهيئة السريع والموحد (V2.7 Turbo)
const firebaseConfig = {
  apiKey: "AIzaSyBsvbEEHEgBuw9pDml-Om90mm8MLDw8gWs",
  authDomain: "baghethan-ba325.firebaseapp.com",
  projectId: "baghethan-ba325",
  storageBucket: "baghethan-ba325.firebasestorage.app",
  messagingSenderId: "944819735112",
  appId: "1:944819735112:web:07315600da39377320667d"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// القضاء على تأخير الـ 10 ثوانٍ
// حذفنا أي إعدادات للهوست أو البورت القديم
db.settings({
  cacheSizeBytes: 1048576, // 1MB كاش سريع جداً للبحث
  experimentalForceLongPolling: true 
});

// تفعيل الكاش المحلي ليعمل النظام "أوفلاين" وبسرعة البرق
db.enablePersistence().catch(err => console.error("Persistence failed", err));

window.appAuth = auth;
window.appDb = db;
window.firebase = firebase;

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    window.appAuth = auth;
    window.appDb = db;
    window.firebase = firebase;

    const PAGES = {
      dashboard:  {file:'dashboard.html',  ar:'لوحة التحكم', en:'Dashboard'},
      checklist:  {file:'check-list.html', ar:'Check‑List', en:'Check‑List'},
      dynamic:    {file:'dynamic-checklist-admin-advanced-logic-v2.1.6-fixed.html', ar:'Dynamic Check‑List', en:'Dynamic Check‑List'},
      visits:     {file:'visits.html', ar:'الزيارات', en:'Visits'},
      branches:   {file:'branches.html', ar:'إدارة الفروع', en:'Branches'},
      technicians:{file:'technicians.html', ar:'إدارة الفنيين', en:'Technicians'},
      brands:     {file:'brands.html', ar:'البراندات', en:'Brands'},
      upgrade:    {file:'upgrade-windows.html', ar:'Upgrade Windows', en:'Upgrade Windows'},
      permissions:{file:'permissions.html', ar:'الصلاحيات', en:'Permissions'}
    };

    const ROLE_DEFAULTS = {
      admin: Object.keys(PAGES),
      supervisor: ['dashboard','checklist','dynamic','visits','branches','technicians','brands','upgrade','permissions'],
      technician: ['dashboard','checklist'],
      user: ['dashboard']
    };

    const TEXT = {
      ar: {
        shellTitle:'إدارة زيارات الفروع والفنيين',
        logout:'Logout',
        noTabs:'لا توجد تبويبات مصرح بها لهذا المستخدم.'
      },
      en: {
        shellTitle:'Branch Visits System',
        logout:'Logout',
        noTabs:'No tabs are allowed for this user.'
      }
    };

    let currentLang = localStorage.getItem('appLang') || 'ar';
    let currentAllowedPages = [];
    let currentUser = null;

    const $ = id => document.getElementById(id);

    function showStatus(msg){
      const bar = $('statusBar');
      bar.textContent = msg || '';
      bar.classList.toggle('show', !!msg);
    }

    function normalizePageKey(value){
      const v = String(value || '').trim().toLowerCase();
      const aliases = {
        'dashboard':'dashboard',
        'checklist':'checklist',
        'check-list':'checklist',
        'dynamic':'dynamic',
        'dynamicchecklistadmin':'dynamic',
        'dynamic-checklist-admin':'dynamic',
        'visit':'visits',
        'visits':'visits',
        'branches':'branches',
        'technicians':'technicians',
        'brands':'brands',
        'permissions':'permissions',
        'upgrade':'upgrade',
        'upgradewindows':'upgrade',
        'upgrade-windows':'upgrade',
        'upgrade_windows':'upgrade'
      };
      return aliases[v] || v;
    }

    function setLang(lang){
      currentLang = (lang === 'en') ? 'en' : 'ar';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      localStorage.setItem('appLang', currentLang);

      $('shellTitle').textContent = TEXT[currentLang].shellTitle;
      $('logoutBtn').textContent = TEXT[currentLang].logout;
      $('btnAr').classList.toggle('active', currentLang === 'ar');
      $('btnEn').classList.toggle('active', currentLang === 'en');

      document.querySelectorAll('nav button[data-page]').forEach(btn => {
        const pageKey = btn.dataset.page;
        btn.textContent = PAGES[pageKey][currentLang];
      });

      const frame = $('appFrame');
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type:'LANG_CHANGE', lang: currentLang }, '*');
      }
    }

    async function persistUserLang(lang){
      try {
        if (!currentUser) return;
        const byUid = await db.collection('app_users').doc(currentUser.uid).get();
        if (byUid.exists) {
          await db.collection('app_users').doc(currentUser.uid).set({ lang: lang }, { merge:true });
          return;
        }
        if (currentUser.email) {
          const alt = await db.collection('app_users').where('email', '==', currentUser.email).limit(1).get();
          if (!alt.empty) await alt.docs[0].ref.set({ lang: lang }, { merge:true });
        }
      } catch (e) {
        console.warn('Unable to persist language:', e);
      }
    }

    $('btnAr').addEventListener('click', async () => { setLang('ar'); await persistUserLang('ar'); });
    $('btnEn').addEventListener('click', async () => { setLang('en'); await persistUserLang('en'); });

    function getAllowedPages(profile){
      // ✅ إذا pages اليدوية موجودة نستخدمها فقط — بدون دمج مع الدور
      if (Array.isArray(profile?.pages) && profile.pages.length) {
        return Array.from(new Set(
          profile.pages.map(normalizePageKey).filter(key => PAGES[key])
        ));
      }

      // ✅ إذا لم يوجد pages لكن shellPages موجودة نستخدمها
      if (Array.isArray(profile?.shellPages) && profile.shellPages.length) {
        return Array.from(new Set(
          profile.shellPages.map(normalizePageKey).filter(key => PAGES[key])
        ));
      }

      // ✅ فقط إذا لا يوجد أي تخصيص نرجع للدور
      const role = String(profile?.role || 'user').toLowerCase();
      return (ROLE_DEFAULTS[role] || ROLE_DEFAULTS.user || ['dashboard'])
        .filter(key => PAGES[key]);
    }

    function applyVisibleTabs(allowed){
      document.querySelectorAll('nav button[data-page]').forEach(btn => {
        btn.classList.toggle('hidden', !allowed.includes(btn.dataset.page));
      });
    }

    function loadPage(key, btn){
      if (!PAGES[key]) return;
      if (currentAllowedPages.length && !currentAllowedPages.includes(key)) return;
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      $('appFrame').src = PAGES[key].file;
      setTimeout(() => {
        const frame = $('appFrame');
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({ type:'LANG_CHANGE', lang: currentLang }, '*');
        }
      }, 150);
    }
    window.loadPage = loadPage;

    function logout(){
      auth.signOut().then(() => location.href = 'login.html');
    }
    window.logout = logout;
    $('logoutBtn').addEventListener('click', logout);

    setLang(currentLang);

    auth.onAuthStateChanged(async user => {
      if (!user) {
        location.href = 'login.html';
        return;
      }
      currentUser = user;
      try {
        let profile = null;
        const byUid = await db.collection('app_users').doc(user.uid).get();
        if (byUid.exists) profile = byUid.data() || {};
        if (!profile && user.email) {
          const alt = await db.collection('app_users').where('email', '==', user.email).limit(1).get();
          if (!alt.empty) profile = alt.docs[0].data() || {};
        }
        profile = profile || { role:'user' };

        $('userName').textContent = profile.name || user.email || 'User';
        $('userAvatar').src = (profile.photoURL || profile.avatar || 'user-avatar.png');

        const preferredLang = profile.lang || localStorage.getItem('appLang') || 'ar';
        setLang(preferredLang);

        currentAllowedPages = getAllowedPages(profile);
        applyVisibleTabs(currentAllowedPages);

        if (!currentAllowedPages.length) {
          showStatus(TEXT[currentLang].noTabs);
          $('appFrame').src = '';
          return;
        }
        showStatus('');

        // ✅ افتح Check‑List إذا كانت من الصفحات المسموحة، وإلا أول صفحة فقط
        const defaultPage = currentAllowedPages.includes('checklist') ? 'checklist' : currentAllowedPages[0];
        const defaultBtn = document.querySelector('nav button[data-page="' + defaultPage + '"]');
        loadPage(defaultPage, defaultBtn);
      } catch (err) {
        console.error(err);
        $('userName').textContent = user.email || 'User';
        currentAllowedPages = ['dashboard'];
        applyVisibleTabs(currentAllowedPages);
        const defaultBtn = document.querySelector('nav button[data-page="dashboard"]');
        loadPage('dashboard', defaultBtn);
      }
    });
  </script>
</body>
</html>
